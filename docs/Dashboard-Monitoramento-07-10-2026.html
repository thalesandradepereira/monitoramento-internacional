itionvelo.com/velo-et-societe/velos-a-hydrogene-un-nouvel-echec-predit-il-la-mort-de-cette-technologie-prometteuse/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Cientistas que depositam fé na tecnologia são menos propensos a agir contra mudanças climáticas","resumo":"Uma nova pesquisa revela que indivíduos que confiam excessivamente em soluções tecnológicas futuras tendem a negligenciar ações climáticas imediatas. Esse fenômeno levanta debates importantes sobre a complacência gerada por inovações e a necessidade de engajamento prático. Especialistas alertam que a tecnologia deve complementar, e não substituir, as mudanças de comportamento urgentes para preservar o meio ambiente global.","link":"https://www.theguardian.com/environment/2026/oct/07/scientists-technology-less-likely-climate-crisis-action","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"El Español","pais":"Espanha","titulo":"A tecnologia encurta distâncias para as PMEs da Espanha vazia","resumo":"Iniciativas tecnológicas recentes estão permitindo que pequenas e médias empresas localizadas em regiões espanhóis menos povoadas superem barreiras geográficas. A transformação digital facilita o acesso a mercados globais e melhora a competitividade desses negócios locais. O impacto principal é a revitalização econômica e a redução do isolamento comercial em zonas rurais do país.","link":"https://www.elespanol.com/enclave-ods/opinion/20261007/tecnologia-acorta-distancias-pymes-espana-vaciada/1003744408765_13.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Porsche Newsroom","pais":"Alemanha","titulo":"Novos carros esportivos, maior exclusividade e rentabilidade: Porsche apresenta nova estratégia até 2035","resumo":"A montadora alemã Porsche divulgou sua nova estratégia de longo prazo com foco na eletrificação e ampliação da margem de lucro.\nO plano visa posicionar a marca de luxo diante das profundas transformações que o mercado automotivo global atravessa.\nA iniciativa busca equilibrar a tradição de alta performance com a sustentabilidade e a demanda por veículos exclusivos.","link":"https://newsroom.porsche.com/en/2026/company/porsche-capital-markets-day-strategy-sportwagenschmiede-35-43419.html","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"Digital PR Platform","pais":"Japão","titulo":"Tecnologia de eletrônica de potência de próxima geração com otimização automática para alta eficiência e segurança será exibida na CEATEC 2026","resumo":"A Universidade Tecnológica de Shibaura se prepara para apresentar inovações avançadas em eletrônica de potência na CEATEC 2026. A tecnologia destaca sistemas de otimização automática voltados para garantir máxima eficiência energética e segurança operacional. O projeto reforça o compromisso das instituições acadêmicas japonesas com o desenvolvimento sustentável e industrial.","link":"https://digitalpr.jp/r/145372","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Hubbis","pais":"China","titulo":"Laura Lui, da Premia Partners, fala sobre a reavaliação de tecnologias duras na China e o 15º Plano Quinquenal","resumo":"A especialista discute como o governo chinês está redirecionando o foco para o setor de 'tecnologias duras' e inovação industrial profunda.\nEssa estratégia visa fortalecer a autonomia tecnológica do país diante de cenários globais desafiadores e impulsionar o próximo ciclo de crescimento.\nO alinhamento com o 15º Plano Quinquenal consolida o compromisso de longo prazo com a excelência científica e manufatura avançada.","link":"https://www.hubbis.com/article/premia-partners-laura-lui-on-china-s-hard-technology-revaluation-and-the-15th-five-year-plan","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Investing.com India","pais":"Índia","titulo":"VEON e Amdocs assinam acordo de operações tecnológicas de 10 anos","resumo":"As empresas VEON e Amdocs firmaram uma parceria estratégica de longo prazo voltada para a modernização das operações tecnológicas. O acordo visa acelerar a transformação digital e a eficiência operacional em mercados emergentes globais. A iniciativa destaca o avanço na gestão de infraestrutura baseada em software e automação avançada.","link":"https://in.investing.com/news/stock-market-news/veon-amdocs-sign-10year-technology-operations-agreement-93CH-5621398","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Link To Leaders","pais":"Portugal","titulo":"Tecnologia da Beta Friend gera centenas de novos percursos de escalada em 3D em segundos","resumo":"Uma inovação tecnológica recente consegue criar centenas de rotas de escalada em três dimensões de forma extremamente rápida. Essa ferramenta automatizada revoluciona o planejamento para atletas e entusiastas da modalidade. O impacto abrange tanto o treinamento esportivo quanto o desenvolvimento de novas experiências digitais ao ar livre.","link":"https://linktoleaders.com/tecnologia-da-beta-friend-gera-centenas-de-novos-percursos-de-escalada-em-3d-em-segundos/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Brasil Inovador","pais":"Brasil","titulo":"Internacionalização de software: programa prepara empresas brasileiras de tecnologia para expansão global","resumo":"Uma nova iniciativa foi lançada no país para capacitar desenvolvedores e negócios nacionais na exportação de softwares e serviços digitais. O programa oferece mentoria especializada sobre regulamentações internacionais, adaptação cultural e estratégias de entrada em mercados estrangeiros. A meta é elevar a competitividade do setor tecnológico brasileiro no cenário global.","link":"https://brasilinovador.com.br/internacionalizacao-de-software-programa-prepara-empresas-brasileiras-de-tecnologia-para-expansao-global/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"U.S. Medicine","pais":"Estados Unidos","titulo":"Ordem Executiva impulsiona atualizações tecnológicas no Departamento de Defesa e VA","resumo":"Uma nova diretriz governamental determina a modernização de sistemas tecnológicos em agências críticas dos Estados Unidos. O foco é aprimorar a infraestrutura digital e a segurança de dados no Departamento de Defesa e no Departamento de Assuntos de Veteranos. A medida visa garantir maior eficiência operacional e resiliência cibernética diante de desafios modernos.","link":"https://www.usmedicine.com/non-clinical-topics/electronic-health-records/executive-order-pushes-technology-updates-at-dod-va/","categoria":"GOVERNO","lang":"pt"},{"fonte":"L'Automobile Magazine","pais":"França","titulo":"Toyota aposta em tecnologia custosa para ônibus, apesar da concorrência dos elétricos","resumo":"A montadora japonesa Toyota mantém investimentos firmes em uma tecnologia de propulsão dispendiosa para o setor de ônibus. A estratégia desafia o domínio crescente e a forte concorrência dos veículos totalmente elétricos no mercado global. A decisão gera debates sobre eficiência econômica, sustentabilidade e os rumos da indústria de transporte coletivo.","link":"https://www.automobile-magazine.fr/utilitaires-news/article/53365-toyota-sentete-sur-une-technologie-couteuse-pour-les-bus-malgre-la-concurrence-de-lelectrique","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Pessoas cegas e com deficiência visual temem reação negativa contra óculos inteligentes","resumo":"O avanço dos óculos inteligentes tem gerado preocupação entre comunidades de deficientes visuais no Reino Unido. Usuários temem que o estigma associado a câmeras acopladas resulte em assédio e invasão de privacidade em espaços públicos. O debate evidencia o desafio de equilibrar a inovação tecnológica assistiva com a aceitação social e a segurança dos usuários.","link":"https://www.bbc.com/news/articles/cmx2qlz7ney2o","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Innovaspain","pais":"Espanha","titulo":"A espanhola IOT desenvolve Light-Form: uma tecnologia capaz de fabricar lentes oftálmicas em segundos","resumo":"Uma empresa da Espanha criou uma solução inovadora que promete revolucionar a produção de óculos através de um processo extremamente rápido. A tecnologia Light-Form consegue fabricar lentes oftálmicas customizadas em questão de segundos, otimizando custos e tempo de espera. Essa avanço tem o potencial de transformar a indústria óptica nacional e internacional.","link":"https://www.innovaspain.com/la-espanola-iot-desarrolla-light-form-una-tecnologia-capaz-de-fabricar-lentes-oftalmicas-en-segundos/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"LMU München","pais":"Alemanha","titulo":"Quando a música encontra a ciência quântica","resumo":"Um projeto inovador na Alemanha explora a interseção fascinante entre a física quântica e a composição musical.\nPesquisadores utilizam conceitos de mecânica quântica para gerar estruturas sonoras inéditas e expandir a criatividade artística.\nA iniciativa demonstra como a ciência moderna pode inspirar novas formas de expressão cultural e tecnológica.","link":"https://www.lmu.de/en/newsroom/calendar-of-events/event/music-meets-quantum-science-13de7b1b.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"伊藤忠商事株式会社","pais":"Japão","titulo":"Fortalecimento do sistema de suporte ao desenvolvimento de medicamentos por meio da aplicação de tecnologia de descoberta de drogas com IA","resumo":"Iniciativas estratégicas estão sendo implementadas para intensificar o suporte à criação de novos fármacos utilizando inteligência artificial. A integração de tecnologias avançadas visa acelerar processos de pesquisa e reduzir custos significativos no setor farmacêutico. Essa abordagem representa um marco na modernização da medicina de precisão e na resposta rápida a demandas de saúde.","link":"https://www.itochu.co.jp/ja/news/press/2026/261007.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"中国江苏网","pais":"China","titulo":"Perspectiva do boletim PISA 2025: crianças chinesas lideram em ciências e matemática globalmente, marcando divisão na era da IA","resumo":"Os resultados do PISA 2025 destacam o desempenho excepcional dos estudantes chineses nas áreas de ciências e matemática em nível mundial.\nEsse marco reforça a eficácia dos métodos educacionais do país, mas também acende debates sobre a adaptação pedagógica frente ao avanço da inteligência artificial.\nO cenário evidencia um momento crucial de transição onde a educação tradicional precisa se fundir com as novas demandas tecnológicas.","link":"https://jsnews.jschina.com.cn/jsyw/202610/t20261007_s6ac5ab8de4b086d2d5feed73.shtml","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"ANI News","pais":"Índia","titulo":"RBI alerta sobre valorizações elevadas de ativos de IA como riscos globais","resumo":"O Banco Central da Índia (RBI) apontou que as altas valorizações de ativos impulsionados por Inteligência Artificial representam riscos de baixa para a economia global. A avaliação reflete preocupações sobre possíveis bolhas financeiras no setor de tecnologia. O cenário exige maior monitoramento regulatório e cautela por parte dos investidores internacionais.","link":"https://www.aninews.in/news/business/rbi-flags-elevated-ai-related-asset-valuations-among-key-downside-risks-to-global-economy20261007111118","categoria":"ECONOMIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"OpenAI leva o ChatGPT aos registros clínicos da Epic","resumo":"A integração do ChatGPT nos sistemas de registros médicos da Epic representa um avanço significativo na área da saúde. A tecnologia auxilia profissionais médicos na sintetização de dados e na otimização de tarefas administrativas rotineiras. Essa implementação promete reduzir a burocracia hospitalar e agilizar o atendimento aos pacientes.","link":"https://sapo.pt/artigo/openai-leva-o-chatgpt-aos-registos-clinicos-da-epic-6ac57fd99015085aedb77607","categoria":"SAÚDE E IA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Empresas brasileiras que adotaram inteligência artificial enfrentam desafio de encontrar profissionais preparados","resumo":"Um estudo recente revela que organizações nacionais que integraram soluções de IA em suas operações sofrem com a escassez de mão de obra qualificada. A alta demanda por especialistas capazes de gerenciar e otimizar essas ferramentas supera a oferta atual do mercado educacional. O cenário reforça a urgência de investimentos robustos em capacitação técnica e programas de formação profissional.","link":"https://g1.globo.com/jornal-nacional/noticia/2026/10/06/empresas-brasileiras-que-adotaram-ia-enfrentam-desafio-de-encontrar-profissionais-preparados-para-usar-a-tecnologia-diz-estudo.ghtml","categoria":"MERCADO","lang":"pt"},{"fonte":"WTNH.com","pais":"Estados Unidos","titulo":"First Student adiciona tecnologia de IA em ônibus em Hartford e New Haven","resumo":"A empresa de transporte escolar First Student está implementando ferramentas de inteligência artificial em sua frota de ônibus em cidades de Connecticut. A tecnologia visa monitorar o tráfego, otimizar rotas e aumentar a segurança dos estudantes durante os trajetos diários. A iniciativa marca um avanço importante na modernização do transporte público infantil.","link":"https://www.wtnh.com/news/connecticut/first-student-adding-ai-technology-to-buses-in-hartford-new-haven/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Alzheimer: matemáticos estão na pista de novos tratamentos","resumo":"Pesquisadores da área de matemática aplicaram modelos complexos para estudar o avanço da doença de Alzheimer no cérebro humano. Essa abordagem inovadora promete acelerar a descoberta de novos tratamentos farmacológicos mais eficazes e personalizados. O estudo abre portas para que a ciência compreenda melhor os mecanismos moleculares da neurodegeneração.","link":"https://www.science-et-vie.com/cerveau-et-intelligence/alzheimer/alzheimer-les-mathematiciens-sont-sur-la-piste-de-nouveaux-traitements-262138.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Argus","pais":"Inglaterra","titulo":"Conselho municipal testará uso de inteligência artificial para identificar buracos nas ruas","resumo":"Autoridades locais britânicas estão implementando sistemas baseados em inteligência artificial para detectar buracos nas vias públicas de forma automatizada. A tecnologia promete agilizar a manutenção urbana, reduzindo custos operacionais e melhorando a segurança para motoristas e pedestres. A iniciativa representa um passo significativo na digitalização dos serviços públicos municipais no país.","link":"https://www.theargus.co.uk/news/26611429.west-sussex-county-council-use-ai-spot-potholes/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"EL PAÍS","pais":"Espanha","titulo":"De Sheinbaum a Meloni: líderes mundiais impulsionam medidas para se proteger de 'deepfakes' com IA","resumo":"Diversas líderes políticas ao redor do mundo estão implementando regulamentações e ferramentas de defesa para combater a proliferação de vídeos falsos gerados por inteligência artificial. O fenômeno dos 'deepfakes' representa uma ameaça crescente à segurança institucional e à reputação de figuras públicas. A medida busca estabelecer barreiras legais e tecnológicas para preservar a integridade da informação.","link":"https://elpais.com/tecnologia/2026-10-07/de-sheinbaum-a-meloni-las-lideres-mundiales-impulsan-medidas-para-protegerse-de-los-deepfakes-con-ia.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Spektrum.de","pais":"Alemanha","titulo":"Prêmio Nobel de Química 2026: Quem receberá a premiação?","resumo":"Especialistas e cientistas do mundo todo acompanham com expectativa a corrida pelo prestigioso Prêmio Nobel de Química.\nA premiação destaca as descobertas mais revolucionárias que moldam o futuro da ciência e da tecnologia global.\nAs apostas envolvem inovações em nanotecnologia, bioquímica e novos materiais sustentáveis.","link":"https://www.spektrum.de/news/nobelpreis-fuer-chemie-2026-wer-bekommt-den-chemie-nobelpreis/2343908","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"AIST e Universidade de Kumamoto realizam implementação tecnológica em parque de semicondutores e cooperam no apoio empresarial e treinamento de talentos","resumo":"O Instituto Nacional de Ciência e Tecnologia Industrial Avançada uniu forças com a Universidade de Kumamoto para acelerar a inovação em semicondutores. A parceria estratégica foca na implementação prática de tecnologias diretamente em parques industriais especializados da região. Além disso, o projeto contempla capacitação de mão de obra qualificada para sustentar o crescimento do setor.","link":"https://www.nikkei.com/article/DGXZQOJC072C70X01C26A0000000/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"中工网","pais":"China","titulo":"Escala da indústria de novas baterias da China deve registrar crescimento estável até 2030","resumo":"Projeções econômicas indicam que o setor de baterias avançadas na China passará por uma expansão contínua e robusta até o final da década.\nO impulso é alimentado pela forte demanda por veículos elétricos e soluções de armazenamento de energia renovável no mercado interno e externo.\nEssa trajetória consolidará a liderança global do país na cadeia de suprimentos de transição energética.","link":"https://www.workercn.cn/c/2026-10-07/8909260.shtml","categoria":"ENERGIA","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Índia","titulo":"25 anos de Modi no poder são marcados por impulso em infraestrutura e tecnologia","resumo":"Líderes políticos destacaram a trajetória de Narendra Modi, enfatizando o forte investimento em infraestrutura e inovação tecnológica ao longo de duas décadas e meia. As políticas implementadas transformaram o panorama digital e logístico do país. Esse legado consolida a Índia como um polo emergente de manufatura avançada e tecnologia.","link":"https://www.moneycontrol.com/news/india/modi-s-25-years-in-office-marked-by-infrastructure-technology-push-chandrababu-naidu-14046388.html","categoria":"POLÍTICA","lang":"pt"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Fusion 2026: autonomia da IA obriga empresas a decidir o que não delegar às máquinas","resumo":"Com o avanço da autonomia dos sistemas de inteligência artificial, as corporações enfrentam novos dilemas estratégicos complexos. O debate central gira em torno de quais processos críticos devem permanecer sob controle estrito dos seres humanos. A discussão é vital para garantir a segurança operacional e a ética nos negócios do futuro.","link":"https://jornaleconomico.sapo.pt/noticias/fusion-2026-autonomia-da-ia-obriga-empresas-a-decidir-o-que-nao-delegar-as-maquinas/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Incursão da Apple em casas inteligentes inclui campainha, fechadura e termostato","resumo":"A gigante de Cupertino está ampliando seu ecossistema de hardware com novos dispositivos voltados para a automação residencial integrada. A linha de produtos contará com campainhas inteligentes, fechaduras conectadas e termostatos de alta precisão controlados por inteligência artificial. A iniciativa busca fortalecer a posição da empresa no competitivo mercado de tecnologia doméstica e Internet das Coisas.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/10/06/incursao-da-apple-em-casas-inteligentes-inclui-campainha-fechadura-e-termostato.ghtml","categoria":"LANÇAMENTO","lang":"pt"},{"fonte":"Investing.com","pais":"Estados Unidos","titulo":"Ações da Marvell Technology sobem após metas ambiciosas no dia do investidor","resumo":"As ações da Marvell Technology registraram forte alta no mercado financeiro após a divulgação de projeções otimistas para os próximos anos. A empresa apresentou metas ambiciosas focadas em expansão de mercado e inovação em semicondutores. O anúncio reforçou a confiança dos acionistas no crescimento contínuo do setor de hardware avançado.","link":"https://www.investing.com/news/stock-market-news/marvell-technology-stock-rallies-following-ambitious-investor-day-targets-4934767","categoria":"MERCADO","lang":"pt"},{"fonte":"Le Temps","pais":"França","titulo":"«Não é uma luta contra a ciência, mas contra a desmedida»: iniciativa questiona colisor do CERN","resumo":"Cidadãos de Genebra lançaram uma iniciativa popular para votar sobre a construção e os limites do novo colisor de partículas do CERN. Os organizadores enfatizam que o objetivo não é frear o progresso científico, mas debater os impactos sociais e orçamentários. O plebiscito coloca em pauta a relação entre grandes investimentos tecnológicos e a vontade pública.","link":"https://www.letemps.ch/suisse/geneve/ce-n-est-pas-un-combat-contre-la-science-mais-contre-la-demesure-une-initiative-est-lancee-pour-faire-voter-les-genevois-sur-le-collisionneur-du-cern","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Inglaterra","titulo":"'Avaliação de riscos': Reino Unido investiga Meta por 'Instants' do Instagram","resumo":"O governo britânico iniciou uma investigação rigorosa sobre o recurso 'Instants' do Instagram desenvolvido pela Meta. Reguladores buscam avaliar potenciais riscos à segurança digital e à privacidade dos usuários mais jovens na plataforma. A medida reforça o cerco regulatório do Reino Unido sobre gigantes da tecnologia em prol da proteção de dados.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/10/06/avaliacao-de-riscos-reino-unido-investiga-meta-por-instants-do-instagram.ghtml","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"EL PAÍS","pais":"Espanha","titulo":"Rosalind Franklin havia visto a hélice: uma foto esquecida muda a história da estrutura do DNA","resumo":"Uma fotografia histórica recém-analisada comprova que a cientista Rosalind Franklin já havia identificado a estrutura helicoidal do DNA antes de sua publicação histórica. A descoberta corrige uma injustiça histórica de reconhecimento no campo da biologia molecular e genética. O achado reescreve os créditos fundamentais por trás de um dos maiores marcos da ciência moderna.","link":"https://elpais.com/ciencia/2026-10-07/rosalind-franklin-si-habia-visto-la-helice-una-foto-olvidada-cambia-la-historia-de-la-estructura-del-adn.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Bild der Wissenschaft","pais":"Alemanha","titulo":"Chatbots de IA entregam conhecimento limitado","resumo":"Um novo estudo aponta que os chatbots de inteligência artificial atuais ainda apresentam limitações significativas em termos de profundidade.\nA análise revela que ferramentas populares muitas vezes fornecem respostas superficiais em consultas acadêmicas e técnicas.\nO cenário reforça a necessidade de contínuos avanços no desenvolvimento de modelos de linguagem mais precisos.","link":"https://wissenschaft.de/artikel/ki-chatbots-liefern-schmalspur-wissen","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"アットプレス","pais":"Japão","titulo":"Equipado com tecnologia patenteada que faz LEDs brilharem sem bateria! Vendas de capas para iPhone 17/18 desenhadas com precisão através de padrões de circuito de placa começam em 7 de outubro","resumo":"A Electronic Device Industry lançou capas inovadoras para os novos modelos de iPhone utilizando padrões de circuito de placas de circuito impresso. O grande diferencial do produto é uma tecnologia patenteada que permite acender LEDs sem a necessidade de baterias externas. A novidade combina design futurista com engenharia de precisão voltada para o mercado de acessórios móveis.","link":"https://www.atpress.ne.jp/news/638346","categoria":"LANÇAMENTO","lang":"pt"},{"fonte":"新浪网","pais":"China","titulo":"IA quente, consumo frio: como a economia chinesa planeja superar a diferenciação em formato K","resumo":"O artigo analisa o contraste atual na economia da China, onde o setor de inteligência artificial prospera enquanto o consumo interno permanece cauteloso.\nEspecialistas debatem estratégias para estimular a demanda agregada e equilibrar o crescimento impulsionado por alta tecnologia com o varejo tradicional.\nSuperar essa divisão em formato K é vital para garantir uma recuperação econômica sustentável e inclusiva a médio prazo.","link":"https://k.sina.com.cn/article_1684012053_645ffc1501901s0hq.html?from=finance","categoria":"ECONOMIA","lang":"pt"},{"fonte":"CNBC TV18","pais":"Índia","titulo":"Política Monetária do RBI eleva previsão do PIB da Índia para 7,1% e destaca economia forte","resumo":"O Banco Central da Índia revisou para cima a projeção de crescimento do PIB para 7,1%, reforçando a resiliência econômica nacional. A decisão demonstra confiança na demanda interna e na robustez dos principais setores produtivos do país. Essa perspectiva positiva atrai novos investimentos estrangeiros para o mercado indiano.","link":"https://www.cnbctv18.com/economy/rbi-mpc-india-gdp-repo-rate-20005712.htm/amp","categoria":"ECONOMIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"ESTUDO: Inteligência Artificial em Portugal","resumo":"Uma nova pesquisa detalha o panorama atual e os impactos da adoção de inteligência artificial no contexto português. O levantamento analisa o nível de preparação das empresas nacionais frente às demandas globais de inovação. Os dados servem de base para nortear políticas públicas e estratégias corporativas no setor tecnológico.","link":"https://sapo.pt/artigo/estudo-ai-em-portugal-6ac546bde4155a81ac1c3578","categoria":"PESQUISA","lang":"pt"},{"fonte":"MundoGEO","pais":"Brasil","titulo":"Agência Espacial Brasileira publica Portaria que institui nova Política de Inovação","resumo":"O governo federal oficializou diretrizes estratégicas para fomentar a pesquisa científica e o desenvolvimento de tecnologias espaciais no país. A medida visa estimular parcerias público-privadas e atrair investimentos para o setor aeroespacial nacional. A nova política cria um ambiente mais favorável para startups e centros de pesquisa inovarem na área.","link":"https://mundogeo.com/2026/10/06/agencia-espacial-brasileira-publica-portaria-que-institui-politica-de-inovacao/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"NBC 7 San Diego","pais":"Estados Unidos","titulo":"Seasats, com sede em San Diego, inaugura instalações maiores com o crescimento da tecnologia de defesa","resumo":"A empresa Seasats expandiu sua sede na Califórnia para atender à crescente demanda por embarcações autônomas de superfície. O novo espaço permitirá ampliar a produção de tecnologias voltadas para aplicações de defesa e monitoramento oceânico. O movimento destaca a expansão do ecossistema de inovação militar e marítima na região.","link":"https://www.nbcsandiego.com/video/videos/san-diego-based-seasats-opens-larger-facility-as-defense-technology-grows/4083656/","categoria":"DEFESA","lang":"pt"},{"fonte":"Le Progrès","pais":"França","titulo":"Saúde. Beber café regularmente aumenta a expectativa de vida? O que diz a ciência","resumo":"Novas pesquisas científicas investigam os reais benefícios do consumo regular de café para a longevidade humana. Os dados apontam correlações positivas entre compostos da bebida e a prevenção de diversas doenças crônicas e degenerativas. O estudo traz clareza sobre hábitos alimentares saudáveis que podem prolongar e melhorar a qualidade de vida.","link":"https://www.leprogres.fr/magazine-sante/2026/10/07/boire-regulierement-du-cafe-augmente-t-il-l-esperance-de-vie-ce-qu-en-dit-la-science","categoria":"SAÚDE","lang":"pt"},{"fonte":"Home","pais":"Inglaterra","titulo":"Portões eletrônicos de aeroportos no Reino Unido adotarão tecnologia sem contato","resumo":"Os aeroportos britânicos se chuẩn para modernizar seus sistemas de imigração com a introdução de portões eletrônicos sem contato. A inovação visa acelerar o fluxo de passageiros e tornar o processo de embarque e desembarque mais eficiente. Essa atualização reflete a busca contínua por automação avançada no setor de viagens aéreas.","link":"https://travelweekly.co.uk/news/uk-airport-e-gates-to-switch-to-contactless-technology","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"El Desmarque","pais":"Espanha","titulo":"XPeng oferece um SUV elétrico com tecnologia de 800 volts que desafia modelos muito mais caros","resumo":"O novo veículo elétrico da marca chega ao mercado equipado com uma arquitetura avançada de carregamento ultrarrápido de 800 volts. Essa especificação técnica costumava ser exclusiva de automóveis de luxo de altíssimo custo, democratizando o acesso à alta performance. O lançamento promete acirrar a concorrência no setor automotivo sustentável europeu.","link":"https://www.eldesmarque.com/coches-y-motos/20261007/xpeng-suv-electrico-tecnologia-voltios_18_020345149.html","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"Bild der Wissenschaft","pais":"Alemanha","titulo":"Novo índice do capitalismo compara 161 economias globais","resumo":"Uma abrangente pesquisa econômica lançada recentemente coloca 161 países sob a mesma lupa para avaliar seus modelos capitalistas.\nO índice analisa métricas complexas de inovação, desigualdade, regulação de mercado e eficiência econômica.\nO resultado oferece insights valiosos sobre as tendências geopolíticas e os desafios financeiros enfrentados pelas nações.","link":"https://wissenschaft.de/artikel/neuer-kapitalismus-index-zeigt-161-volkswirtschaften-im-vergleich","categoria":"ECONOMIA","lang":"pt"},{"fonte":"SPACE CONNECT","pais":"Japão","titulo":"JAXA revisa o roteiro de ciência espacial e exploração pela primeira vez em 3 anos visando cocriação com a indústria e eficiência de desenvolvimento","resumo":"A Agência de Exploração Aeroespacial do Japão atualizou seu planejamento estratégico de longo prazo para alinhar missões científicas com o setor industrial. O novo roteiro prioriza parcerias comerciais e a otimização de custos e prazos no desenvolvimento de tecnologias espaciais. A medida busca manter o país na vanguarda da exploração espacial e fortalecer a economia associada.","link":"https://space-connect.jp/isas-roadmap/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"新湖南","pais":"China","titulo":"Inteligência artificial remodela a manufatura de informações eletrônicas","resumo":"A integração de ferramentas de inteligência artificial está transformando radicalmente as linhas de produção de eletrônicos na China.\nEssa modernização aumenta significativamente a eficiência operacional, reduz custos e eleva os padrões de qualidade na fabricação de componentes.\nA transformação digital consolida o papel do país como polo central da indústria eletrônica inteligente global.","link":"https://www.hunantoday.cn/news/xhn/202610/33924599.html","categoria":"MANUFATURA","lang":"pt"},{"fonte":"Investment Guru India","pais":"Índia","titulo":"Índia e Suíça fortalecem parceria estratégica em ciência e tecnologia","resumo":"Os governos da Índia e da Suíça oficializaram a ampliação de sua cooperação bilateral voltada para projetos científicos e tecnológicos. A iniciativa busca fomentar pesquisas conjuntas em áreas de ponta e intercâmbio de inovação acadêmica. O acordo promete impulsionar o desenvolvimento de soluções sustentáveis e de alta tecnologia.","link":"https://investmentguruindia.com/newsdetail/india-switzerland-strengthen-strategic-science-technology-partnership896961","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Razão Automóvel","pais":"Portugal","titulo":"BYD quer submergir módulos de bateria com nova tecnologia","resumo":"A montadora BYD apresentou uma abordagem inovadora para o resfriamento e segurança de módulos de baterias elétricas. A técnica consiste em submergir componentes diretamente em fluidos especiais para otimizar o desempenho térmico. Essa evolução tecnológica visa aumentar a eficiência dos veículos elétricos e reduzir riscos de incêndio.","link":"https://www.razaoautomovel.com/noticias/byd-quer-afogar-modulos-de-bateria-com-nova-tecnologia/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Valor Econômico","pais":"Brazil","titulo":"Taiwanese tech companies expand investments in artificial intelligence in the United States and Southeast Asia","resumo":"Taiwanese tech giants are channeling massive resources into expanding artificial intelligence infrastructure in the US and Southeast Asia. The strategic move aims to decentralize the supply chain and meet growing global demand for advanced hardware. Experts point out that this expansion could reshape the international semiconductor and AI solutions market in the coming years.","link":"https://valor.globo.com/empresas/noticia/2026/10/07/empresas-de-tecnologia-de-taiwan-ampliam-investimentos-em-ia-nos-eua-e-no-sudeste-asitico.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Northwest Missourian","pais":"United States","titulo":"Bearcat Athletics increasingly uses AI to generate graphics and write game recaps","resumo":"The Bearcat athletic department has adopted artificial intelligence to optimize the creation of visual and textual content about its games. The technology streamlines the production of summaries and analytical graphics to engage fans. This trend reflects the growing automation in the management and communication of American collegiate sports.","link":"https://www.nwmissourinews.com/sports/article_a9ab70cb-0f6d-4648-aded-27e20243bd90.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Transition Vélo","pais":"France","titulo":"Hydrogen bicycles: Does this new failure portend the death of this promising technology?","resumo":"The recent failure of projects involving hydrogen-powered bicycles raises serious doubts about the commercial viability of the technology. Experts are discussing whether infrastructure difficulties and high costs will mark the definitive end of this alternative. The analysis details the impacts of this setback on the future of sustainable and green urban mobility.","link":"https://www.transitionvelo.com/velo-et-societe/velos-a-hydrogene-un-nouvel-echec-predit-il-la-mort-de-cette-technologie-prometteuse/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"United Kingdom","titulo":"Scientists who put their faith in technology are less likely to act against climate change","resumo":"New research reveals that individuals who place excessive trust in future technological solutions tend to neglect immediate climate action. This phenomenon sparks important debates about the complacency generated by innovations and the need for practical engagement. Experts warn that technology must complement, rather than replace, the urgent behavior changes needed to preserve the global environment.","link":"https://www.theguardian.com/environment/2026/oct/07/scientists-technology-less-likely-climate-crisis-action","categoria":"SCIENCE","lang":"en"},{"fonte":"El Español","pais":"Spain","titulo":"Technology bridges distances for SMEs in rural Spain","resumo":"Recent technological initiatives are enabling small and medium-sized enterprises located in less-populated Spanish regions to overcome geographical barriers. Digital transformation facilitates access to global markets and improves the competitiveness of these local businesses. The primary impact is economic revitalization and a reduction in commercial isolation in the country's rural areas.","link":"https://www.elespanol.com/enclave-ods/opinion/20261007/tecnologia-acorta-distancias-pymes-espana-vaciada/1003744408765_13.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Porsche Newsroom","pais":"Germany","titulo":"New sports cars, greater exclusivity, and profitability: Porsche unveils new strategy through 2035","resumo":"German automaker Porsche has released its new long-term strategy focusing on electrification and profit margin expansion. The plan aims to position the luxury brand amidst the profound transformations sweeping the global automotive market. The initiative seeks to balance high-performance tradition with sustainability and the demand for exclusive vehicles.","link":"https://newsroom.porsche.com/en/2026/company/porsche-capital-markets-day-strategy-sportwagenschmiede-35-43419.html","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"Digital PR Platform","pais":"Japan","titulo":"Next-generation power electronics technology with automatic optimization for high efficiency and safety to be showcased at CEATEC 2026","resumo":"Shibaura Institute of Technology is preparing to present advanced power electronics innovations at CEATEC 2026. The technology highlights automatic optimization systems designed to ensure maximum energy efficiency and operational safety. The project reinforces Japanese academic institutions' commitment to sustainable and industrial development.","link":"https://digitalpr.jp/r/145372","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Hubbis","pais":"China","titulo":"Laura Lui of Premia Partners discusses China's hard technology revaluation and the 15th Five-Year Plan","resumo":"The expert discusses how the Chinese government is redirecting its focus toward the 'hard technology' sector and deep industrial innovation. This strategy aims to strengthen the country's technological autonomy in the face of challenging global scenarios and drive the next growth cycle. Alignment with the 15th Five-Year Plan consolidates a long-term commitment to scientific excellence and advanced manufacturing.","link":"https://www.hubbis.com/article/premia-partners-laura-lui-on-china-s-hard-technology-revaluation-and-the-15th-five-year-plan","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Investing.com India","pais":"India","titulo":"VEON and Amdocs sign 10-year technology operations agreement","resumo":"VEON and Amdocs have entered into a long-term strategic partnership aimed at modernizing technology operations. The agreement seeks to accelerate digital transformation and operational efficiency in emerging global markets. The initiative highlights progress in software-based infrastructure management and advanced automation.","link":"https://in.investing.com/news/stock-market-news/veon-amdocs-sign-10year-technology-operations-agreement-93CH-5621398","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Link To Leaders","pais":"Portugal","titulo":"Beta Friend's technology generates hundreds of new 3D climbing routes in seconds","resumo":"A recent technological innovation is capable of creating hundreds of three-dimensional climbing routes extremely quickly. This automated tool revolutionizes planning for athletes and sport enthusiasts. The impact spans both sports training and the development of new outdoor digital experiences.","link":"https://linktoleaders.com/tecnologia-da-beta-friend-gera-centenas-de-novos-percursos-de-escalada-em-3d-em-segundos/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Brasil Inovador","pais":"Brazil","titulo":"Software internationalization: program prepares Brazilian tech companies for global expansion","resumo":"A new initiative has been launched in the country to train domestic developers and businesses in exporting software and digital services. The program offers specialized mentorship on international regulations, cultural adaptation, and foreign market entry strategies. The goal is to raise the competitiveness of the Brazilian tech sector on the global stage.","link":"https://brasilinovador.com.br/internacionalizacao-de-software-programa-prepara-empresas-brasileiras-de-tecnologia-para-expansao-global/","categoria":"BUSINESS","lang":"en"},{"fonte":"U.S. Medicine","pais":"United States","titulo":"Executive Order drives technology updates at Department of Defense and VA","resumo":"A new government directive mandates the modernization of technological systems across critical U.S. agencies. The focus is to enhance digital infrastructure and data security at the Department of Defense and the Department of Veterans Affairs. The measure aims to ensure greater operational efficiency and cyber resilience in the face of modern challenges.","link":"https://www.usmedicine.com/non-clinical-topics/electronic-health-records/executive-order-pushes-technology-updates-at-dod-va/","categoria":"GOVERNMENT","lang":"en"},{"fonte":"L'Automobile Magazine","pais":"France","titulo":"Toyota doubles down on costly bus technology despite electric vehicle competition","resumo":"Japanese automaker Toyota is maintaining firm investments in an expensive propulsion technology for the bus sector. The strategy defies the growing dominance and strong competition of all-electric vehicles in the global market. The decision sparks debates over economic efficiency, sustainability, and the future of public transportation.","link":"https://www.automobile-magazine.fr/utilitaires-news/article/53365-toyota-sentete-sur-une-technologie-couteuse-pour-les-bus-malgre-la-concurrence-de-lelectrique","categoria":"BUSINESS","lang":"en"},{"fonte":"BBC","pais":"United Kingdom","titulo":"Blind and visually impaired people fear backlash against smart glasses","resumo":"The advancement of smart glasses has raised concerns among visually impaired communities in the UK. Users fear that the stigma associated with attached cameras will result in harassment and privacy invasions in public spaces. The debate highlights the challenge of balancing assistive technological innovation with social acceptance and user safety.","link":"https://www.bbc.com/news/articles/cmx2qlz7ney2o","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Innovaspain","pais":"Spain","titulo":"Spanish firm IOT develops Light-Form: a technology capable of manufacturing ophthalmic lenses in seconds","resumo":"A company from Spain has created an innovative solution that promises to revolutionize the production of glasses through an extremely fast process. Light-Form technology is able to manufacture custom ophthalmic lenses in a matter of seconds, optimizing costs and wait times. This breakthrough has the potential to transform the national and international optical industry.","link":"https://www.innovaspain.com/la-espanola-iot-desarrolla-light-form-una-tecnologia-capaz-de-fabricar-lentes-oftalmicas-en-segundos/","categoria":"INNOVATION","lang":"en"},{"fonte":"LMU München","pais":"Germany","titulo":"When music meets quantum science","resumo":"An innovative project in Germany explores the fascinating intersection between quantum physics and musical composition. Researchers use concepts of quantum mechanics to generate unprecedented sound structures and expand artistic creativity. The initiative demonstrates how modern science can inspire new forms of cultural and technological expression.","link":"https://www.lmu.de/en/newsroom/calendar-of-events/event/music-meets-quantum-science-13de7b1b.html","categoria":"SCIENCE","lang":"en"},{"fonte":"伊藤忠商事株式会社","pais":"Japan","titulo":"Strengthening drug development support system through application of AI drug discovery technology","resumo":"Strategic initiatives are being implemented to intensify support for the creation of new drugs using artificial intelligence. The integration of advanced technologies aims to accelerate research processes and reduce significant costs in the pharmaceutical sector. This approach represents a milestone in the modernization of precision medicine and rapid response to healthcare demands.","link":"https://www.itochu.co.jp/ja/news/press/2026/261007.html","categoria":"SCIENCE","lang":"en"},{"fonte":"中国江苏网","pais":"China","titulo":"PISA 2025 report card outlook: Chinese children lead in science and math globally, marking divide in AI era","resumo":"The PISA 2025 results highlight the exceptional performance of Chinese students in science and mathematics at a global level. This milestone reinforces the effectiveness of the country's educational methods, but also sparks debates about pedagogical adaptation in the face of the advancement of artificial intelligence. The scenario highlights a crucial moment of transition where traditional education needs to merge with new technological demands.","link":"https://jsnews.jschina.com.cn/jsyw/202610/t20261007_s6ac5ab8de4b086d2d5feed73.shtml","categoria":"EDUCATION","lang":"en"},{"fonte":"ANI News","pais":"India","titulo":"RBI warns of high valuations of AI assets as global risks","resumo":"The Reserve Bank of India (RBI) has pointed out that high asset valuations driven by Artificial Intelligence pose downside risks to the global economy. The assessment reflects concerns about possible financial bubbles in the technology sector. The scenario requires greater regulatory monitoring and caution on the part of international investors.","link":"https://www.aninews.in/news/business/rbi-flags-elevated-ai-related-asset-valuations-among-key-downside-risks-to-global-economy20261007111118","categoria":"ECONOMY","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"OpenAI Brings ChatGPT to Epic Clinical Records","resumo":"The integration of ChatGPT into Epic's medical records systems represents a significant advancement in healthcare. The technology assists medical professionals in synthesizing data and optimizing routine administrative tasks. This implementation promises to reduce hospital bureaucracy and speed up patient care.","link":"https://sapo.pt/artigo/openai-leva-o-chatgpt-aos-registos-clinicos-da-epic-6ac57fd99015085aedb77607","categoria":"HEALTH AND AI","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"Brazilian companies that adopted artificial intelligence face the challenge of finding prepared professionals","resumo":"A recent study reveals that national organizations that have integrated AI solutions into their operations suffer from a shortage of qualified labor. The high demand for specialists capable of managing and optimizing these tools exceeds the current supply in the educational market. The scenario reinforces the urgency of robust investments in technical training and professional training programs.","link":"https://g1.globo.com/jornal-nacional/noticia/2026/10/06/empresas-brasileiras-que-adotaram-ia-enfrentam-desafio-de-encontrar-profissionais-preparados-para-usar-a-tecnologia-diz-estudo.ghtml","categoria":"MARKET","lang":"en"},{"fonte":"WTNH.com","pais":"United States","titulo":"First Student adds AI technology to buses in Hartford and New Haven","resumo":"School transportation company First Student is implementing artificial intelligence tools into its bus fleet in Connecticut cities. The technology aims to monitor traffic, optimize routes and increase student safety during daily commutes. The initiative marks an important step forward in the modernization of public transport for children.","link":"https://www.wtnh.com/news/connecticut/first-student-adding-ai-technology-to-buses-in-hartford-new-haven/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Science et vie","pais":"France","titulo":"Alzheimer's: mathematicians are on the trail of new treatments","resumo":"Mathematics researchers applied complex models to study the progression of Alzheimer's disease in the human brain. This innovative approach promises to accelerate the discovery of new, more effective and personalized pharmacological treatments. The study opens doors for science to better understand the molecular mechanisms of neurodegeneration.","link":"https://www.science-et-vie.com/cerveau-et-intelligence/alzheimer/alzheimer-les-mathematiciens-sont-sur-la-piste-de-nouveaux-traitements-262138.html","categoria":"SCIENCE","lang":"en"},{"fonte":"The Argus","pais":"England","titulo":"City council will test the use of artificial intelligence to identify potholes in the streets","resumo":"British local authorities are implementing systems based on artificial intelligence to detect potholes on public roads in an automated way. The technology promises to speed up urban maintenance, reducing operational costs and improving safety for drivers and pedestrians. The initiative represents a significant step in the digitalization of municipal public services in the country.","link":"https://www.theargus.co.uk/news/26611429.west-sussex-county-council-use-ai-spot-potholes/","categoria":"INNOVATION","lang":"en"},{"fonte":"EL PAÍS","pais":"Spain","titulo":"From Sheinbaum to Meloni: World leaders push measures to protect themselves from 'deepfakes' with AI","resumo":"Several political leaders around the world are implementing regulations and advocacy tools to combat the proliferation of fake videos generated by artificial intelligence. The phenomenon of 'deepfakes' represents a growing threat to institutional security and the reputation of public figures. The measure seeks to establish legal and technological barriers to preserve the integrity of information.","link":"https://elpais.com/tecnologia/2026-10-07/de-sheinbaum-a-meloni-las-lideres-mundiales-impulsan-medidas-para-protegerse-de-los-deepfakes-con-ia.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Spektrum.de","pais":"Germany","titulo":"Nobel Prize in Chemistry 2026: Who will receive the award?","resumo":"Experts and scientists from all over the world are eagerly following the race for the prestigious Nobel Prize in Chemistry. The awards highlight the most revolutionary discoveries shaping the future of global science and technology. The bets involve innovations in nanotechnology, biochemistry and new sustainable materials.","link":"https://www.spektrum.de/news/nobelpreis-fuer-chemie-2026-wer-bekommt-den-chemie-nobelpreis/2343908","categoria":"SCIENCE","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"AIST and Kumamoto University carry out technological implementation in semiconductor park and cooperate in business support and talent training","resumo":"The National Institute of Advanced Industrial Science and Technology has joined forces with Kumamoto University to accelerate innovation in semiconductors. The strategic partnership focuses on the practical implementation of technologies directly in specialized industrial parks in the region. In addition, the project includes training qualified labor to sustain the growth of the sector.","link":"https://www.nikkei.com/article/DGXZQOJC072C70X01C26A0000000/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"中工网","pais":"China","titulo":"Scale of China's new battery industry expected to see stable growth until 2030","resumo":"Economic projections indicate that China's advanced battery sector will experience continued robust expansion through the end of the decade. The momentum is fueled by strong demand for electric vehicles and renewable energy storage solutions domestically and internationally. This trajectory will consolidate the country's global leadership in the energy transition supply chain.","link":"https://www.workercn.cn/c/2026-10-07/8909260.shtml","categoria":"ENERGY","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"Modi's 25 years in power are marked by a boost in infrastructure and technology","resumo":"Political leaders highlighted Narendra Modi's trajectory, emphasizing strong investment in infrastructure and technological innovation over two and a half decades. The policies implemented transformed the country's digital and logistical landscape. This legacy consolidates India as an emerging hub for advanced manufacturing and technology.","link":"https://www.moneycontrol.com/news/india/modi-s-25-years-in-office-marked-by-infrastructure-technology-push-chandrababu-naidu-14046388.html","categoria":"POLICY","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Fusion 2026: AI autonomy forces companies to decide what not to delegate to machines","resumo":"With the advancement of the autonomy of artificial intelligence systems, corporations face new complex strategic dilemmas. The central debate revolves around which critical processes should remain under the strict control of humans. The discussion is vital to ensure operational security and business ethics in the future.","link":"https://jornaleconomico.sapo.pt/noticias/fusion-2026-autonomia-da-ia-obriga-empresas-a-decidir-o-que-nao-delegar-as-maquinas/","categoria":"BUSINESS","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Apple's Smart Home Push Includes Doorbell, Smart Lock, and Thermostat","resumo":"The Cupertino giant is expanding its hardware ecosystem with new devices focused on integrated home automation. The product line will feature smart doorbells, connected locks, and high-precision thermostats controlled by artificial intelligence. The initiative aims to strengthen the company's position in the competitive home technology and Internet of Things market.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/10/06/incursao-da-apple-em-casas-inteligentes-inclui-campainha-fechadura-e-termostato.ghtml","categoria":"LAUNCH","lang":"en"},{"fonte":"Investing.com","pais":"United States","titulo":"Marvell Technology Shares Rally Following Ambitious Investor Day Targets","resumo":"Marvell Technology shares posted strong gains in the financial market following the release of optimistic projections for the coming years. The company presented ambitious targets focused on market expansion and semiconductor innovation. The announcement reinforced shareholder confidence in the continued growth of the advanced hardware sector.","link":"https://www.investing.com/news/stock-market-news/marvell-technology-stock-rallies-following-ambitious-investor-day-targets-4934767","categoria":"MARKET","lang":"en"},{"fonte":"Le Temps","pais":"France","titulo":"\"It's Not a Fight Against Science, but Against Excess\": Initiative Questions CERN Collider","resumo":"Citizens in Geneva have launched a grassroots initiative to vote on the construction and limits of CERN's new particle collider. The organizers emphasize that the goal is not to stall scientific progress, but to debate the social and budgetary impacts. The plebiscite brings the relationship between major technological investments and public will to the forefront.","link":"https://www.letemps.ch/suisse/geneve/ce-n-est-pas-un-combat-contre-la-science-mais-contre-la-demesure-une-initiative-est-lancee-pour-faire-voter-les-genevois-sur-le-collisionneur-du-cern","categoria":"SCIENCE","lang":"en"},{"fonte":"O GLOBO","pais":"United Kingdom","titulo":"\"Risk Assessment\": UK Investigates Meta Over Instagram 'Instants'","resumo":"The British government has launched a rigorous investigation into Instagram's 'Instants' feature developed by Meta. Regulators aim to assess potential risks to digital security and the privacy of younger users on the platform. The move reinforces the UK's regulatory crackdown on tech giants to protect user data.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/10/06/avaliacao-de-riscos-reino-unido-investiga-meta-por-instants-do-instagram.ghtml","categoria":"SECURITY","lang":"en"},{"fonte":"EL PAÍS","pais":"Spain","titulo":"Rosalind Franklin Had Seen the Helix: A Forgotten Photo Changes the History of DNA Structure","resumo":"A newly analyzed historical photograph proves that scientist Rosalind Franklin had already identified the helical structure of DNA prior to its landmark publication. The discovery corrects a historical injustice regarding recognition in the field of molecular biology and genetics. The finding rewrites the fundamental credits behind one of modern science's greatest milestones.","link":"https://elpais.com/ciencia/2026-10-07/rosalind-franklin-si-habia-visto-la-helice-una-foto-olvidada-cambia-la-historia-de-la-estructura-del-adn.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Bild der Wissenschaft","pais":"Germany","titulo":"AI Chatbots Deliver Limited Knowledge","resumo":"A new study points out that current artificial intelligence chatbots still exhibit significant limitations in terms of depth. The analysis reveals that popular tools often provide superficial answers in academic and technical queries. This scenario reinforces the need for continuous advancements in developing more accurate language models.","link":"https://wissenschaft.de/artikel/ki-chatbots-liefern-schmalspur-wissen","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"アットプレス","pais":"Japan","titulo":"Equipped with Patented Technology Making LEDs Glow Without Batteries! iP   const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
