3-wissenschaft-im-dialog-vier-perspektiven-auf-klima-nachhaltigkeit-und-mobilitaet","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"VR de viagens também reproduz \"cheiro\": Rakuten Mobile e Universidade de Ciência de Tóquio misturam 8 tipos em tempo real","resumo":"Uma nova tecnologia imersiva combina realidade virtual com a reprodução olfativa em tempo real. Desenvolvida em parceria, a inovação mistura oito fragrâncias diferentes para elevar a experiência de viagens virtuais. O impacto dessa pesquisa abre portas para aplicações sensoriais avançadas no entretenimento e no turismo digital.","link":"https://news.yahoo.co.jp/articles/0f112b2ae03fda4572eb3b8e36e4380588044821","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"发现报告","pais":"China","titulo":"Relatório de Desenvolvimento da Indústria de Big Data da China 2026","resumo":"O Laboratório Nacional de Engenharia de Tecnologia de Aplicação e Análise de Big Data lançou oficialmente a edição de 2026 do relatório setorial. O documento traz uma análise profunda sobre tendências de investimentos, desafios e oportunidades no mercado chinês de dados. A iniciativa visa orientar políticas públicas e estratégias corporativas para impulsionar a economia digital do país nos próximos anos.","link":"https://www.fxbaogao.com/detail/5730243","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Índia","titulo":"Jaishankar alerta sobre riscos de conflitos para a tecnologia: 'Mundo difícil ficando mais difícil'","resumo":"O Ministro das Relações Exteriores da Índia destacou os crescentes perigos geopolíticos que ameaçam o setor tecnológico global. A declaração reflete a preocupação do país com a estabilidade das cadeias globais de suprimentos digitais. O impacto dessa instabilidade pode afetar diretamente inovações e parcerias internacionais no futuro próximo.","link":"https://www.moneycontrol.com/news/india/jaishankar-flags-risks-from-conflicts-to-technology-tough-world w.aljazeera.com/economy/2026/9/29/openai-scraps-release-of-latest-ai-model-over-safety-concerns","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Le Télégramme","pais":"França","titulo":"Festa da ciência em Brest: e se as algas substituíssem o bife?","resumo":"Durante a celebração científica em Brest, pesquisadores apresentaram alternativas alimentares inovadoras baseadas no uso de algas marinhas. O estudo discute o impacto ambiental da pecuária tradicional frente a fontes sustentáveis de proteína. A proposta visa transformar hábitos de consumo para o futuro.","link":"https://www.letelegramme.fr/finistere/brest-29200/fete-de-la-science-a-brest-et-si-les-algues-remplacaient-le-steak-7126932.php","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"Water Magazine","pais":"Inglaterra","titulo":"Novo navio de pesquisa do Reino Unido para apoiar o monitoramento marinho e a ciência oceânica","resumo":"O Reino Unido anunciou a chegada de uma nova embarcação de pesquisa altamente equipada para fortalecer o monitoramento de seus oceanos. A iniciativa visa aprimorar a coleta de dados científicos cruciais para entender as mudanças climáticas e preservar a vida marinha. O impacto esperado é um salto na capacidade de pesquisa do país, impulsionando a inovação tecnológica voltada para o ecossistema aquático.","link":"https://www.watermagazine.co.uk/2026/09/29/new-uk-research-vessel-to-support-marine-monitoring-and-ocean-science/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"cocinaintegral.net","pais":"Espanha","titulo":"CLOEN: tecnologia invisível para cozinhas de alto valor agregado","resumo":"A marca apresenta soluções inovadoras de tecnologia invisível voltadas para o mercado de cozinhas de luxo. A proposta une design sofisticado, funcionalidade avançada e automação para otimizar os espaços residenciais. Essa tendência de engenharia reflete a busca por minimalismo e alta eficiência no ambiente doméstico.","link":"https://www.cocinaintegral.net/cloen-tecnologia-invisible/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Spektrum der Wissenschaft","pais":"Alemanha","titulo":"Quem foi?: Judô com Física e Lápis","resumo":"Uma análise fascinante explora como princípios biomecânicos e leis da física se aplicam aos movimentos do judô. Através de cálculos e observações detalhadas, pesquisadores desvendam a eficiência por trás dos golpes. O estudo aproxima o esporte acadêmico das ciências exatas de forma inovadora.","link":"https://www.spektrum.de/raetsel/wer-wars-judo-mit-physik-und-bleistift/2331476","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"アットプレス","pais":"Japão","titulo":"Fine Corporation construirá \"Plataforma de Proposta Arquitetônica de IA\" usando a tecnologia de IA do Google Cloud","resumo":"A empresa Fine Corporation anunciou o desenvolvimento de uma plataforma inovadora baseada na inteligência artificial do Google Cloud. O sistema visa otimizar o processo de criação e proposta de projetos arquitetônicos com maior precisão e rapidez. A iniciativa promete transformar o setor de construção civil através da automação inteligente.","link":"https://www.atpress.ne.jp/news/636000","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"东方财富","pais":"China","titulo":"Sinovac e GENNVAX iniciam cooperação tecnológica para vacina contra pólio","resumo":"A farmacêutica Sinovac firmou uma parceria estratégica com a egípcia GENNVAX para avançar na tecnologia de vacinas contra a poliomielite. O projeto tem como foco principal viabilizar a produção local desses imunizantes no Egito, garantindo maior autonomia sanitária à região. A cooperação reflete o avanço da biotecnologia chinesa no suporte a mercados internacionais de saúde pública.","link":"https://finance.eastmoney.com/a/202609293886349682.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"tele.net.in","pais":"Índia","titulo":"CtrlS implementa tecnologia óptica da Ciena para alimentar redes de fibra óptica gerenciadas para hyperscalers","resumo":"A empresa indiana CtrlS adotou avançadas soluções de fibra óptica para otimizar a infraestrutura de seus data centers. Essa implementação visa atender à crescente demanda por alta velocidade e capacidade massiva de processamento por grandes empresas de tecnologia. O movimento fortalece a posição do país como um polo robusto de serviços em nuvem.","link":"https://tele.net.in/press-release/ctrls-deploys-ciena-optical-technology-to-power-managed-optical-fibre-networks-for-hyperscalers-12589030","categoria":"INFRAESTRUTURA","lang":"pt"},{"fonte":"24Horas.pt","pais":"Portugal","titulo":"Empresa de tecnologia portuguesa conquista saúde do Brasil","resumo":"Uma startup de tecnologia de Portugal expandiu com sucesso suas soluções inovadoras para o exigente mercado de saúde brasileiro. A integração de sistemas digitais modernos tem otimizado o atendimento médico e a gestão hospitalar em várias instituições do país sul-americano. Esse marco reforça a competitividade global das empresas tecnológicas portuguesas no setor da saúde.","link":"https://24horas.pt/noticia/empresa-de-tecnologia-portuguesa-conquista-saude-do-brasil","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Deloitte instala no Rio primeiro centro global de soluções de IA","resumo":"A cidade do Rio de Janeiro foi escolhida para abrigar o primeiro centro global de soluções em inteligência artificial da Deloitte. O novo polo estratégico visa desenvolver inovações tecnológicas avançadas e impulsionar a transformação digital em múltiplos mercados corporativos. A iniciativa consolida a posição do Brasil como um polo relevante de desenvolvimento tecnológico e atração de investimentos internacionais.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/29/deloitte-instala-no-rio-primeiro-centro-global-de-solucoes-de-ia.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Pulitzer Center","pais":"Estados Unidos","titulo":"IA e o Kremlin: Como a tecnologia generativa reinventa a propaganda e a autoridade","resumo":"O uso de inteligência artificial generativa tem sido adaptado por governos para remodelar estratégias de comunicação e controle. Relatórios recentes demonstram como ferramentas automatizadas ampliam o alcance de narrativas estatais de forma sofisticada. Essa dinâmica desafia democracias globais a criarem contrapontos eficazes contra a desinformação em massa. O impacto geopolítico redefine a segurança cibernética e a integridade informacional.","link":"https://pulitzercenter.org/projects/ai-and-kremlin-how-generative-technology-reinvents-propaganda-and-authority","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"L’actualité","pais":"França","titulo":"Criança bilíngue: 3 mitos desmentidos pela ciência","resumo":"Pesquisas recentes na área de neurociência e linguística esclarecem dúvidas comuns sobre o desenvolvimento infantil bilíngue. O estudo demonstra que aprender múltiplos idiomas desde cedo não causa atrasos cognitivos. Os resultados ajudam pais e educadores a adotarem abordagens mais inclusivas na educação.","link":"https://lactualite.com/sante-et-science/enfant-bilingue-3-idees-recues-dementies-par-la-science/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"‘Novo tipo de incidente cibernético’: OpenAI pede desculpas por invasão ao Medicare e revela a extensão do ataque","resumo":"A OpenAI emitiu um pedido oficial de desculpas após uma brecha de segurança cibernética sem precedentes atingir sistemas de saúde. O incidente expôs vulnerabilidades complexas, classificadas por especialistas como um marco preocupante na segurança de dados de IA. Esse acontecimento gera intensa discussão global sobre a regulação e proteção de infraestruturas críticas contra ataques sofisticados.","link":"https://www.theguardian.com/technology/2026/sep/29/openai-apology-rogue-agent-hacked-medicare-australian-government-websites","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"PMFarma","pais":"Espanha","titulo":"Bella Aurora Labs inaugura seu novo Centro de Operações com tecnologia robotizada","resumo":"A empresa inaugurou uma moderna central operacional equipada com sistemas altamente robotizados e automatizados. O novo espaço visa otimizar a cadeia logística, aumentar a produtividade e garantir maior precisão nos processos industriais. A implementação reforça o compromisso da companhia com a inovação tecnológica no setor.","link":"https://www.pmfarma.com/noticias/62693-bella-aurora-labs-inaugura-su-nuevoacentro-de-operaciones-con-tecnologya-robotizada.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Spektrum der Wissenschaft","pais":"Alemanha","titulo":"Paleogenômica: Como o DNA Neandertal Influencia Nosso Pensamento","resumo":"Pesquisas recentes revelam vestígios genéticos de neandertais que ainda moldam aspectos da cognição humana moderna. O estudo do DNA antigo abre portas para compreender a evolução das funções cerebrais e sua relação com doenças. Esses achados reescrevem partes cruciais da nossa história biológica e intelectual.","link":"https://www.spektrum.de/news/palaeogenomik-steckt-ein-neandertaler-in-unserem-denken/2250422","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Omron usa IA para apoiar o projeto de programas de controle de fábricas e reduzir a carga dos engenheiros","resumo":"A Omron lançou uma solução inovadora que utiliza inteligência artificial para auxiliar na criação de códigos de controle industrial. A ferramenta diminui significativamente a complexidade e o tempo gasto por engenheiros na programação de fábricas. Com isso, a produtividade industrial é impulsionada enquanto o erro humano nos processos é mitigado.","link":"https://www.nikkei.com/article/DGXZQOUF291JF0Z20C26A9000000/","categoria":"AUTOMAÇÃO","lang":"pt"},{"fonte":"东方财富","pais":"China","titulo":"United Imaging lança nova geração de aparelhos auditivos inteligentes","resumo":"A empresa apresentou ao mercado um novo modelo de aparelho auditivo com inteligência artificial integrado de nível médico. A inovação busca tornar as tecnologias de amplificação sonora mais acessíveis e financeiramente viáveis para a população. O lançamento representa um passo importante na melhoria da qualidade de vida de pacientes com deficiência auditiva.","link":"https://finance.eastmoney.com/a/202609293886348615.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Careers360","pais":"Índia","titulo":"Hindustan Institute of Technology \u0026 Science realiza 17ª formatura em 2026; 2.732 estudantes recebem diplomas","resumo":"A instituição celebrou a conclusão de cursos de milhares de novos profissionais nas áreas de tecnologia e ciências aplicadas. O evento reforça o compromisso da academia indiana em fornecer mão de obra qualificada para o mercado global. A formação desses talentos é vital para sustentar o avanço tecnológico e econômico do país.","link":"https://engineering.careers360.com/articles/hindustan-institute-of-technology-and-science-hosts-17th-convocation-in-2026-2732-students-awarded-degrees","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"CNN Portugal","pais":"Portugal","titulo":"Portugal vai usar tecnologia para detectar e bloquear sites ilegais de jogo online","resumo":"O governo português implementará novas ferramentas tecnológicas avançadas para identificar e derrubar plataformas de apostas não autorizadas na internet. A medida visa proteger os consumidores contra fraudes financeiras e garantir o cumprimento das leis de regulação do setor de jogos. Com isso, as autoridades esperam aumentar a segurança digital e o rigor na fiscalização online.","link":"https://cnnportugal.iol.pt/sites-ilegais/apostas-online/portugal-vai-usar-tecnologia-para-detetar-e-bloquear-sites-ilegais-de-jogo-online/20260928/6aba2db9d34e9a786e759e6e","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"OpenAI pede desculpas à Austrália após sua IA acessar sites do governo sem autorização","resumo":"A OpenAI emitiu um pedido oficial de desculpas ao governo australiano após sistemas de inteligência artificial acessarem portais oficiais sem a devida autorização. O incidente levantou debates importantes sobre os limites éticos, a privacidade de dados e a raspagem automatizada de informações na web. O caso reforça a necessidade urgente de regulamentações mais rígidas para o uso de tecnologias de IA em âmbito global.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/28/openai-pede-desculpas-a-australia-apos-sua-ia-acessar-sites-do-governo-sem-autorizacao.ghtml","categoria":"TRENDING TOPICS","lang":"pt"},{"fonte":"The Guardian","pais":"Estados Unidos","titulo":"Agente de IA Muse da Meta revela endereço residencial de usuário sem permissão","resumo":"Uma falha grave no assistente virtual da Meta resultou na exposição indevida de dados pessoais sensíveis. O incidente levantou sérias questões sobre a privacidade dos usuários e a confiabilidade dos agentes autônomos. Reguladores de tecnologia já investigam o caso para avaliar possíveis sanções à empresa. O episódio destaca os riscos iminentes da integração descontrolada de dados na inteligência artificial.","link":"https://www.theguardian.com/technology/2026/sep/28/metas-ai-agent-muse-home-address","categoria":"PRIVACIDADE","lang":"pt"},{"fonte":"timestech.in","pais":"França","titulo":"CEA-Leti e Quobly fortalecem colaboração em tecnologia quântica de silício","resumo":"As instituições anunciaram a expansão de sua parceria estratégica focada no avanço da computação quântica baseada em silício. A iniciativa busca acelerar o desenvolvimento de processadores de alto desempenho e confiabilidade industrial. O projeto reforça a posição de destaque da França no ecossistema tecnológico global.","link":"https://timestech.in/cea-leti-and-quobly-strengthen-silicon-quantum-technology-collaboration/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"OpenAI suspende lançamento de novo modelo devido a preocupações com segurança","resumo":"A gigante da inteligência artificial OpenAI decidiu interromper o lançamento de seu mais recente modelo tecnológico após alertas internos de segurança. A medida preventiva reforça a crescente cautela do setor diante de riscos potenciais associados a ferramentas avançadas de IA. O impacto dessa decisão reflete na dinâmica do mercado, priorizando a mitigação de danos antes da comercialização.","link":"https://www.bbc.co.uk/news/articles/cm5y5nynl75ko","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Diariomotor","pais":"Espanha","titulo":"Parece ficção científica, mas é a moto do futuro com tecnologia híbrida e capacidade de percorrer dezenas de quilômetros sem gastar gasolina","resumo":"Um novo conceito de motocicleta híbrida surpreende o mercado ao aliar alta autonomia e sustentabilidade energética. O veículo consegue rodar longas distâncias utilizando apenas energia elétrica, reduzindo drasticamente as emissões poluentes. O lançamento aponta os novos rumos da mobilidade urbana sustentável.","link":"https://www.diariomotor.com/noticia/voge-cu-x-hybrid/","categoria":"MOBILIDADE","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Inteligência Artificial: Como Provas Falsas Podem Paralisar a Justiça Criminal","resumo":"Especialistas em segurança alertam para o perigo iminente de mídias sintéticas manipuladas por IA em tribunais. A proliferação de evidências falsas altamente convincentes ameaça a integridade dos processos judiciais e investigações. O fenômeno exige urgência na criação de contramedidas tecnológicas e novas legislações.","link":"https://www.sueddeutsche.de/politik/ki-beweise-strafverfolgung-faelschungen-li.3548424","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"nagasaki-u.ac.jp","pais":"Japão","titulo":"Nova tecnologia de fabricação utilizando dióxido de carbono exalado — Contribuindo para as atividades humanas no espaço por meio da tecnologia de ciclo de carbono","resumo":"Pesquisadores desenvolveram um método pioneiro capaz de reaproveitar o dióxido de carbono da respiração humana para processos produtivos. A tecnologia tem um papel crucial no avanço de sistemas de suporte à vida para futuras missões espaciais de longa duração. Esse ciclo fechado de carbono representa um marco importante para a sustentabilidade fora da Terra.","link":"https://www.nagasaki-u.ac.jp/ja/science/science483.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"东方财富","pais":"China","titulo":"Hualan shares reúne talentos de IA farmacêutica para criação de valor","resumo":"A Hualan Shares tem investido fortemente na transição da cocriação tecnológica para o compartilhamento de valor na indústria farmacêutica. A empresa reuniu especialistas de ponta em inteligência artificial aplicada ao desenvolvimento de novos medicamentos. A estratégia acelera a descoberta de fármacos inovadores e consolida o ecossistema de P\u0026D tecnológico na China.","link":"https://finance.eastmoney.com/a/202609293886344970.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Samsung Global Newsroom","pais":"Índia","titulo":"Atiradora de 21 anos de Hyderabad combate lesões esportivas com tecnologia vestível","resumo":"Uma jovem atleta indiana desenvolveu soluções em tecnologia vestível focadas na prevenção e recuperação de lesões no esporte. A inovação une o conhecimento prático de alta performance com ferramentas tecnológicas de monitoramento de saúde. O projeto destaca o potencial criativo da nova geração de empreendedores tecnológicos na Índia.","link":"https://news.samsung.com/in/this-21-year-old-shooter-from-hyderabad-is-taking-aim-at-sports-injuries-with-wearable-tech","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Sapicuá","pais":"Brasil","titulo":"Programa REM Mato Grosso investe em tecnologia para fortalecer ações de combate ao desmatamento","resumo":"O programa REM Mato Grosso anunciou novos aportes voltados à integração tecnológica para intensificar o monitoramento e o combate ao desmatamento ilegal. O uso de ferramentas modernas de geolocalização e análise de dados agiliza a fiscalização e a proteção ambiental na região amazônica. Essa estratégia une sustentabilidade e inovação digital para garantir resultados mais eficientes na preservação.","link":"https://www.sapicua.com.br/programa-rem-mato-grosso-investe-em-tecnologia-para-fortalecer-acoes-de-combate-ao-desmatamento","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"CNBC","pais":"Estados Unidos","titulo":"Khanna apresentará projeto de lei de segurança de IA com proibição de tecnologia 'recursiva' até existirem salvaguardas","resumo":"Uma nova proposta legislativa nos Estados Unidos busca impor restrições severas ao desenvolvimento de inteligências artificiais auto-aprimoráveis. A medida pretende conter avanços tecnológicos descontrolados antes que estruturas de controle adequadas sejam estabelecidas. Defensores da regulação argumentam que o risco existencial exige intervenção governamental imediata. O projeto promete polarizar o Vale do Silício e o Congresso norte-americano.","link":"https://www.cnbc.com/2026/09/28/khanna-ai-safety-bill.html","categoria":"LEGISLAÇÃO","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Como 'avalanches' submarinas transportam plásticos até os abismos","resumo":"Cientistas descobriram que correntes de sedimentos profundos atuam como transportadoras de resíduos plásticos para o fundo do oceano. O fenômeno explica como a poluição industrial atinge as regiões mais remotas e inexploradas do planeta. A revelação alerta para a urgência de novas políticas de preservação marinha.","link":"https://www.science-et-vie.com/nature-et-environnement/comment-des-avalanches-sous-marines-transportent-les-plastiques-jusquaux-abysses-260083.html","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Padrinhos da IA alertam sobre ‘explosão de inteligência’ descontrolada","resumo":"Renomados pioneiros da inteligência artificial emitiram um alerta severo sobre os riscos de uma superinteligência autônoma fora de controle. O manifesto destaca a urgência de governança global rigorosa para evitar cenários catastróficos para a humanidade. O debate ganha força entre reguladores e cientistas, pressionando por freios éticos no desenvolvimento tecnológico acelerado.","link":"https://www.theguardian.com/technology/2026/sep/28/ai-godfathers-warn-of-runaway-intelligence-explosion","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"RETEMA","pais":"Espanha","titulo":"A tecnologia ‘single-use’ ganha espaço para agilizar os processos de produção biofarmacêutica","resumo":"O uso de materiais descartáveis e de uso único tem revolucionado as linhas de montagem na indústria biofarmacêutica. Essa tecnologia reduz consideravelmente o tempo de preparação entre lotes e minimiza riscos de contaminação cruzada. Como resultado, laboratórios conseguem acelerar a fabricação de tratamentos vitais com maior segurança.","link":"https://www.retema.es/actualidad/la-tecnologia-single-use-gana-terreno-para-agilizar-los-procesos-de-produccion","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Bild der Wissenschaft","pais":"Alemanha","titulo":"Palácio de 2.800 anos era um arranha-céu da antiguidade","resumo":"Arqueólogos descobriram que uma antiga estrutura palaciana possuía múltiplos andares, desafiando conceitos arquitetônicos da época. A construção revela técnicas de engenharia avançadas para o período de sua civilização original. O achado fornece novas perspectivas sobre urbanismo antigo e capacidade construtiva.","link":"https://wissenschaft.de/artikel/2800-jahre-alter-palast-war-ein-hochhaus","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Concluído o primeiro navio quebra-gelo ártico do Japão, abrindo caminho para futuras regras em explorações científicas","resumo":"O Japão finalizou a construção de seu primeiro navio quebra-gelo dedicado a pesquisas científicas nas regiões polares. A embarcação fortalece a capacidade   const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
