<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monitoramento Mídia Internacional | Global Media Monitoring</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0B0F19;
      --bg-panel: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #E2E8F0;
      --text-muted: #94A3B8;
      --accent: #D4AF37;
      --accent-hover: #FDE047;
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      background-image: radial-gradient(circle at top right, rgba(212, 175, 55, 0.15), transparent 400px),
                        radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.05), transparent 400px);
    }
    header {
      padding: 1.5rem 5%;
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo-img {
      height: 48px; /* Altura ajustável do logo */
      width: auto;
      object-fit: contain;
      border-radius: 8px; /* Caso não seja transparente */
    }
    .logo-text {
      font-weight: 700;
      font-size: clamp(1rem, 2vw, 1.5rem);
      letter-spacing: -0.5px;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .logo-text .title-light,
    .logo-text .title-separator {
      color: #fff;
    }
    .logo-text .title-accent {
      color: var(--accent);
    }
    .date-badge {
      background: var(--bg-panel);
      border: 1px solid var(--glass-border);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      color: var(--accent);
      font-weight: 600;
    }
    .container {
      padding: 2rem 5%;
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }
    .filters {
      flex: 0 0 300px;
      background: var(--bg-panel);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 6rem;
    }
    .filter-group {
      margin-bottom: 1.5rem;
    }
    .filter-group label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
    }
    select option {
      background: var(--bg-main);
      color: var(--text-main);
    }
    .results {
      flex: 1;
    }
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .results-count {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .news-card {
      background: var(--bg-panel);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.5rem;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .news-card:hover {
      transform: translateY(-4px);
      border-color: rgba(212, 175, 55, 0.5);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }
    .category {
      color: var(--accent);
    }
    .country {
      color: var(--text-muted);
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
      margin: 0 0 1rem 0;
      color: #fff;
    }
    .card-summary {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-muted);
      flex: 1;
    }
    .card-summary ul {
      margin: 0;
      padding-left: 1.2rem;
    }
    .card-summary li {
      margin-bottom: 0.25rem;
    }
    .card-footer {
      margin-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--glass-border);
      padding-top: 1rem;
    }
    .read-more {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .read-more:hover {
      color: var(--accent-hover);
    }
    .source {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .btn-clear {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-top: 0.5rem;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-clear:hover {
      background: var(--accent);
      color: var(--bg-main);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }
    /* Simple CSS reset/scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: var(--bg-panel); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .filters {
        flex: none;
        width: 100%;
        position: static;
        box-sizing: border-box;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-container">
    <img src="logo.jpg" alt="TAP Logo" class="logo-img" onerror="this.style.display='none'">
    <div class="logo-text" aria-label="Monitoramento Mídia Internacional | Global Media Monitoring"><span class="title-light">Monitoramento Mídia</span><span class="title-accent">Internacional</span><span class="title-separator">|</span><span class="title-light">Global Media</span><span class="title-accent">Monitoring</span></div>
  </div>
  <div class="date-badge">25/07/2026</div>
</header>

<div class="container">
  <aside class="filters">
    <div class="filter-group">
      <label for="search">Busca / Search</label>
      <input type="text" id="search" placeholder="Palavra-chave...">
    </div>
    
    <div class="filter-group">
      <label for="lang">Idioma / Language</label>
      <select id="lang">
        <option value="pt">Português (PT-BR)</option>
        <option value="en">English (US)</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="country">País / Country</label>
      <select id="country">
        <option value="all">Todos / All</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="category">Categoria / Category</label>
      <select id="category">
        <option value="all">Todas / All</option>
      </select>
    </div>
    
    <button id="clear-filters" class="btn-clear">Limpar / Clear</button>
  </aside>

  <main class="results">
    <div class="results-header">
      <h2 style="margin: 0; font-size: 1.5rem; color: #fff;">Resultados</h2>
      <span class="results-count" id="count">0 notícias</span>
    </div>
    <div class="news-grid" id="grid">
      <!-- Injected by JS -->
    </div>
  </main>
</div>

<script>
  // Injeta os dados originais no frontend
  const data = [{"fonte":"O GLOBO","pais":"Brasil","titulo":"Impedimento semiautomático no Brasileirão: oito perguntas para entender a nova tecnologia","resumo":"O Campeonato Brasileiro introduz a tecnologia de impedimento semiautomático para aumentar a precisão da arbitragem. A ferramenta promete reduzir o tempo de paralisação nas partidas e oferecer decisões mais rápidas. A implementação marca um avanço importante na digitalização e modernização do futebol profissional no país.","link":"https://oglobo.globo.com/esportes/futebol/noticia/2026/07/24/impedimento-semiautomatico-no-brasileirao-oito-perguntas-para-entender-a-nova-tecnologia-que-estreia-neste-sabado.ghtml","categoria":"TECNOLOGIA ESPORTIVA","lang":"pt"},{"fonte":"Jornal da Unicamp","pais":"Brasil","titulo":"Tecnologia usa CO2 para secar bagaço da cana-de-açúcar","resumo":"Pesquisadores brasileiros desenvolveram um método inovador que utiliza dióxido de carbono para otimizar a secagem do bagaço de cana em usinas. Essa tecnologia aumenta a eficiência do processo industrial e contribui para a sustentabilidade do setor sucroenergético. A solução destaca o papel do Brasil na criação de inovações agrícolas.","link":"https://jornal.unicamp.br/noticias/2026/07/24/tecnologia-usa-co2-para-secar-bagaco-da-cana-de-acucar/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Brasil 247","pais":"Brasil","titulo":"Lula destaca R$ 55 bilhões para ciência e mira 2% do PIB até 2034","resumo":"O governo federal anunciou um robusto investimento de R$ 55 bilhões voltado ao fortalecimento do setor científico nacional. A meta estratégica é elevar o gasto em pesquisa e desenvolvimento para 2% do PIB brasileiro até 2034. A iniciativa busca retomar o protagonismo do país em inovações tecnológicas globais.","link":"https://www.brasil247.com/brasilia/lula-destaca-r-55-bilhoes-para-ciencia-e-mira-2-do-pib-ate-2034/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Auto+ TV","pais":"Brasil","titulo":"O mecânico do futuro já chegou: IA, tecnologia e capacitação transformam as oficinas","resumo":"A integração de Inteligência Artificial e novas ferramentas diagnósticas está revolucionando o cotidiano das oficinas mecânicas no Brasil. Profissionais do setor buscam capacitação constante para lidar com a crescente complexidade tecnológica dos veículos modernos. Essa transição digital é essencial para manter a competitividade e a qualidade dos serviços prestados.","link":"https://www.automaistv.com.br/servico/o-mecanico-do-futuro-ja-chegou-ia-tecnologia-e-capacitacao-transformam-as-oficinas/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Prefeitura de Catalão","pais":"Brasil","titulo":"Catalão inaugura tecnologia inédita e assume posição de destaque na saúde digital no SUS","resumo":"A cidade de Catalão implementou um sistema tecnológico pioneiro para melhorar o atendimento na rede pública de saúde. A novidade visa otimizar a gestão de pacientes e agilizar diagnósticos, servindo como modelo de transformação digital para o SUS. O projeto reforça a importância da tecnologia na eficiência do setor público.","link":"https://catalao.go.gov.br/noticias/saude/catalao-inaugura-tecnologia-inedita-e-assume-posicao-de-destaque-na-saude-digital-no-sus","categoria":"SAÚDE DIGITAL","lang":"pt"},{"fonte":"NBC News","pais":"Brasil","titulo":"Brasil usa ciência forense para rastrear ouro e combater o garimpo ilegal na Amazônia","resumo":"O Brasil está aplicando técnicas avançadas de ciência forense para identificar a origem exata do ouro explorado na região amazônica. A medida visa intensificar o combate ao garimpo ilegal, bloqueando a circulação de minério extraído de áreas protegidas. A tecnologia é uma aliada fundamental na preservação ambiental e na fiscalização rigorosa.","link":"https://www.nbcnews.com/world/brazil/brazil-uses-forensic-science-trace-golds-origin-tackle-illegal-mining-rcna589152","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Globo","pais":"Brasil","titulo":"Esta startup diz fazer plantas crescerem mais rápido usando som","resumo":"Uma startup brasileira aposta em tecnologia acústica para estimular o crescimento acelerado de plantas através de frequências sonoras específicas. O método inovador busca aumentar a produtividade no agronegócio de forma sustentável, reduzindo a necessidade de insumos químicos. A solução atraiu atenção por seu potencial disruptivo no campo.","link":"https://revistagalileu.globo.com/google/amp/tecnologia/noticia/2026/07/esta-startup-diz-fazer-plantas-crescerem-mais-rapido-usando-som.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Jornal da USP","pais":"Brasil","titulo":"Falta de investimento na ciência e impactos ambientais aumentam o risco de novas pandemias","resumo":"Especialistas alertam que a escassez de recursos voltados à pesquisa científica, aliada a danos ambientais severos, eleva a vulnerabilidade do Brasil a futuras pandemias. O estudo enfatiza que a vigilância sanitária depende diretamente do fortalecimento dos centros de tecnologia e biotecnologia. A ciência é apontada como a principal defesa estratégica para mitigar riscos biológicos.","link":"https://jornal.usp.br/radio-usp/falta-de-investimento-na-ciencia-e-impactos-ambientais-aumentam-o-risco-de-novas-pandemias/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Motley Fool","pais":"Estados Unidos","titulo":"Melhor compra de Inteligência Artificial (IA): Micron Technology vs. Sandisk","resumo":"Esta análise técnica compara a Micron Technology e a Sandisk no contexto da crescente demanda por hardware voltado à IA. O artigo avalia o posicionamento de mercado de ambas as gigantes de semicondutores, destacando qual delas apresenta maior potencial de retorno para investidores focados em tecnologia de ponta e infraestrutura de dados.","link":"https://www.fool.com/investing/2026/07/25/better-artificial-intelligence-ai-buy-micron-techn/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"NeuroNews International","pais":"Estados Unidos","titulo":"Tecnologia de imagem portátil para AVC da Wellumio recebe investimento de US$ 9,75 milhões","resumo":"A startup Wellumio captou quase 10 milhões de dólares para escalar sua tecnologia inovadora de diagnóstico de AVC. O dispositivo portátil promete revolucionar o atendimento de emergência, permitindo que exames de imagem cruciais sejam realizados rapidamente fora de ambientes hospitalares tradicionais, aumentando as chances de sobrevivência dos pacientes.","link":"https://neuronewsinternational.com/wellumios-portable-stroke-imaging-technology-gets-us9-75-million-funding-boost/","categoria":"SAÚDE TEC","lang":"pt"},{"fonte":"Times Brasil | CNBC","pais":"Estados Unidos","titulo":"Projeto militar dos EUA une tecnologia de defesa com Israel e abre debate sobre soberania","resumo":"Uma nova parceria estratégica entre EUA e Israel integra sistemas de defesa avançados, gerando discussões intensas sobre geopolítica e soberania tecnológica. A colaboração levanta questões críticas sobre a dependência militar compartilhada e o desenvolvimento conjunto de tecnologias sensíveis em um cenário global instável.","link":"https://timesbrasil.com.br/mundo/projeto-militar-eua-une-tecnologia-defesa-com-israel/","categoria":"DEFESA","lang":"pt"},{"fonte":"Forbes","pais":"Estados Unidos","titulo":"Cientistas descobrem o quarto câncer transmissível conhecido pela ciência","resumo":"Pesquisadores identificaram uma nova forma de câncer transmissível, representando uma descoberta significativa para a biologia e a medicina veterinária. O estudo busca compreender os mecanismos de propagação dessa mutação celular incomum, oferecendo novos insights sobre a evolução do câncer e potenciais métodos de contenção em diferentes espécies.","link":"https://www.forbes.com/sites/johndrake/2026/07/24/scientists-discover-the-fourth-transmissible-cancer-known-to-science/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Yahoo Finance","pais":"Estados Unidos","titulo":"Microchip Technology assina acordo definitivo para adquirir a Hailo","resumo":"Em um movimento estratégico para reforçar sua presença em IA de borda, a Microchip Technology oficializou a compra da Hailo. A integração visa combinar a vasta expertise da Microchip em microcontroladores com a tecnologia de processamento de redes neurais da Hailo, acelerando a inovação em dispositivos autônomos e integrados.","link":"https://finance.yahoo.com/technology/ai/articles/microchip-technology-signs-definitive-agreement-201500110.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Popular Science","pais":"Estados Unidos","titulo":"Sal fundido nuclear pode alimentar futuros navios de carga","resumo":"Pesquisadores estão investigando o uso de reatores de sal fundido como uma alternativa energética limpa e eficiente para o transporte marítimo global. Esta tecnologia promete reduzir drasticamente a emissão de carbono da indústria naval, oferecendo uma fonte de energia compacta e de alta densidade capaz de sustentar longas viagens transoceânicas.","link":"https://www.popsci.com/technology/nuclear-powered-cargo-ships-salt/","categoria":"ENERGIA","lang":"pt"},{"fonte":"ScienceDaily","pais":"Estados Unidos","titulo":"IA ajuda cientistas de Stanford a descobrir “Ozempic natural” sem efeitos colaterais","resumo":"Utilizando algoritmos de inteligência artificial, pesquisadores da Universidade de Stanford identificaram um composto natural com efeitos similares aos do Ozempic, porém com um perfil de segurança superior. A descoberta abre caminho para novos tratamentos metabólicos, reduzindo drasticamente os efeitos colaterais comumente associados a terapias farmacológicas atuais.","link":"https://www.sciencedaily.com/releases/2026/07/260719230608.htm","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Tek Notícias","pais":"Estados Unidos","titulo":"AMD coloca a tecnologia 3D V-Cache ao alcance de mais jogadores com o novo Ryzen 7 7700X3D","resumo":"A AMD expandiu sua linha de processadores de alto desempenho ao lançar o Ryzen 7 7700X3D, integrando a tecnologia 3D V-Cache em um segmento mais acessível. O lançamento visa otimizar o desempenho em jogos complexos, democratizando o acesso a arquiteturas de memória avançadas que antes eram exclusivas de modelos entusiastas de alto custo.","link":"https://tek.sapo.pt/noticias/computadores/artigos/amd-coloca-a-tecnologia-3d-v-cache-ao-alcance-de-mais-jogadores-com-o-novo-ryzen-7-7700x3d/","categoria":"HARDWARE","lang":"pt"},{"fonte":"IsraelValley","pais":"França","titulo":"Na economia da IA, a propriedade intelectual tornou-se um desafio estratégico.","resumo":"A ascensão da inteligência artificial transformou a propriedade intelectual em um ativo crítico para empresas e nações. O debate gira em torno da proteção de inovações e do uso de dados em modelos complexos. Este cenário define as novas regras de competição e segurança jurídica no mercado tecnológico global.","link":"https://israelvalley.com/2026/07/25/dans-leconomie-de-lia-la-propriete-intellectuelle-est-devenue-un-enjeu-strategique/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Sciencepost","pais":"França","titulo":"Um edital para reforçar as capacidades da França e da Europa no setor de semicondutores!","resumo":"A França e a União Europeia lançaram um novo programa para impulsionar a soberania tecnológica no setor estratégico de chips. O investimento visa reduzir a dependência externa e fortalecer a infraestrutura local de fabricação. A medida é essencial para garantir a competitividade industrial diante da crise global de componentes.","link":"https://sciencepost.fr/un-appel-a-projets-pour-renforcer-les-capacites-de-la-france-et-de-leurope-dans-le-domaine-des-semi-conducteurs/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Pour la Science","pais":"França","titulo":"Por que programar permanece, acima de tudo, um prazer, mesmo na era da IA","resumo":"Apesar do avanço das ferramentas de automação e codificação por IA, o ato de programar mantém seu valor intrínseco como forma de expressão criativa. O artigo reflete sobre como a resolução de problemas lógicos continua sendo uma habilidade humana fundamental. A tecnologia atua como suporte, sem substituir a paixão pelo desenvolvimento de software.","link":"https://www.pourlascience.fr/sr/redresseur-de-code/programmer-c-est-d-abord-un-plaisir-29423.php","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"tv5monde","pais":"França","titulo":"Teste bem-sucedido do megafoguete Starship, o primeiro desde a entrada da SpaceX na Bolsa","resumo":"O teste do Starship marca um avanço significativo para a exploração espacial comercial realizada pela SpaceX. Este sucesso técnico é especialmente relevante para o mercado, dado que é a primeira missão desde a movimentação financeira da empresa na bolsa. O feito impulsiona as expectativas para missões tripuladas e logísticas ao espaço.","link":"https://information.tv5monde.com/science/test-reussi-de-la-megafusee-starship-le-premier-depuis-lentree-en-bourse-de-spacex-2831371","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Boursorama","pais":"França","titulo":"Nvidia, Microsoft e outros gigantes da tecnologia apoiam modelos de IA de código aberto","resumo":"Grandes players da tecnologia estão unindo forças para fomentar o ecossistema de inteligência artificial baseada em código aberto. A estratégia visa democratizar o acesso às ferramentas de desenvolvimento enquanto estabelece padrões de segurança e colaboração. Esse movimento altera a dinâmica de mercado, tradicionalmente dominada por soluções proprietárias e fechadas.","link":"https://www.boursorama.com/bourse/actualites-amp/nvidia-microsoft-et-d-autres-geants-de-la-technologie-soutiennent-les-modeles-d-ia-open-source-9af722be0702a9b14f16b33786e8cf3c","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Border Counties Advertizer","pais":"Inglaterra","titulo":"Severn Trent convida moradores a aprender sobre tecnologia de monitoramento da saúde dos rios","resumo":"A empresa Severn Trent está promovendo iniciativas educativas para que a população local compreenda o funcionamento das novas tecnologias usadas na preservação hídrica. A ação visa aumentar a transparência e o engajamento comunitário em relação ao monitoramento ambiental de rios na Inglaterra, utilizando ferramentas digitais avançadas para detectar mudanças na qualidade da água em tempo real.","link":"https://www.bordercountiesadvertizer.co.uk/news/26408204.severn-trent-uses-technology-river-health-monitoring/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"UK Parliament","pais":"Inglaterra","titulo":"Fechar departamento de ciência e tecnologia pode fragmentar áreas vitais de políticas, diz presidente do comitê","resumo":"Especialistas alertam que a possível desativação do departamento especializado em ciência e tecnologia pode prejudicar a coesão das estratégias nacionais de inovação. A preocupação central é que a fragmentação dessas políticas dificulte a execução de projetos críticos e o avanço tecnológico do país, exigindo uma reavaliação estratégica por parte do governo para manter a eficiência operacional.","link":"https://committees.parliament.uk/committee/135/science-innovation-and-technology-committee/news/217262/closing-science-and-technology-department-risks-fragmenting-vital-policy-areas-says-committee-chair/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Research Professional News","pais":"Inglaterra","titulo":"Chris McDonald será o ministro da ciência do Reino Unido, afirma sede do Partido Trabalhista","resumo":"O Partido Trabalhista confirmou a nomeação de Chris McDonald para liderar a pasta de Ciência e Tecnologia no Reino Unido. Esta mudança no alto escalão governamental sinaliza uma nova direção para a estratégia de inovação e pesquisa científica do país, com expectativas focadas na atração de investimentos e no fortalecimento da colaboração entre o setor acadêmico e a indústria tecnológica.","link":"https://www.researchprofessionalnews.com/rr-news-uk-politics-2026-7-chris-mcdonald-in-frame-to-be-uk-science-minister/","categoria":"POLÍTICA TEC","lang":"pt"},{"fonte":"COPE","pais":"Espanha","titulo":"O mar às cegas já é possível em Tarragona: a tecnologia que guia banhistas com deficiência visual","resumo":"Uma nova solução tecnológica foi implementada nas praias de Tarragona para proporcionar acessibilidade a pessoas com deficiência visual. O sistema oferece orientação precisa durante o banho de mar, promovendo inclusão social e autonomia. Esta inovação representa um avanço significativo no uso de tecnologia assistiva em espaços públicos litorâneos na Espanha.","link":"https://www.cope.es/emisoras/catalunya/tarragona-provincia/tarragona/noticias/mar-ciegas-posible-tarragona-tecnologia-guia-banistas-discapacidad-visual-20260725_3409799.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"La Razón","pais":"Espanha","titulo":"Nem a inteligência artificial conseguiu: matemática de 99 anos resolve um enigma centenário","resumo":"Uma proeza intelectual surpreendente ocorreu quando uma matemática de 99 anos resolveu um problema que desafiava a comunidade científica há cem anos. O caso destaca que, apesar do rápido avanço da inteligência artificial, o pensamento crítico humano ainda alcança soluções complexas. Esta descoberta marca um momento histórico para a matemática moderna e a dedução lógica.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/inteligencia-artificial-consiguio-matematica-99-anos-resuelve-enigma-centenario_202607256a6445224687a22bdeccbc27.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"EL PAÍS","pais":"Espanha","titulo":"Quando a inteligência artificial testa o Pacto Verde Europeu","resumo":"A ascensão rápida da inteligência artificial está gerando um dilema energético e regulatório para a União Europeia. O alto consumo de eletricidade dos data centers coloca em xeque as metas de sustentabilidade do Pacto Verde. O debate atual foca em como conciliar o desenvolvimento tecnológico acelerado com os compromissos climáticos rígidos do bloco europeu.","link":"https://elpais.com/tecnologia/2026-07-25/cuando-la-inteligencia-artificial-pone-a-prueba-el-pacto-verde-europeo.html","categoria":"TRENDING TOPICS","lang":"pt"},{"fonte":"The Objective","pais":"Espanha","titulo":"Alerta na espionagem: os Estados Unidos voltaram a nos vender tecnologia adulterada?","resumo":"Surgiram novos alertas preocupantes sobre a possível comercialização de equipamentos tecnológicos dos Estados Unidos contendo vulnerabilidades propositais. Especialistas em segurança digital estão investigando a integridade dos componentes importados para evitar riscos de espionagem. Este caso levanta discussões críticas sobre a soberania tecnológica e a confiança nas cadeias de suprimentos globais.","link":"https://theobjective.com/espana/2026-07-25/alerta-espionaje-estados-unidos-tecnologia-trucada/","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"Infobae","pais":"Espanha","titulo":"Desenvolvem a tecnologia que poderá tornar as futuras redes 6G mais seguras, eficientes e precisas","resumo":"Pesquisadores anunciaram um avanço fundamental na infraestrutura de conectividade para viabilizar as futuras redes 6G. A nova tecnologia promete aumentar drasticamente a precisão na transmissão de dados, reduzindo latências e fortalecendo protocolos de segurança cibernética. Este desenvolvimento coloca o setor de telecomunicações em um novo patamar de desempenho global.","link":"https://www.infobae.com/tecno/2026/07/25/desarrollan-la-tecnologia-que-podria-hacer-mas-seguras-eficientes-y-precisas-las-futuras-redes-6g/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"La Verdad","pais":"Espanha","titulo":"A UCAM amplia sua oferta com o curso de Ciência de Dados e quatro mestrados","resumo":"A Universidade Católica de Múrcia (UCAM) reforçou seu compromisso com a educação tecnológica ao expandir sua grade curricular acadêmica. A inclusão do curso de Ciência de Dados e novos mestrados visa suprir a alta demanda por profissionais capacitados no mercado atual. Esta medida fortalece o ecossistema de educação superior voltado para habilidades digitais na Espanha.","link":"https://www.laverdad.es/murcia/cartagena/ucam-amplia-oferta-grado-ciencia-datos-cuatro-20260725014620-nt.html","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"Hosteltur, noticias de turismo","pais":"Espanha","titulo":"Nove hotéis da Sercotel tornam-se laboratórios de inovação","resumo":"A rede hoteleira Sercotel transformou nove de suas unidades em espaços dedicados ao teste de novas tecnologias. A iniciativa busca digitalizar a experiência do hóspede e otimizar processos operacionais através de soluções inovadoras desenvolvidas in loco. O projeto destaca a tendência de transformação digital crescente no setor de turismo e hotelaria.","link":"https://www.hosteltur.com/177666_nueve-hoteles-de-sercotel-se-convierten-en-laboratorios-de-innovacion.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"ciencia.gob.es","pais":"Espanha","titulo":"Diana Morant exalta o talento de Elche como motor do setor espacial","resumo":"A ministra Diana Morant destacou o papel fundamental da cidade de Elche no desenvolvimento da indústria aeroespacial espanhola. O polo tecnológico local tem se consolidado como um hub vital de inovação e engenharia de ponta no país. O reconhecimento reforça a importância dos investimentos em ciência e tecnologia para o crescimento econômico regional.","link":"https://www.ciencia.gob.es/Noticias/2026/julio/Morant-visita-instalaciones-EMXYS-Elche.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"FinanzNachrichten.de","pais":"Alemanha","titulo":"Por que a computação quântica pode se tornar a próxima tecnologia estratégica da OTAN","resumo":"A computação quântica emerge como um pilar crítico para a segurança global, influenciando capacidades defensivas e de inteligência. A análise explora como a OTAN pode integrar essas tecnologias avançadas para manter a superioridade estratégica frente a novos desafios geopolíticos e ameaças cibernéticas.","link":"https://www.finanznachrichten.de/nachrichten-2026-07/69122472-warum-quantencomputing-zur-naechsten-strategischen-technologie-der-nato-werden-koennte-176.htm","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Spiegel","pais":"Alemanha","titulo":"Opinião: Donald Trump causa danos enormes com sua política de IA","resumo":"O artigo discute as consequências negativas das diretrizes de inteligência artificial propostas por Donald Trump. O autor argumenta que tais políticas podem desestabilizar o desenvolvimento ético e seguro da tecnologia, gerando impactos profundos na governança global e na inovação tecnológica futura.","link":"https://www.spiegel.de/netzwelt/donald-trumps-ki-politik-macht-das-netz-fuer-alle-unsicherer-kommentar-a-17a7f892-b30e-4366-92b0-c21201452ae8","categoria":"POLÍTICA TECNOLÓGICA","lang":"pt"},{"fonte":"BR","pais":"Alemanha","titulo":"IQ - Ciência e Pesquisa: Pesquisar na rede – A IA muda tudo?","resumo":"O conteúdo investiga como a inteligência artificial está transformando fundamentalmente a forma como buscamos informações e realizamos pesquisas na internet. O impacto na educação, na ciência e no acesso ao conhecimento é debatido para entender se a mudança é evolutiva ou disruptiva.","link":"https://www.br.de/radio/bayern2/sendungen/iq-wissenschaft-und-forschung/pc-iq-suchen-im-netz-aendert-ki-alles-100.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Terra","pais":"Alemanha","titulo":"Ações europeias sobem com grupo SAP impulsionando setor de tecnologia","resumo":"O mercado acionário europeu apresenta alta, impulsionado pelo desempenho robusto da gigante de software SAP. O movimento reflete o otimismo dos investidores com o setor de tecnologia, que continua sendo um motor fundamental para a valorização das bolsas e o crescimento econômico regional.","link":"https://www.terra.com.br/economia/acoes-europeias-sobem-com-grupo-sap-impulsionando-setor-de-tecnologia,e0cff110c481188693309e9ddd7da6d2w2wjhohe.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Mobilidade do futuro: A condução autônoma pode ser o motor da mudança estrutural?","resumo":"A análise examina o potencial dos veículos autônomos como catalisadores de transformações profundas na infraestrutura urbana e na economia. Além de avanços técnicos, o texto debate como a implementação dessa tecnologia pode redefinir o transporte público e privado na Alemanha.","link":"https://www.sueddeutsche.de/wirtschaft/mobilitaet-der-zukunft-kann-autonomes-fahren-zum-motor-des-strukturwandels-werden-dpa.urn-newsml-dpa-com-20090101-260725-930-435499","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Energias renováveis: Sistemas solares de varanda têm queda de preços e aumento rápido de desempenho","resumo":"O mercado de energia solar residencial na Alemanha passa por uma fase de expansão, com kits de varanda se tornando mais eficientes e acessíveis. Essa tendência democratiza o uso de energia limpa, permitindo que consumidores reduzam custos e contribuam ativamente para a transição energética.","link":"https://www.sueddeutsche.de/wirtschaft/erneuerbare-energien-balkonsolaranlagen-preise-sinken-leistung-steigt-rasant-dpa.urn-newsml-dpa-com-20090101-260725-930-435481","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Fabricantes de baterias em crise: Especialista sobre a Varta: 'Um golpe para a indústria de baterias'","resumo":"A crise na fabricante alemã Varta evidencia as dificuldades enfrentadas pela indústria de baterias na Europa frente à concorrência global. Especialistas avaliam que esse cenário representa um obstáculo significativo para a soberania tecnológica e a cadeia de suprimentos de veículos elétricos.","link":"https://www.sueddeutsche.de/wirtschaft/batteriehersteller-in-krise-batterieexperte-zu-varta-schlag-fuer-die-batterieindustrie-dpa.urn-newsml-dpa-com-20090101-260725-930-435455","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Revistacarros","pais":"Alemanha","titulo":"Mercedes prepara estreia do novo GLA com mais tecnologia","resumo":"A Mercedes-Benz aposta na integração de novos recursos tecnológicos para a atualização do modelo GLA, buscando manter sua competitividade no mercado de luxo. A estratégia foca na experiência do usuário através de sistemas de infoentretenimento aprimorados e maior conectividade interna.","link":"https://www.revistacarros.pt/mercedes-prepara-estreia-do-novo-gla-com-mais-tecnologia/","categoria":"LANÇAMENTO","lang":"pt"},{"fonte":"Boursorama","pais":"Japão","titulo":"Empresas sul-coreanas SK Hynix e Samsung Electronics assinam parceria de 950 bilhões de dólares","resumo":"As gigantes sul-coreanas de semicondutores, SK Hynix e Samsung Electronics, estabeleceram uma parceria estratégica monumental avaliada em 950 bilhões de dólares. Este acordo visa fortalecer a cadeia de suprimentos global de tecnologia e impulsionar a inovação em memórias de última geração. O movimento reforça a liderança asiática no setor de hardware e promete transformar o panorama competitivo da indústria tecnológica mundial nos próximos anos.","link":"https://www.boursorama.com/bourse/actualites-amp/les-societes-sud-coreennes-sk-hynix-et-samsung-electronics-signent-un-partenariat-de-950-milliards-de-dollars-avec-les-geants-americains-de-la-technologie-95eb24e81ca49a29e75d359bbe60fb4d","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"Nova tecnologia de microbolhas: Lançamento do chuveiro 'Mirable Ex'","resumo":"A empresa Science anunciou o lançamento do 'Mirable Ex', um chuveiro que representa o ápice de duas décadas de pesquisa em tecnologia de microbolhas. O produto foca na qualidade dos materiais e em uma limpeza superior, sendo inteiramente desenvolvido no Japão. A inovação promete elevar o padrão de cuidados pessoais e higiene doméstica através de engenharia avançada de fluxo de água.","link":"https://prtimes.jp/main/html/rd/p/000000091.000098081.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"株式会社エクサウィザーズ","pais":"Japão","titulo":"O desemprego em massa causado pela IA ainda não vai ocorrer, diz chefe de pesquisa econômica da Anthropic","resumo":"Segundo o chefe de pesquisa econômica da Anthropic, os temores de desemprego em massa imediato devido à Inteligência Artificial são prematuros. Embora a tecnologia esteja evoluindo rapidamente, o impacto no mercado de trabalho requer adaptação estrutural e tempo. A análise sugere que a IA servirá mais como uma ferramenta de produtividade do que como um substituto total da força de trabalho humana no curto prazo.","link":"https://exawizards.com/column/ai-trend/news-07-25-2026-2/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"ArchDaily","pais":"Japão","titulo":"Galeria da Praça do Instituto de Tecnologia de Kanagawa por Junya Ishigami + Associados","resumo":"O projeto da Galeria da Praça do Instituto de Tecnologia de Kanagawa destaca a arquitetura contemporânea japonesa através de um design inovador. Liderado por Junya Ishigami, o espaço integra tecnologia estrutural com uma estética minimalista e funcional. Esta obra é reconhecida por sua capacidade de fundir o ambiente acadêmico com a criatividade artística, estabelecendo um novo marco na arquitetura tecnológica.","link":"https://www.archdaily.com/pt/956144/praca-do-instituto-de-tecnologia-de-kanagawa-junya-ishigami-plus-associates/5ffbe25463c017e16200022c-plaza-of-kanagawa-institute-of-technology-junya-ishigami-plus-associates-image","categoria":"ARQUITETURA","lang":"pt"},{"fonte":"東京新聞デジタル","pais":"Japão","titulo":"Província de Chiba, Instituto de Ciência de Tóquio e NAA firmam acordo para criar polo de ciências da vida","resumo":"Uma nova colaboração estratégica foi estabelecida entre a Província de Chiba, o Instituto de Ciência de Tóquio e a NAA para transformar a área ao redor do Aeroporto de Narita em um hub de ciências da vida. O objetivo é atrair empresas do setor de saúde e biotecnologia, impulsionando a pesquisa e o desenvolvimento industrial. Esta iniciativa promete fortalecer o ecossistema japonês de inovação em saúde e atrair talentos globais.","link":"https://www.tokyo-np.co.jp/article/503592","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Microsoft e NVIDIA se posicionam contra a regulamentação do modelo de IA 'aberto'","resumo":"Gigantes tecnológicas como Microsoft e NVIDIA emitiram uma declaração conjunta oposta à regulamentação restritiva de modelos de IA de código aberto. As empresas argumentam que tais controles podem sufocar a inovação tecnológica e prejudicar o progresso científico. O debate coloca em pauta o equilíbrio necessário entre a segurança da IA e o fomento ao desenvolvimento tecnológico descentralizado globalmente.","link":"https://www.nikkei.com/article/DGXZQOGN24BQB0U6A720C2000000/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Globo","pais":"Japão","titulo":"Nova espécie de aranha com 'rosto feliz' é descoberta na Ásia","resumo":"Cientistas identificaram uma nova espécie de aranha na Ásia que apresenta um padrão peculiar no abdômen, lembrando uma expressão facial sorridente. A descoberta chama a atenção da comunidade biológica e entusiastas, destacando a biodiversidade única da região. Este achado fornece novos dados para estudos entomológicos e ressalta a complexidade dos padrões evolutivos na adaptação de aracnídeos em diversos habitats.","link":"https://revistagalileu.globo.com/ciencia/noticia/2026/07/nova-especie-de-aranha-com-carinha-feliz-e-descoberta-na-asia-veja-fotos.ghtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Gasgoo","pais":"China","titulo":"Seeds | Jinglianwen Technology, uma das \"Oito Novas Jun\" de Hangzhou, arrecada quase 100 milhões de yuans","resumo":"A startup de tecnologia Jinglianwen consolidou sua posição no mercado de inovação de Hangzhou ao captar um aporte significativo de 100 milhões de yuans. Este investimento reforça o crescimento acelerado da empresa e sua influência crescente no ecossistema tecnológico chinês, prometendo expandir suas soluções digitais de ponta para novos mercados.","link":"https://autonews.gasgoo.com/articles/news/seeds-one-of-the-new-eight-jun-of-hangzhou-jinglianwen-technology-raises-another-nearly-100-million-yuan-2080910173831929857","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"中国科技网","pais":"China","titulo":"Pesquisa na China: Quando a IA chega aos laboratórios, cientistas ganham \"superpoderes\"","resumo":"A integração de assistentes inteligentes baseados em Inteligência Artificial em laboratórios chineses está revolucionando o fluxo de trabalho científico. Com o suporte de agentes digitais, pesquisadores conseguem automatizar experimentos complexos e processar dados em velocidades sem precedentes, acelerando drasticamente o ciclo de descoberta científica no país.","link":"https://www.stdaily.com/web/gdxw/2026-07/25/content_553567.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"经济频道","pais":"China","titulo":"Receita da indústria digital da China atinge 39,6 trilhões de yuans em 2025","resumo":"O setor digital chinês apresentou um desempenho impressionante em 2025, totalizando uma receita colossal de quase 40 trilhões de yuans. Este crescimento reflete a transformação estrutural da economia do país, impulsionada por investimentos massivos em infraestrutura tecnológica, economia de dados e digitalização industrial em larga escala.","link":"https://jingji.cctv.com/2026/07/25/ARTIm0cQ0iUt6xGbW41Jm1vG260725.shtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"cb.com.cn","pais":"China","titulo":"Pequim intensifica a economia de tokens: apoio à criação de \"fábricas de palavras\" e vouchers","resumo":"O governo de Pequim lançou novas diretrizes para fortalecer a economia de tokens, incentivando a criação de infraestruturas voltadas à geração e gestão de ativos digitais. A iniciativa visa explorar a emissão de vouchers baseados em tokens, posicionando a capital chinesa como um polo experimental para tecnologias financeiras e blockchain.","link":"http://www.cb.com.cn/index/show/kx/cv/cv135731471557","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"TV BRICS","pais":"China","titulo":"Nova tecnologia chinesa de clonagem de arroz híbrido pode fortalecer segurança alimentar global","resumo":"Cientistas chineses desenvolveram uma técnica inovadora de clonagem para arroz híbrido, que promete aumentar a eficiência na produção agrícola mundial. Esta tecnologia permite estabilizar características produtivas essenciais, oferecendo uma solução robusta para enfrentar os desafios crescentes da segurança alimentar e a escassez de recursos em diversas regiões do globo.","link":"https://tvbrics.com/pt/news/nova-tecnologia-chinesa-de-clonagem-de-arroz-hibrido-pode-fortalecer-seguranca-alimentar-global/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Globo","pais":"China","titulo":"Vídeo raro flagra raios atingindo foguete chinês durante lançamento; assista","resumo":"Imagens capturadas durante uma missão espacial chinesa flagraram um fenômeno natural raro e impressionante: um raio atingindo o foguete logo após a decolagem. O vídeo tornou-se um fenômeno nas redes sociais e levantou debates sobre a resiliência estrutural das naves espaciais modernas diante de condições climáticas extremas durante o lançamento.","link":"https://revistagalileu.globo.com/google/amp/ciencia/noticia/2026/07/video-raro-flagra-raios-atingindo-foguete-chines-durante-lancamento-assista.ghtml","categoria":"TRENDING TOPICS","lang":"pt"},{"fonte":"新京报","pais":"China","titulo":"Cidade da Ciência de Huairou cria modelo de demonstração para a integração de \"IA para a Ciência\"","resumo":"A Cidade da Ciência de Huairou está estabelecendo um novo padrão ao fundir a inteligência artificial com pesquisas científicas avançadas. Este projeto piloto visa criar um ecossistema onde algoritmos de IA resolvem problemas complexos em áreas como física e materiais, servindo como uma vitrine de inovação tecnológica de alto nível para toda a China.","link":"https://www.bjnews.com.cn/detail/1784883257129801.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"PR Newswire","pais":"China","titulo":"Avanço tecnológico: tecnologias da Niutech para recuperação de rejeitos minerais impulsionam o setor global","resumo":"A empresa chinesa Niutech desenvolveu equipamentos avançados para a redução e enriquecimento de rejeitos de titânio e ferro, transformando resíduos industriais em recursos valiosos. Essa inovação tecnológica não apenas melhora a eficiência do setor mineral chinês, mas também promove a sustentabilidade e a recuperação de matérias-primas estratégicas em escala global.","link":"https://www.prnewswire.com/news-releases/technologischer-durchbruch--niutechs-technologie-und-anlagen-zur-reduzierung-und-anreicherung-von-titan-eisen-bergeabfallen-fordern-die-weltweite-ruckgewinnung-strategischer-mineralischer-rohstoffe-302834536.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ET CIO","pais":"Índia","titulo":"DRAIPL expande setor de tecnologia e nomeia Tapan Sharma como CEO","resumo":"A empresa de infraestrutura DRAIPL anunciou uma expansão estratégica para o setor de tecnologia, visando diversificar suas operações. Com a nomeação de Tapan Sharma como CEO da nova divisão, a organização busca capitalizar em soluções digitais e inovação. Esta mudança reflete a crescente tendência de empresas tradicionais indianas investindo pesado em capacidades tecnológicas para liderar mercados emergentes.","link":"https://cio.economictimes.indiatimes.com/news/corporate-news/draipl-appoints-tapan-sharma-as-ceo-to-accelerate-technology-business-expansion/132619417?utm_source=portal_category_widget&utm_medium=homepage","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"The New Indian Express","pais":"Índia","titulo":"Karnataka construirá o primeiro Museu de Inovação, Startups e Tecnologia da Índia em Bengaluru","resumo":"O estado de Karnataka anunciou a criação do primeiro museu dedicado exclusivamente à inovação e ao ecossistema de startups em Bengaluru. A iniciativa visa preservar a trajetória tecnológica da região e inspirar a próxima geração de empreendedores indianos. O projeto destaca o papel central de Bengaluru como um hub global de desenvolvimento científico e avanços digitais.","link":"https://www.newindianexpress.com/states/karnataka/2026/Jul/25/karnataka-to-build-indias-first-museum-of-innovation-startups-technology-in-bengaluru","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Jornal de Notícias","pais":"Portugal","titulo":"Festival de Ciência e entrada gratuita no Pavilhão do Conhecimento","resumo":"O Pavilhão do Conhecimento promove um festival dedicado à ciência com acesso livre ao público. O evento visa democratizar o conhecimento científico, proporcionando experiências interativas para visitantes de todas as idades. É uma oportunidade relevante para fomentar a literacia científica em Portugal.","link":"https://www.jn.pt/amp/18109632/festival-de-ciencia-e-entrada-gratis-no-pavilhao-do-conhecimento","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"terranova.pt","pais":"Portugal","titulo":"Fábrica da Ciência dedica sábado à biodiversidade marinha","resumo":"A Fábrica da Ciência organiza uma iniciativa focada na preservação e estudo da biodiversidade dos oceanos. O evento busca conscientizar a comunidade sobre a importância dos ecossistemas marinhos através de atividades educativas. A ação reforça o compromisso da instituição com a divulgação ambiental.","link":"https://terranova.pt/noticias/cultura/fabrica-da-ciencia-em-mais-um-sabado-dedicado-biodiversidade-marinha","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"oRegiões","pais":"Portugal","titulo":"UBI apresenta proposta de ciência, território e inovação no Encontro Ciência e Inovação 2026","resumo":"A Universidade da Beira Interior apresentou estratégias focadas na integração entre desenvolvimento territorial e inovação tecnológica. O projeto destaca a relevância de conectar o interior do país às novas dinâmicas globais de pesquisa científica. Esta proposta visa fortalecer o ecossistema de inovação nacional.","link":"https://oregioes.pt/ubi-apresenta-proposta-sobre-ciencia-territorio-e-inovacao-no-encontro-ciencia-e-inovacao-2026/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Notícias de Coimbra","pais":"Portugal","titulo":"Aeródromo de Castelo Branco escolhido para testar tecnologia aeroespacial","resumo":"O aeródromo de Castelo Branco foi selecionado como local estratégico para realizar testes de tecnologias aeroespaciais avançadas. Esta escolha posiciona a região como um ponto importante para o desenvolvimento do setor tecnológico em Portugal. O projeto promete atrair investimentos e expertise técnica para o território.","link":"https://www.noticiasdecoimbra.pt/aerodromo-de-castelo-branco-escolhido-para-testar-tecnologia-aeroespacial/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Ciberataques via tecnologia NFC contra Android crescem quase 200%","resumo":"Relatórios apontam um aumento alarmante de quase 200% em ataques cibernéticos que exploram a tecnologia NFC em dispositivos Android. Especialistas alertam para a necessidade de maior vigilância do usuário e atualizações constantes de segurança. O impacto exige medidas preventivas rigorosas para proteger dados sensíveis.","link":"https://sapo.pt/artigo/ciberataques-com-tecnologia-nfc-contra-dispositivos-android-subiram-quase-200-6a638e0d9c9f29b5ce5a01ba","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"A voz do Algarve","pais":"Portugal","titulo":"Como a Europa pode alcançar o sucesso em tecnologia e inovação?","resumo":"O debate sobre o futuro tecnológico europeu coloca em foco a necessidade de políticas robustas de investimento e incentivo ao empreendedorismo. Analistas discutem os caminhos para que o continente ganhe competitividade frente aos gigantes globais do setor. A estratégia envolve colaboração entre Estados-membros e setor privado.","link":"https://www.avozdoalgarve.pt/d/como-pode-a-europa-ter-sucesso-na-tecnologia-e-inovacao/96152","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Human Resources Portugal","pais":"Portugal","titulo":"Tecnologia impulsiona a produtividade, mas a capacitação é determinante","resumo":"O uso de ferramentas tecnológicas tem elevado a produtividade das empresas portuguesas de forma significativa. No entanto, o sucesso desta transformação depende crucialmente do investimento na qualificação da mão de obra. A capacitação contínua é apontada como o pilar para sustentar o crescimento econômico.","link":"https://hrportugal.sapo.pt/tecnologia-impulsiona-a-produtividade-das-empresas-mas-a-capacitacao-continua-a-ser-determinante/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Como a tecnologia reinventou um negócio tradicional","resumo":"A adoção de novas soluções digitais permitiu que empresas de setores tradicionais modernizassem suas operações e alcancem novos mercados. O caso demonstra como a transformação tecnológica é essencial para a sobrevivência em um cenário econômico altamente competitivo. A inovação atua como motor de revitalização para modelos de negócio clássicos.","link":"https://sapo.pt/artigo/como-a-tecnologia-reinventou-um-negocio-tradicional-6a63312739564b23da6805be","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Semi-automated offside in the Brasileirão: eight questions to understand the new technology","resumo":"The Brazilian Championship is introducing semi-automated offside technology to improve officiating accuracy. The tool promises to reduce match stoppage time and offer faster decisions. The implementation marks a significant advancement in the digitization and modernization of professional football in the country.","link":"https://oglobo.globo.com/esportes/futebol/noticia/2026/07/24/impedimento-semiautomatico-no-brasileirao-oito-perguntas-para-entender-a-nova-tecnologia-que-estreia-neste-sabado.ghtml","categoria":"SPORTS TECHNOLOGY","lang":"en"},{"fonte":"Jornal da Unicamp","pais":"Brazil","titulo":"Technology uses CO2 to dry sugarcane bagasse","resumo":"Brazilian researchers have developed an innovative method that uses carbon dioxide to optimize the drying of sugarcane bagasse in processing plants. This technology increases industrial process efficiency and contributes to the sustainability of the sugar-energy sector. The solution highlights Brazil's role in creating agricultural innovations.","link":"https://jornal.unicamp.br/noticias/2026/07/24/tecnologia-usa-co2-para-secar-bagaco-da-cana-de-acucar/","categoria":"SCIENCE","lang":"en"},{"fonte":"Brasil 247","pais":"Brazil","titulo":"Lula highlights R$ 55 billion for science and eyes 2% of GDP by 2034","resumo":"The federal government has announced a robust R$ 55 billion investment aimed at strengthening the national scientific sector. The strategic goal is to raise spending on research and development to 2% of Brazil's GDP by 2034. The initiative seeks to restore the country's leading role in global technological innovations.","link":"https://www.brasil247.com/brasilia/lula-destaca-r-55-bilhoes-para-ciencia-e-mira-2-do-pib-ate-2034/","categoria":"SCIENCE","lang":"en"},{"fonte":"Auto+ TV","pais":"Brazil","titulo":"The mechanic of the future is here: AI, technology, and training are transforming workshops","resumo":"The integration of Artificial Intelligence and new diagnostic tools is revolutionizing the daily operations of auto repair shops in Brazil. Professionals in the sector are seeking constant training to handle the increasing technological complexity of modern vehicles. This digital transition is essential to maintain competitiveness and service quality.","link":"https://www.automaistv.com.br/servico/o-mecanico-do-futuro-ja-chegou-ia-tecnologia-e-capacitacao-transformam-as-oficinas/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Prefeitura de Catalão","pais":"Brazil","titulo":"Catalão launches unprecedented technology and takes a leading position in digital health within the SUS","resumo":"The city of Catalão has implemented a pioneering technological system to improve care in the public health network. The innovation aims to optimize patient management and expedite diagnoses, serving as a model of digital transformation for the SUS (Unified Health System). The project reinforces the importance of technology for public sector efficiency.","link":"https://catalao.go.gov.br/noticias/saude/catalao-inaugura-tecnologia-inedita-e-assume-posicao-de-destaque-na-saude-digital-no-sus","categoria":"DIGITAL HEALTH","lang":"en"},{"fonte":"NBC News","pais":"Brazil","titulo":"Brazil uses forensic science to track gold and combat illegal mining in the Amazon","resumo":"Brazil is applying advanced forensic science techniques to identify the exact origin of gold mined in the Amazon region. The measure aims to intensify the fight against illegal mining, blocking the circulation of ore extracted from protected areas. The technology is a key ally in environmental preservation and rigorous enforcement.","link":"https://www.nbcnews.com/world/brazil/brazil-uses-forensic-science-trace-golds-origin-tackle-illegal-mining-rcna589152","categoria":"SCIENCE","lang":"en"},{"fonte":"Globo","pais":"Brazil","titulo":"This startup claims to make plants grow faster using sound","resumo":"A Brazilian startup is betting on acoustic technology to stimulate accelerated plant growth using specific sound frequencies. The innovative method seeks to increase productivity in agribusiness in a sustainable way, reducing the need for chemical inputs. The solution has drawn attention for its disruptive potential in the field.","link":"https://revistagalileu.globo.com/google/amp/tecnologia/noticia/2026/07/esta-startup-diz-fazer-plantas-crescerem-mais-rapido-usando-som.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Jornal da USP","pais":"Brazil","titulo":"Lack of investment in science and environmental impacts increase the risk of new pandemics","resumo":"Experts warn that the scarcity of resources for scientific research, combined with severe environmental damage, increases Brazil's vulnerability to future pandemics. The study emphasizes that sanitary surveillance depends directly on the strengthening of technology and biotechnology centers. Science is cited as the primary strategic defense to mitigate biological risks.","link":"https://jornal.usp.br/radio-usp/falta-de-investimento-na-ciencia-e-impactos-ambientais-aumentam-o-risco-de-novas-pandemias/","categoria":"SCIENCE","lang":"en"},{"fonte":"The Motley Fool","pais":"United States","titulo":"Best Artificial Intelligence (AI) Buy: Micron Technology vs. Sandisk","resumo":"This technical analysis compares Micron Technology and Sandisk in the context of growing demand for AI-focused hardware. The article evaluates the market positioning of both semiconductor giants, highlighting which one offers greater potential returns for investors focused on cutting-edge technology and data infrastructure.","link":"https://www.fool.com/investing/2026/07/25/better-artificial-intelligence-ai-buy-micron-techn/","categoria":"BUSINESS","lang":"en"},{"fonte":"NeuroNews International","pais":"United States","titulo":"Wellumio’s portable stroke imaging technology receives $9.75 million investment","resumo":"Startup Wellumio has raised nearly $10 million to scale its innovative stroke diagnostic technology. The portable device promises to revolutionize emergency care by allowing crucial imaging scans to be performed quickly outside of traditional hospital settings, increasing patient survival chances.","link":"https://neuronewsinternational.com/wellumios-portable-stroke-imaging-technology-gets-us9-75-million-funding-boost/","categoria":"HEALTH TECH","lang":"en"},{"fonte":"Times Brasil | CNBC","pais":"United States","titulo":"US military project unites defense technology with Israel and sparks debate on sovereignty","resumo":"A new strategic partnership between the US and Israel integrates advanced defense systems, generating intense discussion about geopolitics and technological sovereignty. The collaboration raises critical questions about shared military dependence and the joint development of sensitive technologies in an unstable global scenario.","link":"https://timesbrasil.com.br/mundo/projeto-militar-eua-une-tecnologia-defesa-com-israel/","categoria":"DEFENSE","lang":"en"},{"fonte":"Forbes","pais":"United States","titulo":"Scientists discover the fourth transmissible cancer known to science","resumo":"Researchers have identified a new form of transmissible cancer, representing a significant discovery for biology and veterinary medicine. The study seeks to understand the propagation mechanisms of this unusual cellular mutation, offering new insights into cancer evolution and potential containment methods across different species.","link":"https://www.forbes.com/sites/johndrake/2026/07/24/scientists-discover-the-fourth-transmissible-cancer-known-to-science/","categoria":"SCIENCE","lang":"en"},{"fonte":"Yahoo Finance","pais":"United States","titulo":"Microchip Technology signs definitive agreement to acquire Hailo","resumo":"In a strategic move to strengthen its presence in edge AI, Microchip Technology has finalized the acquisition of Hailo. The integration aims to combine Microchip's vast expertise in microcontrollers with Hailo's neural network processing technology, accelerating innovation in autonomous and embedded devices.","link":"https://finance.yahoo.com/technology/ai/articles/microchip-technology-signs-definitive-agreement-201500110.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Popular Science","pais":"United States","titulo":"Nuclear molten salt could power future cargo ships","resumo":"Researchers are investigating the use of molten salt reactors as a clean and efficient energy alternative for global maritime transport. This technology promises to drastically reduce carbon emissions from the shipping industry, offering a compact, high-density energy source capable of sustaining long transoceanic voyages.","link":"https://www.popsci.com/technology/nuclear-powered-cargo-ships-salt/","categoria":"ENERGY","lang":"en"},{"fonte":"ScienceDaily","pais":"United States","titulo":"AI helps Stanford scientists discover 'natural Ozempic' with no side effects","resumo":"Using artificial intelligence algorithms, Stanford University researchers have identified a natural compound with effects similar to Ozempic, but with a superior safety profile. The discovery paves the way for new metabolic treatments, drastically reducing the side effects commonly associated with current pharmacological therapies.","link":"https://www.sciencedaily.com/releases/2026/07/260719230608.htm","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Tek Notícias","pais":"United States","titulo":"AMD brings 3D V-Cache technology to more gamers with the new Ryzen 7 7700X3D","resumo":"AMD has expanded its high-performance processor lineup with the launch of the Ryzen 7 7700X3D, bringing 3D V-Cache technology to a more accessible price segment. The launch aims to optimize performance for complex games, democratizing access to advanced memory architectures that were previously reserved for high-end enthusiast models.","link":"https://tek.sapo.pt/noticias/computadores/artigos/amd-coloca-a-tecnologia-3d-v-cache-ao-alcance-de-mais-jogadores-com-o-novo-ryzen-7-7700x3d/","categoria":"HARDWARE","lang":"en"},{"fonte":"IsraelValley","pais":"France","titulo":"In the AI economy, intellectual property has become a strategic challenge.","resumo":"The rise of artificial intelligence has turned intellectual property into a critical asset for both companies and nations. The debate centers on the protection of innovations and the use of data in complex models. This landscape is defining new rules for competition and legal security in the global tech market.","link":"https://israelvalley.com/2026/07/25/dans-leconomie-de-lia-la-propriete-intellectuelle-est-devenue-un-enjeu-strategique/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Sciencepost","pais":"France","titulo":"A call for projects to strengthen France and Europe's capabilities in the semiconductor sector!","resumo":"France and the European Union have launched a new program to boost technological sovereignty in the strategic chip sector. The investment aims to reduce external dependency and strengthen local manufacturing infrastructure. The measure is essential to ensure industrial competitiveness in the face of the global component crisis.","link":"https://sciencepost.fr/un-appel-a-projets-pour-renforcer-les-capacites-de-la-france-et-de-leurope-dans-le-domaine-des-semi-conducteurs/","categoria":"BUSINESS","lang":"en"},{"fonte":"Pour la Science","pais":"France","titulo":"Why programming remains, above all, a pleasure, even in the AI era","resumo":"Despite the advancement of AI automation and coding tools, the act of programming maintains its intrinsic value as a form of creative expression. The article reflects on how solving logical problems remains a fundamental human skill. Technology acts as a support, without replacing the passion for software development.","link":"https://www.pourlascience.fr/sr/redresseur-de-code/programmer-c-est-d-abord-un-plaisir-29423.php","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"tv5monde","pais":"France","titulo":"Successful test of the Starship mega-rocket, the first since SpaceX went public","resumo":"The Starship test marks a significant step forward for commercial space exploration by SpaceX. This technical success is particularly relevant to the market, as it is the first mission since the company's financial transition to the stock exchange. The achievement boosts expectations for both manned and logistical space missions.","link":"https://information.tv5monde.com/science/test-reussi-de-la-megafusee-starship-le-premier-depuis-lentree-en-bourse-de-spacex-2831371","categoria":"SCIENCE","lang":"en"},{"fonte":"Boursorama","pais":"France","titulo":"Nvidia, Microsoft, and other tech giants support open-source AI models","resumo":"Major tech players are joining forces to foster the open-source artificial intelligence ecosystem. The strategy aims to democratize access to development tools while establishing standards for security and collaboration. This move shifts market dynamics, which have traditionally been dominated by proprietary, closed solutions.","link":"https://www.boursorama.com/bourse/actualites-amp/nvidia-microsoft-et-d-autres-geants-de-la-technologie-soutiennent-les-modeles-d-ia-open-source-9af722be0702a9b14f16b33786e8cf3c","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Border Counties Advertizer","pais":"England","titulo":"Severn Trent invites residents to learn about river health monitoring technology","resumo":"Severn Trent is promoting educational initiatives to help the local population understand how new technologies are used in water preservation. The effort aims to increase transparency and community engagement regarding the environmental monitoring of rivers in England, using advanced digital tools to detect changes in water quality in real time.","link":"https://www.bordercountiesadvertizer.co.uk/news/26408204.severn-trent-uses-technology-river-health-monitoring/","categoria":"SCIENCE","lang":"en"},{"fonte":"UK Parliament","pais":"England","titulo":"Closing the science and technology department could fragment vital policy areas, says committee chair","resumo":"Experts warn that the potential dismantling of the specialized science and technology department could undermine the cohesion of national innovation strategies. The central concern is that the fragmentation of these policies may hinder the execution of critical projects and the country's technological advancement, requiring a strategic re-evaluation by the government to maintain operational efficiency.","link":"https://committees.parliament.uk/committee/135/science-innovation-and-technology-committee/news/217262/closing-science-and-technolog s and logical deduction.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/inteligencia-artificial-consiguio-matematica-99-anos-resuelve-enigma-centenario_202607256a6445224687a22bdeccbc27.html","categoria":"SCIENCE","lang":"en"},{"fonte":"EL PAÍS","pais":"Spain","titulo":"When artificial intelligence tests the European Green Deal","resumo":"The rapid rise of artificial intelligence is creating an energy and regulatory dilemma for the European Union. The high electricity consumption of data centers challenges the sustainability goals of the Green Deal. The current debate focuses on how to reconcile accelerated technological development with the European bloc's strict climate commitments.","link":"https://elpais.com/tecnologia/2026-07-25/cuando-la-inteligencia-artificial-pone-a-prueba-el-pacto-verde-europeo.html","categoria":"TRENDING TOPICS","lang":"en"},{"fonte":"The Objective","pais":"Spain","titulo":"Espionage alert: have the United States returned to selling us compromised technology?","resumo":"New and concerning alerts have emerged regarding the possible commercialization of technology equipment from the United States that contains intentional vulnerabilities. Digital security experts are investigating the integrity of imported components to prevent espionage risks. This case raises critical discussions about technological sovereignty and trust in global supply chains.","link":"https://theobjective.com/espana/2026-07-25/alerta-espionaje-estados-unidos-tecnologia-trucada/","categoria":"SECURITY","lang":"en"},{"fonte":"Infobae","pais":"Spain","titulo":"Technology developed that could make future 6G networks safer, more efficient, and more precise","resumo":"Researchers have announced a fundamental breakthrough in connectivity infrastructure to enable future 6G networks. The new technology promises to drastically increase the precision of data transmission, reducing latency and strengthening cybersecurity protocols. This development places the telecommunications sector on a new level of global performance.","link":"https://www.infobae.com/tecno/2026/07/25/desarrollan-la-tecnologia-que-podria-hacer-mas-seguras-eficientes-y-precisas-las-futuras-redes-6g/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"La Verdad","pais":"Spain","titulo":"UCAM expands its offering with a Data Science degree and four master's programs","resumo":"The Catholic University of Murcia (UCAM) has reinforced its commitment to technology education by expanding its academic curriculum. The inclusion of a Data Science degree and new master's programs aims to meet the high demand for qualified professionals in the current market. This measure strengthens the higher education ecosystem focused on digital skills in Spain.","link":"https://www.laverdad.es/murcia/cartagena/ucam-amplia-oferta-grado-ciencia-datos-cuatro-20260725014620-nt.html","categoria":"EDUCATION","lang":"en"},{"fonte":"Hosteltur, noticias de turismo","pais":"Spain","titulo":"Nine Sercotel hotels transform into innovation labs","resumo":"The Sercotel hotel chain has turned nine of its properties into spaces dedicated to testing new technologies. The initiative aims to digitize the guest experience and optimize operational processes through on-site innovative solutions. The project highlights the growing trend of digital transformation in the hospitality and tourism industry.","link":"https://www.hosteltur.com/177666_nueve-hoteles-de-sercotel-se-convierten-en-laboratorios-de-innovacion.html","categoria":"INNOVATION","lang":"en"},{"fonte":"ciencia.gob.es","pais":"Spain","titulo":"Diana Morant praises Elche's talent as a driver of the space sector","resumo":"Minister Diana Morant highlighted the city of Elche's fundamental role in the development of the Spanish aerospace industry. The local technology cluster has solidified its position as a vital hub for innovation and cutting-edge engineering in the country. This recognition reinforces the importance of investments in science and techn ds | Jinglianwen Technology, one of Hangzhou's \"Eight New Juns,\" raises nearly 100 million yuan","resumo":"Tech startup Jinglianwen has solidified its position in the Hangzhou innovation market by securing a significant investment of 100 million yuan. This funding underscores the company's rapid growth and increasing influence within the Chinese tech ecosystem, with plans to expand its cutting-edge digital solutions into new markets.","link":"https://autonews.gasgoo.com/articles/news/seeds-one-of-the-new-eight-jun-of-hangzhou-jinglianwen-technology-raises-another-nearly-100-million-yuan-2080910173831929857","categoria":"BUSINESS","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"Research in China: When AI Enters Laboratories, Scientists Gain 'Superpowers'","resumo":"The integration of AI-powered intelligent assistants in Chinese laboratories is revolutionizing the scientific workflow. Supported by digital agents, researchers are able to automate complex experiments and process data at unprecedented speeds, dramatically accelerating the country's cycle of scientific discovery.","link":"https://www.stdaily.com/web/gdxw/2026-07/25/content_553567.html","categoria":"SCIENCE","lang":"en"},{"fonte":"经济频道","pais":"China","titulo":"China's Digital Industry Revenue Reaches 39.6 Trillion Yuan in 2025","resumo":"The Chinese digital sector showed impressive performance in 2025, totaling a colossal revenue of nearly 40 trillion yuan. This growth reflects the structural transformation of the country's economy, driven by massive investments in technological infrastructure, the data economy, and large-scale industrial digitalization.","link":"https://jingji.cctv.com/2026/07/25/ARTIm0cQ0iUt6xGbW41Jm1vG260725.shtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"cb.com.cn","pais":"China","titulo":"Beijing Steps Up Token Economy: Support for Creating 'Word Factories' and Vouchers","resumo":"The Beijing government has launched new guidelines to strengthen the token economy, encouraging the development of infrastructure for generating and managing digital assets. The initiative aims to explore token-based vouchers, positioning the Chinese capital as an experimental hub for financial technologies and blockchain.","link":"http://www.cb.com.cn/index/show/kx/cv/cv135731471557","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"TV BRICS","pais":"China","titulo":"New Chinese Hybrid Rice Cloning Technology Could Strengthen Global Food Security","resumo":"Chinese scientists have developed an innovative cloning technique for hybrid rice that promises to increase efficiency in global agricultural production. This technology allows for the stabilization of essential productive traits, offering a robust solution to face the growing challenges of food security and resource scarcity in various regions of the globe.","link":"https://tvbrics.com/pt/news/nova-tecnologia-chinesa-de-clonagem-de-arroz-hibrido-pode-fortalecer-seguranca-alimentar-global/","categoria":"SCIENCE","lang":"en"},{"fonte":"Globo","pais":"China","titulo":"Rare Video Captures Lightning Striking Chinese Rocket During Launch; Watch","resumo":"Footage captured during a Chinese space mission recorded a rare and impressive natural phenomenon: a lightning bolt striking the rocket shortly after liftoff. The video went viral on social media and sparked discussions regarding the structural resilience of modern spacecraft against extreme weather conditions during launch.","link":"https://revistagalileu.globo.com/google/amp/ciencia/noticia/2026/07/video-raro-flagra-raios-atingindo-foguete-chines-durante-lancamento-assista.ghtml","categoria":"TRENDING TOPICS","lang":"en"},{"fonte":"新京报","pais":"China","titulo":"Huairou Science City Creates Demonstration Model for Integrating 'AI for Science'","resumo":"Huairou Science City is setting a new standard by merging artificial intelligence with advanced scientific research. This pilot project aims to create an ecosystem where AI algorithms solve complex problems in fields such as physics and materials, serving as a high-level technological innovation showcase for all of China.","link":"https://www.bjnews.com.cn/detail/1784883257129801.html","categoria":"SCIENCE","lang":"en"},{"fonte":"PR Newswire","pais":"China","titulo":"Technological Breakthrough: Niutech's Mineral Tailings Recovery Technologies Boost Global Sector","resumo":"Chinese company Niutech has developed advanced equipment for the reduction and enrichment of titanium and iron tailings, transforming industrial waste into valuable resources. This technological innovation not only improves the efficiency of the Chinese mineral sector but also promotes sustainability and the recovery of strategic raw materials on a global scale.","link":"https://www.prnewswire.com/news-releases/technologischer-durchbruch--niutechs-technologie-und-anlagen-zur-reduzierung-und-anreicherung-von-titan-eisen-bergeabfallen-fordern-die-weltweite-ruckgewinnung-strategischer-mineralischer-rohstoffe-302834536.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ET CIO","pais":"India","titulo":"DRAIPL Expands Tech Sector and Names Tapan Sharma as CEO","resumo":"Infrastructure firm DRAIPL has announced a strategic expansion into the tech sector, aiming to diversify its operations. With the appointment of Tapan Sharma as CEO of the new division, the organization seeks to capitalize on digital solutions and innovation. This move reflects the growing trend of traditional Indian companies investing heavily in technological capabilities to lead emerging markets.","link":"https://cio.economictimes.indiatimes.com/news/corporate-news/draipl-appoints-tapan-sharma-as-ceo-to-accelerate-technology-business-expansion/132619417?utm_source=portal_category_widget&utm_medium=homepage","categoria":"BUSINESS","lang":"en"},{"fonte":"The New Indian Express","pais":"India","titulo":"Karnataka to Build India's First Museum of Innovation, Startups, and Technology in Bengaluru","resumo":"The state of Karnataka has announced the creation of the first museum dedicated exclusively to innovation and the startup ecosystem in Bengaluru. The initiative aims to preserve the region's technological trajectory and inspire the next generation of Indian entrepreneurs. The project highlights Bengaluru's central role as a global hub for scientific development and digital advances.","link":"https://www.newindianexpress.com/states/karnataka/2026/Jul/25/karnataka-to-build-indias-first-museum-of-innovation-startups-technology-in-bengaluru","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Jornal de Notícias","pais":"Portugal","titulo":"Science Festival and Free Admission at the Pavilion of Knowledge","resumo":"The Pavilion of Knowledge is hosting a science-dedicated festival with free public access. The event aims to democratize scientific knowledge by providing interactive experiences for visitors of all ages. It is a significant opportunity to foster scientific literacy in Portugal.","link":"https://www.jn.pt/amp/18109632/festival-de-ciencia-e-entrada-gratis-no-pavilhao-do-conhecimento","categoria":"SCIENCE","lang":"en"},{"fonte":"terranova.pt","pais":"Portugal","titulo":"Science Factory Dedicates Saturday to Marine Biodiversity","resumo":"The Science Factory is organizing an initiative focused on the preservation and study of ocean biodiversity. The event seeks to raise community awareness regarding the importance of marine ecosystems through educational activities. The action reinforces the institution's commitment to environmental outreach.","link":"https://terranova.pt/noticias/cultura/fabrica-da-ciencia-em-mais-um-sabado-dedicado-biodiversidade-marinha","categoria":"SCIENCE","lang":"en"},{"fonte":"oRegiões","pais":"Portugal","titulo":"UBI Presents Proposal on Science, Territory, and Innovation at the 2026 Science and Innovation Meeting","resumo":"The University of Beira Interior has presented strategies focused on integrating territorial development with technological innovation. The projec     const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(item.link)}" target="_blank" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render
</script>
