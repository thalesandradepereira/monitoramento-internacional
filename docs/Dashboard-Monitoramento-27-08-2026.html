timize production processes.\nBy prioritizing sustainability and human-centric approaches in factories, the project prepares companies for the future industrial transformation.\nThis approach reinforces the competitiveness of the manufacturing sector and drives the development of new technological patents.","link":"https://diariogallego.es/es/vigo/general/gradiant-combinando-tecnologia-para-la-industria-40-y-50","categoria":"INDUSTRY 4.0","lang":"en"},{"fonte":"Cadena SER","pais":"Spain","titulo":"Cancer Treatment at Risk in Málaga: Hospital with Million-Dollar Technology Operates at 5% Due to Staff Shortages","resumo":"A reference hospital in Málaga is facing severe operational limitations following multi-million-dollar investments in advanced oncology equipment.\nLocal physicians warn that a critical shortage of specialized personnel is causing cutting-edge infrastructure to operate at just 5% of its capacity.\nThe situation has sparked deep concern within the medical community and among patients relying on high-precision cancer treatments.\nThe standoff highlights the challenges of public management in integrating high technology with the efficient allocation of human resources.","link":"https://cadenaser.com/andalucia/2026/08/27/el-cancer-en-riesgo-en-malaga-un-hospital-con-tecnologia-millonaria-funciona-al-5-por-falta-de-personal-segun-los-medicos-ser-malaga/","categoria":"MEDICAL TECHNOLOGY","lang":"en"},{"fonte":"Logística Profesional","pais":"Spain","titulo":"Clark Launches New High-Reach Electric Stackers with Lithium-Ion Technology","resumo":"Manufacturer Clark has introduced a new line of electric stackers designed for high-bay warehousing.\nEquipped with next-generation lithium-ion batteries, the machines offer greater energy efficiency and shorter recharge times.\nThe innovation aims to meet the growing demands for sustainability and productivity in automated logistics centers.\nThis technological upgrade reduces operational costs and raises safety standards in industrial operations.","link":"https://www.logisticaprofesional.com/texto-diario/mostrar/5994852/clark-cuenta-nuevas-apiladoras-electricas-gran-altura-tecnologia-iones-litio","categoria":"INDUSTRIAL INNOVATION","lang":"en"},{"fonte":"Investing.com España","pais":"Spain","titulo":"Asian Markets Trade Mixed, Boosted by Tech Sector Led by Nvidia","resumo":"Asian stock markets closed without a clear direction but registered strong optimism in tech sector stocks.\nThe positive performance of chipmaker Nvidia continued to be the main driver of appreciation for semiconductor companies.\nInvestors are maintaining their focus on the impacts of artificial intelligence on global corporate earnings estimates.\nVolatility reflects the balance between macroeconomic uncertainties and the accelerated growth of the technology segment.","link":"https://es.investing.com/news/stock-market-news/las-bolsas-asiaticas-mixtas-nvidia-impulsa-la-tecnologia-3812321","categoria":"FINANCIAL MARKET","lang":"en"},{"fonte":"Faro de Vigo","pais":"Spain","titulo":"Fernando Suárez, President of IT Professionals: \"Denying Technology in Classrooms Does Not Protect Our Children; It Leaves Them Alone to Face It\"","resumo":"Amid debates over banning screens in schools, the president of the IT professionals association defends conscious digital education.\nFernando Suárez argues that keeping technology out of classrooms hinders the development of critical thinking regarding its safe use.\nThe expert highlights the importance of equipping students and teachers to face risks such as cyberbullying and misinformation.\nThe statement reinforces the need to integrate digital literacy into the school curriculum in a responsible and pedagogical way.","link":"https://www.farodevigo.es/sociedad/2026/08/27/fernando-suarez-presidente-de-los-informaticos-negar-la-tecnologia-en-las-aulas-no-protege-a-nuestros-hijos-los-deja-solos-ante-ella-133679255.html","categoria":"DIGITAL EDUCATION","lang":"en"},{"fonte":"Innovaspain","pais":"Spain","titulo":"Jorge Terreu (Maximiliana): \"Technology Must Adapt to the Elderly, Not the Other Way Around\"","resumo":"The founder of the startup Maximiliana advocates for the creation of technological solutions designed specifically for the inclusion of seniors.\nJorge Terreu points out that the complexity of modern devices often isolates the elderly from the benefits of the digital world.\nHis proposal focuses on the extreme simplification of interfaces to facilitate communication with family members and access to basic services.\nThe initiative highlights the role of assistive technology in promoting autonomy and combating loneliness among the senior population.","link":"https://www.innovaspain.com/jorge-terreu-maximiliana-la-tecnologia-tiene-que-adaptarse-a-las-personas-mayores-no-al-reves/","categoria":"DIGITAL INCLUSION","lang":"en"},{"fonte":"WKZO","pais":"Germany","titulo":"Deutsche Bank Highlights Progress in Technology Modernization of Its Retail Division","resumo":"Deutsche Bank has announced significant progress in the overhaul and modernization of its technology systems dedicated to the retail banking division.\nThe initiative aims to optimize legacy infrastructure, improve operational efficiency, and enhance the digital experience offered to customers.\nThis technological upgrade is considered a crucial pillar in the bank's strategy to reduce long-term costs and increase its competitiveness in the financial sector.\nThe progress reflects a continuous effort to integrate more robust and agile solutions into data processing.","link":"https://wkzo.com/2026/08/27/deutsche-bank-cites-progress-in-technology-revamp-at-retail-division/","categoria":"BANKING TECHNOLOGY","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"Nvidia Projects 70% Revenue Growth Driven by Demand for Artificial Intelligence","resumo":"Nvidia has expressed strong market optimism by projecting an impressive 70% revenue growth, driven by high global demand for its chips.\nThe massive advancement of generative artificial intelligence technologies continues to require high-performance processing infrastructure.\nThis projection solidifies the tech giant's leadership position in the race to supply specialized hardware for AI.\nThe forecasted result highlights the centrality and major influence of the semiconductor sector in the global digital economy.","link":"https://www.sueddeutsche.de/wirtschaft/nvidia-aktien-umsatzplus-70-prozent-li.3537920","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"Billion-Dollar Investment: Schwarz Group Builds Giant Data Center Near Rostock","resumo":"The Schwarz Group has announced a multi-billion-euro investment for the construction of a massive data center near Rostock.\nThe project seeks to expand cloud processing capacity and ensure greater data sovereignty for its digital services.\nThe new facility will be designed with modern standards of energy efficiency and high operational availability to meet regional demands.\nThe project represents a significant boost to strengthening technology infrastructure and digital autonomy in Germany.","link":"https://www.sueddeutsche.de/wirtschaft/milliardeninvestition-schwarz-gruppe-baut-riesiges-rechenzentrum-bei-rostock-dpa.urn-newsml-dpa-com-20090101-260827-930-589099","categoria":"DIGITAL INFRASTRUCTURE","lang":"en"},{"fonte":"dw.com","pais":"Germany","titulo":"German Economy Increasingly in the Crosshairs of Foreign Secret Services","resumo":"Warnings from intelligence agencies indicate that Germany's economy and industry are increasingly being targeted by foreign secret services.\nThe rising threat includes sophisticated cyberattacks, industrial espionage, and attempts to steal intellectual property and strategic data.\nLocal authorities are reinforcing the urgent need to increase cyber resilience and protect the country's critical infrastructure.\nThe situation requires close cooperation between government entities and the private sector to safeguard trade secrets and innovations.","link":"https://amp.dw.com/de/deutsche-wirtschaft-verst%C3%A4rkt-im-fokus-fremder-geheimdienste/a-78513779","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"NEC Launches Cyber Defense Service with Domestic Technology and 24-Hour Monitoring","resumo":"NEC has announced the deployment of a new service focused on strengthening corporate cybersecurity against growing digital threats.\nThe solution uses 100% Japanese-developed technology to continuously monitor operating systems and detect intrusions in real time.\nWith active operational support 24 hours a day, the initiative aims to ensure the resilience of corporate infrastructure and protect sensitive data.","link":"https://www.nikkei.com/article/DGXZQOUC271T70X20C26A8000000/","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"大学ジャーナルオンライン","pais":"Japan","titulo":"Researchers Apply Digital Dental Technology to Optimize Wind Instruments","resumo":"A partnership between the Tokyo University of Science and the Tokyo University of the Arts has resulted in the development of an innovative guide for wind instruments.\nThe device accurately reproduces the ideal positioning between the lips and the instrument by applying advanced dental scanning techniques.\nThe breakthrough promises to benefit music education and prevent injuries in musicians through perfect biomechanical alignment.","link":"https://univ-journal.jp/1000172/","categoria":"TECHNOLOGY AND SCIENCE","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"MSI Launches 24.5-Inch Gaming Monitor with 300 Hz Refresh Rate","resumo":"MSI has officially introduced its latest monitor aimed at the competitive eSports market, equipped with a 24.5-inch panel.\nThe peripheral's standout feature is its ultra-fast 300 Hz refresh rate, ensuring extreme fluidity in fast-paced games.\nIn addition to elevated visual performance, the equipment features capabilities designed to reduce latency and provide an advantage to professional gamers.","link":"https://news.yahoo.co.jp/articles/1d0658f4fbb8d5743f9a1dad00412d062a7dbe4c","categoria":"HARDWARE","lang":"en"},{"fonte":"macnica.co.jp","pais":"Japan","titulo":"New Technology Estimates Internal Battery Temperature to Ensure Safe Fast Charging","resumo":"Researchers have developed a method capable of accurately estimating the internal temperature of batteries during the fast-charging process.\nThe innovation combats the risk of overheating and severe cell degradation, one of the biggest challenges for the popularization of electric vehicles.\nBy monitoring thermal state without intrusive sensors, the technology enhances the safety and lifespan of energy systems.","link":"https://www.macnica.co.jp/business/semiconductor/articles/ntcj/150322/","categoria":"TECHNOLOGICAL INNOVATION","lang":"en"},{"fonte":"Yahoo!ファイナンス","pais":"Japan","titulo":"Cybertrust Begins Testing C2PA Technology to Ensure Authenticity of Construction Videos","resumo":"Cybertrust has initiated practical tests of C2PA technology on road construction sites in partnership with Seibu Construction and Three Fields.\nThe system allows for the verification of the origin and integrity of video recordings, preventing fraud and digital manipulation in operational reports.\nThe initiative demonstrates the practical use of media cryptography to ensure transparency and compliance in civil construction processes.","link":"https://finance.yahoo.co.jp/news/detail/fea3cb93b86d8632b7c7c474c3ed163d92ad605a","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"Morinaga Milk Automates Artisanal Whipped Cream Technique to Overcome Labor Shortage","resumo":"Dairy manufacturer Morinaga Milk has developed an automated system capable of precisely replicating the whipping technique used by artisanal pastry chefs.\nThe technology directly addresses the severe shortage of skilled labor facing the Japanese food sector.\nWith this innovation, the company ensures a high standard of quality in its final products and reduces its reliance on labor-intensive manual processes.","link":"https://www.nikkei.com/article/DGXZQOUC273AC0X20C26A8000000/","categoria":"AUTOMATION","lang":"en"},{"fonte":"The Korea Times","pais":"Japan","titulo":"Researchers Develop Voice Security Technology Capable of Detecting Spoofed Audio","resumo":"Scientists at Sungkyunkwan University have developed an advanced voice security system designed to identify fabrications in real time.\nThe tool analyzes acoustic patterns and micro-alterations in audio signals to differentiate authentic human voices from artificial intelligence-generated audio.\nThe solution is considered a milestone in protecting biometric authentication systems against deepfake scams and social engineering.","link":"https://www.koreatimes.co.kr/amp/southkorea/education/20260827/sungkyunkwan-university-researchers-develop-voice-security-technology-to-detect-spoofed-audio","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"日刊工業新聞","pais":"Japan","titulo":"Advances in Synthetic Biology Boost Cell Creation Science in Japan","resumo":"Japan's scientific ecosystem has been leading fundamental research aimed at synthesizing artificial cells from basic molecular components.\nThis new branch of biology seeks to recreate the vital functions of living organisms to understand the origins of life and create efficient biofuels.\nThe movement strengthens the country's technological sovereignty in the fields of regenerative medicine and advanced biomanufacturing.","link":"https://www.nikkan.co.jp/articles/view/777399?gnr_footer=86367","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"90% of Biomedical Papers Show Signs of AI Assistance","resumo":"A new study reveals that approximately 90% of academic papers in the biomedical field show signs of artificial intelligence usage.\nThe finding highlights the rapid expansion of generative AI in the research ecosystem, sparking debates on productivity and academic integrity.\nExperts point out that this massive integration requires the creation of new ethical guidelines to ensure the transparency of scientific data.","link":"https://news.sciencenet.cn/htmlnews/2026/8/570437.shtm","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"eeo.com.cn","pais":"China","titulo":"Huawei Introduces New Smart Ecosystem Solutions with HarmonyOS","resumo":"Huawei held a conference focused on its smart home device lineup powered by the HarmonyOS operating system.\nThe initiative aims to standardize the luxury market with total connectivity, intuitive usability, and energy consumption automation.\nWith this move, the Chinese tech giant is expanding its reach beyond smartphones, driving the Internet of Things in residential spaces.","link":"http://m.eeo.com.cn/2026/0827/1012954.shtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"中国经济网","pais":"China","titulo":"QCraft Debuts 'Physical AI' at International Transport Technology Exhibition","resumo":"Chinese startup QCraft showcased its physical artificial intelligence solutions applied to the transportation and logistics sector.\nThe technology combines advanced robotics and autonomous driving to optimize cargo flow and reduce industrial operating costs.\nThe breakthrough reflects the transition from digital AI models to autonomous systems integrated directly into the physical world.","link":"http://www.ce.cn/cysc/newmain/yc/jsxw/202608/t20260827_3173992.shtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"北京市投资促进服务中心","pais":"China","titulo":"HICOOL 2026 Summit Announces International Panoramic Digital Life Project","resumo":"During the HICOOL 2026 Global Summit, the International Big Science Plan on Panoramic Digital Life was announced.\nThe project aims to map and simulate complex biological processes with the support of supercomputers and massive genomic data.\nThe initiative seeks to attract global investments and talent to accelerate innovation in biotechnology and precision medicine in China.","link":"https://invest.beijing.gov.cn/tcgz/tzbjqqhzhb/202608/t20260827_4839632.html","categoria":"SCIENCE AND TECHNOLOGY","lang":"en"},{"fonte":"082noticias.com","pais":"China","titulo":"Alagoas Startup Selected to Test Mental Health Technology in China","resumo":"A startup from the Brazilian state of Alagoas has been selected to validate its mental health solution within the Chinese tech ecosystem.\nThe international partnership will allow for large-scale urban testing and the refinement of early diagnosis algorithms.\nThe agreement highlights the strengthening of cooperation in technological innovation and digital health between Brazil and the Chinese market.","link":"https://082noticias.com/destaque/startup-de-alagoas-e-escolhida-para-testar-tecnologia-de-saude-mental-na-china/","categoria":"INNOVATION","lang":"en"},{"fonte":"新浪新闻_手机新浪网","pais":"China","titulo":"China Deploys Intelligent Firefighting Network Powered by AI and Drones","resumo":"A new security platform in China uses artificial intelligence to integrate ground data with aerial views from drones.\nThe technology enables proactive wildfire detection and the automated dispatch of rescue teams in high-risk areas.\nThe system represents a significant breakthrough in urban disaster management and real-time environmental conservation.","link":"https://news.sina.com.cn/zx/gj/2026-08-27/doc-iniptnux5495039.shtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"China's High-Tech Industry Profits Surge 50.1%","resumo":"Official data indicates that profits of high-tech manufacturing companies in China registered an expressive jump of 50.1%.\nThe performance was driven by strong demand for semiconductors, industrial automation, and artificial intelligence infrastructure.\nThe result reinforces the effectiveness of national policies geared toward industrial modernization and the country's technological sovereignty.","link":"https://www.news.cn/20260827/fbd906ceb0bc4c2e9ee4b794552de916/c.html","categoria":"TECH INDUSTRY","lang":"en"},{"fonte":"PR Newswire","pais":"China","titulo":"The International 2026 Concludes in Shanghai, Celebrating Global Esports","resumo":"The prestigious world esports tournament, The International 2026, wrapped up its edition in the megalopolis of Shanghai.\nThe event highlighted China's role as a leading global hub for digital entertainment and technological broadcasts.\nBeyond the main competition, the closing ceremony celebrated cultural exchange and the connection of the global gaming community.","link":"https://www.prnewswire.com/br/comunicados-para-a-imprensa/the-international-2026-chega-ao-fim-em-xangai-celebrando-os-esportes-eletronicos-a-cultura-e-a-conexao-global-302861553.html","categoria":"TRENDING","lang":"en"},{"fonte":"KNN India","pais":"India","titulo":"India Joins IAEA Initiative to Explore Nuclear Technology for Civil Maritime Use","resumo":"India has formalized its accession to a global International Atomic Energy Agency initiative focused on developing nuclear technologies for the civil navy. The move seeks to drive the decarbonization of the maritime transport sector through clean and sustainable propulsion solutions. Participation strengthens the country's standing in the international arena of nuclear energy innovation.","link":"https://knnindia.co.in/news/newsdetails/sectors/india-joins-iaea-initiative-to-explore-nuclear-technology-for-civilian-maritime-use","categoria":"NUCLEAR ENERGY","lang":"en"},{"fonte":"The News Mill","pais":"India","titulo":"Northeast India Can Be Gateway to Country's Space Economy, Says SIA-India","resumo":"Space industry association SIA-India highlighted the strategic potential of the country's northeast to become an essential hub for the Indian space economy. Favorable geographic location and new investments in technological infrastructure can boost satellite launches and telecommunications. The plan aims to significantly expand private sector participation in the aerospace industry.","link":"https://thenewsmill.com/2026/08/northeast-can-be-gateway-to-indias-space-economy-sia-india/","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"India Education Diary","pais":"India","titulo":"India Highlights Scientific Advances in Snow Leopard Conservation at Moscow Meeting","resumo":"During a meeting in Moscow, India presented its scientific advances applied to snow leopard preservation. Initiatives include modern population estimation methodologies, high-precision radio telemetry, and advanced genetic analysis. The presentation reinforces the country's leading role in applying cutting-edge technologies to environmental conservation.","link":"https://indiaeducationdiary.in/india-highlights-its-science-based-advances-in-snow-leopard-conservation-including-population-estimation-radio-telemetry-and-genetic-analysis-at-moscow-roundtable-meeting/","categoria":"SCIENCE","lang":"en"},{"fonte":"HinduPost","pais":"India","titulo":"Rajnath Singh Approves DRDO Missile Technology Transfer to Indian Defense Industry","resumo":"India's Defense Minister has authorized the transfer of critical missile technology from DRDO to private companies in the national defense sector. The initiative aims to strengthen the country's self-reliance and boost local manufacturing capacity under the Make in India program. The measure promises to modernize the armed forces and accelerate military technological innovation.","link":"https://hindupost.in/defence/rajnath-singh-approves-drdo-missile-technology-transfer-to-bharatiya-defence-industry-what-it-means/","categoria":"MILITARY TECHNOLOGY","lang":"en"},{"fonte":"TheBanker.com","pais":"India","titulo":"India Prepares to Become the Global Powerhouse of Banking Technology","resumo":"India is solidifying its position as a global hub for banking and financial technology innovation, driven by the UPI ecosystem and digital advancements. Local and multinational companies are expanding technological solutions in instant payments, artificial intelligence, and financial inclusion. This growth projects the country as a world benchmark in the digital transformation of banks.","link":"https://www.thebanker.com/content/0409186e-cd46-4887-8cac-35778151f262","categoria":"FINTECH","lang":"en"},{"fonte":"Medical Buyer","pais":"India","titulo":"Lawmaker Calls for Deeper India-Israel Collaboration in Health Technology","resumo":"An Indian lawmaker has advocated for strengthening the strategic partnership between India and Israel in the health technology and medical devices sector. The proposal aims to integrate Israel's startup and innovation ecosystem with the scaling needs of India's public healthcare. The core objective is to accelerate access to advanced diagnostics and cutting-edge biotechnology.","link":"https://medicalbuyer.co.in/mp-calls-for-deeper-india-israel-collaboration-in-health-technology/","categoria":"DIGITAL HEALTH","lang":"en"},{"fonte":"ET EnergyWorld","pais":"India","titulo":"India's Nuclear Ambitions May Be Blunted by Limits on Foreign Reactor Technology","resumo":"India's nuclear program expansion plans face challenges due to restrictions on access and transfer of foreign reactor technologies. Issues concerning civil nuclear liability and international safeguards continue to slow down agreements with multinationals in the energy sector. Overcoming these regulatory and technological hurdles is seen as crucial to meeting future energy demand.","link":"https://energy.economictimes.indiatimes.com/news/power/indias-nuclear-ambitions-may-be-blunted-by-limits-on-foreign-reactor-technology/133560597","categoria":"NUCLEAR ENERGY","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"JSW and VW Talks Center on Plant and Technology Safeguards","resumo":"Negotiations between India's JSW Group and Volkswagen have taken new turns focused on manufacturing infrastructure and intellectual property protection. The partnership seeks to accelerate local production of electric vehicles and the development of sustainable automotive technologies. Strict measures regarding technology safeguards are considered key to ensuring the venture's success.","link":"https://www.moneycontrol.com/automobile/jsw-vw-talks-centre-on-sambhajinagar-plant-technology-safeguards-article-14016481.html","categoria":"INDUSTRIAL INNOVATION","lang":"en"},{"fonte":"Executive Digest","pais":"Portugal","titulo":"AI: Breakthrough or Hype? Porto Tech Hub Debunks Five Myths About Technology's Potential","resumo":"The Porto Tech Hub hosted an in-depth debate to demystify exaggerated expectations and unfounded fears surrounding Artificial Intelligence.\nAssembled experts analyzed five popular myths about the technology, separating real innovations from baseless marketing promises.\nThe event highlighted the importance of understanding the practical limitations of current tools for more assertive investment in the sector.\nConsequently, the initiative seeks to guide companies and professionals in adopting AI ethically, securely, and strategically.","link":"https://executivedigest.sapo.pt/ia-breakthrough-ou-bullshit-porto-tech-hub-desmonta-cinco-mitos-sobre-o-potencial-da-tecnologia/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Samora Correia Hosts Seminar on Artificial Intelligence Applied to Sports","resumo":"The town of Samora Correia hosted a seminar focused on integrating Artificial Intelligence into high-performance sports.\nThe gathering brought together coaches, managers, and data experts to discuss how algorithms can optimize athlete performance.\nTopics such as injury prevention, predictive tactical analysis, and the personalization of physical training routines were addressed.\nThe initiative highlights the growing interest of regional sports institutions in adopting advanced technological solutions.","link":"https://sapo.pt/artigo/samora-correia-recebe-seminario-sobre-inteligencia-artificial-aplicada-ao-desporto-6a8fda55170cb38f14225e03","categoria":"INNOVATION","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"We Should Not Discuss AI Merely As Technology","resumo":"Experts argue that the impacts of Artificial Intelligence should not be analyzed exclusively from a technical and functional perspective.\nIt is essential to incorporate ethical, social, philosophical, and economic dimensions into global discussions regarding the future of automation.\nA strictly technological approach risks ignoring profound reflections on human rights and income distribution.\nThus, a multidisciplinary dialogue is proposed as indispensable to shaping regulations that protect society as a whole.","link":"https://sapo.pt/artigo/nao-devemos-discutir-a-ia-apenas-como-tecnologia-6a8fd9bfd0af359889317d45","categoria":"SOCIETY","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"Something is Rotten in the Kingdom of Science","resumo":"A critical new overview sheds light on the structural problems affecting integrity and transparency in modern scientific circles.\nIssues such as the pressure for massive publications, the proliferation of predatory journals, and a lack of reproducibility were highlighted.\nThese factors call into question the public's and institutions' trust in globally disseminated research and discoveries.\nThe academic community is debating the urgency of reforming incentive and evaluation systems to preserve the credibility of science.","link":"https://www.publico.pt/2026/08/27/ciencia/opiniao/ha-algo-podre-reino-ciencia-2182934","categoria":"SCIENCE","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Bill Gates Proposes Reserving Jobs for Humans Amid AI Advance","resumo":"Concerned about the rapid pace of automation, Bill Gates has suggested reserving certain jobs exclusively for human beings.\nThe Microsoft co-founder argues that sectors requiring empathy, care, and moral judgment should not be entirely handed over to algorithms.\nThe proposal seeks to curb the socioeconomic impacts of mass unemployment and ensure that the technological transition occurs with stability.\nThis debate reignites global discussions on the need to regulate the labor market in the face of artificial intelligence evolution.","link":"https://www.cmjornal.pt/tecnologia/amp/bill-gates-propoe-reservar-empregos-para-humanos-perante-avanco-da-ia","categoria":"MARKET","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"MEO Sons do Mar Focuses on DJs, Technology, and Accessibility","resumo":"The MEO Sons do Mar cultural event reinforced its innovative proposal by integrating cutting-edge technology and accessibility into its lineup.\nThis year's edition features DJ performances aligned with technological resources that guarantee the inclusion of people with disabilities.\nThe use of interactive audio systems and adapted infrastructure aims to provide a complete sensory experience for all attendees.\nThe initiative sets a new standard for music festivals by uniting entertainment, innovation, and social responsibility.","link":"https://sapo.pt/artigo/meo-sons-do-mar-aposta-em-djs-tecnologia-e-acessibilidade-6a8f41976fb671f4056d7107","categoria":"ENTERTAINMENT","lang":"en"},{"fonte":"Notícias ao Minuto","pais":"Portugal","titulo":"Volvo Enhances Technology Allowing Cars to 'Talk' to Each Other","resumo":"Volvo has announced the expansion of its vehicle-to-vehicle communication technology, allowing cars to exchange traffic data in real time.\nThe system enables hazard alerts, slippery road warnings, or accident notices to be transmitted instantly to nearby automobiles.\nThis advanced connectivity's main objective is to drastically increase road safety and prevent collisions on highways.\nThe measure reinforces the brand's position as a leader in innovations geared toward the autonomous and integrated mobility of the future.","link":"https://www.noticiasaominuto.com/auto/3041559/volvo-reforca-tecnologia-que-permite-aos-carros-falar-entre-si","categoria":"AUTOMOTIVE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
</body>
