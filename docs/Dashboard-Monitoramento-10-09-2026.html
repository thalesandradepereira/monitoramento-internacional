","pais":"Spain","titulo":"The Possibility of Finding Evidence of Interstellar Technology in Lunar Dust","resumo":"Scientists are investigating the hypothesis that lunar dust may retain microfragments and material traces originating outside the Solar System.\nThe moon's lack of an atmosphere and erosion preserves cosmic records for billions of years, facilitating thorough laboratory analyses.\nIf confirmed, this approach could transform the search for extraterrestrial intelligence and expand modern astronomical exploration.","link":"https://www.elconfidencial.com/tecnologia/novaceno/2026-09-10/posibilidad-encontrar-tecnologia-civilizaciones-polvo-lunar_4420875/","categoria":"SCIENCE","lang":"en"},{"fonte":"Actualidad Aeroespacial","pais":"Spain","titulo":"Indra to Develop 147 Tactical Drones for the Armed Forces Using Spanish Technology","resumo":"Technology company Indra has been selected to design and manufacture 147 unmanned aircraft for the Spanish military.\nThe project prioritizes national technological sovereignty by utilizing intelligence, communication, and navigation systems developed in Spain.\nThe initiative boosts the country's defense industry and modernizes the armed forces' tactical surveillance and reconnaissance capabilities.","link":"https://actualidadaeroespacial.com/indra-desarrollara-147-drones-tacticos-para-las-fuerzas-armadas-con-tecnologia-espanola/","categoria":"DEFENSE AND TECHNOLOGY","lang":"en"},{"fonte":"Actualidad Aeroespacial","pais":"Spain","titulo":"The Global Space Economy Generated Up to $600 Billion in Revenue in 2025","resumo":"The space sector has established itself as one of the most profitable vectors of the global economy, generating hundreds of billions of dollars over the past year.\nThis growth was driven by the expansion of commercial satellites, space tourism, and investments in exploration infrastructure.\nExperts predict that the integration of private and governmental technology will continue to accelerate new orbital business in the near future.","link":"https://actualidadaeroespacial.com/la-economia-espacial-global-genero-en-2025-unos-ingresos-de-hasta-600-000-millones-de-dolares/","categoria":"SPACE ECONOMY","lang":"en"},{"fonte":"Innovaspain","pais":"Spain","titulo":"Turning a Memory into a Perfume: How Scircle's Technology Works","resumo":"Startup Scircle has developed innovative technology capable of translating human memories and emotions into personalized fragrances.\nThrough algorithms and digital olfactory synthesis, the system analyzes sensory data and emotional patterns described by users.\nThis solution opens new frontiers for product personalization in the perfumery industry and consumer experience.","link":"https://www.innovaspain.com/convertir-un-recuerdo-en-un-perfume-asi-funciona-la-tecnologia-de-scircle/","categoria":"INNOVATION","lang":"en"},{"fonte":"heraldo.es","pais":"Spain","titulo":"Zaragoza Public School Recognized as a Technology Benchmark: From Prefabricated Classrooms to National Success","resumo":"A public school in Zaragoza has received national recognition for its pedagogical methodology based on digital innovation.\nOvercoming initial structural limitations, the institution integrated robotics and interactive tools into the daily lives of its students.\nThis case has become a model of resilience and digital inclusion in Spanish public education.","link":"https://www.heraldo.es/noticias/aragon/zaragoza/2026/09/10/colegio-publico-zaragoza-galardonado-referente-tecnologia-aulas-prefabricadas-exito-educativo-2050450.html","categoria":"EDUCATION","lang":"en"},{"fonte":"Diario de León","pais":"Spain","titulo":"Learning Technology by Creating at Fab Lab León","resumo":"Fab Lab León is reinforcing its educational proposal focused on hands-on learning of digital fabrication and robotics.\nThe laboratory offers workshops where participants of various ages develop projects using 3D printers and laser cutters.\nThis initiative strengthens the maker culture in the region, encouraging creative problem-solving and technical thinking.","link":"https://www.diariodeleon.es/promociones/260910/2096867/aprender-tecnologia-creando-fab-lab-leon.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"PZ-news","pais":"Germany","titulo":"New Apple CEO Highlights First Foldable iPhone and Artificial Intelligence","resumo":"Apple is preparing for a new strategic direction focused on introducing its first foldable smartphone and the deep integration of artificial intelligence. This initiative aims to position the tech giant at the forefront of innovation in a highly competitive market.\nThe move signals significant changes in the brand's upcoming releases and the final user experience.","link":"https://www.pz-news.de/wirtschaft_artikel,-Neuer-Apple-Chef-setzt-Akzente-mit-erstem-Falt-iPhone-und-KI-_arid,2367913.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Wirtschaftsrat der CDU e.V.","pais":"Germany","titulo":"AI and Cybersecurity: Economic Sector Demands Security Architecture for Agentic AI","resumo":"Economic and technology sector leaders are calling for the creation of a robust cybersecurity infrastructure tailored for agentic artificial intelligence. With the autonomous evolution of these tools, the risks of operational vulnerabilities and large-scale cyberattacks are increasing.\nThe proposal aims to establish clear guidelines to protect companies and critical data in the digital environment.","link":"https://wirtschaftsrat.de/en/presse/wr-intern/ki-und-cybersicherheit-wirtschaft-fordert-sicherheitsarchitektur-f%C3%BCr-agentische-ki/","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"Bild der Wissenschaft","pais":"Germany","titulo":"Deepfakes: How Forged Videos Can Be Better Detected in the Future","resumo":"Technology experts are developing new methods and algorithms to improve the identification of videos generated by artificial intelligence. The advancement of deepfakes poses serious challenges to the integrity of information, making the creation of efficient verification tools urgent.\nNew approaches aim to analyze visual micro-details and digital patterns imperceptible to the human eye.","link":"https://wissenschaft.de/artikel/deepfakes-so-koennten-gefaelschte-videos-kuenftig-besser-erkannt-werden","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Bild der Wissenschaft","pais":"Germany","titulo":"Glacial Melting Releases Ancient Methane","resumo":"Researchers warn that the accelerated retreat of glaciers due to climate change is releasing large amounts of ancient methane into the atmosphere. This greenhouse gas, trapped for millennia beneath the ice, could further intensify global warming if the process continues.\nThe discovery reinforces the urgent need for monitoring and mitigating climate impacts in polar and alpine regions.","link":"https://wissenschaft.de/artikel/schmelzende-gletscher-setzen-uraltes-methan-frei","categoria":"SCIENCE","lang":"en"},{"fonte":"Bild der Wissenschaft","pais":"Germany","titulo":"How Immune Cells in Adipose Tissue Hinder Weight Loss","resumo":"A new scientific study reveals that certain immune system cells present in adipose tissue can actively work to prevent weight loss. This inflammatory and metabolic response creates a biological barrier that hinders fat burning during conventional treatments.\nThe discovery paves the way for the development of new medical therapies aimed at combating obesity.","link":"https://wissenschaft.de/artikel/wie-immunzellen-im-fettgewebe-das-abnehmen-erschweren","categoria":"HEALTH","lang":"en"},{"fonte":"Bild der Wissenschaft","pais":"Germany","titulo":"Hidden Subterranean World: Fungi Thrive Hundreds of Meters Deep","resumo":"Recent scientific discoveries have revealed that fungal communities can adapt and thrive in ecosystems located hundreds of meters below the Earth's surface. This finding challenges previous biological limits regarding life in extreme, dark, and nutrient-scarce environments.\nUnderstanding this subterranean biome could yield valuable insights into biological evolution and biotechnology.","link":"https://wissenschaft.de/artikel/verborgene-unterwelt-pilze-gedeihen-noch-in-hunderten-meter-tiefe-2","categoria":"BIOLOGY","lang":"en"},{"fonte":"Mindener Tageblatt","pais":"Germany","titulo":"Is It Possible Without Them? How Animal Testing Should Be Replaced","resumo":"Researchers and scientific institutes are seeking to implement modern, ethical alternatives to replace the use of animals in laboratory testing. Innovative methods, such as human tissue-on-a-chip models and advanced artificial intelligence simulations, have demonstrated high precision.\nThis transition promises to transform medical and pharmaceutical research while reducing costs and ethical dilemmas.","link":"https://www.mt.de/weltnews/wissenschaft/Geht-es-ohne-Wie-Tierversuche-ersetzt-werden-sollen-24415235.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Mittelstand Nachrichten","pais":"Germany","titulo":"Green Party Leader Initiates Dialogue on AI with Economy, Science, and Civil Society","resumo":"A political initiative in Germany has opened a comprehensive debate bringing together sectors of the economy, the scientific community, and civil society to discuss the future of artificial intelligence. The goal is to balance technological innovation with ethical regulation and the socioeconomic impact of new digital tools.\nThe discussion aims to guide public policies that ensure responsible and competitive technological development.","link":"https://www.mittelstand-nachrichten.de/aktuell/dts_politik/franziska-brantner-startet-ki-dialog/","categoria":"INNOVATION","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"RIKEN unveils two new supercomputers for artificial intelligence and quantum computing","resumo":"Research institute RIKEN has announced the introduction of two new supercomputers designed to push the boundaries of Japan's technological frontiers.\nThe first machine is focused exclusively on the development of artificial intelligence applied to advanced scientific research.\nThe second system will work in direct integration with quantum computing, aiming to accelerate complex simulations and scientific discoveries.\nThis initiative reinforces the country's position as a global leader in high-performance computing infrastructure.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_ict/pt20260910000011.html","categoria":"SUPERCOMPUTING","lang":"en"},{"fonte":"読売新聞","pais":"Japan","titulo":"Japan and Netherlands strengthen cooperation in quantum technology development","resumo":"Japan and the Netherlands have signed a memorandum of cooperation focused on advancing and strengthening quantum technology development.\nThe agreement provides for the promotion of cutting-edge research exchanges and the training of specialized talent between both nations.\nThe partnership seeks to accelerate strategic innovations in quantum computing and communication on an international scale.\nWith the quantum ecosystem expanding rapidly, the alliance consolidates both countries' global technological alignment.","link":"https://www.yomiuri.co.jp/science/20260910-GYT1T00156/","categoria":"QUANTUM TECHNOLOGY","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Kyoto University develops new technology for printing vivid white color","resumo":"Researchers at Kyoto University have announced the development of an innovative technique capable of printing a vivid white color.\nThe technology overcomes traditional limitations in material pigmentation and opens new possibilities for the printing industry and new materials.\nThis technological progress promises to directly impact the manufacturing of displays, functional coatings, and advanced packaging.\nThis discovery highlights the leadership of Japanese universities in chemical and materials engineering research.","link":"https://news.yahoo.co.jp/pickup/6594837","categoria":"INNOVATION","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"Low Earth orbit satellite navigation research presented at ION GNSS+ conference","resumo":"Research results on positioning, navigation, and timing (PNT) in low Earth orbit (LEO) were presented at the international satellite positioning conference.\nThe technology aims to complement and increase the accuracy of traditional satellite navigation systems, reducing vulnerabilities to interference.\nThe deployment of satellites in lower orbits offers stronger signals and lower latency for critical automated navigation applications.\nThis advancement places Japanese researchers at the forefront of next-generation space location infrastructure.","link":"https://prtimes.jp/main/html/rd/p/000000148.000089783.html","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"\"Aconnect\" AI agent gains feature to identify issues from technical blueprints","resumo":"A new feature has been launched for the \"Aconnect\" artificial intelligence agent, aimed at research and development in the industrial sector.\nThe new functionality allows the system to analyze technical drawings and blueprints to automatically discover and articulate problems that need to be resolved.\nThe tool seeks to optimize engineers' time and accelerate innovation in the product design and manufacturing process.\nThis solution demonstrates the rapid expansion of autonomous AI agents being used to solve complex engineering challenges.","link":"https://prtimes.jp/main/html/rd/p/000000428.000024407.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Japan reaches top of OECD ranking in science, reading, and mathematics in PISA 2025","resumo":"Japan captured first place among OECD countries in science, reading, and mathematics tests on the PISA 2025 exam.\nThe results reflect the ongoing positive impact of educational reforms focused on critical thinking and STEM subjects.\nThis performance reaffirms the country's solid educational foundation, which is essential for maintaining global technological competitiveness over the coming decades.\nExperts highlight the effectiveness of integrating digital tools into the school curriculum to achieve this milestone.","link":"https://news.yahoo.co.jp/articles/e4c0e4756f21066d95b5f565be3582f8ab7f261c","categoria":"SCIENCE AND EDUCATION","lang":"en"},{"fonte":"ScanNetSecurity","pais":"Japan","titulo":"Tokyo University of Science infrastructure suffers unauthorized access","resumo":"The information technology infrastructure of the Tokyo University of Science has been the target of unauthorized access.\nThe institution warned of the possibility of leaked personal information belonging to students and staff following the system breach.\nInvestigations are underway to determine the extent of the incident and strengthen the cybersecurity of the academic network.\nThis case highlights the growing cyber risks threatening major educational institutions and research centers across the country.","link":"https://scan.netsecurity.ne.jp/article/2026/09/10/56191.html","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"jetro.go.jp","pais":"Japan","titulo":"Japan forms partnership with Purdue University for innovation and startup development","resumo":"A strategic cooperation memorandum has been signed with Purdue University focused on advancing cutting-edge technologies.\nThe alliance between the academic and industrial sectors of the United States and Japan aims to accelerate the commercialization of innovations and support startups.\nAdditionally, the agreement will promote the exchange of talent and researchers to strengthen the global tech ecosystem.\nThis cooperation reinforces the commitment to integrating scientific research into the high-complexity technology market.","link":"https://www.jetro.go.jp/news/releases/2026/4223d914ef98f57d.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"上观新闻","pais":"China","titulo":"PISA assessment warns that AI dependency in schoolwork harms science performance","resumo":"The latest PISA assessment has revealed an unexpected impact of artificial intelligence use in basic education.\nData indicates that students who rely excessively on AI tools to complete school assignments experience a lag in science performance equivalent to about one year of learning.\nThis study sounds a global alarm regarding the need to balance the integration of advanced technologies in the school environment with the development of students' critical thinking.","link":"https://www.jfdaily.com/news/detail?id=1174110","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"news.sciencenet.cn","pais":"China","titulo":"Most comprehensive map of molecular effects of human genetic mutations published","resumo":"Scientists have announced the publication of the most comprehensive map to date focusing on the molecular effects caused by mutations in the human genome.\nThe research details how minor genetic alterations affect essential cellular processes and predisposition to various complex pathologies.\nThis breakthrough promises to revolutionize precision medicine by accelerating the development of early diagnostics and targeted gene therapies.","link":"https://news.sciencenet.cn/htmlnews/2026/9/571195.shtm","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"同济大学新闻网","pais":"China","titulo":"Study reveals new molecular mechanism on the assembly of cellular stress granules","resumo":"A team from the School of Life Sciences and Technology has uncovered an unprecedented mechanism whereby the LENG8 protein mediates nucleation and drives the assembly of cellular stress granules.\nThe discovery, published in the scientific journal 'Frontiers Science', elucidates fundamental biological processes associated with cellular responses to extreme conditions.\nA detailed understanding of this dynamic opens new perspectives for the treatment of neurodegenerative diseases and metabolic disorders.","link":"https://news.tongji.edu.cn/info/1003/95499.htm","categoria":"SCIENCE","lang":"en"},{"fonte":"中国能源新闻网","pais":"China","titulo":"China completes first industrial higher alcohol project with 100% domestic technology","resumo":"China has completed and put into operation its first large-scale project for the production of high-chain alcohols utilizing entirely proprietary technology.\nWith an annual capacity of 100,000 tons, the facility marks a historic breakthrough for the technological independence of the national chemical industry.\nThis achievement substantially reduces reliance on foreign licenses and strengthens the supply chain for advanced synthetic materials.","link":"https://www.cpnn.com.cn/news/xwtt/202609/t20260910_1914012.html","categoria":"INNOVATION","lang":"en"},{"fonte":"InfoQ-CN","pais":"China","titulo":"Artificial intelligence rewrites global expansion strategy of Chinese companies","resumo":"Specialist Jiang Xiaojuan of the Chinese Academy of Sciences highlighted how AI is transforming the internationalization trajectory of the country's companies.\nTraditionally focused on consolidating the domestic market before expanding, Chinese companies now use artificial intelligence to be born with a global presence from day one.\nThis paradigm shift redefines competitiveness within the technology ecosystem and accelerates the creation of new digital business models.","link":"https://www.infoq.cn/article/7xE0eQlCGCSoM0wbmAoM","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"新浪网","pais":"China","titulo":"Popularization of 800V technology in electric vehicles sparks debates on its real necessity","resumo":"The 800V ultra-fast charging architecture is spreading rapidly across the electric vehicle market, driven by promises of drastically reduced recharge times.\nHowever, experts question whether the benefit outweighs the high cost of components and the challenges in existing grid infrastructure.\nThis analysis debates the balance between pure technical innovation and the actual practical utility demanded by the everyday consumer.","link":"https://k.sina.com.cn/article_5385244840_140fc50a8001023aco.html?from=auto","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"TV BRICS","pais":"China","titulo":"China builds its first large LNG carrier with an 88,000 cubic meter capacity","resumo":"China's shipbuilding industry has reached a milestone by completing the construction of its first large-scale vessel dedicated to liquefied natural gas (LNG) transport, boasting a capacity of 88,000 cubic meters.\nThe project incorporates cutting-edge engineering to optimize thermal insulation and fuel efficiency during long ocean voyages.\nThis advancement consolidates the country as an emerging hub for manufacturing vessels with high technological complexity and high added value.","link":"https://tvbrics.com/pt/news/china-constroi-1-navio-de-grande-porte-para-transporte-de-gnl-com-capacidade-de-88-mil-m/","categoria":"ENGINEERING","lang":"en"},{"fonte":"SWI swissinfo.ch","pais":"China","titulo":"China Calls US Accusations of AI Technology Theft Unfounded","resumo":"The Chinese government has formally rejected accusations by the United States regarding alleged industrial-scale theft of artificial intelligence technologies. Country representatives labeled the claims as unfounded and driven by geopolitical motives for technological containment. The episode intensifies the global dispute for dominance over critical AI infrastructure and raises concerns about increasing trade barriers in the high-tech sector.","link":"https://www.swissinfo.ch/por/china-considera-%27infundadas%27-acusa%C3%A7%C3%B5es-dos-eua-sobre-roubo-de-tecnologia-de-ia/92031839","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"India Joins 24 Countries in Global Initiative on 6G Technology","resumo":"India has joined forces with 24 nations in a global collaboration aimed at the development and standardization of 6G technology. The initiative seeks to establish secure, interoperable, and innovative guidelines for the next generation of mobile networks. This move consolidates the country's strategic role on the global tech stage, accelerating research and advanced connectivity infrastructure.","link":"https://newsonair.gov.in/india-joins-24-countries-in-global-initiative-on-6g-technology/","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"ET CIO","pais":"India","titulo":"India Has Potential to Lead Photonics Technology, Sector Could Quadruple by 2031","resumo":"A new report indicates that India possesses the necessary requirements to become a global leader in the photonics technology sector. The domestic market is expected to quadruple in size, reaching the 10 billion dollar mark by 2031. This growth will drive crucial innovations in telecommunications, sensors, and high-speed data processing.","link":"https://cio.economictimes.indiatimes.com/news/data-center/india-has-potential-to-lead-photonics-tech-industry-to-grow-4x-to-10-bn-by-2031/133990959?utm_source=portal_category_widget\u0026utm_medium=homepage","categoria":"DEEP TECH","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"From 10 GW Data Centers to $45B Space Economy: Jefferies Maps India's Next Leap","resumo":"A report by financial consultancy Jefferies highlights India's industrial transformation, driven by the advancement of the space sector and digital infrastructure. The study forecasts the expansion of data centers to a 10 GW capacity and the consolidation of a 45 billion dollar space economy. These projections signal a new era of economic growth anchored in cutting-edge technology and innovation.","link":"https://www.moneycontrol.com/news/business/markets/from-10-gw-data-centres-to-45-billion-space-economy-jefferies-maps-india-s-next-industrial-growth-engines-14026702.html","categoria":"INFRASTRUCTURE","lang":"en"},{"fonte":"Adgully.com","pais":"India","titulo":"Prime Video Launches New Lip-Sync Technology in the Series Maxton Hall","resumo":"Streaming platform Prime Video has introduced advanced AI-based technology to enhance the dubbing and lip-syncing of actors in the series Maxton Hall. The feature aims to offer a more natural and immersive visual experience for international audiences. The novelty represents a milestone in the use of technological tools within the digital entertainment sector.","link":"https://www.adgully.com/post/20372/prime-video-introduces-new-lip-sync-technology-on-maxton-hall","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Bloomberg.com","pais":"India","titulo":"Reserve Bank of India Sees Common Technology Providers as Financial Stability Risk","resumo":"The Reserve Bank of India (RBI) has warned of the financial stability risks arising from a concentrated reliance on a small number of technology providers by banking institutions. A centralized failure or cyberattack on these common vendors could trigger a chain reaction across the entire financial system. The regulator advocates for greater vigilance and risk mitigation strategies to protect the market.","link":"https://www.bloomberg.com/news/articles/2026-09-10/rbi-sees-common-technology-providers-as-financial-stability-risk","categoria":"FINTECH","lang":"en"},{"fonte":"Mid-Day","pais":"India","titulo":"Mumbai Schools Urged to Teach AI Awareness Without Overreliance","resumo":"Educational authorities in Mumbai have encouraged schools to include artificial intelligence awareness in their pedagogical guidelines. The guidance seeks to prepare students for the impacts of AI on society, promoting ethical use and critical thinking. The primary goal is to avoid overreliance on technology in students' daily academic routines.","link":"https://www.mid-day.com/mumbai/mumbai-news/article/mumbai-schools-urged-to-teach-children-ai-awareness-without-overreliance-on-technology-23649222","categoria":"EDUCATION","lang":"en"},{"fonte":"ANI News","pais":"India","titulo":"Chhattisgarh LLIGENCE","lang":"en"},{"fonte":"RTP","pais":"Portugal","titulo":"Apple Reveals Its First Foldable iPhone and Raises Prices Once Again","resumo":"Apple has officially announced its first smartphone with a foldable screen, marking a new era in its device portfolio. The new release promises to lead the premium market with cutting-edge flexible display technology and high performance. Despite enthusiasm for the innovation, the significant price hike on the devices has sparked debate among consumers.","link":"https://www.rtp.pt/noticias/economia/apple-revela-o-seu-primeiro-iphone-dobravel-e-volta-a-aumentar-os-precos_n1764515","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ifeed.pt","pais":"Portugal","titulo":"Apple Watch Series 12 and Ultra 4: Health and Sports Taken to Another Level","resumo":"The new generation of Apple smartwatches brings significant advancements in monitoring health metrics and physical conditioning. Featuring enhanced capabilities for athletes and new biometric sensors, the devices promise greater precision and battery life. The launch reinforces the brand's ecosystem leadership in the global wellness-focused wearable market.","link":"https://www.ifeed.pt/apple-watch-series-12-e-ultra-4-a-saude-e-o-desporto-noutro-nivel/","categoria":"LAUNCH","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"Omar Yaghi, Nobel Prize in Chemistry and Son of Palestinian Refugees: 'Since We Lost Everything We Had, Education Was the Only Way Out'","resumo":"Scientist Omar Yaghi, laureate with the Nobel Prize in Chemistry, shares his inspiring trajectory as the son of Palestinian refugees. He highlights how access to education transformed his reality and propelled his high-impact global scientific discoveries. His story reinforces the vital importance of investing in science and knowledge as drivers of social overcoming.","link":"https://expresso.pt/sociedade/ciencia/2026-09-10-omar-yaghi-nobel-da-quimica-e-filho-de-refugiados-palestinianos-como-perdemos-tud   const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
