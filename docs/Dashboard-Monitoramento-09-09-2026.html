nsumer market during the IFA Berlin 2026 trade show.\nHighlights include AI-integrated smart devices, automated home ecosystems, and health-focused wearable innovations.\nThe strong Chinese presence at the event demonstrates how local scientific research is rapidly being converted into global consumer products.","link":"https://portuguese.xinhuanet.com/20260909/4c9b287c105649539067f321b874b53e/c.html","categoria":"INNOVATION","lang":"en"},{"fonte":"兰州大学新闻网","pais":"China","titulo":"Lanzhou University Develops High-Precision Calorimeter for Medical Isotope Measurement","resumo":"Lanzhou University's Rare Isotope Science Center has successfully developed an ultra-high-precision calorimeter.\nThe equipment offers an independent national technological solution to accurately measure the activity of radioactive isotopes used in medicine.\nThis innovation promises to raise the safety and efficacy of radiopharmaceutical treatments in cancer diagnosis and therapy.","link":"https://news.lzu.edu.cn/info/1051/1171455.htm","categoria":"MEDICAL TECHNOLOGY","lang":"en"},{"fonte":"Devdiscourse","pais":"India","titulo":"Space Tech Startup GalaxEye Secures US Patent for Innovative Imaging System","resumo":"Indian space startup GalaxEye has secured a United States patent for its revolutionary satellite-integrated sensor technology.\nThe new system combines optical and synthetic aperture radar data to generate ultra-high-resolution imagery under any weather conditions.\nThe achievement reinforces India's role as an emerging hub for private aerospace innovation and opens doors for global expansion.","link":"https://www.devdiscourse.com/article/science-environment/3974697-galaxeye-secures-us-patent-for-cutting-edge-satellite-imaging","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"The Economic Times","pais":"India","titulo":"Marvell Technology Shares Surge Driven by Strong Demand for AI Chips","resumo":"Shares of semiconductor company Marvell Technology registered a significant rally in the global financial market driven by the demand for Artificial Intelligence.\nThe surge reflects investor optimism regarding the supply of specialized chips for data centers and cloud infrastructure.\nExperts point out that the AI race will continue to boost the company's results in the coming quarters.","link":"https://m.economictimes.com/markets/us-stocks/news/marvell-technology-shares-soar-whats-driving-the-ai-chip-rally/slideshow/133954721.cms","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"aninews.in","pais":"India","titulo":"Novo Group Holds Event in Bengaluru to Strengthen India's Science and Health Ecosystem","resumo":"Novo Group hosted its inaugural 'India Day' event in the tech hub of Bengaluru with the presence of leaders and researchers.\nThe initiative aims to consolidate long-term partnerships focused on the advancement of science, health innovation, and sustainable development in the country.\nThrough this action, the organization reaffirms its commitment to boosting local scientific initiatives and technology ecosystems.","link":"https://www.aninews.in/news/business/novo-group-holds-inaugural-india-day-in-bengaluru-reaffirming-long-term-commitment-to-the-countrys-health-science-and-sustainability-ecosystem20260909101259","categoria":"SCIENCE AND HEALTH","lang":"en"},{"fonte":"TradingView","pais":"India","titulo":"Dutch Fintech Adyen Plans Long-Term Expansion in the Indian Market","resumo":"Dutch financial technology giant Adyen has announced strategic expansion plans to strengthen its presence in the Indian market.\nThe company sees significant growth potential in the country's digital payments ecosystem, driven by consumption and innovation.\nThe initiative aims to serve both local corporations and international companies expanding in the region.","link":"https://es.tradingview.com/news/reuters.com,2026:newsml_L8N45104Z:0/","categoria":"FINTECH","lang":"en"},{"fonte":"fundsforNGOs","pais":"India","titulo":"India Opens Applications for Science and Technology Seed Grant Program","resumo":"Applications are now open for the Science and Technology Seed Grant Program aimed at researchers and startups in India.\nThe program seeks to support innovative projects in early stages of development, promoting high-impact technological solutions.\nThe initiative aims to strengthen the national innovation ecosystem and encourage applied scientific research in the country.","link":"https://www2.fundsforngos.org/innovation/apply-for-science-and-technology-seed-grant-program-india/","categoria":"SCIENCE AND TECHNOLOGY","lang":"en"},{"fonte":"Telegraph India","pais":"India","titulo":"India's 7.8% Economic Growth Boosts Global Confidence, Modi Emphasizes","resumo":"Prime Minister Narendra Modi highlighted India's 7.8% GDP growth as a milestone for the country's development.\nThe strong expansion reinforces India's position as one of the world's fastest-growing economies, highly attractive to international investors.\nThe outcome elevates global confidence in the economic reforms and technological advancements driven by the Indian government.","link":"https://www.telegraphindia.com/amp/business/india-economy-growth-modi-says-7-8-per-cent-expansion-boosts-global-confidence-today-prnt/cid/2179014","categoria":"ECONOMY","lang":"en"},{"fonte":"India Technology News","pais":"India","titulo":"Bharat, Technology, and Consciousness: The Emergence of a New World Order","resumo":"The intersection of technological innovation, cultural heritage, and human development is shaping India's role on the global stage.\nExperts analyze how the concept of Bharat and the integration of emerging technologies are helping redefine leadership in the new century.\nThe debate underscores the country's pursuit of a digital transformation paired with ethical responsibility and social consciousness.","link":"https://indiatechnologynews.in/bharat-technology-consciousness-and-the-rise-of-a-new-world-order/","categoria":"TECHNOLOGY","lang":"en"} iently reduce emissions.\nThe debate puts the bloc's strategy for achieving climate neutrality into question, raising doubts regarding the allocation of public funds.","link":"https://pt.euronews.com/2026/09/09/uniao-europeia-investe-em-captura-de-carbono-sob-fogo-por-tecnologia-nao-comprovada","categoria":"SCIENCE","lang":"en"},{"fonte":"Flash.pt","pais":"Portugal","titulo":"Say Goodbye to Chores: The Laser Robot Vacuum That Does It All and Even Eliminates Bacteria","resumo":"New models of robotic vacuums equipped with high-precision laser navigation for detailed home mapping have hit the market.\nIn addition to completely automating the cleaning of different surfaces, the devices feature systems capable of eliminating germs and bacteria.\nThe innovation promises to revolutionize household cleaning routines, offering convenience and efficiency with minimal human intervention.","link":"https://www.flash.pt/indica/casa-e-decoracao/detalhe/diga-adeus-as-limpezas-o-aspirador-robo-com-tecnologia-laser-que-faz-tudo-por-si-e-elimina-ate-as-bacterias","categoria":"INNOVATION","lang":"en"},{"fonte":"expresso.pt","pais":"Portugal","titulo":"What Are the Revenues of the 50 Fastest-Growing Tech Companies in Portugal?","resumo":"A new survey reveals the revenue figures for the 50 fastest-growing technology companies operating in Portugal.\nThe Portuguese tech sector continues to demonstrate strong momentum, attracting international capital and boosting the country's digital economy.\nThe data highlights the scalability of the local startup ecosystem and the region's consolidation as a major European innovation hub.","link":"https://expresso.pt/podcasts/economia-dia-a-dia/2026-09-08-quanto-faturam-as-50-tecnologicas-que-mais-crescem-em-portugal--65558173","categoria":"BUSINESS","lang":"en"},{"fonte":"ECO","pais":"Portugal","titulo":"Only Construction and Technology Are Creating More Companies This Year; Insolvencies Rise 1.3%","resumo":"The Portuguese business landscape reports that the creation of new companies is concentrated almost exclusively in the construction and technology sectors.\nMeanwhile, the country faces a 1.3% increase in the number of insolvencies compared to the same period last year.\nThe data reveals an economic polarization where innovation and infrastructure segments stand out while traditional segments face pressure.","link":"https://eco.sapo.pt/2026/09/08/so-construcao-e-tecnologia-estao-a-criar-mais-empresas-este-ano-insolvencias-aumentam-13/","categoria":"BUSINESS","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
