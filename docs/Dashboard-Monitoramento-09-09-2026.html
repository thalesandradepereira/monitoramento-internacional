l","resumo":"Autoridades dos Estados Unidos intensificaram as acusações contra empresas de tecnologia da China, alegando práticas sistemáticas de apropriação indébita de modelos de IA americanos. De acordo com o governo norte-americano, o desvio ilícito de algoritmos e sistemas avançados tem sido o pilar do progresso chinês na área. O episódio eleva as tensões geopolíticas e deve acelerar novas restrições de exportação de tecnologia crítica.","link":"https://www.terra.com.br/economia/eua-acusam-empresas-chinesas-de-roubo-de-tecnologia-de-ia-em-escala-industrial,0f2743703b7df48d44ce9e07a77314c1qghljehq.html","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"DefenseScoop","pais":"Estados Unidos","titulo":"DIU e Honeywell realizam testes de voo com tecnologia de sensoriamento quântico para navegação","resumo":"A Unidade de Inovação em Defesa dos Estados Unidos e a Honeywell Aerospace concluíram testes de voo utilizando sensores quânticos avançados para navegação aérea. A tecnologia permite determinar a posição exata de aeronaves em ambientes onde os sinais de GPS estejam indisponíveis ou sofrendo interferências. O avanço representa um marco prático para a aplicação operacional de sistemas quânticos na aviação e defesa.","link":"https://defensescoop.com/2026/09/08/diu-honeywell-aerospace-flight-test-magnav-system/","categoria":"TECNOLOGIA QUÂNTICA","lang":"pt"},{"fonte":"samueli.ucla.edu","pais":"Estados Unidos","titulo":"Estudante de ciência da computação da UCLA desenvolve ferramentas para comunicação entre carros autônomos","resumo":"Um estudante da Universidade da Califórnia em Los Angeles criou uma plataforma inovadora que permite a troca de dados em tempo real entre veículos autônomos. O sistema auxilia na identificação conjunta de obstáculos e no mapeamento de tráfego, garantindo maior segurança no compartilhamento das vias. O projeto demonstra o impacto da pesquisa acadêmica na aceleração e consolidação do transporte autônomo nas cidades.","link":"https://samueli.ucla.edu/from-backyard-ziplines-to-self-driving-cars-ucla-computer-science-student-develops-tools-to-help-autonomous-vehicles-safely-share-information/","categoria":"VEÍCULOS AUTÔNOMOS","lang":"pt"},{"fonte":"TVI","pais":"Estados Unidos","titulo":"Irão anuncia captura de submarino inteligente dos EUA equipado com tecnologia avançada","resumo":"O governo do Irã afirmou ter capturado um submarino autônomo de alta tecnologia pertencente às forças armadas dos Estados Unidos. A embarcação não tripulada estaria equipada com inteligência artificial, sensores avançados e sistemas de navegação de última geração. O incidente levanta preocupações estratégicas em relação ao risco de engenharia reversa e à proteção de tecnologias militares confidenciais.","link":"https://tvi.iol.pt/noticias/estados-unidos/guerra-no-medio-oriente/irao-anuncia-captura-de-submarino-inteligente-dos-eua-com-a-tecnologia-mais-avancada-do-mundo/20260908/6aa034b4d34ed0733ba840a8","categoria":"DEFESA","lang":"pt"},{"fonte":"MIT NSE","pais":"Estados Unidos","titulo":"Uso de ciência computacional de materiais permite projetar combustíveis nucleares mais eficientes","resumo":"Pesquisadores estão utilizando simulações computacionais avançadas de ciência dos materiais para desenvolver combustíveis nucleares de maior rendimento e durabilidade. A inovação otimiza o desempenho dos reatores e reduz a frequência de recarga, aumentando a eficiência na geração de energia de baixa emissão. A abordagem computacional acelera o ciclo de desenvolvimento de novos materiais para a transição energética.","link":"https://nse.mit.edu/mack-cleveland-using-computational-materials-science-to-engineer-higher-burnup-fuels/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Euronews.com","pais":"França","titulo":"Captura de carbono contestada: UE aposta em tecnologia considerada não comprovada","resumo":"A União Europeia está apostando fortemente em tecnologias de captura e armazenamento de carbono para atingir suas metas climáticas.\nNo entanto, diversos especialistas e grupos ambientalistas questionam a eficácia e a viabilidade dessas soluções em grande escala.\nO debate levanta dúvidas sobre os riscos de depender de métodos ainda não totalmente comprovados para mitigar as emissões globais.\nA decisão pode impactar investimentos futuros e a regulamentação ambiental em todo o bloco europeu.","link":"https://fr.euronews.com/2026/09/09/captage-du-carbone-conteste-lue-parie-sur-une-technologie-jugee-non-eprouvee","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"MUNDIARIO","pais":"França","titulo":"A tecnologia que protege a Monalisa no Museu do Louvre","resumo":"O Museu do Louvre emprega sistemas tecnológicos de ponta para garantir a preservação e a segurança da famosa obra Monalisa.\nSensores avançados monitoram constantemente parâmetros como umidade, temperatura e vibrações ao redor da pintura de Leonardo da Vinci.\nAlém do controle ambiental rigoroso, barreiras protetoras e monitoramento inteligente auxiliam na proteção da peça.\nEssa integração de tecnologia com arte é fundamental para conter a degradação e proteger o acervo contra incidentes.","link":"https://www.mundiario.com/articulo/tecnologia-ciencia/tecnologia-que-protege-mona-lisa-museo-futuro-aqui/20260909064741440073.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Sortir à Paris","pais":"França","titulo":"Festa da Ciência 2026: diversas atividades para todos em Orsay","resumo":"A cidade de Orsay prepara uma ampla programação para a edição de 2026 da Festa da Ciência, voltada a participantes de todas as idades.\nO evento contará com oficinas interativas, palestras com pesquisadores e exposições para democratizar o saber científico.\nA iniciativa visa aproximar a comunidade das principais inovações e pesquisas desenvolvidas na região.\nA celebração reforça o papel da divulgação científica no engajamento da sociedade e na formação de novos talentos.","link":"https://www.sortiraparis.com/enfant-famille/articles/333195-fete-de-la-science-2026-de-nombreuses-animations-pour-tous-a-orsay-91","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"North Wales Pioneer","pais":"Inglaterra","titulo":"Exposição em Llandudno apresenta tecnologias para pessoas com perda de visão","resumo":"Uma nova exposição realizada em Llandudno apresenta inovações tecnológicas desenvolvidas para auxiliar indivíduos com deficiência visual no dia a dia. O evento reúne dispositivos assistivos modernos, softwares de acessibilidade e soluções de mobilidade para promover maior autonomia. Especialistas e visitantes exploram como essas ferramentas podem transformar a qualidade de vida e a inclusão social de pessoas com perda de visão. A iniciativa destaca o papel crucial da tecnologia assistiva na superação de barreiras diárias.","link":"https://www.northwalespioneer.co.uk/news/26532883.llandudno-exhibition-features-technology-sight-loss/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Lancashire Telegraph","pais":"Inglaterra","titulo":"Nova tecnologia de terapia contra o câncer beneficiará centenas de pacientes em Preston","resumo":"Um centro médico em Preston adotou uma tecnologia avançada de terapia contra o câncer destinada a otimizar o tratamento de centenas de pessoas. O novo equipamento oferece maior precisão no combate a tumores, minimizando os danos aos tecidos saudáveis ao redor. Com essa inovação, a expectativa é de aumentar as taxas de sucesso dos tratamentos e reduzir significativamente os efeitos colaterais. O avanço representa um marco importante para a medicina local e para o bem-estar dos pacientes em oncologia.","link":"https://www.lancashiretelegraph.co.uk/news/26529100.new-cancer-therapy-technology-introduced-preston/","categoria":"SAÚDE","lang":"pt"},{"fonte":"Recycling Today","pais":"Inglaterra","titulo":"Scottish Water utiliza tecnologia Envetec Generations para reduzir resíduos plásticos em laboratórios","resumo":"A empresa pública Scottish Water implementou a tecnologia Envetec Generations para tratar e neutralizar resíduos plásticos de laboratório diretamente na origem. A solução permite triturar e desinfetar resíduos biológicos perigosos, transformando-os em materiais seguros para reciclagem. Essa abordagem inovadora reduz drasticamente a pegada de carbono e o volume de resíduos plásticos descartados em aterros. A iniciativa reforça o compromisso da organização com a sustentabilidade ambiental e a eficiência operacional em suas pesquisas.","link":"https://www.recyclingtoday.com/news/scottish-water-uses-envetev-generations-technology-to-reduce-plastic-waste/","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"GOV.UK","pais":"Inglaterra","titulo":"Cat Little é nomeada nova Secretária Permanente do Departamento de Negócios, Inovação, Ciência e Comércio","resumo":"Cat Little foi oficialmente nomeada como a nova Secretária Permanente do Departamento de Negócios, Inovação, Ciência e Comércio do Reino Unido. A executiva assume o cargo estratégico com a missão de impulsionar o crescimento econômico e fortalecer as políticas de ciência e inovação. Sua gestão será fundamental para liderar iniciativas de suporte ao setor de tecnologia e ao comércio internacional do país. A nomeação reflete um esforço do governo para consolidar a liderança britânica no cenário global de negócios e desenvolvimento científico.","link":"https://www.gov.uk/government/news/cat-little-appointed-as-new-permanent-secretary-department-for-business-innovation-science-and-trade","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"New Scientist","pais":"Inglaterra","titulo":"Os melhores novos livros de divulgação científica de setembro incluem obras de Carlo Rovelli e Xand van Tulleken","resumo":"A seleção dos melhores livros de divulgação científica de setembro traz obras de renomados autores como Carlo Rovelli e Xand van Tulleken. Os títulos abordam desde os mistérios da física quântica e da cosmologia até temas práticos da medicina e do corpo humano. As publicações buscam tornar conceitos científicos complexos acessíveis e fascinantes para o público geral. A lista destaca tendências literárias que estimulam a curiosidade intelectual e a compreensão da ciência no cotidiano.","link":"https://www.newscientist.com/article/2587859-the-best-new-popular-science-books-of-september-2026/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Schools Week","pais":"Inglaterra","titulo":"PISA 2025: Crescimento geral no desempenho, mas lacuna de gênero em ciências se amplia","resumo":"Os resultados do PISA 2025 mostram uma evolução global nas notas dos estudantes, revelando avanços significativos na aprendizagem. Apesar do progresso geral, o relatório aponta uma preocupante ampliação da disparidade de gênero na área das ciências. Especialistas destacam a necessidade urgente de políticas públicas direcionadas para incentivar meninas a seguirem carreiras científicas. Os dados servem como um alerta para educadores e formuladores de políticas sobre a igualdade de oportunidades na educação em STEM.","link":"https://schoolsweek.co.uk/pisa-2025-rise-across-the-board-but-science-gender-gap-opens/","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Inglaterra sobe nos rankings de leitura, matemática e ciências, enquanto Escócia e País de Gales caem","resumo":"A Inglaterra registrou uma melhora significativa nos rankings educacionais de leitura, matemática e ciências no contexto do Reino Unido. Em contrapartida, os dados indicam uma queda no desempenho escolar de estudantes na Escócia e no País de Gales. A discrepância reforça os debates sobre as diferentes abordagens pedagógicas e investimentos aplicados por cada nação britânica. O resultado destaca a posição de liderança da Inglaterra na consolidação do aprendizado fundamental e científico entre os jovens.","link":"https://www.bbc.co.uk/news/articles/cvgy6n0l4rdo","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"Expansión","pais":"Espanha","titulo":"Meta lança assistente pessoal com IA para tarefas do dia a dia","resumo":"A Meta anunciou o lançamento de um novo assistente pessoal baseado em inteligência artificial projetado para auxiliar usuários em tarefas cotidianas.\nA ferramenta busca otimizar a produtividade e a organização pessoal integrando-se diretamente aos ecossistemas da empresa.\nO avanço reforça a corrida global pelo domínio dos assistentes virtuais de última geração na rotina dos consumidores.","link":"https://www.expansion.com/economia-digital/2026/09/08/6aa06020468aeb62558b456d.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"20minutos.es","pais":"Espanha","titulo":"Google reforça o Android 17 para evitar golpes que forçam o uso de tecnologias antigas","resumo":"O Google implementou novas camadas de segurança no sistema operacional Android 17 para combater fraudes sofisticadas.\nAs medidas visam impedir que cibercriminosos explorem vulnerabilidades ao forçar dispositivos a se conectarem a redes legadas.\nA atualização representa um importante passo no combate a golpes de engenharia social e na proteção de dados sensíveis.","link":"https://www.20minutos.es/tecnologia/ciberseguridad/google-refuerza-android-17-evitar-estafas-obligan-movil-volver-antigua-tecnologia_7032943_0.html","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"日本経済新聞","pais":"Espanha","titulo":"Fundo NTT IOWN faz seu primeiro investimento em startup espanhola de tecnologia óptica","resumo":"O fundo NTT IOWN realizou seu primeiro aporte financeiro escolhendo uma startup de tecnologia óptica com sede na Espanha.\nA iniciativa visa acelerar a pesquisa e o desenvolvimento de infraestruturas de comunicação quântica e de alta velocidade.\nO investimento destaca a crescente relevância do ecossistema de inovação espanhol no cenário tecnológico global.","link":"https://www.nikkei.com/article/DGXZQOUC0855V0Y6A900C2000000/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Expansión","pais":"Espanha","titulo":"O que é a Chippio, a comercializadora de energia impulsionada por inteligência artificial","resumo":"A Chippio surge como uma comercializadora de energia inovadora ao utilizar modelos de inteligência artificial para otimizar custos aos clientes.\nA plataforma analisa padrões de consumo em tempo real para oferecer tarifas mais eficientes e sustentáveis no mercado elétrico.\nA solução reflete como a IA está transformando o setor de utilidades públicas e promovendo a transição energética inteligente.","link":"https://www.expansion.com/economia-sostenible/2026/09/09/6a9ff77b468aeb427f8b4596.html","categoria":"ENERGIA E IA","lang":"pt"},{"fonte":"casadomo","pais":"Espanha","titulo":"Nova UTI Pediátrica do Hospital Miguel Servet traz tecnologia de última geração","resumo":"O Hospital Infantil Miguel Servet inaugurou uma nova Unidade de Terapia Intensiva Pediátrica equipada com avanços tecnológicos de ponta.\nO projeto conta com equipamentos modernos de monitoramento e suporte vital para melhorar os diagnósticos e cuidados críticos.\nA modernização eleva os padrões do atendimento hospitalar público e representa um salto na medicina intensiva da região.","link":"https://www.casadomo.com/2026/09/09/nueva-uci-pediatrica-hospital-infantil-miguel-servet-incluye-tecnologia-ultima-generacion","categoria":"TECNOLOGIA MÉDICA","lang":"pt"},{"fonte":"Investing.com España","pais":"Espanha","titulo":"Rivian destaca avanços do modelo R2 na Conferência Goldman Sachs Communacopia + Tecnologia","resumo":"Durante a conferência da Goldman Sachs, a fabricante Rivian apresentou atualizações significativas sobre o desenvolvimento do seu novo SUV elétrico, o R2.\nA empresa detalhou estratégias de eficiência produtiva, redução de custos e expansão de mercado para os próximos anos.\nO anúncio reafirma o posicionamento da marca na disputa por um espaço de destaque na transição global para a mobilidade elétrica.","link":"https://es.investing.com/news/transcripts/rivian-en-la-conferencia-goldman-sachs-communacopia--tecnologia-2026-avances-del-r2-93CH-3826460","categoria":"VEÍCULOS ELÉTRICOS","lang":"pt"},{"fonte":"Notebookcheck.org","pais":"Espanha","titulo":"Citizen lança dois novos relógios Attesa de edição limitada com tecnologia Satellite Wave GPS e Super Titanium","resumo":"A tradicional fabricante Citizen apresentou dois novos modelos da linha Attesa de edição limitada construídos com material Super Titanium.\nOs dispositivos contam com a avançada tecnologia Satellite Wave GPS, garantindo precisão horária absoluta ao sincronizar com satélites no espaço.\nO lançamento une engenharia de precisão, alta durabilidade e design sofisticado para os entusiastas da alta relojoaria tecnológica.","link":"https://www.notebookcheck.org/Citizen-lanza-dos-nuevos-relojes-Attesa-de-edicion-limitada-con-tecnologia-Satellite-Wave-GPS-y-cajas-de-Super-Titanium.1394316.0.html","categoria":"DISPOSITIVOS","lang":"pt"},{"fonte":"20minutos.es","pais":"Espanha","titulo":"Tecnologia do scrolling e inclusão sem recursos são debatidas após dados do relatório PISA","resumo":"A publicação do relatório PISA acendeu alertas sobre a relação entre o uso descontrolado de redes sociais e a queda no desempenho escolar.\nEspecialistas debatem como a \"tecnologia do scrolling\" e a escassez de recursos pedagogicos afetam a inclusão de crianças vulneráveis.\nO cenário exige uma reflexão profunda sobre políticas públicas, mediação digital e estratégias de apoio nas salas de aula.","link":"https://www.20minutos.es/nacional/tecnologia-scrolling-pobreza-infantil-una-inclusion-sin-recursos-tras-crisis-educativa-que-refleja-informe-pisa_7034304_0.amp.html","categoria":"SOCIEDADE E TECNOLOGIA","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Feira de eletrônicos: 240 mil visitantes vivenciaram IA e robôs na IFA","resumo":"A IFA em Berlim, uma das maiores feiras de eletrônicos de consumo do mundo, atraiu 240 mil visitantes em sua edição recente.\nO evento destacou avanços significativos em inteligência artificial e robótica voltados para o cotidiano dos consumidores.\nA grande adesão reforça o papel da Alemanha como um hub estratégico para a apresentação de inovações tecnológicas globais.","link":"https://www.sueddeutsche.de/wirtschaft/elektronikmesse-240-000-besucher-erlebten-ki-und-roboter-auf-der-ifa-dpa.urn-newsml-dpa-com-20090101-260909-930-656150","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Valencia Plaza","pais":"Alemanha","titulo":"Setor tecnológico alerta economia na IFA Berlim: avanço chinês, produtos premium e agentes de IA","resumo":"Durante a IFA em Berlim, líderes da indústria de tecnologia alertaram sobre grandes transformações que afetarão diversos setores econômicos.\nAs principais tendências apresentadas incluem o avanço agressivo de fabricantes chinesas, o foco em dispositivos premium e o surgimento de agentes autônomos de IA.\nEsses fatores redefinem a competitividade global e as expectativas de inovação nos próximos anos.","link":"https://valenciaplaza.com/foro-plaza/el-sector-tecnologico-avisa-al-resto-de-la-economia-desde-ifa-berlin-invasion-china-productos-premium-y-agentes-de-ia","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Evento de novidades: Esperado o primeiro iPhone dobrável da Apple","resumo":"A expectativa no setor de tecnologia cresce em torno do próximo grande evento de lançamentos da Apple.\nRumores e análises de mercado apontam para a possível revelação do primeiro iPhone dobrável da empresa, um movimento aguardado há anos.\nA novidade pode redefinir o mercado de smartphones premium e acirrar a concorrência com rivais que já dominam o formato.","link":"https://www.sueddeutsche.de/wirtschaft/neuheiten-event-erstes-auffaltbares-iphone-von-apple-erwartet-dpa.urn-newsml-dpa-com-20090101-260909-930-655573","categoria":"LANÇAMENTO","lang":"pt"},{"fonte":"PR TIMES","pais":"Alemanha","titulo":"Tanaka Kikinzoku estreia na feira internacional de tecnologia de hidrogênio em Hamburgo","resumo":"A empresa japonesa Tanaka Kikinzoku anunciou sua primeira participação na Hydrogen Technology World Expo 2026, realizada em Hamburgo, Alemanha.\nO evento é um dos principais encontros globais dedicados ao desenvolvimento de tecnologias limpas e energia à base de hidrogênio.\nA presença destaca a crescente cooperação internacional e a centralidade da Alemanha na transição energética global.","link":"https://prtimes.jp/main/html/rd/p/000000115.000031501.html","categoria":"ENERGIA LIMPA","lang":"pt"},{"fonte":"BILD","pais":"Alemanha","titulo":"PISA 2025: Alemanha fica abaixo do nível esperado em leitura, matemática e ciências","resumo":"Os resultados do relatório PISA acenderam um alerta no sistema educacional da Alemanha após o país registrar queda no desempenho em leitura, matemática e ciências.\nO declínio nos indicadores levanta discussões urgentes sobre reformas pedagógicas e investimentos em infraestrutura escolar.\nA situação gera preocupação quanto à competitividade científica e tecnológica do país a longo prazo.","link":"https://www.bild.de/politik/inland/pisa-2025-deutschland-unterbietet-niveau-in-lesen-mathe-und-naturwissenschaften-6a9fbbeb181cb962d488789f","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"客观日本","pais":"Japão","titulo":"RIKEN lança novo supercomputador com IA e tecnologia quântica para revolucionar a pesquisa científica","resumo":"O instituto de pesquisa japonês RIKEN iniciou a operação de um novo supercomputador projetado para integrar inteligência artificial e tecnologias quânticas.\nA iniciativa busca acelerar a inovação científica e impulsionar uma revolução industrial orientada pelo processamento de dados de altíssimo desempenho.\nA plataforma visa atender demandas crescentes por simulações complexas e análise massiva de informações em diversas disciplinas acadêmicas e setores estratégicos.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_ict/pt20260909000013.html","categoria":"SUPERCOMPUTAÇÃO","lang":"pt"},{"fonte":"日テレNEWS NNN","pais":"Japão","titulo":"O que é o HAPS? A tecnologia de estações base voadoras e o futuro das comunicações aéreas","resumo":"As plataformas de grande altitude conhecidas como HAPS atuam como estações base voadoras posicionadas na estratosfera para fornecer conectividade contínua.\nEssa tecnologia promete expandir a cobertura de comunicação para áreas remotas e marítimas onde antenas terrestres convencionais não conseguem alcançar.\nO ecossistema aéreo no Japão avança rapidamente para garantir redundância em cenários de desastres naturais e universalizar o acesso à internet.","link":"https://news.ntv.co.jp/category/economy/1b9c680ef9b349029a9a03ad93bfc0a9","categoria":"TELECOMUNICAÇÕES","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"ugo é selecionada em projeto governamental para desenvolvimento de robôs semi-humanoides","resumo":"A startup japonesa ugo foi aprovada no projeto nacional GENIAC, promovido pelo Ministério da Economia, Comércio e Indústria (METI) e pela NEDO.\nA empresa focará no desenvolvimento de modelos de IA do tipo VTLA para capacitar robôs semi-humanoides de dois braços a realizarem tarefas complexas.\nO avanço busca suprir a escassez de mão de obra no Japão por meio do fortalecimento de infraestruturas robóticas inteligentes e versáteis.","link":"https://prtimes.jp/main/html/rd/p/000000177.000034305.html","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"global.toshiba","pais":"Japão","titulo":"Japão seleciona projetos para desenvolvimento e construção de reatores nucleares inovadores de próxima geração","resumo":"O Ministério da Economia, Comércio e Indústria do Japão anunciou a seleção de empresas para o desenvolvimento de reatores nucleares inovadores.\nO programa busca fortalecer a cadeia de suprimentos nacional e acelerar o fornecimento de energia limpa e estável de próxima geração.\nA iniciativa faz parte do plano estratégico do país para atingir a neutralidade de carbono e garantir a segurança energética do setor industrial.","link":"https://www.global.toshiba/jp/news/energy/2026/09/news-20260909-01.html","categoria":"ENERGIA","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Yano Research divulga projeções sobre o mercado global de condução autônoma e sistemas ADAS","resumo":"Um novo relatório publicado pelo Yano Research Institute analisa as perspectivas e tendências do mercado global de veículos autônomos e ADAS.\nO estudo destaca a rápida adoção de tecnologias de sensorização e inteligência artificial embarcada nos novos modelos automotivos.\nAlém disso, o documento aponta regulamentações governamentais e demandas de segurança veicular como os principais impulsionadores desse setor.","link":"https://www.nikkei.com/article/DGXZRSP712344_Z00C26A9000000/","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"客观日本","pais":"Japão","titulo":"Universidade Tokai desenvolve elemento termoelétrico versátil que gera energia e mede fluxo térmico","resumo":"Pesquisadores da Universidade Tokai desenvolveram um dispositivo termoelétrico inovador capaz de gerar energia e medir fluxo de calor simultaneamente.\nO componente aproveita variações térmicas para alimentar pequenos dispositivos eletrônicos sem depender de baterias tradicionais.\nA inovação abre novas possibilidades de aplicação em sensores vestíveis, monitoramento industrial e tecnologias de eficiência energética.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_new/pt20260909000012.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"news.yahoo.co.jp","pais":"Japão","titulo":"Secretário de Transportes dos EUA alerta Ford sobre dependência de tecnologia chinesa","resumo":"O governo dos Estados Unidos emitiu um aviso direto à fabricante Ford quanto ao uso de tecnologias chinesas em veículos elétricos.\nA preocupação central envolve questões de segurança cibernética, soberania de dados e dependência na cadeia de suprimentos de baterias.\nO alerta reflete o aumento das tensões geopolíticas no setor automotivo e impõe novos desafios regulatórios para montadoras globais.","link":"https://news.yahoo.co.jp/articles/2dea2c7c579a92c4192ce5102c5306d56ab6ba25","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"FastLabel é escolhida em projeto nacional do Japão para modelos base de robótica com IA","resumo":"A FastLabel foi selecionada para participar da iniciativa governamental GENIAC, voltada ao desenvolvimento de modelos fundamentais de robótica.\nA empresa fornecerá infraestrutura avançada de dados de IA para acelerar a criação de robôs autônomos industriais de alta precisão.\nO projeto visa consolidar a posição do Japão na vanguarda do desenvolvimento de inteligência artificial aplicada à robótica.","link":"https://prtimes.jp/main/html/rd/p/000000211.000065427.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Telescópio FAST da China mapeia o maior mapa de gás cósmico do universo","resumo":"O radiotelescópio chinês FAST, conhecido como o \"Olho da China para o Céu\", concluiu com sucesso o mapeamento do maior atlas de gás cósmico já registrado.\nA pesquisa fornece dados sem precedentes sobre a distribuição e evolução de átomos de hidrogênio no meio intergaláctico.\nEssa conquista científica promete impulsionar novas teorias sobre a formação de galáxias e a estrutura em grande escala do universo.","link":"https://news.sciencenet.cn/htmlnews/2026/9/571120.shtm","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Insilico Medicine","pais":"China","titulo":"Medicamento inovador de IA Rentosertib demonstra potencial antienvelhecimento na Nature Biotechnology","resumo":"Um estudo publicado na prestigiada revista Nature Biotechnology revelou que o medicamento Rentosertib, desenvolvido pela Insilico Medicine com uso de IA, demonstrou capacidade de reverter a idade biológica.\nTestes com seis diferentes relógios epigenéticos confirmaram de forma consistente os efeitos terapêuticos na diminuição do envelhecimento celular.\nO avanço consolida a aplicação da inteligência artificial na descoberta de terapias revolucionárias voltadas à longevidade e saúde humana.","link":"https://insilico.com/news_sc/rnt0809261-rentosertib-proteomic-aging-clocks","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"中国科学院","pais":"China","titulo":"Novo sistema cria \"via expressa\" para memórias de acesso aleatório quânticas","resumo":"Pesquisadores chineses desenvolveram uma nova arquitetura que acelera significativamente o processamento em memórias de acesso aleatório quânticas (qRAM).\nA inovação resolve gargalos críticos de velocidade e estabilidade na transferência de dados em sistemas computacionais quânticos.\nEsse avanço representa um passo fundamental para tornar viáveis os computadores quânticos de alta performance em escala comercial.","link":"https://www.cas.cn/cm/202609/t20260909_5119999.shtml","categoria":"COMPUTAÇÃO QUÂNTICA","lang":"pt"},{"fonte":"finance.ifeng.com","pais":"China","titulo":"Do laboratório de Tsinghua ao Portão da Ciência de Zhangjiang: como o \"Coração de Éter\" redefine os limites dos agentes de IA","resumo":"Originado nos laboratórios da Universidade de Tsinghua, o projeto de inteligência artificial \"Coração de Éter\" está expandindo as capacidades dos agentes autônomos.\nA tecnologia combina novos modelos de aprendizado com arquiteturas avançadas para permitir maior autonomia e raciocínio complexo em tarefas do mundo real.\nA iniciativa destaca o fortalecimento do ecossistema de inovação chinês ao conectar pesquisa acadêmica e aplicação industrial de ponta.","link":"https://finance.ifeng.com/c/8wHJRJ5R9qm","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"观察者","pais":"China","titulo":"China assume a liderança no desenvolvimento da próxima geração de tecnologia de carbeto de silício","resumo":"A indústria de semicondutores da China alcançou marcos decisivos no avanço do carbeto de silício (SiC) de próxima geração, superando concorrentes internacionais.\nOs novos dispositivos de SiC oferecem maior eficiência energética e resistência a altas tensões, sendo cruciais para veículos elétricos e sistemas de energia limpa.\nO progresso consolida a autossuficiência tecnológica do país e fortalece sua posição na cadeia global de suprimentos de chips avançados.","link":"https://www.guancha.cn/GongSi/2026_09_09_830528.shtml","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"french.news.cn","pais":"China","titulo":"Lançamento mundial da tecnologia de energia nuclear Hualong-One 2.0","resumo":"A China apresentou ao mercado internacional a versão 2.0 da sua tecnologia de reatores nucleares de terceira geração Hualong-One.\nO novo modelo traz aprimoramentos significativos em segurança passiva, eficiência operacional e redução dos custos de construção.\nA expansão global dessa tecnologia visa atender à crescente demanda por energia limpa e apoiar as metas de descarbonização em diversos países.","link":"https://french.news.cn/20260909/0b24da89687047b48bad0c9a236c826e/c.html","categoria":"ENERGIA NUCLEAR","lang":"pt"},{"fonte":"新华网","pais":"China","titulo":"Dos laboratórios para o dia a dia: tecnologia chinesa redefine a inovação na IFA Berlim 2026","resumo":"Empresas de tecnologia da China apresentaram soluções revolucionárias para o mercado consumidor durante a feira IFA Berlim 2026.\nOs destaques incluem dispositivos inteligentes integrados com IA, ecossistemas domésticos automáticos e inovações vestíveis voltadas para a saúde.\nA forte presença chinesa no evento demonstra como a pesquisa científica local está sendo rapidamente convertida em produtos de consumo global.","link":"https://portuguese.xinhuanet.com/20260909/4c9b287c105649539067f321b874b53e/c.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"兰州大学新闻网","pais":"China","titulo":"Universidade de Lanzhou desenvolve calorímetro de alta precisão para medição de isótopos médicos","resumo":"O Centro de Ciência de Isótopos Raros da Universidade de Lanzhou desenvolveu com sucesso um calorímetro de altíssima precisão.\nO equipamento oferece uma solução tecnológica nacional independente para medir com exatidão a atividade de isótopos radioativos utilizados na medicina.\nEssa inovação promete elevar a segurança e a eficácia de tratamentos radiofarmacológicos no diagnóstico e terapia do câncer.","link":"https://news.lzu.edu.cn/info/1051/1171455.htm","categoria":"TECNOLOGIA MÉDICA","lang":"pt"},{"fonte":"Devdiscourse","pais":"Índia","titulo":"Startup de tecnologia espacial GalaxEye obtém patente nos EUA por sistema inovador de imagens","resumo":"A startup espacial indiana GalaxEye conquistou uma patente nos Estados Unidos para sua tecnologia revolucionária de sensores integrados em satélites.\nO novo sistema combina dados ópticos e de radar de abertura sintética para gerar imagens de altíssima resolução sob quaisquer condições meteorológicas.\nA conquista reforça o papel da Índia como polo emergente de inovação no setor aeroespacial privado e abre portas para expansão global.","link":"https://www.devdiscourse.com/article/science-environment/3974697-galaxeye-secures-us-patent-for-cutting-edge-satellite-imaging","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"The Economic Times","pais":"Índia","titulo":"Ações da Marvell Technology disparam impulsionadas pela forte demanda por chips de IA","resumo":"As ações da empresa de semicondutores Marvell Technology registraram expressiva alta no mercado financeiro global impulsionadas pela demanda por Inteligência Artificial.\nO avanço reflete o otimismo dos investidores em relação ao fornecimento de chips especializados para centros de dados e infraestrutura em nuvem.\nEspecialistas apontam que a corrida pela IA continuará alavancando os resultados da companhia nos próximos trimestres.","link":"https://m.economictimes.com/markets/us-stocks/news/marvell-technology-shares-soar-whats-driving-the-ai-chip-rally/slideshow/133954721.cms","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"aninews.in","pais":"Índia","titulo":"Novo Group realiza evento em Bengaluru para fortalecer ecossistema de ciência e saúde na Índia","resumo":"O Novo Group realizou seu evento inaugural 'India Day' no polo tecnológico de Bengaluru com a presença de líderes e pesquisadores.\nA iniciativa visa consolidar parcerias de longo prazo voltadas ao avanço da ciência, inovação em saúde e desenvolvimento sustentável no país.\nCom a ação, a organização reafirma seu compromisso em impulsionar iniciativas científicas e ecossistemas tecnológicos locais.","link":"https://www.aninews.in/news/business/novo-group-holds-inaugural-india-day-in-bengaluru-reaffirming-long-term-commitment-to-the-countrys-health-science-and-sustainability-ecosystem20260909101259","categoria":"CIÊNCIA E SAÚDE","lang":"pt"},{"fonte":"TradingView","pais":"Índia","titulo":"Fintech holandesa Adyen planeja expansão de longo prazo no mercado indiano","resumo":"A gigante holandesa de tecnologia financeira Adyen anunciou planos de expansão estratégica para fortalecer sua atuação no mercado indiano.\nA empresa enxerga potencial significativo de crescimento no ecossistema de pagamentos digitais do país, impulsionado pelo consumo e inovação.\nA iniciativa visa atender tanto corporações locais quanto empresas internacionais em expansão na região.","link":"https://es.tradingview.com/news/reuters.com,2026:newsml_L8N45104Z:0/","categoria":"FINTECH","lang":"pt"},{"fonte":"fundsforNGOs","pais":"Índia","titulo":"Índia abre inscrições para programa de financiamento semente em ciência e tecnologia","resumo":"Estão abertas as candidaturas para o Programa de Subvenção Semente em Ciência e Tecnologia voltado para pesquisadores e startups na Índia.\nO programa busca apoiar projetos inovadores nas fases iniciais de desenvolvimento, promovendo soluções tecnológicas de alto impacto.\nA iniciativa visa fortalecer o ecossistema nacional de inovação e incentivar a pesquisa científica aplicada no país.","link":"https://www2.fundsforngos.org/innovation/apply-for-science-and-technology-seed-grant-program-india/","categoria":"CIÊNCIA E TECNOLOGIA","lang":"pt"},{"fonte":"Telegraph India","pais":"Índia","titulo":"Crescimento econômico de 7,8% da Índia impulsiona confiança global, destaca Modi","resumo":"O primeiro-ministro Narendra Modi destacou o crescimento de 7,8% do PIB da Índia como um marco histórico para o desenvolvimento do país.\nA forte expansão reforça a posição da Índia como uma das economias de crescimento mais rápido do mundo, atrativa para investidores internacionais.\nO resultado eleva a confiança global nas reformas econômicas e no avanço tecnológico impulsionado pelo governo indiano.","link":"https://www.telegraphindia.com/amp/business/india-economy-growth-modi-says-7-8-per-cent-expansion-boosts-global-confidence-today-prnt/cid/2179014","categoria":"ECONOMIA","lang":"pt"},{"fonte":"India Technology News","pais":"Índia","titulo":"Bharat, tecnologia e consciência: o surgimento de uma nova ordem mundial","resumo":"A intersecção entre inovação tecnológica, herança cultural e desenvolvimento humano está moldando o papel da Índia no cenário global.\nEspecialistas analisam como o conceito de Bharat e a integração de tecnologias emergentes contribuem para redefinir lideranças no novo século.\nO debate destaca a busca do país por uma transformação digital acompanhada de responsabilidade ética e consciência social.","link":"https://indiatechnologynews.in/bharat-technology-consciousness-and-the-rise-of-a-new-world-order/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Telegraph India","pais":"Índia","titulo":"Graduação do Heritage Institute of Technology destaca IA, ética e aprendizado contínuo","resumo":"A cerimônia de formatura do Heritage Institute of Technology enfatizou a relevância da Inteligência Artificial na formação dos novos profissionais.\nOs discursos ressaltaram a necessidade de integrar princípios éticos ao desenvolvimento tecnológico e à aplicação prática de novos algoritmos.\nAlém disso, destacou-se a importância da capacitação contínua para lidar com as transformações rápidas do mercado global.","link":"https://www.telegraphindia.com/edugraph/campus/heritage-institute-of-technology-kolkata-hosts-7th-graduation-ceremony-embraces-ai-era/cid/2179076","categoria":"EDUCAÇÃO E IA","lang":"pt"},{"fonte":"Notebookcheck.info","pais":"Portugal","titulo":"Citizen lança dois novos relógios Attesa de edição limitada com tecnologia Satellite Wave GPS e caixas em Super Titanium","resumo":"A fabricante de relógios Citizen apresentou dois novos modelos da linha Attesa em edição limitada, equipados com a avançada tecnologia Satellite Wave GPS.\nOs dispositivos contam com caixas fabricadas em Super Titanium, garantindo alta resistência, leveza e extremo conforto para o uso diário.\nA novidade combina precisão atômica via satélite com design sofisticado, consolidando a posição da marca no mercado de alta tecnologia horológica.","link":"https://www.notebookcheck.info/A-Citizen-lanca-dois-novos-relogios-Attesa-de-edicao-limitada-com-tecnologia-Satellite-Wave-GPS-e-caixas-em-Super-Titanium.1394322.0.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Euronews.com","pais":"Portugal","titulo":"União Europeia investe em captura de carbono sob críticas por uso de tecnologia não comprovada","resumo":"A União Europeia está enfrentando fortes críticas por direcionar grandes investimentos para projetos de captura e armazenamento de carbono.\nEspecialistas e ambientalistas questionam a eficácia da tecnologia, alegando que ela ainda não foi comprovada em larga escala para reduzir emissões de forma eficiente.\nO debate coloca em xeque a estratégia do bloco para atingir a neutralidade climática, levantando dúvidas sobre a alocação dos recursos públicos.","link":"https://pt.euronews.com/2026/09/09/uniao-europeia-investe-em-captura-de-carbono-sob-fogo-por-tecnologia-nao-comprovada","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Flash.pt","pais":"Portugal","titulo":"Diga adeus à faxina: o aspirador robô com tecnologia laser que faz tudo sozinho e elimina até bactérias","resumo":"Chegam ao mercado novos modelos de aspiradores robô dotados de navegação a laser de alta precisão para mapeamento doméstico detalhado.\nAlém de automatizarem completamente a limpeza de diferentes superfícies, os aparelhos possuem sistemas capazes de eliminar germes e bactérias.\nA inovação promete revolucionar a rotina de cuidados com o lar, oferecendo praticidade e eficiência com o mínimo de intervenção humana.","link":"https://www.flash.pt/indica/casa-e-decoracao/detalhe/diga-adeus-as-limpezas-o-aspirador-robo-com-tecnologia-laser-que-faz-tudo-por-si-e-elimina-ate-as-bacterias","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"expresso.pt","pais":"Portugal","titulo":"Quanto faturam as 50 empresas de tecnologia que mais crescem em Portugal?","resumo":"Um novo levantamento revela os números de faturamento das 50 empresas de tecnologia de crescimento mais rápido instaladas em Portugal.\nO setor tecnológico lusitano continua a demonstrar forte tração, atraindo capital internacional e impulsionando a economia digital no país.\nOs dados destacam a capacidade de escala do ecossistema de startups locais e a consolidação da região como um importante polo de inovação europeu.","link":"https://expresso.pt/podcasts/economia-dia-a-dia/2026-09-08-quanto-faturam-as-50-tecnologicas-que-mais-crescem-em-portugal--65558173","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"ECO","pais":"Portugal","titulo":"Apenas construção e tecnologia estão criando mais empresas este ano; insolvências sobem 1,3%","resumo":"O cenário empresarial português registra a criação de novas empresas concentrada quase exclusivamente nos setores de construção civil e tecnologia.\nParalelamente, o país enfrenta um aumento de 1,3% no número de insolvências em comparação com o mesmo período do ano anterior.\nOs dados evidenciam uma polarização econômica, onde vertentes de inovação e infraestrutura se destacam enquanto segmentos tradicionais sofrem pressão.","link":"https://eco.sapo.pt/2026/09/08/so-construcao-e-tecnologia-estao-a-criar-mais-empresas-este-ano-insolvencias-aumentam-13/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"G1","pais":"Brazil","titulo":"Meta Launches Muse, an AI Assistant That Accesses Apps, Sends Emails, and Makes Payments","resumo":"Meta has announced the launch of Muse, a new advanced artificial intelligence assistant featuring high autonomy.\nThe system is capable of interacting directly with applications, managing email inboxes, and executing financial transactions.\nThis new development represents a significant step forward in the automation of everyday tasks and the expansion of intelligent agents.","link":"https://g1.globo.com/tecnologia/noticia/2026/09/08/meta-lanca-agente-ia-muse.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Qualcomm Reaches Agreement to Supply Custom AI Chips to Amazon","resumo":"Qualcomm has signed a major strategic partnership with Amazon to supply custom artificial intelligence chips.\nThe agreement aims to optimize data processing and reduce operational costs for the company's cloud infrastructure.\nThis initiative strengthens Qualcomm's position in the highly competitive semiconductor market and accelerates data center innovation.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/09/08/qualcomm-fecha-acordo-para-fornecer-chips-de-ia-personalizados-a-amazon.ghtml","categoria":"HARDWARE","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"How to Disable Meta AI on WhatsApp: A Step-by-Step Guide","resumo":"The recent integration of Meta's artificial intelligence into WhatsApp has sparked mixed reactions among users in Brazil.\nA practical guide explains the procedure required to hide or disable the assistant's automated interactions.\nThe move addresses the demand from people who prefer a straightforward messaging experience with greater privacy control.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/09/saiba-como-desativar-a-meta-ai-do-whatsapp-confira-o-passo-a-passo.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"RN Space Base Resumes Launches with Microgravity Mission","resumo":"The Barreira do Inferno Launch Center, located in Rio Grande do Norte, has resumed its launch activities.\nThe primary goal of the current mission is to conduct scientific experiments in a microgravity environment in the upper atmosphere.\nThis project represents a fundamental milestone for the advancement of the Brazilian space program and national technological development.","link":"https://www1.folha.uol.com.br/ciencia/2026/09/base-espacial-do-rn-retoma-lancamentos-com-missao-de-microgravidade.shtml","categoria":"SCIENCE","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"'My Feed, My Way': Australia Seeks to Give Users the Option to 'Turn Off' Social Media Algorithms","resumo":"The Australian government is debating a legislative proposal that would require digital platforms to offer feeds free of algorithmic recommendations.\nThe measure aims to give users greater autonomy over the content they consume and to mitigate addiction and misinformation issues.\nThe international debate is gaining momentum and could serve as a global benchmark for future technology sector regulations.","link":"https://g1.globo.com/tecnologia/noticia/2026/09/08/australia-redes-algoritmos.ghtml","categoria":"SOCIAL MEDIA","lang":"en"},{"fonte":"Estadão","pais":"Brazil","titulo":"The Limits of Artificial Intelligence in the Educational Environment","resumo":"The rapid advancement of artificial intelligence in education brings new learning opportunities but requires pedagogical caution.\nExperts warn of risks such as over-reliance on automated tools and the compromising of critical thinking.\nThe debate seeks to balance the ethical use of technology with the irreplaceable role of human mediation in the classroom.","link":"https://www.estadao.com.br/opiniao/os-limites-da-ia-na-educacao/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Estadão","pais":"Brazil","titulo":"The Greatest Risk in Elon Musk's Recent Prediction Lies Outside of Technology","resumo":"Analysts have evaluated Elon Musk's recent projections regarding the future of artificial intelligence and industrial automation.\nAlthough technological progress is viable, the primary bottlenecks identified lie in geopolitical, energy, and regulatory factors.\nThe warning highlights that physical infrastructure and social acceptance may limit the actual pace of these global transformations.","link":"https://www.estadao.com.br/em-alta/tecmundo/inteligencia-artificial/414966-o-maior-risco-da-recente-previsao-de-musk-esta-fora-da-tecnologia/","categoria":"INNOVATION","lang":"en"},{"fonte":"Tribuna Hoje","pais":"Brazil","titulo":"Hackathon Promotes Ideas to Expand Women's Participation in Science","resumo":"An innovation marathon brought together researchers and students to create solutions for gender equity in the scientific sector.\nThe proposals presented focus on encouraging young female talent in the fields of technology, engineering, and mathematics.\nThe initiative aims to combat historical disparities and strengthen the presence of women in cutting-edge research projects.","link":"https://tribunahoje.com/noticias/ciencia-e-tecnologia/2026/09/09/193241-maratona-estimula-ideias-para-ampliar-participacao-de-mulheres-na-ciencia","categoria":"SCIENCE","lang":"en"},{"fonte":"O GLOBO","pais":"United States","titulo":"OpenAI Claims to Have Solved Historical Mathematical Problem That Baffled Humanity","resumo":"OpenAI has announced a major achievement in the field of artificial intelligence applied to mathematics, claiming to have solved a complex problem that has puzzled researchers for decades. The innovation demonstrates the growing capability of advanced models in logical reasoning and the resolution of complex scientific theorems. This breakthrough opens new frontiers for the practical application of artificial intelligence in academic research and global scientific development.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/09/09/sera-openai-afirma-ter-resolvido-problema-matematico-que-intriga-a-humanidade-ha-decadas.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"O GLOBO","pais":"United States","titulo":"Apple Launches iPhone 18 Pro and First Foldable Model in John Ternus's Debut as CEO","resumo":"Apple held a historic event by introducing the iPhone 18 Pro and officially revealing its long-awaited first foldable smartphone. The announcement marks the formal beginning of John Ternus's tenure at the helm of the company, symbolizing a new phase of hardware innovation. The tech giant's entry into the foldable market promises to redefine industry standards for mobile devices.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/09/09/apple-lanca-hoje-iphone-18-pro-e-primeiro-dobravel-em-estreia-de-john-ternus-como-ceo.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"O GLOBO","pais":"United States","titulo":"Former OpenAI and Anthropic Researcher Accuses Companies of Irresponsibility in AI Development","resumo":"A former researcher who worked at artificial intelligence giants OpenAI and Anthropic has made serious public accusations regarding company conduct in the sector. The scientist warned that the accelerated race for commercial dominance is leading to the neglect of essential safety guidelines. These statements reignite the global debate regarding the urgent need for strict regulation and ethical oversight in the creation of new models.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/09/ex-pesquisador-da-openai-e-da-anthropic-acusa-empresas-de-irresponsabilidade-brincando-com-nossas-vidas.ghtml","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"Terra","pais":"United States","titulo":"US Accuses Chinese Companies of Industrial-Scale AI Technology Theft","resumo":"United States authorities have intensified accusations against Chinese tech companies, alleging systematic practices of misappropriating American AI models. According to the U.S. government, the illicit diversion of advanced algorithms and systems has been the pillar of Chinese progress in the field. This episode elevates geopolitical tensions and is expected to accelerate new restrictions on critical technology exports.","link":"https://www.terra.com.br/economia/eua-acusam-empresas-chinesas-de-roubo-de-tecnologia-de-ia-em-escala-industrial,0f2743703b7df48d44ce9e07a77314c1qghljehq.html","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"DefenseScoop","pais":"United States","titulo":"DIU and Honeywell Conduct Flight Tests with Quantum Sensing Technology for Navigation","resumo":"The U.S. Defense Innovation Unit and Honeywell Aerospace have completed flight tests utilizing advanced quantum sensors for aerial navigation. The technology makes it possible to determine the exact position of aircraft in environments where GPS signals are unavailable or suffering interference. This advancement represents a practical milestone for the operational application of quantum systems in aviation and defense.","link":"https://defensescoop.com/2026/09/08/diu-honeywell-aerospace-flight-test-magnav-system/","categoria":"QUANTUM TECHNOLOGY","lang":"en"},{"fonte":"samueli.ucla.edu","pais":"United States","titulo":"UCLA Computer Science Student Develops Tools for Autonomous Car Communication","resumo":"A student at the University of California, Los Angeles has created an innovative platform that allows real-time data exchange among autonomous vehicles. The system assists in the joint identification of obstacles and traffic mapping, ensuring greater safety in shared roadway use. The project demonstrates the impact of academic research on the acceleration and consolidation of urban autonomous transport.","link":"https://samueli.ucla.edu/from-backyard-ziplines-to-self-driving-cars-ucla-computer-science-student-develops-tools-to-help-autonomous-vehicles-safely-share-information/","categoria":"AUTONOMOUS VEHICLES","lang":"en"},{"fonte":"TVI","pais":"United States","titulo":"Iran Announces Capture of Advanced U.S. Smart Submarine Equipped with Cutting-Edge Technology","resumo":"The Iranian government claimed to have captured a high-tech autonomous submarine belonging to the United States armed forces. The unmanned vessel was reportedly equipped with artificial intelligence, advanced sensors, and next-generation navigation systems. The incident raises strategic concerns regarding the risk of reverse engineering and the protection of confidential military technologies.","link":"https://tvi.iol.pt/noticias/estados-unidos/guerra-no-medio-oriente/irao-anuncia-captura-de-submarino-inteligente-dos-eua-com-a-tecnologia-mais-avancada-do-mundo/20260908/6aa034b4d34ed0733ba840a8","categoria":"DEFENSE","lang":"en"},{"fonte":"MIT NSE","pais":"United States","titulo":"Computational materials science allows for the design of more efficient nuclear fuels","resumo":"Researchers are utilizing advanced computational materials science simulations to develop higher-yield and more durable nuclear fuels. The innovation optimizes reactor performance and reduces the frequency of refueling, increasing efficiency in low-emission energy generation. The computational approach accelerates the development cycle of new materials for the energy transition.","link":"https://nse.mit.edu/mack-cleveland-using-computational-materials-science-to-engineer-higher-burnup-fuels/","categoria":"SCIENCE","lang":"en"},{"fonte":"Euronews.com","pais":"France","titulo":"Contested carbon capture: EU bets on technology deemed unproven","resumo":"The European Union is betting heavily on carbon capture and storage technologies to achieve its climate targets. However, several specialists and environmental groups question the efficacy and large-scale viability of these solutions. The debate raises doubts about the risks of relying on methods that are not yet fully proven to mitigate global emissions. The decision could impact future investments and environmental regulation across the European bloc.","link":"https://fr.euronews.com/2026/09/09/captage-du-carbone-conteste-lue-parie-sur-une-technologie-jugee-non-eprouvee","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"MUNDIARIO","pais":"France","titulo":"The technology protecting the Mona Lisa at the Louvre Museum","resumo":"The Louvre Museum employs cutting-edge technological systems to ensure the preservation and security of the famous Mona Lisa artwork. Advanced sensors constantly monitor parameters such as humidity, temperature, and vibrations around Leonardo da Vinci's painting. In addition to rigorous environmental control, protective barriers and intelligent monitoring help protect the piece. This integration of technology and art is essential to curb degradation and protect the collection against incidents.","link":"https://www.mundiario.com/articulo/tecnologia-ciencia/tecnologia-que-protege-mona-lisa-museo-futuro-aqui/20260909064741440073.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Sortir à Paris","pais":"France","titulo":"Fête de la Science 2026: various activities for everyone in Orsay","resumo":"The city of Orsay is preparing a broad schedule for the 2026 edition of the Fête de la Science, aimed at participants of all ages. The event will feature interactive workshops, lectures with researchers, and exhibitions to democratize scientific knowledge. The initiative aims to bring the community closer to the main innovations and research developed in the region. The celebration reinforces the role of scientific communication in engaging society and training new talents.","link":"https://www.sortiraparis.com/enfant-famille/articles/333195-fete-de-la-science-2026-de-nombreuses-animations-pour-tous-a-orsay-91","categoria":"SCIENCE","lang":"en"},{"fonte":"North Wales Pioneer","pais":"England","titulo":"Llandudno exhibition showcases technologies for people with sight loss","resumo":"A new exhibition held in Llandudno showcases technological innovations developed to assist individuals with visual impairments in their daily lives. The event brings together modern assistive devices, accessibility software, and mobility solutions to promote greater autonomy. Experts and visitors explore how these tools can transform the quality of life and social inclusion of people with vision loss. The initiative highlights the crucial role of assistive technology in overcoming daily barriers.","link":"https://www.northwalespioneer.co.uk/news/26532883.llandudno-exhibition-features-technology-sight-loss/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Lancashire Telegraph","pais":"England","titulo":"New cancer therapy technology to benefit hundreds of patients in Preston","resumo":"A medical center in Preston has adopted advanced cancer therapy technology designed to optimize the treatment of hundreds of people. The new equipment offers greater precision in combating tumors while minimizing damage to surrounding healthy tissue. With this innovation, the expectation is to increase treatment success rates and significantly reduce side effects. The breakthrough represents an important milestone for local medicine and oncology patient well-being.","link":"https://www.lancashiretelegraph.co.uk/news/26529100.new-cancer-therapy-technology-introduced-preston/","categoria":"HEALTH","lang":"en"},{"fonte":"Recycling Today","pais":"England","titulo":"Scottish Water uses Envetec Generations technology to reduce plastic lab waste","resumo":"Public utility Scottish Water has implemented Envetec Generations technology to treat and neutralize plastic laboratory waste directly at the source. The solution allows for the shredding and disinfection of hazardous biological waste, transforming it into materials safe for recycling. This innovative approach drastically reduces the carbon footprint and the volume of plastic waste sent to landfills. The initiative reinforces the organization's commitment to environmental sustainability and operational efficiency in its research.","link":"https://www.recyclingtoday.com/news/scottish-water-uses-envetev-generations-technology-to-reduce-plastic-waste/","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"GOV.UK","pais":"England","titulo":"Cat Little appointed as new Permanent Secretary of the Department for Business, Innovation, Science and Trade","resumo":"Cat Little has been officially appointed as the new Permanent Secretary of the UK Department for Business, Innovation, Science and Trade. She takes on this strategic role with the mission of driving economic growth and strengthening science and innovation policies. Her leadership will be fundamental in directing support initiatives for the country's technology sector and international trade. The appointment reflects a government effort to consolidate British leadership on the global business and scientific development stage.","link":"https://www.gov.uk/government/news/cat-little-appointed-as-new-permanent-secretary-department-for-business-innovation-science-and-trade","categoria":"INNOVATION","lang":"en"},{"fonte":"New Scientist","pais":"England","titulo":"September's best new popular science books include works by Carlo Rovelli and Xand van Tulleken","resumo":"The selection of September's best popular science books features works by renowned authors such as Carlo Rovelli and Xand van Tulleken. The titles range from the mysteries of quantum physics and cosmology to practical topics in medicine and the human body. The publications aim to make complex scientific concepts accessible and fascinating to the general public. The list highlights literary trends that stimulate intellectual curiosity and the understanding of everyday science.","link":"https://www.newscientist.com/article/2587859-the-best-new-popular-science-books-of-september-2026/","categoria":"SCIENCE","lang":"en"},{"fonte":"Schools Week","pais":"England","titulo":"PISA 2025: Rise across the board, but science gender gap opens","resumo":"The PISA 2025 results show an overall evolution in student scores, revealing significant learning advancements. Despite overall progress, the report points to a concerning widening of the gender disparity in the field of science. Experts highlight the urgent need for targeted public policies to encourage girls to pursue scientific careers. The data serves as a wake-up call for educators and policymakers regarding equal opportunities in STEM education.","link":"https://schoolsweek.co.uk/pisa-2025-rise-across-the-board-but-science-gender-gap-opens/","categoria":"EDUCATION","lang":"en"},{"fonte":"BBC","pais":"England","titulo":"England rises in reading, math, and science rankings while Scotland and Wales fall","resumo":"England has registered a significant improvement in educational rankings for reading, math, and science within the UK context. Conversely, data indicates a drop in the school performance of students in Scotland and Wales. The discrepancy reinforces debates on the different pedagogical approaches and investments applied by each British nation. The result highlights England's leading position in consolidating fundamental and scientific learning among young people.","link":"https://www.bbc.co.uk/news/articles/cvgy6n0l4rdo","categoria":"EDUCATION","lang":"en"},{"fonte":"Expansión","pais":"Spain","titulo":"Meta launches AI personal assistant for everyday tasks","resumo":"Meta has announced the launch of a new artificial intelligence-based personal assistant designed to help users with daily tasks. The tool aims to optimize productivity and personal organization by integrating directly into the company's ecosystems. The breakthrough reinforces the global race for dominance in next-generation virtual assistants within consumer routines.","link":"https://www.expansion.com/economia-digital/2026/09/08/6aa06020468aeb62558b456d.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"20minutos.es","pais":"Spain","titulo":"Google hardens Android 17 to prevent scams that force the use of legacy technologies","resumo":"Google has implemented new security layers in the Android 17 operating system to combat sophisticated fraud. The measures aim to prevent cybercriminals from exploiting vulnerabilities by forcing devices to connect to legacy networks. The update represents an important step in combating social engineering scams and protecting sensitive data.","link":"https://www.20minutos.es/tecnologia/ciberseguridad/google-refuerza-android-17-evitar-estafas-obligan-movil-volver-antigua-tecnologia_7032943_0.html","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"日本経済新聞","pais":"Spain","titulo":"NTT IOWN fund makes its first investment in a Spanish optical technology startup","resumo":"The NTT IOWN fund has made its first financial injection, choosing a Spain-based optical technology startup. The initiative aims to accelerate the research and development of high-speed and quantum communication infrastructures. The investment highlights the growing relevance of the Spanish innovation ecosystem on the global tech stage.","link":"https://www.nikkei.com/article/DGXZQOUC0855V0Y6A900C2000000/","categoria":"INNOVATION","lang":"en"},{"fonte":"Expansión","pais":"Spain","titulo":"What is Chippio, the AI-driven energy retailer","resumo":"Chippio emerges as an innovative energy retailer by using artificial intelligence models to optimize costs for customers. The platform analyzes consumption patterns in real time to offer more efficient and sustainable tariffs in the electricity market. The solution reflects how AI is transforming the public utilities sector and promoting the smart energy transition.","link":"https://www.expansion.com/economia-sostenible/2026/09/09/6a9ff77b468aeb427f8b4596.html","categoria":"ENERGY AND AI","lang":"en"},{"fonte":"casadomo","pais":"Spain","titulo":"New Pediatric ICU at Miguel Servet Hospital Features Cutting-Edge Technology","resumo":"The Miguel Servet Children's Hospital has inaugurated a new Pediatric Intensive Care Unit equipped with state-of-the-art technological advancements.\nThe project features modern monitoring and life-support equipment to improve diagnoses and critical care.\nThis modernization raises the standards of public hospital care and represents a major leap forward for intensive medicine in the region.","link":"https://www.casadomo.com/2026/09/09/nueva-uci-pediatrica-hospital-infantil-miguel-servet-incluye-tecnologia-ultima-generacion","categoria":"MEDICAL TECHNOLOGY","lang":"en"},{"fonte":"Investing.com España","pais":"Spain","titulo":"Rivian Highlights R2 Model Advancements at Goldman Sachs Communacopia + Technology Conference","resumo":"During the Goldman Sachs conference, EV manufacturer Rivian presented significant updates regarding the development of its new R2 electric SUV.\nThe company detailed production efficiency strategies, cost reductions, and market expansion plans for the coming years.\nThe announcement reaffirms the brand's positioning in the race for a prominent role in the global transition to electric mobility.","link":"https://es.investing.com/news/transcripts/rivian-en-la-conferencia-goldman-sachs-communacopia--tecnologia-2026-avances-del-r2-93CH-3826460","categoria":"ELECTRIC VEHICLES","lang":"en"},{"fonte":"Notebookcheck.org","pais":"Spain","titulo":"Citizen Launches Two New Limited-Edition Attesa Watches with Satellite Wave GPS and Super Titanium","resumo":"Traditional watchmaker Citizen has unveiled two new limited-edition models in the Attesa line constructed from Super Titanium material.\nThe devices feature advanced Satellite Wave GPS technology, ensuring absolute timekeeping precision by synchronizing with satellites in space.\nThe launch combines precision engineering, high durability, and sophisticated design for enthusiasts of high-tech watchmaking.","link":"https://www.notebookcheck.org/Citizen-lanza-dos-nuevos-relojes-Attesa-de-edicion-limitada-con-tecnologia-Satellite-Wave-GPS-y-cajas-de-Super-Titanium.1394316.0.html","categoria":"DEVICES","lang":"en"},{"fonte":"20minutos.es","pais":"Spain","titulo":"Scrolling Technology and Resource-Starved Inclusion Debated Following PISA Report Data","resumo":"The publication of the PISA report has raised alarms regarding the link between the uncontrolled use of social media and declining school performance.\nExperts are debating how \"scrolling technology\" and a shortage of pedagogical resources affect the inclusion of vulnerable children.\nThe scenario calls for a deep reflection on public policies, digital mediation, and support strategies in classrooms.","link":"https://www.20minutos.es/nacional/tecnologia-scrolling-pobreza-infantil-una-inclusion-sin-recursos-tras-crisis-educativa-que-refleja-informe-pisa_7034304_0.amp.html","categoria":"SOCIETY AND TECHNOLOGY","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"Electronics Fair: 240,000 Visitors Experience AI and Robots at IFA","resumo":"IFA Berlin, one of the world's largest consumer electronics trade shows, drew 240,000 visitors to its recent edition.\nThe event highlighted significant advancements in artificial intelligence and robotics tailored for everyday consumer life.\nThis strong turnout reinforces Germany's role as a strategic hub for showcasing global technological innovations.","link":"https://www.sueddeutsche.de/wirtschaft/elektronikmesse-240-000-besucher-erlebten-ki-und-roboter-auf-der-ifa-dpa.urn-newsml-dpa-com-20090101-260909-930-656150","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Valencia Plaza","pais":"Germany","titulo":"Tech Sector Warns Economy at IFA Berlin: Chinese Advancement, Premium Products, and AI Agents","resumo":"During IFA Berlin, technology industry leaders warned of major transformations that will impact various economic sectors.\nKey trends presented include the aggressive advancement of Chinese manufacturers, a focus on premium devices, and the rise of autonomous AI agents.\nThese factors are redefining global competitiveness and innovation expectations for the coming years.","link":"https://valenciaplaza.com/foro-plaza/el-sector-tecnologico-avisa-al-resto-de-la-economia-desde-ifa-berlin-invasion-china-productos-premium-y-agentes-de-ia","categoria":"TRENDS","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"New Product Event: Apple's First Foldable iPhone Expected","resumo":"Anticipation in the tech sector is growing around Apple's upcoming major product launch event.\nRumors and market analysis point to the potential unveiling of the company's first foldable iPhone, a move awaited for years.\nThe new device could redefine the premium smartphone market and heighten competition with rivals that already dominate the format.","link":"https://www.sueddeutsche.de/wirtschaft/neuheiten-event-erstes-auffaltbares-iphone-von-apple-erwartet-dpa.urn-newsml-dpa-com-20090101-260909-930-655573","categoria":"LAUNCHES","lang":"en"},{"fonte":"PR TIMES","pais":"Germany","titulo":"Tanaka Kikinzoku Debuts at International Hydrogen Technology Fair in Hamburg","resumo":"Japanese company Tanaka Kikinzoku announced its first participation in the Hydrogen Technology World Expo 2026, held in Hamburg, Germany.\nThe event is one of the premier global gatherings dedicated to the development of clean technologies and hydrogen-based energy.\nThe presence highlights growing international cooperation and Germany's central role in the global energy transition.","link":"https://prtimes.jp/main/html/rd/p/000000115.000031501.html","categoria":"CLEAN ENERGY","lang":"en"},{"fonte":"BILD","pais":"Germany","titulo":"PISA 2025: Germany Falls Below Expected Levels in Reading, Mathematics, and Science","resumo":"The results of the PISA report have raised an alarm within Germany's educational system after the country registered a drop in performance across reading, mathematics, and science.\nThe decline in these indicators sparks urgent discussions regarding pedagogical reforms and investments in school infrastructure.\nThe situation raises concerns regarding the country's long-term scientific and technological competitiveness.","link":"https://www.bild.de/politik/inland/pisa-2025-deutschland-unterbietet-niveau-in-lesen-mathe-und-naturwissenschaften-6a9fbbeb181cb962d488789f","categoria":"SCIENCE","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"RIKEN Launches New Supercomputer with AI and Quantum Technology to Revolutionize Scientific Research","resumo":"Japanese research institute RIKEN has initiated operations for a new supercomputer designed to integrate artificial intelligence and quantum technologies.\nThe initiative aims to accelerate scientific innovation and drive an industrial revolution steered by high-performance data processing.\nThe platform seeks to meet the growing demand for complex simulations and massive information analysis across various academic disciplines and strategic sectors.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_ict/pt20260909000013.html","categoria":"SUPERCOMPUTING","lang":"en"},{"fonte":"日テレNEWS NNN","pais":"Japan","titulo":"What is HAPS? Flying Base Station Technology and the Future of Aerial Communications","resumo":"High-Altitude Platform Stations, known as HAPS, act as flying base stations positioned in the stratosphere to provide continuous connectivity.\nThis technology promises to expand communication coverage to remote and maritime areas where conventional terrestrial antennas cannot reach.\nJapan's aerial ecosystem is advancing rapidly to guarantee redundancy in natural disaster scenarios and universalize internet access.","link":"https://news.ntv.co.jp/category/economy/1b9c680ef9b349029a9a03ad93bfc0a9","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"ugo Selected for Government Project for the Development of Semi-Humanoid Robots","resumo":"Japanese startup ugo has been approved for the national GENIAC project, promoted by the Ministry of Economy, Trade and Industry (METI) and NEDO.\nThe company will focus on developing VTLA-type AI models to enable two-armed semi-humanoid robots to perform complex tasks.\nThe advancement aims to address Japan's labor shortage by strengthening intelligent and versatile robotic infrastructures.","link":"https://prtimes.jp/main/html/rd/p/000000177.000034305.html","categoria":"ROBOTICS","lang":"en"},{"fonte":"global.toshiba","pais":"Japan","titulo":"Japan Selects Projects for the Development and Construction of Innovative Next-Generation Nuclear Reactors","resumo":"Japan's Ministry of Economy, Trade and Industry has announced the selection of companies for the development of innovative nuclear reactors.\nThe program seeks to strengthen the domestic supply chain and accelerate the supply of clean, stable, next-generation energy.\nThe initiative is part of the country's strategic plan to achieve carbon neutrality and ensure the energy security of its industrial sector.","link":"https://www.global.toshiba/jp/news/energy/2026/09/news-20260909-01.html","categoria":"ENERGY","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"Yano Research Releases Projections on the Global Autonomous Driving and ADAS Market","resumo":"A new report published by the Yano Research Institute analyzes the prospects and trends of the global autonomous vehicle and ADAS market.\nThe study highlights the rapid adoption of sensor technologies and embedded artificial intelligence in new automotive models.\nFurthermore, the document points to government regulations and vehicle safety demands as the primary drivers of this sector.","link":"https://www.nikkei.com/article/DGXZRSP712344_Z00C26A9000000/","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"Tokai University Develops Versatile Thermoelectric Element That Generates Power and Measures Thermal Flow","resumo":"Researchers at Tokai University have developed an innovative thermoelectric device capable of generating energy and measuring heat flow simultaneously.\nThe component leverages thermal variations to power small electronic devices without relying on traditional batteries.\nThe innovation opens up new application possibilities in wearable sensors, industrial monitoring, and energy efficiency technologies.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_new/pt20260909000012.html","categoria":"SCIENCE","lang":"en"},{"fonte":"news.yahoo.co.jp","pais":"Japan","titulo":"US Transportation Secretary Warns Ford Over Dependence on Chinese Technology","resumo":"The United States government has issued a direct warning to Ford regarding the use of Chinese technology in electric vehicles.\nThe core concern involves issues of cybersecurity, data sovereignty, and reliance on the battery supply chain.\nThe warning reflects heightened geopolitical tensions in the automotive sector and imposes new regulatory challenges for global automakers.","link":"https://news.yahoo.co.jp/articles/2dea2c7c579a92c4192ce5102c5306d56ab6ba25","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"FastLabel Selected for Japan's National Project for AI Robotics Foundation Models","resumo":"FastLabel has been selected to participate in the GENIAC government initiative aimed at developing foundational robotics models.\nThe company will provide advanced AI data infrastructure to accelerate the creation of high-precision industrial autonomous robots.\nThe project aims to solidify Japan's position at the forefront of artificial intelligence development applied to robotics.","link":"https://prtimes.jp/main/html/rd/p/000000211.000065427.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"China's FAST Telescope Maps Universe's Largest Cosmic Gas Map","resumo":"China's FAST radio telescope, known as the \"China Eye of Heaven,\" has successfully completed mapping the largest cosmic gas atlas ever recorded.\nThe research provides unprecedented data on the distribution and evolution of hydrogen atoms in the intergalactic medium.\nThis scientific achievement promises to drive new theories regarding galaxy formation and the large-scale structure of the universe.","link":"https://news.sciencenet.cn/htmlnews/2026/9/571120.shtm","categoria":"ASTRONOMY","lang":"en"},{"fonte":"Insilico Medicine","pais":"China","titulo":"Innovative AI Drug Rentosertib Demonstrates Anti-Aging Potential in Nature Biotechnology","resumo":"A study published in the prestigious journal Nature Biotechnology revealed that the drug Rentosertib, developed by Insilico Medicine using AI, demonstrated the ability to reverse biological age.\nTests using six different epigenetic clocks consistently confirmed the therapeutic effects in reducing cellular aging.\nThe breakthrough consolidates the application of artificial intelligence in discovering revolutionary therapies focused on longevity and human health.","link":"https://insilico.com/news_sc/rnt0809261-rentosertib-proteomic-aging-clocks","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"中国科学院","pais":"China","titulo":"New System Creates \"Expressway\" for Quantum Random Access Memories","resumo":"Chinese researchers have developed a new architecture that significantly accelerates processing in quantum random access memories (qRAM).\nThe innovation solves critical speed and stability bottlenecks in data transfer across quantum computing systems.\nThis breakthrough represents a fundamental step toward making high-performance quantum computers commercially viable at scale.","link":"https://www.cas.cn/cm/202609/t20260909_5119999.shtml","categoria":"QUANTUM COMPUTING","lang":"en"},{"fonte":"finance.ifeng.com","pais":"China","titulo":"From Tsinghua Lab to Zhangjiang Science Gate: How the \"Ether Heart\" Redefines AI Agent Limits","resumo":"Originating in Tsinghua University laboratories, the \"Ether Heart\" artificial intelligence project is expanding the capabilities of autonomous agents.\nThe technology combines novel learning models with advanced architectures to enable greater autonomy and complex reasoning in real-world tasks.\nThe initiative highlights the strengthening of China's innovation ecosystem by connecting academic research with cutting-edge industrial application.","link":"https://finance.ifeng.com/c/8wHJRJ5R9qm","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"观察者","pais":"China","titulo":"China Takes the Lead in Developing Next-Generation Silicon Carbide Technology","resumo":"China's semiconductor industry has achieved decisive milestones in advancing next-generation silicon carbide (SiC), outperforming international competitors.\nNew SiC devices offer greater energy efficiency and high-voltage resistance, making them crucial for electric vehicles and clean energy systems.\nThe progress solidifies the country's technological self-sufficiency and strengthens its position in the global advanced chip supply chain.","link":"https://www.guancha.cn/GongSi/2026_09_09_830528.shtml","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"french.news.cn","pais":"China","titulo":"Global Launch of Hualong-One 2.0 Nuclear Power Technology","resumo":"China has unveiled the version 2.0 of its Hualong-One third-generation nuclear reactor technology to the international market.\nThe new model brings significant enhancements in passive safety, operational efficiency, and the reduction of construction costs.\nThe global expansion of this technology aims to meet the growing demand for clean energy and support decarbonization goals in various countries.","link":"https://french.news.cn/20260909/0b24da89687047b48bad0c9a236c826e/c.html","categoria":"NUCLEAR ENERGY","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"From Labs to Daily Life: Chinese Technology Redefines Innovation at IFA Berlin 2026","resumo":"Chinese technology companies showcased breakthrough solutions for the co
