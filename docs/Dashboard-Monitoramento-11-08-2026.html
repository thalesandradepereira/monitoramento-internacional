  const data = [{"fonte":"O GLOBO","pais":"Brasil","titulo":"Robôs humanoides tipo exportação: fabricantes chineses dominam 97% dos embarques globais","resumo":"A China consolidou seu domínio global no mercado de robótica avançada ao responder por 97% das exportações de robôs humanoides.\nO avanço reflete investimentos massivos em automação e integração de inteligência artificial em linhas de produção industriais.\nEspecialistas apontam que a liderança chinesa pode redefinir cadeias globais de suprimentos e acelerar a adoção da tecnologia.\nO feito coloca o país asiático na vanguarda do setor, superando concorrentes ocidentais no fornecimento em escala comercial.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/08/10/robos-humanoides-tipo-exportacao-fabricantes-chineses-dominam-97percent-dos-embarques-globais.ghtml","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Nvidia se alia a gigantes de Wall Street em pacote de financiamento de US$ 500 bilhões","resumo":"A Nvidia fechou uma parceria estratégica com grandes instituições financeiras de Wall Street para estruturar um pacote bilionário de financiamento.\nO objetivo da operação é expandir a infraestrutura global de centros de dados voltados ao processamento de inteligência artificial.\nA iniciativa busca sustentar a crescente demanda corporativa por chips gráficos de alta performance e supercomputação.\nO movimento consolida a gigante da tecnologia como o principal motor do ecossistema e do mercado financeiro de IA.","link":"https://oglobo.globo.com/economia/noticia/2026/08/10/nvidia-se-alia-a-gigantes-de-wall-street-em-pacote-de-financiamento-de-us-500-bilhoes-diz-agencia.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Valor Econômico","pais":"Brasil","titulo":"Meta e outras empresas de tecnologia devem responder por vício em redes sociais, decide tribunal nos EUA","resumo":"Um tribunal nos Estados Unidos determinou que a Meta e outras gigantes de tecnologia enfrentarão processos judiciais sobre os impactos das redes sociais.\nAs ações alegam que as plataformas foram projetadas de forma intencional para causar vício e danos à saúde mental de jovens.\nA decisão abre um precedente histórico na responsabilização legal do setor de tecnologia quanto aos algoritmos empregados.\nO resultado pode forçar mudanças profundas na arquitetura de produtos e nas políticas de segurança digital globais.","link":"https://valor.globo.com/empresas/noticia/2026/08/10/meta-e-outras-empresas-de-tecnologia-devem-responder-por-vicio-em-redes-sociais-decide-tribunal-nos-eua.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Salários de até R$ 53 mil e falta de profissionais: veja as 10 profissões mais valorizadas da tecnologia","resumo":"O setor de tecnologia no Brasil enfrenta um déficit crônico de talentos qualificados, impulsionando expressivamente a remuneração no setor.\nCargos em áreas como inteligência artificial, segurança da informação e engenharia de dados oferecem salários que chegam a R$ 53 mil.\nA alta demanda é impulsionada pela transformação digital acelerada de empresas de todos os segmentos da economia nacional.\nEspecialistas indicam que a capacitação continuada e a especialização técnica permanecem sendo os principais diferenciais na área.","link":"https://g1.globo.com/trabalho-e-carreira/noticia/2026/08/10/veja-as-10-profissoes-mais-valorizadas-da-tecnologia.ghtml","categoria":"MERCADO DE TRABALHO","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"BYD Song Pro 2027 roda com etanol e eletricidade em teste no interior paulista","resumo":"A BYD iniciou os testes práticos do SUV Song Pro 2027 no interior de São Paulo utilizando um novo sistema híbrido flex.\nA tecnologia combina a motorização elétrica da fabricante chinesa com o uso do etanol biocombustível brasileiro.\nO projeto busca adaptar os veículos da marca às especificidades do mercado nacional e promover soluções sustentáveis de mobilidade.\nA iniciativa marca um passo importante para a expansão da produção local de automóveis com emissão reduzida de carbono.","link":"https://www1.folha.uol.com.br/mercado/2026/08/byd-song-pro-2027-roda-com-etanol-e-eletricidade-em-teste-no-interior-paulista.shtml","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"ES Hoje","pais":"Brasil","titulo":"Tecnologia capixaba de irrigação inteligente reduz em 36% o consumo de água em cafezais","resumo":"Uma nova tecnologia de irrigação inteligente desenvolvida no Espírito Santo demonstrou alta eficiência na cafeicultura local.\nO sistema utiliza sensores e algoritmos para otimizar o uso dos recursos hídricos, reduzindo em até 36% o consumo de água.\nAlém da economia hídrica, a solução permite reduzir gastos com energia e melhorar a produtividade das lavouras atendidas.\nA inovação destaca o papel da tecnologia aplicada no campo para enfrentar desafios climáticos e promover a sustentabilidade.","link":"https://eshoje.com.br/economia/economia-e-mercado/2026/08/tecnologia-capixaba-de-irrigacao-inteligente-reduz-em-36-o-consumo-de-agua-em-cafezais/","categoria":"AGROTECNOLOGIA","lang":"pt"},{"fonte":"Época Negócios","pais":"Brasil","titulo":"Cachorros conseguem identificar tristeza e medo no rosto humano, sugere estudo","resumo":"Um novo estudo científico revelou que os cães possuem a habilidade de reconhecer expressões faciais humanas de tristeza e medo.\nA pesquisa analisou a reação dos animais a estímulos visuais, comprovando a sensibilidade canina às emoções dos tutores.\nOs achados ajudam a compreender a evolução da cooperação e do vínculo afetivo construído entre humanos e cães.\nA descoberta também traz implicações relevantes para a aplicação de cães de suporte emocional e de assistência terapêutica.","link":"https://epocanegocios.globo.com/google/amp/ciencia-e-saude/noticia/2026/08/cachorros-conseguem-identificar-tristeza-e-medo-no-rosto-humano-sugere-estudo.ghtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"brasildefato.com.br","pais":"Brasil","titulo":"Da pesquisa à incidência política na decisão da ANPD: o caso do reconhecimento facial no Paraná","resumo":"A Autoridade Nacional de Proteção de Dados tomou decisões importantes sobre o uso de reconhecimento facial nas escolas do Paraná.\nO caso envolveu análises técnicas sobre a privacidade e o tratamento de dados pessoais sensíveis de estudantes menores de idade.\nPesquisas acadêmicas e a sociedade civil desempenharam papel fundamental na fundamentação dos limites impostos pela regulamentação.\nA medida estabelece marcos relevantes para o uso ético de tecnologias de vigilância biométrica no setor público.","link":"https://www.brasildefato.com.br/colunista/observatorio-da-metropoles-pr/2026/08/10/da-pesquisa-a-incidencia-politica-na-decisao-da-anpd-o-caso-do-reconhecimento-facial-no-parana/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Estados Unidos","titulo":"Zuckerberg impulsiona IA ‘superinteligente’ para todos com novo modelo de código aberto da Meta","resumo":"O CEO da Meta, Mark Zuckerberg, reforçou o compromisso da empresa em desenvolver uma inteligência artificial superinteligente e acessível globalmente.\nCom o lançamento do seu mais recente modelo de código aberto, a Meta busca liderar a corrida tecnológica frente aos concorrentes proprietários.\nA iniciativa visa democratizar o acesso a ferramentas avançadas de IA, impactando diretamente desenvolvedores, empresas e o ecossistema de inovação global.","link":"https://www.theguardian.com/technology/2026/aug/10/mark-zuckerberg-superintelligent-ai-essay-meta","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"Nebulosa do Leão ganha vida com o Telescópio Espacial James Webb da NASA","resumo":"O Telescópio Espacial James Webb da NASA capturou imagens inéditas e detalhadas da Nebulosa do Leão, revelando estruturas estelares complexas.\nAs observações em infravermelho fornecem novas pistas sobre os processos de formação de estrelas e a dinâmica do meio interestelar.\nEste registro amplia a compreensão da evolução galáctica e destaca a capacidade sem precedentes do observatório espacial.","link":"https://science.nasa.gov/missions/webb/lion-nebula-roars-to-life-with-nasas-webb/","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"NASA (.gov)","pais":"Estados Unidos","titulo":"NASA explica a ciência por trás dos estrondos sônicos do avião X-59","resumo":"A NASA detalhou os conceitos científicos envolvidos no desenvolvimento da aeronave experimental X-59, projetada para reduzir drasticamente o barulho de estrondos sônicos.\nA tecnologia busca transformar o impacto sonoro em um leve baque, permitindo voos comerciais supersônicos sobre o solo urbano.\nA iniciativa marca um avanço fundamental para o futuro da aviação e da regulamentação do espaço aéreo.","link":"https://www.nasa.gov/blogs/quesst/2026/08/10/nasa-x-59-explainer-science-of-sonic-booms/","categoria":"CIÊNCIA ESPACIAL","lang":"pt"},{"fonte":"UC Davis College of Engineering","pais":"Estados Unidos","titulo":"Nova iniciativa de IA para a saúde conecta ciência da computação e medicina","resumo":"Uma nova iniciativa interorganizacional está integrando avanços em inteligência artificial e ciência da computação diretamente à pesquisa médica e ao atendimento de pacientes.\nO projeto visa acelerar diagnósticos, personalizar tratamentos e otimizar a análise de grandes volumes de dados clínicos.\nA colaboração promete transformar a prática médica tradicional por meio de inovações tecnológicas de ponta.","link":"https://engineering.ucdavis.edu/news/new-ai-health-initiative-connects-computer-science-and-medicine","categoria":"SAÚDE E TECNOLOGIA","lang":"pt"},{"fonte":"ScienceAlert","pais":"Estados Unidos","titulo":"Tendências psicopáticas estão ligadas a micróbios no corpo humano, revela estudo","resumo":"Uma nova pesquisa científica identificou conexões surpreendentes entre a composição do microbioma intestinal e traços de personalidade, como tendências psicopáticas.\nO estudo sugere que o equilíbrio bacteriano pode influenciar processos neurobiológicos e comportamentais de maneira mais profunda do que se imaginava.\nAs descobertas abrem novos caminhos para entender a relação entre a saúde física e os transtornos psiquiátricos.","link":"https://www.sciencealert.com/psychopathic-tendencies-are-linked-to-microbes-inside-your-body-study-reveals","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"utahnewsdispatch.com","pais":"Estados Unidos","titulo":"Com foco federal na tecnologia quântica, Utah impulsiona suas próprias iniciativas","resumo":"Enquanto o governo federal dos EUA intensifica a atenção à computação e tecnologia quântica, o estado de Utah lança estratégias locais para se consolidar como um polo do setor.\nO plano envolve parcerias acadêmicas, investimentos privados e incentivos para a criação de infraestrutura especializada.\nA movimentação visa garantir competitividade econômica e avanço científico em um mercado estratégico global.","link":"https://utahnewsdispatch.com/2026/08/10/utah-pushes-quantum-technology/","categoria":"TECNOLOGIA QUÂNTICA","lang":"pt"},{"fonte":"MIT News","pais":"Estados Unidos","titulo":"Na caça pela matéria escura","resumo":"Cientistas e pesquisadores continuam intensificando esforços e experimentos em física fundamental na tentativa de detectar diretamente a matéria escura.\nComposta por partículas invisíveis que constituem a maior parte da massa do universo, sua identificação permanece como um dos maiores mistérios da ciência moderna.\nAvanços nesses testes podem revolucionar teorias da cosmologia e a física de partículas.","link":"https://news.mit.edu/2026/hunt-dark-matter-jessica-fry-0811","categoria":"FÍSICA","lang":"pt"},{"fonte":"Stanford Medicine","pais":"Estados Unidos","titulo":"Peptídeos estão em alta: o que diz a ciência sobre essa tendência?","resumo":"O uso de peptídeos em tratamentos de saúde, longevidade e bem-estar tornou-se um tópico extremamente popular no mercado atual.\nUma análise aprofundada da literatura científica avalia quais promessas são respaldadas por evidências reais e quais ainda carecem de comprovação clínica.\nO estudo orienta consumidores e profissionais sobre a eficácia e os riscos associados ao uso dessas substâncias.","link":"https://med.stanford.edu/news/insights/2026/08/peptides-what-does-the-science-say.html","categoria":"SAÚDE E CIÊNCIA","lang":"pt"},{"fonte":"Android MT","pais":"França","titulo":"MagSafe ou Qi2: Dois Nomes Para uma Mesma Tecnologia de Carregamento Magnético","resumo":"A tecnologia de carregamento magnético sem fio evoluiu significativamente com a consolidação dos padrões MagSafe e Qi2 no mercado.\nApesar de usarem marcas diferentes, ambas as soluções compartilham a mesma base tecnológica para otimizar a eficiência energética.\nEssa padronização simplifica a escolha para os consumidores, garantindo maior compatibilidade entre diferentes marcas de smartphones.","link":"https://android-mt.ouest-france.fr/news/smartphones-news/magsafe-ou-qi2-deux-noms-pour-une-meme-technologie-de-charge-magnetique/210738/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"senioractu.com","pais":"França","titulo":"Segundo a Ciência, a Gordura Abdominal Não Depende Apenas da Alimentação: Novas Células a Fabricam Por Você","resumo":"Uma nova pesquisa científica revelou que o acúmulo de gordura abdominal envolve mecanismos celulares que vão além do consumo calórico.\nO estudo identifica a formação de novas células ativas que fabricam e armazenam tecido adiposo diretamente na região.\nA descoberta abre caminhos promissores para o desenvolvimento de tratamentos metabólicos mais eficazes contra a obesidade.","link":"https://www.senioractu.com/Selon-Science-le-ventre-ne-s-arrondit-pas-que-par-l-assiette-des-cellules-neuves-y-fabriquent-la-graisse-a-votre-place_a27942.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"notebookcheck.biz","pais":"França","titulo":"Makerfabs MaTouch ESP32-S3: Tecnologia UWB Permite Posicionamento Interno Com Precisão Submétrica","resumo":"O novo dispositivo Makerfabs MaTouch, baseado no chip ESP32-S3, emprega a tecnologia de Banda Ultra-Larga (UWB) para rastreamento de alta precisão.\nA inovação alcança margem de erro inferior a um metro em ambientes fechados, superando limitações tradicionais do GPS interno.\nO hardware é voltado para desenvolvedores que buscam soluções avançadas em automação residencial, robótica e IoT.","link":"https://www.notebookcheck.biz/Makerfabs-MaTouch-ESP32-S3-la-technologie-UWB-permet-un-positionnement-interieur-avec-une-precision-inferieure-au-metre.1365172.0.html","categoria":"HARDWARE","lang":"pt"},{"fonte":"Times Brasil | CNBC","pais":"França","titulo":"Ondas de Calor Podem Tirar R$ 1 Trilhão da Economia da Europa em 2026","resumo":"Estudos recentes alertam para o impacto devastador do aumento das temperaturas extremas sobre os países europeus nos próximos anos.\nAs projeções indicam perdas econômicas astronômicas até 2026, causadas por quedas na produtividade e danos severos à infraestrutura.\nO cenário reforça a urgência de acelerar tecnologias de adaptação climática e políticas de sustentabilidade no continente.","link":"https://timesbrasil.com.br/mundo/ondas-de-calor-podem-tirar-180-bilhoes-de-euros-da-europa/","categoria":"CLIMA E ECONOMIA","lang":"pt"},{"fonte":"Goal.com","pais":"França","titulo":"Uma Decisão Espectacular: UEFA Revoluciona a Tecnologia de Vídeo no Futebol","resumo":"A UEFA anunciou uma reformulação profunda na aplicação de sistemas tecnológicos de assistência por vídeo em suas competições.\nA nova estratégia visa otimizar a precisão das arbitragens e reduzir radicalmente o tempo de paralisação nas partidas.\nA medida promete modernizar o ritmo do jogo e definir novos parâmetros tecnológicos para o esporte mundial.","link":"https://www.goal.com/fr/news/une-decision-spectaculaire-l-uefa-revolutionne-la-technologie-de-la-video/bltb92c7048d2b49c7b","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Boursorama","pais":"França","titulo":"Empresa de Tecnologia de Defesa Lyntris Busca Valorização de US$ 2,5 Bilhões em seu IPO","resumo":"A empresa de tecnologia voltada ao setor de defesa, Lyntris, está preparando sua oferta pública inicial de ações no mercado financeiro.\nA meta de atingir uma avaliação de 2,5 bilhões de dólares demonstra o forte interesse dos investidores em soluções avançadas de segurança.\nO movimento reflete a expansão acelerada e a valorização global de startups focadas em segurança e defesa tecnológica.","link":"https://www.boursorama.com/bourse/actualites-amp/lyntris-entreprise-de-technologie-de-defense-vise-une-valorisation-de-2-5-milliards-de-dollars-lors-de-son-introduction-en-bourse-aux-etats-unis-b8f37f15873a10ca41535ea128ec4a47","categoria":"NEGÓCIOS E TECH","lang":"pt"},{"fonte":"Vosges Matin","pais":"França","titulo":"Revolut Obtém Licença Bancária na França: O Que Muda Para a Neobanco e Seus Clientes","resumo":"A fintech Revolut alcançou um marco decisivo ao conseguir sua licença bancária plena para operar no mercado francês.\nCom a nova autorização, a instituição poderá expandir sua oferta de produtos, incluindo empréstimos e proteção a depósitos.\nA mudança fortalece a concorrência entre os bancos digitais na Europa e traz mais garantias jurídicas aos clientes.","link":"https://www.vosgesmatin.fr/economie/2026/08/10/revolut-obtient-sa-licence-bancaire-en-france-ce-que-ca-change-pour-la-neobanque-et-ses-clients","categoria":"FINTECH","lang":"pt"},{"fonte":"Les Echos","pais":"França","titulo":"Inteligência Artificial: O Papel do 'Forward Deployed Engineer' na Transformação de Tecnologias Promissoras","resumo":"A demanda pelo profissional 'Forward Deployed Engineer' cresce rapidamente no setor de inteligência artificial aplicada.\nEsses engenheiros atuam diretamente na ponte entre algoritmos complexos e a resolução de problemas práticos dos clientes.\nA função é essencial para acelerar a adoção corporativa da IA e converter avanços teóricos em produtos de alto valor.","link":"https://www.lesechos.fr/idees-debats/cercle/ia-trouver-les-profils-capables-de-transformer-une-technologie-prometteuse-en-solution-qui-change-la-donne-le-role-du-forward-deployed-engineer-2246550","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Bernie Sanders pede ao Vale do Silício que 'pause o desenvolvimento de IA' pelo bem da humanidade","resumo":"O senador americano Bernie Sanders fez um apelo público às grandes empresas de tecnologia do Vale do Silício para interromperem temporariamente os avanços em inteligência artificial.\nSanders expressou preocupações profundas sobre os impactos sociais, econômicos e trabalhistas que a automação descontrolada pode causar na sociedade mundial.\nO posicionamento reacende o debate global sobre a necessidade de regulamentações éticas e limites para garantir que o progresso tecnológico priorize o bem-estar da humanidade.","link":"https://www.theguardian.com/technology/2026/aug/10/bernie-sanders-ai-development-pause-letter","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Reconhecimento facial será testado em estações do metrô de Londres","resumo":"A rede de transporte de Londres iniciará testes com tecnologia de reconhecimento facial em tempo real nas estações do metrô para reforçar a segurança pública.\nO projeto busca identificar indivíduos procurados e prevenir crimes em áreas de grande circulação de passageiros no Reino Unido.\nNo entanto, a medida levanta intensos debates entre defensores da privacidade e autoridades sobre o equilíbrio entre vigilância ostensiva e direitos civis.","link":"https://www.bbc.com/news/articles/c07r0gvgjxyo","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Dono do Liverpool aproxima-se da venda de 30% do clube por £ 1,35 bilhão a consórcio com Jeff Bezos","resumo":"O grupo proprietário do Liverpool Football Club está prestes a concluir a venda de uma fatia minoritária de 30% por cerca de 1,35 bilhão de libras.\nA transação envolve um consórcio de investidores de alto perfil que inclui o bilionário fundador da Amazon, Jeff Bezos.\nA entrada de novos investimentos promete reforçar a capacidade financeira do clube e sinaliza a crescente atratividade das potências da Premier League para magnatas globais.","link":"https://www.theguardian.com/football/2026/aug/10/liverpool-sale-stake-consortium-jeff-bezos-amazon-fenway-sports-group","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"LANCE!","pais":"Inglaterra","titulo":"Impacto da Premier League na economia do Reino Unido deve atingir R$ 227 bilhões até 2028","resumo":"Estudos econômicos projetam que a Premier League gerará uma contribuição financeira impressionante para o produto interno bruto do Reino Unido nos próximos anos.\nO ecossistema do futebol inglês movimenta setores cruciais como turismo, radiodifusão, comércio e geração de empregos diretos e indiretos no país.\nEsse crescimento reforça o papel da liga não apenas como entretenimento esportivo global, mas como um dos principais motores econômicos britânicos.","link":"https://www.lance.com.br/lance-negocios/impacto-da-premier-league-na-economia-do-reino-unido-deve-atingir-r-227-bilhoes-ate-2028.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Trump exige que o Irã pague indenização por décadas de mortes de soldados americanos","resumo":"O ex-presidente americano Donald Trump declarou que o governo do Irã deve compensar financeiramente os Estados Unidos pelas vidas de militares perdidas em conflitos no Oriente Médio.\nA declaração dura intensifica as tensões diplomáticas e a retórica de confronto entre Washington e Teerã no cenário internacional.\nO posicionamento gera debates geopolíticos globais sobre as implicações de eventuais sanções e reparações financeiras em meio à instabilidade na região.","link":"https://www.theguardian.com/world/2026/aug/10/trump-demands-iran-pay-compensation-for-decades-of-us-soldier-deaths","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"larazon.es","pais":"Espanha","titulo":"NASA desacelera rover PROMISE: um bilhão de dólares para reciclar peças de Marte","resumo":"A agência espacial norte-americana reavaliou a missão do rover PROMISE devido a severos cortes orçamentários e à necessidade de otimização de recursos. A nova estratégia foca no reaproveitamento de componentes e tecnologias desenvolvidas para missões anteriores no planeta vermelho. Essa mudança de abordagem busca manter vivas as pesquisas científicas essenciais em Marte sem comprometer financeiramente outros projetos prioritários da NASA.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/nasa-frena-rover-promise-mil-millones-reciclar-piezas-marte_202608116a7a4884a046ad6ebcaa5679.html","categoria":"AEROESPACIAL","lang":"pt"},{"fonte":"El HuffPost","pais":"Espanha","titulo":"Ciência revela novos segredos do interior da Terra graças a um diamante 'superprofundo' em acelerador de partículas","resumo":"Pesquisadores analisaram um pequeno diamante superprofundo de apenas três milímetros utilizando aceleradores de partículas de última geração. O estudo permitiu mapear estruturas e minerais raros localizados nas camadas mais profundas do manto terrestre. As descobertas fornecem novas pistas sobre a composição e os processos geológicos que moldam a dinâmica do interior do planeta.","link":"https://www.huffingtonpost.es/planeta/la-ciencia-destapa-nuevos-secretos-interior-tierra-gracias-diamante-superprofundo-3-milimetros-acelerador-particulas-f202608.html?outputType=amp","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"EL PAÍS","pais":"Espanha","titulo":"Quando políticos leem discursos criados por IA: a era da tecnologia ventríloqua","resumo":"O uso crescente de ferramentas de inteligência artificial gerativa por líderes políticos está mudando drasticamente a comunicação pública global. O fenômeno levanta debates sobre a autenticidade, a autoria e a responsabilidade ética nas declarações dos representantes governamentais. Especialistas alertam para os riscos do descolamento entre discursos automatizados e as reais intenções políticas.","link":"https://elpais.com/ideas/2026-08-11/cuando-los-politicos-leen-discursos-escritos-con-ia-la-era-de-la-tecnologia-ventrilocua.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Auto Bild España","pais":"Espanha","titulo":"Esta tecnologia converte antigos caminhões a diesel em híbridos sem alterar o motor","resumo":"Uma nova solução tecnológica permite transformar veículos pesados movidos a diesel em modelos híbridos de forma simples e acessível. O sistema é instalado sem a necessidade de modificar o motor original do caminhão, reduzindo significativamente as emissões e o consumo de combustível. A inovação surge como uma alternativa viável para acelerar a transição ecológica do transporte rodoviário.","link":"https://www.autobild.es/tecnologia/esta-tecnologia-convierte-antiguos-camiones-diesel-hibridos-sin-tocar-motor_7024415_0.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"diariodealmeria.es","pais":"Espanha","titulo":"Tecnologia de baixo custo que promete revolucionar a pesquisa submarina é testada em Almería","resumo":"Especialistas estão testando no litoral espanhol um novo equipamento tecnológico de baixo custo voltado para a exploração e monitoramento do oceano. A ferramenta permite coletar dados marinhos precisos sem a necessidade de grandes orçamentos ou embarcações altamente especializadas. Essa inovação democratiza o acesso à pesquisa oceanográfica e promete impulsionar a preservação ambiental.","link":"https://www.diariodealmeria.es/almeria/tecnologia-coste-revolucionara-investigacion-submarina_0_2007662245.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Ideal","pais":"Espanha","titulo":"'Conseguimos fazer com que o eclipse solar possa ser ouvido'","resumo":"Cientistas e engenheiros desenvolveram um dispositivo inovador capaz de converter variações de luz solar em frequências sonoras audíveis em tempo real. A tecnologia permite que pessoas com deficiência visual vivenciem o fenômeno astronômico de um eclipse solar através do som. A iniciativa destaca-se como um avanço marcante na acessibilidade e na divulgação científica inclusiva.","link":"https://www.ideal.es/granada/conseguido-eclipse-sol-pueda-oir-20260811194238-nt_amp.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Infobae","pais":"Espanha","titulo":"O envelhecimento do cérebro: como o órgão se transforma ao longo dos anos, segundo a ciência","resumo":"Estudos científicos recentes detalham as transformações estruturais e funcionais pelas quais o cérebro humano passa com o avanço da idade. As pesquisas identificam fatores de estilo de vida e mecanismos neurológicos que podem desacelerar o declínio cognitivo e proteger a saúde mental. A compreensão desse processo é fundamental para desenvolver novas terapias e promover um envelhecimento saudável.","link":"https://www.infobae.com/generacion-silver/2026/08/11/el-envejecimiento-del-cerebro-como-se-transforma-el-organo-a-medida-que-pasan-los-anos-segun-la-ciencia/","categoria":"NEUROCIÊNCIA","lang":"pt"},{"fonte":"El Periódico de la Energía","pais":"Espanha","titulo":"Austrália financia tecnologia para refinar lítio de forma mais limpa e eficiente","resumo":"O governo australiano anunciou o financiamento de uma tecnologia inovadora voltada para o processamento sustentável de lítio. O novo método visa reduzir significativamente o consumo de água, energia e reagentes químicos nocivos na cadeia de produção do mineral. A iniciativa é crucial para atender à crescente demanda por baterias e acelerar a transição para fontes de energia limpa.","link":"https://elperiodicodelaenergia.com/australia-financia-una-tecnologia-para-refinar-litio-que-promete-ser-mas-limpia-y-eficiente/","categoria":"ENERGIA","lang":"pt"},{"fonte":"Radio Oberland","pais":"Alemanha","titulo":"Airbus A319 da Lufthansa decola com tecnologia de 'pele de tubarão'","resumo":"A Lufthansa iniciou os testes práticos de uma nova tecnologia aerodinâmica baseada na pele de tubarão no modelo Airbus A319.\nTrata-se de uma película especial aplicada à fuselagem do avião para reduzir a resistência do ar e o consumo de combustível.\nA iniciativa visa validar a eficiência do revestimento biônico em operações comerciais diárias na aviação civil.\nA inovação promete acelerar a descarbonização da frota e contribuir para metas sustentáveis do setor aéreo.","link":"https://radio-oberland.de/news/2026-08-11-a319-starnberg","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Bild der Wissenschaft","pais":"Alemanha","titulo":"Plantas geneticamente modificadas produzem proteína de carne muscular","resumo":"Pesquisadores desenvolveram plantas transgênicas capazes de sintetizar proteínas idênticas às encontradas em tecidos musculares animais.\nA técnica de agricultura molecular utiliza os vegetais como biofábricas para gerar ingredientes para a indústria alimentícia.\nEssa inovação surge como uma alternativa sustentável à pecuária tradicional para atender à demanda global por alimentos.\nO avanço promete transformar a produção de proteínas e reduzir significativamente o impacto ambiental do setor.","link":"https://wissenschaft.de/artikel/gentech-pflanzen-produzieren-muskelfleisch-protein","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"The Irish Times","pais":"Alemanha","titulo":"Crise na Volkswagen reflete momento delicado da economia alemã","resumo":"A montadora alemã Volkswagen enfrenta uma severa reestruturação com ameaça de fechamento de fábricas no país.\nA situação reflete os altos custos de energia, a concorrência de elétricos chineses e a estagnação industrial local.\nO impasse entre sindicatos e executivos expõe os desafios estruturais enfrentados pela maior economia da Europa.\nO desfecho dessa crise servirá de termômetro para a capacidade de inovação e competitividade do setor automotivo.","link":"https://www.irishtimes.com/business/2026/08/11/crisis-stricken-volkswagen-is-emblematic-of-germanys-ailing-economy/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"WEB.DE","pais":"Alemanha","titulo":"Trump reduz recomendações de vacinação para crianças","resumo":"A administração do governo norte-americano anunciou uma grande reformulação nas diretrizes federais de imunização infantil.\nA medida reduz o número de vacinas recomendadas nos calendários de saúde pública para o público jovem.\nEspecialistas e organizações médicas alertam para o risco de ressurgimento de doenças evitáveis e queda nas taxas de imunização.\nO debate expõe a tensão crescente entre decisões políticas de governança e o consenso científico global em saúde.","link":"https://web.de/magazine/politik/videos/trump-kuerzt-impfempfehlungen-kinder-42599084","categoria":"SAÚDE","lang":"pt"},{"fonte":"ｄメニューニュース","pais":"Alemanha","titulo":"Novo Mercedes-AMG GT 53 Coupé de 4 portas com mais de 500 cv é lançado na Alemanha","resumo":"A Mercedes-AMG apresentou na Alemanha a nova versão do GT 53 4-Door Coupé com motor 3.0 de seis cilindros em linha.\nO veículo entrega mais de 500 cavalos de potência aliados a um sistema avançado de tração integral e dinâmica de condução.\nO modelo integra tecnologias modernas de aceleração para elevar o desempenho da linha esportiva de luxo da marca.\nA novidade reforça a presença da empresa no segmento de alta performance e atrai entusiastas da engenharia automotiva.","link":"https://topics.smt.docomo.ne.jp/amp/article/kurumanews/trend/kurumanews-1096808","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"NDR.de","pais":"Alemanha","titulo":"Tecnologia 'Low-DC': Hamburgo recebe estações de carregamento elétrico mais rápidas","resumo":"A cidade de Hamburgo começou a instalar novas estações de recarga para veículos elétricos baseadas na tecnologia 'Low-DC'.\nO sistema permite um carregamento contínuo mais eficiente sem exigir intervenções pesadas na rede elétrica de baixa tensão.\nA inovação reduz substancialmente o tempo de espera dos motoristas e diminui os custos de infraestrutura urbana.\nO projeto piloto impulsiona a mobilidade sustentável e serve como modelo de expansão para outras metrópoles europeias.","link":"https://www.ndr.de/nachrichten/hamburg/low-dc-technologie-hamburg-bekommt-schnellere-e-ladesaeulen,kurzehh-3994.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"digital terminal","pais":"Japão","titulo":"Kioxia e Sandisk Revelam Tecnologia de Memória Flash 3D QLC Líder de Mercado","resumo":"A Kioxia e a Sandisk apresentaram uma nova tecnologia de memória flash 3D QLC de última geração, estabelecendo novos padrões de densidade e eficiência para armazenamento de dados.\nO avanço permite a fabricação de dispositivos mais compactos e com maior capacidade de resposta para centros de dados e eletrônicos de consumo.\nEssa inovação promete impactar significativamente a indústria global ao reduzir custos por gigabyte e otimizar o consumo energético em aplicações de alta performance.","link":"https://digitalterminal.in/solutions/kioxia-and-sandisk-unveil-industry-leading-qlc-3d-flash-memory-technology","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"TVer","pais":"Japão","titulo":"Especial Nikkei: Casas e Nervos Impressos em 3D e a Evolução dos Robôs Humanoides","resumo":"Um programa especial da Nikkei destacou avanços tecnológicos que prometem se tornar comuns no futuro próximo, incluindo a impressão 3D de casas e nervos humanos.\nO especial também abordou a rápida evolução dos robôs humanoides, capazes de realizar tarefas cada vez mais complexas.\nEssas inovações demonstram como a convergência entre robótica e biotecnologia transformarão setores como construção civil, medicina regenerativa e o cotidiano da sociedade.","link":"https://tver.jp/episodes/ep1z8lz3l4","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"Monochrome Inicia Testes de Células Solares de Perovskita Integradas a Materiais de Construção","resumo":"A empresa Monochrome iniciou a verificação técnica para integrar células solares de perovskita diretamente a materiais de construção civil.\nA primeira fase do projeto consiste em um teste prático em ambientes extremos, realizado em parceria com o escalador alpino Yudai Suzuki.\nA iniciativa visa validar a durabilidade e eficiência da tecnologia em condições adversas, impulsionando a adoção de energia solar urbana sustentável.","link":"https://prtimes.jp/main/html/rd/p/000000039.000113840.html","categoria":"ENERGIA RENOVÁVEL","lang":"pt"},{"fonte":"upi.com","pais":"Japão","titulo":"Samsung e NTT Docomo Validam Tecnologia de Rede de IA Personalizada","resumo":"A Samsung e a operadora japonesa NTT Docomo concluíram com sucesso a validação de uma nova tecnologia de rede baseada em inteligência artificial personalizada.\nO sistema ajusta dinamicamente os recursos da rede de acordo com os padrões de uso e necessidades individuais de cada usuário em tempo real.\nEssa inovação pavimenta o caminho para a otimização de redes 5G e futuras infraestruturas 6G, melhorando a qualidade de serviço e a eficiência operacional.","link":"https://www.upi.com/Top_News/World-News/2026/08/10/samsung-ntt-docomo/7511786398239/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"凤凰网汽车","pais":"China","titulo":"Tecnologia de carregamento rápido da BYD conquista prêmio na Alemanha com autonomia de 400 km em 5 minutos","resumo":"A tecnologia de recarga ultra-rápida da BYD conquistou o prestigiado prêmio Paul Pietsch na Alemanha, destacando o avanço das empresas chinesas no setor de veículos elétricos.\nO sistema inovador permite adicionar até 400 quilômetros de autonomia em apenas cinco minutos de carga.\nEsse marco reforça a liderança da montadora na infraestrutura de mobilidade elétrica global e acelera a transição para um transporte sustentável.","link":"https://auto.ifeng.com/c/8vV7DZ9xWQa","categoria":"MOBILIDADE","lang":"pt"},{"fonte":"同济大学新闻网","pais":"China","titulo":"Pesquisadores revelam novo mecanismo de 'cola molecular' contra o linfoma em estudo publicado na Experimental Hematology \u0026 Oncology","resumo":"Uma equipe da Escola de Ciências e Tecnologia da Vida revelou um novo mecanismo de ação do trióxido de arsênio operando como uma 'cola molecular'.\nA combinação dessa técnica com um medicamento cardíaco centenário resultou em um tratamento sinérgico e inovador contra o linfoma.\nA descoberta promete abrir novas vias terapêuticas no combate ao câncer e foi detalhada em uma publicação de alto impacto científico.","link":"https://news.tongji.edu.cn/info/1003/95313.htm","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Avanço na astrofísica: observações combinadas confirmam a existência de um 'acelerador natural' no universo","resumo":"Utilizando uma abordagem coordenada de múltiplos observatórios, cientistas confirmaram a presença de um acelerador cósmico natural no espaço profundo.\nA descoberta é um marco para a astrofísica de alta energia, fornecendo dados cruciais sobre a origem dos raios cósmicos e fenômenos de radiação extrema.\nO estudo amplia substancialmente a compreensão sobre a dinâmica de partículas aceleradas em escala universal.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569637.shtm","categoria":"ASTROFÍSICA","lang":"pt"},{"fonte":"wallstreetcn.com","pais":"China","titulo":"Ponto de virada na economia dos Agentes de IA: custo por hora supera terceirização humana com maior precisão","resumo":"Análises de mercado apontam um marco histórico na automação digital: o custo por hora de Agentes de IA operando computadores já é inferior ao da terceirização offshore.\nAlém do benefício financeiro, as ferramentas automatizadas apresentam taxa de precisão superior em tarefas operacionais complexas.\nEsse fenômeno acelera a reestruturação dos processos empresariais globais e redesenha o futuro do trabalho digital.","link":"https://wallstreetcn.com/articles/3779129","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"北京大学新闻网","pais":"China","titulo":"Estudo publicado na revista Science revela magnetômetro suspenso LeMaMa de ultra-sensibilidade","resumo":"A equipe liderada pelo pesquisador Ji Wei, da Faculdade de Física, desenvolveu pela primeira vez o magnetômetro de suspensão LeMaMa de altíssima sensibilidade.\nA pesquisa, destacada no periódico Science, representa um avanço expressivo na medição magnética de precisão para aplicações científicas e tecnológicas.\nO instrumento promete impulsionar novas pesquisas em física quântica, geofísica e ciência avançada de materiais.","link":"https://news.pku.edu.cn/jxky/193e3fb5a02741168a43734457d1a0e0.htm","categoria":"FÍSICA","lang":"pt"},{"fonte":"武汉市商务局","pais":"China","titulo":"Tecnologia de nanotubos de carbono da Universidade de Pequim é industrializada com sensores de extrema precisão","resumo":"A tecnologia de nanotubos de carbono desenvolvida pela Universidade de Pequim alcançou a fase de industrialização no polo de alta tecnologia de Optics Valley.\nO novo chip sensor criado pela equipe possui precisão surpreendente, capaz de detectar o equivalente a um único grão de sal em uma piscina olímpica.\nA inovação promete revolucionar diagnósticos médicos, monitoramento ambiental e a fabricação de semicondutores de ponta.","link":"https://sw.wuhan.gov.cn/xwdt/mtbd/202608/t20260811_2832169.shtml","categoria":"NANOTECNOLOGIA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Inteligência Artificial otimiza padrões de estimulação elétrica em próteses do córtex visual","resumo":"Cientistas aplicaram algoritmos de inteligência artificial para aprimorar os padrões de estimulação elétrica utilizados em próteses de córtex visual.\nA otimização permite que os impulsos transmitidos ao cérebro gerem percepções visuais mais claras e precisas em pacientes com deficiência visual severa.\nEsse avanço representa um passo decisivo na convergência entre neurociência, medicina regenerativa e engenharia de IA.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569628.shtm","categoria":"NEUROTECNOLOGIA","lang":"pt"},{"fonte":"财联社","pais":"China","titulo":"Especialistas da ONU alertam que avanço da IA supera a capacidade científica e regulatória global","resumo":"Um painel de especialistas das Nações Unidas emitiu um alerta urgente informando que o ritmo de desenvolvimento da IA ultrapassou a compreensão científica e as regulamentações vigentes.\nO relatório destaca que essa lacuna de supervisão pode gerar riscos catastróficos para a segurança, a economia e a estabilidade social globais.\nO grupo defende a criação imediata de mecanismos internacionais de governança para mitigar ameaças emergentes.","link":"https://www.cls.cn/detail/2414744","categoria":"GOVERNANÇA","lang":"pt"},{"fonte":"scanx.trade","pais":"Índia","titulo":"L\u0026T Technology Services lança plataforma de IA AgenticIQ para engenharia","resumo":"A L\u0026T Technology Services anunciou o lançamento de sua nova plataforma de inteligência artificial, a AgenticIQ, voltada para otimizar processos na engenharia.\nA ferramenta busca automatizar fluxos de trabalho complexos, acelerando o desenvolvimento de produtos e melhorando a eficiência operacional das empresas.\nCom essa inovação, a gigante indiana fortalece sua posição na transformação digital e no uso corporativo de soluções avançadas de IA.","link":"https://scanx.trade/stock-market-news/technology/l-t-technology-services-launches-agenticiq-ai-platform-for-engineering/47964595","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"GK Today","pais":"Índia","titulo":"TDB apoia tecnologia de inteligência artificial para rastreamento de câncer de colo do útero","resumo":"O Conselho de Desenvolvimento Tecnológico da Índia aprovou suporte financeiro para o desenvolvimento de uma tecnologia baseada em IA dedicada ao rastreamento do câncer de colo do útero.\nA iniciativa visa tornar os exames preventivos mais acessíveis e precisos, atendendo principalmente áreas com infraestrutura médica limitada no país.\nA solução representa um avanço crucial para o diagnóstico precoce da doença, combinando inovação tecnológica com impacto social positivo.","link":"https://www.gktoday.in/tdb-supports-ai-cervical-cancer-screening-technology/","categoria":"SAÚDE","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"Ministro da Saúde lança documento sobre inteligência artificial em tecnologia médica","resumo":"O ministro da Saúde da Índia, J.P. Nadda, apresentou um documento oficial detalhando diretrizes e oportunidades para o uso da inteligência artificial na medicina.\nO relatório destaca como soluções baseadas em IA podem aprimorar o atendimento aos pacientes, otimizar diagnósticos e modernizar o sistema de saúde do país.\nA iniciativa busca incentivar a colaboração entre startups, centros de pesquisa e hospitais para acelerar a adoção de tecnologias médicas inovadoras.","link":"https://newsonair.gov.in/health-minister-nadda-releases-knowledge-paper-on-ai-in-medical-technology/","categoria":"SAÚDE","lang":"pt"},{"fonte":"The Indian Express","pais":"Índia","titulo":"Tecnologia direcionada e postes inteligentes devem reforçar combate à poluição do ar em Déli","resumo":"A cidade de Déli está apostando na instalação de postes inteligentes e sistemas tecnológicos direcionados para monitorar e combater a severa poluição atmosférica da região.\nEssas estruturas contarão com sensores avançados para coleta de dados em tempo real, auxiliando autoridades na tomada de decisões estratégicas de mitigação.\nA medida faz parte de um plano mais amplo para transformar a infraestrutura urbana e melhorar a qualidade do ar nas áreas mais afetadas da capital.","link":"https://indianexpress.com/article/cities/delhi/targeted-technology-smart-poles-expected-to-boost-delhis-air-pollution-fight-10827282/","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"Motorindia","pais":"Índia","titulo":"Aumento nos custos de combustível impulsiona adoção de tecnologia por caminhoneiros indianos","resumo":"O contínuo encarecimento dos combustíveis na Índia está acelerando a digitalização e a adoção de tecnologias de gestão de frota pelo setor de transporte rodoviário.\nCaminhoneiros e empresas de logística passam a utilizar aplicativos de roteirização, rastreamento e telemetria para otimizar trajetos e reduzir gastos operacionais.\nEssa mudança estrutural impulsiona o ecossistema de startups de tecnologia voltadas ao transporte, transformando um desafio econômico em oportunidade de modernização.","link":"https://www.motorindiaonline.in/rising-fuel-costs-are-creating-a-technology-moment-for-indian-truckers/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"whispersinthecorridors.in","pais":"Índia","titulo":"Transformando o policiamento em Madhya Pradesh por meio da tecnologia","resumo":"O estado indiano de Madhya Pradesh está integrando novas ferramentas digitais e sistemas de análise de dados para modernizar a atuação de suas forças policiais.\nA iniciativa inclui o uso de monitoramento por câmeras inteligentes, aplicativos de atendimento rápido ao cidadão e plataformas preditivas para prevenção de crimes.\nA modernização visa aumentar a transparência das operações, agilizar respostas a emergências e reforçar a segurança pública em toda a região.","link":"https://whispersinthecorridors.in/news/transforming-policing-in-madhya-pradesh-through-technology","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"The New Indian Express","pais":"Índia","titulo":"Bhatti discute tecnologia de baterias de última geração com CEO da QuantumScape","resumo":"O vice-primeiro-ministro do estado de Telangana, Bhatti Vikramarka, reuniu-se com os líderes da QuantumScape para discutir parcerias em tecnologia de baterias para veículos elétricos.\nO encontro focou no avanço de baterias de estado sólido, conhecidas por oferecer maior autonomia, carregamento mais rápido e mais segurança em comparação com as tradicionais.\nA aproximação destaca a ambição da Índia de se consolidar como um polo global de fabricação e inovação no setor de mobilidade sustentável.","link":"https://www.newindianexpress.com/states/telangana/2026/Aug/11/bhatti-discusses-next-gen-battery-technology-with-quantumscape-ceo-3","categoria":"ENERGIA","lang":"pt"},{"fonte":"India Today","pais":"Índia","titulo":"Rahul Gandhi afirma que boa forma não exige o momento perfeito, e a ciência concorda","resumo":"O líder político Rahul Gandhi afirmou que não existe um horário exato ou ideal para praticar exercícios físicos, enfatizando que a consistência é o fator principal.\nEstudos científicos recentes reforçam essa visão, mostrando que os benefícios para a saúde dependem mais da regularidade do treino do que do momento do dia escolhido.\nA declaração gerou discussões populares na Índia, chamando a atenção pública para a relevância de hábitos saudáveis adaptados à rotina individual.","link":"https://www.indiatoday.in/health/story/rahul-gandhi-fitness-advice-science-best-time-to-exercise-2967877-2026-08-11","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Mark Zuckerberg defende que o maior risco da IA é a concentração de seu controle","resumo":"O CEO da Meta, Mark Zuckerberg, alertou para os perigos de poucas corporações dominarem a inteligência artificial.\nSegundo o executivo, o acesso fechado a essa tecnologia pode gerar um monopólio prejudicial ao desenvolvimento global.\nEle defende o modelo open source como a solução ideal para democratizar a inovação e garantir segurança.\nA visão ressalta o debate ético sobre quem deve guiar os avanços tecnológicos no futuro.","link":"https://jornaleconomico.sapo.pt/noticias/mark-zuckerberg-defende-que-maior-risco-da-ia-e-a-concentracao-do-seu-controlo/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Diário de Notícias","pais":"Portugal","titulo":"Da teoria de Einstein aos efeitos na natureza: a ciência por trás do eclipse total","resumo":"Eclipses solares totais oferecem oportunidades únicas para a comunidade científica testar teorias fundamentais da física.\nO fenômeno permitiu, historicamente, comprovar a Teoria da Relatividade Geral de Albert Einstein ao observar a curvatura da luz.\nAlém disso, a súbita escuridão afeta diretamente o comportamento da fauna, flora e variações atmosféricas locais.\nO estudo desses eventos ajuda a compreender melhor a dinâmica solar e suas interações com a Terra.","link":"https://www.dn.pt/sociedade/da-teoria-de-einstein-aos-efeitos-na-natureza-a-cincia-por-detrs-do-eclipse-total","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Expresso","pais":"Portugal","titulo":"Eclipse solar: o que acontece com a eletricidade em Portugal quando o Sol “desaparece”?","resumo":"A passagem de um eclipse solar representa um grande desafio operacional para as redes elétricas modernas.\nCom a rápida diminuição da luz solar, a produção de energia fotovoltaica sofre uma queda drástica em poucos minutos.\nOperadores de rede em Portugal precisam acionar fontes de reserva e planejar a estabilização do sistema elétrico.\nA gestão eficiente garante que o abastecimento residencial e industrial não seja interrompido durante o fenômeno.","link":"https://expresso.pt/podcasts/economia-dia-a-dia/2026-08-10-eclipse-solar-que-acontece-a-eletricidade-em-portugal-quando-o-sol-desaparece--47de0bf1","categoria":"ENERGIA","lang":"pt"},{"fonte":"observador.pt","pais":"Portugal","titulo":"Meta lança modelo de IA de código aberto e Zuckerberg escreve manifesto sobre o futuro da tecnologia","resumo":"A Meta oficializou o lançamento do seu mais recente modelo de inteligência artificial com código aberto para desenvolvedores.\nEm um manifesto, Mark Zuckerberg destacou como a abertura tecnológica é essencial para um futuro digital seguro e próspero.\nA iniciativa visa competir com modelos proprietários fechados, incentivando a colaboração global no ecossistema de dados.\nA estratégia posiciona a empresa como defensora da democratização e da inovação contínua no setor de IA.","link":"https://observador.pt/2026/08/10/meta-lanca-modelo-de-ia-de-codigo-aberto-zuckerberg-escreve-manifesto-sobre-futuro-positivo-da-tecnologia/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Tek Notícias","pais":"Portugal","titulo":"Startup criada por estudantes portugueses usa tecnologia para antecipar a detecção de incêndios florestais","resumo":"Estudantes portugueses desenvolveram uma solução tecnológica inovadora focada na prevenção e combate a incêndios na floresta.\nAtravés de sensores avançados e análise de dados em tempo real, o sistema consegue identificar focos de calor precocemente.\nA agilidade na resposta reduz drasticamente o tempo de reação das equipes de emergência e protege áreas de preservação.\nO projeto destaca o potencial da jovem comunidade acadêmica em responder a desafios ambientais e climáticos urgentes.","link":"https://tek.sapo.pt/expert/artigos/startup-criada-por-estudantes-portugueses-usa-tecnologia-para-atencipar-a-detecao-de-incendios-florestais/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Nova tecnologia converte diretamente emissões industriais de CO₂ em combustível sem necessidade de purificação","resumo":"Cientistas desenvolveram um processo revolucionário capaz de transformar o dióxido de carbono da indústria em combustível limpo.\nA grande inovação reside na capacidade de converter o CO₂ diretamente das chaminés, eliminando etapas caras de purificação.\nEssa abordagem reduz significativamente os custos operacionais e torna a captura de carbono economicamente viável.\nA tecnologia surge como uma promissora aliada na transição energética global e na redução do efeito estufa.","link":"https://sapo.pt/artigo/nova-tecnologia-converte-diretamente-emissoes-industriais-de-co-em-combustivel-sem-necessidade-de-purificacao-6a798aae93e2ef39219f387a","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Export-Ready Humanoid Robots: Chinese Manufacturers Dominate 97% of Global Shipments","resumo":"China has solidified its global dominance in the advanced robotics market by accounting for 97% of humanoid robot exports.\nThe breakthrough reflects massive investments in automation and the integration of artificial intelligence into industrial production lines.\nExperts point out that China's leadership could reshape global supply chains and accelerate the adoption of the technology.\nThe feat puts the Asian country at the forefront of the sector, outperforming Western competitors in commercial-scale supply.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/08/10/robos-humanoides-tipo-exportacao-fabricantes-chineses-dominam-97percent-dos-embarques-globais.ghtml","categoria":"ROBOTICS","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Nvidia Partners with Wall Street Giants in $500 Billion Financing Package","resumo":"Nvidia has struck a strategic partnership with major Wall Street financial institutions to structure a multi-billion-dollar financing package.\nThe goal of the operation is to expand the global infrastructure of data centers focused on artificial intelligence processing.\nThe initiative seeks to sustain growing corporate demand for high-performance graphics chips and supercomputing.\nThe move cements the tech giant as the main engine of the AI ecosystem and financial market.","link":"https://oglobo.globo.com/economia/noticia/2026/08/10/nvidia-se-alia-a-gigantes-de-wall-street-em-pacote-de-financiamento-de-us-500-bilhoes-diz-agencia.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Valor Econômico","pais":"Brazil","titulo":"Meta and Other Tech Companies Must Face Lawsuits Over Social Media Addiction, US Court Decides","resumo":"A court in the United States has ruled that Meta and other tech giants will face legal proceedings over the impacts of social media.\nThe lawsuits allege that the platforms were intentionally designed to cause addiction and harm the mental health of young people.\nThe decision sets a historic precedent in the legal accountability of the tech sector regarding the algorithms employed.\nThe outcome could force profound changes in product architecture and global digital safety policies.","link":"https://valor.globo.com/empresas/noticia/2026/08/10/meta-e-outras-empresas-de-tecnologia-devem-responder-por-vicio-em-redes-sociais-decide-tribunal-nos-eua.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"Salaries Up to R$ 53k and a Shortage of Professionals: See the 10 Most Valued Tech Professions","resumo":"The technology sector in Brazil is facing a chronic deficit of qualified talent, significantly driving up compensation in the field.\nRoles in areas such as artificial intelligence, information security, and data engineering offer salaries reaching up to R$ 53,000.\nHigh demand is fueled by the accelerated digital transformation of companies across all segments of the national economy.\nExperts indicate that continuous training and technical specialization remain the primary differentiators in the field.","link":"https://g1.globo.com/trabalho-e-carreira/noticia/2026/08/10/veja-as-10-profissoes-mais-valorizadas-da-tecnologia.ghtml","categoria":"JOB MARKET","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"2027 BYD Song Pro Runs on Ethanol and Electricity in Road Tests in the Interior of São Paulo","resumo":"BYD has begun practical testing of the 2027 Song Pro SUV in the interior of São Paulo using a new flex-hybrid system.\nThe technology combines the Chinese manufacturer's electric powertrain with the use of Brazilian biofuel ethanol.\nThe project aims to adapt the brand's vehicles to the specificities of the domestic market and promote sustainable mobility solutions.\nThe initiative marks an important step toward expanding local production of low-carbon-emission automobiles.","link":"https://www1.folha.uol.com.br/mercado/2026/08/byd-song-pro-2027-roda-com-etanol-e-eletricidade-em-teste-no-interior-paulista.shtml","categoria":"INNOVATION","lang":"en"},{"fonte":"ES Hoje","pais":"Brazil","titulo":"Capixaba Smart Irrigation Technology Cuts Water Consumption in Coffee Plantations by 36%","resumo":"A new smart irrigation technology developed in Espírito Santo has demonstrated high efficiency in local coffee farming.\nThe system uses sensors and algorithms to optimize water resource usage, cutting water consumption by up to 36%.\nIn addition to water savings, the solution helps reduce energy costs and improve the productivity of the crops served.\nThe innovation highlights the role of applied technology in the field to tackle climate challenges and promote sustainability.","link":"https://eshoje.com.br/economia/economia-e-mercado/2026/08/tecnologia-capixaba-de-irrigacao-inteligente-reduz-em-36-o-consumo-de-agua-em-cafezais/","categoria":"AGRITECH","lang":"en"},{"fonte":"Época Negócios","pais":"Brazil","titulo":"Dogs Can Identify Sadness and Fear in Human Faces, Study Suggests","resumo":"A new scientific study has revealed that dogs possess the ability to recognize human facial expressions of sadness and fear.\nThe research analyzed the animals' reactions to visual stimuli, confirming canine sensitivity to their owners' emotions.\nThe findings help us understand the evolution of cooperation and the affective bond built between humans and dogs.\nThe discovery also brings relevant implications for the use of emotional support and therapeutic assistance dogs.","link":"https://epocanegocios.globo.com/google/amp/ciencia-e-saude/noticia/2026/08/cachorros-conseguem-identificar-tristeza-e-medo-no-rosto-humano-sugere-estudo.ghtml","categoria":"SCIENCE","lang":"en"},{"fonte":"brasildefato.com.br","pais":"Brazil","titulo":"From Research to Policy Advocacy in ANPD's Decision: The Facial Recognition Case in Paraná","resumo":"The National Data Protection Authority (ANPD) has made important decisions regarding the use of facial recognition in Paraná schools.\nThe case involved technical analyses on privacy and the processing of sensitive personal data of underage students.\nAcademic research and civil society played a fundamental role in shaping the limits imposed by the regulation.\nThe measure establishes relevant milestones for the ethical use of biometric surveillance technologies in the public sector.","link":"https://www.brasildefato.com.br/colunista/observatorio-da-metropoles-pr/2026/08/10/da-pesquisa-a-incidencia-politica-na-decisao-da-anpd-o-caso-do-reconhecimento-facial-no-parana/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"United States","titulo":"Zuckerberg Pushes 'Superintelligent' AI for Everyone with Meta's New Open-Source Model","resumo":"Meta CEO Mark Zuckerberg has reinforced the company's commitment to developing superintelligent, globally accessible artificial intelligence.\nWith the launch of its latest open-source model, Meta seeks to lead the technological race against proprietary competitors.\nThe initiative aims to democratize access to advanced AI tools, directly impacting developers, businesses, and the global innovation ecosystem.","link":"https://www.theguardian.com/technology/2026/aug/10/mark-zuckerberg-superintelligent-ai-essay-meta","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"United States","titulo":"Lion Nebula Roars to Life with NASA's James Webb Space Telescope","resumo":"NASA's James Webb Space Telescope has captured unprecedented, detailed images of the Lion Nebula, revealing complex stellar structures.\nInfrared observations provide new clues about star formation processes and the dynamics of the interstellar medium.\nThis record broadens our understanding of galactic evolution and highlights the space observatory's unprecedented capability.","link":"https://science.nasa.gov/missions/webb/lion-nebula-roars-to-life-with-nasas-webb/","categoria":"ASTRONOMY","lang":"en"},{"fonte":"NASA (.gov)","pais":"United States","titulo":"NASA Explains the Science Behind the X-59 Aircraft's Sonic Booms","resumo":"NASA detailed the scientific concepts involved in developing the X-59 experimental aircraft, designed to drastically reduce the noise of sonic booms.\nThe technology seeks to transform the sound impact into a gentle thud, enabling supersonic commercial flights over urban terrain.\nThe initiative marks a fundamental breakthrough for the future of aviation and airspace regulation.","link":"https://www.nasa.gov/blogs/quesst/2026/08/10/nasa-x-59-explainer-science-of-sonic-booms/","categoria":"SPACE SCIENCE","lang":"en"},{"fonte":"UC Davis College of Engineering","pais":"United States","titulo":"New AI Health Initiative Connects Computer Science and Medicine","resumo":"A new cross-organizational initiative is integrating advances in artificial intelligence and computer science directly into medical research and patient care.\nThe project aims to accelerate diagnoses, personalize treatments, and optimize the analysis of large volumes of clinical data.\nThe collaboration promises to transform traditional medical practice through cutting-edge technological innovations.","link":"https://engineering.ucdavis.edu/news/new-ai-health-initiative-connects-computer-science-and-medicine","categoria":"HEALTH \u0026 TECHNOLOGY","lang":"en"},{"fonte":"ScienceAlert","pais":"United States","titulo":"Psychopathic Tendencies Are Linked to Microbes Inside Your Body, Study Reveals","resumo":"A new scientific study has identified surprising connections between gut microbiome composition and personality traits such as psychopathic tendencies.\nThe study suggests that bacterial balance can influence neurobiological and behavioral processes more profoundly than previously thought.\nThe discoveries open new pathways for understanding the relationship between physical health and psychiatric disorders.","link":"https://www.sciencealert.com/psychopathic-tendencies-are-linked-to-microbes-inside-your-body-study-reveals","categoria":"SCIENCE","lang":"en"},{"fonte":"utahnewsdispatch.com","pais":"United States","titulo":"With Federal Focus on Quantum Technology, Utah Boosts Its Own Initiatives","resumo":"As the U.S. federal government intensifies its focus on quantum computing and technology, the state of Utah is launching local strategies to establish itself as a hub for the sector.\nThe plan involves academic partnerships, private investments, and incentives for building specialized infrastructure.\nThe move aims to ensure economic competitiveness and scientific advancement in a strategic global market.","link":"https://utahnewsdispatch.com/2026/08/10/utah-pushes-quantum-technology/","categoria":"QUANTUM TECHNOLOGY","lang":"en"},{"fonte":"MIT News","pais":"United States","titulo":"On the Hunt for Dark Matter","resumo":"Scientists and researchers continue to intensify efforts and fundamental physics experiments in an attempt to directly detect dark matter.\nComposed of invisible particles that make up most of the universe's mass, its identification remains one of modern science's greatest mysteries.\nAdvances in these tests could revolutionize cosmological theories and particle physics.","link":"https://news.mit.edu/2026/hunt-dark-matter-jessica-fry-0811","categoria":"PHYSICS","lang":"en"},{"fonte":"Stanford Medicine","pais":"United States","titulo":"Peptides Are Surging: What Does Science Say About This Trend?","resumo":"The use of peptides in health, longevity, and wellness treatments has become an extremely popular topic in today's market.\nA deep dive into the scientific literature evaluates which promises are backed by real evidence and which still lack clinical validation.\nThe study guides consumers and professionals regarding the efficacy and risks associated with these substances.","link":"https://med.stanford.edu/news/insights/2026/08/peptides-what-does-the-science-say.html","categoria":"HEALTH AND SCIENCE","lang":"en"},{"fonte":"Android MT","pais":"France","titulo":"MagSafe vs. Qi2: Two Names for the Same Magnetic Charging Technology","resumo":"Wireless magnetic charging technology has evolved significantly with the market consolidation of the MagSafe and Qi2 standards.\nDespite using different brand names, both solutions share the same technological foundation to optimize energy efficiency.\nThis standardization simplifies consumer choice, ensuring greater compatibility across different smartphone brands.","link":"https://android-mt.ouest-france.fr/news/smartphones-news/magsafe-ou-qi2-deux-noms-pour-une-meme-technologie-de-charge-magnetique/210738/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"senioractu.com","pais":"France","titulo":"According to Science, Belly Fat Doesn't Depend Solely on Diet: New Cells Fabricate It for You","resumo":"New scientific research has revealed that the accumulation of abdominal fat involves cellular mechanisms that go beyond caloric intake.\nThe study identifies the formation of new active cells that manufacture and store adipose tissue directly in the region.\nThe discovery paves promising ways for developing more effective metabolic treatments against obesity.","link":"https://www.senioractu.com/Selon-Science-le-ventre-ne-s-arrondit-pas-que-par-l-assiette-des-cellules-neuves-y-fabriquent-la-graisse-a-votre-place_a27942.html","categoria":"SCIENCE","lang":"en"},{"fonte":"notebookcheck.biz","pais":"France","titulo":"Makerfabs MaTouch ESP32-S3: UWB Technology Enables Sub-Meter Indoor Positioning","resumo":"The new Makerfabs MaTouch device, powered by the ESP32-S3 chip, employs Ultra-Wideband (UWB) technology for high-precision tracking.\nThe innovation achieves a margin of error of less than one meter indoors, overcoming traditional limitations of indoor GPS.\nThe hardware is targeted at developers seeking advanced solutions in home automation, robotics, and IoT.","link":"https://www.notebookcheck.biz/Makerfabs-MaTouch-ESP32-S3-la-technologie-UWB-permet-un-positionnement-interieur-avec-une-precision-inferieure-au-metre.1365172.0.html","categoria":"HARDWARE","lang":"en"},{"fonte":"Times Brasil | CNBC","pais":"France","titulo":"Heatwaves Could Wipe €1 Trillion from Europe's Economy by 2026","resumo":"Recent studies warn of the devastating impact of rising extreme temperatures on European countries in the coming years.\nProjections indicate astronomical economic losses by 2026, driven by drops in productivity and severe damage to infrastructure.\nThe scenario reinforces the urgency of accelerating climate adaptation technologies and sustainability policies across the continent.","link":"https://timesbrasil.com.br/mundo/ondas-de-calor-podem-tirar-180-bilhoes-de-euros-da-europa/","categoria":"CLIMATE AND ECONOMY","lang":"en"},{"fonte":"Goal.com","pais":"France","titulo":"A Spectacular Decision: UEFA Revolutionizes Video Technology in Football","resumo":"UEFA has announced a major overhaul in the application of video-assisted technology systems in its competitions.\nThe new strategy aims to optimize refereeing accuracy and radically reduce stoppage time during matches.\nThe move promises to modernize the pace of the game and set new technological parameters for world sports.","link":"https://www.goal.com/fr/news/une-decision-spectaculaire-l-uefa-revolutionne-la-technologie-de-la-video/bltb92c7048d2b49c7b","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Boursorama","pais":"France","titulo":"Defense Tech Company Lyntris Seeks $2.5 Billion Valuation in Its IPO","resumo":"Defense technology company Lyntris is preparing its initial public offering in the financial market.\nThe goal to reach a $2.5 billion valuation demonstrates strong investor interest in advanced security solutions.\nThe move reflects the accelerated expansion and global valuation of startups focused on security and defense tech.","link":"https://www.boursorama.com/bourse/actualites-amp/lyntris-entreprise-de-technologie-de-defense-vise-une-valorisation-de-2-5-milliards-de-dollars-lors-de-son-introduction-en-bourse-aux-etats-unis-b8f37f15873a10ca41535ea128ec4a47","categoria":"BUSINESS AND TECH","lang":"en"},{"fonte":"Vosges Matin","pais":"France","titulo":"Revolut Obtains Banking License in France: What Changes for the Neobank and Its Customers","resumo":"Fintech firm Revolut has reached a decisive milestone by securing its full banking license to operate in the French market.\nWith the new authorization, the institution will be able to expand its product offerings, including loans and deposit protection.\nThe shift strengthens competition among digital banks in Europe and brings greater legal guarantees to customers.","link":"https://www.vosgesmatin.fr/economie/2026/08/10/revolut-obtient-sa-licence-bancaire-en-france-ce-que-ca-change-pour-la-neobanque-et-ses-clients","categoria":"FINTECH","lang":"en"},{"fonte":"Les Echos","pais":"France","titulo":"Artificial Intelligence: The Role of the 'Forward Deployed Engineer' in Transforming Promising Technologies","resumo":"Demand for the 'Forward Deployed Engineer' profile is growing rapidly in the applied artificial intelligence sector.\nThese engineers act directly as a bridge between complex algorithms and solving practical client problems.\nThe role is essential for accelerating corporate AI adoption and turning theoretical breakthroughs into high-value products.","link":"https://www.lesechos.fr/idees-debats/cercle/ia-trouver-les-profils-capables-de-transformer-une-technologie-prometteuse-en-solution-qui-change-la-donne-le-role-du-forward-deployed-engineer-2246550","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Bernie Sanders Calls on Silicon Valley to 'Pause AI Development' for the Sake of Humanity","resumo":"US Senator Bernie Sanders made a public appeal to major Silicon Valley tech companies to temporarily halt advances in artificial intelligence.\nSanders expressed deep concerns about the social, economic, and labor impacts that uncontrolled automation could inflict on global society.\nThe stance reignites the global debate on the need for ethical regulations and limits to ensure technological progress prioritizes human well-being.","link":"https://www.theguardian.com/technology/2026/aug/10/bernie-sanders-ai-development-pause-letter","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"BBC","pais":"England","titulo":"Facial Recognition to Be Tested on London Underground Stations","resumo":"London's transport network will begin trials of real-time facial recognition technology at subway stations to bolster public safety.\nThe project aims to identify wanted individuals and prevent crimes in high-traffic passenger areas across the UK.\nHowever, the measure sparks intense debate between privacy advocates and authorities over the balance between overt surveillance and civil liberties.","link":"https://www.bbc.com/news/articles/c07r0gvgjxyo","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Liverpool Owner Nears Sale of 30% Stake in Club for £1.35 Billion to Consortium Involving Jeff Bezos","resumo":"The ownership group of Liverpool Football Club is close to finalizing the sale of a 30% minority stake for roughly £1.35 billion.\nThe transaction involves a high-profile investor consortium that includes billionaire Amazon founder Jeff Bezos.\nThe influx of new investment promises to strengthen the club's financial firepower and signals the growing attractiveness of Premier League powerhouses to global tycoons.","link":"https://www.theguardian.com/football/2026/aug/10/liverpool-sale-stake-consortium-jeff-bezos-amazon-fenway-sports-group","categoria":"BUSINESS","lang":"en"},{"fonte":"LANCE!","pais":"England","titulo":"Premier League's Impact on UK Economy Projected to Hit £35 Billion by 2028","resumo":"Economic studies project that the Premier League will generate an impressive financial contribution to the UK's gross domestic product in the coming years.\nThe English football ecosystem drives crucial sectors such as tourism, broadcasting, retail, and the creation of direct and indirect jobs nationwide.\nThis growth reinforces the league's role not only as global sports entertainment, but as a core pillar of the British economy.","link":"https://www.lance.com.br/lance-negocios/impacto-da-premier-league-na-economia-do-reino-unido-deve-atingir-r-227-bilhoes-ate-2028.html","categoria":"ECONOMY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Trump Demands Iran Pay Compensation for Decades of US Soldier Deaths","resumo":"Former US President Donald Trump stated that the Iranian government must financially compensate the United States for the lives of military personnel lost in Middle East conflicts.\nThe harsh declaration intensifies diplomatic tensions and confrontational rhetoric between Washington and Tehran on the international stage.\nThe stance sparks global geopolitical debates over the implications of potential sanctions and financial reparations amid regional instability.","link":"https://www.theguardian.com/world/2026/aug/10/trump-demands-iran-pay-compensation-for-decades-of-us-soldier-deaths","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"larazon.es","pais":"Spain","titulo":"NASA Slows Down PROMISE Rover: One Billion Dollars to Recycle Mars Parts","resumo":"The US space agency has re-evaluated the PROMISE rover mission due to severe budget cuts and the need to optimize resources. The new strategy focuses on repurposing components and technologies developed for previous missions on the red planet. This shift in approach aims to keep essential scientific research on Mars alive without financially compromising NASA's other high-priority projects.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/nasa-frena-rover-promise-mil-millones-reciclar-piezas-marte_202608116a7a4884a046ad6ebcaa5679.html","categoria":"AEROSPACE","lang":"en"},{"fonte":"El HuffPost","pais":"Spain","titulo":"Science Reveals New Secrets of Earth's Interior Thanks to a 'Superdeep' Diamond in a Particle Accelerator","resumo":"Researchers analyzed a tiny superdeep diamond measuring just three millimeters using state-of-the-art particle accelerators. The study made it possible to map rare structures and minerals located in the deepest layers of the Earth's mantle. The findings provide new clues about the composition and geological processes that shape the dynamics of the planet's interior.","link":"https://www.huffingtonpost.es/planeta/la-ciencia-destapa-nuevos-secretos-interior-tierra-gracias-diamante-superprofundo-3-milimetros-acelerador-particulas-f202608.html?outputType=amp","categoria":"SCIENCE","lang":"en"},{"fonte":"EL PAÍS","pais":"Spain","titulo":"When Politicians Read AI-Generated Speeches: The Era of Ventriloquist Technology","resumo":"The growing use of generative artificial intelligence tools by political leaders is drastically changing global public communication. The phenomenon raises debates about authenticity, authorship, and ethical responsibility in government representatives' statements. Experts warn of the risks of a disconnect between automated speeches and actual political intentions.","link":"https://elpais.com/ideas/2026-08-11/cuando-los-politicos-leen-discursos-escritos-con-ia-la-era-de-la-tecnologia-ventrilocua.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Auto Bild España","pais":"Spain","titulo":"This Technology Converts Old Diesel Trucks into Hybrids Without Changing the Engine","resumo":"A new technological solution makes it possible to transform heavy-duty diesel-powered vehicles into hybrid models simply and affordably. The system is installed without the need to modify the truck's original engine, significantly reducing emissions and fuel consumption. The innovation emerges as a viable alternative to accelerate the ecological transition of road transport.","link":"https://www.autobild.es/tecnologia/esta-tecnologia-convierte-antiguos-camiones-diesel-hibridos-sin-tocar-motor_7024415_0.html","categoria":"INNOVATION","lang":"en"},{"fonte":"diariodealmeria.es","pais":"Spain","titulo":"Low-Cost Technology That Promises to Revolutionize Underwater Research Tested in Almería","resumo":"Experts are testing a new low-cost technological equipment aimed at ocean exploration and monitoring off the Spanish coast. The tool makes it possible to collect precise marine data without the need for large budgets or highly specialized vessels. This innovation democratizes access to oceanographic research and promises to boost environmental preservation.","link":"https://www.diariodealmeria.es/almeria/tecnologia-coste-revolucionara-investigacion-submarina_0_2007662245.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Ideal","pais":"Spain","titulo":"'We Managed to Make the Solar Eclipse Audible'","resumo":"Scientists and engineers have developed an innovative device capable of converting variations in sunlight into audible sound frequencies in real time. The technology allows visually impaired people to experience the astronomical phenomenon of a solar eclipse through sound. The initiative stands out as a striking breakthrough in accessibility and inclusive science communication.","link":"https://www.ideal.es/granada/conseguido-eclipse-sol-pueda-oir-20260811194238-nt_amp.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Infobae","pais":"Spain","titulo":"Brain Aging: How the Organ Transforms Over the Years, According to Science","resumo":"Recent scientific studies detail the structural and functional transformations that the human brain undergoes as age advances. The research identifies lifestyle factors and neurological mechanisms that can slow down cognitive decline and protect mental health. Understanding this process is fundamental to developing new therapies and promoting healthy aging.","link":"https://www.infobae.com/generacion-silver/2026/08/11/el-envejecimiento-del-cerebro-como-se-transforma-el-organo-a-medida-que-pasan-los-anos-segun-la-ciencia/","categoria":"NEUROSCIENCE","lang":"en"},{"fonte":"El Periódico de la Energía","pais":"Spain","titulo":"Australia Funds Technology to Refine Lithium More Cleanly and Efficiently","resumo":"The Australian government has announced funding for an innovative technology aimed at the sustainable processing of lithium. The new method aims to significantly reduce water consumption, energy, and harmful chemical reagents in the mineral's production chain. The initiative is crucial to meet the growing demand for batteries and accelerate the transition to clean energy sources.","link":"https://elperiodicodelaenergia.com/australia-financia-una-tecnologia-para-refinar-litio-que-promete-ser-mas-limpia-y-eficiente/","categoria":"ENERGY","lang":"en"},{"fonte":"Radio Oberland","pais":"Germany","titulo":"Lufthansa Airbus A319 Takes Off with 'Shark Skin' Technology","resumo":"Lufthansa has initiated practical tests of a new aerodynamic technology based on shark skin on the Airbus A319 model.\nThis involves a special film applied to the aircraft's fuselage to reduce air resistance and fuel consumption.\nThe initiative aims to validate the efficiency of the bionic coating in daily commercial operations in civil aviation.\nThe innovation promises to accelerate the decarbonization of the fleet and contribute to the aviation sector's sustainable goals.","link":"https://radio-oberland.de/news/2026-08-11-a319-starnberg","categoria":"INNOVATION","lang":"en"},{"fonte":"Bild der Wissenschaft","pais":"Germany","titulo":"Genetically Modified Plants Produce Muscle Meat Protein","resumo":"Researchers have developed transgenic plants capable of synthesizing proteins identical to those found in animal muscle tissue.\nThe molecular agriculture technique uses plants as biofactories to generat
