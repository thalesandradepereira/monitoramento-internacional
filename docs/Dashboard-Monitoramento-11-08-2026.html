e ingredients for the food industry.\nThis innovation emerges as a sustainable alternative to traditional livestock farming to meet global food demand.\nThe breakthrough promises to transform protein production and significantly reduce the sector's environmental impact.","link":"https://wissenschaft.de/artikel/gentech-pflanzen-produzieren-muskelfleisch-protein","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"The Irish Times","pais":"Germany","titulo":"Volkswagen Crisis Reflects Delicate Moment in the German Economy","resumo":"German automaker Volkswagen is facing a severe restructuring with the threat of factory closures in the country.\nThe situation reflects high energy costs, competition from Chinese electric vehicles, and local industrial stagnation.\nThe impasse between labor unions and executives exposes the structural challenges faced by Europe's largest economy.\nThe outcome of this crisis will serve as a thermometer for the automotive sector's innovation capacity and competitiveness.","link":"https://www.irishtimes.com/business/2026/08/11/crisis-stricken-volkswagen-is-emblematic-of-germanys-ailing-economy/","categoria":"BUSINESS","lang":"en"},{"fonte":"WEB.DE","pais":"Germany","titulo":"Trump Cuts Vaccine Recommendations for Children","resumo":"The U.S. government administration has announced a major overhaul of federal childhood immunization guidelines.\nThe measure reduces the number of recommended vaccines in public health schedules for young audiences.\nExperts and medical organizations warn of the risk of a resurgence of preventable diseases and a drop in immunization rates.\nThe debate exposes the growing tension between political governance decisions and global scientific consensus on health.","link":"https://web.de/magazine/politik/videos/trump-kuerzt-impfempfehlungen-kinder-42599084","categoria":"HEALTH","lang":"en"},{"fonte":"ｄメニューニュース","pais":"Germany","titulo":"New Mercedes-AMG GT 53 4-Door Coupe with Over 500 hp Launched in Germany","resumo":"Mercedes-AMG has introduced the new version of the GT 53 4-Door Coupe in Germany, featuring a 3.0-liter inline-six engine.\nThe vehicle delivers over 500 horsepower combined with an advanced all-wheel-drive system and driving dynamics.\nThe model integrates modern acceleration technologies to elevate the performance of the brand's luxury sports lineup.\nThe new release reinforces the company's presence in the high-performance segment and attracts automotive engineering enthusiasts.","link":"https://topics.smt.docomo.ne.jp/amp/article/kurumanews/trend/kurumanews-1096808","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"NDR.de","pais":"Germany","titulo":"'Low-DC' Technology: Hamburg Receives Faster Electric Charging Stations","resumo":"The city of Hamburg has begun installing new electric vehicle charging stations based on 'Low-DC' technology.\nThe system allows for more efficient continuous charging without requiring heavy interventions in the low-voltage electrical grid.\nThis innovation substantially reduces drivers' waiting times and lowers urban infrastructure costs.\nThe pilot project drives sustainable mobility and serves as an expansion model for other European metropolises.","link":"https://www.ndr.de/nachrichten/hamburg/low-dc-technologie-hamburg-bekommt-schnellere-e-ladesaeulen,kurzehh-3994.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"digital terminal","pais":"Japan","titulo":"Kioxia and Sandisk Unveil Market-Leading QLC 3D Flash Memory Technology","resumo":"Kioxia and Sandisk have introduced a new next-generation QLC 3D flash memory technology, setting new standards in density and efficiency for data storage.\nThe breakthrough enables the manufacturing of more compact devices with greater responsiveness for data centers and consumer electronics.\nThis innovation promises to significantly impact the global industry by reducing costs per gigabyte and optimizing energy consumption in high-performance applications.","link":"https://digitalterminal.in/solutions/kioxia-and-sandisk-unveil-industry-leading-qlc-3d-flash-memory-technology","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"TVer","pais":"Japan","titulo":"Nikkei Special: 3D-Printed Houses and Nerves, and the Evolution of Humanoid Robots","resumo":"A special Nikkei program highlighted technological breakthroughs that promise to become commonplace in the near future, including 3D printing of houses and human nerves.\nThe special also addressed the rapid evolution of humanoid robots capable of performing increasingly complex tasks.\nThese innovations demonstrate how the convergence of robotics and biotechnology will transform sectors such as construction, regenerative medicine, and everyday society.","link":"https://tver.jp/episodes/ep1z8lz3l4","categoria":"INNOVATION","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"Monochrome Begins Testing Building-Integrated Perovskite Solar Cells","resumo":"Japanese firm Monochrome has initiated technical testing to integrate perovskite solar cells directly into building materials.\nThe first phase of the project involves field trials in extreme environments conducted in partnership with alpine climber Yudai Suzuki.\nThe initiative aims to validate the technology's durability and efficiency under harsh conditions, driving the adoption of sustainable urban solar energy.","link":"https://prtimes.jp/main/html/rd/p/000000039.000113840.html","categoria":"RENEWABLE ENERGY","lang":"en"},{"fonte":"upi.com","pais":"Japan","titulo":"Samsung and NTT Docomo Validate Customized AI Network Technology","resumo":"Samsung and Japanese telecom operator NTT Docomo have successfully completed the validation of a new customized artificial intelligence-based network technology.\nThe system dynamically adjusts network resources in real time according to the usage patterns and individual needs of each user.\nThis innovation paves the way for the optimization of 5G networks and future 6G infrastructures, improving quality of service and operational efficiency.","link":"https://www.upi.com/Top_News/World-News/2026/08/10/samsung-ntt-docomo/7511786398239/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"凤凰网汽车","pais":"China","titulo":"BYD's Fast-Charging Technology Wins Award in Germany with 400 km Range in 5 Minutes","resumo":"BYD's ultra-fast charging technology has won the prestigious Paul Pietsch Award in Germany, highlighting the advancement of Chinese companies in the electric vehicle sector.\nThe innovative system allows users to add up to 400 kilometers of driving range in just five minutes of charging.\nThis milestone reinforces the automaker's leadership in global electric mobility infrastructure and accelerates the transition to sustainable transport.","link":"https://auto.ifeng.com/c/8vV7DZ9xWQa","categoria":"MOBILITY","lang":"en"},{"fonte":"同济大学新闻网","pais":"China","titulo":"Researchers Reveal New 'Molecular Glue' Mechanism Against Lymphoma in Study Published in Experimental Hematology \u0026 Oncology","resumo":"A team from the School of Life Sciences and Technology has uncovered a new mechanism of action for arsenic trioxide operating as a 'molecular glue.'\nCombining this technique with a century-old heart medication resulted in an innovative, synergistic treatment against lymphoma.\nThe discovery promises to open new therapeutic avenues in the fight against cancer and was detailed in a high-impact scientific publication.","link":"https://news.tongji.edu.cn/info/1003/95313.htm","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Astrophysics Breakthrough: Combined Observations Confirm the Existence of a Universal 'Natural Accelerator'","resumo":"Using a coordinated multi-observatory approach, scientists have confirmed the presence of a natural cosmic particle accelerator deep in space.\nThe discovery marks a milestone for high-energy astrophysics, providing crucial data on the origin of cosmic rays and extreme radiation phenomena.\nSubstantially expanding our understanding of accelerated particle dynamics on a universal scale, the study opens new doors for space research.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569637.shtm","categoria":"ASTROPHYSICS","lang":"en"},{"fonte":"wallstreetcn.com","pais":"China","titulo":"Turning Point in AI Agent Economy: Hourly Cost Surpasses Human Outsourcing with Higher Precision","resumo":"Market analyses indicate a historic milestone in digital automation: the hourly cost of AI agents operating computers is now lower than offshore human outsourcing.\nBeyond the financial benefit, these automated tools exhibit a higher accuracy rate in complex operational tasks.\nThis phenomenon accelerates the restructuring of global business processes and reshapes the future of digital work.","link":"https://wallstreetcn.com/articles/3779129","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"北京大学新闻网","pais":"China","titulo":"Study Published in Science Reveals Ultra-Sensitive LeMaMa Suspended Magnetometer","resumo":"A research team led by Ji Wei from the School of Physics has developed an ultra-sensitive LeMaMa suspended magnetometer for the first time.\nHighlighted in the journal Science, the research represents a major breakthrough in precision magnetic measurement for scientific and technological applications.\nThe instrument promises to advance research in quantum physics, geophysics, and advanced materials science.","link":"https://news.pku.edu.cn/jxky/193e3fb5a02741168a43734457d1a0e0.htm","categoria":"PHYSICS","lang":"en"},{"fonte":"武汉市商务局","pais":"China","titulo":"Peking University Carbon Nanotube Technology Industrialized with Extreme Precision Sensors","resumo":"Carbon nanotube technology developed by Peking University has reached the industrialization phase at the Optics Valley high-tech hub.\nThe new sensor chip created by the team boasts surprising precision, capable of detecting the equivalent of a single grain of salt in an Olympic-sized swimming pool.\nThis innovation promises to revolutionize medical diagnostics, environmental monitoring, and high-end semiconductor manufacturing.","link":"https://sw.wuhan.gov.cn/xwdt/mtbd/202608/t20260811_2832169.shtml","categoria":"NANOTECHNOLOGY","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Artificial Intelligence Optimizes Electrical Stimulation Patterns in Visual Cortex Prosthetics","resumo":"Scientists have applied artificial intelligence algorithms to enhance the electrical stimulation patterns used in visual cortex prosthetics.\nThis optimization allows impulses transmitted to the brain to generate clearer and more precise visual perceptions in patients with severe visual impairments.\nThis advancement represents a decisive step in the convergence of neuroscience, regenerative medicine, and AI engineering.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569628.shtm","categoria":"NEUROTECHNOLOGY","lang":"en"},{"fonte":"财联社","pais":"China","titulo":"UN Experts Warn That AI Advancements Outpace Global Scientific and Regulatory Capacity","resumo":"A panel of United Nations experts has issued an urgent warning stating that the pace of AI development has outstripped current scientific understanding and existing regulations.\nThe report highlights that this oversight gap could pose catastrophic risks to global security, the economy, and social stability.\nThe group advocates for the immediate creation of international governance mechanisms to mitigate emerging threats.","link":"https://www.cls.cn/detail/2414744","categoria":"GOVERNANCE","lang":"en"},{"fonte":"scanx.trade","pais":"India","titulo":"L\u0026T Technology Services Launches AgenticIQ AI Platform for Engineering","resumo":"L\u0026T Technology Services has announced the launch of its new artificial intelligence platform, AgenticIQ, aimed at streamlining engineering processes.\nThe tool seeks to automate complex workflows, accelerating product development and improving corporate operational efficiency.\nWith this innovation, the Indian tech giant strengthens its position in digital transformation and the enterprise deployment of advanced AI solutions.","link":"https://scanx.trade/stock-market-news/technology/l-t-technology-services-launches-agenticiq-ai-platform-for-engineering/47964595","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"GK Today","pais":"India","titulo":"TDB Backs Artificial Intelligence Technology for Cervical Cancer Screening","resumo":"India's Technology Development Board has approved financial support for the development of an AI-driven technology dedicated to cervical cancer screening.\nThe initiative aims to make preventive screenings more accessible and accurate, primarily serving areas with limited medical infrastructure across the country.\nThis solution represents a crucial step for the early diagnosis of the disease, combining technological innovation with positive social impact.","link":"https://www.gktoday.in/tdb-supports-ai-cervical-cancer-screening-technology/","categoria":"HEALTH","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"Health Minister Releases Knowledge Paper on Artificial Intelligence in Medical Technology","resumo":"Indian Health Minister J.P. Nadda has unveiled an official document outlining guidelines and opportunities for the use of artificial intelligence in medicine.\nThe report highlights how AI-based solutions can improve patient care, optimize diagnoses, and modernize the country's healthcare system.\nThe initiative seeks to encourage collaboration among startups, research centers, and hospitals to accelerate the adoption of innovative medical technologies.","link":"https://newsonair.gov.in/health-minister-nadda-releases-knowledge-paper-on-ai-in-medical-technology/","categoria":"HEALTH","lang":"en"},{"fonte":"The Indian Express","pais":"India","titulo":"Targeted Technology and Smart Poles Expected to Boost Delhi's Air Pollution Fight","resumo":"Delhi is betting on the installation of smart poles and targeted technological systems to monitor and combat the region's severe air pollution.\nThese structures will feature advanced sensors for real-time data collection, helping authorities make strategic mitigation decisions.\nThe measure is part of a broader plan to transform urban infrastructure and improve air quality in the capital's hardest-hit areas.","link":"https://indianexpress.com/article/cities/delhi/targeted-technology-smart-poles-expected-to-boost-delhis-air-pollution-fight-10827282/","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"Motorindia","pais":"India","titulo":"Rising Fuel Costs Drive Technology Adoption Among Indian Truckers","resumo":"Ongoing fuel price hikes in India are accelerating digitization and the adoption of fleet management technologies in the road transport sector.\nTruckers and logistics companies are increasingly utilizing routing apps, tracking systems, and telemetry to optimize routes and cut operating expenses.\nThis structural shift is propelling the tech startup ecosystem geared toward transportation, turning an economic challenge into an opportunity for modernization.","link":"https://www.motorindiaonline.in/rising-fuel-costs-are-creating-a-technology-moment-for-indian-truckers/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"whispersinthecorridors.in","pais":"India","titulo":"Transforming Policing in Madhya Pradesh Through Technology","resumo":"The Indian state of Madhya Pradesh is integrating new digital tools and data analytics systems to modernize the operations of its police forces.\nThe initiative includes the use of smart camera monitoring, citizen fast-response apps, and predictive platforms for crime prevention.\nThe modernization aims to increase operational transparency, streamline emergency responses, and bolster public safety across the region.","link":"https://whispersinthecorridors.in/news/transforming-policing-in-madhya-pradesh-through-technology","categoria":"SECURITY","lang":"en"},{"fonte":"The New Indian Express","pais":"India","titulo":"Bhatti Discusses Next-Gen Battery Technology with QuantumScape CEO","resumo":"Telangana Deputy Chief Minister Bhatti Vikramarka met with QuantumScape leaders to discuss partnerships in electric vehicle battery technology.\nThe meeting focused on advancing solid-state batteries, known for offering greater range, faster charging, and higher safety compared to traditional ones.\nThe engagement highlights India's ambition to establish itself as a global hub for manufacturing and innovation in the sustainable mobility sector.","link":"https://www.newindianexpress.com/states/telangana/2026/Aug/11/bhatti-discusses-next-gen-battery-technology-with-quantumscape-ceo-3","categoria":"ENERGY","lang":"en"},{"fonte":"India Today","pais":"India","titulo":"Rahul Gandhi Says Fitness Doesn't Require the Perfect Time, and Science Agrees","resumo":"Politician Rahul Gandhi stated that there is no exact or ideal time to exercise, emphasizing that consistency is the primary factor.\nRecent scientific studies reinforce this view, showing that health benefits depend more on workout regularity than on the chosen time of day.\nThe statement sparked popular discussions in India, drawing public attention to the relevance of healthy habits tailored to individual routines.","link":"https://www.indiatoday.in/health/story/rahul-gandhi-fitness-advice-science-best-time-to-exercise-2967877-2026-08-11","categoria":"SCIENCE","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Mark Zuckerberg Argues That the Greatest Risk of AI Is Control Concentration","resumo":"Meta CEO Mark Zuckerberg warned of the dangers of a few corporations dominating artificial intelligence.\nAccording to the executive, closed access to this technology can create a monopoly detrimental to global development.\nHe defends the open-source model as the ideal solution to democratize innovation and ensure security.\nThe perspective highlights the ethical debate over who should guide technological advancements in the future.","link":"https://jornaleconomico.sapo.pt/noticias/mark-zuckerberg-defende-que-maior-risco-da-ia-e-a-concentracao-do-seu-controlo/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Diário de Notícias","pais":"Portugal","titulo":"From Einstein's Theory to Effects on Nature: The Science Behind the Total Eclipse","resumo":"Total solar eclipses offer unique opportunities for the scientific community to test fundamental theories of physics.\nHistorically, the phenomenon allowed the proof of Albert Einstein's Theory of General Relativity by observing the bending of light.\nFurthermore, the sudden darkness directly affects wildlife behavior, flora, and local atmospheric variations.\nThe study of these events helps to better understand solar dynamics and their interactions with Earth.","link":"https://www.dn.pt/sociedade/da-teoria-de-einstein-aos-efeitos-na-natureza-a-cincia-por-detrs-do-eclipse-total","categoria":"SCIENCE","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"Solar Eclipse: What Happens to Electricity in Portugal When the Sun \"Disappears\"?","resumo":"The passage of a solar eclipse represents a major operational challenge for modern electrical grids.\nWith the rapid decrease in sunlight, photovoltaic energy production experiences a drastic drop within minutes.\nGrid operators in Portugal need to activate backup sources and plan for the stabilization of the electrical system.\nEfficient management ensures that residential and industrial supply is not interrupted during the phenomenon.","link":"https://expresso.pt/podcasts/economia-dia-a-dia/2026-08-10-eclipse-solar-que-acontece-a-eletricidade-em-portugal-quando-o-sol-desaparece--47de0bf1","categoria":"ENERGY","lang":"en"},{"fonte":"observador.pt","pais":"Portugal","titulo":"Meta Launches Open-Source AI Model and Zuckerberg Writes Manifesto on the Future of Technology","resumo":"Meta officially launched its latest open-source artificial intelligence model for developers.\nIn a manifesto, Mark Zuckerberg highlighted how technological openness is essential for a safe and prosperous digital future.\nThe initiative aims to compete with closed proprietary models, encouraging global collaboration within the data ecosystem.\nThe strategy positions the company as an advocate for democratization and continuous innovation in the AI sector.","link":"https://observador.pt/2026/08/10/meta-lanca-modelo-de-ia-de-codigo-aberto-zuckerberg-escreve-manifesto-sobre-futuro-positivo-da-tecnologia/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Tek Notícias","pais":"Portugal","titulo":"Startup Created by Portuguese Students Uses Technology to Anticipate Wildfire Detection","resumo":"Portuguese students have developed an innovative technological solution focused on forest fire prevention and firefighting.\nThrough advanced sensors and real-time data analysis, the system can identify heat spots early on.\nAgility in response drastically reduces the reaction time of emergency teams and protects preservation areas.\nThe project highlights the potential of the young academic community in responding to urgent environmental and climate challenges.","link":"https://tek.sapo.pt/expert/artigos/startup-criada-por-estudantes-portugueses-usa-tecnologia-para-atencipar-a-detecao-de-incendios-florestais/","categoria":"INNOVATION","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"New Technology Directly Converts Industrial CO₂ Emissions into Fuel Without Purification","resumo":"Scientists have developed a revolutionary process capable of transforming industrial carbon dioxide into clean fuel.\nThe major innovation lies in the ability to convert CO₂ directly from smokestacks, eliminating expensive purification steps.\nThis approach significantly reduces operational costs and makes carbon capture economically viable.\nThe technology emerges as a promising ally in the global energy transition and in reducing the greenhouse effect.","link":"https://sapo.pt/artigo/nova-tecnologia-converte-diretamente-emissoes-industriais-de-co-em-combustivel-sem-necessidade-de-purificacao-6a798aae93e2ef39219f387a","categoria":"SUSTAINABILITY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
