ted computing capacity.\nThis initiative solidifies the country at the forefront of applied scientific supercomputing.","link":"https://www.asahi.com/articles/ASV9C0NTKV9CPIHB006M.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"Kioxia spinoff launches next-generation encryption service","resumo":"A new startup born from semiconductor giant Kioxia has announced an innovative encryption service.\nThe technology promises to multiply secure data processing capacity by more than 50 times.\nThe solution addresses the growing demand for maximum security in cloud computing environments.","link":"https://www.nikkei.com/article/DGXZQOUC095T10Z00C26A9000000/","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"KDDI ニュースルーム","pais":"Japan","titulo":"Nissan, Moplus, and KDDI begin communication tests with autonomous vehicles","resumo":"Japanese companies Nissan, Moplus, and KDDI have teamed up to test communication technologies applied to ten autonomous vehicles simultaneously.\nThe project aims to validate the stability and security of real-time data exchange across mobile networks.\nThis is a fundamental step toward the commercialization and expansion of autonomous transportation.","link":"https://newsroom.kddi.com/news/detail/kddi_nr-1159_4712.html","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"Study reveals breakthrough in inner ear disease treatment with needle-free jet injection","resumo":"Researchers have presented promising results in using needle-free jet injection technology to treat inner ear disorders.\nThe innovative method allows for the precise delivery of medication in a non-invasive and minimally painful manner.\nThe discovery paves the way for new therapeutic approaches in otological medicine.","link":"https://prtimes.jp/main/html/rd/p/000000227.000035577.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Reuters","pais":"Japan","titulo":"South Korea expands espionage law to strengthen protection of semiconductor technology","resumo":"The South Korean government has amended penal legislation to expand the scope of espionage crimes and protect its semiconductor industry.\nThe measure aims to combat the leakage of critical industrial secrets to foreign competitors.\nThe new rule reflects rising geopolitical tensions for global technological supremacy.","link":"https://jp.reuters.com/jp/world/china/3Y7HGAAJQBPG5NVEEIVBK5QNPU-2026-09-14/","categoria":"TECHNOLOGY POLICY","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"HERE Technologies introduces AI-powered route optimization technology","resumo":"HERE Technologies unveiled its latest smart routing solutions during IAA Transportation 2026.\nThe platform uses artificial intelligence to optimize routes and reduce logistics costs in the transportation industry.\nThe innovation promises to raise the operational efficiency of commercial fleets globally.","link":"https://news.yahoo.co.jp/articles/637c1d153cf3da39b96f8de6729fa54c77dc2313","categoria":"DIGITAL LOGISTICS","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"North Korean IT technicians use fake identities to infiltrate US companies","resumo":"Reports reveal that North Korean IT professionals are recruiting overseas intermediaries to rig interview processes at US companies.\nInfiltration tactics are becoming increasingly sophisticated to bypass security checks.\nThe funds obtained are diverted to finance internationally sanctioned state programs.","link":"https://news.yahoo.co.jp/expert/articles/a8246631ae57458bc9c6421387618ae72c91a792","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"zennoh.or.jp","pais":"Japan","titulo":"JA Zen-Noh develops joint technology for agricultural crop data capture","resumo":"Agricultural federation JA Zen-Noh and partner Kyuri Tomato Nasubi have created an advanced plant growth data collection system.\nThe technology has officially begun implementation at a protected-environment horticulture research center.\nThe goal is to optimize crop productivity and sustainability in Japan.","link":"https://www.zennoh.or.jp/press/release/2026/110805.html","categoria":"AGRITECH","lang":"en"},{"fonte":"21财经","pais":"China","titulo":"Music export abroad: Chinese platforms and technology show great potential","resumo":"The global expansion of Chinese music is gaining momentum, driven by digital platforms and cutting-edge technological innovations.\nThe integration of advanced tools allows for the efficient distribution of content on an international scale.\nExperts emphasize that Chinese cultural technology holds enormous potential to dominate new markets and influence global trends.","link":"https://m.21jingji.com/article/20260914/herald/16ed0a34ecea2386d1e2b54bbcb8ed67.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"上观新闻","pais":"China","titulo":"Reusable rocket technology advances toward practical implementation; forum debates new integrated paradigm","resumo":"China's reusable rocket technology is transitioning into practical application within aerospace engineering.\nA recent forum brought together experts to discuss the integration of satellites, rockets, and launch bases.\nThe new paradigm seeks to drastically reduce operational costs and accelerate the country's commercial space exploration.","link":"https://www.jfdaily.com.cn/news/detail?id=1176392","categoria":"AEROSPACE","lang":"en"},{"fonte":"Table.Briefings","pais":"China","titulo":"Technology: China turns artificial intelligence into a national security issue","resumo":"The Chinese government has begun treating artificial intelligence as a fundamental pillar of national security.\nThe strategy involves massive investments in the autonomous development of semiconductors and advanced AI models.\nThis approach aims to reduce dependence on Western technologies and consolidate the country's strategic leadership.","link":"https://table.media/china/news/technologie-china-macht-ki-zur-frage-der-nationalen-sicherheit","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"China releases list of the world's leading science and technology periodicals","resumo":"China has released a new official list highlighting the scientific and technological periodicals with the highest global impact.\nThe initiative aims to raise the reputation of domestic academic publications and promote high-level research.\nThe mapping guides researchers to publish discoveries in strategic vehicles to strengthen the sector.","link":"https://portuguese.xinhuanet.com/20260913/cb3a24e563594681a44b002e8cfcbb88/c.html","categoria":"SCIENCE","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Reading guide to this week's articles in Science magazine","resumo":"A guide featuring summaries of the main academic papers published in the most recent edition of Science magazine has been released.\nThe selection covers cutting-edge research across various disciplines, including biotechnology, physics, and environmental sciences.\nThe compilation offers a comprehensive overview of the most relevant discoveries and their impacts on the scientific community.","link":"https://news.sciencenet.cn/htmlnews/2026/9/571375.shtm","categoria":"SCIENCE","lang":"en"},{"fonte":"Bisinfotech","pais":"India","titulo":"INFAC launches 800V battery pack with converter for electric vehicles","resumo":"INFAC has announced the launch of a new 800V battery system with an integrated converter aimed at electric vehicles.\nThe technology promises to increase ultra-fast charging efficiency and optimize power management in modern vehicles.\nWith this new development, the company aims to meet growing global demand for advanced and sustainable automotive components.","link":"https://www.bisinfotech.com/infac-enables-48v-automotive-zonal-architectures-using-vicor-high-density-power-conversion-technology/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Livemint","pais":"India","titulo":"AI bubble or economic revolution? The technology investors may be underestimating","resumo":"The debate over the real value of Artificial Intelligence is gaining traction among global financial market analysts.\nExperts are discussing whether the AI boom represents a bubble about to burst or a long-term productivity revolution.\nThe analysis highlights emerging tech sectors that may be overlooked by traditional investors.","link":"https://www.livemint.com/videos/ai-bubble-or-economic-revolution-the-technology-investors-may-be-underestimating-11789363477310.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"The Hindu","pais":"India","titulo":"Stuck in Mumbai traffic, Gadkari proposes new technologies to replace aging flyovers","resumo":"India's transport minister faced nearly an hour of congestion in Mumbai and advocated for urgent technological solutions.\nHe suggested replacing aging flyovers with prefabricated structures and new high-speed construction methods.\nThe proposal aims to mitigate the urban mobility bottleneck heavily impacting the productivity and economy of India's major metropolises.","link":"https://www.thehindu.com/news/national/maharashtra/gadkari-delayed-by-mumbai-traffic-by-nearly-an-hour-pitches-new-technology-to-replace-ageing-flyovers/article71464408.ece","categoria":"INFRASTRUCTURE","lang":"en"},{"fonte":"EurekAlert!","pais":"India","titulo":"South Korean air purification technology arrives in India's railways to combat fine dust","resumo":"K-Air air purification technology is being deployed across India's railway system to mitigate severe pollution levels.\nThe system focuses on reducing fine dust particles in high-traffic train stations and passenger cars.\nThe initiative represents a major step in integrating advanced technological solutions for public health and environmental quality in the country.","link":"https://www.eurekalert.org/news-releases/1143623","categoria":"INNOVATION","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"India and Vietnam agree to accelerate defense technology sharing and boost maritime ties","resumo":"India and Vietnam have signed a strategic agreement to step up cooperation and technology sharing in the defense sector.\nThe partnership includes bolstering maritime security in the Indo-Pacific region amid rising geopolitical tensions.\nThe breakthrough strengthens India's military industry and establishes new technological transfer alliances in Asia.","link":"https://timesofindia.indiatimes.com/india/india-vietnam-agree-to-accelerate-defence-technology-sharing-boost-maritime-ties/articleshow/134220860.cms","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"Observador","pais":"India","titulo":"Modi warns of the risk of weaponizing technology and critical minerals","resumo":"Indian Prime Minister Narendra Modi issued a global warning regarding the risk of turning technologies and critical minerals into tools of coercion.\nDuring the BRICS summit, he defended the need for secure supply chains and equitable access to strategic resources.\nThe statement reflects India's concern over the monopoly of essential tech inputs required for the global energy transition.","link":"https://observador.pt/2026/09/13/modi-alerta-para-o-risco-do-uso-de-tecnologia-e-de-minerais-criticos/","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"IMF points to India as a global growth engine following 7.8% economic expansion","resumo":"The International Monetary Fund highlighted India as a primary growth driver of the world economy.\nThe recognition followed the country's registration of an expressive 7.8% expansion in the first quarter of the current fiscal year.\nThe performance solidifies India's role as an attractive hub for investments in technology, infrastructure, and innovation.","link":"https://newsonair.gov.in/imf-describes-india-a-key-engine-of-global-growth-after-countrys-economy-expanded-7-8-in-first-quarter-of-current-fiscal/","categoria":"ECONOMY","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"Just a pinch of black pepper can change your body's nutrient absorption: understand the science","resumo":"Scientific research explains how piperine, a compound found in black pepper, drastically increases the bioavailability of nutrients in food.\nStudies show that the substance improves the absorption of vitamins, minerals, and antioxidant compounds like curcumin.\nThe discovery highlights the impact of simple dietary habits on metabolic performance and overall health.","link":"https://timesofindia.indiatimes.com/life-style/food-news/just-a-pinch-of-black-pepper-can-change-what-your-body-gets-from-food-heres-the-science/articleshow/134233542.cms","categoria":"SCIENCE","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Anthropic CEO warns against AI disinformation and calls for government intervention","resumo":"The CEO of Anthropic has issued a public warning regarding the proliferation of false information and exaggerated promises surrounding artificial intelligence.\nHe argues that society and governments need to take active steps to regulate the sector before negative impacts become irreversible.\nThe statement reinforces the global debate on governance, ethical responsibility, and the need for transparency from major tech companies.","link":"https://www.cmjornal.pt/tecnologia/amp/ceo-da-anthropic-denuncia-mentiras-sobre-ia-e-pede-intervencao-de-governos-e-cidadaos","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"Amid calls to regulate AI, Trump criticizes overreach and points to 'negative forces'","resumo":"Amid growing pressures for rigorous regulation of artificial intelligence, Donald Trump has taken a stance against severe measures, classifying control attempts as exaggerated.\nThe former president argued that excessive restrictions could harm technological competitiveness and innovation in the sector.\nHis statements intensify the political debate over the extent to which the state should intervene in the rapid advancement of algorithms and automation.","link":"https://www.publico.pt/2026/09/13/tecnologia/noticia/pedidos-regulacao-ia-trump-fala-exageros-forcas-negativas-2187915?ref=Internet","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Meteored Portugal","pais":"Portugal","titulo":"Science finds new evidence that Venus may have harbored life in the past","resumo":"Researchers have identified new scientific evidence indicating that the planet Venus may have possessed habitable conditions in its distant past.\nData analysis suggests the ancient presence of water and a much milder atmosphere than the extreme environment observed today.\nThe discovery broadens astrobiology's understanding of planetary evolution and drives new space exploration missions in the solar system.","link":"https://www.tempo.pt/noticias/astronomia/la-ciencia-encuentra-nuevas-pruebas-de-que-venus-posiblemente-albergo-vida-en-el-pasado.html","categoria":"SCIENCE","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Google and Abbott partner to boost metabolic health with technology","resumo":"Google and healthcare giant Abbott have joined forces to develop technological solutions aimed at monitoring and improving metabolic health.\nThe initiative combines advanced biometric sensors with artificial intelligence to offer personalized analyses and wellness predictions to users.\nThis alliance reflects the growing trend of major technology companies expanding their footprint in the digital health and preventive medicine market.","link":"https://sapo.pt/artigo/google-e-abbott-apostam-na-saude-metabolica-6aa72d5b5a67d4ba1d13e73a","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Correio do Ribatejo","pais":"Portugal","titulo":"Coruche applies science and technology to transform the future of agriculture","resumo":"The municipality of Coruche has launched an initiative aimed at modernizing the agricultural sector through the integration of data, sensors, and applied field science.\nThe primary goal is to optimize the use of natural resources, increase crop productivity, and face the challenges posed by climate change.\nThe measure positions the region as a hub for agrotechnological innovation and sustainability on the national production landscape.","link":"https://correiodoribatejo.pt/coruche-coloca-ciencia-e-tecnologia-ao-servico-do-futuro-da-agricultura/","categoria":"INNOVATION","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Remanufacturing-X project promises to transform industry through the circular economy","resumo":"The Remanufacturing-X program has been introduced with a proposal to revolutionize manufacturing processes by integrating advanced concepts of the circular economy and sustainable manufacturing.\nThe initiative promotes the large-scale reuse of industrial components and the repurposing of materials with the support of digital technologies.\nExpected impacts include a significant reduction in industrial carbon footprints and increased operational efficiency across the supply chain.","link":"https://sapo.pt/artigo/remanufacturing-x-vai-transformar-a-industria-atraves-da-economia-circular-6aa6af0fcd80d8fcaac479ad","categoria":"INDUSTRY","lang":"en"},{"fonte":"vozportucalense.pt","pais":"Portugal","titulo":"UCP debates 'Digital Ecology' to consider the future of technology beyond artificial intelligence","resumo":"The Catholic University of Portugal hosted a discussion on the concept of 'Digital Ecology', proposing a critical analysis of technological impact beyond the artificial intelligence craze.\nThe debate advocates for ethical and humanistic development, integrating environmental and social concerns into the advancement of digital tools.\nThe reflection highlights the importance of building a sustainable technological ecosystem focused on real human needs.","link":"https://www.vozportucalense.pt/2026/09/13/ucp-ecologia-digital-pensar-a-tecnologia-para-la-da-ia/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"O Vilaverdense","pais":"Portugal","titulo":"Vila Verde launches European project focused on innovation and the circular economy","resumo":"The municipality of Vila Verde was chosen for the launch of a European project aimed at sustainable development and circular economy innovation.\nThe action brings together experts and resources to implement sustainable practices in local waste management and energy efficiency.\nThe project serves as a replicable model for other regions in Europe interested in transitioning to low-environmental-impact economic models.","link":"https://ovilaverdense.pt/vila-verde-recebe-arranque-de-projeto-europeu-de-inovacao-e-economia-circular/","categoria":"SUSTAINABILITY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
