  // Injeta os dados originais no frontend
  const data = [{"fonte":"seudinheiro.com","pais":"Brasil","titulo":"Dona do ChatGPT descarta IPO para este ano e executivos alertam sobre desaceleração da IA","resumo":"A empresa responsável pelo ChatGPT sinalizou que não pretende abrir seu capital no mercado financeiro no momento atual.\nParalelamente, executivos do setor de tecnologia começam a alertar sobre um possível freio no ritmo acelerado de avanços em inteligência artificial.\nO movimento reflete tanto os crescentes custos operacionais quanto debates sobre limites de infraestrutura e regulamentação.","link":"https://www.seudinheiro.com/2026/economia/dona-do-chatgpt-descarta-ipo-neste-ano-e-executivos-fazem-alerta-sobre-ia-havera-um-freio-na-tecnologia-giov/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Época Negócios","pais":"Brasil","titulo":"Dario Amodei afirma que indústria de IA mentiu sobre os reais riscos da tecnologia","resumo":"O CEO da Anthropic declarou publicamente que grandes empresas de tecnologia ocultaram ou minimizaram os perigos do avanço desenfreado da inteligência artificial.\nAs declarações acendem um novo alerta global sobre a urgência de transparência na criação de modelos generativos avançados.\nO debate ganha força no momento em que governos e órgãos internacionais discutem marcos regulatórios mais severos.","link":"https://epocanegocios.globo.com/inteligencia-artificial/noticia/2026/09/dario-amodei-diz-que-industria-de-ia-mentiu-sobre-riscos-da-tecnologia.ghtml","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"Canal Rural","pais":"Brasil","titulo":"Cidade paulista é oficializada Capital Nacional da Tecnologia com alta densidade de cientistas","resumo":"Uma nova lei federal concedeu ao município paulista o título de Capital Nacional da Tecnologia devido à sua expressiva densidade acadêmica.\nA cidade destaca-se no cenário nacional por abrigar a proporção de um doutor para cada 100 habitantes, impulsionada por universidades e centros de pesquisa.\nO reconhecimento projeta a região como polo estratégico para inovação, atração de startups e investimentos científicos no Brasil.","link":"https://www.canalrural.com.br/alem-do-agro/2026/09/13/a-cidade-paulista-que-virou-capital-nacional-da-tecnologia-por-lei-federal-concentra-tantos-cientistas-que-tem-um-doutor-para-cada-100-moradores/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Disparada no preço do petróleo reaviva o interesse global por hidrogênio limpo","resumo":"A recente valorização nas cotações do petróleo no mercado internacional acelerou a busca por alternativas energéticas sustentáveis.\nO hidrogênio limpo volta ao centro das atenções de governos e grandes investidores como solução viável para a transição energética.\nNovas pesquisas e aportes na área ganham urgência estratégica para diminuir a dependência de combustíveis fósseis.","link":"https://www1.folha.uol.com.br/mercado/2026/09/disparada-no-preco-do-petroleo-reaviva-interesse-por-hidrogenio-limpo.shtml","categoria":"ENERGIA LIMPA","lang":"pt"},{"fonte":"revistaoeste.com","pais":"Brasil","titulo":"Nova tecnologia construtiva permite erguer estrutura de residência em 48 horas","resumo":"Um método construtivo inovador promete erguer a estrutura completa de uma casa de 120 metros quadrados em apenas dois dias.\nSuperando o modelo tradicional de tijolos e técnicas comuns de construção a seco, o sistema otimiza o tempo de obra e reduz desperdícios.\nA inovação promete impactar a eficiência do setor imobiliário e baratear custos operacionais na civil.","link":"https://revistaoeste.com/oestegeral/2026/09/13/nem-construcao-a-seco-nem-tijolo-a-nova-tecnologia-para-levantar-a-estrutura-de-uma-casa-de-120-m2-em-48-horas/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Rei Charles reúne líderes de tecnologia em meio a apelos por desaceleração da IA","resumo":"O monarca britânico convidou os principais executivos de tecnologia do mundo para debater o avanço acelerado da inteligência artificial.\nA reunião ocorre em resposta aos crescentes apelos por uma pausa no desenvolvimento de novos modelos até que existam diretrizes seguras.\nO encontro busca alinhar o progresso tecnológico com princípios éticos e a preservação da segurança global.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/13/rei-charles-reunira-lideres-de-empresas-de-ia-em-meio-a-apelos-por-desaceleracao-da-tecnologia.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"IT Forum","pais":"Brasil","titulo":"Dia do Programador: Inteligência artificial eleva régua de exigência para dev juniores","resumo":"No Dia do Programador, analistas apontam que a popularização de ferramentas de IA alterou as exigências para entrada no mercado de trabalho.\nEmbora as contratações continuem ativas, o nível de conhecimento técnico e capacidade analítica cobrado dos iniciantes subiu significativamente.\nDesenvolvedores juniores agora precisam dominar o uso de IA como ferramenta de produtividade para manterem a competitividade.","link":"https://itforum.com.br/noticias/ia-programadores-juniores-mercado/","categoria":"MERCADO TECH","lang":"pt"},{"fonte":"Jornal da USP","pais":"Brasil","titulo":"Pesquisa científica avalia impacto do mindfulness no combate à compulsão alimentar","resumo":"Um estudo acadêmico recente analisou como a prática de atenção plena pode auxiliar no controle de episódios de compulsão alimentar.\nOs resultados preliminares indicam redução do estresse e maior conscientização emocional durante as refeições dos voluntários.\nA investigação abre novos caminhos para tratamentos integrativos na área de saúde mental e nutrição.","link":"https://jornal.usp.br/podcast/curioso-por-ciencia-125-pesquisa-avalia-pratica-de-atencao-plena-contra-sintomas-de-compulsao-alimentar/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ビジネス+IT","pais":"Estados Unidos","titulo":"Anthropic prevê impacto da IA na economia dos EUA até 2030, com perda de 17,9% dos empregos de conhecimento","resumo":"Um novo estudo divulgado pela Anthropic aponta transformações profundas na economia norte-americana impulsionadas pela inteligência artificial até o ano de 2030. A projeção indica que aproximadamente 17,9% dos trabalhos intelectuais correm o risco de ser automatizados. O relatório destaca a urgência de políticas públicas para mitigar impactos no mercado de trabalho e na distribuição de renda. Essa análise reforça os debates sobre o ritmo acelerado de avanço da tecnologia e seus reflexos sociais.","link":"https://www.sbbit.jp/article/cont1/186935","categoria":"ECONOMIA E IA","lang":"pt"},{"fonte":"Science Daily","pais":"Estados Unidos","titulo":"Cientistas apoiados pela NASA transformam lixo plástico em biscoitos comestíveis","resumo":"Pesquisadores financiados pela NASA desenvolveram um processo inovador capaz de converter resíduos plásticos em alimentos próprios para consumo humano. A tecnologia utiliza processos biológicos e químicos para quebrar polímeros e transformá-los em nutrientes no formato de biscoitos. A inovação promete ajudar tanto no gerenciamento do lixo na Terra quanto no abastecimento de missões espaciais de longa duração. Esse avanço representa um passo promissor para a sustentabilidade e a exploração espacial.","link":"https://www.sciencedaily.com/releases/2026/09/260912220033.htm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Guardian","pais":"Estados Unidos","titulo":"Chefe da OpenAI e Elon Musk apoiam chamados para desacelerar desenvolvimento 'inconsequente' da IA","resumo":"Líderes proeminentes do setor de tecnologia, incluindo o chefe da OpenAI e o empresário Elon Musk, apoiaram chamados por cautela na evolução da inteligência artificial. O movimento alerta para os riscos de um desenvolvimento desenfreado e sem regulamentação adequada sobre a sociedade. As declarações aumentam a pressão sobre órgãos reguladores para estabelecer limites éticos e de segurança computacional estritos. O debate coloca em evidência a tensão entre a corrida pela inovação e a proteção humana.","link":"https://www.theguardian.com/technology/2026/sep/13/openai-sam-altman-elon-musk-back-anthropic-calls-brakes-ai-development","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Washington Post","pais":"Estados Unidos","titulo":"Trump resiste à desaceleração da IA à medida que o cenário político muda","resumo":"O ex-presidente Donald Trump posicionou-se contra a desaceleração do desenvolvimento de inteligência artificial nos Estados Unidos. Defensores dessa postura argumentam que frear a tecnologia pode prejudicar a competitividade americana frente a rivais globais como a China. O posicionamento sinaliza uma divisão marcante no debate regulatório entre segurança tecnológica e liderança econômica. A questão tornou-se um dos tópicos mais centrais das discussões políticas atuais no país.","link":"https://www.washingtonpost.com/politics/2026/09/13/trump-rejects-calls-so-slow-ai-development-citing-chinese-competition/","categoria":"POLÍTICA TECH","lang":"pt"},{"fonte":"Correio da Manhã","pais":"Estados Unidos","titulo":"Líder da Câmara dos Representantes dos EUA opõe-se à desaceleração do desenvolvimento de IA","resumo":"O líder da Câmara dos Representantes dos Estados Unidos declarou oposição formal às propostas que buscam pausar os avanços em inteligência artificial. A liderança legislativa enfatiza a necessidade de manter a supremacia tecnológica e econômica do país no cenário internacional. O posicionamento reflete a preocupação de que restrições severas possam atrasar a inovação em setores altamente estratégicos. A decisão impulsiona debates calorosos sobre regulamentação versus competitividade no Congresso.","link":"https://www.cmjornal.pt/tecnologia/detalhe/lider-da-camara-dos-representantes-do-eua-contra-abrandar-desenvolvimento-ia","categoria":"POLÍTICA TECH","lang":"pt"},{"fonte":"cnn.com","pais":"Estados Unidos","titulo":"Ponto de virada decisivo para a humanidade e a IA pode redefinir a política americana","resumo":"O avanço acelerado da inteligência artificial atinge um momento crucial que promete redefinir o cenário político e social dos Estados Unidos. Analistas apontam que a tecnologia está moldando novas prioridades legislativas, debates eleitorais e estratégias de segurança nacional. As decisões tomadas agora sobre a governança de algoritmos avançados terão repercussões de longo prazo nas instituições. O momento é visto por especialistas como um divisor de águas na relação entre tecnologia e sociedade.","link":"https://www.cnn.com/2026/09/14/politics/trump-ai-warning-sacks-coxon-anthropic","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"ixbt.games","pais":"Estados Unidos","titulo":"Kingdom Come: Deliverance II com DLSS 5 alcança visual idealizado por Daniel Vavra e diretor defende a tecnologia","resumo":"O jogo Kingdom Come: Deliverance II utilizará a tecnologia DLSS 5 para atingir o nível gráfico e de desempenho originalmente concebido por seu criador. O diretor Daniel Vavra passou a defender ativamente o uso de técnicas de renderização por inteligência artificial no desenvolvimento de jogos. A novidade destaca como os recursos gráficos de ponta estão transformando a produção e a fidelidade visual dos games modernos. A implementação estabelece novos padrões técnicos para lançamentos futuros no setor.","link":"https://ixbt.games/es/news/2026/09/14/435566-kingdom-come-deliverance-ii-blagodaria-dlss-5-stala-vygliadet-tak-kak-predstavlial-daniel-vavra-teper-on-aktivno-zashhishhaet-texnologiiu.html","categoria":"GAMES","lang":"pt"},{"fonte":"BFM","pais":"Estados Unidos","titulo":"A IA no centro da política americana","resumo":"A inteligência artificial assumiu um papel central nas pautas políticas e nas estratégias de governança dos Estados Unidos. O tema abrange desde a competição geopolítica global até preocupações com segurança cibernética e impacto no mercado de trabalho. Legisladores e líderes partidários buscam criar diretrizes que equilibrem o incentivo à inovação com a proteção dos cidadãos. O debate reflete a crescente influência dos avanços tecnológicos na soberania e no futuro econômico do país.","link":"https://www.bfmtv.com/economie/video-l-ia-au-c-ur-de-la-politique-americaine_VN-202609140120.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Le Dauphiné Libéré","pais":"França","titulo":"Proibição de redes sociais para menores de 15 anos: França submete nova versão à UE","resumo":"A França apresentou uma nova proposta à União Europeia para proibir o acesso de menores de 15 anos às redes sociais sem autorização dos pais.\nA medida visa proteger os jovens de riscos digitais, como a exposição a conteúdos inadequados e o vício em telas.\nCaso seja aprovada pelo bloco europeu, a legislação pode estabelecer um importante precedente para a regulamentação de plataformas digitais em todo o continente.","link":"https://www.ledauphine.com/politique/2026/09/14/interdiction-des-reseaux-sociaux-aux-moins-de-15-ans-la-france-soumet-une-nouvelle-version-a-l-ue","categoria":"REGULAMENTAÇÃO","lang":"pt"},{"fonte":"ladepeche.fr","pais":"França","titulo":"Nós devemos investir massivamente em tecnologia para evitar o rebaixamento global, diz Jean Tirole","resumo":"O prêmio Nobel de Economia Jean Tirole alertou sobre a urgência de a Europa aumentar significativamente os investimentos no setor de tecnologia.\nSegundo o economista, a falta de financiamento em inovação coloca o continente em risco de ficar para trás em relação às potências globais como Estados Unidos e China.\nO alerta destaca a necessidade de políticas públicas fortes para impulsionar ecossistemas de startups e pesquisa científica.","link":"https://www.ladepeche.fr/2026/09/14/entretien-nous-devons-investir-massivement-dans-la-tech-pour-eviter-le-declassement-mondial-selon-jean-tirole-prix-nobel-deconomie-13546803.php","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"mistral.ai","pais":"França","titulo":"Tornando a IA soberana e de pesos abertos a nova fronteira tecnológica","resumo":"O avanço da inteligência artificial de código e pesos abertos ganha força como uma alternativa estratégica para garantir a soberania tecnológica de nações e empresas.\nO modelo busca reduzir a dependência de poucas grandes corporações proprietárias de tecnologia, promovendo maior transparência e segurança.\nA iniciativa posiciona a infraestrutura aberta como um pilar fundamental para a próxima fase da inovação em IA.","link":"https://mistral.ai/news/mistral-makes-sovereign-open-weight-ai-to-frontier/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"L'Express","pais":"França","titulo":"Dos EUA à Europa, ataques cada vez mais preocupantes à ciência: o alerta do Prof. Alain Fischer","resumo":"O renomado imunologista Alain Fischer fez um duro alerta sobre a crescente onda de desinformação e ataques às instituições científicas no Ocidente.\nDe cortes orçamentários a narrativas negacionistas, a pressão sobre pesquisadores e médicos atinge níveis alarmantes na Europa e nos EUA.\nO especialista enfatiza a necessidade premente de defender a integridade científica e reestabelecer a confiança pública na medicina.","link":"https://www.lexpress.fr/sciences-sante/des-etats-unis-a-leurope-des-attaques-contre-la-science-toujours-plus-inquietantes-lalerte-du-pr-TTNK7U2TJ5GRBOW6OJBGGCF24Y/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Zonebourse","pais":"França","titulo":"DroneShield colabora com a AIM Defence para integrar tecnologia laser de alta potência na defesa contra drones","resumo":"A DroneShield anunciou uma parceria com a AIM Defence para incorporar sistemas de laser de alta potência em suas soluções de combate a veículos aéreos não tripulados.\nA integração visa aumentar a precisão e a eficiência na neutralização de ameaças aéreas em cenários militares e civis.\nA iniciativa reforça a corrida por tecnologias avançadas de segurança e defesa contra a proliferação de drones.","link":"https://www.zonebourse.com/actualite-bourse/droneshield-collabore-avec-aim-defence-pour-integrer-la-technologie-laser-de-haute-puissance-a-son-e-ce785bdcd88af323","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Contexte","pais":"França","titulo":"Orçamento: Créditos vinculados à tecnologia são afetados por medidas de economia do governo","resumo":"O plano de contenção de gastos do governo francês atingiu diretamente programas e incentivos voltados ao setor de tecnologia.\nA redução de verbas orçamentárias gera forte preocupação entre empresários e pesquisadores sobre o ritmo da inovação no país.\nDiante de um cenário global competitivo, os cortes colocam em xeque o financiamento de iniciativas estratégicas da transição digital francesa.","link":"https://www.contexte.com/fr/actualite/tech/des-credits-lies-a-la-tech-touches-par-les-mesures-deconomie-du-gouvernement_277126","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Jornal O Sul","pais":"França","titulo":"EUA geram incerteza: Bancos centrais da França e Holanda retiram reservas de ouro do país","resumo":"Em um movimento estratégico que reflete a crescente desconfiança no cenário econômico norte-americano, os bancos centrais da França e da Holanda repatriaram suas reservas de ouro armazenadas nos EUA.\nA decisão sinaliza uma mudança na gestão de riscos das grandes instituições financeiras europeias diante de instabilidades fiscais globais.\nO evento destaca a busca por maior soberania e proteção patrimonial em tempos de incerteza geopolítica.","link":"https://www.osul.com.br/antes-porto-seguro-da-economia-global-estados-unidos-agora-geram-incerteza-bancos-centrais-de-franca-e-holanda-retiraram-suas-reservas-de-ouro-do-pais/amp/","categoria":"ECONOMIA","lang":"pt"},{"fonte":"blogdumoderateur.com","pais":"França","titulo":"5 cursos para aprender ciência de dados e inteligência artificial","resumo":"A crescente demanda por profissionais qualificados no mercado de tecnologia impulsionou a busca por capacitação em análise de dados e IA.\nUma seleção de cinco formações em alta destaca as principais habilidades exigidas por empresas para atuação na área.\nO movimento reflete como a educação técnica tornou-se um pilar fundamental para suprir a escassez de talentos no ecossistema digital.","link":"https://www.blogdumoderateur.com/selection-formation-data-scientist-318/","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"Water Magazine","pais":"Inglaterra","titulo":"Empresa de tecnologia de Oxford recebe £ 100 mil para transformar o monitoramento de poluição de rios em tempo real","resumo":"Uma empresa de tecnologia sediada em Oxford foi contemplada com um financiamento de £ 100.000 para desenvolver soluções avançadas de monitoramento da poluição fluvial em tempo real. A iniciativa busca transformar a forma como contaminantes em rios são identificados e geridos, permitindo respostas mais rápidas de órgãos ambientais. O projeto representa um avanço significativo na aplicação de inovação tecnológica para a preservação ecológica do Reino Unido.","link":"https://www.watermagazine.co.uk/2026/09/14/oxford-technology-company-awarded-100000-to-transform-real-time-river-pollution-monitoring/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"El Economista","pais":"Inglaterra","titulo":"Telefónica cria fundo no Reino Unido para reutilizar tecnologia","resumo":"A Telefónica anunciou a criação de um novo fundo no Reino Unido focado em impulsionar a reutilização e a reciclagem de dispositivos tecnológicos. O objetivo da iniciativa é promover a economia circular, reduzindo o lixo eletrônico gerado pelo setor de telecomunicações. A estratégia busca mitigar o impacto ambiental das tecnologias obsoletas e incentivar soluções sustentáveis na indústria tech.","link":"https://www.eleconomista.es/seleccion-ee/noticias/14013303/09/26/telefonica-crea-un-fondo-en-el-reino-unido-para-reutilizar-la-tecnologia.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Comitê parlamentar exige projeto de lei para combater ameaças da IA aos direitos humanos","resumo":"Um comitê parlamentar solicitou a elaboração urgente de um projeto de lei para conter as ameaças que a Inteligência Artificial pode trazer aos direitos humanos. A iniciativa visa estabelecer diretrizes claras e regulamentações éticas para o desenvolvimento e uso de sistemas algorítmicos. Parlamentares destacam que o avanço tecnológico acelerado exige salvaguardas rigorosas para proteger a privacidade e a segurança dos cidadãos.","link":"https://www.bbc.com/news/articles/cwyzvgj70y4o","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Pesquisadores esperam que novo microscópio potente revele a causa raiz de doença intestinal incurável","resumo":"Pesquisadores estão apostando em um novo e poderoso microscópio para tentar descobrir a causa primária de uma doença intestinal atualmente incurável. A tecnologia permite examinar detalhes celulares em resoluções inéditas, auxiliando na compreensão dos mecanismos da enfermidade. Espera-se que esses avanços científicos abram caminhos para a criação de tratamentos inovadores e mais eficazes para os pacientes.","link":"https://www.theguardian.com/society/2026/sep/14/new-microscope-discovery-hopes-incurable-inflammatory-bowel-disease-crohns-science-treatment","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Financial Times","pais":"Inglaterra","titulo":"Startup holandesa conclui rodada de financiamento para tecnologia de silício criptografado","resumo":"Uma startup holandesa finalizou uma captação de recursos para impulsionar a produção de sua tecnologia de silício criptografado. O avanço busca garantir proteção em nível de hardware contra vulnerabilidades cibernéticas e tentativas de espionagem. Com o novo aporte, a empresa pretende acelerar a fabricação e distribuição global de seus chips altamente seguros.","link":"https://www.ft.com/content/a6574d9d-5e75-4b9c-b4d7-b05f7008e48e?syn-25a6b1a6=1","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"El Periódico","pais":"Espanha","titulo":"Tesla entra na mira das autoridades por motoristas que dormem ao volante com o carro em movimento","resumo":"A funcionalidade de condução autônoma da Tesla está enfrentando forte escrutínio devido ao aumento de relatos de motoristas adormecidos enquanto os veículos continuam rodando.\nO debate levanta alertas urgentes sobre os limites de segurança dos sistemas de assistência ao condutor em vias públicas.\nReguladores e especialistas em tecnologia exigem medidas mais rígidas para monitorar a atenção de quem está ao volante.","link":"https://www.elperiodico.com/es/motor/20260914/tesla-punto-mira-conductores-duermen-134178701","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"El Economista","pais":"Espanha","titulo":"Atlantic Copper inaugura fábrica de economia circular em Huelva para recuperar 60 mil toneladas de metais por ano","resumo":"A Atlantic Copper estreou uma nova instalação focada em reciclagem avançada e economia circular na região de Huelva.\nO projeto foi projetado para recuperar cerca de 60 mil toneladas de metais valiosos anualmente a partir de resíduos eletrônicos e industriais.\nA iniciativa representa um avanço expressivo para a sustentabilidade e a independência de matérias-primas na Europa.","link":"https://www.eleconomista.es/industria/noticias/14013635/09/26/atlantic-copper-estrena-en-huelva-su-planta-de-economia-circular-para-recuperar-60000-toneladas-de-metales-al-ano.html","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"El Periódico de la Energía","pais":"Espanha","titulo":"Dacia expande tecnologia híbrida para toda a sua linha com dois novos motores fabricados na Espanha","resumo":"A montadora Dacia anunciou a ampliação da tecnologia de propulsão híbrida em toda a sua gama de veículos comerciais e de passeio.\nO movimento conta com o desenvolvimento de dois novos motores produzidos diretamente em solo espanhol.\nA estratégia visa acelerar a transição ecológica da marca oferecendo opções eletrificadas mais acessíveis ao mercado europeu.","link":"https://elperiodicodelaenergia.com/dacia-extiende-la-tecnologia-hibrida-a-toda-su-gama-con-dos-nuevos-motores-made-in-spain","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"MARCA","pais":"Espanha","titulo":"Inteligência Artificial transforma a economia e pode se tornar um fator de produção independente","resumo":"Especialistas apontam que a Inteligência Artificial está remodelando os pilares econômicos tradicionais ao redor do mundo.\nEm vez de ser apenas um instrumento de produtividade, a IA caminha para ser reconhecida como um fator de produção autônomo, ao lado de capital e trabalho.\nEssa mudança conceitual promete alterar a dinâmica global de mercados, empregos e investimentos nos próximos anos.","link":"https://www.marca.com/tiramillas/economia/2026/09/14/inteligencia-artificial-cambia-completo-forma-entender-economia-podria-pasar-factor-produccion-independiente.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Diario de Mallorca","pais":"Espanha","titulo":"Médico usa inteligência artificial no combate à sepse: \"Tecnologia que vê o que um médico não vê\"","resumo":"O doutor Marcio Borges desenvolveu uma ferramenta de inteligência artificial voltada ao diagnóstico precoce de quadros graves de sepse.\nA tecnologia analisa grandes volumes de dados clínicos para identificar sinais sutis e invisíveis a olho nu antes do agravamento do paciente.\nO avanço promete salvar centenas de vidas ao acelerar tratamentos críticos em unidades de terapia intensiva.","link":"https://www.diariodemallorca.es/mallorca/2026/09/14/marcio-borges-doctor-son-llatzer-134247630.html","categoria":"SAÚDE E TECNOLOGIA","lang":"pt"},{"fonte":"moncloa.com","pais":"Espanha","titulo":"Tecnologia espanhola no flanco leste da OTAN: Polônia confia sua inteligência militar à GMV","resumo":"A empresa de tecnologia espanhola GMV foi selecionada pela Polônia para fornecer soluções de inteligência militar destinadas à OTAN.\nO acordo envolve o fornecimento de sistemas avançados de processamento de dados e sensoriamento estratégico no flanco leste europeu.\nA parceria consolida o papel de destaque da indústria tecnológica de defesa da Espanha no cenário internacional.","link":"https://www.moncloa.com/2026/09/14/inteligencia-otan-gmv-3429842/","categoria":"DEFESA E TECNOLOGIA","lang":"pt"},{"fonte":"3DJuegos","pais":"Espanha","titulo":"Remake de Zelda Ocarina of Time rodará com fluidez no Nintendo Switch 2, mas sem grande tecnologia aguardada","resumo":"Especialistas em jogos confirmam que uma versão atualizada do clássico Zelda Ocarina of Time apresentará alto desempenho no novo console da Nintendo.\nNo entanto, a comunidade lamenta a ausência de uma tecnologia gráfica de ponta esperada para esta nova geração.\nO dilema reacende discussões sobre o equilíbrio entre nostalgia, otimização e poder de processamento gráfico nos videogames.","link":"https://www.3djuegos.com/juegos/the-legend-of-zelda-ocarina-of-time/noticias/expertos-coinciden-remake-zelda-ocarina-of-time-ira-muy-fluido-nintendo-switch-2-lamentan-ausencia-gran-tecnologia","categoria":"GAMES","lang":"pt"},{"fonte":"EL PAÍS","pais":"Espanha","titulo":"Elite da matemática teme perda de sentido da disciplina diante dos avanços da inteligência artificial","resumo":"Matemáticos renomados expressam crescente preocupação com o impacto das novas ferramentas de inteligência artificial no desenvolvimento acadêmico.\nCom algoritmos demonstrando teoremas complexos em segundos, surge o receio de que a intuição humana perca espaço.\nO debate questiona o futuro da investigação científica pura e o papel do conhecimento teórico em um mundo automatizado.","link":"https://elpais.com/ciencia/2026-09-13/la-elite-de-las-matematicas-alerta-del-riesgo-de-que-los-avances-de-la-ia-las-vacie-de-sentido.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"BR","pais":"Alemanha","titulo":"Eletrodos no Cérebro: Homem Paralisado Volta a Sentir o Toque","resumo":"Cientistas avançaram significativamente no campo das neuropróteses ao implantar eletrodos diretamente no cérebro de um paciente paralisado.\nEssa tecnologia permitiu restaurar a sensação do toque, conectando sinais sensoriais artificiais ao sistema nervoso central.\nO avanço representa um marco para a medicina regenerativa e neurotecnologia, oferecendo novas esperanças para a reabilitação de pessoas com lesões graves na medula espinhal.","link":"https://www.br.de/radio/bayern2/sendungen/iq-wissenschaft-und-forschung/elektroden-im-kopf-gelaehmter-kann-wieder-fuehlen-100.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Estratégia de IA para a Europa: Alemanha, França e Holanda Lideram Nova Aliança","resumo":"Alemanha, França e Holanda estão unindo forças para liderar uma nova aliança europeia focada no desenvolvimento e regulamentação da inteligência artificial.\nA iniciativa visa fortalecer a soberania tecnológica do continente frente à concorrência global de grandes potências como Estados Unidos e China.\nO plano inclui investimentos em infraestrutura de supercomputação, modelos de linguagem próprios e políticas para acelerar a inovação responsável na região.","link":"https://www.sueddeutsche.de/wirtschaft/ki-strategie-europa-deutschland-rechenzentren-li.3545883","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"朝日新聞","pais":"Japão","titulo":"Supercomputadores e IA impulsionam inovação na pesquisa científica com integração ao Fugaku","resumo":"A integração entre inteligência artificial e o supercomputador Fugaku promete revolucionar a pesquisa científica no Japão.\nO novo sistema visa acelerar a descoberta de materiais e fármacos com capacidade computacional sem precedentes.\nEssa iniciativa consolida o país na vanguarda do uso de supercomputação aplicada à ciência.","link":"https://www.asahi.com/articles/ASV9C0NTKV9CPIHB006M.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Startup originada da Kioxia lança serviço de criptografia de última geração","resumo":"Uma nova startup surgida a partir da gigante dos semicondutores Kioxia anunciou um serviço inovador de criptografia.\nA tecnologia promete multiplicar por mais de 50 vezes a capacidade de processamento seguro de dados.\nA solução responde à crescente demanda por segurança máxima em ambientes de computação em nuvem.","link":"https://www.nikkei.com/article/DGXZQOUC095T10Z00C26A9000000/","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"KDDI ニュースルーム","pais":"Japão","titulo":"Nissan, Moplus e KDDI iniciam testes de comunicação com veículos autônomos","resumo":"As empresas japonesas Nissan, Moplus e KDDI uniram forças para testar tecnologias de comunicação aplicadas a dez veículos autônomos simultaneamente.\nO projeto visa validar a estabilidade e a segurança da troca de dados em tempo real nas redes móveis.\nTrata-se de um passo fundamental para a comercialização e expansão do transporte autônomo.","link":"https://newsroom.kddi.com/news/detail/kddi_nr-1159_4712.html","categoria":"TECNOLOGIA AUTOMOTIVA","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"Estudo revela avanço no tratamento de doenças do ouvido interno com injeção a jato sem agulha","resumo":"Pesquisadores apresentaram resultados promissores no uso de tecnologia de injeção a jato sem agulha para tratar enfermidades do ouvido interno.\nO método inovador permite a entrega precisa de medicamentos de forma não invasiva e minimamente dolorosa.\nA descoberta abre caminho para novas abordagens terapêuticas na medicina otológica.","link":"https://prtimes.jp/main/html/rd/p/000000227.000035577.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Reuters","pais":"Japão","titulo":"Coreia do Sul amplia lei de espionagem para reforçar proteção da tecnologia de semicondutores","resumo":"O governo sul-coreano alterou a legislação penal para expandir o alcance dos crimes de espionagem e proteger sua indústria de semicondutores.\nA medida visa combater o vazamento de segredos industriais críticos para concorrentes estrangeiros.\nA nova regra reflete o aumento das tensões geopolíticas pela supremacia tecnológica global.","link":"https://jp.reuters.com/jp/world/china/3Y7HGAAJQBPG5NVEEIVBK5QNPU-2026-09-14/","categoria":"POLÍTICA TECNOLÓGICA","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"HERE Technologies apresenta tecnologia de otimização de rotas impulsionada por IA","resumo":"A HERE Technologies revelou suas mais recentes soluções de roteamento inteligente durante a IAA Transportation 2026.\nA plataforma utiliza inteligência artificial para otimizar trajetos e reduzir custos logísticos na indústria de transportes.\nA inovação promete elevar a eficiência operacional de frotas comerciais globalmente.","link":"https://news.yahoo.co.jp/articles/637c1d153cf3da39b96f8de6729fa54c77dc2313","categoria":"LOGÍSTICA DIGITAL","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Técnicos de TI norte-coreanos utilizam identidades falsas para se infiltrar em empresas americanas","resumo":"Relatórios revelam que profissionais de TI norte-coreanos estão recrutando intermediários no exterior para fraudar processos seletivos em empresas dos EUA.\nAs táticas de infiltração estão cada vez mais sofisticadas para burlar verificações de segurança.\nOs recursos obtidos são desviados para financiar programas estatais sancionados internacionalmente.","link":"https://news.yahoo.co.jp/expert/articles/a8246631ae57458bc9c6421387618ae72c91a792","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"zennoh.or.jp","pais":"Japão","titulo":"JA Zen-Noh desenvolve tecnologia conjunta para captação de dados de cultivo agrícola","resumo":"A federação agrícola JA Zen-Noh e a parceira Kyuri Tomato Nasubi criaram um sistema avançado de coleta de dados de crescimento vegetal.\nA tecnologia começou a ser aplicada oficialmente em centro de pesquisas de horticultura em ambiente protegido.\nO objetivo é otimizar a produtividade e a sustentabilidade dos cultivos no Japão.","link":"https://www.zennoh.or.jp/press/release/2026/110805.html","categoria":"AGRITECH","lang":"pt"},{"fonte":"21财经","pais":"China","titulo":"Exportação de música para o exterior: plataformas e tecnologia chinesas têm grande potencial","resumo":"A expansão global da música chinesa ganha força impulsionada por plataformas digitais e inovações tecnológicas de ponta.\nA integração de ferramentas avançadas permite a distribuição eficiente de conteúdo em escala internacional.\nEspecialistas destacam que a tecnologia cultural chinesa possui enorme potencial para dominar novos mercados e influenciar tendências globais.","link":"https://m.21jingji.com/article/20260914/herald/16ed0a34ecea2386d1e2b54bbcb8ed67.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"上观新闻","pais":"China","titulo":"Tecnologia de foguetes reutilizáveis avança para implementação prática; fórum debate novo paradigma integrado","resumo":"A tecnologia de foguetes reutilizáveis da China está transicionando para a aplicação prática na engenharia aeroespacial.\nUm fórum recente reuniu especialistas para discutir a integração de satélites, foguetes e bases de lançamento.\nO novo paradigma busca reduzir drasticamente os custos operacionais e acelerar a exploração comercial do país.","link":"https://www.jfdaily.com.cn/news/detail?id=1176392","categoria":"AEROESPACIAL","lang":"pt"},{"fonte":"Table.Briefings","pais":"China","titulo":"Tecnologia: China transforma a inteligência artificial em questão de segurança nacional","resumo":"O governo chinês passou a tratar a inteligência artificial como um pilar fundamental da segurança nacional.\nA estratégia envolve investimentos maciços no desenvolvimento autônomo de semicondutores e modelos avançados de IA.\nEssa abordagem visa reduzir a dependência de tecnologias ocidentais e consolidar a liderança estratégica do país.","link":"https://table.media/china/news/technologie-china-macht-ki-zur-frage-der-nationalen-sicherheit","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"新华网","pais":"China","titulo":"China divulga lista dos periódicos líderes de ciência e tecnologia do mundo","resumo":"A China divulgou uma nova lista oficial destacando os periódicos científicos e tecnológicos de maior impacto mundial.\nA iniciativa busca elevar a reputação das publicações acadêmicas nacionais e promover pesquisas de alto nível.\nO mapeamento orienta os pesquisadores a divulgarem descobertas em veículos estratégicos para fortalecer o setor.","link":"https://portuguese.xinhuanet.com/20260913/cb3a24e563594681a44b002e8cfcbb88/c.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Guia de leitura dos artigos da semana na revista Science","resumo":"Foi divulgado o guia com os resumos dos principais artigos acadêmicos publicados na mais recente edição da revista Science.\nA seleção abrange pesquisas de ponta em diversas disciplinas, incluindo biotecnologia, física e ciências ambientais.\nO compilado oferece uma visão abrangente das descobertas mais relevantes e seus impactos na comunidade científica.","link":"https://news.sciencenet.cn/htmlnews/2026/9/571375.shtm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Bisinfotech","pais":"Índia","titulo":"INFAC lança conjunto de baterias de 800V para veículos elétricos com conversor","resumo":"A INFAC anunciou o lançamento de um novo sistema de bateria de 800V com conversor integrado voltado para veículos elétricos.\nA tecnologia promete aumentar a eficiência do carregamento ultra-rápido e otimizar o gerenciamento de energia nos veículos modernos.\nCom essa novidade, a empresa busca atender à crescente demanda global por componentes automotivos avançados e sustentáveis.","link":"https://www.bisinfotech.com/infac-enables-48v-automotive-zonal-architectures-using-vicor-high-density-power-conversion-technology/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Livemint","pais":"Índia","titulo":"Bolha de IA ou revolução econômica? A tecnologia que os investidores podem estar subestimando","resumo":"O debate sobre o real valor da Inteligência Artificial ganha força entre analistas do mercado financeiro global.\nEspecialistas discutem se o boom da IA representa uma bolha prestes a estourar ou uma revolução de produtividade de longo prazo.\nA análise destaca setores tecnológicos emergentes que podem estar sendo negligenciados pelos investidores tradicionais.","link":"https://www.livemint.com/videos/ai-bubble-or-economic-revolution-the-technology-investors-may-be-underestimating-11789363477310.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"The Hindu","pais":"Índia","titulo":"Retido no trânsito de Mumbai, Gadkari propõe novas tecnologias para substituir viadutos antigos","resumo":"O ministro dos Transportes da Índia enfrentou quase uma hora de congestionamento em Mumbai e defendeu soluções tecnológicas urgentes.\nEle sugeriu a substituição de viadutos antigos por estruturas pré-fabricadas e novos métodos de construção de alta velocidade.\nA proposta visa mitigar o gargalo de mobilidade urbana que afeta fortemente a produtividade e a economia das grandes metrópoles indianas.","link":"https://www.thehindu.com/news/national/maharashtra/gadkari-delayed-by-mumbai-traffic-by-nearly-an-hour-pitches-new-technology-to-replace-ageing-flyovers/article71464408.ece","categoria":"INFRAESTRUTURA","lang":"pt"},{"fonte":"EurekAlert!","pais":"Índia","titulo":"Tecnologia sul-coreana de purificação de ar chega às ferrovias da Índia para combater poeira fina","resumo":"A tecnologia K-Air de purificação de ar está sendo implantada no sistema ferroviário da Índia para mitigar índices severos de poluição.\nO sistema é focado na redução de partículas finas de poeira em estações e vagões de trens com grande fluxo de passageiros.\nA iniciativa representa um passo importante na integração de soluções tecnológicas avançadas para a saúde pública e qualidade ambiental no país.","link":"https://www.eurekalert.org/news-releases/1143623","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The Times of India","pais":"Índia","titulo":"Índia e Vietnã concordam em acelerar compartilhamento de tecnologia de defesa e fortalecer laços marítimos","resumo":"Índia e Vietnã firmaram um acordo estratégico para intensificar a cooperação e o compartilhamento de tecnologia no setor de defesa.\nA parceria abrange o reforço da segurança marítima na região do Indo-Pacífico diante de crescentes tensões geopolíticas.\nO avanço fortalece a indústria militar indiana e consolida novas alianças de transferência tecnológica na Ásia.","link":"https://timesofindia.indiatimes.com/india/india-vietnam-agree-to-accelerate-defence-technology-sharing-boost-maritime-ties/articleshow/134220860.cms","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"Observador","pais":"Índia","titulo":"Modi alerta para o risco do uso de tecnologia e minerais críticos como armas","resumo":"O primeiro-ministro da Índia, Narendra Modi, fez um alerta global sobre o risco de transformar tecnologias e minerais críticos em ferramentas de coerção.\nDurante a cúpula dos BRICS, ele defendeu a necessidade de cadeias de suprimento seguras e acesso equitativo a recursos estratégicos.\nA declaração reflete a preocupação indiana com o monopólio de insumos tecnológicos essenciais para a transição energética global.","link":"https://observador.pt/2026/09/13/modi-alerta-para-o-risco-do-uso-de-tecnologia-e-de-minerais-criticos/","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"FMI aponta Índia como motor do crescimento global após expansão de 7,8% na economia","resumo":"O Fundo Monetário Internacional destacou a Índia como uma das principais forças de crescimento da economia mundial.\nO reconhecimento veio após o país registrar uma expansão expressiva de 7,8% no primeiro trimestre do ano fiscal corrente.\nO desempenho consolida o papel da Índia como um polo atrativo para investimentos em tecnologia, infraestrutura e inovação.","link":"https://newsonair.gov.in/imf-describes-india-a-key-engine-of-global-growth-after-countrys-economy-expanded-7-8-in-first-quarter-of-current-fiscal/","categoria":"ECONOMIA","lang":"pt"},{"fonte":"The Times of India","pais":"Índia","titulo":"Apenas uma pitada de pimenta-preta pode mudar a absorção de nutrientes pelo corpo: entenda a ciência","resumo":"Pesquisas científicas explicam como a piperina, composto presente na pimenta-preta, aumenta drasticamente a biodisponibilidade de nutrientes nos alimentos.\nEstudos mostram que a substância melhora a absorção de vitaminas, minerais e compostos antioxidantes como a curcumina.\nA descoberta destaca o impacto de hábitos alimentares simples no desempenho metabólico e na saúde geral.","link":"https://timesofindia.indiatimes.com/life-style/food-news/just-a-pinch-of-black-pepper-can-change-what-your-body-gets-from-food-heres-the-science/articleshow/134233542.cms","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"CEO da Anthropic alerta para desinformação sobre IA e pede intervenção governamental","resumo":"O CEO da Anthropic fez um alerta público sobre a proliferação de informações falsas e promessas exageradas em torno da inteligência artificial.\nEle defende que a sociedade e os governos precisam agir de forma ativa para regulamentar o setor antes que os impactos negativos se tornem irreversíveis.\nA declaração reforça o debate global sobre governança, responsabilidade ética e a necessidade de transparência por parte das grandes empresas de tecnologia.","link":"https://www.cmjornal.pt/tecnologia/amp/ceo-da-anthropic-denuncia-mentiras-sobre-ia-e-pede-intervencao-de-governos-e-cidadaos","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Público","pais":"Portugal","titulo":"Diante de pedidos para regular a IA, Trump critica exageros e aponta 'forças negativas'","resumo":"Em meio às crescentes pressões por uma regulamentação rigorosa da inteligência artificial, Donald Trump posicionou-se contra medidas severas, classificando as tentativas de controle como exageradas.\nO ex-presidente argumentou que restrições excessivas podem prejudicar a competitividade tecnológica e a inovação no setor.\nSuas declarações intensificam o debate político sobre até que ponto o Estado deve intervir no avanço acelerado dos algoritmos e da automação.","link":"https://www.publico.pt/2026/09/13/tecnologia/noticia/pedidos-regulacao-ia-trump-fala-exageros-forcas-negativas-2187915?ref=Internet","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Meteored Portugal","pais":"Portugal","titulo":"Ciência encontra novas evidências de que Vênus pode ter abrigado vida no passado","resumo":"Pesquisadores identificaram novas evidências científicas indicando que o planeta Vênus pode ter possuído condições habitáveis em seu passado distante.\nA análise de dados sugere a presença antiga de água e de uma atmosfera muito mais amena do que o ambiente extremo observado atualmente.\nA descoberta amplia a compreensão da astrobiologia sobre a evolução planetária e impulsiona novas missões de exploração espacial no sistema solar.","link":"https://www.tempo.pt/noticias/astronomia/la-ciencia-encuentra-nuevas-pruebas-de-que-venus-posiblemente-albergo-vida-en-el-pasado.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Google e Abbott fecham parceria para impulsionar a saúde metabólica com tecnologia","resumo":"A Google e a gigante do setor de saúde Abbott uniram forças para desenvolver soluções tecnológicas voltadas ao monitoramento e à melhoria da saúde metabólica.\nA iniciativa combina sensores biométricos avançados com inteligência artificial para oferecer análises personalizadas e previsões de bem-estar aos usuários.\nEssa aliança reflete a tendência crescente de grandes empresas de tecnologia expandirem suas atuações no mercado de saúde digital e medicina preventiva.","link":"https://sapo.pt/artigo/google-e-abbott-apostam-na-saude-metabolica-6aa72d5b5a67d4ba1d13e73a","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Correio do Ribatejo","pais":"Portugal","titulo":"Coruche aplica ciência e tecnologia para transformar o futuro da agricultura","resumo":"O município de Coruche lançou uma iniciativa voltada à modernização do setor agrícola por meio da integração de dados, sensores e ciência aplicada ao campo.\nO objetivo principal é otimizar o uso de recursos naturais, aumentar a produtividade das lavouras e enfrentar os desafios impostos pelas mudanças climáticas.\nA medida posiciona a região como um polo de inovação agrotecnológica e sustentabilidade no cenário produtivo nacional.","link":"https://correiodoribatejo.pt/coruche-coloca-ciencia-e-tecnologia-ao-servico-do-futuro-da-agricultura/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Projeto Remanufacturing-X promete transformar a indústria por meio da economia circular","resumo":"O programa Remanufacturing-X foi apresentado com a proposta de revolucionar os processos fabris ao integrar conceitos avançados de economia circular e manufatura sustentável.\nA iniciativa promove a reutilização de componentes industriais e o reaproveitamento de materiais em larga escala com apoio de tecnologias digitais.\nO impacto esperado inclui a redução significativa da pegada de carbono industrial e o aumento da eficiência operacional na cadeia de suprimentos.","link":"https://sapo.pt/artigo/remanufacturing-x-vai-transformar-a-industria-atraves-da-economia-circular-6aa6af0fcd80d8fcaac479ad","categoria":"INDÚSTRIA","lang":"pt"},{"fonte":"vozportucalense.pt","pais":"Portugal","titulo":"UCP debate 'Ecologia Digital' para pensar o futuro da tecnologia além da inteligência artificial","resumo":"A Universidade Católica Portuguesa promoveu uma discussão sobre o conceito de 'Ecologia Digital', propondo uma análise crítica do impacto tecnológico além da febre da inteligência artificial.\nO debate defende um desenvolvimento ético e humanista, integrando preocupações ambientais e sociais ao avanço das ferramentas digitais.\nA reflexão destaca a importância de construir um ecossistema tecnológico sustentável focado nas reais necessidades humanas.","link":"https://www.vozportucalense.pt/2026/09/13/ucp-ecologia-digital-pensar-a-tecnologia-para-la-da-ia/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O Vilaverdense","pais":"Portugal","titulo":"Vila Verde dá início a projeto europeu focado em inovação e economia circular","resumo":"O município de Vila Verde foi escolhido para o lançamento de um projeto europeu voltado ao desenvolvimento sustentável e à inovação em economia circular.\nA ação reúne especialistas e recursos para implementar práticas sustentáveis na gestão de resíduos e na eficiência energética local.\nO projeto serve como um modelo replicável para outras regiões da Europa interessadas na transição para modelos econômicos de baixo impacto ambiental.","link":"https://ovilaverdense.pt/vila-verde-recebe-arranque-de-projeto-europeu-de-inovacao-e-economia-circular/","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"seudinheiro.com","pais":"Brazil","titulo":"ChatGPT Owner Rules Out IPO This Year as Executives Warn of AI Slowdown","resumo":"The company behind ChatGPT has signaled that it does not intend to go public in the financial market at this time.\nMeanwhile, tech sector executives are beginning to warn about a potential brake on the rapid pace of advancements in artificial intelligence.\nThe shift reflects both rising operational costs and ongoing debates over infrastructure limits and regulation.","link":"https://www.seudinheiro.com/2026/economia/dona-do-chatgpt-descarta-ipo-neste-ano-e-executivos-fazem-alerta-sobre-ia-havera-um-freio-na-tecnologia-giov/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Época Negócios","pais":"Brazil","titulo":"Dario Amodei Claims AI Industry Lied About the Technology's Real Risks","resumo":"The CEO of Anthropic publicly stated that major tech companies have hidden or downplayed the dangers of unchecked artificial intelligence advancement.\nThe remarks spark a fresh global alert regarding the urgency of transparency in creating advanced generative models.\nThe debate is gaining traction just as governments and international bodies discuss stricter regulatory frameworks.","link":"https://epocanegocios.globo.com/inteligencia-artificial/noticia/2026/09/dario-amodei-diz-que-industria-de-ia-mentiu-sobre-riscos-da-tecnologia.ghtml","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"Canal Rural","pais":"Brazil","titulo":"São Paulo Municipality Officialized as National Technology Capital Due to High Density of Scientists","resumo":"A new federal law has granted the São Paulo municipality the title of National Technology Capital due to its remarkable academic density.\nThe city stands out on the national stage by hosting a proportion of one PhD holder for every 100 residents, driven by universities and research centers.\nThis recognition projects the region as a strategic hub for innovation, startup attraction, and scientific investment in Brazil.","link":"https://www.canalrural.com.br/alem-do-agro/2026/09/13/a-cidade-paulista-que-virou-capital-nacional-da-tecnologia-por-lei-federal-concentra-tantos-cientistas-que-tem-um-doutor-para-cada-100-moradores/","categoria":"SCIENCE","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"Oil Price Surge Revives Global Interest in Clean Hydrogen","resumo":"The recent rise in international oil prices has accelerated the pursuit of sustainable energy alternatives.\nClean hydrogen has returned to the spotlight for governments and major investors as a viable solution for the energy transition.\nNew research and funding in the sector are gaining strategic urgency to reduce dependence on fossil fuels.","link":"https://www1.folha.uol.com.br/mercado/2026/09/disparada-no-preco-do-petroleo-reaviva-interesse-por-hidrogenio-limpo.shtml","categoria":"CLEAN ENERGY","lang":"en"},{"fonte":"revistaoeste.com","pais":"Brazil","titulo":"New Construction Technology Allows Building a Residential Structure in 48 Hours","resumo":"An innovative construction method promises to erect the complete structure of a 120-square-meter house in just two days.\nSurpassing traditional brick models and common dry-construction techniques, the system optimizes project timelines and reduces waste.\nThis innovation promises to impact real estate sector efficiency and lower operational costs in civil construction.","link":"https://revistaoeste.com/oestegeral/2026/09/13/nem-construcao-a-seco-nem-tijolo-a-nova-tecnologia-para-levantar-a-estrutura-de-uma-casa-de-120-m2-em-48-horas/","categoria":"INNOVATION","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"King Charles Gathers Tech Leaders Amid Calls for an AI Slowdown","resumo":"The British monarch invited the world's leading tech executives to discuss the accelerated advancement of artificial intelligence.\nThe meeting comes in response to growing calls for a pause in the development of new models until secure guidelines are in place.\nThe gathering seeks to align technological progress with ethical principles and the preservation of global security.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/13/rei-charles-reunira-lideres-de-empresas-de-ia-em-meio-a-apelos-por-desaceleracao-da-tecnologia.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"IT Forum","pais":"Brazil","titulo":"Programmer's Day: Artificial Intelligence Raises the Bar for Junior Developer Requirements","resumo":"On Programmer's Day, analysts point out that the popularization of AI tools has altered the requirements for entering the job market.\nAlthough hiring remains active, the level of technical knowledge and analytical capability demanded from beginners has risen significantly.\nJunior developers now need to master the use of AI as a productivity tool to maintain their competitiveness.","link":"https://itforum.com.br/noticias/ia-programadores-juniores-mercado/","categoria":"TECH MARKET","lang":"en"},{"fonte":"Jornal da USP","pais":"Brazil","titulo":"Scientific Research Evaluates Mindfulness Impact in Combating Binge Eating","resumo":"A recent academic study analyzed how the practice of mindfulness can assist in controlling binge-eating episodes.\nPreliminary results indicate reduced stress and greater emotional awareness during volunteers' meals.\nThis investigation opens new pathways for integrative treatments in the fields of mental health and nutrition.","link":"https://jornal.usp.br/podcast/curioso-por-ciencia-125-pesquisa-avalia-pratica-de-atencao-plena-contra-sintomas-de-compulsao-alimentar/","categoria":"SCIENCE","lang":"en"},{"fonte":"ビジネス+IT","pais":"United States","titulo":"Anthropic Projects AI Impact on US Economy Through 2030, with 17.9% Loss of Knowledge Jobs","resumo":"A new study released by Anthropic points to profound transformations in the North American economy driven by artificial intelligence by the year 2030. The projection indicates that approximately 17.9% of intellectual jobs are at risk of being automated. The report highlights the urgency of public policies to mitigate impacts on the labor market and income distribution. This analysis reinforces debates regarding the rapid pace of technological advancement and its social repercussions.","link":"https://www.sbbit.jp/article/cont1/186935","categoria":"ECONOMY \u0026 AI","lang":"en"},{"fonte":"Science Daily","pais":"United States","titulo":"NASA-Backed Scientists Turn Plastic Waste Into Edible Cookies","resumo":"Researchers funded by NASA have developed an innovative process capable of converting plastic waste into food suitable for human consumption. The technology utilizes biological and chemical processes to break down polymers and transform them into nutrients in the format of cookies. This innovation promises to help both with waste management on Earth and with provisioning long-duration space missions. This breakthrough represents a promising step for sustainability and space exploration.","link":"https://www.sciencedaily.com/releases/2026/09/260912220033.htm","categoria":"SCIENCE","lang":"en"},{"fonte":"The Guardian","pais":"United States","titulo":"OpenAI Chief and Elon Musk Back Calls to Slow Down 'Reckless' AI Development","resumo":"Prominent tech industry leaders, including the head of OpenAI and entrepreneur Elon Musk, have backed calls for caution in the evolution of artificial intelligence. The movement warns against the risks of unchecked development without proper regulation over society. The statements increase pressure on regulatory bodies to establish strict ethical and computational safety limits. The debate highlights the tension between the race for innovation and human protection.","link":"https://www.theguardian.com/technology/2026/sep/13/openai-sam-altman-elon-musk-back-anthropic-calls-brakes-ai-development","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Washington Post","pais":"United States","titulo":"Trump Resists AI Slowdown as Political Landscape Shifts","resumo":"Former President Donald Trump has positioned himself against slowing down the development of artificial intelligence in the United States. Proponents of this stance argue that braking the technology could harm American competitiveness against global rivals like China. This position signals a striking division in the regulatory debate between technological security and economic leadership. The issue has become one of the most central topics of current political discussions in the country.","link":"https://www.washingtonpost.com/politics/2026/09/13/trump-rejects-calls-so-slow-ai-development-citing-chinese-competition/","categoria":"TECH POLITICS","lang":"en"},{"fonte":"Correio da Manhã","pais":"United States","titulo":"US House Leader Opposes Slowing Down AI Development","resumo":"The leader of the United States House of Representatives has declared formal opposition to proposals seeking to pause advances in artificial intelligence. The legislative leadership emphasizes the need to maintain the country's technological and economic supremacy on the international stage. This stance reflects concerns that severe restrictions could delay innovation in highly strategic sectors. The decision is driving heated debates over regulation versus competitiveness in Congress.","link":"https://www.cmjornal.pt/tecnologia/detalhe/lider-da-camara-dos-representantes-do-eua-contra-abrandar-desenvolvimento-ia","categoria":"TECH POLITICS","lang":"en"},{"fonte":"cnn.com","pais":"United States","titulo":"Decisive Turning Point for Humanity and AI Could Redefine American Politics","resumo":"The accelerated advancement of artificial intelligence is reaching a crucial moment that promises to redefine the political and social landscape of the United States. Analysts point out that the technology is shaping new legislative priorities, electoral debates, and national security strategies. The decisions made now regarding the governance of advanced algorithms will have long-term repercussions on institutions. This moment is viewed by experts as a watershed in the relationship between technology and society.","link":"https://www.cnn.com/2026/09/14/politics/trump-ai-warning-sacks-coxon-anthropic","categoria":"TRENDS","lang":"en"},{"fonte":"ixbt.games","pais":"United States","titulo":"Kingdom Come: Deliverance II with DLSS 5 Achieves Visuals Envisioned by Daniel Vavra, and Director Defends the Technology","resumo":"The game Kingdom Come: Deliverance II will utilize DLSS 5 technology to achieve the graphical and performance level originally conceived by its creator. Director Daniel Vavra has started actively defending the use of artificial intelligence rendering techniques in game development. This novelty highlights how cutting-edge graphic features are transforming the production and visual fidelity of modern video games. The implementation sets new technical standards for future releases in the sector.","link":"https://ixbt.games/es/news/2026/09/14/435566-kingdom-come-deliverance-ii-blagodaria-dlss-5-stala-vygliadet-tak-kak-predstavlial-daniel-vavra-teper-on-aktivno-zashhishhaet-texnologiiu.html","categoria":"GAMES","lang":"en"},{"fonte":"BFM","pais":"United States","titulo":"AI Takes Center Stage in American Politics","resumo":"Artificial intelligence has assumed a central role in the political agendas and governance strategies of the United States. The topic ranges from global geopolitical competition to concerns regarding cybersecurity and the impact on the labor market. Lawmakers and party leaders seek to establish guidelines that balance encouraging innovation with protecting citizens. The debate reflects the growing influence of technological advancements on the country's sovereignty and economic future.","link":"https://www.bfmtv.com/economie/video-l-ia-au-c-ur-de-la-politique-americaine_VN-202609140120.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Le Dauphiné Libéré","pais":"France","titulo":"Ban on Social Media for Minors Under 15: France Submits New Version to the EU","resumo":"France has presented a new proposal to the European Union to ban access to social media for minors under the age of 15 without parental consent.\nThe measure aims to protect young people from digital risks, such as exposure to inappropriate content and screen addiction.\nIf approved by the European bloc, the legislation could set an important precedent for the regulation of digital platforms across the continent.","link":"https://www.ledauphine.com/politique/2026/09/14/interdiction-des-reseaux-sociaux-aux-moins-de-15-ans-la-france-soumet-une-nouvelle-version-a-l-ue","categoria":"REGULATION","lang":"en"},{"fonte":"ladepeche.fr","pais":"France","titulo":"We Must Invest Heavily in Technology to Avoid Global Decline, Says Jean Tirole","resumo":"Nobel laureate in Economics Jean Tirole warned of the urgency for Europe to significantly increase investments in the technology sector.\nAccording to the economist, the lack of financing for innovation puts the continent at risk of falling behind global powers such as the United States and China.\nThe warning highlights the need for strong public policies to boost startup ecosystems and scientific research.","link":"https://www.ladepeche.fr/2026/09/14/entretien-nous-devons-investir-massivement-dans-la-tech-pour-eviter-le-declassement-mondial-selon-jean-tirole-prix-nobel-deconomie-13546803.php","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"mistral.ai","pais":"France","titulo":"Making Sovereign, Open-Weight AI the New Technological Frontier","resumo":"The advancement of open-source and open-weight artificial intelligence is gaining momentum as a strategic alternative to ensure the technological sovereignty of nations and companies.\nThe model aims to reduce dependence on a few large proprietary technology corporations, promoting greater transparency and security.\nThe initiative positions open infrastructure as a fundamental pillar for the next phase of AI innovation.","link":"https://mistral.ai/news/mistral-makes-sovereign-open-weight-ai-to-frontier/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"L'Express","pais":"France","titulo":"From the US to Europe, Increasingly Alarming Attacks on Science: Professor Alain Fischer's Warning","resumo":"Renowned immunologist Alain Fischer issued a stern warning regarding the growing wave of misinformation and attacks on scientific institutions in the West.\nFrom budget cuts to denialist narratives, pressure on researchers and physicians is reaching alarming levels in Europe and the US.\nThe expert emphasizes the urgent need to defend scientific integrity and restore public trust in medicine.","link":"https://www.lexpress.fr/sciences-sante/des-etats-unis-a-leurope-des-attaques-contre-la-science-toujours-plus-inquietantes-lalerte-du-pr-TTNK7U2TJ5GRBOW6OJBGGCF24Y/","categoria":"SCIENCE","lang":"en"},{"fonte":"Zonebourse","pais":"France","titulo":"DroneShield Partners with AIM Defence to Integrate High-Power Laser Tech into Drone Defense","resumo":"DroneShield has announced a partnership with AIM Defence to incorporate high-power laser systems into its counter-unmanned aerial vehicle solutions.\nThe integration aims to increase precision and efficiency in neutralizing aerial threats in military and civilian scenarios.\nThe initiative reinforces the race for advanced security and defense technologies against the proliferation of drones.","link":"https://www.zonebourse.com/actualite-bourse/droneshield-collabore-avec-aim-defence-pour-integrer-la-technologie-laser-de-haute-puissance-a-son-e-ce785bdcd88af323","categoria":"INNOVATION","lang":"en"},{"fonte":"Contexte","pais":"France","titulo":"Budget: Tech-Linked Credits Hit by Government Savings Measures","resumo":"The French government's spending containment plan has directly impacted programs and incentives aimed at the technology sector.\nThe reduction of budgetary funds is generating strong concern among business leaders and researchers regarding the pace of innovation in the country.\nFaced with a competitive global scenario, the cuts call into question the financing of strategic initiatives for France's digital transition.","link":"https://www.contexte.com/fr/actualite/tech/des-credits-lies-a-la-tech-touches-par-les-mesures-deconomie-du-gouvernement_277126","categoria":"BUSINESS","lang":"en"},{"fonte":"Jornal O Sul","pais":"France","titulo":"US Generates Uncertainty: Central Banks of France and the Netherlands Withdraw Gold Reserves from the Country","resumo":"In a strategic move reflecting growing distrust in the North American economic landscape, the central banks of France and the Netherlands have repatriated their gold reserves stored in the US.\nThe decision signals a shift in risk management among major European financial institutions amid global fiscal instabilities.\nThe event highlights the quest for greater sovereignty and asset protection in times of geopolitical uncertainty.","link":"https://www.osul.com.br/antes-porto-seguro-da-economia-global-estados-unidos-agora-geram-incerteza-bancos-centrais-de-franca-e-holanda-retiraram-suas-reservas-de-ouro-do-pais/amp/","categoria":"ECONOMY","lang":"en"},{"fonte":"blogdumoderateur.com","pais":"France","titulo":"5 Courses to Learn Data Science and Artificial Intelligence","resumo":"The growing demand for qualified professionals in the technology market has driven the search for training in data analysis and AI.\nA selection of five top courses highlights the main skills demanded by companies to work in the field.\nThe movement reflects how technical education has become a fundamental pillar to address the talent shortage in the digital ecosystem.","link":"https://www.blogdumoderateur.com/selection-formation-data-scientist-318/","categoria":"EDUCATION","lang":"en"},{"fonte":"Water Magazine","pais":"United Kingdom","titulo":"Oxford Tech Company Awarded £100K to Transform Real-Time River Pollution Monitoring","resumo":"An Oxford-based technology company has been awarded £100,000 in funding to develop advanced solutions for real-time river pollution monitoring. The initiative aims to transform how contaminants in rivers are identified and managed, allowing for faster responses from environmental agencies. The project represents a significant advancement in applying technological innovation to the United Kingdom's ecological preservation.","link":"https://www.watermagazine.co.uk/2026/09/14/oxford-technology-company-awarded-100000-to-transform-real-time-river-pollution-monitoring/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"El Economista","pais":"United Kingdom","titulo":"Telefónica Creates Fund in the UK to Reuse Technology","resumo":"Telefónica has announced the creation of a new fund in the United Kingdom focused on boosting the reuse and recycling of technological devices. The goal of the initiative is to promote the circular economy, reducing electronic waste generated by the telecommunications sector. The strategy seeks to mitigate the environmental impact of obsolete technologies and encourage sustainable solutions in the tech industry.","link":"https://www.eleconomista.es/seleccion-ee/noticias/14013303/09/26/telefonica-crea-un-fondo-en-el-reino-unido-para-reutilizar-la-tecnologia.html","categoria":"BUSINESS","lang":"en"},{"fonte":"BBC","pais":"United Kingdom","titulo":"Parliamentary Committee Demands Bill to Combat AI Threats to Human Rights","resumo":"A parliamentary committee has called for the urgent drafting of a bill to curb the threats that Artificial Intelligence may pose to human rights. The initiative aims to establish clear guidelines and ethical regulations for the development and use of algorithmic systems. Lawmakers emphasize that accelerated technological advancement requires rigorous safeguards to protect citizens' privacy and security.","link":"https://www.bbc.com/news/articles/cwyzvgj70y4o","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"The Guardian","pais":"United Kingdom","titulo":"Researchers Hope Powerful New Microscope Will Reveal Root Cause of Incurable Bowel Disease","resumo":"Researchers are pinning their hopes on a powerful new microscope to try to uncover the primary cause of a currently incurable bowel disease. The technology allows cellular details to be examined at unprecedented resolutions, helping to understand the mechanisms of the illness. It is hoped that these scientific breakthroughs will pave the way for innovative and more effective treatments for patients.","link":"https://www.theguardian.com/society/2026/sep/14/new-microscope-discovery-hopes-incurable-inflammatory-bowel-disease-crohns-science-treatment","categoria":"SCIENCE","lang":"en"},{"fonte":"Financial Times","pais":"United Kingdom","titulo":"Dutch Startup Closes Funding Round for Encrypted Silicon Technology","resumo":"A Dutch startup has finalized a fundraising round to boost the production of its encrypted silicon technology. The advancement seeks to ensure hardware-level protection against cyber vulnerabilities and espionage attempts. With the new investment, the company aims to accelerate the manufacturing and global distribution of its highly secure chips.","link":"https://www.ft.com/content/a6574d9d-5e75-4b9c-b4d7-b05f7008e48e?syn-25a6b1a6=1","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"El Periódico","pais":"Spain","titulo":"Tesla Under Fire from Authorities Over Drivers Sleeping at the Wheel While Car is Moving","resumo":"Tesla's autonomous driving feature is facing heavy scrutiny due to an increase in reports of drivers falling asleep while their vehicles continue to move.\nThe debate raises urgent alerts regarding the safety limits of driver assistance systems on public roads.\nRegulators and technology experts are demanding stricter measures to monitor driver attentiveness.","link":"https://www.elperiodico.com/es/motor/20260914/tesla-punto-mira-conductores-duermen-134178701","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"El Economista","pais":"Spain","titulo":"Atlantic Copper inaugurates circular economy plant in Huelva to recover 60,000 tons of metals per year","resumo":"Atlantic Copper has launched a new facility focused on advanced recycling and the circular economy in the Huelva region.\nThe project is designed to recover approximately 60,000 tons of valuable metals annually from electronic and industrial waste.\nThe initiative represents a significant breakthrough for sustainability and raw material independence in Europe.","link":"https://www.eleconomista.es/industria/noticias/14013635/09/26/atlantic-copper-estrena-en-huelva-su-planta-de-economia-circular-para-recuperar-60000-toneladas-de-metales-al-ano.html","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"El Periódico de la Energía","pais":"Spain","titulo":"Dacia expands hybrid technology to its entire lineup with two new engines manufactured in Spain","resumo":"Automaker Dacia has announced the expansion of hybrid powertrain technology across its entire range of passenger and commercial vehicles.\nThe move features the development of two new engines produced directly on Spanish soil.\nThe strategy aims to accelerate the brand's ecological transition by offering more accessible electrified options to the European market.","link":"https://elperiodicodelaenergia.com/dacia-extiende-la-tecnologia-hibrida-a-toda-su-gama-con-dos-nuevos-motores-made-in-spain","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"MARCA","pais":"Spain","titulo":"Artificial intelligence transforms the economy and could become an independent factor of production","resumo":"Experts point out that artificial intelligence is reshaping traditional economic pillars around the world.\nInstead of merely being a productivity tool, AI is moving toward recognition as an autonomous factor of production, alongside capital and labor.\nThis conceptual shift promises to alter the global dynamics of markets, jobs, and investments in the coming years.","link":"https://www.marca.com/tiramillas/economia/2026/09/14/inteligencia-artificial-cambia-completo-forma-entender-economia-podria-pasar-factor-produccion-independiente.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Diario de Mallorca","pais":"Spain","titulo":"Doctor uses artificial intelligence to combat sepsis: \"Technology that sees what a doctor cannot\"","resumo":"Dr. Marcio Borges has developed an artificial intelligence tool aimed at the early diagnosis of severe sepsis cases.\nThe technology analyzes large volumes of clinical data to identify subtle, invisible-to-the-naked-eye signs before a patient's condition deteriorates.\nThe breakthrough promises to save hundreds of lives by accelerating critical treatments in intensive care units.","link":"https://www.diariodemallorca.es/mallorca/2026/09/14/marcio-borges-doctor-son-llatzer-134247630.html","categoria":"HEALTH \u0026 TECHNOLOGY","lang":"en"},{"fonte":"moncloa.com","pais":"Spain","titulo":"Spanish technology on NATO's eastern flank: Poland entrusts its military intelligence to GMV","resumo":"Spanish tech company GMV has been selected by Poland to provide military intelligence solutions destined for NATO.\nThe agreement involves supplying advanced data processing systems and strategic sensing on the European eastern flank.\nThe partnership consolidates Spain's prominent role in the international defense technology industry.","link":"https://www.moncloa.com/2026/09/14/inteligencia-otan-gmv-3429842/","categoria":"DEFENSE \u0026 TECHNOLOGY","lang":"en"},{"fonte":"3DJuegos","pais":"Spain","titulo":"Zelda Ocarina of Time remake will run smoothly on Nintendo Switch 2, but without highly anticipated technology","resumo":"Gaming experts confirm that an updated version of the classic Zelda Ocarina of Time will feature high performance on Nintendo's new console.\nHowever, the community laments the absence of cutting-edge graphic technology expected for this new generation.\nThe dilemma rekindles discussions about the balance between nostalgia, optimization, and graphic processing power in video games.","link":"https://www.3djuegos.com/juegos/the-legend-of-zelda-ocarina-of-time/noticias/expertos-coinciden-remake-zelda-ocarina-of-time-ira-muy-fluido-nintendo-switch-2-lamentan-ausencia-gran-tecnologia","categoria":"GAMES","lang":"en"},{"fonte":"EL PAÍS","pais":"Spain","titulo":"Math elite fears the discipline is losing its meaning amid artificial intelligence advancements","resumo":"Renowned mathematicians are expressing growing concern over the impact of new artificial intelligence tools on academic development.\nWith algorithms demonstrating complex theorems in seconds, fears are rising that human intuition will lose its place.\nThe debate questions the future of pure scientific research and the role of theoretical knowledge in an automated world.","link":"https://elpais.com/ciencia/2026-09-13/la-elite-de-las-matematicas-alerta-del-riesgo-de-que-los-avances-de-la-ia-las-vacie-de-sentido.html","categoria":"SCIENCE","lang":"en"},{"fonte":"BR","pais":"Germany","titulo":"Brain Electrodes: Paralyzed Man Can Feel Touch Again","resumo":"Scientists have made significant progress in the field of neuroprosthetics by implanting electrodes directly into the brain of a paralyzed patient.\nThis technology has made it possible to restore the sensation of touch by connecting artificial sensory signals to the central nervous system.\nThe breakthrough represents a milestone for regenerative medicine and neurotechnology, offering new hope for the rehabilitation of people with severe spinal cord injuries.","link":"https://www.br.de/radio/bayern2/sendungen/iq-wissenschaft-und-forschung/elektroden-im-kopf-gelaehmter-kann-wieder-fuehlen-100.html","categoria":"SCIENCE","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"AI Strategy for Europe: Germany, France, and the Netherlands Lead New Alliance","resumo":"Germany, France, and the Netherlands are joining forces to lead a new European alliance focused on the development and regulation of artificial intelligence.\nThe initiative aims to strengthen the continent's technological sovereignty against global competition from major powers like the United States and China.\nThe plan includes investments in supercomputing infrastructure, proprietary language models, and policies to accelerate responsible innovation in the region.","link":"https://www.sueddeutsche.de/wirtschaft/ki-strategie-europa-deutschland-rechenzentren-li.3545883","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"朝日新聞","pais":"Japan","titulo":"Supercomputers and AI boost innovation in scientific research with Fugaku integration","resumo":"The integration between artificial intelligence and the Fugaku supercomputer promises to revolutionize scientific research in Japan.\nThe new system aims to accelerate material and drug discovery with unpreceden
