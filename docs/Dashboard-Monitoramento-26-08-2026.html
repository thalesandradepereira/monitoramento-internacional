timizaram a forma de onda de Banda Ultralarga para dispositivos ingeríveis.\nA nova tecnologia permite a transmissão rápida e eficiente de dados biométricos de dentro do corpo humano.\nO avanço promete revolucionar diagnósticos médicos ao viabilizar o monitoramento interno de alta resolução.","link":"https://eetimes.itmedia.co.jp/ee/articles/2608/26/news026.html","categoria":"BIOTECNOLOGIA","lang":"en"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Agência Japonesa Utiliza Tecnologia Nuclear para Extrair Terras Raras de Minas Urbanas","resumo":"A Agência de Energia Atômica do Japão desenvolveu um método para extrair terras raras de lixo eletrônico.\nA técnica adapta processos de reprocessamento de combustível nuclear para aplicar em minas urbanas.\nA solução impulsiona a reciclagem sustentável e reduz a dependência de importações industriais críticas.","link":"https://www.nikkei.com/article/DGXZQOSG013JI0R00C26A7000000/","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"PR TIMES","pais":"Japão","titulo":"Startup elleThermo Capta 830 Milhões de Ienes para Gerar Energia a Partir de Calor Residual","resumo":"A startup elleThermo garantiu 830 milhões de ienes em uma rodada de financiamento da Série A.\nA empresa desenvolve sistemas focados na conversão de calor residual não utilizado em energia elétrica limpa.\nO investimento acelerará a comercialização da tecnologia para aumentar a eficiência energética industrial.","link":"https://prtimes.jp/main/html/rd/p/000000011.000120229.html","categoria":"ENERGIA","lang":"en"},{"fonte":"Newscast.jp","pais":"Japan","titulo":"AI-Driven Agricultural Robot Market Projected to Reach $55 Billion by 2035","resumo":"The agricultural robotics sector is projected to reach $55 billion by 2035, driven by artificial intelligence.\nNext-generation automation is emerging as an essential solution to address labor shortages in the agricultural sector.\nThe solutions promise to optimize productivity and sustainability in food crop cultivation on a global scale.","link":"https://newscast.jp/smart/news/5415535","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"時事ドットコム","pais":"Japan","titulo":"Japan's Robotic Technology Gains Attention in Beijing with Practical Application Solutions","resumo":"Japanese robotics demonstrated a strong presence in China by integrating its technologies with local components.\nThe focus was on application flexibility to adapt robots to complex industrial demands.\nThis cooperation underscores Japan's competitiveness in the global automation market.","link":"https://www.jiji.com/jc/article?k=2026082600239\u0026g=int","categoria":"ROBOTICS","lang":"en"},{"fonte":"mol.co.jp","pais":"Japan","titulo":"Japan to Showcase Efficient Navigation Technology Powered by AI and Wind Energy at COP31","resumo":"A technology combining wind power, data, and artificial intelligence will be presented by Japan at COP31.\nThe innovation aims to optimize ship routes to drastically reduce carbon emissions in maritime transport.\nThe project reinforces the country's commitment to developing next-generation sustainable solutions.","link":"https://www.mol.co.jp/info/article/2026/0826.html","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"Global Times","pais":"China","titulo":"China to Accelerate 6G Technology R\u0026D Aiming for Commercial Use Before 2030","resumo":"China's Ministry of Industry and Information Technology has announced a strategic plan to intensify research into 6G technology.\nThe government's goal is to secure global leadership in ultra-high-speed mobile networks and enable commercialization by the end of this decade.\nThe initiative aims to integrate advanced artificial intelligence and satellite communications to transform the country's digital infrastructure.","link":"https://www.globaltimes.cn/page/202608/1369043.shtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Al Jazeera","pais":"China","titulo":"Chinese Humanoid Robot Tiangong Runs 100 Meters in Under 9 Seconds in Beijing","resumo":"The Tiangong humanoid robot has set a new historical speed milestone by completing the 100-meter dash in under nine seconds.\nDeveloped in Beijing, the prototype demonstrates impressive advances in dynamic balance, electric actuators, and real-time motion control.\nThis achievement surpasses human marks and consolidates China's leadership in the development of high-performance bipedal robots.","link":"https://www.aljazeera.com/sports/2026/8/25/chinese-robot-tiangong-clocks-sub-9-second-100-metres-in-beijing","categoria":"ROBOTICS","lang":"en"},{"fonte":"中国经济网","pais":"China","titulo":"Lijian Rocket Series Achieves Two Unprecedented Milestones in China's Space Sector","resumo":"The Lijian commercial rocket line recorded two unprecedented achievements in its most recent orbital launch missions.\nThis technical advancement represents a major step toward the consolidation and maturity of China's private aerospace industry.\nFeaturing increased payload capacity and reduced costs, the new vehicles are driving the expansion of the country's satellite mega-constellations.","link":"http://www.ce.cn/xwzx/kj/202608/t20260826_3171440.shtml","categoria":"SCIENCE AND SPACE","lang":"en"},{"fonte":"Boursorama","pais":"China","titulo":"Huawei and HP Sign Multi-Year Wi-Fi Patent Cross-Licensing Agreement","resumo":"Chinese tech giant Huawei and American computer manufacturer HP have signed a comprehensive patent licensing agreement focused on Wi-Fi technologies.\nThe partnership seeks to end intellectual property disputes and promote global interoperability between the two brands' devices.\nThe pact highlights the relevance of essential communication patents developed by China on the international corporate stage.","link":"https://www.boursorama.com/bourse/actualites-amp/le-chinois-huawei-et-le-fabricant-americain-d-ordinateurs-hp-signent-un-accord-pluriannuel-sur-les-brevets-wi-fi-e22c577b88b673095c7b84fb467c1dbd","categoria":"TECHNOLOGY AND BUSINESS","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Scientific Formula Developed in China Revolutionizes International Textbooks","resumo":"An innovative mathematical equation formulated by Chinese researchers is being incorporated into global university textbooks.\nThe scientific breakthrough resolved a historical theoretical dilemma that required complex manual calculations by scholars around the world.\nThe discovery highlights the growing influence of Chinese academic research in the advancement of fundamental scientific knowledge.","link":"https://news.sciencenet.cn/htmlnews/2026/8/570363.shtm","categoria":"SCIENCE","lang":"en"},{"fonte":"eeo.com.cn","pais":"China","titulo":"Competition Among Humanoid Robots Intensifies Race for Workplace Integration","resumo":"China's leading tech companies are locked in a fierce dispute to deploy the first humanoid robots into real jobs.\nThe transition from laboratory research to industrial assembly lines and commercial services has become the sector's top priority.\nThese autonomous machines are expected to begin meeting operational and manufacturing demands in the coming years.","link":"https://www.eeo.com.cn/2026/0826/1011618.shtml","categoria":"ROBOTICS","lang":"en"},{"fonte":"新京报","pais":"China","titulo":"Huairou Science City Company Wins Global Competition by Surpassing Agricultural Robot Algorithm","resumo":"A startup based in the Huairou Science City innovation hub claimed first place in a prestigious global entrepreneurship tournament.\nThe win came through the successful development of cutting-edge algorithms applied to the navigation and operation of agricultural robots.\nThe system allows for greater precision in field management, automating complex tasks and optimizing crop yields.","link":"https://www.bjnews.com.cn/detail/1787707997019904.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Portuguese Cri","pais":"China","titulo":"Advanced Technology in Shandong Fields Ensures Autumn Harvest","resumo":"The implementation of autonomous agricultural machinery and satellite monitoring systems guaranteed a successful harvest in Shandong.\nThe integration of big data and IoT sensors made it possible to optimize resource use and mitigate severe weather impacts in the region.\nThis technological modernization boosts the country's food security and sets new standards for digital agriculture.","link":"https://portuguese.cri.cn/2026/08/26/PHOA1787723120769194","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"IT Voice Media Pvt. Ltd.","pais":"India","titulo":"Sparsh CCTV Unveils Vision 2027: Roadmap for AI and Indigenous Technology","resumo":"Sparsh CCTV has unveiled its Vision 2027 initiative, focused on the development of domestic surveillance technologies and artificial intelligence.\nThe company aims to strengthen India's technological sovereignty through locally manufactured, AI-based security solutions.\nThis strategic plan aims to boost industrial innovation and reduce reliance on foreign surveillance equipment.","link":"https://www.itvoice.in/sparsh-cctv-unveils-vision-2027-charting-the-future-of-intelligent-and-indigenous-surveillance-technology","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"In 2009, Nandan Nilekani's Team Faced Unprecedented Computer Science Challenge: The Aadhaar Story","resumo":"A detailed overview reveals how the team led by Nandan Nilekani overcame complex computer science problems to create Aadhaar.\nIndia's digital biometric identification system had to be built from scratch to serve a population of over one billion people.\nThe resulting infrastructure has become a global milestone in digital identity, software engineering, and technological financial inclusion.","link":"https://timesofindia.indiatimes.com/education/news/in-2009-nandan-nilekanis-team-faced-a-computer-science-problem-with-no-precedent-how-aadhaar-became-a-billion-person-engineering-feat/articleshow/133530583.cms","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Indianweb2.com","pais":"India","titulo":"NODWIN Gaming Announces SpaceFest, India's First Space, Science, and Sci-Fi Festival","resumo":"NODWIN Gaming has announced the launch of SpaceFest, considered India's first festival dedicated to space exploration, science, and science fiction.\nThe event has official support from the Government of Maharashtra and promises to bring together tech enthusiasts, scientists, and content creators.\nThe initiative seeks to popularize the aerospace sector among youth and connect pop culture with scientific innovation.","link":"https://www.indianweb2.com/2026/08/nodwin-gaming-announces-spacefest.html","categoria":"SCIENCE","lang":"en"},{"fonte":"The Hindu","pais":"India","titulo":"DRDO to Transfer Missile Technology to India's Defense Industry","resumo":"India's Defence Research and Development Organisation has announced the transfer of missile technologies to private industries in the sector.\nThe initiative aims to strengthen national production capacity and encourage the technological modernization of the local defense industry.\nThis measure reflects the government's push for strategic self-sufficiency and continuous innovation in the aerospace sector.","link":"https://www.thehindu.com/news/national/govt-approves-transfer-of-drdo-developed-missile-tech-to-indian-defence-industry/article71388248.ece","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Adgully.com","pais":"India","titulo":"Ministry of Information and Broadcasting Calls for Synergy Between Center and States to Boost Creative Economy","resumo":"India's Ministry of Information and Broadcasting has advocated for greater cooperation between central and state governments to leverage the creative economy.\nThe focus involves supporting the gaming, digital media, audiovisual, and tech-driven content creation industries.\nThe strategy aims to transform the national creative ecosystem into a major driver of economic growth and innovation.","link":"https://www.adgully.com/post/19731/mib-calls-for-centre-state-synergy-to-boost-indias-creative-economy","categoria":"TRENDS","lang":"en"},{"fonte":"Deccan Chronicle","pais":"India","titulo":"India Asks UN Security Council to Protect Food Trade Amid Conflicts","resumo":"India made a formal appeal at the UN Security Council requesting safeguards for global food supply chains.\nThe Indian delegation pointed out that recent geopolitical conflicts are threatening the food security of vulnerable populations worldwide.\nThe stance highlights the importance of keeping trade routes for essential agricultural inputs open.","link":"https://www.deccanchronicle.com/nation/india-urges-un-security-council-to-protect-food-trade-amid-conflicts-1982379","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"DD News","pais":"India","titulo":"India and Seychelles Step Up Cooperation in Fisheries, Aquaculture, and Blue Economy","resumo":"The governments of India and Seychelles have sealed an agreement to strengthen mutual collaboration in aquaculture and sustainable marine management.\nThe partnership focuses on the application of biological monitoring technologies and the conscious exploration of Indian Ocean resources.\nThe initiative aims to promote the blue economy while protecting fragile ecosystems from environmental threats.","link":"https://ddnews.gov.in/en/india-seychelles-step-up-cooperation-in-fisheries-aquaculture-and-blue-economy/","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"News18","pais":"India","titulo":"Indian Economy Shows Resilience Despite US Tariffs and Geopolitical Risks, Says Central Bank","resumo":"India's Central Bank released a report highlighting the country's economic resilience amid a backdrop of global uncertainties.\nEven while facing US trade tariffs and geopolitical tensions, development and innovation indicators maintain a positive trajectory.\nThe document reinforces the stability of Indian macroeconomic fundamentals in the face of turbulence in the external market.","link":"https://www.news18.com/business/economy/indian-economy-showing-resilience-despite-us-tariffs-geopolitical-risks-says-rbi-ws-l-10293578.html","categoria":"ECONOMY","lang":"en"},{"fonte":"Leak.pt","pais":"Portugal","titulo":"Lidl Transforms into Tech Store for Back-to-School Season (with items starting at €1.39)","resumo":"Supermarket chain Lidl has launched a special back-to-school campaign focusing on tech products.\nThe selection ranges from basic student accessories to affordable electronic devices with prices starting at 1.39 euros.\nThe initiative seeks to attract consumers looking to equip their children with digital tools without breaking the budget.\nThe strategy reinforces the brand's presence in the low-cost utility and gadget market in Portugal.","link":"https://www.leak.pt/regresso-as-aulas-lidl/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"4gnews","pais":"Portugal","titulo":"Revolut Aims to Prevent Money Theft with New Security Technology","resumo":"Fintech Revolut has announced the development of a new technological feature aimed at protecting its users' financial security.\nThe tool uses advanced artificial intelligence systems to detect suspicious transactions and potential scams in real time.\nThe main objective is to curb the rise of digital fraud and ensure greater integrity for clients' bank accounts.\nThe initiative comes in response to the rise of cyberattacks and social engineering focused on payment apps.","link":"https://4gnews.pt/revolut-quer-impedir-que-te-roubem-dinheiro-com-esta-nova-tecnologia/","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"Marketeer","pais":"Portugal","titulo":"DAZN to Give Prizes to Fans Who Watch the Most Sports Broadcasts","resumo":"Sports streaming platform DAZN has announced a new rewards program to engage its subscribers.\nUsers who accumulate the most hours watching sports event broadcasts will be able to compete for exclusive prizes.\nThe strategy uses gamification elements to encourage loyalty and increase platform viewership.\nThe new feature promises to transform the digital sports consumption experience by rewarding fans' attendance.","link":"https://marketeer.sapo.pt/dazn-transforma-tempo-de-ecra-em-premios-e-vai-recompensar-os-fas-que-virem-mais-desporto/","categoria":"STREAMING","lang":"en"},{"fonte":"Médio Tejo","pais":"Portugal","titulo":"Constância Ciência Viva Center Invites Public to Observe Partial Lunar Eclipse","resumo":"The Constância Ciência Viva Center has organized a special public event to observe a partial lunar eclipse.\nThe initiative features specialized telescopes and guidance from astronomers to explain the cosmic phenomenon to visitors.\nThe goal is to promote scientific outreach and spark the community's interest in astronomical events.\nThe gathering promises to provide a unique educational experience for astronomy enthusiasts and families in the region.","link":"https://mediotejo.net/centro-ciencia-viva-de-constancia-convida-a-observar-eclipse-parcial-da-lua/","categoria":"ASTRONOMY","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"Technology and Power: The Nobel Prize in Economics and the Pope","resumo":"An in-depth debate analyzes the intersections between technological advancement, economic power, and global ethical concerns.\nThe discussion connects the theoretical perspectives of Nobel laureates in Economics to moral warnings issued by the Pope.\nThe main focus is on the consequences of automation and artificial intelligence on human labor and social inequality.\nThe reflection proposes a more humanistic approach to the development of new technologies on the international stage.","link":"https://www.publico.pt/2026/08/25/ciencia/opiniao/tecnologia-nobel-economia-papa-2185958","categoria":"INNOVATION","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;
