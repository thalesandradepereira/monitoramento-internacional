  const data = [{"fonte":"O GLOBO","pais":"Brasil","titulo":"Apple anuncia chip M6 com tecnologia inédita para IA e arquitetura de 2 nanômetros","resumo":"A Apple apresentou oficialmente os detalhes da nova geração de processadores M6, projetada com litografia avançada de 2 nanômetros.\nO novo componente traz inovações focadas no processamento local de inteligência artificial, visando aumentar o desempenho e a eficiência.\nA tecnologia promete revolucionar os próximos dispositivos da marca, posicionando a empresa na vanguarda do hardware para IA.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/25/apple-anuncia-chip-m6-com-tecnologia-inedita-para-ia-conheca-a-arquitetura-de-2-nanometros.ghtml","categoria":"HARDWARE","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Embraer certifica jato executivo capaz de pousar sozinho","resumo":"A Embraer alcançou uma marca histórica na aviação ao obter a certificação para o seu novo jato executivo capaz de pousar sozinho.\nA aeronave destaca-se também por ser a mais veloz e com maior alcance de sua categoria no mercado global.\nO avanço consolida a engenharia brasileira no topo da inovação aeroespacial e de sistemas autônomos de navegação.","link":"https://g1.globo.com/economia/noticia/2026/08/25/embraer-certifica-jato-que-pousa-sozinho-modelo-e-o-mais-veloz-e-de-maior-alcance-do-mundo.ghtml","categoria":"AVIAÇÃO","lang":"pt"},{"fonte":"Consultor Jurídico","pais":"Brasil","titulo":"TSE endurece regras contra uso ilícito de Inteligência Artificial em campanhas políticas","resumo":"O Tribunal Superior Eleitoral (TSE) sinalizou tolerância zero diante da utilização indevida de inteligência artificial nas campanhas.\nA medida busca coibir deepfakes, desinformação e ataques virtuais direcionados durante o período de propaganda eleitoral.\nCom a decisão, a Justiça Eleitoral impõe limites rigorosos às novas tecnologias para garantir a integridade do processo democrático.","link":"https://conjur.com.br/2026-ago-25/uso-ilicito-da-ia-afasta-afasta-tolerancia-do-tse-a-critica-politica-na-campanha/","categoria":"REGULAÇÃO","lang":"pt"},{"fonte":"Portal da Assembleia Legislativa de Minas Gerais","pais":"Brasil","titulo":"Cientistas defendem criação de Centro de Inteligência e Tecnologia em Terras Raras","resumo":"Pesquisadores brasileiros apresentaram uma proposta para criar um centro especializado na tecnologia de terras raras.\nEsses minerais críticos são fundamentais para a fabricação de componentes eletrônicos, turbinas eólicas e baterias.\nA iniciativa busca garantir soberania científica e tecnológica ao país no desenvolvimento da transição energética global.","link":"https://www.almg.gov.br/comunicacao/noticias/arquivos/Cientistas-defendem-criacao-de-Centro-de-Inteligencia-e-Tecnologia-em-Terras-Raras/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Valor Econômico","pais":"Brasil","titulo":"Avanço regulatório coloca o Brasil entre os líderes mundiais na adoção de ativos digitais","resumo":"A combinação de regras claras e forte adesão popular impulsionou o Brasil entre os líderes mundiais em ativos digitais.\nA segurança jurídica proporcionada pelas regulamentações atrai grandes empresas globais e estimula o mercado financeiro.\nO cenário consolida o ecossistema brasileiro como um terreno inovador e pioneiro no uso da tecnologia blockchain.","link":"https://valor.globo.com/google/amp/financas/video/regulacao-e-paixao-por-tecnologia-poem-brasil-entre-os-maiores-do-mundo-na-adocao-de-ativo-14900732.ghtml","categoria":"FINTECH","lang":"pt"},{"fonte":"www.gov.br","pais":"Brasil","titulo":"Ministério da Ciência e Tecnologia explica os detalhes do último Eclipse Lunar de 2026","resumo":"O Ministério da Ciência, Tecnologia e Inovação divulgou explicações sobre o último eclipse lunar do ano de 2026.\nEspecialistas detalharam os fenômenos mecânicos e ópticos envolvidos durante o alinhamento dos corpos celestes.\nA divulgação do órgão governamental busca aproximar a população dos conhecimentos fundamentais da astronomia moderna.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/o-ultimo-eclipse-lunar-de-2026-a-ciencia-explica","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"VEJA","pais":"Brasil","titulo":"Porsche vende divisão de tecnologia por 320 milhões de euros","resumo":"A fabricante Porsche concluiu a venda de seu braço de inovação tecnológica por cerca de 320 milhões de euros.\nA transação faz parte da estratégia de reestruturação do grupo para otimizar investimentos e fluxo de caixa.\nOs recursos obtidos serão direcionados ao fortalecimento dos projetos de frota elétrica e software veicular.","link":"https://veja.abril.com.br/coluna/faria-lima-news/porsche-vende-braco-de-tecnologia-por-320-milhoes-de-euros/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Lego aposta em integração tecnológica nos blocos de montar para manter crescimento","resumo":"A Lego anunciou lançamentos que incorporam sensores e recursos interativos aos tradicionais blocos de plástico.\nA estratégia visa unir a experiência de brincar físico às tecnologias digitais para engajar o público jovem.\nCom a inovação, a multinacional pretende sustentar sua posição de liderança no dinâmico mercado de brinquedos.","link":"https://www1.folha.uol.com.br/mercado/2026/08/lego-aposta-em-blocos-com-tecnologia-e-novos-produtos-para-manter-crescimento.shtml","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"PR Newswire","pais":"Estados Unidos","titulo":"Abbott recebe autorização da FDA para a primeira tecnologia de sensor duplo de glicose e cetona do mundo","resumo":"A empresa de saúde Abbott obteve autorização da FDA para o primeiro sensor contínuo do mundo capaz de monitorar glicose e cetonas simultaneamente.\nA inovação é voltada para pessoas com diabetes, permitindo o alerta precoce contra complicações graves como a cetoacidose diabética.\nO avanço representa um grande marco para a tecnologia médica ao integrar múltiplos biossensores em um único dispositivo vestível.\nCom essa aprovação, a tecnologia promete transformar o gerenciamento diário da saúde de milhões de pacientes nos Estados Unidos.","link":"https://www.prnewswire.com/news-releases/abbott-receives-fda-authorization-for-worlds-first-dual-glucose-ketone-sensing-technology-for-people-with-diabetes-302859742.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"SZ.de","pais":"Estados Unidos","titulo":"SpaceX planeja gigantesco centro de lançamento de foguetes de 100 bilhões de dólares na Louisiana","resumo":"A SpaceX está projetando a construção de um novo e massivo complexo de lançamentos espaciais no estado da Louisiana, avaliado em 100 bilhões de dólares.\nO empreendimento visa expandir significativamente a capacidade operacional da empresa para futuras missões orbitais e interplanetárias.\nA infraestrutura de grande escala promete impulsionar a economia local e consolidar ainda mais a liderança americana na exploração espacial privada.\nO projeto representa um dos maiores investimentos privados na história da indústria aeroespacial global.","link":"https://www.sueddeutsche.de/wirtschaft/space-x-elon-musk-weltall-starlink-li.3537234","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"Imagem do Dia da NASA: Telescópio James Webb captura a Nebulosa Cabeça de Leão","resumo":"O Telescópio Espacial James Webb registrou detalhes impressionantes da Nebulosa Cabeça de Leão em uma nova imagem divulgada pela NASA.\nAs observações em infravermelho revelam estruturas de poeira e formações estelares anteriormente ocultas por nuvens cósmicas densas.\nOs dados coletados ajudam os astrônomos a compreender melhor os processos de nascimento de estrelas e a evolução de galáxias distantes.\nA imagem destaca a capacidade sem precedentes do observatório espacial de mapear o universo profundo em altíssima resolução.","link":"https://science.nasa.gov/image-article/apod-2026-august-26-jwst-images-the-lions-head-nebula/","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"MIT Energy Initiative","pais":"Estados Unidos","titulo":"Mantel Capture demonstra sua inovadora tecnologia de captura de carbono em escala comercial","resumo":"A startup Mantel Capture alcançou um marco significativo ao demonstrar com sucesso sua tecnologia de captura de carbono em escala comercial.\nO sistema utiliza sais fundidos para reter emissões industriais com eficiência energética muito superior às soluções tradicionais.\nEssa inovação reduz drasticamente os custos operacionais do processo, viabilizando a descarbonização de indústrias de difícil mitigação.\nO avanço coloca a tecnologia da empresa como uma peça-chave no combate às mudanças climáticas globais.","link":"https://energy.mit.edu/news/mantel-capture-demonstrates-its-novel-carbon-capture-technology-at-commercial-scale/","categoria":"TECNOLOGIA AMBIENTAL","lang":"pt"},{"fonte":"G1","pais":"Estados Unidos","titulo":"Dona do Instagram sabia de falhas em recursos de segurança para menores, indicam testemunhas em processo nos EUA","resumo":"Depoimentos em um processo judicial de grande repercussão nos EUA revelaram que a Meta estava ciente da ineficácia de suas ferramentas de proteção a jovens.\nTestemunhas afirmam que executivos ignoraram alertas internos sobre falhas no sistema desenhado para proteger adolescentes no Instagram.\nO julgamento intensifica o debate regulatório sobre o impacto das redes sociais na saúde mental de crianças e adolescentes.\nA ação pode resultar em novas obrigações legais e rigorosas sanções financeiras para as grandes empresas de tecnologia.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/25/dona-do-instagram-sabia-de-falhas-em-recursos-para-proteger-menores-de-idade-dizem-testemunhas-em-processo-nos-eua.ghtml","categoria":"REDES SOCIAIS","lang":"pt"},{"fonte":"NVIDIA Blog","pais":"Estados Unidos","titulo":"Grandes distribuidoras levam jogos de peso e novas tecnologias para o NVIDIA RTX Spark","resumo":"Principais publicadoras da indústria de jogos anunciaram a chegada de títulos de peso para o ecossistema NVIDIA RTX Spark.\nA integração traz recursos avançados de traçado de raios (ray tracing) e aprimoramento por inteligência artificial para computadores pessoais.\nO movimento reforça a posição da NVIDIA na liderança do mercado de gráficos computacionais e processamento de IA para jogos.\nDesenvolvedores se beneficiarão de ferramentas aperfeiçoadas para entregar experiências visuais mais imersivas aos jogadores.","link":"https://blogs.nvidia.com/blog/gamescom-rtx-spark-pc-games-technology/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"Um mundo em mudança para os pinguins-imperadores","resumo":"Estudos recentes revelam os crescentes desafios enfrentados pelas colônias de pinguins-imperadores devido às transformações no gelo marinho da Antártida.\nA diminuição acelerada das plataformas de gelo compromete os ciclos reprodutivos e a sobrevivência dos filhotes da espécie.\nCientistas destacam a necessidade urgente de monitoramento e de estratégias globais de conservação para proteger esses animais.\nA pesquisa serve como um alerta crítico sobre os impactos diretos do aquecimento global nos ecossistemas polares.","link":"https://science.nasa.gov/earth/earth-observatory/a-changing-world-for-emperor-penguins/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ANI News","pais":"Estados Unidos","titulo":"Securis360 acelera crescimento global em cibersegurança com expansão nos EUA e novas tecnologias de privacidade","resumo":"A Securis360 anunciou a expansão de suas operações nos Estados Unidos acompanhada do lançamento de novas soluções de privacidade de dados.\nA empresa conquistou importantes clientes corporativos ao integrar alianças tecnológicas estratégicas no setor de segurança digital.\nAs ferramentas aprimoradas visam proteger redes empresariais contra ameaças cibernéticas cada vez mais complexas e sofisticadas.\nA iniciativa fortalece a presença da companhia no mercado americano, que demanda constantemente inovações em defesa cibernética.","link":"https://www.aninews.in/news/business/securis360-accelerates-global-cybersecurity-growth-with-us-expansion-enterprise-customer-wins-strategic-technology-alliances-and-new-privacy-technology20260826102526","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"La République des Pyrénées","pais":"França","titulo":"Quais são as duas idades em que seu corpo envelhece repentinamente, segundo a ciência?","resumo":"Estudos científicos recentes revelaram que o envelhecimento humano não ocorre de forma linear ao longo da vida.\nEm vez disso, o corpo passa por duas grandes ondas drásticas de transformações biomoleculares, ocorrendo por volta dos 44 e dos 60 anos.\nA descoberta altera a compreensão sobre doenças relacionadas à idade e pode transformar estratégias de medicina preventiva.","link":"https://www.larepubliquedespyrenees.fr/societe/vie-quotidienne/quels-sont-les-deux-ages-ou-votre-corps-vieillit-subitement-d-apres-la-science-30314640.php","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ARTE Radio","pais":"França","titulo":"Éric Clua investiga os tubarões / Tecnologia: a França está ficando para trás?","resumo":"O especialista e pesquisador Éric Clua conduz investigações detalhadas sobre o comportamento e a preservação dos tubarões.\nAo mesmo tempo, especialistas analisam o ecossistema de inovação francês e a competitividade do país na corrida tecnológica global.\nA discussão levanta alertas sobre o risco de a França perder espaço para outras potências em investimentos estratégicos de ponta.","link":"https://www.arteradio.com/son/eric-clua-un-mordu-de-requins-enquete-technologie-la-france-decrochee","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Aerobuzz","pais":"França","titulo":"Helios Horizon faz voar uma tecnologia que pode mudar a aviação elétrica!","resumo":"A empresa Helios Horizon realizou testes bem-sucedidos com um novo sistema revolucionário para aeronaves elétricas.\nO avanço promete solucionar gargalos históricos de eficiência energética e autonomia na aviação sustentável.\nCom o marco histórico, a tecnologia surge como uma forte candidata a acelerar a descarbonização do setor aéreo.","link":"https://www.aerobuzz.fr/breves-aviation-generale/helios-horizon-fait-voler-une-technologie-qui-pourrait-changer-laviation-electrique/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Le Revenu","pais":"França","titulo":"Alemanha: economia avança um pouco mais rápido do que o anunciado","resumo":"Os indicadores econômicos da Alemanha mostraram um desempenho superior às projeções iniciais apresentadas pelos analistas.\nO avanço do Produto Interno Bruto traz sinais de recuperação gradual para a maior economia do bloco europeu.\nO resultado oferece um fôlego positivo ao mercado diante do cenário de volatilidade e pressões inflacionárias na região.","link":"https://www.lerevenu.com/reussir-bourse/avis-des-pros/allemagne-l-economie-progresse-un-peu-plus-rapidem/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Preocupação com o impacto dos cortes de £ 162 milhões em pesquisas científicas","resumo":"Comunidades científicas no Reino Unido expressaram profunda preocupação em relação aos cortes orçamentários previstos para financiamento de pesquisas no país. A redução drástica de investimentos pode comprometer projetos essenciais em universidades e centros de inovação tecnológica. Especialistas alertam que a medida ameaça diretamente a posição de liderança global do Reino Unido no desenvolvimento científico.","link":"https://www.bbc.com/news/articles/cr4v0n3z16ko","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"HuffPost UK","pais":"Inglaterra","titulo":"Plano do partido Reform UK de abolir o GDPR é classificado como inviável e irresponsável","resumo":"A proposta de um partido político do Reino Unido para revogar as leis de proteção de dados do GDPR gerou fortes críticas de especialistas do setor tecnológico. Críticos argumentam que a eliminação dessas regulamentações comprometeria a privacidade dos cidadãos e criaria forte insegurança jurídica para empresas digitais. Além disso, a medida poderia isolar o país das redes internacionais de transferência segura de dados.","link":"https://www.huffingtonpost.co.uk/entry/reform-uk-gdpr-laws-nigel-farage_uk_6a8dae6fe4b07583705b7d3d?ncid=NEWSSTAND0001","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"R7","pais":"Inglaterra","titulo":"Reino Unido concede à Ucrânia acesso a tecnologia secreta de mísseis","resumo":"O governo do Reino Unido autorizou o compartilhamento de sistemas tecnológicos e de navegação avançados de mísseis com as forças armadas ucranianas. A iniciativa visa aumentar significativamente a precisão e a eficácia das defesas estratégicas no conflito em andamento. Analistas debatem o impacto tático real dessa transferência no equilíbrio de poder e na infraestrutura de defesa regional.","link":"https://noticias.r7.com/internacional/reino-unido-esta-dando-a-ucrania-acesso-a-tecnologia-secreta-de-misseis-isso-fara-diferenca-26082026/","categoria":"TECNOLOGIA MILITAR","lang":"pt"},{"fonte":"Nature","pais":"Inglaterra","titulo":"Esculpindo luz não-hermitiana no contínuo","resumo":"Cientistas demonstraram uma nova metodologia para manipular sistemas ópticos e estados de luz não-hermitianos dentro do contínuo quântico. O trabalho expande a compreensão teórica sobre perda e ganho de energia controlados em dispositivos fotônicos avançados. O avanço promete viabilizar a criação de lasers ultraprecisos e sensores ópticos com sensibilidade sem precedentes.","link":"https://www.nature.com/articles/s41377-026-02450-y","categoria":"FÍSICA","lang":"pt"},{"fonte":"Nature","pais":"Inglaterra","titulo":"Quasi-BICs ativados eletricamente em metacamadas usando semicondutores atomicamente finos","resumo":"Pesquisadores desenvolveram um avanço em superfícies ópticas e semicondutores de espessura atômica capazes de manipular a luz com altíssima precisão. A ativação elétrica de modos quase-BIC permite o controle dinâmico da emissão óptica e do processamento de sinal fotônico. Essa descoberta abre caminho para dispositivos optoeletrônicos miniaturizados e novos componentes de comunicação quântica.","link":"https://www.nature.com/articles/s41377-026-02451-x","categoria":"NANOTECNOLOGIA","lang":"pt"},{"fonte":"Nature","pais":"Inglaterra","titulo":"Integração da geração e análise de polarização em um único chip fotônico","resumo":"Uma nova arquitetura de microchip fotônico conseguiu unificar as etapas de geração e análise de polarização da luz em uma plataforma integrada. Essa inovação reduz drasticamente a complexidade do hardware e aumenta a velocidade de processamento de dados ópticos. A tecnologia promete impactar a infraestrutura de telecomunicações de alta velocidade e sistemas de sensoriamento.","link":"https://www.nature.com/articles/s41377-026-02447-7","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Dezeen","pais":"Inglaterra","titulo":"Novas estações de trabalho da Dell aproximam conceitos de design e apresentações finais","resumo":"A Dell lançou sua mais recente linha de estações de trabalho voltadas para profissionais de criação, engenharia e renderização em tempo real. Os novos sistemas trazem avanços significativos no processamento gráfico e computacional para acelerar fluxos de trabalho complexos. A solução visa eliminar a lacuna de desempenho entre a fase inicial de projeto e a entrega de resultados interativos ao cliente.","link":"https://www.dezeen.com/2026/08/26/dell-workstations-ai-visualisation-real-time-design/","categoria":"HARDWARE","lang":"pt"},{"fonte":"Yahoo Finance UK","pais":"Inglaterra","titulo":"Capra Sports lança ferramenta gratuita de design de uniformes com IA aplicável a peças reais","resumo":"A empresa Capra Sports apresentou uma ferramenta gratuita baseada em inteligência artificial para a criação de uniformes esportivos customizados. Diferente de modelos genéricos convencionais, a tecnologia gera simulações hiper-realistas diretamente sobre tecidos e peças físicas. A novidade otimiza a etapa de pré-produção e democratiza o design de vestuário técnico para equipes esportivas.","link":"https://uk.finance.yahoo.com/news/capra-sports-launches-free-ai-203800957.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"OkDiario","pais":"Espanha","titulo":"Cientistas alertam: as 4 estações do ano na Terra vão desaparecer e não estamos preparados","resumo":"Cientistas alertam para as profundas alterações climáticas globais que estão desestabilizando os padrões sazonais tradicionais do planeta. O fenômeno ameaça erradicar a divisão clara entre as quatro estações, provocando eventos meteorológicos extremos recorrentes. Essa transformação drástica impacta diretamente a agricultura, a biodiversidade e a segurança alimentar global, revelando a falta de preparação das sociedades para enfrentar este cenário iminente.","link":"https://okdiario.com/ciencia/cientificos-avisan-4-estaciones-del-ano-tierra-van-desaparecer-no-estamos-preparados-20169530","categoria":"CLIMA","lang":"pt"},{"fonte":"La Vanguardia","pais":"Espanha","titulo":"A IA já escreve a ciência? Estudo detecta seus traços em quase 9 de cada 10 artigos biomédicos","resumo":"Uma nova pesquisa revelou que ferramentas de inteligência artificial estão sendo amplamente utilizadas na redação de artigos acadêmicos na área biomédica. Os rastros do uso de IA foram identificados em quase 90% das publicações analisadas, levantando debates éticos na comunidade científica. O achado levanta preocupações sobre a integridade, a autoria e a necessidade de regulamentações estritas para a publicação científica do futuro.","link":"https://www.lavanguardia.com/neo/ia/20260826/11619668/ia-escribe-ciencia-estudio-detecta-huellas-9-10-articulos-biomedicos-epm.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"La Razón","pais":"Espanha","titulo":"O telescópio James Webb localiza três buracos negros ativos em uma galáxia de 12,5 bilhões de anos e prevê sua futura fusão","resumo":"O Telescópio Espacial James Webb fez uma descoberta astronômica impressionante ao detectar três buracos negros supermassivos ativos na mesma galáxia ancestral. O sistema, localizado a 12,5 bilhões de anos-luz de distância, está em processo de interação e caminha para uma fusão tripla inédita. As observações fornecem dados valiosos sobre a evolução inicial das galáxias e a formação de estruturas gigantescas no universo primordial.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/telescopio-james-webb-localiza-tres-agujeros-negros-activos-galaxia-hace-12500-millones-anos-anticipa-su-futura-fusion_202608266a8e080dd16f7635049d0acd.html","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"El Periódico","pais":"Espanha","titulo":"Os resultados da Nvidia podem movimentar na Bolsa o equivalente à economia grega","resumo":"A divulgação dos resultados financeiros da Nvidia tornou-se um dos eventos mais decisivos para o mercado financeiro global. O impacto projetado de suas ações pode movimentar centenas de bilhões de dólares, superando o Produto Interno Bruto de países como a Grécia. Esse movimento reflete o papel central da empresa na corrida da inteligência artificial e a alta dependência de Wall Street do setor de tecnologia.","link":"https://www.elperiodico.com/es/economia/20260826/resultados-nvidia-mover-bolsa-equivalente-133659122","categoria":"MERCADO TECH","lang":"pt"},{"fonte":"Artículo 14","pais":"Espanha","titulo":"Setembro é um dos piores meses para crianças com asma: a ciência explica o que ocorre na volta às aulas","resumo":"Estudos científicos explicam por que o mês de setembro registra um aumento expressivo nas crises astmáticas pediátricas. A combinação do retorno ao ambiente escolar, maior exposição a vírus respiratórios e variações térmicas favorece o aumento de internações hospitalares. Especialistas enfatizam a importância do acompanhamento médico prévio para prevenir complicações e proteger a saúde das crianças durante esse período crítico.","link":"https://www.articulo14.es/salud/septiembre-es-uno-de-los-peores-meses-para-los-ninos-con-asma-la-ciencia-explica-que-ocurre-al-volver-al-colegio-20260826.html","categoria":"SAÚDE","lang":"pt"},{"fonte":"El Mundo","pais":"Espanha","titulo":"Sycai, tecnologia espanhola para curar o câncer de pâncreas: \"Quando os primeiros sintomas aparecem, já é tarde demais\"","resumo":"A startup espanhola Sycai desenvolveu uma tecnologia de inteligência artificial focada na detecção precoce do câncer de pâncreas. Ao analisar exames de imagem e identificar lesões antes do surgimento dos sintomas clínicos, a ferramenta busca aumentar drasticamente as taxas de sobrevivência dos pacientes. A inovação representa um avanço crucial contra uma das formas mais letais de tumor na medicina atual.","link":"https://www.elmundo.es/economia/empresas/2026/08/25/6a883101e9cf4ad6578b4586.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"El Mundo","pais":"Espanha","titulo":"O mundo reordenado pela tecnologia: a IA e a Europa","resumo":"A ascensão acelerada da inteligência artificial está redefinindo o equilíbrio geopolítico e econômico global, colocando a Europa em uma posição desafiadora. O continente busca equilibrar uma regulamentação rigorosa voltada à ética e privacidade com a necessidade urgente de fomentar a inovação e competitividade. O cenário atual exige estratégias claras para evitar a dependência tecnológica em relação aos Estados Unidos e à China.","link":"https://www.elmundo.es/opinion/2026/08/25/6a872f7cfdddff0d338b45a5.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"El Confidencial","pais":"Espanha","titulo":"Reino Unido afirma ter desenvolvido tecnologia que converte plástico de uso único contaminado em plástico reciclável","resumo":"Pesquisadores no Reino Unido anunciaram um avanço tecnológico capaz de transformar resíduos plásticos contaminados e não recicláveis em matéria-prima reaproveitável. O processo inovador supera grandes limitações da reciclagem tradicional, permitindo tratar plásticos de uso único que antes iriam para aterros ou oceanos. A solução promete impactar positivamente a economia circular e mitigar a crise ambiental global do lixo plástico.","link":"https://www.elconfidencial.com/tecnologia/ciencia/2026-08-25/reino-unido-tecnologia-plastico-un-solo-uso-reciclable-1qrt_4409580/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"euractiv.com","pais":"Alemanha","titulo":"Trabalhadores da Volkswagen vaiam chefe durante discurso sobre cortes de empregos","resumo":"Durante um discurso sobre reestruturação e planos de contenção de custos na Alemanha, executivos da Volkswagen enfrentaram fortes protestos.\nMilhares de funcionários demonstraram insatisfação com a possibilidade de fechamento de fábricas e demissões em massa.\nA crise reflete os desafios enfrentados pela gigante automotiva na transição para veículos elétricos e concorrência global.\nO clima de tensão evidencia a pressão crescente sobre o setor industrial alemão no atual cenário econômico.","link":"https://www.euractiv.com/news/volkswagen-workers-boo-boss-during-speech-on-job-cuts/","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"Deutschlandfunk","pais":"Alemanha","titulo":"Reunião do Gabinete: Setor econômico alerta para atraso em Inteligência Artificial","resumo":"Líderes da indústria e do setor econômico alemão emitiram um alerta urgente ao governo sobre o atraso do país em Inteligência Artificial.\nDurante o retiro do gabinete ministerial, foram cobrados maiores investimentos e redução da burocracia para incentivar a inovação tecnológica.\nEspecialistas apontam que a falta de infraestrutura digital adequada pode comprometer a competitividade das empresas alemãs no cenário global.\nA pressão aumenta para que medidas regulatórias e de apoio financeiro sejam implementadas rapidamente.","link":"https://www.deutschlandfunk.de/wirtschaft-warnt-vor-rueckstaendigkeit-bei-kuenstlicher-intelligenz-100.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"ZDFheute","pais":"Alemanha","titulo":"Retiro do Gabinete: Economia no centro das atenções","resumo":"O governo alemão se reuniu em um retiro de gabinete focado em estratégias para impulsionar a economia do país.\nEm meio a incertezas globais e desaceleração industrial, o foco principal do encontro foi criar estímulos para investimentos privados.\nMedidas para desburocratização, transição energética e modernização digital estiveram no topo da pauta das discussões ministeriais.\nO resultado do encontro deve definir as diretrizes econômicas e de inovação da Alemanha para os próximos anos.","link":"https://www.zdfheute.de/video/heute-journal/ferber-kabinettsklausur-wirtschaft-100.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"ZDFheute","pais":"Alemanha","titulo":"Economia alemã volta a crescer","resumo":"Indicadores recentes apontam uma recuperação inesperada e novo crescimento na atividade econômica da Alemanha.\nO avanço traz alívio após períodos de estagnação e receios de uma recessão prolongada na maior economia da Europa.\nContudo, analistas ressaltam que desafios estruturais e custos de energia elevados ainda exigem cautela a longo prazo.\nA retomada do consumo interno e exportações foram fatores decisivos para o desempenho positivo do trimestre.","link":"https://www.zdfheute.de/video/heute-journal/sgs-hayali-boerse-102.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Newscast.jp","pais":"Japão","titulo":"Avanços em IA Física Aceleram a Transformação Digital de Trabalhadores da Linha de Frente","resumo":"Uma nova iniciativa combina IA de imagem, IA de voz e modelos de linguagem visual para acelerar a IA física.\nA tecnologia busca aprimorar o monitoramento e o suporte em tempo real para equipes operacionais de campo.\nEssa abordagem visa impulsionar a transformação digital dos trabalhadores na linha de frente de diversos setores.","link":"https://newscast.jp/smart/news/9674146","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Helical Fusion","pais":"Japão","titulo":"Pesquisa sobre Ímãs Supercondutores de Alta Temperatura Alcança Marco Histórico","resumo":"Estudos em tecnologias de ímãs supercondutores de alta temperatura alcançaram um marco publicado internacionalmente.\nO avanço representa um passo técnico essencial para a consolidação de sistemas energéticos mais eficientes.\nA inovação abre caminho para aplicações práticas em fusão nuclear e dispositivos de alta precisão.","link":"https://www.helicalfusion.com/post/helical-fusion%E3%80%81%E9%AB%98%E6%B8%A9%E8%B6%85%E4%BC%9D%E5%B0%8E%E3%83%9E%E3%82%B0%E3%83%8D%E3%83%83%E3%83%88%E6%8A%80%E8%A1%93%E3%81%AE%E9%87%8D%E8%A6%81%E3%83%9E%E3%82%A4%E3%83%AB%E3%82%B9%E3%83%88%E3%83%BC%E3%83%B3%E3%81%AB%E9%96%A2%E3%81%99%E3%82%8B%E5%85%B1%E5%90%8C%E7%A0%94%E7%A9%B6%E6%88%90%E6%9E%9C%E3%81%8C%E5%9B%BD%E9%9A%9B%E5%AD%A6%E8%A1%93%E8%AA%8C%E3%81%AB%E6%8E%B2%E8%BC%89","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"EE Times Japan","pais":"Japão","titulo":"Universidade de Osaka Desenvolve Comunicação Sem Fio de Alta Velocidade para Dispositivos Médicos Ingeríveis","resumo":"Pesquisadores da Universidade de Osaka otimizaram a forma de onda de Banda Ultralarga para dispositivos ingeríveis.\nA nova tecnologia permite a transmissão rápida e eficiente de dados biométricos de dentro do corpo humano.\nO avanço promete revolucionar diagnósticos médicos ao viabilizar o monitoramento interno de alta resolução.","link":"https://eetimes.itmedia.co.jp/ee/articles/2608/26/news026.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Agência Japonesa Utiliza Tecnologia Nuclear para Extrair Terras Raras de Minas Urbanas","resumo":"A Agência de Energia Atômica do Japão desenvolveu um método para extrair terras raras de lixo eletrônico.\nA técnica adapta processos de reprocessamento de combustível nuclear para aplicar em minas urbanas.\nA solução impulsiona a reciclagem sustentável e reduz a dependência de importações industriais críticas.","link":"https://www.nikkei.com/article/DGXZQOSG013JI0R00C26A7000000/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"Startup elleThermo Capta 830 Milhões de Ienes para Gerar Energia a Partir de Calor Residual","resumo":"A startup elleThermo garantiu 830 milhões de ienes em uma rodada de financiamento da Série A.\nA empresa desenvolve sistemas focados na conversão de calor residual não utilizado em energia elétrica limpa.\nO investimento acelerará a comercialização da tecnologia para aumentar a eficiência energética industrial.","link":"https://prtimes.jp/main/html/rd/p/000000011.000120229.html","categoria":"ENERGIA","lang":"pt"},{"fonte":"Newscast.jp","pais":"Japão","titulo":"Mercado de Robôs Agrícolas Guiados por IA Deve Atingir 55 Bilhões de Dólares até 2035","resumo":"O setor de robótica agrícola projeta atingir 55 bilhões de dólares até 2035 impulsionado pela inteligência artificial.\nA automação de próxima geração surge como resposta essencial para enfrentar a escassez de mão de obra no campo.\nAs soluções prometem otimizar a produtividade e a sustentabilidade no cultivo de alimentos em escala global.","link":"https://newscast.jp/smart/news/5415535","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"時事ドットコム","pais":"Japão","titulo":"Tecnologia Robótica do Japão Ganha Destaque em Pequim com Soluções de Aplicação Prática","resumo":"A robótica japonesa demonstrou forte presença na China ao integrar suas tecnologias com componentes locais.\nO foco esteve na flexibilidade de aplicação para adaptar robôs a demandas industriais complexas.\nA cooperação ressalta a competitividade do Japão no mercado de automação global.","link":"https://www.jiji.com/jc/article?k=2026082600239\u0026g=int","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"mol.co.jp","pais":"Japão","titulo":"Japão Apresentará Tecnologia de Navegação Eficiente Impulsionada por IA e Energia Eólica na COP31","resumo":"Uma tecnologia que combina força eólica, dados e inteligência artificial será apresentada pelo Japão na COP31.\nA inovação visa otimizar a rota de navios para reduzir drasticamente a emissão de carbono no transporte marítimo.\nO projeto reforça o compromisso do país com o desenvolvimento de soluções sustentáveis de próxima geração.","link":"https://www.mol.co.jp/info/article/2026/0826.html","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"Global Times","pais":"China","titulo":"China acelerará P\u0026D de tecnologia 6G visando uso comercial antes de 2030","resumo":"O Ministério da Indústria e Tecnologia da Informação da China anunciou um plano estratégico para intensificar as pesquisas na tecnologia 6G.\nO objetivo governamental é garantir a liderança global em redes móveis de altíssima velocidade e viabilizar a comercialização até o final desta década.\nA iniciativa visa integrar inteligência artificial avançada e comunicações via satélite para transformar a infraestrutura digital do país.","link":"https://www.globaltimes.cn/page/202608/1369043.shtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Al Jazeera","pais":"China","titulo":"Robô humanoide chinês Tiangong corre 100 metros em menos de 9 segundos em Pequim","resumo":"O robô humanoide Tiangong estabeleceu um novo marco histórico de velocidade ao completar a corrida de 100 metros rasos em menos de nove segundos.\nDesenvolvido em Pequim, o protótipo demonstra avanços impressionantes em equilíbrio dinâmico, atuadores elétricos e controle de movimento em tempo real.\nEste feito supera marcas humanas e consolida o protagonismo da China no desenvolvimento de robôs bípedes de altíssimo desempenho.","link":"https://www.aljazeera.com/sports/2026/8/25/chinese-robot-tiangong-clocks-sub-9-second-100-metres-in-beijing","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"中国经济网","pais":"China","titulo":"Série de foguetes Lijian alcança dois marcos inéditos no setor espacial chinês","resumo":"A linha de foguetes comerciais Lijian registrou duas conquistas inéditas em suas missões mais recentes de lançamento orbital.\nO avanço técnico representa um grande passo para a consolidação e maturidade da indústria aeroespacial privada na China.\nCom maior capacidade de carga e custos reduzidos, os novos veículos impulsionam a expansão das megaconstelações de satélites do país.","link":"http://www.ce.cn/xwzx/kj/202608/t20260826_3171440.shtml","categoria":"CIÊNCIA E ESPAÇO","lang":"pt"},{"fonte":"Boursorama","pais":"China","titulo":"Huawei e HP assinam acordo plurianual de licença cruzada de patentes Wi-Fi","resumo":"A gigante chinesa Huawei e a fabricante americana de computadores HP fecharam um amplo acordo de licenciamento de patentes focado em tecnologias Wi-Fi.\nA parceria busca encerrar disputas de propriedade intelectual e promover a interoperabilidade global entre os dispositivos das duas marcas.\nO pacto ressalta a relevância das patentes essenciais de comunicação desenvolvidas pela China no cenário corporativo internacional.","link":"https://www.boursorama.com/bourse/actualites-amp/le-chinois-huawei-et-le-fabricant-americain-d-ordinateurs-hp-signent-un-accord-pluriannuel-sur-les-brevets-wi-fi-e22c577b88b673095c7b84fb467c1dbd","categoria":"TECNOLOGIA E NEGÓCIOS","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Fórmula científica desenvolvida na China revoluciona livros didáticos internacionais","resumo":"Uma inovadora equação matemática formulada por pesquisadores chineses está sendo incorporada em livros didáticos de universidades globais.\nO avanço científico resolveu um dilema teórico histórico que exigia complexos cálculos manuais por acadêmicos ao redor do mundo.\nA descoberta destaca a crescente influência da pesquisa acadêmica chinesa no avanço do conhecimento científico fundamental.","link":"https://news.sciencenet.cn/htmlnews/2026/8/570363.shtm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"eeo.com.cn","pais":"China","titulo":"Competição entre robôs humanoides intensifica corrida por aplicação no mercado de trabalho","resumo":"As principais empresas de tecnologia da China travam uma disputa acirrada para colocar os primeiros robôs humanoides em postos de trabalho reais.\nA transição das pesquisas de laboratório para linhas de montagem industriais e serviços comerciais tornou-se a prioridade do setor.\nA expectativa é que essas máquinas autônomas comecem a suprir demandas operacionais e fabris nos próximos anos.","link":"https://www.eeo.com.cn/2026/0826/1011618.shtml","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"新京报","pais":"China","titulo":"Empresa da Huairou Science City vence competição global ao superar algoritmo para robôs agrícolas","resumo":"Uma startup sediada no polo de inovação Huairou Science City conquistou o primeiro lugar em um prestigiado torneio global de empreendedorismo.\nA conquista se deu pelo desenvolvimento bem-sucedido de algoritmos de ponta aplicados à navegação e operação de robôs na agricultura.\nO sistema permite maior precisão no manejo do campo, automatizando tarefas complexas e otimizando o rendimento das safras.","link":"https://www.bjnews.com.cn/detail/1787707997019904.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Portuguese Cri","pais":"China","titulo":"Tecnologia avançada nos campos de Shandong assegura a colheita de outono","resumo":"A implementação de máquinas agrícolas autônomas e sistemas de monitoramento via satélite garantiu o sucesso da colheita em Shandong.\nA integração de big data e sensores IoT permitiu otimizar o uso de recursos e mitigar impactos climáticos severos na região.\nA modernização tecnológica impulsiona a segurança alimentar do país e estabelece novos padrões para a agricultura digital.","link":"https://portuguese.cri.cn/2026/08/26/PHOA1787723120769194","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"IT Voice Media Pvt. Ltd.","pais":"Índia","titulo":"Sparsh CCTV Revela Visão 2027: Roteiro para IA e Tecnologia Indígena","resumo":"A Sparsh CCTV apresentou sua iniciativa Visão 2027, focada no desenvolvimento de tecnologias nacionais de vigilância e inteligência artificial.\nA empresa busca fortalecer a soberania tecnológica da Índia por meio de soluções de segurança baseadas em IA e fabricadas localmente.\nEsse plano estratégico visa impulsionar a inovação industrial e reduzir a dependência de equipamentos de vigilância estrangeiros.","link":"https://www.itvoice.in/sparsh-cctv-unveils-vision-2027-charting-the-future-of-intelligent-and-indigenous-surveillance-technology","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"The Times of India","pais":"Índia","titulo":"Em 2009, Equipe de Nandan Nilekani Enfrentou Desafio Inédito em Ciência da Computação: A História do Aadhaar","resumo":"Um panorama detalhado revela como a equipe liderada por Nandan Nilekani superou problemas complexos de ciência da computação para criar o Aadhaar.\nO sistema de identificação biométrica digital indiano precisou ser construído do zero para atender a uma população de mais de um bilhão de pessoas.\nA infraestrutura resultante tornou-se um marco global em identidade digital, engenharia de software e inclusão financeira tecnológica.","link":"https://timesofindia.indiatimes.com/education/news/in-2009-nandan-nilekanis-team-faced-a-computer-science-problem-with-no-precedent-how-aadhaar-became-a-billion-person-engineering-feat/articleshow/133530583.cms","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Indianweb2.com","pais":"Índia","titulo":"NODWIN Gaming Anuncia SpaceFest, o Primeiro Festival de Espaço, Ciência e Ficção Científica da Índia","resumo":"A NODWIN Gaming anunciou o lançamento do SpaceFest, considerado o primeiro festival dedicado à exploração espacial, ciência e ficção científica na Índia.\nO evento conta com apoio oficial do Governo de Maharashtra e promete reunir entusiastas da tecnologia, cientistas e criadores de conteúdo.\nA iniciativa busca popularizar o setor aeroespacial entre os jovens e conectar a cultura pop à inovação científica.","link":"https://www.indianweb2.com/2026/08/nodwin-gaming-announces-spacefest.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Hindu","pais":"Índia","titulo":"DRDO Transferirá Tecnologia de Mísseis para a Indústria de Defesa da Índia","resumo":"A Organização de Pesquisa e Desenvolvimento de Defesa da Índia anunciou a transferência de tecnologias de mísseis para indústrias privadas do setor.\nA iniciativa visa fortalecer a capacidade de produção nacional e incentivar a modernização tecnológica da indústria de defesa local.\nA medida reflete o esforço governamental de autossuficiência estratégica e inovação contínua no setor aeroespacial.","link":"https://www.thehindu.com/news/national/govt-approves-transfer-of-drdo-developed-missile-tech-to-indian-defence-industry/article71388248.ece","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Adgully.com","pais":"Índia","titulo":"Ministério da Informação e Radiodifusão Pede Sinergia entre Centro e Estados para Impulsionar Economia Criativa","resumo":"O Ministério da Informação e Radiodifusão da Índia defendeu maior cooperação entre os governos central e estaduais para alavancar a economia criativa.\nO foco envolve o suporte a indústrias de jogos, mídias digitais, audiovisual e criação de conteúdo tecnológico.\nA estratégia pretende transformar o ecossistema criativo nacional em um grande motor de crescimento econômico e inovação.","link":"https://www.adgully.com/post/19731/mib-calls-for-centre-state-synergy-to-boost-indias-creative-economy","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Deccan Chronicle","pais":"Índia","titulo":"Índia Pede ao Conselho de Segurança da ONU Proteção ao Comércio de Alimentos em Meio a Conflitos","resumo":"A Índia fez um apelo formal no Conselho de Segurança da ONU solicitando salvaguardas para as cadeias globais de suprimento de alimentos.\nA delegação indiana destacou que conflitos geopolíticos recentes estão ameaçando a segurança alimentar de populações vulneráveis pelo mundo.\nO posicionamento ressalta a importância de manter abertas as rotas comerciais de insumos agrícolas essenciais.","link":"https://www.deccanchronicle.com/nation/india-urges-un-security-council-to-protect-food-trade-amid-conflicts-1982379","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"DD News","pais":"Índia","titulo":"Índia e Secheles Intensificam Cooperação em Pesca, Aquacultura e Economia Azul","resumo":"Governos de Índia e Secheles fecharam um acordo para fortalecer a colaboração mútua na aquacultura e gestão marinha sustentável.\nA parceria foca na aplicação de tecnologias de monitoramento biológico e na exploração consciente dos recursos do Oceano Índico.\nA iniciativa visa promover a economia azul enquanto protege ecossistemas frágeis de ameaças ambientais.","link":"https://ddnews.gov.in/en/india-seychelles-step-up-cooperation-in-fisheries-aquaculture-and-blue-economy/","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"News18","pais":"Índia","titulo":"Economia Indiana Demonstra Resiliência Apesar de Tarifas dos EUA e Riscos Geopolíticos, Afirma Banco Central","resumo":"O Banco Central da Índia divulgou um relatório destacando a resiliência da economia do país em um cenário de incertezas globais.\nMesmo enfrentando tarifas comerciais americanas e tensões geopolíticas, os indicadores de desenvolvimento e inovação mantêm trajetória positiva.\nO documento reforça a estabilidade dos fundamentos macroeconômicos indianos perante turbulências no mercado externo.","link":"https://www.news18.com/business/economy/indian-economy-showing-resilience-despite-us-tariffs-geopolitical-risks-says-rbi-ws-l-10293578.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Leak.pt","pais":"Portugal","titulo":"Lidl se transforma em loja de tecnologia para a volta às aulas (com itens a partir de 1,39€)","resumo":"A rede de supermercados Lidl lançou uma campanha especial de volta às aulas com foco em produtos tecnológicos.\nA seleção inclui desde acessórios básicos para estudantes até dispositivos eletrônicos acessíveis com preços a partir de 1,39 euros.\nA iniciativa busca atrair consumidores que procuram equipar seus filhos com ferramentas digitais sem comprometer o orçamento.\nA estratégia reforça a presença da marca no mercado de utilidades e gadgets de baixo custo em Portugal.","link":"https://www.leak.pt/regresso-as-aulas-lidl/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"4gnews","pais":"Portugal","titulo":"Revolut quer impedir roubo de dinheiro com nova tecnologia de segurança","resumo":"A fintech Revolut anunciou o desenvolvimento de um novo recurso tecnológico voltado para a proteção financeira de seus usuários.\nA ferramenta utiliza sistemas avançados de inteligência artificial para detectar transações suspeitas e potenciais golpes em tempo real.\nO objetivo principal é conter o avanço de fraudes digitais e garantir maior integridade às contas bancárias dos clientes.\nA iniciativa surge em resposta ao aumento de ataques cibernéticos e engenharia social focados em aplicativos de pagamento.","link":"https://4gnews.pt/revolut-quer-impedir-que-te-roubem-dinheiro-com-esta-nova-tecnologia/","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"Marketeer","pais":"Portugal","titulo":"DAZN vai dar prêmios a fãs que assistirem a mais transmissões esportivas","resumo":"A plataforma de streaming esportivo DAZN anunciou um novo programa de recompensas para engajar seus assinantes.\nOs usuários que acumularem mais horas assistindo a transmissões de eventos esportivos poderão disputar prêmios exclusivos.\nA estratégia utiliza elementos de gamificação para incentivar a fidelização e aumentar a audiência na plataforma.\nA novidade promete transformar a experiência de consumo de esportes digitais ao premiar a assiduidade dos torcedores.","link":"https://marketeer.sapo.pt/dazn-transforma-tempo-de-ecra-em-premios-e-vai-recompensar-os-fas-que-virem-mais-desporto/","categoria":"STREAMING","lang":"pt"},{"fonte":"Médio Tejo","pais":"Portugal","titulo":"Centro Ciência Viva de Constância convida o público para observar eclipse parcial da Lua","resumo":"O Centro Ciência Viva de Constância organizou um evento especial aberto ao público para a observação de um eclipse parcial da Lua.\nA iniciativa conta com telescópios especializados e a orientação de astrônomos para explicar o fenômeno cósmico aos visitantes.\nO objetivo é promover a divulgação científica e despertar o interesse da comunidade por eventos astronômicos.\nO encontro promete proporcionar uma experiência educativa única para entusiastas da astronomia e famílias da região.","link":"https://mediotejo.net/centro-ciencia-viva-de-constancia-convida-a-observar-eclipse-parcial-da-lua/","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Público","pais":"Portugal","titulo":"Tecnologia e poder: o Nobel de Economia e o Papa","resumo":"Um debate aprofundado analisa as interseções entre o avanço tecnológico, o poder econômico e as preocupações éticas globais.\nA discussão conecta as perspectivas teóricas de laureados com o Prêmio Nobel de Economia aos alertas morais emitidos pelo Papa.\nO foco principal está nas consequências da automação e da inteligência artificial sobre o trabalho humano e a desigualdade social.\nA reflexão propõe uma abordagem mais humanista para o desenvolvimento de novas tecnologias no cenário internacional.","link":"https://www.publico.pt/2026/08/25/ciencia/opiniao/tecnologia-nobel-economia-papa-2185958","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Apple Announces M6 Chip with Unprecedented AI Technology and 2-Nanometer Architecture","resumo":"Apple has officially unveiled the details of its new generation of M6 processors, designed with advanced 2-nanometer lithography.\nThe new component features innovations focused on local artificial intelligence processing, aiming to boost performance and efficiency.\nThe technology promises to revolutionize the brand's upcoming devices, positioning the company at the forefront of AI hardware.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/25/apple-anuncia-chip-m6-com-tecnologia-inedita-para-ia-conheca-a-arquitetura-de-2-nanometros.ghtml","categoria":"HARDWARE","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"Embraer Certifies Executive Jet Capable of Autonomous Landing","resumo":"Embraer has achieved a historic milestone in aviation by securing certification for its new executive jet capable of landing on its own.\nThe aircraft also stands out for being the fastest and having the longest range in its category on the global market.\nThis breakthrough cements Brazilian engineering at the top of aerospace innovation and autonomous navigation systems.","link":"https://g1.globo.com/economia/noticia/2026/08/25/embraer-certifica-jato-que-pousa-sozinho-modelo-e-o-mais-veloz-e-de-maior-alcance-do-mundo.ghtml","categoria":"AVIATION","lang":"en"},{"fonte":"Consultor Jurídico","pais":"Brazil","titulo":"TSE Tightens Rules Against Illicit Use of Artificial Intelligence in Political Campaigns","resumo":"Brazil's Superior Electoral Court (TSE) has signaled zero tolerance regarding the improper use of artificial intelligence in campaigns.\nThe measure seeks to curb deepfakes, misinformation, and targeted virtual attacks during the electoral propaganda period.\nWith this decision, the Electoral Judiciary imposes strict limits on new technologies to ensure the integrity of the democratic process.","link":"https://conjur.com.br/2026-ago-25/uso-ilicito-da-ia-afasta-afasta-tolerancia-do-tse-a-critica-politica-na-campanha/","categoria":"REGULATION","lang":"en"},{"fonte":"Portal da Assembleia Legislativa de Minas Gerais","pais":"Brazil","titulo":"Scientists Advocate Creation of Rare Earth Intelligence and Technology Center","resumo":"Brazilian researchers have presented a proposal to establish a center specialized in rare earth technology.\nThese critical minerals are essential for manufacturing electronic components, wind turbines, and batteries.\nThe initiative seeks to secure scientific and technological sovereignty for the country in the development of the global energy transition.","link":"https://www.almg.gov.br/comunicacao/noticias/arquivos/Cientistas-defendem-criacao-de-Centro-de-Inteligencia-e-Tecnologia-em-Terras-Raras/","categoria":"SCIENCE","lang":"en"},{"fonte":"Valor Econômico","pais":"Brazil","titulo":"Regulatory Progress Places Brazil Among Global Leaders in Digital Asset Adoption","resumo":"The combination of clear rules and strong popular engagement has propelled Brazil among global leaders in digital assets.\nThe legal certainty provided by the regulations attracts major global companies and stimulates the financial market.\nThe scenario consolidates the Brazilian ecosystem as an innovative and pioneering terrain in the use of blockchain technology.","link":"https://valor.globo.com/google/amp/financas/video/regulacao-e-paixao-por-tecnologia-poem-brasil-entre-os-maiores-do-mundo-na-adocao-de-ativo-14900732.ghtml","categoria":"FINTECH","lang":"en"},{"fonte":"www.gov.br","pais":"Brazil","titulo":"Ministry of Science and Technology Explains Details of the Last Lunar Eclipse of 2026","resumo":"The Ministry of Science, Technology, and Innovation has released explanations regarding the final lunar eclipse of 2026.\nExperts detailed the mechanical and optical phenomena involved during the alignment of the celestial bodies.\nThe government agency's publication aims to bring the population closer to the fundamental knowledge of modern astronomy.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/o-ultimo-eclipse-lunar-de-2026-a-ciencia-explica","categoria":"ASTRONOMY","lang":"en"},{"fonte":"VEJA","pais":"Brazil","titulo":"Porsche Sells Technology Division for 320 Million Euros","resumo":"Automaker Porsche has finalized the sale of its tech innovation arm for approximately 320 million euros.\nThe transaction is part of the group's restructuring strategy to optimize investments and cash flow.\nThe proceeds will be directed toward strengthening electric fleet projects and vehicle software.","link":"https://veja.abril.com.br/coluna/faria-lima-news/porsche-vende-braco-de-tecnologia-por-320-milhoes-de-euros/","categoria":"BUSINESS","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"Lego Bets on Technological Integration in Building Blocks to Maintain Growth","resumo":"Lego has announced new product rollouts that incorporate sensors and interactive features into traditional plastic blocks.\nThe strategy aims to bridge the physical play experience with digital technologies to engage younger audiences.\nThrough this innovation, the multinational intends to sustain its leadership position in the dynamic toy market.","link":"https://www1.folha.uol.com.br/mercado/2026/08/lego-aposta-em-blocos-com-tecnologia-e-novos-produtos-para-manter-crescimento.shtml","categoria":"INNOVATION","lang":"en"},{"fonte":"PR Newswire","pais":"United States","titulo":"Abbott Receives FDA Authorization for World's First Dual Glucose and Ketone Sensing Technology","resumo":"Healthcare company Abbott has obtained FDA authorization for the world's first continuous sensor capable of monitoring glucose and ketones simultaneously.\nThe innovation is tailored for individuals with diabetes, providing early warnings against severe complications such as diabetic ketoacidosis.\nThis breakthrough represents a major milestone for medical technology by integrating multiple biosensors into a single wearable device.\nWith this approval, the technology promises to transform daily health management for millions of patients in the United States.","link":"https://www.prnewswire.com/news-releases/abbott-receives-fda-authorization-for-worlds-first-dual-glucose-ketone-sensing-technology-for-people-with-diabetes-302859742.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"SZ.de","pais":"United States","titulo":"SpaceX Plans Massive $100 Billion Rocket Launch Center in Louisiana","resumo":"SpaceX is planning the construction of a massive new space launch complex in the state of Louisiana, valued at $100 billion.\nThe venture aims to significantly expand the company's operational capacity for future orbital and interplanetary missions.\nThe large-scale infrastructure promises to boost the local economy and further cement American leadership in private space exploration.\nThe project represents one of the largest private investments in the history of the global aerospace industry.","link":"https://www.sueddeutsche.de/wirtschaft/space-x-elon-musk-weltall-starlink-li.3537234","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"United States","titulo":"NASA Image of the Day: James Webb Telescope Captures the Lion's Head Nebula","resumo":"The James Webb Space Telescope has captured striking details of the Lion's Head Nebula in a new image released by NASA.\nInfrared observations reveal dust structures and star-forming regions previously hidden behind dense cosmic clouds.\nThe collected data helps astronomers better understand the processes of star birth and the evolution of distant galaxies.\nThe image highlights the space observatory's unprecedented capability to map the deep universe in ultra-high resolution.","link":"https://science.nasa.gov/image-article/apod-2026-august-26-jwst-images-the-lions-head-nebula/","categoria":"ASTRONOMY","lang":"en"},{"fonte":"MIT Energy Initiative","pais":"United States","titulo":"Mantel Capture Demonstrates Innovative Carbon Capture Technology at Commercial Scale","resumo":"Startup Mantel Capture has reached a significant milestone by successfully demonstrating its carbon capture technology at a commercial scale.\nThe system utilizes molten salts to trap industrial emissions with energy efficiency far superior to traditional solutions.\nThis innovation drastically reduces the operating costs of the process, making decarbonization viable for hard-to-abate industries.\nThe breakthrough positions the company's technology as a key asset in combating global climate change.","link":"https://energy.mit.edu/news/mantel-capture-demonstrates-its-novel-carbon-capture-technology-at-commercial-scale/","categoria":"ENVIRONMENTAL TECHNOLOGY","lang":"en"},{"fonte":"G1","pais":"United States","titulo":"Instagram Owner Knew of Flaws in Safety Features for Minors, Witnesses Indicate in US Lawsuit","resumo":"Testimony in a high-profile U.S. lawsuit revealed that Meta was aware of the ineffectiveness of its youth protection tools.\nWitnesses claim that executives ignored internal warnings about flaws in the system designed to protect teenagers on Instagram.\nThe trial intensifies the regulatory debate over the impact of social media on the mental health of children and adolescents.\nThe lawsuit could result in new legal obligations and severe financial penalties for major tech companies.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/25/dona-do-instagram-sabia-de-falhas-em-recursos-para-proteger-menores-de-idade-dizem-testemunhas-em-processo-nos-eua.ghtml","categoria":"SOCIAL MEDIA","lang":"en"},{"fonte":"NVIDIA Blog","pais":"United States","titulo":"Major Publishers Bring Blockbuster Games and New Technologies to NVIDIA RTX Spark","resumo":"Leading game industry publishers have announced the arrival of blockbuster titles to the NVIDIA RTX Spark ecosystem.\nThe integration brings advanced ray tracing and artificial intelligence enhancement features to personal computers.\nThe move reinforces NVIDIA's leading position in the computer graphics and AI gaming processing market.\nDevelopers will benefit from refined tools to deliver more immersive visual experiences to players.","link":"https://blogs.nvidia.com/blog/gamescom-rtx-spark-pc-games-technology/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"United States","titulo":"A Changing World for Emperor Penguins","resumo":"Recent studies reveal the mounting challenges faced by emperor penguin colonies due to transformations in Antarctic sea ice.\nThe accelerated decline of ice shelves compromises the reproductive cycles and survival of the species' chicks.\nScientists emphasize the urgent need for monitoring and global conservation strategies to protect these animals.\nThe research serves as a critical warning about the direct impacts of global warming on polar ecosystems.","link":"https://science.nasa.gov/earth/earth-observatory/a-changing-world-for-emperor-penguins/","categoria":"SCIENCE","lang":"en"},{"fonte":"ANI News","pais":"United States","titulo":"Securis360 Accelerates Global Cybersecurity Growth with US Expansion and New Privacy Technologies","resumo":"Securis360 has announced the expansion of its operations in the United States, accompanied by the launch of new data privacy solutions.\nThe company has secured major corporate clients by integrating strategic technology alliances within the digital security sector.\nThese enhanced tools aim to protect enterprise networks against increasingly complex and sophisticated cyber threats.\nThe initiative strengthens the company's presence in the American market, which constantly demands innovations in cyber defense.","link":"https://www.aninews.in/news/business/securis360-accelerates-global-cybersecurity-growth-with-us-expansion-enterprise-customer-wins-strategic-technology-alliances-and-new-privacy-technology20260826102526","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"La République des Pyrénées","pais":"France","titulo":"What Are the Two Ages When Your Body Suddenly Ages, According to Science?","resumo":"Recent scientific studies have revealed that human aging does not occur in a linear fashion throughout life.\nInstead, the body goes through two major, drastic waves of biomolecular transformation, occurring around ages 44 and 60.\nThis discovery alters the understanding of age-related diseases and could transform preventive medicine strategies.","link":"https://www.larepubliquedespyrenees.fr/societe/vie-quotidienne/quels-sont-les-deux-ages-ou-votre-corps-vieillit-subitement-d-apres-la-science-30314640.php","categoria":"SCIENCE","lang":"en"},{"fonte":"ARTE Radio","pais":"France","titulo":"Éric Clua Investigates Sharks / Technology: Is France Falling Behind?","resumo":"Specialist and researcher Éric Clua is conducting detailed investigations into shark behavior and conservation.\nAt the same time, experts are analyzing France's innovation ecosystem and the country's competitiveness in the global tech race.\nThe discussion raises warnings about the risk of France losing ground to other powers in strategic, cutting-edge investments.","link":"https://www.arteradio.com/son/eric-clua-un-mordu-de-requins-enquete-technologie-la-france-decrochee","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Aerobuzz","pais":"France","titulo":"Helios Horizon Flies Technology That Could Change Electric Aviation!","resumo":"Helios Horizon has successfully tested a revolutionary new system for electric aircraft.\nThe breakthrough promises to solve historical bottlenecks in energy efficiency and range for sustainable aviation.\nMarking a historic milestone, the technology emerges as a strong contender to accelerate the decarbonization of the airline sector.","link":"https://www.aerobuzz.fr/breves-aviation-generale/helios-horizon-fait-voler-une-technologie-qui-pourrait-changer-laviation-electrique/","categoria":"INNOVATION","lang":"en"},{"fonte":"Le Revenu","pais":"France","titulo":"Germany: Economy Grows Slightly Faster Than Announced","resumo":"Germany's economic indicators have shown performance superior to initial projections presented by analysts.\nThe growth in Gross Domestic Product signals a gradual recovery for the European bloc's largest economy.\nThe result offers positive relief to the market amid a backdrop of volatility and inflationary pressures in the region.","link":"https://www.lerevenu.com/reussir-bourse/avis-des-pros/allemagne-l-economie-progresse-un-peu-plus-rapidem/","categoria":"BUSINESS","lang":"en"},{"fonte":"BBC","pais":"England","titulo":"Concern Over the Impact of £162 Million Cuts to Scientific Research","resumo":"Scientific communities in the United Kingdom have expressed deep concern regarding projected budget cuts for research funding in the country. The drastic reduction in investments could compromise essential projects at universities and technological innovation centers. Experts warn that the measure directly threatens the UK's global leadership position in scientific development.","link":"https://www.bbc.com/news/articles/cr4v0n3z16ko","categoria":"SCIENCE","lang":"en"},{"fonte":"HuffPost UK","pais":"England","titulo":"Reform UK Party Plan to Abolish GDPR Labeled Impractical and Irresponsible","resumo":"A UK political party's proposal to repeal GDPR data protection laws has drawn strong criticism from tech sector experts. Critics argue that eliminating these regulations would compromise citizens' privacy and create severe legal uncertainty for digital businesses. Furthermore, the measure could isolate the country from international secure data transfer networks.","link":"https://www.huffingtonpost.co.uk/entry/reform-uk-gdpr-laws-nigel-farage_uk_6a8dae6fe4b07583705b7d3d?ncid=NEWSSTAND0001","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"R7","pais":"England","titulo":"UK Grants Ukraine Access to Secret Missile Technology","resumo":"The UK government has authorized the sharing of advanced technological and missile navigation systems with Ukrainian armed forces. The initiative aims to significantly increase the accuracy and effectiveness of strategic defenses in the ongoing conflict. Analysts are debating the real tactical impact of this transfer on the regional balance of power and defense infrastructure.","link":"https://noticias.r7.com/internacional/reino-unido-esta-dando-a-ucrania-acesso-a-tecnologia-secreta-de-misseis-isso-fara-diferenca-26082026/","categoria":"MILITARY TECHNOLOGY","lang":"en"},{"fonte":"Nature","pais":"England","titulo":"Sculpting Non-Hermitian Light in the Continuum","resumo":"Scientists have demonstrated a new methodology for manipulating optical systems and non-Hermitian light states within the quantum continuum. The work expands the theoretical understanding of controlled energy loss and gain in advanced photonic devices. The breakthrough promises to enable the creation of ultra-precise lasers and optical sensors with unprecedented sensitivity.","link":"https://www.nature.com/articles/s41377-026-02450-y","categoria":"PHYSICS","lang":"en"},{"fonte":"Nature","pais":"England","titulo":"Electrically Driven Quasi-BICs in Metasurfaces Using Atomically Thin Semiconductors","resumo":"Researchers have developed a breakthrough in optical surfaces and atomically thin semiconductors capable of manipulating light with extremely high precision. The electrical activation of quasi-BIC modes allows for dynamic control of optical emission and photonic signal processing. This discovery paves the way for miniaturized optoelectronic devices and novel quantum communication components.","link":"https://www.nature.com/articles/s41377-026-02451-x","categoria":"NANOTECHNOLOGY","lang":"en"},{"fonte":"Nature","pais":"England","titulo":"Integration of Polarization Generation and Analysis on a Single Photonic Chip","resumo":"A new photonic microchip architecture has successfully unified the stages of light polarization generation and analysis onto an integrated platform. This innovation drastically reduces hardware complexity and increases optical data processing speed. The technology promises to impact high-speed telecommunications infrastructure and sensing systems.","link":"https://www.nature.com/articles/s41377-026-02447-7","categoria":"INNOVATION","lang":"en"},{"fonte":"Dezeen","pais":"England","titulo":"New Dell Workstations Bridge Design Concepts and Final Presentations","resumo":"Dell has launched its latest line of workstations aimed at creative, engineering, and real-time rendering professionals. The new systems bring significant advances in graphic and computational processing to accelerate complex workflows. The solution aims to eliminate the performance gap between the initial design phase and the delivery of interactive results to the client.","link":"https://www.dezeen.com/2026/08/26/dell-workstations-ai-visualisation-real-time-design/","categoria":"HARDWARE","lang":"en"},{"fonte":"Yahoo Finance UK","pais":"England","titulo":"Capra Sports Launches Free AI Uniform Design Tool Applicable to Real Garments","resumo":"Capra Sports has introduced a free artificial intelligence-based tool for creating custom sports uniforms. Unlike conventional generic models, the technology generates hyper-realistic simulations directly onto physical fabrics and garments. The novelty optimizes the pre-production stage and democratizes technical apparel design for sports teams.","link":"https://uk.finance.yahoo.com/news/capra-sports-launches-free-ai-203800957.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"OkDiario","pais":"Spain","titulo":"Scientists Warn: Earth's 4 Seasons Are Going to Disappear and We Are Not Prepared","resumo":"Scientists are warning about profound global climate changes that are destabilizing the planet's traditional seasonal patterns. The phenomenon threatens to eradicate the clear division between the four seasons, triggering recurring extreme weather events. This drastic transformation directly impacts agriculture, biodiversity, and global food security, revealing societies' lack of preparedness to face this imminent scenario.","link":"https://okdiario.com/ciencia/cientificos-avisan-4-estaciones-del-ano-tierra-van-desaparecer-no-estamos-preparados-20169530","categoria":"CLIMATE","lang":"en"},{"fonte":"La Vanguardia","pais":"Spain","titulo":"Is AI Already Writing Science? Study Detects Its Traces in Nearly 9 Out of 10 Biomedical Articles","resumo":"New research has revealed that artificial intelligence tools are being widely used in the drafting of academic articles in the biomedical field. Traces of AI use were identified in nearly 90% of the analyzed publications, sparking ethical debates in the scientific community. The finding raises concerns regarding integrity, authorship, and the need for strict regulations for future scientific publishing.","link":"https://www.lavanguardia.com/neo/ia/20260826/11619668/ia-escribe-ciencia-estudio-detecta-huellas-9-10-articulos-biomedicos-epm.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"La Razón","pais":"Espanha","titulo":"O telescópio James Webb localiza três buracos negros ativos em uma galáxia de 12,5 bilhões de anos e prevê sua futura fusão","resumo":"O Telescópio Espacial James Webb fez uma descoberta astronômica impressionante ao detectar três buracos negros supermassivos ativos na mesma galáxia ancestral. O sistema, localizado a 12,5 bilhões de anos-luz de distância, está em processo de interação e caminha para uma fusão tripla inédita. As observações fornecem dados valiosos sobre a evolução inicial das galáxias e a formação de estruturas gigantescas no universo primordial.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/telescopio-james-webb-localiza-tres-agujeros-negros-activos-galaxia-hace-12500-millones-anos-anticipa-su-futura-fusion_202608266a8e080dd16f7635049d0acd.html","categoria":"ASTRONOMIA","lang":"en"},{"fonte":"El Periódico","pais":"Espanha","titulo":"Os resultados da Nvidia podem movimentar na Bolsa o equivalente à economia grega","resumo":"A divulgação dos resultados financeiros da Nvidia tornou-se um dos eventos mais decisivos para o mercado financeiro global. O impacto projetado de suas ações pode movimentar centenas de bilhões de dólares, superando o Produto Interno Bruto de países como a Grécia. Esse movimento reflete o papel central da empresa na corrida da inteligência artificial e a alta dependência de Wall Street do setor de tecnologia.","link":"https://www.elperiodico.com/es/economia/20260826/resultados-nvidia-mover-bolsa-equivalente-133659122","categoria":"MERCADO TECH","lang":"en"},{"fonte":"Artículo 14","pais":"Espanha","titulo":"Setembro é um dos piores meses para crianças com asma: a ciência explica o que ocorre na volta às aulas","resumo":"Estudos científicos explicam por que o mês de setembro registra um aumento expressivo nas crises astmáticas pediátricas. A combinação do retorno ao ambiente escolar, maior exposição a vírus respiratórios e variações térmicas favorece o aumento de internações hospitalares. Especialistas enfatizam a importância do acompanhamento médico prévio para prevenir complicações e proteger a saúde das crianças durante esse período crítico.","link":"https://www.articulo14.es/salud/septiembre-es-uno-de-los-peores-meses-para-los-ninos-con-asma-la-ciencia-explica-que-ocurre-al-volver-al-colegio-20260826.html","categoria":"SAÚDE","lang":"en"},{"fonte":"El Mundo","pais":"Espanha","titulo":"Sycai, tecnologia espanhola para curar o câncer de pâncreas: \"Quando os primeiros sintomas aparecem, já é tarde demais\"","resumo":"A startup espanhola Sycai desenvolveu uma tecnologia de inteligência artificial focada na detecção precoce do câncer de pâncreas. Ao analisar exames de imagem e identificar lesões antes do surgimento dos sintomas clínicos, a ferramenta busca aumentar drasticamente as taxas de sobrevivência dos pacientes. A inovação representa um avanço crucial contra uma das formas mais letais de tumor na medicina atual.","link":"https://www.elmundo.es/economia/empresas/2026/08/25/6a883101e9cf4ad6578b4586.html","categoria":"BIOTECNOLOGIA","lang":"en"},{"fonte":"El Mundo","pais":"Espanha","titulo":"O mundo reordenado pela tecnologia: a IA e a Europa","resumo":"A ascensão acelerada da inteligência artificial está redefinindo o equilíbrio geopolítico e econômico global, colocando a Europa em uma posição desafiadora. O continente busca equilibrar uma regulamentação rigorosa voltada à ética e privacidade com a necessidade urgente de fomentar a inovação e competitividade. O cenário atual exige estratégias claras para evitar a dependência tecnológica em relação aos Estados Unidos e à China.","link":"https://www.elmundo.es/opinion/2026/08/25/6a872f7cfdddff0d338b45a5.html","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"El Confidencial","pais":"Espanha","titulo":"Reino Unido afirma ter desenvolvido tecnologia que converte plástico de uso único contaminado em plástico reciclável","resumo":"Pesquisadores no Reino Unido anunciaram um avanço tecnológico capaz de transformar resíduos plásticos contaminados e não recicláveis em matéria-prima reaproveitável. O processo inovador supera grandes limitações da reciclagem tradicional, permitindo tratar plásticos de uso único que antes iriam para aterros ou oceanos. A solução promete impactar positivamente a economia circular e mitigar a crise ambiental global do lixo plástico.","link":"https://www.elconfidencial.com/tecnologia/ciencia/2026-08-25/reino-unido-tecnologia-plastico-un-solo-uso-reciclable-1qrt_4409580/","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"euractiv.com","pais":"Alemanha","titulo":"Trabalhadores da Volkswagen vaiam chefe durante discurso sobre cortes de empregos","resumo":"Durante um discurso sobre reestruturação e planos de contenção de custos na Alemanha, executivos da Volkswagen enfrentaram fortes protestos.\nMilhares de funcionários demonstraram insatisfação com a possibilidade de fechamento de fábricas e demissões em massa.\nA crise reflete os desafios enfrentados pela gigante automotiva na transição para veículos elétricos e concorrência global.\nO clima de tensão evidencia a pressão crescente sobre o setor industrial alemão no atual cenário econômico.","link":"https://www.euractiv.com/news/volkswagen-workers-boo-boss-during-speech-on-job-cuts/","categoria":"AUTOMOTIVO","lang":"en"},{"fonte":"Deutschlandfunk","pais":"Alemanha","titulo":"Reunião do Gabinete: Setor econômico alerta para atraso em Inteligência Artificial","resumo":"Líderes da indústria e do setor econômico alemão emitiram um alerta urgente ao governo sobre o atraso do país em Inteligência Artificial.\nDurante o retiro do gabinete ministerial, foram cobrados maiores investimentos e redução da burocracia para incentivar a inovação tecnológica.\nEspecialistas apontam que a falta de infraestrutura digital adequada pode comprometer a competitividade das empresas alemãs no cenário global.\nA pressão aumenta para que medidas regulatórias e de apoio financeiro sejam implementadas rapidamente.","link":"https://www.deutschlandfunk.de/wirtschaft-warnt-vor-rueckstaendigkeit-bei-kuenstlicher-intelligenz-100.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"ZDFheute","pais":"Alemanha","titulo":"Retiro do Gabinete: Economia no centro das atenções","resumo":"O governo alemão se reuniu em um retiro de gabinete focado em estratégias para impulsionar a economia do país.\nEm meio a incertezas globais e desaceleração industrial, o foco principal do encontro foi criar estímulos para investimentos privados.\nMedidas para desburocratização, transição energética e modernização digital estiveram no topo da pauta das discussões ministeriais.\nO resultado do encontro deve definir as diretrizes econômicas e de inovação da Alemanha para os próximos anos.","link":"https://www.zdfheute.de/video/heute-journal/ferber-kabinettsklausur-wirtschaft-100.html","categoria":"ECONOMIA","lang":"en"},{"fonte":"ZDFheute","pais":"Alemanha","titulo":"Economia alemã volta a crescer","resumo":"Indicadores recentes apontam uma recuperação inesperada e novo crescimento na atividade econômica da Alemanha.\nO avanço traz alívio após períodos de estagnação e receios de uma recessão prolongada na maior economia da Europa.\nContudo, analistas ressaltam que desafios estruturais e custos de energia elevados ainda exigem cautela a longo prazo.\nA retomada do consumo interno e exportações foram fatores decisivos para o desempenho positivo do trimestre.","link":"https://www.zdfheute.de/video/heute-journal/sgs-hayali-boerse-102.html","categoria":"ECONOMIA","lang":"en"},{"fonte":"Newscast.jp","pais":"Japão","titulo":"Avanços em IA Física Aceleram a Transformação Digital de Trabalhadores da Linha de Frente","resumo":"Uma nova iniciativa combina IA de imagem, IA de voz e modelos de linguagem visual para acelerar a IA física.\nA tecnologia busca aprimorar o monitoramento e o suporte em tempo real para equipes operacionais de campo.\nEssa abordagem visa impulsionar a transformação digital dos trabalhadores na linha de frente de diversos setores.","link":"https://newscast.jp/smart/news/9674146","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"Helical Fusion","pais":"Japão","titulo":"Pesquisa sobre Ímãs Supercondutores de Alta Temperatura Alcança Marco Histórico","resumo":"Estudos em tecnologias de ímãs supercondutores de alta temperatura alcançaram um marco publicado internacionalmente.\nO avanço representa um passo técnico essencial para a consolidação de sistemas energéticos mais eficientes.\nA inovação abre caminho para aplicações práticas em fusão nuclear e dispositivos de alta precisão.","link":"https://www.helicalfusion.com/post/helical-fusion%E3%80%81%E9%AB%98%E6%B8%A9%E8%B6%85%E4%BC%9D%E5%B0%8E%E3%83%9E%E3%82%B0%E3%83%8D%E3%83%83%E3%83%88%E6%8A%80%E8%A1%93%E3%81%AE%E9%87%8D%E8%A6%81%E3%83%9E%E3%82%A4%E3%83%AB%E3%82%B9%E3%83%88%E3%83%BC%E3%83%B3%E3%81%AB%E9%96%A2%E3%81%99%E3%82%8B%E5%85%B1%E5%90%8C%E7%A0%94%E7%A9%B6%E6%88%90%E6%9E%9C%E3%81%8C%E5%9B%BD%E9%9A%9B%E5%AD%A6%E8%A1%93%E8%AA%8C%E3%81%AB%E6%8E%B2%E8%BC%89","categoria":"CIÊNCIA","lang":"en"},{"fonte":"EE Times Japan","pais":"Japão","titulo":"Universidade de Osaka Desenvolve Comunicação Sem Fio de Alta Velocidade para Dispositivos Médicos Ingeríveis","resumo":"Pesquisadores da Universidade de Osaka o
