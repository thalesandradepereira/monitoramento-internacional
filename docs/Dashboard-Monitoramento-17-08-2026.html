    .btn-clear {

  const data = [{"fonte":"Balada IN","pais":"Brasil","titulo":"Elon Musk prevê que dinheiro perderá importância até 2036 com avanço da IA","resumo":"O empresário Elon Musk afirmou que o avanço acelerado da inteligência artificial transformará radicalmente a economia global nas próximas décadas.\nSegundo ele, a abundância de bens e serviços automatizados tornará o conceito tradicional de dinheiro obsoleto até o ano de 2036.\nA declaração levanta debates profundos sobre o futuro do trabalho, a distribuição de renda e os impactos socioeconômicos da automação total.","link":"https://www.portalin.com.br/negocios/elon-musk-preve-que-dinheiro-perdera-importancia-ate-2036-com-avanco-da-ia/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Agência FAPESP","pais":"Brasil","titulo":"Conferência FAPESP debate a transição da computação quântica dos laboratórios para o mercado","resumo":"A FAPESP reuniu especialistas e pesquisadores para discutir os avanços e desafios da computação quântica no cenário atual.\nO encontro focou em como transformar teorias científicas e protótipos acadêmicos em soluções comerciais aplicáveis a setores estratégicos.\nO avanço dessa tecnologia promete revolucionar áreas como criptografia, otimização de processos industriais e desenvolvimento de novos materiais.","link":"https://agencia.fapesp.br/conferencia-fapesp-debate-a-transicao-da-computacao-quantica-dos-laboratorios-para-o-mercado/58977","categoria":"COMPUTAÇÃO QUÂNTICA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Discord tem até esta segunda-feira para suspender transmissões ao vivo no Brasil","resumo":"A plataforma Discord recebeu determinações para suspender recursos de transmissão ao vivo no Brasil em meio a investigações sobre segurança online.\nEspecialistas em direito digital e proteção de dados analisam o impacto da medida na proteção de crianças e adolescentes no ambiente virtual.\nO caso reacende a discussão sobre a responsabilidade das redes sociais na moderação de conteúdo e conformidade com as leis locais.","link":"https://g1.globo.com/politica/noticia/2026/08/17/discord-tem-ate-esta-segunda-para-suspender-lives-no-brasil-especialistas-avaliam-protecao-a-menores.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"R7","pais":"Brasil","titulo":"Tecnologia ajuda cafeicultores a economizar água e energia na irrigação","resumo":"Novas ferramentas tecnológicas e sensores inteligentes estão otimizando o manejo hídrico nas lavouras de café pelo Brasil.\nOs sistemas monitoram a umidade do solo em tempo real, permitindo uma irrigação precisa que reduz custos operacionais e preserva recursos.\nA inovação fortalece a sustentabilidade no campo e garante maior produtividade frente às crescentes mudanças climáticas.","link":"https://noticias.r7.com/prisma/mundo-agro/tecnologia-ajuda-cafeicultores-a-economizar-agua-e-energia-na-irrigacao-17082026/","categoria":"AGROTECH","lang":"pt"},{"fonte":"Rádio Itatiaia","pais":"Brasil","titulo":"Excesso de telas: 8 sinais de que o celular e redes sociais podem estar afetando a saúde","resumo":"O uso prolongado de dispositivos eletrônicos e redes sociais tem acendido alertas sobre impactos negativos no bem-estar físico e mental.\nEspecialistas apontam sintomas como distúrbios do sono, ansiedade, fadiga ocular e queda de concentração como principais sinais de alerta.\nA conscientização sobre o tempo de tela é fundamental para estabelecer hábitos digitais mais saudáveis e prevenir problemas crônicos.","link":"https://www.itatiaia.com.br/ciencia-e-tecnologia/excesso-de-telas-8-sinais-de-que-o-celular-e-redes-sociais-podem-estar-afetando-a-saude/","categoria":"SAÚDE DIGITAL","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Energia solar supera marco global e acelera expansão em escala inédita","resumo":"A geração de energia solar atingiu marcas históricas de capacidade instalada globalmente, impulsionada por novos investimentos.\nA queda nos custos de painéis fotovoltaicos e as políticas de transição energética aceleraram a adoção do recurso em diversos países.\nEsse avanço consolida a fonte solar como pilar essencial para a descarbonização da matriz energética e o combate ao aquecimento global.","link":"https://www1.folha.uol.com.br/mercado/2026/08/energia-solar-supera-marco-global-e-acelera-expansao.shtml","categoria":"ENERGIA RENOVÁVEL","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Alunos de Engenharia de Sorocaba vencem prêmio nacional com jogos e aplicativo de tecnologia nuclear","resumo":"Estudantes universitários desenvolveram jogos interativos e um aplicativo focados na disseminação do conhecimento sobre tecnologia nuclear.\nO projeto inovador conquistou o primeiro lugar em uma premiação nacional de incentivo à ciência e engenharia aplicada.\nA iniciativa busca desmistificar a energia nuclear, destacando suas aplicações benéficas na medicina, indústria e geração limpa.","link":"https://g1.globo.com/sp/sorocaba-jundiai/noticia/2026/08/16/alunos-de-engenharia-de-sorocaba-vencem-premio-nacional-com-jogos-e-app-de-tecnologia-nuclear.ghtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Conflits : Revue de Géopolitique","pais":"Brasil","titulo":"Brasil: Petrobras detecta indícios de presença de petróleo na costa da Amazônia","resumo":"A Petrobras identificou a presença de hidrocarbonetos durante perfurações exploratórias na Margem Equatorial, na costa amazônica.\nA descoberta reforça o potencial energético da região, embora enfrente rigorosas análises ambientais e debates regulatórios.\nEstudos científicos adicionais serão realizados para avaliar a viabilidade econômica do poço e os impactos da exploração de recursos.","link":"https://www.revueconflits.com/bresil-petrobras-detecte-des-indices-de-presence-de-petrole-au-large-de-lamazonie/","categoria":"ENERGIA","lang":"pt"},{"fonte":"Bloomberg.com","pais":"Estados Unidos","titulo":"Stripe fecha acordo de mais de US$ 7 bilhões para comprar a empresa de IA OpenRouter","resumo":"A gigante dos pagamentos Stripe fechou um acordo histórico de mais de 7 bilhões de dólares para adquirir a OpenRouter, startup especializada em roteamento de modelos de IA.\nA aquisição marca uma grande expansão da Stripe no ecossistema de inteligência artificial, buscando integrar infraestrutura avançada às suas soluções financeiras.\nO movimento destaca a crescente consolidação do mercado de tecnologia por grandes empresas globais de serviços digitais.","link":"https://www.bloomberg.com/news/articles/2026-08-16/stripe-nears-deal-to-buy-ai-firm-openrouter-for-over-7-billion","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"BBC","pais":"Estados Unidos","titulo":"Se a Meta perder este julgamento, o Instagram e o Facebook podem mudar para sempre","resumo":"A Meta enfrenta um processo antitruste decisivo promovido por reguladores nos Estados Unidos que põe em risco a estrutura do seu império digital.\nA ação judicial pode forçar a empresa de Mark Zuckerberg a vender ativos valiosos, como as plataformas Instagram e WhatsApp.\nUma derrota no tribunal redefiniria completamente a dinâmica das redes sociais e do mercado publicitário global.","link":"https://www.bbc.com/news/articles/clyqpx6xk69o","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Época Negócios","pais":"Estados Unidos","titulo":"Meta solicita patente para óculos inteligentes com reconhecimento facial","resumo":"A Meta submeteu um pedido de patente para integrar tecnologia de reconhecimento facial em seus futuros óculos inteligentes de realidade aumentada.\nO recurso visa permitir que o dispositivo identifique pessoas em tempo real e exiba informações contextuais diretamente no visor do usuário.\nA iniciativa levanta intensos debates sobre segurança de dados, ética e os limites da privacidade na era dos dispositivos vestíveis.","link":"https://epocanegocios.globo.com/google/amp/tecnologia/noticia/2026/08/meta-pede-registro-de-patente-para-oculos-com-reconhecimento-facial.ghtml","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The Mendocino Voice","pais":"Estados Unidos","titulo":"Califórnia recruta adolescentes para aconselhar decisões sobre IA e tecnologia no estado","resumo":"O governo da Califórnia lançou uma iniciativa inédita para incluir adolescentes no conselho consultivo de políticas de inteligência artificial do estado.\nOs jovens oferecerão perspectivas diretas sobre o impacto das novas tecnologias na educação, no mercado de trabalho e no cotidiano da nova geração.\nA estratégia busca garantir que as regulamentações estaduais considerem a visão dos nativos digitais antes da implementação de novas leis.","link":"https://mendovoice.com/2026/08/california-recruits-teens-to-help-advise-on-states-ai-and-technology-decisions/","categoria":"POLÍTICA PÚBLICA","lang":"pt"},{"fonte":"Sud Ouest","pais":"Estados Unidos","titulo":"Governo Trump cancela relatório de referência sobre o clima no Ártico","resumo":"A administração Trump tomou a decisão de cancelar a publicação de um relatório científico fundamental focado nas mudanças climáticas na região do Ártico.\nCientistas e pesquisadores ambientais criticaram duramente a medida, acusando o governo de tentar suprimir dados cruciais sobre o aquecimento global.\nO cancelamento gera forte incerteza sobre o futuro do financiamento público para pesquisas de monitoramento climático nos Estados Unidos.","link":"https://www.sudouest.fr/environnement/climat/ils-essayent-vraiment-d-enterrer-la-science-l-administration-trump-annule-un-rapport-de-reference-sur-le-climat-de-l-arctique-30277150.php","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"simplywall.st","pais":"Estados Unidos","titulo":"Como investidores podem redefinir posições com a expansão da Marvell em memória para IA","resumo":"A Marvell Technology anunciou a expansão do seu portfólio de infraestrutura de memória voltado especificamente para centros de dados de inteligência artificial.\nA movimentação estratégica busca capturar a crescente demanda do mercado por hardware capaz de processar cargas massivas de trabalho de IA.\nInvestidores observam com otimismo a capacidade da empresa de competir diretamente com outros gigantes globais do setor de semicondutores.","link":"https://simplywall.st/stocks/us/semiconductors/nasdaq-mrvl/marvell-technology/news/how-investors-may-respond-to-marvell-technology-mrvl-expandi","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"NavalToday","pais":"Estados Unidos","titulo":"Ultra Maritime testa tecnologia autônoma para combate a submarinos e veículos não tripulados","resumo":"A empresa Ultra Maritime realizou testes bem-sucedidos com tecnologias autônomas voltadas para a guerra antisubmarina e neutralização de veículos subaquáticos não tripulados.\nOs ensaios demonstraram a eficácia de sistemas robóticos em identificar e responder a ameaças marítimas com intervenção humana reduzida.\nO avanço reflete a rápida aceleração no uso de automação e inteligência artificial para defesa e soberania naval.","link":"https://navaltoday.com/2026/08/17/ultra-maritime-tests-autonomous-technology-for-counter-uuv-and-asw","categoria":"TECNOLOGIA MILITAR","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"Foto Astronômica do Dia: Um Eclipse com Corona Dourada","resumo":"A NASA destacou uma imagem impressionante que captura os detalhes deslumbrantes da corona solar durante um eclipse total da estrela.\nA fotografia revela estruturas magnéticas complexas e arcos de plasma visíveis apenas no momento em que a Lua encobre totalmente o disco solar.\nO registro serve como um valioso recurso educacional e científico para astrônomos e entusiastas da física solar em todo o mundo.","link":"https://science.nasa.gov/image-article/apod-2026-august-17-a-golden-corona-eclipse/","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"L'Avenir","pais":"França","titulo":"A política \"antivax\" de Trump faz disparar os casos de sarampo","resumo":"As recentes diretrizes e declarações céticas sobre vacinas associadas à gestão política de Donald Trump vêm causando um aumento alarmante nos surtos de sarampo.\nEspecialistas em saúde pública alertam que a queda nas taxas de imunização coloca em risco conquistas históricas da medicina e ameaça a saúde coletiva.\nO cenário acende o alerta global sobre os impactos da desinformação na contenção de doenças evitáveis por vacinas.","link":"https://www.lavenir.net/actu/2026/08/17/la-politique-antivax-de-trump-fait-flamber-les-cas-de-rougeole-2COGMVM6S5EKPPBYSF6UTWDPTI/","categoria":"SAÚDE","lang":"pt"},{"fonte":"pieuvre.ca","pais":"França","titulo":"Com suas \"caixas pretas\", as novas tecnologias estão fazendo perder a confiança na ciência?","resumo":"O avanço acelerado de sistemas tecnológicos complexos e algoritmos de inteligência artificial, frequentemente descritos como \"caixas pretas\" por sua falta de transparência, está gerando dúvidas na comunidade científica e no público.\nA opacidade nesses processos dificulta a verificação de resultados e o entendimento de como as decisões são tomadas.\nComo consequência, surge um debate ético crucial sobre o impacto da falta de explicabilidade técnica na credibilidade e na confiança da sociedade na ciência moderna.","link":"https://www.pieuvre.ca/2026/08/16/science-ia-boite-noire-confiance/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Perdas estimadas em 180 bilhões de euros: seca e ondas de calor ameaçam a economia europeia","resumo":"Estudos recentes indicam que os eventos climáticos extremos, como secas severas e ondas de calor prolongadas, podem causar prejuízos de até 180 bilhões de euros no continente europeu.\nOs impactos diretos afetam severamente setores estratégicos como a agricultura, a geração de energia e a infraestrutura urbana.\nDiante desse cenário alarmante, especialistas reforçam a urgência de investimentos em transição ecológica e medidas de adaptação climática para mitigar desastres econômicos e ambientais futuros.","link":"https://www.science-et-vie.com/nature-et-environnement/des-pertes-estimees-a-180-milliards-deuros-la-secheresse-et-les-vagues-de-chaleur-menacent-leconomie-europeenne-254917.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Ovos castanhos ou brancos: a ciência finalmente revela o que realmente muda","resumo":"Estudos científicos esclarecem as dúvidas recorrentes sobre as diferenças nutricionais e de sabor entre ovos com casca castanha e branca.\nA pesquisa demonstra que a cor da casca é determinada unicamente pela genética e raça da galinha, não afetando a qualidade nutricional da alimentação.\nAs únicas variações reais observadas no valor nutricional decorrem diretamente da dieta e do manejo das aves, desmistificando crenças populares consolidadas.","link":"https://www.science-et-vie.com/corps-et-sante/oeufs-bruns-ou-blancs-la-science-revele-enfin-ce-qui-change-vraiment-215681.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Cientistas são unânimes: a bebida Ciao Energy de Squeezie, Léna Situations e Inoxtag é \"problemática\"","resumo":"O lançamento da bebida energética Ciao Energy, idealizada pelos influenciadores digitais franceses Squeezie, Léna Situations e Inoxtag, gerou fortes críticas e preocupação entre especialistas em nutrição e saúde pública.\nA comunidade científica alerta para os elevados níveis de cafeína e aditivos, associados aos riscos de consumo excessivo pelo público jovem atraído pelos criadores de conteúdo.\nO debate levanta questões éticas sobre a responsabilidade de grandes nomes da internet na promoção de produtos potencialmente prejudiciais à saúde.","link":"https://www.science-et-vie.com/corps-et-sante/les-scientifiques-sont-unanimes-la-boisson-ciao-energy-de-squeezie-lena-situations-et-inoxtag-est-problematique-243258.html","categoria":"TRENDING","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Sainsbury's pausa câmeras com IA após remoção indevida de cliente","resumo":"A rede de supermercados britânica Sainsbury's suspendeu temporariamente o uso de câmeras com inteligência artificial em suas lojas após um incidente em que um cliente foi removido injustamente.\nO sistema de vigilância automatizado visava identificar comportamentos suspeitos e furtos, mas falhas na precisão levantaram sérias preocupações sobre privacidade e falsos positivos.\nO caso reacende o debate sobre os limites e a ética do uso de monitoramento biométrico no setor de varejo.","link":"https://www.bbc.com/news/articles/cddjlmeqjgyo","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Flexibilização das regras de planejamento na Inglaterra permitirá mais moradias perto de estações","resumo":"O governo inglês anunciou uma flexibilização nas normas de planejamento urbano para incentivar a construção de novas residências nas proximidades de estações de trem.\nA medida busca combater a grave crise habitacional do país, otimizando o uso do transporte público e revitalizando áreas urbanas conectadas.\nEspecialistas apontam que a mudança pode acelerar significativamente a aprovação de projetos, embora ainda enfrente resistência de comunidades locais.","link":"https://www.theguardian.com/politics/2026/aug/17/loosening-planning-rules-england-more-homes-train-stations-rayner","categoria":"INFRAESTRUTURA","lang":"pt"},{"fonte":"City AM","pais":"Inglaterra","titulo":"Instabilidade no mercado de títulos dos EUA acende alerta de recessão no Reino Unido","resumo":"A recente volatilidade no mercado de títulos de dívida dos Estados Unidos gerou desdobramentos preocupantes para a economia do Reino Unido, elevando os alertas de recessão.\nO aumento nos rendimentos dos títulos americanos pressiona as taxas de juros globais, encarecendo o financiamento público e privado britânico.\nAnalistas alertam que esse cenário limita a margem de manobra financeira do governo e pode desacelerar substancialmente os investimentos no país.","link":"https://www.cityam.com/us-bond-market-jitters-spark-uk-economy-recession-warning/","categoria":"ECONOMIA","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Primeiro carro elétrico da Ferrari é vendido por valor recorde de US$ 40 milhões em leilão","resumo":"O primeiro veículo inteiramente elétrico produzido pela Ferrari foi arrematado por um valor recorde de US$ 40 milhões durante um leilão exclusivo.\nO modelo representa um marco decisivo na transição da icônica marca italiana rumo à eletrificação de alto desempenho mantendo o padrão de luxo.\nA venda astronômica demonstra o enorme interesse de colecionadores por protótipos elétricos históricos e consolida a relevância do segmento no mercado automobilístico.","link":"https://www.bbc.com/news/articles/c77ggpgrp2do","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"OkDiario","pais":"Espanha","titulo":"A ciência confirma: a vacina contra a covid nos protege de coronavírus do futuro","resumo":"Estudos científicos recentes confirmam que a imunização gerada pelas vacinas contra a covid-19 oferece uma proteção mais ampla do que se imaginava. O mecanismo de resposta imunológica desenvolvido pelo organismo ajuda a neutralizar diferentes variantes e outros coronavírus emergentes. Essa descoberta reforça a importância das campanhas de vacinação para a prevenção de futuras pandemias globais.","link":"https://okdiario.com/salud/ciencia-lo-confirma-vacuna-contra-covid-nos-protege-coronavirus-del-futuro-19096914","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"EL PAÍS","pais":"Espanha","titulo":"As adolescentes começam em desvantagem no aprendizado de inteligência artificial","resumo":"Pesquisas apontam uma disparidade de gênero no acesso e no interesse pelo aprendizado de inteligência artificial durante a adolescência. Fatores culturais e a falta de incentivo nas áreas de tecnologia contribuem para afastar as jovens desse campo em rápida expansão. Superar essa lacuna é fundamental para garantir a equidade de oportunidades no mercado de trabalho do futuro.","link":"https://elpais.com/educacion/2026-08-17/las-adolescentes-parten-con-desventaja-en-el-aprendizaje-de-la-inteligencia-artificial.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"OkDiario","pais":"Espanha","titulo":"A ciência confirma: esquentar recipientes de plástico no micro-ondas nunca é uma boa ideia","resumo":"A comunidade científica alerta sobre os riscos à saúde ao aquecer recipientes plásticos no forno de micro-ondas. O calor facilita a liberação de microplásticos e substâncias químicas nocivas nos alimentos, associadas a distúrbios hormonais. Especialistas recomendam a substituição por recipientes de vidro ou cerâmica para garantir a segurança alimentar.","link":"https://okdiario.com/okgreen/ciencia-lo-confirma-calentar-envases-plastico-microondas-nunca-buena-idea-16620675/amp","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"eldebate.com","pais":"Espanha","titulo":"Ave que aprende a cantar como os humanos revela milhares de genes desconhecidos pela ciência","resumo":"Pesquisadores mapearam o genoma de uma espécie de ave capaz de imitar padrões vocais humanos de forma impressionante. A descoberta revelou milhares de genes até então desconhecidos relacionados ao aprendizado vocal e à plasticidade cerebral. O avanço pode abrir novos caminhos para compreender a evolução da linguagem e tratar distúrbios de fala na medicina.","link":"https://www.eldebate.com/ciencia/20260817/ave-aprende-cantar-como-humanos-revela-miles-genes-ciencia-desconocia_448818.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"El Desmarque","pais":"Espanha","titulo":"Renault lança elétrico que surpreende em qualidade e tecnologia, rivalizando com Audi e BMW","resumo":"A Renault apresentou um novo modelo de veículo elétrico que se destaca pela alta qualidade de acabamento e recursos tecnológicos avançados. O automóvel posiciona-se como um forte concorrente para marcas de luxo consagradas, como Audi e BMW. Essa inovação sinaliza uma mudança significativa na estratégia da fabricante para liderar a transição energética global.","link":"https://www.eldesmarque.com/coches-y-motos/20260816/renault-electrico-tecnologia-audi-bmw_18_019943514.html","categoria":"TECNOLOGIA AUTOMOTIVA","lang":"pt"},{"fonte":"OkDiario","pais":"Espanha","titulo":"Ciência bate recorde e obtém o DNA animal mais antigo da África Subsaariana","resumo":"Cientistas alcançaram um marco histórico ao recuperar e sequenciar o DNA animal mais antigo já registrado na África Subsaariana. O material genético pertence a um antílope pré-histórico e oferece dados valiosos sobre a evolução da fauna na região. A conquista tecnológica amplia substancialmente os limites da paleogenética em climas quentes.","link":"https://okdiario.com/naturaleza/confirmado-ciencia-destroza-otro-record-consigue-adn-animal-mas-antiguo-del-africa-sub-sahariana-antilope-hace-50-000-anos-19100723","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"avpasion.com","pais":"Espanha","titulo":"Sennheiser quer reinventar o som da Fórmula E com a tecnologia AMBEO","resumo":"A Sennheiser firmou parceria para aplicar sua avançada tecnologia de áudio 3D AMBEO nas transmissões da Fórmula E. A proposta visa proporcionar aos espectadores uma experiência imersiva inédita, capturando nuances do som dos carros elétricos. O projeto exemplifica como a inovação acústica pode transformar o entretenimento esportivo moderno.","link":"https://www.avpasion.com/sennheiser-reinventar-sonido-formula-e-ambeo/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Xataka","pais":"Espanha","titulo":"Há 25 anos nos apaixonamos pela tecnologia transparente; esse amor está de volta","resumo":"O design de dispositivos eletrônicos com carcaças transparentes, famoso no final dos anos 1990, está retornando com força ao mercado. Diversas fabricantes apostam na nostalgia aliada à estética futurista para diferenciar seus produtos no setor de tecnologia. A tendência reconecta os consumidores com a essência do hardware aparente em acessórios contemporâneos.","link":"https://www.xataka.com/historia-tecnologica/hace-25-anos-nos-enamoramos-tecnologia-transparente-ese-amor-pasado-esta-vuelta","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Poder360","pais":"Alemanha","titulo":"Calor extremo já causa perdas bilionárias à economia europeia","resumo":"O aumento constante das temperaturas e as ondas de calor extremo estão gerando prejuízos bilionários para a economia europeia. Setores fundamentais como agricultura, transporte, energia e produtividade industrial têm sido gravemente afetados pelas condições climáticas severas. Especialistas destacam a necessidade urgente de investimentos em infraestrutura e adaptação climática para conter a escalada dos danos financeiros nos próximos anos.","link":"https://www.poder360.com.br/poder-internacional/calor-extremo-ja-causa-perdas-bilionarias-a-economia-europeia/","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Yahoo!ファイナンス","pais":"Japão","titulo":"Honda avança no desenvolvimento de tecnologias de segurança veicular com uso de IA","resumo":"A Honda anunciou a expansão do uso de inteligência artificial no desenvolvimento de suas tecnologias de segurança veicular.\nA iniciativa busca aprimorar os sistemas de assistência ao motorista e prevenir acidentes com maior precisão em tempo real.\nCom essa abordagem inovadora, a empresa reforça seu compromisso de zerar mortes no trânsito envolvendo seus veículos no futuro.\nO avanço coloca a montadora japonesa em destaque na corrida pela integração de inteligência artificial na indústria automotiva.","link":"https://finance.yahoo.co.jp/news/detail/5a85937ca5b8d92b8b3a645525b72c23d9a30c94","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Princesa Aiko marca presença em conferência internacional de física de semicondutores","resumo":"A princesa Aiko marcou presença em uma importante conferência internacional voltada à física de semicondutores.\nA participação da integrante da família real destaca o apoio institucional do Japão à pesquisa científica e de alta tecnologia.\nO evento reuniu especialistas do mundo todo para debater inovações na produção de chips e novos materiais.\nA presença real chamou a atenção da mídia e reforçou a relevância estratégica do setor para o país.","link":"https://www.nikkei.com/article/DGXZQOUD170EB0X10C26A8000000/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Técnicas de origami inspiram miniaturização de satélites de comunicação no Japão","resumo":"Pesquisadores do Instituto de Ciência de Tóquio utilizaram conceitos de origami para reduzir o tamanho e o peso de satélites de comunicação.\nA aplicação da arte milenar permite que componentes complexos se dobrem de maneira eficiente para o transporte espacial.\nA inovação promete diminuir significativamente os custos de lançamento e facilitar o envio de equipamentos para a órbita terrestre.\nTrata-se de um exemplo prático de como o conhecimento tradicional pode impulsionar soluções tecnológicas de ponta.","link":"https://news.yahoo.co.jp/articles/345244235dbb3982a5899364affa342722a6fbc1","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"朝日新聞","pais":"Japão","titulo":"IA acelera descobertas científicas e levanta debates sobre riscos de autoaperfeiçoamento","resumo":"Modelos avançados de inteligência artificial começam a gerar descobertas científicas de forma autônoma por meio do autoaperfeiçoamento.\nA capacidade dos algoritmos de evoluírem sozinhos acelera significativamente o ritmo de pesquisas em diversas áreas da ciência.\nNo entanto, especialistas alertam para a necessidade de regulamentação para conter os riscos de perda de controle sobre sistemas autônomos.\nA novidade reposiciona a IA não apenas como ferramenta de suporte, mas como agente ativo no avanço do conhecimento científico.","link":"https://www.asahi.com/articles/ASV8D46HNV8DUTFL00PM.html?iref=reporter-bio-cover_timeline","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Startups de defesa ganham força no Japão impulsionadas por drones e inteligência artificial","resumo":"Startups focadas na área de defesa estão ganhando destaque no cenário de inovação japonês ao utilizarem drones e IA.\nEssas novas empresas trazem maior agilidade tecnológica para modernizar sistemas de segurança e monitoramento do país.\nO ecossistema atrai o interesse de investidores e parcerias governamentais voltadas para a soberania tecnológica nacional.\nA movimentação sinaliza uma mudança estratégica relevante na integração entre o setor privado e a defesa tecnológica japonesa.","link":"https://www.nikkei.com/article/DGXZQOGR134GC0T10C26A8000000/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"hepco.co.jp","pais":"Japão","titulo":"Japão aprova projeto de energia eólica flutuante de última geração para acelerar transição energética","resumo":"O projeto de pesquisa de sistemas de energia eólica flutuante offshore de última geração foi selecionado pela agência NEDO do Japão.\nA iniciativa visa desenvolver novas tecnologias para baratear e expandir a captação de energia limpa em águas profundas.\nA tecnologia flutuante é fundamental para o país, que possui costa profunda e busca alternativas sustentáveis à dependência fóssil.\nCom o apoio estatal, as empresas envolvidas esperam consolidar o país como referência mundial em energia renovável marítima.","link":"https://www.hepco.co.jp/info/2026/1253163_2073.html","categoria":"ENERGIA LIMPA","lang":"pt"},{"fonte":"spacemedia.jp","pais":"Japão","titulo":"Tecnologia de energia quase permanente promete viabilizar explorações espaciais de longa duração","resumo":"Cientistas japoneses avançam no desenvolvimento de sistemas de energia quase permanentes para suporte de missões espaciais prolongadas.\nA inovação busca garantir o fornecimento contínuo de eletricidade em ambientes extremos, como a Lua e Marte.\nO avanço reduz substancialmente a dependência de reabastecimento ou substituição periódica de fontes energéticas.\nA tecnologia coloca o ecossistema espacial do Japão em posição estratégica para futuras missões internacionais de exploração profunda.","link":"https://spacemedia.jp/interviews/20254","categoria":"EXPLORAÇÃO ESPACIAL","lang":"pt"},{"fonte":"客观日本","pais":"Japão","titulo":"Cientistas japoneses usam sensores quânticos de diamante para medições magnéticas ultraprecisas","resumo":"Pesquisadores do Instituto de Ciência de Tóquio utilizaram sensores quânticos baseados em diamantes para medir campos magnéticos fracos a curta distância.\nA tecnologia alcançou alta sensibilidade inédita, abrindo novas fronteiras para diagnósticos médicos e desenvolvimento de materiais.\nA capacidade de mapear variações magnéticas ínfimas impulsiona também a computação quântica e a microeletrônica de precisão.\nO feito consolida o papel de liderança das instituições japonesas no campo da física aplicada e da metrologia quântica.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_new/pt20260817000011.html","categoria":"TECNOLOGIA QUÂNTICA","lang":"pt"},{"fonte":"eeo.com.cn","pais":"China","titulo":"Abertura de capital da Unitree Robotics lidera a corrida dos robôs humanoides","resumo":"A Unitree Robotics deu um passo decisivo em direção à sua oferta pública inicial (IPO), consolidando sua liderança no setor de robótica humanoide. O avanço reflete o rápido crescimento da indústria de robótica na China, impulsionado por fortes investimentos em inteligência artificial e automação industrial. A listagem promete acelerar o desenvolvimento e a comercialização em massa dessa tecnologia no mercado global.","link":"https://www.eeo.com.cn/2026/0817/1000969.shtml","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"中国科学院","pais":"China","titulo":"Pesquisadores chineses e internacionais observam estrutura nuclear inédita","resumo":"Uma colaboração internacional liderada por cientistas chineses conseguiu observar uma estrutura física peculiar no interior dos núcleons. A descoberta representa um marco significativo para a física nuclear de alta energia, fornecendo novas perspectivas sobre a interação forte e os constituintes fundamentais da matéria. Os resultados abrem caminhos para experimentos mais profundos em aceleradores de partículas de última geração.","link":"https://www.cas.cn/cm/202608/t20260817_5118419.shtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"jxt.hubei.gov.cn","pais":"China","titulo":"Base de inovação em veículos inteligentes e limpos conclui estrutura principal com aporte de 1 bi de yuans","resumo":"A nova base de inovação para veículos comerciais de nova energia e conectados inteligentemente da CATARC teve suas obras estruturais concluídas na China. Com um investimento total de 1 bilhão de yuans, o complexo servirá como centro estratégico para testes, homologação e pesquisa de tecnologias automotivas avançadas. A iniciativa visa impulsionar a transição da frota comercial para padrões autônomos e de emissão zero.","link":"http://jxt.hubei.gov.cn/bmdt/rdjj/202608/t20260817_5995639.shtml","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"Investing.com Nigeria","pais":"China","titulo":"Ações da fabricante de chips de IA Shanghai Biren Technology disparam no mercado","resumo":"As ações da Shanghai Biren Technology registraram forte alta após previsões otimistas de receita e avanço na produção de chips de inteligência artificial. A startup chinesa de semicondutores tem se posicionado como uma peça-chave nos esforços nacionais de autossuficiência tecnológica frente a restrições internacionais. O movimento reflete a forte demanda do mercado por soluções de hardware voltadas a grandes modelos de linguagem.","link":"https://ng.investing.com/news/stock-market-news/why-is-shanghai-biren-technology-stock-rallying-today-93CH-2662001","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"新京报","pais":"China","titulo":"China alcança avanço crucial em tecnologias de detecção de terras raras","resumo":"Cientistas chineses anunciaram um progresso expressivo nas técnicas e equipamentos de análise e detecção de elementos de terras raras. A novidade otimiza o controle de qualidade e a rastreabilidade na cadeia de suprimentos de minerais críticos essenciais para eletrônicos e energia limpa. Esse salto tecnológico fortalece o domínio do país no processamento avançado e na garantia de autonomia do setor.","link":"https://www.bjnews.com.cn/detail/1786935944129493.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"gd.chinanews.com.cn","pais":"China","titulo":"Guangdong lança primeiro crédito bancário baseado em tokens de poder computacional","resumo":"A província de Guangdong apresentou o crédito 'Bank of China Computing Power Token', um produto financeiro inédito para apoiar a economia de modelos de IA. A iniciativa visa financiar empresas que necessitam de alta capacidade de processamento gráfico e computação em nuvem para treinamento de algoritmos. A medida conecta o setor bancário tradicional às demandas crescentes da infraestrutura de inteligência artificial na região.","link":"http://www.gd.chinanews.com.cn/2026/2026-08-17/449161.shtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"finance.eastmoney.com","pais":"China","titulo":"China Solar cria subsidiária focada em serviços de armazenamento de energia em Hainan","resumo":"A China Solar expandiu suas operações com o estabelecimento de uma nova empresa de tecnologia na província de Hainan, dedicada a serviços técnicos de armazenamento de energia. A iniciativa reforça a infraestrutura para integração de fontes renováveis na rede elétrica regional e apoia as metas de descarbonização da China. A nova subsidiária atuará no desenvolvimento de soluções para estabilidade energética de grande escala.","link":"https://finance.eastmoney.com/a/202608173842946719.html","categoria":"ENERGIA VERDE","lang":"pt"},{"fonte":"csteelnews.com","pais":"China","titulo":"Tecnologias revolucionárias de descarbonização são essenciais para a neutralidade de carbono","resumo":"Especialistas no setor industrial chinês destacaram que a inovação radical em tecnologias de captura, uso e armazenamento de carbono é o único caminho para atingir a neutralidade de carbono. A abordagem foca na transformação profunda dos setores siderúrgico e de energia pesada por meio de processos tecnológicos emergentes. A estratégia reforça o compromisso do país em alinhar o crescimento econômico à sustentabilidade ambiental.","link":"http://www.csteelnews.com/xwzx/djbd/202608/t20260817_112474.html","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"The Indian Express","pais":"Índia","titulo":"Nvidia reduz garantia de financiamento para centro de dados da OpenAI em Ohio","resumo":"A Nvidia decidiu recalibrar suas garantias financeiras vinculadas ao desenvolvimento do novo centro de dados da OpenAI localizado no estado de Ohio, nos Estados Unidos. Essa movimentação reflete ajustes estratégicos e reavaliações de riscos no setor de infraestrutura para inteligência artificial generativa. A decisão gera impacto direto no ecossistema global de supercomputação, levantando novos debates sobre a sustentabilidade e os custos operacionais massivos exigidos pela IA.","link":"https://indianexpress.com/article/technology/artificial-intelligence/nvidia-scales-back-funding-guarantee-for-ohio-openai-data-center-report-10836549/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Genetic Literacy Project","pais":"Índia","titulo":"Como a tecnologia transformou a Índia e dobrou sua expectativa de vida em três gerações","resumo":"Ao longo das últimas três gerações, a Índia utilizou inovações tecnológicas e avanços científicos para reformular completamente suas redes de saúde pública e produção agrícola. O país, que enfrentava crises sistêmicas de abastecimento e altos índices de mortalidade, conseguiu garantir a segurança alimentar de sua população. Essa revolução tecnológica impulsionou a expectativa de vida média dos indianos para mais que o dobro, consolidando o impacto social da tecnologia.","link":"https://geneticliteracyproject.org/2026/08/17/how-technology-transformed-india-from-a-health-basket-case-into-a-breadbasket-in-three-generations-and-more-than-doubled-its-life-expectancy/","categoria":"CIÊNCIA E TECNOLOGIA","lang":"pt"},{"fonte":"LinkedIn","pais":"Índia","titulo":"A fortaleza de dados da Índia se torna um emaranhado de conflitos regulatórios","resumo":"A regulamentação de proteção de dados na Índia vem enfrentando complexos desafios jurídicos e operacionais devido à sobreposição de normas governamentais e disputas de jurisdição. Especialistas apontam que a tentativa do país de criar um ambiente digital altamente protegido acabou gerando incertezas para empresas de tecnologia e cidadãos. O impasse reflete a dificuldade de equilibrar a soberania nacional de dados com a inovação tecnológica contínua.","link":"https://www.linkedin.com/pulse/indias-data-fortress-maze-conflicts-zerodha-pmjlf","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"livemint.com","pais":"Índia","titulo":"O trabalho presencial não voltará: IA e modelos híbridos encerram a rotina tradicional","resumo":"O avanço da inteligência artificial e a consolidação das ferramentas digitais transformaram irreversivelmente a dinâmica do mercado de trabalho global. A jornada tradicional em escritório foi substituída por modelos híbridos e remotos mais flexíveis, que continuam a ganhar a adesão dos profissionais. Embora muitos executivos ainda relutem em aceitar essa mudança, dados mostram que a produtividade impulsionada pela tecnologia inviabiliza o retorno ao modelo antigo.","link":"https://www.livemint.com/mint-lounge/ideas/future-of-work-technology-artifical-intelligence-hybrid-remote-work-models-11783683222764.html","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"livemint.com","pais":"Índia","titulo":"Economia de US$ 20 trilhões até 2036: Os 5 motores de crescimento da Índia","resumo":"Um novo relatório projeta que a economia da Índia pode atingir a marca de US$ 20 trilhões nas próximas duas décadas, impulsionada por cinco pilares estratégicos de expansão. O plano destaca o papel fundamental da transformação digital, inovação tecnológica, infraestrutura e expansão industrial como alavancas essenciais para o salto econômico. Se mantida essa trajetória, o país consolidará sua posição como uma das maiores potências globais no cenário pós-industrial.","link":"https://www.livemint.com/economy/india-20-trillion-economy-2036-five-engines-reform-human-capital-markets-services-governance-rupee-growth-equirus-report-11786892254309.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"greaterkashmir.com","pais":"Índia","titulo":"Liderem o uso da tecnologia na modernização do sistema judiciário, orienta presidente da Suprema Corte","resumo":"O presidente da Suprema Corte da Índia instou as universidades de direito a não apenas adaptarem-se às novas ferramentas digitais, mas a liderarem sua aplicação no Judiciário. A integração de tecnologias avançadas e inteligência artificial nas rotinas jurídicas visa acelerar o processamento de casos e expandir o acesso à justiça no país. A iniciativa reforça a necessidade de formar profissionais capacitados para guiar a transformação digital nas instituições legais.","link":"https://www.greaterkashmir.com/national/dont-just-adapt-but-lead-in-determining-use-of-technology-to-reshape-legal-system-cji-to-nlus-12265515","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The Times of India","pais":"Índia","titulo":"PV Sindhu recorre à ciência do esporte em busca do sexto título mundial","resumo":"A estrela indiana do badminton, PV Sindhu, adotou novos métodos baseados em ciência do esporte e condicionamento físico de alta precisão para sua preparação rumo ao Campeonato Mundial. O programa combina análise biomecânica, monitoramento contínuo de dados e treinamentos personalizados para otimizar o rendimento e prevenir lesões no atleta. Essa abordagem destaca a crescente importância da tecnologia científica na preparação de competidores de elite em nível global.","link":"https://timesofindia.indiatimes.com/sports/badminton/pv-sindhu-turns-to-sports-science-strength-conditioning-in-bid-for-record-sixth-world-championships-medal/articleshow/133273739.cms","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Times of India","pais":"Índia","titulo":"Índia necessita de crescimento acelerado e rupia forte para alcançar meta de US$ 20 trilhões","resumo":"Análises econômicas recentes indicam que a Índia precisará sustentar altas taxas de crescimento anual e fortalecer a sua moeda nacional para atingir a meta de US$ 20 trilhões até 2036. O estudo enfatiza que a aceleração do crescimento depende de investimentos maciços em tecnologia, transição energética e modernização industrial. A valorização da rupia perante o cenário global é apontada como pilar crítico para assegurar a estabilidade do plano de expansão.","link":"https://timesofindia.indiatimes.com/business/india-business/india-needs-faster-growth-stronger-rupee-to-hit-20-trillion-economy-by-2036-report/articleshow/133271328.cms","categoria":"MERCADO","lang":"pt"},{"fonte":"Jornal de Negócios","pais":"Portugal","titulo":"Após recorde de 2025, exportações de alta tecnologia continuam em alta até junho","resumo":"As exportações portuguesas de produtos de alta tecnologia mantêm uma trajetória ascendente no primeiro semestre, dando continuidade ao desempenho histórico de 2025.\nO setor tecnológico consolida-se como um dos principais motores do comércio externo do país, impulsionado por componentes eletrônicos e inovação industrial.\nEssa tendência positiva reforça a competitividade internacional das empresas locais e atrai novos investimentos estratégicos para a região.","link":"https://www.jornaldenegocios.pt/economia/conjuntura/detalhe/apos-recorde-de-2025-exportacoes-de-alta-tecnologia-continuam-a-somar-ate-junho","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Leak.pt","pais":"Portugal","titulo":"LIDL lança secador com tecnologia iônica por 12,99€","resumo":"A rede de supermercados LIDL apresentou um novo secador de cabelo equipado com tecnologia iônica, posicionando o produto como uma alternativa acessível no mercado de eletrônicos.\nO dispositivo busca atender consumidores que procuram recursos avançados de cuidados pessoais sem a necessidade de grandes investimentos financeiros.\nO lançamento reforça a estratégia da varejista em democratizar itens eletrodomésticos com recursos tecnológicos modernos.","link":"https://www.leak.pt/lidl-secador-cien-beauty-ionico/","categoria":"CONSUMO","lang":"pt"},{"fonte":"Rádio Hertz","pais":"Portugal","titulo":"Tomar – Carlos Moisés destaca curso de Tecnologia e Produção nas Artes do Espetáculo","resumo":"O músico Carlos Moisés destacou a importância da formação acadêmica e técnica no setor cultural ao abordar o curso de Tecnologia e Produção nas Artes do Espetáculo em Tomar.\nA iniciativa visa capacitar novos profissionais no uso de ferramentas tecnológicas modernas para produção de eventos, cenografia e iluminação.\nO projeto reforça a integração necessária entre inovação digital e o desenvolvimento da indústria criativa regional.","link":"https://radiohertz.pt/tomar-carlos-moises-fala-sobre-curso-de-tecnologia-e-producao-nas-artes-do-espetaculo/","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"tek.sapo.pt","pais":"Portugal","titulo":"Passado da Terra pode esconder padrão de catástrofes que a ciência tenta explicar","resumo":"Pesquisadores estão investigando registros geológicos antigos para identificar se grandes eventos de extinção e mudanças climáticas no planeta seguem um padrão cíclico.\nA hipótese sugere que fenômenos astronômicos ou dinâmicas internas da Terra podem ter desencadeado crises ambientais periódicas ao longo dos milênios.\nA compreensão dessa cronologia é fundamental para avaliar riscos e prever vulnerabilidades futuras do ecossistema global.","link":"https://tek.sapo.pt/noticias/ciencia/artigos/passado-da-terra-pode-esconder-padrao-de-catastrofes-que-a-ciencia-ainda-tenta-explicar/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Jornal de Negócios","pais":"Portugal","titulo":"Governo reserva 45 milhões de euros para Laboratórios Colaborativos","resumo":"O Governo português anunciou a alocação de um montante de 45 milhões de euros destinado ao financiamento e fortalecimento dos Laboratórios Colaborativos.\nA medida visa impulsionar a transferência de conhecimento entre a academia e o setor produtivo, acelerando o desenvolvimento de soluções tecnológicas inovadoras.\nO investimento reforça o ecossistema nacional de investigação e promove a retenção de talentos científicos qualificados.","link":"https://www.jornaldenegocios.pt/economia/politica/detalhe/governo-reserva-45-milhoes-para-laboratorios-colaborativos","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Abertas candidaturas de 45 milhões de euros no programa Compete 2030","resumo":"Estão abertas as candidaturas para o novo aviso do programa Compete 2030, disponibilizando 45 milhões de euros em fundos europeus para empresas e instituições de pesquisa.\nO aviso tem como foco principal o apoio a projetos de modernização tecnológica, transição digital e capacitação avançada.\nEntidades elegíveis podem submeter propostas com o objetivo de aumentar a produtividade e a competitividade no mercado internacional.","link":"https://jornaleconomico.sapo.pt/noticias/abertas-candidaturas-de-45-milhoes-de-euros-no-compete-2030/","categoria":"INCENTIVOS","lang":"pt"},{"fonte":"Expresso","pais":"Portugal","titulo":"Compete 2030: 45 milhões de euros para reforço tecnológico com inscrições até 15 de outubro","resumo":"O programa Compete 2030 definiu o prazo até 15 de outubro para a submissão de candidaturas ao fundo de 45 milhões de euros voltado ao fortalecimento tecnológico.\nO financiamento destina-se a modernizar estruturas produtivas e acelerar a adoção de tecnologias avançadas pelo tecido empresarial.\nA iniciativa representa uma oportunidade crucial para consolidar parcerias estratégicas entre centros de pesquisa e a indústria.","link":"https://expresso.pt/economia/2026-08-16-compete-2030-45-milhoes-de-euros-para-reforcar-capacidade-tecnologica-esperam-candidaturas-ate-15-de-outubro-76b89a4c","categoria":"INVESTIMENTO","lang":"pt"},{"fonte":"O Mirante","pais":"Portugal","titulo":"Flamingo Mountain se destaca com obras personalizadas, tecnologia 3D e serviços florestais","resumo":"A empresa Flamingo Mountain vem ganhando notoriedade ao integrar modelagem e impressão 3D avançada em projetos de engenharia e serviços florestais.\nA combinação entre sustentabilidade e manufatura aditiva permite a criação de soluções sob medida com elevada precisão e menor desperdício de insumos.\nA atuação demonstra a expansão da aplicação prática de tecnologias tridimensionais em setores tradicionais da economia.","link":"https://omirante.pt/edicao-1500/2026-08-16-flamingo-mountain-destaca-se-com-obras-personalizadas-tecnologia-3d-e-servicos-florestais-b0735f37","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Balada IN","pais":"Brazil","titulo":"Elon Musk Predicts Money Will Lose Importance by 2036 with the Advance of AI","resumo":"Entrepreneur Elon Musk stated that the rapid advancement of artificial intelligence will radically transform the global economy in the coming decades.\nAccording to him, the abundance of automated goods and services will render the traditional concept of money obsolete by the year 2036.\nThe statement sparks deep debates about the future of work, income distribution, and the socioeconomic impacts of total automation.","link":"https://www.portalin.com.br/negocios/elon-musk-preve-que-dinheiro-perdera-importancia-ate-2036-com-avanco-da-ia/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Agência FAPESP","pais":"Brazil","titulo":"FAPESP Conference Discusses the Transition of Quantum Computing from Laboratories to the Market","resumo":"FAPESP gathered experts and researchers to discuss the advancements and challenges of quantum computing in the current landscape.\nThe meeting focused on how to transform scientific theories and academic prototypes into commercial solutions applicable to strategic sectors.\nThe advancement of this technology promises to revolutionize areas such as cryptography, industrial process optimization, and the development of new materials.","link":"https://agencia.fapesp.br/conferencia-fapesp-debate-a-transicao-da-computacao-quantica-dos-laboratorios-para-o-mercado/58977","categoria":"QUANTUM COMPUTING","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"Discord Has Until This Monday to Suspend Live Streaming in Brazil","resumo":"The Discord platform has received orders to suspend live-streaming features in Brazil amid investigations into online safety.\nDigital law and data protection experts are analyzing the measure's impact on safeguarding children and adolescents in the virtual environment.\nThe case reignites discussions surrounding the responsibility of social media platforms in content moderation and compliance with local laws.","link":"https://g1.globo.com/politica/noticia/2026/08/17/discord-tem-ate-esta-segunda-para-suspender-lives-no-brasil-especialistas-avaliam-protecao-a-menores.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"R7","pais":"Brazil","titulo":"Technology Helps Coffee Growers Save Water and Energy in Irrigation","resumo":"New technological tools and smart sensors are optimizing water management in coffee crops across Brazil.\nThe systems monitor soil moisture in real-time, enabling precise irrigation that reduces operating costs and preserves resources.\nThis innovation strengthens field sustainability and ensures greater productivity in the face of growing climate change.","link":"https://noticias.r7.com/prisma/mundo-agro/tecnologia-ajuda-cafeicultores-a-economizar-agua-e-energia-na-irrigacao-17082026/","categoria":"AGROTECH","lang":"en"},{"fonte":"Rádio Itatiaia","pais":"Brazil","titulo":"Screen Overload: 8 Signs That Your Cell Phone and Social Media May Be Affecting Your Health","resumo":"The prolonged use of electronic devices and social media has raised alarms regarding negative impacts on physical and mental well-being.\nExperts point to symptoms such as sleep disorders, anxiety, eye strain, and a drop in concentration as major warning signs.\nRaising awareness about screen time is crucial for establishing healthier digital habits and preventing chronic issues.","link":"https://www.itatiaia.com.br/ciencia-e-tecnologia/excesso-de-telas-8-sinais-de-que-o-celular-e-redes-sociais-podem-estar-afetando-a-saude/","categoria":"DIGITAL HEALTH","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"Solar Energy Surpasses Global Milestone and Accelerates Expansion at Unprecedented Scale","resumo":"Solar power generation has reached historic milestones in installed capacity globally, driven by new investments.\nFalling costs of photovoltaic panels and energy transition policies have accelerated the adoption of the resource across various countries.\nThis advancement solidifies solar power as an essential pillar for the decarbonization of the energy matrix and the fight against global warming.","link":"https://www1.folha.uol.com.br/mercado/2026/08/energia-solar-supera-marco-global-e-acelera-expansao.shtml","categoria":"RENEWABLE ENERGY","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"Engineering Students from Sorocaba Win National Award with Games and Nuclear Technology App","resumo":"University students have developed interactive games and an application focused on spreading knowledge about nuclear technology.\nThe innovative project won first place in a national award encouraging applied science and engineering.\nThe initiative seeks to demystify nuclear energy, highlighting its beneficial applications in medicine, industry, and clean power generation.","link":"https://g1.globo.com/sp/sorocaba-jundiai/noticia/2026/08/16/alunos-de-engenharia-de-sorocaba-vencem-premio-nacional-com-jogos-e-app-de-tecnologia-nuclear.ghtml","categoria":"SCIENCE","lang":"en"},{"fonte":"Conflits : Revue de Géopolitique","pais":"Brazil","titulo":"Brazil: Petrobras Detects Signs of Oil Presence off the Amazon Coast","resumo":"Petrobras has identified the presence of hydrocarbons during exploratory drilling at the Equatorial Margin off the Amazon coast.\nThe discovery reinforces the region's energy potential, although it faces rigorous environmental reviews and regulatory debates.\nAdditional scientific studies will be conducted to assess the economic viability of the well and the impacts of resource exploration.","link":"https://www.revueconflits.com/bresil-petrobras-detecte-des-indices-de-presence-de-petrole-au-large-de-lamazonie/","categoria":"ENERGY","lang":"en"},{"fonte":"Bloomberg.com","pais":"United States","titulo":"Stripe Closes Over $7 Billion Deal to Buy AI Firm OpenRouter","resumo":"Payments giant Stripe has closed a landmark deal of over $7 billion to acquire OpenRouter, a startup specializing in AI model routing.\nThe acquisition marks a major expansion for Stripe into the artificial intelligence ecosystem, seeking to integrate advanced infrastructure into its financial solutions.\nThe move highlights the growing consolidation of the technology market by large global digital service companies.","link":"https://www.bloomberg.com/news/articles/2026-08-16/stripe-nears-deal-to-buy-ai-firm-openrouter-for-over-7-billion","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"BBC","pais":"United States","titulo":"If Meta Loses This Lawsuit, Instagram and Facebook Could Change Forever","resumo":"Meta is facing a decisive antitrust lawsuit brought by regulators in the United States that puts the structure of its digital empire at risk.\nThe legal action could force Mark Zuckerberg's company to sell off valuable assets, such as the Instagram and WhatsApp platforms.\nA defeat in court would completely redefine the dynamics of social media and the global advertising market.","link":"https://www.bbc.com/news/articles/clyqpx6xk69o","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Época Negócios","pais":"United States","titulo":"Meta Applies for Patent for Smart Glasses with Facial Recognition","resumo":"Meta has submitted a patent application to integrate facial recognition technology into its upcoming augmented reality smart glasses.\nThe feature aims to allow the device to identify people in real-time and display contextual information directly on the user's display.\nThe initiative raises intense debates regarding data security, ethics, and the limits of privacy in the era of wearable devices.","link":"https://epocanegocios.globo.com/google/amp/tecnologia/noticia/2026/08/meta-pede-registro-de-patente-para-oculos-com-reconhecimento-facial.ghtml","categoria":"INNOVATION","lang":"en"},{"fonte":"The Mendocino Voice","pais":"United States","titulo":"California Recruits Teens to Advise on State's AI and Technology Decisions","resumo":"The government of California has launched an unprecedented initiative to include teenagers on the state's artificial intelligence policy advisory board.\nYoung people will offer direct perspectives on the impact of new technologies on education, the job market, and the daily lives of the new generation.\nThe strategy seeks to ensure that state regulations consider the viewpoint of digital natives before implementing new laws.","link":"https://mendovoice.com/2026/08/california-recruits-teens-to-help-advise-on-states-ai-and-technology-decisions/","categoria":"PUBLIC POLICY","lang":"en"},{"fonte":"Sud Ouest","pais":"United States","titulo":"Trump Administration Cancels Landmark Arctic Climate Report","resumo":"The Trump administration has made the decision to cancel the publication of a foundational scientific report focused on climate change in the Arctic region.\nScientists and environmental researchers heavily criticized the measure, accusing the administration of attempting to suppress crucial data on global warming.\nThe cancellation creates strong uncertainty regarding the future of public funding for climate monitoring research in the United States.","link":"https://www.sudouest.fr/environnement/climat/ils-essayent-vraiment-d-enterrer-la-science-l-administration-trump-annule-un-rapport-de-reference-sur-le-climat-de-l-arctique-30277150.php","categoria":"SCIENCE","lang":"en"},{"fonte":"simplywall.st","pais":"United States","titulo":"How Investors Can Reset Positions as Marvell Expands into AI Memory","resumo":"Marvell Technology announced the expansion of its memory infrastructure portfolio aimed specifically at artificial intelligence data centers.\nThe strategic move seeks to capture the growing market demand for hardware capable of processing massive AI workloads.\nInvestors are watching with optimism the company's ability to compete directly with other global giants in the semiconductor sector.","link":"https://simplywall.st/stocks/us/semiconductors/nasdaq-mrvl/marvell-technology/news/how-investors-may-respond-to-marvell-technology-mrvl-expandi","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"NavalToday","pais":"United States","titulo":"Ultra Maritime Tests Autonomous Technology for Anti-Submarine Warfare and Unmanned Vehicles","resumo":"Ultra Maritime has successfully conducted tests with autonomous technologies aimed at anti-submarine warfare and the neutralization of unmanned underwater vehicles.\nThe trials demonstrated the effectiveness of robotic systems in identifying and responding to maritime threats with reduced human intervention.\nThe advancement reflects the rapid acceleration in the use of automation and artificial intelligence for defense and naval sovereignty.","link":"https://navaltoday.com/2026/08/17/ultra-maritime-tests-autonomous-technology-for-counter-uuv-and-asw","categoria":"MILITARY TECHNOLOGY","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"United States","titulo":"Astronomy Picture of the Day: An Eclipse with a Golden Corona","resumo":"NASA has highlighted a stunning image capturing the dazzling details of the solar corona during a total solar eclipse. The photograph reveals complex magnetic structures and plasma loops visible only at the exact moment the Moon completely blocks out the solar disk. The record serves as a valuable educational and scientific resource for astronomers and solar physics enthusiasts worldwide.","link":"https://science.nasa.gov/image-article/apod-2026-august-17-a-golden-corona-eclipse/","categoria":"ASTRONOMY","lang":"en"},{"fonte":"L'Avenir","pais":"France","titulo":"Trump's \"Anti-Vax\" Policy Triggers a Surge in Measles Cases","resumo":"Recent vaccine-skeptical guidelines and statements associated with Donald Trump's political administration have been causing an alarming increase in measles outbreaks. Public health experts warn that dropping immunization rates put historic medical achievements at risk and threaten collective health. The scenario sounds a global alarm regarding the impacts of misinformation on containing vaccine-preventable diseases.","link":"https://www.lavenir.net/actu/2026/08/17/la-politique-antivax-de-trump-fait-flamber-les-cas-de-rougeole-2COGMVM6S5EKPPBYSF6UTWDPTI/","categoria":"HEALTH","lang":"en"},{"fonte":"pieuvre.ca","pais":"France","titulo":"With Their \"Black Boxes,\" Are New Technologies Erroding Trust in Science?","resumo":"The accelerated advancement of complex technological systems and artificial intelligence algorithms, frequently described as \"black boxes\" due to their lack of transparency, is raising doubts among the scientific community and the public. The opacity in these processes makes it difficult to verify results and understand how decisions are made. Consequently, a crucial ethical debate is emerging over the impact of technical unaccountability on society's credibility and trust in modern science.","link":"https://www.pieuvre.ca/2026/08/16/science-ia-boite-noire-confiance/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Science et vie","pais":"France","titulo":"Estimated Losses of 180 Billion Euros: Drought and Heatwaves Threaten the European Economy","resumo":"Recent studies indicate that extreme weather events, such as severe droughts and prolonged heatwaves, could cause damages of up to 180 billion euros across the European continent. Direct impacts severely affect strategic sectors like agriculture, energy generation, and urban infrastructure. Facing this alarming scenario, experts reinforce the urgency of investments in ecological transition and climate adaptation measures to mitigate future economic and environmental disasters.","link":"https://www.science-et-vie.com/nature-et-environnement/des-pertes-estimees-a-180-milliards-deuros-la-secheresse-et-les-vagues-de-chaleur-menacent-leconomie-europeenne-254917.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Science et vie","pais":"France","titulo":"Brown or White Eggs: Science Finally Reveals What Actually Changes","resumo":"Scientific studies clarify recurring questions about the nutritional and flavor differences between brown- and white-shelled eggs. Research demonstrates that shell color is determined solely by the genetics and breed of the chicken, and does not affect the nutritional quality of the food. The only real variations observed in nutritional value stem directly from the birds' diet and management, demystifying long-held popular beliefs.","link":"https://www.science-et-vie.com/corps-et-sante/oeufs-bruns-ou-blancs-la-science-revele-enfin-ce-qui-change-vraiment-215681.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Science et vie","pais":"France","titulo":"Scientists Are Unanimous: Squeezie, Léna Situations, and Inoxtag's Ciao Energy Drink Is \"Problematic\"","resumo":"The launch of the Ciao Energy drink, conceived by French digital influencers Squeezie, Léna Situations, and Inoxtag, has sparked strong criticism and concern among nutrition and public health experts. The scientific community warns about high levels of caffeine and additives, associated with the risks of excessive consumption by young audiences drawn to the content creators. The debate raises ethical questions regarding the responsibility of major internet figures in promoting potentially health-harming products.","link":"https://www.science-et-vie.com/corps-et-sante/les-scientifiques-sont-unanimes-la-boisson-ciao-energy-de-squeezie-lena-situations-et-inoxtag-est-problematique-243258.html","categoria":"TRENDING","lang":"en"},{"fonte":"BBC","pais":"United Kingdom","titulo":"Sainsbury's Pauses AI Cameras Following Wrongful Customer Removal","resumo":"British supermarket chain Sainsbury's has temporarily suspended the use of artificial intelligence cameras in its stores after an incident where a customer was wrongfully removed. The automated surveillance system aimed to identify suspicious behavior and shoplifting, but accuracy flaws raised serious concerns regarding privacy and false positives. The case reignites the debate over the limits and ethics of biometric monitoring in the retail sector.","link":"https://www.bbc.com/news/articles/cddjlmeqjgyo","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"United Kingdom","titulo":"Loosening Planning Rules in England Will Allow More Housing Near Stations","resumo":"The English government has announced a relaxation of urban planning regulations to encourage the construction of new homes near train stations. The measure seeks to combat the country's severe housing crisis, optimizing the use of public transport and revitalizing connected urban areas. Experts point out that the change could significantly accelerate project approvals, though it still faces resistance from local communities.","link":"https://www.theguardian.com/politics/2026/aug/17/loosening-planning-rules-england-more-homes-train-stations-rayner","categoria":"INFRASTRUCTURE","lang":"en"},{"fonte":"City AM","pais":"United Kingdom","titulo":"US Bond Market Jitters Spark UK Recession Warning","resumo":"Recent volatility in the United States debt bond market has generated worrying developments for the UK economy, elevating recession warnings. The rise in US bond yields puts pressure on global interest rates, driving up British public and private financing costs. Analysts warn that this scenario limits the government's financial wiggle room and could substantially slow down investments in the country.","link":"https://www.cityam.com/us-bond-market-jitters-spark-uk-economy-recession-warning/","categoria":"ECONOMY","lang":"en"},{"fonte":"BBC","pais":"United Kingdom","titulo":"First Electric Ferrari Fetches Record $40 Million at Auction","resumo":"The first entirely electric vehicle produced by Ferrari has been hammered down for a record $40 million at an exclusive auction. The model represents a decisive milestone in the iconic Italian brand's transition toward high-performance electrification while maintaining luxury standards. The astronomical sale demonstrates collectors' enormous interest in historic electric prototypes and solidifies the segment's relevance in the automotive market.","link":"https://www.bbc.com/news/articles/c77ggpgrp2do","categoria":"INNOVATION","lang":"en"},{"fonte":"OkDiario","pais":"Spain","titulo":"Science Confirms: The Covid Vaccine Protects Us Against Future Coronaviruses","resumo":"Recent scientific studies confirm that the immunization generated by Covid-19 vaccines offers broader protection than previously thought. The body's immune response mechanism helps neutralize different variants and other emerging coronaviruses. This discovery reinforces the importance of vaccination campaigns for the prevention of future global pandemics.","link":"https://okdiario.com/salud/ciencia-lo-confirma-vacuna-contra-covid-nos-protege-coronavirus-del-futuro-19096914","categoria":"SCIENCE","lang":"en"},{"fonte":"EL PAÍS","pais":"Spain","titulo":"Teenage Girls Start at a Disadvantage in Learning Artificial Intelligence","resumo":"Research points to a gender disparity in access to and interest in learning artificial intelligence during adolescence. Cultural factors and a lack of encouragement in technology fields contribute to steering young women away from this rapidly expanding field. Bridging this gap is crucial to ensuring equal opportunities in the future job market.","link":"https://elpais.com/educacion/2026-08-17/las-adolescentes-parten-con-desventaja-en-el-aprendizaje-de-la-inteligencia-artificial.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"OkDiario","pais":"Spain","titulo":"Science Confirms: Heating Plastic Containers in the Microwave Is Never a Good Idea","resumo":"The scientific community warns of health risks when heating plastic containers in the microwave oven. Heat facilitates the release of microplastics and harmful chemicals into food, which are associated with hormonal disorders. Experts recommend substituting them with glass or ceramic containers to ensure food safety.","link":"https://okdiario.com/okgreen/ciencia-lo-confirma-calentar-envases-plastico-microondas-nunca-buena-idea-16620675/amp","categoria":"SCIENCE","lang":"en"},{"fonte":"eldebate.com","pais":"Spain","titulo":"Bird That Learns to Sing Like Humans Reveals Thousands of Genes Unknown to Science","resumo":"Researchers have mapped the genome of a bird species capable of impressively mimicking human vocal patterns. The discovery revealed thousands of previously unknown genes related to vocal learning and brain plasticity. The breakthrough could open new pathways for understanding the evolution of language and treating speech disorders in medicine.","link":"https://www.eldebate.com/ciencia/20260817/ave-aprende-cantar-como-humanos-revela-miles-genes-ciencia-desconocia_448818.html","categoria":"SCIENCE","lang":"en"},{"fonte":"El Desmarque","pais":"Spain","titulo":"Renault Launches Electric Vehicle That Surprises in Quality and Tech, Rivaling Audi and BMW","resumo":"Renault has unveiled a new electric vehicle model that stands out for its high build quality and advanced technological features. The automobile positions itself as a strong competitor to established luxury brands like Audi and BMW. This innovation signals a significant shift in the manufacturer's strategy to lead the global energy transition.","link":"https://www.eldesmarque.com/coches-y-motos/20260816/renault-electrico-tecnologia-audi-bmw_18_019943514.html","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"OkDiario","pais":"Espanha","titulo":"Ciência bate recorde e obtém o DNA animal mais antigo da África Subsaariana","resumo":"Cientistas alcançaram um marco histórico ao recuperar e sequenciar o DNA animal mais antigo já registrado na África Subsaariana. O material genético pertence a um antílope pré-histórico e oferece dados valiosos sobre a evolução da fauna na região. A conquista tecnológica amplia substancialmente os limites da paleogenética em climas quentes.","link":"https://okdiario.com/naturaleza/confirmado-ciencia-destroza-otro-record-consigue-adn-animal-mas-antiguo-del-africa-sub-sahariana-antilope-hace-50-000-anos-19100723","categoria":"CIÊNCIA","lang":"en"},{"fonte":"avpasion.com","pais":"Espanha","titulo":"Sennheiser quer reinventar o som da Fórmula E com a tecnologia AMBEO","resumo":"A Sennheiser firmou parceria para aplicar sua avançada tecnologia de áudio 3D AMBEO nas transmissões da Fórmula E. A proposta visa proporcionar aos espectadores uma experiência imersiva inédita, capturando nuances do som dos carros elétricos. O projeto exemplifica como a inovação acústica pode transformar o entretenimento esportivo moderno.","link":"https://www.avpasion.com/sennheiser-reinventar-sonido-formula-e-ambeo/","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"Xataka","pais":"Espanha","titulo":"Há 25 anos nos apaixonamos pela tecnologia transparente; esse amor está de volta","resumo":"O design de dispositivos eletrônicos com carcaças transparentes, famoso no final dos anos 1990, está retornando com força ao mercado. Diversas fabricantes apostam na nostalgia aliada à estética futurista para diferenciar seus produtos no setor de tecnologia. A tendência reconecta os consumidores com a essência do hardware aparente em acessórios contemporâneos.","link":"https://www.xataka.com/historia-tecnologica/hace-25-anos-nos-enamoramos-tecnologia-transparente-ese-amor-pasado-esta-vuelta","categoria":"TENDÊNCIAS","lang":"en"},{"fonte":"Poder360","pais":"Alemanha","titulo":"Calor extremo já causa perdas bilionárias à economia europeia","resumo":"O aumento constante das temperaturas e as ondas de calor extremo estão gerando prejuízos bilionários para a economia europeia. Setores fundamentais como agricultura, transporte, energia e produtividade industrial têm sido gravemente afetados pelas condições climáticas severas. Especialistas destacam a necessidade urgente de investimentos em infraestrutura e adaptação climática para conter a escalada dos danos financeiros nos próximos anos.","link":"https://www.poder360.com.br/poder-internacional/calor-extremo-ja-causa-perdas-bilionarias-a-economia-europeia/","categoria":"ECONOMIA","lang":"en"},{"fonte":"Yahoo!ファイナンス","pais":"Japão","titulo":"Honda avança no desenvolvimento de tecnologias de segurança veicular com uso de IA","resumo":"A Honda anunciou a expansão do uso de inteligência artificial no desenvolvimento de suas tecnologias de segurança veicular.\nA iniciativa busca aprimorar os sistemas de assistência ao motorista e prevenir acidentes com maior precisão em tempo real.\nCom essa abordagem inovadora, a empresa reforça seu compromisso de zerar mortes no trânsito envolvendo seus veículos no futuro.\nO avanço coloca a montadora japonesa em destaque na corrida pela integração de inteligência artificial na indústria automotiva.","link":"https://finance.yahoo.co.jp/news/detail/5a85937ca5b8d92b8b3a645525b72c23d9a30c94","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Princesa Aiko marca presença em conferência internacional de física de semicondutores","resumo":"A princesa Aiko marcou presença em uma importante conferência internacional voltada à física de semicondutores.\nA participação da integrante da família real destaca o apoio institucional do Japão à pesquisa científica e de alta tecnologia.\nO evento reuniu especialistas do mundo todo para debater inovações na produção de chips e novos materiais.\nA presença real chamou a atenção da mídia e reforçou a relevância estratégica do setor para o país.","link":"https://www.nikkei.com/article/DGXZQOUD170EB0X10C26A8000000/","categoria":"CIÊNCIA","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Técnicas de origami inspiram miniaturização de satélites de comunicação no Japão","resumo":"Pesquisadores do Instituto de Ciência de Tóquio utilizaram conceitos de origami para reduzir o tamanho e o peso de satélites de comunicação.\nA aplicação da arte milenar permite que componentes complexos se dobrem de maneira eficiente para o transporte espacial.\nA inovação promete diminuir significativamente os custos de lançamento e facilitar o envio de equipamentos para a órbita terrestre.\nTrata-se de um exemplo prático de como o conhecimento tradicional pode impulsionar soluções tecnológicas de ponta.","link":"https://news.yahoo.co.jp/articles/345244235dbb3982a5899364affa342722a6fbc1","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"朝日新聞","pais":"Japão","titulo":"IA acelera descobertas científicas e levanta debates sobre riscos de autoaperfeiçoamento","resumo":"Modelos avançados de inteligência artificial começam a gerar descobertas científicas de forma autônoma por meio do autoaperfeiçoamento.\nA capacidade dos algoritmos de evoluírem sozinhos acelera significativamente o ritmo de pesquisas em diversas áreas da ciência.\nNo entanto, especialistas alertam para a necessidade de regulamentação para conter os riscos de perda de controle sobre sistemas autônomos.\nA novidade reposiciona a IA não apenas como ferramenta de suporte, mas como agente ativo no avanço do conhecimento científico.","link":"https://www.asahi.com/articles/ASV8D46HNV8DUTFL00PM.html?iref=reporter-bio-cover_timeline","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Startups de defesa ganham força no Japão impulsionadas por drones e inteligência artificial","resumo":"Startups focadas na área de defesa estão ganhando destaque no cenário de inovação japonês ao utilizarem drones e IA.\nEssas novas empresas trazem maior agilidade tecnológica para modernizar sistemas de segurança e monitoramento do país.\nO ecossistema atrai o interesse de investidores e parcerias governamentais voltadas para a soberania tecnológica nacional.\nA movimentação sinaliza uma mudança estratégica relevante na integração entre o setor privado e a defesa tecnológica japonesa.","link":"https://www.nikkei.com/article/DGXZQOGR134GC0T10C26A8000000/","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"hepco.co.jp","pais":"Japão","titulo":"Japão aprova projeto de energia eólica flutuante de última geração para acelerar transição energética","resumo":"O projeto de pesquisa de sistemas de energia eólica flutuante offshore de última geração foi selecionado pela agência NEDO do Japão.\nA iniciativa visa desenvolver novas tecnologias para baratear e expandir a captação de energia limpa em águas profundas.\nA tecnologia flutuante é fundamental para o país, que possui costa profunda e busca alternativas sustentáveis à dependência fóssil.\nCom o apoio estatal, as empresas envolvidas esperam consolidar o país como referência mundial em energia renovável marítima.","link":"https://www.hepco.co.jp/info/2026/1253163_2073.html","categoria":"ENERGIA LIMPA","lang":"en"},{"fonte":"spacemedia.jp","pais":"Japão","titulo":"Tecnologia de energia quase permanente promete viabilizar explorações espaciais de longa duração","resumo"
