:"Cientistas japoneses avançam no desenvolvimento de sistemas de energia quase permanentes para suporte de missões espaciais prolongadas.\nA inovação busca garantir o fornecimento contínuo de eletricidade em ambientes extremos, como a Lua e Marte.\nO avanço reduz substancialmente a dependência de reabastecimento ou substituição periódica de fontes energéticas.\nA tecnologia coloca o ecossistema espacial do Japão em posição estratégica para futuras missões internacionais de exploração profunda.","link":"https://spacemedia.jp/interviews/20254","categoria":"EXPLORAÇÃO ESPACIAL","lang":"en"},{"fonte":"客观日本","pais":"Japão","titulo":"Cientistas japoneses usam sensores quânticos de diamante para medições magnéticas ultraprecisas","resumo":"Pesquisadores do Instituto de Ciência de Tóquio utilizaram sensores quânticos baseados em diamantes para medir campos magnéticos fracos a curta distância.\nA tecnologia alcançou alta sensibilidade inédita, abrindo novas fronteiras para diagnósticos médicos e desenvolvimento de materiais.\nA capacidade de mapear variações magnéticas ínfimas impulsiona também a computação quântica e a microeletrônica de precisão.\nO feito consolida o papel de liderança das instituições japonesas no campo da física aplicada e da metrologia quântica.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_new/pt20260817000011.html","categoria":"TECNOLOGIA QUÂNTICA","lang":"en"},{"fonte":"eeo.com.cn","pais":"China","titulo":"Abertura de capital da Unitree Robotics lidera a corrida dos robôs humanoides","resumo":"A Unitree Robotics deu um passo decisivo em direção à sua oferta pública inicial (IPO), consolidando sua liderança no setor de robótica humanoide. O avanço reflete o rápido crescimento da indústria de robótica na China, impulsionado por fortes investimentos em inteligência artificial e automação industrial. A listagem promete acelerar o desenvolvimento e a comercialização em massa dessa tecnologia no mercado global.","link":"https://www.eeo.com.cn/2026/0817/1000969.shtml","categoria":"ROBÓTICA","lang":"en"},{"fonte":"中国科学院","pais":"China","titulo":"Pesquisadores chineses e internacionais observam estrutura nuclear inédita","resumo":"Uma colaboração internacional liderada por cientistas chineses conseguiu observar uma estrutura física peculiar no interior dos núcleons. A descoberta representa um marco significativo para a física nuclear de alta energia, fornecendo novas perspectivas sobre a interação forte e os constituintes fundamentais da matéria. Os resultados abrem caminhos para experimentos mais profundos em aceleradores de partículas de última geração.","link":"https://www.cas.cn/cm/202608/t20260817_5118419.shtml","categoria":"CIÊNCIA","lang":"en"},{"fonte":"jxt.hubei.gov.cn","pais":"China","titulo":"Base de inovação em veículos inteligentes e limpos conclui estrutura principal com aporte de 1 bi de yuans","resumo":"A nova base de inovação para veículos comerciais de nova energia e conectados inteligentemente da CATARC teve suas obras estruturais concluídas na China. Com um investimento total de 1 bilhão de yuans, o complexo servirá como centro estratégico para testes, homologação e pesquisa de tecnologias automotivas avançadas. A iniciativa visa impulsionar a transição da frota comercial para padrões autônomos e de emissão zero.","link":"http://jxt.hubei.gov.cn/bmdt/rdjj/202608/t20260817_5995639.shtml","categoria":"AUTOMOTIVO","lang":"en"},{"fonte":"Investing.com Nigeria","pais":"China","titulo":"AI chip maker Shanghai Biren Technology shares soar in the market","resumo":"Shares of Shanghai Biren Technology experienced a sharp rise following optimistic revenue forecasts and progress in artificial intelligence chip production. The Chinese semiconductor startup has positioned itself as a key player in national technological self-sufficiency efforts amid international restrictions. The movement reflects strong market demand for hardware solutions tailored to large language models.","link":"https://ng.investing.com/news/stock-market-news/why-is-shanghai-biren-technology-stock-rallying-today-93CH-2662001","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"新京报","pais":"China","titulo":"China achieves crucial breakthrough in rare earth detection technologies","resumo":"Chinese scientists have announced significant progress in the techniques and equipment used for analyzing and detecting rare earth elements. The new development optimizes quality control and traceability in the supply chain of critical minerals essential for electronics and clean energy. This technological leap strengthens the country's dominance in advanced processing and guarantees sector autonomy.","link":"https://www.bjnews.com.cn/detail/1786935944129493.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"gd.chinanews.com.cn","pais":"China","titulo":"Guangdong launches first bank credit based on computing power tokens","resumo":"Guangdong province has introduced the 'Bank of China Computing Power Token' credit, an unprecedented financial product to support the AI model economy. The initiative aims to finance companies that require high graphics processing capacity and cloud computing for algorithm training. The measure connects the traditional banking sector to the growing demands of artificial intelligence infrastructure in the region.","link":"http://www.gd.chinanews.com.cn/2026/2026-08-17/449161.shtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"finance.eastmoney.com","pais":"China","titulo":"China Solar creates subsidiary focused on energy storage services in Hainan","resumo":"China Solar has expanded its operations by establishing a new technology company in Hainan province dedicated to energy storage technical services. The initiative reinforces infrastructure for integrating renewable sources into the regional power grid and supports China's decarbonization goals. The new subsidiary will work on developing large-scale energy stability solutions.","link":"https://finance.eastmoney.com/a/202608173842946719.html","categoria":"GREEN ENERGY","lang":"en"},{"fonte":"csteelnews.com","pais":"China","titulo":"Revolutionary decarbonization technologies are essential for carbon neutrality","resumo":"Experts in the Chinese industrial sector have highlighted that radical innovation in carbon capture, utilization, and storage technologies is the only path to achieving carbon neutrality. The approach focuses on the profound transformation of the steel and heavy energy sectors through emerging technological processes. The strategy reinforces the country's commitment to aligning economic growth with environmental sustainability.","link":"http://www.csteelnews.com/xwzx/djbd/202608/t20260817_112474.html","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"The Indian Express","pais":"India","titulo":"Nvidia scales back funding guarantee for OpenAI data center in Ohio","resumo":"Nvidia has decided to recalibrate its financial guarantees tied to the development of OpenAI's new data center located in Ohio, United States. This move reflects strategic adjustments and risk reassessments in the generative artificial intelligence infrastructure sector. The decision directly impacts the global supercomputing ecosystem, sparking new debates on the sustainability and massive operating costs required by AI.","link":"https://indianexpress.com/article/technology/artificial-intelligence/nvidia-scales-back-funding-guarantee-for-ohio-openai-data-center-report-10836549/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Genetic Literacy Project","pais":"India","titulo":"How technology transformed India and doubled its life expectancy in three generations","resumo":"Over the past three generations, India has utilized technological innovations and scientific advancements to completely overhaul its public health networks and agricultural production. The country, which once faced systemic supply crises and high mortality rates, managed to secure food security for its population. This technological revolution has more than doubled the average life expectancy of Indians, consolidating the social impact of technology.","link":"https://geneticliteracyproject.org/2026/08/17/how-technology-transformed-india-from-a-health-basket-case-into-a-breadbasket-in-three-generations-and-more-than-doubled-its-life-expectancy/","categoria":"SCIENCE AND TECHNOLOGY","lang":"en"},{"fonte":"LinkedIn","pais":"India","titulo":"India's data fortress turns into a maze of regulatory conflicts","resumo":"India's data protection regulation has been facing complex legal and operational challenges due to overlapping government norms and jurisdictional disputes. Experts point out that the country's attempt to create a highly protected digital environment ended up generating uncertainty for technology companies and citizens alike. The impasse reflects the difficulty of balancing national data sovereignty with continuous technological innovation.","link":"https://www.linkedin.com/pulse/indias-data-fortress-maze-conflicts-zerodha-pmjlf","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"livemint.com","pais":"India","titulo":"Return to the office is dead: AI and hybrid models end traditional routines","resumo":"The advancement of artificial intelligence and the consolidation of digital tools have irreversibly transformed global labor market dynamics. The traditional office workday has been replaced by more flexible hybrid and remote models, which continue to gain popularity among professionals. Although many executives are still reluctant to accept this shift, data shows that technology-driven productivity makes a return to the old model unviable.","link":"https://www.livemint.com/mint-lounge/ideas/future-of-work-technology-artifical-intelligence-hybrid-remote-work-models-11783683222764.html","categoria":"TRENDS","lang":"en"},{"fonte":"livemint.com","pais":"India","titulo":"$20 trillion economy by 2036: India's 5 growth engines","resumo":"A new report projects that India's economy could reach the $20 trillion mark over the next two decades, driven by five strategic expansion pillars. The plan highlights the fundamental role of digital transformation, technological innovation, infrastructure, and industrial expansion as essential levers for this economic leap. If this trajectory is maintained, the country will consolidate its position as one of the world's leading post-industrial superpowers.","link":"https://www.livemint.com/economy/india-20-trillion-economy-2036-five-engines-reform-human-capital-markets-services-governance-rupee-growth-equirus-report-11786892254309.html","categoria":"ECONOMY","lang":"en"},{"fonte":"greaterkashmir.com","pais":"India","titulo":"Lead in using technology to modernize the judicial system, Chief Justice advises","resumo":"The Chief Justice of India urged law universities not only to adapt to new digital tools, but to lead their application in the judiciary. The integration of advanced technologies and artificial intelligence into legal routines aims to speed up case processing and expand access to justice in the country. The initiative reinforces the need to train professionals capable of guiding digital transformation in legal institutions.","link":"https://www.greaterkashmir.com/national/dont-just-adapt-but-lead-in-determining-use-of-technology-to-reshape-legal-system-cji-to-nlus-12265515","categoria":"INNOVATION","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"PV Sindhu turns to sports science in pursuit of a sixth world title","resumo":"Indian badminton star PV Sindhu has adopted new methods based on sports science and high-precision physical conditioning for her preparation toward the World Championships. The program combines biomechanical analysis, continuous data monitoring, and personalized training to optimize performance and prevent injuries for the athlete. This approach highlights the growing importance of scientific technology in preparing elite competitors globally.","link":"https://timesofindia.indiatimes.com/sports/badminton/pv-sindhu-turns-to-sports-science-strength-conditioning-in-bid-for-record-sixth-world-championships-medal/articleshow/133273739.cms","categoria":"SCIENCE","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"India needs accelerated growth and a strong rupee to hit the $20 trillion goal","resumo":"Recent economic analyses indicate that India will need to sustain high annual growth rates and strengthen its national currency to reach the $20 trillion target by 2036. The study emphasizes that growth acceleration depends on massive investments in technology, the energy transition, and industrial modernization. The appreciation of the rupee against the global backdrop is pointed out as a critical pillar to ensure the stability of the expansion plan.","link":"https://timesofindia.indiatimes.com/business/india-business/india-needs-faster-growth-stronger-rupee-to-hit-20-trillion-economy-by-2036-report/articleshow/133271328.cms","categoria":"MARKET","lang":"en"},{"fonte":"Jornal de Negócios","pais":"Portugal","titulo":"Following a record in 2025, high-tech exports continue upward trend through June","resumo":"Portuguese high-tech product exports maintained an upward trajectory in the first half of the year, continuing their historic performance from 2025. The technology sector is consolidating itself as one of the main drivers of the country's foreign trade, fueled by electronic components and industrial innovation. This positive trend reinforces the international competitiveness of local companies and attracts new strategic investments to the region.","link":"https://www.jornaldenegocios.pt/economia/conjuntura/detalhe/apos-recorde-de-2025-exportacoes-de-alta-tecnologia-continuam-a-somar-ate-junho","categoria":"ECONOMY","lang":"en"},{"fonte":"Leak.pt","pais":"Portugal","titulo":"LIDL launches hair dryer with ionic technology for €12.99","resumo":"Supermarket chain LIDL has introduced a new hair dryer equipped with ionic technology, positioning the product as an affordable alternative in the electronics market. The device aims to meet consumer demand for advanced personal care features without requiring major financial investments. The launch reinforces the retailer's strategy to democratize household appliances equipped with modern technological features.","link":"https://www.leak.pt/lidl-secador-cien-beauty-ionico/","categoria":"CONSUMER GOODS","lang":"en"},{"fonte":"Rádio Hertz","pais":"Portugal","titulo":"Tomar: Carlos Moisés highlights Technology and Production in Performing Arts program","resumo":"Musician Carlos Moisés highlighted the importance of academic and technical training in the cultural sector while discussing the Technology and Production in Performing Arts program in Tomar.\nThe initiative aims to train new professionals in the use of modern technological tools for event production, set design, and lighting.\nThe project reinforces the necessary integration between digital innovation and the development of the regional creative industry.","link":"https://radiohertz.pt/tomar-carlos-moises-fala-sobre-curso-de-tecnologia-e-producao-nas-artes-do-espetaculo/","categoria":"EDUCATION","lang":"en"},{"fonte":"tek.sapo.pt","pais":"Portugal","titulo":"Earth's past may hide a pattern of catastrophes that science is trying to explain","resumo":"Researchers are investigating ancient geological records to identify whether major extinction events and climate changes on the planet follow a cyclical pattern.\nThe hypothesis suggests that astronomical phenomena or Earth's internal dynamics may have triggered periodic environmental crises over millennia.\nUnderstanding this chronology is essential to assessing risks and predicting future vulnerabilities of the global ecosystem.","link":"https://tek.sapo.pt/noticias/ciencia/artigos/passado-da-terra-pode-esconder-padrao-de-catastrofes-que-a-ciencia-ainda-tenta-explicar/","categoria":"SCIENCE","lang":"en"},{"fonte":"Jornal de Negócios","pais":"Portugal","titulo":"Government reserves 45 million euros for Collaborative Laboratories","resumo":"The Portuguese government has announced the allocation of 45 million euros aimed at financing and strengthening Collaborative Laboratories.\nThe measure aims to boost knowledge transfer between academia and the productive sector, accelerating the development of innovative technological solutions.\nThe investment reinforces the national research ecosystem and promotes the retention of qualified scientific talent.","link":"https://www.jornaldenegocios.pt/economia/politica/detalhe/governo-reserva-45-milhoes-para-laboratorios-colaborativos","categoria":"INNOVATION","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Applications open for 45 million euros under the Compete 2030 program","resumo":"Applications are now open for the new Compete 2030 program call, making 45 million euros in European funds available to companies and research institutions.\nThe call's primary focus is supporting projects in technological modernization, digital transition, and advanced training.\nEligible entities can submit proposals aimed at increasing productivity and competitiveness in the international market.","link":"https://jornaleconomico.sapo.pt/noticias/abertas-candidaturas-de-45-milhoes-de-euros-no-compete-2030/","categoria":"INCENTIVES","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"Compete 2030: 45 million euros for technological reinforcement with applications open until October 15","resumo":"The Compete 2030 program has set a deadline of October 15 for submitting applications to the 45 million euro fund aimed at technological strengthening.\nThe funding is intended to modernize production structures and accelerate the adoption of advanced technologies by the business sector.\nThe initiative represents a crucial opportunity to consolidate strategic partnerships between research centers and industry.","link":"https://expresso.pt/economia/2026-08-16-compete-2030-45-milhoes-de-euros-para-reforcar-capacidade-tecnologica-esperam-candidaturas-ate-15-de-outubro-76b89a4c","categoria":"INVESTMENT","lang":"en"},{"fonte":"O Mirante","pais":"Portugal","titulo":"Flamingo Mountain stands out with custom work, 3D technology, and forestry services","resumo":"Flamingo Mountain has been gaining recognition by integrating advanced 3D modeling and printing into engineering projects and forestry services.\nThe combination of sustainability and additive manufacturing allows for the creation of tailored solutions with high precision and less material waste.\nThis performance demonstrates the expansion of practical applications for three-dimensional technologies in traditional sectors of the economy.","link":"https://omirante.pt/edicao-1500/2026-08-16-flamingo-mountain-destaca-se-com-obras-personalizadas-tecnologia-3d-e-servicos-florestais-b0735f37","categoria":"TECHNOLOGY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
