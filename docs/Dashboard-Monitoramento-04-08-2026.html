  // Injeta os dados originais no frontend
  const data = [{"fonte":"www.gov.br","pais":"Brasil","titulo":"Cientistas identificam gênero inédito de planta no Brasil após 12 anos de pesquisas","resumo":"Após mais de uma década de pesquisas, cientistas brasileiros identificaram um gênero inédito de planta no país.\nA descoberta, validada pelo Ministério da Ciência e Tecnologia, representa um avanço significativo para a botânica nacional.\nO achado reforça a relevância do financiamento científico para mapear a biodiversidade e viabilizar a conservação ambiental.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/apos-12-anos-cientistas-identificam-genero-inedito-de-planta-no-brasil","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Apple remove Telegram da loja de aplicativos por violações de segurança","resumo":"A Apple removeu o Telegram de sua loja global de aplicativos após constatar violações das regras da plataforma.\nA medida foi tomada devido à falta de moderação adequada contra conteúdos de abuso e exploração infantil.\nO caso reacende o debate sobre a responsabilidade de grandes empresas de tecnologia na segurança digital.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/04/apple-tira-telegram-do-ar-por-violacao-de-regras-sobre-abuso-infantil.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Donald Trump reúne-se com empresas de IA para discutir marco regulatório","resumo":"O ex-presidente Donald Trump agendou reuniões com líderes da indústria para discutir a regulação da inteligência artificial.\nA pauta busca equilibrar a inovação tecnológica acelerada com o estabelecimento de limites éticos e de segurança.\nA iniciativa acompanha uma tendência mundial de governos que buscam criar marcos regulatórios para o setor.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/08/04/trump-deve-se-reunir-hoje-com-empresas-de-ia-para-discutir-marco-regulatorio-diz-agencia.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Scania utiliza inteligência artificial para prolongar a vida útil de motores a diesel","resumo":"A Scania começou a utilizar inteligência artificial para otimizar o funcionamento e prolongar a vida útil de motores a diesel.\nA tecnologia prevê desgastes em peças antes que ocorram falhas operacionais, reduzindo custos de manutenção.\nA ação busca aliar eficiência econômica e sustentabilidade enquanto o setor avança em direção à descarbonização.","link":"https://www1.folha.uol.com.br/mercado/2026/08/scania-usa-inteligencia-artificial-para-dar-sobrevida-a-motores-a-diesel.shtml","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"www.gov.br","pais":"Brasil","titulo":"Hidrogênio natural surge como promessa para a transição energética limpa","resumo":"Pesquisadores destacaram no programa 'Ciência no Rádio' o potencial do hidrogênio natural como fonte energética limpa.\nO elemento surge como alternativa promissora para substituir combustíveis fósseis na matriz energética global.\nO avanço dos estudos pode posicionar o ecossistema científico brasileiro como referência na transição sustentável.","link":"https://www.gov.br/observatorio/pt-br/assuntos/noticias/ciencia-no-radio-fala-do-hidrogenio-natural-promessa-na-transicao-para-matrizes-energeticas-mais-limpas","categoria":"ENERGIA","lang":"pt"},{"fonte":"Canal Rural","pais":"Brasil","titulo":"Tecnologia da Embrapa obtém certificação oficial e impulsiona a agricultura familiar","resumo":"Uma solução tecnológica desenvolvida pela Embrapa obteve certificação oficial de eficiência e aplicabilidade.\nA inovação é voltada ao fortalecimento da agricultura familiar, permitindo maior produtividade no campo.\nO reconhecimento valida a importância do investimento em ciência aplicada para o desenvolvimento rural sustentável.","link":"https://www.canalrural.com.br/agricultura/tecnologia-da-embrapa-conquista-certificacao-e-impulsiona-agricultura-familiar/","categoria":"AGROTECNOLOGIA","lang":"pt"},{"fonte":"Portal CMBH |","pais":"Brasil","titulo":"Política de robótica nas escolas públicas é aprovada em segundo turno","resumo":"A proposta que implementa o ensino de robótica nas escolas públicas foi aprovada em segundo turno de votação.\nA medida visa democratizar o acesso à tecnologia e ao pensamento computacional para alunos do ensino básico.\nA iniciativa tem como objetivo capacitar jovens para o mercado de trabalho do futuro e diminuir desigualdades educacionais.","link":"https://www.cmbh.mg.gov.br/comunica%C3%A7%C3%A3o/not%C3%ADcias/2026/08/pol%C3%ADtica-de-rob%C3%B3tica-nas-escolas-p%C3%BAblicas-%C3%A9-aprovada-em-2%C2%BA-turno","categoria":"EDUCAÇÃO TECNOLÓGICA","lang":"pt"},{"fonte":"Finanças, Câmbio e Investimentos","pais":"Brasil","titulo":"BMW adotará tecnologia ultra-wideband da NXP em seus veículos a partir de 2026","resumo":"A BMW anunciou que adotará a tecnologia ultra-wideband da fornecedora NXP em seus veículos a partir de 2026.\nO recurso promete aprimorar a precisão na localização de dispositivos e a segurança das chaves digitais.\nA parceria demonstra a crescente relevância dos semicondutores e da conectividade no setor automotivo.","link":"https://br.investing.com/news/company-news/bmw-vai-adotar-tecnologia-ultrawideband-da-nxp-nos-veiculos-de-2026-93CH-2024660","categoria":"TECNOLOGIA AUTOMOTIVA","lang":"pt"},{"fonte":"WSJ","pais":"Estados Unidos","titulo":"O boom da IA está transformando a economia americana de forma irreconhecível","resumo":"O rápido avanço da inteligência artificial está remodelando profundamente a economia dos Estados Unidos.\nGrandes investimentos em infraestrutura de dados, automação e desenvolvimento de software estão impulsionando novos setores.\nEspecialistas destacam que o impacto da IA vai além da produtividade, alterando o mercado de trabalho e as relações comerciais.\nEssa transformação massiva sinaliza uma nova era econômica liderada pela tecnologia de ponta.","link":"https://www.wsj.com/economy/the-ai-boom-is-transforming-the-american-economy-beyond-recognition-c7825b31","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Newsroom | UCLA","pais":"Estados Unidos","titulo":"Equipe liderada pela UCLA é selecionada para prêmio de tecnologia quântica da NSF","resumo":"Uma equipe de pesquisadores liderada pela UCLA recebeu um prestigioso prêmio da National Science Foundation.\nO financiamento visa acelerar o desenvolvimento de tecnologias e computação quântica nos Estados Unidos.\nA iniciativa busca consolidar avanços científicos cruciais em processamento de dados e segurança da informação.\nO projeto promete expandir as fronteiras da física aplicada e formar novos especialistas no setor.","link":"https://newsroom.ucla.edu/releases/ucla-led-team-national-science-foundation-quantum-technology-award-2726643","categoria":"TECNOLOGIA QUÂNTICA","lang":"pt"},{"fonte":"Stanford HAI","pais":"Estados Unidos","titulo":"Modelos de código aberto precisam ser verdadeiramente abertos para a ciência e a sociedade","resumo":"Especialistas defendem que disponibilizar apenas os pesos dos modelos de IA não é suficiente para o avanço científico.\nA criação de modelos verdadeiramente open source exige transparência total sobre dados de treinamento e arquitetura.\nEssa abordagem é considerada fundamental para garantir a auditabilidade, a segurança e a democratização do conhecimento.\nGarantir o acesso livre fortalece a pesquisa acadêmica e beneficia a sociedade como um todo.","link":"https://hai.stanford.edu/news/open-weight-models-arent-enough-we-need-truly-open-source-ai-models-for-science-and-society","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Forbes","pais":"Estados Unidos","titulo":"Nova geração de drones inteligentes é definida pela convergência tecnológica","resumo":"A integração de inteligência artificial, sensores avançados e robótica está criando drones cada vez mais autônomos.\nEsses novos dispositivos conseguem operar em ambientes complexos sem a necessidade de intervenção humana constante.\nA convergência tecnológica expande as aplicações comerciais, civis e de segurança dessas aeronaves não tripuladas.\nO setor passa por uma rápida evolução que redefine os padrões de eficiência e navegação no ar.","link":"https://www.forbes.com/sites/chuckbrooks/2026/08/03/new-generation-of-intelligent-drones-defined-by-technology-convergence/","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"Proactive Investors","pais":"Estados Unidos","titulo":"Restrições de robôs nos EUA atingem aspiradores inteligentes no conflito tecnológico","resumo":"A escalada das tensões tecnológicas e comerciais entre Estados Unidos e China atingiu o mercado de robótica doméstica.\nNovas regulamentações e restrições impostas pelos EUA começam a afetar até mesmo aspiradores de pó inteligentes.\nA preocupação com a segurança cibernética e a coleta de dados de navegação interna motivou medidas mais severas.\nA decisão reflete o endurecimento do controle sobre dispositivos conectados importados pelo país.","link":"https://www.proactiveinvestors.co.uk/companies/news/1096458/tech-bytes-us-robot-restrictions-sweep-smart-vacuums-into-escalating-technology-conflict-1096458.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"MobiHealthNews","pais":"Estados Unidos","titulo":"Throne Science arrecada US$ 10 milhões para sensor sanitário com inteligência artificial","resumo":"A startup Throne Science captou US$ 10 milhões em investimentos para desenvolver um sensor de vaso sanitário via IA.\nO dispositivo analisa amostras biológicas para monitorar a saúde intestinal e fornecer dados preventivos ao usuário.\nA proposta une saúde digital e automação residencial para transformar a rotina de cuidados médicos contínuos.\nO aporte financeiro será utilizado para expandir a tecnologia e validar novos testes clínicos.","link":"https://www.mobihealthnews.com/news/throne-science-raises-10m-ai-toilet-sensor","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"ScienceDaily","pais":"Estados Unidos","titulo":"Cientistas buscavam árvores gigantes em Taiwan e encontraram um mundo perdido","resumo":"Durante uma expedição científica em busca de árvores seculares e gigantescas em Taiwan, pesquisadores fizeram uma descoberta impressionante.\nA equipe mapeou um ecossistema isolado e preservado que abrigava espécies vegetais e animais raras.\nA pesquisa reforça a importância da conservação ambiental em florestas tropicais de difícil acesso.\nOs dados coletados ajudam a compreender melhor a biodiversidade e a resiliência dos ecossistemas antigos.","link":"https://www.sciencedaily.com/releases/2026/08/260802223431.htm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Oncodaily","pais":"Estados Unidos","titulo":"Como a ciência transformou um diagnóstico de câncer de pulmão estágio IV em 12 anos de esperança","resumo":"A história do médico Douglas Flora exemplifica os avanços significativos no tratamento do câncer de pulmão avançado.\nGraças a terapias-alvo e medicina de precisão, um diagnóstico anteriormente devastador transformou-se em anos de vida com qualidade.\nO caso destaca como a pesquisa científica contínua tem mudado o prognóstico de pacientes com oncologia complexa.\nInovações biológicas e imunoterapias continuam a redefinir os limites do tratamento médico moderno.","link":"https://oncodaily.com/stories/douglas-flora-558263","categoria":"MEDICINA","lang":"pt"},{"fonte":"Investing.com France","pais":"França","titulo":"Bayer supera expectativas no 2º trimestre impulsionada pela Crop Science e reduz dívida","resumo":"A multinacional farmacêutica e de biotecnologia Bayer registrou resultados financeiros acima do esperado no segundo trimestre deste ano.\nO crescimento foi impulsionado pelo bom desempenho da sua divisão de ciência agrícola, a Crop Science, focada em inovação e defensivos.\nAlém do resultado positivo, a empresa conseguiu avançar de forma expressiva na redução de seu endividamento global.","link":"https://fr.investing.com/news/earnings/bayer-depasse-les-attentes-du-t2-grace-a-crop-science-et-reduit-sa-dette-3533489","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Pour la Science","pais":"França","titulo":"Novo sistema pode resfriar data centers de forma ultraeficiente","resumo":"Engenheiros e pesquisadores desenvolveram uma nova solução tecnológica com capacidade de resfriar centros de dados com alta eficiência energética.\nCom o aumento expressivo das cargas de trabalho de inteligência artificial, o consumo de energia e o aquecimento dos servidores tornaram-se grandes desafios.\nEssa nova abordagem promete reduzir custos operacionais e mitigar o impacto ambiental da infraestrutura digital global.","link":"https://www.pourlascience.fr/sd/technologie/data-centers-des-ailettes-en-forme-de-sapin-pour-mieux-evacuer-la-chaleur-29356.php","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Montres-de-luxe.com","pais":"França","titulo":"Seiko 5 Sports Motocompo: o ícone da scooter dobrável japonesa renasce no pulso","resumo":"A fabricante de relógios Seiko lançou uma edição especial da linha 5 Sports inspirada na lendária scooter dobrável Honda Motocompo dos anos 1980.\nO relógio combina elementos visuais retrô com a precisão mecânica moderna, prestando uma homenagem ao design industrial e à cultura pop japonesa.\nA novidade chamou a atenção de colecionadores e entusiastas de tecnologia e design vintage em todo o mundo.","link":"https://www.montres-de-luxe.com/Seiko-5-Sports-Motocompo-l-icone-du-scooter-pliable-japonais-renait-au-poignet_a21769.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"topsante.com","pais":"França","titulo":"Beber de 2 a 3 xícaras de café por dia traz este efeito para a saúde, segundo a ciência","resumo":"Um novo estudo científico revelou os impactos benéficos do consumo moderado de café no organismo humano a longo prazo.\nPesquisadores apontam que ingerir de duas a três xícaras diárias da bebida está associado à melhora da saúde cardiovascular e prevenção de doenças metabólicas.\nAs descobertas reforçam o papel das substâncias bioativas presentes no grão na promoção da longevidade.","link":"https://www.topsante.com/nutrition_et_recettes/nutrition/boire-2-a-3-cafes-par-jour-aurait-cet-effet-sur-votre-sante-selon-la-science-977986","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Les Echos","pais":"França","titulo":"«Silicon Island»: crescimento de Taiwan disparou impulsionado pela IA","resumo":"Conhecida globalmente como a ilha dos semicondutores, Taiwan registrou uma forte aceleração em seu crescimento econômico recente.\nA alta demanda mundial por chips avançados indispensáveis para rodar modelos de inteligência artificial impulsionou as exportações do país.\nO cenário consolida Taiwan como um hub estratégico e insubstituível na cadeia de suprimentos da tecnologia moderna.","link":"https://www.lesechos.fr/monde/asie-pacifique/silicon-island-la-croissance-de-taiwan-senvole-grace-a-lia-2245765","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"tv5monde","pais":"França","titulo":"Foguetes, Starlink e IA: SpaceX realiza sua primeira apresentação para Wall Street","resumo":"A SpaceX realizou sua primeira apresentação oficial direcionada a grandes investidores e analistas do mercado financeiro em Wall Street.\nA empresa destacou o progresso de seus foguetes reutilizáveis, a expansão da rede de internet via satélite Starlink e novas aplicações em inteligência artificial.\nO movimento sinaliza uma maior abertura da companhia espacial privada em direção à transparência e ao mercado de capitais.","link":"https://information.tv5monde.com/economie/fusees-starlink-ia-spacex-passe-son-premier-oral-devant-wall-street-2832413","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Correio da Manhã","pais":"França","titulo":"Modelos de IA da Anthropic são utilizados em ataques contra empresas","resumo":"Relatórios recentes de cibersegurança revelam que modelos de inteligência artificial desenvolvidos pela Anthropic vêm sendo explorados em ataques contra corporações.\nAgentes maliciosos estão adaptando essas ferramentas para automatizar invasões, encontrar vulnerabilidades em sistemas e criar golpes sofisticados de engenharia social.\nO caso acende um alerta global sobre os riscos e a necessidade de regulamentação no uso de IAs avançadas.","link":"https://www.cmjornal.pt/tecnologia/amp/modelos-de-ia-da-anthropic-atacam-empresas","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"Sortir à Paris","pais":"França","titulo":"Festa da Ciência 2026 no Vexin: explore as paisagens em passeios geológicos","resumo":"A região de Vexin se prepara para sediar uma edição especial da Festa da Ciência focada em geologia e patrimônio natural.\nO evento contará com passeios guiados por especialistas para explorar a formação das paisagens e a biodiversidade local de forma acessível.\nA iniciativa busca aproximar o público geral da pesquisa científica e conscientizar sobre a preservação ambiental.","link":"https://www.sortiraparis.com/pt/crianca-familia/articles/333345-festa-da-ciencia-2026-no-vexin-95-explore-os-cenarios-durante-passeios-geologicos","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"geplus.co.uk","pais":"Inglaterra","titulo":"Novo projeto capacita jovens a se engajarem com a ciência ambiental","resumo":"Um novo projeto no Reino Unido está incentivando jovens a participarem ativamente de iniciativas focadas na ciência ambiental. A ação busca aproximar a nova geração das questões de sustentabilidade, estimulando a conscientização ecológica e a pesquisa científica prática. O programa visa formar líderes comunitários mais preparados para enfrentar os crescentes desafios climáticos da atualidade.","link":"https://www.geplus.co.uk/news/industry-news/new-project-empowers-youngsters-to-engage-with-environmental-science-04-08-2026/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"NW Mail","pais":"Inglaterra","titulo":"Cinema Vue de Barrow é um dos 18 no país a introduzir nova tecnologia de ponta","resumo":"O cinema Vue em Barrow foi selecionado como uma das 18 unidades no país a receber inovações tecnológicas de ponta na exibição de filmes. A atualização visa proporcionar uma experiência audiovisual imersiva aos espectadores locais através de modernos equipamentos digitais. Com o investimento, a rede busca modernizar a infraestrutura do entretenimento regional e atrair um público cada vez mais exigente.","link":"https://www.nwemail.co.uk/news/26431573.vue-cinema-barrow-gets-new-audio-assistive-technology/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"É possível saber se alguém está filmando você com os óculos da Meta?","resumo":"Um novo vídeo investiga as preocupações de privacidade relacionadas ao uso dos óculos inteligentes desenvolvidos pela Meta em espaços públicos. O levantamento analisa a eficácia dos sinalizadores luminosos do dispositivo para alertar pessoas ao redor sobre gravações em andamento. O debate destaca os desafios éticos trazidos pela rápida popularização e integração dessas tecnologias vestíveis ao cotidiano.","link":"https://www.theguardian.com/technology/video/2026/aug/04/meta-glasses-can-you-tell-if-someone-is-filming-you-video","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Apple desafia na justiça exigência do governo do Reino Unido para acesso a dados","resumo":"A Apple iniciou um processo judicial contra exigências do governo britânico para obter acesso facilitado a dados de usuários e alterar recursos de criptografia. A gigante de tecnologia argumenta que atender a tais pedidos compromete a segurança global de seus dispositivos e a privacidade individual. A disputa coloca em evidência o embate contínuo entre segurança pública e a proteção de dados na era digital.","link":"https://www.theguardian.com/technology/2026/aug/03/apple-legal-challenge-uk-government-data-access","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Mining Review Africa","pais":"Inglaterra","titulo":"Weir utiliza tecnologia para transformar a mineração sustentável em realidade","resumo":"A empresa de engenharia Weir está adotando soluções tecnológicas avançadas para tornar os processos de mineração significativamente mais sustentáveis. As inovações implementadas visam reduzir o consumo de água, otimizar o uso de energia e diminuir o impacto ambiental das operações industriais. A iniciativa representa um passo importante na transição do setor extrativo para práticas ecologicamente mais eficientes.","link":"https://www.miningreview.com/pt/news/weir-uses-technology-to-turn-sustainable-mining-into-reality/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Cortes no financiamento da ciência prejudicarão a posição global da Grã-Bretanha","resumo":"Cientistas e acadêmicos alertam em cartas públicas que a redução nos orçamentos destinados à pesquisa e inovação pode prejudicar gravemente a liderança internacional da Grã-Bretanha. Os cortes orçamentários ameaçam projetos essenciais, além de dificultar a retenção de talentos científicos renomados nas universidades do país. Especialistas defendem que o investimento em ciência deve ser mantido como prioridade estratégica nacional.","link":"https://www.theguardian.com/science/2026/aug/03/science-funding-cuts-will-harm-britains-global-standing","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Financial Times","pais":"Inglaterra","titulo":"É hora de Andy Burnham apoiar a ciência no Reino Unido","resumo":"Analistas pedem que o prefeito da Grande Manchester, Andy Burnham, amplie seu apoio e engajamento com o ecossistema de pesquisa científica britânico. A mobilização de lideranças regionais é vista como fundamental para impulsionar ecossistemas de inovação fora do eixo tradicional de Londres. O fortalecimento dessas parcerias locais pode acelerar o desenvolvimento tecnológico e a economia do conhecimento regional.","link":"https://www.ft.com/content/1419a5f5-1bd7-4b89-b667-45c2789769ef?syn-25a6b1a6=1","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ADSLZone","pais":"Espanha","titulo":"Starlink muda sua política: você não precisará mais devolver o roteador antigo ao trocar de dispositivo","resumo":"A Starlink atualizou suas diretrizes de serviço e não exige mais a devolução do roteador antigo ao atualizar ou substituir equipamentos.\nA medida visa simplificar o processo de transição para os clientes e reduzir custos de logística para a empresa de internet via satélite.\nOs usuários agora podem descartar, reciclar ou guardar o dispositivo anterior sem penalidades financeiras ou burocracias.\nEssa mudança reflete uma tendência de facilitação na experiência do consumidor no setor de telecomunicações.","link":"https://www.adslzone.net/noticias/internet/starlink-no-exige-devolucion-equipos/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Diario de León","pais":"Espanha","titulo":"Projeto de ciência cidadã em León descobre nova alga ao analisar o impacto de bioplásticos","resumo":"Uma iniciativa de ciência cidadã desenvolvida em León levou à descoberta de uma nova espécie de alga durante estudos de impacto ambiental.\nOs pesquisadores e voluntários avaliavam como os bioplásticos se comportam e se decompõem nos ecossistemas aquáticos locais.\nO achado destaca a importância da participação comunitária na pesquisa científica e na preservação da biodiversidade.\nA descoberta pode fornecer dados valiosos sobre a interação entre novos materiais biodegradáveis e a vida aquática.","link":"https://www.diariodeleon.es/monograficos/innova/260804/2093157/proyecto-ciencia-ciudadana-leon-halla-nueva-alga-analizar-impacto-bioplasticos_amp.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Investing.com España","pais":"Espanha","titulo":"Bolsas asiáticas se estabilizam enquanto o setor de tecnologia chinês recupera força","resumo":"Os mercados financeiros na Ásia demonstraram sinais de estabilização após períodos de volatilidade, impulsionados pela recuperação de empresas de tecnologia chinesas.\nO avanço das ações de gigantes tecnológicas na China ajudou a restaurar a confiança dos investidores internacionais na região.\nEspecialistas apontam que medidas regulatórias e incentivos econômicos recentes contribuíram para a melhora do cenário do setor.\nEssa movimentação reflete a forte influência do desempenho tecnológico chinês sobre o comportamento econômico global.","link":"https://es.investing.com/news/stock-market-news/las-bolsas-asiaticas-se-estabilizan-mientras-la-tecnologia-china-rebota-3775766","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"ArchDaily","pais":"Espanha","titulo":"Nova tecnologia permite reaproveitar resíduos de vidro e plástico considerados não recicláveis","resumo":"Um novo avanço tecnológico viabilizou o processamento e reaproveitamento de resíduos de plástico e vidro antes classificados como não recicláveis.\nA inovação transforma esses descartes complexos em matérias-primas úteis para a indústria e construção civil, reduzindo o acúmulo em aterros.\nO método promete diminuir os custos ambientais e a pegada de carbono associados ao descarte inadequado de materiais.\nA solução representa um marco importante para a economia circular e para o desenvolvimento de soluções sustentáveis.","link":"https://www.archdaily.com/es/944859/una-nueva-tecnologia-permite-aprovechar-los-desechos-de-vidrio-y-plastico-etiquetados-como-materiales-no-reciclables/5f216dd2b357653d3a00080f-are-all-plastics-recyclable-spotlight-on-a-new-technology-that-reclaims-rejects-of-plastics-and-glass-image","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"E3-Magazin","pais":"Alemanha","titulo":"Estudo da KPMG: Inteligência Artificial transforma a economia alemã mais rapidamente","resumo":"Um novo estudo conduzido pela KPMG revela que a adoção de Inteligência Artificial nas empresas alemãs está ocorrendo em um ritmo muito mais acelerado do que o previsto.\nO relatório destaca que a IA generativa e a automação de processos já estão redefinindo a produtividade e a competitividade industrial do país.\nEspecialistas apontam que as organizações que não se adaptarem rapidamente a essa transformação tecnológica correm sérios riscos de perder espaço no mercado global.","link":"https://e3mag.com/en/kpmg-studie-ki-veraendert-deutsche-wirtschaft-schneller/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Spiegel","pais":"Alemanha","titulo":"Ar-condicionado com refrigeração de estado sólido: como funciona a próxima geração de aparelhos","resumo":"A próxima geração de sistemas de climatização está migrando para a tecnologia de refrigeração de estado sólido, que promete ser mais sustentável e eficiente.\nAo eliminar o uso de compressores mecânicos e gases refrigerantes nocivos, esses novos dispositivos utilizam efeitos calóricos em materiais sólidos para controlar a temperatura.\nA inovação pode revolucionar a indústria de eletrodomésticos e reduzir significativamente o consumo de energia elétrica no setor de refrigeração global.","link":"https://www.spiegel.de/wissenschaft/klimaanlagen-mit-festkoerperkuehlung-so-funktioniert-die-naechste-generation-der-geraete-a-b4d3d5f2-2846-4b81-b856-db9278b93f6e","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Moedas Digitais: Um em cada oito adultos na Alemanha possui criptomoedas","resumo":"Uma recente pesquisa revelou que o mercado de ativos digitais na Alemanha atingiu uma nova marca de popularidade, com cerca de 12,5% da população adulta investindo em criptomoedas.\nA crescente adoção reflete a maior maturidade do setor no país e a busca dos cidadãos por alternativas de investimento e proteção patrimonial.\nAnalistas indicam que o fortalecimento da regulamentação europeia tem contribuído para aumentar a confiança dos investidores individuais no mercado cripto.","link":"https://www.sueddeutsche.de/wirtschaft/digital-waehrungen-jeder-achte-erwachsene-in-deutschland-haelt-kryptowaehrungen-dpa.urn-newsml-dpa-com-20090101-260804-930-480443","categoria":"CRIPTOMOEDAS","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Empresa de dados e IA Palantir registra crescimento superior a 90% na receita","resumo":"A empresa de análise de dados e Inteligência Artificial Palantir apresentou um crescimento expressivo de mais de 90% em sua receita, impulsionado pela alta demanda global por soluções avançadas de IA.\nOs resultados surpreenderam analistas e reforçam o momento de forte expansão do setor de tecnologia focado em inteligência de negócios e defesa.\nA alta procura por plataformas generativas em clientes corporativos e governamentais foi o principal motor desse desempenho recorde.","link":"https://www.sueddeutsche.de/wirtschaft/palantir-umsatz-usa-prozent-li.3526120","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"物流ニュースのLNEWS","pais":"Japão","titulo":"Yamato HD investe na startup de tecnologia quântica JIJ por meio de fundo CVC","resumo":"A Yamato Holdings anunciou um investimento estratégico na JIJ, uma startup especializada no desenvolvimento e aplicação prática de tecnologia quântica.\nO aporte foi realizado por meio de seu fundo de Venture Capital Corporativo com o objetivo de otimizar redes de logística e rotas de entrega complexas.\nA iniciativa busca integrar algoritmos quânticos às operações diárias da empresa para aumentar a eficiência operacional e reduzir custos no setor de transportes.","link":"https://www.lnews.jp/2026/08/s0804104.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"CoinPost","pais":"Japão","titulo":"Da infraestrutura de IA à economia digital: A estratégia de inteligência artificial do Japão na WebX2026","resumo":"Durante o evento WebX2026, executivos líderes debateram a evolução e os rumos da estratégia nacional do Japão para a inteligência artificial.\nO foco do painel esteve na transição do desenvolvimento de infraestrutura básica para a criação de um ecossistema econômico sustentável impulsionado por IA.\nA iniciativa visa posicionar o país como uma referência global na integração de modelos avançados de IA aos setores produtivo, financeiro e corporativo.","link":"https://coinpost.jp/?p=729502","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"KDDI","pais":"Japão","titulo":"KDDI realiza novo aporte na JIJ para acelerar a aplicação social da tecnologia quântica","resumo":"O fundo KDDI Open Innovation Fund 3 realizou um investimento adicional na startup JIJ, focada na implementação prática do processamento quântico.\nO novo aporte financeiro visa impulsionar a aplicação de soluções quânticas em cenários reais do mercado, como telecomunicações e análises preditivas.\nA parceria reforça o compromisso da gigante das telecomunicações em liderar a transição tecnológica rumo à era do processamento de dados de altíssima velocidade.","link":"https://www.kddi.com/open-innovation-program/news/2026/0804/","categoria":"TECNOLOGIA QUÂNTICA","lang":"pt"},{"fonte":"共同通信PRワイヤー","pais":"Japão","titulo":"JIJ recebe investimentos para expandir soluções de otimização matemática com tecnologia quântica","resumo":"A startup japonesa JIJ atraiu novos investimentos focados em impulsionar o desenvolvimento de suas soluções de otimização matemática baseadas em computação quântica.\nAs ferramentas desenvolvidas pela empresa visam resolver problemas operacionais extremamente complexos em diversos setores industriais e comerciais.\nO aporte financeiro consolida a relevância do setor quântico no país, impulsionando a competitividade de empresas que dependem de análise avançada de dados.","link":"https://kyodonewsprwire.jp/release/202608033556","categoria":"COMPUTAÇÃO QUÂNTICA","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Kawasaki Heavy Industries licenciará tecnologia de controle de inversores para energia renovável","resumo":"A Kawasaki Heavy Industries anunciou que começará a licenciar sua avançada tecnologia de controle de inversores voltada para o setor de energias renováveis.\nA inovação visa estabilizar o fornecimento elétrico e otimizar a conversão de energia originada de fontes eólicas e solares na rede de distribuição.\nCom o licenciamento, a empresa pretende acelerar a transição energética global e expandir suas operações tecnológicas no mercado internacional sustentável.","link":"https://www.nikkei.com/article/DGXZQOUC0421V0U6A800C2000000/","categoria":"ENERGIA","lang":"pt"},{"fonte":"ビジネスネットワーク","pais":"Japão","titulo":"Rakuten Mobile, OKI e Universidade de Ciências de Tóquio realizam testes de condução autônoma Nível 4","resumo":"Uma parceria entre Rakuten Mobile, OKI e o Institute of Science Tokyo deu início a testes práticos de veículos autônomos de Nível 4 na cidade de Saga.\nO projeto utiliza infraestrutura avançada de conectividade 5G para garantir a comunicação em tempo real e a navegação segura de veículos sem motorista.\nO experimento busca validar soluções de transporte público autônomo para mitigar a escassez de motoristas e melhorar a mobilidade urbana regional.","link":"https://businessnetwork.jp/article/36346/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"ドローンジャーナル","pais":"Japão","titulo":"Tecnologia de semicondutores e OEM de Taiwan fortalece cadeia de suprimentos de drones com IA na COMPUTEX 2026","resumo":"A feira COMPUTEX 2026 destacou o papel fundamental da indústria de semicondutores e produção OEM de Taiwan no desenvolvimento de drones autônomos com IA.\nA exibição revelou os avanços na cadeia global de suprimentos, apresentando chips dedicados e arquiteturas de hardware focadas em processamento no dispositivo.\nA colaboração técnica promete acelerar a adoção de drones inteligentes em inspeções industriais, segurança regional e logística comercial avançada.","link":"https://drone-journal.impress.co.jp/docs/event/1188717.html","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"ドローンジャーナル","pais":"Japão","titulo":"JR East promove o campeonato 'Drone DX CHAMPIONSHIP 2026' focado na inspeção de infraestrutura ferroviária","resumo":"A JR East anunciou a realização do 'Drone DX CHAMPIONSHIP 2026', uma competição dedicada a avaliar e acelerar tecnologias de inspeção com drones.\nO evento reunirá empresas e startups para demonstrar soluções autônomas voltadas ao monitoramento de trilhos, pontes e estruturas ferroviárias críticas.\nA iniciativa visa integrar a transformação digital às rotinas de manutenção preventiva, aumentando a segurança e reduzindo drasticamente custos operacionais.","link":"https://drone-journal.impress.co.jp/docs/event/1188715.html","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"财联社","pais":"China","titulo":"Painel da ONU adverte que avanço da IA supera compreensão científica e capacidade regulatória","resumo":"Um grupo de especialistas das Nações Unidas alertou que o ritmo vertiginoso de desenvolvimento da inteligência artificial ultrapassou o conhecimento científico atual e as estruturas de governança.\nO relatório destaca que a falta de controle e de salvaguardas éticas pode desencadear riscos catastróficos globais em diversos setores.\nDiante disso, o painel defende a criação urgente de mecanismos internacionais de cooperação para monitorar e regulamentar as tecnologias emergentes.","link":"https://www.cls.cn/detail/2414744","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"财联社","pais":"China","titulo":"Comentário do Diário do Povo: Semicondutores redefinem a 'Lei Tau' e a China pode reescrever o setor","resumo":"Um artigo opinativo do Diário do Povo ressalta que a indústria global de semicondutores está passando por uma transformação profunda e adotando novos paradigmas além das métricas tradicionais.\nO texto enfatiza o papel crescente das empresas chinesas no desenvolvimento de arquiteturas e tecnologias proprietárias de chips.\nEssa evolução pode alterar substancialmente a dinâmica global do mercado de tecnologia e redefinir os padrões tecnológicos mundiais.","link":"https://www.cls.cn/detail/2380675","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"cb.com.cn","pais":"China","titulo":"Focada em modelos de base para IA na ciência, startup derivada da CAS Wenge é inaugurada","resumo":"A Saisi Limit, empresa incubada pela CAS Wenge, foi apresentada oficialmente com o objetivo de impulsionar a pesquisa e o desenvolvimento de modelos fundamentais de inteligência artificial voltados para a ciência (AI4S).\nA iniciativa busca aplicar algoritmos avançados na resolução de problemas complexos na física, química e biologia.\nO lançamento reforça a estratégia chinesa de acelerar descobertas científicas por meio de ferramentas computacionais de nova geração.","link":"http://www.cb.com.cn/index/show/gd/cv/cv1362575711491","categoria":"INOVAÇÃO TECNOLÓGICA","lang":"pt"},{"fonte":"cast.org.cn","pais":"China","titulo":"Fórum sobre percepção inteligente e fusão de aeronaves em baixa altitude é realizado em Pequim","resumo":"Durante a 28ª Reunião Anual da Associação Chinesa para Ciência e Tecnologia, um fórum especializado debateu a percepção e fusão inteligente para aeronaves em ambientes complexos de baixa altitude.\nEspecialistas apresentaram inovações voltadas para a segurança operacional, navegação autônoma e gestão do tráfego aéreo de drones e veículos eVTOL.\nO evento impulsiona o desenvolvimento da chamada economia de baixa altitude, setor prioritário para o ecossistema tecnológico do país.","link":"https://www.cast.org.cn/xw/qgxh/ZHXX/art/2026/art_f20ed443b2fe4dbeb98933bc6eabd758.html","categoria":"AVIAÇÃO E IA","lang":"pt"},{"fonte":"中国科学院","pais":"China","titulo":"Jornal da Ciência da China: Com radar de tecnologia própria, cientistas desvendam segredos da ionosfera","resumo":"Cientistas chineses alcançaram avanços significativos no estudo dos fenômenos da ionosfera utilizando radares de alta precisão desenvolvidos no próprio país.\nO equipamento permite monitorar perturbações atmosféricas e tempestades eletromagnéticas que afetam comunicações via satélite e sistemas de navegação global.\nA conquista demonstra o fortalecimento da autossuficiência da China em instrumentos científicos de ponta para pesquisa espacial e geofísica.","link":"https://www.cas.cn/cm/202608/t20260804_5117883.shtml","categoria":"CIÊNCIA ESPACIAL","lang":"pt"},{"fonte":"观点网","pais":"China","titulo":"SenseTime assina parceria estratégica para inteligência de plataformas educacionais na China","resumo":"A gigante chinesa de IA SenseTime firmou um acordo estratégico com o Centro de Desenvolvimento de Tecnologia e Recursos Educacionais do Ministério da Educação.\nA colaboração visa integrar algoritmos de inteligência artificial a ecossistemas de ensino para personalizar o aprendizado e otimizar recursos pedagógicos.\nO projeto reforça o uso em larga escala de IA no setor público e a modernização digital das instituições de ensino.","link":"https://www.guandian.cn/article/20260804/580375.html","categoria":"TECNOLOGIA EDUCACIONAL","lang":"pt"},{"fonte":"美通社","pais":"China","titulo":"Elektrobit e GigaDevice concluem adaptação tecnológica para microcontroladores da série GD32A7","resumo":"A Elektrobit anunciou a conclusão bem-sucedida da adaptação do seu software automotivo EB tresos para a linha de microcontroladores GD32A7 da GigaDevice.\nA integração fornece uma solução robusta em conformidade com o padrão AUTOSAR para sistemas de unidades de controle eletrônico em veículos inteligentes.\nA colaboração fortalece a cadeia de suprimentos de chips automotivos e acelera o desenvolvimento de veículos de nova energia.","link":"https://www.prnasia.com/story/542825-1.shtml","categoria":"TECNOLOGIA AUTOMOTIVA","lang":"pt"},{"fonte":"shihang.org","pais":"China","titulo":"A experiência de Qiandao Lake: Soluções baseadas na natureza e tecnologia inteligente para a sustentabilidade","resumo":"Um novo estudo destaca o modelo de gestão ambiental adotado na região do Lago Qiandao, que combina soluções baseadas na natureza com monitoramento digital e inteligência artificial.\nA abordagem permitiu restaurar ecossistemas aquáticos e otimizar o uso sustentável dos recursos hídricos em escala regional.\nAs práticas desenvolvidas servem como referência global para integrar governança ecológica e inovação tecnológica na transição sustentável.","link":"https://www.shihang.org/zh/news/feature/2026/08/03/lessons-from-qiandao-lake-how-nature-based-solutions-smart-tech-and-innovation-are","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"Adgully.com","pais":"Índia","titulo":"Crescimento e governança impulsionados por IA alavancam a economia de consumo de US$ 1,9 trilhão da Índia: relatório Deloitte-FICCI","resumo":"Um novo relatório elaborado pela Deloitte Índia e FICCI destaca o impacto da inteligência artificial no mercado consumidor indiano.\nA aplicação de soluções tecnológicas de IA tem aprimorado a governança corporativa e impulsionado a eficiência operacional de diversos setores.\nCom essa transformação digital acelerada, a economia de consumo do país avança firmemente para alcançar o patamar de US$ 1,9 trilhão.","link":"https://www.adgully.com/post/18852/ai-enabled-growth-and-governance-drive-indias-us19-trillion-consumer-economy-deloitte-india-ficci-report","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Chemical Industry Digest","pais":"Índia","titulo":"Unidade de baterias da Tata migra para tecnologia indígena de células de lítio","resumo":"A unidade de baterias do conglomerado Tata anunciou o redirecionamento de sua produção para tecnologias nativas de células de lítio.\nO movimento busca diminuir a dependência de importações e fortalecer o ecossistema local de fabricação de componentes essenciais.\nEssa iniciativa marca um avanço crucial para a consolidação da Índia na cadeia de suprimentos global de veículos elétricos e sustentabilidade.","link":"https://chemindigest.com/tata-battery-unit-shifts-to-indigenous-lithium-cell-technology/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The New Indian Express","pais":"Índia","titulo":"Uma em cada cinco transações: Ernakulam lidera a economia de UPI em Kerala","resumo":"O distrito de Ernakulam consolidou sua posição como o maior polo de pagamentos digitais do estado de Kerala, movimentando 20% do volume total de UPI.\nO crescimento expressivo reflete a forte adesão da população e do comércio local à infraestrutura de pagamentos instantâneos da Índia.\nEsse desempenho evidencia a rápida digitalização financeira do país e o papel estratégico da região na expansão da economia digital.","link":"https://www.newindianexpress.com/states/kerala/2026/Aug/04/one-fifth-share-in-volume-value-ernakulam-drives-keralas-upi-economy","categoria":"FINTECH","lang":"pt"},{"fonte":"ANI News","pais":"Índia","titulo":"Embaixador Vinay Mohan Kwatra reúne-se com CEO da UPS e destaca oportunidades na economia indiana","resumo":"O embaixador da Índia nos EUA, Vinay Mohan Kwatra, reuniu-se com a CEO da UPS, Carol Tomé, para debater parcerias comerciais estratégicas.\nO diplomata destacou que a expansão econômica indiana oferece oportunidades promissoras para investimentos e integração em logística global.\nO encontro reflete o fortalecimento das relações bilaterais e a atratividade do mercado indiano para grandes corporações multinacionais.","link":"https://www.aninews.in/news/world/us/ambassador-vinay-mohan-kwatra-meets-ups-ceo-carol-tome-says-indian-economy-offers-exciting-opportunities-for-global-business-partnerships20260804063207","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"NDTV","pais":"Índia","titulo":"Como os novos veículos receberão alertas de colisão com tecnologia V2V a partir de 2028","resumo":"A partir de 2028, novos automóveis começarão a ser equipados com sistemas de comunicação veículo-para-veículo (V2V) para prevenção de acidentes.\nA tecnologia permite a troca contínua de dados de velocidade e posição entre carros próximos, emitindo alertas em tempo real sobre riscos na pista.\nA adoção desse recurso representa um salto significativo na infraestrutura de segurança automotiva e na modernização do trânsito.","link":"https://www.ndtv.com/india-news/how-new-vehicles-will-get-crash-warnings-with-v2v-technology-from-2028-11861901","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Expresso","pais":"Portugal","titulo":"SpaceX apresenta primeiros resultados após IPO e outros destaques desta terça-feira","resumo":"A SpaceX divulgou seus primeiros relatórios financeiros e operacionais após a recente oferta pública inicial de ações, atraindo forte atenção dos investidores globais. O desempenho da companhia reflete o avanço constante nos lançamentos espaciais e na expansão do serviço de internet via satélite Starlink. Além dos dados da empresa de Elon Musk, o cenário econômico e tecnológico internacional registrou movimentos relevantes ao longo do dia. O mercado segue acompanhando de perto os próximos passos da exploração comercial do espaço.","link":"https://expresso.pt/newsletters/expresso-economia/2026-08-04-spacex-apresenta-os-primeiros-resultados-apos-o-ipo-este-e-outros-destaques-desta-terca-feira-ebdeaf76?utm_source=expresso\u0026utm_medium=root\u0026utm_campaign=WEB\u0026utm_content=/newsletters/expresso-economia/2026-08-04-spacex-apresenta-os-primeiros-resultados-apos-o-ipo-este-e-outros-destaques-desta-terca-feira-ebdeaf76","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Portugal Resident","pais":"Portugal","titulo":"Economia portuguesa desafia turbulências e projeta crescimento de 2%","resumo":"Mesmo diante de um cenário internacional incerto e desafiador, a economia de Portugal vem demonstrando resiliência e estabilidade surpreendentes. Indicadores recentes apontam que alcançar a meta de 2% de crescimento no Produto Interno Bruto está plenamente dentro das possibilidades do país. O dinamismo do turismo, aliado ao consumo interno e à atração de novos investimentos, impulsiona esses resultados positivos. Analistas preveem que a manutenção desse ritmo fortalecerá a posição portuguesa no bloco europeu.","link":"https://www.portugalresident.com/pt/A-economia-portuguesa-desafia-a-turbul%C3%AAncia-e-o-crescimento-de-2%25-est%C3%A1-ao-seu-alcance./","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Conheça as iniciativas que marcam os 30 anos da 'Ciência Viva'","resumo":"A agência nacional 'Ciência Viva' celebra três décadas de atuação dedicada à promoção e divulgação da cultura científica e tecnológica em Portugal. Para comemorar a data, uma programação especial reúne exposições interativas, oficinas práticas e debates abertos em diversos Centros Ciência Viva do país. O projeto desempenhou um papel fundamental no incentivo ao interesse das novas gerações pelas carreiras de ciência e inovação. A celebração reforça o compromisso da instituição com a democratização do conhecimento científico.","link":"https://www.cmjornal.pt/cmtv/programas/informacao/falar-global/detalhe/conheca-as-iniciativas-que-marcam-os-30-anos-da-ciencia-viva","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"noticiasdecoimbra.pt","pais":"Portugal","titulo":"Coimbra desenvolve tecnologia para combater ciberataques e desinformação","resumo":"Pesquisadores em Coimbra desenvolveram uma solução tecnológica inovadora focada na neutralização de ameaças cibernéticas e na detecção de notícias falsas. A ferramenta utiliza algoritmos avançados para identificar padrões suspeitos e mitigar ataques em redes públicas e privadas em tempo real. A iniciativa surge como uma resposta estratégica ao aumento global de incidentes de segurança digital e manipulação de informações. O projeto fortalece a posição de Portugal no ecossistema de defesa e segurança digital da Europa.","link":"https://www.noticiasdecoimbra.pt/coimbra-cria-tecnologia-para-travar-ciberataques-e-desinformacao/","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"Câmara Municipal de Cascais","pais":"Portugal","titulo":"A ciência a serviço do mar: iniciativas impulsionam sustentabilidade oceânica","resumo":"Novos projetos científicos em Portugal estão direcionando recursos e tecnologia de ponta para a preservação e estudo dos ecossistemas marinhos. As pesquisas buscam mapear a biodiversidade oceânica, monitorar os impactos das mudanças climáticas e promover a economia azul sustentável. A cooperação entre universidades, centros de pesquisa e comunidades litorâneas tem sido vital para a aplicação prática das descobertas. A estratégia reafirma a relevância atlântica do país no cenário de proteção ambiental e inovação marítima.","link":"https://www.cascais.pt/galeria-de-imagens/ciencia-ao-servico-do-mar","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"www.gov.br","pais":"Brasil","titulo":"Cientistas identificam gênero inédito de planta no Brasil após 12 anos de pesquisas","resumo":"Após mais de uma década de pesquisas, cientistas brasileiros identificaram um gênero inédito de planta no país.\nA descoberta, validada pelo Ministério da Ciência e Tecnologia, representa um avanço significativo para a botânica nacional.\nO achado reforça a relevância do financiamento científico para mapear a biodiversidade e viabilizar a conservação ambiental.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/apos-12-anos-cientistas-identificam-genero-inedito-de-planta-no-brasil","categoria":"CIÊNCIA","lang":"en"},{"fonte":"G1","pais":"Brasil","titulo":"Apple remove Telegram da loja de aplicativos por violações de segurança","resumo":"A Apple removeu o Telegram de sua loja global de aplicativos após constatar violações das regras da plataforma.\nA medida foi tomada devido à falta de moderação adequada contra conteúdos de abuso e exploração infantil.\nO caso reacende o debate sobre a responsabilidade de grandes empresas de tecnologia na segurança digital.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/04/apple-tira-telegram-do-ar-por-violacao-de-regras-sobre-abuso-infantil.ghtml","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Donald Trump reúne-se com empresas de IA para discutir marco regulatório","resumo":"O ex-presidente Donald Trump agendou reuniões com líderes da indústria para discutir a regulação da inteligência artificial.\nA pauta busca equilibrar a inovação tecnológica acelerada com o estabelecimento de limites éticos e de segurança.\nA iniciativa acompanha uma tendência mundial de governos que buscam criar marcos regulatórios para o setor.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/08/04/trump-deve-se-reunir-hoje-com-empresas-de-ia-para-discutir-marco-regulatorio-diz-agencia.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Scania utiliza inteligência artificial para prolongar a vida útil de motores a diesel","resumo":"A Scania começou a utilizar inteligência artificial para otimizar o funcionamento e prolongar a vida útil de motores a diesel.\nA tecnologia prevê desgastes em peças antes que ocorram falhas operacionais, reduzindo custos de manutenção.\nA ação busca aliar eficiência econômica e sustentabilidade enquanto o setor avança em direção à descarbonização.","link":"https://www1.folha.uol.com.br/mercado/2026/08/scania-usa-inteligencia-artificial-para-dar-sobrevida-a-motores-a-diesel.shtml","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"www.gov.br","pais":"Brasil","titulo":"Hidrogênio natural surge como promessa para a transição energética limpa","resumo":"Pesquisadores destacaram no programa 'Ciência no Rádio' o potencial do hidrogênio natural como fonte energética limpa.\nO elemento surge como alternativa promissora para substituir combustíveis fósseis na matriz energética global.\nO avanço dos estudos pode posicionar o ecossistema científico brasileiro como referência na transição sustentável.","link":"https://www.gov.br/observatorio/pt-br/assuntos/noticias/ciencia-no-radio-fala-do-hidrogenio-natural-promessa-na-transicao-para-matrizes-energeticas-mais-limpas","categoria":"ENERGIA","lang":"en"},{"fonte":"Canal Rural","pais":"Brasil","titulo":"Tecnologia da Embrapa obtém certificação oficial e impulsiona a agricultura familiar","resumo":"Uma solução tecnológica desenvolvida pela Embrapa obteve certificação oficial de eficiência e aplicabilidade.\nA inovação é voltada ao fortalecimento da agricultura familiar, permitindo maior produtividade no campo.\nO reconhecimento valida a importância do investimento em ciência aplicada para o desenvolvimento rural sustentável.","link":"https://www.canalrural.com.br/agricultura/tecnologia-da-embrapa-conquista-certificacao-e-impulsiona-agricultura-familiar/","categoria":"AGROTECNOLOGIA","lang":"en"},{"fonte":"Portal CMBH |","pais":"Brasil","titulo":"Política de robótica nas escolas públicas é aprovada em segundo turno","resumo":"A proposta que implementa o ensino de robótica nas escolas públicas foi aprovada em segundo turno de votação.\nA medida visa democratizar o acesso à tecnologia e ao pensamento computacional para alunos do ensino básico.\nA iniciativa tem como objetivo capacitar jovens para o mercado de trabalho do futuro e diminuir desigualdades educacionais.","link":"https://www.cmbh.mg.gov.br/comunica%C3%A7%C3%A3o/not%C3%ADcias/2026/08/pol%C3%ADtica-de-rob%C3%B3tica-nas-escolas-p%C3%BAblicas-%C3%A9-aprovada-em-2%C2%BA-turno","categoria":"EDUCAÇÃO TECNOLÓGICA","lang":"en"},{"fonte":"Finanças, Câmbio e Investimentos","pais":"Brasil","titulo":"BMW adotará tecnologia ultra-wideband da NXP em seus veículos a partir de 2026","resumo":"A BMW anunciou que adotará a tecnologia ultra-wideband da fornecedora NXP em seus veículos a partir de 2026.\nO recurso promete aprimorar a precisão na localização de dispositivos e a segurança das chaves digitais.\nA parceria demonstra a crescente relevância dos semicondutores e da conectividade no setor automotivo.","link":"https://br.investing.com/news/company-news/bmw-vai-adotar-tecnologia-ultrawideband-da-nxp-nos-veiculos-de-2026-93CH-2024660","categoria":"TECNOLOGIA AUTOMOTIVA","lang":"en"},{"fonte":"WSJ","pais":"Estados Unidos","titulo":"O boom da IA está transformando a economia americana de forma irreconhecível","resumo":"O rápido avanço da inteligência artificial está remodelando profundamente a economia dos Estados Unidos.\nGrandes investimentos em infraestrutura de dados, automação e desenvolvimento de software estão impulsionando novos setores.\nEspecialistas destacam que o impacto da IA vai além da produtividade, alterando o mercado de trabalho e as relações comerciais.\nEssa transformação massiva sinaliza uma nova era econômica liderada pela tecnologia de ponta.","link":"https://www.wsj.com/economy/the-ai-boom-is-transforming-the-american-economy-beyond-recognition-c7825b31","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"Newsroom | UCLA","pais":"Estados Unidos","titulo":"Equipe liderada pela UCLA é selecionada para prêmio de tecnologia quântica da NSF","resumo":"Uma equipe de pesquisadores liderada pela UCLA recebeu um prestigioso prêmio da National Science Foundation.\nO financiamento visa acelerar o desenvolvimento de tecnologias e computação quântica nos Estados Unidos.\nA iniciativa busca consolidar avanços científicos cruciais em processamento de dados e segurança da informação.\nO projeto promete expandir as fronteiras da física aplicada e formar novos especialistas no setor.","link":"https://newsroom.ucla.edu/releases/ucla-led-team-national-science-foundation-quantum-technology-award-2726643","categoria":"TECNOLOGIA QUÂNTICA","lang":"en"},{"fonte":"Stanford HAI","pais":"Estados Unidos","titulo":"Modelos de código aberto precisam ser verdadeiramente abertos para a ciência e a sociedade","resumo":"Especialistas defendem que disponibilizar apenas os pesos dos modelos de IA não é suficiente para o avanço científico.\nA criação de modelos verdadeiramente open source exige transparência total sobre dados de treinamento e arquitetura.\nEssa abordagem é considerada fundamental para garantir a auditabilidade, a segurança e a democratização do conhecimento.\nGarantir o acesso livre fortalece a pesquisa acadêmica e beneficia a sociedade como um todo.","link":"https://hai.stanford.edu/news/open-weight-models-arent-enough-we-need-truly-open-source-ai-models-for-science-and-society","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"Forbes","pais":"Estados Unidos","titulo":"Nova geração de drones inteligentes é definida pela convergência tecnológica","resumo":"A integração de inteligência artificial, sensores avançados e robótica está criando drones cada vez mais autônomos.\nEsses novos dispositivos conseguem operar em ambientes complexos sem a necessidade de intervenção humana constante.\nA convergência tecnológica expande as aplicações comerciais, civis e de segurança dessas aeronaves não tripuladas.\nO setor passa por uma rápida evolução que redefine os padrões de eficiência e navegação no ar.","link":"https://www.forbes.com/sites/chuckbrooks/2026/08/03/new-generation-of-intelligent-drones-defined-by-technology-convergence/","categoria":"ROBÓTICA","lang":"en"},{"fonte":"Proactive Investors","pais":"Estados Unidos","titulo":"Restrições de robôs nos EUA atingem aspiradores inteligentes no conflito tecnológico","resumo":"A escalada das tensões tecnológicas e comerciais entre Estados Unidos e China atingiu o mercado de robótica doméstica.\nNovas regulamentações e restrições impostas pelos EUA começam a afetar até mesmo aspiradores de pó inteligentes.\nA preocupação com a segurança cibernética e a coleta de dados de navegação interna motivou medidas mais severas.\nA decisão reflete o endurecimento do controle sobre dispositivos conectados importados pelo país.","link":"https://www.proactiveinvestors.co.uk/companies/news/1096458/tech-bytes-us-robot-restrictions-sweep-smart-vacuums-into-escalating-technology-conflict-1096458.html","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"MobiHealthNews","pais":"Estados Unidos","titulo":"Throne Science arrecada US$ 10 milhões para sensor sanitário com inteligência artificial","resumo":"A startup Throne Science captou US$ 10 milhões em investimentos para desenvolver um sensor de vaso sanitário via IA.\nO dispositivo analisa amostras biológicas para monitorar a saúde intestinal e fornecer dados preventivos ao usuário.\nA proposta une saúde digital e automação residencial para transformar a rotina de cuidados médicos contínuos.\nO aporte financeiro será utilizado para expandir a tecnologia e validar novos testes clínicos.","link":"https://www.mobihealthnews.com/news/throne-science-raises-10m-ai-toilet-sensor","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"ScienceDaily","pais":"Estados Unidos","titulo":"Cientistas buscavam árvores gigantes em Taiwan e encontraram um mundo perdido","resumo":"Durante uma expedição científica em busca de árvores seculares e gigantescas em Taiwan, pesquisadores fizeram uma descoberta impressionante.\nA equipe mapeou um ecossistema isolado e preservado que abrigava espécies vegetais e animais raras.\nA pesquisa reforça a importância da conservação ambiental em florestas tropicais de difícil acesso.\nOs dados coletados ajudam a compreender melhor a biodiversidade e a resiliência dos ecossistemas antigos.","link":"https://www.sciencedaily.com/releases/2026/08/260802223431.htm","categoria":"CIÊNCIA","lang":"en"},{"fonte":"Oncodaily","pais":"United States","titulo":"How Science Turned a Stage IV Lung Cancer Diagnosis into 12 Years of Hope","resumo":"The story of physician Douglas Flora exemplifies significant advances in the treatment of advanced lung cancer.\nThanks to targeted therapies and precision medicine, a previously devastating diagnosis has transformed into years of quality life.\nThe case highlights how ongoing scientific research has changed the prognosis for patients with complex oncology.\nBiological innovations and immunotherapies continue to redefine the limits of modern medical treatment.","link":"https://oncodaily.com/stories/douglas-flora-558263","categoria":"MEDICINE","lang":"en"},{"fonte":"Investing.com France","pais":"France","titulo":"Bayer Beats Q2 Expectations Boosted by Crop Science and Reduces Debt","resumo":"Pharmaceutical and biotechnology multinational Bayer posted financial results above expectations in the second quarter of this year.\nGrowth was driven by the strong performance of its agricultural science division, Crop Science, focused on innovation and crop protection.\nIn addition to the positive result, the company made significant progress in reducing its global debt.","link":"https://fr.investing.com/news/earnings/bayer-depasse-les-attentes-du-t2-grace-a-crop-science-et-reduit-sa-dette-3533489","categoria":"BUSINESS","lang":"en"},{"fonte":"Pour la Science","pais":"France","titulo":"New System Can Cool Data Centers Ultra-Efficiently","resumo":"Engineers and researchers have developed a new technological solution capable of cooling data centers with high energy efficiency.\nWith the dramatic increase in artificial intelligence workloads, energy consumption and server heating have become major challenges.\nThis new approach promises to reduce operating costs and mitigate the environmental impact of global digital infrastructure.","link":"https://www.pourlascience.fr/sd/technologie/data-centers-des-ailettes-en-forme-de-sapin-pour-mieux-evacuer-la-chaleur-29356.php","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Montres-de-luxe.com","pais":"France","titulo":"Seiko 5 Sports Motocompo: The Icon of the Japanese Foldable Scooter Reborn on the Wrist","resumo":"Watchmaker Seiko has launched a special edition of the 5 Sports line inspired by the legendary 1980s Honda Motocompo foldable scooter.\nThe watch combines retro visual elements with modern mechanical precision, paying tribute to industrial design and Japanese pop culture.\nThe new release has caught the attention of collectors and vintage design and technology enthusiasts worldwide.","link":"https://www.montres-de-luxe.com/Seiko-5-Sports-Motocompo-l-icone-du-scooter-pliable-japonais-renait-au-poignet_a21769.html","categoria":"INNOVATION","lang":"en"},{"fonte":"topsante.com","pais":"France","titulo":"Drinking 2 to 3 Cups of Coffee a Day Has This Health Effect, According to Science","resumo":"A new scientific study has revealed the beneficial impacts of moderate coffee consumption on the human body over the long term.\nResearchers point out that drinking two to three cups of the beverage daily is associated with improved cardiovascular health and the prevention of metabolic diseases.\nThe findings reinforce the role of bioactive substances present in the bean in promoting longevity.","link":"https://www.topsante.com/nutrition_et_recettes/nutrition/boire-2-a-3-cafes-par-jour-aurait-cet-effet-sur-votre-sante-selon-la-science-977986","categoria":"SCIENCE","lang":"en"},{"fonte":"Les Echos","pais":"France","titulo":"«Silicon Island»: Taiwan's Growth Soars Boosted by AI","resumo":"Known globally as the semiconductor island, Taiwan has recorded a sharp acceleration in its recent economic growth.\nHigh global demand for advanced chips indispensable for running artificial intelligence models has boosted the country's exports.\nThis scenario solidifies Taiwan as a strategic and irreplaceable hub in the modern technology supply chain.","link":"https://www.lesechos.fr/monde/asie-pacifique/silicon-island-la-croissance-de-taiwan-senvole-grace-a-lia-2245765","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"tv5monde","pais":"France","titulo":"Rockets, Starlink, and AI: SpaceX Holds Its First Presentation for Wall Street","resumo":"SpaceX has held its first official presentation targeted at major investors and financial market analysts on Wall Street.\nThe company highlighted the progress of its reusable rockets, the expansion of the Starlink satellite internet network, and new applications in artificial intelligence.\nThe move signals greater openness by the private space company toward transparency and the capital markets.","link":"https://information.tv5monde.com/economie/fusees-starlink-ia-spacex-passe-son-premier-oral-devant-wall-street-2832413","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Correio da Manhã","pais":"France","titulo":"Anthropic AI Models Being Used in Attacks Against Companies","resumo":"Recent cybersecurity reports reveal that artificial intelligence models developed by Anthropic have been exploited in attacks against corporations.\nMalicious actors are adapting these tools to automate breaches, find system vulnerabilities, and create sophisticated social engineering scams.\nThe case raises a global alert regarding the risks and the need for regulation in the use of advanced AIs.","link":"https://www.cmjornal.pt/tecnologia/amp/modelos-de-ia-da-anthropic-atacam-empresas","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"Sortir à Paris","pais":"France","titulo":"Fête de la Science 2026 in Vexin: Explore Landscapes on Geological Tours","resumo":"The Vexin region is preparing to host a special edition of the Fête de la Science focused on geology and natural heritage.\nThe event will feature expert-guided walks to explore landscape formation and local biodiversity in an accessible way.\nThe initiative aims to bring the general public closer to scientific research and raise awareness about environmental preservation.","link":"https://www.sortiraparis.com/pt/crianca-familia/articles/333345-festa-da-ciencia-2026-no-vexin-95-explore-os-cenarios-durante-passeios-geologicos","categoria":"SCIENCE","lang":"en"},{"fonte":"geplus.co.uk","pais":"England","titulo":"New Project Empowers Young People to Engage with Environmental Science","resumo":"A new project in the UK is encouraging young people to actively participate in initiatives focused on environmental science. The action aims to bring the new generation closer to sustainability issues, stimulating ecological awareness and practical scientific research. The program seeks to train community leaders better prepared to face today's growing climate challenges.","link":"https://www.geplus.co.uk/news/industry-news/new-project-empowers-youngsters-to-engage-with-environmental-science-04-08-2026/","categoria":"SCIENCE","lang":"en"},{"fonte":"NW Mail","pais":"England","titulo":"Barrow's Vue Cinema Is One of 18 in the Country to Introduce New Cutting-Edge Technology","resumo":"The Vue cinema in Barrow has been selected as one of 18 units in the country to receive cutting-edge technological innovations in film screening. The upgrade aims to provide an immersive audiovisual experience for local viewers through modern digital equipment. With the investment, the chain seeks to modernize regional entertainment infrastructure and attract an increasingly demanding audience.","link":"https://www.nwemail.co.uk/news/26431573.vue-cinema-barrow-gets-new-audio-assistive-technology/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Can You Tell If Someone Is Filming You with Meta Glasses?","resumo":"A new video investigates privacy concerns related to the use of smart glasses developed by Meta in public spaces. The assessment analyzes the effectiveness of the device's light indicators in alerting people nearby about ongoing recordings. The debate highlights the ethical challenges brought by the rapid popularization and integration of these wearable technologies into everyday life.","link":"https://www.theguardian.com/technology/video/2026/aug/04/meta-glasses-can-you-tell-if-someone-is-filming-you-video","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Apple Challenges UK Government Data Access Demand in Court","resumo":"Apple has initiated legal action against British government demands to gain facilitated access to user data and alter encryption features. The tech giant argues that complying with such requests compromises the global security of its devices and individual privacy. The dispute highlights the ongoing clash between public safety and data protection in the digital age.","link":"https://www.theguardian.com/technology/2026/aug/03/apple-legal-challenge-uk-government-data-access","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Mining Review Africa","pais":"England","titulo":"Weir Uses Technology to Turn Sustainable Mining into Reality","resumo":"Engineering firm Weir is adopting advanced technological solutions to make mining processes significantly more sustainable. The implemented innovations aim to reduce water consumption, optimize energy use, and lessen the environmental impact of industrial operations. The initiative represents an important step in the extractive sector's transition toward ecologically more efficient practices.","link":"https://www.miningreview.com/pt/news/weir-uses-technology-to-turn-sustainable-mining-into-reality/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Science Funding Cuts Will Harm Britain's Global Standing","resumo":"Scientists and academics warn in public letters that reductions in research and innovation budgets could severely damage Great Britain's international leadership. The budget cuts threaten essential projects, in addition to making it harder to retain renowned scientific talent in the country's universities. Experts argue that investment in science must be maintained as a national strategic priority.","link":"https://www.theguardian.com/science/2026/aug/03/science-funding-cuts-will-harm-britains-global-standing","categoria":"SCIENCE","lang":"en"},{"fonte":"Financial Times","pais":"Inglaterra","titulo":"É hora de Andy Burnham apoiar a ciência no Reino Unido","resumo":"Analistas pedem que o prefeito da Grande Manchester, Andy Burnham, amplie seu apoio e engajamento com o ecossistema de pesquisa científica britânico. A mobilização de lideranças regionais é vista como fundamental para impulsionar ecossistemas de inovação fora do eixo tradicional de Londres. O fortalecimento dessas parcerias locais pode acelerar o desenvolvimento tecnológico e a economia do conhecimento regional.","link":"https://www.ft.com/content/1419a5f5-1bd7-4b89-b667-45c2789769ef?syn-25a6b1a6=1","categoria":"CIÊNCIA","lang":"en"},{"fonte":"ADSLZone","pais":"Espanha","titulo":"Starlink muda sua política: você não precisará mais devolver o roteador antigo ao trocar de dispositivo","resumo":"A Starlink atualizou suas diretrizes de serviço e não exige mais a devolução do roteador antigo ao atualizar ou substituir equipamentos.\nA medida visa simplificar o processo de transição para os clientes e reduzir custos de logística para a empresa de internet via satélite.\nOs usuários agora podem descartar, reciclar ou guardar o dispositivo anterior sem penalidades financeiras ou burocracias.\nEssa mudança reflete uma tendência de facilitação na experiência do consumidor no setor de telecomunicações.","link":"https://www.adslzone.net/noticias/internet/starlink-no-exige-devolucion-equipos/","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"Diario de León","pais":"Espanha","titulo":"Projeto de ciência cidadã em León descobre nova alga ao analisar o impacto de bioplásticos","resumo":"Uma iniciativa de ciência cidadã desenvolvida em León levou à descoberta de uma nova espécie de alga durante estudos de impacto ambiental.\nOs pesquisadores e voluntários avaliavam como os bioplásticos se comportam e se decompõem nos ecossistemas aquáticos locais.\nO achado destaca a importância da participação comunitária na pesquisa científica e na preservação da biodiversidade.\nA descoberta pode fornecer dados valiosos sobre a interação entre novos materiais biodegradáveis e a vida aquática.","link":"https://www.diariodeleon.es/monograficos/innova/260804/2093157/proyecto-ciencia-ciudadana-leon-halla-nueva-alga-analizar-impacto-bioplasticos_amp.html","categoria":"CIÊNCIA","lang":"en"},{"fonte":"Investing.com España","pais":"Espanha","titulo":"Bolsas asiáticas se estabilizam enquanto o setor de tecnologia chinês recupera força","resumo":"Os mercados financeiros na Ásia demonstraram sinais de estabilização após períodos de volatilidade, impulsionados pela recuperação de empresas de tecnologia chinesas.\nO avanço das ações de gigantes tecnológicas na China ajudou a restaurar a confiança dos investidores internacionais na região.\nEspecialistas apontam que medidas regulatórias e incentivos econômicos recentes contribuíram para a melhora do cenário do setor.\nEssa movimentação reflete a forte influência do desempenho tecnológico chinês sobre o comportamento econômico global.","link":"https://es.investing.com/news/stock-market-news/las-bolsas-asiaticas-se-estabilizan-mientras-la-tecnologia-china-rebota-3775766","categoria":"NEGÓCIOS","lang":"en"},{"fonte":"ArchDaily","pais":"Espanha","titulo":"Nova tecnologia permite reaproveitar resíduos de vidro e plástico considerados não recicláveis","resumo":"Um novo avanço tecnológico viabilizou o processamento e reaproveitamento de resíduos de plástico e vidro antes classificados como não recicláveis.\nA inovação transforma esses descartes complexos em matérias-primas úteis para a indústria e construção civil, reduzindo o acúmulo em aterros.\nO método promete diminuir os custos ambientais e a pegada de carbono associados ao descarte inadequado de materiais.\nA solução representa um marco importante para a economia circular e para o desenvolvimento de soluções sustentáveis.","link":"https://www.archdaily.com/es/944859/una-nueva-tecnologia-permite-aprovechar-los-desechos-de-vidrio-y-plastico-etiquetados-como-materiales-no-reciclables/5f216dd2b357653d3a00080f-are-all-plastics-recyclable-spotlight-on-a-new-technology-that-reclaims-rejects-of-plastics-and-glass-image","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"E3-Magazin","pais":"Alemanha","titulo":"Estudo da KPMG: Inteligência Artificial transforma a economia alemã mais rapidamente","resumo":"Um novo estudo conduzido pela KPMG revela que a adoção de Inteligência Artificial nas empresas alemãs está ocorrendo em um ritmo muito mais acelerado do que o previsto.\nO relatório destaca que a IA generativa e a automação de processos já estão redefinindo a produtividade e a competitividade industrial do país.\nEspecialistas apontam que as organizações que não se adaptarem rapidamente a essa transformação tecnológica correm sérios riscos de perder espaço no mercado global.","link":"https://e3mag.com/en/kpmg-studie-ki-veraendert-deutsche-wirtschaft-schneller/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"Spiegel","pais":"Alemanha","titulo":"Ar-condicionado com refrigeração de estado sólido: como funciona a próxima geração de aparelhos","resumo":"A próxima geração de sistemas de climatização está migrando para a tecnologia de refrigeração de estado sólido, que promete ser mais sustentável e eficiente.\nAo eliminar o uso de compressores mecânicos e gases refrigerantes nocivos, esses novos dispositivos utilizam efeitos calóricos em materiais sólidos para controlar a temperatura.\nA inovação pode revolucionar a indústria de eletrodomésticos e reduzir significativamente o consumo de energia elétrica no setor de refrigeração global.","link":"https://www.spiegel.de/wissenschaft/klimaanlagen-mit-festkoerperkuehlung-so-funktioniert-die-naechste-generation-der-geraete-a-b4d3d5f2-2846-4b81-b856-db9278b93f6e","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Moedas Digitais: Um em cada oito adultos na Alemanha possui criptomoedas","resumo":"Uma recente pesquisa revelou que o mercado de ativos digitais na Alemanha atingiu uma nova marca de popularidade, com cerca de 12,5% da população adulta investindo em criptomoedas.\nA crescente adoção reflete a maior maturidade do setor no país e a busca dos cidadãos por alternativas de investimento e proteção patrimonial.\nAnalistas indicam que o fortalecimento da regulamentação europeia tem contribuído para aumentar a confiança dos investidores individuais no mercado cripto.","link":"https://www.sueddeutsche.de/wirtschaft/digital-waehrungen-jeder-achte-erwachsene-in-deutschland-haelt-kryptowaehrungen-dpa.urn-newsml-dpa-com-20090101-260804-930-480443","categoria":"CRIPTOMOEDAS","lang":"en"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Empresa de dados e IA Palantir registra crescimento superior a 90% na receita","resumo":"A empresa de análise de dados e Inteligência Artificial Palantir apresentou um crescimento expressivo de mais de 90% em sua receita, impulsionado pela alta demanda global por soluções avançadas de IA.\nOs resultados surpreenderam analistas e reforçam o momento de forte expansão do setor de tecnologia focado em inteligência de negócios e defesa.\nA alta procura por plataformas generativas em clientes corporativos e governamentais foi o principal motor desse desempenho recorde.","link":"https://www.sueddeutsche.de/wirtschaft/palantir-umsatz-usa-prozent-li.3526120","categoria":"NEGÓCIOS","lang":"en"},{"fonte":"物流ニュースのLNEWS","pais":"Japão","titulo":"Yamato HD investe na startup de tecnologia quântica JIJ por meio de fundo CVC","resumo":"A Yamato Holdings anunciou um investimento estratégico na JIJ, uma startup especializada no desenvolvimento e aplicação prática de tecnologia quântica.\nO aporte foi realizado por meio de seu fundo de Venture Capital Corporativo com o objetivo de otimizar redes de logística e rotas de entrega complexas.\nA iniciativa busca integrar algoritmos quânticos às operações diárias da empresa para aumentar a eficiência operacional e reduzir custos no setor de transportes.","link":"https://www.lnews.jp/2026/08/s0804104.html","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"CoinPost","pais":"Japão","titulo":"Da infraestrutura de IA à economia digital: A estratégia de inteligência artificial do Japão na WebX2026","resumo":"Durante o evento WebX2026, executivos líderes debateram a evolução e os rumos da estratégia nacional do Japão para a inteligência artificial.\nO foco do painel esteve na transição do desenvolvimento de infraestrutura básica para a criação de um ecossistema econômico susten
