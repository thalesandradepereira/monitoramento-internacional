tável impulsionado por IA.\nA iniciativa visa posicionar o país como uma referência global na integração de modelos avançados de IA aos setores produtivo, financeiro e corporativo.","link":"https://coinpost.jp/?p=729502","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"KDDI","pais":"Japão","titulo":"KDDI realiza novo aporte na JIJ para acelerar a aplicação social da tecnologia quântica","resumo":"O fundo KDDI Open Innovation Fund 3 realizou um investimento adicional na startup JIJ, focada na implementação prática do processamento quântico.\nO novo aporte financeiro visa impulsionar a aplicação de soluções quânticas em cenários reais do mercado, como telecomunicações e análises preditivas.\nA parceria reforça o compromisso da gigante das telecomunicações em liderar a transição tecnológica rumo à era do processamento de dados de altíssima velocidade.","link":"https://www.kddi.com/open-innovation-program/news/2026/0804/","categoria":"TECNOLOGIA QUÂNTICA","lang":"en"},{"fonte":"共同通信PRワイヤー","pais":"Japão","titulo":"JIJ recebe investimentos para expandir soluções de otimização matemática com tecnologia quântica","resumo":"A startup japonesa JIJ atraiu novos investimentos focados em impulsionar o desenvolvimento de suas soluções de otimização matemática baseadas em computação quântica.\nAs ferramentas desenvolvidas pela empresa visam resolver problemas operacionais extremamente complexos em diversos setores industriais e comerciais.\nO aporte financeiro consolida a relevância do setor quântico no país, impulsionando a competitividade de empresas que dependem de análise avançada de dados.","link":"https://kyodonewsprwire.jp/release/202608033556","categoria":"COMPUTAÇÃO QUÂNTICA","lang":"en"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Kawasaki Heavy Industries licenciará tecnologia de controle de inversores para energia renovável","resumo":"A Kawasaki Heavy Industries anunciou que começará a licenciar sua avançada tecnologia de controle de inversores voltada para o setor de energias renováveis.\nA inovação visa estabilizar o fornecimento elétrico e otimizar a conversão de energia originada de fontes eólicas e solares na rede de distribuição.\nCom o licenciamento, a empresa pretende acelerar a transição energética global e expandir suas operações tecnológicas no mercado internacional sustentável.","link":"https://www.nikkei.com/article/DGXZQOUC0421V0U6A800C2000000/","categoria":"ENERGIA","lang":"en"},{"fonte":"ビジネスネットワーク","pais":"Japão","titulo":"Rakuten Mobile, OKI e Universidade de Ciências de Tóquio realizam testes de condução autônoma Nível 4","resumo":"Uma parceria entre Rakuten Mobile, OKI e o Institute of Science Tokyo deu início a testes práticos de veículos autônomos de Nível 4 na cidade de Saga.\nO projeto utiliza infraestrutura avançada de conectividade 5G para garantir a comunicação em tempo real e a navegação segura de veículos sem motorista.\nO experimento busca validar soluções de transporte público autônomo para mitigar a escassez de motoristas e melhorar a mobilidade urbana regional.","link":"https://businessnetwork.jp/article/36346/","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"ドローンジャーナル","pais":"Japan","titulo":"Taiwan's Semiconductor and OEM Technology Strengthens AI Drone Supply Chain at COMPUTEX 2026","resumo":"COMPUTEX 2026 highlighted the pivotal role of Taiwan's semiconductor and OEM production industry in developing AI-powered autonomous drones.\nThe exhibition showcased advancements in the global supply chain, featuring dedicated chips and hardware architectures focused on on-device processing.\nThis technical collaboration promises to accelerate the adoption of intelligent drones in industrial inspections, regional security, and advanced commercial logistics.","link":"https://drone-journal.impress.co.jp/docs/event/1188717.html","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"ドローンジャーナル","pais":"Japan","titulo":"JR East Promotes the 'Drone DX CHAMPIONSHIP 2026' Focused on Railway Infrastructure Inspection","resumo":"JR East has announced the 'Drone DX CHAMPIONSHIP 2026', a competition dedicated to evaluating and accelerating drone inspection technologies.\nThe event will bring together companies and startups to demonstrate autonomous solutions aimed at monitoring tracks, bridges, and critical railway structures.\nThe initiative aims to integrate digital transformation into preventive maintenance routines, increasing safety and dramatically reducing operational costs.","link":"https://drone-journal.impress.co.jp/docs/event/1188715.html","categoria":"ROBOTICS","lang":"en"},{"fonte":"财联社","pais":"China","titulo":"UN Panel Warns That AI Advancement Outpaces Scientific Understanding and Regulatory Capacity","resumo":"A group of United Nations experts warned that the dizzying pace of artificial intelligence development has surpassed current scientific knowledge and governance frameworks.\nThe report highlights that a lack of control and ethical safeguards could trigger global catastrophic risks across various sectors.\nConsequently, the panel advocates for the urgent creation of international cooperation mechanisms to monitor and regulate emerging technologies.","link":"https://www.cls.cn/detail/2414744","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"财联社","pais":"China","titulo":"People's Daily Commentary: Semiconductors Redefine 'Tau Law' and China Can Rewrite the Sector","resumo":"An opinion piece in the People's Daily notes that the global semiconductor industry is undergoing a profound transformation and adopting new paradigms beyond traditional metrics.\nThe text emphasizes the growing role of Chinese companies in developing proprietary chip architectures and technologies.\nThis evolution could substantially alter global technology market dynamics and redefine worldwide technological standards.","link":"https://www.cls.cn/detail/2380675","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"cb.com.cn","pais":"China","titulo":"Focused on Foundation Models for Science AI, CAS Wenge Spin-off Startup Launched","resumo":"Saisi Limit, a company incubated by CAS Wenge, was officially introduced with the goal of driving research and development of artificial intelligence foundation models geared toward science (AI4S).\nThe initiative seeks to apply advanced algorithms to solve complex problems in physics, chemistry, and biology.\nThe launch reinforces China's strategy to accelerate scientific discoveries through next-generation computational tools.","link":"http://www.cb.com.cn/index/show/gd/cv/cv1362575711491","categoria":"TECHNOLOGICAL INNOVATION","lang":"en"},{"fonte":"cast.org.cn","pais":"China","titulo":"Forum on Intelligent Perception and Low-Altitude Aircraft Fusion Held in Beijing","resumo":"During the 28th Annual Meeting of the China Association for Science and Technology, a specialized forum debated intelligent perception and fusion for aircraft in complex low-altitude environments.\nexperts presented innovations focused on operational safety, autonomous navigation, and air traffic management for drones and eVTOL vehicles.\nThe event drives the development of the so-called low-altitude economy, a priority sector for the country's technology ecosystem.","link":"https://www.cast.org.cn/xw/qgxh/ZHXX/art/2026/art_f20ed443b2fe4dbeb98933bc6eabd758.html","categoria":"AVIATION AND AI","lang":"en"},{"fonte":"中国科学院","pais":"China","titulo":"China Science Daily: With Homegrown Radar Technology, Scientists Unveil Ionosphere Secrets","resumo":"Chinese scientists have achieved significant breakthroughs in studying ionospheric phenomena using domestically developed high-precision radars.\nThe equipment makes it possible to monitor atmospheric disturbances and electromagnetic storms that affect satellite communications and global navigation systems.\nThis achievement demonstrates the strengthening of China's self-reliance in cutting-edge scientific instruments for space and geophysical research.","link":"https://www.cas.cn/cm/202608/t20260804_5117883.shtml","categoria":"SPACE SCIENCE","lang":"en"},{"fonte":"观点网","pais":"China","titulo":"SenseTime Signs Strategic Partnership for Educational Platform Intelligence in China","resumo":"Chinese AI giant SenseTime has signed a strategic agreement with the Ministry of Education's Educational Technology and Resource Development Center.\nThe collaboration aims to integrate artificial intelligence algorithms into teaching ecosystems to personalize learning and optimize pedagogical resources.\nThe project reinforces the large-scale use of AI in the public sector and the digital modernization of educational institutions.","link":"https://www.guandian.cn/article/20260804/580375.html","categoria":"EDUCATIONAL TECHNOLOGY","lang":"en"},{"fonte":"美通社","pais":"China","titulo":"Elektrobit and GigaDevice Complete Technology Adaptation for GD32A7 Series Microcontrollers","resumo":"Elektrobit announced the successful completion of the adaptation of its EB tresos automotive software for GigaDevice's GD32A7 microcontroller line.\nThe integration provides a robust solution compliant with the AUTOSAR standard for electronic control unit systems in smart vehicles.\nThe collaboration strengthens the automotive chip supply chain and accelerates the development of new energy vehicles.","link":"https://www.prnasia.com/story/542825-1.shtml","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"shihang.org","pais":"China","titulo":"The Qiandao Lake Experience: Nature-Based Solutions and Smart Technology for Sustainability","resumo":"A new study highlights the environmental management model adopted in the Qiandao Lake region, which combines nature-based solutions with digital monitoring and artificial intelligence.\nThe approach has made it possible to restore aquatic ecosystems and optimize the sustainable use of water resources on a regional scale.\nThe practices developed serve as a global benchmark for integrating ecological governance and technological innovation into the sustainable transition.","link":"https://www.shihang.org/zh/news/feature/2026/08/03/lessons-from-qiandao-lake-how-nature-based-solutions-smart-tech-and-innovation-are","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"Adgully.com","pais":"India","titulo":"AI-Driven Growth and Governance Propel India's $1.9 Trillion Consumer Economy: Deloitte-FICCI Report","resumo":"A new report prepared by Deloitte India and FICCI highlights the impact of artificial intelligence on the Indian consumer market.\nThe application of AI technology solutions has enhanced corporate governance and driven the operational efficiency of various sectors.\nWith this accelerated digital transformation, the country's consumer economy is advancing steadily to reach the $1.9 trillion mark.","link":"https://www.adgully.com/post/18852/ai-enabled-growth-and-governance-drive-indias-us19-trillion-consumer-economy-deloitte-india-ficci-report","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Chemical Industry Digest","pais":"India","titulo":"Tata Battery Unit Shifts to Indigenous Lithium Cell Technology","resumo":"The battery unit of the Tata conglomerate has announced a redirection of its production toward native lithium cell technologies.\nThe move seeks to reduce dependence on imports and strengthen the local ecosystem for manufacturing essential components.\nThis initiative marks a crucial step toward solidifying India's place in the global electric vehicle and sustainability supply chain.","link":"https://chemindigest.com/tata-battery-unit-shifts-to-indigenous-lithium-cell-technology/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The New Indian Express","pais":"India","titulo":"One in Five Transactions: Ernakulam Leads Kerala's UPI Economy","resumo":"Ernakulam district has consolidated its position as the largest digital payments hub in Kerala state, accounting for 20% of total UPI volume.\nThis expressive growth reflects the strong adoption of India's instant payments infrastructure by the population and local commerce.\nThis performance highlights the country's rapid financial digitization and the region's strategic role in expanding the digital economy.","link":"https://www.newindianexpress.com/states/kerala/2026/Aug/04/one-fifth-share-in-volume-value-ernakulam-drives-keralas-upi-economy","categoria":"FINTECH","lang":"en"},{"fonte":"ANI News","pais":"India","titulo":"Ambassador Vinay Mohan Kwatra Meets UPS CEO, Highlights Opportunities in the Indian Economy","resumo":"Indian Ambassador to the US Vinay Mohan Kwatra met with UPS CEO Carol Tomé to discuss strategic trade partnerships.\nThe diplomat highlighted that India's economic expansion offers promising opportunities for investments and integration into global logistics.\nThe meeting reflects the strengthening of bilateral relations and the attractiveness of the Indian market for major multinational corporations.","link":"https://www.aninews.in/news/world/us/ambassador-vinay-mohan-kwatra-meets-ups-ceo-carol-tome-says-indian-economy-offers-exciting-opportunities-for-global-business-partnerships20260804063207","categoria":"BUSINESS","lang":"en"},{"fonte":"NDTV","pais":"India","titulo":"How New Vehicles Will Receive Collision Warnings With V2V Technology Starting in 2028","resumo":"Starting in 2028, new automobiles will begin being equipped with vehicle-to-vehicle (V2V) communication systems for accident prevention.\nThe technology allows the continuous exchange of speed and position data between nearby cars, issuing real-time alerts about road hazards.\nThe adoption of this feature represents a significant leap forward in automotive safety infrastructure and traffic modernization.","link":"https://www.ndtv.com/india-news/how-new-vehicles-will-get-crash-warnings-with-v2v-technology-from-2028-11861901","categoria":"INNOVATION","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"SpaceX Reports First Results Following IPO and Other Top Stories This Tuesday","resumo":"SpaceX has released its initial financial and operational reports following its recent initial public offering, drawing intense attention from global investors. The company's performance reflects steady progress in space launches and the expansion of the Starlink satellite internet service. Alongside data from Elon Musk's company, the international economic and technological landscape saw notable developments throughout the day. The market continues to closely monitor the next steps in commercial space exploration.","link":"https://expresso.pt/newsletters/expresso-economia/2026-08-04-spacex-apresenta-os-primeiros-resultados-apos-o-ipo-este-e-outros-destaques-desta-terca-feira-ebdeaf76?utm_source=expresso\u0026utm_medium=root\u0026utm_campaign=WEB\u0026utm_content=/newsletters/expresso-economia/2026-08-04-spacex-apresenta-os-primeiros-resultados-apos-o-ipo-este-e-outros-destaques-desta-terca-feira-ebdeaf76","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Portugal Resident","pais":"Portugal","titulo":"Portuguese Economy Defies Turbulence and Projects 2% Growth","resumo":"Despite an uncertain and challenging international backdrop, Portugal's economy has demonstrated surprising resilience and stability. Recent indicators suggest that achieving the 2% GDP growth target is well within the country's reach. The dynamism of the tourism sector, combined with domestic consumption and the attraction of new investments, is driving these positive results. Analysts forecast that maintaining this pace will strengthen Portugal's standing within the European bloc.","link":"https://www.portugalresident.com/pt/A-economia-portuguesa-desafia-a-turbul%C3%AAncia-e-o-crescimento-de-2%25-est%C3%A1-ao-seu-alcance./","categoria":"ECONOMY","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Discover the Initiatives Marking the 30th Anniversary of 'Ciência Viva'","resumo":"The national agency 'Ciência Viva' is celebrating three decades of dedication to promoting and disseminating scientific and technological culture in Portugal. To mark the occasion, a special lineup brings together interactive exhibitions, hands-on workshops, and open debates across various Ciência Viva Centers nationwide. The project has played a fundamental role in sparking interest in science and innovation careers among new generations. This celebration reinforces the institution's commitment to the democratization of scientific knowledge.","link":"https://www.cmjornal.pt/cmtv/programas/informacao/falar-global/detalhe/conheca-as-iniciativas-que-marcam-os-30-anos-da-ciencia-viva","categoria":"SCIENCE","lang":"en"},{"fonte":"noticiasdecoimbra.pt","pais":"Portugal","titulo":"Coimbra Develops Technology to Combat Cyberattacks and Disinformation","resumo":"Researchers in Coimbra have developed an innovative technological solution focused on neutralizing cyber threats and detecting fake news. The tool utilizes advanced algorithms to identify suspicious patterns and mitigate attacks on public and private networks in real time. The initiative emerges as a strategic response to the global rise in digital security incidents and information manipulation. The project strengthens Portugal's position in Europe's digital defense and security ecosystem.","link":"https://www.noticiasdecoimbra.pt/coimbra-cria-tecnologia-para-travar-ciberataques-e-desinformacao/","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"Câmara Municipal de Cascais","pais":"Portugal","titulo":"Science at the Service of the Sea: Initiatives Boost Ocean Sustainability","resumo":"New scientific projects in Portugal are directing resources and cutting-edge technology toward the preservation and study of marine ecosystems. The research aims to map oceanic biodiversity, monitor the impacts of climate change, and promote a sustainable blue economy. Cooperation among universities, research centers, and coastal communities has been vital for the practical application of these findings. The strategy reaffirms the country's Atlantic relevance in the realm of environmental protection and maritime innovation.","link":"https://www.cascais.pt/galeria-de-imagens/ciencia-ao-servico-do-mar","categoria":"SCIENCE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
