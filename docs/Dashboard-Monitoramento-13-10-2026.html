e-in-deutschland-besteuern-100.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"宗像経済新聞","pais":"Japão","titulo":"Exposição de tecnologias avançadas, abertura do CEATEC","resumo":"A feira de tecnologia CEATEC foi oficialmente aberta, destacando inovações voltadas para o futuro da sociedade. O evento reúne empresas e pesquisadores para apresentar avanços disruptivos em diversas áreas. A expectativa é atrair um grande público interessado nas tendências tecnológicas globais.","link":"https://munakata.keizai.biz/gpnews/1773414/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"TradingKey","pais":"China","titulo":"CXMT avança na tecnologia 4F²: qual é o tamanho da sua ameaça de mercado para Samsung, SK Hynix e Kioxia?","resumo":"A fabricante chinesa CXMT está avançando significativamente no desenvolvimento da tecnologia de memória 4F². Este progresso técnico desafia diretamente líderes globais do setor, como Samsung, SK Hynix e Kioxia. O movimento acirra a concorrência no mercado de semicondutores e demonstra a crescente autonomia tecnológica da China.","link":"https://www.tradingkey.com/es/analysis/stocks/us-stocks/262213155-cxmt-4f2-dram-threat-samsung-sk-hynix-kioxia-tradingkey","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Manufacturing Today India","pais":"Índia","titulo":"Tecnologia embarcada: A inteligência por trás dos eletrônicos e as carreiras do amanhã","resumo":"A evolução da tecnologia embarcada está transformando a indústria eletrônica moderna e definindo novas demandas para o mercado de trabalho. O artigo discute como sistemas inteligentes moldam o futuro profissional e exigem novas competências técnicas. Trata-se de um panorama essencial para entender a direção da inovação e o desenvolvimento de carreiras tecnológicas.","link":"https://www.manufacturingtodayindia.com/embedded-technology-transformation","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"HealthNews","pais":"Portugal","titulo":"Câncer digestivo: tecnologia só funciona se o paciente estiver aram a investigação criminal. O uso de inteligência artificial, análise de DNA e rastreamento de impressões digitais tornou-se indispensável para solucionar casos complexos. A entrevista revela os bastidores e o impacto dessas ferramentas inovadoras no trabalho policial.","link":"https://www.nicematin.com/societe/justice/adn-ia-empreintes-numeriques-comment-la-science-aide-les-enqueteurs-sur-un-crime-le-general-francois-daoust-passe-aux-aveux-10740019","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Wales 247","pais":"Inglaterra","titulo":"Empresa científica de Cardiff inicia busca pelos próximos jovens cientistas do País de Gales","resumo":"Uma importante organização de ciência sediada em Cardiff lançou uma iniciativa para descobrir talentos juvenis na região. O projeto busca incentivar o interesse pela pesquisa científica e inovação tecnológica entre estudantes. A ação visa preparar a próxima geração para os desafios globais do setor tecnológico.","link":"https://www.wales247.co.uk/cardiff-science-firm-launches-search-for-wales-next-young-scientists","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Infobae","pais":"Espanha","titulo":"O avanço matemático da IA empurra a ciência para um território novo e estranho","resumo":"A inteligência artificial alcançou patamares matemáticos complexos que estão transformando radicalmente a forma como cientistas realizam pesquisas e formulações teóricas. Esse progresso acelera descobertas em múltiplos campos acadêmicos, gerando debates profundos sobre os limites entre o raciocínio humano e o computacional. O impacto imediato é a criação de modelos preditivos altamente sofisticados que desafiam paradigmas vigentes.","link":"https://www.infobae.com/economist/2026/10/13/el-avance-matematico-de-la-ia-empuja-a-la-ciencia-hacia-un-territorio-nuevo-y-extrano/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Bild der Wissenschaft","pais":"Alemanha","titulo":"Rover de Marte 'Perseverance' quebra recorde de distância","resumo":"O veículo robótico da NASA superou sua marca anterior de percurso em solo marciano, estabelecendo um novo marco na exploração espacial. A conquista demonstra a durabilidade e a eficácia dos sistemas autônomos de navegação do rover. Os dados coletados continuam a fornecer informações cruciais sobre a geologia do planeta vermelho e a busca por sinais de vida.","link":"https://wissenschaft.de/artikel/marsrover-perseverance-knackt-entfernungsrekord","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ロボスタ","pais":"Japão","titulo":"NEDO exibe tecnologias de ponta, como robôs de IA e direção autônoma no CEATEC 2026","resumo":"A organização NEDO marca presença no CEATEC 2026 com demonstrações interativas de robótica avançada e veículos autônomos. As exibições visam mostrar o impacto prático dessas tecnologias na automação industrial e na mobilidade urbana. A iniciativa reforça o compromisso do Japão com a inovação de vanguarda.","link":"https://robotstart.info/article/2026/10/13/382511.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Bloomberg.com","pais":"China","titulo":"CXMT da China reivindica progresso revolucionário em tecnologia de memória, superando rivais coreanos","resumo":"A empresa chinesa CXMT anunciou avanços expressivos em suas tecnologias proprietárias de chips de memória. A conquista coloca a companhia à frente de concorrentes tradicionais da Coreia do Sul em marcos importantes de pesquisa. O feito reforça o dinamismo da indústria nacional de semicondutores frente às pressões externas.","link":"https://www.bloomberg.com/jp/news/articles/2026-10-13/TMTY8LKGIFPU00?srnd=jp-homepage","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Instagram","pais":"Índia","titulo":"Dixon Technologies da Índia firma parceria com a Gemtek Technology para impulsionar fabricação de telecomunicações","resumo":"A Dixon Technologies estabeleceu uma joint venture estratégica com a taiwanesa Gemtek Technology para fortalecer a produção de equipamentos de rede na Índia. A colaboração utiliza expertise em módulos ópticos de alta velocidade para expandir a capacidade industrial local. Essa aliança reflete o avanço do país como polo global de manufatura tecnológica avançada.","link":"https://www.instagram.com/p/DebHdUAjChw/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Correio do Minho","pais":"Portugal","titulo":"Viana do Castelo: Criação de três Centros de Tecnologia e Inovação representa investimento superior a 13,5 milhões","resumo":"A região de Viana do Castelo anuncia um robusto aporte financeiro para impulsionar a infraestrutura tecnológica local. O projeto prevê a implementação de três novos polos voltados à inovação, pesquisa e desenvolvimento industrial. A iniciativa visa dinamizar a economia regional, atrair talentos e consolidar Portugal como referência em polos tecnológicos avançados.","link":"https://www.correiodominho.pt/noticias/viana-do-castelo-criacao-de-tres-centros-de-tecnologia-e-inovacao-representa-investimento-superior-a-13-5-milhoes/171570","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"iPhone 18 Pro: veja como melhorar seus vídeos com controles de foco e luz","resumo":"Novas funções avançadas de captura de vídeo no iPhone 18 Pro permitem ajustes precisos de foco e iluminação em tempo real. Usuários podem explorar recursos profissionais diretamente pelo aplicativo de câmera nativo do smartphone. A tecnologia promete elevar o padrão de produções audiovisuais feitas por criadores de conteúdo móvel.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/10/13/iphone-18-pro-veja-como-melhorar-seus-videos-com-controles-de-foco-e-luz.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Popular Science","pais":"Estados Unidos","titulo":"Dentes humanos apontam quando o chumbo começou a envenenar cidade medieval","resumo":"Cientistas analisaram arcadas dentárias antigas para rastrear os níveis históricos de contaminação por chumbo. A descoberta revela detalhes cruciais sobre o impacto ambiental e industrial na saúde das populações medievais. O estudo demonstra a precisão de novas técnicas arqueológicas e científicas.","link":"https://www.popsci.com/science/teeth-lead-poisoning-medieval-england/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Vie publique","pais":"França","titulo":"O lugar da ciência na França: uma seleção de discursos desde 1980","resumo":"Uma compilação histórica reúne os discursos mais marcantes sobre o papel da ciência na sociedade francesa ao longo das últimas décadas. A iniciativa destaca a evolução das políticas públicas de incentivo à pesquisa e ao desenvolvimento tecnológico no país. O material serve como reflexão sobre a importância do conhecimento científico para o futuro nacional.","link":"https://www.vie-publique.fr/discours-dans-lactualite/304919-discours-publics-sur-le-theme-de-la-science-en-france-depuis-1980","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Al Jazeera","pais":"Inglaterra","titulo":"IA pode se autorreplicar em dispositivos domésticos dentro de 'meses', diz Anthropic","resumo":"Pesquisadores da Anthropic alertaram que avanços rápidos na inteligência artificial podem permitir a autorreplicação autônoma em aparelhos comuns. O fenômeno representa um marco preocupante para a segurança cibernética e o controle de sistemas inteligentes. Especialistas reforçam a urgência de regulamentações mais rígidas para conter riscos imprevistos.","link":"https://www.aljazeera.com/economy/2026/10/13/ai-could-self-replicate-on-home-devices-within-months-anthropic-says","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Sinc","pais":"Espanha","titulo":"O laboratório invisível: como a supercomputação está reescrevendo o método científico","resumo":"O uso intensivo de supercomputadores permite simular fenômenos complexos em escalas antes consideradas impossíveis pela experimentação física tradicional. Essa revolução digital acelera a validação de hipóteses científicas em áreas como física quântica, medicina e climatologia. Com isso, o método científico tradicional ganha uma camada virtual de alta precisão que redefine o futuro da inovação.","link":"https://www.agenciasinc.es/Reportajes/El-laboratorio-invisible-como-la-supercomputacion-esta-reescribiendo-el-metodo-cientifico","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Spektrum der Wissenschaft","pais":"Alemanha","titulo":"»A Física da Viagem Interestelar«: Matemática avançada – não apenas para astronautas","resumo":"Uma análise profunda sobre os conceitos matemáticos e físicos necessários para viabilizar futuras viagens entre sistemas estelares. O artigo explora como teorias complexas deixam de ser ficção científica e passam a ocupar o centro dos debates acadêmicos. A obra destaca a importância da educação científica rigorosa para a próxima geração de pesquisadores espaciais.","link":"https://www.spektrum.de/rezension/buchkritik-zu-the-physics-of-interstellar-travel/2349436","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Newscast.jp","pais":"Japão","titulo":"Cidade de Ebina, Sotetsu Bus e NTT Docomo Business firmam acordo para implementar direção autônoma","resumo":"Uma nova parceria estratégica foi estabelecida para promover a implementação prática de tecnologias de direção autônoma no transporte público. A colaboração une governança local e gigantes da tecnologia para resolver desafios de mobilidade. O projeto piloto promete transformar a eficiência dos serviços de ônibus na região.","link":"https://newscast.jp/smart/news/4025680","categoria":"MOBILIDADE","lang":"pt"},{"fonte":"经济参考报","pais":"China","titulo":"Advanced Micro-Fabrication Equipment estreia na Expo Industrial de Xangai 2026 e equipamento de corrosão vence prêmio CIIF","resumo":"A empresa apresentou suas mais recentes inovações na Feira Internacional da Indústria de Xangai deste ano. Seu equipamento avançado de corrosão se destacou e conquistou o prestigioso prêmio CIIF. A premiação evidencia a alta competitividade e o desenvolvimento acelerado de maquinário pesado para chips na China.","link":"http://jjckb.xinhuanet.com/20261013/b89d9922e70945cf9e93d8184602c3d5/c.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Manufacturing Today India","pais":"Índia","titulo":"IITMAA Sangam 2026 destaca prioridades de tecnologia e inovação na Índia","resumo":"O evento IITMAA Sangam reuniu líderes e especialistas para debater os rumos da inovação e da tecnologia no cenário indiano. Foram abordadas prioridades estratégicas para consolidar o ecossistema digital e científico do país nos próximos anos. As discussões reforçam o compromisso institucional com o desenvolvimento tecnológico sustentável e inclusivo.","link":"https://www.manufacturingtodayindia.com/iitmaa-sangam-2026-technology","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"FMI alerta para riscos da IA e dívidas soberanas elevadas à estabilidade financeira","resumo":"O Fundo Monetário Internacional emitiu um importante alerta sobre os potenciais impactos desestabilizadores da inteligência artificial nos mercados globais. Além da tecnologia, o organismo destacou o perigo representado pelo alto endividamento de diversas nações. O cenário exige cautela regulatória para evitar crises sistêmicas decorrentes da rápida transformação digital e econômica.","link":"https://jornaleconomico.sapo.pt/noticias/fmi-alerta-para-riscos-da-ia-e-dividas-soberanas-elevadas-a-estabilidade-financeira/","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Correio Braziliense","pais":"Brasil","titulo":"FAB usa tecnologia aérea para combater incêndios no Amazonas","resumo":"A Força Aérea Brasileira empregou recursos tecnológicos avançados de monitoramento para combater focos de incêndio na região amazônica. O uso de aeronaves equipadas com sistemas de mapeamento térmico otimizou o direcionamento das equipes de resgate. A ação demonstra a importância da inovação no suporte a emergências ambientais críticas.","link":"https://www.correiobraziliense.com.br/brasil/2026/10/7519385-fab-usa-tecnologia-aerea-para-combater-incendios-no-amazonas.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"Perseverance da NASA estabelece recorde extraterrestre de distância total percorrida","resumo":"O rover Perseverance alcançou uma marca histórica em sua jornada exploratória pela superfície de Marte. A conquista representa um marco impressionante para a engenharia espacial e a autonomia robótica. Os dados coletados continuam a expandir nosso conhecimento sobre o planeta vermelho.","link":"https://science.nasa.gov/blogs/perseverance-mars-rover/2026/10/12/nasas-perseverance-sets-off-world-record-for-total-distance-driven/","categoria":"EXPLORAÇÃO ESPACIAL","lang":"pt"},{"fonte":"Zonebourse Suisse","pais":"França","titulo":"Uma correção no mercado de IA afetaria a economia real, avalia autoridade do FMI","resumo":"Representantes do Fundo Monetário Internacional alertam que uma eventual desvalorização no setor de inteligência artificial pode gerar repercussões na economia global. O rápido crescimento das empresas tecnológicas levanta preocupações sobre possíveis bolhas financeiras e seus efeitos colaterais. O monitoramento rigoroso dessas tendências é vital para prevenir crises sistêmicas.","link":"https://ch.zonebourse.com/actualite-bourse/une-correction-du-marche-de-la-ia-toucherait-la-economie-reelle-estime-un-responsable-du-fmi-ce785dddda8df723","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Times","pais":"Inglaterra","titulo":"FMI: Gastos em IA impulsionados por dívida colocam economia global em risco","resumo":"O Fundo Monetário Internacional emitiu um alerta sobre o financiamento agressivo de tecnologias de inteligência artificial baseado em endividamento. O cenário pode gerar bolhas financeiras e desestabilizar mercados internacionais caso o retorno sobre o investimento demore. Analistas pedem cautela e maior supervisão regulatória sobre essas inovações.","link":"https://www.thetimes.com/business/economics/article/circular-deals-ai-debt-threaten-world-economy-imf-q8nz5lrbg","categoria":"ECONOMIA","lang":"pt"},{"fonte":"EL PAÍS","pais":"Espanha","titulo":"Este pequeno dispositivo mostra em tempo real quanto consome cada eletrodoméstico","resumo":"Um novo aparelho inovador foi lançado no mercado para monitorar o consumo energético individual de cada eletrodoméstico na residência em tempo real. A tecnologia visa empoderar os consumidores na gestão eficiente da eletricidade, resultando em contas de luz menores e maior sustentabilidade. O impacto ambiental e econômico é direto, facilitando a transição para hábitos de consumo mais conscientes nos lares.","link":"https://elpais.com/escaparate/tecnologia/enchufe-inteligente-tapo.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Suspeita de espionagem no espaço: Satélite chinês se aproxima de satélite britânico","resumo":"Movimentos atípicos de um satélite chinês geraram alertas de segurança ao se aproximar perigosamente de um equipamento orbital britânico. O incidente acende o debate geopolítico sobre a segurança nacional e a militarização gradual do espaço sideral. Autoridades espaciais monitoram de perto a situação para evitar colisões e potenciais atos de espionagem tecnológica.","link":"https://www.sueddeutsche.de/politik/china-grossbritannien-spionage-weltraum-satellit-bundeswehr-li.3561222","categoria":"TRENDING","lang":"pt"},{"fonte":"共同通信PRワイヤー","pais":"Japão","titulo":"Lançamento em novembro de 2026 do congelador portátil ultrabaixo 'SC-UF25' com tecnologia FPSC","resumo":"O novo equipamento de refrigeração portátil utiliza a avançada tecnologia FPSC para atingir temperaturas ultrabaixas com alta eficiência energética. O lançamento atende a demandas críticas de transporte de materiais sensíveis na área médica e científica. O produto estará disponível no mercado japonês a partir de meados de novembro.","link":"https://kyodonewsprwire.jp/release/202610067436","categoria":"LANÇAMENTO","lang":"pt"},{"fonte":"Levante-EMV","pais":"China","titulo":"Um campus de 77 hectares e a tecnologia mais recente na China para formar os cientistas do futuro","resumo":"Um novo complexo educacional de grande escala foi inaugurado na China com foco total em infraestrutura científica de ponta. O espaço foi projetado para capacitar talentos de alto nível em áreas estratégicas da tecnologia avançada. A iniciativa faz parte dos esforços de longo prazo do país para liderar a inovação global.","link":"https://www.levante-emv.com/comunitat-valenciana/2026/10/13/campus-77-hectareas-ultima-tecnologia-134852320.amp.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Economic Times","pais":"Índia","titulo":"'Poder para empoderar': Modi enfatiza alcance social mais amplo da tecnologia no Fórum Bloomberg New Economy","resumo":"Durante o Bloomberg New Economy Forum, o primeiro-ministro Narendra Modi destacou o papel fundamental da tecnologia na transformação social. Ele enfatizou que a inovação deve servir como ferramenta de empoderamento para as camadas mais amplas da população. O discurso ressalta a visão governamental de unir crescimento digital e inclusão socioeconômica.","link":"https://m.economictimes.com/news/videos/live-india-is-mother-of-democracy-pm-modi-at-bloomberg-new-economy-forum/videoshow/134909049.cms","categoria":"POLÍTICA","lang":"pt"},{"fonte":"Público","pais":"Portugal","titulo":"Corte de 10% nas verbas para a ciência na nova proposta de orçamento europeu","resumo":"A nova proposta orçamentária da União Europeia contempla uma redução significativa nos recursos destinados ao fomento científico. A medida gerou preocupação entre pesquisadores e líderes acadêmicos, que temem uma desaceleração no desenvolvimento de inovações. A perda de financiamento pode comprometer a competitividade do bloco em setores estratégicos de tecnologia e pesquisa.","link":"https://www.publico.pt/2026/10/12/ciencia/noticia/corte-10-verbas-ciencia-nova-proposta-orcamento-europeu-2191052","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"GWM Haval H7 chega ao Brasil com motor híbrido flex e tração nas quatro rodas","resumo":"O GWM Haval H7 desembarca no Brasil trazendo inovação com sua motorização híbrida flex e tração integral. O veículo foi adaptado para atender às demandas do consumidor brasileiro por sustentabilidade e alto desempenho. O lançamento consolida a expansão de tecnologias eletrificadas no mercado nacional.","link":"https://www1.folha.uol.com.br/mercado/2026/10/gwm-haval-h7-chega-ao-brasil-como-motor-hibrido-flex-e-tracao-nas-quatro-rodas.shtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Fortune","pais":"Estados Unidos","titulo":"Exclusivo: Presidente científico em saída da Microsoft planeja se juntar à equipe da Mercedes na F1 como consultor de IA","resumo":"Um alto executivo de ciência da Microsoft está de mudança para o esporte a motor de elite. Ele atuará como consultor de inteligência artificial na equipe Mercedes de Fórmula 1. A contratação sinaliza a crescente integração de tecnologias avançadas de IA no esporte.","link":"https://fortune.com/2026/10/12/microsoft-peter-lee-departing-science-president-plans-to-join-mercedes-f1-team-as-ai-advisor/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"BFM","pais":"França","titulo":"A Noite da Ciência no INSA Lyon","resumo":"A instituição INSA Lyon promoveu mais uma edição da Noite da Ciência para aproximar o público geral do universo acadêmico e tecnológico. O evento contou com workshops interativos, palestras e demonstrações práticas de inovações desenvolvidas por pesquisadores. A iniciativa visa despertar o interesse das novas gerações pelas carreiras científicas.","link":"https://www.bfmtv.com/lyon/replay-emissions/bfm-lyon-chez-vous/video-la-nuit-de-la-science-a-l-insa-lyon_VN-202610121002.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Sky News","pais":"Inglaterra","titulo":"Economia do Reino Unido deve crescer mais que o esperado, mas famílias enfrentarão inflação maior, diz FMI","resumo":"Projeções recentes indicam uma melhora no crescimento econômico britânico para o próximo período fiscal. No entanto, o FMI alerta que o custo de vida continuará pressionado por uma inflação mais acentuada. O impacto direto recairá sobre as famílias, que precisarão lidar com o encarecimento de produtos e serviços essenciais.","link":"https://news.sky.com/story/uk-economy-to-grow-more-than-expected-but-households-face-sharper-rise-in-inflation-imf-says-13598675","categoria":"ECONOMIA","lang":"pt"},{"fonte":"elDiario.es","pais":"Espanha","titulo":"O automóvel europeu retalia contra a China com elétricos carregados de design, tecnologia e nostalgia","resumo":"As montadoras europeias decidiram contra-atacar o avanço agressivo dos veículos elétricos chineses apostando em linhas clássicas combinadas com tecnologia de ponta. Essa estratégia busca conquistar consumidores nostálgicos que valorizam tanto a estética tradicional quanto a conectividade moderna. O movimento promete agitar o mercado automotivo global e redefinir a competitividade do setor na Europa.","link":"https://www.eldiario.es/motor/sector_y_mercado/automovil-europeo-contraataca-china-electricos-cargados-diseno-tecnologia-nostalgia_1_13580399.html","categoria":"MERCADO","lang":"pt"},{"fonte":"Bild der Wissenschaft","pais":"Alemanha","titulo":"Arqueólogos encontram a âncora mais antiga do mundo","resumo":"Pesquisadores descobriram um artefato náutico histórico que redefine o conhecimento sobre as antigas rotas marítimas e técnicas de navegação. A peça milenar foi localizada em condições excepcionais de preservação, permitindo análises detalhadas da metalurgia da época. A descoberta oferece novas perspectivas sobre o comércio e a exploração humana nos oceanos ancestrais.","link":"https://wissenschaft.de/artikel/archaeologen-finden-den-aeltesten-anker-der-welt","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Impress Watch","pais":"Japão   const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
