  const data = [{"fonte":"Embrapa","pais":"Brasil","titulo":"Pesquisadora da Embrapa vence o 8º Prêmio CBMM de Ciência e Tecnologia","resumo":"A pesquisadora Christiane Paiva, da Embrapa, venceu o 8º Prêmio CBMM de Ciência e Tecnologia.\nA premiação reconhece suas contribuições para o avanço do setor agropecuário brasileiro.\nO resultado destaca a importância da pesquisa pública na busca por inovações sustentáveis.\nA conquista reforça o papel da ciência nacional no desenvolvimento tecnológico do país.","link":"https://www.embrapa.br/web/semiarido/busca-de-noticias/-/noticia/149283862/pesquisadora-christiane-paiva-da-embrapa-vence-8-premio-cbmm-de-ciencia-e-tecnologia","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Al Jazeera","pais":"Estados Unidos","titulo":"IA faz descobertas em matemática, ciência da computação e física, diz OpenAI","resumo":"A OpenAI anunciou que seus modelos de inteligência artificial alcançaram descobertas científicas inéditas em áreas como matemática, física e computação.\nA conquista marca um avanço significativo no uso de algoritmos avançados como parceiros ativos no desenvolvimento científico e na resolução de problemas complexos.\nO resultado reforça o potencial dessas tecnologias para acelerar a pesquisa acadêmica e impulsionar a inovação global nos próximos anos.","link":"https://www.aljazeera.com/economy/2026/10/27/ai-makes-discoveries-in-mathematics-computer-science-physics-openai-says","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Zonebourse Suisse","pais":"França","titulo":"Siemens Energy faz parceria com empresas japonesas para desenvolver tecnologia de energia de fusão","resumo":"A Siemens Energy anunciou uma cooperação estratégica com empresas japonesas para acelerar o desenvolvimento da tecnologia de fusão nuclear.\nA iniciativa busca viabilizar a fusão como uma fonte comercial de energia limpa, segura e inesgotável no futuro.\nEsta aliança internacional fortalece o avanço científico no setor energético e impulsiona investimentos de alta tecnologia globalmente.","link":"https://ch.zonebourse.com/actualite-bourse/siemens-energy-sa-associe-a-des-entreprises-japonaises-pour-developper-la-technologie-de-la-energi-ce785cdcd08ff620","categoria":"ENERGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Australianos devem se preparar para interrupções em serviços online com o aumento de ameaças, alerta agência de cibernética","resumo":"A agência de segurança cibernética da Austrália alertou a população e empresas para se prepararem para interrupções inesperadas em serviços virtuais essenciais.\nO aviso decorre do aumento exponencial de ameaças digitais e ataques direcionados a infraestruturas críticas do país.\nEspecialistas destacam a necessidade urgente de reforçar a resiliência operacional e adotar planos de contingência para mitigar impactos de potenciais apagões digitais.","link":"https://www.theguardian.com/technology/2026/oct/26/australians-should-prepare-for-online-services-to-go-down-unexpectedly-as-threats-rise-cyber-agency-warns","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"Negocios.com","pais":"Espanha","titulo":"OpenAI sacode a ciência com 3 descobertas que pareciam impossíveis","resumo":"A OpenAI apresentou avanços científicos relevantes que utilizam modelos de inteligência artificial para resolver problemas complexos na ciência. A iniciativa demonstra como algoritmos avançados podem acelerar pesquisas em áreas onde o progresso tradicional era considerado inviável. Esse marco reforça o papel da IA não apenas como ferramenta produtiva, mas como motor essencial de inovação e descobertas fundamentais.","link":"https://www.negocios.com/tecnologia/openai-sacude-ciencia-3-descubrimientos-que-parecian-imposibles/20261027063137496609.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Anthropic publica prospecto para oferta pública de ações","resumo":"A startup de inteligência artificial Anthropic deu um passo decisivo em sua trajetória ao publicar seu prospecto de mercado.\nA iniciativa sinaliza a consolidação do setor de IA generativa e a busca por novos aportes institucionais de capital.\nO movimento atrai o interesse de investidores mundiais ao posicionar a empresa como uma das principais concorrentes da OpenAI.","link":"https://www.sueddeutsche.de/wirtschaft/ki-kuenstliche-intelligenz-anthropic-dario-amodei-elon-musk-claude-boerse-li.3569461","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"OPTRONICS ONLINE","pais":"Japão","titulo":"Universidade de Ciência de Tóquio e parceiros demonstram operação de 200 Gb/s para fusão optoeletrônica","resumo":"Pesquisadores da Universidade de Ciência de Tóquio alcançaram um marco importante ao demonstrar a operação de moduladores ópticos de silício a 200 Gb/s. Essa tecnologia é crucial para o avanço da fusão optoeletrônica, visando redes de comunicação e processamento de dados mais rápidas e eficientes energeticamente no futuro.","link":"https://optronics-media.com/news/20261027/113500/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"LOGISTICS TODAY","pais":"China","titulo":"Feira de automação em Xangai reúne robôs de logística e tecnologia de IA","resumo":"Uma nova feira de automação realizada em Xangai reuniu robôs logísticos avançados e inovações em inteligência artificial. O evento destaca o avanço acelerado da manufatura inteligente no país e o papel central da robótica na cadeia de suprimentos moderna. A exposição atrai empresas globais e reforça a transição industrial da China para centros tecnológicos altamente automatizados.","link":"https://www.logi-today.com/1015196","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"India Today","pais":"Índia","titulo":"OpenAI afirma que a IA fez três grandes avanços em matemática, física e ciência da computação","resumo":"A OpenAI anunciou recentemente a realização de três avanços científicos expressivos impulsionados por inteligência artificial nas áreas de matemática, física e ciência da computação. O marco sinaliza uma evolução drástica na capacidade dos modelos de raciocinar sobre problemas complexos. Essa conquista promete acelerar pesquisas acadêmicas e o desenvolvimento de novas tecnologias aplicadas globalmente.","link":"https://www.indiatoday.in/technology/news/story/openai-says-ai-has-made-three-major-breakthroughs-in-maths-physics-and-computer-science-3025838-2026-10-27","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Software português Vivin vence prêmio de \"Tecnologia do Ano\" nos Coliving Awards em Londres","resumo":"O software português Vivin foi consagrado com o prêmio de Tecnologia do Ano na prestigiada premiação Coliving Awards, realizada em Londres. A inovação destaca-se pela otimização e gestão eficiente de espaços de moradia compartilhada, reforçando o talento tecnológico de Portugal no cenário internacional. O reconhecimento consolida o avanço de soluções nacionais voltadas para o mercado imobiliário global.","link":"https://jornaleconomico.sapo.pt/noticias/software-portugues-vivin-vence-premio-de-tecnologia-do-ano-nos-coliving-awards-em-londres/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Alô Alô Bahia","pais":"Brasil","titulo":"Brasileiro conquista prêmio internacional por divulgação científica nas redes sociais","resumo":"Um divulgador científico brasileiro recebeu um prêmio internacional por seu trabalho nas redes sociais.\nA iniciativa se destacou pela capacidade de simplificar temas complexos e combater a desinformação.\nO reconhecimento internacional consolida novas formas de comunicação pública da ciência.\nO projeto serve como modelo de engajamento para aproximar a população do conhecimento científico.","link":"https://aloalobahia.com/noticias/2026/10/27/brasileiro-faz-historia-ao-conquistar-premio-internacional-por-divulgar-ciencia-nas-redes-sociais/","categoria":"COMUNICAÇÃO","lang":"pt"},{"fonte":"EurekAlert!","pais":"Estados Unidos","titulo":"Nova tecnologia oferece visualização 3D interativa de órgãos durante cirurgias","resumo":"Uma nova tecnologia baseada em conceitos de realidade aumentada promete transformar o ambiente e a dinâmica das salas de cirurgia.\nO sistema fornece aos médicos uma visão tridimensional e interativa dos órgãos do paciente em tempo real durante os procedimentos.\nA inovação busca aumentar a precisão dos cirurgiões, diminuir riscos operacionais e acelerar os processos de recuperação pós-operatória.","link":"https://www.eurekalert.org/news-releases/1149299","categoria":"TECNOLOGIA MÉDICA","lang":"pt"},{"fonte":"Le Berry Républicain","pais":"França","titulo":"\"Na vanguarda da tecnologia\": Alemães visitam a estação para veículos pesados mais potente da França, em Vierzon","resumo":"Uma comitiva da Alemanha viajou até Vierzon para inspecionar de perto a infraestrutura de recarga de altíssima potência voltada para caminhões pesados.\nO projeto francês é considerado uma referência europeia na transição energética do setor de transporte e logística.\nA iniciativa destaca como a tecnologia de recarga ultra-rápida está moldando o futuro do transporte de carga descarbonizado.","link":"https://www.leberry.fr/vierzon-18100/economie/a-la-pointe-de-la-technologie-ils-viennent-d-allemagne-pour-decouvrir-la-station-poids-lourds-la-plus-puissante-de-france-a-vierzon_15069943/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"'Ambiente digital hostil': IA está sendo integrada secretamente no Ministério do Interior do Reino Unido, aponta relatório","resumo":"Um novo relatório revela que sistemas de inteligência artificial estão sendo implementados de forma secreta em diversos departamentos do Ministério do Interior britânico.\nCríticos alertam que o uso opaco dessas tecnologias pode automatizar decisões de imigração e vigilância, criando um ambiente digital desfavorável e tendencioso.\nA falta de transparência levanta sérias preocupações sobre viés algorítmico, direitos humanos e a ausência de supervisão pública adequada.","link":"https://www.theguardian.com/politics/2026/oct/27/digital-hostile-environment-ai-secretly-embedded-home-office-report","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"MarketScreener España","pais":"Espanha","titulo":"Siemens Energy fará parceria com empresas japonesas para desenvolver tecnologia de energia de fusão","resumo":"A Siemens Energy anunciou uma colaboração estratégica com parceiros do Japão para acelerar o desenvolvimento comercial da energia de fusão nuclear. O projeto busca criar soluções tecnológicas de alta precisão capazes de viabilizar uma fonte de energia limpa, segura e praticamente ilimitada. A iniciativa representa um passo crucial para a transição energética global e a redução das emissões de carbono.","link":"https://es.marketscreener.com/noticias/siemens-energy-se-asociar-con-empresas-japonesas-para-desarrollar-tecnolog-a-de-energ-a-de-fusi-n-ce785cdcd08ff620","categoria":"ENERGIA LIMPA","lang":"pt"},{"fonte":"Rhein-Neckar-Zeitung","pais":"Alemanha","titulo":"Heidelberg Materials: A fábrica de cimento verde ainda pode ser salva?","resumo":"A gigante industrial Heidelberg Materials enfrenta grandes desafios técnicos e econômicos para viabilizar sua inovadora fábrica de cimento ecológico.\nO projeto busca reduzir radicalmente as emissões de carbono na produção de um dos materiais mais poluentes da construção civil.\nAs incertezas sobre a continuidade das operações destacam a complexidade da transição industrial rumo a tecnologias limpas e sustentáveis.","link":"https://www.rnz.de/politik/wirtschaft-regional_artikel,-Heidelberg-Materials-Ist-das-gruene-Zementwerk-noch-zu-retten-_arid,2466004.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ジェトロ（日本貿易振興機構）","pais":"Japão","titulo":"Fórum de Cooperação de Semicondutores Japão-EUA destaca parcerias e desenvolvimento conjunto","resumo":"O fórum bilateral reuniu líderes industriais para debater estratégias e apresentar casos de sucesso em parcerias tecnológicas e desenvolvimento conjunto de chips. A iniciativa reforça os laços geopolíticos e comerciais entre as duas nações na cadeia global de semicondutores.","link":"https://www.jetro.go.jp/biznews/2026/10/b60ce34581b46a9f.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"中青在线","pais":"China","titulo":"Mídia global foca na transição da China de 'fábrica mundial' para polo de exportação de tecnologia","resumo":"Veículos de imprensa internacionais destacam a transformação econômica da China, que deixa de ser apenas a fábrica do mundo para se consolidar como exportadora de tecnologia e capacidade. Esse movimento reflete o fortalecimento da inovação interna, P\u0026D avançado e propriedade intelectual nacional. O impacto global redefine as cadeias de suprimento e a liderança em mercados de alta tecnologia.","link":"http://m.cyol.com/gb/keji/articles/2026-10/27/content_R4noQ2ToOx.html","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Pharmabiz.com","pais":"Índia","titulo":"Mulk Technology lança plataforma de saúde digital impulsionada por IA para a Índia e mercados globais","resumo":"A Mulk Technology apresentou uma nova plataforma de saúde digital alimentada por inteligência artificial, voltada tanto para o mercado indiano quanto para o cenário internacional. A ferramenta visa otimizar diagnósticos, ampliar o acesso a serviços médicos remotos e melhorar a eficiência operacional de clínicas. Com essa iniciativa, a empresa busca consolidar sua presença no setor de saúde tecnológica.","link":"https://www.pharmabiz.com/NewsDetails.aspx?aid=191519\u0026sid=2","categoria":"SAÚDE","lang":"pt"},{"fonte":"Executive Digest","pais":"Portugal","titulo":"Estudo revela que inteligência artificial sugere música para meninas e esporte para meninos diante da mesma pergunta","resumo":"Uma nova pesquisa científica analisou o comportamento de ferramentas de inteligência artificial e identificou viés de gênero em suas respostas automatizadas. O estudo aponta que, perfeitamente sob o mesmo questionamento, os algoritmos tendem a sugerir caminhos estereotipados, direcionando meninas para a música e meninos para o esporte. A descoberta acende um alerta importante sobre a perpetuação de preconceitos culturais através de tecnologias emergentes.","link":"https://executivedigest.sapo.pt/ia-sugere-musica-para-raparigas-e-desporto-para-rapazes-perante-mesma-questao-estudo/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Diário da Serra","pais":"Brasil","titulo":"Estudantes da ETEC de Tangará vencem Mostra de Ciência com tubete biodegradável","resumo":"Estudantes da ETEC de Tangará venceram a Mostra Estadual de Ciência com um tubete biodegradável.\nA solução ecológica substitui os recipientes de plástico tradicionalmente usados no cultivo de mudas.\nO projeto reduz o impacto ambiental e promove o desenvolvimento da sustentabilidade no campo.\nA inovação demonstra a força da educação pública na criação de tecnologias ecológicas.","link":"https://diariodaserra.com.br/noticia/estudantes-da-etec-de-tangara-vencem-mostra-estadual-de-ciencia-com","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Breaking News, Latest News and Videos","pais":"Estados Unidos","titulo":"Trump afirma que líderes de IA assinaram 'constituição' para autorregulamentação","resumo":"Donald Trump declarou que os principais líderes da indústria de inteligência artificial assinaram uma 'constituição' de autorregulamentação do setor.\nA iniciativa busca estabelecer diretrizes éticas e limites operacionais voluntários definidos pelas próprias empresas de tecnologia.\nO movimento reflete o intenso debate global sobre governança, segurança e o papel do Estado frente ao avanço acelerado da IA.","link":"https://abcnews.com/Politics/top-ai-leaders-meet-trump-white-house-amid/story?id=136832988","categoria":"REGULAMENTAÇÃO","lang":"pt"},{"fonte":"tv5monde","pais":"França","titulo":"Wall Street fecha em alta com a recuperação do setor de inteligência artificial","resumo":"Os principais índices de Wall Street fecharam no campo positivo, impulsionados pela forte recuperação das ações de empresas ligadas à inteligência artificial.\nO otimismo dos investidores retornou após dados demonstrarem demanda contínua por infraestrutura e soluções de IA no mercado global.\nO movimento consolida a tecnologia como o principal motor do crescimento econômico e das valorizações nas bolsas globais.","link":"https://information.tv5monde.com/economie/wall-street-cloture-en-hausse-lia-reprend-des-couleurs-2843265","categoria":"MERCADO","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Parte da Antártida é batizada em homenagem a ex-correspondente de ciência da BBC","resumo":"Uma região da Antártida foi oficialmente nomeada em homenagem a um ex-correspondente de ciência da BBC, reconhecendo sua extensa cobertura sobre o meio ambiente.\nA homenagem destaca décadas de dedicação em aproximar pesquisas polares e transformações climáticas do público global.\nO anúncio reforça o papel crucial da comunicação científica na conscientização sobre a preservação de ecossistemas vulneráveis do planeta.","link":"https://www.bbc.co.uk/news/articles/ckvg7w919x09o","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"elDiario.es","pais":"Espanha","titulo":"'Smart City Expo': tecnologia urbana aborda desafios da emergência climática e da crise de moradia","resumo":"A nova edição da Smart City Expo reúne especialistas e empresas globais para debater a modernização das metrópoles diante de crises sociais e ambientais. O evento destaca soluções tecnológicas para gestão energética, otimização do espaço urbano e infraestrutura sustentável. Com o aumento do impacto climático, a adoção de tecnologias urbanas torna-se indispensável para garantir a resiliência das cidades.","link":"https://www.eldiario.es/edcreativo/smart-city-expo-tecnologia-urbana-aborda-retos-emergencia-climatica-global-crisis-vivienda_1_13616440.html","categoria":"CIDADES INTELIGENTES","lang":"pt"},{"fonte":"WEB.DE","pais":"Alemanha","titulo":"Derrota eleitoral: Bolsonaro sofre proibição de deixar o país","resumo":"Após desdobramentos políticos decorrentes do período pós-eleitoral, o ex-presidente Jair Bolsonaro foi proibido de deixar o Brasil por determinação judicial.\nA medida reflete o avanço das investigações sobre eventos recentes na política brasileira e atrai intensa atenção internacional.\nO impacto diplomático e político dessa restrição repercute fortemente na imprensa e nos círculos governamentais globais.","link":"https://web.de/magazine/politik/videos/wahlpleite-bolsonaro-kassiert-ausreiseverbot-42879324","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Exposição em Tóquio destaca a co-criação entre impressão 3D e tecnologias de pintura avançadas","resumo":"Um evento inovador em Roppongi, Tóquio, apresenta a fusão criativa entre a fabricação aditiva por impressão 3D e técnicas modernas de acabamento e pintura. A demonstração aponta novas direções para o design industrial, personalização em massa e eficiência na produção de peças complexas.","link":"https://news.yahoo.co.jp/articles/8dc46136fcd14a6d555f49516d8267871d30b75b","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"21财经","pais":"China","titulo":"Fórum Científico da Grande Baía 2026 será realizado neste fim de semana com palestra magna de novo Nobel","resumo":"O Fórum Científico da Grande Baía 2026 ocorrerá neste final de semana, contando com a presença confirmada de um laureado recente com o Prêmio Nobel. O evento visa debater cooperação científica internacional, novas fronteiras da ciência e o desenvolvimento regional em inovação. A expectativa é atrair investimentos expressivos e fomentar parcerias acadêmicas globais de alto impacto.","link":"https://www.21jingji.com/article/20261027/herald/d7fd06efe227c65549bc7a7b09cc2227.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Hindustan Times","pais":"Índia","titulo":"IIT Mandi lança 'Ciência sobre Rodas' para levar educação científica prática a escolas em Himachal Pradesh","resumo":"O Instituto Indiano de Tecnologia (IIT) de Mandi lançou a iniciativa 'Ciência sobre Rodas' para promover o aprendizado prático de ciências em escolas de Himachal Pradesh. O projeto itinerante utiliza laboratórios móveis para despertar o interesse de crianças e jovens pelas áreas STEM. A ação busca democratizar o acesso ao conhecimento científico de qualidade em regiões afastadas.","link":"https://www.hindustantimes.com/education/news/iit-mandi-launches-science-on-wheels-to-bring-hands-on-science-education-to-schools-across-hp-101793074918751.html","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"Jornal de Notícias","pais":"Portugal","titulo":"LG Mini RGB Evo AI: Será uma boa alternativa ao OLED?","resumo":"A LG apresenta o novo Mini RGB Evo AI, gerando debates intensos no mercado de eletrônicos sobre a sua capacidade de competir diretamente com as telas OLED. Equipado com recursos avançados de inteligência artificial, o dispositivo promete entregar cores mais vivas e maior eficiência energética. Analistas avaliam se esta tecnologia representa uma evolução significativa ou apenas uma alternativa intermediária.","link":"https://www.jn.pt/jn-direto/artigo/lg-mini-rgb-evo-ai-a-primeira-lg-com-a-tecnologia-mini-rgb/18141333","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"IFSP Sorocaba realiza Semana de Ciência e Tecnologia focada na presença feminina","resumo":"O IFSP Sorocaba promoveu a Semana de Ciência e Tecnologia voltada ao protagonismo feminino.\nO evento reuniu palestras e apresentações focadas na inclusão de mulheres nas áreas de exatas.\nA iniciativa busca incentivar novas gerações de pesquisadoras e reduzir a disparidade de gênero.\nA ação destaca a importância de espaços inclusivos no meio acadêmico e tecnológico.","link":"https://g1.globo.com/sp/sorocaba-jundiai/noticia/2026/10/26/ifsp-sorocaba-realiza-semana-de-ciencia-e-tecnologia-com-foco-no-protagonismo-feminino.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The University of Texas at Arlington","pais":"Estados Unidos","titulo":"UTA utiliza inteligência artificial para descobrir causas de doenças oculares","resumo":"Pesquisadores da Universidade do Texas em Arlington estão empregando inteligência artificial para mapear os fatores que desencadeiam graves doenças oculares.\nA tecnologia analisa grandes volumes de dados biológicos para identificar padrões genéticos e moleculares previamente imperceptíveis.\nA descoberta abre portas para o desenvolvimento de tratamentos preventivos mais eficazes, capazes de conter a perda de visão em pacientes.","link":"https://www.uta.edu/academics/schools-colleges/science/news/2026/10/26/uta-uses-ai-to-uncover-drivers-of-eye-disease","categoria":"BIOMEDICINA","lang":"pt"},{"fonte":"CB News","pais":"França","titulo":"EUA: Uso de inteligência artificial em propagandas políticas gera polêmica","resumo":"O uso crescente de ferramentas de inteligência artificial generativa em campanhas eleitorais nos Estados Unidos está causando forte preocupação entre reguladores e o público.\nA facilidade de criar conteúdos sintéticos aumenta os riscos de desinformação e manipulação da opinião pública em momentos decisivos.\nO cenário pressiona autoridades e plataformas digitais a estabelecerem regras mais rígidas para a transparência do uso de IA.","link":"https://www.cbnews.fr/etudes/usa-publicite-politique-avec-ia-seme-trouble","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Financial Times","pais":"Inglaterra","titulo":"Órgão de ciência climática da ONU entra em impasse e fica sem aprovação orçamentária","resumo":"O painel de ciência climática da Organização das Nações Unidas ficou em situação incerta após um impasse político impedir a aprovação de seu orçamento anual.\nO bloqueio orçamentário ameaça atrasar relatórios cruciais sobre o aquecimento global e comprometer o progresso de negociações ambientais internacionais.\nDelegados buscam soluções emergenciais para garantir que as pesquisas científicas continuem orientando as políticas públicas globais.","link":"https://www.ft.com/content/f326afa1-962d-4a4e-b24f-f8695fa315d1?syn-25a6b1a6=1","categoria":"CIÊNCIA CLIMÁTICA","lang":"pt"},{"fonte":"Economía Digital","pais":"Espanha","titulo":"Talde lança fundo de 100 milhões para investir em robótica e tecnologia aeroespacial","resumo":"A gestora Talde, vinculada ao Kutxabank, apresentou um novo fundo voltado ao financiamento de empresas inovadoras nos setores de robótica avançada e aeroespacial. O aporte financeiro visa impulsionar o desenvolvimento tecnológico local e aumentar a competitividade industrial da Espanha na Europa. A estratégia fortalece o ecossistema de startups de tecnologia profunda e atrai novos investimentos estratégicos.","link":"https://www.economiadigital.es/empresas/talde-kutxabank-lanza-fondo-100-millones-invertir-robotica-tecnologia-aeroespacial.html","categoria":"INVESTIMENTO","lang":"pt"},{"fonte":"Die Rheinpfalz","pais":"Alemanha","titulo":"Partido de Bolsonaro reconhece vitória eleitoral de Lula sob reservas","resumo":"O partido do ex-presidente Jair Bolsonaro formalizou o reconhecimento do resultado eleitoral que deu a vitória a Luiz Inácio Lula da Silva.\nApesar do posicionamento oficial, a legenda manteve ressalvas públicas em relação a determinados aspectos do processo.\nO desdobramento marca um momento relevante para a estabilidade institucional e repercute em análises políticas internacionais.","link":"https://www.rheinpfalz.de/politik_artikel,-bolsonaro-partei-erkennt-lulas-wahlsieg-unter-vorbehalt-an-_arid,5942421.html","categoria":"POLÍTICA","lang":"pt"},{"fonte":"EE Times Japan","pais":"Japão","titulo":"TDK apresenta tecnologias de detecção recentes na CEATEC e aponta três desafios para sensores de robôs","resumo":"Durante a feira CEATEC, a TDK revelou suas inovações mais recentes em tecnologias de sensoriamento voltadas para o mercado de robótica. A empresa detalhou os três principais desafios atuais que os desenvolvedores enfrentam para integrar sensores de alta precisão em robôs autônomos.","link":"https://eetimes.itmedia.co.jp/ee/articles/2610/27/news056.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"美通社","pais":"China","titulo":"HUAWEI WATCH D3 estreia na ISH-ECS 2026 com tecnologia inovadora de medição da pressão arterial","resumo":"A Huawei apresentou o smartwatch WATCH D3 na feira ISH-ECS 2026, trazendo tecnologia avançada para monitoramento da pressão arterial. A inovação visa integrar o controle preventivo da hipertensão à rotina diária dos usuários com alta precisão. O lançamento reforça a estratégia da marca em unir eletrônicos de consumo e soluções de saúde digital.","link":"https://www.prnasia.com/lightnews/lightnews-1-77-100389.shtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"DD News","pais":"Índia","titulo":"Primeiro-ministro Modi inaugura hoje em Nova Delhi a Conferência de Ciência, Tecnologia e Inovação Emergente 2026","resumo":"O primeiro-ministro Narendra Modi inaugura nesta data a Conferência de Ciência, Tecnologia e Inovação Emergente 2026, sediada em Nova Delhi. O evento reúne líderes globais, cientistas e formuladores de políticas para discutir o futuro tecnológico e industrial do país. A cúpula pretende consolidar parcerias estratégicas e incentivar investimentos em pesquisas avançadas na Índia.","link":"https://ddnews.gov.in/en/pm-modi-to-inaugurate-emerging-science-technology-and-innovation-conclave-2026-in-new-delhi-today/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Portugal Digital Summit reúne mais de três mil participantes para debater impacto da IA na economia","resumo":"O Portugal Digital Summit encerrou sua edição recente com a marca expressiva de mais de três mil participantes reunidos para discutir o futuro tecnológico. O evento centrou seus debates nos impactos profundos e transformadores da inteligência artificial sobre os diversos setores da economia nacional. Especialistas e líderes de mercado trocaram experiências cruciais para acelerar a transição digital no país.","link":"https://jornaleconomico.sapo.pt/noticias/portugal-digital-summit-reuniu-mais-de-tres-mil-participantes-para-debater-impacto-da-ia-na-economia/","categoria":"ECONOMIA","lang":"pt"},{"fonte":"MINUTO MT","pais":"Brasil","titulo":"PRONINC destina R$ 100 milhões para tecnologias voltadas à economia solidária","resumo":"O PRONINC destinará R$ 100 milhões para impulsionar tecnologias voltadas à economia solidária.\nO investimento visa apoiar empreendimentos comunitários e fomentar a inclusão produtiva.\nAs soluções tecnológicas desenvolvidas buscarão gerar renda e impacto social sustentável.\nA medida fortalece a inovação voltada ao desenvolvimento humano e socioeconômico.","link":"https://minutomt.com.br/tecnologia/proninc-destina-r-100-milhoes-a-tecnologias-para-economia-solidaria/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Yahoo Finance","pais":"Estados Unidos","titulo":"Individual Centricity aprova patente de tecnologia para combater fraudes por deepfake","resumo":"A empresa Individual Centricity obteve a aprovação da patente para uma nova tecnologia focada na validação rigorosa de identidade digital.\nA solução foi projetada para detectar e conter a disseminação de deepfakes, protegendo dados pessoais e transações financeiras.\nA conquista representa um avanço crucial na segurança da informação diante da rápida sofisticação de falsificações geradas por IA.","link":"https://finance.yahoo.com/technology/ai/articles/individual-centricity-wins-patent-approval-231300983.html","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"Purebreak","pais":"França","titulo":"Com aprovação de 100%, a melhor série de ficção científica de 2026 terá continuação","resumo":"Aclamada unanimemente pela crítica e pelo público, a produção de ficção científica mais elogiada do ano teve sua renovação confirmada para uma nova temporada.\nA obra destaca-se pela abordagem inovadora de dilemas tecnológicos futuristas e roteiro envolvente.\nA decisão de dar continuidade à saga reforça a forte demanda por entretenimento centrado em ciência e cenários especulativos.","link":"https://www.purebreak.com/news/notee-100-la-meilleure-serie-de-science-fiction-de-2026-aura-une-suite/266545","categoria":"ENTRETENIMENTO","lang":"pt"},{"fonte":"Auto Express","pais":"Inglaterra","titulo":"Novo carro esportivo da Toyota se aproxima com o surgimento de protótipo atualizado do 'Celica'","resumo":"A Toyota deu mais um passo para o lançamento de um novo veículo esportivo ao apresentar uma versão atualizada do protótipo inspirado no clássico Celica.\nO modelo combina nostalgia com tecnologias automotivas de última geração, despertando grande entusiasmo entre os entusiastas do setor.\nA iniciativa reflete o empenho da montadora em reviver ícones do passado ajustados aos padrões modernos de desempenho e inovação.","link":"https://www.autoexpress.co.uk/toyota/365687/new-toyota-celica-or-mr2-updated-mid-engined-sports-car-prototype-spotted-track","categoria":"TECNOLOGIA AUTOMOTIVA","lang":"pt"},{"fonte":"El Periódico","pais":"Espanha","titulo":"Governo concede tratamento especial à gigafábrica de IA de Tarragona e flexibiliza exigências ambientais","resumo":"O governo espanhol concedeu um regime diferenciado para o projeto da gigafábrica de inteligência artificial em Tarragona, isentando-a de restrições aplicadas a outros centros de dados. A medida busca acelerar a instalação de infraestrutura computacional crítica e posicionar o país como um polo europeu de tecnologia. No entanto, a decisão gera debates sobre o equilíbrio entre incentivos ao setor tecnológico e sustentabilidade ambiental.","link":"https://www.elperiodico.com/es/economia/20261026/centros-de-datos-moncloa-trato-especial-gigafactoria-ia-tarragona-135788146","categoria":"TECNOLOGIA E POLÍTICA","lang":"pt"},{"fonte":"PZ-news.de","pais":"Alemanha","titulo":"Partido de Bolsonaro reconhece vitória de Lula; Trump demonstra ceticismo","resumo":"Enquanto o partido de Jair Bolsonaro sinalizou a aceitação da vitória de Lula no Brasil, o ex-presidente americano Donald Trump expressou ceticismo sobre a eleição.\nA divergência de reações destaca a interconexão das redes políticas conservadoras nas Américas.\nO cenário atrai atenção global por suscitar debates sobre governança, integridade eleitoral e alianças políticas internacionais.","link":"https://www.pz-news.de/politik_artikel,-Bolsonaros-Partei-erkennt-Lulas-Sieg-an-Trump-zweifelt-_arid,2374708.html","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"JAXA 宇宙科学研究所","pais":"Japão","titulo":"O satélite de observação solar 'Hinode' completa duas décadas de operação bem-sucedida","resumo":"O renomado satélite solar japonês 'Hinode' celebrou vinte anos de operações científicas contínuas no espaço. Ao longo de sua longa trajetória, o equipamento forneceu dados cruciais para desvendar os mistérios da coroa solar e do campo magnético do Sol.","link":"https://www.isas.jaxa.jp/feature/forefront/261027.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"中国科学院","pais":"China","titulo":"Criando um 'manual tridimensional' para os tubarões","resumo":"Pesquisadores chineses desenvolveram um modelo tridimensional detalhado para o estudo da anatomia e biologia de tubarões. A iniciativa científica utiliza tecnologias avançadas de imagem e computação para mapear estruturas complexas com precisão inédita. O avanço promete beneficiar a conservação marinha e expandir o conhecimento biológico sobre predadores oceânicos.","link":"https://www.cas.cn/cm/202610/t20261027_5122924.shtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Índia","titulo":"IPO da SFC Environmental Technologies: Uma oportunidade focada em tecnologia de água de alta margem","resumo":"A abertura de capital da SFC Environmental Technologies atrai olhares do mercado por sua forte atuação no setor de tecnologia voltada ao tratamento de água. A empresa se destaca por apresentar margens operacionais elevadas e soluções inovadoras para a escassez hídrica. A oferta pública reflete a crescente demanda por investimentos sustentáveis e infraestrutura inteligente na Índia.","link":"https://www.moneycontrol.com/news/business/moneycontrol-research/sfc-environmental-technologies-ipo-a-high-margin-water-technology-play-14060903.html","categoria":"MERCADO","lang":"pt"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Revolut lançará em 2027 plataforma para investir em empresas de tecnologia não cotadas","resumo":"A fintech Revolut anunciou planos ambiciosos para lançar, até 2027, uma nova plataforma dedicada a investimentos em companhias tecnológicas de capital fechado. A iniciativa visa democratizar o acesso de pequenos investidores a startups de alto crescimento que ainda não estão disponíveis nas bolsas tradicionais. A novidade promete movimentar o setor financeiro e atrair novos perfis para o ecossistema de inovação.","link":"https://www.cmjornal.pt/economia/detalhe/revolut-lanca-em-2027-plataforma-para-investir-em-tecnologicas-nao-cotadas","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Embrapa","pais":"Brazil","titulo":"Embrapa researcher wins the 8th CBMM Science and Technology Award","resumo":"Researcher Christiane Paiva, from Embrapa, won the 8th CBMM Science and Technology Award. The award recognizes his contributions to the advancement of the Brazilian agricultural sector. The result highlights the importance of public research in the search for sustainable innovations. The achievement reinforces the role of national science in the country's technological development.","link":"https://www.embrapa.br/web/semiarido/busca-de-noticias/-/noticia/149283862/pesquisadora-christiane-paiva-da-embrapa-vence-8-premio-cbmm-de-ciencia-e-tecnologia","categoria":"SCIENCE","lang":"en"},{"fonte":"Al Jazeera","pais":"United States","titulo":"AI makes discoveries in mathematics, computer science and physics, says OpenAI","resumo":"OpenAI announced that its artificial intelligence models have achieved unprecedented scientific discoveries in areas such as mathematics, physics and computing. The achievement marks a significant advance in the use of advanced algorithms as active partners in scientific development and in solving complex problems. The result reinforces the potential of these technologies to accelerate academic research and drive global innovation in the coming years.","link":"https://www.aljazeera.com/economy/2026/10/27/ai-makes-discoveries-in-mathematics-computer-science-physics-openai-says","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Zonebourse Suisse","pais":"France","titulo":"Siemens Energy partners with Japanese companies to develop fusion energy technology","resumo":"Siemens Energy announced strategic cooperation with Japanese companies to accelerate the development of nuclear fusion technology. The initiative seeks to make fusion viable as a commercial source of clean, safe and inexhaustible energy in the future. This international alliance strengthens scientific advancement in the energy sector and drives high-technology investments globally.","link":"https://ch.zonebourse.com/actualite-bourse/siemens-energy-sa-associe-a-des-entreprises-japonaises-pour-developper-la-technologie-de-la-energi-ce785cdcd08ff620","categoria":"POWER","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Australians should prepare for disruptions to online services as threats rise, cyber agency warns","resumo":"Australia's cybersecurity agency has warned the public and businesses to prepare for unexpected disruptions to essential virtual services. The warning arises from the exponential increase in digital threats and attacks targeting the country's critical infrastructure. Experts highlight the urgent need to reinforce operational resilience and adopt contingency plans to mitigate the impacts of potential digital blackouts.","link":"https://www.theguardian.com/technology/2026/oct/26/australians-should-prepare-for-online-services-to-go-down-unexpectedly-as-threats-rise-cyber-agency-warns","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"Negocios.com","pais":"Spain","titulo":"OpenAI shakes up science with 3 discoveries that seemed impossible","resumo":"OpenAI has introduced relevant scientific advances that use artificial intelligence models to solve complex problems in science. The initiative demonstrates how advanced algorithms can accelerate research in areas where traditional progress was considered unfeasible. This milestone reinforces the role of AI not only as a productive tool, but as an essential engine of innovation and fundamental discoveries.","link":"https://www.negocios.com/tecnologia/openai-sacude-ciencia-3-descubrimientos-que-parecian-imposibles/20261027063137496609.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"Anthropic publishes prospectus for public offering of shares","resumo":"Artificial intelligence startup Anthropic took a decisive step in its trajectory by publishing its market prospectus. The initiative signals the consolidation of the generative AI sector and the search for new institutional capital contributions. The move attracts the interest of global investors by positioning the company as one of OpenAI's main competitors.","link":"https://www.sueddeutsche.de/wirtschaft/ki-kuenstliche-intelligenz-anthropic-dario-amodei-elon-musk-claude-boerse-li.3569461","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"OPTRONICS ONLINE","pais":"Japan","titulo":"Tokyo Science University and partners demonstrate 200 Gb/s operation for optoelectronic fusion","resumo":"Researchers at Tokyo University of Science have achieved an important milestone by demonstrating the operation of silicon optical modulators at 200 Gb/s. This technology is crucial to advancing optoelectronic fusion, aiming for faster and more energy-efficient communication and data processing networks in the future.","link":"https://optronics-media.com/news/20261027/113500/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"LOGISTICS TODAY","pais":"China","titulo":"Automation fair in Shanghai brings together logistics robots and AI technology","resumo":"A new automation fair held in Shanghai brought together advanced logistics robots and innovations in artificial intelligence. The event highlights the accelerated advancement of smart manufacturing in the country and the central role of robotics in the modern supply chain. The exhibition attracts global companies and reinforces China's industrial transition towards highly automated technology hubs.","link":"https://www.logi-today.com/1015196","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"India Today","pais":"India","titulo":"OpenAI claims that AI has made three major advances in mathematics, physics and computer science","resumo":"OpenAI recently announced three significant scientific breakthroughs powered by artificial intelligence in the areas of mathematics, physics and computer science. The milestone signals a drastic evolution in the ability of models to reason about complex problems. This achievement promises to accelerate academic research and the development of new technologies applied globally.","link":"https://www.indiatoday.in/technology/news/story/openai-says-ai-has-made-three-major-breakthroughs-in-maths-physics-and-computer-science-3025838-2026-10-27","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Portuguese software Vivin wins \"Technology of the Year\" award at the Coliving Awards in London","resumo":"The Portuguese software Vivin was awarded the Technology of the Year award at the prestigious Coliving Awards, held in London. The innovation stands out for the optimization and efficient management of shared housing spaces, reinforcing Portugal's technological talent on the international stage. The recognition consolidates the advancement of national solutions aimed at the global real estate market.","link":"https://jornaleconomico.sapo.pt/noticias/software-portugues-vivin-vence-premio-de-tecnologia-do-ano-nos-coliving-awards-em-londres/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Alô Alô Bahia","pais":"Brazil","titulo":"Brazilian wins international award for scientific dissemination on social media","resumo":"A Brazilian scientific popularizer received an international award for his work on social media. The initiative stood out for its ability to simplify complex topics and combat misinformation. International recognition consolidates new forms of public communication of science. The project serves as a model of engagement to bring the population closer to scientific knowledge.","link":"https://aloalobahia.com/noticias/2026/10/27/brasileiro-faz-historia-ao-conquistar-premio-internacional-por-divulgar-ciencia-nas-redes-sociais/","categoria":"COMMUNICATION","lang":"en"},{"fonte":"EurekAlert!","pais":"United States","titulo":"New technology offers interactive 3D visualization of organs during surgery","resumo":"A new technology based on augmented reality concepts promises to transform the environment and dynamics of operating rooms. The system provides doctors with a three-dimensional, interactive view of a patient's organs in real time during procedures. The innovation seeks to increase surgeons' precision, reduce operational risks and accelerate postoperative recovery processes.","link":"https://www.eurekalert.org/news-releases/1149299","categoria":"MEDICAL TECHNOLOGY","lang":"en"},{"fonte":"Le Berry Républicain","pais":"France","titulo":"\"At the forefront of technology\": Germans visit France's most powerful heavy vehicle station in Vierzon","resumo":"A delegation from Germany traveled to Vierzon to closely inspect the ultra-high-power charging infrastructure aimed at heavy trucks. The French project is considered a European reference in the energy transition in the transport and logistics sector. The initiative highlights how ultra-fast charging technology is shaping the future of decarbonized freight transport.","link":"https://www.leberry.fr/vierzon-18100/economie/a-la-pointe-de-la-technologie-ils-viennent-d-allemagne-pour-decouvrir-la-station-poids-lourds-la-plus-puissante-de-france-a-vierzon_15069943/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"'Hostile digital environment': AI is being secretly integrated into the UK Home Office, report finds","resumo":"A new report reveals that artificial intelligence systems are being secretly implemented in several departments at the British Home Office. Critics warn that the opaque use of these technologies can automate immigration and surveillance decisions, creating an unfavorable and biased digital environment. The lack of transparency raises serious concerns about algorithmic bias, human rights, and the absence of adequate public oversight.","link":"https://www.theguardian.com/politics/2026/oct/27/digital-hostile-environment-ai-secretly-embedded-home-office-report","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"MarketScreener España","pais":"Spain","titulo":"Siemens Energy will partner with Japanese companies to develop fusion energy technology","resumo":"Siemens Energy announced a strategic collaboration with partners in Japan to accelerate the commercial development of nuclear fusion energy. The project seeks to create high-precision technological solutions capable of enabling a clean, safe and practically unlimited source of energy. The initiative represents a crucial step towards the global energy transition and the reduction of carbon emissions.","link":"https://es.marketscreener.com/noticias/siemens-energy-se-asociar-con-empresas-japonesas-para-desarrollar-tecnolog-a-de-energ-a-de-fusi-n-ce785cdcd08ff620","categoria":"CLEAN ENERGY","lang":"en"},{"fonte":"Rhein-Neckar-Zeitung","pais":"Germany","titulo":"Heidelberg Materials: Can the green cement plant still be saved?","resumo":"Industrial giant Heidelberg Materials faces major technical and economic challenges to make its innovative eco-friendly cement plant viable. The project seeks to radically reduce carbon emissions in the production of one of the construction industry's most polluting materials. Uncertainties regarding the continuation of operations highlight the complexity of the industrial transition toward clean and sustainable technologies.","link":"https://www.rnz.de/politik/wirtschaft-regional_artikel,-Heidelberg-Materials-Ist-das-gruene-Zementwerk-noch-zu-retten-_arid,2466004.html","categoria":"SCIENCE","lang":"en"},{"fonte":"ジェトロ（日本貿易振興機構）","pais":"Japan","titulo":"Japan-US Semiconductor Cooperation Forum Highlights Partnerships and Joint Development","resumo":"The bilateral forum gathered industry leaders to discuss strategies and showcase success stories in technological partnerships and joint chip development. The initiative reinforces geopolitical and commercial ties between the two nations in the global semiconductor supply chain.","link":"https://www.jetro.go.jp/biznews/2026/10/b60ce34581b46a9f.html","categoria":"BUSINESS","lang":"en"},{"fonte":"中青在线","pais":"China","titulo":"Global media focuses on China's transition from 'world factory' to technology export hub","resumo":"International press outlets highlight China's economic transformation, moving away from simply being the world's factory to solidify its position as an exporter of technology and capabilities. This shift reflects the strengthening of internal innovation, advanced R\u0026D, and national intellectual property. The global impact redefines supply chains and leadership in high-tech markets.","link":"http://m.cyol.com/gb/keji/articles/2026-10/27/content_R4noQ2ToOx.html","categoria":"TRENDS","lang":"en"},{"fonte":"Pharmabiz.com","pais":"India","titulo":"Mulk Technology Launches AI-Driven Digital Health Platform for India and Global Markets","resumo":"Mulk Technology has unveiled a new artificial intelligence-powered digital health platform aimed at both the Indian market and the international arena. The tool aims to optimize diagnoses, broaden access to remote medical services, and improve the operational efficiency of clinics. With this initiative, the company seeks to consolidate its presence in the health tech sector.","link":"https://www.pharmabiz.com/NewsDetails.aspx?aid=191519\u0026sid=2","categoria":"HEALTH","lang":"en"},{"fonte":"Executive Digest","pais":"Portugal","titulo":"Study reveals artificial intelligence suggests music for girls and sports for boys when asked the same question","resumo":"New scientific research analyzed the behavior of artificial intelligence tools and identified gender bias in their automated responses. The study points out that, under the exact same questioning, algorithms tend to suggest stereotyped paths, steering girls toward music and boys toward sports. The discovery raises an important red flag regarding the perpetuation of cultural prejudices through emerging technologies.","link":"https://executivedigest.sapo.pt/ia-sugere-musica-para-raparigas-e-desporto-para-rapazes-perante-mesma-questao-estudo/","categoria":"SCIENCE","lang":"en"},{"fonte":"Diário da Serra","pais":"Brazil","titulo":"ETEC students from Tangará win Science Exhibition with biodegradable plant tube","resumo":"Students from ETEC de Tangará won the State Science Exhibition with a biodegradable plant tube. The ecological solution replaces the plastic containers traditionally used in seedling cultivation. The project reduces environmental impact and promotes the development of rural sustainability. The innovation demonstrates the strength of public education in creating ecological technologies.","link":"https://diariodaserra.com.br/noticia/estudantes-da-etec-de-tangara-vencem-mostra-estadual-de-ciencia-com","categoria":"INNOVATION","lang":"en"},{"fonte":"Breaking News, Latest News and Videos","pais":"United States","titulo":"Trump claims AI leaders signed self-regulation 'constitution'","resumo":"Donald Trump stated that top artificial intelligence industry leaders have signed a self-regulation 'constitution' for the sector. The initiative seeks to establish voluntary ethical guidelines and operational limits defined by the tech companies themselves. The move reflects the intense global debate surrounding governance, security, and the role of the state in the face of accelerated AI advancement.","link":"https://abcnews.com/Politics/top-ai-leaders-meet-trump-white-house-amid/story?id=136832988","categoria":"REGULATION","lang":"en"},{"fonte":"tv5monde","pais":"France","titulo":"Wall Street closes higher as artificial intelligence sector recovers","resumo":"Major Wall Street indices closed in positive territory, boosted by a strong recovery in stocks tied to artificial intelligence. Investor optimism returned after data demonstrated continuous demand for infrastructure and AI solutions in the global market. The movement consolidates the technology as the primary driver of economic growth and gains across global stock exchanges.","link":"https://information.tv5monde.com/economie/wall-street-cloture-en-hausse-lia-reprend-des-couleurs-2843265","categoria":"MARKET","lang":"en"},{"fonte":"BBC","pais":"England","titulo":"Antarctica region named after former BBC science correspondent","resumo":"A region in Antarctica has been officially named after a former BBC science correspondent, recognizing his extensive environmental coverage. The tribute highlights decades of dedication in bringing polar research and climate change to the global public. The announcement reinforces the crucial role of science communication in raising awareness about the preservation of the planet's vulnerable ecosystems.","link":"https://www.bbc.co.uk/news/articles/ckvg7w919x09o","categoria":"SCIENCE","lang":"en"},{"fonte":"elDiario.es","pais":"Spain","titulo":"'Smart City Expo': Urban technology addresses challenges of climate emergency and housing crisis","resumo":"The new edition of the Smart City Expo brings together global experts and companies to discuss the modernization of metropolises in the face of social and environmental crises. The event highlights technological solutions for energy management, urban space optimization, and sustainable infrastructure. With the increase in climate impact, the adoption of urban technologies becomes indispensable to ensuring the resilience of cities.","link":"https://www.eldiario.es/edcreativo/smart-city-expo-tecnologia-urbana-aborda-retos-emergencia-climatica-global-crisis-vivienda_1_13616440.html","categoria":"SMART CITIES","lang":"en"},{"fonte":"WEB.DE","pais":"Germany","titulo":"Election defeat: Bolsonaro faces travel ban","resumo":"Following political developments stemming from the post-election period, former President Jair Bolsonaro was barred from leaving Brazil by judicial determination. The measure reflects the advancement of investigations into recent events in Brazilian politics and draws intense international attention. The diplomatic and political impact of this restriction strongly resonates in the press and global government circles.","link":"https://web.de/magazine/politik/videos/wahlpleite-bolsonaro-kassiert-ausreiseverbot-42879324","categoria":"TRENDS","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Tokyo exhibition highlights co-creation between 3D printing and advanced painting technologies","resumo":"An innovative event in Roppongi, Tokyo, showcases the creative fusion between 3D printing additive manufacturing and modern finishing and painting techniques. The demonstration points to new directions for industrial design, mass customization, and efficiency in producing complex parts.","link":"https://news.yahoo.co.jp/articles/8dc46136fcd14a6d555f49516d8267871d30b75b","categoria":"INNOVATION","lang":"en"},{"fonte":"21财经","pais":"China","titulo":"2026 Greater Bay Area Science Forum to be held this weekend with keynote address by new Nobel laureate","resumo":"The 2026 Greater Bay Area Science Forum will take place this weekend, featuring the confirmed presence of a recent Nobel Prize laureate. The event aims to discuss international scientific cooperation, new frontiers of science, and regional development in innovation. The expectation is to attract significant investment and foster high-impact global academic partnerships.","link":"https://www.21jingji.com/article/20261027/herald/d7fd06efe227c65549bc7a7b09cc2227.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Hindustan Times","pais":"India","titulo":"IIT Mandi launches 'Science on Wheels' to bring hands-on science education to schools across Himachal Pradesh","resumo":"The Indian Institute of Technology (IIT) Mandi has launched the 'Science on Wheels' initiative to promote hands-on science learning in schools across Himachal Pradesh. The mobile project uses traveling laboratories to spark children's and youths' interest in STEM fields. The action seeks to democratize access to quality scientific knowledge in remote regions.","link":"https://www.hindustantimes.com/education/news/iit-mandi-launches-science-on-wheels-to-bring-hands-on-science-education-to-schools-across-hp-101793074918751.html","categoria":"EDUCATION","lang":"en"},{"fonte":"Jornal de Notícias","pais":"Portugal","titulo":"LG Mini RGB Evo AI: Is it a good alternative to OLED?","resumo":"LG is introducing the new Mini RGB Evo AI, sparking intense debates in the electronics market regarding its ability to directly compete with OLED screens. Equipped with advanced artificial intelligence features, the device promises to deliver more vibrant colors and greater energy efficiency. Analysts are evaluating whether this technology represents a significant evolution or merely an intermediate alternative.","link":"https://www.jn.pt/jn-direto/artigo/lg-mini-rgb-evo-ai-a-primeira-lg-com-a-tecnologia-mini-rgb/18141333","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"IFSP Sorocaba Holds Science and Technology Week Focused on Female Representation","resumo":"IFSP Sorocaba promoted the Science and Technology Week centered on female leadership.\nThe event brought together lectures and presentations focused on the inclusion of women in STEM fields.\nThe initiative seeks to encourage new generations of female researchers and reduce the gender gap.\nThe action highlights the importance of inclusive spaces in the academic and technological environment.","link":"https://g1.globo.com/sp/sorocaba-jundiai/noticia/2026/10/26/ifsp-sorocaba-realiza-semana-de-ciencia-e-tecnologia-com-foco-no-protagonismo-feminino.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The University of Texas at Arlington","pais":"United States","titulo":"UTA Uses Artificial Intelligence to Uncover Causes of Eye Diseases","resumo":"Researchers at the University of Texas at Arlington are employing artificial intelligence to map the triggers of severe eye diseases.\nThe technology analyzes large volumes of biological data to identify previously imperceptible genetic and molecular patterns.\nThe discovery opens doors for the development of more effective preventive treatments capable of curbing vision loss in patients.","link":"https://www.uta.edu/academics/schools-colleges/science/news/2026/10/26/uta-uses-ai-to-uncover-drivers-of-eye-disease","categoria":"BIOMEDICINE","lang":"en"},{"fonte":"CB News","pais":"France","titulo":"USA: Use of Artificial Intelligence in Political Advertising Sparks Controversy","resumo":"The growing use of generative artificial intelligence tools in electoral campaigns in the United States is causing strong concern among regulators and the public.\nThe ease of creating synthetic content increases the risks of misinformation and public opinion manipulation at decisive moments.\nThis scenario is pressuring authorities and digital platforms to establish stricter rules for transparency in AI usage.","link":"https://www.cbnews.fr/etudes/usa-publicite-politique-avec-ia-seme-trouble","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Financial Times","pais":"England","titulo":"UN Climate Science Body Reaches Impasse and Left Without Budget Approval","resumo":"The United Nations climate science panel found itself in an uncertain situation after a political impasse prevented the approval of its annual budget.\nThe budget block threatens to delay crucial reports on global warming and compromise the progress of international environmental negotiations.\nDelegates are seeking emergency solutions to ensure that scientific research continues to guide global public policies.","link":"https://www.ft.com/content/f326afa1-962d-4a4e-b24f-f8695fa315d1?syn-25a6b1a6=1","categoria":"CLIMATE SCIENCE","lang":"en"},{"fonte":"Economía Digital","pais":"Spain","titulo":"Talde Launches €100 Million Fund to Invest in Robotics and Aerospace Technology","resumo":"Management firm Talde, affiliated with Kutxabank, has introduced a new fund aimed at financing innovative companies in the advanced robotics and aerospace sectors. The financial contribution aims to boost local technological development and increase Spain's industrial competitiveness in Europe. The strategy strengthens the deep tech startup ecosystem and attracts new strategic investments.","link":"https://www.economiadigital.es/empresas/talde-kutxabank-lanza-fondo-100-millones-invertir-robotica-tecnologia-aeroespacial.html","categoria":"INVESTMENT","lang":"en"},{"fonte":"Die Rheinpfalz","pais":"Germany","titulo":"Bolsonaro's Party Recognizes Lula's Electoral Victory with Reservations","resumo":"The party of former President Jair Bolsonaro formalized its recognition of the election results that gave victory to Luiz Inácio Lula da Silva.\nDespite this official stance, the party maintained public reservations regarding certain aspects of the process.\nThis development marks a significant moment for institutional stability and resonates in international political analyses.","link":"https://www.rheinpfalz.de/politik_artikel,-bolsonaro-partei-erkennt-lulas-wahlsieg-unter-vorbehalt-an-_arid,5942421.html","categoria":"POLITICS","lang":"en"},{"fonte":"EE Times Japan","pais":"Japan","titulo":"TDK Showcases Latest Sensing Technologies at CEATEC and Points Out Three Challenges for Robot Sensors","resumo":"During the CEATEC trade show, TDK unveiled its latest innovations in sensing technologies aimed at the robotics market. The company detailed the three main current challenges developers face in integrating high-precision sensors into autonomous robots.","link":"https://eetimes.itmedia.co.jp/ee/articles/2610/27/news056.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"美通社","pais":"China","titulo":"HUAWEI WATCH D3 Debuts at ISH-ECS 2026 with Innovative Blood Pressure Measurement Technology","resumo":"Huawei introduced the WATCH D3 smartwatch at the ISH-ECS 2026 exhibition, bringing advanced technology for blood pressure monitoring. The innovation aims to integrate preventive hypertension management into users' daily routines with high precision. The launch reinforces the brand's strategy of combining consumer electronics and digital health solutions.","link":"https://www.prnasia.com/lightnews/lightnews-1-77-100389.shtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"DD News","pais":"India","titulo":"Prime Minister Modi Inaugurates Emerging Science, Technology and Innovation Conclave 2026 in New Delhi Today","resumo":"Prime Minister Narendra Modi is inaugurating the Emerging Science, Technology and Innovation Conclave 2026 today, hosted in New Delhi. The event brings together global leaders, scientists, and policymakers to discuss the country's technological and industrial future. The summit aims to consolidate strategic partnerships and encourage investments in advanced research in India.","link":"https://ddnews.gov.in/en/pm-modi-to-inaugurate-emerging-science-technology-and-innovation-conclave-2026-in-new-delhi-today/","categoria":"INNOVATION","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Portugal Digital Summit Gathers Over Three Thousand Participants to Discuss AI's Impact on the Economy","resumo":"The Portugal Digital Summit concluded its recent edition with the significant milestone of over three thousand participants gathered to discuss the technological future. The event centered its debates on the profound and transformative impacts of artificial intelligence across various sectors of the national economy. Experts and market leaders exchanged crucial experiences to accelerate the digital transition in the country.","link":"https://jornaleconomico.sapo.pt/noticias/portugal-digital-summit-reuniu-mais-de-tres-mil-participantes-para-debater-impacto-da-ia-na-economia/","categoria":"ECONOMY","lang":"en"},{"fonte":"MINUTO MT","pais":"Brazil","titulo":"PRONINC Allocates R$ 100 Million for Technologies Aimed at the Solidarity Economy","resumo":"PRONINC will allocate R$ 100 million to boost technologies aimed at the solidarity economy.\nThe investment aims to support community enterprises and foster productive inclusion.\nThe technological solutions developed will seek to generate income and sustainable social impact.\nThe measure strengthens innovation directed toward human and socioeconomic development.","link":"https://minutomt.com.br/tecnologia/proninc-destina-r-100-milhoes-a-tecnologias-para-economia-solidaria/","categoria":"INNOVATION","lang":"en"},{"fonte":"Yahoo Finance","pais":"United States","titulo":"Individual Centricity Wins Patent Approval for Technology to Combat Deepfake Fraud","resumo":"Individual Centricity has secured patent approval for a new technology focused on rigorous digital identity validation.\nThe solution was designed to detect and curb the spread of deepfakes, protecting personal data and financial transactions.\nThis achievement represents a crucial advancement in information security amid the rapid sophistication of AI-generated forgeries.","link":"https://finance.yahoo.com/technology/ai/articles/individual-centricity-wins-patent-approval-231300983.html","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"Purebreak","pais":"France","titulo":"With 100% Approval Rating, the Best Sci-Fi Series of 2026 Will Return for a Sequel","resumo":"Unanimously acclaimed by critics and audiences alike, the year's most praised science fiction production has had its renewal confirmed for a new season.\nThe work stands out for its innovative approach to futuristic technological dilemmas and engaging plot.\nThe decision to continue the saga reinforces the strong demand for entertainment centered on science and speculative scenarios.","link":"https://www.purebreak.com/news/notee-100-la-meilleure-serie-de-science-fiction-de-2026-aura-une-suite/266545","categoria":"ENTERTAINMENT","lang":"en"},{"fonte":"Auto Express","pais":"England","titulo":"New Toyota Sports Car Looms as Updated 'Celica' Prototype Breaks Cover","resumo":"Toyota has taken another step toward launching a new sports car by presenting an updated version of the prototype inspired by the classic Celica.\nThe model combines nostalgia with next-generation automotive technologies, sparking great enthusiasm among sector enthusiasts.\nThe initiative reflects the automaker's commitment to reviving icons of the past adjusted to modern standards of performance and innovation.","link":"https://www.autoexpress.co.uk/toyota/365687/new-toyota-celica-or-mr2-updated-mid-engined-sports-car-prototype-spotted-track","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"El Periódico","pais":"Spain","titulo":"Government Grants Special Treatment to Tarragona AI Gigafactory and Eases Environmental Requirements","resumo":"The Spanish government has granted a differentiated framework for the artificial intelligence gigafactory project in Tarragona, exempting it from restrictions applied to other data centers. The measure seeks to accelerate the installation of critical computational infrastructure and position the country as a European technology hub. However, the decision sparks debates over the balance between incentives for the tech sector and environmental sustainability.","link":"https://www.elperiodico.com/es/economia/20261026/centros-de-datos-moncloa-trato-especial-gigafactoria-ia-tarragona-135788146","categoria":"TECHNOLOGY AND POLITICS","lang":"en"},{"fonte":"PZ-news.de","pais":"Germany","titulo":"Bolsonaro's Party Recognizes Lula's Victory; Trump Expresses Skepticism","resumo":"While Jair Bolsonaro's party signaled acceptance of Lula's victory in Brazil, former US President Donald Trump expressed skepticism regarding the election.\nThe divergence in reactions highlights the interconnectivity of conservative political networks across the Americas.\nThe scenario has drawn global attention, sparking debates on governance, electoral integrity, and international political alliances.","link":"https://www.pz-news.de/politik_artikel,-Bolsonaros-Partei-erkennt-Lulas-Sieg-an-Trump-zweifelt-_arid,2374708.html","categoria":"TRENDS","lang":"en"},{"fonte":"JAXA 宇宙科学研究所","pais":"Japan","titulo":"Solar Observation Satellite 'Hinode' Marks Two Decades of Successful Operation","resumo":"The renowned Japanese solar satellite 'Hinode' has celebrated twenty years of continuous scientific operations in space. Throughout its long mission, the equipment has provided crucial data to unravel the mysteries of the solar corona and the Sun's magnetic field.","link":"https://www.isas.jaxa.jp/feature/forefront/261027.html","categoria":"SCIENCE","lang":"en"},{"fonte":"中国科学院","pais":"China","titulo":"Creating a 'Three-Dimensional Manual' for Sharks","resumo":"Chinese researchers have developed a detailed three-dimensional model to study shark anatomy and biology. The scientific initiative uses advanced imaging and computing technologies to map complex structures with unprecedented precision. This breakthrough promises to aid marine conservation and expand biological knowledge regarding ocean predators.","link":"https://www.cas.cn/cm/202610/t20261027_5122924.shtml","categoria":"SCIENCE","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"SFC Environmental Technologies IPO: A High-Margin Water Technology Play","resumo":"The initial public offering of SFC Environmental Technologies is drawing market attention due to its strong foothold in the water treatment technology sector. The company stands out for high operating margins and innovative solutions targeting water scarcity. The public offering reflects the growing demand for sustainable investments and smart infrastructure in India.","link":"https://www.moneycontrol.com/news/business/moneycontrol-research/sfc-environmental-technologies-ipo-a-high-margin-water-technology-play-14060903.html","categoria":"MARKETS","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Revolut to Launch Platform in 2027 for Investing in Unlisted Tech Companies","resumo":"Fintech giant Revolut has announced ambitious plans to launch a new platform dedicated to investments in privately held tech companies by 2027. The initiative aims to democratize retail investor access to high-growth startups not yet available on traditional stock exchanges. This development is expected to shake up the financial sector and attract new demographics to the innovation ecosystem.","link":"https://www.cmjornal.pt/economia/detalhe/revolut-lanca-em-2027-plataforma-para-investir-em-tecnologicas-nao-cotadas","categoria":"BUSINESS","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
