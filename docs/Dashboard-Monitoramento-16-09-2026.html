tion aims to strengthen the Japanese giant's clean energy solution portfolio and accelerate industrial decarbonization.\nThis move reinforces Germany's position as a strategic hub for innovation in green and sustainable technologies.","link":"https://monoist.itmedia.co.jp/mn/articles/2609/16/news025.html","categoria":"CLEAN ENERGY","lang":"en"},{"fonte":"Tata Consultancy Services","pais":"Germany","titulo":"TCS Accelerates AI-Led Technology Transformation at German Bank Aareal Bank","resumo":"Tata Consultancy Services has formed a strategic partnership with Germany's Aareal Bank to modernize its digital infrastructure.\nThe project focuses on using artificial intelligence to streamline banking operations, enhance customer experience, and ensure greater security.\nThe initiative reflects the strong trend of automation and technological transformation driving the European financial sector.","link":"https://www.tcs.com/who-we-are/newsroom/press-release/tcs-accelerate-ai-led-technology-transformation-germany-aareal-bank","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"bild.de","pais":"Germany","titulo":"Urgent Letter to von der Leyen: Business Sector Warns That China Is Buying Up the Mittelstand","resumo":"German business leaders have sent an urgent warning to the European Commission regarding the accelerated acquisition of mid-sized enterprises by Chinese capital.\nThe document warns of the risks of losing sovereignty, strategic technological assets, and critical industrial knowledge in the region.\nThe mobilization pushes for stricter regulations within the bloc to protect national innovation ecosystems and technologies.","link":"https://www.bild.de/politik/inland/brandbrief-an-von-der-leyen-wirtschaft-warnt-china-kauft-unseren-mittelstand-auf-6aa8d774250f8ce245e4d0ec","categoria":"BUSINESS","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"NHK Spring to Showcase Advanced Joining Technologies at SEMICON India 2026 to Expand in Semiconductor Market","resumo":"Japanese manufacturer NHK Spring (Nippatsu) has announced its participation in the SEMICON India 2026 exhibition, aiming to strengthen its presence in the growing semiconductor sector.\nThe company will present innovative solutions based on high-precision joining technology, which are essential for manufacturing advanced chips.\nThis initiative seeks to expand its international business and consolidate strategic partnerships in the South Asian market.","link":"https://news.yahoo.co.jp/articles/8ce0a303950e7365cf642512e1bf323ab5dcd198","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"産経ニュース","pais":"Japan","titulo":"Leading the World with IP Strategy: Balancing Secrecy and Technological Standardization","resumo":"The president of the Japan Patent Information Organization highlighted the importance of a robust national intellectual property strategy to maintain global competitiveness.\nThe proposed model combines rigorous protection of confidential technical knowledge with the international standardization of essential technologies.\nThis approach aims to bolster Japan's innovation ecosystem and protect its cutting-edge industries against predatory competition.","link":"https://www.sankei.com/article/20260916-JPQZ5NJYEBOLXCHHPWBHWTZV6M/","categoria":"INNOVATION","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Scientists Develop Technology to Curb Uncontrolled Immune Reactions","resumo":"Japanese researchers have developed a new technology capable of suppressing cytokine storms and excessive immune reactions in the human body.\nThe discovery promises to open new therapeutic avenues for treating a wide variety of severe inflammatory and autoimmune diseases.\nThe breakthrough represents a significant step forward for precision medicine, increasing the safety and efficacy of immunological treatments.","link":"https://news.yahoo.co.jp/articles/4a2f88deedbb8ab14adbfac5aee5ab4650df7f28","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Digital PR Platform","pais":"Japan","titulo":"Macnica Unveils 'MACNICA Green Tech Messe' Concept for GREEN×EXPO 2027","resumo":"Technology company Macnica has revealed the details of its participation in GREEN×EXPO 2027, highlighting an exhibition center focused on future technologies.\nThe initiative will showcase decarbonization, renewable energy, and automation solutions geared toward urban sustainability.\nThe project aims to connect global technological innovations with environmental challenges, promoting green transformation in the industrial sector.","link":"https://digitalpr.jp/r/143723","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"自動運転ラボ","pais":"Japan","titulo":"Tokyo-based Company Nears Tesla's Level in Autonomous Driving Technology","resumo":"A technology startup based in Tokyo's Ota district has reached decisive milestones in the development of advanced autonomous driving systems.\nThe developed technology approaches the performance and reliability levels seen in Tesla vehicles, capturing the attention of the automotive industry.\nThis progress boosts the local tech ecosystem and reinforces Japan's capacity to rival global giants in the sector.","link":"https://jidounten-lab.com/u_67748","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"tokyu.co.jp","pais":"Japan","titulo":"Toyoko Line Adopts AI System to Assist Conductors with Door Closing","resumo":"The railway operator has introduced an AI monitoring system at Toyoko Line stations to assist drivers in single-operator train operations.\nThe technology analyzes images in real time to verify platform safety and guide the decision to close doors.\nThe measure aims to enhance passenger safety and optimize operational costs through digital transformation in public transportation.","link":"https://www.tokyu.co.jp/company/news/detail/61901.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"SNBL Secures SBTi Certification for Greenhouse Gas Reduction Targets","resumo":"Shin Nippon Biomedical Laboratories (SNBL) has received formal validation from the Science Based Targets initiative (SBTi) for its carbon emission reduction targets.\nThe recognition confirms that the corporation's environmental objectives are aligned with climate science to curb global warming.\nThis achievement strengthens the company's ESG reputation and accelerates its transition to lower environmental impact operations.","link":"https://www.nikkei.com/nkd/disclosure/tdnr/20260828527609/","categoria":"SCIENCE","lang":"en"},{"fonte":"日经中文网","pais":"Japan","titulo":"The Japanese Analyst Trusted by China's 'Economic Czar' Zhu Rongji","resumo":"A report examines the historical relations and influence of Japanese consultants in the development of economic reforms driven by Zhu Rongji in China.\nThe analysis highlights technical and economic cooperation between the two nations during strategic moments of industrial modernization.\nThe history illustrates the importance of knowledge exchange and technical dialogue for regional stability and growth.","link":"https://cn.nikkei.com/columnviewpoint/column/64019-2026-09-16-05-00-51.html","categoria":"TRENDS","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"AI Model Discovers 'Invisible' TM184C Protein in the Human Body","resumo":"A new artificial intelligence model has allowed researchers to identify the TM184C protein, previously considered 'invisible' in the human body.\nThe discovery represents a significant breakthrough in structural biology by revealing the crucial role of the protein in complex cellular processes.\nThe use of advanced algorithms paves the way for the rapid mapping of other unknown protein structures.\nThis breakthrough could significantly accelerate the development of new targeted therapies and drugs.","link":"https://news.sciencenet.cn/htmlnews/2026/9/571550.shtm","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"厦门大学新闻网","pais":"China","titulo":"Academician Zhang Rong's Team Publishes Photonics Breakthrough in Nature Photonics","resumo":"Academician Zhang Rong's team has published a high-impact paper in the prestigious journal Nature Photonics.\nThe study presents fundamental advances in the field of light control and next-generation optoelectronic devices.\nThe research highlights China's capability to lead innovations in applied physics and photonic semiconductors.\nThe results promise to drastically increase data processing efficiency in future optical networks.","link":"https://news.xmu.edu.cn/info/1045/535072.htm","categoria":"CIÊNCIA","lang":"en"},{"fonte":"新浪新闻_手机新浪网","pais":"China","titulo":"High-Tech Manufacturing Leads as Robots Migrate from Testing to Factories and Homes","resumo":"China's high-tech manufacturing sector continues to lead industrial growth, driven by the rapid expansion of robotics.\nSmart robots are moving beyond mere laboratory demonstrations to assume practical roles in factories and homes.\nThis trend reflects the maturation of supply chains and artificial intelligence applied to automation.\nThe transition strengthens industrial productivity and accelerates the adoption of commercial and consumer robotics.","link":"https://news.sina.com.cn/zx/gj/2026-09-16/doc-iniryzmc4912805.shtml","categoria":"ROBOTICS","lang":"en"},{"fonte":"观点网","pais":"China","titulo":"Kuang-Chi Technologies: Drone Business Transitions to Commercialization Phase","resumo":"Kuang-Chi Technologies has announced that its drone sector operations have officially advanced to large-scale commercialization.\nThe shift indicates that the company's unmanned aerial systems have achieved operational maturity and market viability.\nWith growing orders and new industrial applications, the company consolidates its position in high-end aerospace.\nThe transition highlights the rapid expansion of the low-altitude economy within the Chinese tech ecosystem.","link":"https://www.guandian.cn/article/20260916/602320.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"新浪军事","pais":"China","titulo":"2026 Intelligent Economy Forum Held in Beijing","resumo":"The 2026 Intelligent Economy Forum brought together industry leaders, academics, and policymakers in Beijing.\nDiscussions focused on the integration of artificial intelligence models with traditional industries and cloud infrastructures.\nThe event highlighted strategies to accelerate digital productivity and promote sustainable innovation ecosystems.\nExperts emphasized the importance of global standards and governance to ensure the ethical development of the sector.","link":"https://mil.news.sina.com.cn/2026-09-16/doc-iniryzkw6614454.shtml","categoria":"DIGITAL ECONOMY","lang":"en"},{"fonte":"DW.com","pais":"China","titulo":"Beijing Issues Warning Over Artificial Intelligence Risks","resumo":"Authorities in Beijing have issued formal warnings regarding the growing risks associated with the proliferation of artificial intelligence.\nExperts point out that maintaining political security, social stability, and data protection are the government's top priorities.\nThis stance signals stricter regulatory enforcement on developers of large-scale generative models.\nThe move seeks to balance the country's technological leadership with strict safeguard mechanisms.","link":"https://amp.dw.com/zh/%E5%8C%97%E4%BA%AC%E8%AD%A6%E5%91%8A%E4%BA%BA%E5%B7%A5%E6%99%BA%E8%83%BD%E9%A3%8E%E9%99%A9-%E4%B8%93%E5%AE%B6%E6%94%BF%E6%B2%BB%E5%AE%89%E5%85%A8%E6%98%AF%E5%85%B6%E9%A6%96%E8%A6%81%E5%85%B3%E5%88%87/a-79280247","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"中国网","pais":"China","titulo":"Chinese Academy of Sciences Launches New Journal on Trans-Himalayan Earth System Science","resumo":"The Chinese Academy of Sciences has introduced the English-language journal 'Trans-Himalayan Earth System Science.'\nThe publication aims to create an international academic platform for multidisciplinary research in the Himalayas and Tibetan Plateau region.\nThe journal will cover vital topics such as climate change, geological dynamics, and biodiversity conservation.\nThe initiative seeks to strengthen global scientific cooperation in one of the planet's most ecologically sensitive areas.","link":"http://ydyl.china.com.cn/2026-09/16/content_118698555.shtml","categoria":"SCIENCE","lang":"en"},{"fonte":"nda.gov.cn","pais":"China","titulo":"2026 SCO Digital Economy Forum Opens with Cooperation Across More Than Ten Areas","resumo":"The opening of the Shanghai Cooperation Organisation (SCO) Digital Economy Forum revealed a list of collaborative projects.\nPartnerships cover more than ten strategic sectors, including 5G infrastructure, artificial intelligence, and smart cities.\nThe meeting seeks to strengthen regional connectivity and accelerate digital transformation among member states.\nTechnological alignment promises to drive new trade routes and integrated digital supply chains.","link":"https://www.nda.gov.cn/sjj/swdt/mtsy/0915/20260915205316444356432_pc.html","categoria":"DIGITAL ECONOMY","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"India","titulo":"Suzuki Unveils 2027 Gixxer Sports Motorcycle in India","resumo":"Suzuki has officially announced the 2027 model of its popular Gixxer sports motorcycle in India, aligning with European market trends.\nThe vehicle stands out for its affordable price of approximately 220,000 yen and features improvements in design and efficiency.\nThe news reinforces the strategic relevance of the Indian market for the Japanese manufacturer in the two-wheeler segment.","link":"https://news.yahoo.co.jp/articles/da3a34b9b028030e622164841b157eedabf061f5","categoria":"MOBILITY","lang":"en"},{"fonte":"Investing.com India","pais":"India","titulo":"Why Are Contemporary Amperex Technology Shares Sliding Today?","resumo":"Shares of Contemporary Amperex Technology Co. Ltd. (CATL), the world's largest EV battery manufacturer, dropped in the global financial market.\nThe movement reflects investor uncertainties regarding demand for electromobility components and supply chain margin adjustments.\nThe fluctuation is closely monitored as it directly impacts the clean tech and energy transition sectors.","link":"https://in.investing.com/news/stock-market-news/why-is-contemporary-amperex-technology-stock-sliding-today-93CH-5594451","categoria":"TECH MARKET","lang":"en"},{"fonte":"GK Today","pais":"India","titulo":"2026 World Circular Economy Forum Kicks Off in Gandhinagar","resumo":"The city of Gandhinagar, India, has kicked off the 2026 World Circular Economy Forum, bringing together global leaders, scientists, and policymakers.\nThe event discusses innovative solutions for waste reduction, industrial recycling, and sustainable business models.\nThe conference positions India at the center of global discussions on sustainable development and ecological transition.","link":"https://www.gktoday.in/world-circular-economy-forum-2026-begins-in-gandhinagar/","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"Rediff MoneyWiz","pais":"India","titulo":"India drives global growth and receives praise from the IMF","resumo":"Representatives from the International Monetary Fund (IMF) highlighted the decisive role of the Indian economy in the pace of global expansion.\nThe country has consolidated its position as one of the main drivers of development due to massive investments in infrastructure and digitalization.\nThe positive assessment reinforces India's attractiveness for foreign investments in technology and innovation.","link":"https://money.rediff.com/news/market/india-drives-global-growth-imf-official-praises-economy/54404220260916","categoria":"DIGITAL ECONOMY","lang":"en"},{"fonte":"Nasscom","pais":"India","titulo":"Emerging Data Center trends in India's digital economy","resumo":"The accelerated expansion of India's digital economy is driving new trends in the construction and operation of data center infrastructure.\nWith the advancement of data consumption, artificial intelligence, and cloud services, the sector is seeking solutions focused on energy efficiency.\nThis movement positions the country as a strategic regional hub for data storage and processing.","link":"https://community.nasscom.in/communities/it-services/emerging-data-center-trends-indias-digital-economy","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Hindu","pais":"India","titulo":"Indian and US armies kick off 'Yudh Abhyas' exercise focusing on technology","resumo":"The armies of India and the United States have launched the joint military training exercise 'Yudh Abhyas', prioritizing the integration of new technologies and tactical interoperability.\nThe initiative aims to improve the use of advanced defense, intelligence, and communication systems in complex operational scenarios.\nThe exercise strengthens strategic cooperation between the two nations in the technology and regional security sector.","link":"https://www.thehindu.com/news/national/india-us-armies-begin-yudh-abhyas-with-focus-on-technology-interoperability/article71469165.ece","categoria":"DEFENSE TECHNOLOGY","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"India reaffirms commitment to the circular economy at global forum","resumo":"During the World Circular Economy Forum, India's Environment Minister reaffirmed the country's commitment to sustainable development practices.\nThe Indian government highlighted strategies for the integration of green technologies, e-waste recycling, and resource preservation.\nThe speech reinforces the country's environmental and scientific goals to contain the impacts of global climate change.","link":"https://newsonair.gov.in/world-circular-economy-forum-2026-to-begin-today-at-gandhinagar-in-gujarat/","categoria":"ENVIRONMENTAL SCIENCE","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Cyberattack on MEO that saturated the network in Portugal had three phases","resumo":"The recent distributed denial-of-service (DDoS) attack against telecom operator MEO caused widespread instability in telecommunications services in Portugal.\nExperts point out that the offensive took place in three distinct and highly coordinated phases to maximize the saturation of the network infrastructure.\nThe incident raised alarms regarding the vulnerability of national critical networks and the urgent need to strengthen cyber defenses in the country.","link":"https://www.cmjornal.pt/tecnologia/detalhe/ataque-a-meo-teve-tres-fases","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Allianz Trade: \"Three-speed\" global economy puts AI, defense, and energy in the lead","resumo":"A new report from Allianz Trade reveals that global economic growth is advancing at different speeds depending on the region and sector.\nArtificial Intelligence technologies, the defense industry, and the energy sector are emerging as the main drivers of this global development.\nThe analysis highlights the transformative impact of advanced automation in increasing productivity and reconfiguring international financial markets.","link":"https://jornaleconomico.sapo.pt/noticias/allianz-trade-economia-global-a-tres-velocidades-com-ia-defesa-e-energia-a-frente-do-crescimento/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Motor24","pais":"Portugal","titulo":"Volvo EX30 gains bidirectional technology to power external devices","resumo":"The electric Volvo EX30 model has received a technological update introducing bidirectional charging (V2L), allowing the vehicle to be transformed into a mobile power source.\nWith this new feature, the car's battery can supply electricity to home appliances, tools, and other devices in emergency situations or outdoors.\nThe innovation reinforces the transition toward more integrated and sustainable mobility ecosystems.","link":"https://motor24.pt/motor/volvo-ex30-ganha-tecnologia-bidirecional-e-passa-a-fornecer-energia-a-dispositivos-externos","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"tek.sapo.pt","pais":"Portugal","titulo":"STEM Generation .PT offers 5,000-euro scholarships to encourage women in science and technology","resumo":"The STEM Generation .PT program has launched a new incentive initiative providing 5,000-euro scholarships aimed at female talent.\nThe measure seeks to promote gender equality and attract more young students to careers in science, technology, engineering, and mathematics in Portugal.\nIn addition to financial support, the project provides mentoring and professional development opportunities for participants.","link":"https://tek.sapo.pt/expert/artigos/geracao-stem-pt-tem-bolsas-de-5-mil-euros-para-apoiar-o-talento-feminino-nas-areas-da-ciencia-e-tecnologia/","categoria":"SCIENCE AND TECHNOLOGY","lang":"en"},{"fonte":"Pplware","pais":"Portugal","titulo":"SNS turns 47: how technology has transformed public health","resumo":"On the 47th anniversary of Portugal's National Health Service (SNS), the fundamental role of digitalization and new technologies in modernizing medical care is highlighted.\nTelemedicine tools, centralized data systems, and AI-assisted diagnostics have optimized patient management.\nThese innovations have ensured greater efficiency in clinical monitoring and expanded access to essential care.","link":"https://pplware.sapo.pt/high-tech/sns-faz-47-anos-como-a-tecnologia-transformou-a-saude-publica/","categoria":"HEALTH AND TECHNOLOGY","lang":"en"},{"fonte":"El Trapezio","pais":"Portugal","titulo":"\"Like, Whatever...\": New digital channel brings science and health closer to youth","resumo":"The digital channel \"Like, Whatever...\" has been launched, a platform created to simplify complex science and health concepts for young audiences.\nFeaturing accessible language and interactive social media dynamics, the project aims to combat misinformation and promote scientific literacy.\nThe initiative relies on the support of experts and researchers to translate academic discoveries into engaging content.","link":"https://eltrapezio.eu/es/2026/09/15/tipo-o-que-novo-canal-digital-quer-aproximar-ciencia-e-saude-dos-jovens/","categoria":"SCIENCE","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Cinema anticipated the risks and dilemmas of Artificial Intelligence","resumo":"A study analyzes how film productions over the decades predicted many of the ethical debates and risks associated with modern Artificial Intelligence.\nFrom out-of-control autonomous systems to the dilemmas of artificial consciousness, science fiction served as an early warning system for society.\nExperts use these cultural references to discuss regulation and the impact of technology on humanity's future.","link":"https://www.cmjornal.pt/tecnologia/detalhe/cinema-antecipou-riscos-da-inteligencia-artificial","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Gazeta Rural","pais":"Portugal","titulo":"Vila Verde becomes a European circular economy laboratory","resumo":"The municipality of Vila Verde has been selected to act as a European living lab focused on the development of sustainable practices and the circular economy.\nThe project will test new material reuse technologies, efficient waste management, and carbon footprint reduction in the region.\nThe initiative places Portugal at the vanguard of environmental innovation and attracts international investments focused on sustainability.","link":"https://gazetarural.com/vila-verde-torna-se-laboratorio-europeu-da-economia-circular/","categoria":"SUSTAINABILITY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
