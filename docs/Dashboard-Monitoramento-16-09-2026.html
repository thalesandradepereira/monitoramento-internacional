  const data = [{"fonte":"G1","pais":"Brasil","titulo":"Por que Há o Temor de a IA Extinguir a Humanidade e Quais São os Riscos Reais?","resumo":"O debate sobre os riscos existenciais da inteligência artificial ganhou destaque entre cientistas e líderes do setor tecnológico.\nPreocupações sobre o controle de sistemas autônomos e os impactos éticos impulsionam discussões globais sobre regulamentação.\nA análise dos cenários reais busca equilibrar a inovação com a prevenção de ameaças à segurança humana.","link":"https://g1.globo.com/tecnologia/noticia/2026/09/16/por-que-ha-o-temor-sobre-ia-acabar-com-a-humanidade-e-existe-mesmo-o-risco.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Lula Sanciona Incentivos para Produção de Minerais Críticos no Brasil","resumo":"O governo brasileiro sancionou incentivos fiscais para impulsionar a produção e o processamento de minerais críticos no país.\nA medida fortalece a cadeia de suprimentos para semicondutores, baterias e tecnologias voltadas à transição energética.\nO incentivo busca atrair investimentos estratégicos e reduzir a dependência externa de insumos tecnológicos.","link":"https://oglobo.globo.com/economia/noticia/2026/09/16/lula-sanciona-incentivos-para-ampliar-producao-e-processamento-de-minerais-criticos-no-brasil.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Terra","pais":"Brasil","titulo":"Ford Registra Patente de Tecnologia Inovadora para Picapes","resumo":"A Ford registrou uma nova patente focada em otimizar a funcionalidade e o uso do espaço nas caçambas de picapes.\nA solução utiliza automação e sensores para aprimorar o transporte de cargas e a versatilidade dos veículos.\nA novidade reforça a tendência de integração entre hardware automotivo e sistemas inteligentes no setor.","link":"https://www.terra.com.br/mobilidade/carros/ford-patenteia-tecnologia-que-pode-revolucionar-as-picapes,3db3570460b3fb76f8daed212a5f67532ycabkqu.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Canal Rural","pais":"Brasil","titulo":"Tecnologia Brasileira Reduz Uso de Fosfato em Rações e Ganha Escala no Paraná","resumo":"Pesquisadores brasileiros desenvolveram uma tecnologia capaz de reduzir o uso de fosfato na composição de rações animais.\nA inovação alcançou produção em escala industrial no Paraná, oferecendo uma solução de menor custo para o agronegócio.\nO avanço contribui para a sustentabilidade ambiental ao otimizar insumos e diminuir o impacto da pecuária.","link":"https://www.canalrural.com.br/nacional/tecnologia-brasileira-reduz-uso-de-fosfato-em-racoes-e-ganha-escala-industrial-no-pr/","categoria":"AGROTECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"CEO da Nvidia Afirma que Setor de IA Não Necessita de Novas Regras de Segurança","resumo":"O CEO da Nvidia declarou publicamente que o setor de inteligência artificial não necessita de novas regulamentações de segurança.\nSegundo o executivo, as normas vigentes já atendem às demandas do mercado sem sufocar a inovação em larga escala.\nA posição contrapõe propostas globais que defendem regras mais severas para grandes modelos de linguagem.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/15/ceo-da-nvidia-diz-que-industria-de-ia-nao-precisa-de-novas-regras-de-seguranca.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"VEJA","pais":"Brasil","titulo":"Periferias de São Paulo Tornam-se Novas Fronteiras para Empresas de Tecnologia","resumo":"Empresas de tecnologia estão expandindo suas operações para bairros periféricos da cidade de São Paulo.\nA iniciativa busca democratizar o acesso à inovação, formar novos talentos regionais e descentralizar investimentos.\nA presença do setor tech nessas comunidades gera novos postos de trabalho e impulsiona a inclusão digital.","link":"https://veja.abril.com.br/economia/periferia-vira-nova-fronteira-das-empresas-de-tecnologia-em-sao-paulo/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"www.gov.br","pais":"Brasil","titulo":"Pesquisa da UFC Utiliza Tecnologia para Prevenir Quedas de Idosos","resumo":"Uma pesquisa da Universidade Federal do Ceará utiliza tecnologia assistiva para prevenir quedas em idosos.\nA ferramenta analisa padrões biomecânicos de movimento para identificar fragilidades e emitir alertas precoces.\nO projeto tem potencial para reduzir internações hospitalares e melhorar a qualidade de vida da população idosa.","link":"https://www.gov.br/mec/pt-br/assuntos/noticias/2026/setembro/pesquisa-da-ufc-usa-tecnologia-para-prevenir-quedas-de-idosos","categoria":"SAÚDE","lang":"pt"},{"fonte":"PT no Senado","pais":"Brasil","titulo":"Lula Sanciona o Redata para Impulsionar Data Centers e Inteligência Artificial no Brasil","resumo":"O presidente sancionou o Redata, programa que concede incentivos para o desenvolvimento de infraestrutura digital no Brasil.\nA medida visa atrair investimentos massivos para a construção de data centers e processamento de IA no país.\nA iniciativa consolida a posição do Brasil como um polo relevante na economia digital e no controle de dados.","link":"https://ptnosenado.org.br/presidente-lula-sanciona-o-redata-e-consolida-avanco-do-brasil-na-economia-digital-e-inteligencia-artificial/","categoria":"INFRAESTRUTURA","lang":"pt"},{"fonte":"Space","pais":"Estados Unidos","titulo":"Telescópio Espacial Roman da NASA dobra sua vida útil com manobra de alta precisão","resumo":"A NASA realizou com sucesso uma queima de motor superprecisa no Telescópio Espacial Roman, garantindo combustível suficiente para estender sua missão para até 22 anos.\nEssa manobra histórica dobra a capacidade operacional prevista do observatório no espaço profundo.\nO avanço permitirá uma coleta de dados astronômicos sem precedentes e estudos aprofundados sobre a energia escura e exoplanetas.","link":"https://www.space.com/astronomy/22-years-of-science-nasas-roman-space-telescope-doubles-its-lifetime-with-super-precise-engine-burn","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"Telescópio Webb da NASA revela panorama dinâmico de formação estelar","resumo":"O Telescópio Espacial James Webb capturou novas imagens detalhadas revelando o processo complexo e dinâmico de nascimento de estrelas no cosmos.\nOs dados em infravermelho permitiram aos astrônomos observar através da poeira estelar densa e mapear estruturas antes invisíveis.\nA descoberta oferece novos insights sobre a evolução das galáxias e a física da matéria no universo jovem.","link":"https://science.nasa.gov/missions/webb/nasas-webb-reveals-dynamic-panorama-of-star-formation/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ScienceDaily","pais":"Estados Unidos","titulo":"Forma por trás do problema de Einstein revela nova física surpreendente","resumo":"Pesquisadores descobriram que o padrão geométrico associado ao famoso problema do monotile de Einstein oculta propriedades físicas inesperadas.\nA análise da estrutura revelou comportamentos exóticos que desafiam os modelos atuais da física da matéria condensada.\nO achado abre novas fronteiras para o desenvolvimento de materiais avançados e para a compreensão de sistemas quânticos complexos.","link":"https://www.sciencedaily.com/releases/2026/09/260914102432.htm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Guardian","pais":"Estados Unidos","titulo":"CEO da Anthropic renova apelo por desaceleração da IA enquanto Nvidia prega aceleração","resumo":"O CEO da Anthropic voltou a defender uma abordagem mais cautelosa no desenvolvimento da inteligência artificial para mitigar riscos existenciais.\nEm contrapartida, a liderança da Nvidia sustenta que o avanço acelerado da tecnologia é essencial para a inovação global.\nO embate reflete a crescente divisão no setor de tecnologia sobre regulamentação, segurança e ritmo de implantação da IA.","link":"https://www.theguardian.com/technology/2026/sep/15/anthropic-nvidia-ceos-ai","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"O GLOBO","pais":"Estados Unidos","titulo":"Assessores de Trump reúnem-se com executivo da Anthropic para discutir segurança em IA","resumo":"Membros da equipe de assessores governamentais mantiveram conversas com lideranças da Anthropic para avaliar diretrizes de segurança em inteligência artificial.\nO encontro busca alinhar o avanço tecnológico com as prioridades de segurança nacional e competitividade econômica dos Estados Unidos.\nA iniciativa destaca a crescente centralidade das empresas de tecnologia nas decisões estratégicas do cenário político em Washington.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/15/assessores-de-trump-se-reunem-com-executivo-da-anthropic-para-discutir-seguranca-da-ia.ghtml","categoria":"POLÍTICA E TECNOLOGIA","lang":"pt"},{"fonte":"The Indian Express","pais":"Estados Unidos","titulo":"Presidente da FTC dos EUA desconfia de pedidos por isenções antitruste para IA","resumo":"A presidente da Comissão Federal de Comércio dos EUA expressou ceticismo sobre pedidos de grandes empresas para flexibilizar leis concorrenciais no setor de IA.\nSegundo a reguladora, a aceleração da inovação não deve servir de justificativa para a criação de monopólios ou práticas anticompetitivas.\nA declaração sinaliza uma fiscalização rigorosa sobre fusões, parcerias e investimentos de grande porte no mercado tecnológico.","link":"https://indianexpress.com/article/technology/tech-news-technology/us-ftc-chair-suspicious-of-calls-for-ai-antitrust-exemptions-10879831/","categoria":"REGULAMENTAÇÃO","lang":"pt"},{"fonte":"McKinsey \u0026 Company","pais":"Estados Unidos","titulo":"Relatório da McKinsey aponta as principais tendências de tecnologia para 2026","resumo":"A consultoria McKinsey publicou sua visão prospectiva sobre as tecnologias emergentes que moldarão a economia global nos próximos anos.\nO estudo destaca o impacto transformador da inteligência artificial generativa, computação quântica e arquiteturas de energia sustentável.\nA análise serve como um guia estratégico para empresas ajustarem seus investimentos e acompanharem o ritmo de transformação digital.","link":"https://www.mckinsey.com/capabilities/tech-and-ai/our-insights/the-top-trends-in-tech","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"WTVG","pais":"Estados Unidos","titulo":"Uso de satélite de alta resolução para rastrear ondas de tsunami","resumo":"Cientistas demonstraram a eficácia de satélites de alta resolução no monitoramento em tempo real do deslocamento de tsunamis pelos oceanos.\nA tecnologia permite medir a elevação do nível do mar com precisão milimétrica, aprimorando significativamente os sistemas de alerta precoce.\nEssa inovação promete salvar vidas e mitigar danos socioeconômicos em regiões costeiras vulneráveis a desastres naturais.","link":"https://www.13abc.com/2026/09/16/moment-science-using-high-resolution-satellite-track-tsunami-waves/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"França","titulo":"Mistral, empresa francesa de IA, acusa rivais de usarem regulação para obter vantagem de mercado","resumo":"A startup francesa de inteligência artificial Mistral acusou abertamente seus concorrentes norte-americanos de utilizarem exigências regulatórias como estratégia para erguer barreiras de entrada. A empresa defende que a regulamentação excessiva sufoca a inovação de modelos de código aberto na Europa. Essa disputa reflete a crescente tensão geopolítica e econômica em torno da soberania tecnológica e do desenvolvimento global de IA.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/15/mistral-empresa-francesa-de-ia-acusa-rivais-de-tentar-usar-regulacao-para-ganhar-vantagem-no-mercado.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Ouest-France","pais":"França","titulo":"OpenAI, Anthropic e Google trabalham em regulador de IA, mas projeto enfrenta impasse político","resumo":"Grandes líderes do setor de inteligência artificial, como OpenAI, Anthropic e Google, estão colaborando para estabelecer diretrizes de autorregulação e segurança para a tecnologia. No entanto, a iniciativa enfrenta duros obstáculos devido ao bloqueio político e ao desacordo entre governos sobre os limites legais da IA. A falta de consenso ameaça atrasar a criação de normas globais para o uso ético e seguro desses sistemas avançados.","link":"https://www.ouest-france.fr/high-tech/intelligence-artificielle/openai-anthropic-et-google-travaillent-a-un-regulateur-de-lia-projet-menace-par-un-blocage-politique-d61d8858-b159-11f1-bc32-13ddcee9efa7","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"mistral.ai","pais":"França","titulo":"Tornando a IA soberana e de pesos abertos a nova fronteira tecnológica","resumo":"O movimento em prol da inteligência artificial soberana e de modelos com pesos abertos está ganhando força como uma alternativa estratégica ao domínio das Big Techs. A abordagem busca garantir autonomia tecnológica para países e empresas, promovendo maior transparência e controle sobre os dados. Essa tendência promete redefinir a fronteira da inovação global ao permitir o desenvolvimento colaborativo e descentralizado.","link":"https://mistral.ai/news/mistral-makes-sovereign-open-weight-ai-to-frontier/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Franc-Tireur","pais":"França","titulo":"Economia: A inteligência artificial vai destruir empregos?","resumo":"O rápido avanço da inteligência artificial acendeu intensos debates sobre os impactos econômicos e a automação em massa no mercado de trabalho. Analistas e economistas avaliam se a tecnologia provocará um desemprego estrutural sem precedentes ou se abrirá novas oportunidades de produtividade. O debate envolve a necessidade urgente de requalificação profissional e de políticas públicas adaptadas a essa transição tecnológica.","link":"https://www.franc-tireur.fr/economie-lia-va-t-elle-nous-tuer","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Nice-Matin","pais":"França","titulo":"Startup de Mônaco quer permitir acesso seguro a contas através dos batimentos cardíacos","resumo":"Uma startup sediada em Mônaco desenvolveu uma tecnologia biométrica inovadora que utiliza o ritmo cardíaco único de cada indivíduo para autenticação de segurança. A solução promete substituir senhas e métodos tradicionais de verificação por um sistema altamente preciso e difícil de clonar. A novidade visa transformar a proteção de dados bancários e o acesso a sistemas críticos de forma prática e contínua.","link":"https://www.nicematin.com/societe/technologie/cette-start-up-de-monaco-veut-vous-faire-acceder-a-vos-comptes-en-toute-securite-grace-a-votre-coeur-10724173","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"Nord Littoral","pais":"França","titulo":"Danone expande investimentos em Steenvoorde com nova oficina de alta tecnologia","resumo":"A gigante alimentícia Danone anunciou a ampliação de suas instalações industriais em Steenvoorde por meio da criação de um espaço fabril de alta tecnologia. O projeto visa modernizar os processos produtivos, aumentar a eficiência energética e aplicar automação avançada na cadeia de suprimentos. O investimento reforça o compromisso com a inovação industrial e o desenvolvimento econômico da região francesa.","link":"https://www.nordlittoral.fr/297994/article/2026-09-16/danone-poursuit-son-investissement-steenvoorde-avec-un-atelier-de-haute","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Novo superporta-aviões americano deve ser entregue na primavera de 2027","resumo":"A Marinha dos Estados Unidos planeja colocar em operação o seu mais novo superporta-aviões de última geração na primavera de 2027. A embarcação conta com tecnologias militares de ponta, incluindo sistemas avançados de catapulta eletromagnética e defesa automatizada. O desdobramento dessa embarcação representa um marco no fortalecimento da capacidade de dissuasão estratégica e projeção de poder global.","link":"https://www.science-et-vie.com/technos-et-futur/defense/le-nouveau-super-porte-avions-americain-devrait-arriver-au-printemps-2027-258915.html","categoria":"DEFESA","lang":"pt"},{"fonte":"Ouest-France","pais":"França","titulo":"Nadador diabético tentará cruzar lago de montanha para fazer a ciência avançar","resumo":"O nadador bretão Yvan Derrien, portador de diabetes tipo 1, prepara-se para enfrentar o desafio de cruzar um lago de montanha sob condições extremas. A expedição servirá de plataforma para testes científicos focados no monitoramento da glicemia e do estresse fisiológico sob frio intenso. Os dados coletados durante a travessia devem contribuir para novas pesquisas em medicina esportiva e gestão do diabetes.","link":"https://www.ouest-france.fr/bretagne/quimperle-29300/je-tenterai-de-faire-avancer-la-science-le-nageur-diabetique-breton-yvan-derrien-sattaquera-a-un-lac-de-montagne-52f02a80-b0dc-11f1-978f-b3ea995ed274","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Yahoo Finance UK","pais":"Inglaterra","titulo":"Hong Kong revela plano para alinhar economia aos objetivos da China","resumo":"Hong Kong apresentou um novo plano estratégico para integrar sua economia de forma mais estreita com as metas da China.\nA iniciativa visa fortalecer a cooperação regional, atrair investimentos em inovação e consolidar o território como um hub global.\nEssa movimentação redefine o papel geopolítico e financeiro da região, aprofundando o alinhamento com as diretrizes de Pequim.","link":"https://uk.finance.yahoo.com/news/hong-kong-unveils-plan-align-053206316.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Matemático do Reino Unido desmistifica ilusões de ótica do Partenon","resumo":"Um matemático do Reino Unido desmistificou a famosa teoria de que o Partenon contém ilusões de ótica projetadas intencionalmente.\nPor meio de análises geométricas e modelagens digitais avançadas, o estudo revelou que as curvaturas eram escolhas puramente estruturais.\nA pesquisa reescreve a interpretação histórica da arquitetura grega e traz novas perspectivas sobre as técnicas da antiguidade.","link":"https://www.theguardian.com/science/2026/sep/16/uk-mathematician-debunks-myth-parthenon-optical-illusions","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Bloomberg.com","pais":"Inglaterra","titulo":"Investimentos em IA e data centers por multinacionais impulsionam a economia irlandesa","resumo":"Os crescentes aportes financeiros em inteligência artificial e data centers por multinacionais estão alavancando a economia da Irlanda.\nA expansão contínua da infraestrutura de nuvem atrai grandes volumes de capital estrangeiro e fortalece o ecossistema tecnológico local.\nO impacto consolida o país como um dos principais polos de processamento de dados da Europa na era da tecnologia avançada.","link":"https://www.bloomberg.com/news/articles/2026-09-15/ai-data-center-spending-by-multinationals-boosts-irish-economy","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"La Razón","pais":"Espanha","titulo":"Ex-pesquisador da Anthropic afirma que especialistas em IA estão comprando terras por medo da tecnologia","resumo":"Jacob Coxon, antigo pesquisador da Anthropic, revelou que diversos especialistas em inteligência artificial estão adquirindo terras por medo das tecnologias que criaram.\nA declaração reflete uma crescente preocupação ética e existencial entre os próprios profissionais do setor de tecnologia avançada.\nEsse movimento evidencia o debate urgente sobre o impacto transformador e os riscos associados ao avanço descontrolado da inteligência artificial no mundo.","link":"https://www.larazon.es/tecnologia-consumo/inteligencia-artificial/jacob-coxon-exinvestigador-anthropic-asegura-algunos-empleados-expertos-ia-estan-comprando-tierras-miedo-tecnologia-han-creado_202609166aa919a0e428ed29213fd491.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"antena3.com","pais":"Espanha","titulo":"Espanha incorpora tecnologia 3D pioneira para investigar o câncer e outras doenças","resumo":"A Espanha adotou uma inovadora tecnologia de modelagem tridimensional projetada para aprofundar as pesquisas sobre o câncer e diversas enfermidades complexas.\nA nova ferramenta permite aos cientistas analisar estruturas celulares e tecidos com um nível de precisão inédito na medicina.\nA iniciativa promete acelerar a descoberta de novos tratamentos e otimizar diagnósticos na área da saúde.\nTrata-se de um avanço científico crucial que consolida o país na vanguarda da pesquisa biomédica europeia.","link":"https://www.antena3.com/noticias/salud/espana-incorpora-tecnologia-3d-pionera-investigar-cancer-otras-enfermedades_202609156aa9a6c17486a40f2c9e427b.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Cadena SER","pais":"Espanha","titulo":"Lassalle reforça a importância de regular a IA: \"Foi feita para nos substituir\"","resumo":"O debate sobre a regulamentação da inteligência artificial ganhou novo impulso na Espanha após declarações contundentes de Lassalle sobre os perigos da automação irrestrita.\nO especialista enfatizou que a tecnologia atual tem sido desenvolvida com o propósito implícito de substituir capacidades humanas em diversos setores.\nA mensagem ressalta a urgência de estabelecer marcos jurídicos e éticos para garantir o uso seguro da IA.\nO alerta chama a atenção de governos e da sociedade para os impactos no mercado de trabalho.","link":"https://cadenaser.com/nacional/2026/09/15/lassalle-insiste-en-la-importancia-de-regular-la-ia-esta-hecha-para-sustituirnos-cadena-ser/?outputType=amp","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Infodefensa","pais":"Espanha","titulo":"Quantum Systems integra tecnologia Sigint da espanhola Centum em seus drones Reliant e Vector AI","resumo":"A empresa Quantum Systems anunciou a integração do sistema de inteligência de sinais da espanhola Centum em seus novos modelos de drones com inteligência artificial.\nA colaboração tecnológica fortalece a precisão operacional e a capacidade de monitoramento aéreo em missões estratégicas.\nO acordo destaca o ecossistema de inovação espanhol e seu papel em expansão na indústria global de defesa e autonomia.\nEssa união impulsiona novos padrões para o setor de veículos aéreos não tripulados.","link":"https://www.infodefensa.com/texto-diario/mostrar/6016141/quantum-systems-incorpora-tecnologia-sigint-espanola-centum-drones-reliant-vector-ai","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"ciencia.gob.es","pais":"Espanha","titulo":"Governo espanhol destina mais de 1,2 bilhão de euros para contratar pesquisadores e financiar projetos científicos","resumo":"O governo da Espanha aprovou um investimento histórico superior a 1,2 bilhão de euros voltado para o fortalecimento da ciência nacional.\nO montante será destinado à contratação de novos talentos e ao financiamento de projetos de pesquisa de alto impacto.\nO valor representa um salto expressivo em relação aos orçamentos de anos anteriores, visando conter a fuga de cérebros no país.\nA medida reforça a transição para uma economia baseada em conhecimento, inovação e soberania tecnológica.","link":"https://www.ciencia.gob.es/Noticias/2026/septiembre/gobierno-inversion-contratacion-personal-proyectos-investigacion.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"businessinsider.es","pais":"Espanha","titulo":"Economia da Irlanda ganha impulso graças aos investimentos em IA e centros de dados","resumo":"A economia irlandesa registrou um forte crescimento impulsionado por investimentos volumosos no setor de inteligência artificial e na expansão de centros de dados.\nO país reafirma sua posição como um dos principais hubs tecnológicos do continente europeu, atraindo gigantes globais da tecnologia.\nO fluxo constante de capital tem estimulado o ecossistema de inovação e a geração de empregos qualificados.\nContudo, o rápido crescimento também traz desafios na demanda energética e na infraestrutura nacional.","link":"https://www.businessinsider.es/economia/economia-irlanda-impulsa-inversion-ia-centros-datos_7037269_0.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"El Economista","pais":"Espanha","titulo":"Tecnologia para treinamento militar e simulação torna-se nova missão de institutos tecnológicos","resumo":"Institutos tecnológicos estão redirecionando esforços de pesquisa para criar sistemas avançados de simulação e treinamento militar.\nAs novas soluções utilizam tecnologia de ponta para recriar cenários táticos complexos de forma altamente realista e segura.\nO desenvolvimento abrange o uso de ambientes virtuais e inteligência artificial para otimizar o preparo de forças de defesa.\nA iniciativa reflete o crescimento das aplicações duplas da tecnologia civil no setor de segurança nacional.","link":"https://www.eleconomista.es/tecnologia/noticias/14014217/09/26/tecnologia-para-entrenamiento-militar-y-simulaciones-la-nueva-mision-de-los-institutos-tecnologicos.html","categoria":"DEFESA","lang":"pt"},{"fonte":"La Opinión A Coruña","pais":"Espanha","titulo":"Cambre torna-se palco da ciência na Espanha com a apresentação do Science on Stage","resumo":"O município de Cambre foi escolhido para sediar o prestigiado evento Science on Stage, reunindo educadores e cientistas de toda a Espanha.\nO encontro busca promover métodos inovadores no ensino das disciplinas de ciência, tecnologia, engenharia e matemática.\nDurante as apresentações, são demonstrados projetos pedagógicos e experiências práticas focados em inspirar novas gerações de pesquisadores.\nA iniciativa fortalece a divulgação científica e destaca a relevância da inovação na educação básica.","link":"https://www.laopinioncoruna.es/gran-coruna/2026/09/16/cambre-convierte-escenario-ciencia-espana-134321018.amp.html","categoria":"EDUCAÇÃO CIENTÍFICA","lang":"pt"},{"fonte":"FAZ","pais":"Alemanha","titulo":"Zeit AI: Tecnologia da Palantir para as Médias Empresas","resumo":"A Zeit AI está trazendo a avançada tecnologia de inteligência artificial da Palantir para as médias empresas na Alemanha.\nA iniciativa visa democratizar o acesso a ferramentas analíticas complexas e automatizadas para otimizar operações.\nEssa movimentação promete aumentar significativamente a competitividade da indústria tradicional alemã frente aos desafios globais.","link":"https://www.faz.net/premium/digitalwirtschaft/kuenstliche-intelligenz/zeit-ai-palantir-technologie-fuer-den-mittelstand-accg-201218897.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"FAZ","pais":"Alemanha","titulo":"Participação dos Salários Cai com a IA: O que Prevê Anton Korinek","resumo":"O economista Anton Korinek prevê uma queda contínua na participação dos salários na renda nacional devido ao avanço acelerado da IA.\nA automação de tarefas cognitivas deve redistribuir os ganhos econômicos majoritariamente para os detentores do capital tecnológico.\nEsse cenário alerta governos e instituições sobre a necessidade de novas políticas fiscais e sociais para mitigar desigualdades emergentes.","link":"https://www.faz.net/premium/digitalwirtschaft/kuenstliche-intelligenz/lohnquote-sinkt-durch-ki-was-anton-korinek-prognostiziert-accg-201224852.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"BR","pais":"Alemanha","titulo":"Podcast: Alta Tecnologia contra Incêndios Florestais – Detectar e Apagar Fogos Mais Rápido","resumo":"Tecnologias de ponta, como sensores IoT, inteligência artificial e drones, estão sendo mobilizadas na Alemanha para combater incêndios florestais.\nO uso dessas ferramentas inovadoras permite identificar focos de calor com rapidez e otimizar a resposta das equipes de emergência.\nA iniciativa destaca o impacto prático da inovação científica na proteção ambiental e na preservação da segurança pública.","link":"https://www.br.de/mediathek/podcast/iq-wissenschaft-und-forschung/hightech-gegen-waldbraende-feuer-schneller-erkennen-und-loeschen/2122137","categoria":"CIÊNCIA E TECNOLOGIA","lang":"pt"},{"fonte":"MONOist","pais":"Alemanha","titulo":"Hitachi Adquire Propriedade Intelectual de Tecnologia de Biometanação de Empresa Alemã","resumo":"A Hitachi adquiriu os direitos de propriedade intelectual de tecnologia de biometanação pertencentes a uma empresa alemã.\nA transação visa fortalecer o portfólio de soluções de energia limpa da gigante japonesa e acelerar a descarbonização industrial.\nEsse movimento reforça a posição da Alemanha como um hub estratégico de inovação em tecnologias verdes e sustentáveis.","link":"https://monoist.itmedia.co.jp/mn/articles/2609/16/news025.html","categoria":"ENERGIA LIMPA","lang":"pt"},{"fonte":"Tata Consultancy Services","pais":"Alemanha","titulo":"TCS Acelera Transformação Tecnológica Guiada por IA no Banco Alemão Aareal Bank","resumo":"A Tata Consultancy Services firmou uma parceria estratégica com o Aareal Bank da Alemanha para modernizar sua infraestrutura digital.\nO projeto foca no uso de inteligência artificial para otimizar operações bancárias, melhorar a experiência dos clientes e garantir maior segurança.\nA iniciativa reflete a forte tendência de automação e transformação tecnológica impulsionando o setor financeiro europeu.","link":"https://www.tcs.com/who-we-are/newsroom/press-release/tcs-accelerate-ai-led-technology-transformation-germany-aareal-bank","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"bild.de","pais":"Alemanha","titulo":"Carta Urgente para von der Leyen: Setor Econômico Alerta que a China Está Comprando o Mittelstand","resumo":"Líderes econômicos alemães enviaram um alerta urgente à Comissão Europeia sobre a compra acelerada de médias empresas por capitais chineses.\nO documento adverte para os riscos de perda de soberania, ativos tecnológicos estratégicos e conhecimentos industriais críticos da região.\nA mobilização pressiona por regulações mais rigorosas no bloco para proteger ecossistemas de inovação e tecnologias nacionais.","link":"https://www.bild.de/politik/inland/brandbrief-an-von-der-leyen-wirtschaft-warnt-china-kauft-unseren-mittelstand-auf-6aa8d774250f8ce245e4d0ec","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"NHK Spring apresentará tecnologias de união avançadas na SEMICON India 2026 para expandir no mercado de semicondutores","resumo":"A fabricante japonesa NHK Spring (Nippatsu) anunciou sua participação na exposição SEMICON India 2026, visando fortalecer sua presença no crescente setor de semicondutores.\nA empresa apresentará soluções inovadoras baseadas em tecnologia de união de alta precisão, essenciais para a fabricação de chips avançados.\nEssa iniciativa busca expandir seus negócios internacionais e consolidar parcerias estratégicas no mercado sul-asiático.","link":"https://news.yahoo.co.jp/articles/8ce0a303950e7365cf642512e1bf323ab5dcd198","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"産経ニュース","pais":"Japão","titulo":"Liderando o mundo com estratégia de PI: O equilíbrio entre sigilo e padronização tecnológica","resumo":"O presidente da Organização Japonesa de Informações sobre Patentes destacou a importância de uma estratégia nacional robusta de propriedade intelectual para manter a competitividade global.\nO modelo proposto combina a proteção rigorosa do conhecimento técnico confidencial com a padronização internacional de tecnologias essenciais.\nEssa abordagem visa fortalecer o ecossistema de inovação do Japão e proteger suas indústrias de ponta contra a concorrência predatória.","link":"https://www.sankei.com/article/20260916-JPQZ5NJYEBOLXCHHPWBHWTZV6M/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Cientistas desenvolvem tecnologia para conter reações imunológicas descontroladas","resumo":"Pesquisadores japoneses desenvolveram uma nova tecnologia capaz de reprimir tempestades de citocinas e reações imunológicas excessivas no corpo humano.\nA descoberta promete abrir novas vias terapêuticas para o tratamento de uma ampla variedade de doenças inflamatórias graves e autoimunes.\nO avanço representa um passo significativo para a medicina de precisão, aumentando a segurança e a eficácia de tratamentos imunológicos.","link":"https://news.yahoo.co.jp/articles/4a2f88deedbb8ab14adbfac5aee5ab4650df7f28","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Digital PR Platform","pais":"Japão","titulo":"Macnica apresenta conceito do 'MACNICA Green Tech Messe' para a GREEN×EXPO 2027","resumo":"A empresa de tecnologia Macnica revelou os detalhes de sua participação na GREEN×EXPO 2027, destacando um centro de exibição focado em tecnologias do futuro.\nA iniciativa apresentará soluções de descarbonização, energia renovável e automação voltadas para a sustentabilidade urbana.\nO projeto visa conectar inovações tecnológicas globais a desafios ambientais, promovendo a transformação verde no setor industrial.","link":"https://digitalpr.jp/r/143723","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"自動運転ラボ","pais":"Japão","titulo":"Empresa de Tóquio aproxima-se do nível da Tesla em tecnologia de condução autônoma","resumo":"Uma startup de tecnologia sediada no distrito de Ota, em Tóquio, atingiu marcos decisivos no desenvolvimento de sistemas de condução autônoma avançados.\nA tecnologia desenvolvida se aproxima dos níveis de desempenho e confiabilidade observados nos veículos da Tesla, chamando a atenção da indústria automotiva.\nO progresso impulsiona o ecossistema tecnológico local e reforça a capacidade do Japão de rivalizar com gigantes globais do setor.","link":"https://jidounten-lab.com/u_67748","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"tokyu.co.jp","pais":"Japão","titulo":"Linha Toyoko adota sistema de inteligência artificial para auxiliar maquinistas no fechamento de portas","resumo":"A operadora ferroviária introduziu um sistema de monitoramento por IA nas estações da linha Toyoko para auxiliar os condutores em operações de trem com operador único.\nA tecnologia analisa imagens em tempo real para verificar a segurança da plataforma e orientar a decisão de fechamento das portas.\nA medida visa reforçar a segurança dos passageiros e otimizar os custos operacionais através da transformação digital no transporte público.","link":"https://www.tokyu.co.jp/company/news/detail/61901.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"SNBL obtém certificação SBTi para metas de redução de gases de efeito estufa","resumo":"A empresa Shin Nippon Biomedical Laboratories (SNBL) recebeu a validação formal da iniciativa Science Based Targets (SBTi) para suas metas de redução de emissões de carbono.\nO reconhecimento confirma que os objetivos ambientais da corporação estão alinhados com a ciência climática para conter o aquecimento global.\nA conquista fortalece a reputação ESG da empresa e acelera sua transição para operações de menor impacto ambiental.","link":"https://www.nikkei.com/nkd/disclosure/tdnr/20260828527609/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"日经中文网","pais":"Japão","titulo":"O analista japonês de confiança do 'Czar Econômico' da China, Zhu Rongji","resumo":"Um relatório aborda as relações históricas e a influência de consultores japoneses no desenvolvimento das reformas econômicas impulsionadas por Zhu Rongji na China.\nA análise destaca a cooperação técnica e econômica entre as duas nações em momentos estratégicos de modernização industrial.\nA história ilustra a importância do intercâmbio de conhecimento e do diálogo técnico para a estabilidade e o crescimento regional.","link":"https://cn.nikkei.com/columnviewpoint/column/64019-2026-09-16-05-00-51.html","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Modelo de IA descobre proteína \"invisível\" TM184C no corpo humano","resumo":"Um novo modelo de inteligência artificial permitiu a pesquisadores identificar a proteína TM184C, anteriormente considerada \"invisível\" no corpo humano.\nA descoberta representa um avanço significativo na biologia estrutural ao revelar o papel crucial da proteína em processos celulares complexos.\nA utilização de algoritmos avançados abre caminho para o rápido mapeamento de outras estruturas proteicas desconhecidas.\nEsse avanço pode acelerar significativamente o desenvolvimento de novas terapias e medicamentos direcionados.","link":"https://news.sciencenet.cn/htmlnews/2026/9/571550.shtm","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"厦门大学新闻网","pais":"China","titulo":"Equipe do acadêmico Zhang Rong publica avanço em fotônica na Nature Photonics","resumo":"A equipe do acadêmico Zhang Rong publicou um artigo de alto impacto no prestigiado periódico Nature Photonics.\nO estudo apresenta avanços fundamentais no campo do controle de luz e de dispositivos optoeletrônicos de última geração.\nA pesquisa destaca a capacidade da China de liderar inovações em física aplicada e semicondutores fotônicos.\nOs resultados prometem aumentar drasticamente a eficiência no processamento de dados em futuras redes ópticas.","link":"https://news.xmu.edu.cn/info/1045/535072.htm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"新浪新闻_手机新浪网","pais":"China","titulo":"Manufatura de alta tecnologia lidera e robôs migram dos testes para fábricas e lares","resumo":"O setor de manufatura de alta tecnologia na China continua a liderar o crescimento industrial, impulsionado pela rápida expansão da robótica.\nOs robôs inteligentes estão deixando de ser meras demonstrações de laboratório para assumir papéis práticos em fábricas e residências.\nEsse movimento reflete o amadurecimento das cadeias de suprimento e da inteligência artificial aplicada à automação.\nA transição fortalece a produtividade industrial e acelera a adoção da robótica comercial e de consumo.","link":"https://news.sina.com.cn/zx/gj/2026-09-16/doc-iniryzmc4912805.shtml","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"观点网","pais":"China","titulo":"Kuang-Chi Technologies: Negócio de drones transita para a fase de comercialização","resumo":"A Kuang-Chi Technologies anunciou que suas operações no setor de drones avançaram oficialmente para a comercialização em larga escala.\nA mudança indica que os sistemas aéreos não tripulados da companhia atingiram maturidade operacional e viabilidade de mercado.\nCom pedidos crescentes e novas aplicações industriais, a empresa consolida sua posição na indústria aeroespacial de ponta.\nA transição destaca a rápida expansão da economia de baixa altitude no ecossistema tecnológico chinês.","link":"https://www.guandian.cn/article/20260916/602320.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"新浪军事","pais":"China","titulo":"Fórum de Economia Inteligente 2026 é realizado em Pequim","resumo":"O Fórum de Economia Inteligente 2026 reuniu líderes da indústria, acadêmicos e formuladores de políticas em Pequim.\nOs debates focaram na integração de modelos de inteligência artificial com indústrias tradicionais e infraestruturas em nuvem.\nO evento destacou estratégias para acelerar a produtividade digital e promover ecossistemas de inovação sustentáveis.\nEspecialistas enfatizaram a importância de padrões globais e governança para garantir o desenvolvimento ético do setor.","link":"https://mil.news.sina.com.cn/2026-09-16/doc-iniryzkw6614454.shtml","categoria":"ECONOMIA DIGITAL","lang":"pt"},{"fonte":"DW.com","pais":"China","titulo":"Pequim faz alerta sobre riscos da inteligência artificial","resumo":"Autoridades em Pequim emitiram alertas formais sobre os crescentes riscos associados à proliferação de inteligências artificiais.\nEspecialistas apontam que a manutenção da segurança política, estabilidade social e proteção de dados são as prioridades do governo.\nO posicionamento sinaliza uma fiscalização regulatória mais rígida sobre desenvolvedores de modelos generativos de grande escala.\nA medida busca equilibrar a liderança tecnológica do país com mecanismos estritos de salvaguarda.","link":"https://amp.dw.com/zh/%E5%8C%97%E4%BA%AC%E8%AD%A6%E5%91%8A%E4%BA%BA%E5%B7%A5%E6%99%BA%E8%83%BD%E9%A3%8E%E9%99%A9-%E4%B8%93%E5%AE%B6%E6%94%BF%E6%B2%BB%E5%AE%89%E5%85%A8%E6%98%AF%E5%85%B6%E9%A6%96%E8%A6%81%E5%85%B3%E5%88%87/a-79280247","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"中国网","pais":"China","titulo":"Academia Chinesa de Ciências lança nova revista sobre Ciência do Sistema Terrestre Trans-Himalaia","resumo":"A Academia Chinesa de Ciências apresentou o periódico em inglês \"Trans-Himalayan Earth System Science\".\nA publicação visa criar uma plataforma acadêmica internacional para pesquisas multidisciplinares na região do Himalaia e do Planalto Tibetano.\nO periódico cobrirá temas vitais como mudanças climáticas, dinâmicas geológicas e conservação da biodiversidade.\nA iniciativa busca fortalecer a cooperação científica global em uma das áreas ecologicamente mais sensíveis do planeta.","link":"http://ydyl.china.com.cn/2026-09/16/content_118698555.shtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"nda.gov.cn","pais":"China","titulo":"Fórum de Economia Digital da OCS 2026 abre com cooperação em mais de dez áreas","resumo":"A abertura do Fórum de Economia Digital da Organização para Cooperação de Xangai (OCS) revelou uma lista de projetos colaborativos.\nAs parcerias cobrem mais de dez setores estratégicos, incluindo infraestrutura 5G, inteligência artificial e cidades inteligentes.\nO encontro busca fortalecer a conectividade regional e acelerar a transformação digital entre os países membros.\nO alinhamento tecnológico promete impulsionar novas rotas comerciais e cadeias de suprimento digitais integradas.","link":"https://www.nda.gov.cn/sjj/swdt/mtsy/0915/20260915205316444356432_pc.html","categoria":"ECONOMIA DIGITAL","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Índia","titulo":"Suzuki apresenta a moto esportiva Gixxer modelo 2027 na Índia","resumo":"A Suzuki anunciou oficialmente na Índia o modelo 2027 da sua popular moto esportiva Gixxer, alinhada com as tendências do mercado europeu.\nO veículo se destaca pelo preço acessível de aproximadamente 220 mil ienes e traz aprimoramentos no design e na eficiência.\nA novidade reforça a relevância estratégica do mercado indiano para a fabricante japonesa no segmento de duas rodas.","link":"https://news.yahoo.co.jp/articles/da3a34b9b028030e622164841b157eedabf061f5","categoria":"MOBILIDADE","lang":"pt"},{"fonte":"Investing.com India","pais":"Índia","titulo":"Por que as ações da Contemporary Amperex Technology estão caindo hoje?","resumo":"As ações da Contemporary Amperex Technology Co. Ltd. (CATL), maior fabricante mundial de baterias para veículos elétricos, apresentaram queda no mercado financeiro global.\nO movimento reflete incertezas dos investidores quanto à demanda por componentes de eletromobilidade e ajustes de margem na cadeia de suprimentos.\nA oscilação é monitorada de perto por impactar diretamente o setor de tecnologia limpa e transição energética.","link":"https://in.investing.com/news/stock-market-news/why-is-contemporary-amperex-technology-stock-sliding-today-93CH-5594451","categoria":"MERCADO TECNOLÓGICO","lang":"pt"},{"fonte":"GK Today","pais":"Índia","titulo":"Fórum Mundial de Economia Circular 2026 tem início em Gandhinagar","resumo":"A cidade de Gandhinagar, na Índia, deu início ao Fórum Mundial de Economia Circular 2026, reunindo líderes globais, cientistas e formuladores de políticas públicas.\nO evento debate soluções inovadoras para a redução de resíduos, reciclagem industrial e modelos de negócios sustentáveis.\nA conferência posiciona a Índia no centro das discussões globais sobre desenvolvimento sustentável e transição ecológica.","link":"https://www.gktoday.in/world-circular-economy-forum-2026-begins-in-gandhinagar/","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"Rediff MoneyWiz","pais":"Índia","titulo":"Índia impulsiona o crescimento global e recebe elogios do FMI","resumo":"Representantes do Fundo Monetário Internacional (FMI) destacaram o papel decisivo da economia indiana no ritmo de expansão global.\nO país tem se consolidado como um dos principais motores de desenvolvimento devido a investimentos maciços em infraestrutura e digitalização.\nA avaliação positiva reforça a atratividade da Índia para investimentos estrangeiros em tecnologia e inovação.","link":"https://money.rediff.com/news/market/india-drives-global-growth-imf-official-praises-economy/54404220260916","categoria":"ECONOMIA DIGITAL","lang":"pt"},{"fonte":"Nasscom","pais":"Índia","titulo":"Tendências emergentes de Data Centers na economia digital da Índia","resumo":"A expansão acelerada da economia digital na Índia está impulsionando novas tendências na construção e operação de infraestruturas de data centers.\nCom o avanço do consumo de dados, inteligência artificial e serviços em nuvem, o setor busca soluções focadas em eficiência energética.\nEsse movimento posiciona o país como um polo estratégico regional para o armazenamento e processamento de dados.","link":"https://community.nasscom.in/communities/it-services/emerging-data-center-trends-indias-digital-economy","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Hindu","pais":"Índia","titulo":"Exércitos da Índia e dos EUA iniciam exercício 'Yudh Abhyas' com foco em tecnologia","resumo":"Os exércitos da Índia e dos Estados Unidos deram início ao treinamento militar conjunto 'Yudh Abhyas', priorizando a integração de novas tecnologias e interoperabilidade tática.\nA iniciativa visa aprimorar o uso de sistemas avançados de defesa, inteligência e comunicação em cenários operacionais complexos.\nO exercício fortalece a cooperação estratégica entre as duas nações no setor de inovação e segurança regional.","link":"https://www.thehindu.com/news/national/india-us-armies-begin-yudh-abhyas-with-focus-on-technology-interoperability/article71469165.ece","categoria":"DEFESA TECNOLÓGICA","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"Índia reafirma compromisso com a economia circular em fórum mundial","resumo":"Durante o Fórum Mundial de Economia Circular, o Ministro do Meio Ambiente da Índia reafirmou o compromisso do país com práticas de desenvolvimento sustentável.\nO governo indiano destacou estratégias para a integração de tecnologias verdes, reciclagem de resíduos eletrônicos e preservação de recursos.\nO discurso reforça as metas ambientais e científicas do país para conter os impactos das mudanças climáticas globais.","link":"https://newsonair.gov.in/world-circular-economy-forum-2026-to-begin-today-at-gandhinagar-in-gujarat/","categoria":"CIÊNCIA AMBIENTAL","lang":"pt"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Ataque cibernético à MEO que saturou a rede em Portugal teve três fases","resumo":"O recente ataque de negação de serviço (DDoS) contra a operadora MEO provocou instabilidade generalizada nos serviços de telecomunicações em Portugal.\nEspecialistas apontam que a ofensiva ocorreu em três fases distintas e altamente coordenadas para maximizar a saturação da infraestrutura de rede.\nO incidente acendeu o alerta sobre a vulnerabilidade das redes críticas nacionais e a necessidade urgente de reforçar as defesas cibernéticas no país.","link":"https://www.cmjornal.pt/tecnologia/detalhe/ataque-a-meo-teve-tres-fases","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Allianz Trade: Economia global \"a três velocidades\" coloca IA, defesa e energia na liderança","resumo":"Um novo relatório da Allianz Trade revela que o crescimento econômico mundial está avançando em velocidades distintas dependendo da região e do setor.\nAs tecnologias de Inteligência Artificial, a indústria de defesa e o setor energético emergem como os principais motores desse desenvolvimento global.\nA análise destaca o impacto transformador da automação avançada no aumento da produtividade e na reconfiguração dos mercados financeiros internacionais.","link":"https://jornaleconomico.sapo.pt/noticias/allianz-trade-economia-global-a-tres-velocidades-com-ia-defesa-e-energia-a-frente-do-crescimento/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Motor24","pais":"Portugal","titulo":"Volvo EX30 ganha tecnologia bidirecional para alimentar dispositivos externos","resumo":"O modelo elétrico Volvo EX30 recebeu uma atualização tecnológica que introduz o carregamento bidirecional (V2L), permitindo transformar o veículo em uma fonte de energia móvel.\nCom essa novidade, a bateria do carro passa a fornecer eletricidade para eletrodomésticos, ferramentas e outros dispositivos em situações de emergência ou ao ar livre.\nA inovação reforça a transição para ecossistemas de mobilidade mais integrados e sustentáveis.","link":"https://motor24.pt/motor/volvo-ex30-ganha-tecnologia-bidirecional-e-passa-a-fornecer-energia-a-dispositivos-externos","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"tek.sapo.pt","pais":"Portugal","titulo":"Geração STEM .PT oferece bolsas de 5 mil euros para incentivar mulheres na ciência e tecnologia","resumo":"O programa Geração STEM .PT lançou uma nova iniciativa de incentivo que disponibiliza bolsas no valor de 5 mil euros destinadas ao talento feminino.\nA medida busca promover a igualdade de gênero e atrair mais jovens estudantes para carreiras nas áreas de ciência, tecnologia, engenharia e matemática em Portugal.\nAlém do apoio financeiro, o projeto prevê mentoria e oportunidades de desenvolvimento profissional para as participantes.","link":"https://tek.sapo.pt/expert/artigos/geracao-stem-pt-tem-bolsas-de-5-mil-euros-para-apoiar-o-talento-feminino-nas-areas-da-ciencia-e-tecnologia/","categoria":"CIÊNCIA E TECNOLOGIA","lang":"pt"},{"fonte":"Pplware","pais":"Portugal","titulo":"SNS completa 47 anos: como a tecnologia transformou a saúde pública","resumo":"No aniversário de 47 anos do Serviço Nacional de Saúde (SNS) de Portugal, destaca-se o papel fundamental da digitalização e das novas tecnologias na modernização do atendimento médico.\nFerramentas de telemedicina, sistemas centralizados de dados e diagnósticos auxiliados por inteligência artificial têm otimizado a gestão de pacientes.\nEssas inovações têm garantido maior eficiência no acompanhamento clínico e ampliado o acesso aos cuidados essenciais.","link":"https://pplware.sapo.pt/high-tech/sns-faz-47-anos-como-a-tecnologia-transformou-a-saude-publica/","categoria":"SAÚDE E TECNOLOGIA","lang":"pt"},{"fonte":"El Trapezio","pais":"Portugal","titulo":"«Tipo o Quê…»: Novo canal digital aproxima ciência e saúde dos jovens","resumo":"Foi lançado o canal digital «Tipo o Quê…», uma plataforma criada para simplificar conceitos complexos de ciência e saúde para o público jovem.\nCom uma linguagem acessível e dinâmicas interativas nas redes sociais, o projeto visa combater a desinformação e promover o letramento científico.\nA iniciativa conta com o apoio de especialistas e pesquisadores para traduzir descobertas acadêmicas em conteúdos envolventes.","link":"https://eltrapezio.eu/es/2026/09/15/tipo-o-que-novo-canal-digital-quer-aproximar-ciencia-e-saude-dos-jovens/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Cinema antecipou os riscos e dilemas da Inteligência Artificial","resumo":"Um estudo analisa como as produções cinematográficas ao longo das décadas previram muitos dos debates éticos e riscos associados à Inteligência Artificial moderna.\nDesde sistemas autônomos fora de controle até os dilemas da consciência artificial, a ficção científica serviu como um alerta antecipado para a sociedade.\nEspecialistas utilizam essas referências culturais para discutir a regulamentação e o impacto da tecnologia no futuro humano.","link":"https://www.cmjornal.pt/tecnologia/detalhe/cinema-antecipou-riscos-da-inteligencia-artificial","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Gazeta Rural","pais":"Portugal","titulo":"Vila Verde torna-se laboratório europeu de economia circular","resumo":"O município de Vila Verde foi selecionado para atuar como um laboratório vivo europeu focado no desenvolvimento de práticas sustentáveis e economia circular.\nO projeto testará novas tecnologias de reutilização de materiais, gestão eficiente de resíduos e redução da pegada de carbono na região.\nA iniciativa posiciona Portugal na vanguarda da inovação ambiental e atrai investimentos internacionais voltados para a sustentabilidade.","link":"https://gazetarural.com/vila-verde-torna-se-laboratorio-europeu-da-economia-circular/","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"G1","pais":"Brazil","titulo":"Why There Is Fear of AI Ending Humanity and What the Real Risks Are","resumo":"The debate over the existential risks of artificial intelligence has gained prominence among scientists and tech industry leaders.\nConcerns regarding autonomous system control and ethical impacts are driving global discussions on regulation.\nAn analysis of real scenarios seeks to balance innovation with the prevention of threats to human safety.","link":"https://g1.globo.com/tecnologia/noticia/2026/09/16/por-que-ha-o-temor-sobre-ia-acabar-com-a-humanidade-e-existe-mesmo-o-risco.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Lula Signs Incentives for Critical Mineral Production in Brazil","resumo":"The Brazilian government has enacted tax incentives to boost the production and processing of critical minerals in the country.\nThe measure strengthens the supply chain for semiconductors, batteries, and energy transition technologies.\nThe incentive aims to attract strategic investments and reduce foreign dependence on technological inputs.","link":"https://oglobo.globo.com/economia/noticia/2026/09/16/lula-sanciona-incentivos-para-ampliar-producao-e-processamento-de-minerais-criticos-no-brasil.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Terra","pais":"Brazil","titulo":"Ford Files Patent for Innovative Pickup Truck Technology","resumo":"Ford has registered a new patent focused on optimizing functionality and space utilization in pickup truck beds.\nThe solution uses automation and sensors to improve cargo transport and vehicle versatility.\nThe innovation reinforces the trend toward integrating automotive hardware with smart systems in the sector.","link":"https://www.terra.com.br/mobilidade/carros/ford-patenteia-tecnologia-que-pode-revolucionar-as-picapes,3db3570460b3fb76f8daed212a5f67532ycabkqu.html","categoria":"INNOVATION","lang":"en"},{"fonte":"Canal Rural","pais":"Brazil","titulo":"Brazilian Technology Reduces Phosphate Use in Animal Feed and Scales Up in Paraná","resumo":"Brazilian researchers have developed a technology capable of reducing phosphate use in animal feed compositions.\nThe innovation has reached industrial-scale production in Paraná, offering a lower-cost solution for agribusiness.\nThe advancement contributes to environmental sustainability by optimizing inputs and lessening the impact of livestock farming.","link":"https://www.canalrural.com.br/nacional/tecnologia-brasileira-reduz-uso-de-fosfato-em-racoes-e-ganha-escala-industrial-no-pr/","categoria":"AGRITECH","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Nvidia CEO States That the AI Sector Does Not Need New Safety Rules","resumo":"The CEO of Nvidia publicly declared that the artificial intelligence sector does not require new safety regulations.\nAccording to the executive, current standards already meet market demands without stifling large-scale innovation.\nThe stance runs counter to global proposals advocating for stricter rules for large language models.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/15/ceo-da-nvidia-diz-que-industria-de-ia-nao-precisa-de-novas-regras-de-seguranca.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"VEJA","pais":"Brazil","titulo":"Outlying Neighborhoods of São Paulo Become New Frontiers for Tech Companies","resumo":"Tech companies are expanding their operations into the peripheral neighborhoods of São Paulo.\nThe initiative seeks to democratize access to innovation, train new regional talent, and decentralize investments.\nThe tech sector's presence in these communities creates new jobs and drives digital inclusion.","link":"https://veja.abril.com.br/economia/periferia-vira-nova-fronteira-das-empresas-de-tecnologia-em-sao-paulo/","categoria":"BUSINESS","lang":"en"},{"fonte":"www.gov.br","pais":"Brazil","titulo":"UFC Research Uses Technology to Prevent Falls in the Elderly","resumo":"Research from the Federal University of Ceará utilizes assistive technology to prevent falls among older adults.\nThe tool analyzes biomechanical movement patterns to identify vulnerabilities and issue early warnings.\nThe project has the potential to reduce hospital admissions and improve the quality of life for the elderly population.","link":"https://www.gov.br/mec/pt-br/assuntos/noticias/2026/setembro/pesquisa-da-ufc-usa-tecnologia-para-prevenir-quedas-de-idosos","categoria":"HEALTH","lang":"en"},{"fonte":"PT no Senado","pais":"Brazil","titulo":"Lula Enacts Redata to Boost Data Centers and Artificial Intelligence in Brazil","resumo":"The president has enacted Redata, a program that grants incentives for the development of digital infrastructure in Brazil.\nThe measure aims to attract massive investments for the construction of data centers and AI processing in the country.\nThe initiative solidifies Brazil's position as a relevant hub in the digital economy and data governance.","link":"https://ptnosenado.org.br/presidente-lula-sanciona-o-redata-e-consolida-avanco-do-brasil-na-economia-digital-e-inteligencia-artificial/","categoria":"INFRASTRUCTURE","lang":"en"},{"fonte":"Space","pais":"United States","titulo":"NASA's Roman Space Telescope Doubles Its Lifespan with High-Precision Maneuver","resumo":"NASA successfully performed a super-precise engine burn on the Roman Space Telescope, securing enough fuel to extend its mission up to 22 years.\nThis historic maneuver doubles the observatory's projected operational capacity in deep space.\nThe breakthrough will allow for unprecedented astronomical data collection and in-depth studies on dark energy and exoplanets.","link":"https://www.space.com/astronomy/22-years-of-science-nasas-roman-space-telescope-doubles-its-lifetime-with-super-precise-engine-burn","categoria":"SCIENCE","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"United States","titulo":"NASA's Webb Telescope Reveals Dynamic Star-Forming Panorama","resumo":"The James Webb Space Telescope has captured new detailed images revealing the complex and dynamic process of star birth in the cosmos.\nInfrared data allowed astronomers to peer through dense stellar dust and map previously invisible structures.\nThe discovery offers fresh insights into galaxy evolution and the physics of matter in the early universe.","link":"https://science.nasa.gov/missions/webb/nasas-webb-reveals-dynamic-panorama-of-star-formation/","categoria":"SCIENCE","lang":"en"},{"fonte":"ScienceDaily","pais":"United States","titulo":"Shape Behind the Einstein Problem Reveals Surprising New Physics","resumo":"Researchers have discovered that the geometric pattern associated with the famous Einstein monotile problem conceals unexpected physical properties.\nAnalysis of the structure revealed exotic behaviors that challenge current models of condensed matter physics.\nThe finding opens new frontiers for the development of advanced materials and the understanding of complex quantum systems.","link":"https://www.sciencedaily.com/releases/2026/09/260914102432.htm","categoria":"SCIENCE","lang":"en"},{"fonte":"The Guardian","pais":"United States","titulo":"Anthropic CEO Renews Call for AI Slowdown While Nvidia Preaches Acceleration","resumo":"The CEO of Anthropic has once again advocated for a more cautious approach to artificial intelligence development to mitigate existential risks.\nConversely, Nvidia's leadership maintains that the rapid advancement of the technology is essential for global innovation.\nThe clash reflects a growing divide within the tech sector over regulation, safety, and the pace of AI deployment.","link":"https://www.theguardian.com/technology/2026/sep/15/anthropic-nvidia-ceos-ai","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"O GLOBO","pais":"United States","titulo":"Trump Aides Meet with Anthropic Executive to Discuss AI Safety","resumo":"Members of the government advisory team held discussions with Anthropic leadership to evaluate artificial intelligence safety guidelines.\nThe meeting seeks to align technological advancement with U.S. national security priorities and economic competitiveness.\nThe initiative highlights the growing centrality of tech companies in the strategic decision-making of Washington's political landscape.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/15/assessores-de-trump-se-reunem-com-executivo-da-anthropic-para-discutir-seguranca-da-ia.ghtml","categoria":"POLITICS AND TECHNOLOGY","lang":"en"},{"fonte":"The Indian Express","pais":"United States","titulo":"US FTC Chair Wary of Calls for AI Antitrust Exemptions","resumo":"The chair of the U.S. Federal Trade Commission has expressed skepticism regarding requests from major companies to loosen competition laws in the AI sector.\nAccording to the regulator, accelerated innovation should not serve as justification for creating monopolies or anticompetitive practices.\nThe statement signals rigorous scrutiny over large-scale mergers, partnerships, and investments in the tech market.","link":"https://indianexpress.com/article/technology/tech-news-technology/us-ftc-chair-suspicious-of-calls-for-ai-antitrust-exemptions-10879831/","categoria":"REGULATION","lang":"en"},{"fonte":"McKinsey \u0026 Company","pais":"United States","titulo":"McKinsey Report Outlines Top Tech Trends for 2026","resumo":"Management consultancy McKinsey has published its forward-looking perspective on the emerging technologies that will shape the global economy in the coming years.\nThe study highlights the transformative impact of generative artificial intelligence, quantum computing, and sustainable energy architectures.\nThe analysis serves as a strategic guide for companies to adjust their investments and keep pace with the digital transformation.","link":"https://www.mckinsey.com/capabilities/tech-and-ai/our-insights/the-top-trends-in-tech","categoria":"TRENDS","lang":"en"},{"fonte":"WTVG","pais":"United States","titulo":"Using high-resolution satellites to track tsunami waves","resumo":"Scientists have demonstrated the effectiveness of high-resolution satellites in real-time monitoring of tsunami displacement across the oceans. The technology allows sea-level elevation to be measured with millimeter precision, significantly improving early warning systems. This innovation promises to save lives and mitigate socioeconomic damage in coastal regions vulnerable to natural disasters.","link":"https://www.13abc.com/2026/09/16/moment-science-using-high-resolution-satellite-track-tsunami-waves/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"O GLOBO","pais":"France","titulo":"Mistral, French AI company, accuses rivals of using regulation to gain market advantage","resumo":"French artificial intelligence startup Mistral has openly accused its North American competitors of using regulatory requirements as a strategy to build barriers to entry. The company argues that excessive regulation stifles open-source model innovation in Europe. This dispute reflects growing geopolitical and economic tension surrounding technological sovereignty and global AI development.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/15/mistral-empresa-francesa-de-ia-acusa-rivais-de-tentar-usar-regulacao-para-ganhar-vantagem-no-mercado.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Ouest-France","pais":"France","titulo":"OpenAI, Anthropic, and Google working on AI regulator, but project faces political impasse","resumo":"Major artificial intelligence industry leaders, such as OpenAI, Anthropic, and Google, are collaborating to establish self-regulation and safety guidelines for the technology. However, the initiative faces severe hurdles due to political gridlock and disagreements among governments regarding the legal limits of AI. The lack of consensus threatens to delay the creation of global standards for the ethical and safe use of these advanced systems.","link":"https://www.ouest-france.fr/high-tech/intelligence-artificielle/openai-anthropic-et-google-travaillent-a-un-regulateur-de-lia-projet-menace-par-un-blocage-politique-d61d8858-b159-11f1-bc32-13ddcee9efa7","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"mistral.ai","pais":"France","titulo":"Making sovereign, open-weight AI the new technological frontier","resumo":"The movement favoring sovereign artificial intelligence and open-weight models is gaining momentum as a strategic alternative to Big Tech dominance. The approach seeks to ensure technological autonomy for countries and companies, promoting greater transparency and control over data. This trend promises to redefine the frontier of global innovation by enabling collaborative and decentralized development.","link":"https://mistral.ai/news/mistral-makes-sovereign-open-weight-ai-to-frontier/","categoria":"INNOVATION","lang":"en"},{"fonte":"Franc-Tireur","pais":"France","titulo":"Economy: Will artificial intelligence destroy jobs?","resumo":"The rapid advancement of artificial intelligence has sparked intense debate over economic impacts and mass automation in the labor market. Analysts and economists are assessing whether the technology will trigger unprecedented structural unemployment or open up new productivity opportunities. The debate involves the urgent need for professional retraining and public policies adapted to this technological transition.","link":"https://www.franc-tireur.fr/economie-lia-va-t-elle-nous-tuer","categoria":"TRENDS","lang":"en"},{"fonte":"Nice-Matin","pais":"France","titulo":"Monaco startup aims to allow secure account access via heartbeat","resumo":"A Monaco-based startup has developed an innovative biometric technology that uses each individual's unique heart rhythm for security authentication. The solution promises to replace passwords and traditional verification methods with a highly accurate system that is difficult to clone. The innovation aims to transform banking data protection and access to critical systems in a practical and continuous way.","link":"https://www.nicematin.com/societe/technologie/cette-start-up-de-monaco-veut-vous-faire-acceder-a-vos-comptes-en-toute-securite-grace-a-votre-coeur-10724173","categoria":"SECURITY","lang":"en"},{"fonte":"Nord Littoral","pais":"France","titulo":"Danone expands investments in Steenvoorde with new high-tech workshop","resumo":"Food giant Danone has announced the expansion of its industrial facilities in Steenvoorde through the creation of a high-tech manufacturing space. The project aims to modernize production processes, increase energy efficiency, and apply advanced automation to the supply chain. The investment reinforces the company's commitment to industrial innovation and the economic development of the French region.","link":"https://www.nordlittoral.fr/297994/article/2026-09-16/danone-poursuit-son-investissement-steenvoorde-avec-un-atelier-de-haute","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Science et vie","pais":"France","titulo":"New American super-aircraft carrier scheduled for delivery in spring 2027","resumo":"The United States Navy plans to commission its newest next-generation super-aircraft carrier in the spring of 2027. The vessel features cutting-edge military technologies, including advanced electromagnetic catapult systems and automated defense. The deployment of this vessel represents a milestone in strengthening strategic deterrence capabilities and global power projection.","link":"https://www.science-et-vie.com/technos-et-futur/defense/le-nouveau-super-porte-avions-americain-devrait-arriver-au-printemps-2027-258915.html","categoria":"DEFENSE","lang":"en"},{"fonte":"Ouest-France","pais":"France","titulo":"Diabetic swimmer to attempt crossing mountain lake to advance science","resumo":"Breton swimmer Yvan Derrien, who has type 1 diabetes, is preparing to take on the challenge of crossing a mountain lake under extreme conditions. The expedition will serve as a platform for scientific tests focused on monitoring blood glucose and physiological stress under intense cold. The data collected during the crossing is expected to contribute to new research in sports medicine and diabetes management.","link":"https://www.ouest-france.fr/bretagne/quimperle-29300/je-tenterai-de-faire-avancer-la-science-le-nageur-diabetique-breton-yvan-derrien-sattaquera-a-un-lac-de-montagne-52f02a80-b0dc-11f1-978f-b3ea995ed274","categoria":"SCIENCE","lang":"en"},{"fonte":"Yahoo Finance UK","pais":"United Kingdom","titulo":"Hong Kong unveils plan to align economy with China's objectives","resumo":"Hong Kong has unveiled a new strategic plan to integrate its economy more closely with China's goals. The initiative aims to foster regional cooperation, attract innovation investment, and cement the territory as a global hub. This move redefines the region's geopolitical and financial role, deepening its alignment with Beijing's directives.","link":"https://uk.finance.yahoo.com/news/hong-kong-unveils-plan-align-053206316.html","categoria":"ECONOMY","lang":"en"},{"fonte":"The Guardian","pais":"United Kingdom","titulo":"UK mathematician debunks Parthenon optical illusions myth","resumo":"A UK mathematician has debunked the famous theory that the Partenon contains intentionally designed optical illusions. Through advanced geometric analysis and digital modeling, the study revealed that the curvatures were purely structural choices. The research rewrites the historical interpretation of Greek architecture and brings new perspectives on antiquity's techniques.","link":"https://www.theguardian.com/science/2026/sep/16/uk-mathematician-debunks-myth-parthenon-optical-illusions","categoria":"SCIENCE","lang":"en"},{"fonte":"Bloomberg.com","pais":"United Kingdom","titulo":"AI and data center investments by multinationals boost Irish economy","resumo":"Growing financial investments in artificial intelligence and data centers by multinational corporations are bolstering Ireland's economy. The continuous expansion of cloud infrastructure attracts large volumes of foreign capital and strengthens the local technology ecosystem. This impact cements the country as one of Europe's primary data processing hubs in the advanced technology era.","link":"https://www.bloomberg.com/news/articles/2026-09-15/ai-data-center-spending-by-multinationals-boosts-irish-economy","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"La Razón","pais":"Spain","titulo":"Former Anthropic researcher claims AI experts are buying land out of fear of the technology","resumo":"Jacob Coxon, a former Anthropic researcher, has revealed that several artificial intelligence experts are acquiring land out of fear of the technologies they created. The statement reflects a growing ethical and existential concern among professionals in the advanced technology sector themselves. This movement highlights the urgent debate over the transformative impact and risks associated with the unchecked advancement of artificial intelligence worldwide.","link":"https://www.larazon.es/tecnologia-consumo/inteligencia-artificial/jacob-coxon-exinvestigador-anthropic-asegura-algunos-empleados-expertos-ia-estan-comprando-tierras-miedo-tecnologia-han-creado_202609166aa919a0e428ed29213fd491.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"antena3.com","pais":"Spain","titulo":"Spain adopts pioneering 3D technology to investigate cancer and other diseases","resumo":"Spain has adopted innovative three-dimensional modeling technology designed to deepen research into cancer and various complex illnesses. The new tool allows scientists to analyze cellular structures and tissues with a level of precision unprecedented in medicine. The initiative promises to accelerate the discovery of new treatments and optimize healthcare diagnostics. This is a crucial scientific breakthrough that solidifies the country at the forefront of European biomedical research.","link":"https://www.antena3.com/noticias/salud/espana-incorpora-tecnologia-3d-pionera-investigar-cancer-otras-enfermedades_202609156aa9a6c17486a40f2c9e427b.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Cadena SER","pais":"Spain","titulo":"Lassalle emphasizes the importance of regulating AI: \"It was made to replace us\"","resumo":"The debate over artificial intelligence regulation has gained new momentum in Spain following pointed statements by Lassalle regarding the dangers of unrestricted automation. The expert emphasized that current technology has been developed with the implicit purpose of replacing human capabilities in various sectors. The message underscores the urgency of establishing legal and ethical frameworks to ensure the safe use of AI. This warning draws governments' and society's attention to the impacts on the labor market.","link":"https://cadenaser.com/nacional/2026/09/15/lassalle-insiste-en-la-importancia-de-regular-la-ia-esta-hecha-para-sustituirnos-cadena-ser/?outputType=amp","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Infodefensa","pais":"Spain","titulo":"Quantum Systems Integrates Spain's Centum Sigint Technology into Its Reliant and Vector AI Drones","resumo":"Quantum Systems has announced the integration of Spanish firm Centum's signal intelligence system into its new artificial intelligence drone models.\nThis technological collaboration strengthens operational precision and aerial monitoring capabilities for strategic missions.\nThe agreement highlights Spain's innovation ecosystem and its expanding role in the global defense and autonomy industry.\nThis partnership drives new standards for the unmanned aerial vehicles sector.","link":"https://www.infodefensa.com/texto-diario/mostrar/6016141/quantum-systems-incorpora-tecnologia-sigint-espanola-centum-drones-reliant-vector-ai","categoria":"INNOVATION","lang":"en"},{"fonte":"ciencia.gob.es","pais":"Spain","titulo":"Spanish Government Allocates Over 1.2 Billion Euros to Hire Researchers and Fund Scientific Projects","resumo":"The government of Spain has approved a historic investment of more than 1.2 billion euros aimed at strengthening national science.\nThe funds will be used to recruit new talent and finance high-impact research projects.\nThis amount represents a significant leap compared to previous years' budgets, aiming to curb brain drain in the country.\nThe measure reinforces the transition toward an economy based on knowledge, innovation, and technological sovereignty.","link":"https://www.ciencia.gob.es/Noticias/2026/septiembre/gobierno-inversion-contratacion-personal-proyectos-investigacion.html","categoria":"SCIENCE","lang":"en"},{"fonte":"businessinsider.es","pais":"Spain","titulo":"Ireland's Economy Gains Momentum Driven by Investments in AI and Data Centers","resumo":"The Irish economy has recorded strong growth driven by heavy investments in the artificial intelligence sector and the expansion of data centers.\nThe country reaffirms its position as one of Europe's leading tech hubs, attracting global tech giants.\nThe steady flow of capital has stimulated the innovation ecosystem and the creation of skilled jobs.\nHowever, rapid growth also brings challenges regarding energy demand and national infrastructure.","link":"https://www.businessinsider.es/economia/economia-irlanda-impulsa-inversion-ia-centros-datos_7037269_0.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"El Economista","pais":"Spain","titulo":"Military Training and Simulation Technology Becomes the New Mission for Tech Institutes","resumo":"Technology institutes are redirecting their research efforts toward creating advanced simulation and military training systems.\nThese new solutions utilize cutting-edge technology to recreate complex tactical scenarios in a highly realistic and secure manner.\nDevelopment includes the use of virtual environments and artificial intelligence to optimize the preparation of defense forces.\nThe initiative reflects the growing dual-use applications of civil technology within the national security sector.","link":"https://www.eleconomista.es/tecnologia/noticias/14014217/09/26/tecnologia-para-entrenamiento-militar-y-simulaciones-la-nueva-mision-de-los-institutos-tecnologicos.html","categoria":"DEFENSE","lang":"en"},{"fonte":"La Opinión A Coruña","pais":"Spain","titulo":"Cambre Becomes a Stage for Science in Spain with the Presentation of Science on Stage","resumo":"The municipality of Cambre has been chosen to host the prestigious Science on Stage event, bringing together educators and scientists from across Spain.\nThe gathering seeks to promote innovative teaching methods in science, technology, engineering, and mathematics (STEM) disciplines.\nDuring the presentations, pedagogical projects and practical experiments aimed at inspiring new generations of researchers are showcased.\nThe initiative strengthens scientific outreach and highlights the importance of innovation in basic education.","link":"https://www.laopinioncoruna.es/gran-coruna/2026/09/16/cambre-convierte-escenario-ciencia-espana-134321018.amp.html","categoria":"SCIENTIFIC EDUCATION","lang":"en"},{"fonte":"FAZ","pais":"Germany","titulo":"Zeit AI: Palantir Technology for Medium-Sized Enterprises","resumo":"Zeit AI is bringing Palantir's advanced artificial intelligence technology to medium-sized enterprises (Mittelstand) in Germany.\nThe initiative aims to democratize access to complex, automated analytical tools to optimize operations.\nThis move promises to significantly boost the competitiveness of traditional German industry in the face of global challenges.","link":"https://www.faz.net/premium/digitalwirtschaft/kuenstliche-intelligenz/zeit-ai-palantir-technologie-fuer-den-mittelstand-accg-201218897.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"FAZ","pais":"Germany","titulo":"Labor Share Falls Due to AI: What Anton Korinek Predicts","resumo":"Economist Anton Korinek forecasts a continuous decline in the labor share of national income due to the rapid advancement of AI.\nThe automation of cognitive tasks is expected to redistribute economic gains primarily to the owners of technological capital.\nThis scenario alerts governments and institutions to the need for new fiscal and social policies to mitigate emerging inequalities.","link":"https://www.faz.net/premium/digitalwirtschaft/kuenstliche-intelligenz/lohnquote-sinkt-durch-ki-was-anton-korinek-prognostiziert-accg-201224852.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"BR","pais":"Germany","titulo":"Podcast: High-Tech Against Wildfires – Detecting and Extinguishing Fires Faster","resumo":"Cutting-edge technologies such as IoT sensors, artificial intelligence, and drones are being deployed in Germany to combat wildfires.\nThe use of these innovative tools allows for the rapid identification of hotspots and optimizes the response time of emergency teams.\nThe initiative highlights the practical impact of scientific innovation in environmental protection and public safety preservation.","link":"https://www.br.de/mediathek/podcast/iq-wissenschaft-und-forschung/hightech-gegen-waldbraende-feuer-schneller-erkennen-und-loeschen/2122137","categoria":"SCIENCE AND TECHNOLOGY","lang":"en"},{"fonte":"MONOist","pais":"Germany","titulo":"Hitachi Acquires Intellectual Property for Biomethanation Technology from German Company","resumo":"Hitachi has acquired the intellectual property rights for biomethanation technology belonging to a German company.\nThe transac
