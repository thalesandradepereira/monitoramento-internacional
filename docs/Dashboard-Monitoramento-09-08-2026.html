 of Basic Science to Open in Beijing","resumo":"Beijing is preparing to host the 2026 International Congress of Basic Science in the Huairou district, gathering the world's leading scientists and researchers.\nThe event aims to discuss cutting-edge advancements in mathematics, theoretical physics, and computer sciences, besides promoting global scientific collaborations.\nThe conference reinforces China's strategy to consolidate itself as a worldwide hub for fundamental scientific research and innovation.","link":"https://www.beijing.gov.cn/fuwu/lqfw/gggs/202608/t20260809_4814909.html","categoria":"SCIENCE","lang":"en"},{"fonte":"beijing.gov.cn","pais":"China","titulo":"Beijing Launches Support Policy for International Expansion of the Digital Economy","resumo":"Beijing has announced its first policy aimed exclusively at encouraging the international expansion of digital economy companies.\nThe initiative provides annual funding of up to ten million yuan for platforms that support technology companies entering foreign markets.\nThe measure aims to accelerate the global presence of Chinese Big Techs and strengthen cross-border digital service ecosystems.","link":"https://www.beijing.gov.cn/ywdt/gzdt/202608/t20260809_4814912.html","categoria":"DIGITAL ECONOMY","lang":"en"},{"fonte":"新浪新闻_手机新浪网","pais":"China","titulo":"China's Debut at International Nuclear Science Olympiad Wins One Gold and Three Silvers","resumo":"The Chinese team made its debut at the International Nuclear Science Olympiad achieving an expressive result of one gold and three silver medals.\nThe tournament brings together young talents from various countries to solve complex challenges in the fields of nuclear physics and radiation applications.\nThe standout performance reflects the country's investment in training young scientists and developing the nuclear sector.","link":"https://news.sina.cn/2026-08-09/detail-inimshax3730687.d.html?vt=4","categoria":"NUCLEAR SCIENCE","lang":"en"},{"fonte":"India Today","pais":"India","titulo":"Inside India's Hydrogen Rail Mission: Why One Train Is Easy, But Hundreds Are a Challenge","resumo":"India is advancing its plans to decarbonize the railway sector with the development of hydrogen-powered trains. While building an initial prototype is a viable short-term milestone, scaling the technology to hundreds of trainsets demands massive advancements in refueling infrastructure and clean fuel production. This transition represents a crucial strategic step toward the country's carbon neutrality, redefining the future of national mass transit.","link":"https://www.indiatoday.in/science/story/inside-indias-hydrogen-rail-mission-why-one-train-is-easy-hundreds-are-a-task-2966395-2026-08-09","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"India's Health Minister Releases Knowledge Paper on Artificial Intelligence in Medical Technology","resumo":"India's Ministry of Health has introduced a strategic white paper focused on integrating artificial intelligence into the medical technology sector. The initiative aims to map innovation opportunities, standardize data security guidelines, and enhance diagnostic accuracy within the healthcare system. This move consolidates the country's vision of transforming medicine with the support of advanced digital tools, increasing access and efficiency in patient care.","link":"https://newsonair.gov.in/health-minister-nadda-releases-knowledge-paper-on-ai-in-medical-technology/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"OpenGov Asia","pais":"India","titulo":"Rajasthan Reviews Indigenous Low-Emission Road Maintenance Technology","resumo":"The Indian state of Rajasthan has initiated the evaluation of a new indigenous technology designed for low-carbon highway maintenance. The solution utilizes sustainable paving methods that significantly reduce the ecological footprint of road works without compromising asphalt durability. If implemented on a large scale, the innovation promises to transform infrastructure development in the region, aligning civil engineering advancements with the country's environmental goals.","link":"https://opengovasia.com/rajasthan-reviews-indigenous-low-emission-road-maintenance-technology/","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"livemint.com","pais":"India","titulo":"Defense Products Manufacturer VTDS Signs Strategic Technology Pact with Czech Republic's DEUS Automation","resumo":"Indian defense products firm VTDS has forged a technology cooperation partnership with Czech company DEUS Automation. The agreement aims to transfer technology and integrate cutting-edge automation systems into the development of industrial and defense equipment. This international collaboration reinforces the modernization of India's manufacturing sector and boosts technical capabilities for producing highly complex autonomous systems.","link":"https://www.livemint.com/news/india/defence-products-manufacturer-vtds-signs-strategic-technology-pact-with-czech-republics-deus-automation-11786243654770.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Forbes","pais":"India","titulo":"New Science Maps Asia's Shark and Ray Hotspots and Exposes Major Conservation Gaps","resumo":"New international scientific research has identified key concentration areas for sharks and rays along the Asian coastline. The study revealed critical gaps in current marine preservation policies, highlighting the urgent need for reinforced protection zones. The data provides a fundamental basis for researchers and governments to develop more effective conservation strategies, mitigating predatory fishing and preserving aquatic biodiversity.","link":"https://www.forbes.com/sites/melissacristinamarquez/2026/08/08/new-science-maps-asias-shark-and-ray-hotspots-and-exposes-major-conservation-gaps/","categoria":"SCIENCE","lang":"en"},{"fonte":"PIB","pais":"India","titulo":"CSIR-NIScPR Holds Science Outreach Training to Promote Public Communication","resumo":"Indian institute CSIR-NIScPR promoted a training program focused on writing and popularizing science for the general public. The event aimed to instruct scientists and educators on how to simplify complex concepts, fostering more accessible and inclusive engagement with society. The initiative reinforces the importance of democratizing scientific knowledge in India, stimulating critical thinking and public interest in technological innovation.","link":"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2296560\u0026reg=1\u0026lang=1","categoria":"SCIENCE","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"India's Economy Well-Insulated Against US Tariffs on Russian Oil, Says Economist","resumo":"Economic experts point out that India possesses sufficient resilience to mitigate the impacts of potential US sanctions and tariffs related to Russian oil. The diversification of energy sources and strong domestic demand act as buffers against international market fluctuations. The analysis reinforces the strategic position of the Indian economy in the global geopolitical landscape, maintaining financial stability amid external trade pressures.","link":"https://www.moneycontrol.com/news/trade/india-us/india-s-economy-well-insulated-against-us-tariffs-on-russian-oil-says-economist-13998867.html","categoria":"ECONOMY","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"Sports Minister Felicitates Indian Athletes of 2026 Commonwealth Games with Cash Rewards","resumo":"India's Ministry of Sports held an official ceremony to award financial incentives to standout athletes ahead of the 2026 Commonwealth Games. The recognition seeks to motivate competitors and encourage the ongoing development of high-performance sports infrastructure and preparation in the country. The measure reflects government investment in valuing national talent and strengthening India's presence in major international competitions.","link":"https://newsonair.gov.in/sports-minister-felicitates-indian-athletes-of-cwg-2026-with-cash-rewards/","categoria":"TRENDS","lang":"en"},{"fonte":"Demócrata","pais":"Portugal","titulo":"One Step Closer to Decarbonizing the Economy with Green Hydrogen","resumo":"The global energy transition has driven research focused on the efficient, large-scale production of green hydrogen. New scientific breakthroughs promise to significantly reduce production costs and accelerate the replacement of fossil fuels in heavy industry. This evolution represents a crucial milestone for achieving international decarbonization goals and combating climate change.","link":"https://www.democrata.es/pt/europa/um-passo-mais-perto-descarbonizar-economia-com-hidrogenio-verde/","categoria":"ENERGY","lang":"en"},{"fonte":"Notícias de Aveiro","pais":"Portugal","titulo":"ScienceCast: The Science Dedicated to Protecting Whales, Sharks, and Turtles","resumo":"The latest episode of ScienceCast discusses how researchers utilize advanced scientific data to preserve threatened marine species. Monitoring projects and marine technology have been fundamental in mapping migratory routes and reducing the impacts of illegal fishing. The initiative highlights the importance of scientific outreach in engaging society for ocean conservation.","link":"https://www.noticiasdeaveiro.pt/sciencecast-baleias-tubaroes-e-tartarugas-a-ciencia-que-os-protege/","categoria":"SCIENCE","lang":"en"},{"fonte":"e-global.pt","pais":"Portugal","titulo":"US Approves First Flu Vaccine Based on mRNA Technology","resumo":"United States regulatory bodies have approved the use of the first influenza virus vaccine developed with messenger RNA technology. The innovation allows for a faster immune response tailored to emerging virus strains each immunization season. The approval marks a historic milestone for medical biotechnology, opening doors for more effective immunizers in the future.","link":"https://e-global.pt/noticias/mundo/america-do-norte/eua-a   const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
