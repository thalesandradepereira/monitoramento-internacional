    :root {

    .btn-clear {

      font-weight: 600;

  // Injeta os dados originais no frontend
  const data = [{"fonte":"Correio Braziliense","pais":"Brasil","titulo":"A tecnologia chinesa que tenta criar energia infinita usando o mesmo processo do Sol","resumo":"A China está avançando no desenvolvimento de reatores de fusão nuclear conhecidos como sóis artificiais.\nEssa tecnologia busca replicar o mesmo processo físico que alimenta o Sol para gerar energia limpa.\nO objetivo é alcançar uma fonte inesgotável de eletricidade sem emitir gases do efeito estufa.\nSe bem-sucedida, essa inovação poderá transformar radicalmente o cenário energético mundial nas próximas décadas.","link":"https://www.correiobraziliense.com.br/cbradar/a-tecnologia-chinesa-que-tenta-criar-energia-infinita-usando-o-mesmo-processo-do-sol/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Jornal O Sul","pais":"Brasil","titulo":"Como novos vírus criados por inteligência artificial podem mudar a ciência, apesar de causarem preocupação","resumo":"Cientistas estão utilizando ferramentas avançadas de inteligência artificial para projetar novos tipos de vírus.\nA inovação promete acelerar a criação de vacinas e tratamentos para doenças altamente complexas.\nContudo, biólogos alertam para os riscos biosseguros e éticos relacionados à criação sintética de patógenos.\nA discussão busca equilibrar o enorme potencial científico dessas pesquisas com regulamentações rígidas.","link":"https://www.osul.com.br/como-novos-virus-criados-por-inteligencia-artificial-podem-mudar-a-ciencia-apesar-de-causarem-preocupacao/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Sistemas de câmeras usam inteligência artificial e prometem se antecipar a crimes","resumo":"Novos sistemas de monitoramento por vídeo incorporam inteligência artificial para identificar padrões suspeitos em tempo real.\nA tecnologia visa auxiliar forças de segurança prevendo condutas ilícitas antes mesmo de sua ocorrência.\nEspecialistas destacam os ganhos em eficiência para o patrulhamento urbano e proteção de patrimônios.\nPor outro lado, surgem debates sobre privacidade de dados e os perigos de potenciais vieses nos algoritmos.","link":"https://g1.globo.com/google/amp/economia/tecnologia/video/sistemas-de-cameras-usam-inteligencia-artificial-e-prometem-se-antecipar-a-crimes-14783434.ghtml","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"China tem 1º parque industrial zero carbono, com fábricas de baterias e de turbinas eólicas","resumo":"A China anunciou a operação de seu primeiro parque industrial projetado para ser totalmente neutro em emissões de carbono.\nO complexo abriga instalações dedicadas à produção em larga escala de baterias de alta eficiência e turbinas eólicas.\nToda a infraestrutura do local é alimentada exclusivamente por fontes de energia renovável e limpa.\nO projeto estabelece um novo paradigma para a manufatura sustentável e a transição energética global.","link":"https://www1.folha.uol.com.br/mercado/2026/08/china-tem-1o-parque-industrial-zero-carbono-com-fabricas-de-baterias-e-de-turbinas-eolicas.shtml","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"marsemfim.com.br","pais":"Brasil","titulo":"Oceano desconhecido: metade ainda escapa à ciência","resumo":"Estudos recentes revelam que mais da metade das profundezas oceânicas do planeta permanece completamente inexplorada.\nA falta de dados científicos limita a compreensão sobre a biodiversidade marinha e a regulação do clima global.\nAvanços em submersíveis autônomos e mapeamento por satélite prometem acelerar as expedições nos próximos anos.\nMapear esses ecossistemas é fundamental para proteger o planeta contra os impactos das mudanças climáticas.","link":"https://marsemfim.com.br/oceano-desconhecido-metade-escapa-ciencia/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"CNN Brasil","pais":"Brasil","titulo":"Programa oferece curso gratuito de IA e tecnologia a alunos do 8º ao 3° ano","resumo":"Uma nova iniciativa educacional está disponibilizando vagas gratuitas em cursos de inteligência artificial e tecnologia.\nO programa é voltado a estudantes do 8º ano do ensino fundamental até o 3º ano do ensino médio.\nO objetivo é capacitar jovens talentos e prepará-los para as crescentes demandas do mercado digital.\nAs aulas cobrem fundamentos de programação, lógica de dados e aplicações práticas de ferramentas tecnológicas.","link":"https://www.cnnbrasil.com.br/educacao/programa-oferece-curso-gratuito-de-ia-e-tecnologia-a-alunos-do-8o-ao-3-ano/","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"Veja Saúde","pais":"Brasil","titulo":"Chá de absinto traz algum benefício? Veja o que a ciência diz sobre a infusão","resumo":"O chá de absinto é popularmente conhecido por suas propriedades medicinais, mas desperta atenção da comunidade científica.\nPesquisas apontam potenciais efeitos digestivos e antioxidantes proporcionados por compostos ativos da planta.\nNo entanto, especialistas alertam para o consumo moderado devido à presença de substâncias que podem ser tóxicas em excesso.\nA ciência recomenda orientação médica prévia antes de utilizar a bebida para fins terapêuticos.","link":"https://saude.abril.com.br/alimentacao/cha-de-absinto-traz-algum-beneficio-veja-o-que-a-ciencia-diz-sobre-a-infusao/","categoria":"SAÚDE","lang":"pt"},{"fonte":"O POVO+","pais":"Brasil","titulo":"Estudante de Fortaleza é selecionada para intercâmbio de tecnologia na China","resumo":"Uma aluna de Fortaleza conquistou uma vaga em um prestigiado programa de intercâmbio tecnológico na China.\nA oportunidade permitirá que a estudante se aprofunde em áreas inovadoras de robótica e inteligência artificial.\nO intercâmbio destaca a relevância da formação acadêmica brasileira e o potencial de jovens na ciência.\nA imersão visa promover a troca de conhecimentos práticos entre instituições de ensino brasileiras e chinesas.","link":"https://mais.opovo.com.br/jornal/cidades/2026/08/09/estudante-de-fortaleza-e-selecionada-para-intercambio-de-tecnologia-na-china.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"simplywall.st","pais":"Estados Unidos","titulo":"Marvell Technology Sobe 16,6% Após Revelar Arquitetura Desagregada de Memória para Data Centers de IA","resumo":"A Marvell Technology apresentou uma nova arquitetura de memória desagregada desenvolvida especificamente para acelerar e otimizar data centers voltados à Inteligência Artificial.\nA inovação promete superar os gargalos de largura de banda e capacidade que atualmente limitam o processamento de modelos avançados.\nCom o anúncio, as ações da empresa registraram uma expressiva alta de 16,6% no mercado financeiro.\nO avanço representa um salto estratégico na infraestrutura necessária para sustentar a rápida expansão do ecossistema de IA.","link":"https://simplywall.st/stocks/us/semiconductors/nasdaq-mrvl/marvell-technology/news/marvell-technology-mrvl-is-up-166-after-unveiling-disaggrega","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Tagesspiegel","pais":"Estados Unidos","titulo":"IA Como Criadora: Os Riscos da Tecnologia de Vírus Desenvolvida em Laboratório de Stanford","resumo":"Pesquisadores de Stanford estão investigando o potencial e os perigos do uso de Inteligência Artificial para projetar novos vírus e estruturas biológicas em laboratório.\nEmbora a tecnologia possa acelerar a criação de vacinas e tratamentos médicos, ela também levanta preocupações críticas de biossegurança sobre a possível geração de patógenos letais.\nO avanço reacendeu o debate ético sobre o limite da autonomia de modelos generativos na biologia sintética.\nEspecialistas cobram diretrizes e regulamentações rigorosas para conter potenciais ameaças globais.","link":"https://www.tagesspiegel.de/wissen/auf-dem-weg-zum-super-erreger-forscher-basteln-neue-infektiose-viren-mit-kunstlicher-intelligenz-15925966.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Technology Org","pais":"Estados Unidos","titulo":"Fino Demais Para Falhar: Uma Alternativa Conectiva ao Cobre em Microchips","resumo":"Cientistas desenvolveram um novo material ultra-fino para substituir as conexões tradicionais de cobre utilizadas na fabricação de microchips e semicondutores.\nÀ medida que os chips se tornam menores, os fios de cobre enfrentam sérios problemas de resistência elétrica e superaquecimento que diminuem o desempenho.\nA nova alternativa em escala atômica permite manter a eficiência energética e a velocidade na transmissão de dados sem perder a estabilidade.\nO avanço abre caminho para manter a evolução da computação de altíssimo desempenho no futuro.","link":"https://www.technology.org/2026/08/09/too-thin-to-fail-an-alternative-to-copper-microchip-interconnects/","categoria":"HARDWARE","lang":"pt"},{"fonte":"O GLOBO","pais":"Estados Unidos","titulo":"Amazon Financia Construção de Enorme Usina a Gás nos EUA para Alimentar Data Centers","resumo":"Para suprir a crescente demanda energética provocada pelos seus data centers de Inteligência Artificial, a Amazon está financiando uma usina a gás de grande porte nos EUA.\nA iniciativa destaca a pressão sem precedentes sobre as redes elétricas provocada pelo avanço maciço das tecnologias de computação em nuvem.\nEmbora a gigante de tecnologia mantenha metas de descarbonização, a urgência por eletricidade constante impulsiona contratos de energia fóssil.\nO projeto reacende discussões intensas sobre os impactos ambientais associados ao boom da IA.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/08/08/amazon-financia-construcao-de-enorme-usina-a-gas-nos-eua-para-data-center.ghtml","categoria":"ENERGIA","lang":"pt"},{"fonte":"CNN Brasil","pais":"Estados Unidos","titulo":"Califórnia Registra Alto Desemprego no Setor de Tecnologia Apesar do Boom da IA","resumo":"Apesar do otimismo e dos investimentos bilionários impulsionados pela Inteligência Artificial, o estado da Califórnia enfrenta um aumento nas taxas de desemprego no setor de tecnologia.\nMúltiplas reestruturações corporativas e demissões em massa continuam afetando trabalhadores de TI tradicionais e áreas administrativas.\nO fenômeno evidencia um descompasso estrutural entre a rápida contratação em nichos de IA generativa e o enxugamento em outras divisões de grandes empresas.\nA situação acende o alerta sobre a reconfiguração do mercado de trabalho de tecnologia nos Estados Unidos.","link":"https://www.cnnbrasil.com.br/economia/macroeconomia/california-tem-alto-desemprego-no-setor-de-tech-apesar-de-boom-da-ia/","categoria":"MERCADO","lang":"pt"},{"fonte":"BBC","pais":"Estados Unidos","titulo":"Da OpenAI à Meta: Por Que Robôs de IA Continuam Efetuando Ataques Hackers","resumo":"Agentes e ferramentas de Inteligência Artificial associados a grandes empresas, como OpenAI e Meta, estão sendo explorados por cibercriminosos para automatizar invasões e ciberataques complexos.\nA capacidade dos modelos de gerar código malicioso, identificar vulnerabilidades e personalizar golpes de phishing aumentou significativamente a escala das ameaças.\nAs empresas de tecnologia tentam implementar barreiras de proteção mais rígidas, mas os atacantes continuam encontrando brechas para contornar os filtros.\nO cenário reforça a urgência de novas estratégias defensivas movidas por IA para conter os riscos.","link":"https://www.bbc.com/portuguese/articles/c87nr1z7nl0o","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"ScienceDaily","pais":"Estados Unidos","titulo":"Minúsculo Cristal de Ouro Pode Retirar a Tecnologia Quântica do Congelamento Profundo","resumo":"Uma nova descoberta utilizando cristais microscópicos de ouro promete revolucionar a computação quântica ao permitir operações em temperaturas mais elevadas.\nAtualmente, os sistemas quânticos exigem condições extremas de congelamento próximo ao zero absoluto para manter a estabilidade dos qubits.\nO novo material ajuda a preservar a coerência quântica sem a necessidade de infraestruturas gigantescas e extremamente dispendiosas de refrigeração.\nA inovação aproxima a tecnologia quântica de aplicações práticas no mundo real e de escala comercial.","link":"https://www.sciencedaily.com/releases/2026/08/260806050706.htm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"techxplore.com","pais":"Estados Unidos","titulo":"Estrutura de IA Baseada em Ciência Cognitiva Promete Concluir Tarefas com Maior Eficiência","resumo":"Pesquisadores desenvolveram uma nova arquitetura de Inteligência Artificial inspirada nos processos mentais e mecanismos de aprendizagem do cérebro humano.\nAo integrar princípios da ciência cognitiva, o sistema consegue raciocinar e executar tarefas complexas utilizando uma fração do processamento e consumo de energia exigidos pelos modelos atuais.\nA abordagem pretende reduzir a dependência de imensos conjuntos de dados e infraestruturas computacionais caras.\nA inovação marca um passo relevante em direção a algoritmos de IA mais sustentáveis e adaptáveis.","link":"https://techxplore.com/news/2026-07-ai-framework-rooted-cognitive-science.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ladepeche.fr","pais":"França","titulo":"“Não se trata de ficção científica”: aviões híbridos ou 100% elétricos em serviço a partir de 2030... Será mesmo?","resumo":"O setor da aviação está acelerando seus investimentos no desenvolvimento de aeronaves híbridas e totalmente elétricas, com previsões de entrada em operação comercial até 2030.\nEssa transição busca reduzir significativamente as emissões de carbono do transporte aéreo e atender às exigências ambientais globais.\nNo entanto, especialistas destacam desafios regulatórios, de infraestrutura e de autonomia das baterias para tornar essa tecnologia viável em larga escala.","link":"https://www.ladepeche.fr/2026/08/09/il-ne-sagit-pas-de-science-fiction-des-avions-hybrides-ou-100-electriques-en-service-des-2030-vraiment-13500380.php","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"revueconflits.com","pais":"França","titulo":"Apple e OpenAI intensificam disputa judicial sobre futuros dispositivos do criador do ChatGPT","resumo":"A relação entre gigantes da tecnologia fica cada vez mais acirrada à medida que a OpenAI expande seus planos para desenvolver hardware próprio focado em inteligência artificial.\nA Apple acompanha de perto esses avanços para proteger seu ecossistema e patentes, gerando embates jurídicos estratégicos.\nO resultado dessa disputa pode redefinir como os dispositivos móveis de próxima geração integrarão assistentes inteligentes nativos.","link":"https://www.revueconflits.com/apple-et-openai-durcissent-leur-bataille-judiciaire-sur-les-futurs-appareils-du-createur-de-chatgpt/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Yahoo Actualités","pais":"França","titulo":"Por que os próprios criadores de IA restringem a tecnologia para seus filhos","resumo":"Executivos e engenheiros por trás dos principais avanços em inteligência artificial têm adotado medidas rigorosas para limitar a exposição de seus próprios filhos a telas e ferramentas digitais.\nA decisão reflete preocupações com o impacto do uso precoce dessas tecnologias no desenvolvimento cognitivo e social dos jovens.\nEsse comportamento levanta um importante debate sobre a segurança e os limites éticos dos produtos comercializados para o público geral.","link":"https://fr.news.yahoo.com/pourquoi-fabriquent-l-ia-limitent-175113022.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"L'Usine Nouvelle","pais":"França","titulo":"Ela criou uma tecnologia de propulsão para pequenos satélites: vinda da Noruega, Ane Aanesland revoluciona o setor espacial francês","resumo":"A física norueguesa Ane Aanesland desenvolveu um sistema inovador de propulsão a plasma projetado especificamente para miniaturizar e otimizar pequenos satélites.\nSua startup sediada na França atraiu grandes investimentos e tornou-se peça fundamental para a nova corrida espacial europeia.\nO avanço impulsiona a sustentabilidade e a eficiência operacional em órbita, barateando missões comerciais e científicas.","link":"https://www.usinenouvelle.com/aero-spatial/elle-a-cree-une-technologie-de-propulsion-pour-les-petits-satellites-venue-de-norvege-ane-aanesland-revolutionne-le-spatial-francais.ECRTBTBJEZP7PMX5NHLFTESBXI.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Les Echos","pais":"França","titulo":"“A economia francesa está na corda bamba”: o alerta do economista-chefe da AXA","resumo":"O chefe de pesquisas econômicas do grupo AXA emitiu um aviso contundente sobre a fragilidade e os riscos de desaceleração enfrentados pela economia da França.\nEntre os fatores de pressão estão a inflação persistente, incertezas fiscais e a volatilidade nos mercados financeiros europeus.\nO alerta destaca a necessidade de reformas estruturais para garantir o crescimento e evitar uma crise de confiança dos investidores.","link":"https://www.lesechos.fr/economie-france/conjoncture/leconomie-francaise-est-sur-le-fil-du-rasoir-lalerte-du-chef-economiste-daxa-2246406","categoria":"ECONOMIA","lang":"pt"},{"fonte":"The Times of India","pais":"Inglaterra","titulo":"Maior empresa de tecnologia da Europa, SAP paralisa viagens e contratações e pede disciplina nos gastos","resumo":"A gigante europeia de tecnologia SAP anunciou o congelamento de novas contratações e a suspensão de viagens corporativas para conter despesas.\nA liderança orientou os colaboradores a manterem extrema disciplina financeira diante das recentes volatilidades do mercado global.\nA decisão acompanha uma tendência de reestruturação operacional vista em diversas empresas do setor de tecnologia.","link":"https://timesofindia.indiatimes.com/technology/tech-news/europes-largest-technology-company-sap-stops-all-travel-and-hiring-tells-employees-we-need-to-be-disciplined-in-how-we-spend/articleshow/133030460.cms","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"AV Magazine","pais":"Inglaterra","titulo":"Definindo o AV para transmissão com a tecnologia Matrox ConvertIP","resumo":"A tecnologia Matrox ConvertIP redefine a transmissão de áudio e vídeo ao integrar infraestruturas tradicionais a redes IP avançadas.\nO sistema garante alta qualidade na conversão de mídia com latência quase nula, otimizando significativamente a eficiência operacional dos estúdios.\nEssa solução impulsiona a digitalização do setor audiovisual, oferecendo maior flexibilidade para produções ao vivo e transmissões complexas.","link":"https://www.avinteractive.com/sponsored-story/defining-broadcast-av-with-matrox-convertip-technology-08-08-2026/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"nikkei.com","pais":"Inglaterra","titulo":"Frituras desaparecem das merendas escolares no Reino Unido para combater a obesidade infantil","resumo":"O Reino Unido iniciou a remoção de alimentos fritos dos cardápios das refeições escolares como estratégia contra a obesidade infantil.\nA ação visa melhorar os hábitos alimentares dos jovens e reduzir o impacto financeiro a longo prazo no sistema público de saúde.\nAutoridades de saúde destacam que intervenções precoces no ambiente escolar são cruciais para conter o avanço de doenças crônicas.","link":"https://www.nikkei.com/article/DGXZQOGR22BO10S6A720C2000000/","categoria":"SAÚDE","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"EUA são acusados de interferir na política britânica com subvenção de US$ 500 mil para cursos de educação pública","resumo":"Os Estados Unidos foram acusados de ingerência na política britânica após concederem uma verba de 500 mil dólares para cursos educacionais.\nA iniciativa levantou questionamentos entre parlamentares sobre a influência estrangeira nas diretrizes pedagógicas e ideológicas do país.\nO caso ampliou discussões sobre os limites do financiamento internacional e a preservação da soberania institucional britânica.","link":"https://www.theguardian.com/us-news/2026/aug/08/us-accused-of-meddling-in-british-politics-with-500000-grant-scheme-promoting-shared-values","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"OkDiario","pais":"Espanha","titulo":"Espanto entre geólogos: a grande corrente da Antártica não se originou apenas pela separação dos continentes","resumo":"Uma nova descoberta científica está redefinindo o entendimento sobre a formação da Corrente Circumpolar Antártica.\nEstudos recentes indicam que o surgimento dessa importante corrente oceânica envolveu fatores além do simples afastamento continental.\nA pesquisa traz novas perspectivas sobre como o clima global e a circulação marinha evoluíram ao longo das eras geológicas.\nEssa revisão teórica impacta diretamente os modelos de previsão climática e a compreensão do aquecimento dos oceanos.","link":"https://okdiario.com/ciencia/estupor-geologos-gran-corriente-antartida-no-origino-solo-separacion-continentes-sino-aparicion-vientos-del-oeste-19093790","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Computer Hoy","pais":"Espanha","titulo":"O que é DVB-T2, a tecnologia que quer mudar tudo na TDT da Espanha?","resumo":"A Espanha está prestes a renovar sua Televisão Digital Terrestre com a implementação do padrão DVB-T2.\nEssa evolução tecnológica promete transmissões em alta definição com melhor eficiência de largura de banda.\nAlém da qualidade de imagem aprimorada, o novo sistema permite maior integração com serviços interativos.\nA mudança exigirá a adaptação de receptores e televisores por parte da população espanhola.","link":"https://computerhoy.20minutos.es/entretenimiento/que-es-dvb-t2-tecnologia-que-quiere-cambiarlo-todo-tdt-espana_7019516_0.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Alicante Plaza","pais":"Espanha","titulo":"A empresa Heligrafics lança tecnologia de realidade aumentada para melhorar o combate a incêndios florestais","resumo":"A empresa espanhola Heligrafics desenvolveu uma solução baseada em realidade aumentada para combate a incêndios.\nA ferramenta permite sobrepor dados críticos sobre o terreno em tempo real para as equipes de emergência.\nCom essa inovação, a coordenação tática e a segurança dos bombeiros em campo ganham um salto significativo.\nO projeto destaca o papel da tecnologia avançada na mitigação de desastres ambientais recorrentes.","link":"https://alicanteplaza.es/alicanteplaza/alcoy-el-comtat/la-alcoyana-heligrafics-despliega-tecnologia-de-realidad-aumentada-que-mejora-la-coordinacion-en-los-fuegos-forestales","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"democrata.es","pais":"Espanha","titulo":"Um passo mais perto de descarbonizar a economia com hidrogênio verde","resumo":"Avanços recentes na produção de hidrogênio verde impulsionam a transição energética global.\nA tecnologia busca substituir combustíveis fósseis em indústrias de difícil descarbonização e no transporte pesado.\nNovos projetos reforçam a viabilidade econômica e a eficiência dos processos de eletrólise da água.\nEssa evolução posiciona a energia limpa como vetor central para alcançar as metas de emissão zero.","link":"https://www.democrata.es/europa/bruselas-autoriza-780-millones-hidrogeno-verde/","categoria":"ENERGIA","lang":"pt"},{"fonte":"Yahoo","pais":"Espanha","titulo":"Grupo KTM ganha terreno com motos premium: tecnologia, potência e evolução no mercado","resumo":"O Grupo KTM fortalece sua presença no mercado internacional focando na inovação de motocicletas de alto padrão.\nA inclusão de assistentes eletrônicos e novos sistemas de conectividade eleva o patamar dos modelos da marca.\nA estratégia alia potência de desempenho a tecnologias focadas na segurança do condutor.\nA consolidação do segmento reflete a crescente demanda por veículos de duas rodas altamente tecnológicos.","link":"https://es-us.noticias.yahoo.com/grupo-ktm-gana-terreno-motos-230000704.html","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"elmundo.es","pais":"Espanha","titulo":"A economia dependente de um chip","resumo":"A dependência global de semicondutores tornou os chips elementos cruciais para a estabilidade econômica mundial.\nSetores que vão da indústria automobilística aos dispositivos móveis enfrentam desafios na cadeia de suprimentos.\nPaíses e blocos econômicos aceleram investimentos locais para garantir soberania e segurança tecnológica.\nO cenário evidencia como a microeletrônica se tornou o motor central do crescimento e da geopolítica atual.","link":"https://www.elmundo.es/economia/macroeconomia/2026/08/09/6a74904de4d4d8cc518b456d.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"El Periódico de España","pais":"Espanha","titulo":"Hospital de Móstoles incorpora tecnologia de ponta para cirurgia ocular complexa","resumo":"O Hospital de Móstoles adquiriu equipamentos cirúrgicos de última geração voltados a intervenções oftalmológicas.\nA nova tecnologia oferece maior precisão microcirúrgica, reduzindo o tempo de recuperação dos pacientes.\nProcedimentos de alta complexidade passam a ser realizados com níveis superiores de segurança e eficácia.\nA iniciativa posiciona o centro de saúde como referência na adoção de inovações para a medicina ocular.","link":"https://www.epe.es/es/madrid/20260808/hospital-universitario-mostoles-incorpora-plataforma-quirurgica-avanzada-cirugia-ocular-133202346","categoria":"SAÚDE","lang":"pt"},{"fonte":"Ayuntamiento de Jerez","pais":"Espanha","titulo":"Prefeitura instala nova iluminação com tecnologia LED no bairro rural de La Guareña","resumo":"A prefeitura deu início à modernização da rede de iluminação pública na comunidade rural de La Guareña.\nO projeto substitui antigas luminárias por modelos LED com maior eficiência energética e menor custo.\nA intervenção melhora a visibilidade noturna, aumentando a segurança e a qualidade de vida dos moradores.\nA medida faz parte de um plano de sustentabilidade para reduzir a pegada de carbono do município.","link":"https://www.jerez.es/webs-municipales/sala-de-prensa/nota-de-prensa/el-ayuntamiento-acomete-la-instalacion-de-un-nuevo-alumbrado-con-tecnologia-led-en-la-barriada-rural-de-la-guarena","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"BILD","pais":"Alemanha","titulo":"Flanco Oriental da Europa: Como a IA e os Drones Protegem os Soldados","resumo":"O uso de inteligência artificial e sistemas de drones está se tornando fundamental na defesa do flanco oriental da Europa.\nEssas tecnologias avançadas ajudam a monitorar fronteiras extensas e identificar ameaças em tempo real com maior precisão.\nAo assumir tarefas de alto risco e vigilância contínua, os sistemas autônomos reduzem a exposição de soldados a perigos diretos.\nA integração dessas ferramentas reflete uma transformação estratégica significativa na modernização das forças de defesa europeias.","link":"https://www.bild.de/politik/ostflanke-europas-wie-ki-und-drohnen-soldaten-schuetzen-6a74b9e70695ba8b04106222","categoria":"TECNOLOGIA MILITAR","lang":"pt"},{"fonte":"OtakuPT","pais":"Japão","titulo":"Sony lucra com cada jogo físico de Xbox vendido devido à tecnologia Blu-ray","resumo":"A Sony obtém lucros diretos com as vendas de jogos físicos do console Xbox, principal concorrente da sua linha PlayStation. A receita é gerada pelo licenciamento da tecnologia Blu-ray, da qual a gigante japonesa é co-criadora e detentora de patentes essenciais. O cenário evidencia o impacto de longo prazo do domínio de padrões tecnológicos na indústria global de games.","link":"https://www.otakupt.com/jogos/sony-lucra-com-cada-jogo-fisico-da-xbox-vendido-motivo-tecnologia-blu-ray/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Vero Notícias","pais":"Japão","titulo":"Japão aposta em expansão militar para impulsionar a economia","resumo":"O governo do Japão decidiu ampliar significativamente seus investimentos no setor de defesa para estimular o crescimento econômico nacional. A estratégia foca na modernização das forças armadas e no incentivo às indústrias locais de alta tecnologia e inovação. Essa medida reflete uma reformulação profunda nas políticas do país, unindo segurança geopolítica e fortalecimento da indústria interna.","link":"https://veronoticias.com/mundo/japao-aposta-em-expansao-militar-para-impulsionar-economia/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"arabnews.jp","pais":"Japão","titulo":"Arábia Saudita lidera Olimpíada Internacional de Ciência Nuclear com quatro medalhas","resumo":"A Arábia Saudita conquistou papel de destaque na primeira edição da Olimpíada Internacional de Ciência Nuclear ao garantir quatro medalhas. O evento reuniu jovens talentos globais com o objetivo de incentivar o interesse pela pesquisa em tecnologia e física nuclear. Esse resultado reflete os crescentes investimentos sauditas na formação de cientistas e no avanço do setor de energia.","link":"https://www.arabnews.jp/en/saudi-arabia/article_175670/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"哈尔滨工业大学","pais":"China","titulo":"Instituto de Tecnologia de Harbin Lidera Aliança de 66 Entidades para Inovação em Fusão e Supercondutividade","resumo":"O Instituto de Tecnologia de Harbin liderou a criação de uma aliança industrial focada nas tecnologias de fusão nuclear e supercondutividade, reunindo 66 universidades, institutos de pesquisa e empresas.\nO objetivo principal é acelerar a transferência de tecnologia e promover a comercialização de soluções avançadas de energia limpa na China.\nA iniciativa fortalece a posição do país na corrida global pelo desenvolvimento da fusão nuclear comercial e tecnologias supercondutoras de ponta.","link":"http://news.hit.edu.cn/2026/0808/c1510a243178/page.htm","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"华商网","pais":"China","titulo":"Equipe da Universidade Xidian Desenvolve Nova Tecnologia de Sensoriamento Biônico Sem Contato","resumo":"Pesquisadores da Universidade Xidian desenvolveram um novo sistema de sensoriamento biônico sem contato capaz de detectar variações ambientais e biológicas sutis com alta precisão.\nA tecnologia se inspira em mecanismos biológicos para permitir monitoramento avançado sem necessidade de tocar nas superfícies ou no corpo humano.\nO avanço abre novas fronteiras para aplicações em diagnósticos médicos não invasivos, robótica autônoma e interfaces homem-máquina.","link":"https://news.hsw.cn/system/2026/0809/1950615.shtml","categoria":"SENSORES","lang":"pt"},{"fonte":"中国科技网","pais":"China","titulo":"Tecnologia Própria Aumenta a Eficiência do Refino de Magnésio em Dez Vezes na China","resumo":"Uma nova tecnologia desenvolvida de forma independente pela China aumentou em dez vezes a eficiência do processo de refino do magnésio, considerado o metal estrutural mais leve do mundo.\nA inovação reduz drasticamente o consumo de energia e os custos operacionais da produção, viabilizando o uso em larga escala do metal.\nEsse avanço promete impulsionar indústrias estratégicas, como a aeroespacial, automotiva e de eletrônicos de alta performance.","link":"https://www.stdaily.com/web/gdxw/2026-08/08/content_561386.html","categoria":"MATERIAIS","lang":"pt"},{"fonte":"Vietnam.vn","pais":"China","titulo":"Gargalo na Tecnologia WMCM Causa Escassez Generalizada do iPhone 18 Pro Max","resumo":"O gargalo na produção e implementação da avançada tecnologia de empacotamento de semicondutores WMCM está gerando severas restrições na cadeia de suprimentos global de smartphones.\nO problema técnico impacta diretamente a fabricação de componentes críticos, afetando a disponibilidade final do iPhone 18 Pro Max nos mercados internacionais.\nA situação evidencia a dependência do setor tecnológico em processos fabris complexos e na capacidade de produção de chips de última geração.","link":"https://www.vietnam.vn/pt/nut-that-cong-nghe-wmcm-khien-iphone-18-pro-max-doi-mat-nguy-co-khan-hiem-hang-dien-rong","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"jwview.com","pais":"China","titulo":"Lin Yifu: Competição entre EUA e China em IA Dependerá da Aplicação na Produção","resumo":"O renomado economista Lin Yifu afirmou que o verdadeiro diferencial na competição global de inteligência artificial entre China e Estados Unidos estará na capacidade de integrar novas tecnologias à produção industrial.\nSegundo a análise, o domínio do setor não dependerá apenas da criação de modelos abstratos, mas da aplicação prática que eleve a produtividade real.\nA visão destaca a força da infraestrutura fabril chinesa como uma vantagem crucial para a adoção massiva e rápida da IA.","link":"https://www.jwview.com/jingwei/html/08-09/682781.shtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"beijing.gov.cn","pais":"China","titulo":"Congresso Internacional de Ciência Básica 2026 Será Abertura em Pequim","resumo":"Pequim se prepara para sediar o Congresso Internacional de Ciência Básica de 2026 no distrito de Huairou, reunindo os principais cientistas e pesquisadores do mundo.\nO evento tem como objetivo discutir avanços de ponta em matemática, física teórica e ciências da computação, além de promover colaborações científicas globais.\nA conferência reforça a estratégia da China em se consolidar como um hub mundial de pesquisa científica fundamental e inovação.","link":"https://www.beijing.gov.cn/fuwu/lqfw/gggs/202608/t20260809_4814909.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"beijing.gov.cn","pais":"China","titulo":"Pequim Lança Política de Apoio para Expansão Internacional da Economia Digital","resumo":"Pequim anunciou sua primeira política voltada exclusivamente a incentivar a expansão internacional de empresas da economia digital.\nA iniciativa prevê financiamentos anuais de até dez milhões de yuanes para plataformas que apoiem companhias de tecnologia na entrada em mercados estrangeiros.\nA medida visa acelerar a presença global das Big Techs chinesas e fortalecer ecossistemas de serviços digitais transfronteiriços.","link":"https://www.beijing.gov.cn/ywdt/gzdt/202608/t20260809_4814912.html","categoria":"ECONOMIA DIGITAL","lang":"pt"},{"fonte":"新浪新闻_手机新浪网","pais":"China","titulo":"Estreia da China na Olimpíada Internacional de Ciência Nuclear Conquista Uma Ouro e Três Pratas","resumo":"A equipe chinesa fez sua estreia na Olimpíada Internacional de Ciência Nuclear alcançando um resultado expressivo de uma medalha de ouro e três de prata.\nO torneio reúne jovens talentos de diversos países para resolver desafios complexos nas áreas de física nuclear e aplicações da radiação.\nO desempenho de destaque reflete o investimento do país na formação de jovens cientistas e no desenvolvimento do setor nuclear.","link":"https://news.sina.cn/2026-08-09/detail-inimshax3730687.d.html?vt=4","categoria":"CIÊNCIA NUCLEAR","lang":"pt"},{"fonte":"India Today","pais":"Índia","titulo":"Por dentro da missão ferroviária de hidrogênio da Índia: Por que um trem é fácil, mas centenas são um desafio","resumo":"A Índia está avançando em seus planos para descarbonizar o setor ferroviário com o desenvolvimento de trens movidos a hidrogênio.\nEmbora a construção de um protótipo inicial seja um marco viável a curto prazo, a expansão da tecnologia para centenas de composições exige avanços massivos na infraestrutura de abastecimento e produção de combustível limpo.\nEssa transição representa um passo estratégico fundamental para a neutralidade de carbono do país, redefinindo o futuro do transporte de massa nacional.","link":"https://www.indiatoday.in/science/story/inside-indias-hydrogen-rail-mission-why-one-train-is-easy-hundreds-are-a-task-2966395-2026-08-09","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"Ministro da Saúde da Índia lança documento sobre inteligência artificial em tecnologia médica","resumo":"O Ministério da Saúde da Índia apresentou um documento estratégico focado na integração da inteligência artificial ao setor de tecnologia médica.\nA iniciativa busca mapear oportunidades de inovação, padronizar diretrizes de segurança de dados e aprimorar a precisão dos diagnósticos no sistema de saúde.\nO movimento consolida a visão do país em transformar a medicina com o suporte de ferramentas digitais avançadas, aumentando o acesso e a eficiência no atendimento aos pacientes.","link":"https://newsonair.gov.in/health-minister-nadda-releases-knowledge-paper-on-ai-in-medical-technology/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"OpenGov Asia","pais":"Índia","titulo":"Rajasthan avalia tecnologia nacional de baixa emissão para manutenção de rodovias","resumo":"O estado indiano de Rajasthan iniciou a avaliação de uma nova tecnologia autóctone projetada para a manutenção de rodovias com baixa emissão de carbono.\nA solução utiliza métodos sustentáveis de pavimentação que reduzem significativamente a pegada ecológica das obras viárias sem comprometer a durabilidade do asfalto.\nSe implementada em larga escala, a inovação promete transformar o desenvolvimento de infraestrutura na região, alinhando avanços na engenharia civil às metas ambientais do país.","link":"https://opengovasia.com/rajasthan-reviews-indigenous-low-emission-road-maintenance-technology/","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"livemint.com","pais":"Índia","titulo":"Fabricante de produtos de defesa VTDS assina acordo tecnológico estratégico com a tcheca DEUS Automation","resumo":"A empresa indiana de produtos de defesa VTDS firmou uma parceria de cooperação tecnológica com a empresa tcheca DEUS Automation.\nO acordo visa transferir tecnologia e integrar sistemas de automação de ponta no desenvolvimento de equipamentos industriais e de defesa.\nEssa colaboração internacional reforça a modernização do setor fabril indiano e impulsiona a capacitação técnica para a produção de sistemas autônomos de alta complexidade.","link":"https://www.livemint.com/news/india/defence-products-manufacturer-vtds-signs-strategic-technology-pact-with-czech-republics-deus-automation-11786243654770.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Forbes","pais":"Índia","titulo":"Estudo científico mapeia pontos críticos de tubarões e raias na Ásia e expõe falhas na conservação","resumo":"Uma nova pesquisa científica internacional identificou as principais áreas de concentração de tubarões e raias ao longo da costa asiática.\nO estudo revelou lacunas críticas nas políticas atuais de preservação marinha, destacando a necessidade urgente de zonas de proteção reforçadas.\nOs dados fornecem uma base fundamental para que pesquisadores e governos desenvolvam estratégias de conservação mais eficazes, mitigando a pesca predatória e preservando a biodiversidade aquática.","link":"https://www.forbes.com/sites/melissacristinamarquez/2026/08/08/new-science-maps-asias-shark-and-ray-hotspots-and-exposes-major-conservation-gaps/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"PIB","pais":"Índia","titulo":"CSIR-NIScPR realiza treinamento de divulgação científica para motivar a comunicação com o público geral","resumo":"O instituto indiano CSIR-NIScPR promoveu um programa de capacitação focado na escrita e divulgação de ciência popular para o grande público.\nO evento buscou instruir cientistas e educadores a simplificar conceitos complexos, promovendo um engajamento mais acessível e inclusivo com a sociedade.\nA iniciativa reforça a importância da democratização do conhecimento científico na Índia, estimulando o pensamento crítico e o interesse público em inovação tecnológica.","link":"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2296560\u0026reg=1\u0026lang=1","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Índia","titulo":"Economia da Índia está protegida contra tarifas dos EUA sobre petróleo russo, diz economista","resumo":"Especialistas em economia apontam que a Índia possui resiliência suficiente para mitigar os impactos de possíveis sanções e tarifas norte-americanas relacionadas ao petróleo russo.\nA diversificação das fontes de energia e a forte demanda interna atuam como amortecedores frente a oscilações do mercado internacional.\nA análise reforça a posição estratégica da economia indiana no cenário geopolítico global, mantendo a estabilidade financeira em meio a pressões comerciais externas.","link":"https://www.moneycontrol.com/news/trade/india-us/india-s-economy-well-insulated-against-us-tariffs-on-russian-oil-says-economist-13998867.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"Ministro dos Esportes homenageia atletas indianos dos Jogos da Commonwealth 2026 com prêmios em dinheiro","resumo":"O Ministério dos Esportes da Índia realizou uma cerimônia oficial para premiar com incentivos financeiros os atletas destacados visando os Jogos da Commonwealth 2026.\nO reconhecimento busca motivar os competidores e incentivar o desenvolvimento contínuo da infraestrutura e preparação esportiva de alto rendimento no país.\nA medida reflete o investimento governamental na valorização do talento nacional e no fortalecimento da presença indiana em competições internacionais de grande porte.","link":"https://newsonair.gov.in/sports-minister-felicitates-indian-athletes-of-cwg-2026-with-cash-rewards/","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Demócrata","pais":"Portugal","titulo":"Um passo mais perto de descarbonizar a economia com hidrogênio verde","resumo":"A transição energética global tem impulsionado pesquisas focadas na produção eficiente e em grande escala de hidrogênio verde.\nNovos avanços científicos prometem reduzir significativamente os custos de produção e acelerar a substituição de combustíveis fósseis na indústria pesada.\nEssa evolução representa um marco crucial para atingir as metas internacionais de descarbonização e combater as mudanças climáticas.","link":"https://www.democrata.es/pt/europa/um-passo-mais-perto-descarbonizar-economia-com-hidrogenio-verde/","categoria":"ENERGIA","lang":"pt"},{"fonte":"Notícias de Aveiro","pais":"Portugal","titulo":"ScienceCast: A ciência dedicada à proteção de baleias, tubarões e tartarugas","resumo":"O novo episódio do ScienceCast aborda como pesquisadores utilizam dados científicos avançados para preservar espécies marinhas ameaçadas.\nProjetos de monitoramento e tecnologia marinha têm sido fundamentais para mapear rotas migratórias e reduzir os impactos da pesca ilegal.\nA iniciativa destaca a importância da divulgação científica no engajamento da sociedade para a conservação dos oceanos.","link":"https://www.noticiasdeaveiro.pt/sciencecast-baleias-tubaroes-e-tartarugas-a-ciencia-que-os-protege/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"e-global.pt","pais":"Portugal","titulo":"EUA aprovam primeira vacina contra a gripe baseada em tecnologia de mRNA","resumo":"Órgãos reguladores dos Estados Unidos aprovaram o uso da primeira vacina contra o vírus da gripe desenvolvida com a tecnologia de RNA mensageiro.\nA inovação permite uma resposta imune mais rápida e adaptada às cepas emergentes do vírus a cada temporada imunológica.\nA aprovação marca um avanço histórico para a biotecnologia médica, abrindo portas para imunizantes mais eficazes no futuro.","link":"https://e-global.pt/noticias/mundo/america-do-norte/eua-aprovam-primeira-vacina-contra-a-gripe-baseada-em-tecnologia-mrna/","categoria":"SAÚDE","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Daniela Seixas: A médica inquieta que conecta a tecnologia à saúde","resumo":"A trajetória da médica Daniela Seixas evidencia como a convergência entre inovação digital e prática clínica pode transformar a medicina.\nLiderando soluções tecnológicas aplicadas ao setor de saúde, a profissional atua para otimizar diagnósticos e personalizar tratamentos de pacientes.\nSua visão integradora reflete uma tendência crescente de startups biomédicas focadas em revolucionar o atendimento hospitalar.","link":"https://sapo.pt/artigo/daniela-seixas-a-medica-irrequieta-que-liga-a-tecnologia-a-saude-6a77515093e2ef392117d585","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The Portugal News","pais":"Portugal","titulo":"Austrália combina tecnologia com conhecimento indígena sobre incêndios","resumo":"Uma nova estratégia de gestão ambiental na Austrália une ferramentas tecnológicas avançadas a técnicas ancestrais de queimadas controladas.\nO uso de sensores, satélites e drones alinhado aos saberes dos povos originários tem demonstrado alta eficácia na prevenção de grandes queimadas.\nO modelo tem sido apontado por especialistas internacionais como um exemplo inovador de mitigação de desastres naturais.","link":"https://www.theportugalnews.com/br/noticias/2026-08-08/australia-combina-tecnologia-com-conhecimento-de-fogo-indigena/1067487","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Portal Impala","pais":"Portugal","titulo":"IA pode ser o maior fator de aumento de produtividade da década, afirma Paulo Dimas","resumo":"O especialista Paulo Dimas destaca que a inteligência artificial generativa está redefinindo os padrões operacionais das empresas globais.\nA automação de processos complexos e a análise massiva de dados estão alavancando a eficiência em diversos setores do mercado.\nSegundo o executivo, o investimento estratégico em ferramentas de IA será o grande diferencial competitivo dos próximos anos.","link":"https://www.impala.pt/noticias/economia/ia-pode-ser-o-maior-fator-de-aumento-de-produtividade-da-decada-paulo-dimas/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"SÁBADO","pais":"Portugal","titulo":"Inteligência Artificial está sendo usada para criar novos vírus","resumo":"Cientistas e especialistas em biossegurança alertam para o uso indevido de ferramentas de IA no desenvolvimento de sequências virais inéditas.\nA capacidade dos modelos de linguagem em projetar estruturas biológicas acelera pesquisas médicas, mas gera sérios riscos de uso bélico.\nA descoberta reforça a urgência por regulamentações internacionais rigorosas para limitar aplicações perigosas da tecnologia.","link":"https://www.sabado.pt/ciencia---saude/detalhe/inteligencia-artificial-esta-a-ser-usada-para-criar-novos-virus","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"sicnoticias.pt","pais":"Portugal","titulo":"Tecnologia na fisioterapia: aliada da reabilitação ou ameaça à profissão?","resumo":"A introdução de dispositivos robóticos e sensores inteligentes está transformando a área de fisioterapia e reabilitação motora.\nEnquanto especialistas apontam ganhos de precisão e recuperação mais rápida dos pacientes, surgem debates sobre o papel do fisioterapeuta.\nO consenso atual indica que a tecnologia deve atuar como suporte complementar, sem substituir o acompanhamento humano essencial.","link":"https://sicnoticias.pt/especiais/consulta-aberta/2026-08-08-video-tecnologia-na-fisioterapia-aliada-da-reabilitacao-ou-ameaca-a-profissao--c56fd148","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Correio Braziliense","pais":"Brazil","titulo":"The Chinese technology attempting to create infinite energy using the Sun's process","resumo":"China is making headway in developing nuclear fusion reactors known as artificial suns.\nThis technology aims to replicate the same physical process that powers the Sun to generate clean energy.\nThe goal is to achieve an inexhaustible source of electricity without emitting greenhouse gases.\nIf successful, this innovation could radically transform the global energy landscape in the coming decades.","link":"https://www.correiobraziliense.com.br/cbradar/a-tecnologia-chinesa-que-tenta-criar-energia-infinita-usando-o-mesmo-processo-do-sol/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Jornal O Sul","pais":"Brazil","titulo":"How new AI-created viruses could change science despite raising concerns","resumo":"Scientists are utilizing advanced artificial intelligence tools to design new types of viruses.\nThe innovation promises to accelerate the creation of vaccines and treatments for highly complex diseases.\nHowever, biologists are warning about the biosecurity and ethical risks related to the synthetic creation of pathogens.\nThe discussion seeks to balance the enormous scientific potential of this research with strict regulations.","link":"https://www.osul.com.br/como-novos-virus-criados-por-inteligencia-artificial-podem-mudar-a-ciencia-apesar-de-causarem-preocupacao/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"Camera systems use artificial intelligence and promise to anticipate crimes","resumo":"New video monitoring systems incorporate artificial intelligence to identify suspicious patterns in real time.\nThe technology aims to assist security forces by predicting illicit behavior even before it occurs.\nExperts highlight the efficiency gains for urban patrols and property protection.\nOn the other hand, debates are emerging regarding data privacy and the dangers of potential algorithmic biases.","link":"https://g1.globo.com/google/amp/economia/tecnologia/video/sistemas-de-cameras-usam-inteligencia-artificial-e-prometem-se-antecipar-a-crimes-14783434.ghtml","categoria":"SECURITY","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"China launches its 1st zero-carbon industrial park, featuring battery and wind turbine factories","resumo":"China has announced the operation of its first industrial park designed to be entirely carbon-neutral.\nThe complex houses facilities dedicated to the large-scale production of high-efficiency batteries and wind turbines.\nThe entire infrastructure of the site is powered exclusively by renewable and clean energy sources.\nThe project establishes a new paradigm for sustainable manufacturing and the global energy transition.","link":"https://www1.folha.uol.com.br/mercado/2026/08/china-tem-1o-parque-industrial-zero-carbono-com-fabricas-de-baterias-e-de-turbinas-eolicas.shtml","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"marsemfim.com.br","pais":"Brazil","titulo":"Unknown ocean: half of it still escapes science","resumo":"Recent studies reveal that more than half of the planet's oceanic depths remain completely unexplored.\nThe lack of scientific data limits our understanding of marine biodiversity and global climate regulation.\nAdvances in autonomous submersibles and satellite mapping promise to accelerate expeditions in the coming years.\nMapping these ecosystems is fundamental to protecting the planet against the impacts of climate change.","link":"https://marsemfim.com.br/oceano-desconhecido-metade-escapa-ciencia/","categoria":"SCIENCE","lang":"en"},{"fonte":"CNN Brasil","pais":"Brazil","titulo":"Program offers free AI and technology course to students from the 8th grade through senior year","resumo":"A new educational initiative is providing free openings in artificial intelligence and technology courses.\nThe program is aimed at students from the 8th grade of middle school through the 3rd year of high school.\nThe goal is to train young talent and prepare them for the growing demands of the digital market.\nClasses cover programming fundamentals, data logic, and practical applications of technological tools.","link":"https://www.cnnbrasil.com.br/educacao/programa-oferece-curso-gratuito-de-ia-e-tecnologia-a-alunos-do-8o-ao-3-ano/","categoria":"EDUCATION","lang":"en"},{"fonte":"Veja Saúde","pais":"Brazil","titulo":"Does wormwood tea offer any benefits? Here is what science says about the infusion","resumo":"Wormwood tea is popularly known for its medicinal properties, but it is drawing attention from the scientific community.\nResearch points to potential digestive and antioxidant effects provided by the plant's active compounds.\nHowever, experts warn against moderate consumption due to the presence of substances that can be toxic in excess.\nScience recommends prior medical guidance before using the beverage for therapeutic purposes.","link":"https://saude.abril.com.br/alimentacao/cha-de-absinto-traz-algum-beneficio-veja-o-que-a-ciencia-diz-sobre-a-infusao/","categoria":"HEALTH","lang":"en"},{"fonte":"O POVO+","pais":"Brazil","titulo":"Student from Fortaleza selected for technology exchange program in China","resumo":"A student from Fortaleza has won a spot in a prestigious tech exchange program in China.\nThe opportunity will allow the student to delve deeper into innovative areas of robotics and artificial intelligence.\nThe exchange highlights the relevance of Brazilian academic training and the potential of youth in science.\nThe immersion aims to promote the exchange of practical knowledge between Brazilian and Chinese educational institutions.","link":"https://mais.opovo.com.br/jornal/cidades/2026/08/09/estudante-de-fortaleza-e-selecionada-para-intercambio-de-tecnologia-na-china.html","categoria":"INNOVATION","lang":"en"},{"fonte":"simplywall.st","pais":"United States","titulo":"Marvell Technology surges 16.6% after unveiling disaggregated memory architecture for AI data centers","resumo":"Marvell Technology has introduced a new disaggregated memory architecture developed specifically to accelerate and optimize data centers geared toward Artificial Intelligence.\nThe innovation promises to overcome the bandwidth and capacity bottlenecks that currently limit the processing of advanced models.\nFollowing the announcement, the company's shares registered a significant 16.6% jump in the financial market.\nThe advance represents a strategic leap in the infrastructure needed to sustain the rapid expansion of the AI ecosystem.","link":"https://simplywall.st/stocks/us/semiconductors/nasdaq-mrvl/marvell-technology/news/marvell-technology-mrvl-is-up-166-after-unveiling-disaggrega","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Tagesspiegel","pais":"United States","titulo":"AI as Creator: The risks of Stanford's lab-developed virus technology","resumo":"Stanford researchers are investigating the potential and the dangers of using Artificial Intelligence to design new viruses and biological structures in the lab.\nAlthough the technology can accelerate the creation of vaccines and medical treatments, it also raises critical biosecurity concerns regarding the potential generation of lethal pathogens.\nThis advancement has rekindled the ethical debate over the limits of generative model autonomy in synthetic biology.\nExperts are demanding strict guidelines and regulations to contain potential global threats.","link":"https://www.tagesspiegel.de/wissen/auf-dem-weg-zum-super-erreger-forscher-basteln-neue-infektiose-viren-mit-kunstlicher-intelligenz-15925966.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Technology Org","pais":"United States","titulo":"Too thin to fail: A conductive alternative to copper in microchips","resumo":"Scientists have developed a new ultra-thin material to replace traditional copper connections used in the manufacturing of microchips and semiconductors.\nAs chips become smaller, copper wires face serious electrical resistance and overheating problems that degrade performance.\nThe new atomic-scale alternative makes it possible to maintain energy efficiency and data transmission speed without losing stability.\nThe breakthrough paves the way to sustaining the evolution of high-performance computing in the future.","link":"https://www.technology.org/2026/08/09/too-thin-to-fail-an-alternative-to-copper-microchip-interconnects/","categoria":"HARDWARE","lang":"en"},{"fonte":"O GLOBO","pais":"United States","titulo":"Amazon funds construction of massive gas plant in the US to power data centers","resumo":"To supply the growing energy demand driven by its Artificial Intelligence data centers, Amazon is funding a large-scale gas power plant in the US.\nThe initiative highlights the unprecedented pressure on electrical grids caused by the massive advancement of cloud computing technologies.\nAlthough the tech giant maintains decarbonization goals, the urgency for constant electricity is driving fossil fuel energy contracts.\nThe project reignites intense discussions about the environmental impacts associated with the AI boom.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/08/08/amazon-financia-construcao-de-enorme-usina-a-gas-nos-eua-para-data-center.ghtml","categoria":"ENERGY","lang":"en"},{"fonte":"CNN Brasil","pais":"United States","titulo":"California records high tech sector unemployment despite AI boom","resumo":"Despite the optimism and multibillion-dollar investments driven by Artificial Intelligence, the state of California is facing an increase in unemployment rates within the technology sector.\nMultiple corporate restructurings and mass layoffs continue to affect traditional IT workers and administrative areas.\nThe phenomenon highlights a structural mismatch between rapid hiring in generative AI niches and downsizing in other divisions of major companies.\nThe situation sounds an alarm regarding the reconfiguration of the tech labor market in the United States.","link":"https://www.cnnbrasil.com.br/economia/macroeconomia/california-tem-alto-desemprego-no-setor-de-tech-apesar-de-boom-da-ia/","categoria":"MARKET","lang":"en"},{"fonte":"BBC","pais":"United States","titulo":"From OpenAI to Meta: Why AI bots continue carrying out hacker attacks","resumo":"Artificial Intelligence agents and tools associated with major companies, such as OpenAI and Meta, are being exploited by cybercriminals to automate complex intrusions and cyberattacks.\nThe models' ability to generate malicious code, identify vulnerabilities, and customize phishing scams has significantly increased the scale of threats.\nTech companies are trying to implement stricter protection barriers, but attackers continue to find loopholes to bypass the filters.\nThe scenario reinforces the urgency of new AI-driven defensive strategies to curb the risks.","link":"https://www.bbc.com/portuguese/articles/c87nr1z7nl0o","categoria":"SECURITY","lang":"en"},{"fonte":"ScienceDaily","pais":"United States","titulo":"Tiny gold crystal could pull quantum technology out of deep freeze","resumo":"A new discovery utilizing microscopic gold crystals promises to revolutionize quantum computing by enabling operations at higher temperatures.\nCurrently, quantum systems require extreme freezing conditions close to absolute zero to maintain qubit stability.\nThe new material helps preserve quantum coherence without the need for giant, extremely costly refrigeration infrastructures.\nThe innovation brings quantum technology closer to real-world, commercial-scale applications.","link":"https://www.sciencedaily.com/releases/2026/08/260806050706.htm","categoria":"SCIENCE","lang":"en"},{"fonte":"techxplore.com","pais":"United States","titulo":"Cognitive Science-Based AI Framework Promises to Complete Tasks with Greater Efficiency","resumo":"Researchers have developed a new Artificial Intelligence architecture inspired by the mental processes and learning mechanisms of the human brain.\nBy integrating cognitive science principles, the system is able to reason and execute complex tasks using a fraction of the processing power and energy consumption required by current models.\nThe approach aims to reduce reliance on massive datasets and expensive computing infrastructure.\nThe innovation marks a significant step toward more sustainable and adaptable AI algorithms.","link":"https://techxplore.com/news/2026-07-ai-framework-rooted-cognitive-science.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ladepeche.fr","pais":"France","titulo":"\"This is not science fiction\": hybrid or 100% electric planes in service by 2030... Is it really happening?","resumo":"The aviation sector is accelerating investments in the development of hybrid and fully electric aircraft, with commercial entry into service targeted by 2030.\nThis transition seeks to significantly reduce air transport carbon emissions and meet global environmental mandates.\nHowever, experts highlight regulatory, infrastructure, and battery-range challenges to make this technology viable on a large scale.","link":"https://www.ladepeche.fr/2026/08/09/il-ne-sagit-pas-de-science-fiction-des-avions-hybrides-ou-100-electriques-en-service-des-2030-vraiment-13500380.php","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"revueconflits.com","pais":"France","titulo":"Apple and OpenAI Intensify Legal Dispute Over ChatGPT Creator's Future Devices","resumo":"Relations between tech giants are growing increasingly tense as OpenAI expands its plans to develop proprietary hardware focused on artificial intelligence.\nApple is closely monitoring these developments to protect its ecosystem and patents, triggering strategic legal clashes.\nThe outcome of this dispute could redefine how next-generation mobile devices integrate native smart assistants.","link":"https://www.revueconflits.com/apple-et-openai-durcissent-leur-bataille-judiciaire-sur-les-futurs-appareils-du-createur-de-chatgpt/","categoria":"BUSINESS","lang":"en"},{"fonte":"Yahoo Actualités","pais":"France","titulo":"Why AI creators themselves restrict the technology for their own children","resumo":"Executives and engineers behind major breakthroughs in artificial intelligence have adopted rigorous measures to limit their own children's exposure to screens and digital tools.\nThe decision reflects concerns regarding the impact of early exposure to these technologies on youths' cognitive and social development.\nThis behavior raises an important debate surrounding the safety and ethical boundaries of products marketed to the general public.","link":"https://fr.news.yahoo.com/pourquoi-fabriquent-l-ia-limitent-175113022.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"L'Usine Nouvelle","pais":"France","titulo":"She created propulsion technology for small satellites: hailing from Norway, Ane Aanesland is revolutionizing the French space sector","resumo":"Norwegian physicist Ane Aanesland has developed an innovative plasma propulsion system designed specifically to miniaturize and optimize small satellites.\nHer France-based startup has attracted major investments and become a foundational piece in the new European space race.\nThe breakthrough drives sustainability and operational efficiency in orbit, lowering the cost of commercial and scientific missions.","link":"https://www.usinenouvelle.com/aero-spatial/elle-a-cree-une-technologie-de-propulsion-pour-les-petits-satellites-venue-de-norvege-ane-aanesland-revolutionne-le-spatial-francais.ECRTBTBJEZP7PMX5NHLFTESBXI.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Les Echos","pais":"France","titulo":"\"The French economy is on a tightrope\": AXA's chief economist issues warning","resumo":"The head of economic research at the AXA group has issued a stark warning regarding the fragility and slowdown risks facing the French economy.\nAmong the pressure factors are persistent inflation, fiscal uncertainties, and volatility in European financial markets.\nThe warning highlights the need for structural reforms to guarantee growth and avoid a crisis of investor confidence.","link":"https://www.lesechos.fr/economie-france/conjoncture/leconomie-francaise-est-sur-le-fil-du-rasoir-lalerte-du-chef-economiste-daxa-2246406","categoria":"ECONOMY","lang":"en"},{"fonte":"The Times of India","pais":"United Kingdom","titulo":"Europe's largest tech firm SAP halts travel and hiring, urges spending discipline","resumo":"European technology giant SAP has announced a freeze on new hires and a suspension of corporate travel to curb expenses.\nLeadership has instructed employees to maintain strict financial discipline amid recent global market volatility.\nThe decision follows an operational restructuring trend seen across various companies in the tech sector.","link":"https://timesofindia.indiatimes.com/technology/tech-news/europes-largest-technology-company-sap-stops-all-travel-and-hiring-tells-employees-we-need-to-be-disciplined-in-how-we-spend/articleshow/133030460.cms","categoria":"BUSINESS","lang":"en"},{"fonte":"AV Magazine","pais":"United Kingdom","titulo":"Defining Broadcast AV with Matrox ConvertIP Technology","resumo":"Matrox ConvertIP technology redefines audio and video broadcasting by integrating traditional infrastructure with advanced IP networks.\nThe system ensures high-quality media conversion with near-zero latency, significantly optimizing studio operational efficiency.\nThis solution drives the digitization of the audiovisual sector, offering greater flexibility for live productions and complex broadcasts.","link":"https://www.avinteractive.com/sponsored-story/defining-broadcast-av-with-matrox-convertip-technology-08-08-2026/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"nikkei.com","pais":"United Kingdom","titulo":"Fried foods disappear from UK school lunches to combat childhood obesity","resumo":"The United Kingdom has begun removing fried foods from school meal menus as a strategy against childhood obesity.\nThe action aims to improve youths' dietary habits and reduce the long-term financial impact on the public healthcare system.\nHealth authorities emphasize that early interventions in the school environment are crucial to curbing the rise of chronic illnesses.","link":"https://www.nikkei.com/article/DGXZQOGR22BO10S6A720C2000000/","categoria":"HEALTH","lang":"en"},{"fonte":"The Guardian","pais":"United Kingdom","titulo":"US accused of meddling in British politics with $500,000 public education grant scheme","resumo":"The United States has been accused of interfering in British politics after granting $500,000 for educational courses.\nThe initiative raised questions among lawmakers regarding foreign influence over the country's pedagogical and ideological guidelines.\nThe case has amplified discussions on the limits of international funding and the preservation of British institutional sovereignty.","link":"https://www.theguardian.com/us-news/2026/aug/08/us-accused-of-meddling-in-british-politics-with-500000-grant-scheme-promoting-shared-values","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"OkDiario","pais":"Spain","titulo":"Astonishment among geologists: the great Antarctic current was not caused by continental drift alone","resumo":"A new scientific discovery is redefining our understanding of the formation of the Antarctic Circumpolar Current.\nRecent studies indicate that the emergence of this major ocean current involved factors beyond simple continental separation.\nThe research provides new perspectives on how global climate and marine circulation evolved across geological eras.\nThis theoretical revision directly impacts climate forecasting models and our understanding of ocean warming.","link":"https://okdiario.com/ciencia/estupor-geologos-gran-corriente-antartida-no-origino-solo-separacion-continentes-sino-aparicion-vientos-del-oeste-19093790","categoria":"SCIENCE","lang":"en"},{"fonte":"Computer Hoy","pais":"Spain","titulo":"What is DVB-T2, the technology set to change everything for Spanish DTT?","resumo":"Spain is on the verge of revamping its Digital Terrestrial Television with the rollout of the DVB-T2 standard.\nThis technological evolution promises high-definition broadcasts with improved bandwidth efficiency.\nIn addition to enhanced image quality, the new system allows for greater integration with interactive services.\nThe shift will require the Spanish population to adapt their receivers and televisions.","link":"https://computerhoy.20minutos.es/entretenimiento/que-es-dvb-t2-tecnologia-que-quiere-cambiarlo-todo-tdt-espana_7019516_0.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Alicante Plaza","pais":"Spain","titulo":"Heligrafics launches augmented reality technology to improve wildfire suppression","resumo":"Spanish firm Heligrafics has developed an augmented reality-based solution for firefighting.\nThe tool allows emergency teams to overlay critical real-time data onto the terrain.\nWith this innovation, tactical coordination and the safety of firefighters in the field take a significant leap forward.\nThe project highlights the role of advanced technology in mitigating recurring environmental disasters.","link":"https://alicanteplaza.es/alicanteplaza/alcoy-el-comtat/la-alcoyana-heligrafics-despliega-tecnologia-de-realidad-aumentada-que-mejora-la-coordinacion-en-los-fuegos-forestales","categoria":"INNOVATION","lang":"en"},{"fonte":"democrata.es","pais":"Spain","titulo":"A step closer to decarbonizing the economy with green hydrogen","resumo":"Recent breakthroughs in green hydrogen production are driving the global energy transition.\nThe technology seeks to replace fossil fuels in hard-to-abate industries and heavy transport.\nNew projects reinforce the economic viability and efficiency of water electrolysis processes.\nThis evolution positions clean energy as a central vector for achieving net-zero emission goals.","link":"https://www.democrata.es/europa/bruselas-autoriza-780-millones-hidrogeno-verde/","categoria":"ENERGY","lang":"en"},{"fonte":"Yahoo","pais":"Spain","titulo":"KTM Group gains ground with premium motorcycles: technology, power, and market evolution","resumo":"The KTM Group is strengthening its presence in the international market by focusing on high-end motorcycle innovation.\nThe inclusion of electronic rider aids and new connectivity systems raises the bar for the brand's models.\nThe strategy pairs performance power with rider safety-focused technologies.\nThe segment's consolidation reflects the growing demand for highly technological two-wheeled vehicles.","link":"https://es-us.noticias.yahoo.com/grupo-ktm-gana-terreno-motos-230000704.html","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"elmundo.es","pais":"Spain","titulo":"An economy dependent on a chip","resumo":"Global reliance on semiconductors has made chips crucial elements for worldwide economic stability.\nSectors ranging from the automotive industry to mobile devices face supply chain challenges.\nCountries and economic blocks are accelerating local investments to guarantee technological sovereignty and security.\nThe scenario highlights how microelectronics has become the central engine of current growth and geopolitics.","link":"https://www.elmundo.es/economia/macroeconomia/2026/08/09/6a74904de4d4d8cc518b456d.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"El Periódico de España","pais":"Spain","titulo":"Móstoles Hospital incorporates cutting-edge technology for complex eye surgery","resumo":"The Móstoles Hospital has acquired state-of-the-art surgical equipment aimed at ophthalmological interventions.\nThe new technology offers greater microsurgical precision, reducing patient recovery time.\nHighly complex procedures are now performed with superior levels of safety and efficacy.\nThe initiative positions the health center as a benchmark in adopting innovations for ocular medicine.","link":"https://www.epe.es/es/madrid/20260808/hospital-universitario-mostoles-incorpora-plataforma-quirurgica-avanzada-cirugia-ocular-133202346","categoria":"HEALTH","lang":"en"},{"fonte":"Ayuntamiento de Jerez","pais":"Spain","titulo":"City council installs new LED lighting technology in the rural neighborhood of La Guareña","resumo":"The city council has started the modernization of the public lighting network in the rural community of La Guareña.\nThe project replaces old fixtures with LED models featuring greater energy efficiency and lower cost.\nThe intervention improves nighttime visibility, increasing safety and the quality of life for residents.\nThe measure is part of a sustainability plan to reduce the municipality's carbon footprint.","link":"https://www.jerez.es/webs-municipales/sala-de-prensa/nota-de-prensa/el-ayuntamiento-acomete-la-instalacion-de-un-nuevo-alumbrado-con-tecnologia-led-en-la-barriada-rural-de-la-guarena","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"BILD","pais":"Germany","titulo":"Europe's Eastern Flank: How AI and Drones Protect Soldiers","resumo":"The use of artificial intelligence and drone systems is becoming fundamental in defending Europe's eastern flank.\nThese advanced technologies help monitor extensive borders and identify threats in real time with greater precision.\nBy taking over high-risk tasks and continuous surveillance, autonomous systems reduce soldiers' exposure to direct dangers.\nThe integration of these tools reflects a significant strategic transformation in the modernization of European defense forces.","link":"https://www.bild.de/politik/ostflanke-europas-wie-ki-und-drohnen-soldaten-schuetzen-6a74b9e70695ba8b04106222","categoria":"MILITARY TECHNOLOGY","lang":"en"},{"fonte":"OtakuPT","pais":"Japan","titulo":"Sony profits from every physical Xbox game sold due to Blu-ray technology","resumo":"Sony makes direct profits from physical game sales for the Xbox console, the main competitor to its PlayStation line. The revenue is generated through the licensing of Blu-ray technology, of which the Japanese giant is a co-creator and holder of essential patents. The scenario highlights the long-term impact of technological standards dominance in the global gaming industry.","link":"https://www.otakupt.com/jogos/sony-lucra-com-cada-jogo-fisico-da-xbox-vendido-motivo-tecnologia-blu-ray/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Vero Notícias","pais":"Japan","titulo":"Japan bets on military expansion to boost the economy","resumo":"The Japanese government has decided to significantly expand its investments in the defense sector to stimulate national economic growth. The strategy focuses on modernizing the armed forces and encouraging local high-tech and innovation industries. This measure reflects a profound overhaul of the country's policies, uniting geopolitical security and the strengthening of domestic industry.","link":"https://veronoticias.com/mundo/japao-aposta-em-expansao-militar-para-impulsionar-economia/","categoria":"BUSINESS","lang":"en"},{"fonte":"arabnews.jp","pais":"Japan","titulo":"Saudi Arabia leads International Nuclear Science Olympiad with four medals","resumo":"Saudi Arabia secured a prominent role in the first edition of the International Nuclear Science Olympiad by securing four medals. The event brought together young global talents with the goal of encouraging interest in research within technology and nuclear physics. This result reflects growing Saudi investments in training scientists and advancing the energy sector.","link":"https://www.arabnews.jp/en/saudi-arabia/article_175670/","categoria":"SCIENCE","lang":"en"},{"fonte":"哈尔滨工业大学","pais":"China","titulo":"Harbin Institute of Technology Leads Alliance of 66 Entities for Fusion and Superconductivity Innovation","resumo":"The Harbin Institute of Technology led the creation of an industrial alliance focused on nuclear fusion and superconductivity technologies, bringing together 66 universities, research institutes, and companies.\nThe main goal is to accelerate technology transfer and promote the commercialization of advanced clean energy solutions in China.\nThe initiative strengthens the country's position in the global race for commercial nuclear fusion development and cutting-edge superconducting technologies.","link":"http://news.hit.edu.cn/2026/0808/c1510a243178/page.htm","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"华商网","pais":"China","titulo":"Xidian University Team Develops New Contactless Bionic Sensing Technology","resumo":"Researchers at Xidian University have developed a new contactless bionic sensing system capable of detecting subtle environmental and biological variations with high precision.\nThe technology draws inspiration from biological mechanisms to enable advanced monitoring without the need to touch surfaces or the human body.\nThe breakthrough opens new frontiers for applications in non-invasive medical diagnostics, autonomous robotics, and human-machine interfaces.","link":"https://news.hsw.cn/system/2026/0809/1950615.shtml","categoria":"SENSORS","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"Proprietary Technology Increases Magnesium Refining Efficiency Tenfold in China","resumo":"A new technology independently developed by China has increased the refining efficiency of magnesium—considered the world's lightest structural metal—by tenfold.\nThe innovation drastically reduces energy consumption and production operational costs, making large-scale use of the metal viable.\nThis breakthrough promises to boost strategic industries such as aerospace, automotive, and high-performance electronics.","link":"https://www.stdaily.com/web/gdxw/2026-08/08/content_561386.html","categoria":"MATERIALS","lang":"en"},{"fonte":"Vietnam.vn","pais":"China","titulo":"WMCM Technology Bottleneck Causes Widespread Shortage of iPhone 18 Pro Max","resumo":"A bottleneck in the production and implementation of advanced WMCM semiconductor packaging technology is generating severe restrictions in the global smartphone supply chain.\nThe technical issue directly impacts the manufacturing of critical components, affecting the final availability of the iPhone 18 Pro Max in international markets.\nThe situation highlights the technology sector's reliance on complex manufacturing processes and cutting-edge chip production capacity.","link":"https://www.vietnam.vn/pt/nut-that-cong-nghe-wmcm-khien-iphone-18-pro-max-doi-mat-nguy-co-khan-hiem-hang-dien-rong","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"jwview.com","pais":"China","titulo":"Lin Yifu: US-China AI Competition Will Depend on Production Application","resumo":"Renowned economist Lin Yifu stated that the true differential in the global artificial intelligence competition between China and the United States will lie in the ability to integrate new technologies into industrial production.\nAccording to the analysis, dominance in the sector will not depend solely on creating abstract models, but on practical applications that elevate real productivity.\nThe view highlights the strength of China's manufacturing infrastructure as a crucial advantage for the massive and rapid adoption of AI.","link":"https://www.jwview.com/jingwei/html/08-09/682781.shtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"beijing.gov.cn","pais":"China","titulo":"2026 International Congress
