lang":"en"},{"fonte":"Xataka","pais":"Spain","titulo":"We thought taking 'micro-breaks' at work boosted productivity. Science brings bad (and good) news","resumo":"Recent scientific studies have reassessed the effectiveness of short work-day interruptions in improving professional performance.\nAlthough they help reduce immediate mental fatigue, micro-breaks do not always guarantee a direct gain in overall productivity.\nResearch indicates that the real impact depends on the type of activity performed and the timing of the rest.","link":"https://www.xataka.com/investigacion/hemos-creido-que-hacer-micropausas-trabajo-nos-hace-productivos-ciencia-tiene-malas-buenas-noticias","categoria":"BEHAVIOR","lang":"en"},{"fonte":"Elplural.com","pais":"Spain","titulo":"Renault Scenic E-Tech: Long range and next-generation technology","resumo":"Renault has launched the new Scenic E-Tech, an all-electric model focused on energy efficiency and advanced connectivity.\nThe vehicle stands out for its impressive battery range, catering to the needs of long-distance travel.\nIn addition to its modern design, the automobile features intelligent driving assistants to enhance the behind-the-wheel experience.","link":"https://www.elplural.com/motor/coches/renault-scenic-e-tech-mucha-autonomia-tecnologia-ultima-generacion_397834102","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"Auto Motor und Sport","pais":"Germany","titulo":"Beware of parallel imports: Audis from China in Germany turn into a major financial trap","resumo":"The parallel import of Audi electric vehicles manufactured in China into the German market is proving to be a financial trap for consumers.\nSeveral technological and software features do not function properly outside the Chinese ecosystem due to regional limitations and a lack of local support.\nFurthermore, the absence of an official warranty and incompatibility with system updates generate exorbitant unforeseen costs.","link":"https://www.auto-motor-und-sport.de/verkehr/china-audi-in-deutschland-mit-e5-und-e7x-lohnt-sich-der-parallelimport-mit-preisaufschlag/","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"Spektrum der Wissenschaft","pais":"Germany","titulo":"Beyond lithium: How sodium-ion batteries could transform the world","resumo":"Sodium-ion batteries are emerging as a promising and sustainable alternative to traditional lithium-ion batteries in the energy sector.\nWith reduced production costs and abundant raw materials, this technology promises to accelerate the energy transition and popularize electric vehicles.\nScientific advancements in the energy density of these cells could redefine the future of global electricity storage.","link":"https://www.spektrum.de/news/wie-natrium-ionen-batterien-die-welt-veraendern-koennten/2339766","categoria":"SCIENTIFIC INNOVATION","lang":"en"},{"fonte":"Mindener Tageblatt","pais":"Germany","titulo":"Partial victory for AI company Anthropic in dispute with the Pentagon","resumo":"Artificial intelligence startup Anthropic has achieved a significant legal victory in its dispute with the United States Department of Defense.\nThe standoff involves the ethical use and regulatory limits of applying generative AI models in defense contracts and systems.\nThe decision represents a major milestone in global debates regarding AI governance and military technology alignment.","link":"https://www.mt.de/weltnews/wirtschaft/wirtschaft-ueberblick/Etappensieg-fuer-KI-Firma-Anthropic-in-Streit-mit-Pentagon-24405569.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Deutsche Bank AG","pais":"Germany","titulo":"Deutsche Bank's private bank hits milestone in its technological transformation","resumo":"Deutsche Bank's Private Banking division has completed a decisive phase in modernizing and migrating its technology infrastructure.\nThe consolidation of legacy systems into cloud platforms has optimized operational efficiency and significantly improved the digital customer experience.\nThis transformation solidifies the financial institution at the forefront of the European banking sector's digitalization.","link":"https://www.db.com/news/detail/20260827-deutsche-bank-s-private-bank-reaches-technology-transformation-milestone?language_id=1","categoria":"DIGITAL TRANSFORMATION","lang":"en"},{"fonte":"株式会社インプレス","pais":"Japan","titulo":"KDDI and Michinori Holdings test AI communication technology for autonomous buses","resumo":"KDDI and Michinori Holdings have launched a demonstration project focused on enhancing autonomous buses.\nThe initiative utilizes artificial intelligence and advanced mobile networks to ensure communication stability and operational safety.\nThe test aims to enable efficient public transport solutions in urban and rural areas facing driver shortages.\nThis innovation positions Japan as a benchmark in deploying highly reliable autonomous transport.","link":"https://ai.watch.impress.co.jp/docs/news/2136524.html","categoria":"MOBILITY","lang":"en"},{"fonte":"MONOist","pais":"Japan","titulo":"New 3D packaging technology integrates circuits and reduces component area by 80%","resumo":"Researchers and engineers have developed a three-dimensional packaging technology that unifies integrated circuits and passive components.\nThe created prototype demonstrated an impressive 80% reduction in the area required for board mounting.\nThe innovation is fundamental for advancing increasingly smaller, efficient, and high-performance embedded devices.\nThis solution promises to transform industrial hardware production for sectors such as artificial intelligence and automotive.","link":"https://monoist.itmedia.co.jp/mn/articles/2608/28/news070.html","categoria":"HARDWARE","lang":"en"},{"fonte":"共同通信PRワイヤー","pais":"Japan","titulo":"Broadcom expands strategic collaboration in memory and foundry technology","resumo":"Broadcom has announced the expansion of its strategic partnership focused on memory and semiconductor technologies.\nThe agreement aims to accelerate innovation in developing advanced chips essential for data infrastructure.\nThis cooperation strengthens the global supply chain and boosts the production of next-generation components.\nThrough this alliance, the companies aim to meet the growing demand driven by artificial intelligence systems.","link":"https://kyodonewsprwire.jp/release/202608274836","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"tohoku.ac.jp","pais":"Japan","titulo":"New technology identifies essential nucleic acid-binding proteins in metabolism","resumo":"Scientists have developed an innovative method capable of mapping and identifying proteins that bind to specific nucleic acid structures.\nResearch revealed that a key enzyme in sugar metabolism has the ability to interact with these formations.\nThe discovery opens promising avenues for understanding complex cellular biological processes and metabolic diseases.\nAdditionally, the technology could drive the creation of new therapeutic approaches and targeted medications.","link":"https://www.tohoku.ac.jp/japanese/2026/08/press20260828-01-protein.html","categoria":"SCIENCE","lang":"en"},{"fonte":"EE Times Japan","pais":"Japan","titulo":"Optical transmission and optoelectronic fusion drive next-generation computing","resumo":"The convergence of optical and electronic technologies emerges as a pillar for overcoming the limits of current computers.\nOptoelectronic fusion enables rapid data transfer with significantly reduced energy consumption.\nThese advancements are crucial to supporting the massive processing demands required by neural networks and data centers.\nThe initiative consolidates a new era in the development of ultra-high-performance computing architectures.","link":"https://eetimes.itmedia.co.jp/ee/articles/2608/28/news044.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"projectdesign.jp","pais":"Japan","titulo":"Hitachi acquires intellectual property for synthetic methane manufacturing","resumo":"Hitachi has acquired the intellectual property of a German company focused on synthetic methane production.\nThe company's goal is to accelerate the commercialization and expansion of this clean energy technology in Japan.\nThe solution contributes to decarbonization by reusing carbon dioxide in the fuel generation process.\nThis strategic move positions Hitachi at the forefront of the energy transition and industrial sustainability.","link":"https://www.projectdesign.jp/articles/news/33c7802a-baa3-4039-9588-784ad54ab2a3","categoria":"INNOVATION","lang":"en"},{"fonte":"Science Portal Asia Pacific","pais":"Japan","titulo":"KAIST develops AI technologies that eliminate hallucinations in the dark and smoky environments","resumo":"Researchers at KAIST have created two technologies that drastically reduce artificial intelligence perception failures.\nThe new algorithms prevent autonomous systems from making identification errors in nighttime or smoke-filled environments.\nThe innovation brings greater reliability to rescue robots, autonomous cars, and emergency operations in critical scenarios.\nThe breakthrough represents a significant leap forward for the practical application of AI in high-risk environments.","link":"https://spap.jst.go.jp/korea/news/260804/topic_nk_05.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"Toyota plans to produce next-generation EVs in China targeting the global market","resumo":"Toyota has decided to start production of its next-generation electric vehicles ahead of schedule in China.\nThe strategy aims to absorb advanced local software and battery technologies to strengthen its global lineup.\nThe move reflects intense competition in the automotive market and the pursuit of leadership in electric mobility.\nWith this initiative, the manufacturer intends to accelerate the launch of innovative models on a global scale.","link":"https://www.nikkei.com/article/DGXZQOFD0864K0Y6A700C2000000/","categoria":"MOBILITY","lang":"en"},{"fonte":"观点网","pais":"China","titulo":"China's Development Commission drives decisive breakthroughs in integrated circuit technologies","resumo":"China's National Development and Reform Commission has announced a comprehensive strategy to promote decisive breakthroughs in core integrated circuit technologies.\nThe plan focuses on strengthening the entire semiconductor supply chain to ensure the country's technological sovereignty.\nThe initiative seeks to overcome critical industry bottlenecks and accelerate the domestic development of advanced semiconductors.","link":"https://www.guandian.cn/article/20260828/593529.html","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"北京市人民政府门户网站","pais":"China","titulo":"Beijing launches pioneering 'AI4Chip' policy to accelerate semiconductor industry with Artificial Intelligence","resumo":"Beijing's Yizhuang district has unveiled the country's first dedicated policy centered on the 'AI4Chip' concept, utilizing AI to design and optimize integrated circuits.\nThe measure aims to drive a quantum leap in the development of the microchip sector through automation and advanced algorithms.\nThis initiative consolidates the Chinese capital as a hub of convergence between artificial intelligence and semiconductor manufacturing.","link":"https://www.beijing.gov.cn/ywdt/gzdt/202608/t20260828_4841103.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"东方财富","pais":"China","titulo":"Geely unveils artificial intelligence technology for next-generation off-road electric vehicles","resumo":"Geely has held the global launch of its new technology architecture for artificial intelligence-driven new energy off-road vehicles.\nThe system integrates computational intelligence to optimize performance on difficult terrains and manage real-time traction.\nThe manufacturer also showcased its global quality verification system to set new standards in smart electric vehicles.","link":"https://finance.eastmoney.com/a/202608283857888866.html","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"观点网","pais":"China","titulo":"Kuang-Chi Technologies signs partnership with Wenchang International Aerospace City","resumo":"Kuang-Chi Technologies has signed a strategic agreement with Wenchang International Aerospace City to create a cooperation model uniting industry, capital, and technology parks.\nThe initiative aims to accelerate innovation in advanced materials and technologies applied to space exploration.\nThe agreement promises to boost the commercial and industrial ecosystem of China's aerospace infrastructure.","link":"https://www.guandian.cn/article/20260828/593524.html","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"观察者","pais":"China","titulo":"BYD plans to expand its light electric vehicle technology to the European market","resumo":"After focusing on expansion in the Asian market, Chinese giant BYD is preparing to introduce its light electric vehicle technologies to the European continent.\nThe strategy aims to meet the growing demand for compact and sustainable urban mobility solutions in European cities.\nThis initiative reinforces the manufacturer's global leadership and intensifies competition with traditional automakers in Europe.","link":"https://www.guancha.cn/qiche/2026_08_28_829010.shtml","categoria":"ELECTRIC VEHICLES","lang":"en"},{"fonte":"观点网","pais":"China","titulo":"Qianhai Zone launches financial support measures to boost low-altitude economy","resumo":"The Shenzhen-Hong Kong Qianhai Cooperation Zone has announced twelve new financial measures directed at the development of the low-altitude economy.\nThe plan takes effect in September and aims to encourage investments in commercial drones, eVTOL flying cars, and urban aerial infrastructure.\nThe action strengthens the advanced transport and logistics ecosystem in southern China.","link":"https://www.guandian.cn/article/20260828/593537.html","categoria":"TECHNOLOGICAL INNOVATION","lang":"en"},{"fonte":"AFPBB News","pais":"China","titulo":"Acceleration in new drug development intensifies shortage of laboratory primates in China","resumo":"The rapid growth of pharmaceutical and biotech research in China has caused a severe shortage of monkeys for laboratory testing.\nThe demand driven by the development of new biological therapies and vaccines has significantly raised the costs of pre-clinical research.\nAnalysts point to the urgent need for new supply strategies and alternative methods of biomedical screening.","link":"https://www.afpbb.com/articles/-/3648884","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"China-Africa Digital Capacity Building Cooperation Conference held in Hangzhou","resumo":"The city of Hangzhou hosted the China-Africa Digital Capacity Building Cooperation Conference to strengthen partnerships in technology and network infrastructure.\nThe event brought together government and business leaders to discuss projects in artificial intelligence, e-commerce, and technological training.\nThe meeting reaffirms China's intention to lead the expansion of the digital economy in emerging countries.","link":"https://www.stdaily.com/web/gdxw/2026-08/28/content_571405.html","categoria":"DIGITAL TECHNOLOGY","lang":"en"},{"fonte":"Fortune India","pais":"India","titulo":"Ola Electric launches S1Z with indigenous Bharat Cell LFP battery technology","resumo":"Ola Electric has officially unveiled the new S1Z electric scooter, equipped with the domestically developed Bharat Cell LFP cell in India.\nThe breakthrough marks a significant step toward the country's technological independence in electric vehicle battery manufacturing.\nWith affordable prices starting at ₹79,999, the model aims to democratize sustainable transport in the Indian market.\nThe initiative reinforces the company's commitment to local innovation and the transition to zero-emission mobility.","link":"https://www.fortuneindia.com/auto/ola-electric-launches-s1z-with-indigenous-bharat-cell-lfp-technology-prices-start-at-79999/156290","categoria":"ELECTRIC MOBILITY","lang":"en"},{"fonte":"Construction World","pais":"India","titulo":"Airfloa Rail Technology secures ₹62.6 million contract for Kolkata Metro","resumo":"Rail technology company Airfloa Rail has won a contract worth 62.6 million rupees to provide solutions for the Kolkata Metro.\nThe project aims to modernize urban transport systems with cutting-edge equipment to optimize passenger flow and safety.\nThe achievement consolidates the role of Indian tech industry in strengthening and expanding national railway infrastructure.\nThe implementation of the new solutions promises to elevate the operational standards of the local metro network.","link":"https://www.constructionworld.in/transport-infrastructure/metro-rail-and-railways-infrastructure/airfloa-rail-technology-secures-rs-62.6-mn-kolkata-metro-order/96515","categoria":"INFRASTRUCTURE","lang":"en"},{"fonte":"TheWire.in","pais":"India","titulo":"REPLUS Engitech advances in indigenous BESS technology with government support","resumo":"REPLUS Engitech has boosted the development of battery energy storage systems (BESS) with 100% Indian technology.\nThe progress was driven by a government research and development program focused on energy self-sufficiency.\nThe solution seeks to stabilize the national power grid and facilitate the integration of large-scale renewable energy sources.\nThe breakthrough positions the company as a key player in India's energy transition tech ecosystem.","link":"https://m.thewire.in/article/ptiprnews/replus-engitech-advances-indigenous-bess-technology-with-government-backed-rd-programme","categoria":"CLEAN ENERGY","lang":"en"},{"fonte":"Business Standard","pais":"India","titulo":"A new AI open letter is launched, but this one stands out for a special reason","resumo":"Tech industry leaders and researchers have released a new manifesto on the directions and risks of artificial intelligence development.\nUnlike previous warnings, this letter brings pragmatic proposals and concrete actions for AI governance and regulation.\nThe document emphasizes the urgency of aligning the ethical advancement of language models with global socioeconomic demands.\nThe debate is gaining momentum as governments seek to structure public policies to control the impact of this technology.","link":"https://www.business-standard.com/technology/artificial-intelligence/collective-cyber-defence-openai-100-companies-ai-cyber-threats-126082800477_1.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"The Economic Times","pais":"India","titulo":"Reforestation with drones: how aerial seeding is restoring threatened ecosystems","resumo":"The use of drones equipped with advanced aerial seed distribution systems is revolutionizing reforestation projects in devastated areas.\nThe technology makes it possible to map rugged terrain and seed large expanses of land in a fraction of the time required for manual planting.\nThe initiative aims to accelerate biodiversity recovery and combat the severe effects of deforestation and climate change.\nThe success of the operation highlights the transformative potential of technological tools in environmental preservation.","link":"https://m.economictimes.com/us/science-tech/reforestation-with-drones-how-aerial-seeding-technology-is-bringing-new-life-to-gran-chacos-threatened-ecosystem/articleshow/133585520.cms","categoria":"ENVIRONMENTAL TECHNOLOGY","lang":"en"},{"fonte":"Reuters","pais":"Índia","titulo":"Ambições nucleares da Índia podem ser limitadas por restrições a tecnologia estrangeira","resumo":"Os planos da Índia de expandir sua capacidade de energia nuclear enfrentam gargalos devido às limitações na transferência de tecnologia de reatores estrangeiros.\nA dependência de acordos internacionais e regulamentações estritas de segurança tem desacelerado o ritmo de construção de novas usinas.\nEspecialistas destacam que o país precisa acelerar a inovação tecnológica interna para cumprir suas metas de descarbonização.\nA situação expõe o desafio geopolítico e técnico de equilibrar a soberania energética com a modernização tecnológica.","link":"https://www.reuters.com/business/energy/indias-nuclear-ambitions-may-be-blunted-by-limits-foreign-reactor-technology-2026-08-27/","categoria":"ENERGIA NUCLEAR","lang":"en"},{"fonte":"CarDekho","pais":"Índia","titulo":"MG Hector Tomahawk EV 2026 é lançado com tecnologia V2H","resumo":"A MG apresentou o novo Hector Tomahawk EV 2026, destacando a integração da inovadora tecnologia Vehicle-to-Home (V2H).\nO sistema permite que a bateria do veículo forneça eletricidade para residências durante apagões ou momentos de pico de consumo.\nAlém do design renovado, o SUV elétrico traz avanços significativos em eficiência energética e conectividade inteligente.\nO lançamento representa uma mudança importante no papel dos carros elétricos como ecossistemas de energia residencial.","link":"https://www.cardekho.com/india-car-news/2026-mg-hector-tomahawk-ev-launched-with-v2h-technology-whats-so-interesting-about-it-36566.htm","categoria":"VEÍCULOS ELÉTRICOS","lang":"en"},{"fonte":"Dinheiro Vivo","pais":"Portugal","titulo":"Gigantes da IA unem forças em apelo global por investimentos em ciberdefesa para serviços públicos","resumo":"Principais empresas de inteligência artificial uniram forças em um apelo global para fortalecer a segurança cibernética nos serviços públicos.\nA iniciativa destaca a necessidade urgente de proteger infraestruturas críticas contra ataques virtuais cada vez mais complexos.\nCom a evolução acelerada da IA, o investimento contínuo em ciberdefesa tornou-se prioridade estratégica para governos globais.","link":"http://dinheirovivo.dn.pt/economia/gigantes-da-ia-une-se-em-apelo-global-por-investimento-em-ciberdefesa-nos-servios-pblicos","categoria":"CIBERSEGURANÇA","lang":"en"},{"fonte":"chemeurope.com","pais":"Portugal","titulo":"Economia circular europeia de baterias exige novos modelos de negócios","resumo":"A transição energética europeia enfrenta desafios profundos na cadeia de suprimentos e na reciclagem de baterias de veículos elétricos.\nEspecialistas apontam que é indispensável adotar novos modelos de negócios focados na sustentabilidade e no reuso de recursos.\nEssa reestruturação busca assegurar a soberania tecnológica do bloco e mitigar os impactos ambientais do setor.","link":"https://www.chemeurope.com/pt/noticias/1189681/a-economia-circular-europeia-das-baterias-necessita-de-novos-modelos-de-negocio.html","categoria":"ENERGIA SUSTENTÁVEL","lang":"en"},{"fonte":"Vietnam.vn","pais":"Portugal","titulo":"Universidade inaugura centro de formação em engenharia automotiva para novas energias","resumo":"Uma nova oficina de capacitação focada em engenharia automotiva para energias renováveis foi oficialmente inaugurada.\nO projeto pretende qualificar estudantes e pesquisadores para atender às crescentes exigências do mercado de mobilidade sustentável.\nA iniciativa fortalece a integração entre o ecossistema acadêmico e as demandas por inovação tecnológica industrial.","link":"https://www.vietnam.vn/pt/truong-dh-kinh-te-ky-thuat-cong-nghiep-khai-truong-xuong-thuc-hanh-dao-tao-nganh-o-to-nang-luong-moi","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"cm-pontedelima.pt","pais":"Portugal","titulo":"Município de Ponte de Lima impulsiona educação com investimentos em tecnologia e robótica","resumo":"O município de Ponte de Lima anunciou um significativo plano de investimento para modernizar o ensino local com foco em tecnologia e robótica.\nA medida pretende capacitar alunos desde os primeiros anos com ferramentas digitais e desenvolvimento de raciocínio lógico.\nCom essa ação, a região busca tornar-se uma referência em inovação educacional e formação tecnológica de jovens.","link":"https://www.cm-pontedelima.pt/municipio/comunicacao/noticias/noticia/municipio-de-ponte-de-lima-impulsiona-educacao-com-forte-investimento-em-tecnologia-e-robotica","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"Tek Notícias","pais":"Portugal","titulo":"Linux comemora trajetória: de projeto pessoal a pilar fundamental da tecnologia global","resumo":"O sistema operacional Linux comemora sua trajetória histórica, consolidando-se como pilar fundamental da tecnologia global.\nCriado originalmente como um projeto pessoal de código aberto, o sistema hoje sustenta servidores, celulares e supercomputadores.\nSua evolução contínua demonstra o poder transformador da colaboração comunitária na inovação de software.","link":"https://tek.sapo.pt/noticias/computadores/artigos/linux-celebra-35-anos-como-passou-de-simples-hobby-a-peca-essencial-da-tecnologia/","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"A Voz de Trás-os-Montes","pais":"Portugal","titulo":"Adapt4you desenvolve soluções tecnológicas voltadas para a inclusão social","resumo":"A Adapt4you desenvolveu novas soluções tecnológicas destinadas a expandir a acessibilidade e a inclusão de pessoas com deficiência.\nAs ferramentas adaptativas criadas pela empresa visam transformar o cotidiano dos usuários, garantindo maior autonomia e praticidade.\nO projeto ressalta como o avanço tecnológico pode ser direcionado para gerar impacto social direto e acessível.","link":"https://www.avozdetrasosmontes.pt/adapt4you-desenvolve-tecnologia-para-aumentar-inclusao/","categoria":"INCLUSÃO DIGITAL","lang":"en"},{"fonte":"Meteored Portugal","pais":"Portugal","titulo":"Da catalogação à previsão: ciência busca antecipar os rumos da biodiversidade mundial","resumo":"Pesquisadores estão avançando da catalogação tradicional para o uso de modelos preditivos na análise do futuro da biodiversidade.\nA nova abordagem combina volumosos bancos de dados e algoritmos para antecipar a resposta dos ecossistemas às mudanças climáticas.\nEsse avanço científico permitirá criar políticas de conservação ambiental muito mais precisas, preventivas e eficientes.","link":"https://www.tempo.pt/noticias/ciencia/do-inventario-a-previsao-a-ciencia-quer-descobrir-o-que-a-biodiversidade-fara-amanha.html","categoria":"CIÊNCIA","lang":"en"},{"fonte":"PCGuia","pais":"Portugal","titulo":"Dia da Formação Financeira: escolha consciente de presentes tecnológicos foca no valor real","resumo":"No âmbito do Dia da Formação Financeira, especialistas reforçam que a compra de produtos tecnológicos deve ser planejada com foco no valor real.\nEm vez de ceder ao apelo constante por novos lançamentos, a recomendação é avaliar a durabilidade e a utilidade prática do dispositivo.\nA conscientização visa orientar consumidores a tomar decisões financeiras mais sustentáveis e eficientes no setor de tecnologia.","link":"https://www.pcguia.pt/2026/08/dia-da-formacao-financeira-2026-porque-e-que-o-presente-de-tecnologia-mais-sensato-comeca-por-um-valor-e-nao-por-um-produto/","categoria":"NEGÓCIOS","lang":"en"}];
  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
