},{"fonte":"O GLOBO","pais":"China","titulo":"Chinese chip manufacturer prepares Hong Kong IPO driven by the artificial intelligence boom","resumo":"Driven by high global demand for artificial intelligence hardware, a prominent Chinese semiconductor manufacturer has announced preparations for an initial public offering on the Hong Kong Stock Exchange. The move reflects the strong growth of the domestic technology sector and the pursuit of capitalization to expand local production capacity. The initiative aims to strengthen China's autonomy in the global microchip supply chain and accelerate innovation in advanced computing.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/08/09/com-boom-da-ia-fabricante-chinesa-de-chips-se-prepara-para-abrir-capital-em-hong-kong.ghtml","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"MundoCoop","pais":"China","titulo":"Global demand for artificial intelligence drives China's exports","resumo":"Strong worldwide demand for artificial intelligence components and infrastructure has strongly sustained the Asian giant's export sector. High-precision electronic products, servers, and cloud computing equipment are leading international shipments, ensuring a positive trade balance. Analysts highlight that the transition to digital economies reinforces China's position as a key supplier of advanced technology.","link":"https://mundocoop.com.br/economia-negocios/demanda-por-ia-mantem-motor-das-exportacoes-da-china-em-pleno-funcionamento/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"okdiario.com","pais":"China","titulo":"Study confirms that China has reduced 98% of pollution in 12 years","resumo":"A new scientific survey has revealed that severe policies and massive investments in clean technologies have allowed China to eliminate up to 98% of critical contamination levels in strategic regions over the course of twelve years. The rapid energy transition and rigor in industrial emission control served as the basis for this unprecedented feat in modern history. The result positions the country as a benchmark in large-scale environmental mitigation and ecological innovation.","link":"https://okdiario.com/ciencia/parece-ficcion-nadie-vio-venir-china-elimina-12-anos-98-contaminacion-capital-16120833","categoria":"SCIENCE","lang":"en"},{"fonte":"电子工程专辑","pais":"China","titulo":"Chinese operators' AI market shifts from traffic to the computational economy","resumo":"China's telecommunications operators are revamping their business models by migrating from traditional data traffic sales to offering computing capacity and AI tokens. This strategic transition seeks to monetize network infrastructure to meet the growing demand from businesses for cloud processing and artificial intelligence. The move signals a profound restructuring of the Chinese digital ecosystem in the coming years.","link":"https://www.eet-china.com/mp/a515841.html","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"东方财富","pais":"China","titulo":"Kuang-Chi Technologies secures major drone procurement contract","resumo":"Advanced technology company Kuang-Chi has announced the signing of a significant contract for the supply of unmanned aerial vehicles and metamaterial components. The order reinforces the consolidation of the autonomous aerial vehicle sector and the expansion of the commercial and industrial use of drones in the country. The announcement boosted investor optimism regarding the company's role in the strategic technology supply chain.","link":"https://wap.eastmoney.com/a/202608103836434079.html","categoria":"DRONES","lang":"en"},{"fonte":"ncsti.gov.cn","pais":"China","titulo":"International Congress of Basic Science opens in Beijing, awarding prominent scientists","resumo":"The 2026 edition of the International Congress of Basic Science kicked off in Beijing, bringing together world-renowned researchers to discuss advances in mathematics, physics, and computing. During the opening ceremony, nine top scientists were awarded medals for their extraordinary contributions to human knowledge. The event reinforces China's commitment to establishing itself as a global hub for scientific cooperation and development.","link":"https://www.ncsti.gov.cn/kjdt/scyq/hrkxc/cqdt/202608/t20260810_252693.html","categoria":"SCIENCE","lang":"en"},{"fonte":"ニュースイッチ by 日刊工業新聞社","pais":"China","titulo":"Japan's Asahi Kasei introduces electrolyte technology for lithium batteries in China","resumo":"Japanese multinational Asahi Kasei has announced its entry into the Chinese market with an innovative electrolyte technology aimed at ultra-high-performance lithium batteries. The initiative seeks to meet the growing production of electric vehicles and energy storage systems in the region. The technological cooperation promises to raise the efficiency and energy density of next-generation batteries in the automotive ecosystem.","link":"https://newswitch.jp/image/49962","categoria":"ENERGY","lang":"en"},{"fonte":"finance.people.com.cn","pais":"China","titulo":"Sichuan deploys 81 weather radars, transforming flood control","resumo":"Sichuan province has completed the deployment of 81 advanced rain-measuring radars, revolutionizing natural disaster response and prevention capabilities in the region. The new equipment provides ultra-high-precision real-time meteorological data, enabling early warnings and more efficient preventive actions. The initiative demonstrates how the practical application of cutting-edge technology can mitigate environmental risks and protect vulnerable populations.","link":"http://finance.people.com.cn/n1/2026/0810/c1004-40776904.html","categoria":"INNOVATION","lang":"en"},{"fonte":"Siliconindia","pais":"India","titulo":"India is among the leading nations in quantum technology, says Jitendra Singh","resumo":"India's Minister of Science and Technology, Jitendra Singh, highlighted that the country has consolidated its position among the top global powers in the development of quantum technology.\nProgress is driven by strategic investments in research, advanced technological infrastructure, and government support for innovation startups.\nThis rise aims to ensure technological sovereignty and leadership in quantum computing and communication innovations in the coming years.","link":"https://www.siliconindia.com/news/general/india-among-top-nations-in-quantum-technology-says-jitendra-singh-nid-241856-cid-1.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"India's government technology sector faces an expertise problem","resumo":"Despite the rapid growth of digital infrastructure in India, experts warn of a lack of highly specialized technical expertise within government spheres.\nThe shortage of qualified professionals in data governance and cybersecurity compromises the effectiveness and security of digital public policies.\nTo overcome this challenge, analysts advocate urgent reforms in the technical training of bureaucrats and in attracting talent from the private sector.","link":"https://www.moneycontrol.com/news/opinion/india-s-technology-state-has-an-expertise-problem-13999381.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"Cut, edit, profit: how India's 'clipping economy' is minting money from viral moments","resumo":"A new wave of content creators in India is cashing in by turning livestreams and podcasts into short-form videos for platforms like Reels and Shorts.\nThis so-called 'clipping economy' drives millions of views and monetizes standout internet moments with extreme agility.\nThe trend reflects the shift in digital media consumption, empowering small editors to achieve significant income through online engagement.","link":"https://www.moneycontrol.com/technology/cut-edit-earn-how-india-s-clipping-economy-is-minting-money-from-viral-moments-article-13999350.html","categoria":"TRENDS","lang":"en"},{"fonte":"newindianexpress.com","pais":"India","titulo":"Amidst India's growing injuries, BCCI continues search for sports science head","resumo":"Faced with a growing number of injured athletes, the Board of Control for Cricket in India has intensified its search for a new leader specialized in sports science.\nThe institution seeks to implement modern scientific methodologies for injury prevention, recovery, and physical monitoring to protect athletes.\nThe hiring is considered crucial to restructure the medical department of the country's most popular sport and adopt international high-performance standards.","link":"https://www.newindianexpress.com/sport/cricket/2026/Aug/09/amidst-indias-growing-injuries-bcci-continues-search-for-sports-science-head","categoria":"SCIENCE","lang":"en"},{"fonte":"Autocar India","pais":"India","titulo":"Nissan Gravite CNG real-world fuel economy tested and explained","resumo":"Recent tests evaluated the performance and efficiency of the new Compressed Natural Gas-powered Nissan Gravite model under real-world traffic conditions in India.\nThe results demonstrated a promising balance between low cost per kilometer driven and good range for daily urban use.\nThe analysis reinforces the appeal of CNG vehicles as a technological and sustainable alternative in markets focused on emission reduction and operating costs.","link":"https://www.autocarindia.com/auto-features/nissan-gravite-cng-real-world-fuel-economy-tested-explained-440895","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ideasforindia.in","pais":"India","titulo":"Why a falling rupee no longer means a weak Indian economy","resumo":"Historically viewed as a sign of fragility, the depreciation of the Indian rupee against the dollar now reflects a more complex and resilient macroeconomic dynamic.\nThe strengthening of international reserves and the solid growth of technological and industrial sectors mitigate the impacts of currency fluctuation.\nAnalysts point out that the country's economy demonstrates greater maturity, allowing it to absorb external shocks without compromising national development.","link":"https://www.ideasforindia.in/topics/macroeconomics/why-a-falling-rupee-no-longer-means-a-weak-indian-economy","categoria":"ECONOMY","lang":"en"},{"fonte":"Deccan Chronicle","pais":"India","titulo":"Telangana economy stands out in Reserve Bank of India report","resumo":"The state of Telangana recorded notable economic performance, according to the latest report released by the Reserve Bank of India.\nGrowth was driven by the strong expansion of the information technology sector, alongside continuous investments in infrastructure and innovation.\nThe result consolidates the state as one of the country's main drivers of technological development, attracting the attention of global investors.","link":"https://www.deccanchronicle.com/southern-states/telangana/telangana-economy-registers-108-growth-in-2025-26-as-services-and-allied-sectors-surge-rbi-report-1977962","categoria":"BUSINESS","lang":"en"},{"fonte":"TVI","pais":"Portugal","titulo":"Portuguese technology aims to make drones and aircraft nearly invisible to radar","resumo":"Researchers and companies in Portugal are developing an innovative solution capable of significantly reducing the radar signature of aircraft and drones. The technology utilizes advanced materials and strategic design to absorb and disperse electromagnetic waves. This innovation promises to strengthen the country's defense and aerospace industry, opening doors to new international partnerships and high-precision military applications.","link":"https://tvi.iol.pt/noticias/video/tecnologia-portuguesa-quer-tornar-drones-e-avioes-quase-invisiveis-aos-radares/6a78cfc90cf2f6a1a1e73759","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"The most attractive professions, according to science (or at least according to surveys)","resumo":"Several recent studies and surveys have sought to identify which careers and occupations evoke the greatest interpersonal attraction from the public. The results reveal that perceptions of altruism, leadership, intelligence, and financial stability directly influence the perceived appeal of each profession. Although science shows complex behavioral nuances, the impact of these studies highlights how social and psychological factors shape human attraction in modern society.","link":"https://sapo.pt/artigo/as-profissoes-mais-sexy-segundo-a-ciencia-ou-pelo-menos-segundo-os-inqueritos-6a7880ac0c60413700012710","categoria":"SCIENCE","lang":"en"},{"fonte":"Leak.pt","pais":"Portugal","titulo":"Does owning a dog protect your children's health? Science shows it is more complex","resumo":"The idea that living with dogs from childhood strengthens the immune system and prevents allergies in children is taking on new dimensions according to scientific studies. Researchers point out that the benefits depend on genetic, environmental, and developmental factors during the time contact occurs. The analysis emphasizes the importance of better understanding these microbial interactions and provides a balanced view regarding the presence of pets in children's health.","link":"https://www.leak.pt/cao-protege-a-saude-dos-teus-filhos/","categoria":"SCIENCE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
