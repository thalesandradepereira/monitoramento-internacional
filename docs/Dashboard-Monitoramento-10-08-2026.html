  const data = [{"fonte":"G1","pais":"Brasil","titulo":"Primeiro a OpenAI, depois a Meta: Por que Robôs de IA Continuam Realizando Ataques Hackers","resumo":"Casos recentes envolvendo grandes empresas de tecnologia acenderam o alerta para a utilização de agentes autônomos de inteligência artificial em cibercrimes.\nEspecialistas apontam que esses robôs estão sendo manipulados para automatizar invasões e identificar vulnerabilidades em sistemas críticos com rapidez inédita.\nO avanço levanta debates urgentes sobre regulamentação, monitoramento de ferramentas e novas estratégias para proteger a infraestrutura digital global.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/10/primeiro-a-openai-depois-a-meta-por-que-robos-de-ia-continuam-fazendo-ataques-hackers.ghtml","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Demanda Volátil de Energia da Inteligência Artificial Causa Danos a Data Centers","resumo":"A rápida expansão e o processamento intensivo exigidos por modelos de inteligência artificial vêm provocando picos imprevisíveis no consumo de energia elétrica.\nEssa volatilidade severa no fornecimento sobrecarrega componentes físicos de infraestrutura e causa danos sérios aos equipamentos de grandes data centers.\nDiante desse cenário, gigantes do setor buscam soluções urgentes em energias renováveis e redes elétricas mais resilientes para evitar colapsos e prejuízos.","link":"https://www1.folha.uol.com.br/mercado/2026/08/demanda-volatil-da-inteligencia-artificial-por-energia-danifica-data-centers.shtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Globo","pais":"Brasil","titulo":"Primeiro Genoma Completo do Sagui Deve Impulsionar Pesquisas Sobre o Alzheimer","resumo":"Cientistas alcançaram um marco histórico ao mapear totalmente pela primeira vez o genoma do sagui, um pequeno primata amplamente estudado na neurociência.\nO sequenciamento detalhado fornecerá valiosos dados genéticos para compreender os mecanismos neurológicos e o avanço de doenças neurodegenerativas.\nA descoberta abre caminho para o desenvolvimento de novos tratamentos, diagnósticos precoces e terapias gênicas mais precisas na medicina.","link":"https://revistagalileu.globo.com/google/amp/ciencia/noticia/2026/08/primeiro-genoma-completo-do-sagui-vai-possibilitar-pesquisas-sobre-alzheimer.ghtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Câmeras Prometem Prever Crimes com IA, mas Levantam Alerta Sobre Privacidade","resumo":"Sistemas modernos de vigilância equipados com inteligência artificial prometem analisar comportamentos em tempo real para prever e evitar crimes em espaços públicos.\nNo entanto, o uso extensivo dessa tecnologia tem gerado controvérsias e preocupações quanto à violação da privacidade e aos viéses dos algoritmos.\nO debate atual exige um equilíbrio rígido entre a eficiência da segurança pública e a garantia dos direitos fundamentais dos cidadãos.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/09/cameras-com-ia-prometem-prever-crimes-antes-que-acontecam-mas-acendem-alerta-sobre-privacidade.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Vietnam.vn","pais":"Brasil","titulo":"Vazamento Revela Nova Tecnologia de Câmera de 200MP para Futuro Galaxy S27 Ultra","resumo":"Informações vazadas da indústria indicam que uma tecnologia revolucionária de sensores fotográficos de 200 megapixels está em estágio avançado de desenvolvimento.\nEspecula-se que essa nova lente topo de linha fará sua estreia no futuro modelo Galaxy S27 Ultra da Samsung.\nO avanço promete transformar a fotografia móvel ao oferecer processamento de imagem aprimorado por inteligência artificial e alta captura em pouca luz.","link":"https://www.vietnam.vn/pt/he-lo-camera-200mp-cong-nghe-hoan-toan-moi-se-trang-bi-cho-galaxy-s27-ultra","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"A Inteligência Artificial Pode Criar Uma Classe Social Inferior Permanente?","resumo":"A aceleração no desenvolvimento da inteligência artificial suscita debates éticos profundos sobre o futuro do trabalho e a desigualdade socioeconômica global.\nEspecialistas alertam para o risco de a automação irrestrita marginalizar trabalhadores cujas funções forem substituídas sem a devida requalificação.\nO estudo defende medidas proativas de governança e políticas públicas para evitar a consolidação de uma subclasse desfavorecida na era digital.","link":"https://www1.folha.uol.com.br/mercado/2026/08/a-ia-poderia-criar-uma-classe-inferior-permanente.shtml","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Rayssa Leal Conquista o Título do SLS Rio Takeover no Maracanãzinho","resumo":"A medalhista olímpica Rayssa Leal brilhou novamente ao sagrar-se campeã do evento SLS Rio Takeover, realizado no icônico ginásio do Maracanãzinho, no Rio de Janeiro.\nA skatista brasileira dominou as manobras decisivas e garantiu a maior nota da competição sob intensa vibração da torcida local.\nO resultado consolida o protagonismo do Brasil no skate mundial e reforça a preparação da atleta para as próximas etapas do circuito internacional.","link":"https://oglobo.globo.com/google/amp/esportes/noticia/2026/08/09/skate-rayssa-leal-vence-titulo-do-sls-rio-takeover-no-maracanazinho.ghtml","categoria":"ESPORTES","lang":"pt"},{"fonte":"UOL Economia","pais":"Brasil","titulo":"Parque do Ibirapuera Sedia Grande Evento de Empreendedorismo e Inovação","resumo":"O Parque do Ibirapuera, em São Paulo, transforma-se no epicentro da inovação ao sediar um evento de oito dias focado em empreendedorismo e tecnologia.\nA programação reúne startups, investidores e lideranças do setor para debater tendências de mercado, inteligência artificial e sustentabilidade.\nA iniciativa busca fortalecer o ecossistema tecnológico brasileiro e gerar conexões estratégicas entre negócios emergentes e grandes corporações.","link":"https://economia.uol.com.br/noticias/redacao/2026/08/09/por-8-dias-ibirapuera-vira-palco-de-evento-de-empreendedorismo-e-inovacao.ghtm","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"SAPO","pais":"Estados Unidos","titulo":"Google lança Gemini Robotics 2 para avançar na automação inteligente","resumo":"A Google anunciou o lançamento do Gemini Robotics 2, seu novo modelo avançado focado na integração de inteligência artificial com robótica física.\nA ferramenta promete aprimorar a capacidade de raciocínio, adaptação e execução de tarefas complexas em ambientes reais de forma mais autônoma.\nO avanço representa um passo importante na corrida pelo desenvolvimento de robôs mais eficientes e adaptáveis para indústrias e serviços.","link":"https://sapo.pt/artigo/google-lanca-gemini-robotics-2-6a7907f30c60413700244bde","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"AI News","pais":"Estados Unidos","titulo":"Boom de investimentos em IA nos EUA reformula a economia do país","resumo":"O investimento massivo em inteligência artificial nos Estados Unidos está transformando radicalmente o cenário econômico do país.\nGigantes da tecnologia e startups estão injetando bilhões de dólares em infraestrutura de processamento, centros de dados e novos talentos.\nEssa onda de capital não apenas impulsiona o setor tecnológico, mas também redistribui empregos e redefine a competitividade global da indústria norte-americana.","link":"https://www.artificialintelligence-news.com/news/americas-ai-investment-boom-is-reshaping-the-economy/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"theguardian.com","pais":"Estados Unidos","titulo":"Missão aérea da NASA captura dados raros durante eclipse solar","resumo":"A NASA mobilizou uma missão aérea especial para coletar dados científicos inéditos ao perseguir a sombra de um eclipse solar raro.\nVoando em altitudes elevadas, as aeronaves equipadas com instrumentos avançados conseguiram prolongar o tempo de observação da coroa solar.\nOs dados obtidos ajudarão pesquisadores a entenderem melhor os campos magnéticos do Sol e seu impacto direto no clima espacial.","link":"https://www.theguardian.com/science/2026/aug/09/nasa-mission-total-solar-eclipse-iceland-sun-nanoflares","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Época Negócios","pais":"Estados Unidos","titulo":"Como a NASA vai ajudar no combate aos incêndios florestais","resumo":"A NASA está aplicando suas tecnologias espaciais para monitorar e auxiliar no combate aos crescentes incêndios florestais.\nPor meio de satélites de alta resolução e inteligência artificial, a agência consegue prever a propagação das chamas e mapear áreas de risco em tempo real.\nEssa cooperação fornece dados cruciais para brigadistas e autoridades locais minimizarem os impactos ambientais e salvarem vidas.","link":"https://epocanegocios.globo.com/google/amp/tecnologia/noticia/2026/08/como-a-nasa-vai-ajudar-a-combater-os-incendios-florestais.ghtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"theguardian.com","pais":"Estados Unidos","titulo":"Influenciadores enfrentam reação negativa por conteúdo com óculos inteligentes da Meta","resumo":"Influenciadores digitais estão perdendo seguidores e enfrentando duras críticas devido ao uso dos óculos inteligentes da Meta.\nAs preocupações com a privacidade do público dispararam após o compartilhamento de vídeos gravados sem consentimento explícito de terceiros.\nO episódio reacende o debate sobre os limites éticos e regulatórios do uso de tecnologias vestíveis com câmeras integradas em locais públicos.","link":"https://www.theguardian.com/technology/2026/aug/09/i-kept-catching-people-giving-me-dirty-looks-the-backlash-against-meta-smart-glasses","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"theguardian.com","pais":"Estados Unidos","titulo":"Análise do Samsung Galaxy Z Fold 8: o passaporte para o futuro dos dobráveis","resumo":"O novo Samsung Galaxy Z Fold 8 chega ao mercado trazendo refinamentos significativos em design, durabilidade e desempenho para a categoria de smartphones dobráveis.\nCom uma estrutura mais fina, vinco da tela quase imperceptível e recursos otimizados de multitarefa, o dispositivo consolida a maturidade desse formato.\nA análise destaca que o aparelho serve como um forte indício da consolidação definitiva dos dobráveis no segmento topo de linha.","link":"https://www.theguardian.com/technology/2026/aug/10/samsung-galaxy-z-fold-8-review-folding-phone","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Globo","pais":"Estados Unidos","titulo":"125 anos e contando: onde fica a lâmpada acesa há mais tempo no mundo","resumo":"Localizada em um quartel de bombeiros na Califórnia, a chamada \"Centennial Light\" permanece acesa há mais de 125 anos praticamente sem interrupção.\nFabricada no final do século XIX, a lâmpada incandescente desafia a obsolescência programada e intriga cientistas devido à sua durabilidade extrema.\nO fenômeno atrai visitantes do mundo inteiro e continua sendo objeto de estudos sobre engenharia e longevidade de materiais.","link":"https://revistagalileu.globo.com/google/amp/tecnologia/noticia/2026/08/125-anos-e-contando-onde-fica-a-lampada-acesa-ha-mais-tempo-no-mundo.ghtml","categoria":"CURIOSIDADE","lang":"pt"},{"fonte":"The Motley Fool","pais":"Estados Unidos","titulo":"Adobe vs. Arista Networks: qual ação de tecnologia é a melhor compra para 2026?","resumo":"Uma análise comparativa avalia o potencial de crescimento e estabilidade entre as gigantes de tecnologia Adobe e Arista Networks para os próximos anos.\nEnquanto a Adobe aposta na integração massiva de inteligência artificial gerativa em seus softwares criativos, a Arista se beneficia da expansão da infraestrutura de redes em nuvem.\nO estudo traz perspectivas valiosas para investidores focados nas tendências de longo prazo do setor tecnológico.","link":"https://www.fool.com/coverage/better-buy/2026/08/09/adobe-vs-arista-networks-which-technology-stock-is-a-better-buy-in-2026/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"La Croix","pais":"França","titulo":"Diante da ofensiva anticiência de Donald Trump, pesquisadores protegem dados climáticos da Nasa","resumo":"Diante de incertezas políticas e possíveis cortes de verbas, cientistas estão mobilizando esforços para arquivar dados climáticos da Nasa.\nA iniciativa busca preservar décadas de pesquisas sobre o aquecimento global em servidores independentes antes de mudanças governamentais.\nA força-tarefa garante que informações fundamentais para o combate às mudanças climáticas permaneçam acessíveis à comunidade internacional.","link":"https://www.la-croix.com/planete/face-a-l-offensive-anti-science-de-donald-trump-ces-chercheurs-qui-mettent-a-labri-les-donnees-climatiques-de-la-nasa-20260809","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ladepeche.fr","pais":"França","titulo":"Defesa: diante dos drones, armas a laser passam do laboratório para o campo de batalha","resumo":"O avanço do uso de drones em conflitos modernos impulsionou a implantação operacional de armas de energia dirigida por laser.\nAntes restritas a laboratórios, essas tecnologias começam a ser integradas de forma prática nos sistemas de defesa de diversos países.\nAlém de precisão contra ameaças aéreas, os sistemas a laser reduzem drasticamente os custos por disparo em comparação a mísseis tradicionais.","link":"https://www.ladepeche.fr/2026/08/10/defense-face-aux-drones-les-armes-laser-passent-du-laboratoire-au-champ-de-bataille-13502596.php","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"France 24","pais":"França","titulo":"Com tecnologia e patrulhas, França reforça prevenção para enfrentar outro verão de incêndios","resumo":"A França intensificou o uso de tecnologias avançadas de monitoramento, incluindo drones e sensores, para mitigar o risco de queimadas no verão.\nO sistema integra patrulhas terrestres com análises de dados em tempo real para identificar focos de incêndio ainda no estágio inicial.\nA estratégia visa proteger florestas e áreas sensíveis, adaptando a infraestrutura do país às crescentes ondas de calor no continente.","link":"https://www.france24.com/es/video/20260810-con-tecnolog%C3%ADa-y-patrullajes-francia-refuerza-la-prevenci%C3%B3n-ante-otro-verano-de-incendios","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"lecourrier.vn","pais":"França","titulo":"Vietnã e Austrália querem reforçar cooperação científica e tecnológica","resumo":"Vietnã e Austrália firmaram um novo acordo para expandir a cooperação em pesquisa científica, inovação digital e transição energética.\nA parceria prevê o financiamento conjunto de projetos focados em inteligência artificial, agricultura sustentável e ecossistemas de tecnologia.\nO movimento fortalece os laços bilaterais e acelera a transformação industrial e a capacidade de desenvolvimento técnico de ambos os países.","link":"https://lecourrier.vn/vietnam-et-australie-veulent-renforcer-leur-cooperation-scientifique-et-technologique/1353092.html","categoria":"CIÊNCIA E TECNOLOGIA","lang":"pt"},{"fonte":"i24NEWS","pais":"França","titulo":"Israel: Ministério da Defesa se inspira no modelo chinês para fortalecer indústria militar","resumo":"O Ministério da Defesa de Israel está adaptando estratégias do modelo chinês para acelerar a produção de tecnologias militares.\nA abordagem foca na fusão entre os setores civil e militar, além do incentivo direto a startups de inovação tecnológica defensiva.\nA medida visa reforçar a autossuficiência da indústria de defesa e garantir agilidade no desenvolvimento de novos equipamentos estratégicos.","link":"https://www.i24news.tv/fr/actu/israel/artc-israel-le-ministere-de-la-defense-s-inspire-du-modele-chinois-pour-renforcer-son-industrie-militaire","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"theguardian.com","pais":"Inglaterra","titulo":"Starwatch: Eclipse solar parcial profundo no Reino Unido antecederá as Perseidas","resumo":"Um eclipse solar parcial de grande magnitude será visível no Reino Unido antes do pico da chuva de meteoros das Perseidas. Este evento astronômico raro oferece uma oportunidade excepcional para observadores do céu e entusiastas da ciência na região. Além disso, o fenômeno reforça a importância de conscientizar a população sobre a observação segura de eventos solares e o impacto astronômico do ciclo solar atual.","link":"https://www.theguardian.com/science/2026/aug/10/starwatch-deep-partial-solar-eclipse-uk-perseids","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"theguardian.com","pais":"Inglaterra","titulo":"Fabricantes do Reino Unido enfrentam crescente risco de ataques cibernéticos, revela pesquisa","resumo":"Uma pesquisa recente revelou que aproximadamente 30% dos fabricantes do Reino Unido sofreram ataques cibernéticos no último ano. O setor enfrenta vulnerabilidades crescentes à medida que a automação e a digitalização industrial se expandem rapidamente. Especialistas alertam que é crucial reforçar as defesas digitais para proteger infraestruturas críticas e evitar prejuízos operacionais e financeiros devastadores no mercado industrial britânico.","link":"https://www.theguardian.com/technology/2026/aug/10/uk-companies-cyber-attack-third-jlr","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"Retail Technology Innovation Hub","pais":"Inglaterra","titulo":"Entregas rápidas de supermercado em Guernsey e bares self-service em Brighton destacam inovações tecnológicas","resumo":"Inovações tecnológicas estão transformando os setores de varejo e entretenimento no Reino Unido com a expansão de novos serviços automatizados. Entre os destaques recentes estão os sistemas de entrega ultrarrápida de compras e bares totalmente automatizados com atendimento self-service. Essas iniciativas demonstram como a automação do consumo ganha força no mercado britânico, alterando o comportamento dos consumidores e os modelos de negócios tradicionais.","link":"https://retailtechinnovationhub.com/home/2026/8/9/rapid-grocery-deliveries-in-guernsey-and-self-service-bars-in-brighton-last-weeks-biggest-technology-plays","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Euronext Markets: Real-time Stock Market Data | live","pais":"Inglaterra","titulo":"Reino Unido anuncia investimento de quase £130 milhões para tecnologia de veículos com emissão zero","resumo":"O governo do Reino Unido confirmou um aporte de quase 130 milhões de libras focado no desenvolvimento de tecnologias para veículos de emissão zero. O financiamento visa acelerar a transição ecológica no setor de transportes e impulsionar a inovação em baterias e mobilidade elétrica na indústria britânica. A iniciativa fortalece a meta de neutralidade de carbono do país e busca posicionar o Reino Unido como referência global em tecnologias sustentáveis.","link":"https://live.euronext.com/en/financial-news/uk-announces-nearly-ps130-million-funding-zero-emission-vehicle-technology","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"motor16.com","pais":"Espanha","titulo":"Toyota Crown 2027: O Híbrido que Desafia os Sedãs Premium com Tecnologia, Conforto e 340 CV","resumo":"O Toyota Crown 2027 redefiniu o segmento de sedãs premium ao combinar design arrojado com eficiência híbrida de ponta.\nEquipado com 340 CV e sistemas tecnológicos avançados de assistência ao condutor, o modelo garante desempenho e conforto.\nEssa novidade representa um passo estratégico da fabricante para competir diretamente com marcas globais de luxo.\nA integração de inovação automotiva reforça a transição para veículos mais eficientes e sustentáveis no mercado.","link":"https://www.motor16.com/las-ultimas-noticias/toyota-crown-hibrido/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"infoLibre","pais":"Espanha","titulo":"A Ciência Explica por que as Imagens de Ceuta Favorecem o Discurso Anti-imigração do PP e Vox","resumo":"Um estudo científico analisa o impacto psicológico e visual das imagens de fronteira em Ceuta na opinião pública espanhola.\nPesquisadores mostram como o processamento cognitivo de certos enquadramentos reforça narrativas políticas anti-imigração.\nA análise evidencia o papel do viés de confirmação e das emoções na recepção de conteúdos de forte apelo visual.\nO trabalho destaca a importância da ciência comportamental para compreender a dinâmica do debate político contemporâneo.","link":"https://www.infolibre.es/politica/ciencia-explica-imagenes-ceuta-favorecen-discurso-antiinmigracion-pp-vox_1_2234809.html","categoria":"CIÊNCIA SOCIAL","lang":"pt"},{"fonte":"Infobae","pais":"Espanha","titulo":"Como os Eclipses Solares Ajudaram a Ciência, Segundo um Físico: “Mais de um Século Depois, Continua Sendo a Lei que Governa o Universo”","resumo":"Historicamente, os eclipses solares têm sido fundamentais para validar teorias científicas de grande impacto no mundo.\nA observação da ocultação solar permitiu comprovar previsões revolucionárias, como a Teoria da Relatividade de Einstein.\nFísicos destacam que esses eventos continuam sendo essenciais para testar leis fundamentais do universo e da física moderna.\nA análise continuada desses fenômenos raros impulsiona novas descobertas e desperta o interesse da comunidade astronômica.","link":"https://www.infobae.com/espana/2026/08/10/como-han-ayudado-los-eclipses-solares-a-la-ciencia-segun-un-fisico-mas-de-un-siglo-despues-sigue-siendo-la-ley-que-gobierna-el-universo/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"EL PAÍS","pais":"Espanha","titulo":"Não, a Inteligência Artificial Não É Inteligente","resumo":"Um debate emergente na comunidade científica questiona a atribuição de inteligência real aos sistemas avançados de IA.\nEspecialistas explicam que esses modelos operam por reconhecimento de padrões estatísticos sem verdadeira consciência ou compreensão.\nA análise alerta para os perigos de superestimar a autonomia dessas ferramentas em decisões críticas do cotidiano.\nA discussão busca alinhar as expectativas da sociedade sobre o real estágio e as limitações técnicas atuais da tecnologia.","link":"https://elpais.com/tecnologia/2026-08-10/no-la-ia-no-es-inteligente.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"heraldo.es","pais":"Espanha","titulo":"Projeto de Ciência Cidadã Analisará a Reação dos Animais ao Eclipse Total na Espanha: \"Nunca Foi Feito Antes\"","resumo":"Um projeto inédito de ciência cidadã na Espanha mobilizará a população para registrar reações animais durante o eclipse solar.\nA iniciativa visa coletar dados em larga escala sobre as mudanças comportamentais da fauna silvestre e de animais domésticos.\nPesquisadores destacam que a escuridão repentina fornece uma oportunidade única e nunca antes testada na região.\nOs resultados devem gerar novos insights relevantes para a zoologia e a compreensão da biologia comportamental.","link":"https://www.heraldo.es/noticias/nacional/2026/08/10/proyecto-ciencia-ciudadana-analizara-reaccionan-animales-eclipse-total-sol-no-habia-hecho-antes-2042402.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"El Español","pais":"Espanha","titulo":"Defesa e Ciência Impulsionam o Desenvolvimento de Propulsores Nucleares Espaciais e Produção de Satélites","resumo":"Os ministérios da Defesa e da Ciência da Espanha uniram forças para desenvolver sistemas de propulsão nuclear espacial.\nA parceria visa expandir a capacidade de fabricação de satélites e fortalecer a infraestrutura aeroespacial do país.\nA iniciativa impulsiona a soberania tecnológica da Europa em missões de exploração profunda e defesa estratégica.\nO projeto sinaliza um avanço significativo no investimento público para inovação científica e espacial de alto impacto.","link":"https://www.elespanol.com/observatorio-defensa/20260810/defensa-ciencia-impulsan-desarrollo-propulsores-nucleares-espaciales-produccion-satelites/1003744344187_0.html","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"Diario Sur","pais":"Espanha","titulo":"Hospital Veterinário em Mijas Incorpora Tecnologia Pioneira que Transforma Diagnósticos","resumo":"Um hospital veterinário em Mijas incorporou uma tecnologia pioneira de diagnóstico por imagem de alta precisão.\nA inovação permite identificar patologias complexas de forma não invasiva e com maior agilidade na tomada de decisões.\nA adoção do sistema promete elevar a qualidade dos cuidados médicos oferecidos aos animais na região.\nEsse avanço reflete a crescente modernização e aplicação de recursos tecnológicos de ponta na medicina veterinária.","link":"https://www.diariosur.es/costadelsol/hospital-veterinario-mijas-incorpora-tecnologia-pionera-cambia-20260810000930-nt.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Confidencial Digital","pais":"Espanha","titulo":"Openchip e seu Chip BER10: Impulso Chave para a Economia Tecnológica Europeia e Soberania Digital","resumo":"A Openchip anunciou o desenvolvimento do chip BER10, focado no processamento de altíssimo desempenho para inteligência artificial.\nA novidade representa um passo estratégico para consolidar a soberania digital e a indústria de semicondutores na Europa.\nO componente foi projetado para suprir a demanda por infraestruturas de computação robustas e eficientes na região.\nA iniciativa fortalece a competitividade europeia frente ao mercado global e reduz a dependência tecnológica externa.","link":"https://www.elconfidencialdigital.com/articulo/dinero/openchip-chip-ber10-impulso-clave-economia-tecnologica-europea-soberania-digital/202608091929481035233.html","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"MarketScreener Deutschland","pais":"Alemanha","titulo":"Ex-funcionário da SK Hynix é condenado a 18 meses de prisão por vazamento de tecnologia de chips","resumo":"Um ex-funcionário da fabricante sul-coreana SK Hynix foi condenado a 18 meses de prisão após vazar dados industriais sigilosos de tecnologia de semicondutores. As investigações revelaram que o profissional transferiu milhares de documentos confidenciais para a chinesa Huawei antes de deixar a empresa. O caso destaca o aumento do rigor global contra a espionagem industrial no setor de alta tecnologia.","link":"https://de.marketscreener.com/boerse-nachrichten/ehemaliger-sk-hynix-mitarbeiter-wegen-weitergabe-von-chip-technologie-zu-18-monaten-haft-verurteilt-ce7f50d3dc81ff21","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"DIE ZEIT","pais":"Alemanha","titulo":"Drone no aeroporto de Leipzig: 'Não foi um aviso, foi um ataque'","resumo":"A aparição de um drone não identificado no aeroporto de Leipzig acendeu alertas de segurança máxima na Alemanha. Autoridades locais e especialistas classificaram a invasão do espaço aéreo não como uma simples negligência, mas sim como uma ação deliberada de ataque. O evento reacende debates urgentes sobre a vulnerabilidade da infraestrutura crítica aeroportuária diante de novas ameaças tecnológicas.","link":"https://www.zeit.de/politik/deutschland/2026-08/drohne-leipzig-flughafen-sprengstoff-kameraaufnahmen","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"Zeitungsverlag Waiblingen","pais":"Alemanha","titulo":"Na sombra da Lua: Como pesquisadores aproveitam o eclipse solar","resumo":"Cientistas e astrônomos estão aproveitando o eclipse solar para realizar experimentos inéditos sobre a atmosfera terrestre e a coroa solar. A oportunidade única permite analisar em tempo real como a súbita queda de iluminação afeta a ionosfera e o comportamento de ecossistemas. A pesquisa promete fornecer dados valiosos para aprimorar modelos de previsão de clima espacial.","link":"https://www.zvw.de/mehr-nachrichten/wissenschaft/im-mond-schatten-wie-forscher-die-sonnenfinsternis-nutzen_arid-1093874","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ZAP Notícias","pais":"Alemanha","titulo":"'À espera de quem faça chover': Baixo nível do Rio Reno ameaça economia alemã","resumo":"A acentuada queda no nível do Rio Reno voltou a acender o sinal de alerta para a indústria e o setor logístico da Alemanha. Como uma das vias fluviais mais cruciais para o transporte de cargas na Europa, a seca reduz a capacidade dos navios cargueiros e eleva drasticamente os custos operacionais. Especialistas alertam que a continuidade desse cenário pode gerar novos gargalos na cadeia de suprimentos do país.","link":"https://zap.aeiou.pt/baixo-nivel-do-reno-758708","categoria":"ECONOMIA","lang":"pt"},{"fonte":"docomo.ne.jp","pais":"Japão","titulo":"DOCOMO e Samsung validam com sucesso tecnologia AI-RAN em nível de usuário","resumo":"A NTT DOCOMO e a Samsung Electronics anunciaram a validação bem-sucedida da tecnologia AI-RAN voltada ao nível do usuário.\nO avanço integra inteligência artificial às redes de acesso de rádio para otimizar o desempenho e a eficiência do sinal móvel.\nEssa colaboração promete pavimentar o caminho para a consolidação do 5G avançado e a futura chegada do 6G no mercado global.","link":"https://www.docomo.ne.jp/english/info/media_center/pr/2026/0810_00.html","categoria":"TELECOMUNICAÇÕES","lang":"pt"},{"fonte":"株式会社エクサウィザーズ","pais":"Japão","titulo":"Demissão de Hassabis? A virada que a Google busca com a \"IA Científica\"","resumo":"Diante dos intensos rumores sobre o futuro da liderança de Demis Hassabis na Google DeepMind, a gigante tecnológica reestrutura suas estratégias.\nA empresa aposta fortemente na chamada \"IA Científica\" como seu principal vetor para recuperar o protagonismo no setor.\nA meta é acelerar descobertas complexas em física e biologia, garantindo uma vantagem competitiva sustentável na corrida global de IA.","link":"https://exawizards.com/column/ai-trend/news-08-10-2026-3/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Science Portal Asia Pacific","pais":"Japão","titulo":"KAIST desenvolve tecnologia de controle independente de luz infravermelha média para aplicações espaciais","resumo":"Pesquisadores do KAIST anunciaram o desenvolvimento bem-sucedido de uma tecnologia capaz de controlar a luz infravermelha média de forma independente.\nA inovação apresenta grande potencial para otimizar sensores de alta precisão e componentes utilitários em satélites e aeronaves espaciais.\nA expectativa é que o avanço melhore significativamente a sensibilidade de instrumentos científicos em missões espaciais extremas.","link":"https://spap.jst.go.jp/korea/news/260802/topic_nk_01.html","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"ITmedia","pais":"Japão","titulo":"Agência de Ciência e Tecnologia do Japão investiga possível vazamento de 16 mil e-mails","resumo":"A Agência de Ciência e Tecnologia do Japão (JST) revelou a possibilidade de vazamento de cerca de 16 mil registros de e-mail.\nO incidente foi descoberto após alertas emitidos por entidades externas, desencadeando auditorias internas de segurança imediatamente.\nA agência trabalha para mitigar os danos, reforçar a infraestrutura digital e conter novos riscos à informação pública do país.","link":"https://www.itmedia.co.jp/news/article/2608/10/2000000480/","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"Universidade Tecnológica de Nagaoka adota ferramenta de IA \"Paperpal\" para apoiar artigos acadêmicos","resumo":"A Universidade Tecnológica de Nagaoka iniciou a implementação experimental da plataforma de escrita assistida por IA \"Paperpal\".\nA iniciativa visa fortalecer a capacidade dos estudantes de doutorado de redigir e publicar pesquisas científicas em inglês com maior fluência.\nCom essa ferramenta, a instituição pretende acelerar a formação de jovens pesquisadores e expandir o impacto internacional de suas teses.","link":"https://prtimes.jp/main/html/rd/p/000000113.000006186.html","categoria":"EDUCAÇÃO E CIÊNCIA","lang":"pt"},{"fonte":"ritsumei.ac.jp","pais":"Japão","titulo":"A Ciência do Esporte em 2035: os limites da expansão física, sensorial e de desempenho","resumo":"Um novo evento debate as projeções da ciência do esporte para o ano de 2035 e as fronteiras do corpo humano.\nEspecialistas analisam como tecnologias emergentes e neurociência poderão ampliar sentidos, aptidão física e alta performance atlética.\nA discussão levanta pontos críticos sobre o impacto ético e tecnológico da ampliação de capacidades corporais no futuro.","link":"https://www.ritsumei.ac.jp/research/kyokugen/news/article/?id=42","categoria":"CIÊNCIA E TECNOLOGIA","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Plataforma de eMotorsports \"UNIZONE\" ganha destaque no TikTok GG Festival 2026","resumo":"A plataforma de automobilismo virtual UNIZONE participará do festival TikTok GG Festival 2026 trazendo atrações imersivas.\nO evento oferecerá aos visitantes experiências com simuladores avançados de iRacing e mentorias práticas ministradas por pilotos profissionais.\nA ação visa impulsionar a popularização do eMotorsport e aproximar novas gerações das tecnologias de simulação automobilística.","link":"https://news.yahoo.co.jp/articles/750c3f5f037ed3ede842305f3c7300e10cbdd657","categoria":"ESPORTS","lang":"pt"},{"fonte":"newsdig.tbs.co.jp","pais":"Japão","titulo":"Curso de tecnologia digital para estudantes do ensino médio promove prática com drones e transmissão de vídeo","resumo":"Um programa de \"Curso de Fundamentos Digitais\" foi promovido com o objetivo de aprofundar os conhecimentos tecnológicos de estudantes do ensino médio.\nOs alunos participaram ativamente de cinco módulos práticos que incluíram a pilotagem de drones e o manuseio de ferramentas de transmissão ao vivo.\nA iniciativa incentiva o letramento digital de jovens talentos e prepara a nova geração para demandas técnicas do mercado tecnológico.","link":"https://newsdig.tbs.co.jp/articles/atv/2863631?display=1","categoria":"CAPACITAÇÃO DIGITAL","lang":"pt"},{"fonte":"O GLOBO","pais":"China","titulo":"Fabricante chinesa de chips prepara IPO em Hong Kong impulsionada pelo boom da inteligência artificial","resumo":"Impulsionada pela alta demanda global por hardware de inteligência artificial, uma proeminente fabricante chinesa de semicondutores anunciou preparativos para sua abertura de capital na Bolsa de Hong Kong. O movimento reflete o forte crescimento do setor tecnológico nacional e a busca por capitalização para expandir a capacidade produtiva local. A iniciativa visa fortalecer a autonomia da China na cadeia global de suprimentos de microchips e acelerar a inovação em computação avançada.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/08/09/com-boom-da-ia-fabricante-chinesa-de-chips-se-prepara-para-abrir-capital-em-hong-kong.ghtml","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"MundoCoop","pais":"China","titulo":"Demanda global por inteligência artificial impulsiona as exportações da China","resumo":"A forte procura mundial por componentes e infraestrutura voltados à inteligência artificial tem sustentado com vigor o setor exportador do gigante asiático. Produtos eletrônicos de alta precisão, servidores e equipamentos de computação em nuvem lideram as remessas internacionais, garantindo saldo positivo na balança comercial. Analistas destacam que a transição para economias digitais fortalece a posição da China como fornecedora chave de tecnologia avançada.","link":"https://mundocoop.com.br/economia-negocios/demanda-por-ia-mantem-motor-das-exportacoes-da-china-em-pleno-funcionamento/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"okdiario.com","pais":"China","titulo":"Estudo confirma que a China reduziu 98% da poluição em 12 anos","resumo":"Um novo levantamento científico revelou que políticas severas e investimentos massivos em tecnologias limpas permitiram à China eliminar até 98% dos níveis críticos de contaminação em regiões estratégicas ao longo de doze anos. A rápida transição energética e o rigor no controle de emissões industriais serviram de base para esse feito sem precedentes na história moderna. O resultado posiciona o país como referência em mitigação ambiental e inovação ecológica em grande escala.","link":"https://okdiario.com/ciencia/parece-ficcion-nadie-vio-venir-china-elimina-12-anos-98-contaminacion-capital-16120833","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"电子工程专辑","pais":"China","titulo":"Mercado de IA das operadoras chinesas migra do tráfego para a economia computacional","resumo":"As operadoras de telecomunicações da China estão reformulando seus modelos de negócios ao migrarem da venda tradicional de tráfego de dados para a oferta de capacidade computacional e Tokens de IA. Essa transição estratégica busca monetizar a infraestrutura de redes para atender à demanda crescente de empresas por processamento em nuvem e inteligência artificial. O movimento sinaliza uma reestruturação profunda do ecossistema digital chinês nos próximos anos.","link":"https://www.eet-china.com/mp/a515841.html","categoria":"TELECOMUNICAÇÕES","lang":"pt"},{"fonte":"东方财富","pais":"China","titulo":"Kuang-Chi Technologies garante grande contrato de aquisição de drones","resumo":"A empresa de tecnologia avançada Kuang-Chi divulgou a assinatura de um expressivo contrato para o fornecimento de aeronaves não tripuladas e materiais metamateriais. A encomenda reforça a consolidação do setor de veículos aéreos autônomos e a expansão do uso comercial e industrial de drones no país. O anúncio impulsionou o otimismo dos investidores quanto ao papel da empresa na cadeia de suprimentos de tecnologia estratégica.","link":"https://wap.eastmoney.com/a/202608103836434079.html","categoria":"DRONES","lang":"pt"},{"fonte":"ncsti.gov.cn","pais":"China","titulo":"Congresso Internacional de Ciência Básica abre em Pequim premiando cientistas de destaque","resumo":"A edição de 2026 do Congresso Internacional de Ciência Básica teve início em Pequim, reunindo pesquisadores renomados mundialmente para debater avanços em matemática, física e computação. Durante a cerimônia de abertura, nove cientistas de ponta foram laureados com medalhas por suas contribuições extraordinárias ao conhecimento humano. O evento reforça o compromisso da China em se firmar como um polo global de cooperação e desenvolvimento científico.","link":"https://www.ncsti.gov.cn/kjdt/scyq/hrkxc/cqdt/202608/t20260810_252693.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ニュースイッチ by 日刊工業新聞社","pais":"China","titulo":"Japonesa Asahi Kasei introduz tecnologia de eletrólitos para baterias de lítio na China","resumo":"A multinacional japonesa Asahi Kasei anunciou sua entrada no mercado chinês com uma inovadora tecnologia de eletrólitos voltada para baterias de lítio de altíssimo desempenho. A iniciativa visa atender à crescente produção de veículos elétricos e sistemas de armazenamento de energia na região. A cooperação tecnológica promete elevar a eficiência e a densidade energética das baterias de próxima geração no ecossistema automobilístico.","link":"https://newswitch.jp/image/49962","categoria":"ENERGIA","lang":"pt"},{"fonte":"finance.people.com.cn","pais":"China","titulo":"Sichuan implementa 81 radares meteorológicos e transforma controle de enchentes","resumo":"A província de Sichuan concluiu o desdobramento de 81 radares de medição de chuva avançados, revolucionando a capacidade de resposta e prevenção a desastres naturais na região. Os novos equipamentos fornecem dados meteorológicos de altíssima precisão em tempo real, permitindo alertas antecipados e ações preventivas mais eficientes. A iniciativa demonstra como a aplicação prática de tecnologia de ponta pode mitigar riscos ambientais e proteger populações vulneráveis.","link":"http://finance.people.com.cn/n1/2026/0810/c1004-40776904.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Siliconindia","pais":"Índia","titulo":"Índia está entre as principais nações em tecnologia quântica, afirma Jitendra Singh","resumo":"O ministro da Ciência e Tecnologia da Índia, Jitendra Singh, destacou que o país se consolidou entre as principais potências globais no desenvolvimento de tecnologia quântica.\nO progresso é impulsionado por investimentos estratégicos em pesquisa, infraestrutura tecnológica avançada e apoio governamental a startups de inovação.\nEssa ascensão visa garantir soberania tecnológica e liderança em inovações de computação e comunicação quântica nos próximos anos.","link":"https://www.siliconindia.com/news/general/india-among-top-nations-in-quantum-technology-says-jitendra-singh-nid-241856-cid-1.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Índia","titulo":"O setor de tecnologia governamental da Índia enfrenta um problema de especialização","resumo":"Apesar do rápido crescimento da infraestrutura digital na Índia, especialistas alertam para a falta de conhecimentos técnicos altamente especializados nas esferas governamentais.\nA escassez de profissionais qualificados em governança de dados e cibersegurança compromete a eficácia e a segurança das políticas públicas digitais.\nPara superar esse desafio, analistas defendem reformas urgentes na capacitação técnica de burocratas e na atração de talentos do setor privado.","link":"https://www.moneycontrol.com/news/opinion/india-s-technology-state-has-an-expertise-problem-13999381.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Índia","titulo":"Corte, edite, lucre: como a 'economia dos cortes' na Índia está gerando dinheiro com momentos virais","resumo":"Uma nova onda de criadores de conteúdo na Índia está lucrando ao transformar transmissões ao vivo e podcasts em vídeos curtos para plataformas como Reels e Shorts.\nEssa chamada 'economia dos cortes' movimenta milhões de visualizações e monetiza momentos marcantes da internet de forma extremamente ágil.\nA tendência reflete a mudança no consumo de mídia digital, impulsionando pequenos editores a alcançar renda significativa por meio do engajamento online.","link":"https://www.moneycontrol.com/technology/cut-edit-earn-how-india-s-clipping-economy-is-minting-money-from-viral-moments-article-13999350.html","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"newindianexpress.com","pais":"Índia","titulo":"Com aumento de lesões na Índia, BCCI continua busca por chefe de ciência do esporte","resumo":"Diante do crescente número de atletas lesionados, o Conselho de Controle do Críquete na Índia intensificou a busca por um novo líder especializado em ciência do esporte.\nA instituição busca implementar metodologias científicas modernas de prevenção, recuperação e monitoramento físico para preservar os atletas.\nA contratação é considerada crucial para reestruturar o departamento médico do esporte mais popular do país e adotar padrões internacionais de alto rendimento.","link":"https://www.newindianexpress.com/sport/cricket/2026/Aug/09/amidst-indias-growing-injuries-bcci-continues-search-for-sports-science-head","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Autocar India","pais":"Índia","titulo":"Economia de combustível em condições reais do Nissan Gravite GNV é testada e explicada","resumo":"Testes recentes avaliaram o desempenho e a eficiência do novo modelo Nissan Gravite movido a Gás Natural Veicular em condições reais de tráfego na Índia.\nOs resultados demonstraram um equilíbrio promissor entre baixo custo por quilômetro rodado e boa autonomia para o uso urbano diário.\nA análise reforça o apelo dos veículos a GNV como uma alternativa tecnológica e sustentável em mercados focados na redução de emissões e custos operacionais.","link":"https://www.autocarindia.com/auto-features/nissan-gravite-cng-real-world-fuel-economy-tested-explained-440895","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ideasforindia.in","pais":"Índia","titulo":"Por que a queda da rupia não significa mais uma economia indiana fraca","resumo":"Historicamente vista como um sinal de fragilidade, a desvalorização da rupia indiana frente ao dólar agora reflete uma dinâmica macroeconômica mais complexa e resiliente.\nO fortalecimento das reservas internacionais e o crescimento sólido de setores tecnológicos e industriais atenuam os impactos da variação cambial.\nAnalistas apontam que a economia do país demonstra maior maturidade, permitindo absorver oscilações externas sem comprometer o desenvolvimento nacional.","link":"https://www.ideasforindia.in/topics/macroeconomics/why-a-falling-rupee-no-longer-means-a-weak-indian-economy","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Deccan Chronicle","pais":"Índia","titulo":"Economia de Telangana se destaca em relatório do Banco Central da Índia","resumo":"O estado de Telangana registrou um desempenho econômico notável, de acordo com o mais recente relatório divulgado pelo Reserve Bank of India.\nO crescimento foi impulsionado pela forte expansão do setor de tecnologia da informação, além de investimentos contínuos em infraestrutura e inovação.\nO resultado consolida o estado como um dos principais motores de desenvolvimento tecnológico do país, atraindo atenção de investidores globais.","link":"https://www.deccanchronicle.com/southern-states/telangana/telangana-economy-registers-108-growth-in-2025-26-as-services-and-allied-sectors-surge-rbi-report-1977962","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"TVI","pais":"Portugal","titulo":"Tecnologia portuguesa quer tornar drones e aviões quase invisíveis aos radares","resumo":"Pesquisadores e empresas em Portugal estão desenvolvendo uma solução inovadora capaz de reduzir significativamente a assinatura de radar em aeronaves e drones. A tecnologia utiliza materiais avançados e design estratégico para absorver e dispersar ondas eletromagnéticas. Essa inovação promete fortalecer a indústria de defesa e aeroespacial do país, abrindo portas para novas parcerias internacionais e aplicações militares de alta precisão.","link":"https://tvi.iol.pt/noticias/video/tecnologia-portuguesa-quer-tornar-drones-e-avioes-quase-invisiveis-aos-radares/6a78cfc90cf2f6a1a1e73759","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"As profissões mais atraentes, segundo a ciência (ou ao menos segundo as pesquisas)","resumo":"Diversos estudos e levantamentos recentes buscaram identificar quais carreiras e ocupações despertam maior atração interpessoal no público. Os resultados revelam que percepções de altruísmo, liderança, inteligência e estabilidade financeira influenciam diretamente o apelo percebido em cada profissão. Embora a ciência mostre nuances comportamentais complexas, o impacto dessas pesquisas destaca como fatores sociais e psicológicos moldam a atração humana na sociedade moderna.","link":"https://sapo.pt/artigo/as-profissoes-mais-sexy-segundo-a-ciencia-ou-pelo-menos-segundo-os-inqueritos-6a7880ac0c60413700012710","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Leak.pt","pais":"Portugal","titulo":"Ter cachorro protege a saúde dos seus filhos? A ciência mostra que é mais complexo","resumo":"A ideia de que conviver com cães desde a infância fortalece o sistema imunológico e previne alergias em crianças ganha novos contornos segundo estudos científicos. Pesquisadores apontam que os benefícios dependem de fatores genéticos, ambientais e do momento do desenvolvimento em que o contato ocorre. A análise ressalta a importância de entender melhor essas interações microbianas e traz uma visão equilibrada sobre a presença de animais de estimação na saúde infantil.","link":"https://www.leak.pt/cao-protege-a-saude-dos-teus-filhos/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"G1","pais":"Brazil","titulo":"First OpenAI, Now Meta: Why AI Bots Continue to Carry Out Hacker Attacks","resumo":"Recent cases involving major tech companies have sounded the alarm over the use of autonomous artificial intelligence agents in cybercrime.\nExperts point out that these bots are being manipulated to automate breaches and identify vulnerabilities in critical systems with unprecedented speed.\nThis advancement raises urgent debates regarding regulation, tool monitoring, and new strategies to protect global digital infrastructure.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/10/primeiro-a-openai-depois-a-meta-por-que-robos-de-ia-continuam-fazendo-ataques-hackers.ghtml","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"Volatile Energy Demand from Artificial Intelligence Causes Damage to Data Centers","resumo":"The rapid expansion and intensive processing required by artificial intelligence models have been causing unpredictable spikes in electrical power consumption.\nThis severe supply volatility overloads physical infrastructure components and causes serious damage to large data center equipment.\nFaced with this scenario, tech giants are seeking urgent solutions in renewable energies and more resilient power grids to prevent collapses and financial losses.","link":"https://www1.folha.uol.com.br/mercado/2026/08/demanda-volatil-da-inteligencia-artificial-por-energia-danifica-data-centers.shtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Globo","pais":"Brazil","titulo":"First Complete Marmoset Genome Expected to Boost Alzheimer's Research","resumo":"Scientists have achieved a historic milestone by fully mapping the genome of the marmoset for the first time, a small primate widely studied in neuroscience.\nThis detailed sequencing will provide valuable genetic data to understand the neurological mechanisms and progression of neurodegenerative diseases.\nThe discovery paves the way for the development of new treatments, early diagnoses, and more precise gene therapies in medicine.","link":"https://revistagalileu.globo.com/google/amp/ciencia/noticia/2026/08/primeiro-genoma-completo-do-sagui-vai-possibilitar-pesquisas-sobre-alzheimer.ghtml","categoria":"SCIENCE","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"AI-Powered Cameras Promise to Predict Crimes, But Raise Privacy Alarms","resumo":"Modern surveillance systems equipped with artificial intelligence promise to analyze behavior in real time to predict and prevent crimes in public spaces.\nHowever, the extensive use of this technology has generated controversy and concerns regarding privacy violations and algorithmic bias.\nThe current debate calls for a strict balance between public safety efficiency and the protection of fundamental citizen rights.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/09/cameras-com-ia-prometem-prever-crimes-antes-que-acontecam-mas-acendem-alerta-sobre-privacidade.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Vietnam.vn","pais":"Brazil","titulo":"Leak Reveals New 200MP Camera Technology for Upcoming Galaxy S27 Ultra","resumo":"Leaked industry information indicates that a revolutionary 200-megapixel camera sensor technology is in an advanced stage of development.\nIt is speculated that this new high-end lens will make its debut in Samsung's upcoming Galaxy S27 Ultra model.\nThis advancement promises to transform mobile photography by offering AI-enhanced image processing and superior low-light capture.","link":"https://www.vietnam.vn/pt/he-lo-camera-200mp-cong-nghe-hoan-toan-moi-se-trang-bi-cho-galaxy-s27-ultra","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"Could Artificial Intelligence Create a Permanent Underclass?","resumo":"The accelerated development of artificial intelligence raises profound ethical debates about the future of work and global socioeconomic inequality.\nExperts warn of the risk that unrestrained automation may marginalize workers whose jobs are replaced without proper retraining.\nThe study advocates for proactive governance measures and public policies to prevent the entrenchment of a disadvantaged subclass in the digital age.","link":"https://www1.folha.uol.com.br/mercado/2026/08/a-ia-poderia-criar-uma-classe-inferior-permanente.shtml","categoria":"INNOVATION","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Rayssa Leal Wins the SLS Rio Takeover Title at Maracanãzinho","resumo":"Olympic medalist Rayssa Leal shone once again by being crowned champion of the SLS Rio Takeover event, held at the iconic Maracanãzinho gymnasium in Rio de Janeiro.\nThe Brazilian skater dominated the decisive maneuvers and secured the highest score of the competition amidst intense cheers from the local crowd.\nThe result solidifies Brazil's prominence in global skateboarding and reinforces the athlete's preparation for the upcoming stages of the international circuit.","link":"https://oglobo.globo.com/google/amp/esportes/noticia/2026/08/09/skate-rayssa-leal-vence-titulo-do-sls-rio-takeover-no-maracanazinho.ghtml","categoria":"SPORTS","lang":"en"},{"fonte":"UOL Economia","pais":"Brazil","titulo":"Ibirapuera Park Hosts Major Entrepreneurship and Innovation Event","resumo":"Ibirapuera Park in São Paulo becomes the epicenter of innovation by hosting an eight-day event focused on entrepreneurship and technology.\nThe schedule brings together startups, investors, and industry leaders to discuss market trends, artificial intelligence, and sustainability.\nThe initiative seeks to strengthen the Brazilian tech ecosystem and generate strategic connections between emerging businesses and major corporations.","link":"https://economia.uol.com.br/noticias/redacao/2026/08/09/por-8-dias-ibirapuera-vira-palco-de-evento-de-empreendedorismo-e-inovacao.ghtm","categoria":"BUSINESS","lang":"en"},{"fonte":"SAPO","pais":"United States","titulo":"Google Launches Gemini Robotics 2 to Advance Smart Automation","resumo":"Google has announced the launch of Gemini Robotics 2, its new advanced model focused on integrating artificial intelligence with physical robotics.\nThe tool promises to enhance reasoning capabilities, adaptation, and the execution of complex tasks in real-world environments more autonomously.\nThis breakthrough represents a major step forward in the race to develop more efficient and adaptable robots for industries and services.","link":"https://sapo.pt/artigo/google-lanca-gemini-robotics-2-6a7907f30c60413700244bde","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"AI News","pais":"United States","titulo":"US AI Investment Boom Reshapes the Country's Economy","resumo":"Massive investment in artificial intelligence across the United States is radically transforming the nation's economic landscape.\nTech giants and startups are injecting billions of dollars into processing infrastructure, data centers, and new talent.\nThis wave of capital not only drives the tech sector forward but also redistributes jobs and redefines the global competitiveness of American industry.","link":"https://www.artificialintelligence-news.com/news/americas-ai-investment-boom-is-reshaping-the-economy/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"theguardian.com","pais":"United States","titulo":"NASA Airborne Mission Captures Rare Data During Solar Eclipse","resumo":"NASA mobilized a special airborne mission to collect unprecedented scientific data by chasing the shadow of a rare solar eclipse.\nFlying at high altitudes, aircraft equipped with advanced instruments managed to prolong solar corona observation times.\nThe data obtained will help researchers better understand the Sun's magnetic fields and their direct impact on space weather.","link":"https://www.theguardian.com/science/2026/aug/09/nasa-mission-total-solar-eclipse-iceland-sun-nanoflares","categoria":"SCIENCE","lang":"en"},{"fonte":"Época Negócios","pais":"United States","titulo":"How NASA Will Help Fight Wildfires","resumo":"NASA is applying its space technologies to monitor and assist in fighting growing wildfires.\nThrough high-resolution satellites and artificial intelligence, the agency is able to predict the spread of flames and map high-risk areas in real time.\nThis cooperation provides crucial data for firefighters and local authorities to minimize environmental impacts and save lives.","link":"https://epocanegocios.globo.com/google/amp/tecnologia/noticia/2026/08/como-a-nasa-vai-ajudar-a-combater-os-incendios-florestais.ghtml","categoria":"SCIENCE","lang":"en"},{"fonte":"theguardian.com","pais":"United States","titulo":"Influencers Face Backlash Over Content Shot with Meta Smart Glasses","resumo":"Digital influencers are losing followers and facing harsh criticism due to their use of Meta's smart glasses.\nPublic privacy concerns have skyrocketed after the sharing of videos recorded without the explicit consent of third parties.\nThe episode reignites the debate over the ethical and regulatory limits of using wearable tech with built-in cameras in public spaces.","link":"https://www.theguardian.com/technology/2026/aug/09/i-kept-catching-people-giving-me-dirty-looks-the-backlash-against-meta-smart-glasses","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"theguardian.com","pais":"United States","titulo":"Samsung Galaxy Z Fold 8 Review: The Passport to the Future of Foldables","resumo":"The new Samsung Galaxy Z Fold 8 hits the market bringing significant refinements in design, durability, and performance to the foldable smartphone category.\nFeaturing a slimmer build, a nearly imperceptible screen crease, and optimized multitasking features, the device solidifies the maturity of this form factor.\nThe review highlights that the device serves as a strong indication of the definitive mainstream adoption of foldables in the high-end segment.","link":"https://www.theguardian.com/technology/2026/aug/10/samsung-galaxy-z-fold-8-review-folding-phone","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Globo","pais":"United States","titulo":"125 Years and Counting: Where the World's Longest-Burning Light Bulb Is Located","resumo":"Located in a fire station in California, the so-called \"Centennial Light\" has remained lit for over 125 years with virtually no interruption.\nManufactured in the late 19th century, the incandescent bulb defies planned obsolescence and continues to puzzle scientists due to its extreme durability.\nThe phenomenon attracts visitors from around the world and remains the subject of studies on engineering and material longevity.","link":"https://revistagalileu.globo.com/google/amp/tecnologia/noticia/2026/08/125-anos-e-contando-onde-fica-a-lampada-acesa-ha-mais-tempo-no-mundo.ghtml","categoria":"CURIOSITY","lang":"en"},{"fonte":"The Motley Fool","pais":"United States","titulo":"Adobe vs. Arista Networks: Which Tech Stock Is the Better Buy for 2026?","resumo":"A comparative analysis evaluates the growth potential and stability between tech giants Adobe and Arista Networks for the coming years.\nWhile Adobe is betting on the massive integration of generative artificial intelligence into its creative software, Arista is benefiting from the expansion of cloud networking infrastructure.\nThe study provides valuable perspectives for investors focused on long-term trends in the technology sector.","link":"https://www.fool.com/coverage/better-buy/2026/08/09/adobe-vs-arista-networks-which-technology-stock-is-a-better-buy-in-2026/","categoria":"BUSINESS","lang":"en"},{"fonte":"La Croix","pais":"France","titulo":"Faced with Donald Trump's anti-science offensive, researchers protect NASA's climate data","resumo":"Faced with political uncertainties and potential budget cuts, scientists are mobilizing efforts to archive NASA climate data.\nThe initiative seeks to preserve decades of global warming research on independent servers ahead of governmental changes.\nThe task force ensures that information critical to the fight against climate change remains accessible to the international community.","link":"https://www.la-croix.com/planete/face-a-l-offensive-anti-science-de-donald-trump-ces-chercheurs-qui-mettent-a-labri-les-donnees-climatiques-de-la-nasa-20260809","categoria":"SCIENCE","lang":"en"},{"fonte":"ladepeche.fr","pais":"France","titulo":"Defense: Faced with drones, laser weapons move from the laboratory to the battlefield","resumo":"The advancement of drone usage in modern conflicts has driven the operational deployment of directed-energy laser weapons.\nOnce restricted to laboratories, these technologies are beginning to be integrated practically into the defense systems of various countries.\nIn addition to precision against aerial threats, laser systems drastically reduce the cost per shot compared to traditional missiles.","link":"https://www.ladepeche.fr/2026/08/10/defense-face-aux-drones-les-armes-laser-passent-du-laboratoire-au-champ-de-bataille-13502596.php","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"France 24","pais":"France","titulo":"With technology and patrols, France steps up prevention to face another summer of wildfires","resumo":"France has intensified its use of advanced monitoring technologies, including drones and sensors, to mitigate wildfire risks in the summer.\nThe system integrates ground patrols with real-time data analysis to identify fire outbreaks at an early stage.\nThe strategy aims to protect forests and sensitive areas, adapting the country's infrastructure to increasing heatwaves on the continent.","link":"https://www.france24.com/es/video/20260810-con-tecnolog%C3%ADa-y-patrullajes-francia-refuerza-la-prevenci%C3%B3n-ante-otro-verano-de-incendios","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"lecourrier.vn","pais":"France","titulo":"Vietnam and Australia seek to strengthen scientific and technological cooperation","resumo":"Vietnam and Australia have signed a new agreement to expand cooperation in scientific research, digital innovation, and energy transition.\nThe partnership provides for the joint funding of projects focused on artificial intelligence, sustainable agriculture, and tech ecosystems.\nThe move strengthens bilateral ties and accelerates industrial transformation and technical development capacity in both countries.","link":"https://lecourrier.vn/vietnam-et-australie-veulent-renforcer-leur-cooperation-scientifique-et-technologique/1353092.html","categoria":"SCIENCE AND TECHNOLOGY","lang":"en"},{"fonte":"i24NEWS","pais":"France","titulo":"Israel: Ministry of Defense draws inspiration from the Chinese model to strengthen military industry","resumo":"Israel's Ministry of Defense is adapting strategies from the Chinese model to accelerate the production of military technologies.\nThe approach focuses on the fusion between the civil and military sectors, in addition to direct incentives for defensive tech innovation startups.\nThe measure aims to reinforce the self-sufficiency of the defense industry and ensure agility in the development of new strategic equipment.","link":"https://www.i24news.tv/fr/actu/israel/artc-israel-le-ministere-de-la-defense-s-inspire-du-modele-chinois-pour-renforcer-son-industrie-militaire","categoria":"INNOVATION","lang":"en"},{"fonte":"theguardian.com","pais":"United Kingdom","titulo":"Starwatch: Deep partial solar eclipse in the UK to precede the Perseids","resumo":"A major partial solar eclipse will be visible in the UK ahead of the peak of the Perseid meteor shower. This rare astronomical event offers an exceptional opportunity for stargazers and science enthusiasts in the region. Furthermore, the phenomenon reinforces the importance of raising public awareness about safe solar viewing and the astronomical impact of the current solar cycle.","link":"https://www.theguardian.com/science/2026/aug/10/starwatch-deep-partial-solar-eclipse-uk-perseids","categoria":"SCIENCE","lang":"en"},{"fonte":"theguardian.com","pais":"United Kingdom","titulo":"UK manufacturers face growing risk of cyberattacks, research reveals","resumo":"Recent research revealed that approximately 30% of UK manufacturers suffered cyberattacks in the past year. The sector faces increasing vulnerabilities as automation and industrial digitalization expand rapidly. Experts warn that it is crucial to bolster digital defenses to protect critical infrastructure and avoid devastating operational and financial losses in the British industrial market.","link":"https://www.theguardian.com/technology/2026/aug/10/uk-companies-cyber-attack-third-jlr","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"Retail Technology Innovation Hub","pais":"United Kingdom","titulo":"Rapid grocery deliveries in Guernsey and self-service bars in Brighton highlight technological innovations","resumo":"Technological innovations are transforming the retail and entertainment sectors in the UK with the expansion of new automated services. Recent highlights include ultra-fast grocery delivery systems and fully automated self-service bars. These initiatives demonstrate how consumer automation is gaining traction in the British market, altering consumer behavior and traditional business models.","link":"https://retailtechinnovationhub.com/home/2026/8/9/rapid-grocery-deliveries-in-guernsey-and-self-service-bars-in-brighton-last-weeks-biggest-technology-plays","categoria":"INNOVATION","lang":"en"},{"fonte":"Euronext Markets: Real-time Stock Market Data | live","pais":"United Kingdom","titulo":"UK announces nearly £130 million investment for zero-emission vehicle technology","resumo":"The UK government has confirmed an investment of nearly £130 million focused on the development of technologies for zero-emission vehicles. The funding aims to accelerate the ecological transition in the transport sector and drive innovation in batteries and electric mobility within the British industry. The initiative reinforces the country's carbon-neutrality goal and seeks to position the UK as a global benchmark in sustainable technologies.","link":"https://live.euronext.com/en/financial-news/uk-announces-nearly-ps130-million-funding-zero-emission-vehicle-technology","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"motor16.com","pais":"Spain","titulo":"2027 Toyota Crown: The Hybrid That Challenges Premium Sedans with Technology, Comfort, and 340 HP","resumo":"The 2027 Toyota Crown has redefined the premium sedan segment by combining bold design with cutting-edge hybrid efficiency.\nEquipped with 340 HP and advanced driver assistance technology systems, the model guarantees performance and comfort.\nThis new release represents a strategic step by the manufacturer to compete directly with global luxury brands.\nThe integration of automotive innovation reinforces the transition toward more efficient and sustainable vehicles in the market.","link":"https://www.motor16.com/las-ultimas-noticias/toyota-crown-hibrido/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"infoLibre","pais":"Spain","titulo":"Science Explains Why Images from Ceuta Favor PP and Vox's Anti-Immigration Discourse","resumo":"A scientific study analyzes the psychological and visual impact of border images in Ceuta on Spanish public opinion.\nResearchers show how the cognitive processing of certain framings reinforces anti-immigration political narratives.\nThe analysis highlights the role of confirmation bias and emotions in the reception of content with strong visual appeal.\nThe work underscores the importance of behavioral science in understanding the dynamics of contemporary political debate.","link":"https://www.infolibre.es/politica/ciencia-explica-imagenes-ceuta-favorecen-discurso-antiinmigracion-pp-vox_1_2234809.html","categoria":"SOCIAL SCIENCE","lang":"en"},{"fonte":"Infobae","pais":"Spain","titulo":"How Solar Eclipses Have Helped Science, According to a Physicist: \"Over a Century Later, It Remains the Law That Governs the Universe\"","resumo":"Historically, solar eclipses have been fundamental to validating high-impact scientific theories around the world.\nThe observation of solar occultation made it possible to prove revolutionary predictions, such as Einstein's Theory of Relativity.\nPhysicists point out that these events remain essential for testing fundamental laws of the universe and modern physics.\nThe ongoing analysis of these rare phenomena drives new discoveries and sparks the interest of the astronomical community.","link":"https://www.infobae.com/espana/2026/08/10/como-han-ayudado-los-eclipses-solares-a-la-ciencia-segun-un-fisico-mas-de-un-siglo-despues-sigue-siendo-la-ley-que-gobierna-el-universo/","categoria":"SCIENCE","lang":"en"},{"fonte":"EL PAÍS","pais":"Spain","titulo":"No, Artificial Intelligence Is Not Intelligent","resumo":"An emerging debate within the scientific community questions the attribution of real intelligence to advanced AI systems.\nExperts explain that these models operate via statistical pattern recognition without true consciousness or comprehension.\nThe analysis warns against the dangers of overestimating the autonomy of these tools in critical everyday decisions.\nThe discussion aims to align society's expectations regarding the current actual stage and technical limitations of the technology.","link":"https://elpais.com/tecnologia/2026-08-10/no-la-ia-no-es-inteligente.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"heraldo.es","pais":"Spain","titulo":"Citizen Science Project Will Analyze Animal Reactions to the Total Eclipse in Spain: \"It Has Never Been Done Before\"","resumo":"An unprecedented citizen science project in Spain will mobilize the population to record animal reactions during the solar eclipse.\nThe initiative aims to collect large-scale data on the behavioral changes of wildlife and domestic animals.\nResearchers point out that the sudden darkness provides a unique and previously untested opportunity in the region.\nThe results are expected to generate new insights relevant to zoology and the understanding of behavioral biology.","link":"https://www.heraldo.es/noticias/nacional/2026/08/10/proyecto-ciencia-ciudadana-analizara-reaccionan-animales-eclipse-total-sol-no-habia-hecho-antes-2042402.html","categoria":"SCIENCE","lang":"en"},{"fonte":"El Español","pais":"Spain","titulo":"Defense and Science Drive the Development of Space Nuclear Thrusters and Satellite Production","resumo":"Spain's Ministries of Defense and Science have joined forces to develop space nuclear propulsion systems.\nThe partnership aims to expand satellite manufacturing capabilities and strengthen the country's aerospace infrastructure.\nThe initiative boosts Europe's technological sovereignty in deep space exploration and strategic defense missions.\nThe project signals a significant step forward in public investment for high-impact scientific and space innovation.","link":"https://www.elespanol.com/observatorio-defensa/20260810/defensa-ciencia-impulsan-desarrollo-propulsores-nucleares-espaciales-produccion-satelites/1003744344187_0.html","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"Diario Sur","pais":"Spain","titulo":"Veterinary Hospital in Mijas Introduces Pioneering Technology That Transforms Diagnostics","resumo":"A veterinary hospital in Mijas has integrated a pioneering high-precision diagnostic imaging technology.\nThe innovation makes it possible to identify complex pathologies non-invasively and with greater agility in decision-making.\nThe adoption of the system promises to elevate the quality of medical care offered to animals in the region.\nThis advancement reflects the growing modernization and application of cutting-edge technological resources in veterinary medicine.","link":"https://www.diariosur.es/costadelsol/hospital-veterinario-mijas-incorpora-tecnologia-pionera-cambia-20260810000930-nt.html","categoria":"INNOVATION","lang":"en"},{"fonte":"Confidencial Digital","pais":"Spain","titulo":"Openchip and Its BER10 Chip: Key Boost for European Technological Economy and Digital Sovereignty","resumo":"Openchip has announced the development of the BER10 chip, focused on ultra-high-performance processing for artificial intelligence.\nThe new product represents a strategic step to consolidate digital sovereignty and the semiconductor industry in Europe.\nThe component was designed to meet the region's demand for robust and efficient computing infrastructure.\nThe initiative strengthens European competitiveness against the global market and reduces external technological dependence.","link":"https://www.elconfidencialdigital.com/articulo/dinero/openchip-chip-ber10-impulso-clave-economia-tecnologica-europea-soberania-digital/202608091929481035233.html","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"MarketScreener Deutschland","pais":"Germany","titulo":"Former SK Hynix Employee Sentenced to 18 Months in Prison for Chip Technology Leak","resumo":"A former employee of South Korean manufacturer SK Hynix has been sentenced to 18 months in prison after leaking classified industrial data concerning semiconductor technology. Investigations revealed that the professional transferred thousands of confidential documents to China's Huawei before leaving the company. The case highlights the increasing global crackdown on industrial espionage in the high-tech sector.","link":"https://de.marketscreener.com/boerse-nachrichten/ehemaliger-sk-hynix-mitarbeiter-wegen-weitergabe-von-chip-technologie-zu-18-monaten-haft-verurteilt-ce7f50d3dc81ff21","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"DIE ZEIT","pais":"Germany","titulo":"Drone at Leipzig Airport: 'It Was Not a Warning, It Was an Attack'","resumo":"The appearance of an unidentified drone at Leipzig Airport triggered maximum security alerts in Germany. Local authorities and experts classified the airspace intrusion not as simple negligence, but rather as a deliberate attack. The event reignites urgent debates regarding the vulnerability of critical airport infrastructure to new technological threats.","link":"https://www.zeit.de/politik/deutschland/2026-08/drohne-leipzig-flughafen-sprengstoff-kameraaufnahmen","categoria":"SECURITY","lang":"en"},{"fonte":"Zeitungsverlag Waiblingen","pais":"Germany","titulo":"In the Shadow of the Moon: How Researchers Are Taking Advantage of the Solar Eclipse","resumo":"Scientists and astronomers are taking advantage of the solar eclipse to conduct unprecedented experiments on Earth's atmosphere and the solar corona. This unique opportunity allows them to analyze in real-time how the sudden drop in illumination affects the ionosphere and ecosystem behavior. The research promises to provide valuable data to improve space weather forecasting models.","link":"https://www.zvw.de/mehr-nachrichten/wissenschaft/im-mond-schatten-wie-forscher-die-sonnenfinsternis-nutzen_arid-1093874","categoria":"SCIENCE","lang":"en"},{"fonte":"ZAP Notícias","pais":"Germany","titulo":"'Waiting for Rain': Low Water Levels on the Rhine River Threaten the German Economy","resumo":"The sharp drop in the water level of the Rhine River has once again sounded alarm bells for Germany's industry and logistics sector. As one of Europe's most crucial waterways for freight transport, the drought reduces cargo ship capacity and drastically drives up operating costs. Experts warn that the continuation of this scenario could generate new bottlenecks in the country's supply chain.","link":"https://zap.aeiou.pt/baixo-nivel-do-reno-758708","categoria":"ECONOMY","lang":"en"},{"fonte":"docomo.ne.jp","pais":"Japan","titulo":"DOCOMO and Samsung Successfully Validate User-Level AI-RAN Technology","resumo":"NTT DOCOMO and Samsung Electronics have announced the successful validation of user-level AI-RAN technology.\nThe breakthrough integrates artificial intelligence into radio access networks to optimize mobile signal performance and efficiency.\nThis collaboration promises to pave the way for the consolidation of advanced 5G and the future arrival of 6G in the global market.","link":"https://www.docomo.ne.jp/english/info/media_center/pr/2026/0810_00.html","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"株式会社エクサウィザーズ","pais":"Japan","titulo":"Hassabis's Resignation? The Turnaround Google Seeks with 'Scientific AI'","resumo":"Amid intense rumors about the future of Demis Hassabis's leadership at Google DeepMind, the tech giant is restructuring its strategies.\nThe company is betting heavily on so-called \"Scientific AI\" as its main vector to regain prominence in the sector.\nThe goal is to accelerate complex discoveries in physics and biology, ensuring a sustainable competitive advantage in the global AI race.","link":"https://exawizards.com/column/ai-trend/news-08-10-2026-3/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Science Portal Asia Pacific","pais":"Japan","titulo":"KAIST Develops Mid-Infrared Independent Light Control Technology for Space Applications","resumo":"Researchers at KAIST have announced the successful development of a technology capable of independently controlling mid-infrared light.\nThe innovation holds great potential for optimizing high-precision sensors and utility components in satellites and space aircraft.\nThis advancement is expected to significantly improve the sensitivity of scientific instruments in extreme space missions.","link":"https://spap.jst.go.jp/korea/news/260802/topic_nk_01.html","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"ITmedia","pais":"Japan","titulo":"Japan Science and Technology Agency Investigates Potential Leak of 16,000 Emails","resumo":"The Japan Science and Technology Agency (JST) has revealed the possibility of a leak involving approximately 16,000 email records.\nThe incident was discovered following alerts issued by external entities, immediately triggering internal security audits.\nThe agency is working to mitigate the damage, reinforce its digital infrastructure, and curb further risks to the country's public information.","link":"https://www.itmedia.co.jp/news/article/2608/10/2000000480/","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"Nagaoka University of Technology Adopts 'Paperpal' AI Tool to Support Academic Papers","resumo":"Nagaoka University of Technology has begun the experimental implementation of the AI-assisted writing platform \"Paperpal\".\nThe initiative aims to strengthen PhD students' ability to draft and publish scientific research in English with greater fluency.\nThrough this tool, the institution intends to accelerate the training of young researchers and expand the international impact of their theses.","link":"https://prtimes.jp/main/html/rd/p/000000113.000006186.html","categoria":"EDUCATION AND SCIENCE","lang":"en"},{"fonte":"ritsumei.ac.jp","pais":"Japan","titulo":"Sports Science in 2035: The Limits of Physical, Sensory, and Performance Expansion","resumo":"A new event discusses sports science projections for the year 2035 and the boundaries of the human body.\nExperts analyze how emerging technologies and neuroscience could expand senses, physical fitness, and high athletic performance.\nThe discussion raises critical points regarding the ethical and technological impact of expanding bodily capabilities in the future.","link":"https://www.ritsumei.ac.jp/research/kyokugen/news/article/?id=42","categoria":"SCIENCE AND TECHNOLOGY","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"'UNIZONE' eMotorsports Platform Gains Prominence at TikTok GG Festival 2026","resumo":"The virtual motorsports platform UNIZONE will participate in the TikTok GG Festival 2026, bringing immersive attractions.\nThe event will offer visitors experiences with advanced iRacing simulators and practical mentoring sessions led by professional drivers.\nThe initiative aims to boost the popularity of eMotorsports and introduce new generations to automotive simulation technologies.","link":"https://news.yahoo.co.jp/articles/750c3f5f037ed3ede842305f3c7300e10cbdd657","categoria":"ESPORTS","lang":"en"},{"fonte":"newsdig.tbs.co.jp","pais":"Japan","titulo":"Digital Technology Course for High School Students Promotes Hands-On Practice with Drones and Video Streaming","resumo":"A \"Digital Fundamentals Course\" program was carried out with the goal of deepening high school students' technological knowledge.\nStudents actively participated in five practical modules that included piloting drones and handling live streaming tools.\nThe initiative encourages digital literacy among young talent and prepares the new generation for the technical demands of the tech market.","link":"https://newsdig.tbs.co.jp/articles/atv/2863631?display=1","categoria":"DIGITAL SKILLS","lang":"en"
