  // Injeta os dados originais no frontend
  const data = [{"fonte":"G1","pais":"Brasil","titulo":"IA cria vídeos históricos falsos cada vez mais convincentes; veja como identificá-los","resumo":"O avanço das ferramentas de inteligência artificial generativa está tornando cada vez mais difícil distinguir entre registros históricos reais e vídeos hiper-realistas criados por computador.\nEspecialistas alertam para o impacto dessa tecnologia na disseminação de desinformação e no apagamento da memória histórica.\nDiante desse cenário, surgem novas metodologias e técnicas de análise visual voltadas a identificar inconsistências em sombras, movimentos e detalhes de época para combater deepfakes.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/02/ia-cria-videos-historicos-falsos-cada-vez-mais-convincentes-veja-como-identifica-los.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Globo","pais":"Brasil","titulo":"Como foi o primeiro teste na vida real com internet quântica","resumo":"Pesquisadores realizaram o primeiro teste prático de redes de comunicação baseadas em física quântica em um ambiente do mundo real fora de laboratórios.\nA tecnologia utiliza o emaranhamento de partículas para garantir a transmissão de dados com um nível de segurança inviolável e processamento ultra-rápido.\nEsse avanço representa um marco histórico para o desenvolvimento da futura infraestrutura de internet global e promete revolucionar a cibersegurança nos próximos anos.","link":"https://revistagalileu.globo.com/google/amp/tecnologia/noticia/2026/08/como-foi-o-primeiro-teste-na-vida-real-com-internet-quantica.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Época Negócios","pais":"Brasil","titulo":"Astrônomos detectam possível primeira lua fora do Sistema Solar","resumo":"Uma equipe de astrônomos identificou sinais promissores que apontam para a descoberta da primeira exolua conhecida fora do nosso Sistema Solar.\nO corpo celeste foi observado orbitando um planeta gigante gasoso localizado a milhares de anos-luz de distância da Terra.\nSe confirmada por novas observações, essa descoberta abrirá um novo campo na astrofísica e mudará o entendimento científico sobre a formação e evolução de sistemas planetários distantes.","link":"https://epocanegocios.globo.com/google/amp/ciencia-e-saude/noticia/2026/08/astronomos-detectam-possivel-primeira-lua-fora-do-sistema-solar.ghtml","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Tecnologia vencedora do Nobel impulsiona projeto para transformar ar em água potável","resumo":"Um projeto inovador baseado em descobertas premiadas com o Nobel está utilizando materiais avançados para extrair umidade diretamente do ar e transformá-la em água potável.\nA solução promete funcionar de maneira eficiente mesmo em regiões áridas e de clima extremamente seco, oferecendo uma alternativa sustentável à escassez hídrica.\nA iniciativa visa fornecer acesso universal e de baixo custo a recursos hídricos para comunidades vulneráveis afetadas pelas mudanças climáticas.","link":"https://www1.folha.uol.com.br/mercado/2026/08/tecnologia-vencedora-do-nobel-impulsiona-projeto-para-transformar-ar-em-agua-potavel.shtml","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Bloomberg Línea Brasil","pais":"Brasil","titulo":"Além da razão: como a inteligência artificial pode intensificar a política das emoções","resumo":"O uso crescente de algoritmos de inteligência artificial em campanhas políticas e redes sociais está alterando o debate público ao direcionar conteúdos fortemente emotivos aos eleitores.\nEstudos mostram que sistemas automatizados conseguem mapear perfis psicológicos para amplificar narrativas de medo, indignação e pertencimento.\nO fenômeno traz sérias implicações para a democracia global, exigindo reflexões sobre regulação, ética no uso de dados e integridade dos processos eleitorais.","link":"https://www.bloomberglinea.com.br/2026/08/01/alem-da-razao-como-a-inteligencia-artificial-pode-intensificar-a-politica-das-emocoes/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Globo","pais":"Brasil","titulo":"Cientistas acompanham população de tubarões-martelo em Galápagos após 20 anos","resumo":"Após duas décadas de monitoramento contínuo nas Ilhas Galápagos, pesquisadores apresentaram dados inéditos sobre as rotas migratórias e hábitos da população de tubarões-martelo.\nO estudo revelou como a criação de áreas marinhas protegidas contribuiu para a preservação dessa espécie ameaçada de extinção diante da pesca ilegal.\nOs resultados fornecem subsídios científicos essenciais para apoiar novas políticas internacionais de conservação dos ecossistemas oceânicos.","link":"https://revistagalileu.globo.com/google/amp/ciencia/noticia/2026/08/cientistas-acompanham-populacao-de-tubaroes-martelo-em-galapagos-apos-20-anos.ghtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"TechTudo","pais":"Brasil","titulo":"Micro-ondas faz mal? Veja mitos e o que a ciência diz sobre","resumo":"Dúvidas sobre o impacto do forno micro-ondas na saúde e no valor nutricional dos alimentos continuam populares entre os consumidores.\nA ciência esclarece que o eletrodoméstico utiliza radiação não ionizante, incapaz de alterar o DNA humano ou transformar os alimentos em substâncias tóxicas.\nAlém disso, pesquisas indicam que cozinhar no micro-ondas preserva melhor certos nutrientes do que métodos tradicionais que utilizam água fervente.","link":"https://www.techtudo.com.br/noticias/2026/08/micro-ondas-faz-mal-veja-mitos-e-o-que-a-ciencia-diz-sobre-lb.ghtml","categoria":"CIÊNCIA E SAÚDE","lang":"pt"},{"fonte":"Portal Making Of","pais":"Brasil","titulo":"Dubai combate a fome com tecnologia e dignidade através de uma solução simples","resumo":"Dubai implementou um projeto inovador de combate à insegurança alimentar que utiliza dispensadores automáticos inteligentes de pão fresco para pessoas em situação de vulnerabilidade.\nA iniciativa conecta tecnologia de ponta a uma abordagem focada na dignidade humana, permitindo o acesso ao alimento sem necessidade de cadastro burocrático.\nA solução tem chamado a atenção internacional como um modelo eficiente de resposta comunitária amparado por automação e redes sociais.","link":"https://portalmakingof.com.br/dubai-combate-a-fome-com-tecnologia-e-dignidade-atraves-de-uma-solucao-simples/","categoria":"TECNOLOGIA SOCIAL","lang":"pt"},{"fonte":"AI News","pais":"Estados Unidos","titulo":"O boom de investimentos em IA nos EUA está reformulando a economia","resumo":"O massivo aporte de capital em inteligência artificial nos Estados Unidos está impulsionando setores que vão além da tecnologia, como energia e infraestrutura.\nEsse movimento gera novos empregos especializados e exige uma reestruturação da rede elétrica nacional para suportar os novos data centers.\nA longo prazo, a corrida pela liderança em IA pode redefinir os pilares da produtividade e do crescimento econômico americano.","link":"https://www.artificialintelligence-news.com/news/americas-ai-investment-boom-is-reshaping-the-economy/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"ScienceDaily","pais":"Estados Unidos","titulo":"Rover Curiosity da NASA descobre misteriosa paisagem em formato de favo de mel em Marte","resumo":"O rover Curiosity detectou formações geológicas peculiares que se assemelham a favos de mel no solo do planeta vermelho.\nCientistas da NASA investigam se essas estruturas foram moldadas pela erosão do vento ou por processos antigos envolvendo água evaporada.\nA descoberta oferece novas pistas valiosas sobre o histórico climático e a evolução da superfície de Marte ao longo de bilhões de anos.","link":"https://www.sciencedaily.com/releases/2026/07/260731034142.htm","categoria":"CIÊNCIA ESPACIAL","lang":"pt"},{"fonte":"Yahoo Finance","pais":"Estados Unidos","titulo":"DXC Technology faz parceria com ElevenLabs para levar IA de voz ao ambiente corporativo","resumo":"A DXC Technology anunciou uma colaboração estratégica com a ElevenLabs para integrar recursos avançados de voz sintética em sistemas empresariais.\nA iniciativa visa automatizar o atendimento ao cliente e aprimorar fluxos de trabalho operacionais com vozes ultra-realistas.\nA parceria reflete a crescente demanda por soluções de IA generativa capazes de otimizar a produtividade no setor corporativo.","link":"https://finance.yahoo.com/technology/ai/articles/dxc-technology-dxc-teams-elevenlabs-001943690.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"OpenAI","pais":"Estados Unidos","titulo":"Dez avanços em matemática e ciência da computação teórica","resumo":"Pesquisadores alcançaram avanços significativos em problemas complexos da matemática pura e do processamento teórico de dados.\nEssas descobertas abrem caminho para algoritmos de criptografia mais seguros e modelos computacionais infinitamente mais eficientes.\nO progresso nessa área fundamental é crucial para avanços em setores estratégicos como física quântica e inteligência artificial.","link":"https://openai.com/index/ten-advances-in-mathematics/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Politico","pais":"Estados Unidos","titulo":"Data centers enfrentam gargalos políticos e a indústria tenta reverter o cenário","resumo":"O avanço acelerado da IA exige um consumo expressivo de energia e espaço, gerando resistência de comunidades locais e legisladores contra novos data centers.\nDiante das preocupações com impacto ambiental e aumento nas tarifas de eletricidade, as empresas de tecnologia buscam mitigar conflitos regulatórios.\nA indústria agora investe em diplomacia e energia limpa para garantir a expansão sustentável dessas infraestruturas críticas.","link":"https://www.politico.com/news/2026/08/01/data-centers-have-a-politics-problem-and-industry-knows-it-01020412","categoria":"INFRAESTRUTURA","lang":"pt"},{"fonte":"Science et vie","pais":"Estados Unidos","titulo":"Do Mississippi à inteligência artificial: Louisiana se torna laboratório inesperado da nova economia americana","resumo":"A Louisiana vem se transformando em um polo emergente de tecnologia ao atrair grandes investimentos focados em inteligência artificial e data centers.\nA transição impulsiona a economia regional, historicamente dependente do setor de energia tradicional e da agricultura ao longo do rio Mississippi.\nEssa metamorfose posiciona o estado como um modelo imprevisível de adaptação às demandas da economia digital moderna.","link":"https://www.science-et-vie.com/technos-et-futur/du-mississippi-a-lintelligence-artificielle-la-louisiane-laboratoire-inattendu-de-la-nouvelle-economie-americaine-250895.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"simplywall.st","pais":"Estados Unidos","titulo":"Amkor Technology está barata após crescimento de lucros e parceria com a NVIDIA?","resumo":"A Amkor Technology registrou resultados financeiros expressivos impulsionados por sua aliança estratégica com a gigante dos chips NVIDIA.\nO mercado financeiro analisa se as ações da empresa continuam subavaliadas frente ao rápido crescimento na demanda por empacotamento avançado de semicondutores.\nEspecialistas apontam que o papel crucial da empresa na cadeia de suprimentos de IA torna seu futuro bastante promissor.","link":"https://simplywall.st/stocks/us/semiconductors/nasdaq-amkr/amkor-technology/news/is-amkor-technology-amkr-cheap-after-earnings-growth-and-its/amp","categoria":"MERCADO","lang":"pt"},{"fonte":"La Vanguardia","pais":"Estados Unidos","titulo":"A guerra de Donald Trump contra os programas científicos nos Estados Unidos","resumo":"Propostas de cortes orçamentários agressivos visam reduzir o financiamento governamental direcionado a programas de pesquisa e inovação nos EUA.\nA justificativa apresentada foca na eliminação de gastos rotulados como politizados ou ideológicos, gerando apreensão em universidades e institutos.\nA comunidade científica alerta que a redução desses investimentos pode comprometer a liderança tecnológica e a soberania científica do país.","link":"https://www.lavanguardia.com/neo/ciencia-neo/20260802/11601821/guerra-donald-trump-programas-ciencia-estados-unidos-acabando-gasto-woke-politizado.html","categoria":"POLÍTICA CIENTÍFICA","lang":"pt"},{"fonte":"jeuxvideo.com","pais":"França","titulo":"A França em 2100 será muito diferente da França de 2026: este mapa elaborado pela ciência dá o que pensar","resumo":"Um estudo científico mapeou as profundas transformações climáticas e geográficas que a França deve enfrentar até o ano de 2100. A projeção revela mudanças severas no clima, na biodiversidade e nos ecossistemas do país em comparação com a década atual. O mapa serve como um alerta urgente sobre os impactos do aquecimento global a longo prazo. Ele destaca a necessidade de políticas de mitigação e adaptação climática imediatas para o futuro do território francês.","link":"https://www.jeuxvideo.com/news/2096743/la-france-en-2100-sera-tres-differente-de-la-france-de-2026-cette-carte-etablie-par-la-science-fait-vraiment-reflechir.htm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Anadolu Ajansı","pais":"França","titulo":"UE impõe rotulagem de conteúdos gerados por IA a partir de 2 de agosto","resumo":"A União Europeia determinou que todo conteúdo criado ou manipulado por inteligência artificial deverá ser obrigatoriamente identificado a partir de 2 de agosto. A medida visa aumentar a transparência e combater a disseminação de desinformação e deepfakes na era digital. Plataformas e criadores terão que se adequar às novas exigências sob pena de sanções severas. A iniciativa marca um importante avanço na regulamentação da IA no bloco europeu.","link":"https://www.aa.com.tr/fr/science-et-technologie/lue-impose-l%C3%A9tiquetage-des-contenus-g%C3%A9n%C3%A9r%C3%A9s-par-lia-%C3%A0-partir-du-2-ao%C3%BBt/4016105","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Alzheimer: limitar o açúcar nos primeiros 1.000 dias de vida pode proteger o cérebro para sempre, revela estudo","resumo":"Uma nova pesquisa científica revelou que a restrição de consumo de açúcar nos primeiros mil dias de vida reduz significativamente o risco de Alzheimer na idade adulta. O estudo analisou os efeitos de longo prazo da nutrição infantil na saúde cognitiva e neurológica ao longo das décadas. Os achados reforçam a importância de diretrizes alimentares precoces para prevenir doenças neurodegenerativas. A descoberta abre caminho para novas estratégias de prevenção da saúde mental desde a infância.","link":"https://www.science-et-vie.com/cerveau-et-intelligence/alzheimer/alzheimer-limiter-le-sucre-durant-les-1-000-premiers-jours-de-vie-preserverait-votre-cerveau-a-vie-revele-une-etude-252696.html","categoria":"SAÚDE","lang":"pt"},{"fonte":"lejdd.fr","pais":"França","titulo":"EXCLUSIVO. Gabriel Attal: 'Proponho a maior reforma institucional desde 1958'","resumo":"O ex-primeiro-ministro francês Gabriel Attal apresentou uma proposta abrangente de reformulação do sistema político e governamental da França. A iniciativa busca alterar estruturas estatais profundas e modernizar o funcionamento das instituições do país. O plano promete reacender intensos debates no parlamento e na sociedade sobre governabilidade e representatividade. A proposta é apontada como a transformação institucional mais ambiciosa promovida no país em décadas.","link":"https://www.lejdd.fr/politique/exclusif-gabriel-attal-je-propose-la-plus-grande-reforme-institutionnelle-depuis-1958-180333","categoria":"POLÍTICA","lang":"pt"},{"fonte":"Ouest-France","pais":"França","titulo":"Golfinho, baleia, foca… Em Finistère, pela ciência, ele vai às praias onde mamíferos marinhos encalham","resumo":"Na região de Finistère, pesquisadores realizam um trabalho contínuo de monitoramento e análise de mamíferos marinhos encalhados nas praias. As investigações buscam compreender as causas de mortes de golfinhos e baleias, coletando dados vitais para a ciência. O esforço ajuda a mapear o impacto do ser humano, da pesca e do clima na biodiversidade marinha. As descobertas fornecem informações cruciais para políticas globais de conservação dos oceanos.","link":"https://www.ouest-france.fr/sciences/animaux/dauphin-rorqual-phoque-en-finistere-pour-la-science-il-se-rend-sur-les-plages-ou-sechouent-des-mammiferes-marins-6f70b8a4-8cd9-11f1-91ed-1c452045cb8b","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"The Telegraph","pais":"Inglaterra","titulo":"Trump desperdiçou a oportunidade perfeita para destruir a política de identidade","resumo":"O ex-presidente Donald Trump perdeu uma oportunidade estratégica decisiva para desmantelar a política de identidade nos Estados Unidos.\nEm vez de unificar o eleitorado com pautas universais, a manutenção de discursos polarizadores acabou reforçando divisões culturais profundas no cenário político.\nEssa postura pode alienar eleitores moderados essenciais e remodelar as futuras estratégias eleitorais no país.","link":"https://www.telegraph.co.uk/news/2026/08/02/trump-blown-perfect-chance-to-destroy-identity-politics/","categoria":"POLÍTICA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Planos de devolução reforçam a necessidade de uma constituição escrita no Reino Unido, diz Burnham","resumo":"O prefeito de Greater Manchester, Andy Burnham, defendeu que o avanço dos planos de devolução de poder reforça a urgência de uma constituição escrita para o Reino Unido.\nA descentralização das decisões governamentais expõe as fragilidades e ambiguidades do atual sistema constitucional não codificado.\nA proposta busca consolidar a autonomia regional, garantindo direitos claros e proteção jurídica permanente para governos locais.","link":"https://www.theguardian.com/politics/2026/aug/02/devolution-programme-written-uk-constitution-andy-burnham","categoria":"POLÍTICA","lang":"pt"},{"fonte":"La Razón","pais":"Espanha","titulo":"O telescópio James Webb encontra pistas de 'água pesada' na atmosfera de um exoplaneta distante","resumo":"O Telescópio Espacial James Webb detectou indícios de água pesada na atmosfera de um exoplaneta distante.\nA descoberta oferece novas pistas cruciais sobre como esses corpos celestes se formam e evoluem no universo.\nAlém disso, a análise detalhada das moléculas gasosas ajuda astrônomos a mapear a presença de água em sistemas distantes.\nEste avanço científico reforça o papel revolucionário do James Webb na exploração espacial moderna.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/telescopio-james-webb-halla-pistas-agua-pesada-atmosfera-exoplaneta-lejano_202608026a6c5a7b71b42a0b5dd14878.html","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"El Confidencial","pais":"Espanha","titulo":"O grande problema do VAR explicado pela ciência (e o que ensina às empresas que usam IA)","resumo":"Pesquisadores analisaram as falhas de percepção do VAR no futebol sob uma perspectiva científica e psicológica.\nO estudo revela como limitações humanas afetam a interpretação de dados visuais rápidos em tomadas de decisão.\nEssa análise oferece lições valiosas para empresas que estão implementando Inteligência Artificial em seus processos.\nO principal alerta é que a tecnologia precisa ser acompanhada por governança e compreensão dos viéses humanos.","link":"https://www.elconfidencial.com/tecnologia/novaceno/2026-08-02/gran-problema-var-explicado-por-la-ciencia_4398926/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Economía Digital","pais":"Espanha","titulo":"Iceye leva para a Noruega a tecnologia de satélite usada no governo valenciano para avaliar danos da DANA","resumo":"A empresa Iceye expandiu para a Noruega sua avançada tecnologia de monitoramento via satélite por radar.\nO sistema foi fundamental para o governo valenciano mapear com precisão os estragos causados pelo fenômeno DANA.\nA ferramenta permite capturar imagens em alta resolução mesmo sob nuvens densas ou durante a noite.\nA expansão consolida o uso de soluções espaciais no gerenciamento de crises e desastres naturais na Europa.","link":"https://www.economiadigital.es/valencia/empresas/iceye-lleva-noruega-tecnologia-satelital-uso-gobierno-valenciano-evaluar-danos-dana.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Objective","pais":"Espanha","titulo":"Ex-engenheiro da Fórmula 1 aplica tecnologia de corridas a drones militares","resumo":"Um antigo engenheiro da Fórmula 1 está adaptando técnicas aerodinâmicas de alta performance para drones militares.\nA aplicação desse conhecimento automotivo permite criar aeronaves não tripuladas mais ágeis, rápidas e eficientes.\nO projeto tem atraído forte interesse de investidores e do setor de defesa internacional.\nA iniciativa demonstra como a tecnologia das pistas de corrida pode revolucionar o setor de engenharia aeroespacial.","link":"https://theobjective.com/tecnologia/2026-08-02/exingeniero-formula-1-tecnologia-carreras-drones-militares/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The Objective","pais":"Espanha","titulo":"O maior mito sobre a fertilidade masculina acaba de cair: a ciência lança alerta para os homens","resumo":"Um novo estudo científico derrubou uma das crenças mais populares a respeito da fertilidade masculina.\nA pesquisa alerta que a idade e hábitos de vida influenciam drasticamente a qualidade genética dos espermatozoides.\nOs resultados desmontam a ideia de que a capacidade reprodutiva dos homens permanece inalterada com o tempo.\nEspecialistas reforçam a necessidade de conscientização sobre a saúde reprodutiva masculina em todas as idades.","link":"https://theobjective.com/lifestyle/2026-08-02/el-mayor-mito-sobre-la-fertilidad-masculina-acaba-de-caer-la-ciencia-lanza-la-advertencia-que-ningun-hombre-quiere-escuchar/?amp","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Estrategias de Inversión","pais":"Espanha","titulo":"A tecnologia continua sendo o setor mais forte do mercado: oportunidades apesar das quedas","resumo":"Apesar das flutuações e correções recentes, o setor de tecnologia mantém sua posição de liderança no mercado global.\nAnalistas apontam que momentos de queda representam oportunidades estratégicas para investidores focados no longo prazo.\nA contínua demanda por Inteligência Artificial e computação em nuvem sustenta o otimismo do mercado.\nEspecialistas recomendam atenção à diversificação dentro do ecossistema de inovação e tecnologia.","link":"https://www.estrategiasdeinversion.com/analisis/bolsa-y-mercados/informes/la-tecnologia-sigue-siendo-el-sector-mas-fuerte-n-940061","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"valenciaplaza.com","pais":"Espanha","titulo":"Laurie Anderson, a artista que previu nossa dependência da tecnologia","resumo":"A artista multimídia Laurie Anderson é destacada por sua visão pioneira sobre o impacto do avanço tecnológico.\nDécadas atrás, suas obras já antecipavam a forte dependência que a sociedade desenvolveria em relação aos dispositivos digitais.\nSua trajetória combina arte, música e reflexões profundas sobre a relação entre humanos e máquinas.\nO legado de Anderson permanece extremamente atual em meio às discussões contemporâneas sobre tecnologia e cultura.","link":"https://valenciaplaza.com/musica-opera-valencia-comunitat-valenciana/laurie-anderson-la-artista-que-predijo-nuestra-dependencia-de-la-tecnologia","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Xataka","pais":"Espanha","titulo":"A ciência explica: uma camiseta preta pode esquentar menos que uma branca (se você souber usar)","resumo":"A ciência da termodinâmica explica por que roupas pretas nem sempre esquentam mais do que as brancas no calor.\nO fator determinante envolve a combinação entre a cor do tecido, a circulação de vento e a emissão do calor corporal.\nSob certas condições de vento e caimento solto, o tecido escuro ajuda a dissipar o calor do corpo de forma mais eficiente.\nA descoberta desmistifica um conceito antigo sobre vestuário e transferência de calor no dia a dia.","link":"https://www.xataka.com/medicina-y-salud/ciencia-tiene-claro-camiseta-negra-te-puede-dar-calor-que-blanca-sabes-como-usarla","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ｄメニューニュース","pais":"Alemanha","titulo":"Novo Mercedes-AMG A 45 S \"Final Edition\" com mais de 420 cv é lançado na Alemanha","resumo":"A Mercedes-AMG apresentou na Alemanha a edição especial de despedida \"Final Edition\" para o hatch esportivo A 45 S. O modelo traz um motor turbo de 2.0 litros capaz de gerar mais de 420 cavalos de potência, aliado a um sistema de tração integral e equipamentos esportivos exclusivos. Esta versão comemorativa marca o ápice da linha, destacando-se pelo visual agressivo e acabamentos de alto padrão. O lançamento consolida o legado da marca no segmento de compactos de altíssimo desempenho no mercado europeu.","link":"https://topics.smt.docomo.ne.jp/amp/article/kurumanews/trend/kurumanews-1092161","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"AFPBB News","pais":"Japão","titulo":"Aumento de pedidos de eVTOL na Exposição Internacional de Economia de Baixa Altitude de Xangai; mercado deve ultrapassar 3,5 trilhões de yuans até 2035","resumo":"A Exposição Internacional de Economia de Baixa Altitude em Xangai destacou um forte interesse em aeronaves elétricas de decolagem e pouso vertical (eVTOL), gerando uma onda de novos pedidos.\nEspecialistas e relatórios do setor projetam que esse mercado em expansão alcance uma movimentação financeira superior a 3,5 trilhões de yuans até o ano de 2035.\nO avanço impulsiona soluções de mobilidade urbana aérea e consolida a tecnologia como um dos pilares da inovação na região.","link":"https://www.afpbb.com/articles/amp/3646173","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"映画.com","pais":"Japão","titulo":"O mundo muda pela forma como é retratado: a evolução da tecnologia visual e o realismo do remake de Moana","resumo":"Uma análise detalhada das produções visuais recentes destaca como os avanços na tecnologia de computação gráfica transformaram a experiência do cinema.\nA evolução dos efeitos de renderização e ambientes virtuais proporciona um nível de realismo impressionante que eleva a narrativa das obras.\nO artigo enfatiza como as inovações tecnológicas digitais continuam redefinindo os padrões de qualidade e imersão para grandes produções.","link":"https://eiga.com/movie/104003/review/06799145/","categoria":"ENTRETERIMENTO","lang":"pt"},{"fonte":"ｄメニューニュース","pais":"Japão","titulo":"Notícias sobre a contratação de Skubal pelo Dodgers surpreendem o jogador Yoshinobu Yamamoto","resumo":"Especulações recentes no beisebol internacional indicam que o Los Angeles Dodgers está articulando a contratação do arremessador de destaque Tarik Skubal.\nA repercussão do rumor gerou grande repercussão no meio esportivo e o arremessador japonês Yoshinobu Yamamoto declarou sua surpresa com a movimentação.\nA potencial transferência promete impactar o cenário competitivo da liga e atrair ainda mais atenção dos fãs do esporte.","link":"https://topics.smt.docomo.ne.jp/article/dailysports/sports/20260802069","categoria":"ESPORTES","lang":"pt"},{"fonte":"朝日新聞","pais":"Japão","titulo":"O fim do 'centro' político e a busca por um apoio focado e engajado para o futuro","resumo":"Um novo panorama analítico examina as transformações no ambiente político contemporâneo, marcado pelo enfraquecimento das posições de centro.\nDiante desse cenário, lideranças políticas no Japão buscam consolidar bases de apoio mais restritas, porém altamente engajadas e alinhadas ideologicamente.\nA estratégia visa garantir governabilidade e relevância em um ecossistema político cada vez mais fragmentado e desafiador.","link":"https://www.asahi.com/articles/ASV7Z2QY8V7ZUTFK02RM.html","categoria":"POLÍTICA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Previsão de Tufões: 'IA + Física' Soluciona a 'Caixa Preta' dos Modelos Climáticos","resumo":"A integração de inteligência artificial com modelos de física clássica está revolucionando as previsões meteorológicas de tufões na China.\nEssa abordagem híbrida permite superar as limitações da chamada \"caixa preta\" dos algoritmos puros de IA, trazendo maior transparência aos cálculos.\nCom isso, pesquisadores conseguem antecipar a trajetória e a intensidade de eventos extremos com precisão sem precedentes.\nO avanço representa um marco significativo para a ciência climática e para a mitigação de desastres naturais na região.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569216.shtm","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"The Guardian","pais":"China","titulo":"Avanços Tecnológicos da China Geram Impacto do Vale do Silício à Casa Branca","resumo":"A rápida aceleração tecnológica impulsionada pela China está redefinindo o cenário global de inovação e preocupando os EUA.\nSetores estratégicos como inteligência artificial, semicondutores e veículos elétricos mostram progresso em ritmo acelerado.\nEsse avanço tem gerado contínuos debates e ajustes estratégicos tanto em gigantes de tecnologia quanto em instâncias governamentais.\nA concorrência acirrada ressalta a disputa pela liderança da infraestrutura digital e da economia do futuro.","link":"https://www.theguardian.com/technology/2026/aug/01/china-silicon-valley-white-house","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"chshyd.in","pais":"China","titulo":"EUA Colocam 43 Empresas Chinesas em Lista Negra em Nova Ação Comercial e Tecnológica","resumo":"O governo dos Estados Unidos expandiu suas restrições comerciais ao incluir 43 novas empresas chinesas em sua lista de sanções.\nA medida visa limitar o acesso de companhias estratégicas da China a tecnologias sensíveis e componentes de ponta.\nA ação intensifica as tensões geopolíticas entre as duas maiores economias do mundo na corrida pela supremacia tecnológica.\nO movimento reflete o aumento do controle sobre cadeias de suprimentos globais e transferência de conhecimento.","link":"https://chshyd.in/breaking/us-blacklists-43-chinese-firms/","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"motoringworld.in","pais":"China","titulo":"Conheça o SSCC SC01: O Esportivo Elétrico Chinês Ultraleve de 429 cv Focado no Motorista","resumo":"O mercado automotivo chinês ganha um novo destaque com a chegada do SSCC SC01, um esportivo totalmente elétrico.\nDesenvolvido para priorizar a experiência e a dirigibilidade, o veículo entrega 429 cavalos de potência máxima.\nO projeto se diferencia da tendência de carros elétricos pesados ao focar na redução de peso e na agilidade.\nEssa inovação demonstra a expansão da indústria automobilística da China no segmento de alta performance.","link":"https://motoringworld.in/car-news/meet-the-sscc-sc01-a-lightweight-chinese-electric-sports-car-with-429-bhp-built-for-driver-satisfaction/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"中国网","pais":"China","titulo":"Tecnologias VR e AR Transformam o Turismo Cultural e Museus Durante o Verão","resumo":"A aplicação de realidade virtual e aumentada está renovando a forma como o público interage com o patrimônio cultural.\nEm museus da China, essas ferramentas imersivas oferecem aos visitantes passeios interativos altamente tecnológicos.\nA iniciativa une entretenimento e educação digital, atraindo gerações mais jovens para a preservação histórica.\nO uso prático dessas tecnologias consolida novas tendências na economia digital e no setor de turismo.","link":"http://www.china.com.cn/txt/2026-08/02/content_118629699.shtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"证券之星","pais":"China","titulo":"Visionox Apresenta Telas de Alta Tecnologia ViP e Proteção Ocular na ChinaJoy 2026","resumo":"A fabricante Visionox apresentou suas mais recentes inovações em displays durante o evento ChinaJoy 2026.\nEntre os destaques estão a tecnologia avançada de telas ViP e painéis projetados para reduzir o cansaço visual.\nEssas soluções prometem revolucionar a indústria de smartphones, dispositivos vestíveis e telas para jogos.\nA novidade reforça a posição da China no desenvolvimento de componentes eletrônicos de última geração.","link":"https://wap.stockstar.com/detail/IG2026080200005252","categoria":"HARDWARE","lang":"pt"},{"fonte":"新华网","pais":"China","titulo":"Harbin Investe em Tecnologia para Transformar o Setor de Fabricação de Equipamentos","resumo":"A cidade chinesa de Harbin iniciou um plano de investimentos focado em modernizar sua indústria de manufatura pesada.\nO projeto utiliza automação industrial, inteligência artificial e digitalização para elevar a produtividade fabril.\nA iniciativa busca posicionar a região como um polo de manufatura avançada e de alto valor agregado.\nO esforço reflete a estratégia nacional da China de atualizar a infraestrutura de sua indústria de base.","link":"http://portuguese.xinhuanet.com/20260802/ea117da475334606946a309f81a178fd/c.html","categoria":"INDÚSTRIA","lang":"pt"},{"fonte":"北京大学新闻网","pais":"China","titulo":"Revista 'National Material Science' é Lançada na Conferência de Inovação de Bajiaowan 2026","resumo":"Durante a Conferência de Inovação de Bajiaowan 2026, foi lançada a publicação científica \"National Material Science\".\nO periódico impresso em inglês visa divulgar descobertas de ponta na área de engenharia de materiais e física aplicada.\nA iniciativa fortalece a presença da comunidade científica chinesa nos debates e publicações de alcance global.\nO lançamento impulsiona a colaboração internacional e o avanço de pesquisas em materiais avançados.","link":"https://news.pku.edu.cn/xwzh/866946b76c494b6ab7d544ce503cd464.htm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"DD India","pais":"Índia","titulo":"Hackathon de Tecelagem Manual 2.0 é Concluído no IIT Delhi com Foco em Inovação","resumo":"O evento Handloom Hackathon 2.0, realizado no prestigiado IIT Delhi, reuniu estudantes e especialistas para desenvolver soluções tecnológicas voltadas ao setor têxtil tradicional da Índia.\nAs propostas apresentadas visam modernizar o trabalho dos artesãos locais, aumentando a eficiência do processo produtivo sem perder a essência cultural da produção manual.\nA iniciativa destaca o papel crucial da ciência e da tecnologia na revitalização de indústrias tradicionais e na promoção do desenvolvimento sustentável no país.","link":"https://ddindia.co.in/2026/08/handloom-hackathon-2-0-concludes-at-iit-delhi-showcases-technology-driven-innovations-for-indias-handloom-sector/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The New Indian Express","pais":"Índia","titulo":"Jovens Diplomatas Devem Unir Tecnologia e Sensibilidade contra a Crise Climática","resumo":"O ministro do Meio Ambiente da Índia, Bhupender Yadav, destacou que novos oficiais do Serviço Florestal Indiano precisam integrar inovações tecnológicas e empatia humana no combate às mudanças climáticas.\nA orientação reforça a necessidade de aplicar ferramentas de ponta, como inteligência artificial e geoprocessamento, para proteger a biodiversidade e gerir recursos naturais com eficácia.\nA medida busca capacitar a nova geração de líderes ambientais a enfrentar desafios socioambientais complexos no cenário global contemporâneo.","link":"https://www.newindianexpress.com/india/2026/Aug/01/young-ifs-officers-must-combine-technology-with-human-sensitivity-to-tackle-climate-crisis-bhupender-yadav","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"newsonair.gov.in","pais":"Índia","titulo":"PM Modi Atribui o Avanço da Índia em Ciência e Tecnologia à Juventude","resumo":"O Primeiro-Ministro Narendra Modi elogiou a contribuição da juventude indiana no rápido avanço do país em setores estratégicos como ciência, tecnologia e esportes.\nDurante seu discurso, Modi enfatizou que a mentalidade inovadora e o talento dos jovens estão impulsionando o ecossistema de startups e a pesquisa científica nacional.\nEsse engajamento é apontado como o motor principal para consolidar a Índia como uma potência global emergente no cenário tecnológico e científico.","link":"https://newsonair.gov.in/pm-modi-credits-youth-for-indias-progress-in-science-technology-and-sports/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Equitymaster","pais":"Índia","titulo":"Prós e Contras de Investir na Kaynes Technology","resumo":"A Kaynes Technology, uma das principais empresas do setor de fabricação de eletrônicos da Índia, continua chamando a atenção de investidores do mercado financeiro.\nEspecialistas analisam os pontos fortes da empresa, como sua forte expansão na produção de semicondutores e dispositivos eletrônicos, frente aos riscos de mercado e avaliação de ações.\nA trajetória da companhia reflete o crescimento acelerado da indústria tecnológica indiana e os desafios de manter a competitividade global.","link":"http://www.equitymaster.com/detail.asp?date=8/2/2026\u0026story=3","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"The Indian Express","pais":"Índia","titulo":"Análise do Skullcandy Method 360 ANC: Vale a Pena?","resumo":"A análise detalhada dos novos fones de ouvido Skullcandy Method 360 ANC avalia o desempenho do cancelamento ativo de ruído e a qualidade sonora do dispositivo.\nO review destaca como a fabricante busca equilibrar recursos avançados de áudio com um preço acessível para atender tanto consumidores jovens quanto usuários mais exigentes.\nO lançamento evidencia as tendências de consumo no mercado de vestíveis de áudio e a competição acirrada no segmento de eletrônicos pessoais.","link":"https://indianexpress.com/article/technology/tech-reviews/skullcandy-method-360-anc-review-price-features-bose-sound-10814443/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Statesman","pais":"Índia","titulo":"Kerala Lidera os Avanços da Ayurveda na Medicina Esportiva","resumo":"O estado de Kerala vem se destacando no cenário científico ao aplicar práticas tradicionais da medicina Ayurveda no tratamento e recuperação de atletas de alto rendimento.\nPesquisas e tratamentos integrativos combinam terapias naturais a protocolos modernos de medicina esportiva, visando reduzir o tempo de reabilitação de lesões.\nEsse movimento fortalece o reconhecimento internacional da medicina tradicional indiana aliada à inovação e à saúde no esporte contemporâneo.","link":"https://www.thestatesman.com/supplements/8thday/kerala-leads-ayurvedas-recent-strides-in-sports-medicine-1503623375.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Hindustan Times","pais":"Índia","titulo":"Gestão de Multidões em Mathura-Vrindavan Falha em Critérios Científicos, Afirma Tribunal","resumo":"O High Court de Allahabad observou que os métodos atuais de gestão de multidões nos locais sagrados de Mathura-Vrindavan carecem de planejamento fundamentado em ciência.\nA corte ressaltou a urgência de implementar dados de fluxo de pedestres, modelagem computacional e engenharia de tráfego para evitar acidentes e tumultos graves.\nA decisão pressiona as autoridades a adotarem tecnologias de monitoramento e análise de dados para garantir a segurança de milhões de peregrinos.","link":"https://www.hindustantimes.com/cities/lucknow-news/mathuravrindavan-crowd-management-not-based-on-science-observes-allahabad-hc-101785613470767.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"news18.com","pais":"Índia","titulo":"Gulveer Singh Faz História e Se Torna o Primeiro Atleta Indiano a Alcançar Feito Inédito","resumo":"O atleta indiano Gulveer Singh alcançou um feito histórico nas pistas de atletismo, tornando-se uma figura de destaque nacional e inspiração no esporte de alta performance.\nA conquista inédita projeta o esporte indiano em competições internacionais e reforça o investimento crescente em infraestrutura para atletas de alto nível no país.\nO resultado gerou grande repercussão nas redes sociais e na imprensa, marcando um momento memorável para o atletismo e para a trajetória do atleta.","link":"https://www.news18.com/sports/other-sports/gulveer-singh-creates-history-becomes-the-first-indian-athlete-to-2-ws-l-10247293.html","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Público","pais":"Portugal","titulo":"Portugal atinge novo recorde de gastos em ciência, mas segue longe da meta de 3%","resumo":"Portugal registrou um novo recorde nos investimentos destinados ao setor de ciência e inovação, refletindo o fortalecimento do ecossistema de pesquisa no país.\nApesar do avanço expressivo nos valores aplicados, o país ainda se encontra distante da meta estipulada de atingir 3% do PIB em despesas para a área.\nO cenário atual destaca os desafios contínuos do governo e das instituições para manter a competitividade científica na Europa.","link":"https://www.publico.pt/2026/08/02/ciencia/noticia/portugal-atinge-novo-maximo-despesa-ciencia-longe-meta-3-2183534","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"PressReader","pais":"Portugal","titulo":"Ciência Viva comemora 30 anos de incentivo à cultura científica em Portugal","resumo":"A agência nacional Ciência Viva celebra três décadas de atuação dedicada à promoção e popularização da cultura científica e tecnológica em Portugal.\nAo longo desse período, a instituição desempenhou um papel fundamental em aproximar a população dos avanços científicos por meio de centros interativos.\nAs comemorações reforçam a importância de engajar as novas gerações e fortalecer o conhecimento nas escolas e na sociedade.","link":"https://www.pressreader.com/portugal/domingo9waj/20260802/281883010143091","categoria":"CULTURA CIENTÍFICA","lang":"pt"},{"fonte":"Rádio Altitude","pais":"Portugal","titulo":"Ciência Viva distribui óculos gratuitos para observação segura do eclipse solar","resumo":"Com a proximidade de um fenômeno astronômico relevante, a rede Ciência Viva anunciou a distribuição gratuita de óculos especiais para a população em Portugal.\nA iniciativa visa garantir que cidadãos e estudantes possam acompanhar o evento sem riscos à saúde ocular, promovendo o interesse pela astronomia.\nDiversos centros científicos espalhados pelo país funcionarão como pontos de entrega e locais de atividades educativas associadas.","link":"https://www.altitude.fm/actualidade/ciencia-viva-oferece-oculos-para-ver-o-eclipse-solar-gratuitamente/","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Meteored Portugal","pais":"Portugal","titulo":"Ciência comprova a prática ritual contínua mais antiga do mundo em caverna na Austrália","resumo":"Pesquisadores confirmaram que evidências encontradas em uma caverna australiana representam a tradição ritualística contínua mais antiga já registrada no planeta.\nOs achados arqueológicos remontam a dezenas de milhares de anos e demonstram a transmissão ininterrupta de costumes culturais ao longo de gerações.\nO estudo traz novas revelações sobre a evolução do comportamento humano, o simbolismo cultural e a preservação de memórias ancestrais.","link":"https://www.tempo.pt/noticias/ciencia/ciencia-prova-a-existencia-da-pratica-ritual-continua-mais-antiga-do-mundo-em-caverna-australiana.html","categoria":"DESCOBERTA","lang":"pt"},{"fonte":"G1","pais":"Brazil","titulo":"AI is creating increasingly convincing fake historical videos; see how to spot them","resumo":"The advancement of generative artificial intelligence tools is making it increasingly difficult to distinguish between real historical records and hyper-realistic computer-generated videos.\nExperts warn of the impact of this technology on the spread of misinformation and the erasure of historical memory.\nFaced with this scenario, new methodologies and visual analysis techniques are emerging aimed at identifying inconsistencies in shadows, movements, and period details to combat deepfakes.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/02/ia-cria-videos-historicos-falsos-cada-vez-mais-convincentes-veja-como-identifica-los.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Globo","pais":"Brazil","titulo":"How the first real-world test with quantum internet went","resumo":"Researchers have conducted the first practical test of communication networks based on quantum physics in a real-world environment outside of laboratories.\nThe technology uses particle entanglement to guarantee data transmission with an inviolable level of security and ultra-fast processing.\nThis breakthrough represents a historic milestone for the development of future global internet infrastructure and promises to revolutionize cybersecurity in the coming years.","link":"https://revistagalileu.globo.com/google/amp/tecnologia/noticia/2026/08/como-foi-o-primeiro-teste-na-vida-real-com-internet-quantica.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Época Negócios","pais":"Brazil","titulo":"Astronomers detect possible first moon outside the Solar System","resumo":"A team of astronomers has identified promising signals pointing to the discovery of the first known exoon outside our Solar System.\nThe celestial body was observed orbiting a gas giant planet located thousands of light-years away from Earth.\nIf confirmed by further observations, this discovery will open a new field in astrophysics and change our scientific understanding of the formation and evolution of distant planetary systems.","link":"https://epocanegocios.globo.com/google/amp/ciencia-e-saude/noticia/2026/08/astronomos-detectam-possivel-primeira-lua-fora-do-sistema-solar.ghtml","categoria":"ASTRONOMY","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"Nobel-winning technology boosts project to turn air into drinking water","resumo":"An innovative project based on Nobel-winning discoveries is utilizing advanced materials to extract moisture directly from the air and turn it into drinking water.\nThe solution promises to work efficiently even in arid and extremely dry climates, offering a sustainable alternative to water scarcity.\nThe initiative aims to provide universal and low-cost access to water resources for vulnerable communities affected by climate change.","link":"https://www1.folha.uol.com.br/mercado/2026/08/tecnologia-vencedora-do-nobel-impulsiona-projeto-para-transformar-ar-em-agua-potavel.shtml","categoria":"INNOVATION","lang":"en"},{"fonte":"Bloomberg Línea Brasil","pais":"Brazil","titulo":"Beyond reason: how artificial intelligence can intensify the politics of emotion","resumo":"The growing use of artificial intelligence algorithms in political campaigns and social media is altering public debate by targeting voters with highly emotional content.\nStudies show that automated systems are able to map psychological profiles to amplify narratives of fear, outrage, and belonging.\nThe phenomenon carries serious implications for global democracy, demanding reflection on regulation, ethics in data use, and the integrity of electoral processes.","link":"https://www.bloomberglinea.com.br/2026/08/01/alem-da-razao-como-a-inteligencia-artificial-pode-intensificar-a-politica-das-emocoes/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Globo","pais":"Brazil","titulo":"Scientists monitor hammerhead shark population in Galapagos after 20 years","resumo":"After two decades of continuous monitoring in the Galapagos Islands, researchers have presented unprecedented data on the migratory routes and habits of the hammerhead shark population.\nThe study revealed how the creation of marine protected areas has contributed to the preservation of this endangered species in the face of illegal fishing.\nThe results provide essential scientific backing to support new international conservation policies for ocean ecosystems.","link":"https://revistagalileu.globo.com/google/amp/ciencia/noticia/2026/08/cientistas-acompanham-populacao-de-tubaroes-martelo-em-galapagos-apos-20-anos.ghtml","categoria":"SCIENCE","lang":"en"},{"fonte":"TechTudo","pais":"Brazil","titulo":"Are microwaves bad for you? See myths and what science says","resumo":"Doubts regarding the impact of microwave ovens on health and the nutritional value of food remain popular among consumers.\nScience clarifies that the appliance uses non-ionizing radiation, which is incapable of altering human DNA or turning food into toxic substances.\nFurthermore, research indicates that cooking in the microwave preserves certain nutrients better than traditional methods using boiling water.","link":"https://www.techtudo.com.br/noticias/2026/08/micro-ondas-faz-mal-veja-mitos-e-o-que-a-ciencia-diz-sobre-lb.ghtml","categoria":"SCIENCE AND HEALTH","lang":"en"},{"fonte":"Portal Making Of","pais":"Brazil","titulo":"Dubai combats hunger with technology and dignity through a simple solution","resumo":"Dubai has implemented an innovative project to combat food insecurity using smart automated fresh bread dispensers for vulnerable individuals.\nThe initiative connects cutting-edge technology with an approach focused on human dignity, allowing access to food without the need for bureaucratic registration.\nThe solution has drawn international attention as an efficient model of community response supported by automation and social media.","link":"https://portalmakingof.com.br/dubai-combate-a-fome-com-tecnologia-e-dignidade-atraves-de-uma-solucao-simples/","categoria":"SOCIAL TECHNOLOGY","lang":"en"},{"fonte":"AI News","pais":"United States","titulo":"The US AI investment boom is reshaping the economy","resumo":"The massive influx of capital into artificial intelligence in the United States is driving sectors that go beyond technology, such as energy and infrastructure.\nThis movement is creating new specialized jobs and requiring a restructuring of the national power grid to support new data centers.\nLong term, the race for AI leadership could redefine the pillars of American productivity and economic growth.","link":"https://www.artificialintelligence-news.com/news/americas-ai-investment-boom-is-reshaping-the-economy/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"ScienceDaily","pais":"United States","titulo":"NASA's Curiosity rover discovers mysterious honeycomb-shaped landscape on Mars","resumo":"The Curiosity rover has detected peculiar geological formations resembling honeycombs on the surface of the red planet.\nNASA scientists are investigating whether these structures were shaped by wind erosion or ancient processes involving evaporated water.\nThe discovery offers valuable new clues about the climate history and surface evolution of Mars over billions of years.","link":"https://www.sciencedaily.com/releases/2026/07/260731034142.htm","categoria":"SPACE SCIENCE","lang":"en"},{"fonte":"Yahoo Finance","pais":"United States","titulo":"DXC Technology partners with ElevenLabs to bring voice AI to the corporate environment","resumo":"DXC Technology has announced a strategic collaboration with ElevenLabs to integrate advanced synthetic voice capabilities into enterprise systems.\nThe initiative aims to automate customer service and enhance operational workflows with ultra-realistic voices.\nThe partnership reflects the growing demand for generative AI solutions capable of optimizing productivity in the corporate sector.","link":"https://finance.yahoo.com/technology/ai/articles/dxc-technology-dxc-teams-elevenlabs-001943690.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"OpenAI","pais":"United States","titulo":"Ten advances in mathematics and theoretical computer science","resumo":"Researchers have achieved significant breakthroughs in complex problems of pure mathematics and theoretical data processing.\nThese discoveries pave the way for more secure encryption algorithms and infinitely more efficient computational models.\nProgress in this foundational area is crucial for advancements in strategic sectors like quantum physics and artificial intelligence.","link":"https://openai.com/index/ten-advances-in-mathematics/","categoria":"SCIENCE","lang":"en"},{"fonte":"Politico","pais":"United States","titulo":"Data centers face political bottlenecks, and the industry is trying to reverse the trend","resumo":"The rapid advancement of AI demands significant energy consumption and space, generating pushback from local communities and lawmakers against new data centers.\nAmid concerns over environmental impact and rising electricity rates, tech companies are seeking to mitigate regulatory conflicts.\nThe industry is now investing in diplomacy and clean energy to secure the sustainable expansion of these critical infrastructures.","link":"https://www.politico.com/news/2026/08/01/data-centers-have-a-politics-problem-and-industry-knows-it-01020412","categoria":"INFRASTRUCTURE","lang":"en"},{"fonte":"Science et vie","pais":"United States","titulo":"From Mississippi to artificial intelligence: Louisiana becomes an unexpected lab for the new American economy","resumo":"Louisiana is transforming into an emerging tech hub by attracting major investments focused on artificial intelligence and data centers.\nThe transition is boosting the regional economy, which has historically depended on the traditional energy sector and agriculture along the Mississippi River.\nThis metamorphosis positions the state as an unpredictable model for adapting to the demands of the modern digital economy.","link":"https://www.science-et-vie.com/technos-et-futur/du-mississippi-a-lintelligence-artificielle-la-louisiane-laboratoire-inattendu-de-la-nouvelle-economie-americaine-250895.html","categoria":"INNOVATION","lang":"en"},{"fonte":"simplywall.st","pais":"United States","titulo":"Is Amkor Technology cheap after earnings growth and its NVIDIA partnership?","resumo":"Amkor Technology has posted strong financial results driven by its strategic alliance with chip giant NVIDIA.\nThe financial market is analyzing whether the company's stock remains undervalued in the face of rapidly growing demand for advanced semiconductor packaging.\nExperts point out that the company's crucial role in the AI supply chain makes its future quite promising.","link":"https://simplywall.st/stocks/us/semiconductors/nasdaq-amkr/amkor-technology/news/is-amkor-technology-amkr-cheap-after-earnings-growth-and-its/amp","categoria":"MARKET","lang":"en"},{"fonte":"La Vanguardia","pais":"United States","titulo":"Donald Trump's war on scientific programs in the United States","resumo":"Aggressive budget cut proposals aim to reduce government funding directed toward research and innovation programs in the U.S.\nThe justification presented focuses on eliminating spending labeled as politicized or ideological, generating apprehension among universities and institutes.\nThe scientific community warns that reducing these investments could compromise the country's technological leadership and scientific sovereignty.","link":"https://www.lavanguardia.com/neo/ciencia-neo/20260802/11601821/guerra-donald-trump-programas-ciencia-estados-unidos-acabando-gasto-woke-politizado.html","categoria":"SCIENCE POLICY","lang":"en"},{"fonte":"jeuxvideo.com","pais":"France","titulo":"France in 2100 will look very different from the France of 2026: this map drawn by science gives food for thought","resumo":"A scientific study has mapped the profound climatic and geographic transformations that France is expected to face by the year 2100. The projection reveals severe changes in the country's climate, biodiversity, and ecosystems compared to the current decade. The map serves as an urgent wake-up call regarding the long-term impacts of global warming. It highlights the need for immediate climate adaptation and mitigation policies for the future of French territory.","link":"https://www.jeuxvideo.com/news/2096743/la-france-en-2100-sera-tres-differente-de-la-france-de-2026-cette-carte-etablie-par-la-science-fait-vraiment-reflechir.htm","categoria":"SCIENCE","lang":"en"},{"fonte":"Anadolu Ajansı","pais":"France","titulo":"EU enforces labeling of AI-generated content starting August 2","resumo":"The European Union has mandated that all content created or manipulated by artificial intelligence must be clearly identified starting August 2. The measure aims to increase transparency and combat the spread of misinformation and deepfakes in the digital era. Platforms and creators will have to comply with the new requirements under penalty of severe sanctions. The initiative marks a major step forward in regulating AI within the European bloc.","link":"https://www.aa.com.tr/fr/science-et-technologie/lue-impose-l%C3%A9tiquetage-des-contenus-g%C3%A9n%C3%A9r%C3%A9s-par-lia-%C3%A0-partir-du-2-ao%C3%BBt/4016105","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Science et vie","pais":"France","titulo":"Alzheimer's: limiting sugar in the first 1,000 days of life may protect the brain for life, study reveals","resumo":"New scientific research has revealed that restricting sugar consumption during the first thousand days of life significantly reduces the risk of Alzheimer's in adulthood. The study analyzed the long-term effects of infant nutrition on cognitive and neurological health over decades. The findings reinforce the importance of early dietary guidelines to prevent neurodegenerative diseases. The discovery paves the way for new mental health prevention strategies starting from infancy.","link":"https://www.science-et-vie.com/cerveau-et-intelligence/alzheimer/alzheimer-limiter-le-sucre-durant-les-1-000-premiers-jours-de-vie-preserverait-votre-cerveau-a-vie-revele-une-etude-252696.html","categoria":"HEALTH","lang":"en"},{"fonte":"lejdd.fr","pais":"France","titulo":"EXCLUSIVE. Gabriel Attal: 'I am proposing the greatest institutional reform since 1958'","resumo":"Former French Prime Minister Gabriel Attal has presented a comprehensive proposal to overhaul France's political and governmental system. The initiative seeks to alter deep-seated state structures and modernize the functioning of the country's institutions. The plan promises to reignite intense debates in parliament and society regarding governability and representativeness. The proposal is touted as the most ambitious institutional transformation promoted in the country in decades.","link":"https://www.lejdd.fr/politique/exclusif-gabriel-attal-je-propose-la-plus-grande-reforme-institutionnelle-depuis-1958-180333","categoria":"POLITICS","lang":"en"},{"fonte":"Ouest-France","pais":"France","titulo":"Dolphin, whale, seal… In Finistère, for the sake of science, he visits the beaches where marine mammals strand","resumo":"In the Finistère region, researchers carry out ongoing monitoring and analysis of stranded marine mammals on beaches. The investigations seek to understand the causes of death for dolphins and whales, collecting vital data for science. The effort helps map the impact of human activity, fishing, and climate on marine biodiversity. The findings provide crucial information for global ocean conservation policies.","link":"https://www.ouest-france.fr/sciences/animaux/dauphin-rorqual-phoque-en-finistere-pour-la-science-il-se-rend-sur-les-plages-ou-sechouent-des-mammiferes-marins-6f70b8a4-8cd9-11f1-91ed-1c452045cb8b","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"The Telegraph","pais":"England","titulo":"Trump blew the perfect chance to destroy identity politics","resumo":"Former President Donald Trump missed a decisive strategic opportunity to dismantle identity politics in the United States.\nInstead of unifying the electorate with universal platforms, maintaining polarizing rhetoric ultimately reinforced deep cultural divisions in the political landscape.\nThis stance could alienate essential moderate voters and reshape future electoral strategies in the country.","link":"https://www.telegraph.co.uk/news/2026/08/02/trump-blown-perfect-chance-to-destroy-identity-politics/","categoria":"POLITICS","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Devolution plans reinforce the need for a written UK constitution, says Burnham","resumo":"Greater Manchester Mayor Andy Burnham has argued that the advancement of power devolution plans highlights the urgency of a written constitution for the UK.\nThe decentralization of governmental decisions exposes the fragilities and ambiguities of the current uncodified constitutional system.\nThe proposal seeks to consolidate regional autonomy, guaranteeing clear rights and permanent legal protection for local governments.","link":"https://www.theguardian.com/politics/2026/aug/02/devolution-programme-written-uk-constitution-andy-burnham","categoria":"POLITICS","lang":"en"},{"fonte":"La Razón","pais":"Spain","titulo":"James Webb telescope finds clues of 'heavy water' in the atmosphere of a distant exoplanet","resumo":"The James Webb Space Telescope has detected indications of heavy water in the atmosphere of a distant exoplanet.\nThe discovery offers crucial new clues about how these celestial bodies form and evolve in the universe.\nFurthermore, detailed analysis of gaseous molecules helps astronomers map the presence of water in distant systems.\nThis scientific breakthrough reinforces the James Webb's revolutionary role in modern space exploration.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/telescopio-james-webb-halla-pistas-agua-pesada-atmosfera-exoplaneta-lejano_202608026a6c5a7b71b42a0b5dd14878.html","categoria":"ASTRONOMY","lang":"en"},{"fonte":"El Confidencial","pais":"Spain","titulo":"The big problem with VAR explained by science (and what it teaches companies using AI)","resumo":"Researchers analyzed VAR's perception failures in soccer from a scientific and psychological perspective.\nThe study reveals how human limitations affect the interpretation of rapid visual data during decision-making.\nThis analysis offers valuable lessons for companies implementing Artificial Intelligence in their processes.\nThe primary warning is that technology must be accompanied by governance and an understanding of human biases.","link":"https://www.elconfidencial.com/tecnologia/novaceno/2026-08-02/gran-problema-var-explicado-por-la-ciencia_4398926/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Economía Digital","pais":"Spain","titulo":"Iceye brings satellite technology used by the Valencian government to assess DANA damage to Norway","resumo":"Iceye has expanded its advanced radar satellite monitoring technology to Norway.\nThe system was instrumental for the Valencian government in accurately mapping the devastation caused by the DANA weather phenomenon.\nThe tool allows for high-resolution imaging even under heavy cloud cover or at night.\nThe expansion consolidates the use of space-based solutions in crisis management and natural disaster response across Europe.","link":"https://www.economiadigital.es/valencia/empresas/iceye-lleva-noruega-tecnologia-satelital-uso-gobierno-valenciano-evaluar-danos-dana.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Objective","pais":"Spain","titulo":"Former Formula 1 engineer applies racing technology to military drones","resumo":"A former Formula 1 engineer is adapting high-performance aerodynamic techniques for military drones.\nApplying this automotive knowledge allows for the creation of faster, more agile, and more efficient unmanned aircraft.\nThe project has attracted strong interest from investors and the international defense sector.\nThe initiative demonstrates how racetrack technology can revolutionize the aerospace engineering sector.","link":"https://theobjective.com/tecnologia/2026-08-02/exingeniero-formula-1-tecnologia-carreras-drones-militares/","categoria":"INNOVATION","lang":"en"},{"fonte":"The Objective","pais":"Spain","titulo":"The biggest myth about male fertility has just been debunked: science issues a warning to men","resumo":"A new scientific study has shattered one of the most popular beliefs regarding male fertility.\nThe research warns that age and lifestyle habits drastically influence the genetic quality of sperm.\nThe findings dismantle the notion that men's reproductive capacity remains unchanged over time.\nExperts reinforce the need for awareness regarding male reproductive health at all ages.","link":"https://theobjective.com/lifestyle/2026-08-02/el-mayor-mito-sobre-la-fertilidad-masculina-acaba-de-caer-la-ciencia-lanza-la-advertencia-que-ningun-hombre-quiere-escuchar/?amp","categoria":"SCIENCE","lang":"en"},{"fonte":"Estrategias de Inversión","pais":"Spain","titulo":"Technology remains the market's strongest sector: opportunities despite downturns","resumo":"Despite recent market fluctuations and corrections, the technology sector maintains its leading position in the global market.\nAnalysts point out that periods of decline represent strategic opportunities for long-term focused investors.\nContinued demand for Artificial Intelligence and cloud computing sustains market optimism.\nExperts recommend paying close attention to diversification within the innovation and technology ecosystem.","link":"https://www.estrategiasdeinversion.com/analisis/bolsa-y-mercados/informes/la-tecnologia-sigue-siendo-el-sector-mas-fuerte-n-940061","categoria":"BUSINESS","lang":"en"},{"fonte":"valenciaplaza.com","pais":"Spain","titulo":"Laurie Anderson, the artist who predicted our dependence on technology","resumo":"Multimedia artist Laurie Anderson is highlighted for her pioneering vision regarding the impact of technological advancement.\nDecades ago, her works anticipated the heavy dependence that society would develop on digital devices.\nHer career combines art, music, and profound reflections on the relationship between humans and machines.\nAnderson's legacy remains extremely relevant amid contemporary discussions on technology and culture.","link":"https://valenciaplaza.com/musica-opera-valencia-comunitat-valenciana/laurie-anderson-la-artista-que-predijo-nuestra-dependencia-de-la-tecnologia","categoria":"TRENDS","lang":"en"},{"fonte":"Xataka","pais":"Spain","titulo":"Science explains: a black t-shirt can actually keep you cooler than a white one (if you know how to wear it)","resumo":"The science of thermodynamics explains why black clothing doesn't always make you feel hotter than white clothing in the heat.\nThe determining factor involves a combination of fabric color, wind circulation, and the emission of body heat.\nUnder certain wind conditions and a loose fit, dark fabric helps dissipate body heat more efficiently.\nThis finding demystifies an old concept regarding clothing and daily heat transfer.","link":"https://www.xataka.com/medicina-y-salud/ciencia-tiene-claro-camiseta-negra-te-puede-dar-calor-que-blanca-sabes-como-usarla","categoria":"SCIENCE","lang":"en"},{"fonte":"ｄメニューニュース","pais":"Germany","titulo":"New Mercedes-AMG A 45 S \"Final Edition\" with over 420 hp launched in Germany","resumo":"Mercedes-AMG has introduced the special farewell \"Final Edition\" for the A 45 S sports hatch in Germany. The model features a 2.0-liter turbocharged engine capable of generating over 420 horsepower, paired with an all-wheel-drive system and exclusive sports equipment. This commemorative version marks the pinnacle of the lineup, standing out with its aggressive styling and high-end finishes. The launch solidifies the brand's legacy in the ultra-high-performance compact segment within the European market.","link":"https://topics.smt.docomo.ne.jp/amp/article/kurumanews/trend/kurumanews-1092161","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"AFPBB News","pais":"Japan","titulo":"Surge in eVTOL orders at the Shanghai International Low-Altitude Economy Exhibition; market projected to surpass 3.5 trillion yuan by 2035","resumo":"The Shanghai International Low-Altitude Economy Exhibition highlighted strong interest in electric vertical takeoff and landing (eVTOL) aircraft, generating a wave of new orders.\nIndustry experts and reports project this expanding market to reach a financial volume exceeding 3.5 trillion yuan by the year 2035.\nThe advancement drives urban aerial mobility solutions and consolidates the technology as a pillar of innovation in the region.","link":"https://www.afpbb.com/articles/amp/3646173","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"映画.com","pais":"Japan","titulo":"The world changes by how it is portrayed: the evolution of visual technology and the realism of the Moana remake","resumo":"A detailed analysis of recent visual productions highlights how advancements in computer graphics technology have transformed the cinema experience.\nThe evolution of rendering effects and virtual environments delivers an impressive level of realism that elevates the storytelling of these works.\nThe article emphasizes how digital technological innovations continue to redefine quality and immersion standards for major productions.","link":"https://eiga.com/movie/104003/review/06799145/","categoria":"ENTERTAINMENT","lang":"en"},{"fonte":"ｄメニューニュース","pais":"Japan","titulo":"Reports on the Dodgers' signing of Skubal catch player Yoshinobu Yamamoto by surprise","resumo":"Recent speculations in international baseball indicate that the Los Angeles Dodgers are working on signing standout pitcher Tarik Skubal.\nThe rumor generated significant fallout in the sports world, and Japanese pitcher Yoshinobu Yamamoto expressed his surprise at the move.\nThe potential transfer promises to impact the league's competitive landscape and draw even more attention from sports fans.","link":"https://topics.smt.docomo.ne.jp/article/dailysports/sports/20260802069","categoria":"SPORTS","lang":"en"},{"fonte":"朝日新聞","pais":"Japan","titulo":"The end of the political 'center' and the pursuit of focused, engaged support for the future","resumo":"A new analytical landscape examines the transformations in the contemporary political environment, marked by the weakening of centurial positions.\nFaced with this scenario, political leaders in Japan are seeking to consolidate narrower, yet highly engaged and ideologically aligned support bases.\nThe strategy aims to ensure governability and relevance in an increasingly fragmented and challenging political ecosystem.","link":"https://www.asahi.com/articles/ASV7Z2QY8V7ZUTFK02RM.html","categoria":"POLITICS","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Typhoon Forecasting: 'AI + Physics' Solves the 'Black Box' of Climate Models","resumo":"The integration of artificial intelligence with classical physics models is revolutionizing typhoon weather forecasting in China.\nThis hybrid approach overcomes the limitations of the so-called \"black box\" of pure AI algorithms, bringing greater transparency to calculations.\nAs a result, researchers are able to anticipate the trajectory and intensity of extreme events with unprecedented precision.\nThe breakthrough represents a significant milestone for climate science and natural disaster mitigation in the region.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569216.shtm","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"The Guardian","pais":"China","titulo":"China's Technological Advancements Send Shockwaves from Silicon Valley to the White House","resumo":"The rapid technological acceleration driven by China is redefining the global innovation landscape and concerning the US.\nStrategic sectors such as artificial intelligence, semiconductors, and electric vehicles are showing progress at a breakneck pace.\nThis advancement has sparked ongoing debates and strategic adjustments among both tech giants and government bodies.\nFierce competition underscores the race for leadership in digital infrastructure and the economy of the future.","link":"https://www.theguardian.com/technology/2026/aug/01/china-silicon-valley-white-house","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"chshyd.in","pais":"China","titulo":"US Blacklists 43 Chinese Firms in New Trade and Technology Crackdown","resumo":"The United States government has expanded its trade restrictions by adding 43 new Chinese companies to its sanctions list.\nThe move aims to restrict the access of strategic Chinese companies to sensitive technologies and high-end components.\nThe action intensifies geopolitical tensions between the world's two largest economies in the race for technological supremacy.\nThe move reflects increased control over global supply chains and knowledge transfer.","link":"https://chshyd.in/breaking/us-blacklists-43-chinese-firms/","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"motoringworld.in","pais":"China","titulo":"Meet the SSCC SC01: A Lightweight, Driver-Focused Chinese Electric Sports Car with 429 HP","resumo":"The Chinese automotive market is gaining a new highlight with the arrival of the SSCC SC01, an all-electric sports car.\nDeveloped to prioritize the driving experience and handling, the vehicle delivers 429 maximum horsepower.\nThe project breaks away from the trend of heavy electric cars by focusing on weight reduction and agility.\nThis innovation demonstrates the expansion of China's automotive industry in the high-performance segment.","link":"https://motoringworld.in/car-news/meet-the-sscc-sc01-a-lightweight-chinese-electric-sports-car-with-429-bhp-built-for-driver-satisfaction/","categoria":"INNOVATION","lang":"en"},{"fonte":"中国网","pais":"China","titulo":"VR and AR Technologies Transform Cultural Tourism and Museums During the Summer","resumo":"The application of virtual and augmented reality is renewing how the public interacts with cultural heritage.\nIn Chinese museums, these immersive tools offer visitors highly technological, interactive tours.\nThe initiative blends digital entertainment and education, attracting younger generations to historical preservation.\nThe practical use of these technologies consolidates new trends in the digital economy and tourism sector.","link":"http://www.china.com.cn/txt/2026-08/02/content_118629699.shtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"证券之星","pais":"China","titulo":"Visionox Showcases High-Tech ViP and Eye-Protection Displays at ChinaJoy 2026","resumo":"Display manufacturer Visionox showcased its latest innovations during the ChinaJoy 2026 event.\nHighlights include advanced ViP display technology and panels engineered to reduce eye strain.\nThese solutions promise to revolutionize the smartphone, wearable, and gaming display industries.\nThe novelty reinforces China's position in the development of cutting-edge electronic components.","link":"https://wap.stockstar.com/detail/IG2026080200005252","categoria":"HARDWARE","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"Harbin Invests in Technology to Transform Equipment Manufacturing Sector","resumo":"The Chinese city of Harbin has launched an investment plan focused on modernizing its heavy manufacturing industry.\nThe project uses industrial automation, artificial intelligence, and digitization to elevate factory productivity.\nThe initiative seeks to position the region as a hub for advanced, high-value-added manufacturing.\nThe effort reflects China's national strategy to upgrade the infrastructure of its foundational industry.","link":"http://portuguese.xinhuanet.com/20260802/ea117da475334606946a309f81a178fd/c.html","categoria":"INDUSTRY","lang":"en"},{"fonte":"北京大学新闻网","pais":"China","titulo":"'National Material Science' Journal Launched at the 2026 Bajiaowan Innovation Conference","resumo":"During the 2026 Bajiaowan Innovation Conference, the scientific publication \"National Material Science\" was launched.\nThe English-language print periodical aims to disseminate cutting-edge discoveries in materials engineering and applied physics.\nThe initiative strengthens the presence of the Chinese scientific community in global debates and publications.\nThe launch boosts international collaboration and the advancement of research in advanced materials.","link":"https://news.pku.edu.cn/xwzh/866946b76c494b6ab7d544ce503cd464.htm","categoria":"SCIENCE","lang":"en"},{"fonte":"DD India","pais":"India","titulo":"Handloom Hackathon 2.0 Concludes at IIT Delhi with a Focus on Innovation","resumo":"The Handloom Hackathon 2.0 event, held at the prestigious IIT Delhi, brought together students and experts to develop technological solutions targeting India's traditional textile sector.\nThe proposed projects aim to modernize the work of local artisans, increasing production process efficiency without losing the cultural essence of handloom production.\nThe initiative highlights the crucial role of science and technology in revitalizing traditional industries and promoting sustainable development in the country.","link":"https://ddindia.co.in/2026/08/handloom-hackathon-2-0-concludes-at-iit-delhi-showcases-technology-driven-innovations-for-indias-handloom-sector/","categoria":"INNOVATION","lang":"en"},{"fonte":"The New Indian Express","pais":"India","titulo":"Young Diplomats Must Combine Technology and Sensitivity Against Climate Crisis","resumo":"Indian Environment Minister Bhupender Yadav highlighted that new Indian Forest Service officers must integrate technological innovations and human empathy in combating climate change.\nThe guidance reinforces the need to apply cutting-edge tools, such as artificial intelligence and geoprocessing, to protect biodiversity and manage natural resources effectively.\nThe measure seeks to empower the new generation of environmental leaders to face complex socio-environmental challenges in the contemporary global scenario.","link":"https://www.newindianexpress.com/india/2026/Aug/01/young-ifs-officers-must-combine-technology-with-human-sensitivity-to-tackle-climate-crisis-bhupender-yadav","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"newsonair.gov.in","pais":"India","titulo":"PM Modi Attributes India's Progress in Science and Technology to Youth","resumo":"Prime Minister Narendra Modi praised the contribution of Indian youth to the country's rapid advancement in strategic sectors such as science, technology, and sports.\nDuring his speech, Modi emphasized that the innovative mindset and talent of young people are driving the startup ecosystem and national scientific research.\nThis engagement is pointed out as the main engine to consolidate India as an emerging global power in the techn
