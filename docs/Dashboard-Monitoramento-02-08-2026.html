ological and scientific scenario.","link":"https://newsonair.gov.in/pm-modi-credits-youth-for-indias-progress-in-science-technology-and-sports/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Equitymaster","pais":"India","titulo":"Pros and Cons of Investing in Kaynes Technology","resumo":"Kaynes Technology, one of India's leading electronics manufacturing companies, continues to attract the attention of financial market investors.\nExperts analyze the company's strengths, such as its strong expansion in semiconductor production and electronic devices, against market risks and stock valuation.\nThe company's trajectory reflects the accelerated growth of the Indian tech industry and the challenges of maintaining global competitiveness.","link":"http://www.equitymaster.com/detail.asp?date=8/2/2026\u0026story=3","categoria":"BUSINESS","lang":"en"},{"fonte":"The Indian Express","pais":"India","titulo":"Skullcandy Method 360 ANC Review: Is It Worth It?","resumo":"A detailed review of the new Skullcandy Method 360 ANC headphones evaluates the device's active noise cancellation performance and sound quality.\nThe review highlights how the manufacturer seeks to balance advanced audio features with an affordable price to cater to both young consumers and more demanding users.\nThe launch highlights consumer trends in the wearable audio market and fierce competition in the personal electronics segment.","link":"https://indianexpress.com/article/technology/tech-reviews/skullcandy-method-360-anc-review-price-features-bose-sound-10814443/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Statesman","pais":"India","titulo":"Kerala Leads Ayurveda's Advancements in Sports Medicine","resumo":"The state of Kerala has been standing out on the scientific scene by applying traditional Ayurveda medicine practices in the treatment and recovery of high-performance athletes.\nResearch and integrative treatments combine natural therapies with modern sports medicine protocols, aiming to reduce injury rehabilitation time.\nThis movement strengthens the international recognition of traditional Indian medicine combined with innovation and health in contemporary sports.","link":"https://www.thestatesman.com/supplements/8thday/kerala-leads-ayurvedas-recent-strides-in-sports-medicine-1503623375.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Hindustan Times","pais":"India","titulo":"Crowd Management in Mathura-Vrindavan Fails Scientific Criteria, Court States","resumo":"The Allahabad High Court observed that current crowd management methods at the sacred sites of Mathura-Vrindavan lack science-based planning.\nThe court emphasized the urgency of implementing pedestrian flow data, computational modeling, and traffic engineering to prevent serious accidents and stampedes.\nThe decision pressures authorities to adopt monitoring and data analysis technologies to ensure the safety of millions of pilgrims.","link":"https://www.hindustantimes.com/cities/lucknow-news/mathuravrindavan-crowd-management-not-based-on-science-observes-allahabad-hc-101785613470767.html","categoria":"SCIENCE","lang":"en"},{"fonte":"news18.com","pais":"India","titulo":"Gulveer Singh Makes History and Becomes the First Indian Athlete to Achieve Unprecedented Feat","resumo":"Indian athlete Gulveer Singh achieved a historic feat on the track, becoming a prominent national figure and an inspiration in high-performance sports.\nThe unprecedented achievement projects Indian sports into international competitions and reinforces growing investment in infrastructure for top-tier athletes in the country.\nThe result generated major repercussion on social media and in the press, marking a memorable moment for track and field and the athlete's career.","link":"https://www.news18.com/sports/other-sports/gulveer-singh-creates-history-becomes-the-first-indian-athlete-to-2-ws-l-10247293.html","categoria":"TRENDS","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"Portugal Reaches New Record in Science Spending, but Remains Far from 3% Target","resumo":"Portugal recorded a new high in investments destined for the science and innovation sector, reflecting the strengthening of the research ecosystem in the country.\nDespite the expressive advance in applied values, the country still finds itself far from the stipulated target of reaching 3% of GDP in expenditures for the area.\nThe current scenario highlights the ongoing challenges of the government and institutions to maintain scientific competitiveness in Europe.","link":"https://www.publico.pt/2026/08/02/ciencia/noticia/portugal-atinge-novo-maximo-despesa-ciencia-longe-meta-3-2183534","categoria":"SCIENCE","lang":"en"},{"fonte":"PressReader","pais":"Portugal","titulo":"Ciência Viva Celebrates 30 Years of Encouraging Scientific Culture in Portugal","resumo":"The national agency Ciência Viva celebrates three decades of dedicated work promoting and popularizing scientific and technological culture in Portugal.\nThroughout this period, the institution played a fundamental role in bringing the population closer to scientific advancements through interactive centers.\nThe celebrations reinforce the importance of engaging new generations and strengthening knowledge in schools and society.","link":"https://www.pressreader.com/portugal/domingo9waj/20260802/281883010143091","categoria":"SCIENTIFIC CULTURE","lang":"en"},{"fonte":"Rádio Altitude","pais":"Portugal","titulo":"Ciência Viva Distributes Free Glasses for Safe Solar Eclipse Observation","resumo":"With the approach of a relevant astronomical phenomenon, the Ciência Viva network announced the free distribution of special glasses to the population in Portugal.\nThe initiative aims to ensure that citizens and students can follow the event without risks to eye health, promoting interest in astronomy.\nVarious scientific centers spread across the country will function as delivery points and locations for associated educational activities.","link":"https://www.altitude.fm/actualidade/ciencia-viva-oferece-oculos-para-ver-o-eclipse-solar-gratuitamente/","categoria":"ASTRONOMY","lang":"en"},{"fonte":"Meteored Portugal","pais":"Portugal","titulo":"Science Proves World's Oldest Continuous Ritual Practice in Australian Cave","resumo":"Researchers confirmed that evidence found in an Australian cave represents the oldest continuous ritual tradition ever recorded on the planet.\nThe archaeological finds date back tens of thousands of years and demonstrate the uninterrupted transmission of cultural customs over generations.\nThe study brings new revelations about the evolution of human behavior, cultural symbolism, and the preservation of ancestral memories.","link":"https://www.tempo.pt/noticias/ciencia/ciencia-prova-a-existencia-da-pratica-ritual-continua-mais-antiga-do-mundo-em-caverna-australiana.html","categoria":"DISCOVERY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render
</script>
</body>
</html>
