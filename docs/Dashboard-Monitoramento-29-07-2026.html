INTELLIGENCE","lang":"en"},{"fonte":"South China Morning Post","pais":"China","titulo":"From Space Babies to Fields Medal Winners: 7 Highlights of Chinese Science","resumo":"A recent overview highlights the most expressive advancements in Chinese science, including pioneering research on organic development in space and achievements in mathematics.\nFor the first time, scientists linked to institutions in the country have achieved recognition with the prestigious Fields Medal.\nThe discoveries reinforce China's massive investment in fundamental research and high-impact global innovation.","link":"https://www.scmp.com/news/china/science/article/3362090/having-babies-space-chinas-first-fields-medal-winners-7-science-highlights","categoria":"SCIENCE","lang":"en"},{"fonte":"itaiwannews.cn","pais":"China","titulo":"From Follower to Leader: China's Open-Source AI Models Integrate into the Real Economy","resumo":"The open-source artificial intelligence models developed in China have rapidly evolved from followers to global leaders in the technology sector.\nThe widespread adoption of these tools in the productive sector is accelerating the digital transformation of traditional industries and the real economy.\nThis movement solidifies the country's technological self-sufficiency and drives new ecosystems of corporate innovation.","link":"https://www.itaiwannews.cn/2026-07-29/8faca613-9abd-4126-972c-9ebd35c7b416.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"wallpaper.com","pais":"China","titulo":"Bigger, Bolder, and Stuffed with Tech: Meet the New Zeekr 9X","resumo":"Chinese electric vehicle brand Zeekr has unveiled the 9X, a model that brings together state-of-the-art connectivity, autonomous sensors, and battery architecture.\nThe SUV has redefined the standards of luxury and technological innovation in the country's competitive electric mobility market.\nThe launch reinforces the leadership of the Chinese automotive sector in the global transition toward sustainable and intelligent vehicles.","link":"https://www.wallpaper.com/transportation/bigger-bolder-and-stuffed-to-the-gills-with-technology-meet-the-new-zeekr-9x","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"jwview.com","pais":"China","titulo":"Next-Generation IT Patents Account for 16.5% of the Total in China","resumo":"The China National Intellectual Property Administration revealed that patents in strategic sectors, such as AI and Big Data, correspond to 16.5% of valid invention patents in the country.\nThe data reflects the acceleration of economic transition toward knowledge-based and high-tech models.\nThe consolidation of intellectual property strengthens Chinese companies in global technological competition.","link":"https://www.jwview.com/jingwei/html/07-29/681354.shtml","categoria":"INNOVATION","lang":"en"},{"fonte":"Vietnam.vn","pais":"China","titulo":"3D Technology Enables Surgical Facial Reconstruction After Invasive Cancer","resumo":"Doctors utilized 3D modeling and printing to plan and execute a complex facial reconstruction on a 76-year-old patient diagnosed with aggressive cancer.\nThe technology allowed for the creation of custom-tailored molds and prosthetics with millimeter precision, reducing surgery time and improving recovery.\nThe success of the intervention highlights the growing potential of precision medicine and additive manufacturing in healthcare.","link":"https://www.vietnam.vn/pt/dung-cong-nghe-3d-lap-trinh-ca-mo-tai-tao-guong-mat-cu-ong-76-tuoi-sau-ung-thu-xam-lan","categoria":"MEDICINE","lang":"en"},{"fonte":"钛媒体","pais":"China","titulo":"Kimi K3 Releases Weights: Technical Report Seeks to Answer Questions on Claude Distillation","resumo":"The Chinese AI startup has publicly released the weights of its Kimi K3 model, accompanied by a detailed technical report on its architecture and training.\nThe public disclosure aims to clarify questions from the international community regarding the use of data distillation from the Claude model.\nThe transparency of the launch rekindles the global debate on governance, ethics, and the development of open AI models.","link":"https://www.tmtpost.com/8083426.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"El Periódico","pais":"China","titulo":"Public Investment and Technology Reduce Wildfires by 72% in China","resumo":"The combination of continuous state investment and the use of artificial intelligence, satellites, and drones has drastically reduced wildfires in China over the past two decades.\nReal-time monitoring and rapid response systems have transformed environmental risk management in the country.\nThe integrated approach serves as an international model of how technology can mitigate climate disasters and protect ecosystems.","link":"https://www.elperiodico.com/es/internacional/20260728/china-incendios-prevencion-inversion-publica-tecnologia-132902144","categoria":"ENVIRONMENTAL TECHNOLOGY","lang":"en"},{"fonte":"Indian Retailer","pais":"India","titulo":"Dreame Technology Expands Smart Home Portfolio with D30 Ultra Robot Vacuum in India","resumo":"Dreame Technology has announced the expansion of its smart home device lineup in India with the launch of the D30 Ultra robot vacuum.\nThe new device features advanced navigation and automation capabilities designed to simplify everyday residential cleaning.\nThe product's arrival reinforces the continuous growth of the smart device and consumer robotics market in the country.","link":"https://www.indianretailer.com/news/dreame-technology-expands-smart-home-portfolio-d30-ultra-robot-vacuum-india","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"SMEStreet","pais":"India","titulo":"Advancing Immuno-Oncology Science: BMS India Launches RELOPDUO for Metastatic Melanoma","resumo":"Bristol Myers Squibb (BMS) India has introduced the RELOPDUO treatment, bringing a new therapeutic option for patients with metastatic melanoma.\nThe innovation represents a significant breakthrough in the country's immuno-oncology field, offering combined alternatives against aggressive tumors.\nThe launch highlights the evolution of medical science and the expanded access to innovative biological therapies in the Indian market.","link":"https://smestreet.in/sectors/advancing-the-science-of-immuno-oncology-bms-india-introduces-relopduo-for-metastatic-melanoma-12207827","categoria":"SCIENCE","lang":"en"},{"fonte":"TheWire.in","pais":"India","titulo":"DT Infrastructure Awards Major Projects to TCL Solar, Accelerating Back-Contact Solar Technology","resumo":"DT Infrastructure has awarded TCL Solar the Smoky Creek and Guthries Gap projects, which together total 720 MW of energy capacity.\nThe initiative focuses on the implementation of back-contact solar panel technology, ensuring higher conversion efficiency.\nThe agreement drives the renewable energy transition and consolidates new technological advancements in the sustainable infrastructure sector.","link":"https://m.thewire.in/article/ptiprnews/dt-infrastructure-dti-awards-tcl-solar-landmark-720mw-smoky-creek-and-guthries-gap-projects-accelerating-the-future-of-back-contact-solar-technology","categoria":"INNOVATION","lang":"en"},{"fonte":"DD News","pais":"India","titulo":"Prime Minister Modi Celebrates Global Tiger Day and Reaffirms Commitment to Scientific Conservation","resumo":"On Global Tiger Day, Prime Minister Narendra Modi highlighted India's advancements in big cat preservation through science.\nThe country's approach combines technological monitoring, wildlife data analysis, and natural habitat restoration.\nThe announcement reinforces India's leadership role in environmental protection strategies grounded in scientific research.","link":"https://ddnews.gov.in/en/pm-modi-extends-global-tiger-day-greetings-says-india-committed-to-science-based-conservation/","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"India Today","pais":"India","titulo":"Visa to Cut 2,600 Jobs, Primarily Targeting Technology and Product Teams","resumo":"Payments giant Visa has announced a global restructuring plan that will result in the layoff of approximately 2,600 employees.\nThe areas most impacted by the reductions will be the company's technology development and product management teams.\nThe move reflects operational adjustments in the corporate sector to optimize costs in the face of digital market transformations.","link":"https://www.indiatoday.in/jobs/story/visa-layoffs-job-cut-2600-tech-product-teams-hit-hardest-ai-restructuring-bsc-2958670-2026-07-29","categoria":"BUSINESS","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"Indian Navy Divers Utilize Advanced Technology in Coal Mine Rescue Operation","resumo":"The Indian Navy has deployed divers equipped with advanced technology to support the rescue at the Umrangso coal mine in Assam.\nThe use of mapping systems and modern equipment aims to optimize navigation in underground and high-risk environments.\nThe action exemplifies how technological innovation has been essential in supporting critical emergency missions in the country.","link":"https://newsonair.gov.in/indian-navy-divers-continue-rescue-efforts-with-advanced-technology-at-assams-umrangso-coal-mine/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"India's 'Looksmaxxing' Economy: More Science, Higher Investment, and Fewer Taboos","resumo":"The 'looksmaxxing' trend, focused on physical appearance optimization, is gaining strong appeal in the Indian market driven by science.\nThe sector's growth reflects a cultural shift where the public invests in aesthetic procedures backed by data and research.\nThis phenomenon fosters new business opportunities in medical technology, advanced aesthetics, and personal care in the region.","link":"https://timesofindia.indiatimes.com/business/india-business/indias-looksmaxxing-economy-more-science-more-spending-fewer-taboos/articleshow/132684117.cms","categoria":"TRENDS","lang":"en"},{"fonte":"The Hindu","pais":"India","titulo":"Lawmaker Approaches Supreme Court Against Use of Facial Recognition at NEET Protests","resumo":"An Indian lawmaker has challenged the police forces' use of facial recognition technologies during demonstrations in the Supreme Court.\nThe debate raises fundamental questions regarding privacy rights, state surveillance, and the ethical limits of artificial intelligence.\nThe case reflects growing legal and regulatory tensions surrounding the adoption of monitoring technologies in India.","link":"https://www.thehindu.com/news/national/rajya-sabha-mp-moves-supreme-court-against-use-of-facial-recognition-technology-at-neet-protests/article71276424.ece","categoria":"PRIVACY","lang":"en"},{"fonte":"Tek Notícias","pais":"Portugal","titulo":"What Science Says About Cell Phones and Brain Cancer Risk: New Study Finds No Link","resumo":"A detailed new scientific study has re-evaluated the health impacts of prolonged cell phone use, focusing on the potential relationship with brain cancer development.\nThe conclusions indicate that there is no evidence proving this link, providing important clarification for the medical community and technology users worldwide.\nThe research reinforces the safety of radiofrequency waves emitted by modern devices within regulated limits.","link":"https://tek.sapo.pt/noticias/ciencia/artigos/o-que-diz-a-ciencia-sobre-telemoveis-e-o-risco-de-cancro-cerebral-novo-estudo-nao-encontra-ligacao/","categoria":"SCIENCE","lang":"en"},{"fonte":"Jornal PT50","pais":"Portugal","titulo":"New Warning from the 'Central Bank of Central Banks': AI May Distort Fundamental Variables for Monetary Policy","resumo":"The Bank for International Settlements has warned that the rapid adoption of artificial intelligence could affect traditional economic calculations used by central banks.\nAutomation and advanced predictive models have the potential to alter price dynamics and labor market behavior unpredictably.\nGiven this scenario, analysts are urging caution in interpreting financial data to avoid errors in defining global interest rates.","link":"https://jornalpt50.pt/noticia/novo-aviso-do-banco-central-dos-bancos-centrais-ia-pode-distorcer-variaveis-fundamentais-para-a-politica-monetaria/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Jornal de Negócios","pais":"Portugal","titulo":"Tech Sell-Off in the Stock Market Threatens to Spill Over to the Global Economy","resumo":"The heavy wave of stock selling in the technology sector is generating apprehension in international financial markets and could affect other economic segments.\nThe movement reflects investors' concerns regarding the financial return on massive investments in artificial intelligence and the slowdown of tech giants.\nExperts warn that continuous volatility could trigger a chain reaction with global impacts on consumption and credit.","link":"https://www.jornaldenegocios.pt/mercados/bolsa/detalhe/sell-off-tecnologico-em-bolsa-ameaca-contagiar-economia-mundial","categoria":"MARKET","lang":"en"},{"fonte":"Link To Leaders","pais":"Portugal","titulo":"\"Technology and Artificial Intelligence Will Play an Increasingly Relevant Role in Home Care\"","resumo":"Digital transformation in the healthcare sector is redefining how medical care and assistance for the elderly are carried out at home.\nArtificial intelligence tools and smart sensors enable continuous monitoring, ensuring faster and more personalized preventative interventions.\nExperts highlight that this technological evolution helps decentralize the healthcare system, increasing efficiency and patients' quality of life.","link":"https://linktoleaders.com/a-tecnologia-e-a-inteligencia-artificial-terao-um-papel-cada-vez-mais-relevante-nos-cuidados-domiciliarios-afonso-madeira-puro-cuidado/","categoria":"HEALTH AND TECHNOLOGY","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"TAP reduces aircraft weight and cuts emissions with new painting technology","resumo":"Airline TAP has adopted an innovative painting method for its aircraft that optimizes paint application and significantly reduces the final weight of the planes.\nThis weight reduction results in lower fuel consumption per flight, also directly decreasing carbon emissions.\nThe initiative combines technology and sustainability to drive operational efficiency and cost savings in aviation.","link":"https://jornaleconomico.sapo.pt/noticias/tap-reduz-peso-dos-avioes-e-corta-emissoes-com-nova-tecnologia-de-pintura/","categoria":"INNOVATION","lang":"en"},{"fonte":"Rádio Campanário","pais":"Portugal","titulo":"Évora joins the network of 10 universities that will shape the future of science in Portugal","resumo":"The University of Évora has joined a select group of ten academic institutions tasked with driving advanced scientific research in Portugal.\nThe network focuses on developing strategic projects that connect academic innovation, sustainability, and technology transfer to society.\nThis achievement reinforces the region's role in the national and international scientific ecosystem for the coming years.","link":"https://www.radiocampanario.com/evora-entra-na-rede-das-10-universidades-que-vao-moldar-o-futuro-da-ciencia-em-portugal/","categoria":"SCIENCE","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Deloitte opens applications for technology scholarships at the Polytechnic Institute of Setúbal","resumo":"Deloitte has launched a scholarship program aimed at technology students at the Polytechnic Institute of Setúbal in Portugal.\nThe initiative aims to encourage technical training and bring students closer to the real demands of the digital job market.\nIn addition to financial support, the partnership promises to open doors to internship and professional development opportunities in the tech sector.","link":"https://sapo.pt/artigo/deloitte-abre-candidaturas-para-bolsas-de-estudo-em-tecnologia-no-instituto-politecnico-de-setubal-6a69257b5d7299db899842da","categoria":"EDUCATION \u0026 TECH","lang":"en"},{"fonte":"Executive Digest","pais":"Portugal","titulo":"Honda strengthens focus on hybrids: e:HEV technology now powers seven models in Portugal","resumo":"Honda has expanded the presence of its e:HEV hybrid technology in Portugal, making the system available across seven different models in its portfolio.\nThe powertrain combines energy efficiency with high performance, serving as a crucial transition toward the total electrification of the fleet.\nThe strategy strengthens the brand's competitiveness in the Portuguese automotive market in the face of growing environmental demands.","link":"https://executivedigest.sapo.pt/honda-reforca-aposta-nos-hibridos-tecnologia-ehev-ja-equipa-sete-modelos-em-portugal/","categoria":"MOBILITY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/\.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
