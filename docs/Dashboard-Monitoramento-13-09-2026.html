y amid intensifying global technological competition. Under the new rules, harsher penalties will be applied to violations involving the theft of strategic technologies by foreign entities.","link":"https://jp.investing.com/news/economy-news/article-1678384","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"Okayama University Has 20 Projects Selected by MEXT's 'AI for Science' Program","resumo":"Okayama University had 20 proposals selected for the 'AI for Science' research project promoted by Japan's Ministry of Education, Culture, Sports, Science and Technology. The initiative aims to integrate cutting-edge artificial intelligence into scientific research to accelerate discoveries and strengthen academic capacity. The project cements Japan's position in fostering technological innovation applied to various fields of knowledge.","link":"https://prtimes.jp/main/html/rd/p/000004226.000072793.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"上观新闻","pais":"China","titulo":"Director of Shanghai AI Laboratory: Scientific Research Is the Next Programming","resumo":"Zhou Bowen, director of the Shanghai Artificial Intelligence Laboratory, highlighted AI's transformative role in contemporary science. According to the expert, AI models are redefining research methodologies by automating data analysis and complex hypothesis testing. The convergence of artificial intelligence and fundamental science is seen as the new frontier of technological innovation. This paradigm shift is expected to accelerate discoveries across various areas of human knowledge.","link":"https://www.jfdaily.com/news/detail?id=1175891","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"新浪网","pais":"China","titulo":"Investors Analyze the New AI Economy: Coexistence of Bubbles and Embodied Innovation Awaiting Tipping Point","resumo":"Technology investors are debating the current state of artificial intelligence, highlighting the balance between financial speculation and genuine breakthroughs. Although the sector faces market uncertainties, the development of embodied intelligence and robotics continues to advance. Experts point out that the technology is still awaiting a decisive inflection point to achieve mass adoption. The scenario demands strategic caution to sustain long-term innovation.","link":"https://finance.sina.cn/stock/jdts/2026-09-13/detail-inirscyh5670671.d.html?oid=800\u0026vt=4\u0026cid=76993\u0026node_id=76993","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"21财经","pais":"China","titulo":"Robot Created by Tsinghua PhD Graduate Starts Working in Hotels","resumo":"A service robot developed by specialists graduating from the prestigious Tsinghua University has been introduced to the hospitality sector. The innovation combines advanced robotics and intelligent systems to perform operational tasks with high precision and efficiency. The initiative reflects the growth of automation in the service sector and the commercial impact of Chinese academic research. The solution demonstrates the practical transition of robotics from laboratories to the consumer market.","link":"https://m.21jingji.com/article/20260912/149d9e72c6c75cfa8a9d55c418c7b1f3_zaker.html","categoria":"ROBOTICS","lang":"en"},{"fonte":"碳索储能网","pais":"China","titulo":"Suqian Flow Energy Storage Technology Boosts Commercial Operation of Country's Largest Testing Platform","resumo":"A new aqueous organic flow battery energy storage technology has reached international leading levels in China. The system has been integrated into the country's largest new energy storage testing platform for commercial operation. The innovation improves the joint coordination efficiency between thermal power and clean energy storage. The advancement strengthens national infrastructure dedicated to the energy transition and sustainability.","link":"https://mcn.solarbe.com/news/20260913/50029013.html","categoria":"ENERGY","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"BeiDou Technology Empowers Mountainous Areas of Southwest China to Resolve 'Information Islands' in Small Hydropower Plants","resumo":"The BeiDou satellite navigation system is being applied to integrate the infrastructure of small hydropower plants in remote regions. The technology overcomes geographic barriers and eliminates communication isolation in the mountains of southwest China. Real-time monitoring improves water management, operational safety, and regional energy efficiency. The initiative demonstrates how the satellite system drives the development of rural infrastructure.","link":"https://www.news.cn/tech/20260912/158eea3ff13f427e919570f6e642231d/c.html","categoria":"SATELLITE TECHNOLOGY","lang":"en"},{"fonte":"OkDiario","pais":"China","titulo":"Science Confirms: China Reduces Specific Pollutants by 98% in 12 Years","resumo":"Recent scientific studies confirm the significant success of environmental control policies implemented by China over the past decade. The country managed to eradicate about 98% of severe atmospheric pollution hotspots in just 12 years. The actions combined strict regulations, a transition to renewable energy, and cutting-edge technological monitoring. The results serve as a global model for rapid pollution mitigation in highly industrialized areas.","link":"https://okdiario.com/ciencia/nadie-lo-vio-venir-pero-ciencia-lo-reafirma-china-fulmina-12-anos-98-contaminacion-capital-16120833","categoria":"ENVIRONMENTAL SCIENCE","lang":"en"},{"fonte":"TV BRICS","pais":"China","titulo":"Chile and China Create Demonstration Farm for Chinese Agricultural Technology","resumo":"Chile and China have established a bilateral partnership to deploy a demonstration farm focused on advanced agricultural technologies. The project aims to showcase innovations in irrigation, automation, and sustainable farming techniques developed by Chinese researchers. The cooperation strengthens trade ties and agricultural technology transfer between the two countries. In addition to expanding markets, the initiative drives the modernization of agriculture in Latin America.","link":"https://tvbrics.com/pt/news/chile-e-china-criam-fazenda-para-demonstrar-tecnologia-agricola-chinesa/","categoria":"AGRITECH","lang":"en"},{"fonte":"新浪网","pais":"China","titulo":"AI for Science Innovation Challenge 2026 Launched in Beijing","resumo":"Beijing has kicked off the AI for Science Innovation Challenge 2026, focused on the application of AI in scientific research. The event brings together researchers, developers, and startups to propose innovative solutions in strategic areas. The competition seeks to drive the convergence of advanced algorithms and classic scientific investigation methods. The project reaffirms China's ambition to lead the digital transformation in fundamental sciences.","link":"https://k.sina.com.cn/article_5952915720_162d2490806704tsb0.html?from=tech","categoria":"INNOVATION","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"India Joins 24 Countries in Global Initiative on 6G Technology","resumo":"India has formalized its participation in a global alliance of 24 countries aimed at boosting research and development of 6G technology. The initiative seeks to establish international standards for connectivity, security, and infrastructure for the next generation of mobile networks. Through this, the country intends to lead global technological innovation and accelerate its digital transformation in the coming years.","link":"https://newsonair.gov.in/india-joins-24-countries-in-global-initiative-on-6g-technology/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Hindustan Times","pais":"India","titulo":"The Price of Not Owning Proprietary Technology","resumo":"The article analyzes the economic risks and impacts for India of depending on foreign technological infrastructure and patents in crucial sectors. The lack of technological sovereignty can compromise national security, in addition to making local innovation more expensive compared to global powers. Strengthening domestic research and creating proprietary innovation ecosystems emerges as an urgent strategic priority for the country's future.","link":"https://www.hindustantimes.com/ht-insight/future-tech/the-price-of-not-owning-technology-101789275939210.html","categoria":"INNOVATION","lang":"en"},{"fonte":"ThePrint","pais":"India","titulo":"Science May Be the Bridge Between India and China That Diplomacy Could Not Build","resumo":"Scientific and technological cooperation emerges as a viable alternative to ease historical geopolitical tensions between India and China. Partnerships in research on climate change, public health, and space exploration can create continuous channels of dialogue between the two nations. The pragmatic approach focused on science has the potential to generate mutual trust where traditional diplomatic negotiations have stagnated.","link":"https://theprint.in/opinion/science-india-china-diplomacy/3041387/","categoria":"SCIENCE","lang":"en"},{"fonte":"The Indian Express","pais":"India","titulo":"In Esports, Olympic Hardware Standardization Is a Game Changer","resumo":"The introduction of Olympic-style hardware standards promises to transform the competitive esports landscape by ensuring a level playing field for athletes. The measure aims to eliminate unfair advantages resulting from technical variations in the equipment used during global championships. This regulation is seen as a decisive step toward the formal consolidation of Esports as an Olympic discipline in the coming years.","link":"https://indianexpress.com/article/sports/in-esports-olympic-standardisation-of-hardware-a-game-changer-10875933/","categoria":"ESPORTS","lang":"en"},{"fonte":"SÁBADO","pais":"India","titulo":"BRICS World Leaders Gather in New Delhi to Discuss Trade, Investment, and Global Conflicts","resumo":"Representatives from the nations making up the BRICS bloc met in New Delhi to address economic strategies, trade facilitation, and mutual financial cooperation. The talks covered the impact of current geopolitical instabilities on global supply chains and trade among emerging economies. The summit seeks to reinforce the bloc's influence on the international stage and encourage transactions in local currencies.","link":"https://www.sabado.pt/video/amp/lideres-mundiais-dos-brics-reunem-se-em-nova-deli-para-discutir-comercio-investimento-e-conflitos-globais","categoria":"DIPLOMACY","lang":"en"},{"fonte":"TV BRICS","pais":"India","titulo":"India Has Become the World's Fastest-Growing Economy, According to Minister","resumo":"According to statements by government authorities, India has reached the position of the world's fastest-expanding economy, driven by strong investments in infrastructure and innovation. The standout performance reflects progress in the industrial and services sectors, alongside the growing digitization of the Indian consumer market. Continuous growth consolidates the country as one of the main engines of global economic development in recent years.","link":"https://tvbrics.com/es/news/india-se-convirtio-en-la-economia-de-mas-rapido-crecimiento-del-mundo-segun-un-ministro/","categoria":"ECONOMY","lang":"en"},{"fonte":"Investing.com India","pais":"India","titulo":"South Korea Expands Espionage Law to Protect Semiconductor Technology","resumo":"South Korea has updated its espionage legislation to toughen penalties against the leakage and theft of industrial secrets in the semiconductor sector. The measure aims to protect the country's intellectual property amid the fierce global tech race and growing cyber threats. The legal strengthening reflects the strategic importance of microchips for South Korea's economic security and national competitiveness.","link":"https://in.investing.com/news/economy-news/south-korea-expands-espionage-law-to-protect-chip-technology-5590838","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Dinheiro Vivo","pais":"Portugal","titulo":"Green Energy 30% Cheaper and 98% Fiber: Portugal's Assets in the AI Race, According to McKinsey","resumo":"According to a recent study by consulting firm McKinsey, Portugal presents decisive competitive advantages to position itself as a global hub for artificial intelligence infrastructure. The country boasts renewable energy roughly 30% cheaper than the European average and fiber optic coverage reaching 98% of its territory. These factors attract investors and drive the construction of new sustainable data centers in the region.","link":"http://dinheirovivo.dn.pt/economia/energia-verde-30-mais-barata-e-98-de-fibra-os-trunfos-de-portugal-na-corrida-ia-para-a-mckinsey","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"SÁBADO","pais":"Portugal","titulo":"Research with Portuguese Participation Develops Plastic-Eating Enzyme","resumo":"Scientists with the participation of Portuguese researchers have developed a new enzymatic variant capable of degrading synthetic plastics in record time. The innovation promises to revolutionize industrial recycling and drastically reduce microplastic pollution in marine and terrestrial ecosystems. The breakthrough highlights the prominent role of Lusitanian science in combating global environmental crises.","link":"https://www.sabado.pt/ciencia---saude/detalhe/investigacao-com-cunho-portugues-desenvolve-enzima-devoradora-de-plastico","categoria":"SCIENCE","lang":"en"},{"fonte":"SIC Notícias","pais":"Portugal","titulo":"New AI Technology Helps Prevent Glaucoma-Induced Blindness","resumo":"A new tool based on artificial intelligence has been developed to diagnose and monitor glaucoma with high precision and early detection. The solution analyzes eye scans in an automated way, identifying optic nerve damage before it causes irreversible harm. The technological breakthrough promises to expand access to preventive treatments and avoid vision loss in thousands of patients.","link":"https://sicnoticias.pt/saude-e-bem-estar/2026-09-12-nova-tecnologia-com-ia-ajuda-a-prevenir-cegueira-provocada-por-glaucoma-f190dbd3","categoria":"HEALTH AND TECHNOLOGY","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Musk and Altman Express Support for Slowing Down Artificial Intelligence Development","resumo":"Elon Musk and Sam Altman have once again expressed concerns about the accelerated pace of research in generative and advanced artificial intelligence. Both industry leaders advocate for the creation of ethical guidelines and reinforced safety mechanisms to contain existential risks. The stance reflects a broadening debate on the regulation needed to curb potential social and security impacts.","link":"https://www.cmjornal.pt/tecnologia/amp/musk-e-altman-tambem-a-favor-de-abrandar-desenvolvimento-de-inteligencia-artificial","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"ECO","pais":"Portugal","titulo":"Elite mathematicians warn of artificial intelligence risks in science","resumo":"A group of prominent mathematicians has issued a warning regarding the unchecked use of artificial intelligence systems in validating scientific theories and productions.\nExperts point out that flaws and hallucinations in deep learning algorithms can compromise the methodological rigor of academic research.\nThe manifesto calls for more stringent human verification criteria when using AI for scientific discoveries.","link":"https://eco.sapo.pt/2026/09/12/elote-de-matematicos-alertam-para-riscos-da-inteligencia-artificial-na-ciencia/","categoria":"SCIENCE","lang":"en"},{"fonte":"publico.pt","pais":"Portugal","titulo":"In a year and a half, the Ministry of Education contracted 30 million for technology and reforms","resumo":"Portugal's Ministry of Education has invested 30 million euros over the past 18 months in contracts focused on technological modernization and administrative restructuring.\nThe plan aims to accelerate the digital transition in schools and optimize internal processes within public education management.\nThe high volume of investment reflects the prioritization of technological infrastructure as a pillar for the country's educational future.","link":"https://www.publico.pt/2026/09/13/sociedade/noticia/ano-meio-educacao-contratou-30-milhoes-tecnologia-reforma-ministerio-2187686","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"publico.pt","pais":"Portugal","titulo":"Ada Yonath (1939-2026), the lady of crystals","resumo":"Ada Yonath, renowned crystallographer and Nobel Prize laureate in Chemistry for deciphering the three-dimensional structure of ribosomes, has passed away.\nHer pioneering studies in structural biology paved the way for the creation of new antibiotics and revolutionized modern medicine.\nThe global scientific community pays tribute to the remarkable legacy of one of contemporary science's greatest minds.","link":"https://www.publico.pt/2026/09/13/ciencia/cronica/ada-yonath-19392026-dama-cristais-2187845","categoria":"SCIENCE","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Highlights of the week: Technology, wealth, and new experiences","resumo":"This weekly overview brings together major developments across technological innovation, financial markets, and digital consumer trends.\nThe analysis highlights how ongoing digital transformation is shaping new business ecosystems and lifestyle habits.\nThis compilation offers a strategic perspective on the transformations driving the pace of the modern economy.","link":"https://sapo.pt/artigo/top-of-the-week-tecnologia-riqueza-e-novas-experiencias-6aa5a0dcd98f4c2b51db51f9","categoria":"TRENDS","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
