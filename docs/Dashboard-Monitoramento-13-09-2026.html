  // Injeta os dados originais no frontend
  const data = [{"fonte":"Times Brasil | CNBC","pais":"Brasil","titulo":"Apple adquire tecnologia avançada para detecção de sinais corporais","resumo":"A Apple realizou a aquisição de uma nova tecnologia capaz de monitorar e interpretar sinais biológicos do corpo humano.\nEssa inovação promete ser integrada aos futuros dispositivos vestíveis da marca, aprimorando o acompanhamento de saúde dos usuários.\nA iniciativa reflete o investimento contínuo das grandes empresas de tecnologia em sensores biométricos de alta precisão.\nO movimento pode definir novos padrões para a indústria de saúde digital e monitoramento pessoal nos próximos anos.","link":"https://timesbrasil.com.br/empresas-e-negocios/tecnologia-e-inovacao/apple-adquire-tecnologia-que-detecta-sinais-do-cerebro-e-musculos-entenda/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Meta testa o uso de robôs para automatizar a operação de seus data centers","resumo":"A Meta está testando o uso de robôs autônomos para gerenciar e realizar manutenções em seus centros de dados globais.\nA medida visa otimizar tarefas operacionais repetitivas e aumentar a eficiência no suporte às suas infraestruturas digitais.\nO avanço sinaliza uma forte tendência da indústria de tecnologia em automatizar processos físicos essenciais.\nSe bem-sucedida, a iniciativa pode reduzir custos operacionais e elevar a segurança nos data centers da empresa.","link":"https://g1.globo.com/tecnologia/noticia/2026/09/12/meta-robos-data-centers.ghtml","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Altman e Musk concordam com CEO da Anthropic sobre desacelerar o avanço da IA","resumo":"Líderes de destaque no setor de tecnologia, como Sam Altman e Elon Musk, apoiaram a proposta de desacelerar o desenvolvimento da IA.\nO alerta inicial veio do CEO da Anthropic, que levantou preocupações sérias sobre os riscos de um avanço descontrolado da tecnologia.\nO consenso incomum entre grandes rivais evidencia o aumento das preocupações éticas e de segurança no setor.\nA discussão pode impulsionar novos debates regulatórios globais sobre os limites da inteligência artificial generativa.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/09/12/rivais-altman-e-musk-dizem-concordar-com-apelo-de-ceo-da-anthropic-para-que-setor-desacelere-ritmo-de-desenvolvimento-da-ia.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Estudo científico revela como o cérebro humano processa a beleza artística","resumo":"Pesquisadores divulgaram novas descobertas sobre as redes neurais ativadas quando o cérebro contempla obras de arte.\nO estudo demonstra como diferentes áreas cerebrais conectadas ao prazer e à emoção reagem a estímulos visuais estéticos.\nEsses achados ajudam a compreender a evolução da percepção humana e o impacto cultural da arte na neurobiologia.\nA pesquisa abre portas para aplicar conceitos neurocientíficos em áreas como design, arquitetura e terapias cognitivas.","link":"https://www1.folha.uol.com.br/ciencia/2026/09/ciencia-revela-como-o-cerebro-interpreta-a-beleza-artistica.shtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Estadão","pais":"Brasil","titulo":"Fenômeno viral nas redes: ciência explica os relatos sobre a fase lútea","resumo":"Um novo tópico viralizou nas redes sociais com relatos de mulheres sobre alterações estéticas durante a fase lútea do ciclo menstrual.\nEspecialistas e cientistas esclareceram os fatores hormonais e biológicos que justificam tais percepções do corpo.\nA discussão destaca como as plataformas digitais têm servido de espaço para debates sobre fisiologia e bem-estar feminino.\nO fenômeno aproxima a ciência do cotidiano dos usuários ao desmistificar transformações comuns do organismo humano.","link":"https://www.estadao.com.br/em-alta/pulsa/autocuidado/viralizou-mulheres-relatam-feiura-da-fase-lutea-o-que-a-ciencia-diz-sobre-o-fenomeno-das-redes/","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Finanças, Câmbio e Investimentos","pais":"Brasil","titulo":"Coreia do Sul fortalece leis de espionagem para blindar tecnologia de semicondutores","resumo":"A Coreia do Sul expandiu a legislação contra a espionagem industrial para proteger segredos comerciais de sua indústria de chips.\nA decisão busca conter o vazamento de tecnologias críticas em um cenário de forte competição global por semicondutores.\nCom a medida, o país reafirma a importância estratégica dos componentes eletrônicos para a economia e segurança nacional.\nA iniciativa reflete a crescente tensão internacional em torno da soberania tecnológica e da cadeia de suprimentos.","link":"https://br.investing.com/news/economy-news/coreia-do-sul-amplia-lei-de-espionagem-para-proteger-tecnologia-de-chips-2063869","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"notebookcheck.info","pais":"Brasil","titulo":"Colorful lança notebook gamer de alto desempenho equipado com tecnologia AMD","resumo":"A Colorful revelou seu mais recente notebook voltado para jogos, equipado com processadores e gráficos integrados avançados da AMD.\nO dispositivo destaca-se pelo suporte a até 128 GB de memória RAM e pela nova solução gráfica Radeon 8060S.\nVoltado para jogadores exigentes e criadores de conteúdo, o equipamento entrega potência para tarefas de alta demanda computacional.\nO lançamento reforça a disputa no mercado de hardware portátil focado em desempenho extremo e eficiência energética.","link":"https://www.notebookcheck.info/A-Colorful-apresenta-um-notebook-para-jogos-com-tecnologia-AMD-com-ate-128-GB-de-RAM-e-iGPU-Radeon-8060S.1397949.0.html","categoria":"HARDWARE","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"OpenAI adia planos de IPO em 2026 com foco na segurança da inteligência artificial","resumo":"A OpenAI decidiu descartar a realização de uma oferta pública inicial (IPO) no ano de 2026.\nA liderança da empresa afirmou que a prioridade absoluta no momento é a pesquisa e garantia da segurança dos modelos de IA.\nA decisão reflete o compromisso em alinhar o crescimento da startup com o desenvolvimento responsável de novas ferramentas.\nO movimento sinaliza ao mercado que os desafios éticos e operacionais da IA se sobrepõem a pressões financeiras imediatas.","link":"https://www1.folha.uol.com.br/mercado/2026/09/openai-afasta-ipo-em-2026-por-preocupacoes-com-seguranca-da-ia.shtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"CNN","pais":"Estados Unidos","titulo":"O presidente dos EUA, Donald Trump, chega à Irlanda","resumo":"O ex-presidente dos Estados Unidos desembarcou na Irlanda para cumprir uma série de compromissos diplomáticos e pessoais.\nA visita mobilizou um forte esquema de segurança e atraiu grande atenção da imprensa internacional para a região.\nAlém da agenda política, a viagem gerou debates econômicos sobre o impacto de seus empreendimentos locais no país.","link":"https://www.cnn.com/2026/09/13/politics/video/u-s-president-donald-trump-ireland-trip-julia-benbrook-liam-kennedy-live-091203aseg3cnni-politics-fast?cid=external-feeds_iluminar_google","categoria":"INTERNACIONAL","lang":"pt"},{"fonte":"Devdiscourse","pais":"Estados Unidos","titulo":"Alerta de Obama sobre IA: Urgência por reforma na governança","resumo":"O ex-presidente Barack Obama destacou a necessidade urgente de novas diretrizes globais para regular o avanço da inteligência artificial.\nSegundo o líder, a velocidade do desenvolvimento tecnológico exige uma resposta governamental coordenada para proteger empregos e a democracia.\nO alerta reforça o debate internacional sobre a implementação de normas éticas e limites para a inovação digital.","link":"https://www.devdiscourse.com/article/politics/3976490-obamas-ai-warning-urgency-for-governance-reform","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"The Washington Post","pais":"Estados Unidos","titulo":"Principais líderes de IA se unem para alertar que a tecnologia está avançando rápido demais","resumo":"Executivos e pesquisadores renomados do setor de IA assinaram uma declaração conjunta alertando sobre a evolução descontrolada da tecnologia.\nO grupo defende que os modelos atuais progridem em um ritmo superior à capacidade de auditoria e segurança da sociedade.\nA mobilização busca pressionar governos e empresas por protocolos rigorosos de mitigação de riscos operacionais.","link":"https://www.washingtonpost.com/technology/2026/09/12/anthropic-ceo-dario-amodei-calls-ai-industry-slow-down/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Science Daily","pais":"Estados Unidos","titulo":"As nuvens amarelas claras de Vênus podem esconder algo surpreendentemente sombrio","resumo":"Pesquisadores identificaram que a atmosfera venusiana abriga compostos químicos desconhecidos que absorvem luz ultravioleta de forma atípica.\nA descoberta levanta hipóteses sobre reações exóticas e reacende a discussão científica sobre a possibilidade de vida microbiológica nas nuvens.\nOs dados coletados impulsionam o planejamento de novas missões espaciais voltadas à exploração do planeta vizinho.","link":"https://www.sciencedaily.com/releases/2026/09/260912220022.htm","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Maui Now","pais":"Estados Unidos","titulo":"Hawaiʻi Community College recebe bolsa de US$ 920.000 da NSF para programa de sensores em drones","resumo":"A instituição de ensino no Havaí obteve um financiamento expressivo da National Science Foundation para pesquisas com veículos aéreos não tripulados.\nO projeto é focado no desenvolvimento de sensores de alta precisão para aprimorar a navegação autônoma em diversas aplicações.\nA verba também será destinada à capacitação técnica de estudantes locais para atender à crescente demanda da indústria de tecnologia.","link":"https://mauinow.com/2026/09/12/hawai%CA%BBi-community-college-awarded-920000-national-science-foundation-grant-for-drone-sensors-program/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Politico","pais":"Estados Unidos","titulo":"Líderes de IA apoiam desaceleração no desenvolvimento de tecnologia de risco","resumo":"Desenvolvedores de destaque declararam suporte a uma pausa temporária no avanço dos sistemas mais complexos de inteligência artificial.\nA proposta visa garantir tempo hábil para a formulação de testes de segurança mais rigorosos e normas de contenção de danos.\nA iniciativa reflete uma preocupação crescente da comunidade científica com os impactos éticos e existenciais da automação.","link":"https://www.politico.com/news/2026/09/12/anthropic-ceo-dario-amodei-seeks-immediate-slowdown-artificial-intelligence-01073519","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Popular Science","pais":"Estados Unidos","titulo":"3 mitos sobre o clima","resumo":"Uma recente análise meteorológica desmistifica crenças populares amplamente difundidas sobre padrões climáticos e fenômenos atmosféricos.\nEspecialistas esclarecem os conceitos científicos por trás de eventos extremos, corrigindo interpretações equivocadas do público geral.\nO estudo ressalta a importância do letramento científico para a compreensão das reais mudanças no clima global.","link":"https://www.popsci.com/environment/3-myths-about-the-weather/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"AEROIN","pais":"Estados Unidos","titulo":"Drone Lumberjack da Northrop demonstra uso de tecnologia quântica para navegação aérea em missões de combate","resumo":"A Northrop Grumman testou com sucesso o drone Lumberjack utilizando sensores quânticos capazes de operar sem depender do sinal de GPS.\nA inovação permite manter a precisão de voo e o cumprimento de missões mesmo sob forte interferência eletromagnética de adversários.\nO feito representa um avanço estratégico importante na integração da física quântica em sistemas de defesa autônomos.","link":"https://aeroin.net/drone-lumberjack-da-northrop-demonstra-uso-de-tecnologia-quantica-para-navegacao-aerea-em-missoes-avancadas-de-combate/?amp=1","categoria":"TECNOLOGIA MILITAR","lang":"pt"},{"fonte":"Le Progrès","pais":"França","titulo":"Ciência: Graças ao telescópio espacial James Webb, quatro astrônomos de Lyon buscam nossas origens","resumo":"Quatro astrônomos de Lyon estão utilizando dados inéditos obtidos pelo Telescópio Espacial James Webb para investigar as primeiras fases de formação do universo.\nAs observações de alta precisão revelam detalhes sobre galáxias primordiais e a evolução estelar antiga.\nEssa pesquisa contribui significativamente para desvendar mistérios sobre a origem de estruturas cósmicas complexas.\nO estudo coloca a ciência astronômica francesa em destaque no cenário da exploração espacial internacional.","link":"https://www.leprogres.fr/education/2026/09/13/grace-au-telescope-spatial-james-webb-quatre-astronomes-lyonnais-sont-en-quete-de-nos-origines","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Futura, le média qui explore le monde","pais":"França","titulo":"Acreditava-se que sujar as mãos fazia mal à saúde: a ciência conta uma história mais detalhada","resumo":"Pesquisas científicas recentes revelam que o contato controlado com micro-organismos do ambiente e da terra pode fortalecer o sistema imunológico humano.\nO conceito tradicional de higienização extrema está sendo reavaliado em favor de uma exposição microbiológica benéfica.\nEstudos indicam que a interação natural com a sujeira diminui o risco de alergias e doenças autoimunes.\nEssa nova perspectiva promove uma abordagem equilibrada sobre saúde, imunidade e hábitos de higiene.","link":"https://www.futura-sciences.com/sante/actualites/microbiotes-on-croyait-salir-mains-etait-mauvais-sante-science-raconte-histoire-plus-nuancee-137682/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"La Tribune","pais":"França","titulo":"Antoine de Saint-Affrique, CEO da Danone: “40% dos nossos gastos em P\u0026D estão concentrados na França, apostamos no futuro do país”","resumo":"O CEO da Danone reafirmou o compromisso da multinacional com a inovação ao concentrar 40% de seus investimentos em Pesquisa e Desenvolvimento na França.\nA estratégia visa impulsionar avanços na tecnologia de alimentos, nutrição e sustentabilidade na cadeia produtiva.\nOs centros de pesquisa locais focam em soluções biotecnológicas para produtos mais saudáveis e eficientes.\nA iniciativa reforça a posição da França como um polo estratégico para o desenvolvimento científico global da empresa.","link":"https://www.latribune.fr/article/la-tribune-dimanche/dimanche-eco/31987102241375/antoine-de-saint-affrique-directeur-general-de-danone-40-de-nos-depenses-en-r-d-sont-concentrees-en-france-nous-parions-sur-lavenir-du-pays","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Presse Agence","pais":"França","titulo":"Impressão 3D: Tecnologia inédita faz 'crescer' rubis no coração da platina","resumo":"Engenheiros desenvolveram uma técnica revolucionária de impressão 3D capaz de sintetizar rubis no interior de estruturas de platina.\nEssa inovação em ciência dos materiais permite a fabricação de componentes híbridos com propriedades mecânicas e térmicas excepcionais.\nAs aplicações potenciais abrangem desde a indústria aeroespacial de alta precisão até a relojoaria de luxo.\nA descoberta representa um marco no avanço do manufaturamento aditivo avançado e síntese de minerais.","link":"https://presseagence.fr/bristol-impression-3d-une-technologie-inedite-fait-pousser-des-rubis-au-coeur-du-platine/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Presse Agence","pais":"França","titulo":"Economia circular: Reuse Advisor lança IA para mapear atores da reutilização","resumo":"A startup Reuse Advisor lançou uma plataforma baseada em inteligência artificial focada em otimizar a economia circular em Paris.\nA tecnologia mapeia empresas, cooperativas e iniciativas voltadas para a reutilização de materiais e reciclagem industrial.\nAo integrar dados logísticos e de demanda, a IA facilita conexões estratégicas entre geradores de resíduos e reaproveitadores.\nA solução visa acelerar a transição ecológica e reduzir a pegada de carbono urbana.","link":"https://presseagence.fr/paris-economie-circulaire-reuse-advisor-lance-une-ia-pour-cartographier-les-acteurs-du-reemploi/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"mistral.ai","pais":"França","titulo":"Tornando a IA soberana e de pesos abertos a nova fronteira tecnológica","resumo":"A busca por soberania digital estimula o desenvolvimento de modelos de inteligência artificial de pesos abertos na França e na Europa.\nEssa abordagem permite que governos e empresas locais mantenham controle total sobre seus dados e infraestruturas tecnológicas.\nO movimento visa reduzir a dependência de gigantes digitais estrangeiros e promover ecossistemas de código aberto.\nA estratégia posiciona a IA aberta como o padrão de inovação e segurança para o futuro digital do país.","link":"https://mistral.ai/news/mistral-makes-sovereign-open-weight-ai-to-frontier/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"France 24","pais":"França","titulo":"Chefe da Anthropic pede para 'desacelerar' o desenvolvimento da IA: em quais casos a tecnologia foi mal utilizada?","resumo":"O líder da empresa de inteligência artificial Anthropic alertou publicamente sobre a necessidade de desacelerar o ritmo de desenvolvimento dos modelos mais avançados.\nO alerta aborda preocupações éticas sobre o uso indevido de tecnologias em desinformação, ciberataques e manipulação digital.\nEspecialistas e reguladores globais discutem o estabelecimento de limites de segurança antes do lançamento de novas versões.\nO debate reforça o apelo por governança rigorosa sobre o progresso acelerado da inteligência artificial.","link":"https://www.france24.com/es/ciencia-y-tecnolog%C3%ADas/20260912-jefe-de-anthropic-urge-a-desacelerar-desarrollo-de-ia-en-qu%C3%A9-casos-su-tecnolog%C3%ADa-fue-mal-utilizada","categoria":"REGULAMENTAÇÃO","lang":"pt"},{"fonte":"Europe 1","pais":"França","titulo":"Anti-rugas: O que realmente funciona de acordo com a ciência","resumo":"Dermatologistas e pesquisadores analisaram rigorosamente a eficácia dos tratamentos dermatológicos mais populares do mercado.\nEstudos científicos comprovam que apenas compostos específicos, como retinóides e protetor solar de amplo espectro, possuem eficácia clínica comprovada contra o envelhecimento precoce.\nMuitos produtos cosméticos de alto custo carecem de evidências sólidas sobre a absorção profunda na pele.\nA revisão orienta os consumidores com base em evidências médicas concretas e biologia cutânea.","link":"https://www.europe1.fr/sante/anti-rides-ce-qui-fonctionne-vraiment-selon-la-science-1073306","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"'Precisamos desacelerar o ritmo': CEO da Anthropic pede desaceleração da IA","resumo":"O CEO da Anthropic fez um alerta contundente sobre os riscos do avanço acelerado da inteligência artificial, defendendo uma desaceleração no desenvolvimento de modelos mais potentes.\nA declaração reflete a crescente preocupação do setor de tecnologia com a segurança, alinhamento ético e possíveis impactos catastróficos.\nO debate ganha força à medida que governos e empresas buscam estabelecer diretrizes rígidas para a governança global da IA.","link":"https://www.theguardian.com/technology/2026/sep/12/we-must-slow-the-pace-ceo-of-anthropic-calls-for-an-ai-slowdown","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"e-global.pt","pais":"Inglaterra","titulo":"União Europeia aposta na captura de carbono apesar das dúvidas sobre a tecnologia","resumo":"A União Europeia está intensificando seus investimentos em tecnologias de captura e armazenamento de carbono para atingir metas climáticas rigorosas.\nNo entanto, especialistas e críticos continuam a questionar a viabilidade econômica e a eficácia dessa solução em grande escala.\nO impasse evidencia os desafios do bloco em equilibrar a inovação tecnológica sustentável com os altos custos e riscos de implementação.","link":"https://e-global.pt/noticias/mundo/europa/ue-aposta-na-captura-de-carbono-apesar-das-duvidas-sobre-a-tecnologia/","categoria":"TECNOLOGIA CLIMÁTICA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"IA pode estar prejudicando as perspectivas de emprego para formados em ciência da computação, mostram dados do Reino Unido","resumo":"Dados recentes do Reino Unido revelam que o avanço da inteligência artificial pode estar afetando negativamente a contratação de recém-formados em ciência da computação.\nA automação de tarefas básicas de programação reduziu a demanda por cargos de nível inicial nas empresas de tecnologia.\nO cenário acende um alerta sobre a necessidade de reestruturação curricular nos cursos superiores para adaptar os estudantes às novas exigências do mercado.","link":"https://www.theguardian.com/education/2026/sep/12/ai-computer-science-graduates-job-prospects-uk-data","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"OkDiario","pais":"Espanha","titulo":"Paleontólogos continuam perplexos: um dinossauro do Cretáceo de Castellón sofreu de uma infecção bacteriana","resumo":"Paleontólogos descobriram evidências inéditas de uma infecção bacteriana grave nos fósseis de um dinossauro encontrado em Castellón, Espanha.\nO achado revelou marcas ósseas profundas que indicam como o sistema imunológico do animal tentou combater a doença há milhões de anos.\nA pesquisa fornece novas perspectivas sobre as patologias que afetavam a fauna pré-histórica e como as infecções evoluíram ao longo da história.","link":"https://okdiario.com/ciencia/paleontologos-siguen-atonitos-dinosaurio-del-cretacico-castellones-padecio-infeccion-bacteriana-lo-descubren-gracias-bulto-hallado-uno-sus-huesos-20208650","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Investing.com España","pais":"Espanha","titulo":"Coreia do Sul amplia lei de espionagem para proteger tecnologia de chips","resumo":"A Coreia do Sul aprovou a ampliação de suas leis de espionagem industrial para reforçar a proteção de tecnologias críticas de semicondutores.\nA medida visa coibir o vazamento de segredos comerciais estratégicos para empresas e governos estrangeiros em meio à crescente rivalidade global.\nCom punições mais severas, o país busca manter seu protagonismo global na fabricação de chips de alta tecnologia.","link":"https://es.investing.com/news/economy-news/corea-del-sur-amplia-su-ley-de-espionaje-para-proteger-la-tecnologia-de-chips-3832550","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"La Vanguardia","pais":"Espanha","titulo":"TCL consegue colocar “papel” dentro de uma tela AMOLED: assim funciona a tecnologia dos seus novos celulares P80","resumo":"A TCL apresentou uma nova evolução em suas telas com a tecnologia Nxtpaper integrada a painéis AMOLED nos novos smartphones P80.\nO avanço promete simular a textura e o conforto visual do papel impresso sem comprometer as cores vivas e o contraste profundo dos displays avançados.\nA inovação visa reduzir a fadiga ocular dos usuários e estabelece um novo padrão para o consumo de mídias em dispositivos móveis.","link":"https://www.lavanguardia.com/neo/gadgets/20260913/11630881/tcl-conseguido-meter-papel-pantalla-amoled-asi-funciona-tecnologia-nuevos-moviles-p80.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"eldebate.com","pais":"Espanha","titulo":"A descoberta da NASA em Marte que traria novas pistas sobre seu passado com água: «Nos deixou sem fôlego»","resumo":"Cientistas da NASA identificaram estruturas geológicas em Marte que sugerem a presença prolongada de água líquida na superfície no passado remoto.\nAs imagens capturadas por rovers revelam formações sedimentares complexas que desafiam as antigas teorias sobre o clima marciano.\nA equipe celebrou o achado como um marco crucial para a busca de indícios de vida antiga no planeta vermelho.","link":"https://www.eldebate.com/ciencia/20260913/hallazgo-nasa-marte-daria-nuevas-pistas-sobre-pasado-agua-dejo-aliento_458107.html","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"eldebate.com","pais":"Espanha","titulo":"NASA aponta as áreas da Espanha que podem se tornar inabitáveis dentro de 30 anos","resumo":"Um relatório recente da NASA destacou regiões no sul e leste da Espanha que correm o risco de se tornarem inabitáveis nas próximas três décadas.\nA combinação de secas severas, ondas de calor extremo e desertificação acelerada ameaça transformar a infraestrutura e o modo de vida local.\nO estudo faz um alerta urgente sobre a necessidade de adaptação climática e mitigação dos impactos ambientais no continente europeu.","link":"https://www.eldebate.com/ciencia/20260913/nasa-senala-zonas-espana-podrian-inhabitables-dentro-30-anos-cns_457388.html","categoria":"CLIMA","lang":"pt"},{"fonte":"Hosteltur","pais":"Espanha","titulo":"AeroSHARK: a tecnologia inspirada em tubarões que economiza combustível no transporte aéreo","resumo":"A tecnologia AeroSHARK utiliza uma película especial inspirada na pele de tubarões para revestir a fuselagem de aeronaves comerciais.\nEssa estrutura microscópica reduz o atrito com o ar durante o voo, permitindo uma economia significativa de combustível de aviação.\nO projeto de biomimética já está sendo testado por companhias aéreas para diminuir a pegada de carbono do setor.","link":"https://www.hosteltur.com/178552_aeroshark-la-tecnologia-inspirada-en-tiburones-que-ahorra-combustible-al-transporte-aereo.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"eldebate.com","pais":"Espanha","titulo":"Anthropic pede frenagem no avanço da IA para reduzir riscos: «Temos a obrigação de tentar»","resumo":"A Anthropic publicou um apelo global pedindo o desaceleramento temporário no desenvolvimento de modelos avançados de inteligência artificial.\nA empresa argumenta que os riscos associados à autonomia descontrolada da IA exigem protocolos de segurança mais rígidos antes de novos avanços.\nA iniciativa gerou forte debate entre líderes de tecnologia e reguladores sobre os limites éticos do setor.","link":"https://www.eldebate.com/ciencia/20260912/anthropic-pide-frenar-avance-ia-reducir-riesgos-tenemos-obligacion-intentarlo_458130.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Cadena SER","pais":"Espanha","titulo":"Google Maps, ChatGPT e a memória externalizada: como a tecnologia está mudando nossa forma de pensar","resumo":"O uso diário de ferramentas como Google Maps e ChatGPT está transformando a cognição humana e alterando a maneira como retemos informações.\nPesquisadores alertam que a constante externalização da memória para dispositivos digitais reduz o esforço mental exigido para navegação e síntese.\nPor outro lado, essa transição libera espaço mental para tarefas criativas, redefinindo nossa relação diária com o conhecimento.","link":"https://cadenaser.com/nacional/2026/09/12/google-maps-chatgpt-y-la-memoria-externalizada-como-la-tecnologia-esta-cambiando-nuestra-forma-de-pensar-cadena-ser/","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Spektrum der Wissenschaft","pais":"Alemanha","titulo":"O Mundo das Fórmulas de Freistetter: Um Antitelefone de Tachyons Permite Chamadas do Futuro","resumo":"O conceito teórico do antitelefone de tachyons explora os limites da teoria da relatividade e a causalidade na física.\nAo postular partículas hipotéticas que viajam mais rápido que a luz, demonstra-se como seria possível enviar dados ao passado.\nEssa experiência de pensamento desafia nossa percepção tradicional do tempo e levanta debates profundos sobre paradoxos.\nO estudo reforça como ideias de fronteira ajudam a testar a solidez dos modelos científicos atuais.","link":"https://www.spektrum.de/kolumne/tachyonen-ein-antitelefon-ruft-aus-der-zukunft-an/2343716","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"T-Online","pais":"Alemanha","titulo":"Notícias dos EUA: Empresas Americanas Alertam Que Conflito no Irã Pode Aumentar Custos de Compras","resumo":"Grandes corporações norte-americanas emitiram alertas sobre os impactos econômicos derivados de conflitos envolvendo o Irã.\nAs empresas destacam que a instabilidade geopolítica afeta diretamente o fluxo logístico e o comércio internacional.\nComo consequência, a alta nos custos de suprimentos e transporte promete elevar o preço final de diversos produtos.\nO cenário gera incertezas sobre o comportamento da inflação global e o consumo nos próximos meses.","link":"https://www.t-online.de/nachrichten/ausland/internationale-politik/id_101428114/trumps-iran-krieg-rekordpreis-fuer-diesel-belastet-us-konzerne.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"T-Online","pais":"Alemanha","titulo":"Gênio com Imperfeições: Biografia Revela as Dúvidas de Einstein Por Trás das Fórmulas Famosas","resumo":"Uma nova biografia revela as incertezas e o lado humano de Albert Einstein durante a criação de suas teorias.\nO livro mostra que o físico enfrentava fortes dúvidas pessoais e revisões constantes por trás de suas fórmulas icônicas.\nA narrativa desmistifica a figura do gênio infalível, mostrando um processo criativo repleto de hesitações.\nA obra oferece uma perspectiva renovada sobre como o questionamento contínuo impulsionou a física moderna.","link":"https://www.t-online.de/ratgeber/leben-und-freizeit/hobbys/id_101410370/einstein-diese-biografie-verbindet-lebensgeschichte-und-wissenschaft.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"PZ-news","pais":"Alemanha","titulo":"VW Registra Mais de 30.000 Encomendas para o E-Polo","resumo":"A Volkswagen anunciou ter superado a marca de 30 mil encomendas para o novo modelo elétrico E-Polo.\nO alto volume de reservas demonstra a forte aceitação do público por veículos elétricos compactos e acessíveis.\nO resultado representa um avanço significativo para a estratégia da montadora na transição da mobilidade sustentável.\nO desempenho comercial do modelo sinaliza o aquecimento do mercado automotivo de emissão zero na Europa.","link":"https://www.pz-news.de/wirtschaft/wirtschaft-weltweit_artikel,-VW-meldet-mehr-als-30000-Bestellungen-fuer-E-Polo-_arid,2368329.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"FX | 株式市場 | ファイナンス | 金融ニュース","pais":"Japão","titulo":"Coreia do Sul expande lei de espionagem para proteger tecnologia de semicondutores","resumo":"A Coreia do Sul aprovou a expansão de suas leis de espionagem visando fortalecer a proteção do seu setor de semicondutores contra vazamentos e espionagem industrial. A medida busca blindar segredos comerciais cruciais para a economia nacional diante do acirramento da competição tecnológica global. Com as novas regras, penalidades mais severas serão aplicadas a violações que envolvam o roubo de tecnologias estratégicas por entidades estrangeiras.","link":"https://jp.investing.com/news/economy-news/article-1678384","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"Universidade de Okayama tem 20 projetos selecionados pelo programa 'AI for Science' do MEXT","resumo":"A Universidade de Okayama teve 20 propostas selecionadas no projeto de pesquisa 'AI for Science' impulsionado pelo Ministério da Educação, Cultura, Esportes, Ciência e Tecnologia do Japão. A iniciativa visa integrar o uso de inteligência artificial de ponta em pesquisas científicas para acelerar descobertas e fortalecer a capacidade acadêmica. O projeto consolida a posição do Japão no fomento à inovação tecnológica aplicada a diversas áreas do conhecimento.","link":"https://prtimes.jp/main/html/rd/p/000004226.000072793.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"上观新闻","pais":"China","titulo":"Diretor do Laboratório de IA de Xangai: A pesquisa científica é a próxima programação","resumo":"O diretor do Laboratório de Inteligência Artificial de Xangai, Zhou Bowen, destacou o papel transformador da IA na ciência contemporânea. Segundo o especialista, os modelos de IA estão redefinindo metodologias de pesquisa ao automatizar a análise de dados e hipóteses complexas. A convergência entre inteligência artificial e ciência fundamental é vista como a nova fronteira da inovação tecnológica. Essa mudança de paradigma deve acelerar descobertas em diversas áreas do conhecimento humano.","link":"https://www.jfdaily.com/news/detail?id=1175891","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"新浪网","pais":"China","titulo":"Investidores analisam a nova economia de IA: Coexistência de bolhas e inovação com inteligência incorporada aguardando ponto de virada","resumo":"Investidores em tecnologia debatem o momento atual da inteligência artificial, destacando o equilíbrio entre especulação financeira e avanços reais. Embora o setor enfrente incertezas de mercado, o desenvolvimento da inteligência incorporada e robótica continua avançando. Especialistas apontam que a tecnologia ainda aguarda um ponto de inflexão decisivo para alcançar adoção em massa. O cenário exige cautela estratégica para sustentar a inovação de longo prazo.","link":"https://finance.sina.cn/stock/jdts/2026-09-13/detail-inirscyh5670671.d.html?oid=800\u0026vt=4\u0026cid=76993\u0026node_id=76993","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"21财经","pais":"China","titulo":"Robô criado por doutor de Tsinghua começa a trabalhar em hotéis","resumo":"Um robô de serviço desenvolvido por especialistas formados na prestigiada Universidade Tsinghua foi introduzido no setor hoteleiro. A inovação combina robótica avançada e sistemas inteligentes para realizar tarefas operacionais com alta precisão e eficiência. A iniciativa reflete o crescimento da automação no setor de serviços e o impacto comercial da pesquisa acadêmica chinesa. A solução demonstra a transição prática da robótica dos laboratórios para o mercado consumidor.","link":"https://m.21jingji.com/article/20260912/149d9e72c6c75cfa8a9d55c418c7b1f3_zaker.html","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"碳索储能网","pais":"China","titulo":"Tecnologia de armazenamento de energia em fluxo de Suqian impulsiona operação comercial de maior plataforma de testes do país","resumo":"Uma nova tecnologia de armazenamento de energia por bateria de fluxo orgânico aquoso atingiu níveis de liderança internacional na China. O sistema passou a integrar a maior plataforma de testes de novos armazenamentos do país para operação comercial. A inovação melhora a eficiência do ajuste conjunto entre energia térmica e armazenamento de energia limpa. O avanço fortalece a infraestrutura nacional voltada para a transição energética e sustentabilidade.","link":"https://mcn.solarbe.com/news/20260913/50029013.html","categoria":"ENERGIA","lang":"pt"},{"fonte":"新华网","pais":"China","titulo":"Tecnologia BeiDou capacita áreas montanhosas do sudoeste da China a resolver 'ilhas de informação' em pequenas hidrelétricas","resumo":"O sistema de navegação por satélite BeiDou está sendo aplicado para integrar a infraestrutura de pequenas usinas hidrelétricas em regiões remotas. A tecnologia supera barreiras geográficas e elimina isolamentos de comunicação nas montanhas do sudoeste chinês. O monitoramento em tempo real melhora a gestão hídrica, a segurança operacional e a eficiência energética regional. A iniciativa demonstra como o sistema de satélites impulsiona o desenvolvimento de infraestruturas rurais.","link":"https://www.news.cn/tech/20260912/158eea3ff13f427e919570f6e642231d/c.html","categoria":"TECNOLOGIA SATELITAL","lang":"pt"},{"fonte":"OkDiario","pais":"China","titulo":"Ciência confirma: China reduz 98% de poluentes específicos em 12 anos","resumo":"Estudos científicos recentes confirmam o sucesso expressivo das políticas de controle ambiental implementadas pela China na última década. O país conseguiu erradicar cerca de 98% de focos severos de poluição atmosférica em apenas 12 anos. As ações combinaram regulamentações rígidas, transição para energias renováveis e monitoramento tecnológico de ponta. Os resultados servem como modelo global para mitigação rápida de poluição em áreas altamente industrializadas.","link":"https://okdiario.com/ciencia/nadie-lo-vio-venir-pero-ciencia-lo-reafirma-china-fulmina-12-anos-98-contaminacion-capital-16120833","categoria":"CIÊNCIA AMBIENTAL","lang":"pt"},{"fonte":"TV BRICS","pais":"China","titulo":"Chile e China criam fazenda demonstrativa de tecnologia agrícola chinesa","resumo":"Chile e China estabeleceram uma parceria bilateral para implantar uma fazenda demonstrativa focada em tecnologias agrícolas avançadas. O projeto visa apresentar inovações em irrigação, automação e técnicas de cultivo sustentável desenvolvidas por pesquisadores chineses. A cooperação fortalece os laços de comércio e transferência de tecnologia agrícola entre os dois países. Além de expandir mercados, a iniciativa impulsiona a modernização da agricultura na América Latina.","link":"https://tvbrics.com/pt/news/chile-e-china-criam-fazenda-para-demonstrar-tecnologia-agricola-chinesa/","categoria":"AGRITECH","lang":"pt"},{"fonte":"新浪网","pais":"China","titulo":"Desafio de Inovação AI for Science 2026 é lançado em Pequim","resumo":"Pequim deu início ao Desafio de Inovação AI for Science 2026, focado na aplicação de IA para pesquisas científicas. O evento reúne pesquisadores, desenvolvedores e startups para propor soluções inovadoras em áreas estratégicas. A competição busca impulsionar a convergência entre algoritmos avançados e métodos de investigação científica clássicos. O projeto reafirma a ambição da China em liderar a transformação digital nas ciências fundamentais.","link":"https://k.sina.com.cn/article_5952915720_162d2490806704tsb0.html?from=tech","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"Índia se junta a 24 países em iniciativa global sobre tecnologia 6G","resumo":"A Índia formalizou sua participação em uma aliança global composta por 24 países com o objetivo de impulsionar a pesquisa e o desenvolvimento da tecnologia 6G.\nA iniciativa busca estabelecer padrões internacionais de conectividade, segurança e infraestrutura para a próxima geração de redes móveis.\nCom isso, o país pretende liderar a inovação tecnológica global e acelerar sua transformação digital nos próximos anos.","link":"https://newsonair.gov.in/india-joins-24-countries-in-global-initiative-on-6g-technology/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Hindustan Times","pais":"Índia","titulo":"O preço de não possuir tecnologia própria","resumo":"O artigo analisa os riscos e impactos econômicos para a Índia por depender de infraestruturas e patentes tecnológicas estrangeiras em setores cruciais.\nA falta de soberania tecnológica pode comprometer a segurança nacional, além de encarecer a inovação local em comparação a potências globais.\nFortalecer a pesquisa interna e criar ecossistemas de inovação próprios surge como prioridade estratégica urgente para o futuro do país.","link":"https://www.hindustantimes.com/ht-insight/future-tech/the-price-of-not-owning-technology-101789275939210.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"ThePrint","pais":"Índia","titulo":"A ciência pode ser a ponte entre a Índia e a China que a diplomacia não conseguiu construir","resumo":"A cooperação científica e tecnológica surge como uma alternativa viável para aliviar as tensões geopolíticas históricas entre a Índia e a China.\nParcerias em pesquisas sobre mudanças climáticas, saúde pública e exploração espacial podem criar canais contínuos de diálogo entre as duas nações.\nA abordagem pragmática focada na ciência tem o potencial de gerar confiança mútua onde as negociações diplomáticas tradicionais estagnaram.","link":"https://theprint.in/opinion/science-india-china-diplomacy/3041387/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Indian Express","pais":"Índia","titulo":"Nos Esports, a padronização olímpica de hardware é um divisor de águas","resumo":"A introdução de padrões de hardware no estilo olímpico promete transformar o cenário competitivo dos esportes eletrônicos ao garantir igualdade de condições para os atletas.\nA medida visa eliminar vantagens desleais decorrentes de variações técnicas nos equipamentos utilizados durante os campeonatos globais.\nEssa regulamentação é vista como um passo decisivo para a consolidação formal dos Esports como modalidade olímpica nos próximos anos.","link":"https://indianexpress.com/article/sports/in-esports-olympic-standardisation-of-hardware-a-game-changer-10875933/","categoria":"ESPORTS","lang":"pt"},{"fonte":"SÁBADO","pais":"Índia","titulo":"Líderes mundiais dos BRICS reúnem-se em Nova Deli para discutir comércio, investimento e conflitos globais","resumo":"Representantes das nações integrantes do bloco BRICS se reuniram em Nova Deli para tratar de estratégias econômicas, facilitação de comércio e cooperação financeira mútua.\nAs conversas abordaram o impacto das instabilidades geopolíticas atuais sobre as cadeias globais de suprimento e o comércio entre emergentes.\nA cúpula busca reforçar a influência do bloco no cenário internacional e incentivar transações em moedas locais.","link":"https://www.sabado.pt/video/amp/lideres-mundiais-dos-brics-reunem-se-em-nova-deli-para-discutir-comercio-investimento-e-conflitos-globais","categoria":"DIPLOMACIA","lang":"pt"},{"fonte":"TV BRICS","pais":"Índia","titulo":"Índia se tornou a economia de crescimento mais rápido do mundo, segundo ministro","resumo":"Segundo declarações de autoridades governamentais, a Índia alcançou o posto de economia de maior expansão global, impulsionada por fortes investimentos em infraestrutura e inovação.\nO desempenho de destaque reflete o avanço nos setores industrial, de serviços e na crescente digitalização do mercado consumidor indiano.\nO crescimento contínuo consolida o país como um dos principais motores do desenvolvimento econômico mundial nos últimos anos.","link":"https://tvbrics.com/es/news/india-se-convirtio-en-la-economia-de-mas-rapido-crecimiento-del-mundo-segun-un-ministro/","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Investing.com India","pais":"Índia","titulo":"Coreia do Sul expande lei de espionagem para proteger tecnologia de semicondutores","resumo":"A Coreia do Sul atualizou sua legislação de espionagem para endurecer as penas contra o vazamento e roubo de segredos industriais no setor de semicondutores.\nA medida visa proteger a propriedade intelectual do país em meio à acirrada corrida tecnológica global e às crescentes ameaças cibernéticas.\nO fortalecimento jurídico reflete a importância estratégica dos microchips para a segurança econômica e a competitividade nacional sul-coreana.","link":"https://in.investing.com/news/economy-news/south-korea-expands-espionage-law-to-protect-chip-technology-5590838","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Dinheiro Vivo","pais":"Portugal","titulo":"Energia verde 30% mais barata e 98% de fibra: os trunfos de Portugal na corrida para a IA, segundo a McKinsey","resumo":"De acordo com um estudo recente da consultoria McKinsey, Portugal apresenta vantagens competitivas decisivas para se posicionar como um polo global de infraestrutura de inteligência artificial.\nO país conta com energia renovável cerca de 30% mais barata do que a média europeia e uma cobertura de fibra ótica de 98% do território.\nEstes fatores atraem investidores e impulsionam a construção de novos centros de dados sustentáveis na região.","link":"http://dinheirovivo.dn.pt/economia/energia-verde-30-mais-barata-e-98-de-fibra-os-trunfos-de-portugal-na-corrida-ia-para-a-mckinsey","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"SÁBADO","pais":"Portugal","titulo":"Pesquisa com participação portuguesa desenvolve enzima devoradora de plástico","resumo":"Cientistas com participação de pesquisadores portugueses desenvolveram uma nova variante enzimática capaz de degradar plásticos sintéticos em tempo recorde.\nA inovação promete revolucionar a reciclagem industrial e reduzir drasticamente a poluição por microplásticos nos ecossistemas marinhos e terrestres.\nO avanço destaca o protagonismo da ciência lusitana no combate às crises ambientais globais.","link":"https://www.sabado.pt/ciencia---saude/detalhe/investigacao-com-cunho-portugues-desenvolve-enzima-devoradora-de-plastico","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"SIC Notícias","pais":"Portugal","titulo":"Nova tecnologia com IA ajuda a prevenir cegueira provocada por glaucoma","resumo":"Uma nova ferramenta baseada em inteligência artificial foi desenvolvida para diagnosticar e monitorar o glaucoma com alta precisão e antecedência.\nA solução analisa exames oculares de forma automatizada, identificando lesões no nervo óptico antes que causem danos irreversíveis.\nO avanço tecnológico promete ampliar o acesso a tratamentos preventivos e evitar a perda de visão em milhares de pacientes.","link":"https://sicnoticias.pt/saude-e-bem-estar/2026-09-12-nova-tecnologia-com-ia-ajuda-a-prevenir-cegueira-provocada-por-glaucoma-f190dbd3","categoria":"SAÚDE E TECNOLOGIA","lang":"pt"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Musk e Altman manifestam apoio a desacelerar o desenvolvimento da inteligência artificial","resumo":"Elon Musk e Sam Altman voltaram a expressar preocupações sobre o ritmo acelerado das pesquisas em inteligência artificial generativa e avançada.\nAmbos os líderes da indústria defendem a criação de diretrizes éticas e mecanismos de segurança reforçados para conter riscos existenciais.\nA postura reflete um debate cada vez mais amplo sobre a regulamentação necessária para conter possíveis impactos sociais e de segurança.","link":"https://www.cmjornal.pt/tecnologia/amp/musk-e-altman-tambem-a-favor-de-abrandar-desenvolvimento-de-inteligencia-artificial","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"ECO","pais":"Portugal","titulo":"Elite de matemáticos alerta para os riscos da inteligência artificial na ciência","resumo":"Um grupo de matemáticos proeminentes emitiu um alerta sobre o uso desmedido de sistemas de inteligência artificial na validação de teorias e produções científicas.\nOs especialistas apontam que falhas e alucinações em algoritmos de aprendizado profundo podem comprometer o rigor metodológico de pesquisas acadêmicas.\nO manifesto pede critérios mais rigorosos de verificação humana no uso de IA para descobertas científicas.","link":"https://eco.sapo.pt/2026/09/12/elote-de-matematicos-alertam-para-riscos-da-inteligencia-artificial-na-ciencia/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"publico.pt","pais":"Portugal","titulo":"Em um ano e meio, Ministério da Educação contratou 30 milhões para tecnologia e reformas","resumo":"O Ministério da Educação de Portugal investiu 30 milhões de euros nos últimos 18 meses em contratos focados na modernização tecnológica e reestruturação administrativa.\nO plano visa acelerar a transição digital nas escolas e otimizar os processos internos da gestão pública de ensino.\nO alto volume de investimentos reflete a priorização de infraestruturas tecnológicas como pilar para o futuro educacional do país.","link":"https://www.publico.pt/2026/09/13/sociedade/noticia/ano-meio-educacao-contratou-30-milhoes-tecnologia-reforma-ministerio-2187686","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"publico.pt","pais":"Portugal","titulo":"Ada Yonath (1939-2026), a dama dos cristais","resumo":"Faleceu Ada Yonath, renomada cristalógrafa e vencedora do Prêmio Nobel de Química por decifrar a estrutura tridimensional dos ribossomos.\nSeus pioneiros estudos em biologia estrutural abriram caminho para a criação de novos antibióticos e revolucionaram a medicina moderna.\nA comunidade científica global presta homenagem ao legado marcante de uma das maiores mentes da ciência contemporânea.","link":"https://www.publico.pt/2026/09/13/ciencia/cronica/ada-yonath-19392026-dama-cristais-2187845","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Destaques da semana: Tecnologia, riqueza e novas experiências","resumo":"O panorama semanal reúne os principais acontecimentos nos setores de inovação tecnológica, mercado financeiro e tendências de consumo digital.\nA análise destaca como a transformação digital contínua molda novos ecossistemas de negócios e hábitos de vida.\nO compilado oferece uma visão estratégica sobre as transformações que estão ditando o ritmo da economia moderna.","link":"https://sapo.pt/artigo/top-of-the-week-tecnologia-riqueza-e-novas-experiencias-6aa5a0dcd98f4c2b51db51f9","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Times Brasil | CNBC","pais":"Brazil","titulo":"Apple Acquires Advanced Technology for Body Signal Detection","resumo":"Apple has acquired a new technology capable of monitoring and interpreting biological signals from the human body.\nThis innovation is expected to be integrated into the brand's future wearable devices, enhancing user health tracking.\nThe initiative reflects the ongoing investment by major tech companies in high-precision biometric sensors.\nThe move could set new standards for the digital health and personal monitoring industry in the coming years.","link":"https://timesbrasil.com.br/empresas-e-negocios/tecnologia-e-inovacao/apple-adquire-tecnologia-que-detecta-sinais-do-cerebro-e-musculos-entenda/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"Meta Tests the Use of Robots to Automate Data Center Operations","resumo":"Meta is testing the use of autonomous robots to manage and perform maintenance in its global data centers.\nThe measure aims to optimize repetitive operational tasks and increase efficiency in supporting its digital infrastructures.\nThe breakthrough signals a strong trend in the tech industry toward automating essential physical processes.\nIf successful, the initiative could reduce operating costs and increase security in the company's data centers.","link":"https://g1.globo.com/tecnologia/noticia/2026/09/12/meta-robos-data-centers.ghtml","categoria":"ROBOTICS","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Altman and Musk Agree with Anthropic CEO on Slowing Down AI Advancement","resumo":"Prominent tech leaders, such as Sam Altman and Elon Musk, have backed a proposal to slow down AI development.\nThe initial warning came from the CEO of Anthropic, who raised serious concerns about the risks of uncontrolled technological advancement.\nThis unusual consensus among fierce rivals highlights rising ethical and safety concerns within the industry.\nThe discussion could drive new global regulatory debates regarding the limits of generative artificial intelligence.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/09/12/rivais-altman-e-musk-dizem-concordar-com-apelo-de-ceo-da-anthropic-para-que-setor-desacelere-ritmo-de-desenvolvimento-da-ia.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"Scientific Study Reveals How the Human Brain Processes Artistic Beauty","resumo":"Researchers have released new findings on the neural networks activated when the brain contemplates works of art.\nThe study demonstrates how different brain areas connected to pleasure and emotion react to aesthetic visual stimuli.\nThese findings help us understand the evolution of human perception and the cultural impact of art on neurobiology.\nThe research opens doors to applying neuroscientific concepts in areas such as design, architecture, and cognitive therapies.","link":"https://www1.folha.uol.com.br/ciencia/2026/09/ciencia-revela-como-o-cerebro-interpreta-a-beleza-artistica.shtml","categoria":"SCIENCE","lang":"en"},{"fonte":"Estadão","pais":"Brazil","titulo":"Viral Social Media Phenomenon: Science Explains Reports on the Luteal Phase","resumo":"A new topic has gone viral on social media with women reporting aesthetic changes during the luteal phase of the menstrual cycle.\nExperts and scientists have clarified the hormonal and biological factors that justify these bodily perceptions.\nThe discussion highlights how digital platforms have served as a space for debates on female physiology and well-being.\nThe phenomenon brings science closer to users' daily lives by demystifying common transformations of the human body.","link":"https://www.estadao.com.br/em-alta/pulsa/autocuidado/viralizou-mulheres-relatam-feiura-da-fase-lutea-o-que-a-ciencia-diz-sobre-o-fenomeno-das-redes/","categoria":"TRENDS","lang":"en"},{"fonte":"Finanças, Câmbio e Investimentos","pais":"Brazil","titulo":"South Korea Strengthens Espionage Laws to Shield Semiconductor Technology","resumo":"South Korea has expanded industrial espionage legislation to protect trade secrets in its chip industry.\nThe decision seeks to curb the leak of critical technologies amid fierce global competition for semiconductors.\nWith this measure, the country reaffirms the strategic importance of electronic components to the economy and national security.\nThe initiative reflects growing international tension surrounding technological sovereignty and the supply chain.","link":"https://br.investing.com/news/economy-news/coreia-do-sul-amplia-lei-de-espionagem-para-proteger-tecnologia-de-chips-2063869","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"notebookcheck.info","pais":"Brazil","titulo":"Colorful Launches High-Performance Gaming Laptop Equipped with AMD Technology","resumo":"Colorful has unveiled its latest gaming laptop, equipped with advanced AMD processors and integrated graphics.\nThe device stands out for supporting up to 128 GB of RAM and the new Radeon 8060S graphics solution.\nTargeted at demanding gamers and content creators, the equipment delivers power for high-demand computational tasks.\nThe launch reinforces competition in the portable hardware market focused on extreme performance and energy efficiency.","link":"https://www.notebookcheck.info/A-Colorful-apresenta-um-notebook-para-jogos-com-tecnologia-AMD-com-ate-128-GB-de-RAM-e-iGPU-Radeon-8060S.1397949.0.html","categoria":"HARDWARE","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"OpenAI Delays 2026 IPO Plans to Focus on Artificial Intelligence Safety","resumo":"OpenAI has decided to scrap plans for an initial public offering (IPO) in 2026.\nCompany leadership stated that the absolute priority right now is researching and ensuring the safety of AI models.\nThe decision reflects a commitment to aligning the startup's growth with the responsible development of new tools.\nThe move signals to the market that the ethical and operational challenges of AI outweigh immediate financial pressures.","link":"https://www1.folha.uol.com.br/mercado/2026/09/openai-afasta-ipo-em-2026-por-preocupacoes-com-seguranca-da-ia.shtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"CNN","pais":"United States","titulo":"U.S. President Donald Trump Arrives in Ireland","resumo":"The former President of the United States has landed in Ireland to fulfill a series of diplomatic and personal commitments.\nThe visit mobilized heavy security and drew major international media attention to the region.\nIn addition to the political agenda, the trip has sparked economic debates regarding the impact of his local business ventures in the country.","link":"https://www.cnn.com/2026/09/13/politics/video/u-s-president-donald-trump-ireland-trip-julia-benbrook-liam-kennedy-live-091203aseg3cnni-politics-fast?cid=external-feeds_iluminar_google","categoria":"INTERNATIONAL","lang":"en"},{"fonte":"Devdiscourse","pais":"United States","titulo":"Obama's AI Warning: Urgency for Governance Reform","resumo":"Former President Barack Obama highlighted the urgent need for new global guidelines to regulate the advancement of artificial intelligence.\nAccording to the leader, the speed of technological development demands a coordinated governmental response to protect jobs and democracy.\nThe warning reinforces the international debate on implementing ethical standards and limits for digital innovation.","link":"https://www.devdiscourse.com/article/politics/3976490-obamas-ai-warning-urgency-for-governance-reform","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"The Washington Post","pais":"United States","titulo":"Top AI Leaders Unite to Warn Technology Is Advancing Too Fast","resumo":"Renowned tech executives and researchers in the AI sector have signed a joint statement warning about the uncontrolled evolution of the technology.\nThe group argues that current models are progressing at a pace that outstrips society's capacity for auditing and safety.\nThe mobilization seeks to pressure governments and companies for rigorous operational risk-mitigation protocols.","link":"https://www.washingtonpost.com/technology/2026/09/12/anthropic-ceo-dario-amodei-calls-ai-industry-slow-down/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Science Daily","pais":"United States","titulo":"Venus's Pale Yellow Clouds May Hide Something Surprisingly Dark","resumo":"Researchers have identified that the Venusian atmosphere harbors unknown chemical compounds that absorb ultraviolet light atypically.\nThe discovery raises hypotheses about exotic reactions and rekindles the scientific discussion regarding the possibility of microbial life in the clouds.\nThe data collected is driving the planning of new space missions aimed at exploring our planetary neighbor.","link":"https://www.sciencedaily.com/releases/2026/09/260912220022.htm","categoria":"ASTRONOMY","lang":"en"},{"fonte":"Maui Now","pais":"United States","titulo":"Hawaiʻi Community College Awarded $920,000 NSF Grant for Drone Sensors Program","resumo":"The educational institution in Hawaii has secured significant funding from the National Science Foundation for research involving unmanned aerial vehicles.\nThe project focuses on developing high-precision sensors to improve autonomous navigation in various applications.\nThe grant will also go toward the technical training of local students to meet the growing demand of the tech industry.","link":"https://mauinow.com/2026/09/12/hawai%CA%BBi-community-college-awarded-920000-national-science-foundation-grant-for-drone-sensors-program/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Politico","pais":"United States","titulo":"AI Leaders Back Slowdown in Developing High-Risk Technology","resumo":"Prominent developers have declared support for a temporary pause in the advancement of more complex artificial intelligence systems.\nThe proposal aims to ensure adequate time for formulating more rigorous safety tests and damage containment norms.\nThe initiative reflects a growing concern within the scientific community regarding the ethical and existential impacts of automation.","link":"https://www.politico.com/news/2026/09/12/anthropic-ceo-dario-amodei-seeks-immediate-slowdown-artificial-intelligence-01073519","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Popular Science","pais":"United States","titulo":"3 Myths About the Weather","resumo":"A recent meteorological analysis debunks widely spread popular beliefs about weather patterns and atmospheric phenomena.\nExperts clarify the scientific concepts behind extreme events, correcting misinterpretations by the general public.\nThe study highlights the importance of scientific literacy for understanding real changes in global climate.","link":"https://www.popsci.com/environment/3-myths-about-the-weather/","categoria":"SCIENCE","lang":"en"},{"fonte":"AEROIN","pais":"United States","titulo":"Lumberjack Drone Demonstrates Use of Quantum Technology for Aerial Navigation in Combat Missions","resumo":"Northrop Grumman successfully tested the Lumberjack drone using quantum sensors capable of operating without relying on the GPS signal. The innovation allows flight precision and mission fulfillment to be maintained even under strong electromagnetic interference from adversaries. The feat represents an important strategic advance in the integration of quantum physics into autonomous defense systems.","link":"https://aeroin.net/drone-lumberjack-da-northrop-demonstra-uso-de-tecnologia-quantica-para-navegacao-aerea-em-missoes-avancadas-de-combate/?amp=1","categoria":"MILITARY TECHNOLOGY","lang":"en"},{"fonte":"Le Progrès","pais":"France","titulo":"Science: Thanks to the James Webb Space Telescope, four astronomers from Lyon search for our origins","resumo":"Four Lyon astronomers are using unprecedented data from the James Webb Space Telescope to investigate the early stages of the universe's formation. High-precision observations reveal details about early galaxies and ancient stellar evolution. This research contributes significantly to unraveling mysteries about the origin of complex cosmic structures. The study places French astronomical science at the forefront of international space exploration.","link":"https://www.leprogres.fr/education/2026/09/13/grace-au-telescope-spatial-james-webb-quatre-astronomes-lyonnais-sont-en-quete-de-nos-origines","categoria":"ASTRONOMY","lang":"en"},{"fonte":"Futura, le média qui explore le monde","pais":"France","titulo":"It was believed that getting your hands dirty was bad for your health: science tells a more detailed story","resumo":"Recent scientific research reveals that controlled contact with microorganisms from the environment and the earth can strengthen the human immune system. The traditional concept of extreme hygiene is being reevaluated in favor of beneficial microbiological exposure. Studies indicate that natural interaction with dirt reduces the risk of allergies and autoimmune diseases. This new perspective promotes a balanced approach to health, immunity and hygiene habits.","link":"https://www.futura-sciences.com/sante/actualites/microbiotes-on-croyait-salir-mains-etait-mauvais-sante-science-raconte-histoire-plus-nuancee-137682/","categoria":"SCIENCE","lang":"en"},{"fonte":"La Tribune","pais":"France","titulo":"Antoine de Saint-Affrique, CEO of Danone: “40% of our R\u0026D spending is concentrated in France, we are betting on the country’s future”","resumo":"Danone's CEO reaffirmed the multinational's commitment to innovation by concentrating 40% of its investments in Research and Development in France. The strategy aims to drive advances in food technology, nutrition and sustainability in the production chain. Local research centers focus on biotechnological solutions for healthier and more efficient products. The initiative reinforces France's position as a strategic hub for the company's global scientific development.","link":"https://www.latribune.fr/article/la-tribune-dimanche/dimanche-eco/31987102241375/antoine-de-saint-affrique-directeur-general-de-danone-40-de-nos-depenses-en-r-d-sont-concentrees-en-france-nous-parions-sur-lavenir-du-pays","categoria":"INNOVATION","lang":"en"},{"fonte":"Presse Agence","pais":"France","titulo":"3D printing: Unprecedented technology makes rubies 'grow' in the heart of platinum","resumo":"Engineers have developed a revolutionary 3D printing technique capable of synthesizing rubies inside platinum structures. This innovation in materials science enables the manufacturing of hybrid components with exceptional mechanical and thermal properties. Potential applications range from high-precision aerospace to luxury watchmaking. The discovery represents a milestone in the advancement of advanced additive manufacturing and mineral synthesis.","link":"https://presseagence.fr/bristol-impression-3d-une-technologie-inedite-fait-pousser-des-rubis-au-coeur-du-platine/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Presse Agence","pais":"France","titulo":"Circular economy: Reuse Advisor launches AI to map reuse actors","resumo":"Startup Reuse Advisor has launched an artificial intelligence-based platform focused on optimizing the circular economy in Paris. The technology maps companies, cooperatives and initiatives aimed at reusing materials and industrial recycling. By integrating logistics and demand data, AI facilitates strategic connections between waste generators and repurposers. The solution aims to accelerate the ecological transition and reduce the urban carbon footprint.","link":"https://presseagence.fr/paris-economie-circulaire-reuse-advisor-lance-une-ia-pour-cartographier-les-acteurs-du-reemploi/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"mistral.ai","pais":"France","titulo":"Making sovereign and open-weight AI the new technological frontier","resumo":"The quest for digital sovereignty stimulates the development of open-weight artificial intelligence models in France and Europe. This approach allows local governments and businesses to maintain full control over their data and technology infrastructures. The move aims to reduce dependence on foreign digital giants and promote open source ecosystems. The strategy positions open AI as the standard of innovation and security for the country's digital future.","link":"https://mistral.ai/news/mistral-makes-sovereign-open-weight-ai-to-frontier/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"France 24","pais":"France","titulo":"Anthropic boss calls to 'slow down' AI development: in which cases has the technology been misused?","resumo":"The leader of the artificial intelligence company Anthropic publicly warned about the need to slow down the pace of development of the most advanced models. The alert addresses ethical concerns about the misuse of technologies in disinformation, cyberattacks and digital manipulation. Global experts and regulators discuss establishing security limits before releasing new versions. The debate reinforces the call for strict governance over the accelerated progress of artificial intelligence.","link":"https://www.france24.com/es/ciencia-y-tecnolog%C3%ADas/20260912-jefe-de-anthropic-urge-a-desacelerar-desarrollo-de-ia-en-qu%C3%A9-casos-su-tecnolog%C3%ADa-fue-mal-utilizada","categoria":"REGULATIONS","lang":"en"},{"fonte":"Europe 1","pais":"France","titulo":"Anti-wrinkle: What really works according to science","resumo":"Dermatologists and researchers have rigorously analyzed the effectiveness of the most popular dermatological treatments on the market. Scientific studies prove that only specific compounds, such as retinoids and broad-spectrum sunscreen, have proven clinical efficacy against premature aging. Many high-cost cosmetic products lack solid evidence about deep absorption into the skin. The review guides consumers based on concrete medical evidence and skin biology.","link":"https://www.europe1.fr/sante/anti-rides-ce-qui-fonctionne-vraiment-selon-la-science-1073306","categoria":"SCIENCE","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"'We need to slow down': Anthropic CEO calls for AI slowdown","resumo":"The CEO of Anthropic gave a blunt warning about the risks of the accelerated advancement of artificial intelligence, defending a slowdown in the development of more powerful models. The statement reflects the technology sector's growing concern about security, ethical alignment and possible catastrophic impacts. The debate is gaining momentum as governments and companies seek to establish strict guidelines for the global governance of AI.","link":"https://www.theguardian.com/technology/2026/sep/12/we-must-slow-the-pace-ceo-of-anthropic-calls-for-an-ai-slowdown","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"e-global.pt","pais":"England","titulo":"European Union bets on carbon capture despite doubts about the technology","resumo":"The European Union is stepping up its investment in carbon capture and storage technologies to meet stringent climate targets. However, experts and critics continue to question the economic viability and effectiveness of this large-scale solution. The impasse highlights the bloc's challenges in balancing sustainable technological innovation with the high costs and risks of implementation.","link":"https://e-global.pt/noticias/mundo/europa/ue-aposta-na-captura-de-carbono-apesar-das-duvidas-sobre-a-tecnologia/","categoria":"CLIMATE TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"AI could be damaging job prospects for computer science graduates, UK data shows","resumo":"Recent data from the United Kingdom reveals that the advancement of artificial intelligence may be negatively affecting the hiring of recent computer science graduates. Automation of basic programming tasks has reduced demand for entry-level roles at technology companies. The scenario raises an alert about the need for curricular restructuring in higher education courses to adapt students to the new market demands.","link":"https://www.theguardian.com/education/2026/sep/12/ai-computer-science-graduates-job-prospects-uk-data","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"OkDiario","pais":"Spain","titulo":"Paleontologists remain perplexed: a Cretaceous dinosaur from Castellón suffered from a bacterial infection","resumo":"Paleontologists have discovered unprecedented evidence of a serious bacterial infection in the fossils of a dinosaur found in Castellón, Spain. The find revealed deep bone markings that indicate how the animal's immune system tried to fight the disease millions of years ago. The research provides new insights into the pathologies that affected prehistoric fauna and how infections evolved throughout history.","link":"https://okdiario.com/ciencia/paleontologos-siguen-atonitos-dinosaurio-del-cretacico-castellones-padecio-infeccion-bacteriana-lo-descubren-gracias-bulto-hallado-uno-sus-huesos-20208650","categoria":"SCIENCE","lang":"en"},{"fonte":"Investing.com España","pais":"Spain","titulo":"South Korea expands spy law to protect chip technology","resumo":"South Korea approved the expansion of its industrial espionage laws to strengthen the protection of critical semiconductor technologies. The measure aims to curb the leakage of strategic trade secrets to foreign companies and governments amid growing global rivalry. With more severe punishments, the country seeks to maintain its global leadership in the manufacture of high-technology chips.","link":"https://es.investing.com/news/economy-news/corea-del-sur-amplia-su-ley-de-espionaje-para-proteger-la-tecnologia-de-chips-3832550","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"La Vanguardia","pais":"Spain","titulo":"TCL manages to put “paper” inside an AMOLED screen: this is how the technology of its new P80 cell phones works","resumo":"TCL presented a new evolution in its screens with Nxtpaper technology integrated into AMOLED panels in the new P80 smartphones. The advancement promises to simulate the texture and visual comfort of printed paper without compromising the vivid colors and deep contrast of advanced displays. The innovation aims to reduce users' eye fatigue and establishes a new standard for media consumption on mobile devices.","link":"https://www.lavanguardia.com/neo/gadgets/20260913/11630881/tcl-conseguido-meter-papel-pantalla-amoled-asi-funciona-tecnologia-nuevos-moviles-p80.html","categoria":"INNOVATION","lang":"en"},{"fonte":"eldebate.com","pais":"Spain","titulo":"NASA's Discovery on Mars Yields New Clues Regarding Its Water-Rich Past: 'Left Us Breathless'","resumo":"NASA scientists have identified geological structures on Mars that suggest the prolonged presence of liquid water on its surface in the distant rover-captured images reveal complex sedimentary formations that challenge long-held theories about the Martian climate. The team celebrated the find as a crucial milestone in the search for signs of ancient life on the Red Planet.","link":"https://www.eldebate.com/ciencia/20260913/hallazgo-nasa-marte-daria-nuevas-pistas-sobre-pasado-agua-dejo-aliento_458107.html","categoria":"ASTRONOMY","lang":"en"},{"fonte":"eldebate.com","pais":"Spain","titulo":"NASA Points Out Areas in Spain That Could Become Uninhabitable Within 30 Years","resumo":"A recent NASA report highlighted regions in southern and eastern Spain at risk of becoming uninhabitable over the next three decades. The combination of severe droughts, extreme heatwaves, and accelerated desertification threatens to transform local infrastructure and ways of life. The study issues an urgent warning regarding the need for climate adaptation and the mitigation of environmental impacts on the European continent.","link":"https://www.eldebate.com/ciencia/20260913/nasa-senala-zonas-espana-podrian-inhabitables-dentro-30-anos-cns_457388.html","categoria":"CLIMATE","lang":"en"},{"fonte":"Hosteltur","pais":"Spain","titulo":"AeroSHARK: The Shark-Inspired Technology Saving Fuel in Air Transport","resumo":"AeroSHARK technology utilizes a special film inspired by shark skin to coat the fuselage of commercial aircraft. This microscopic structure reduces air resistance during flight, enabling significant aviation fuel savings. This biomimetic project is already being tested by airlines to lower the sector's carbon footprint.","link":"https://www.hosteltur.com/178552_aeroshark-la-tecnologia-inspirada-en-tiburones-que-ahorra-combustible-al-transporte-aereo.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"eldebate.com","pais":"Spain","titulo":"Anthropic Urges Braking AI Advancement to Reduce Risks: 'We Have the Obligation to Try'","resumo":"Anthropic has published a global appeal calling for a temporary slowdown in the development of advanced artificial intelligence models. The company argues that risks associated with unregulated AI autonomy require stricter safety protocols before further advances are made. The initiative has sparked intense debate among tech leaders and regulators regarding the sector's ethical boundaries.","link":"https://www.eldebate.com/ciencia/20260912/anthropic-pide-frenar-avance-ia-reducir-riesgos-tenemos-obligacion-intentarlo_458130.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Cadena SER","pais":"Spain","titulo":"Google Maps, ChatGPT, and Externalized Memory: How Technology Is Changing the Way We Think","resumo":"The daily use of tools like Google Maps and ChatGPT is transforming human cognition and altering how we retain information. Researchers warn that the constant offloading of memory to digital devices reduces the mental effort required for navigation and synthesis. On the other hand, this transition frees up mental space for creative tasks, redefining our daily relationship with knowledge.","link":"https://cadenaser.com/nacional/2026/09/12/google-maps-chatgpt-y-la-memoria-externalizada-como-la-tecnologia-esta-cambiando-nuestra-forma-de-pensar-cadena-ser/","categoria":"TRENDS","lang":"en"},{"fonte":"Spektrum der Wissenschaft","pais":"Germany","titulo":"Freistetter's World of Formulas: A Tachyon Antitelephone Enables Calls from the Future","resumo":"The theoretical concept of the tachyon antitelephone explores the limits of relativity theory and causality in physics. By postulating hypothetical particles that travel faster than light, it demonstrates how sending data to the past could theoretically be possible. This thought experiment challenges our traditional perception of time and raises profound debates concerning paradoxes. The study reinforces how frontier ideas help test the soundness of current scientific models.","link":"https://www.spektrum.de/kolumne/tachyonen-ein-antitelefon-ruft-aus-der-zukunft-an/2343716","categoria":"SCIENCE","lang":"en"},{"fonte":"T-Online","pais":"Germany","titulo":"US News: American Companies Warn That Conflict in Iran Could Drive Up Purchasing Costs","resumo":"Major US corporations have issued warnings regarding the economic impacts stemming from conflicts involving Iran. Companies emphasize that geopolitical instability directly affects logistical flows and international trade. Consequently, rising supply and transportation costs promise to drive up the final prices of various goods. This scenario generates uncertainty regarding global inflation trends and consumer spending in the coming months.","link":"https://www.t-online.de/nachrichten/ausland/internationale-politik/id_101428114/trumps-iran-krieg-rekordpreis-fuer-diesel-belastet-us-konzerne.html","categoria":"BUSINESS","lang":"en"},{"fonte":"T-Online","pais":"Germany","titulo":"Flawed Genius: Biography Reveals Einstein's Doubts Behind Famous Formulas","resumo":"A new biography reveals the uncertainties and the human side of Albert Einstein during the formulation of his theories. The book shows that the physicist faced strong personal doubts and underwent constant revisions behind his iconic equations. The narrative demystifies the figure of the infallible genius, showcasing a creative process full of hesitation. The work offers a fresh perspective on how continuous questioning propelled modern physics.","link":"https://www.t-online.de/ratgeber/leben-und-freizeit/hobbys/id_101410370/einstein-diese-biografie-verbindet-lebensgeschichte-und-wissenschaft.html","categoria":"SCIENCE","lang":"en"},{"fonte":"PZ-news","pais":"Germany","titulo":"VW Registers Over 30,000 Orders for the E-Polo","resumo":"Volkswagen has announced that it has surpassed the 30,000-order mark for its new electric model, the E-Polo. This high volume of reservations demonstrates strong public acceptance of compact and affordable electric vehicles. The result represents a significant step forward for the automaker's sustainable mobility strategy. The model's commercial performance signals a warming zero-emission automotive market in Europe.","link":"https://www.pz-news.de/wirtschaft/wirtschaft-weltweit_artikel,-VW-meldet-mehr-als-30000-Bestellungen-fuer-E-Polo-_arid,2368329.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"FX | 株式市場 | ファイナンス | 金融ニュース","pais":"Japan","titulo":"South Korea Expands Espionage Law to Protect Semiconductor Technology","resumo":"South Korea has approved the expansion of its espionage laws to strengthen the protection of its semiconductor sector against leaks and industrial espionage. The measure aims to safeguard trade secrets crucial to the national econom
