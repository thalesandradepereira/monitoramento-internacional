  const data = [{"fonte":"UN News","pais":"Brasil","titulo":"Aposta em tecnologia nuclear quer salvar 1 bilhão de toneladas de comida","resumo":"A utilização de irradiação e tecnologias nucleares na agricultura surge como uma solução inovadora para combater o desperdício global de alimentos.\nA iniciativa busca aumentar a durabilidade dos produtos e eliminar pragas sem comprometer a segurança alimentar ou o valor nutricional.\nEspecialistas projetam que a implementação em larga escala pode evitar a perda de até um bilhão de toneladas de mantimentos por ano.\nEssa abordagem visa fortalecer a segurança alimentar do planeta e mitigar os impactos das mudanças climáticas na produção agrícola.","link":"https://news.un.org/pt/story/2026/10/1854511","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"BBC","pais":"Estados Unidos","titulo":"Trump apresenta 'Força de Superinteligência' para supervisionar política de IA","resumo":"O ex-presidente Donald Trump anunciou a criação da 'Super Intelligence Force' para supervisionar e direcionar a política de IA no país.\nA proposta visa posicionar os Estados Unidos na liderança do desenvolvimento tecnológico global, estabelecendo novas diretrizes de segurança.\nA iniciativa reflete o papel central que a inteligência artificial passou a exercer nas decisões estratégicas e na soberania nacional.","link":"https://www.bbc.com/news/articles/cqj6jenp26zyo","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Le Dauphiné Libéré","pais":"França","titulo":"«A IA ameaça nos isolar socialmente muito mais do que qualquer tecnologia anterior»","resumo":"Especialistas alertam para os riscos crescentes do isolamento social provocados pelo avanço acelerado da inteligência artificial.\nAo contrário de tecnologias anteriores que promoviam alguma interação humana, as novas ferramentas virtuais tendem a substituir relacionamentos reais por interações sintéticas.\nEsse fenômeno gera impactos profundos na saúde mental e nas estruturas comunitárias, exigindo um debate urgente sobre limites éticos e regulação social do uso de sistemas inteligentes no cotidiano.","link":"https://www.ledauphine.com/societe/2026/10/05/l-ia-menace-de-nous-isoler-socialement-bien-plus-qu-aucune-technologie-avant-elle","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Tempo de espera para câncer de pele em Bradford é reduzido por nova tecnologia de IA","resumo":"Um novo sistema baseado em inteligência artificial foi implementado para otimizar o triagem e reduzir o tempo de espera de pacientes com suspeita de câncer de pele em Bradford. Essa inovação tecnológica promete agilizar diagnósticos críticos, aliviando a sobrecarga no sistema de saúde britânico. O impacto direto é a detecção precoce da doença, aumentando significativamente as chances de sucesso no tratamento.","link":"https://www.bbc.com/news/articles/ck5yw5e9pnrzo","categoria":"SAÚDE","lang":"pt"},{"fonte":"Canal Sur","pais":"Espanha","titulo":"\"EnRed\" apresenta trabalhos com tecnologia 3D que dão vida a um navio andaluz único na Europa","resumo":"O programa televisivo destaca a aplicação de tecnologias de impressão e modelagem 3D na reconstrução histórica de uma embarcação medieval única no continente europeu. A iniciativa valoriza o patrimônio cultural regional por meio de ferramentas digitais avançadas, demonstrando o potencial da inovação na arqueologia e preservação de artefatos antigos. O projeto atrai interesse acadêmico e tecnológico ao unir tradição naval e computação gráfica.","link":"https://www.canalsur.es/rtva/comunicacion/enred-presenta-trabajos-tecnologia-3d_1_1440442.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Spektrum der Wissenschaft","pais":"Alemanha","titulo":"Prêmio Nobel de Fisiologia ou Medicina 2026: Quem receberá o Nobel de Medicina?","resumo":"O cobiçado Prêmio Nobel de Fisiologia ou Medicina de 2026 desperta grande expectativa na comunidade científica internacional. Especialistas discutem os principais nomes cotados para a premiação deste ano com base em suas inovações. A descoberta premiada deve moldar o futuro da biomedicina e trazer novos tratamentos para doenças globais.","link":"https://www.spektrum.de/news/medizin-nobelpreis-hintergruende-zur-verleihung-und-erste-prognosen/2345555","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"“O Japão não é fraco”: As chaves para o crescimento econômico na era da IA","resumo":"O artigo discute as perspectivas de revitalização da economia japonesa frente aos desafios impostos pela inteligência artificial.\nEspecialistas analisam os fatores essenciais para que o país recupere seu protagonismo tecnológico e produtivo.\nO impacto dessa transformação é vital para manter a competitividade global da indústria nipônica nos próximos anos.","link":"https://news.yahoo.co.jp/articles/71440a3321fd10f2c35d259252353732f54000b7","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"搜狐网","pais":"China","titulo":"Pequim implementa educação científica 'aprender fazendo' em toda a cidade","resumo":"A cidade de Pequim iniciou a implantação abrangente de diretrizes voltadas para a educação científica com foco prático. A iniciativa busca transformar os métodos tradicionais de ensino nas escolas locais.\nO objetivo é estimular o pensamento crítico e habilidades analíticas nas novas gerações desde cedo.\nEssa medida reforça o compromisso nacional em formar talentos qualificados para impulsionar a inovação tecnológica no futuro.","link":"https://m.sohu.com/a/1084185099_115563?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"ET Datacenters","pais":"Índia","titulo":"GalaxEye garante patente nos EUA para tecnologia OptoSAR e planeja constelação de 30 satélites","resumo":"A startup indiana GalaxEye obteve uma patente nos Estados Unidos para sua inovadora tecnologia OptoSAR, que combina radar e sensores ópticos. Com esse marco, a empresa fortalece sua posição no setor espacial global e avança no projeto de lançar uma constelação própria de 30 satélites. A conquista promete revolucionar a capacidade de monitoramento da Terra sob quaisquer condições climáticas.","link":"https://datacenters.economictimes.indiatimes.com/news/policy-land-power/galaxeye-secures-us-patent-for-optosar-technology-eyes-30-satellite-constellation/134686368?utm_source=top_news\u0026utm_medium=homepage","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"OpenAI apresenta dots, seus novos agentes de IA","resumo":"A OpenAI revelou o \"dots\", uma nova linha de agentes de inteligência artificial voltada para ampliar a automação e a eficiência digital. O lançamento marca um passo importante na estratégia da empresa para integrar ferramentas autônomas no cotidiano dos usuários e empresas. A novidade promete transformar a interação com sistemas complexos e redefinir o mercado de tecnologia.","link":"https://sapo.pt/artigo/openai-apresenta-dots-os-seus-novos-agentes-de-ai-6ac2dbc19406c429be32543c","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"AEROIN","pais":"Brasil","titulo":"Instituída a Política de Inovação da Agência Espacial Brasileira (AEB)","resumo":"A Agência Espacial Brasileira oficializou sua nova Política de Inovação com o objetivo de impulsionar o setor aeroespacial no país.\nA diretriz busca incentivar parcerias entre o setor público, universidades e empresas privadas para o desenvolvimento de novas tecnologias.\nAlém de fortalecer a pesquisa científica nacional, a medida visa atrair investimentos e capacitar novos talentos na área espacial.\nCom essa iniciativa, o Brasil pretende expandir sua soberania tecnológica e presença no mercado internacional de engenharia aeroespacial.","link":"https://aeroin.net/instituida-a-politica-de-inovacao-da-agencia-espacial-brasileira-aeb/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ScienceDaily","pais":"Estados Unidos","titulo":"Cientistas descobrem nova maneira de produzir hidrogênio a partir da água","resumo":"Pesquisadores encontraram um novo método capaz de extrair hidrogênio da água de forma mais simples, rápida e barata.\nA técnica pode impulsionar o desenvolvimento do hidrogênio verde como uma alternativa viável aos combustíveis fósseis.\nO avanço é visto como um salto fundamental para acelerar a transição energética e reduzir as emissões globais de carbono.","link":"https://www.sciencedaily.com/releases/2026/10/261001214017.htm","categoria":"ENERGIA","lang":"pt"},{"fonte":"GoodTechInfo","pais":"França","titulo":"«Pare de aprender Python»: BootLoops capacita a IA para a matemática pura","resumo":"A nova abordagem proposta pelo projeto BootLoops promete revolucionar a forma como a inteligência artificial lida com conceitos matemáticos complexos.\nEm vez de focar no ensino tradicional de linguagens de programação como Python, o sistema treina a IA para raciocinar diretamente sobre lógica matemática pura.\nEssa inovação visa expandir a capacidade teórica dos modelos atuais, permitindo resolver problemas científicos e computacionais antes inalcançáveis pela programação convencional.","link":"https://goodtech.info/bootloops-boite-outils-open-source-science-ia-harvard/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Wales 247","pais":"Inglaterra","titulo":"Tecnologia galesa é colocada à prova antes de missão a Marte","resumo":"Equipamentos e inovações tecnológicas desenvolvidas no País de Gales estão sendo rigorosamente testados para futuras missões espaciais rumo a Marte. Os testes avaliam a durabilidade e a eficiência dos sistemas sob condições extremas simuladas. Essa participação destaca a relevância da engenharia britânica no avanço da exploração espacial internacional.","link":"https://www.wales247.co.uk/welsh-technology-put-to-the-test-ahead-of-mission-to-mars","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"LatinSpots.com","pais":"Espanha","titulo":"Espanha reforça sua posição no mapa da comunicação política","resumo":"O país consolida seu papel de destaque global no cenário de estratégias de comunicação e marketing voltadas para a esfera política. O avanço reflete a capacidade de adaptação dos profissionais locais às novas demandas digitais e à polarização informacional moderna. Especialistas apontam que a tendência fortalece o ecossistema de análise de dados e campanhas na Europa, elevando o padrão tecnológico e estratégico do setor.","link":"https://www.latinspots.com/noticia/espaa-refuerza-su-posicin-en-el-mapa-de-la-comunicacin-poltica/98683","categoria":"TRENDING TOPICS","lang":"pt"},{"fonte":"Advanced Science News","pais":"Alemanha","titulo":"Manling Sui: Da observação de átomos à projeção de materiais de próxima geração","resumo":"A renomada cientista Manling Sui tem revolucionado a pesquisa moderna ao analisar estruturas atômicas detalhadas com extrema precisão tecnológica. Seu trabalho pioneiro permite projetar novos materiais altamente resistentes e eficientes para aplicações industriais futuras. Essa descoberta fortalece a base da nanotecnologia e abre portas para avanços significativos na engenharia mundial.","link":"https://www.advancedsciencenews.com/manling-sui-from-observing-atoms-to-designing-next-generation-materials/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Universidades japonesas desenvolvem nanossensor fluorescente de alta sensibilidade para pressão hidrostática","resumo":"Uma pesquisa conjunta liderada por instituições de destaque no Japão resultou na criação do nanossensor 'Pyr-PICsome'.\nA tecnologia inovadora permite medir a pressão hidrostática em tempo real com excelente nível de precisão e sensibilidade.\nEssa evolução abre novas portas para aplicações científicas avançadas em ambientes extremos e biologia celular.","link":"https://www.nikkei.com/article/DGXZRSP713372_V01C26A0000000/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"新浪财经","pais":"China","titulo":"Cientistas chineses desenvolvem nova tecnologia de armazenamento óptico multidimensional por feixe único","resumo":"Pesquisadores na China anunciaram o desenvolvimento de uma técnica inovadora focada em armazenamento óptico de dados com feixe único e múltiplas dimensões.\nA tecnologia promete revolucionar a capacidade de retenção de informações em datacenters com maior eficiência energética e velocidade.\nO avanço fortalece a infraestrutura digital do país e abre portas para aplicações comerciais em larga escala no setor de tecnologia da informação.","link":"https://finance.sina.com.cn/wm/2026-10-05/doc-iniucpwp9784549.shtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"TradingView","pais":"Índia","titulo":"Airtificial desenvolve tecnologia para fabricar veículos elétricos na Índia","resumo":"A empresa Airtificial fechou novos acordos para implementar tecnologias avançadas voltadas à fabricação de veículos elétricos no mercado indiano. A iniciativa busca acelerar a transição energética e modernizar a cadeia de suprimentos automotiva local. Com isso, o país ganha maior capacidade técnica para atender à crescente demanda por mobilidade sustentável.","link":"https://es.tradingview.com/news/reuters.com,2026:newsml_L6N45R08M:0/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"publico.pt","pais":"Portugal","titulo":"Internet quântica: “Neste momento, a Europa está na vanguarda desta tecnologia”","resumo":"Especialistas destacam o papel de liderança que a Europa vem assumindo no desenvolvimento da internet quântica e de redes de comunicação ultra-seguras. A tecnologia promete revolucionar a criptografia de dados e a velocidade de transmissão de informações em escala global. Investimentos contínuos em pesquisa científica consolidam o continente como polo inovador no setor.","link":"https://www.publico.pt/2026/10/04/ciencia/entrevista/internet-quantica-neste-momento-europa-vanguarda-tecnologia-2190076","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Reino Unido avalia tarifa sobre carros elétricos chineses, diz jornal","resumo":"O governo do Reino Unido está analisando a aplicação de novas tarifas sobre a importação de veículos elétricos fabricados na China.\nA medida surge após movimentações semelhantes feitas pela União Europeia e Estados Unidos para proteger indústrias locais.\nAnalistas apontam que as taxas podem impactar os preços dos automóveis ecológicos e desacelerar a transição energética do país.\nA decisão final deve equilibrar as metas ambientais britânicas e as pressões comerciais no setor automotivo global.","link":"https://www1.folha.uol.com.br/mercado/2026/10/reino-unido-avalia-tarifa-sobre-carros-eletricos-chineses-diz-jornal.shtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Atlantic","pais":"Estados Unidos","titulo":"O verdadeiro presente da inteligência artificial para a ciência","resumo":"A aplicação da inteligência artificial na pesquisa científica está transformando a velocidade e a precisão do descobrimento de novos conhecimentos.\nModelos avançados auxiliam na análise de grandes volumes de dados, permitindo avanços céleres na medicina, física e ciências dos materiais.\nA tecnologia deixa de ser apenas uma ferramenta automatizada para se tornar uma parceira indispensável nas grandes descobertas.","link":"https://www.theatlantic.com/science/2026/10/anthropic-artificial-intelligence-science-biology/688878/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Allnews","pais":"França","titulo":"A tecnologia chinesa tornou-se indispensável no cenário global","resumo":"A indústria de tecnologia da China alcançou uma posição de liderança crítica em diversos setores estratégicos globais.\nDe energia renovável e veículos elétricos a infraestrutura de telecomunicações, o país consolidou seu ecossistema de inovação de forma inevitável para os mercados ocidentais.\nEsse avanço redefine o equilíbrio geopolítico e obriga potências mundiais a se adaptarem à dependência crescente do conhecimento e da capacidade produtiva chinesa.","link":"https://www.allnews.ch/content/points-de-vue/la-technologie-chinoise-est-d%C3%A9sormais-incontournable","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Taiwan Today","pais":"Inglaterra","titulo":"Taiwan e Reino Unido aprofundam parcerias econômicas e tecnológicas","resumo":"O Reino Unido e Taiwan firmaram novos acordos para estreitar a colaboração mútua nos setores de economia e tecnologia avançada. A parceria visa impulsionar a inovação conjunta em áreas estratégicas como semicondutores e cadeias de suprimentos globais. Essa aliança fortalece a posição tecnológica de ambas as nações no cenário internacional.","link":"https://taiwantoday.tw/AMP/6/286462","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"El Periódico de Aragón","pais":"Espanha","titulo":"Comissário para a Economia Circular destaca o desafio de reciclar materiais em centros de dados","resumo":"Representantes do Ministério para a Transição Ecológica espanhol alertam para a crescente pegada ambiental e a necessidade urgente de gerenciar resíduos eletrônicos em infraestruturas de dados. Com a expansão massiva da computação em nuvem e inteligência artificial, o reaproveitamento de componentes tornou-se vital. A discussão propõe diretrizes sustentáveis para evitar impactos ambientais severos decorrentes da hiperdigeitalização.","link":"https://www.elperiodicodearagon.com/aragon/2026/10/05/comisionado-economia-circular-ministerio-transicion-134998860.amp.html","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"BILD","pais":"Alemanha","titulo":"Ministro distribui milhões: 100.000 bônus para carros elétricos pagos","resumo":"O governo alemão atingiu a marca expressiva de 100.000 prêmios financeiros pagos para incentivar a transição para a mobilidade elétrica. A medida visa acelerar a descarbonização do setor de transportes e apoiar a indústria automobilística nacional na crise. Com investimentos milionários, o programa busca tornar veículos sustentáveis mais acessíveis para a população.","link":"https://www.bild.de/politik/inland/minister-verteilt-millionen-100-000-praemien-fuer-elektroautos-ausbezahlt-6ac2495ac6253b9a73fa613e","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"Honda Global","pais":"Japão","titulo":"Honda desenvolve tecnologia base para carregamento sem fio em movimento para veículos elétricos","resumo":"A montadora japonesa Honda anunciou avanços importantes em sistemas de recarga sem fio voltados para veículos elétricos.\nA tecnologia abrange inclusive veículos comerciais de grande porte, permitindo o carregamento com o automóvel em movimento.\nEssa inovação tem o potencial de revolucionar a infraestrutura de transporte e acelerar a transição energética sustentável.","link":"https://global.honda/en/topics/2026/c_2026-10-05beng.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"中国网","pais":"China","titulo":"Tripulação da Shenzhou-23 celebra feriados no espaço enquanto conduz experimentos científicos","resumo":"Os astronautas da missão Shenzhou-23 passaram feriados importantes em órbita a bordo da estação espacial chinesa.\nParalelamente às comemorações, a equipe continua avançando com importantes experimentos científicos e rigorosos protocolos de gerenciamento de saúde.\nAs atividades em curso demonstram a maturidade operacional do programa espacial tripulado e sua consistência em pesquisas de longa duração.","link":"http://www.china.com.cn/txt/2026-10/05/content_118722439.shtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ANI News","pais":"Índia","titulo":"Hitachi High-Tech inaugura Centro de Inovação em Tecnologia Avançada em Mumbai, Índia","resumo":"A Hitachi High-Tech inaugurou oficialmente seu novo Centro de Inovação em Tecnologia Avançada na cidade de Mumbai. O espaço tem como objetivo impulsionar pesquisas de ponta, parcerias industriais e o desenvolvimento de soluções de alta tecnologia na Índia. A instalação reforça a estratégia da multinacional de expandir sua presença de engenharia na Ásia.","link":"https://aninews.in/news/business/hitachi-high-tech-opens-advanced-technology-innovation-center-mumbai-india20261005104813","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Geely apresenta tecnologia de carregamento ultrarrápido com Inteligência Artificial","resumo":"A montadora Geely surpreendeu o mercado automotivo ao introduzir um sistema inovador de recarga ultrarrápida otimizado por inteligência artificial. A tecnologia ajusta dinamicamente o fluxo de energia para proteger a vida útil da bateria e reduzir drasticamente o tempo de espera. A iniciativa acelera a transição para a mobilidade elétrica sustentável.","link":"https://sapo.pt/artigo/geely-apresenta-tecnologia-de-carregamento-ultrarrapido-com-inteligencia-artificial-6ac2446b9406c429be216d96","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Agência FAPESP","pais":"Brasil","titulo":"Ilum Escola de Ciência recebe inscrições para processo seletivo","resumo":"A Ilum Escola de Ciência, vinculada ao CNPEM, abriu as inscrições para seu novo processo seletivo de bacharelado em Ciência e Tecnologia.\nO curso oferece uma formação interdisciplinar e gratuita com foco em pesquisa avançada e inovação tecnológica.\nOs estudantes selecionados têm acesso a uma estrutura de ponta, além de auxílios para moradia e alimentação durante a graduação.\nA iniciativa busca formar a próxima geração de cientistas brasileiros para atuar em desafios globais complexos.","link":"https://agencia.fapesp.br/ilum-escola-de-ciencia-recebe-inscricoes-para-processo-seletivo/59330","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ScienceDaily","pais":"Estados Unidos","titulo":"Experimento florestal esquecido de 30 anos revela surpresa impressionante","resumo":"Um experimento ecológico de 30 anos que havia sido esquecido revelou descobertas surpreendentes sobre o comportamento das florestas.\nOs dados mostraram uma capacidade inesperada de adaptação da vegetação e de retenção de carbono ao longo de três décadas.\nEssa descoberta ressalta a relevância de pesquisas de longo prazo para a formulação de estratégias eficientes de preservação ambiental.","link":"https://www.sciencedaily.com/releases/2026/10/261001214120.htm","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"thenationalnews.com","pais":"França","titulo":"Ciência forense moderna revela sacrifícios humanos no Antigo Egito","resumo":"Utilizando técnicas forenses de última geração, pesquisadores conseguiram identificar evidências inéditas sobre rituais de sacrifício humano no Egito Antigo.\nA análise de restos mortais e vestígios biológicos permitiu desvendar detalhes sobre a dinâmica social e as práticas religiosas da época com precisão histórica sem precedentes.\nA descoberta reescreve aspectos importantes da historiografia egípcia, demonstrando como a tecnologia científica moderna pode transformar nossa compreensão do passado.","link":"https://www.thenationalnews.com/news/uk/2026/10/05/modern-forensic-science-uncovers-human-sacrifice-in-ancient-egypt/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Accountancy Age","pais":"Inglaterra","titulo":"Por que as mudanças nas contas da Companies House importam para a economia do Reino Unido","resumo":"Novas regulamentações e exigências de transparência foram introduzidas nas demonstrações financeiras da Companies House britânica. As alterações buscam combater fraudes corporativas e aumentar a confiabilidade dos dados empresariais no país. O impacto dessas medidas é a criação de um ambiente de negócios mais seguro e atraente para investimentos na economia do Reino Unido.","link":"https://accountancyage.com/2026/10/05/why-changes-to-companies-house-accounts-matter-for-the-uks-economy/","categoria":"ECONOMIA","lang":"pt"},{"fonte":"El Desmarque","pais":"Espanha","titulo":"BYD lança SUV elétrico que compete em tamanho e tecnologia com marcas premium","resumo":"A fabricante automotiva intensifica a disputa no mercado de veículos elétricos ao apresentar um modelo robusto equipado com tecnologia de ponta. O lançamento desafia diretamente montadoras tradicionais de luxo, oferecendo alto desempenho e inovações de conectividade por preços competitivos. A chegada do veículo reforça a tendência de eletrificação acelerada e a forte concorrência asiática no setor automobilístico europeu.","link":"https://www.eldesmarque.com/coches-y-motos/20261005/byd-suv-electrico-tamano-tecnologia-liga-mandan-marcas-premium_18_020333066.html","categoria":"LANÇAMENTO","lang":"pt"},{"fonte":"WiWo","pais":"Alemanha","titulo":"TSMC Dresden: Uma visão exclusiva da fábrica de chips mais importante da Europa","resumo":"A nova fábrica da TSMC em Dresden representa um marco histórico para a independência tecnológica e econômica da União Europeia. O projeto ambicioso visa garantir o suprimento local de semicondutores essenciais para as indústrias automotiva e digital. Especialistas trazem detalhes exclusivos sobre a infraestrutura de ponta e o impacto dessa unidade na região.","link":"https://www.wiwo.de/technologie/wirtschaft-von-oben/tsmc-dresden-ein-exklusiver-einblick-in-europas-wichtigste-chipfabrik/100257891.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Deloitte","pais":"Japão","titulo":"Deloitte Tohmatsu e Mitsubishi Estate inauguram polo de coinovação para tecnologias quânticas","resumo":"Foi anunciada a criação da base colaborativa 'Tokyo Quantum Gateway' para impulsionar a aplicação prática da tecnologia quântica.\nA iniciativa une gigantes corporativos para acelerar a transição de pesquisas teóricas em soluções voltadas para o mercado.\nO impacto esperado é a consolidação do Japão como um polo de vanguarda na comercialização de inovações quânticas.","link":"https://www.deloitte.com/jp/ja/about/press-room/nr20261005.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Tecnologia de acoplamento biológico ARC injeta novo ímpeto no aumento verde da produção de soja","resumo":"Uma nova tecnologia de acoplamento biológico denominada ARC foi aplicada com sucesso para impulsionar a produtividade sustentável da soja.\nA inovação agrícola visa otimizar o rendimento das colheitas minimizando o impacto ambiental e o uso excessivo de químicos.\nEssa solução científica apoia diretamente as metas de segurança alimentar e agricultura verde na China.","link":"https://news.sciencenet.cn/htmlnews/2026/10/572496.shtm","categoria":"AGRICULTURA","lang":"pt"},{"fonte":"The New Indian Express","pais":"Índia","titulo":"Ministro da Agricultura de AP inaugurará Centro de Tecnologia Pós-Colheita de Rs 6,10 crores","resumo":"O estado indiano de Andhra Pradesh se prepara para inaugurar um novo Centro de Tecnologia Pós-Colheita avaliado em 6,10 crores de rúpias. O projeto visa minimizar as perdas de alimentos através de soluções tecnológicas modernas de armazenamento e processamento. A medida representa um avanço importante para apoiar os agricultores locais e fortalecer a segurança alimentar.","link":"https://www.newindianexpress.com/states/andhra-pradesh/2026/Oct/05/ap-agriculture-minister-to-inaugurate-rs-610-crore-post-harvest-technology-centre","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"CNN Portugal","pais":"Portugal","titulo":"CNN Inovação: a indústria do plástico na economia circular","resumo":"O programa abordou os desafios e as transformações da indústria do plástico para se adaptar aos princípios da economia circular. Novas técnicas de reciclagem química e bioplásticos estão sendo implementadas para mitigar o impacto ambiental do material. O avanço demonstra a urgência de alinhar produção industrial e sustentabilidade ecológica.","link":"https://cnnportugal.iol.pt/videos/cnn-inovacao-a-industria-do-plastico-na-economia-circular/6ac211cf0cf22b9f8904dc63","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"Prefeitura de Campo Grande","pais":"Brasil","titulo":"CG Tech Day conecta tecnologia, carreira e novas oportunidades","resumo":"O evento CG Tech Day reuniu profissionais, estudantes e empresas do setor tecnológico para debater tendências e inovação.\nA programação contou com palestras sobre inteligência artificial, desenvolvimento de software e oportunidades de carreira no mercado digital.\nParticipantes puderam realizar networking e conhecer novas ferramentas que estão transformando o ecossistema de tecnologia.\nO encontro reforça a importância da capacitação contínua e do fortalecimento da comunidade tecnológica regional.","link":"https://www.campogrande.ms.gov.br/cgnoticias/noticia/cg-tech-day-conecta-tecnologia-carreira-e-novas-oportunidades/","categoria":"EVENTO TECH","lang":"pt"},{"fonte":"ScienceDaily","pais":"Estados Unidos","titulo":"Meteoro atingiu Oklahoma 100 milhões de anos depois do que se pensava","resumo":"Análises geológicas recentes indicam que o impacto de um meteoro em Oklahoma ocorreu 100 milhões de anos depois do que a ciência estimava.\nA descoberta revisa a cronologia de eventos cósmicos no continente americano e altera teorias sobre a evolução da região.\nO achado ajuda pesquisadores a aperfeiçoar modelos que estudam a frequência e as consequências de impactos de asteroides na Terra.","link":"https://www.sciencedaily.com/releases/2026/10/261002080012.htm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Afis Science","pais":"França","titulo":"A expectativa de vida com qualidade e boa saúde","resumo":"Estudos recentes analisam a evolução da expectativa de vida saudável, destacando que viver mais não significa necessariamente viver livre de enfermidades crônicas.\nA pesquisa ressalta a relevância de políticas públicas voltadas para a prevenção, medicina avançada e estilos de vida saudáveis para fechar a lacuna entre a longevidade biológica e o bem-estar funcional.\nO indicador reflete diretamente os desafios contemporâneos da ciência médica no envelhecimento populacional.","link":"https://www.afis.org/L-esperance-de-vie-en-bonne-sante","categoria":"SAÚDE","lang":"pt"},{"fonte":"El Confidencial","pais":"Espanha","titulo":"Mais tecnologia e autonomia: testamos o novo Toyota RAV4","resumo":"A nova geração do SUV híbrido da Toyota passa por testes rigorosos para avaliar suas melhorias significativas em sistemas multimídia e eficiência energética. O modelo incorpora assistências avançadas de condução e baterias otimizadas que ampliam consideravelmente o alcance elétrico. O teste comprova a evolução do veículo em direção a uma mobilidade mais conectada, segura e alinhada às exigências ecológicas atuais.","link":"https://www.elconfidencial.com/motor/2026-10-05/mas-autonomia-y-tecnologia-probamos-el-nuevo-toyota-rav4_4433497/","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"tohoku.ac.jp","pais":"Japão","titulo":"Previsão de fluxo de pessoas com poucos dados: tecnologia quântica auxilia no posicionamento de sinalização","resumo":"Pesquisadores utilizaram algoritmos de computação quântica para antecipar a movimentação humana a partir de dados escassos.\nO método recém-desenvolvido apoia o planejamento urbano e a otimização na disposição de painéis informativos e orientação.\nA aplicação prática visa melhorar a eficiência do trânsito de pedestres em grandes centros e espaços públicos movimentados.","link":"https://www.tohoku.ac.jp/japanese/2026/10/press20261005-01-placement.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Guia de leitura semanal dos artigos da revista Science","resumo":"A edição recente da renomada revista Science trouxe uma seleção abrangente de pesquisas de ponta ao redor do mundo.\nO guia semanal destaca avanços notáveis em diversas disciplinas científicas fundamentais para o desenvolvimento global.\nA difusão desses estudos estimula o debate acadêmico e inspira novas frentes de investigação na comunidade científica internacional.","link":"https://news.sciencenet.cn/htmlnews/2026/10/572487.shtm","categoria":"PESQUISA","lang":"pt"},{"fonte":"telanganatoday.com","pais":"Índia","titulo":"Andhra construirá casas para pobres usando tecnologia de impressão 3D em concreto","resumo":"O governo de Andhra Pradesh adotará a tecnologia de impressão 3D em concreto para a construção de moradias populares no estado. Essa abordagem inovadora promete reduzir drasticamente o tempo de obra e os custos associados à habitação social. O projeto destaca a aplicação de engenharia avançada na resolução de problemas habitacionais urgentes da Índia.","link":"https://telanganatoday.com/andhra-to-build-houses-for-poor-using-3d-concrete-printing-technology","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"RTP","pais":"Portugal","titulo":"Enter - Tecnologia Para Todos de 04 out 2026","resumo":"O programa \"Enter\" trouxe uma edição especial focada em democratizar o acesso a inovações recentes no universo digital e eletrônico. Foram discutidas ferramentas que facilitam a inclusão tecnológica de populações menos habituadas ao ecossistema moderno. A iniciativa reforça a importância de tornar a tecnologia acessível a todas as faixas etárias.","link":"https://www.rtp.pt/play/p16977/e958201/enter-tecnologia-para-todos","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Valor Investe","pais":"Brasil","titulo":"Flávio Bolsonaro e Lula disputarão 2º turno para Presidência","resumo":"A apuração das urnas confirmou que a disputa presidencial no Brasil será decidida em segundo turno entre Flávio Bolsonaro e Lula.\nO resultado do primeiro turno refletiu um cenário político acirrado e com forte mobilização dos eleitores em todo o país.\nAmbos os candidatos iniciam agora uma nova fase de campanha focada em conquistar alianças estratégicas e votos decisivos.\nO mercado financeiro e os diversos setores da sociedade acompanham de perto as sinalizações para os próximos anos.","link":"https://valorinveste.globo.com/google/amp/mercados/brasil-e-politica/noticia/2026/10/04/flavio-bolsonaro-e-lula-disputarao-2o-turno-para-presidencia.ghtml","categoria":"TRENDING","lang":"pt"},{"fonte":"nytimes.com","pais":"Estados Unidos","titulo":"Google quer que Hollywood perca o medo da tecnologia","resumo":"A Google está realizando um movimento estratégico para convencer a indústria do entretenimento em Hollywood a abraçar a inovação tecnológica.\nA empresa argumenta que a inteligência artificial deve ser vista como uma ferramenta criativa complementar, e não como uma ameaça aos profissionais.\nA iniciativa busca diminuir resistências no setor audiovisual após recentes controvérsias e debates sobre direitos e automação.","link":"https://www.nytimes.com/2026/09/30/business/media/google-hollywood-krya-sedgwick.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"UN News","pais":"Brazil","titulo":"Nuclear technology push aims to save 1 billion tons of food","resumo":"The use of irradiation and nuclear technologies in agriculture is emerging as an innovative solution to combat global food waste.\nThe initiative seeks to increase product shelf life and eliminate pests without compromising food safety or nutritional value.\nExperts project that large-scale implementation could prevent the loss of up to one billion tons of food per year.\nThis approach aims to strengthen the planet's food security and mitigate the impacts of climate change on agricultural production.","link":"https://news.un.org/pt/story/2026/10/1854511","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"BBC","pais":"United States","titulo":"Trump unveils 'Super Intelligence Force' to oversee AI policy","resumo":"Former President Donald Trump announced the creation of the 'Super Intelligence Force' to oversee and direct the country's AI policy.\nThe proposal aims to position the United States at the forefront of global technological development by establishing new safety guidelines.\nThe initiative reflects the central role that artificial intelligence has come to play in strategic decisions and national sovereignty.","link":"https://www.bbc.com/news/articles/cqj6jenp26zyo","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Le Dauphiné Libéré","pais":"France","titulo":"“AI threatens to socially isolate us far more than any previous technology”","resumo":"Experts warn of the growing risks of social isolation caused by the accelerated advancement of artificial intelligence.\nUnlike previous technologies that promoted some human interaction, new virtual tools tend to replace real relationships with synthetic interactions.\nThis phenomenon has profound impacts on mental health and community structures, requiring an urgent debate on ethical boundaries and the social regulation of intelligent systems in everyday life.","link":"https://www.ledauphine.com/societe/2026/10/05/l-ia-menace-de-nous-isoler-socialement-bien-plus-qu-aucune-technologie-avant-elle","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"BBC","pais":"England","titulo":"Skin cancer wait times in Bradford cut by new AI technology","resumo":"A new artificial intelligence-based system has been implemented to optimize triage and reduce wait times for patients with suspected skin cancer in Bradford. This technological innovation promises to speed up critical diagnoses, easing the burden on the British healthcare system. The direct impact is the early detection of the disease, significantly increasing the chances of successful treatment.","link":"https://www.bbc.com/news/articles/ck5yw5e9pnrzo","categoria":"HEALTH","lang":"en"},{"fonte":"Canal Sur","pais":"Spain","titulo":"\"EnRed\" showcases 3D technology bringing a unique European Andalusian ship to life","resumo":"The television program highlights the application of 3D printing and modeling technologies in the historical reconstruction of a medieval vessel unique to the European continent. The initiative highlights regional cultural heritage through advanced digital tools, demonstrating the potential of innovation in archaeology and the preservation of ancient artifacts. The project is attracting academic and technological interest by uniting naval tradition and computer graphics.","link":"https://www.canalsur.es/rtva/comunicacion/enred-presenta-trabajos-tecnologia-3d_1_1440442.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Spektrum der Wissenschaft","pais":"Germany","titulo":"2026 Nobel Prize in Physiology or Medicine: Who will receive the Nobel Prize in Medicine?","resumo":"The coveted 2026 Nobel Prize in Physiology or Medicine is generating high expectations within the international scientific community. Experts are discussing the top contenders for this year's award based on their innovations. The winning discovery is expected to shape the future of biomedicine and bring new treatments for global diseases.","link":"https://www.spektrum.de/news/medizin-nobelpreis-hintergruende-zur-verleihung-und-erste-prognosen/2345555","categoria":"SCIENCE","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"“Japan is not weak”: Keys to economic growth in the AI era","resumo":"The article discusses prospects for revitalizing the Japanese economy in the face of challenges posed by artificial intelligence.\nExperts analyze the essential factors for the country to regain its technological and productive leadership.\nThe impact of this transformation is vital to maintaining the global competitiveness of Japanese industry in the coming years.","link":"https://news.yahoo.co.jp/articles/71440a3321fd10f2c35d259252353732f54000b7","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"搜狐网","pais":"China","titulo":"Beijing implements citywide 'learning by doing' science education","resumo":"The city of Beijing has begun comprehensive implementation of guidelines aimed at practical-focused science education. The initiative seeks to transform traditional teaching methods in local schools.\nThe goal is to stimulate critical thinking and analytical skills in new generations from an early age.\nThis measure reinforces the national commitment to training qualified talent to drive future technological innovation.","link":"https://m.sohu.com/a/1084185099_115563?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334","categoria":"EDUCATION","lang":"en"},{"fonte":"ET Datacenters","pais":"India","titulo":"GalaxEye secures US patent for OptoSAR technology, eyes 30-satellite constellation","resumo":"Indian startup GalaxEye has secured a US patent for its innovative OptoSAR technology, which combines radar and optical sensors. With this milestone, the company strengthens its position in the global space sector and moves forward with plans to launch its own constellation of 30 satellites. The achievement promises to revolutionize Earth monitoring capabilities under all weather conditions.","link":"https://datacenters.economictimes.indiatimes.com/news/policy-land-power/galaxeye-secures-us-patent-for-optosar-technology-eyes-30-satellite-constellation/134686368?utm_source=top_news\u0026utm_medium=homepage","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"OpenAI introduces dots, its new AI agents","resumo":"OpenAI has unveiled \"dots,\" a new line of artificial intelligence agents aimed at enhancing automation and digital efficiency. The launch marks a major step in the company's strategy to integrate autonomous tools into the daily lives of users and businesses. The new release promises to transform interaction with complex systems and redefine the technology market.","link":"https://sapo.pt/artigo/openai-apresenta-dots-os-seus-novos-agentes-de-ai-6ac2dbc19406c429be32543c","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"AEROIN","pais":"Brazil","titulo":"Brazilian Space Agency (AEB) establishes Innovation Policy","resumo":"The Brazilian Space Agency has formalized its new Innovation Policy aimed at boosting the country's aerospace sector.\nThe guideline seeks to encourage partnerships between the public sector, universities, and private companies for the development of new technologies.\nIn addition to strengthening national scientific research, the measure aims to attract investment and train new talent in the space field.\nWith this initiative, Brazil intends to expand its technological sovereignty and presence in the international aerospace engineering market.","link":"https://aeroin.net/instituida-a-politica-de-inovacao-da-agencia-espacial-brasileira-aeb/","categoria":"SCIENCE","lang":"en"},{"fonte":"ScienceDaily","pais":"United States","titulo":"Scientists discover new way to produce hydrogen from water","resumo":"Researchers have found a new method capable of extracting hydrogen from water more simply, quickly, and cheaply.\nThe technique could boost the development of green hydrogen as a viable alternative to fossil fuels.\nThe breakthrough is seen as a fundamental leap to accelerate the energy transition and reduce global carbon emissions.","link":"https://www.sciencedaily.com/releases/2026/10/261001214017.htm","categoria":"ENERGY","lang":"en"},{"fonte":"GoodTechInfo","pais":"France","titulo":"«Stop learning Python»: BootLoops empowers AI for pure mathematics","resumo":"The new approach proposed by the BootLoops project promises to revolutionize how artificial intelligence handles complex mathematical concepts.\nInstead of focusing on traditional teaching of programming languages like Python, the system trains AI to reason directly about pure mathematical logic.\nThis innovation aims to expand the theoretical capacity of current models, allowing them to solve scientific and computational problems previously unreachable by conventional programming.","link":"https://goodtech.info/bootloops-boite-outils-open-source-science-ia-harvard/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Wales 247","pais":"England","titulo":"Welsh technology put to the test ahead of mission to Mars","resumo":"Equipment and technological innovations developed in Wales are being rigorously tested for upcoming space missions to Mars. The tests evaluate the durability and efficiency of the systems under simulated extreme conditions. This participation highlights the relevance of British engineering in advancing international space exploration.","link":"https://www.wales247.co.uk/welsh-technology-put-to-the-test-ahead-of-mission-to-mars","categoria":"SCIENCE","lang":"en"},{"fonte":"LatinSpots.com","pais":"Spain","titulo":"Spain reinforces its position on the political communication map","resumo":"The country is consolidating its prominent global role in the landscape of communication strategies and marketing geared toward the political sphere. The advancement reflects the ability of local professionals to adapt to new digital demands and modern informational polarization. Experts point out that the trend strengthens the data analysis and campaign ecosystem in Europe, raising the technological and strategic standards of the sector.","link":"https://www.latinspots.com/noticia/espaa-refuerza-su-posicin-en-el-mapa-de-la-comunicacin-poltica/98683","categoria":"TRENDING TOPICS","lang":"en"},{"fonte":"Advanced Science News","pais":"Germany","titulo":"Manling Sui: From Observing Atoms to Designing Next-Generation Materials","resumo":"Renowned scientist Manling Sui has been revolutionizing modern research by analyzing detailed atomic structures with extreme technological precision. Her pioneering work makes it possible to design new, highly resilient and efficient materials for future industrial applications. This discovery strengthens the foundation of nanotechnology and opens doors to significant advancements in global engineering.","link":"https://www.advancedsciencenews.com/manling-sui-from-observing-atoms-to-designing-next-generation-materials/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"Japanese Universities Develop High-Sensitivity Fluorescent Nanosensor for Hydrostatic Pressure","resumo":"Joint research led by prominent institutions in Japan has resulted in the creation of the 'Pyr-PICsome' nanosensor. This innovative technology makes it possible to measure hydrostatic pressure in real time with an exceptional level of precision and sensitivity. This breakthrough opens new doors for advanced scientific applications in extreme environments and cell biology.","link":"https://www.nikkei.com/article/DGXZRSP713372_V01C26A0000000/","categoria":"SCIENCE","lang":"en"},{"fonte":"新浪财经","pais":"China","titulo":"Chinese Scientists Develop New Single-Beam Multidimensional Optical Storage Technology","resumo":"Researchers in China have announced the development of an innovative technique focused on multi-dimensional, single-beam optical data storage. The technology promises to revolutionize information retention capacity in data centers with greater energy efficiency and speed. This advancement strengthens the country's digital infrastructure and opens doors for large-scale commercial applications in the information technology sector.","link":"https://finance.sina.com.cn/wm/2026-10-05/doc-iniucpwp9784549.shtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"TradingView","pais":"India","titulo":"Airtificial Develops Technology to Manufacture Electric Vehicles in India","resumo":"Airtificial has signed new agreements to implement advanced technologies aimed at manufacturing electric vehicles in the Indian market. The initiative seeks to accelerate the energy transition and modernize the local automotive supply chain. As a result, the country gains greater technical capacity to meet the growing demand for sustainable mobility.","link":"https://es.tradingview.com/news/reuters.com,2026:newsml_L6N45R08M:0/","categoria":"INNOVATION","lang":"en"},{"fonte":"publico.pt","pais":"Portugal","titulo":"Quantum Internet: 'Right now, Europe is at the forefront of this technology'","resumo":"Experts highlight the leading role Europe has been assuming in the development of the quantum internet and ultra-secure communication networks. The technology promises to revolutionize data encryption and information transmission speed on a global scale. Continuous investments in scientific research solidify the continent as an innovative hub in the sector.","link":"https://www.publico.pt/2026/10/04/ciencia/entrevista/internet-quantica-neste-momento-europa-vanguarda-tecnologia-2190076","categoria":"SCIENCE","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"UK Considers Tariff on Chinese Electric Vehicles, Newspaper Says","resumo":"The UK government is analyzing the application of new tariffs on the import of electric vehicles manufactured in China. The measure comes after similar moves made by the European Union and the United States to protect local industries. Analysts point out that the fees could impact eco-friendly car prices and slow down the country's energy transition. The final decision is expected to balance British environmental goals and commercial pressures in the global automotive sector.","link":"https://www1.folha.uol.com.br/mercado/2026/10/reino-unido-avalia-tarifa-sobre-carros-eletricos-chineses-diz-jornal.shtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Atlantic","pais":"United States","titulo":"The True Gift of Artificial Intelligence to Science","resumo":"The application of artificial intelligence in scientific research is transforming the speed and accuracy of new knowledge discovery. Advanced models assist in the analysis of large volumes of data, allowing for rapid breakthroughs in medicine, physics, and materials science. The technology is shifting from a mere automated tool to an indispensable partner in major discoveries.","link":"https://www.theatlantic.com/science/2026/10/anthropic-artificial-intelligence-science-biology/688878/","categoria":"INNOVATION","lang":"en"},{"fonte":"Allnews","pais":"France","titulo":"Chinese Technology Has Become Indispensable on the Global Stage","resumo":"China's tech industry has achieved a critical leadership position across several strategic global sectors. From renewable energy and electric vehicles to telecommunications infrastructure, the country has consolidated its innovation ecosystem in a way that is unavoidable for Western markets. This advancement redefines the geopolitical balance and forces world powers to adapt to a growing dependence on Chinese knowledge and manufacturing capacity.","link":"https://www.allnews.ch/content/points-de-vue/la-technologie-chinoise-est-d%C3%A9sormais-incontournable","categoria":"INNOVATION","lang":"en"},{"fonte":"Taiwan Today","pais":"England","titulo":"Taiwan and UK Deepen Economic and Technological Partnerships","resumo":"The UK and Taiwan have signed new agreements to strengthen mutual collaboration in the economy and advanced technology sectors. The partnership aims to boost joint innovation in strategic areas such as semiconductors and global supply chains. This alliance strengthens the technological position of both nations on the international stage.","link":"https://taiwantoday.tw/AMP/6/286462","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"El Periódico de Aragón","pais":"Spain","titulo":"Commissioner for the Circular Economy Highlights the Challenge of Recycling Materials in Data Centers","resumo":"Representatives from Spain's Ministry for the Ecological Transition are warning about the growing environmental footprint and the urgent need to manage electronic waste in data infrastructure. With the massive expansion of cloud computing and artificial intelligence, the reuse of components has become vital. The discussion proposes sustainable guidelines to prevent severe environmental impacts resulting from hyper-digitalization.","link":"https://www.elperiodicodearagon.com/aragon/2026/10/05/comisionado-economia-circular-ministerio-transicion-134998860.amp.html","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"BILD","pais":"Germany","titulo":"Minister Distributes Millions: 100,000 Electric Car Bonuses Paid Out","resumo":"The German government has reached the significant milestone of 100,000 financial awards paid out to encourage the transition to electric mobility. The measure aims to accelerate the decarbonization of the transport sector and support the national automotive industry through the crisis. With million-dollar investments, the program seeks to make sustainable vehicles more accessible to the public.","link":"https://www.bild.de/politik/inland/minister-verteilt-millionen-100-000-praemien-fuer-elektroautos-ausbezahlt-6ac2495ac6253b9a73fa613e","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"Honda Global","pais":"Japan","titulo":"Honda Develops Base Technology for In-Motion Wireless Charging for Electric Vehicles","resumo":"Japanese automaker Honda has announced major advancements in wireless charging systems aimed at electric vehicles. The technology even covers large commercial vehicles, allowing for charging while the automobile is in motion. This innovation has the potential to revolutionize transport infrastructure and accelerate the sustainable energy transition.","link":"https://global.honda/en/topics/2026/c_2026-10-05beng.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"中国网","pais":"China","titulo":"Shenzhou-23 Crew Celebrates Holidays in Space While Conducting Scientific Experiments","resumo":"The astronauts of the Shenzhou-23 mission spent major holidays in orbit aboard the Chinese space station. Alongside the celebrations, the team continues to push forward with important scientific experiments and rigorous health management protocols. The ongoing activities demonstrate the operational maturity of the crewed space program and its consistency in long-duration research.","link":"http://www.china.com.cn/txt/2026-10/05/content_118722439.shtml","categoria":"SCIENCE","lang":"en"},{"fonte":"ANI News","pais":"India","titulo":"Hitachi High-Tech Opens Advanced Technology Innovation Center in Mumbai, India","resumo":"Hitachi High-Tech has officially inaugurated its new Advanced Technology Innovation Center in the city of Mumbai. The space aims to drive cutting-edge research, industrial partnerships, and the development of high-tech solutions in India. The facility reinforces the multinational's strategy to expand its engineering presence in Asia.","link":"https://aninews.in/news/business/hitachi-high-tech-opens-advanced-technology-innovation-center-mumbai-india20261005104813","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Geely Unveils Ultra-Fast Charging Technology Powered by Artificial Intelligence","resumo":"Automaker Geely has surprised the automotive market by introducing an innovative ultra-fast charging system optimized by artificial intelligence. The technology dynamically adjusts the flow of energy to protect battery life and drastically reduce waiting times. The initiative accelerates the transition to sustainable electric mobility.","link":"https://sapo.pt/artigo/geely-apresenta-tecnologia-de-carregamento-ultrarrapido-com-inteligencia-artificial-6ac2446b9406c429be216d96","categoria":"INNOVATION","lang":"en"},{"fonte":"Agência FAPESP","pais":"Brazil","titulo":"Ilum School of Science Opens Admissions for Selection Process","resumo":"The Ilum School of Science, affiliated with CNPEM, has opened applications for its new bachelor's degree selection process in Science and Technology.\nThe program offers an interdisciplinary and tuition-free education focused on advanced research and technological innovation.\nSelected students gain access to state-of-the-art facilities, as well as housing and meal stipends throughout their undergraduate studies.\nThe initiative aims to train the next generation of Brazilian scientists to tackle complex global challenges.","link":"https://agencia.fapesp.br/ilum-escola-de-ciencia-recebe-inscricoes-para-processo-seletivo/59330","categoria":"SCIENCE","lang":"en"},{"fonte":"ScienceDaily","pais":"United States","titulo":"Forgotten 30-Year-Old Forest Experiment Reveals Striking Surprise","resumo":"A long-forgotten 30-year-old ecological experiment has uncovered surprising findings regarding forest behavior.\nThe data revealed an unexpected capacity for vegetation adaptation and carbon retention over three decades.\nThis discovery highlights the importance of long-term research in formulating efficient environmental preservation strategies.","link":"https://www.sciencedaily.com/releases/2026/10/261001214120.htm","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"thenationalnews.com","pais":"France","titulo":"Modern Forensic Science Uncovers Human Sacrifice in Ancient Egypt","resumo":"Using cutting-edge forensic techniques, researchers have identified unprecedented evidence of human sacrifice rituals in Ancient Egypt.\nThe analysis of human remains and biological traces has made it possible to uncover details about the social dynamics and religious practices of the era with unprecedented historical precision.\nThe discovery rewrites important aspects of Egyptian historiography, demonstrating how modern scientific technology can transform our understanding of the past.","link":"https://www.thenationalnews.com/news/uk/2026/10/05/modern-forensic-science-uncovers-human-sacrifice-in-ancient-egypt/","categoria":"SCIENCE","lang":"en"},{"fonte":"Accountancy Age","pais":"England","titulo":"Why Changes to Companies House Accounts Matter for the UK Economy","resumo":"New regulations and transparency requirements have been introduced for financial statements at the UK's Companies House. The changes aim to combat corporate fraud and increase the reliability of business data across the country. The impact of these measures is the creation of a more secure and attractive business environment for investment in the UK economy.","link":"https://accountancyage.com/2026/10/05/why-changes-to-companies-house-accounts-matter-for-the-uks-economy/","categoria":"ECONOMICS","lang":"en"},{"fonte":"El Desmarque","pais":"Spain","titulo":"BYD Launches Electric SUV That Competes in Size and Technology with Premium Brands","resumo":"The automotive manufacturer is stepping up competition in the electric vehicle market by introducing a robust model equipped with cutting-edge technology. The launch directly challenges traditional luxury automakers, offering high performance and connectivity innovations at competitive prices. The vehicle's arrival reinforces the trend of accelerated electrification and fierce Asian competition in the European automotive sector.","link":"https://www.eldesmarque.com/coches-y-motos/20261005/byd-suv-electrico-tamano-tecnologia-liga-mandan-marcas-premium_18_020333066.html","categoria":"LAUNCHES","lang":"en"},{"fonte":"WiWo","pais":"Germany","titulo":"TSMC Dresden: An Exclusive Look Inside Europe's Most Important Chip Factory","resumo":"TSMC's new plant in Dresden represents a historic milestone for the technological and economic independence of the European Union. The ambitious project aims to secure a local supply of semiconductors essential for the automotive and digital industries. Experts provide exclusive details about the state-of-the-art infrastructure and the impact of this facility on the region.","link":"https://www.wiwo.de/technologie/wirtschaft-von-oben/tsmc-dresden-ein-exklusiver-einblick-in-europas-wichtigste-chipfabrik/100257891.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Deloitte","pais":"Japan","titulo":"Deloitte Tohmatsu and Mitsubishi Estate Open Co-Innovation Hub for Quantum Technologies","resumo":"The creation of the collaborative 'Tokyo Quantum Gateway' base has been announced to drive the practical application of quantum technology.\nThe initiative brings together corporate giants to accelerate the transition from theoretical research to market-ready solutions.\nThe expected impact is the consolidation of Japan as a cutting-edge hub for the commercialization of quantum innovations.","link":"https://www.deloitte.com/jp/ja/about/press-room/nr20261005.html","categoria":"BUSINESS","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"ARC Biological Coupling Technology Inject Fresh Momentum Into Green Soybean Production Growth","resumo":"A new biological coupling technology called ARC has been successfully applied to boost sustainable soybean productivity.\nThe agricultural innovation aims to optimize crop yields while minimizing environmental impact and excessive chemical use.\nThis scientific solution directly supports China's goals for food security and green agriculture.","link":"https://news.sciencenet.cn/htmlnews/2026/10/572496.shtm","categoria":"AGRICULTURE","lang":"en"},{"fonte":"The New Indian Express","pais":"India","titulo":"AP Agriculture Minister to Inaugurate Rs 6.10 Crore Post-Harvest Technology Center","resumo":"The Indian state of Andhra Pradesh is preparing to inaugurate a new Post-Harvest Technology Center valued at 6.10 crore rupees. The project aims to minimize food losses through modern technological storage and processing solutions. The measure represents an important step forward in supporting local farmers and strengthening food security.","link":"https://www.newindianexpress.com/states/andhra-pradesh/2026/Oct/05/ap-agriculture-minister-to-inaugurate-rs-610-crore-post-harvest-technology-centre","categoria":"SCIENCE","lang":"en"},{"fonte":"CNN Portugal","pais":"Portugal","titulo":"CNN Innovation: The Plastics Industry in the Circular Economy","resumo":"The program addressed the challenges and transformations facing the plastics industry to adapt to the principles of the circular economy. New chemical recycling techniques and bioplastics are being implemented to mitigate the material's environmental impact. This progress demonstrates the urgency of aligning industrial production with ecological sustainability.","link":"https://cnnportugal.iol.pt/videos/cnn-inovacao-a-industria-do-plastico-na-economia-circular/6ac211cf0cf22b9f8904dc63","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"Prefeitura de Campo Grande","pais":"Brazil","titulo":"CG Tech Day Connects Technology, Careers, and New Opportunities","resumo":"The CG Tech Day event brought together professionals, students, and companies from the tech sector to discuss trends and innovation.\nThe schedule featured lectures on artificial intelligence, softwar ltimedia systems and energy efficiency. The model incorporates advanced driver assistance systems and optimized batteries that considerably expand its electric range. The test proves the vehicle's evolution toward more connected, safe mobility in line with current environmental requirements.","link":"https://www.elconfidencial.com/motor/2026-10-05/mas-autonomia-y-tecnologia-probamos-el-nuevo-toyota-rav4_4433497/","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"tohoku.ac.jp","pais":"Japan","titulo":"Predicting Crowd Flow with Sparse Data: Quantum Technology Assists in Signage Placement","resumo":"Researchers have utilized quantum computing algorithms to anticipate human movement based on scarce data.\nThe newly developed method supports urban planning and optimizes the layout of informational panels and directional guidance.\nThe practical application aims to improve pedestrian traffic efficiency in large centers and busy public spaces.","link":"https://www.tohoku.ac.jp/japanese/2026/10/press20261005-01-placement.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Weekly Science Magazine Reading Guide","resumo":"The latest edition of the renowned Science magazine features a comprehensive selection of cutting-edge research from around the globe.\nThe weekly guide highlights notable advancements across various scientific disciplines fundamental to global development.\nThe dissemination of these studies stimulates academic debate and inspires new research frontiers within the international scientific community.","link":"https://news.sciencenet.cn/htmlnews/2026/10/572487.shtm","categoria":"RESEARCH","lang":"en"},{"fonte":"telanganatoday.com","pais":"India","titulo":"Andhra to Build Homes for the Poor Using 3D Concrete Printing Technology","resumo":"The government of Andhra Pradesh will adopt 3D concrete printing technology for affordable housing construction in the state. This innovative approach promises to drastically reduce construction time and costs associated with social housing. The project highlights the application of advanced engineering in solving India's urgent housing issues.","link":"https://telanganatoday.com/andhra-to-build-houses-for-poor-using-3d-concrete-printing-technology","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"RTP","pais":"Portugal","titulo":"Enter - Technology for Everyone from Oct 04, 2026","resumo":"The \"Enter\" program featured a special edition focused on democratizing access to recent innovations in the digital and electronic universe. Tools that facilitate the technological inclusion of populations less accustomed to the modern ecosystem were discussed. The initiative reinforces the importance of making technology accessible across all age groups.","link":"https://www.rtp.pt/play/p16977/e958201/enter-tecnologia-para-todos","categoria":"TRENDS","lang":"en"},{"fonte":"Valor Investe","pais":"Brazil","titulo":"Flávio Bolsonaro and Lula to Face Off in Presidential Runoff","resumo":"Vote counting confirmed that Brazil's presidential race will be decided in a runoff election between Flávio Bolsonaro and Lula.\nThe first-round results reflected a fierce political landscape with strong voter mobilization nationwide.\nBoth candidates are now launching a new campaign phase focused on winning strategic alliances and decisive votes.\nThe financial market and various sectors of society are closely monitoring signals for the coming years.","link":"https://valorinveste.globo.com/google/amp/mercados/brasil-e-politica/noticia/2026/10/04/flavio-bolsonaro-e-lula-disputarao-2o-turno-para-presidencia.ghtml","categoria":"TRENDING","lang":"en"},{"fonte":"nytimes.com","pais":"United States","titulo":"Google Wants Hollywood to Lose Its Fear of Technology","resumo":"Google is making a strategic push to convince the Hollywood entertainment industry to embrace technological innovation.\nThe company argues that artificial intelligence should be viewed as a complementary creative tool rather than a threat to professionals.\nThe initiative seeks to reduce resistance in the audiovisual sector following recent controversies and debates over rights and automation.","link":"https://www.nytimes.com/2026/09/30/business/media/google-hollywood-krya-sedgwick.html","categoria":"TECHNOLOGY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
