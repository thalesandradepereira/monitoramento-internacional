","titulo":"Genetics and Evolution: What Will Human Beings Look Like in the Future?","resumo":"Advances in genetic engineering and modern lifestyle changes are redefining perspectives on the biological evolution of the human species. Experts analyze how artificial selection, early diagnostics, and DNA modifications could impact physical and cognitive traits in future generations. This debate brings deep ethical dilemmas to the surface and questions the boundaries between technological enhancement and natural survival.","link":"https://www.bbc.com/portuguese/articles/cy8eqz3e1n0o.amp","categoria":"SCIENCE","lang":"en"},{"fonte":"QuotedData","pais":"England","titulo":"Allianz Technology Surges 45% as the Artificial Intelligence Boom Expands","resumo":"The Allianz Technology investment fund registered an impressive 45% surge, driven by the continuous valuation and adoption of artificial intelligence technologies across various sectors. The growth reflects market confidence in the expansion of these tools and the solid performance of global tech companies. This outcome positions the sector as one of the strongest drivers of the financial economy and innovation landscape today.","link":"https://quoteddata.com/2026/08/allianz-technology-storms-45-higher-as-ai-boom-broadens/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Security Journal UK","pais":"England","titulo":"Gas Stations Receive Enhanced Technology for Crime Reporting","resumo":"Gas stations in the UK are adopting a new technological system focused on streamlining the logging and reporting of offenses and thefts on their premises. The tool connects businesses directly to police forces, reducing bureaucracy and increasing the accuracy of submitted information. The expected impact is a significant reduction in operational losses and increased safety for employees and customers.","link":"https://securityjournaluk.com/fuel-forecourts-offered-crime-reporting-tech/","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"Trans.INFO","pais":"England","titulo":"Tackling the UK's HGV Parking Crisis: A Shared Economy Solution","resumo":"The UK is facing a severe shortage of secure parking spaces for heavy freight vehicles along its highways. To solve the problem, experts are proposing a shared economy-based platform that allows truck drivers to optimize the use of idle private spaces. The solution promises to lower logistics costs, improve truck driver well-being, and reduce traffic in inappropriate areas.","link":"https://trans.info/en/tackling-the-uk-s-hgv-parking-crisis-a-shared-economy-solution-for-lorry-drivers-493419","categoria":"MOBILITY","lang":"en"},{"fonte":"evo.co.uk","pais":"England","titulo":"I Drove the World's Best Sports Car for a Week and Discovered Why It Isn't Perfect","resumo":"An in-depth test conducted over a week revealed the strengths and operational quirks of what is considered today's best sports car. Although the vehicle impresses with cutting-edge engineering, acceleration, and futuristic design, flaws in daily use and usability challenges were highlighted in the report. The analysis offers a realistic perspective on the limits of high automotive technology when confronted with everyday routines.","link":"https://www.evo.co.uk/porsche/911-gt3-touring/208978/a-week-in-a-porsche-911-gt3-why-the-worlds-best-sports-car-isnt","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"Firstpost","pais":"England","titulo":"UK Economy Could Shrink in 2027 If Strait of Hormuz Remains Closed, EY Warns","resumo":"A new report from consulting firm EY has warned that the UK economy risks entering a contraction by 2027 if geopolitical tensions in the Strait of Hormuz remain unresolved. The prolonged blockade of the vital shipping route would disrupt energy supplies and dramatically increase operating costs for industry and transport. The study highlights the vulnerability of global supply chains to conflicts in strategic regions.","link":"https://www.firstpost.com/business/uk-economy-recession-2027-hormuz-closure-ey-warning-14035519.html","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"El Confidencial","pais":"Spain","titulo":"Australia Combines Gallium and Sunlight to Turn Seawater into Fuel of the Future","resumo":"Researchers in Australia have developed an innovative technology that uses sunlight and gallium to turn seawater into clean hydrogen. The discovery promises to revolutionize renewable fuel production by eliminating expensive processes and the exclusive use of drinking water. This advancement represents a fundamental step toward making the global energy transition viable and reducing dependence on fossil fuels.","link":"https://www.elconfidencial.com/tecnologia/ciencia/2026-08-03/australia-galio-luz-solar-agua-mar-hidrogeno-1qrt_4300592/","categoria":"RENEWABLE ENERGY","lang":"en"},{"fonte":"WWWhat's new","pais":"Spain","titulo":"It's Not Just the Heat: Science Reveals Summer Fatigue Is Caused by Loss of REM Sleep","resumo":"Recent scientific studies indicate that excessive fatigue during the summer is not solely caused by high ambient temperatures. Changes in solar lighting patterns and heat directly affect the REM sleep phase, which is essential for cognitive and physical restoration. Understanding this dynamic helps in developing strategies to combat seasonal exhaustion and improve public well-being.","link":"https://wwwhatsnew.com/2026/08/03/cansancio-verano-calor-destruccion-sueno-rem-enemigo-silencioso/","categoria":"SCIENCE","lang":"en"},{"fonte":"Muy Interesante","pais":"Spain","titulo":"Beyond Range: Electric Vehicles Now Compete Through Artificial Intelligence","resumo":"The electric vehicle sector has reached a new milestone where battery range is no longer the primary differentiator among models. Automakers are now focusing their efforts on developing advanced artificial intelligence systems and high onboard connectivity. This shift in focus promises to redefine the driving experience and accelerate the race for leadership in future mobility.","link":"https://muyinteresante.okdiario.com/actualidad/kia-ev3-605-km-ia-y-tecnologia-v2l.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"El Mundo","pais":"Spain","titulo":"From Aviation to Food Tech: Engineer Creates 3D Printer for Plant-Based Meats and Cuts","resumo":"A Spanish engineer has traded aircraft programming for entrepreneurship in the food technology sector through 3D printing. His startup has developed solutions capable of creating plant-based cuts of meat and bacon while maintaining realistic textures and flavors. This initiative demonstrates how the convergence of engineering and food can drive sustainable alternatives in the food industry.","link":"https://www.elmundo.es/economia/2026/08/02/6a68ad6721efa0e0448b4593.html","categoria":"INNOVATION","lang":"en"},{"fonte":"FCE, noticias sobre coches eléctricos, movilidad eléctrica","pais":"Spain","titulo":"Ford to Produce New Model in Spain Using Technology and Platforms from Chinese Giant Geely","resumo":"Ford has confirmed that it will manufacture a new vehicle at its plant in Spain equipped with technology and architecture provided by Geely. The strategic partnership aims to optimize development costs and accelerate the rollout of electrified models in the European market. This decision reinforces the competitiveness of Spain's automotive sector amid the transition to new-energy vehicles.","link":"https://forococheselectricos.com/noticias/ford-fabricara-espana-modelo-con-tecnologia-geely-20260803-41730.html","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"Hispaviación","pais":"Spain","titulo":"Lufthansa Technik Tests AeroSHARK Technology Inspired by Shark Skin on Airbus A319","resumo":"Lufthansa Technik has begun practical tests of AeroSHARK technology on Airbus A319 aircraft to reduce aerodynamic drag. The biomimetic coating mimics the texture of shark skin, optimizing airflow over the fuselage during commercial flights. The application of this innovation aims to significantly reduce fuel consumption and lower carbon emissions in the aviation sector.","link":"https://www.hispaviacion.es/lufthansa-technik-prueba-la-tecnologia-aeroshark-en-un-airbus-a319/","categoria":"INNOVATION","lang":"en"},{"fonte":"eldebate.com","pais":"Spain","titulo":"Australian Cave Preserves Ancestral Rituals and Intrigues Archaeologists with Millennia-Old Finds","resumo":"Researchers in an Australian cave have discovered well-preserved archaeological remains that reveal magical rituals practiced thousands of years ago. The excellent preservation of the artifacts provides unprecedented information about the culture, beliefs, and social structures of indigenous peoples. The discovery broadens our understanding of ancient human history and sheds new light on the evolution of spiritual traditions.","link":"https://www.eldebate.com/ciencia/20260803/enigma-cueva-australiana-conserva-rituales-magicos-hace-miles-anos_442875.html","categoria":"ARCHAEOLOGY","lang":"en"},{"fonte":"Diario AS","pais":"Spain","titulo":"Spain to Distribute Free Special Glasses for Observing August's Total Solar Eclipse","resumo":"Spanish authorities have announced a free distribution of protective glasses for viewing the August 12 total solar eclipse. The initiative aims to ensure that the public can safely watch the astronomical event. The eclipse is expected to attract enthusiasts and scientists from around the world, solidifying its place as one of the country's biggest events of the year.","link":"https://as.com/actualidad/ciencia/espana-repartira-gafas-gratis-para-ver-el-eclipse-solar-del-12-de-agosto-cuando-empieza-la-distribucion-y-donde-recogerlas-f202608-n/","categoria":"ASTRONOMY","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"Artificial Intelligence: Alibaba Launches New AI Model","resumo":"Chinese tech giant Alibaba has launched an updated version of its artificial intelligence model. The move intensifies the global competition against Western rivals in the generative intelligence sector. The new tool aims to boost corporate solutions and solidify leadership in the cloud market.","link":"https://www.sueddeutsche.de/wirtschaft/kuenstliche-intelligenz-alibaba-legt-mit-neuem-ki-modell-nach-dpa.urn-newsml-dpa-com-20090101-260803-930-476476","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"amerika21","pais":"Germany","titulo":"25 Nobel Laureates Warn Against Dismantling of Science in Argentina","resumo":"A group of 25 Nobel Prize winners has published a manifesto warning of the severe impacts of budget cuts on science promoted in Argentina. The researchers state that the drastic reduction in state investment threatens the future of scientific development in the country. This international protest increases pressure for sustainable public policies in research.","link":"https://amerika21.de/2026/08/289166/nobelpreistraeger-innen-abbau-argentinien","categoria":"SCIENCE","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"Morocco Blames Misinformation for Migration Crisis in Ceuta","resumo":"The Moroccan government has pointed to the proliferation of fake news on social media as the trigger for serious episodes of migration instability at the border with Ceuta. Authorities reported that misleading content drove mass mobilization in the digital environment. The case raises global alarm regarding the direct impact of online misinformation on physical safety and regional politics.","link":"https://www.sueddeutsche.de/politik/marokko-spanien-migration-ceuta-melilla-li.3525638","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"springerprofessional.de","pais":"Germany","titulo":"How Low River Levels Compromise the Economy","resumo":"The sharp drop in water levels across major German rivers is raising concerns for the country's logistics and manufacturing sector. Low water volumes limit the movement of industrial barges, substantially increasing freight costs and the transport of essential supplies. Experts warn that extreme climate effects already represent real bottlenecks for economic competitiveness.","link":"https://www.springerprofessional.de/logistik/lieferkettenmanagement/wie-das-niedrigwasser-der-wirtschaft-zusetzt/53058256","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"DAX Index Rises to All-Time Record High","resumo":"Germany's main stock market index, the DAX, reached an all-time record high driven by strong corporate earnings reports. The move reflects renewed optimism among global investors in the face of projected interest rate cuts by European central banks. The milestone demonstrates the strong resilience of financial markets despite uncertainties in the global macroeconomic outlook.","link":"https://www.sueddeutsche.de/wirtschaft/dax-steigt-rekord-li.3525744","categoria":"MARKET","lang":"en"},{"fonte":"BILD","pais":"Germany","titulo":"Commerzbank Signals Retreat in Battle Against UniCredit Takeover","resumo":"Germany's Commerzbank appears to have slowed its defense strategy against the consolidation attempt initiated by UniCredit. This stance signals progress toward one of the European banking sector's largest deals in recent years. The market is closely monitoring developments, which will require rigorous analysis from regulators and shareholders.","link":"https://www.bild.de/politik/commerzbank-gibt-offenbar-kampf-gegen-unicredit-auf-6a703d088fa429a9893fe876","categoria":"BUSINESS","lang":"en"},{"fonte":"digital fernsehen","pais":"Germany","titulo":"TV Viewership in July: Sports Dominate Broadcasts in Germany","resumo":"Television viewership figures in Germany for the month of July confirmed the absolute dominance of live sports broadcasts.\nMajor competitions attracted record audiences, widely outperforming other traditional entertainment formats.\nThe numbers highlight new trends in consumer behavior and shifts in media investment directions.","link":"https://www.digitalfernsehen.de/news/inhalte/streaming/tv-zahlen-juli-sport-dominiert-den-juli-1186004/","categoria":"MEDIA","lang":"en"},{"fonte":"n-tv.de","pais":"Germany","titulo":"DFB Demands Overhaul at FIFA Due to Irreparable Loss of Trust","resumo":"The German Football Association (DFB) issued harsh criticisms of FIFA's leadership, citing an irreparable loss of trust in the management of world football.\nThe call for an institutional overhaul exposes rifts between European organizations and the international federation.\nGermany's firm stance could trigger similar movements for reform across the global sports landscape.","link":"https://www.n-tv.de/sport/fussball/DFB-empfindet-irreparablen-Vertrauensverlust-gegenueber-FIFA-id31152088.html","categoria":"TRENDS","lang":"en"},{"fonte":"projectdesign.jp","pais":"Japan","titulo":"Japan's Ministry of Economy to Create Organization to Unify AI and Robotics Policies","resumo":"Japan's Ministry of Economy, Trade and Industry (METI) has announced the creation of a new framework dedicated to centralizing policy formulation for Artificial Intelligence and robotics.\nThe initiative aims to accelerate regulation, promote innovation, and drive the adoption of these emerging technologies in domestic industries.\nWith this move, the Japanese government seeks to strengthen its global competitiveness and ensure greater efficiency in leading the technology sector.","link":"https://www.projectdesign.jp/articles/news/cf53764e-dda0-4b83-a0f8-5edd590b86b1","categoria":"TECH POLICY","lang":"en"},{"fonte":"日経ビジネス電子版","pais":"Japan","titulo":"MUFG Partners with Google and OpenAI to Expand Digital Financial Ecosystem in Japan","resumo":"The financial group Mitsubishi UFJ Financial Group (MUFG) has forged strategic partnerships with tech giants Google and OpenAI to drive the digitalization of its services.\nThe alliance aims to integrate advanced artificial intelligence and cloud solutions to reshape banking services and capture new business opportunities.\nThis move positions Japan's largest bank at the forefront of digital transformation in the global financial sector.","link":"https://business.nikkei.com/atcl/gen/19/00912/072900003/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"Kitasato and Sios Technology Partner to Develop AI-Powered Fertilization Support System","resumo":"Kitasato has signed a cooperation agreement with Sios Technology to create an innovative platform aimed at supporting infertility treatments using cutting-edge AI technology.\nThe system will seek to optimize analytical processes and assist healthcare professionals in crucial clinical decisions during assisted reproduction procedures.\nThe initiative promises to increase treatment success rates and modernize the reproductive medicine sector.","link":"https://www.nikkei.com/nkd/disclosure/tdnr/20260803506170/","categoria":"MEDICINE \u0026 AI","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"Tokyo Researchers Develop Dielectric Material Stable Up to 300°C for Motors","resumo":"The Tokyo Metropolitan Industrial Technology Research Institute has created a new method to develop dielectric materials capable of operating with stability under extreme temperatures of up to 300°C.\nThe breakthrough has been validated in capacitors designed to function in severe environments, such as automotive engine compartments and electric vehicles.\nThis scientific innovation paves the way for more resistant, efficient, and durable automotive electronics.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_new/pt20260803000011.html","categoria":"SCIENCE \u0026 TECHNOLOGY","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"Neos' '8Way Audio' Spatial Audio Technology Integrated into Sharp's New AQUOS R11 Smartphone","resumo":"Neos has announced the inclusion of its advanced 8Way Audio spatial audio technology in the AQUOS R11, the latest model in Sharp's premium smartphone lineup.\nThe system promises to provide users with an immersive, high-fidelity sound experience without the need for complex external equipment.\nThe partnership reinforces the trend of integrating high-end tridimensional audio into everyday consumer mobile devices.","link":"https://www.nikkei.com/nkd/disclosure/tdnr/20260803506559/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"OkDiario","pais":"Japan","titulo":"Researchers in Japan Develop Innovative Method to Ensure Female Eel Births in Captivity","resumo":"Scientists in Japan have achieved a significant breakthrough in aquaculture by creating a method capable of steering the sex of captive-bred eels to ensure they are female.\nThis discovery addresses a major bottleneck in aquaculture production, as most captive eels tend to develop as males, limiting sector growth.\nThe technology promises to revolutionize the sustainability and efficiency of commercial production for this prized delicacy in the country.","link":"https://okdiario.com/naturaleza/japon-va-paso-delante-crean-metodo-asegurarse-que-anguilas-sus-criaderos-sean-hembras-19005478/amp","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"news.ksb.co.jp","pais":"Japan","titulo":"Takamatsu Event Showcases the Future of Science with AI, Robotics, and Remote-Controlled Lunar Rovers","resumo":"The city of Takamatsu hosted an educational event focused on exposing the public to the most advanced cutting-edge technologies, including artificial intelligence and space robotics.\nA highlight of the program was the opportunity given to visitors to remotely pilot a lunar exploration rover in real time.\nThe initiative seeks to inspire future generations and bring society closer to the innovations that will transform the aerospace and industrial sectors.","link":"https://news.ksb.co.jp/article/16779082","categoria":"ROBOTICS","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"SoftBank's Payment Arm Announces Acquisition of Former Sony Payment","resumo":"SoftBank Group's payment services subsidiary has officially announced the purchase of the former Sony Payment, expanding its financial technology operations.\nThe strategic transaction aims to consolidate the group's presence in the Japanese market for transaction processing and digital business solutions.\nThe move reflects intensifying competition among major tech companies for dominance in the digital financial sector.","link":"https://www.nikkei.com/article/DGXZQOUC032AZ0T00C26A8000000/","categoria":"FINTECH","lang":"en"},{"fonte":"Pandaily","pais":"China","titulo":"CATL Invests in RoboParty: Open-Source Bipedal Humanoid Robot Startup Founded by 22-Year-Old Sees Valuation Multiply 20-Fold","resumo":"Battery giant CATL has made a strategic investment in RoboParty, a promising open-source bipedal humanoid robotics startup.\nFounded by Huang Yi, a 22-year-old graduate of the Harbin Institute of Technology, the company saw its market valuation multiply twentyfold in a short period.\nThe move highlights China's rapid innovation ecosystem in robotics and artificial intelligence, boosting collaboration between major industries and emerging high-tech startups.","link":"https://pandaily.com/catl-invests-roboparty-humanoid-jul2026","categoria":"ROBOTICS","lang":"en"},{"fonte":"中国科学院","pais":"China","titulo":"Hunt 30,000 Light-Years Away: Chinese LHAASO Observatory Locates Ultra-High-Energy Radiation 'Suspect' in the Universe","resumo":"China's large cosmic ray observatory LHAASO has successfully traced the origin of ultra-high-energy photons from a distance of over 30,000 light-years from Earth.\nThe discovery represents a significant milestone for particle astrophysics, helping to elucidate the mysteries of the universe's most powerful mechanical accelerators.\nThe breakthrough reaffirms China's leadership position in space scientific research and the study of high-energy cosmic phenomena.","link":"https://www.cas.cn/cm/202608/t20260803_5117839.shtml","categoria":"ASTROPHYSICS","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"AI Scheduling System Takes Control of Telescopes and Initiates Autonomous Astronomical Observation","resumo":"Advanced artificial intelligence systems have begun autonomously managing the scheduling and operation of astronomical telescopes in China.\nThe technology optimizes observation time, dynamically adjusts parameters according to atmospheric conditions, and reacts in real time to transient astronomical events.\nThis automation represents a fundamental shift in conducting scientific research, accelerating new cosmic discoveries and reducing human intervention in complex tasks.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569237.shtm","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"财联社","pais":"China","titulo":"UN Panel Warns That AI Advancements Surpass Scientific Knowledge and Regulatory Capacity","resumo":"A group of United Nations experts issued a blunt warning highlighting that the accelerated pace of artificial intelligence development has outstripped scientific understanding and existing governance structures.\nThe report warns of potential and even catastrophic risks unless effective global oversight mechanisms and ethical safeguards are established.\nThe statement reinforces the urgency of multilateral international cooperation to regulate emerging technologies before they cause irreversible impacts.","link":"https://www.cls.cn/detail/2414744","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"3D Printing of Large Aircraft: The 'New Long March' of an 81-Year-Old Academician","resumo":"China's aerospace industry has reached new heights by integrating the use of industrial-scale additive manufacturing in the fabrication of structural parts for large commercial aircraft.\nLed by a renowned 81-year-old academician, the project overcame historical technical bottlenecks in high-precision metal modeling.\nThe feat strengthens the country's technological self-sufficiency in civil aviation and exemplifies the practical application of 3D printing technology in advanced engineering.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569238.shtm","categoria":"TECHNOLOGICAL INNOVATION","lang":"en"},{"fonte":"cast.org.cn","pais":"China","titulo":"Green High-Performance Computing Forum Discusses Sustainable Future of Supercomputing","resumo":"During the annual conference of the China Association for Science and Technology, experts gathered to discuss the development of high-performance computing technologies focused on environmental sustainability.\nThe panel addressed innovations in energy efficiency for data centers, energy-efficient chip architectures, and algorithms aimed at reducing the carbon footprint.\nThe event highlights the quest to balance massive processing power advancement with carbon neutrality goals.","link":"https://www.cast.org.cn/xw/MTBD/art/2026/art_d9510a7919214e3dbc85bb510b7017dd.html","categoria":"SUPERCOMPUTING","lang":"en"},{"fonte":"人民网财经","pais":"China","titulo":"Public Artificial Intelligence Services Platform Officially Launched in Lishui","resumo":"The city of Lishui has officially launched its public platform focused on artificial intelligence services and infrastructure to support local industries and research centers.\nThe system offers shared computing power, open data sets, and pre-trained models for small and medium-sized enterprises to drive digital transformation.\nThe initiative reflects the commitment of Chinese regions to democratize access to AI tools and accelerate the integration of technology with the real economy.","link":"http://finance.people.com.cn/n1/2026/0803/c1004-40772951.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"chinawater.com.cn","pais":"China","titulo":"Hunan Uses Electro-Osmotic Pulse Technology to Create Invisible 'Cutoff Wall' in Dams","resumo":"Hunan Province has successfully adopted electro-osmotic pulse technology to prevent seepage and reinforce structural safety in large dams and reservoirs.\nThe method creates an electrical field in the soil and concrete, controlling the movement of water flow in a non-invasive and continuous manner.\nThis hydraulic engineering innovation offers a modern, durable, and highly effective solution for maintaining critical infrastructure against erosion risks and geological failures.","link":"https://www.chinawater.com.cn/zhsl/202608/t20260803_1073250.html","categoria":"ENGINEERING","lang":"en"},{"fonte":"news.samsung.com","pais":"India","titulo":"Samsung Innovation Campus Inspires Young Women in Maharashtra to Pursue Careers in AI","resumo":"The Samsung Innovation Campus program is empowering young women in the state of Maharashtra with practical knowledge in artificial intelligence and emerging technologies.\nThe initiative seeks to reduce the gender gap in the tech sector, promoting the development of essential skills for the digital job market.\nWith specialized training and educational support, the project positively impacts female inclusion in India's innovation and technology ecosystem.","link":"https://news.samsung.com/in/samsung-innovation-campus-is-inspiring-more-young-women-in-maharashtra-to-build-careers-in-ai","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Open Magazine","pais":"India","titulo":"Why Are Meta, X, Google, and Snapchat Testifying Before an Indian Parliamentary Panel Today?","resumo":"Representatives from tech giants Meta, X, Google, and Snapchat have been summoned by an Indian parliamentary panel to provide crucial clarifications.\nThe hearing addresses issues related to user safety, content moderation, data privacy, and compliance with the country's digital laws.\nThe meeting reflects the growing regulatory pressure from the Indian government on large multinational social media and technology platforms.","link":"https://openthemagazine.com/business/why-are-meta-x-google-and-snapchat-appearing-before-a-parliamentary-panel-today","categoria":"REGULATION","lang":"en"},{"fonte":"evreporter.com","pais":"India","titulo":"RoadGrid Raises ₹13 Crores to Expand Universal EV Charger Manufacturing","resumo":"Indian startup RoadGrid has secured ₹13 Crores in funding from the Technology Development Board of India to scale its production.\nThe investment aims to accelerate the development and national distribution of universal electric vehicle chargers.\nThe initiative strengthens sustainable mobility infrastructure in the country, boosting the energy transition and innovation in the automotive industry.","link":"https://evreporter.com/roadgrid-secures-%E2%82%B913-crore-from-technology-development-board-to-scale-universal-ev-charger-manufacturing/","categoria":"MOBILITY","lang":"en"},{"fonte":"INSIGHTS IAS","pais":"India","titulo":"Retention Challenge in Indian Science: Brain Drain, Causes, and Necessary Reforms","resumo":"India faces a critical challenge in retaining scientific talent, with many qualified researchers seeking opportunities abroad.\nA lack of adequate funding, bureaucracy, and academic infrastructure limitations are pointed out as the main causes of this exodus.\nExperts are calling for urgent reforms in the country's science management to create incentives and keep researchers within the national innovation ecosystem.","link":"https://www.insightsonindia.com/2026/08/03/retention-challenge-in-indian-science-brain-drain-causes-reforms/","categoria":"SCIENCE","lang":"en"},{"fonte":"Chemical Industry Digest","pais":"India","titulo":"Aether Industries and Dow India Launch Joint Silicone Technology Research Program","resumo":"Aether Industries and Dow India have entered into a strategic partnership to launch a joint program focused on advanced silicone research.\nThe collaboration aims to develop high-performance technological solutions to meet the demands of various industrial and chemical sectors.\nThis project reinforces India's innovation and applied scientific research capacity, promoting technological progress in the advanced materials ecosystem.","link":"https://chemindigest.com/aether-industries-and-dow-india-launch-joint-silicone-technology-research-programme/","categoria":"RESEARCH","lang":"en"},{"fonte":"Shiksha","pais":"India","titulo":"IIT Jodhpur Launches New Bachelor's Degree in Management and Technology Without JEE Requirement","resumo":"The prestigious Indian Institute of Technology Jodhpur has announced the launch of a new undergraduate degree in Management and Technology.\nOne of the main highlights of the course is the elimination of the rigorous national JEE exam requirement as an admission prerequisite.\nThe measure aims to democratize access to top-tier higher education, integrating business and technology to shape leaders adapted to the modern market.","link":"https://www.shiksha.com/news/college-iit-jodhpur-launches-new-bs-in-management-and-technology-no-jee-required-blogId-237749","categoria":"EDUCATION","lang":"en"},{"fonte":"IT Voice Media Pvt. Ltd.","pais":"India","titulo":"SME-Oriented Design Thinking: Building Tailored and Functional Technology","resumo":"The use of Design Thinking approaches directed at micro, small, and medium enterprises has proven essential for the development of effective solutions.\nThe methodology prioritizes the creation of intuitive and accessible technologies that perfectly fit the routine and real needs of these businesses.\nThis strategy aims to accelerate digital transformation in the corporate sector, avoiding the imposition of complex systems and promoting operational efficiency gains.","link":"https://www.itvoice.in/msme-oriented-design-thinking-building-technology-that-fits-not-forces","categoria":"INNOVATION","lang":"en"},{"fonte":"Elets eGov","pais":"India","titulo":"Technology, Innovation, and Scale: Why Uttar Pradesh Can Lead India's Next Growth Phase","resumo":"The state of Uttar Pradesh is emerging as a potential hub driving India's economic and technological growth in the coming years.\nWith massive investments in digital infrastructure, innovation incentives, and the expansion of tech al discussions on environmental regulation.","link":"https://www.publico.pt/2026/08/02/azul/entrevista/surangel-whipps-jr-ciencia-nao-so-empresas-querem-minerio-fundo-mar-2183713","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"cmjornal.pt","pais":"Portugal","titulo":"Science Generation: Ciência Viva celebrates 30 years of promoting scientific and technological culture","resumo":"The Ciência Viva initiative marks 30 years of working to strengthen scientific and technological culture in Portugal.\nOver three decades, the project has brought youth, students, and society closer to scientific discoveries and innovations.\nIts ongoing work has helped shape a new generation of professionals and enthusiasts in the exact and natural sciences.\nThe celebrations highlight the historical legacy and new challenges for the future of science communication.","link":"https://www.cmjornal.pt/domingo/detalhe/geracao-ciencia-ciencia-viva-promove-cultura-cientifica-e-tecnologica-ha-30-anos","categoria":"INNOVATION","lang":"en"},{"fonte":"Marketeer","pais":"Portugal","titulo":"NOS highlights the role of technology in transforming experiences and connections","resumo":"Telecommunications operator NOS showcased innovative technology solutions aimed at connecting people and transforming entertainment experiences.\nThe company focuses on high-speed 5G connectivity and advanced digital infrastructure to support modern demand.\nThe initiative reinforces the brand's commitment to modernizing networks in Portugal.\nThis technological evolution promises to positively impact both residential customers and the corporate sector.","link":"https://marketeer.sapo.pt/nos-a-tecnologia-por-detras-da-emocao/","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Ciência Viva promotes expedition to discover wild mammals in Mata de Vilar","resumo":"Ciência Viva is organizing a hands-on activity focused on identifying and observing wild mammals in Mata de Vilar.\nThe event aims to bring the local community closer to regional biodiversity and environmental preservation.\nExperts will guide the public in an immersive learning experience about ecology and native fauna.\nThe action encourages society's engagement with scientific knowledge in the field.","link":"https://sapo.pt/artigo/ciencia-viva-leva-descoberta-dos-mamiferos-selvagens-a-mata-de-vilar-a-8-de-agosto-6a704a4c3f3011d88f026a88","categoria":"SCIENCE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
