alaxy Battleship 700 concept model, the system promises real-time torque and traction optimization via advanced algorithms. The innovation reflects the commitment of Chinese automakers to dominating the high-performance intelligent vehicle segment.","link":"https://www.bjnews.com.cn/detail/1788053553129596.html","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"新浪网","pais":"China","titulo":"SUPCON Recognized as Leading Industrial Artificial Intelligence Provider in China","resumo":"SUPCON stood out in a mapping report by consulting firm IDC after being named a core provider in the artificial intelligence and autonomous agents ecosystem for Chinese industry. The validation reinforces the strategic role of production process automation through deep learning algorithms. The digital transformation of Chinese factories continues to drive demand for advanced, integrated technological solutions.","link":"https://k.sina.com.cn/article_5953466437_162dab0450670baoko.html?from=tech","categoria":"INDUSTRIAL AI","lang":"en"},{"fonte":"24Horas.pt","pais":"China","titulo":"China Relies on Advanced Technological Solutions to Combat Mosquito Proliferation","resumo":"China is intensifying its use of cutting-edge technologies, including genetic modification, radiation sterilization, and drone monitoring, to control populations of disease-transmitting mosquitoes. The program aims to curb the spread of illnesses such as dengue and yellow fever in urban and rural areas. This innovative approach combines biological methods with digital tools to ensure a more effective and ecologically sustainable sanitary response.","link":"https://24horas.pt/noticia/china-aposta-na-tecnologia-para-combater-os-mosquitos","categoria":"HEALTH INNOVATION","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"China Achieves Decisive Breakthroughs in New Precious Metal Materials for Medical Use","resumo":"Chinese scientists have announced fundamental breakthroughs in the development and processing of precious metal alloys applied to high-precision medical devices. The new technologies increase the biocompatibility and durability of advanced implants and surgical instruments. This innovation reduces dependence on imported supplies and strengthens the supply chain of the country's high-complexity healthcare industry.","link":"https://www.stdaily.com/web/gdxw/2026-08/30/content_572111.html","categoria":"MATERIALS SCIENCE","lang":"en"},{"fonte":"Prop News Time","pais":"India","titulo":"L\u0026T Inaugurates Technology Campus in New Town, Kolkata, with Capacity for 5,800 Professionals","resumo":"Larsen \u0026 Toubro (L\u0026T) has officially inaugurated a new state-of-the-art technology campus located in New Town, Kolkata. The facility was designed to accommodate up to 5,800 technology and engineering professionals, strengthening local infrastructure. The initiative aims to drive technological innovation in the region, attract new talent, and expand the company's operational footprint in eastern India. The move cements the city as an emerging hub for technological development and engineering services in the country.","link":"https://propnewstime.com/latestnewsstories/MzUzNTU=/l-t-inaugurates-technology-campus-in-kolkata-s-new-town-with-capacity-for-5-800-professionals","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"India Today NE","pais":"India","titulo":"Arunachal Agricultural Entrepreneur Offers 10 Acres of Land to Promote Tissue Culture Technology","resumo":"An agricultural entrepreneur in Arunachal Pradesh has made 10 acres of land available dedicated to advancing biotechnology in the region. The main objective of the initiative is to encourage research and the practical application of plant tissue culture technology in the state. The proposal seeks to improve the production of high-quality seedlings, increase local crop productivity, and empower farmers. Through this innovative approach, the expectation is to modernize the regional agricultural sector and boost ova de Lisboa has established a cooperation agreement with an educational institution in Macau aimed at creating new academic programs focused on nanotechnology. The initiative seeks to strengthen scientific and educational ties between Portugal and China, encouraging joint research in advanced materials. The new courses are expected to attract international talent and drive technological innovation in microelectronics and materials science.","link":"https://www.correiodamanhacanada.com/nova-de-lisboa-e-universidade-em-macau-querem-lancar-cursos-em-nanotecnologia/","categoria":"NANOTECHNOLOGY","lang":"en"},{"fonte":"RTP","pais":"Portugal","titulo":"University of Lisbon Launches New Degree in Data Science","resumo":"The University of Lisbon has announced the creation of a new undergraduate degree focused exclusively on Data Science. The training aims to meet high market demand for professionals skilled in processing and analyzing large volumes of information. The academic program encompasses fundamental disciplines in mathematics, statistics, computing, and machine learning to drive digital transformation.","link":"https://www.rtp.pt/noticias/pais/universidade-de-lisboa-tem-uma-nova-licenciatura-em-ciencia-de-dados_v1762296","categoria":"DATA SCIENCE","lang":"en"},{"fonte":"e-global.pt","pais":"Portugal","titulo":"Technology Helps Winegrowers Reduce Costs and Tackle Climate Change in Vineyards","resumo":"The wine sector is adopting advanced technological solutions, such as soil sensors and automation, to curb the severe effects of weather fluctuations. These innovative tools allow for the optimization of water and input usage, resulting in a significant reduction in operational costs in the field. Consequently, producers are able to maintain harvest quality and ensure financial sustainability during periods of drought and high temperatures.","link":"https://e-global.pt/noticia/vida/tecnologia/tecnologia-ajuda-viticultores-a-reduzir-custos-e-enfrentar-alteracoes-climaticas-nas-vinhas/amp/","categoria":"AGTECH","lang":"en"},{"fonte":"Meteored Portugal","pais":"Portugal","titulo":"Nature vs. Technology: Phenomena Halting European Power Plants","resumo":"Extreme weather events are imposing severe bottlenecks on the full operation of energy generation infrastructure in Europe. Prolonged droughts and heatwaves have forced nuclear and hydroelectric plants to reduce or halt their operational activities. This scenario challenges the stability of the continent's electrical grids and forces the energy sector to seek more resilient technological solutions.","link":"https://www.tempo.pt/noticias/ciencia/a-natureza-contra-a-tecnologia-os-fenomenos-que-estao-a-travar-as-centrais-europeias.html","categoria":"ENERGY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
