karaoke technology, expanding speaker lineup","resumo":"Tronsmart has launched the Halo 210, a new speaker equipped with artificial intelligence technology tailored for karaoke. The device is capable of optimizing vocals and adjusting sound frequencies in real time, enhancing the user experience. The launch expands the brand's Halo lineup and reflects the growing integration of AI into daily consumer electronics.","link":"https://www.prnewswire.co.uk/news-releases/tronsmart-launches-halo-210-with-ai-powered-karaoke-technology-expanding-the-halo-party-speaker-series-302877152.html","categoria":"PRODUCT LAUNCH","lang":"en"},{"fonte":"Diario AS","pais":"Spain","titulo":"Major iOS 27 feature bypassed in Spain: Apple blames European Union, sets no date for Siri AI","resumo":"Apple has announced that the new artificial intelligence features in iOS will not be rolled out immediately in Spain and other European Union member states. The company justified the decision by pointing to regulatory uncertainties imposed by EU digital market legislation. This temporary barrier delays the arrival of the revamped Siri AI assistant for millions of regional users, highlighting the friction between major tech companies and European regulators.","link":"https://as.com/meristation/betech/la-gran-novedad-de-ios-27-no-llega-a-espana-apple-culpa-a-la-union-europea-y-no-pone-fecha-a-siri-ai-f202609-n/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Diario AS","pais":"Spain","titulo":"Scientists agree: Changes in speech speed may be early signs of Alzheimer's before memory loss","resumo":"Researchers have identified that subtle changes in speech rhythm and speed can serve as early indicators of the onset of Alzheimer's disease. These linguistic variations often manifest even before the traditional memory lapses associated with cognitive decline. The finding opens new doors for non-invasive early diagnosis, allowing medical treatments and interventions to begin at earlier, more promising stages of the disorder.","link":"https://as.com/actualidad/ciencia/los-cientificos-coinciden-los-cambios-en-la-velocidad-del-habla-pueden-ser-sintomas-de-alzheimer-antes-de-perder-la-memoria-f202609-n/","categoria":"SCIENCE","lang":"en"},{"fonte":"Estrella Digital","pais":"Spain","titulo":"Indra develops quantum technology for European defense","resumo":"Spanish multinational Indra is leading strategic initiatives aimed at developing quantum solutions applied to security. The project aims to strengthen Europe's technological sovereignty against sophisticated cyberattacks and threats to critical infrastructure. With this innovation, Europe's defense industry seeks to secure a vanguard position on the global stage, dramatically increasing the precision and security of confidential data processing.","link":"https://www.estrelladigital.es/articulo/noticias-en-la-red/indra-desarrolla-tecnologia-cuantica-defensa-europea/20260914220707451080.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"EL PAÍS","pais":"Spain","titulo":"Europe faces the AI challenge: Regulating a technology led by the US and China","resumo":"The European Union faces the dilemma of implementing strict regulations for artificial intelligence without stifling local innovation against global superpowers. While the United States and China lead the race in investments and technological development, the European bloc is attempting to establish international ethical standards. The central challenge is balancing the protection of citizens' rights with the creation of a competitive ecosystem capable of attracting major companies and top industry talent.","link":"https://elpais.com/videos/2026-09-15/que-papel-puede-jugar-europa-en-la-guerra-entre-china-y-estados-unidos-por-dominar-la-ia.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Levante-EMV","pais":"Spain","titulo":"Science with Valencian DNA heads to space to monitor plant health","resumo":"A scientific project developed in the Valencia region is sending advanced technology into space with the goal of monitoring plant ecosystems from Earth orbit. Space sensors will collect precise data on the health of forests and crops, helping to prevent water stress and agricultural pests. This mission reinforces the role of space science in combating climate change and sustainably managing the planet's natural resources.","link":"https://www.levante-emv.com/comunitat-valenciana/2026/09/14/ciencia-adn-valenciano-pone-rumbo-134271603.html","categoria":"SCIENCE","lang":"en"},{"fonte":"bbc.com","pais":"Spain","titulo":"What is known about the Geran-3, the new jet drones Russia is using against Ukraine","resumo":"The deployment of the new Geran-3 jet-powered drone model signals an escalation in the technological complexity of current armed conflicts in Eastern Europe. Equipped with greater speed and superior range compared to earlier models, these devices have caused severe impacts on Ukrainian infrastructure. Military experts are analyzing the strategic implications of using these high-performance unmanned aerial vehicles on the battlefield balance of power.","link":"https://www.bbc.com/mundo/articles/cwyz1293enxo","categoria":"MILITARY INNOVATION","lang":"en"},{"fonte":"La Voz de Galicia","pais":"Spain","titulo":"Local knowledge combined with technology accelerates wildfire response","resumo":"The union between the traditional knowledge of local communities and advanced technological monitoring systems is transforming wildfire suppression. Tools such as smart sensors, artificial intelligence, and satellite mapping are combined with the geographic and historical expertise of regional firefighters. This integrated approach allows for the detection of fire outbreaks with unprecedented speed, optimizing dispatch and minimizing environmental and economic damage.","link":"https://www.lavozdegalicia.es/noticia/somosagro/forestal/2026/09/14/saber-local-unido-tecnologia-acelera-respuesta-ante-incendios/00031789411287371148295.htm","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"EL PAÍS","pais":"Spain","titulo":"Artificial intelligence emerges as a solution where doctors, teachers, and agronomists are scarce","resumo":"The shortage of qualified professionals in essential sectors is driving the adoption of automated systems based on artificial intelligence. In healthcare, education, and agriculture, AI tools are stepping in to support diagnostics, personalize learning, and optimize crop yields. This digital transformation seeks to bridge demographic and structural gaps, ensuring the continuity of basic services in remote areas or regions facing specialized labor shortages.","link":"https://elpais.com/planeta-futuro/2026-09-15/la-ia-como-salvavidas-donde-faltan-medicos-profesores-y-asesores-agricolas.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Presseportal","pais":"Germany","titulo":"Segway Navimow presents Terranox PM1400 technology at GaLaBau 2026","resumo":"Segway Navimow unveiled its new Terranox PM1400 technology during the GaLaBau 2026 event, highlighting advancements in automation and smart landscaping. The device promises to transform green space maintenance by integrating new sensors and improving operational efficiency. This innovation reinforces the trend toward robotic automation for outdoor maintenance and professional landscaping.","link":"https://www.presseportal.de/pm/183411/40000153","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"T-Online","pais":"Germany","titulo":"Standing 365 meters tall, the world's tallest wind turbine promises to revolutionize energy generation","resumo":"A new 365-meter-tall wind turbine is being developed with the promise of revolutionizing clean energy generation worldwide. The project aims to capture stronger, more consistent winds at high altitudes, dramatically increasing electricity production efficiency. The initiative represents a major milestone in the global energy transition and the advancement of sustainable engineering.","link":"https://www.t-online.de/finanzen/aktuelles/wirtschaft/id_101431976/windturm-bei-schipkau-365-meter-hoch-so-entsteht-das-rekord-projekt.html","categoria":"SCIENCE","lang":"en"},{"fonte":"PZ-news","pais":"Germany","titulo":"BMW registers 100,000 orders for the iX3 in Europe alone","resumo":"BMW has reached a significant milestone with 100,000 orders for its electric iX3 model in the European market alone. The result highlights strong demand and the accelerated transition to electric vehicles in the region, solidifying the German automaker's position in the sector. The high sales volume reflects growing consumer acceptance of high-tech sustainable mobility.","link":"https://www.pz-news.de/wirtschaft/wirtschaft-weltweit_artikel,-100000-Bestellungen-fuer-iX3-von-BMW-allein-in-Europa-_arid,2368602.html","categoria":"BUSINESS","lang":"en"},{"fonte":"观察者网","pais":"Germany","titulo":"Germany bets on 'economic security' and targets actions against China","resumo":"The German government is intensifying economic security policies focused on reducing its reliance on China. The strategy aims to protect strategic industrial sectors, including technology and critical infrastructure, from external influences. This shift reflects growing global geopolitical tensions and Europe's effort to ensure sovereignty in essential supply chains.","link":"https://www.guancha.cn/GuoJi%C2%B7ZhanLue/2026_09_15_900644.shtml","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"Deutschlandfunk","pais":"Germany","titulo":"German government takes AI warnings seriously, while Trump rejects regulations","resumo":"The German federal government has stated that it takes expert warnings regarding the risks associated with artificial intelligence very seriously. In contrast, Donald Trump expressed opposition to new regulations, dismissing the warnings as conspiracy theories. The debate highlights global divergences on how to balance safety and government control amid the rapid advancement of AI.","link":"https://www.deutschlandfunk.de/bundesregierung-nehmen-ki-warnungen-sehr-ernst-trump-sieht-verschwoerung-und-lehnt-regulierung-ab-100.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Euronews.com","pais":"Germany","titulo":"IFA Berlin 2026 Highlights Daily Integration of Artificial Intelligence","resumo":"The IFA Berlin 2026 technology fair focused on the practical application of artificial intelligence in everyday consumer life. Several manufacturers showcased integrated home appliances, mobile devices, and residential systems that use AI to optimize tasks and improve energy efficiency. The event solidifies the trend of making artificial intelligence an invisible yet essential presence in daily routines.","link":"https://pt.euronews.com/next/2026/09/14/tecnologia-do-quotidiano-em-destaque-na-ifa-berlin-2026","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"つくばサイエンスニュース","pais":"Japan","titulo":"Technology Developed to Assess Kidney Injuries Using Only Light Irradiation","resumo":"Japanese researchers have developed a new non-invasive method capable of diagnosing kidney problems using only light irradiation. The technique allows real-time monitoring of kidney function and tissue damage without the need for complex biopsies or painful blood tests. This scientific innovation promises to revolutionize the early detection of chronic kidney diseases and optimize patient treatment.","link":"https://www.tsukuba-sci.com/?column02=%E5%85%89%E3%82%92%E7%85%A7%E5%B0%84%E3%81%99%E3%82%8B%E3%81%A0%E3%81%91%E3%81%A7%E8%85%8E%E8%87%93%E3%81%AE%E9%9A%9C%E5%AE%B3%E3%82%92%E8%AA%BF%E3%81%B9%E3%82%8B%E6%8A%80%E8%A1%93%E3%82%92%E9%96%8B","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"TBS NEWS DIG","pais":"Japan","titulo":"Kumamoto and Yamagata Universities and German Institutions Launch Joint Research on Semiconductor Packaging","resumo":"Japan's Kumamoto and Yamagata universities have established a strategic partnership with research institutes in Germany to advance semiconductor packaging technology. The initiative seeks to strengthen international collaboration and drive industrial innovation in the Kumamoto region, a growing microchip hub. The project supports the integration of local companies into the global technology supply chain.","link":"https://newsdig.tbs.co.jp/articles/-/2944840","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"Ritsumeikan University Uses Topology to Create Fray-Resistant Fabrics","resumo":"Researchers at Ritsumeikan University have applied mathematical concepts of topology to analyze the physical structure of fabrics at a fundamental level. By understanding how threads intertwine and distribute forces, the team was able to design a new type of fabric highly resistant to fraying. The discovery unites advanced mathematics and materials science to transform the development of industrial textiles and apparel.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_robot/pt20260915000013.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Newsroom Toyota Europe","pais":"Japan","titulo":"Toyota Expands Hydrogen Fuel Cell Technology to Heavy-Duty Transport","resumo":"Toyota is expanding the application of its hydrogen solutions to power heavy-duty trucks and large commercial vehicles. The strategy aims to accelerate the decarbonization of the global logistics sector by offering an alternative with high driving range and rapid refueling. With this initiative, the Japanese automaker solidifies its leadership role in the transition toward zero-emission transport ecosystems.","link":"https://newsroom.toyota.eu/toyota-expands-hydrogen-fuel-cell-technology-for-heavy-duty-transport/","categoria":"CLEAN ENERGY","lang":"en"},{"fonte":"読売新聞","pais":"Japan","titulo":"Science Museum Registers Electric Power Steering and Robotic Suits as Future Technology Heritage","resumo":"Japan's National Museum of Nature and Science has added 13 new historical inventions to its official Future Technology Heritage registry. Among the selected items are the world's first electrically assisted steering system and wearable robotic suits for motor assistance. The recognition highlights milestones in Japanese engineering that shaped modern society and influenced global technological advancement.","link":"https://www.yomiuri.co.jp/science/20260915-GYT1T00227/","categoria":"INNOVATION","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"MODEC Reaches Technological Milestone with Solid Oxide Fuel Cells on FPSO Vessels","resumo":"Japan's MODEC has obtained new technology certification from maritime authority ABS for the installation of Solid Oxide Fuel Cells (SOFC) on FPSO units. The implementation of the system aims to drastically reduce greenhouse gas emissions in offshore oil and gas exploration. This technical advancement represents a major step toward sustainability in offshore energy infrastructure.","link":"https://www.nikkei.com/markets/company/sys/redirect_dis.aspr?ano=g4qzs0\u0026t=https://www.nikkei.com/nkd/disclosure/tdnr/20260915536704/","categoria":"ENGINEERING","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Fukuoka Prefecture Designated as Strategic Green Transformation Region for Datacenters","resumo":"Japan's Ministry of Economy, Trade and Industry has qualified Fukuoka Prefecture as a strategic Green Transformation area focused on datacenters. The goal is to attract major technology investments by promoting the sustainable use of renewable energies and high-efficiency infrastructure. The designation boosts Fukuoka in building a regional advanced computing hub focused on decarbonization.","link":"https://news.yahoo.co.jp/articles/010b7c8a2279432ad58c4b6196931575350ccfc6","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Ricoh","pais":"Japan","titulo":"Ricoh Invests in Mental Health Technology Company Intellect","resumo":"Japanese multinational Ricoh has announced an investment in startup Intellect through its corporate innovation fund. Intellect develops digital platforms focused on mental health care and workplace wellbeing. The investment reflects Ricoh's expansion into health-focused technologies and corporate digital transformation.","link":"https://www.ricoh.com/release/2026/0915_1","categoria":"INVESTMENT","lang":"en"},{"fonte":"G1","pais":"China","titulo":"China Accuses Hostile Forces of Abusing AI Amid Global Tensions","resumo":"The Chinese government sharply criticized the misuse of artificial intelligence technologies by foreign agents, alleging risks to national security. The statement comes after remarks by former US President Donald Trump claiming leadership in the global tech race. The move reflects rising regulatory restrictions and intensifying geopolitical competition for hegemony in the artificial intelligence sector.","link":"https://g1.globo.com/mundo/noticia/2026/09/14/china-alerta-para-risco-da-ia-a-sua-seguranca-nacional.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"上观新闻","pais":"China","titulo":"Shanghai Launches Scientific Data Platform Covering 52 Disciplines","resumo":"A new scientific data management and sharing platform has been launched in Shanghai to support the advancement of research and innovation. The digital infrastructure encompasses 52 academic disciplines and seeks to establish a new paradigm for data-driven science in the Yangtze River Delta region. The initiative aims to ensure information flow security and accelerate strategic technological discoveries.","link":"https://www.jfdaily.com/news/detail?id=1176796","categoria":"SCIENCE","lang":"en"},{"fonte":"东方财富","pais":"China","titulo":"Chinese Automakers Move Away from Simple Assembly to Focus on Proprietary Technology","resumo":"Automobile manufacturers in China are shifting from the outsourced component assembly model to the in-house development of core technologies. This strategic move seeks to consolidate technological sovereignty in the automotive sector, especially in the electric and connected vehicle market. This autonomy enhances the global competitiveness of Chinese companies against international rivals.","link":"https://finance.eastmoney.com/a/202609153874464549.html","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"观察者网","pais":"China","titulo":"German Press Highlights China's Technological Optimism as Unreachable for Europe","resumo":"The German newspaper Süddeutsche Zeitung published an analysis impressed by the accelerated pace and technological optimism experienced in China. The publication notes that China's innovation ecosystem and public acceptance of new technologies are difficult for Germany and Europe to replicate. The article emphasizes the cultural and structural contrast regarding the immediate adoption of advanced solutions in everyday life.","link":"https://www.guancha.cn/guanshiyin/2026_09_15_900565.shtml","categoria":"INNOVATION","lang":"en"},{"fonte":"sdxc.gov.cn","pais":"China","titulo":"Rail-Low Altitude Integration Model Boosts Shandong's Economy","resumo":"The city of Qingdao is implementing a pioneering strategy that combines rail transport and low-altitude logistics with drones and aerial vehicles. The model integrates data and infrastructure to optimize urban transport and express delivery services in Shandong province. This innovative approach serves as a reference for the country's expanding low-altitude economy sector.","link":"https://www.sdxc.gov.cn/sy/jrywsy/202609/t20260915_18117228.htm","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Demonstration in China Integrates AI, Automation, and Ecology in the Agricultural Sector","resumo":"A technical meeting brought together experts to demonstrate the integration of artificial intelligence, autonomous machines, and ecological practices in agriculture. The experimental project seeks to automate field processes, increasing productivity and reducing environmental impacts in grain production. The advancement represents a milestone in the modernization of Chinese agribusiness through the use of cutting-edge technologies.","link":"https://news.sciencenet.cn/htmlnews/2026/9/571475.shtm","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Bloomberg.com","pais":"China","titulo":"Artificial Intelligence revolutionizes multiple sectors of the Chinese economy","resumo":"China's massive adoption of artificial intelligence is transforming industrial productivity, logistics, and financial services. Companies in the country use advanced algorithms and automation to optimize supply chains and create new business opportunities. AI-driven digital transformation consolidates China's leadership in cost-effective applications of the technology.","link":"https://www.bloomberg.com/news/videos/2026-09-15/how-ai-is-transforming-china-s-economy-video","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"China creates experimental system to accelerate adoption of innovative medical technologies","resumo":"China has started to pre-approve prices for new technologies in the health area in order to speed up its entry into the market. The measure aims to reduce bureaucracy and accelerate the arrival of advanced medical treatments and devices in the country's hospitals. The pilot project promises to benefit the biotechnology sector and improve the population's access to high-tech medical care.","link":"https://www.xinhuanet.com/20260915/bdc56ab8cd6c4a4da7cbfd37aa8ce2cb/c.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"The Wire India","pais":"India","titulo":"IEM-HEALS 2026: Where Global Health Innovation Meets Technology, Ideas and Impact","resumo":"QUERY LENGTH LIMIT EXCEEDED. MAX ALLOWED QUERY : 500 CHARS","link":"https://m.thewire.in/article/ptiprnews/iem-heals-2026-where-global-health-innovation-meets-technology-ideas-and-impact","categoria":"TECHNOLOGY AND HEALTH","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"World Circular Econ   const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
