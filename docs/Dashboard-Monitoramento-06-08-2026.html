e year 2047.","link":"https://www.moneycontrol.com/news/business/economy/labour-reforms-will-help-india-move-closer-to-30-trillion-economy-goal-by-2047-13995721.html","categoria":"ECONOMY","lang":"en"},{"fonte":"Deccan Herald","pais":"India","titulo":"Gauribidanur: How a Quiet Landscape Became a Hub for Science","resumo":"The quiet town of Gauribidanur has established itself as an important center for scientific research and radio astronomy in India. Thanks to its low-interference environment and infrastructure investments, the region has come to host major observatories and fundamental experiments. The transformation highlights the location's strategic role in advancing astrophysical physics and scientific exploration in the country.","link":"https://www.deccanherald.com/india/karnataka/gauribidanur-how-a-quiet-landscape-became-a-hub-for-science-4100916","categoria":"SCIENCE","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"India's Economy Projected to Grow Around 7% in Q1 of FY 2027, Report Says","resumo":"A new report released by SBI Research projects India's Gross Domestic Product (GDP) growth close to 7% in the first quarter of fiscal year 2027. The optimism is driven by strong domestic consumption, the recovery of the services sector, and continuous industrial expansion. The projections reinforce the country's position as one of the fastest-growing major economies on the global stage.","link":"https://newsonair.gov.in/indias-economy-is-likely-to-grow-around-7-in-q1-fy27-sbi-research-report/","categoria":"MARKET","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Neuraspace Secures €15.6 Million to Accelerate AI Space Technology","resumo":"Portuguese startup Neuraspace has secured a €15.6 million investment to boost its artificial intelligence solutions aimed at space traffic management. The funding will help in the company's global expansion and the enhancement of systems to prevent satellite collisions and debris in Earth orbit. The initiative consolidates Portugal's strategic position in the emerging sector of cutting-edge space technologies.","link":"https://pmemagazine.sapo.pt/neuraspace-capta-156-me-para-acelerar-tecnologia-espacial-com-ia/","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"Mais Algarve","pais":"Portugal","titulo":"Portugal Debuts First Computed Tomography Equipment with Photon-Counting Technology","resumo":"Portugal has received its first computed tomography scanner equipped with innovative photon-counting technology. This advancement in diagnostic medicine makes it possible to obtain very high-resolution medical images with significantly reduced radiation doses. The system promises to revolutionize early diagnosis in critical areas such as cardiology and oncology in the country.","link":"https://maisalgarve.pt/2026/08/05/portugal-estreia-primeiro-equipamento-de-tomografia-computorizada-com-tecnologia-de-contagem-de-fotoes/","categoria":"HEALTH","lang":"en"},{"fonte":"Dinheiro Vivo","pais":"Portugal","titulo":"Major Company CEOs Unite in Initiative to Mitigate Artificial Intelligence Risks","resumo":"Leaders of major corporations have joined forces in an unprecedented initiative focused on assessing and mitigating risks associated with artificial intelligence. The group seeks to establish ethical guidelines and security standards to ensure the responsible implementation of the technology in the corporate environment. The collaboration responds to growing concerns about privacy, cybersecurity, and impacts on the labor market.","link":"http://dinheirovivo.dn.pt/ceos-de-grandes-empresas-juntam-se-em-iniciativa-para-trabalhar-riscos-da-ia","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"Portuguese Scientists Will Study Nature's Sounds to Discover the Eclipse's Effect on Animals","resumo":"A team of Portuguese researchers will use high-precision audio sensors to capture ecosystem sounds during a solar eclipse. The main objective of the study is to analyze how sudden light variation alters the behavior and communication of local wildlife. This innovative acoustic approach will bring new scientific data on the impact of astronomical phenomena on the animal kingdom.","link":"https://expresso.pt/sociedade/ciencia/2026-08-06-cientistas-portugueses-vao-estudar-sons-da-natureza-para-descobrir-o-efeito-do-eclipse-nos-animais-4fbb8061?utm_source=expresso\u0026utm_medium=category\u0026utm_campaign=WEB\u0026utm_content=/sociedade/ciencia/2026-08-06-cientistas-portugueses-vao-estudar-sons-da-natureza-para-descobrir-o-efeito-do-eclipse-nos-animais-4fbb8061","categoria":"SCIENCE","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"Free Solar Eclipse Viewing Glasses Sell Out in Less Than 24 Hours","resumo":"Great anticipation surrounding the upcoming solar eclipse sparked a rush for adequate visual protection equipment. Thousands of special glasses distributed free of charge by scientific institutions sold out completely in less than a day. The phenomenon generated massive public engagement and highlighted growing popular interest in astronomical events.","link":"https://www.publico.pt/2026/08/05/ciencia/noticia/oculos-gratuitos-observacao-eclipse-solar-esgotaram-menos-24-horas-2184158","categoria":"TRENDS","lang":"en"},{"fonte":"reconquista.pt","pais":"Portugal","titulo":"Technology is Already Saving the Lives of Elderly People in Portugal","resumo":"The use of connected devices and smart telecare systems is transforming the care provided to the elderly population in the country. Fall sensors and remote health monitors are enabling prompt and effective medical interventions during domestic emergencies. This technological integration improves quality of life, ensuring greater autonomy and security for seniors.","link":"https://www.reconquista.pt/articles/tecnologia-ja-salva-vidas-a-idosos","categoria":"INNOVATION","lang":"en"},{"fonte":"HealthNews","pais":"Portugal","titulo":"Catholic University and IDRYL Technologies Join Forces for Data Science in the Business Sector","resumo":"Catholic University has established a strategic partnership with IDRYL Technologies to apply advanced data science solutions to the business ecosystem. The cooperation aims to bring academic research closer to market demands, developing tailored analytical tools for decision-making. The initiative promises to accelerate digital transformation and increase the competitiveness of local companies.","link":"https://healthnews.pt/2026/08/06/universidade-catolica-e-idryl-technologies-unem-forcas-em-prol-da-ciencia-de-dados-aplicada-ao-tecido-empresarial/","categoria":"DATA SCIENCE","lang":"en"},{"fonte":"Human Resources Portugal","pais":"Portugal","titulo":"Deloitte's BrightStart Program to Support Tech Students in Four Regions of the Country","resumo":"Deloitte has announced the expansion of its BrightStart program, designed to fund and train new talent in technology in Portugal. The initiative will benefit students in four strategic regions, integrating academic training and hands-on experience in large-scale projects. The project seeks to combat the shortage of qualified professionals and boost the regional tech ecosystem.","link":"https://hrportugal.sapo.pt/programa-brightstart-da-deloitte-vai-apoiar-estudantes-de-tecnologia-em-quatro-regioes-do-pais/","categoria":"EDUCATION","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
</body>
