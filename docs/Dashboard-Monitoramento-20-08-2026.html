  // Injeta os dados originais no frontend
  const data = [{"fonte":"bombabomba.com.br","pais":"Brasil","titulo":"Plenário chancela mudança na política estadual de fomento à inovação em IA","resumo":"O plenário aprovou alterações significativas na política estadual destinada a incentivar o desenvolvimento e a inovação em inteligência artificial.\nA medida busca modernizar o ecossistema tecnológico local, atrair novos investimentos e regulamentar o uso ético de tecnologias emergentes no setor público e privado.\nCom isso, o estado pretende consolidar sua posição estratégica na criação de soluções digitais avançadas e na formação de mão de obra qualificada.","link":"https://bombabomba.com.br/plenario-chancela-mudanca-na-politica-estadual-de-fomento-a-inovacao-em-ia/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"noticias.r7.com","pais":"Brasil","titulo":"Maior evento de tecnologia da América Latina debate a implementação da TV 3.0 no Brasil","resumo":"O maior evento de tecnologia da América Latina reuniu especialistas e líderes do setor para discutir os avanços da TV 3.0 no Brasil.\nA nova tecnologia promete revolução na experiência dos telespectadores, integrando sinal aberto de alta qualidade com interatividade e transmissão via internet.\nA implementação do novo padrão representa um marco na convergência de mídias e no futuro das comunicações no país.","link":"https://noticias.r7.com/jr-24h/boletim-jr-24h/video/maior-evento-de-tecnologia-da-america-latina-debate-a-implementacao-da-tv-30-no-brasil-20082026/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Vietnam.vn","pais":"Brasil","titulo":"Medicamentos contra o câncer que utilizam a tecnologia de mRNA alcançam avanços significativos em ensaios clínicos","resumo":"Ensaios clínicos recentes apontam avanços expressivos no desenvolvimento de tratamentos contra o câncer baseados na tecnologia de RNA mensageiro.\nA abordagem inovadora permite instruir o próprio sistema imunológico do paciente a reconhecer e combater células tumorais de forma altamente precisa.\nOs resultados sinalizam uma nova era para a oncologia, acelerando o surgimento de terapias personalizadas e mais eficazes.","link":"https://www.vietnam.vn/pt/thuoc-tri-ung-thu-bang-cong-nghe-mrna-dat-dot-pha-trong-thu-nghiem-lam-sang","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Estadão","pais":"Brasil","titulo":"O que a ciência sabe sobre a relação entre vapes e câncer","resumo":"Pesquisadores e entidades de saúde vêm intensificando estudos sobre os impactos do uso prolongado de vapes na saúde pulmonar e no desenvolvimento de tumores.\nEmbora apresentados como alternativas menos nocivas, os cigarros eletrônicos contêm substâncias tóxicas capazes de causar mutações celulares e inflamações graves.\nO consenso científico reforça a necessidade de regulação rigorosa e campanhas de conscientização sobre os riscos desses dispositivos.","link":"https://www.estadao.com.br/tv/pulsa/o-que-a-ciencia-sabe-sobre-a-relacao-entre-vapes-e-cancer/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Forbes Brasil","pais":"Brasil","titulo":"“A IA não substitui o julgamento humano”: como a tecnologia tem ajudado a fiscalizar operações na B3","resumo":"A B3 tem utilizado ferramentas de inteligência artificial para otimizar o monitoramento e a fiscalização de transações no mercado financeiro.\nEspecialistas destacam que, embora os algoritmos aumentem a agilidade no diagnóstico de anomalias, a decisão final permanece dependente do julgamento humano.\nEssa sinergia entre tecnologia e supervisão analítica fortalece a transparência e a segurança das operações no ambiente de bolsa.","link":"https://forbes.com.br/forbes-money/2026/08/como-ia-ajuda-fiscalizar-operacoes-b3/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Valor Econômico","pais":"Brasil","titulo":"Lagarde alerta que Europa não pode ficar para trás na transformação da economia pela IA","resumo":"A presidente do Banco Central Europeu, Christine Lagarde, alertou sobre a urgência de a Europa acelerar a adoção de inteligência artificial.\nSegundo a dirigente, ficar para trás na transformação digital pode comprometer seriamente a competitividade econômica e a produtividade do bloco.\nO apelo reforça o debate global sobre regulação equilibrada, incentivos à inovação e soberania tecnológica na nova era digital.","link":"https://valor.globo.com/financas/noticia/2026/08/19/lagarde-alerta-que-europa-no-pode-ficar-para-trs-na-transformao-da-economia-pela-ia.ghtml","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"g1.globo.com","pais":"Brasil","titulo":"Ex-executivo da Meta diz que Zuckerberg deixou segurança infantil em segundo plano","resumo":"Um ex-executivo da Meta declarou publicamente que as preocupações com a segurança infantil na plataforma foram preteridas em relação a metas de crescimento.\nAs revelações alimentam debates regulatórios no mundo todo sobre a responsabilidade das Big Techs no combate ao assédio e conteúdos nocivos a menores.\nO caso intensifica a pressão de órgãos reguladores por regras mais duras e transparência na gestão de algoritmos voltados aos jovens.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/19/meta-julgamento-zuckerberg.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Justiça mantém multa de R$ 11 milhões à Apple por publicidade enganosa","resumo":"A Justiça manteve a aplicação de uma multa de R$ 11 milhões contra a Apple por práticas consideradas de publicidade enganosa no Brasil.\nA decisão refere-se à venda de aparelhos sem o carregador de tomada e a alegações de propaganda sobre a resistência dos dispositivos à água.\nA determinação reafirma os direitos dos consumidores nacionais e impõe sanções a grandes corporações do setor de tecnologia.","link":"https://www1.folha.uol.com.br/mercado/2026/08/justica-mantem-multa-de-r-11-milhoes-a-apple-por-publicidade-enganosa.shtml","categoria":"DIREITO DIGITAL","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"NASA descobre que micróbios humanos podem sobreviver no Polo Sul da Lua","resumo":"Pesquisadores da NASA identificaram que certos micróbios associados ao corpo humano possuem a capacidade de sobreviver nas condições extremas do Polo Sul lunar.\nA descoberta levanta alertas importantes sobre os riscos de contaminação biológica em futuras missões de exploração espacial habitadas.\nOs cientistas agora estudam novos protocolos de esterilização e contenção para proteger ecossistemas extraterrestres de organismos terrestres.","link":"https://science.nasa.gov/humans-in-space/human-related-microbes-may-survive-moons-south-pole-nasa-finds/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Science Daily","pais":"Estados Unidos","titulo":"Físicos do MIT descobrem elétrons se reorganizando como gelo em material quântico","resumo":"Cientistas do MIT observaram um comportamento inédito onde elétrons se estruturam de maneira semelhante ao gelo dentro de um material quântico.\nO fenômeno revela novas propriedades do comportamento quântico da matéria sob condições específicas de laboratório.\nA descoberta pode abrir caminho para o desenvolvimento de novos dispositivos eletrônicos e avanços na computação quântica.","link":"https://www.sciencedaily.com/releases/2026/08/260819041231.htm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"g1.globo.com","pais":"Estados Unidos","titulo":"Google paga US$ 10 milhões por dados de companhia aérea falida para treinar IA","resumo":"A gigante da tecnologia adquiriu por US$ 10 milhões a base de dados de uma empresa aérea falida com o objetivo de aprimorar seus modelos de inteligência artificial.\nA transação destaca o crescente valor comercial de grandes volumes de dados de consumo para o treinamento de sistemas avançados de aprendizado de máquina.\nA iniciativa levanta discussões no setor sobre privacidade e os limites do uso de dados corporativos em falência para inovação tecnológica.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/19/google-paga-us-10-milhoes-por-dados-de-companhia-aerea-falida-para-treinar-ia.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Yahoo Finance","pais":"Estados Unidos","titulo":"Ações da Marvell Technology disparam após acordo de chips de IA com o Google","resumo":"As ações da Marvell Technology registraram forte alta no mercado financeiro após a confirmação de uma parceria estratégica para fornecimento de chips ao Google.\nA colaboração visa acelerar a infraestrutura de hardware voltada para o processamento de cargas de trabalho complexas de inteligência artificial.\nO movimento reforça a intensa corrida global por semicondutores especializados para sustentar a expansão das tecnologias de IA.","link":"https://finance.yahoo.com/technology/ai/articles/marvell-technology-shares-jump-ai-185544352.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"securitymagazine.pt","pais":"Estados Unidos","titulo":"MIT desenvolve tecnologia para comunicações sem fio mais seguras à temperatura ambiente","resumo":"Pesquisadores do MIT criaram uma nova arquitetura de comunicação sem fio focada no aumento substancial da segurança e eficiência de transmissão de dados.\nDiferente de soluções quânticas anteriores, o sistema opera de forma estável à temperatura ambiente, facilitando sua futura adoção comercial.\nA inovação promete proteger transmissões sensíveis contra interceptações e mitigar vulnerabilidades em redes sem fio corporativas e governamentais.","link":"https://www.securitymagazine.pt/2026/08/19/mit-desenvolve-tecnologia-para-comunicacoes-sem-fios-mais-seguras-a-temperatura-ambiente/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"CBS News","pais":"Estados Unidos","titulo":"Distrito escolar do Colorado adota IA de detecção de armas para proteger estudantes","resumo":"Escolas do estado do Colorado implementaram um sistema baseado em inteligência artificial focado no reconhecimento automático de armas de fogo em tempo real.\nA ferramenta utiliza câmeras de monitoramento existentes para identificar ameaças potenciais e alertar imediatamente as forças de segurança locais.\nA iniciativa visa aumentar a proteção dentro das instituições de ensino e reduzir o tempo de resposta em situações de emergência severa.","link":"https://www.cbsnews.com/colorado/video/colorado-school-district-adopts-ai-weapon-recognition-technology-to-keep-students-safer/","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"Popular Science","pais":"Estados Unidos","titulo":"Ondas sonoras fornecem energia para alimentar pequenos drones","resumo":"Engenheiros desenvolveram um método inovador que utiliza ondas sonoras de alta frequência para transmitir energia sem fio a microdrones em voo.\nA tecnologia elimina a necessidade de baterias pesadas, permitindo a criação de dispositivos voadores significativamente menores e mais leves.\nEssa abordagem abre novas possibilidades para aplicações de monitoramento ambiental e inspeções industriais em locais de difícil acesso.","link":"https://www.popsci.com/technology/drone-powered-by-sound-waves/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"东方财富","pais":"Estados Unidos","titulo":"Valor de mercado da Moderna salta US$ 44,5 bilhões com avanço de IA na biotecnologia","resumo":"A farmacêutica Moderna registrou uma valorização expressiva em seu valor de mercado impulsionada pela aplicação de tecnologias de inteligência artificial no desenvolvimento de medicamentos.\nA integração da IA aos processos de pesquisa acelerou a descoberta de novas terapias genéticas e vacinas personalizadas com maior eficácia.\nO caso exemplifica o impacto revolucionário da IA na indústria farmacêutica global e atrai o interesse crescente de investidores do setor de tecnologia.","link":"https://finance.eastmoney.com/a/202608203847190320.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"ici.fr","pais":"França","titulo":"Informação local: CHR de Metz-Thionville adotará tecnologia de ponta para tratamento de tumores","resumo":"O Centro Hospitalar Regional (CHR) de Metz-Thionville anunciou a aquisição de um equipamento tecnológico\navançado voltado para o tratamento e combate a tumores complexos. A iniciativa visa modernizar a infraestrutura\nde saúde da região, oferecendo terapias mais precisas e menos invasivas aos pacientes. A implementação dessa\ninovação médica representa um avanço significativo no cuidado oncológico local e na medicina de precisão.","link":"https://www.ici.fr/emissions/l-info-d-ici-ici-lorraine-moselle-et-pays-haut/l-info-d-ici-le-chr-de-metz-thionville-va-se-doter-d-une-technologie-de-pointe-pour-le-traitement-de-certaines-tumeurs-9926858","categoria":"SAÚDE E TECNOLOGIA","lang":"pt"},{"fonte":"lecourrier.vn","pais":"França","titulo":"Cingapura: cooperação tecnológica ganha novo impulso","resumo":"As parcerias e acordos internacionais de inovação tecnológica com Cingapura estão ganhando um novo\nfôlego com foco em projetos estratégicos. O movimento busca fortalecer ecossistemas digitais, inteligência\nartificial e pesquisa científica entre os países envolvidos. Essa aproximação promete acelerar o\ndesenvolvimento econômico e o intercâmbio de conhecimentos de ponta no setor de tecnologia.","link":"https://lecourrier.vn/vietnam-singapour-la-cooperation-technologique-prend-un-nouvel-elan/1353770.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"franceinfo","pais":"França","titulo":"Robôs humanoides não são mais ficção científica","resumo":"O avanço da robótica e da inteligência artificial está transformando os robôs humanoides de conceitos\nteóricos em realidade prática para o mercado. Diversas empresas e centros de pesquisa demonstram progressos\nimpressionantes em mobilidade, interação e autonomia dessas máquinas. O impacto dessa evolução\npromete redefinir setores como a indústria, a logística e os serviços nos próximos anos.","link":"https://www.franceinfo.fr/internet/les-robots-humanoides-ce-n-est-plus-de-la-science-fiction_8153756.html","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"politico.eu","pais":"França","titulo":"Como a tecnologia de satélites pode ajudar a Europa a combater incêndios florestais","resumo":"A utilização de dados e monitoramento orbital por satélites está se tornando uma ferramenta crucial\nno combate às queimadas no continente europeu. Os sistemas avançados permitem identificar focos de incêndio\ncom rapidez, prever a propagação do fogo e otimizar a resposta dos bombeiros. Essa abordagem\ntecnológica é fundamental para mitigar os impactos das mudanças climáticas e proteger o meio ambiente.","link":"https://www.politico.eu/article/europe-turns-satellites-technology-battle-wildfires/","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"ActuSF","pais":"França","titulo":"Venha ao lançamento do livro \"Políticas da Ficção Científica\"!","resumo":"A obra \"Politiques de la science-fiction\" propõe uma análise profunda sobre o papel da literatura\nespeculativa e da ficção científica na compreensão da sociedade moderna. O evento de lançamento reunirá\nautores e pesquisadores para debater as interseções entre futurismo, inovação e decisões políticas.\nO debate promete explorar como as narrativas de ficção antecipam os dilemas éticos e tecnológicos.","link":"https://www.actusf.com/detail-d-un-article/venez-au-lancement-du-livre-politiques-de-la-science-fiction","categoria":"CIÊNCIA E CULTURA","lang":"pt"},{"fonte":"lenouveleconomiste.fr","pais":"França","titulo":"Saint-Étienne, a Cidade do Design e a economia criativa","resumo":"A cidade de Saint-Étienne reafirma seu papel estratégico como polo global de design e inovação\natravés da Cité du Design. A iniciativa promove a integração entre criatividade, tecnologia e\ndesenvolvimento econômico sustentável para apoiar novas empresas e projetos urbanos. O fortalecimento\ndesse ecossistema posiciona a região como referência no aproveitamento da economia criativa.","link":"https://www.lenouveleconomiste.fr/saint-etienne-la-cite-du-design-et-leconomie-creative-139097/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"France 24","pais":"França","titulo":"Na Ucrânia, a arriscada aposta política do ex-ministro Fedorov","resumo":"Mikhailo Fedorov, conhecido por liderar a transformação digital e a estratégia de drones e\ntecnologia militar na Ucrânia, enfrenta novos desafios políticos. O artigo aborda as movimentações\ngovernamentais e o impacto da tecnologia no cenário geopolítico e militar do conflito. As\ndecisões tomadas refletem a importância central da inovação tecnológica nas estratégias contemporâneas.","link":"https://www.france24.com/fr/info-en-continu/20260819-en-ukraine-le-pari-politique-risqu%C3%A9-de-l-ex-ministre-fedorov","categoria":"TECNOLOGIA E POLÍTICA","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Órgão policial defende uso de reconhecimento facial em tempo real no futebol","resumo":"O órgão de fiscalização policial do Reino Unido defendeu o uso de reconhecimento facial em tempo real em estádios de futebol.\nA tecnologia visa identificar torcedores banidos e prevenir confrontos de forma automatizada e ágil durante as partidas.\nContudo, a iniciativa enfrenta duras críticas de defensores dos direitos civis quanto à privacidade e ao risco de falhas.","link":"https://www.bbc.com/news/articles/c1l138rgz83o","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The London School of Economics and Political Science","pais":"Inglaterra","titulo":"Cingapura pode se tornar a Suíça da economia de chips de IA?","resumo":"Cingapura busca se consolidar como um polo neutro na cadeia global de suprimentos de semicondutores voltados para inteligência artificial.\nEm meio às disputas comerciais entre grandes potências, o país atrai investimentos bilionários em infraestrutura tecnológica e pesquisa.\nEssa estratégia pode posicionar a cidade-estado como um centro financeiro e tecnológico indispensável para o futuro da IA.","link":"https://blogs.lse.ac.uk/seac/2026/08/19/can-singapore-become-the-switzerland-of-the-ai-chip-economy/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Alguém usando óculos da Meta filmou você hoje? Você tem certeza?","resumo":"O avanço dos óculos inteligentes da Meta levanta debates urgentes sobre o fim da privacidade em ambientes públicos.\nPor capturarem imagens e vídeos de maneira quase imperceptível, os dispositivos dificultam o saber se alguém está sendo filmado.\nEspecialistas e defensores de direitos digitais exigem diretrizes mais rígidas para regular a captação de dados corporais e visuais.","link":"https://www.theguardian.com/technology/ng-interactive/2026/aug/19/meta-glasses-privacy-surveillance","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Trabalhistas podem perder até 50 assentos para os Verdes se novas perfurações no Mar do Norte forem aprovadas","resumo":"Projeções políticas indicam que o Partido Trabalhista britânico pode perder até 50 assentos para o Partido Verde nas próximas eleições.\nO desgaste decorre da possibilidade de aprovação de novos projetos de perfuração de petróleo e gás no Mar do Norte.\nO cenário reflete a crescente exigência dos eleitores por políticas ambientais severas e pelo fim dos combustíveis fósseis.","link":"https://www.theguardian.com/politics/2026/aug/19/labour-could-lose-seats-greens-new-drilling-north-sea","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"Financial Times","pais":"Inglaterra","titulo":"Não prejudiquem a economia do conhecimento de Londres","resumo":"Especialistas e executivos alertam para os riscos de medidas governamentais que possam enfraquecer o setor de inovação em Londres.\nA economia do conhecimento da cidade é impulsionada por instituições de pesquisa de ponta, startups de tecnologia e atração de talentos.\nPreservar esse ecossistema é visto como fundamental para manter a competitividade do Reino Unido no cenário global.","link":"https://www.ft.com/content/d30247d9-6e9e-4c2b-a6fc-9e751a9f7110","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Actualidad Aeroespacial","pais":"Espanha","titulo":"Firefly incorpora a tecnologia Zeno Power à missão Blue Ghost para sobreviver à noite lunar","resumo":"A Firefly Aerospace integrou a inovadora tecnologia de energia da Zeno Power à sua missão lunar Blue Ghost. O objetivo principal é permitir que o módulo de pouso resista às temperaturas extremamente baixas e à escuridão prolongada da noite na Lua. Essa colaboração representa um avanço crucial para a sustentabilidade e longa duração de futuras explorações científicas na superfície lunar.","link":"https://actualidadaeroespacial.com/firefly-incorpora-la-tecnologia-zeno-power-a-la-mision-blue-ghost-para-sobrevivir-a-la-noche-lunar/","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"elpais.com","pais":"Espanha","titulo":"Quem projeta a inteligência artificial do futuro (e por que ainda faltam mulheres)","resumo":"O avanço acelerado da inteligência artificial levanta debates cruciais sobre a representatividade das equipes que desenvolvem essas tecnologias. Especialistas alertam para a baixa participação feminina no setor, o que pode perpetuar vieses indesejados nos algoritmos em escala global. Iniciativas buscam atrair mais talentos diversos para garantir sistemas de IA mais inclusivos, éticos e alinhados com a sociedade.","link":"https://elpais.com/economia/formacion/2026-08-20/quien-disena-la-inteligencia-artificial-del-futuro-y-por-que-siguen-faltando-mujeres.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"La Razón","pais":"Espanha","titulo":"Cygnus X-3 quebra a escala cósmica: acelera partículas a até 30 PeV e torna-se a fonte de raios gama mais energética conhecida","resumo":"Astrofísicos identificaram que o sistema binário Cygnus X-3 é capaz de acelerar partículas a incríveis níveis de energia de até 30 PeV. A descoberta consagra o objeto cósmico como a fonte de raios gama de maior energia já registrada no universo. O feito desafia os modelos teóricos atuais e abre novas fronteiras para a compreensão dos fenômenos mais extremos do cosmos.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/cygnus-x-3-rompe-escala-cosmica-acelera-particulas-30-pev-ya-es-fuente-rayos-gamma-energetica-conocida_202608206a862cbca5690f0473838f88.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Motor16","pais":"Espanha","titulo":"Lexus RX 2027: mais tecnologia, refinamento e potência híbrida para o SUV premium","resumo":"A Lexus revelou novidades para a linha 2027 do SUV RX, destacando um forte investimento em conectividade e motorização híbrida avançada. O modelo combina maior eficiência de combustível com um pacote tecnológico aprimorado de assistência ao condutor e conforto a bordo. A atualização consolida a estratégia da marca em liderar o segmento premium com veículos mais inteligentes e sustentáveis.","link":"https://www.motor16.com/electrico/lexus-rx-2027-tecnologia/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Valencia Plaza","pais":"Espanha","titulo":"Equipe da UPV lidera desenvolvimento de nova tecnologia não invasiva para localizar arritmias cardíacas com maior precisão","resumo":"Pesquisadores da Universidade Politécnica de Valência desenvolveram um sistema não invasivo inovador para mapear arritmias cardíacas. A tecnologia utiliza algoritmos avançados para identificar com alta exatidão os focos de alteração nos batimentos do coração. O avanço promete otimizar o diagnóstico clínico, reduzir riscos em procedimentos e melhorar os tratamentos de pacientes cardíacos.","link":"https://valenciaplaza.com/valenciaplaza/plaza-innovacion/un-equipo-de-la-upv-lidera-el-desarrollo-de-nueva-tecnologia-no-invasiva-para-localizar-con-mayor-precision-las-arritmias-cardiacas","categoria":"TECNOLOGIA MÉDICA","lang":"pt"},{"fonte":"BBC","pais":"Espanha","titulo":"Estamos errando nos horários das refeições: esta é a melhor hora para jantar, segundo a ciência","resumo":"Estudos científicos recentes apontam que o horário em que nos alimentamos impacta diretamente a saúde metabólica e a qualidade do sono. Especialistas indicam que jantar muito tarde pode prejudicar o ritmo circadiano e favorecer o ganho de peso e distúrbios digestivos. A orientação da ciência é antecipar a última refeição do dia para alinhar o metabolismo aos ciclos naturais do corpo.","link":"https://www.bbc.com/mundo/articles/ce344qrkxe5o","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"BYD","pais":"Espanha","titulo":"Os segredos da tecnologia híbrida plug-in DM-i da BYD","resumo":"A BYD detalhou o funcionamento da sua tecnologia híbrida plug-in DM-i, focada em eficiência energética e alta autonomia. O sistema prioriza o uso do motor elétrico para a tração, utilizando o motor a combustão prioritariamente como gerador de energia. A solução representa um marco na transição para a mobilidade sustentável ao oferecer menor consumo de combustível e alto desempenho.","link":"https://www.byd.com/es-es/news-list/como-exprimir-al-maximo-tecnologia-dmi","categoria":"INOVAÇÃO AUTOMOTIVA","lang":"pt"},{"fonte":"elpais.com","pais":"Espanha","titulo":"Revolução na neuromedicina com minicérebros humanos mantidos vivos por anos","resumo":"Cientistas alcançaram um marco histórico ao manter organoides cerebrais humanos vivos e funcionais durante anos em laboratório. A conquista permite estudar o desenvolvimento do cérebro e doenças neurodegenerativas em prazos anteriormente impossíveis. Essa evolução no campo da neuromedicina acelera o teste de novos medicamentos e reduz a dependência de modelos animais.","link":"https://elpais.com/ciencia/2026-08-19/revolucion-en-neuromedicina-al-lograr-minicerebros-humanos-que-se-mantienen-vivos-durante-anos.html","categoria":"NEUROMEDICINA","lang":"pt"},{"fonte":"Thüringer Allgemeine","pais":"Alemanha","titulo":"Mais Conectados: Tecnologia da Turíngia Permite o Mesmo Material para Garrafa e Tampa","resumo":"Uma inovação tecnológica desenvolvida na Turíngia possibilita fabricar garrafas e tampas com o mesmo material.\nA mudança simplifica o processo de reciclagem e reduz significativamente os custos da indústria de embalagens.\nO avanço representa um avanço importante para a economia circular ao facilitar a logística reversa no continente.","link":"https://www.thueringer-allgemeine.de/wirtschaft/article412637349/enger-verbunden-thueringer-technologie-ermoeglicht-gleiches-material-fuer-flasche-und-deckel-mit-video.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"La Razón","pais":"Alemanha","titulo":"Alemanha Questiona se Deve Proibir os Óculos Inteligentes","resumo":"O debate sobre o uso de óculos inteligentes em locais públicos voltou a ganhar força na Alemanha.\nAutoridades e especialistas discutem os riscos à privacidade e a segurança na captação não autorizada de dados.\nA discussão pode resultar em novas regulamentações rigorosas para dispositivos vestíveis de realidade aumentada.","link":"https://www.larazon.es/sociedad/alemania-pregunta-debe-prohibir-smart-glasses_202608206a86596da046ad6ebcbb76dd.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Deutschlandfunk","pais":"Alemanha","titulo":"Ministério Faz Apelo a Comerciantes Devido aos Baixos Níveis de Armazenamento de Gás","resumo":"O Ministério da Economia da Alemanha alertou comerciantes sobre os baixos níveis de armazenamento de gás natural.\nA Associação de Proteção ao Consumidor adverte que a escassez pode provocar aumentos expressivos nos preços.\nA medida busca garantir a estabilidade do abastecimento energético do país antes do período de alta demanda.","link":"https://www.deutschlandfunk.de/ministerium-appelliert-wegen-niedriger-gasspeicherstaende-an-haendler-verbraucherzentrale-warnt-vor--100.html","categoria":"ENERGIA","lang":"pt"},{"fonte":"BILD","pais":"Alemanha","titulo":"Metade da População Vê a Política Como um Problema: Recorde Histórico na Alemanha","resumo":"Uma pesquisa recente revelou que metade dos cidadãos alemães considera a classe política como o maior problema do país.\nTrata-se do maior índice de insatisfação já registrado na história da coleta desses dados estatísticos.\nO resultado reflete o crescente ceticismo da população em relação às decisões governamentais e à gestão de crises.","link":"https://www.bild.de/politik/inland/jeder-zweite-sieht-die-politik-als-problem-hoechstwert-seit-datenerfassung-6a85ba01e532e82cc4f2ab0c","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"euractiv.com","pais":"Alemanha","titulo":"Bruxelas Apoia o Tribunal Penal Internacional Após Sanções dos EUA","resumo":"A União Europeia reafirmou publicamente seu apoio ao Tribunal Penal Internacional após sanções impostas pelos EUA.\nA declaração reforça o compromisso do bloco de Bruxelas com a justiça global e as instituições multilaterais.\nO posicionamento evidencia divergências diplomáticas relevantes entre os aliados ocidentais sobre a jurisdição internacional.","link":"https://euractiv.com/de/news/bruessel-unterstuetzt-den-internationalen-strafgerichtshof-nach-us-sanktionen/","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"BILD","pais":"Alemanha","titulo":"Jens Spahn Renuncia a Mais um Cargo na CDU Após Debate Sobre Maternidade de Substituição","resumo":"O político alemão Jens Spahn anunciou sua renúncia a mais um cargo de liderança na União Democrática Cristã.\nA decisão ocorre após fortes polêmicas públicas envolvendo suas declarações sobre a maternidade de substituição.\nO movimento reflete as crescentes pressões internas e disputas ideológicas enfrentadas pelo partido no momento.","link":"https://www.bild.de/politik/inland/rueckzug-nach-debatte-um-leihmutterschaft-jens-spahn-gibt-naechsten-posten-in-der-cdu-auf-6a860b2bcbb4a8f2ce8fe844","categoria":"POLÍTICA","lang":"pt"},{"fonte":"SWR","pais":"Alemanha","titulo":"Engarrafamento na Escócia: SC Freiburg Realiza Coletiva de Imprensa do Carro","resumo":"A comissão técnica do SC Freiburg realizou uma coletiva de imprensa oficial de dentro de um automóvel na Escócia.\nO evento inusitado ocorreu devido a um grande engarrafamento que impediu a chegada do time ao local agendado.\nA improvisação para cumprir os compromissos com a mídia viralizou rapidamente nas redes sociais e jornais esportivos.","link":"https://www.swr.de/sport/fussball/sc-freiburg-motherwell-conference-league-pk-auto-100.html","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"BILD","pais":"Alemanha","titulo":"Prefeito da CDU Doa 10 Mil Euros para o Partido AfD","resumo":"Um prefeito filiado ao partido CDU provocou forte controvérsia ao doar 10 mil euros para o partido de direita AfD.\nA ação gerou reações severas entre lideranças políticas devido ao cordão sanitário mantido contra a sigla.\nO episódio reacendeu o debate nacional sobre as fronteiras ideológicas e alianças na política alemã.","link":"https://www.bild.de/politik/inland/buergermeister-von-der-cdu-spendet-10-000-euro-an-die-afd-6a85de08cbb4a8f2ce8fe68d","categoria":"POLÍTICA","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"AI Expo Summer 2026 Inicia no Japão com Foco em IA Física e LLMs Nacionais","resumo":"A 'AI Expo Summer 2026' foi oficialmente aberta no Japão, reunindo as principais inovações em IA física e modelos de linguagem de grande escala.\nO evento destaca o papel central que essas tecnologias emergentes desempenharão no futuro da economia japonesa e na automação industrial.\nLíderes do setor e startups apresentam soluções avançadas para integrar inteligência artificial diretamente aos processos produtivos do país.","link":"https://prtimes.jp/main/html/rd/p/000000822.000053344.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Yahoo Finance","pais":"Japão","titulo":"Asahi Kasei Desenvolve Tecnologia de Pré-Dopagem de Lítio para Baterias Mais Eficientes","resumo":"A empresa Asahi Kasei desenvolveu uma tecnologia inovadora de pré-dopagem de lítio voltada para baterias ricas em silício.\nA técnica promete aumentar a densidade energética dos componentes enquanto reduz significativamente os custos de produção em larga escala.\nEssa inovação representa um avanço estratégico importante para impulsionar a autonomia de veículos elétricos e sistemas de energia.","link":"https://finance.yahoo.com/energy/articles/asahi-kasei-develops-novel-lithium-023000004.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"jst.go.jp","pais":"Japão","titulo":"Cientistas Criam Nanocápsulas para Entregar Mitocôndrias como Medicamento","resumo":"Pesquisadores desenvolveram com sucesso nanocápsulas capazes de entregar componentes mitocondriais diretamente a células humanas.\nO método inovador permite controlar funções celulares específicas e oferece novos caminhos para a regeneração de tecidos danificados.\nA descoberta representa um marco para a biotecnologia e a nanomedicina, com potencial aplicação em terapias de doenças complexas.","link":"https://www.jst.go.jp/pr/announce/20260820-6/index.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"BRIDGE（ブリッジ）","pais":"Japão","titulo":"Startup de Captura de CO₂ da Universidade de Kyushu Recebe Investimento Pre-Series A","resumo":"A Carbon Xtract, startup spin-off da Universidade de Kyushu focada em captura de carbono, captou investimentos na rodada Pre-Series A.\nO financiamento impulsionará o desenvolvimento comercial e a expansão de suas soluções tecnológicas limpas no mercado nacional.\nA iniciativa visa acelerar a remoção de dióxido de carbono da atmosfera, apoiando as metas de sustentabilidade do país.","link":"https://thebridge.jp/2026/08/carbon-xtract-raises-pre-series-a-first-close","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Fujitsu Adota Tecnologia de Defesa dos EUA para Proteger Cadeias de Suprimento","resumo":"A Fujitsu anunciou a adoção de tecnologias de segurança cibernética oriundas do setor de defesa dos Estados Unidos.\nA solução visa garantir o compartilhamento seguro e protegido de dados críticos ao longo de toda a sua cadeia de suprimentos.\nA medida fortalece a resiliência operacional da empresa contra ameaças digitais crescentes e vazamentos de informações industriais.","link":"https://www.nikkei.com/article/DGXZQOUC201E50Q6A820C2000000/","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"客观日本","pais":"Japão","titulo":"Roupas com Transmissão Sem Fio de Energia Abrem Caminho para Novos Vestíveis","resumo":"Pesquisadores criaram um tecido tecnológico capaz de realizar transmissão sem fio de energia e dados para dispositivos vestíveis.\nA inovação elimina a necessidade de cabos pesados e baterias volumosas, facilitando a criação de roupas inteligentes.\nO avanço promete transformar áreas como o monitoramento contínuo de saúde e o desenvolvimento de eletrônicos vestíveis.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_new/pt20260820000014.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Real Sound｜リアルサウンド","pais":"Japão","titulo":"TikTok Gaming Associa-se Oficialmente à Associação Japonesa de eSports","resumo":"A divisão TikTok Gaming tornou-se oficialmente membro da Associação de eSports do Japão para expandir sua atuação no setor.\nA parceria pretende aumentar o reconhecimento dos esportes eletrônicos no país e incentivar o crescimento de novos criadores.\nA iniciativa busca aproximar a comunidade gamer, organizadores de torneios e marcas para fortalecer o mercado local.","link":"https://realsound.jp/tech/2026/08/post-2497286.html","categoria":"GAMES","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Toyo Corp e QST Iniciam Pesquisa Conjunta em Sensores Quânticos de Diamante","resumo":"A Toyo Corporation e o Instituto de Ciências Quânticas iniciaram uma pesquisa conjunta sobre centros NV em diamantes.\nO estudo foca na fabricação de materiais quânticos avançados voltados para sistemas de detecção e sensoriamento de alta precisão.\nA tecnologia possui alto potencial de aplicação em diagnósticos médicos de última geração e equipamentos industriais.","link":"https://www.nikkei.com/article/DGXZRSP711352_Q6A820C2000000/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Guardian","pais":"China","titulo":"Ações da empresa de robôs humanoides Unitree sobem 600% na estreia no mercado acionário chinês","resumo":"A empresa chinesa de robótica Unitree teve uma estreia avassaladora na bolsa de valores, registrando uma valorização impressionante de 600% em suas ações.\nO resultado reflete o enorme entusiasmo dos investidores pelo avanço acelerado dos robôs humanoides e pela inteligência artificial incorporada na indústria local.\nEste forte desempenho consolida a Unitree como uma das principais referências globais do setor, impulsionando ainda mais o ecossistema tecnológico do país.","link":"https://www.theguardian.com/technology/2026/aug/19/unitree-shares-surge-humanoid-robot-firm-chinese-stock-market-debut","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"中青在线","pais":"China","titulo":"Conferência Mundial de Robôs de 2026 apresenta novos cenários de aplicação industrial e doméstica","resumo":"O primeiro dia da Conferência Mundial de Robôs de 2026 revelou uma ampla gama de autômatos projetados para expandir sua atuação em tarefas complexas do cotidiano e da indústria.\nOs modelos apresentados demonstraram avanços significativos em precisão mecânica, automação inteligente e interação segura com humanos.\nO evento destaca o papel central da China na liderança do desenvolvimento da robótica de última geração e na aplicação prática dessas inovações.","link":"http://news.cyol.com/gb/keji/articles/2026-08/20/content_R4g6yEtoOx.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"新浪新闻_手机新浪网","pais":"China","titulo":"Tecnologia XR detalha o voo de ida e volta do foguete reutilizável Zhuque-3","resumo":"Uma análise exclusiva baseada em tecnologia de realidade estendida (XR) demonstrou em detalhes todo o processo de decolagem e pouso do foguete reutilizável Zhuque-3.\nAs imagens interativas permitiram visualizar a precisão técnica necessária para garantir o retorno seguro da espaçonave à Terra.\nEssa inovação reforça o avanço da China no desenvolvimento de tecnologias espaciais sustentáveis e de baixo custo para o setor aeroespacial.","link":"https://news.sina.com.cn/zx/gj/2026-08-19/doc-ininwiee8294936.shtml","categoria":"AEROESPACIAL","lang":"pt"},{"fonte":"中国科学院","pais":"China","titulo":"Cientistas desenvolvem novo amostrador de ar inspirado no mecanismo de sucção das borboletas","resumo":"Pesquisadores chineses criaram um inovador dispositivo de amostragem de ar inspirado na maneira como as borboletas ingerem líquidos através de sua probóscide.\nA tecnologia biomimética permite capturar partículas e microrganismos em suspensão com altíssima eficiência e baixo consumo energético.\nO avanço abre novas possibilidades para o monitoramento ambiental e a prevenção de contaminações biológicas em larga escala.","link":"https://www.cas.cn/cm/202608/t20260820_5118676.shtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"guandian.cn","pais":"China","titulo":"Speed Wireless cria subsidiária focada em engenharia de ponta, inteligência artificial e semicondutores","resumo":"A empresa de tecnologia Shuobeide (Speed Wireless) anunciou a fundação de uma nova subsidiária dedicada a projetos de engenharia de vanguarda.\nO foco da nova entidade engloba o desenvolvimento de soluções em inteligência artificial e a fabricação de circuitos integrados avançados.\nO movimento estratégico visa fortalecer a autossuficiência da China no setor de chips e expandir sua competitividade em infraestrutura digital.","link":"https://www.guandian.cn/article/20260820/587789.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"人民日报","pais":"China","titulo":"China coloca em órbita o novo satélite 'Estrela de Xiong'an' para monitoramento e comunicação","resumo":"O ecossistema espacial chinês ganhou um novo reforço com o lançamento e posicionamento bem-sucedido do satélite batizado de 'Estrela de Xiong'an'.\nA nova plataforma orbital atenderá a demandas críticas de sensoriamento remoto, transmissão de dados de alta velocidade e suporte ao planejamento urbano inteligente.\nO projeto exemplifica a integração entre a exploração espacial e a modernização da infraestrutura socioeconômica do país.","link":"http://paper.people.com.cn/rmrb/pc/content/202608/20/content_30176010.html","categoria":"AEROESPACIAL","lang":"pt"},{"fonte":"CNBC","pais":"China","titulo":"Ásia aposta no hidrogênio verde como tecnologia emergente para transformar o transporte regional","resumo":"Diversas nações asiáticas estão intensificando os investimentos em tecnologias de hidrogênio verde para acelerar a descarbonização de seus sistemas de transporte comercial e coletivo.\nA estratégia inclui a ampliação da infraestrutura de abastecimento e o desenvolvimento de células de combustível mais eficientes.\nEssa transição energética visa reduzir a dependência de combustíveis fósseis e posicionar a região na vanguarda da sustentabilidade global.","link":"https://www.cnbc.com/2026/08/20/asia-hydrogen-trains-green-transport.html","categoria":"ENERGIA LIMPA","lang":"pt"},{"fonte":"日经中文网","pais":"China","titulo":"Indústria de semicondutores ganha protagonismo e supera setor bancário no mercado chinês","resumo":"O perfil econômico da China está passando por uma profunda transformação com as empresas do setor de semicondutores assumindo um peso superior ao dos grandes bancos tradicionais.\nA rápida ascensão das companhias de microchips reflete a priorização nacional pela autossuficiência tecnológica e inovação intensiva.\nEssa mudança estrutural sinaliza um novo ciclo de crescimento impulsionado por tecnologia de alta complexidade.","link":"https://cn.nikkei.com/columnviewpoint/column/63573-2026-08-20-05-00-32.html","categoria":"MERCADO","lang":"pt"},{"fonte":"Elets Technomedia","pais":"Índia","titulo":"IIT Bombay lança e-PG Diploma em Ciência da Computação e Inteligência Artificial","resumo":"O Instituto Indiano de Tecnologia de Bombaim (IIT Bombay) anunciou o lançamento de um programa de pós-graduação em Ciência da Computação e IA.\nO curso visa capacitar profissionais para atender à alta demanda do setor de tecnologia da informação e inteligência artificial.\nA iniciativa reforça o papel estratégico das instituições indianas na formação de talentos qualificados para a era digital.","link":"https://digitallearning.eletsonline.com/2026/08/iit-bombay-introduces-e-pg-diploma-in-computer-science-and-ai/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ANI News","pais":"Índia","titulo":"Kabuni acelera parcerias escolares para transformar o treinamento esportivo na Índia","resumo":"A empresa Kabuni está expandindo parcerias com escolas na Índia para modernizar a formação e a prática esportiva nas instituições.\nA iniciativa utiliza soluções tecnológicas avançadas para aprimorar o desempenho dos estudantes e incentivar a prática esportiva.\nO projeto busca democratizar o acesso a treinamentos de alto nível e impulsionar a descoberta de novos talentos nas redes de ensino.","link":"https://www.aninews.in/news/business/kabuni-accelerates-school-partnerships-to-transform-sports-coaching-in-india20260820103512","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"livemint.com","pais":"Índia","titulo":"Ministro-chefe de Gujarat se reúne nos EUA com Micron, Google e Perplexity para parcerias tecnológicas","resumo":"O ministro-chefe de Gujarat realizou reuniões estratégicas nos Estados Unidos com executivos de empresas como Micron, Google e Perplexity.\nOs encontros visam atrair investimentos internacionais e fortalecer parcerias em inteligência artificial, semicondutores e infraestrutura tecnológica.\nA iniciativa consolida a posição do estado indiano como um polo de inovação no cenário tecnológico global.","link":"https://www.livemint.com/focus/gujarat-cm-patel-holds-us-meetings-with-micron-google-perplexity-on-technology-partnerships-11787200442851.html","categoria":"NEGÓCIOS TECNOLÓGICOS","lang":"pt"},{"fonte":"The Hindu","pais":"Índia","titulo":"Acadêmicos ligados ao RSS integram painel de livros didáticos do NCERT","resumo":"A nomeação de acadêmicos ligados à organização RSS no painel de livros didáticos do NCERT gerou discussões na Índia.\nO comitê é encarregado de revisar o conteúdo curricular e a orientação pedagógica dos manuais escolares no país.\nA decisão reflete mudanças significativas na condução das políticas educacionais e históricas da nação.","link":"https://www.thehindu.com/news/national/ncert-reconstitutes-textbook-development-team-for-classes-11-and-12-political-science/article71366560.ece","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"DIPR Nagaland","pais":"Índia","titulo":"Mokokchung sedia workshop do programa ODOP sobre café para impulsionar a economia local","resumo":"A cidade de Mokokchung sediou um workshop sobre a produção de café vinculado ao programa nacional de incentivo econômico local.\nO evento abordou métodos de aperfeiçoamento do cultivo, agregação de valor ao produto e melhorias na cadeia de suprimentos.\nO objetivo principal é impulsionar o desenvolvimento regional e expandir o alcance do café indiano nos mercados globais.","link":"https://ipr.nagaland.gov.in/index.php/mokokchung-hosts-odop-workshop-on-coffee-to-boost-local-economy-and-global-reach-18-08-26","categoria":"ECONOMIA","lang":"pt"},{"fonte":"The Times of India","pais":"Índia","titulo":"Quem foi Bill Rasmussen: o 'pai da televisão esportiva' que faleceu aos 93 anos","resumo":"Bill Rasmussen, fundador da ESPN e pioneiro no modelo de transmissões esportivas 24 horas por dia, faleceu aos 93 anos.\nEle transformou a indústria de mídia global ao criar a primeira rede de televisão dedicada exclusivamente aos esportes.\nSeu trabalho redefiniu o consumo de conteúdo esportivo na TV paga e influenciou gerações de canais de comunicação.","link":"https://timesofindia.indiatimes.com/life-style/people/who-was-bill-rasmussen-the-father-of-sports-television-who-died-at-93/articleshow/133356464.cms","categoria":"MÍDIA","lang":"pt"},{"fonte":"TVI","pais":"Portugal","titulo":"Chefe humanitário da ONU pede diálogo com fabricantes de drones sobre riscos da tecnologia letal","resumo":"O chefe humanitário das Nações Unidas fez um apelo direto aos fabricantes globais de drones para iniciar um diálogo sobre o uso militar e os perigos dessa tecnologia. A iniciativa busca garantir que as empresas compreendam plenamente os riscos éticos e os impactos devastadores do uso de armas autônomas em zonas de conflito. Com o avanço rápido dessas soluções letais, a ONU enfatiza a necessidade urgente de regulamentação e responsabilidade no desenvolvimento tecnológico.","link":"https://tvi.iol.pt/noticias/drones/fabricantes-de-armas/chefe-humanitario-da-onu-apela-ao-dialogo-com-fabricantes-de-drones-para-garantir-que-compreendem-riscos-de-tecnologia-letal/20260819/6a86236dd34e511da0b34394","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"record.pt","pais":"Portugal","titulo":"Câmera de ação Lenovo de alta qualidade e formato de bolso chega ao AliExpress por menos de 50 euros","resumo":"Uma nova câmera de ação compacta da Lenovo está chamando a atenção dos entusiastas da tecnologia ao ser disponibilizada por um preço extremamente acessível. O dispositivo promete gravação de alta definição em um formato de bolso ideal para esportes e viagens, desafiando concorrentes mais caros no mercado. Essa novidade no AliExpress demonstra o avanço do custo-benefício em equipamentos fotográficos portáteis de marcas consolidadas.","link":"https://www.record.pt/indica/tecnologia/detalhe/alta-qualidade-num-formato-de-bolso-por-menos-de-50-no-aliexpress-vai-ficar-pasmado-com-esta-camara-de-acao-lenovo","categoria":"HARDWARE","lang":"pt"},{"fonte":"tek.sapo.pt","pais":"Portugal","titulo":"Nova linha de patinetes Segway combina tecnologia e segurança para o público jovem","resumo":"A Segway anunciou o lançamento de uma nova gama de patinetes elétricos projetados especificamente para atender às exigências de segurança e conectividade dos usuários mais jovens. Os novos modelos incorporam sistemas avançados de travamento, controle de velocidade via aplicativo e materiais de alta resistência para reduzir acidentes urbanos. O lançamento reforça a expansão da mobilidade suave e sustentável focada na nova geração.","link":"https://tek.sapo.pt/multimedia/artigos/nova-gama-de-trotinetes-segway-combina-tecnologia-e-seguranca-para-um-publico-mais-jovem/","categoria":"MOBILIDADE","lang":"pt"},{"fonte":"Jornal de Notícias","pais":"Portugal","titulo":"Peter Thiel: O arquiteto que moldou o ecossistema das gigantes de tecnologia","resumo":"Um perfil detalhado analisa o impacto estratégico e controverso do investidor Peter Thiel na criação do ecossistema tecnológico do Vale do Silício. Cofundador do PayPal e da Palantir, Thiel desempenhou um papel crucial no financiamento inicial de empresas como o Facebook, influenciando o direcionamento da inovação global. A análise destaca suas visões sobre inteligência artificial, monopólios digitais e a relação entre grandes empresas de tecnologia e o poder político.","link":"https://www.jn.pt/mundo/artigo/peter-thiel-o-arquiteto-de-tecnologicas/18117811","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"O Amarense – Jornal","pais":"Portugal","titulo":"Câmara de Terras de Bouro rejeita proposta para criar Centro de Ciência e Natureza","resumo":"A Câmara Municipal de Terras de Bouro reprovou a proposta da oposição para a criação de um Centro de Ciência e Natureza voltado à preservação e educação ambiental na região. A decisão gerou debates intensos sobre a priorização de investimentos públicos na promoção da pesquisa científica local e na valorização do ecossistema do Parque Nacional da Peneda-Gerês. Representantes locais divergem sobre os custos operacionais do projeto versus os seus benefícios educativos.","link":"https://oamarense.pt/camara-de-terras-de-bouro-chumba-proposta-do-ps-para-criar-centro-de-ciencia-e-natureza/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"goride.pt","pais":"Portugal","titulo":"Tecnologia GENIE é integrada às novas bicicletas Specialized Levo 4 e Levo R","resumo":"A fabricante de bicicletas Specialized expandiu a aplicação da sua renomada tecnologia de amortecimento GENIE para os novos modelos elétricos de montanha. A inovação proporciona um desempenho de suspensão a ar otimizado, combinando a sensibilidade de molas helicoidais com o controle progressivo do ar no fim do curso. Essa atualização promete revolucionar o mercado de e-bikes ao oferecer maior controle e conforto em terrenos acidentados.","link":"https://www.goride.pt/tecnologia-genie-agora-tambem-nas-specialized-levo-4-my27-e-levo-r-my27/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"HealthNews","pais":"Portugal","titulo":"Digital Annealer: A tecnologia que está redefinindo a eficiência no setor de saúde","resumo":"A tecnologia Digital Annealer, inspirada na computação quântica, está sendo aplicada para solucionar problemas complexos de otimização em redes hospitalares e pesquisas médicas. Capaz de processar volumes massivos de dados em tempo recorde, a ferramenta auxilia na alocação de recursos, planejamento de tratamentos e desenvolvimento de fármacos. O avanço representa um salto significativo na eficiência operacional da saúde e no atendimento personalizado ao paciente.","link":"https://healthnews.pt/2026/08/19/digital-annealer-a-tecnologia-que-esta-a-redefinir-a-eficiencia-na-saude/","categoria":"SAÚDE","lang":"pt"},{"fonte":"bombabomba.com.br","pais":"Brasil","titulo":"Plenário chancela mudança na política estadual de fomento à inovação em IA","resumo":"O plenário aprovou alterações significativas na política estadual destinada a incentivar o desenvolvimento e a inovação em inteligência artificial.\nA medida busca modernizar o ecossistema tecnológico local, atrair novos investimentos e regulamentar o uso ético de tecnologias emergentes no setor público e privado.\nCom isso, o estado pretende consolidar sua posição estratégica na criação de soluções digitais avançadas e na formação de mão de obra qualificada.","link":"https://bombabomba.com.br/plenario-chancela-mudanca-na-politica-estadual-de-fomento-a-inovacao-em-ia/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"noticias.r7.com","pais":"Brasil","titulo":"Maior evento de tecnologia da América Latina debate a implementação da TV 3.0 no Brasil","resumo":"O maior evento de tecnologia da América Latina reuniu especialistas e líderes do setor para discutir os avanços da TV 3.0 no Brasil.\nA nova tecnologia promete revolução na experiência dos telespectadores, integrando sinal aberto de alta qualidade com interatividade e transmissão via internet.\nA implementação do novo padrão representa um marco na convergência de mídias e no futuro das comunicações no país.","link":"https://noticias.r7.com/jr-24h/boletim-jr-24h/video/maior-evento-de-tecnologia-da-america-latina-debate-a-implementacao-da-tv-30-no-brasil-20082026/","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"Vietnam.vn","pais":"Brasil","titulo":"Medicamentos contra o câncer que utilizam a tecnologia de mRNA alcançam avanços significativos em ensaios clínicos","resumo":"Ensaios clínicos recentes apontam avanços expressivos no desenvolvimento de tratamentos contra o câncer baseados na tecnologia de RNA mensageiro.\nA abordagem inovadora permite instruir o próprio sistema imunológico do paciente a reconhecer e combater células tumorais de forma altamente precisa.\nOs resultados sinalizam uma nova era para a oncologia, acelerando o surgimento de terapias personalizadas e mais eficazes.","link":"https://www.vietnam.vn/pt/thuoc-tri-ung-thu-bang-cong-nghe-mrna-dat-dot-pha-trong-thu-nghiem-lam-sang","categoria":"BIOTECNOLOGIA","lang":"en"},{"fonte":"Estadão","pais":"Brasil","titulo":"O que a ciência sabe sobre a relação entre vapes e câncer","resumo":"Pesquisadores e entidades de saúde vêm intensificando estudos sobre os impactos do uso prolongado de vapes na saúde pulmonar e no desenvolvimento de tumores.\nEmbora apresentados como alternativas menos nocivas, os cigarros eletrônicos contêm substâncias tóxicas capazes de causar mutações celulares e inflamações graves.\nO consenso científico reforça a necessidade de regulação rigorosa e campanhas de conscientização sobre os riscos desses dispositivos.","link":"https://www.estadao.com.br/tv/pulsa/o-que-a-ciencia-sabe-sobre-a-relacao-entre-vapes-e-cancer/","categoria":"CIÊNCIA","lang":"en"},{"fonte":"Forbes Brasil","pais":"Brasil","titulo":"“A IA não substitui o julgamento humano”: como a tecnologia tem ajudado a fiscalizar operações na B3","resumo":"A B3 tem utilizado ferramentas de inteligência artificial para otimizar o monitoramento e a fiscalização de transações no mercado financeiro.\nEspecialistas destacam que, embora os algoritmos aumentem a agilidade no diagnóstico de anomalias, a decisão final permanece dependente do julgamento humano.\nEssa sinergia entre tecnologia e supervisão analítica fortalece a transparência e a segurança das operações no ambiente de bolsa.","link":"https://forbes.com.br/forbes-money/2026/08/como-ia-ajuda-fiscalizar-operacoes-b3/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"Valor Econômico","pais":"Brasil","titulo":"Lagarde alerta que Europa não pode ficar para trás na transformação da economia pela IA","resumo":"A presidente do Banco Central Europeu, Christine Lagarde, alertou sobre a urgência de a Europa acelerar a adoção de inteligência artificial.\nSegundo a dirigente, ficar para trás na transformação digital pode comprometer seriamente a competitividade econômica e a produtividade do bloco.\nO apelo reforça o debate global sobre regulação equilibrada, incentivos à inovação e soberania tecnológica na nova era digital.","link":"https://valor.globo.com/financas/noticia/2026/08/19/lagarde-alerta-que-europa-no-pode-ficar-para-trs-na-transformao-da-economia-pela-ia.ghtml","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"g1.globo.com","pais":"Brasil","titulo":"Ex-executivo da Meta diz que Zuckerberg deixou segurança infantil em segundo plano","resumo":"Um ex-executivo da Meta declarou publicamente que as preocupações com a segurança infantil na plataforma foram preteridas em relação a metas de crescimento.\nAs revelações alimentam debates regulatórios no mundo todo sobre a responsabilidade das Big Techs no combate ao assédio e conteúdos nocivos a menores.\nO caso intensifica a pressão de órgãos reguladores por regras mais duras e transparência na gestão de algoritmos voltados aos jovens.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/19/meta-julgamento-zuckerberg.ghtml","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Justiça mantém multa de R$ 11 milhões à Apple por publicidade enganosa","resumo":"A Justiça manteve a aplicação de uma multa de R$ 11 milhões contra a Apple por práticas consideradas de publicidade enganosa no Brasil.\nA decisão refere-se à venda de aparelhos sem o carregador de tomada e a alegações de propaganda sobre a resistência dos dispositivos à água.\nA determinação reafirma os direitos dos consumidores nacionais e impõe sanções a grandes corporações do setor de tecnologia.","link":"https://www1.folha.uol.com.br/mercado/2026/08/justica-mantem-multa-de-r-11-milhoes-a-apple-por-publicidade-enganosa.shtml","categoria":"DIREITO DIGITAL","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"NASA descobre que micróbios humanos podem sobreviver no Polo Sul da Lua","resumo":"Pesquisadores da NASA identificaram que certos micróbios associados ao corpo humano possuem a capacidade de sobreviver nas condições extremas do Polo Sul lunar.\nA descoberta levanta alertas importantes sobre os riscos de contaminação biológica em futuras missões de exploração espacial habitadas.\nOs cientistas agora estudam novos protocolos de esterilização e contenção para proteger ecossistemas extraterrestres de organismos terrestres.","link":"https://science.nasa.gov/humans-in-space/human-related-microbes-may-survive-moons-south-pole-nasa-finds/","categoria":"CIÊNCIA","lang":"en"},{"fonte":"Science Daily","pais":"Estados Unidos","titulo":"Físicos do MIT descobrem elétrons se reorganizando como gelo em material quântico","resumo":"Cientistas do MIT observaram um comportamento inédito onde elétrons se estruturam de maneira semelhante ao gelo dentro de um material quântico.\nO fenômeno revela novas propriedades do comportamento quântico da matéria sob condições específicas de laboratório.\nA descoberta pode abrir caminho para o desenvolvimento de novos dispositivos eletrônicos e avanços na computação quântica.","link":"https://www.sciencedaily.com/releases/2026/08/260819041231.htm","categoria":"CIÊNCIA","lang":"en"},{"fonte":"g1.globo.com","pais":"Estados Unidos","titulo":"Google paga US$ 10 milhões por dados de companhia aérea falida para treinar IA","resumo":"A gigante da tecnologia adquiriu por US$ 10 milhões a base de dados de uma empresa aérea falida com o objetivo de aprimorar seus modelos de inteligência artificial.\nA transação destaca o crescente valor comercial de grandes volumes de dados de consumo para o treinamento de sistemas avançados de aprendizado de máquina.\nA iniciativa levanta discussões no setor sobre privacidade e os limites do uso de dados corporativos em falência para inovação tecnológica.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/19/google-paga-us-10-milhoes-por-dados-de-companhia-aerea-falida-para-treinar-ia.ghtml","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"Yahoo Finance","pais":"Estados Unidos","titulo":"Ações da Marvell Technology disparam após acordo de chips de IA com o Google","resumo":"As ações da Marvell Technology registraram forte alta no mercado financeiro após a confirmação de uma parceria estratégica para fornecimento de chips ao Google.\nA colaboração visa acelerar a infraestrutura de hardware voltada para o processamento de cargas de trabalho complexas de inteligência artificial.\nO movimento reforça a intensa corrida global por semicondutores especializados para sustentar a expansão das tecnologias de IA.","link":"https://finance.yahoo.com/technology/ai/articles/marvell-technology-shares-jump-ai-185544352.html","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"securitymagazine.pt","pais":"Estados Unidos","titulo":"MIT desenvolve tecnologia para comunicações sem fio mais seguras à temperatura ambiente","resumo":"Pesquisadores do MIT criaram uma nova arquitetura de comunicação sem fio focada no aumento substancial da segurança e eficiência de transmissão de dados.\nDiferente de soluções quânticas anteriores, o sistema opera de forma estável à temperatura ambiente, facilitando sua futura adoção comercial.\nA inovação promete proteger transmissões sensíveis contra interceptações e mitigar vulnerabilidades em redes sem fio corporativas e governamentais.","link":"https://www.securitymagazine.pt/2026/08/19/mit-desenvolve-tecnologia-para-comunicacoes-sem-fios-mais-seguras-a-temperatura-ambiente/","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"CBS News","pais":"Estados Unidos","titulo":"Distrito escolar do Colorado adota IA de detecção de armas para proteger estudantes","resumo":"Escolas do estado do Colorado implementaram um sistema baseado em inteligência artificial focado no reconhecimento automático de armas de fogo em tempo real.\nA ferramenta utiliza câmeras de monitoramento existentes para identificar ameaças potenciais e alertar imediatamente as forças de segurança locais.\nA iniciativa visa aumentar a proteção dentro das instituições de ensino e reduzir o tempo de resposta em situações de emergência severa.","link":"https://www.cbsnews.com/colorado/video/colorado-school-district-adopts-ai-weapon-recognition-technology-to-keep-students-safer/","categoria":"SEGURANÇA","lang":"en"},{"fonte":"Popular Science","pais":"Estados Unidos","titulo":"Ondas sonoras fornecem energia para alimentar pequenos drones","resumo":"Engenheiros desenvolveram um método inovador que utiliza ondas sonoras de alta frequência para transmitir energia sem fio a microdrones em voo.\nA tecnologia elimina a necessidade de baterias pesadas, permitindo a criação de dispositivos voadores significativamente menores e mais leves.\nEssa abordagem abre novas possibilidades para aplicações de monitoramento ambiental e inspeções industriais em locais de difícil acesso.","link":"https://www.popsci.com/technology/drone-powered-by-sound-waves/","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"东方财富","pais":"United States","titulo":"Moderna's Market Value Jumps $44.5 Billion on AI Advancements in Biotechnology","resumo":"Pharmaceutical company Moderna recorded a significant surge in market value driven by the application of artificial intelligence technologies in drug development.\nThe integration of AI into research processes has accelerated the discovery of new gene therapies and personalized vaccines with greater efficacy.\nThis case exemplifies the revolutionary impact of AI on the global pharmaceutical industry and is attracting growing interest from technology sector investors.","link":"https://finance.eastmoney.com/a/202608203847190320.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"ici.fr","pais":"France","titulo":"Local News: CHR of Metz-Thionville to Adopt Cutting-Edge Technology for Tumor Treatment","resumo":"The Metz-Thionville Regional Hospital Center (CHR) has announced the acquisition of advanced technological equipment aimed at treating and fighting complex tumors.\nThe initiative seeks to modernize the region's healthcare infrastructure by offering more precise and less invasive therapies to patients.\nThe implementation of this medical innovation represents a significant advancement in local oncological care and precision medicine.","link":"https://www.ici.fr/emissions/l-info-d-ici-ici-lorraine-moselle-et-pays-haut/l-info-d-ici-le-chr-de-metz-thionville-va-se-doter-d-une-technologie-de-pointe-pour-le-traitement-de-certaines-tumeurs-9926858","categoria":"HEALTH AND TECHNOLOGY","lang":"en"},{"fonte":"lecourrier.vn","pais":"France","titulo":"Singapore: Technological Cooperation Gains New Momentum","resumo":"International technology innovation partnerships and agreements with Singapore are gaining new momentum, focusing on strategic projects.\nThe movement aims to strengthen digital ecosystems, artificial intelligence, and scientific research among the participating countries.\nThis closer collaboration promises to accelerate economic development and the exchange of cutting-edge knowledge in the technology sector.","link":"https://lecourrier.vn/vietnam-singapour-la-cooperation-technologique-prend-un-nouvel-elan/1353770.html","categoria":"INNOVATION","lang":"en"},{"fonte":"franceinfo","pais":"France","titulo":"Humanoid Robots Are No Longer Science Fiction","resumo":"The advancement of robotics and artificial intelligence is transforming humanoid robots from theoretical concepts into practical market realities.\nVarious companies and research centers are demonstrating impressive progress in the mobility, interaction, and autonomy of these machines.\nThe impact of this evolution promises to redefine sectors such as industry, logistics, and services in the coming years.","link":"https://www.franceinfo.fr/internet/les-robots-humanoides-ce-n-est-plus-de-la-science-fiction_8153756.html","categoria":"ROBOTICS","lang":"en"},{"fonte":"politico.eu","pais":"France","titulo":"How Satellite Technology Can Help Europe Fight Wildfires","resumo":"The use of orbital data and satellite monitoring is becoming a crucial tool in combating wildfires on the European continent.\nAdvanced systems make it possible to identify fire outbreaks quickly, predict fire propagation, and optimize firefighters' response.\nThis technological approach is fundamental to mitigating the impacts of climate change and protecting the environment.","link":"https://www.politico.eu/article/europe-turns-satellites-technology-battle-wildfires/","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"ActuSF","pais":"France","titulo":"Attend the Launch of the Book \"Science Fiction Politics\"!","resumo":"The work \"Politiques de la science-fiction\" proposes a deep analysis of the role of speculative literature and science fiction in understanding modern society.\nThe launch event will bring together authors and researchers to debate the intersections between futurism, innovation, and political decisions.\nThe debate promises to explore how fictional narratives anticipate ethical and technological dilemmas.","link":"https://www.actusf.com/detail-d-un-article/venez-au-lancement-du-livre-politiques-de-la-science-fiction","categoria":"SCIENCE AND CULTURE","lang":"en"},{"fonte":"lenouveleconomiste.fr","pais":"France","titulo":"Saint-Étienne, the City of Design and the Creative Economy","resumo":"The city of Saint-Étienne reaffirms its strategic role as a global hub for design and innovation through the Cité du Design.\nThe initiative promotes the integration of creativity, technology, and sustainable economic development to support new businesses and urban projects.\nThe strengthening of this ecosystem positions the region as a benchmark in harnessing the creative economy.","link":"https://www.lenouveleconomiste.fr/saint-etienne-la-cite-du-design-et-leconomie-creative-139097/","categoria":"INNOVATION","lang":"en"},{"fonte":"France 24","pais":"France","titulo":"In Ukraine, the Risky Political Gamble of Former Minister Fedorov","resumo":"Mykhailo Fedorov, known for leading digital transformation and Ukraine's military technology and drone strategy, is facing new political challenges.\nThe article discusses governmental movements and the impact of technology on the geopolitical and military landscape of the conflict.\nThe decisions made reflect the central importance of technological innovation in contemporary strategies.","link":"https://www.france24.com/fr/info-en-continu/20260819-en-ukraine-le-pari-politique-risqu%C3%A9-de-l-ex-ministre-fedorov","categoria":"TECHNOLOGY AND POLITICS","lang":"en"},{"fonte":"BBC","pais":"United Kingdom","titulo":"Police Authority Defends Real-Time Facial Recognition in Football","resumo":"The UK policing oversight body has defended the use of real-time facial recognition in football stadiums.\nThe technology aims to identify banned fans and prevent clashes in an automated and agile manner during matches.\nHowever, the initiative faces sharp criticism from civil liberties advocates regarding privacy and the risk of errors.","link":"https://www.bbc.com/news/articles/c1l138rgz83o","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The London School of Economics and Political Science","pais":"United Kingdom","titulo":"Can Singapore Become the Switzerland of the AI Chip Economy?","resumo":"Singapore seeks to establish itself as a neutral hub in the global supply chain of semiconductors geared toward artificial intelligence.\nAmid trade disputes between major powers, the country is attracting billions in investments in technological infrastructure and research.\nThis strategy could position the city-state as an indispensable financial and technological center for the future of AI.","link":"https://blogs.lse.ac.uk/seac/2026/08/19/can-singapore-become-the-switzerland-of-the-ai-chip-economy/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"The Guardian","pais":"United Kingdom","titulo":"Did Someone Wearing Meta Glasses Film You Today? Are You Sure?","resumo":"The advancement of Meta's smart glasses raises urgent debates about the end of privacy in public spaces.\nBecause they capture images and videos in an almost imperceptible manner, the devices make it difficult to know if someone is being filmed.\nExperts and digital rights advocates are demanding stricter guidelines to regulate the collection of bodily and visual data.","link":"https://www.theguardian.com/technology/ng-interactive/2026/aug/19/meta-glasses-privacy-surveillance","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"United Kingdom","titulo":"Labour Could Lose Up to 50 Seats to the Greens if New North Sea Drilling Is Approved","resumo":"Political projections indicate that the British Labour Party could lose up to 50 seats to the Green Party in the upcoming elections.\nThe fallout stems from the possibility of approving new oil and gas drilling projects in the North Sea.\nThe scenario reflects voters' growing demand for severe environmental policies and an end to fossil fuels.","link":"https://www.theguardian.com/politics/2026/aug/19/labour-could-lose-seats-greens-new-drilling-north-sea","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"Financial Times","pais":"United Kingdom","titulo":"Don't Harm London's Knowledge Economy","resumo":"Experts and executives are warning of the risks of government measures that could weaken London's innovation sector.\nThe city's knowledge economy is driven by top-tier research institutions, technology startups, and the attraction of talent.\nPreserving this ecosystem is seen as fundamental to maintaining the UK's competitiveness on the global stage.","link":"https://www.ft.com/content/d30247d9-6e9e-4c2b-a6fc-9e751a9f7110","categoria":"INNOVATION","lang":"en"},{"fonte":"Actualidad Aeroespacial","pais":"Spain","titulo":"Firefly Incorporates Zeno Power Technology into Blue Ghost Mission to Survive Lunar Night","resumo":"Firefly Aerospace has integrated Zeno Power's innovative energy technology into its Blue Ghost lunar mission.\nThe main objective is to allow the lander to withstand the extremely low temperatures and prolonged darkness of the lunar night.\nThis collaboration represents a crucial breakthrough for the sustainability and long duration of future scientific explorations on the lunar surface.","link":"https://actualidadaeroespacial.com/firefly-incorpora-la-tecnologia-zeno-power-a-la-mision-blue-ghost-para-sobrevivir-a-la-noche-lunar/","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"elpais.com","pais":"Spain","titulo":"Who Designs the Artificial Intelligence of the Future (and Why Are Women Still Missing)?","resumo":"The accelerated advancement of artificial intelligence raises crucial debates about the representation of the teams developing these technologies.\nExperts warn of low female participation in the sector, which could perpetuate unwanted biases in algorithms on a global scale.\nInitiatives are seeking to attract more diverse talent to ensure more inclusive, ethical AI systems aligned with society.","link":"https://elpais.com/economia/formacion/2026-08-20/quien-disena-la-inteligencia-artificial-del-futuro-y-por-que-siguen-faltando-mujeres.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"La Razón","pais":"Spain","titulo":"Cygnus X-3 breaks cosmic scale: accelerates particles up to 30 PeV and becomes the most energetic known gamma-ray source","resumo":"Astrophysicists have identified that the binary system Cygnus X-3 is capable of accelerating particles to incredible energy levels of up to 30 PeV. The discovery establishes the cosmic object as the highest-energy gamma-ray source ever recorded in the universe. This feat challenges current theoretical models and opens new frontiers for understanding the cosmos's most extreme phenomena.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/cygnus-x-3-rompe-escala-cosmica-acelera-particulas-30-pev-ya-es-fuente-rayos-gamma-energetica-conocida_202608206a862cbca5690f0473838f88.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Motor16","pais":"Spain","titulo":"2027 Lexus RX: more technology, refinement, and hybrid power for the premium SUV","resumo":"Lexus has revealed updates for the 2027 RX SUV lineup, highlighting a strong investment in connectivity and advanced hybrid motorization. The model combines greater fuel efficiency with an enhanced technological package for driver assistance and on-board comfort. The update solidifies the brand's strategy to lead the premium segment with smarter, more sustainable vehicles.","link":"https://www.motor16.com/electrico/lexus-rx-2027-tecnologia/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Valencia Plaza","pais":"Spain","titulo":"UPV team leads development of new non-invasive technology to locate cardiac arrhythmias with greater precision","resumo":"Researchers at the Polytechnic University of Valencia have developed an innovative non-invasive system to map cardiac arrhythmias. The technology uses advanced algorithms to identify the focus of heart rhythm alterations with high accuracy. The breakthrough promises to optimize clinical diagnosis, reduce procedural risks, and improve treatments for cardiac patients.","link":"https://valenciaplaza.com/valenciaplaza/plaza-innovacion/un-equipo-de-la-upv-lidera-el-desarrollo-de-nueva-tecnologia-no-invasiva-para-localizar-con-mayor-precision-las-arritmias-cardiacas","categoria":"MEDICAL TECHNOLOGY","lang":"en"},{"fonte":"BBC","pais":"Spain","titulo":"We are getting meal times wrong: this is the best time to eat dinner, according to science","resumo":"Recent scientific studies indicate that the time we eat directly impacts metabolic health and sleep quality. Experts point out that eating dinner too late can disrupt the circadian rhythm and promote weight gain and digestive disorders. Science recommends bringing forward the last meal of the day to align metabolism with the body's natural cycles.","link":"https://www.bbc.com/mundo/articles/ce344qrkxe5o","categoria":"SCIENCE","lang":"en"},{"fonte":"BYD","pais":"Spain","titulo":"The secrets behind BYD's DM-i plug-in hybrid technology","resumo":"BYD has detailed the operation of its DM-i plug-in hybrid technology, which focuses on energy efficiency and high autonomy. The system prioritizes the use of the electric motor for propulsion, utilizing the combustion engine primarily as an energy generator. This solution represents a milestone in the transition to sustainable mobility by offering lower fuel consumption and high performance.","link":"https://www.byd.com/es-es/news-list/como-exprimir-al-maximo-tecnologia-dmi","categoria":"AUTOMOTIVE INNOVATION","lang":"en"},{"fonte":"elpais.com","pais":"Spain","titulo":"Revolution in neuromedicine with human minibrains kept alive for years","resumo":"Scientists have reached a historic milestone by keeping human brain organoids alive and functional for years in the laboratory. This achievement allows for the study of brain development and neurodegenerative diseases over previously impossible timeframes. This evolution in the field of neuromedicine accelerates the testing of new drugs and reduces dependence on animal models.","link":"https://elpais.com/ciencia/2026-08-19/revolucion-en-neuromedicina-al-lograr-minicerebros-humanos-que-se-mantienen-vivos-durante-anos.html","categoria":"NEUROMEDICINE","lang":"en"},{"fonte":"Thüringer Allgemeine","pais":"Germany","titulo":"More Connected: Thuringian Technology Enables the Same Material for Bottle and Cap","resumo":"A technological innovation developed in Thuringia makes it possible to manufacture bottles and caps using the same material.\nThe change simplifies the recycling process and significantly reduces costs for the packaging industry.\nThis advancement represents a major step forward for the circular economy by facilitating reverse logistics on the continent.","link":"https://www.thueringer-allgemeine.de/wirtschaft/article412637349/enger-verbunden-thueringer-technologie-ermoeglicht-gleiches-material-fuer-flasche-und-deckel-mit-video.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"La Razón","pais":"Germany","titulo":"Germany Questions Whether It Should Ban Smart Glasses","resumo":"The debate over the use of smart glasses in public places has regained momentum in Germany.\nAuthorities and experts are discussing privacy risks and security concerns regarding the unauthorized capture of data.\nThis discussion could result in strict new regulations for augmented reality wearable devices.","link":"https://www.larazon.es/sociedad/alemania-
