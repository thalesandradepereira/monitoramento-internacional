pregunta-debe-prohibir-smart-glasses_202608206a86596da046ad6ebcbb76dd.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Deutschlandfunk","pais":"Germany","titulo":"Ministry Appeals to Retailers Due to Low Gas Storage Levels","resumo":"Germany's Ministry of Economics has warned retailers about low natural gas storage levels.\nThe Consumer Protection Association warns that shortages could lead to significant price spikes.\nThe measure seeks to guarantee the stability of the country's energy supply ahead of the high-demand period.","link":"https://www.deutschlandfunk.de/ministerium-appelliert-wegen-niedriger-gasspeicherstaende-an-haendler-verbraucherzentrale-warnt-vor--100.html","categoria":"ENERGY","lang":"en"},{"fonte":"BILD","pais":"Germany","titulo":"Half of the Population Sees Politics as a Problem: Historic Record in Germany","resumo":"A recent poll revealed that half of German citizens consider the political class to be the country's biggest problem.\nThis is the highest dissatisfaction rate ever recorded in the history of this statistical data collection.\nThis result reflects the population's growing skepticism regarding government decisions and crisis management.","link":"https://www.bild.de/politik/inland/jeder-zweite-sieht-die-politik-als-problem-hoechstwert-seit-datenerfassung-6a85ba01e532e82cc4f2ab0c","categoria":"TRENDS","lang":"en"},{"fonte":"euractiv.com","pais":"Germany","titulo":"Brussels Backs the International Criminal Court Following US Sanctions","resumo":"The European Union has publicly reaffirmed its support for the International Criminal Court following sanctions imposed by the US.\nThe statement reinforces the Brussels bloc's commitment to global justice and multilateral institutions.\nThis stance highlights relevant diplomatic disagreements among Western allies regarding international jurisdiction.","link":"https://euractiv.com/de/news/bruessel-unterstuetzt-den-internationalen-strafgerichtshof-nach-us-sanktionen/","categoria":"GEOPOLITIC artup from Kyushu University focused on carbon capture, has raised funding in its Pre-Series A round.\nThe financing will drive the commercial development and expansion of its clean technology solutions in the domestic market.\nThe initiative aims to accelerate the removal of carbon dioxide from the atmosphere, supporting the country's sustainability goals.","link":"https://thebridge.jp/2026/08/carbon-xtract-raises-pre-series-a-first-close","categoria":"INNOVATION","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"Fujitsu Adopts US Defense Technology to Secure Supply Chains","resumo":"Fujitsu has announced the adoption of cybersecurity technologies originating from the United States defense sector.\nThe solution aims to ensure the safe and secure sharing of critical data throughout its entire supply chain.\nThe measure strengthens the company's operational resilience against growing digital threats and industrial information leaks.","link":"https://www.nikkei.com/article/DGXZQOUC201E50Q6A820C2000000/","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"Garments with Wireless Power Transmission Pave the Way for New Wearables","resumo":"Researchers have created a technological fabric capable of wireless power and data transmission for wearable devices.\nThe innovation eliminates the need for heavy cables and bulky batteries, facilitating the creation of smart clothing.\nThe breakthrough promises to transform areas such as continuous health monitoring and the development of wearable electronics.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_new/pt20260820000014.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Real Sound｜リアルサウンド","pais":"Japan","titulo":"TikTok Gaming Officially Joins the Japan Esports Union","resumo":"The TikTok Gaming division has officially become a member of the Japan Esports Union to expand its presence in the sector.\nThe partnership aims to raise the profile of electronic sports in the country and en creating the first television network dedicated exclusively to sports.\nHis work redefined sports content consumption on pay TV and influenced generations of communication channels.","link":"https://timesofindia.indiatimes.com/life-style/people/who-was-bill-rasmussen-the-father-of-sports-television-who-died-at-93/articleshow/133356464.cms","categoria":"MEDIA","lang":"en"},{"fonte":"TVI","pais":"Portugal","titulo":"UN Humanitarian Chief Calls for Dialogue with Drone Manufacturers on Lethal Tech Risks","resumo":"The United Nations humanitarian chief has made a direct appeal to global drone manufacturers to initiate a dialogue on the military use and dangers of this technology. The initiative seeks to ensure that companies fully understand the ethical risks and devastating impacts of using autonomous weapons in conflict zones. With the rapid advancement of these lethal solutions, the UN emphasizes the urgent need for regulation and accountability in technological development.","link":"https://tvi.iol.pt/noticias/drones/fabricantes-de-armas/chefe-humanitario-da-onu-apela-ao-dialogo-com-fabricantes-de-drones-para-garantir-que-compreendem-riscos-de-tecnologia-letal/20260819/6a86236dd34e511da0b34394","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"record.pt","pais":"Portugal","titulo":"High-Quality, Pocket-Sized Lenovo Action Camera Arrives on AliExpress for Under 50 Euros","resumo":"A new compact action camera from Lenovo is catching the eye of tech enthusiasts by becoming available at an extremely affordable price. The device promises high-definition recording in a pocket-sized format ideal for sports and travel, challenging more expensive competitors on the market. This new addition to AliExpress demonstrates the advancement of cost-effectiveness in portable photographic equipment from established brands.","link":"https://www.record.pt/indica/tecnologia/detalhe/alta-qualidade-num-formato-de-bolso-por-menos-de-50-no-aliexpress-vai-ficar-pasmado-com-esta-camara-de-acao-le   const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
