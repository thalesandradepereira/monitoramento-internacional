    :root {

    .btn-clear {

  // Injeta os dados originais no frontend
  const data = [{"fonte":"O GLOBO","pais":"Brasil","titulo":"IA com anúncios: ChatGPT passa a exibir publicidade no Brasil e muda experiência de uso","resumo":"A OpenAI começou a implementar anúncios publicitários na versão gratuita do ChatGPT para usuários no Brasil.\nA mudança busca monetizar a plataforma enquanto financia os altos custos de processamento dos modelos de inteligência artificial.\nA exibição das propagandas será integrada de forma contextualizada diretamente nas conversas com o assistente.\nEspecialistas e usuários acompanham com atenção os impactos da novidade na privacidade e na experiência do usuário.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/07/30/ia-com-reclame-chatgpt-passa-a-exibir-anuncios-no-brasil-veja-o-que-muda-para-os-usuarios.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Tecnologia revela cidades ocultas no Acre com população comparável ao Império Inca","resumo":"Pesquisadores utilizaram tecnologias avançadas de sensoriamento remoto, como o LiDAR, para mapear antigas civilizações no Acre.\nO estudo revelou uma rede urbana complexa com densidade populacional equivalente a um quarto do Império Inca.\nAs descobertas reescrevem a história pré-colombiana da Amazônia e demonstram o papel da tecnologia na arqueologia.\nO achado abre novas frentes para preservação do patrimônio histórico e ambiental da região.","link":"https://oglobo.globo.com/brasil/noticia/2026/07/30/civilizacao-no-acre-tinha-populacao-equivalente-a-um-quarto-do-imperio-inca-entenda-como-tecnologia-revelou-cidades-ocultas.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"CNN Brasil","pais":"Brasil","titulo":"Empresas de tecnologia pedem que Estados Unidos desacelerem desenvolvimento de IAs avançadas","resumo":"Líderes do setor de tecnologia solicitaram publicamente um freio no desenvolvimento de modelos avançados de inteligência artificial.\nO apelo direcionado ao governo dos Estados Unidos destaca preocupações com segurança existencial e riscos sistêmicos.\nA movimentação reflete a crescente tensão entre a corrida comercial por inovação e a necessidade de regulamentação.\nA decisão pode redefinir o ritmo de lançamentos tecnológicos e impactar o mercado global.","link":"https://www.cnnbrasil.com.br/tecnologia/limite-da-ia-empresas-de-tecnologia-pedem-que-eua-freiem-modelos-avancados/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"EUA proíbem robôs humanoides chineses e intensificam disputa tecnológica","resumo":"O governo dos Estados Unidos aprovou novas restrições banindo a importação e uso de robôs humanoides desenvolvidos na China.\nA medida amplia a disputa geopolítica pela supremacia em automação industrial e inteligência artificial.\nAutoridades norte-americanas alegam riscos de espionagem e dependência tecnológica excessiva do país asiático.\nA proibição deve acelerar investimentos locais na indústria de robótica e acirrar as tensões comerciais globais.","link":"https://g1.globo.com/tecnologia/noticia/2026/07/30/eua-proibem-robos-humanoides-chineses-e-ampliam-disputa-tecnologica-com-pequim.ghtml","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"BBC","pais":"Brasil","titulo":"Nobel de Economia elogia o Pix e destaca soberania digital do Brasil","resumo":"Um vencedor do Prêmio Nobel de Economia elogiou a eficiência e a independência digital do sistema de pagamentos Pix no Brasil.\nO especialista destacou que a plataforma é um modelo de autonomia tecnológica frente ao domínio de gigantes financeiras globais.\nEle também alertou sobre pressões internacionais em relação à soberania dos sistemas financeiros nacionais.\nO reconhecimento reforça o papel do Brasil como referência internacional em inovação tecnológica e inclusão bancária.","link":"https://www.bbc.com/portuguese/articles/c1l1dq48843o","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Ciência revela o limite da longevidade humana em novo estudo surpreendente","resumo":"Um novo estudo científico revelou os limites biológicos para o tempo máximo de vida que o corpo humano pode alcançar.\nA pesquisa analisou dados genéticos e biomédicos complexos para calcular a capacidade natural de regeneração celular.\nOs resultados mostram um teto para a longevidade humana, independentemente dos avanços da medicina moderna.\nAs descobertas ajudam a direcionar o foco científico para a melhoria da qualidade de vida durante o envelhecimento.","link":"https://oglobo.globo.com/saude/ciencia/noticia/2026/07/30/ate-que-idade-o-ser-humano-consegue-viver-ciencia-revela-limite-da-longevidade-e-resultado-surpreende.ghtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Telegram enfrenta pressão de autoridades globais e entra na mira de reguladores no Brasil","resumo":"O aplicativo de mensagens Telegram enfrenta um aumento na fiscalização por parte de autoridades regulatórias em diversos países.\nNo Brasil, o app atrai atenção devido a exigências sobre moderação de conteúdo e combate à desinformação.\nÓrgãos reguladores buscam maior cooperação da empresa para o cumprimento de ordens judiciais e proteção de dados.\nO cenário traz incertezas sobre o futuro da operação da plataforma no mercado nacional.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/07/30/telegram-em-apuros-veja-em-que-paises-o-app-de-mensagens-entrou-na-mira-de-autoridades-o-brasil-e-um-deles.ghtml","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"GOV.BR","pais":"Brasil","titulo":"Innospace atualiza calendário de lançamentos espaciais na Base de Alcântara","resumo":"A empresa de tecnologia espacial Innospace atualizou seu cronograma de missões com lançamentos no Centro de Alcântara, no Maranhão.\nA revisão das datas visa otimizar os testes e a preparação técnica de novos veículos lançadores comerciais.\nA iniciativa fortalece a inserção do Brasil no mercado privado de exploração e transporte espacial.\nA expectativa é atrair investimentos e impulsionar o ecossistema tecnológico aeroespacial do país.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/innospace-atualiza-cronograma-de-missoes-previstas-para-o-centro-de-lancamento-de-alcantara","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"O GLOBO","pais":"Estados Unidos","titulo":"'Hacker' Autônomo: Como a IA da OpenAI 'Invadiu' Plataformas e Preocupa Especialistas","resumo":"Um agente autônomo baseado em inteligência artificial desenvolvido pela OpenAI demonstrou capacidade de explorar vulnerabilidades em diversas plataformas digitais.\nA descoberta acendeu um alerta global entre analistas de segurança cibernética e executivos de tecnologia sobre os riscos de ciberataques automatizados.\nEspecialistas pedem o fortalecimento urgente dos protocolos de defesa e regulamentações para conter o uso malicioso da IA.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/07/30/hacker-autonomo-como-ia-da-openai-invadiu-varias-plataformas-e-por-que-isso-preocupa-analistas-e-empresas.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Bloomberg.com","pais":"Estados Unidos","titulo":"Empresa de Fusão Nuclear Capta US$ 1 Bilhão para Comercializar Tecnologia Clean","resumo":"Uma startup voltada para a energia de fusão nuclear obteve um aporte bilionário histórico focado em acelerar o desenvolvimento comercial da tecnologia.\nO investimento representa um marco significativo para o setor de energia limpa, prometendo transformar a geração de eletricidade global sem emissão de carbono.\nA iniciativa busca superar desafios de engenharia e colocar os primeiros reatores operacionais na grade elétrica nos próximos anos.","link":"https://www.bloomberg.com/news/articles/2026-07-30/fusion-firm-gets-1-billion-in-bid-to-commercialize-technology","categoria":"ENERGIA","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"Telescópio James Webb da NASA Mapeia Árvore Genealógica de Objetos Distantes","resumo":"O Telescópio Espacial James Webb capturou imagens inéditas que permitem aos astrônomos rastrear a origem e evolução de corpos celestes recém-descobertos nos confins do universo.\nA análise detalhada ajuda a responder questões fundamentais sobre como as primeiras estruturas e sistemas planetários se formaram após o Big Bang.\nOs novos dados astronômicos fornecem uma visão sem precedentes da história cósmica e abrem caminhos para futuras descobertas profundas.","link":"https://science.nasa.gov/missions/webb/nasa-webb-explores-family-tree-of-newly-discovered-distant-objects/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Guardian","pais":"Estados Unidos","titulo":"xAI de Elon Musk Processa Estado de Minnesota por Lei Contra Tecnologia de 'Nudificação'","resumo":"A empresa de inteligência artificial xAI moveu uma ação judicial contra o estado de Minnesota contestando uma nova legislação que proíbe softwares de alteração de imagem.\nA companhia argumenta que a lei restringe indevidamente a inovação tecnológica e viola direitos de liberdade de expressão e desenvolvimento de sistemas.\nO caso coloca em evidência o intenso debate jurídico sobre os limites da regulamentação estatal em relação às ferramentas de geração de conteúdo por IA.","link":"https://www.theguardian.com/technology/2026/jul/29/xai-sues-minnesota-nudification-technology","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Estados Unidos","titulo":"Colina Icônica do Papel de Parede do Windows XP Surge Seca e Irreconhecível 30 Anos Depois","resumo":"A famosa paisagem de colinas verdes que estampou a tela inicial de milhões de computadores no mundo inteiro apresentou uma transformação dramática.\nFotografias recentes mostram a região com vegetação seca e desgastada devido a mudanças climáticas e transformações agrícolas na Califórnia.\nO registro da paisagem atual viralizou nas redes sociais, gerando nostalgia e alertas sobre os impactos visíveis das secas prolongadas.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/07/30/colina-de-foto-classica-do-windows-xp-surge-seca-e-irreconhecivel-30-anos-depois.ghtml","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"FOX Carolina News","pais":"Estados Unidos","titulo":"Las Vegas Integra Tecnologia de Inteligência Artificial ao Sistema de Emergência 911","resumo":"A cidade de Las Vegas iniciou a implementação de ferramentas de IA para otimizar o atendimento de chamadas telefônicas no serviço de emergência local.\nO novo sistema auxilia os atendentes na triagem rápida de incidentes, reduzindo o tempo de resposta e organizando prioridades em tempo real.\nA modernização promete aumentar a eficiência das equipes de socorro e servir de modelo de cidade inteligente para outras metrópoles americanas.","link":"https://www.foxcarolina.com/video/2026/07/30/las-vegas-integrating-ai-technology-into-911-call-system/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Financial Times","pais":"Estados Unidos","titulo":"BNY Adota Tecnologia Blockchain para Registros Financeiros em Nova Era de Wall Street","resumo":"O tradicional banco BNY anunciou a integração da tecnologia blockchain na gestão e armazenamento de seus registros corporativos e transacionais.\nA mudança visa aumentar a transparência, segurança operacional e eficiência dos processos no mercado financeiro global.\nA iniciativa marca um avanço institucional importante para a adoção definitiva de ledger distribuído pelas maiores instituições de Wall Street.","link":"https://www.ft.com/content/7b1197a5-e59a-4beb-ab83-e800e6ebc527?syn-25a6b1a6=1","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"NASA (.gov)","pais":"Estados Unidos","titulo":"NASA Premia Conceitos Tecnológicos Inovadores Selecionados para 2026","resumo":"A agência espacial norte-americana anunciou os projetos vencedores do programa de incentivo a ideias tecnológicas revolucionárias para missões futuras.\nAs propostas selecionadas incluem novos sistemas de propulsão, instrumentos de exploração de águas profundas no espaço e habitats avançados.\nO financiamento inicial busca transformar teorias científicas audaciosas em tecnologias viáveis para a exploração espacial das próximas décadas.","link":"https://www.nasa.gov/news-release/nasa-awards-2026-innovative-technology-concepts/","categoria":"ESPAÇO","lang":"pt"},{"fonte":"El Boletín","pais":"França","titulo":"Economia da França volta a crescer 0,2% no segundo trimestre impulsionada pelas exportações","resumo":"A economia francesa registrou uma expansão de 0,2% no segundo trimestre, superando as expectativas em um cenário de incertezas globais.\nO desempenho positivo foi sustentado principalmente pelo comércio exterior e pelo aumento das exportações do país.\nEspecialistas destacam que o resultado traz alívio temporário para o mercado financeiro europeu, embora os desafios inflacionários ainda exijam cautela nos próximos meses.","link":"https://www.elboletin.com/la-economia-de-francia-vuelve-a-crecer-un-02-en-el-segundo-trimestre-impulsada-por-las-exportaciones/","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Le Monde.fr","pais":"França","titulo":"Na França, a recuperação ilusória da economia no segundo trimestre","resumo":"Embora os dados oficiais apontem para uma ligeira recuperação econômica na França no segundo trimestre, analistas alertam para os riscos ocultos sob os números.\nO crescimento registrado reflete fatores pontuais e não uma recuperação sólida e sustentável da demanda interna.\nCom o consumo das famílias em desaceleração, o cenário econômico francês exige atenção quanto ao impacto real na qualidade de vida dos cidadãos.","link":"https://www.lemonde.fr/economie/article/2026/07/30/en-france-un-rebond-en-trompe-l-il-de-l-economie-au-deuxieme-trimestre_6736703_3234.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"WSJ","pais":"França","titulo":"Economia francesa se recuperou no segundo trimestre apesar da incerteza da guerra","resumo":"A economia da França mostrou resiliência ao crescer no segundo trimestre, superando os impactos negativos gerados pela guerra na Ucrânia e a crise energética europeia.\nO avanço do Produto Interno Bruto foi impulsionado pelo setor de turismo e pela recuperação de serviços essenciais.\nApesar dos ventos contrários geopolíticos, o país demonstrou capacidade de adaptação econômica no curto prazo.","link":"https://www.wsj.com/economy/french-economy-rebounded-in-second-quarter-despite-war-uncertainty-f2221427","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Mon Auto Neuve","pais":"França","titulo":"Futuro do automóvel: entre tecnologia de ponta e revolução elétrica, setor se transforma","resumo":"A indústria automobilística enfrenta uma das maiores transformações de sua história, impulsionada pela eletrificação e por sistemas de inteligência avançados.\nO avanço dos veículos elétricos e conectados redefine a mobilidade urbana, exigindo maciços investimentos em infraestrutura e baterias.\nEssa transição tecnológica não apenas reduz emissões de carbono, mas reconfigura totalmente o mercado global de transporte.","link":"https://www.monautoneuve.fr/actualites/futur-de-lauto-entre-technologie-de-pointe-et-revolution-electrique-le-secteur-se-transforme/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Pour la Science","pais":"França","titulo":"Fotossíntese adaptada para... aliviar a síndrome do olho seco","resumo":"Pesquisadores desenvolveram uma abordagem inovadora ao utilizar mecanismos inspirados na fotossíntese para tratar a síndrome do olho seco.\nA técnica emprega estruturas fotossintéticas celulares para gerar oxigênio e hidratação diretamente na superfície ocular atingida.\nEssa aplicação biotecnológica inédita abre novas fronteiras no tratamento de doenças crônicas e no uso de processos biológicos na medicina.","link":"https://www.pourlascience.fr/sd/biologie/la-photosynthese-detournee-pour-soulager-la-secheresse-oculaire-29358.php","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Bloomberg.com","pais":"França","titulo":"Economia francesa recupera-se com crescimento de 0,2% no segundo trimestre","resumo":"O Produto Interno Bruto da França apresentou uma alta de 0,2% entre abril e junho, confirmando a recuperação da atividade econômica no período.\nO crescimento foi favorecido pelas vendas externas e pela resiliência industrial, mesmo diante da inflação elevada na zona do euro.\nO resultado oferece um respiro importante para o governo e sinaliza estabilidade macroeconômica temporária.","link":"https://www.bloomberg.com/news/articles/2026-07-30/french-economy-rebounds-with-0-2-growth-in-second-quarter","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Le Devoir","pais":"França","titulo":"Editorial de Claudine St-Germain | A inteligência artificial superou a ficção científica","resumo":"A rápida evolução dos modelos de inteligência artificial transformou conceitos antes restritos à ficção científica em ferramentas cotidianas do mundo real.\nO avanço acelerado dessas tecnologias redefiniu setores produtivos, a criação cultural e a dinâmica do mercado de trabalho global.\nDiante dessa nova realidade, surgem debates urgentes sobre ética, regulamentação e os limites da autonomia das máquinas.","link":"https://www.ledevoir.com/opinion/editoriaux/998357/ia-depasse-science-fiction","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Le Télégramme","pais":"França","titulo":"'Uma boa surpresa'? Insee revelará se a economia francesa resistiu bem no segundo trimestre","resumo":"O Instituto Nacional de Estatística e Estudos Econômicos (Insee) divulga análises cruciais sobre o desempenho e a capacidade de resistência da economia francesa.\nAs projeções avaliam como o país enfrentou a alta dos custos de energia e a pressão inflacionária no segundo trimestre.\nOs dados são aguardados com grande expectativa por analistas e agentes financeiros para balizar investimentos futuros.","link":"https://www.letelegramme.fr/economie/inflation/une-bonne-surprise-linsee-va-dire-si-leconomie-francaise-a-bien-resiste-au-deuxieme-trimestre-7091994.php","categoria":"ECONOMIA","lang":"pt"},{"fonte":"The Indian Express","pais":"Inglaterra","titulo":"Regulador de concorrência do Reino Unido investiga se Microsoft enganou consumidores de planos pessoais e familiares","resumo":"O órgão regulador de concorrência do Reino Unido abriu uma investigação para apurar se a Microsoft violou regras de proteção ao consumidor em suas assinaturas pessoais e familiares.\nA apuração foca na clareza das informações sobre renovações automáticas, cancelamentos e alterações de preços praticadas pela empresa.\nCaso sejam confirmadas irregularidades, a gigante de tecnologia poderá enfrentar sanções financeiras e ter que reformular suas políticas de cobrança no país.","link":"https://indianexpress.com/article/technology/tech-news-technology/uk-competition-regulator-investigates-whether-microsoft-misled-personal-and-family-customers-10810079/","categoria":"REGULAÇÃO","lang":"pt"},{"fonte":"MiCiudadReal.es","pais":"Espanha","titulo":"Nova tecnologia de imagem médica evita quase metade das biópsias de próstata desnecessárias","resumo":"Uma nova abordagem em exames de imagem médica promete transformar a detecção do câncer de próstata ao reduzir significativamente intervenções invasivas.\nA tecnologia permite identificar lesões com alta precisão, evitando cerca de metade dos procedimentos desnecessários na rotina médica.\nEssa inovação melhora o conforto do paciente, reduz custos hospitalares e otimiza o fluxo de diagnósticos no sistema de saúde.","link":"https://www.miciudadreal.es/2026/07/30/nueva-tecnologia-en-imagen-medica-evita-casi-la-mitad-de-las-biopsias-de-prostata-innecesarias/","categoria":"MEDICINA","lang":"pt"},{"fonte":"Cinco Días","pais":"Espanha","titulo":"A rebelião dos pesos abertos na inteligência artificial","resumo":"O debate sobre a liberação de modelos com pesos abertos em inteligência artificial ganha força entre desenvolvedores e pesquisadores globais.\nEssa abordagem busca democratizar o acesso à tecnologia e contrapor o domínio fechado das grandes corporações de tecnologia.\nO movimento promete acelerar a inovação aberta, embora enfrente discussões acaloradas sobre segurança, regulamentação e uso responsável.","link":"https://cincodias.elpais.com/economia/2026-07-30/la-rebelion-de-los-pesos-abiertos-en-la-ia.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Valencia Plaza","pais":"Espanha","titulo":"LALIGA lança Tech Powerhouse 2026, novo observatório de tecnologia e IA aplicadas ao futebol","resumo":"A LALIGA anunciou o lançamento do Tech Powerhouse 2026, uma iniciativa voltada a monitorar e integrar inovações tecnológicas no esporte.\nO observatório focará na aplicação de inteligência artificial, análise avançada de desempenho e aprimoramento da experiência dos fãs.\nA estratégia consolida a liga espanhola como referência global na transformação digital e no desenvolvimento de soluções para o futebol.","link":"https://valenciaplaza.com/nr-economia/laliga-lanza-tech-powerhouse-2026-un-nuevo-observatorio-sobre-tecnologia-e-inteligencia-artificial-aplicada-al-futbol","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"ciencia.gob.es","pais":"Espanha","titulo":"Governo da Espanha e BEI preveem mobilizar até 1 bilhão de euros para o Telescópio de Trinta Metros em La Palma","resumo":"O Governo espanhol e o Banco Europeu de Investimento anunciaram a intenção de financiar a instalação do Telescópio de Trinta Metros na ilha de La Palma.\nO projeto megacientífico visa posicionar a região no topo da astronomia mundial e impulsionar a pesquisa astrofísica internacional.\nCaso seja concretizado, o complexo atrairá tecnologia de ponta, investimentos estratégicos e empregos altamente qualificados.","link":"https://www.ciencia.gob.es/Noticias/2026/julio/ciencia-y-bei-movilizan-1000-millones-tmt.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"AZARplus","pais":"Espanha","titulo":"Nova tecnologia da LALIGA auxiliará torcedores na gestão de apostas esportivas","resumo":"A LALIGA apresentou uma nova ferramenta tecnológica desenvolvida para auxiliar os torcedores no gerenciamento de suas apostas esportivas com mais responsabilidade.\nA solução utiliza processamento de dados em tempo real para fornecer estatísticas detalhadas e alertas personalizados aos usuários.\nCom a iniciativa, a entidade busca promover um ambiente de entretenimento mais seguro e consciente no ecossistema esportivo.","link":"https://www.azarplus.com/la-nueva-tecnologia-de-laliga-asistira-a-los-aficionados-en-la-gestion-de-sus-apuestas-deportivas/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Xunta de Galicia","pais":"Espanha","titulo":"Fabiola García destaca o talento feminino na ciência com a entrega do Prêmio María Josefa Wonenburger","resumo":"A premiação María Josefa Wonenburger homenageou as pesquisadoras África González e Yolanda Preciado por suas contribuições de destaque no campo científico.\nO evento ressaltou a relevância de dar visibilidade ao trabalho liderado por mulheres e incentivar novas vocações científicas na região.\nA iniciativa busca fortalecer a igualdade de gênero na pesquisa e reconhecer trajetórias de excelência acadêmica.","link":"https://www.xunta.gal/es/notas-de-prensa/-/nova/027205/fabiola-garcia-pone-valor-talento-femenino-ciencia-con-entrega-africa-gonzalez","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Ayuntamiento de Sagunto","pais":"Espanha","titulo":"Grande público se reúne na Casa Municipal de Cultura para entender a ciência por trás do eclipse solar","resumo":"Um evento de divulgação científica atraiu uma grande multidão para debater e compreender os fenômenos astronômicos associados aos eclipses solares.\nEspecialistas apresentaram conceitos sobre a mecânica celeste, técnicas de observação segura e os impactos da astronomia na sociedade.\nA ação comunitária destacou o crescente interesse popular pela ciência espacial e pelo conhecimento do universo.","link":"https://aytosagunto.es/es/actualidad/2026-07-29-un-numeroso-publico-se-congrega-en-la-casa-municipal-de-cultura-para-conocer-la-ciencia-detras-del-eclipse-solar/","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"La Moncloa","pais":"Espanha","titulo":"Espanha promove a primeira reunião do Conselho Global sobre a Nova Economia do Século XXI","resumo":"A Espanha sediou o encontro inaugural do Conselho Global voltado a discutir modelos econômicos emergentes e sustentáveis para o século XXI.\nO fórum reúne especialistas e líderes internacionais para debater transição digital, sustentabilidade e novas dinâmicas de desenvolvimento global.\nA iniciativa reforça a liderança do país na formulação de políticas públicas focadas no futuro da economia e do trabalho.","link":"https://www.lamoncloa.gob.es/serviciosdeprensa/notasprensa/economia-comercio-empresa/Paginas/2026/290726-consejo-global-nueva-economia.aspx","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"WEB.DE","pais":"Alemanha","titulo":"Acadêmicos, médicos e especialistas em TI deixam a Alemanha: entenda os motivos","resumo":"Um número crescente de profissionais altamente qualificados, incluindo acadêmicos, médicos e especialistas em TI, está emigrando da Alemanha.\nA fuga de cérebros é impulsionada por fatores como alta carga tributária, burocracia excessiva e melhores oportunidades no exterior.\nO fenômeno gera profunda preocupação no setor produtivo e na comunidade científica, colocando em risco a competitividade do país.","link":"https://web.de/magazine/politik/rekord-auswanderung-akademiker-fachkraefte-deutschland-verlassen-42535082","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Bild der Wissenschaft","pais":"Alemanha","titulo":"Existe um mundo espelho? Nêutrons ultrafrios revelam novas pistas","resumo":"Pesquisadores estão utilizando nêutrons ultrafrios para investigar a possível existência de um mundo espelho paralelo na física de partículas.\nA hipótese sugere que partículas poderiam oscilar para uma dimensão oculta, oferecendo respostas para o mistério da matéria escura no universo.\nOs experimentos recentes trouxeram medições inéditas que ajudam a testar os limites do Modelo Padrão da física moderna.","link":"https://wissenschaft.de/artikel/gibt-es-eine-spiegelwelt-ultrakalte-neutronen-verraten-mehr","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Bild der Wissenschaft","pais":"Alemanha","titulo":"Óculos inovadores convertem luz infravermelha em imagens coloridas","resumo":"Cientistas desenvolveram óculos inovadores capazes de capturar radiação infravermelha e convertê-la em imagens visíveis e coloridas em tempo real.\nA tecnologia emprega superfícies ópticas avançadas que dispensam os sistemas volumosos e pesados dos aparelhos tradicionais de visão noturna.\nEssa descoberta promete revolucionar dispositivos portáteis de navegação, sistemas de auxílio visual e aplicações diagnósticas na medicina.","link":"https://wissenschaft.de/artikel/brille-wandelt-infrarotlicht-in-farbige-bilder-um","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Yahoo Finance","pais":"Alemanha","titulo":"Economia alemã mostra sinais de crescimento no 2º trimestre apesar de conflito no Irã","resumo":"A economia alemã dá sinais de recuperação e projeta crescimento para o segundo trimestre do ano, superando expectativas de analistas.\nO desempenho positivo ocorre mesmo diante das incertezas globais e dos potenciais impactos causados pelas tensões geopolíticas no Oriente Médio.\nEspecialistas destacam que a resiliência do setor produtivo e a estabilização do consumo têm sido fundamentais para impulsionar os resultados.","link":"https://finance.yahoo.com/economy/articles/german-economy-show-signs-growth-020338445.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"DIE ZEIT","pais":"Alemanha","titulo":"Gabinete alemão aprova nova regulamentação para contratos temporários na ciência","resumo":"O governo alemão aprovou um projeto de lei que altera as regras para contratos por tempo determinado na pesquisa acadêmica e científica.\nA nova regulamentação busca oferecer maior estabilidade contratual e segurança jurídica para jovens pesquisadores e doutorandos no país.\nCom a medida, a Alemanha pretende combater a precarização do trabalho acadêmico e manter sua atratividade para talentos científicos globais.","link":"https://www.zeit.de/wissenschaft/2026-07/wissenschaftszeitvertragsgesetz-befristung-arbeitsvertraege-forschung-dorothee-baer","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ANI News","pais":"Japão","titulo":"Japão reduz previsão de crescimento para o ano fiscal de 2026 para 0,9% com alta do petróleo","resumo":"O governo do Japão revisou para baixo a sua estimativa de crescimento econômico para o ano fiscal de 2026, fixando-a em 0,9%.\nA decisão reflete os impactos negativos do aumento contínuo nos preços mundiais do petróleo e as incertezas geopolíticas.\nA elevação dos custos energéticos tem encarecido a produção industrial e pressionado fortemente o consumo das famílias.\nO cenário impõe novos desafios para a estabilização da moeda local e para a recuperação sustentável da economia do país.","link":"https://www.aninews.in/news/business/japan-cuts-fy2026-growth-forecast-to-09-pc-as-higher-oil-prices-weigh-on-economy20260730113329","categoria":"ECONOMIA","lang":"pt"},{"fonte":"nationalgeographic.com.es","pais":"Japão","titulo":"Ciência qualifica violento terremoto no Japão como 'raro' devido a fenômeno geológico intrigante","resumo":"Sismólogos e cientistas classificaram um recente e violento terremoto no Japão como um evento extremamente incomum.\nA causa primária está atrelada a uma dinâmica geológica atípica que tem desafiado os modelos tradicionais de previsão.\nA descoberta acendeu alertas na comunidade científica, impulsionando novas pesquisas sobre falhas profundas no Pacífico.\nEspecialistas agora trabalham para reavaliar os riscos de desastres naturais e reforçar a segurança infraestrutural do país.","link":"https://www.nationalgeographic.com.es/ciencia/por-que-terremoto-japon-es-fenomeno-raro-segun-ciencia_29044","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"FAZ","pais":"Japão","titulo":"Iene fraco afeta a classe média e a economia do Japão","resumo":"A depreciação histórica do iene frente ao dólar está gerando severos impactos socioeconômicos no Japão.\nA desvalorização cambial encareceu drasticamente a importação de alimentos, combustíveis e insumos básicos.\nCom o poder de compra da classe média reduzido, o consumo interno sofreu um desaquecimento considerável.\nO cenário pressiona o governo e o banco central a adotarem medidas para conter a inflação e estabilizar o mercado.","link":"https://www.faz.net/premium/weltwirtschaft/finanzwelt/schwacher-yen-trifft-japans-mittelschicht-und-wirtschaft-accg-201074860.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"ロイター","pais":"Japão","titulo":"Intel disponibilizará sua tecnologia de processadores para startups","resumo":"A Intel anunciou uma iniciativa estratégica para fornecer acesso à sua tecnologia de processadores para startups.\nO programa busca acelerar a inovação no setor de semicondutores, permitindo a criação de chips customizados.\nCom esse movimento, a fabricante pretende fortalecer seu ecossistema e impulsionar novos negócios em tecnologia avançada.\nA parceria promete expandir a presença de arquiteturas proprietárias em soluções emergentes de inteligência e computação.","link":"https://jp.reuters.com/economy/CZDANJPY6JLZRGPCNDX4NNYIXQ-2026-07-30/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"NVIDIA | Japan Blog","pais":"Japão","titulo":"NVIDIA e KAIST inauguram laboratório conjunto de pesquisa para acelerar a inovação em IA","resumo":"A NVIDIA firmou uma parceria com o KAIST para inaugurar um laboratório conjunto focado em Inteligência Artificial.\nO centro de pesquisa visa desenvolver algoritmos de última geração e capacitar pesquisadores no setor de ponta.\nA iniciativa pretende acelerar a inovação tecnológica na região e expandir a infraestrutura de supercomputação.\nO projeto consolida a posição da NVIDIA como líder global na expansão de ecossistemas dedicados ao avanço da IA.","link":"https://blogs.nvidia.co.jp/blog/nvidia-and-kaist-launch-joint-ai-research-lab-to-accelerate-ai-innovation-in-korea/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"tsinghua.edu.cn","pais":"China","titulo":"Equipe da Tsinghua Acelera Integração da Tecnologia de Interface Cérebro-Computador na Vida Real","resumo":"Após três décadas de pesquisas intensivas, a equipe de cientistas da Universidade Tsinghua obteve avanços cruciais na tecnologia de interface cérebro-computador.\nO desenvolvimento busca conectar diretamente o sistema nervoso a dispositivos externos, acelerando a transição de pesquisas laboratoriais para aplicações práticas.\nA inovação promete transformar o tratamento de paralisias e distúrbios neurológicos, marcando um passo histórico para a neurotecnologia chinesa.","link":"https://www.tsinghua.edu.cn/info/3245/127172.htm","categoria":"NEUROTECNOLOGIA","lang":"pt"},{"fonte":"新华网","pais":"China","titulo":"Hongqi Alcança Avanço Tecnológico Significativo com Bateria de Carregamento Ultrarrápido","resumo":"A fabricante chinesa Hongqi anunciou uma inovação de destaque no setor de veículos elétricos ao registrar um tempo de carregamento ultrarrápido de apenas 3 minutos e 41 segundos.\nO avanço tecnológico foca na melhoria da eficiência da bateria e no gerenciamento térmico para viabilizar recargas em tempo recorde.\nEssa conquista reduz drasticamente o tempo de espera nos postos de carregamento e reforça a liderança do país na transição para a mobilidade elétrica.","link":"http://www.jl.xinhuanet.com/20260730/0d043602c81d4e0ea228ea0b64029c8a/c.html","categoria":"TECNOLOGIA AUTOMOTIVA","lang":"pt"},{"fonte":"PZ-news","pais":"China","titulo":"China Desafia os EUA em Disputa pelo Avanço dos Robôs Humanoides","resumo":"A competição tecnológica entre Pequim e Washington ganha um novo capítulo focado na produção e no desenvolvimento de robôs humanoides de última geração.\nA China vem intensificando os investimentos no setor de robótica industrial e assistencial para garantir autonomia de suprimentos e liderança de mercado.\nO movimento amplia as tensões comerciais e estratégicas com os Estados Unidos, que também buscam consolidar domínio sobre essa tecnologia emergente.","link":"https://www.pz-news.de/wirtschaft/wirtschaft-weltweit_artikel,-China-droht-USA-im-Streit-um-humanoide-Roboter-_arid,2362252.html","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"Bloomberg.com","pais":"China","titulo":"Cidades Focadas em Inteligência Artificial Lideram o Crescimento Tecnológico na China","resumo":"Cidades chinesas voltadas ao ecossistema de inteligência artificial estão registrando um ritmo de expansão e investimentos acelerado em relação a outros setores econômicos.\nOs polos tecnológicos atraem startups, centros de pesquisa e grande volume de capital voltado para o desenvolvimento de hardware e algoritmos avançados.\nEsse fenômeno destaca a estratégia nacional de priorizar a inovação em IA como o principal motor de transformação e crescimento para os próximos anos.","link":"https://www.bloomberg.com/news/articles/2026-07-30/china-s-ai-boomtowns-race-ahead-as-rest-of-economy-falls-behind","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Yahoo!ファイナンス","pais":"China","titulo":"Xiaomi Anuncia Evento de Tecnologia Automotiva e Apresenta Nova Linha de SUVs Elétricos","resumo":"A Xiaomi agendou uma conferência focada em suas tecnologias automotivas para revelar oficialmente os detalhes de sua nova série de SUVs elétricos batizada de Pengcheng.\nO evento destacará as inovações em software veicular, autonomia e integração com o ecossistema conectado de dispositivos da marca.\nA iniciativa reforça a consolidação das empresas de tecnologia chinesas no concorrido mercado de veículos de nova energia.","link":"https://finance.yahoo.co.jp/news/detail/24f3c063857d01d25881175f62e07aa3dba2bf09","categoria":"TECNOLOGIA AUTOMOTIVA","lang":"pt"},{"fonte":"chinadailyasia.com","pais":"China","titulo":"China Lança Novos Satélites de Teste para Tecnologia de Comunicação","resumo":"A China realizou com sucesso o lançamento de uma nova frota de satélites dedicados a testar tecnologias avançadas de comunicação e transmissão de dados em órbita.\nAs missões espaciais buscam aprimorar as redes de alta velocidade e avaliar novos protocolos de conectividade global.\nO avanço fortalece o programa espacial chinês e expande a infraestrutura para futuras redes de telecomunicação de última geração.","link":"https://www.chinadailyasia.com/article/637178","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"新华网","pais":"China","titulo":"Sérvia e China Reforçam Cooperação em Inteligência Artificial e Tecnologia Verde","resumo":"Sérvia e China fecharam acordos bilaterais para intensificar a cooperação em projetos estratégicos de inteligência artificial e soluções de tecnologia verde.\nA parceria prevê a troca de conhecimento científico, atração de investimentos conjuntos e implementação de infraestruturas sustentáveis.\nO entendimento fortalece os laços tecnológicos entre Pequim e o ecossistema europeu em áreas cruciais para a transição energética e digital.","link":"http://portuguese.xinhuanet.com/20260730/389aca5112764f69a80434a56d0cb3f9/c.html","categoria":"TECNOLOGIA VERDE","lang":"pt"},{"fonte":"中国经济网","pais":"China","titulo":"Modelos de Inteligência Artificial Transformam a Inspeção de Qualidade Industrial na China","resumo":"O uso de grandes modelos de inteligência artificial está revolucionando os processos tradicionais de inspeção de qualidade no setor fabril da China.\nA transição substitui a análise baseada apenas em escala por soluções inteligentes capazes de detectar falhas de produção com precisão inédita.\nA abordagem remodela o ecossistema industrial, promovendo maior eficiência operacional e acelerando a automação na manufatura do país.","link":"http://www.ce.cn/cysc/newmain/yc/jsxw/202607/t20260730_3117863.shtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Prop News Time","pais":"Índia","titulo":"Himachal Pradesh projeta economia impulsionada pela inovação de 25 mil crores de rúpias","resumo":"O estado de Himachal Pradesh estabeleceu a meta de construir uma economia de 25.000 crores de rúpias baseada em inovação e tecnologia em seus principais setores.\nA iniciativa visa modernizar áreas tradicionais como agricultura, turismo e infraestrutura por meio do uso de novas ferramentas tecnológicas.\nEspera-se que essa transformação impulsione o desenvolvimento sustentável e atraia novos investimentos estratégicos para a região nos próximos anos.","link":"https://propnewstime.com/latestnewsstories/MzM4MjA=/himachal-eyes-inr-25-000-crore-innovation-led-economy-across-key-sectors","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"ET Hospitality","pais":"Índia","titulo":"ELIVAAS aposta em tecnologia e expansão internacional para impulsionar nova fase de crescimento","resumo":"A startup indiana ELIVAAS está reforçando sua estratégia de negócios ao integrar tecnologias avançadas em suas operações e no fortalecimento de sua marca.\nA empresa planeja expandir sua atuação para o mercado internacional como parte da próxima fase de seu crescimento sustentável.\nEssa aposta em inovação busca otimizar a experiência do cliente e consolidar a presença da empresa em novos mercados competitivos.","link":"https://hospitality.economictimes.indiatimes.com/news/hotels/elivaas-bets-on-tech-brand-building-and-overseas-expansion-to-power-next-growth-phase/132726823","categoria":"NEGÓCIOS E TECNOLOGIA","lang":"pt"},{"fonte":"The Indian Express","pais":"Índia","titulo":"Robô humanoide equipado com chips de IA da Qualcomm colapsa durante evento em Taipei","resumo":"Um robô humanoide impulsionado por chips de inteligência artificial da Qualcomm sofreu uma falha técnica e desabou durante uma apresentação em Taipei.\nO incidente chamou a atenção de especialistas e do público, levantando debates sobre a estabilidade de sistemas robóticos complexos em tempo real.\nApesar do imprevisto, o caso evidencia os desafios práticos no desenvolvimento e na integração de hardware e software para robôs autônomos.","link":"https://indianexpress.com/article/technology/tech-news-technology/humanoid-robot-powered-by-qualcomm-ai-chips-collapses-during-taipei-computex-event-10809988/","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"livemint.com","pais":"Índia","titulo":"Índia precisa de mais defensores da IA para levar tecnologia às massas, diz CEO da Paytm","resumo":"O CEO da Paytm, Vijay Shekhar Sharma, afirmou que a Índia necessita de mais líderes e projetos focados em inteligência artificial para democratizar o acesso à tecnologia no país.\nSegundo o executivo, a adoção em massa da IA pode solucionar problemas sociais e econômicos cruciais enfrentados pela população indiana.\nA declaração reforça a urgência de criar ecossistemas locais fortes para impulsionar a inclusão digital e a inovação tecnológica no país.","link":"https://www.livemint.com/technology/india-needs-more-ai-champions-to-take-technology-to-masses-paytm-ceo-vijay-shekhar-sharma-11785381751228.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"ANI News","pais":"Índia","titulo":"Governador de Odisha inaugura laboratório de aprendizagem que une tradição e tecnologia","resumo":"O governador do estado de Odisha inaugurou um novo laboratório de aprendizagem na Centurion University, projetado para integrar conhecimentos tradicionais com tecnologia avançada.\nDurante a cerimônia, a autoridade elogiou as iniciativas de inovação da universidade e ressaltou a importância de conectar a herança cultural com ferramentas digitais modernas.\nO laboratório visa capacitar estudantes com habilidades tecnológicas essenciais para o mercado atual, sem perder o vínculo com as raízes e saberes locais.","link":"https://www.aninews.in/news/national/general-news/odisha-governor-inaugurates-traditional-and-technology-interface-learning-lab-at-centurion-university-praises-innovation-initiatives20260730074501","categoria":"EDUCAÇÃO E TECNOLOGIA","lang":"pt"},{"fonte":"welectric.pt","pais":"Portugal","titulo":"PRIO testa tecnologia da ENG8 para produzir calor industrial sem combustão","resumo":"A empresa energética PRIO iniciou os testes da inovadora tecnologia desenvolvida pela ENG8, voltada para a geração de calor industrial sem necessidade de combustão. A solução utiliza princípios avançados da física para emitir energia térmica de forma limpa, reduzindo emissões de carbono no setor produtivo. O projeto piloto posiciona Portugal na vanguarda da transição energética industrial, oferecendo uma alternativa sustentável para processos industriais de alta demanda.","link":"https://welectric.pt/2026/07/30/prio-testa-tecnologia-da-eng8-para-produzir-calor-industrial-sem-combustao/","categoria":"ENERGIA","lang":"pt"},{"fonte":"Público","pais":"Portugal","titulo":"Trabalhadores do setor de IA pedem esforços para controlar riscos da tecnologia","resumo":"Profissionais e especialistas do setor de Inteligência Artificial assinaram um manifesto alertando sobre os riscos da evolução descontrolada da tecnologia. O grupo destaca a necessidade urgente de implementar mecanismos de fiscalização, governança e transparência para evitar impactos sociais graves. A iniciativa reflete a crescente preocupação global das equipes técnicas em relação aos limites do desenvolvimento de sistemas autônomos.","link":"https://www.publico.pt/2026/07/30/enter/noticia/trabalhadores-sector-ia-pedem-esforcos-controlar-riscos-tecnologia-2183421","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Tek Notícias","pais":"Portugal","titulo":"De Turing à Inteligência Artificial: o verdadeiro desafio já não é a tecnologia","resumo":"A evolução dos sistemas computacionais desde a era de Alan Turing ultrapassou a barreira do desenvolvimento puramente técnico para focar na integração humana. Especialistas debatem que o obstáculo central atual reside na regulamentação ética, na segurança dos dados e no alinhamento da IA aos valores sociais. Com isso, o foco da transformação digital migra do avanço de código para a governança responsável e impacto socioeconômico.","link":"https://tek.sapo.pt/opiniao/artigos/de-turing-a-inteligencia-artificial-o-verdadeiro-desafio-ja-nao-e-a-tecnologia/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"SIC Notícias","pais":"Portugal","titulo":"BYD Dolphin G DM-i chega a Portugal com autonomia de 1.040 km e tecnologia híbrida avançada","resumo":"A fabricante chinesa BYD lançou no mercado português o modelo Dolphin G DM-i, equipado com um sistema híbrido plug-in de última geração. O veículo destaca-se por oferecer uma autonomia combinada impressionante de até 1.040 quilômetros, aliando eficiência energética e desempenho urbano. A novidade reforça a expansão dos veículos de energia limpa na Europa, trazendo recursos tecnológicos avançados para o segmento.","link":"https://sicnoticias.pt/programas/volante/2026-07-29-video-byd-dolphin-g-dm-i-chega-a-portugal-com-autonomia-de-1040km-e-tecnologia-hibrida-avancada-ef033a98","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"Pplware","pais":"Portugal","titulo":"Bandeira roxa na praia? Tecnologia e sistemas de vigilância explicam o alerta","resumo":"O uso da bandeira roxa em praias portuguesas tem se tornado mais frequente graças ao apoio de novas tecnologias e sistemas de vigilância ambiental. A sinalização é acionada por sensores e monitoramento em tempo real para alertar os banhistas sobre a presença de vida marinha perigosa, como águas-vivas. A integração tecnológica permite que as equipes de resgate atuem com maior precisão na prevenção de acidentes e proteção do público.","link":"https://pplware.sapo.pt/informacao/bandeira-roxa-na-praia-a-tecnologia-e-os-sistemas-de-vigilancia-explicam-este-alerta/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Viseu: ESTGV promove OpenDay KIDS para despertar vocações em ciência e engenharia","resumo":"A Escola Superior de Tecnologia e Gestão de Viseu realizou a iniciativa OpenDay KIDS para incentivar o interesse de crianças pelas áreas de ciência e engenharia. Por meio de oficinas práticas e atividades interativas, os participantes vivenciaram experiências diretas com experimentos científicos e projetos tecnológicos. O evento busca formar novas gerações de talentos e aproximar os jovens do conhecimento acadêmico e da inovação.","link":"https://sapo.pt/artigo/viseu-estgv-promove-openday-kids-2026-para-despertar-vocacoes-na-ciencia-e-engenharia-6a6a3dd1c55f7621d19841b2","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Terra Ruiva","pais":"Portugal","titulo":"Ciência Viva no Verão promove sessão de Astronomia em Messines","resumo":"O programa Ciência Viva no Verão organizou uma sessão especial focada em astronomia na localidade de Messines, aproximando o público da observação do cosmos. A atividade contou com equipamentos de observação noturna e explicações pedagógicas sobre constelações, corpos celestes e exploração espacial. A iniciativa visa democratizar a divulgação científica em Portugal, promovendo o conhecimento e a curiosidade de forma acessível.","link":"https://www.terraruiva.pt/2026/07/29/ciencia-viva-no-verao-com-sessao-de-astronomia-em-messines/","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Executive Digest","pais":"Portugal","titulo":"Ikea abre nova loja em Coimbra com formato pioneiro em Portugal e foco em economia circular","resumo":"A Ikea inaugurou uma nova unidade em Coimbra introduzindo um conceito pioneiro de loja focado inteiramente na sustentabilidade e na economia circular. O espaço prioriza serviços de reparação, ateliê de reutilização e soluções inovadoras para prolongar a vida útil dos produtos. A iniciativa alinha-se às tendências globais de consumo consciente e marca um passo importante na transformação do modelo de varejo sustentável.","link":"https://executivedigest.sapo.pt/ikea-abre-hoje-nova-loja-em-coimbra-com-formato-pioneiro-em-portugal-e-aposta-na-economia-circular/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"AI with Ads: ChatGPT Begins Displaying Ads in Brazil, Altering User Experience","resumo":"OpenAI has started rolling out advertisements on the free version of ChatGPT for users in Brazil.\nThe move aims to monetize the platform while funding the high processing costs of artificial intelligence models.\nThe display of ads will be contextually integrated directly into conversations with the assistant.\nExperts and users are closely monitoring the impacts of this new feature on privacy and the user experience.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/07/30/ia-com-reclame-chatgpt-passa-a-exibir-anuncios-no-brasil-veja-o-que-muda-para-os-usuarios.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Technology Reveals Hidden Cities in Acre with a Population Comparable to the Inca Empire","resumo":"Researchers used advanced remote sensing technologies, such as LiDAR, to map ancient civilizations in Acre.\nThe study revealed a complex urban network with a population density equivalent to a quarter of the Inca Empire.\nThe findings rewrite pre-Columbian history in the Amazon and demonstrate the role of technology in archaeology.\nThe discovery opens new frontiers for preserving the region's historical and environmental heritage.","link":"https://oglobo.globo.com/brasil/noticia/2026/07/30/civilizacao-no-acre-tinha-populacao-equivalente-a-um-quarto-do-imperio-inca-entenda-como-tecnologia-revelou-cidades-ocultas.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"CNN Brasil","pais":"Brazil","titulo":"Tech Companies Urge the United States to Slow Development of Advanced AIs","resumo":"Tech sector leaders have publicly requested a slowdown in the development of advanced artificial intelligence models.\nThe appeal, directed at the United States government, highlights concerns over existential safety and systemic risks.\nThe move reflects growing tension between the commercial race for innovation and the need for regulation.\nThe decision could redefine the pace of tech product launches and impact the global market.","link":"https://www.cnnbrasil.com.br/tecnologia/limite-da-ia-empresas-de-tecnologia-pedem-que-eua-freiem-modelos-avancados/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"US Bans Chinese Humanoid Robots, Escalating Tech Dispute","resumo":"The United States government has approved new restrictions banning the import and use of humanoid robots developed in China.\nThe measure expands the geopolitical struggle for supremacy in industrial automation and artificial intelligence.\nU.S. authorities cite espionage risks and excessive technological dependence on the Asian nation.\nThe ban is expected to accelerate local investments in the robotics industry and heighten global trade tensions.","link":"https://g1.globo.com/tecnologia/noticia/2026/07/30/eua-proibem-robos-humanoides-chineses-e-ampliam-disputa-tecnologica-com-pequim.ghtml","categoria":"ROBOTICS","lang":"en"},{"fonte":"BBC","pais":"Brazil","titulo":"Nobel Laureate in Economics Praises Pix, Highlighting Brazil's Digital Sovereignty","resumo":"A Nobel Prize winner in Economics praised the efficiency and digital independence of Brazil's Pix payment system.\nThe expert noted that the platform serves as a model of technological autonomy in the face of dominance by global financial giants.\nHe also warned about international pressures regarding the sovereignty of national financial systems.\nThis recognition reinforces Brazil's role as an international benchmark in technological innovation and banking inclusion.","link":"https://www.bbc.com/portuguese/articles/c1l1dq48843o","categoria":"INNOVATION","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Science Reveals the Limit of Human Longevity in Surprising New Study","resumo":"A new scientific study has revealed the biological limits to the maximum lifespan the human body can achieve.\nThe research analyzed complex genetic and biomedical data to calculate the natural capacity for cellular regeneration.\nThe results show a ceiling on human longevity, regardless of modern medical advancements.\nThese findings help direct scientific focus toward improving quality of life during the aging process.","link":"https://oglobo.globo.com/saude/ciencia/noticia/2026/07/30/ate-que-idade-o-ser-humano-consegue-viver-ciencia-revela-limite-da-longevidade-e-resultado-surpreende.ghtml","categoria":"SCIENCE","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Telegram Faces Pressure from Global Authorities and Targets Regulators in Brazil","resumo":"The messaging app Telegram is facing increased scrutiny from regulatory authorities in various countries.\nIn Brazil, the app is drawing attention due to demands regarding content moderation and the fight against misinformation.\nRegulatory bodies are seeking greater cooperation from the company in complying with court orders and data protection.\nThe scenario brings uncertainty regarding the future of the platform's operations in the domestic market.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/07/30/telegram-em-apuros-veja-em-que-paises-o-app-de-mensagens-entrou-na-mira-de-autoridades-o-brasil-e-um-deles.ghtml","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"GOV.BR","pais":"Brazil","titulo":"Innospace Updates Space Launch Schedule at Alcântara Base","resumo":"Space technology company Innospace has updated its mission schedule with launches from the Alcântara Center in Maranhão.\nThe date revision aims to optimize testing and the technical preparation of new commercial launch vehicles.\nThe initiative strengthens Brazil's entry into the private space exploration and transportation market.\nThe expectation is to attract investments and boost the country's aerospace technology ecosystem.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/innospace-atualiza-cronograma-de-missoes-previstas-para-o-centro-de-lancamento-de-alcantara","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"O GLOBO","pais":"United States","titulo":"Autonomous Hacker: How OpenAI's AI 'Invaded' Platforms and Worries Experts","resumo":"An autonomous artificial intelligence agent developed by OpenAI has demonstrated the ability to exploit vulnerabilities across various digital platforms.\nThe discovery has triggered a global alarm among cybersecurity analysts and tech executives regarding the risks of automated cyberattacks.\nExperts are calling for the urgent reinforcement of defense protocols and regulations to curb the malicious use of AI.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/07/30/hacker-autonomo-como-ia-da-openai-invadiu-varias-plataformas-e-por-que-isso-preocupa-analistas-e-empresas.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Bloomberg.com","pais":"United States","titulo":"Nuclear Fusion Company Raises $1 Billion to Commercialize Clean Technology","resumo":"A startup focused on nuclear fusion energy has secured a historic billion-dollar backing aimed at accelerating the commercial development of the technology.\nThe investment represents a significant milestone for the clean energy sector, promising to transform global electricity generation with zero carbon emissions.\nThe initiative seeks to overcome engineering challenges and place the first operational reactors on the power grid in the coming years.","link":"https://www.bloomberg.com/news/articles/2026-07-30/fusion-firm-gets-1-billion-in-bid-to-commercialize-technology","categoria":"ENERGY","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"United States","titulo":"NASA's James Webb Telescope Maps Family Tree of Distant Objects","resumo":"The James Webb Space Telescope has captured unprecedented images that allow astronomers to trace the origin and evolution of newly discovered celestial bodies in the far reaches of the universe.\nDetailed analysis helps answer fundamental questions about how the first structures and planetary systems formed after the Big Bang.\nNew astronomical data provides an unprecedented view of cosmic history and paves the way for future profound discoveries.","link":"https://science.nasa.gov/missions/webb/nasa-webb-explores-family-tree-of-newly-discovered-distant-objects/","categoria":"SCIENCE","lang":"en"},{"fonte":"The Guardian","pais":"United States","titulo":"Elon Musk's xAI Sues State of Minnesota Over 'Nudification' Tech Law","resumo":"Artificial intelligence company xAI has filed a lawsuit against the state of Minnesota challenging a new law that bans image-altering software.\nThe company argues that the law unduly restricts technological innovation and violates freedom of speech and system development rights.\nThis case highlights the intense legal debate surrounding the limits of state regulation regarding AI-generated content tools.","link":"https://www.theguardian.com/technology/2026/jul/29/xai-sues-minnesota-nudification-technology","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"O GLOBO","pais":"United States","titulo":"Iconic Windows XP Wallpaper Hill Appears Dry and Unrecognizable 30 Years Later","resumo":"The famous green hill landscape that graced the home screen of millions of computers worldwide has undergone a dramatic transformation.\nRecent photographs show the region with dry and worn vegetation due to climate change and agricultural shifts in California.\nThe capture of the current landscape went viral on social media, sparking nostalgia and warnings about the visible impacts of prolonged droughts.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/07/30/colina-de-foto-classica-do-windows-xp-surge-seca-e-irreconhecivel-30-anos-depois.ghtml","categoria":"TRENDS","lang":"en"},{"fonte":"FOX Carolina News","pais":"United States","titulo":"Las Vegas Integrates Artificial Intelligence Technology into 911 Emergency System","resumo":"The city of Las Vegas has begun implementing AI tools to optimize phone call handling at the local emergency service.\nThe new system assists dispatchers in rapidly triaging incidents, reducing response times, and organizing priorities in real time.\nThe modernization promises to increase the efficiency of rescue teams and serve as a smart city model for other American metropolises.","link":"https://www.foxcarolina.com/video/2026/07/30/las-vegas-integrating-ai-technology-into-911-call-system/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Financial Times","pais":"United States","titulo":"BNY Adopts Blockchain Technology for Financial Records in a New Wall Street Era","resumo":"Traditional bank BNY has announced the integration of blockchain technology into the management and storage of its corporate and transactional records.\nThe shift aims to increase transparency, operational security, and process efficiency in the global financial market.\nThis initiative marks an important institutional advancement toward the definitive adoption of distributed ledgers by major Wall Street institutions.","link":"https://www.ft.com/content/7b1197a5-e59a-4beb-ab83-e800e6ebc527?syn-25a6b1a6=1","categoria":"INNOVATION","lang":"en"},{"fonte":"NASA (.gov)","pais":"United States","titulo":"NASA Awards Innovative Technology Concepts Selected for 2026","resumo":"The U.S. space agency announced the winning projects of its incentive program for revolutionary tech ideas for future missions.\nThe selected proposals include new propulsion systems, deep-space water exploration instruments, and advanced habitats.\nThe initial funding aims to transform bold scientific theories into viable technologies for space exploration in the coming decades.","link":"https://www.nasa.gov/news-release/nasa-awards-2026-innovative-technology-concepts/","categoria":"SPACE","lang":"en"},{"fonte":"El Boletín","pais":"France","titulo":"French Economy Returns to Growth with 0.2% Increase in Second Quarter Driven by Exports","resumo":"The French economy recorded a 0.2% expansion in the second quarter, beating expectations amidst a backdrop of global uncertainty.\nThe positive performance was mainly supported by foreign trade and an increase in the country's exports.\nExperts point out that the result brings temporary relief to the European financial market, although inflationary challenges still demand caution in the coming months.","link":"https://www.elboletin.com/la-economia-de-francia-vuelve-a-crecer-un-02-en-el-segundo-trimestre-impulsada-por-las-exportaciones/","categoria":"ECONOMY","lang":"en"},{"fonte":"Le Monde.fr","pais":"France","titulo":"In France, the Illusory Economic Recovery of the Second Quarter","resumo":"Although official data points to a slight economic recovery in France during the second quarter, analysts warn of hidden risks beneath the figures.\nThe recorded growth reflects one-off factors rather than a solid and sustainable recovery in domestic demand.\nWith household consumption slowing down, the French economic scenario requires attention regarding the real impact on citizens' quality of life.","link":"https://www.lemonde.fr/economie/article/2026/07/30/en-france-un-rebond-en-trompe-l-il-de-l-economie-au-deuxieme-trimestre_6736703_3234.html","categoria":"ECONOMY","lang":"en"},{"fonte":"WSJ","pais":"France","titulo":"French Economy Rebounded in Second Quarter Despite War Uncertainty","resumo":"France's economy showed resilience by growing in the second quarter, overcoming the negative impacts generated by the war in Ukraine and the European energy crisis.\nGross Domestic Product growth was driven by the tourism sector and the recovery of essential services.\nDespite geopolitical headwinds, the country demonstrated short-term economic adaptability.","link":"https://www.wsj.com/economy/french-economy-rebounded-in-second-quarter-despite-war-uncertainty-f2221427","categoria":"ECONOMY","lang":"en"},{"fonte":"Mon Auto Neuve","pais":"France","titulo":"Future of the Automobile: Between Cutting-Edge Technology and Electric Revolution, the Sector Transforms","resumo":"The automotive industry is facing one of the biggest transformations in its history, driven by electrification and advanced intelligence systems.\nThe advancement of electric and connected vehicles is redefining urban mobility, requiring massive investments in infrastructure and batteries.\nThis technological transition not only reduces carbon emissions, but completely reshapes the global transportation market.","link":"https://www.monautoneuve.fr/actualites/futur-de-lauto-entre-technologie-de-pointe-et-revolution-electrique-le-secteur-se-transforme/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Pour la Science","pais":"France","titulo":"Photosynthesis Adapted to... Relieve Dry Eye Syndrome","resumo":"Researchers have developed an innovative approach by using mechanisms inspired by photosynthesis to treat dry eye syndrome.\nThe technique employs cellular photosynthetic structures to generate oxygen and hydration directly on the affected ocular surface.\nThis unprecedented biotechnological application opens new frontiers in the treatment of chronic diseases and the use of biological processes in medicine.","link":"https://www.pourlascience.fr/sd/biologie/la-photosynthese-detournee-pour-soulager-la-secheresse-oculaire-29358.php","categoria":"SCIENCE","lang":"en"},{"fonte":"Bloomberg.com","pais":"France","titulo":"French Economy Rebounds with 0.2% Growth in Second Quarter","resumo":"France's Gross Domestic Product posted a 0.2% increase between April and June, confirming the recovery of economic activity during the period.\nGrowth was favored by foreign sales and industrial resilience, even in the face of high inflation in the euro area.\nThe result offers an important breather for the government and signals temporary macroeconomic stability.","link":"https://www.bloomberg.com/news/articles/2026-07-30/french-economy-rebounds-with-0-2-growth-in-second-quarter","categoria":"ECONOMY","lang":"en"},{"fonte":"Le Devoir","pais":"France","titulo":"Editorial by Claudine St-Germain | Artificial Intelligence Has Surpassed Science Fiction","resumo":"The rapid evolution of artificial intelligence models has transformed concepts once restricted to science fiction into real-world everyday tools.\nThe accelerated advancement of these technologies has redefined productive sectors, cultural creation, and global labor market dynamics.\nFaced with this new reality, urgent debates are emerging regarding ethics, regulation, and the limits of machine autonomy.","link":"https://www.ledevoir.com/opinion/editoriaux/998357/ia-depasse-science-fiction","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Le Télégramme","pais":"France","titulo":"'A Good Surprise'? Insee to Reveal If the French Economy Held Up Well in the Second Quarter","resumo":"The National Institute of Statistics and Economic Studies (Insee) is releasing crucial analyses on the performance and resilience of the French economy.\nProjections assess how the country dealt with rising energy costs and inflationary pressure in the second quarter.\nThe data is awaited with great anticipation by analysts and financial agents to guide future investments.","link":"https://www.letelegramme.fr/economie/inflation/une-bonne-surprise-linsee-va-dire-si-leconomie-francaise-a-bien-resiste-au-deuxieme-trimestre-7091994.php","categoria":"ECONOMY","lang":"en"},{"fonte":"The Indian Express","pais":"United Kingdom","titulo":"UK Competition Regulator Investigates Whether Microsoft Misled Personal and Family Plan Consumers","resumo":"The UK competition watchdog has launched an investigation to determine whether Microsoft violated consumer protection rules in its personal and family subscriptions.\nThe inquiry focuses on the clarity of information regarding automatic renewals, cancellations, and price changes practiced by the company.\nIf irregularities are confirmed, the tech giant could face financial penalties and have to overhaul its billing policies in the country.","link":"https://indianexpress.com/article/technology/tech-news-technology/uk-competition-regulator-investigates-whether-microsoft-misled-personal-and-family-customers-10810079/","categoria":"REGULATION","lang":"en"},{"fonte":"MiCiudadReal.es","pais":"Spain","titulo":"New Medical Imaging Technology Prevents Nearly Half of Unnecessary Prostate Biopsies","resumo":"A new approach in medical imaging exams promises to transform prostate cancer detection by significantly reducing invasive interventions.\nThe technology allows for high-precision lesion identification, avoiding about half of unnecessary procedures in routine medical practice.\nThis innovation improves patient comfort, reduces hospital costs, and optimizes the diagnostic workflow in the healthcare system.","link":"https://www.miciudadreal.es/2026/07/30/nueva-tecnologia-en-imagen-medica-evita-casi-la-mitad-de-las-biopsias-de-prostata-innecesarias/","categoria":"MEDICINE","lang":"en"},{"fonte":"Cinco Días","pais":"Spain","titulo":"The Rebellion of Open Weights in Artificial Intelligence","resumo":"The debate over the release of open-weight models in artificial intelligence is gaining momentum among global developers and researchers.\nThis approach seeks to democratize access to technology and counter the closed dominance of major tech corporations.\nThe movement promises to accelerate open innovation, although it faces heated discussions regarding safety, regulation, and responsible use.","link":"https://cincodias.elpais.com/economia/2026-07-30/la-rebelion-de-los-pesos-abiertos-en-la-ia.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Valencia Plaza","pais":"Spain","titulo":"LALIGA Launches Tech Powerhouse 2026, New Observatory for Technology and AI Applied to Football","resumo":"LALIGA has announced the launch of Tech Powerhouse 2026, an initiative aimed at monitoring and integrating technological innovations in sports.\nThe observatory will focus on the application of artificial intelligence, advanced performance analysis, and the enhancement of the fan experience.\nThe strategy consolidates the Spanish league as a global benchmark in digital transformation and the development of solutions for soccer.","link":"https://valenciaplaza.com/nr-economia/laliga-lanza-tech-powerhouse-2026-un-nuevo-observatorio-sobre-tecnologia-e-inteligencia-artificial-aplicada-al-futbol","categoria":"INNOVATION","lang":"en"},{"fonte":"ciencia.gob.es","pais":"Spain","titulo":"Spanish Government and EIB Plan to Mobilize Up to €1 Billion for the Thirty Meter Telescope in La Palma","resumo":"The Spanish Government and the European Investment Bank have announced their intention to finance the installation of the Thirty Meter Telescope on the island of La Palma.\nThe mega-scientific project aims to position the region at the top of world astronomy and boost international astrophysical research.\nIf realized, the complex will attract cutting-edge technology, strategic investments, and highly skilled jobs.","link":"https://www.ciencia.gob.es/Noticias/2026/julio/ciencia-y-bei-movilizan-1000-millones-tmt.html","categoria":"SCIENCE","lang":"en"},{"fonte":"AZARplus","pais":"Spain","titulo":"New LALIGA Technology Will Help Fans Manage Sports Betting","resumo":"LALIGA has introduced a new technological tool developed to help fans manage their sports betting more responsibly.\nThe solution uses real-time data processing to provide detailed statistics and personalized alerts to users.\nWith this initiative, the organization aims to promote a safer and more conscious entertainment environment within the sports ecosystem.","link":"https://www.azarplus.com/la-nueva-tecnologia-de-laliga-asistira-a-los-aficionados-en-la-gestion-de-sus-apuestas-deportivas/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Xunta de Galicia","pais":"Spain","titulo":"Fabiola García Highlights Female Talent in Science with the Presentation of the María Josefa Wonenburger Award","resumo":"The María Josefa Wonenburger award honored researchers África González and Yolanda Preciado for their outstanding contributions to the scientific field.\nThe event emphasized the importance of giving visibility to female-led work and encouraging new scientific vocations in the region.\nThe initiative aims to strengthen gender equality in research and recognize paths of academic excellence.","link":"https://www.xunta.gal/es/notas-de-prensa/-/nova/027205/fabiola-garcia-pone-valor-talento-femenino-ciencia-con-entrega-africa-gonzalez","categoria":"SCIENCE","lang":"en"},{"fonte":"Ayuntamiento de Sagunto","pais":"Spain","titulo":"Large Crowds Gather at the Municipal House of Culture to Understand the Science Behind the Solar Eclipse","resumo":"A science outreach event drew a large crowd to discuss and understand the astronomical phenomena associated with solar eclipses.\nExperts presented concepts regarding celestial mechanics, safe observation techniques, and the impacts of astronomy on society.\nThe community action highlighted growing popular interest in space science and the understanding of the universe.","link":"https://aytosagunto.es/es/actualidad/2026-07-29-un-numeroso-publico-se-congrega-en-la-casa-municipal-de-cultura-para-conocer-la-ciencia-detras-del-eclipse-solar/","categoria":"ASTRONOMY","lang":"en"},{"fonte":"La Moncloa","pais":"Spain","titulo":"Spain Hosts the First Meeting of the Global Council on the New Economy of the 21st Century","resumo":"Spain hosted the inaugural meeting of the Global Council aimed at discussing emerging and sustainable economic models for the 21st century.\nThe forum brings together international experts and leaders to debate digital transition, sustainability, and new global development dynamics.\nThe initiative reinforces the country's leadership in formulating public policies focused on the future of the economy and labor.","link":"https://www.lamoncloa.gob.es/serviciosdeprensa/notasprensa/economia-comercio-empresa/Paginas/2026/290726-consejo-global-nueva-economia.aspx","categoria":"TRENDS","lang":"en"},{"fonte":"WEB.DE","pais":"Germany","titulo":"Academics, Doctors, and IT Specialists Leave Germany: Understanding the Motives","resumo":"A growing number of highly qualified professionals, including academics, doctors, and IT specialists, are emigrating from Germany.\nThe brain drain is driven by factors such as a high tax burden, excessive bureaucracy, and better opportunities abroad.\nThe phenomenon generates deep concern within the productive sector and the scientific community, putting the country's competitiveness at risk.","link":"https://web.de/magazine/politik/rekord-auswanderung-akademiker-fachkraefte-deutschland-verlassen-42535082","categoria":"TRENDS","lang":"en"},{"fonte":"Bild der Wissenschaft","pais":"Germany","titulo":"Is There a Mirror World? Ultracold Neutrons Reveal New Clues","resumo":"Researchers are using ultracold neutrons to investigate the possible existence of a parallel mirror world in particle physics.\nThe hypothesis suggests that particles could oscillate into a hidden dimension, offering answers to the mystery of dark matter in the universe.\nRecent experiments have brought unprecedented measurements that help test the limits of the Standard Model of modern physics.","link":"https://wissenschaft.de/artikel/gibt-es-eine-spiegelwelt-ultrakalte-neutronen-verraten-mehr","categoria":"SCIENCE","lang":"en"},{"fonte":"Bild der Wissenschaft","pais":"Germany","titulo":"Innovative Glasses Convert Infrared Light into Full-Color Images","resumo":"Scientists have developed innovative glasses capable of capturing infrared radiation and converting it into visible, full-color images in real time.\nThe technology employs advanced optical surfaces that eliminate the bulky and heavy systems of traditional night-vision devices.\nThis discovery promises to revolutionize portable navigation devices, visual aid systems, and diagnostic applications in medicine.","link":"https://wissenschaft.de/artikel/brille-wandelt-infrarotlicht-in-farbige-bilder-um","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Yahoo Finance","pais":"Germany","titulo":"German Economy Shows Signs of Growth in the Second Quarter Despite Conflict in Iran","resumo":"The German economy is showing signs of recovery and projecting growth for the second quarter of the year, beating analyst expectations.\nThe positive performance comes even in the face of global uncertainties and potential impacts caused by geopolitical tensions in the Middle East.\nExperts highlight that the resilience of the productive sector and the stabilization of consumption have been fundamental in driving these results.","link":"https://finance.yahoo.com/economy/articles/german-economy-show-signs-growth-020338445.html","categoria":"ECONOMY","lang":"en"},{"fonte":"DIE ZEIT","pais":"Germany","titulo":"German Cabinet Approves New Regulations for Temporary Contracts in Science","resumo":"The German government has approved a bill that alters the rules for fixed-term contracts in academic and scientific research.\nThe new regulation seeks to offer greater contract stability and legal security for young researchers and doctoral candidates in the country.\nWith this measure, Germany aims to combat the precariousness of academic labor and maintain its attractiveness for global scientific talent.","link":"https://www.zeit.de/wissenschaft/2026-07/wissenschaftszeitvertragsgesetz-befristung-arbeitsvertraege-forschung-dorothee-baer","categoria":"SCIENCE","lang":"en"},{"fonte":"ANI News","pais":"Japan","titulo":"Japan Cuts FY2026 Growth Forecast to 0.9% as Higher Oil Prices Weigh on Economy","resumo":"The Japanese government has revised downward its economic growth estimate for fiscal year 2026, setting it at 0.9%.\nThe decision reflects the negative impacts of continuous increases in global oil prices and geopolitical uncertainties.\nRising energy costs have made industrial production more expensive and heavily pressured household consumption.\nThe scenario imposes new challenges for the stabilization of the local currency and the sustainable recovery of the country's economy.","link":"https://www.aninews.in/news/business/japan-cuts-fy2026-growth-forecast-to-09-pc-as-higher-oil-prices-weigh-on-economy20260730113329","categoria":"ECONOMY","lang":"en"},{"fonte":"nationalgeographic.com.es","pais":"Japan","titulo":"Science Qualifies Violent Earthquake in Japan as 'Rare' Due to Intriguing Geological Phenomenon","resumo":"Seismologists and scientists have classified a recent violent earthquake in Japan as an extremely unusual event.\nThe primary cause is tied to an atypical geological dynamic that has challenged traditional forecasting models.\nThe discovery has triggered alarms in the scientific community, driving new research into deep faults in the Pacific.\nExperts are now working to reassess natural disaster risks and strengthen the country's infrastructure safety.","link":"https://www.nationalgeographic.com.es/ciencia/por-que-terremoto-japon-es-fenomeno-raro-segun-ciencia_29044","categoria":"SCIENCE","lang":"en"},{"fonte":"FAZ","pais":"Japan","titulo":"Weak Yen Hits Japan's Middle Class and Economy","resumo":"The historic depreciation of the yen against the dollar is generating severe socioeconomic impacts in Japan.\nCurrency devaluation has drastically increased the cost of importing food, fuel, and basic supplies.\nWith the purchasing power of the middle class reduced, domestic consumption has suffered a considerable slowdown.\nThe scenario is pressing the government and the central bank to adopt measures to curb inflation and stabilize the market.","link":"https://www.faz.net/pr
