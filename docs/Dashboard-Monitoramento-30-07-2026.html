emium/weltwirtschaft/finanzwelt/schwacher-yen-trifft-japans-mittelschicht-und-wirtschaft-accg-201074860.html","categoria":"ECONOMY","lang":"en"},{"fonte":"ロイター","pais":"Japan","titulo":"Intel to Make Processor Technology Available to Startups","resumo":"Intel has announced a strategic initiative to provide startups with access to its processor technology.\nThe program seeks to accelerate innovation in the semiconductor sector, enabling the creation of custom chips.\nWith this move, the manufacturer intends to strengthen its ecosystem and drive new business in advanced technology.\nThe partnership promises to expand the presence of proprietary architectures in emerging intelligence and computing solutions.","link":"https://jp.reuters.com/economy/CZDANJPY6JLZRGPCNDX4NNYIXQ-2026-07-30/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"NVIDIA | Japan Blog","pais":"Japan","titulo":"NVIDIA and KAIST Open Joint Research Lab to Accelerate AI Innovation","resumo":"NVIDIA has partnered with KAIST to open a joint laboratory focused on Artificial Intelligence.\nThe research center aims to develop cutting-edge algorithms and train researchers in the high-tech sector.\nThe initiative intends to accelerate technological innovation in the region and expand supercomputing infrastructure.\nThe project solidifies NVIDIA's position as a global leader in the expansion of ecosystems dedicated to the advancement of AI.","link":"https://blogs.nvidia.co.jp/blog/nvidia-and-kaist-launch-joint-ai-research-lab-to-accelerate-ai-innovation-in-korea/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"tsinghua.edu.cn","pais":"China","titulo":"Tsinghua Team Accelerates Real-World Integration of Brain-Computer Interface Technology","resumo":"Following three decades of intensive research, a team of scientists at Tsinghua University has achieved crucial breakthroughs in brain-computer interface technology.\nThe development seeks to directly connect the nervous system to external devices, accelerating the transition from laboratory research to practical applications.\nThe innovation promises to transform the treatment of paralysis and neurological disorders, marking a historic step for Chinese neurotechnology.","link":"https://www.tsinghua.edu.cn/info/3245/127172.htm","categoria":"NEUROTECHNOLOGY","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"Hongqi Achieves Significant Technological Breakthrough with Ultra-Fast Charging Battery","resumo":"Chinese manufacturer Hongqi has announced a standout innovation in the electric vehicle sector by registering an ultra-fast charging time of just 3 minutes and 41 seconds.\nThe technological advancement focuses on improving battery efficiency and thermal management to enable recharging in record time.\nThis achievement drastically reduces waiting times at charging stations and reinforces the country's leadership in the transition to electric mobility.","link":"http://www.jl.xinhuanet.com/20260730/0d043602c81d4e0ea228ea0b64029c8a/c.html","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"PZ-news","pais":"China","titulo":"China Challenges the US in the Race for Humanoid Robot Advancement","resumo":"The technological competition between Beijing and Washington has entered a new chapter focused on the production and development of next-generation humanoid robots.\nChina has been intensifying investments in the industrial and care robotics sectors to secure supply autonomy and market leadership.\nThe move amplifies commercial and strategic tensions with the United States, which is also seeking to consolidate dominance over this emerging technology.","link":"https://www.pz-news.de/wirtschaft/wirtschaft-weltweit_artikel,-China-droht-USA-im-Streit-um-humanoide-Roboter-_arid,2362252.html","categoria":"ROBOTICS","lang":"en"},{"fonte":"Bloomberg.com","pais":"China","titulo":"AI-Focused Cities Lead Technological Growth in China","resumo":"Chinese cities centered around the artificial intelligence ecosystem are recording an accelerated pace of expansion and investment compared to other economic sectors.\nThese tech hubs are attracting startups, research centers, and a large volume of capital aimed at developing advanced hardware and algorithms.\nThis phenomenon highlights the national strategy of prioritizing AI innovation as the main engine of transformation and growth for the coming years.","link":"https://www.bloomberg.com/news/articles/2026-07-30/china-s-ai-boomtowns-race-ahead-as-rest-of-economy-falls-behind","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Yahoo!ファイナンス","pais":"China","titulo":"Xiaomi Announces Automotive Technology Event and Unveils New Electric SUV Line","resumo":"Xiaomi has scheduled a conference focused on its automotive technologies to officially reveal the details of its new series of electric SUVs named Pengcheng.\nThe event will highlight innovations in vehicular software, autonomy, and integration with the brand's connected device ecosystem.\nThe initiative reinforces the consolidation of Chinese technology companies in the competitive new-energy vehicle market.","link":"https://finance.yahoo.co.jp/news/detail/24f3c063857d01d25881175f62e07aa3dba2bf09","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"chinadailyasia.com","pais":"China","titulo":"China Launches New Test Satellites for Communication Technology","resumo":"China has successfully launched a new fleet of satellites dedicated to testing advanced communication and data transmission technologies in orbit.\nThese space missions aim to improve high-speed networks and evaluate new global connectivity protocols.\nThe advancement strengthens the Chinese space program and expands the infrastructure for future next-generation telecommunication networks.","link":"https://www.chinadailyasia.com/article/637178","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"Serbia and China Strengthen Cooperation in Artificial Intelligence and Green Technology","resumo":"Serbia and China have signed bilateral agreements to intensify cooperation in strategic artificial intelligence projects and green technology solutions.\nThe partnership provides for the exchange of scientific knowledge, the attraction of joint investments, and the implementation of sustainable infrastructures.\nThe understanding strengthens technological ties between Beijing and the European ecosystem in areas crucial for the energy and digital transition.","link":"http://portuguese.xinhuanet.com/20260730/389aca5112764f69a80434a56d0cb3f9/c.html","categoria":"GREEN TECHNOLOGY","lang":"en"},{"fonte":"中国经济网","pais":"China","titulo":"Artificial Intelligence Models Transform Industrial Quality Inspection in China","resumo":"The use of large artificial intelligence models is revolutionizing traditional quality inspection processes in China's manufacturing sector.\nThe transition replaces analysis based solely on scale with intelligent solutions capable of detecting production flaws with unprecedented precision.\nThe approach is reshaping the industrial ecosystem, promoting greater operational efficiency, and accelerating automation in the country's manufacturing.","link":"http://www.ce.cn/cysc/newmain/yc/jsxw/202607/t20260730_3117863.shtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Prop News Time","pais":"India","titulo":"Himachal Pradesh Projects 25,000 Crore Rupee Innovation-Driven Economy","resumo":"The state of Himachal Pradesh has set a target to build a 25,000-crore-rupee economy driven by innovation and technology across its key sectors.\nThe initiative aims to modernize traditional areas such as agriculture, tourism, and infrastructure through the use of new technological tools.\nThis transformation is expected to drive sustainable development and attract new strategic investments to the region in the coming years.","link":"https://propnewstime.com/latestnewsstories/MzM4MjA=/himachal-eyes-inr-25-000-crore-innovation-led-economy-across-key-sectors","categoria":"INNOVATION","lang":"en"},{"fonte":"ET Hospitality","pais":"India","titulo":"ELIVAAS Bets on Technology and Overseas Expansion to Power Next Growth Phase","resumo":"Indian startup ELIVAAS is reinforcing its business strategy by integrating advanced technologies into its operations and strengthening its brand.\nThe company plans to expand its operations into the international market as part of the next phase of its sustainable growth.\nThis bet on innovation seeks to optimize the customer experience and consolidate the company's presence in new competitive markets.","link":"https://hospitality.economictimes.indiatimes.com/news/hotels/elivaas-bets-on-tech-brand-building-and-overseas-expansion-to-power-next-growth-phase/132726823","categoria":"BUSINESS AND TECHNOLOGY","lang":"en"},{"fonte":"The Indian Express","pais":"India","titulo":"Humanoid Robot Powered by Qualcomm AI Chips Collapses During Event in Taipei","resumo":"A humanoid robot powered by Qualcomm artificial intelligence chips suffered a technical glitch and collapsed during a presentation in Taipei.\nThe incident caught the attention of experts and the public, sparking debates about the stability of complex robotic systems in real time.\nDespite the unexpected event, the case highlights the practical challenges in the development and integration of hardware and software for autonomous robots.","link":"https://indianexpress.com/article/technology/tech-news-technology/humanoid-robot-powered-by-qualcomm-ai-chips-collapses-during-taipei-computex-event-10809988/","categoria":"ROBOTICS","lang":"en"},{"fonte":"livemint.com","pais":"India","titulo":"India Needs More AI Champions to Take Technology to the Masses, Says Paytm CEO","resumo":"Paytm CEO Vijay Shekhar Sharma stated that India needs more leaders and projects focused on artificial intelligence to democratize access to technology in the country.\nAccording to the executive, the mass adoption of AI can solve crucial social and economic problems faced by the Indian population.\nThe statement reinforces the urgency of creating strong local ecosystems to drive digital inclusion and technological innovation in the country.","link":"https://www.livemint.com/technology/india-needs-more-ai-champions-to-take-technology-to-masses-paytm-ceo-vijay-shekhar-sharma-11785381751228.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"ANI News","pais":"India","titulo":"Odisha Governor Inaugurates Learning Lab Uniting Tradition and Technology","resumo":"The governor of Odisha state inaugurated a new learning lab at Centurion University, designed to integrate traditional knowledge with advanced technology.\nDuring the ceremony, the official praised the university's innovation initiatives and highlighted the importance of connecting cultural heritage with modern digital tools.\nThe lab aims to equip students with technological skills essential for the current market without losing their connection to local roots and knowledge.","link":"https://www.aninews.in/news/national/general-news/odisha-governor-inaugurates-traditional-and-technology-interface-learning-lab-at-centurion-university-praises-innovation-initiatives20260730074501","categoria":"EDUCATION AND TECHNOLOGY","lang":"en"},{"fonte":"welectric.pt","pais":"Portugal","titulo":"PRIO Tests ENG8 Technology to Produce Combustion-Free Industrial Heat","resumo":"Energy company PRIO has begun testing innovative technology developed by ENG8, aimed at generating industrial heat without the need for combustion. The solution uses advanced physics principles to emit thermal energy cleanly, reducing carbon emissions in the productive sector. The pilot project positions Portugal at the forefront of the industrial energy transition, offering a sustainable alternative for high-demand industrial processes.","link":"https://welectric.pt/2026/07/30/prio-testa-tecnologia-da-eng8-para-produzir-calor-industrial-sem-combustao/","categoria":"ENERGY","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"AI Sector Workers Call for Efforts to Control Technology Risks","resumo":"Professionals and experts in the Artificial Intelligence sector have signed a manifesto warning about the risks of the technology's uncontrolled evolution. The group highlights the urgent need to implement monitoring, governance, and transparency mechanisms to prevent severe social impacts. The initiative reflects the growing global concern among technical teams regarding the limits of autonomous systems development.","link":"https://www.publico.pt/2026/07/30/enter/noticia/trabalhadores-sector-ia-pedem-esforcos-controlar-riscos-tecnologia-2183421","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Tek Notícias","pais":"Portugal","titulo":"From Turing to Artificial Intelligence: The Real Challenge Is No Longer Technology","resumo":"The evolution of computer systems since the era of Alan Turing has surpassed the barrier of purely technical development to focus on human integration. Experts debate that the current central obstacle lies in ethical regulation, data security, and the alignment of AI with social values. Consequently, the focus of digital transformation is shifting from code advancement to responsible governance and socioeconomic impact.","link":"https://tek.sapo.pt/opiniao/artigos/de-turing-a-inteligencia-artificial-o-verdadeiro-desafio-ja-nao-e-a-tecnologia/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"SIC Notícias","pais":"Portugal","titulo":"BYD Dolphin G DM-i Arrives in Portugal with 1,040 km Range and Advanced Hybrid Technology","resumo":"Chinese manufacturer BYD has launched the Dolphin G DM-i model in the Portuguese market, equipped with a state-of-the-art plug-in hybrid system. The vehicle stands out for offering an impressive combined range of up to 1,040 kilometers, combining energy efficiency with urban performance. The novelty reinforces the expansion of clean energy vehicles in Europe, bringing advanced technological features to the segment.","link":"https://sicnoticias.pt/programas/volante/2026-07-29-video-byd-dolphin-g-dm-i-chega-a-portugal-com-autonomia-de-1040km-e-tecnologia-hibrida-avancada-ef033a98","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"Pplware","pais":"Portugal","titulo":"Purple flag at the beach? Technology and surveillance systems explain the alert","resumo":"The use of the purple flag on Portuguese beaches has become more frequent thanks to the support of new technologies and environmental surveillance systems. The signal is triggered by sensors and real-time monitoring to warn beachgoers about the presence of dangerous marine life, such as jellyfish. This technological integration allows rescue teams to act with greater precision in preventing accidents and protecting the public.","link":"https://pplware.sapo.pt/informacao/bandeira-roxa-na-praia-a-tecnologia-e-os-sistemas-de-vigilancia-explicam-este-alerta/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Viseu: ESTGV hosts OpenDay KIDS to spark interest in science and engineering","resumo":"The Higher School of Technology and Management of Viseu (ESTGV) held the OpenDay KIDS initiative to encourage children's interest in science and engineering. Through hands-on workshops and interactive activities, participants had direct experience with scientific experiments and technological projects. The event aims to train new generations of talent and introduce young people to academic knowledge and innovation.","link":"https://sapo.pt/artigo/viseu-estgv-promove-openday-kids-2026-para-despertar-vocacoes-na-ciencia-e-engenharia-6a6a3dd1c55f7621d19841b2","categoria":"SCIENCE","lang":"en"},{"fonte":"Terra Ruiva","pais":"Portugal","titulo":"Ciência Viva no Verão hosts astronomy session in Messines","resumo":"The 'Ciência Viva no Verão' program organized a special astronomy-focused session in the town of Messines, bringing the public closer to observing the cosmos. The activity featured nighttime observation equipment and educational explanations about constellations, celestial bodies, and space exploration. The initiative aims to democratize the spread of science in Portugal, promoting knowledge and curiosity in an accessible way.","link":"https://www.terraruiva.pt/2026/07/29/ciencia-viva-no-verao-com-sessao-de-astronomia-em-messines/","categoria":"ASTRONOMY","lang":"en"},{"fonte":"Executive Digest","pais":"Portugal","titulo":"Ikea opens new store in Coimbra with a pioneering format in Portugal and a focus on the circular economy","resumo":"Ikea has inaugurated a new store in Coimbra, introducing a pioneering retail concept focused entirely on sustainability and the circular economy. The space prioritizes repair services, reuse workshops, and innovative solutions to extend the lifespan of products. This initiative aligns with global trends in conscious consumption and marks an important step in transforming the sustainable retail model.","link":"https://executivedigest.sapo.pt/ikea-abre-hoje-nova-loja-em-coimbra-com-formato-pioneiro-em-portugal-e-aposta-na-economia-circular/","categoria":"INNOVATION","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/\.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
