marine biodiversity preservation.\nAt the same time, the plan aims to expand clean energy capacity to strengthen the country's ecological transition.\nThis integrated approach aligns technological advancement and scientific research to ensure energy and environmental security.","link":"https://www.hindustantimes.com/india-news/modi-lists-blue-green-economy-as-saptadhara-pushes-for-deep-sea-explorations-101786769160111.html","categoria":"SCIENCE","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"What Modi's speech holds for Gen Z: AI skills, training, and jobs","resumo":"The most recent government pronouncement brought an unprecedented focus on youth qualification for the new digital era.\nThe proposal includes free professional training programs in Artificial Intelligence, technology, and applied sciences.\nThe goal is to prepare Generation Z for the demands of the global job market and stimulate technological entrepreneurship.\nThe incentive combines investments in sports, technical training, and the creation of high-value-added jobs in India.","link":"https://timesofindia.indiatimes.com/india/whats-in-it-for-gen-z-in-pm-modis-independence-day-speech-ai-skills-free-coaching-sports-jobs/articleshow/133256260.cms","categoria":"TRENDS","lang":"en"},{"fonte":"Silicon Portugal","pais":"Portugal","titulo":"Portugal cannot just consume technology created by others","resumo":"The debate over Portugal's role in the global tech landscape highlights the urgent need for the country to stop being a mere consumer of external solutions.\nExperts and leaders point out that developing its own technology is fundamental to ensuring digital sovereignty and economic competitiveness.\nEncouraging local innovation and scientific research is seen as the only sustainable way to transform the Portuguese tech ecosystem in the coming years.","link":"https://www.silicon.pt/portugal-nao-pode-consumir-tecnologia-criada-por-terceiros-100149.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"sapo.pt","pais":"Portugal","titulo":"Guide launched for leaders looking to prepare companies for the quantum economy","resumo":"A new strategic guide aimed at executives and business leaders has been launched to guide the transition to the quantum computing era.\nThe publication addresses the impacts of this disruptive technology on business models, information security, and data processing capacity.\nThe material offers practical guidelines for organizations to start adapting now and mitigating risks associated with quantum advancement.","link":"https://sapo.pt/artigo/lancado-guia-para-lideres-que-querem-preparar-as-empresas-para-a-economia-quantica-6a7f208dc641e054927480dc","categoria":"INNOVATION","lang":"en"},{"fonte":"Record","pais":"Portugal","titulo":"Retroid Pocket 6 arrives on AliExpress promising to recreate the golden age of handheld gaming","resumo":"The new Retroid Pocket 6 handheld console has officially launched on AliExpress, catching the eye of retro gaming and hardware tech enthusiasts.\nThe device combines a nostalgic design with modern specifications capable of accurately emulating various classic consoles.\nThe novelty represents a significant step in the affordable handheld console market, bringing high performance and a quality screen to gamers.","link":"https://www.record.pt/indica/tecnologia/detalhe/a-retroid-pocket-6-chegou-ao-aliexpress-e-promete-recriar-a-era-de-ouro-dos-videojogos-portateis","categoria":"GADGETS","lang":"en"},{"fonte":"Jornal de Negócios","pais":"Portugal","titulo":"Seguro argues that Portugal 'cannot limit itself to consuming technology created by others'","resumo":"In a recent statement, Seguro emphasized the strategic importance of Portugal investing heavily in the production and development of its own technology.\nThe declaration reinforces the warning that dependence on foreign platforms and solutions could compromise the country's economic future and digital autonomy.\nThe leader advocated for public policies that stimulate startup creation, local talent training, and the strengthening of the innovation ecosystem.","link":"https://www.jornaldenegocios.pt/economia/politica/detalhe/seguro-defende-que-portugal-nao-pode-limitar-se-a-consumir-tecnologia-criada-por-outros","categoria":"DIGITAL POLICY","lang":"en"},{"fonte":"Executive Digest","pais":"Portugal","titulo":"The AI Act: the real challenge is not in the technology","resumo":"The implementation of the new European artificial intelligence regulation, the AI Act, brings up discussions that go beyond the purely technical aspect.\nExperts warn that the biggest obstacles lie in governance, ethics, the cultural adaptation of companies, and the legal compliance of operations.\nThe transition will require a multidisciplinary effort to ensure that AI systems are safe, transparent, and aligned with fundamental rights.","link":"https://executivedigest.sapo.pt/o-ai-act-o-verdadeiro-desafio-nao-esta-na-tecnologia/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Meteored Portugal","pais":"Portugal","titulo":"Ana Catarina Santos wants to show that there is common ground between science and dance","resumo":"Researcher Ana Catarina Santos presents an innovative project that seeks to integrate the concepts of scientific communication with the art of contemporary dance.\nThe initiative aims to democratize access to scientific knowledge, using body expression and movement as tools for outreach and education.\nThe work demonstrates how interdisciplinary approaches can bring the public closer to science, making learning more accessible, creative, and engaging.","link":"https://www.tempo.pt/noticias/ciencia/ana-catarina-santos-quer-mostrar-nos-que-entre-a-ciencia-e-a-danca-ha-um-chao-comum.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Jornal Nordeste","pais":"Portugal","titulo":"Minister of Agriculture advocates for training and technology to secure the future of herding","resumo":"The Minister of Agriculture highlighted the fundamental role of technological modernization and technical training for the preservation and sustainability of pastoral activity.\nThe introduction of digital tools, such as GPS monitoring and automated herd management, seeks to attract new professionals to the rural sector.\nThe measure aims to ensure economic efficiency, animal welfare, and the preservation of agricultural traditions amid current climate challenges.","link":"https://jornalnordeste.com/noticias/ministro-da-agricultura-defende-formacao-e-tecnologia-para-garantir-futuro-da-pastoricia","categoria":"AGROTECH","lang":"en"},{"fonte":"Diário As Beiras","pais":"Portugal","titulo":"Consortium promotes innovation, technology, and the blue economy","resumo":"A new consortium has been created to boost the sustainable development of the oceans through the intensive use of technology and innovation.\nThe initiative focuses on connecting research centers, companies, and public entities to promote solutions in the blue economy area, such as renewable energies and marine biotechnology.\nThe project aims to position the region as a global benchmark in the responsible and economic use of water and marine resources.","link":"https://www.asbeiras.pt/consorcio-promove-inovacao-tecnologia-e-economia-azul/","categoria":"TECHNOLOGY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
</body>
