  // Injeta os dados originais no frontend
  const data = [{"fonte":"Forbes Brasil","pais":"Brasil","titulo":"Inteligência Artificial pode injetar quase R$ 1 trilhão na economia brasileira até 2030, aponta estudo","resumo":"Estudo aponta que a adoção massiva de inteligência artificial pode injetar cerca de R$ 1 trilhão na economia brasileira até 2030.\nO relatório detalha o impacto transformador da tecnologia em setores como indústria, serviços e agricultura.\nEspecialistas destacam que o crescimento sustentável exigirá investimentos pesados em infraestrutura digital e formação de talentos.","link":"https://forbes.com.br/forbes-tech/2026/08/inteligencia-artificial-pode-injetar-quase-r-1-trilhao-na-economia-brasileira-ate-2030-aponta-estudo/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Metrópoles","pais":"Brasil","titulo":"Lula diz que vai recriar o programa Ciência sem Fronteiras com foco em Inteligência Artificial","resumo":"O governo anunciou a recriação do programa Ciência sem Fronteiras, redirecionando o foco principal de suas bolsas para inteligência artificial.\nA medida visa formar pesquisadores e profissionais de ponta nas melhores instituições globais de tecnologia.\nCom a iniciativa, o país busca mitigar o déficit de especialistas no setor e impulsionar a inovação tecnológica nacional.","link":"https://www.metropoles.com/brasil/lula-diz-que-vai-recriar-ciencia-sem-fronteiras-com-foco-em-ia","categoria":"CIÊNCIA E TECNOLOGIA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Bloqueio de ligações indesejadas: Anatel autoriza anti-spam e estuda levar sistema a todos os clientes","resumo":"A Anatel autorizou operadoras a utilizarem sistemas de bloqueio anti-spam contra chamadas indesejadas de telemarketing.\nA iniciativa busca proteger os consumidores contra importunações abusivas e reduzir os riscos de fraudes por telefone.\nA agência reguladora avalia agora a expansão dessa proteção para a totalidade dos clientes de telefonia no Brasil.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/15/bloqueio-de-ligacoes-indesejadas-anatel-autoriza-anti-spam-e-estuda-levar-sistema-a-todos-os-clientes.ghtml","categoria":"TELECOMUNICAÇÕES","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"BDXP 2026 fortalece o ecossistema de Inteligência Artificial em Manaus","resumo":"A edição 2026 do evento BDXP reuniu especialistas e empresas para fortalecer o ecossistema de inteligência artificial em Manaus.\nO encontro apresentou soluções voltadas à preservação da Amazônia e à modernização do Polo Industrial da região.\nA iniciativa consolida a capital amazonense como um polo emergente de inovação e atração de investimentos de tecnologia.","link":"https://g1.globo.com/google/amp/am/amazonas/amazonia-negocios/noticia/2026/08/14/bdxp-2026-fortalece-o-ecossistema-de-inteligencia-artificial-em-manaus.ghtml","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"SEGS Portal Nacional","pais":"Brasil","titulo":"Discord e ANPD: suspensão de live reforça o uso da tecnologia no compliance","resumo":"A atuação conjunta entre a ANPD e a plataforma Discord resultou na suspensão de transmissões ao vivo irregulares.\nO episódio evidencia a necessidade crescente do uso de ferramentas tecnológicas avançadas para garantir o compliance digital.\nEspecialistas reforçam a importância do monitoramento contínuo para assegurar a proteção de dados e a segurança dos usuários.","link":"https://www.segs.com.br/seguros/453594-discord-e-anpd-suspensao-de-live-reforca-o-uso-da-tecnologia-no-compliance","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"portaldocomercio.org.br","pais":"Brasil","titulo":"Tech Day reúne gigantes da tecnologia em evento no Museu do Amanhã","resumo":"O Museu do Amanhã sediou o Tech Day, evento que reuniu grandes empresas globais e startups do ecossistema de tecnologia.\nAs discussões abordaram avanços em automação, inteligência artificial e estratégias de sustentabilidade no ambiente digital.\nO encontro reforçou a relevância de conectar inovação, responsabilidade social e desenvolvimento econômico no país.","link":"https://portaldocomercio.org.br/acoes-institucionais/tech-day-reune-gigantes-da-tecnologia-em-evento-no-museu-do-amanha/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Mercosur","pais":"Brasil","titulo":"Prêmio MERCOSUL de Ciência, Tecnologia e Inovação abre inscrições para 2026","resumo":"Estão abertas as inscrições para o Prêmio MERCOSUL de Ciência, Tecnologia e Inovação com foco na edição de 2026.\nA premiação reconhece pesquisas de destaque que ofereçam soluções práticas para desafios regionais da América do Sul.\nOs vencedores receberão incentivos financeiros e visibilidade para impulsionar a aplicação das descobertas na indústria.","link":"https://www.mercosur.int/pt-br/premio-mercosul-de-ciencia-tecnologia-e-inovacao-abertas-as-inscricoes-para-2026","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"BeInCrypto","pais":"Brasil","titulo":"Youth Challenge Blockchain UNICEF premia economia circular na Bahia e confirma 2ª edição","resumo":"Um projeto apoiado pela UNICEF premiou iniciativas na Bahia que utilizam tecnologia blockchain aplicada à economia circular.\nAs soluções vencedoras usam redes descentralizadas para otimizar a rastreabilidade e a remuneração de catadores de recicláveis.\nCom os resultados positivos alcançados na primeira fase, os organizadores já confirmaram a realização da segunda edição.","link":"https://br.beincrypto.com/youth-challenge-blockchain-unicef-premia-economia-circular-na-bahia-e-confirma-2a-edicao/","categoria":"BLOCKCHAIN","lang":"pt"},{"fonte":"Times Brasil | CNBC","pais":"Estados Unidos","titulo":"I.A. Encarece Tecnologia e Energia nos EUA com Altas de Até 4,2%","resumo":"O avanço acelerado da inteligência artificial tem impulsionado a demanda por infraestrutura e energia nos Estados Unidos.\nEsse aumento refletiu-se em altas de até 4,2% nos preços do setor, gerando impactos diretos no custo de operação do ecossistema tecnológico.\nEspecialistas preveem que a pressão inflacionária deve continuar à medida que mais centros de dados e supercomputadores entram em operação.","link":"https://timesbrasil.com.br/empresas-e-negocios/tecnologia-e-inovacao/i-a-encarece-tecnologia-e-energia-nos-eua-precos-sobem-ate-42-e-pressao-deve-continuar/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Radiology Business","pais":"Estados Unidos","titulo":"Medicare Aprova Pagamento Adicional para Solução de IA em Radiologia Hospitalar","resumo":"O órgão regulador do Medicare nos EUA aprovou um pagamento adicional de tecnologia para soluções de IA voltadas à radiologia hospitalar.\nA medida visa incentivar a adoção de ferramentas de diagnóstico avançadas para pacientes internados, melhorando a precisão e a velocidade dos tratamentos.\nEssa aprovação representa um marco regulatório fundamental para a expansão do uso de inteligência artificial na medicina de alta complexidade.","link":"https://radiologybusiness.com/topics/artificial-intelligence/medicare-approves-new-technology-add-payment-inpatient-radiology-ai-solution","categoria":"SAÚDE E TECNOLOGIA","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"Voluntário Desenvolve Ferramenta de Machine Learning para Identificar Nuvens Raras","resumo":"Um projeto comunitário resultou na criação de um modelo de aprendizado de máquina capaz de detectar formações de nuvens raras.\nA solução automatiza a análise de dados meteorológicos complexos, permitindo que cientistas compreendam melhor fenômenos atmosféricos incomuns.\nA iniciativa demonstra o enorme potencial do aprendizado de máquina e da ciência cidadã na aceleração de pesquisas climáticas globais.","link":"https://science.nasa.gov/get-involved/citizen-science/volunteer-develops-machine-learning-tool-to-identify-rare-clouds/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"NASA (.gov)","pais":"Estados Unidos","titulo":"Semana na Estação Espacial Conclui Atividades com Robótica, Caminhadas Espaciais e Ciência","resumo":"A tripulação da Estação Espacial Internacional finalizou uma intensa semana de trabalho com o uso avançado de sistemas robóticos e revisões de caminhadas espaciais.\nOs astronautas conduziram diversos experimentos científicos focados em biotecnologia e materiais sob microgravidade.\nEssas rotinas contínuas são cruciais para validar tecnologias essenciais para futuras missões de exploração em espaço profundo.","link":"https://www.nasa.gov/blogs/spacestation/2026/08/14/week-ends-aboard-station-with-robotics-spacewalk-reviews-and-science/","categoria":"EXPLORAÇÃO ESPACIAL","lang":"pt"},{"fonte":"World Nuclear News","pais":"Estados Unidos","titulo":"Nuclea Energy Adquire Portfólio de Tecnologia Nuclear da Moltex Energy","resumo":"A Nuclea Energy anunciou a aquisição do portfólio completo de tecnologias inovadoras da Moltex Energy.\nA transação visa fortalecer as capacidades no desenvolvimento de reatores nucleares avançados de nova geração para geração de energia limpa.\nO movimento impulsiona a consolidação de soluções energéticas sustentáveis e mais eficientes no mercado global.","link":"https://www.world-nuclear-news.org/articles/nuclea-energy-to-acquire-moltex-energy-technology-portfolio","categoria":"ENERGIA","lang":"pt"},{"fonte":"PA Department of Community \u0026 Economic Development (.gov)","pais":"Estados Unidos","titulo":"Governo da Pensilvânia Destaque Investimentos em Economia de Inovação e Robótica na CMU","resumo":"Representantes governamentais visitaram o Instituto de Robótica da Carnegie Mellon University para anunciar novos investimentos em inovação.\nO orçamento estadual garantiu recursos significativos destinados a acelerar o ecossistema local de tecnologia e startups de robótica.\nA parceria busca posicionar a região como um hub global de automação avançada e desenvolvimento econômico sustentável.","link":"https://dced.pa.gov/newsroom/shapiro-administration-highlights-2026-27-budget-investments-in-innovation-economy-secured-in-2026-27-budget-during-visit-to-carnegie-foundry-at-cmus-robotics-institute-in-pittsburgh/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"aamu.edu","pais":"Estados Unidos","titulo":"Estudante de Ciência da Computação é Reconhecido Entre Milhares de Inovadores Globais","resumo":"Um estudante do último ano de Ciência da Computação recebeu destaque internacional por suas contribuições em projetos de tecnologia.\nA premiação o selecionou entre milhares de participantes mundiais que desenvolvem soluções computacionais de alto impacto.\nO reconhecimento evidencia o surgimento de novos talentos e a força da formação acadêmica impulsionando a inovação tecnológica.","link":"https://www.aamu.edu/about/inside-aamu/news/computer-science-senior-recognized-among-thousands-of-global-innovators.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Greater Good: The Science of a Meaningful Life","pais":"Estados Unidos","titulo":"Quando Cientistas Admitem Erros, Significa que a Ciência Está Funcionando","resumo":"A autocorreção é um dos pilares fundamentais do método científico e da busca rigorosa pelo conhecimento verdadeiro.\nQuando pesquisadores revisam publicações e reconhecem falhas em estudos anteriores, o processo de validação acadêmica fortalece a confiança pública.\nEsse rigor metodológico assegura que a ciência progrida com base em dados transparentes, reprodutíveis e cada vez mais precisos.","link":"https://greatergood.berkeley.edu/article/item/scientists_admit_mistakes_science_working_fauci_hearings","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"La Tribune","pais":"França","titulo":"Proibição de redes sociais para menores de 15 anos: Conselho Constitucional censura a medida","resumo":"O Conselho Constitucional da França derrubou o projeto de lei que proibia o acesso a redes sociais para menores de 15 anos sem autorização parental.\nA instituição argumentou que a medida violava de forma desproporcional a liberdade de expressão e o direito de acesso à comunicação na internet.\nCom a decisão, o governo francês sofre uma importante derrota jurídica na tentativa de impor limites ao uso de plataformas digitais por jovens.","link":"https://www.latribune.fr/article/la-tribune-dimanche/politique/14960871856251/interdiction-des-reseaux-sociaux-aux-moins-de-15-ans-le-conseil-constitutionnel-censure-la-mesure","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Le Figaro","pais":"França","titulo":"'Uma humilhação' para o governo: classe política reage à censura da proibição de redes sociais para menores de 15 anos","resumo":"A derrubada da lei de veto às redes sociais para menores de 15 anos pelo Conselho Constitucional provocou forte reação no cenário político francês.\nOpositores governamentais classificaram a decisão judicial como um sério revés e criticaram a fragilidade jurídica do texto aprovado no Parlamento.\nEm resposta, lideranças aliadas buscam articular novas propostas legislativas para regular a segurança e a privacidade de adolescentes no ambiente digital.","link":"https://www.lefigaro.fr/conjoncture/un-camouflet-pour-le-gouvernement-la-classe-politique-reagit-a-la-censure-de-l-interdiction-des-reseaux-sociaux-aux-moins-de-15-ans-20260814","categoria":"REDES SOCIAIS","lang":"pt"},{"fonte":"日本経済新聞","pais":"Inglaterra","titulo":"Cresce a insatisfação no Reino Unido com a proibição do uso de mangueiras para economizar água","resumo":"A imposição de restrições ao uso de mangueiras no Reino Unido tem gerado forte insatisfação entre os moradores locais.\nA medida foi adotada pelas concessionárias para combater a seca severa e a queda crítica no nível dos reservatórios.\nEspecialistas destacam que os eventos climáticos extremos exigirão novas infraestruturas e um consumo muito mais consciente.","link":"https://www.nikkei.com/article/DGKKZO98175540V10C26A8EAC000/","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"Engineering and Technology Magazine","pais":"Inglaterra","titulo":"Estradas geotérmicas podem resolver o problema dos buracos nas vias definitivamente","resumo":"Pesquisadores estão testando o uso de energia geotérmica integrada ao asfalto para acabar com o surgimento de buracos nas estradas.\nO sistema aproveita o calor do subsolo para manter a temperatura do pavimento estável, prevenindo rachaduras provocadas pelo gelo.\nA inovação promete reduzir custos astronômicos de manutenção viária e aumentar significativamente a segurança no trânsito.","link":"https://eandt.theiet.org/2026/08/14/geothermal-roads-could-stop-pothole-problem-good-0","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Sky Sports","pais":"Inglaterra","titulo":"Tottenham e Inter de Milão fecham acordo de £30 milhões pelo defensor inglês Djed Spence","resumo":"O Tottenham Hotspur e a Inter de Milão concordaram com um negócio de 30 milhões de libras pelo defensor Djed Spence.\nA movimentação representa um passo estratégico crucial para a reformulação do elenco dos clubes para a próxima temporada.\nO investimento expressivo reforça a alta valorização dos jovens talentos do futebol britânico no mercado internacional.","link":"https://www.skysports.com/football/news/11095/13572315/djed-spence-transfer-news-tottenham-and-inter-milan-agree-lb30m-deal-for-england-defender","categoria":"ESPORTES","lang":"pt"},{"fonte":"Computer Hoy","pais":"Espanha","titulo":"O charme da tecnologia vintage: categorias mais procuradas e os motivos de um 'revival' que não é apenas moda","resumo":"A busca por dispositivos tecnológicos antigos, como câmeras fotográficas e consoles retrô, vem crescendo de forma consistente entre diferentes gerações.\nEste movimento vai além da nostalgia, sendo impulsionado pelo desejo de desconexão digital e pela busca por produtos com maior durabilidade.\nA tendência reforça um novo comportamento de consumo que valoriza a simplicidade e a estética do passado no cotidiano moderno.","link":"https://computerhoy.20minutos.es/dispositivos/encanto-tecnologia-vintage-categorias-mas-demandadas-motivos-un-revival-que-no-es-una-moda-mas_7024253_0.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Computer Hoy","pais":"Espanha","titulo":"China transforma desertos em paisagens verdes com ajuda da tecnologia para acelerar plano ambicioso","resumo":"A China tem utilizado inovações tecnológicas avançadas, como monitoramento por satélite e biotecnologia de solo, para reflorestar vastas áreas desérticas no país.\nEssas iniciativas buscam conter a erosão, combater as mudanças climáticas e garantir a segurança alimentar de suas regiões áridas.\nO projeto serve como um modelo global de recuperação ambiental acelerada por meio de soluções científicas e de engenharia.","link":"https://computerhoy.20minutos.es/tecnologia/china-ya-ha-convertido-desiertos-paisajes-verdes-tecnologia-ha-acelerado-su-ambicioso-plan_7013871_0.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"MUNDIARIO","pais":"Espanha","titulo":"Espanha acelera enquanto Alemanha se estagna: como a economia da União Europeia está mudando","resumo":"A economia espanhola apresenta um crescimento expressivo impulsionado pelo turismo e consumo interno, enquanto a Alemanha enfrenta estagnação industrial.\nEssa divergência reflete uma mudança dinâmica no equilíbrio econômico dentro do bloco da União Europeia.\nO cenário gera novos debates sobre políticas fiscais e estratégias de investimento para manter a estabilidade financeira no continente.","link":"https://www.mundiario.com/articulo/economia/espana-acelera-mientras-alemania-estanca-asi-cambia-economia-union-europea/20260815054916435551.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Chile en el Exterior","pais":"Espanha","titulo":"Embaixador visita empresa chilena de tecnologia agrícola em Madri","resumo":"O embaixador realizou uma visita institucional a uma empresa de tecnologia agrícola de origem chilena sediada em Madri.\nO encontro destacou o fortalecimento das relações bilaterais e a importância do desenvolvimento de soluções agrotecnológicas sustentáveis.\nA iniciativa reforça Madri como um polo estratégico para a expansão de startups e empresas inovadoras na Europa.","link":"https://www.chile.gob.cl/espana/noticias/embajador-visita-empresa-chilena-de-tecnologia-agricola-en-madrid","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"EL PAÍS","pais":"Espanha","titulo":"Economia da zona do euro cresce 0,4% no segundo trimestre apesar do enfraquecimento alemão","resumo":"O Produto Interno Bruto da zona do euro registrou um crescimento de 0,4% no segundo trimestre, superando expectativas moderadas.\nO resultado positivo foi sustentado pelo desempenho de economias do sul, como a Espanha, atenuando os impactos da desaceleração alemã.\nO indicador traz certo alívio aos mercados, embora incertezas geopolíticas e inflacionárias ainda inspirem cautela nos investidores.","link":"https://elpais.com/economia/2026-08-14/la-economia-de-la-zona-euro-crecio-un-04-en-el-segundo-trimestre-pese-a-la-debilidad-alemana.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"dw.com","pais":"Alemanha","titulo":"Calor na Alemanha: políticos inativos e população impotente","resumo":"A Alemanha enfrenta ondas de calor cada vez mais intensas, revelando a falta de preparação das infraestruturas públicas e a inação política diante das mudanças climáticas.\nA população sofre com impactos diretos na saúde e na qualidade de vida, especialmente nos centros urbanos sem áreas verdes suficientes.\nEspecialistas cobram planos de adaptação urgente e medidas concretas para proteger os cidadãos mais vulneráveis nas próximas décadas.","link":"https://amp.dw.com/de/hitze-in-deutschland-politik-tatenlos-bev%C3%B6lkerung-machtlos/a-78370618","categoria":"CLIMA","lang":"pt"},{"fonte":"euractiv.com","pais":"Alemanha","titulo":"Conselho Constitucional francês declara inconstitucional a proibição de redes sociais para menores de 15 anos","resumo":"O Conselho Constitucional da França derrubou a lei que visava proibir o acesso de menores de 15 anos às redes sociais sem autorização dos pais.\nA decisão baseou-se na violação da liberdade de expressão e de comunicação garantidas pela Constituição francesa.\nO veredito reabre o debate global sobre a regulação digital, privacidade e a proteção de jovens no ambiente online.","link":"https://euractiv.com/de/news/franzosisches-verfassungsgericht-erklart-social-media-verbot-fur-unter-15-jahrige-fur-verfassungswidrig/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Spiegel","pais":"Alemanha","titulo":"Imigração sustenta mercado de trabalho e economia no leste da Alemanha, aponta estudo do IW","resumo":"Um novo estudo do Instituto da Economia Alemã (IW) destaca que a chegada de trabalhadores imigrantes tem sido fundamental para mitigar a escassez de mão de obra no leste do país.\nO envelhecimento populacional torna a força de trabalho estrangeira indispensável para a manutenção dos serviços e indústrias regionais.\nA pesquisa ressalta que a atração e integração de novos talentos são vitais para a sustentabilidade econômica contínua da Alemanha.","link":"https://www.spiegel.de/wirtschaft/ostdeutschland-zuwanderung-stuetzt-laut-iw-studie-arbeitsmarkt-und-wirtschaft-a-e0504519-6676-483f-a674-d72fff5cefae","categoria":"ECONOMIA","lang":"pt"},{"fonte":"WIRED.jp","pais":"Japão","titulo":"Chefe de desenvolvimento quântico da Microsoft ignora ceticismo da comunidade científica","resumo":"O líder da divisão de computação quântica da Microsoft mantém sua postura confiante diante das dúvidas levantadas por diversos cientistas sobre a viabilidade de sua abordagem tecnológica.\nA empresa continua canalizando investimentos maciços no desenvolvimento de qubits topológicos para alcançar avanços inéditos no processamento de dados.\nEssa determinação evidencia a acirrada disputa global no setor de tecnologia de ponta para liderar a próxima revolução computacional.\nO cenário destaca a complexa transição entre teorias científicas arriscadas e a busca por aplicações comerciais de alto impacto.","link":"https://wired.jp/article/microsoft-quantum-chief-majorana-results/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Japão","titulo":"'Murakami viu seu livro ganhar vida!': a empresa japonesa que leva obra de ficção científica para os palcos","resumo":"Uma inovadora companhia teatral do Japão aceitou o desafio de adaptar uma das mais aclamadas obras de ficção científica de Haruki Murakami para os palcos.\nA produção combina efeitos visuais modernos e cenografia imersiva para recriar o universo surrealista e futurista do consagrado autor.\nO próprio escritor acompanhou o projeto e elogiou a fidelidade com que sua visão artística foi traduzida para o formato teatral.\nA iniciativa reforça o forte dinamismo da indústria cultural japonesa na fusão de literatura, tecnologia e artes cênicas.","link":"https://www.theguardian.com/stage/2026/aug/14/tatsuya-fujiwara-philippe-decoufle-haruki-murakami-hard-boiled-wonderland-and-the-end-of-the-world","categoria":"CULTURA","lang":"pt"},{"fonte":"Indo-Pacific Defense FORUM","pais":"Japão","titulo":"Japão considera o fortalecimento da defesa como caminho para a prosperidade econômica","resumo":"O governo do Japão está integrando sua estratégia de segurança nacional ao desenvolvimento econômico por meio de altos investimentos na indústria de defesa.\nA nova diretriz busca impulsionar a inovação tecnológica interna, fortalecer a cadeia de suprimentos de alta tecnologia e gerar empregos qualificados.\nEssa abordagem marca uma reformulação significativa no posicionamento histórico do país perante o setor industrial militar e tecnológico.\nO plano visa posicionar o país como um polo de desenvolvimento avançado capaz de sustentar o crescimento a longo prazo.","link":"https://ipdefenseforum.com/zh-hans/2026/08/%E6%97%A5%E6%9C%AC%E5%B0%86%E5%8A%A0%E5%BC%BA%E5%9B%BD%E9%98%B2%E5%BB%BA%E8%AE%BE%E8%A7%86%E4%B8%BA%E5%AE%9E%E7%8E%B0%E7%BB%8F%E6%B5%8E%E7%B9%81%E8%8D%A3%E4%B9%8B%E8%B7%AF/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Monitor Mercantil","pais":"China","titulo":"Tecnologia chinesa de táxis autônomos expande operação para o mercado europeu","resumo":"A tecnologia de veículos autônomos desenvolvida na China está alcançando novos marcos com sua entrada oficial nos mercados da Europa.\nEmpresas chinesas buscam consolidar sua liderança global em mobilidade inteligente por meio da expansão de frotas de robotáxis.\nA iniciativa enfrenta desafios regulatórios e concorrenciais locais, mas promete acelerar a adoção da condução autônoma no continente.\nO avanço sinaliza a crescente influência da indústria de tecnologia automotiva chinesa em escala internacional.","link":"https://monitormercantil.com.br/tecnologia-chinesa-de-taxis-autonomos-chega-aos-mercados-europeus/","categoria":"AUTOMAÇÃO","lang":"pt"},{"fonte":"Globo","pais":"China","titulo":"Agricultor chinês perde 10 hectares de plantação após seguir conselho de IA","resumo":"Um agricultor na China sofreu um grande prejuízo ao perder dez hectares de sua lavoura após aplicar recomendações incorretas fornecidas por uma IA.\nO caso acendeu alertas sobre os riscos da dependência cega de ferramentas de inteligência artificial em setores sensíveis como a agricultura.\nEspecialistas destacam a necessidade urgente de validação humana e regulamentação para o uso de algoritmos na gestão de cultivos.\nO incidente reforça a importância da precisão dos dados ao integrar tecnologias emergentes no campo.","link":"https://revistagalileu.globo.com/tecnologia/noticia/2026/08/agricultor-chines-perde-10-hectares-de-plantacao-apos-seguir-conselho-de-ia.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"新浪财经","pais":"China","titulo":"Província de Jiangsu busca avanços em foguetes reutilizáveis de grande capacidade","resumo":"A província de Jiangsu anunciou planos para dominar tecnologias críticas no desenvolvimento de foguetes reutilizáveis e de grande capacidade de carga.\nO projeto visa fortalecer a infraestrutura local de validação para lançamento e recuperação de veículos espaciais.\nA iniciativa busca posicionar a região como um polo estratégico na crescente indústria aeroespacial comercial chinesa.\nO avanço impulsionará a autossuficiência tecnológica do país em missões espaciais de larga escala.","link":"https://finance.sina.cn/2026-08-14/detail-ininhhrn4158668.d.html?vt=4\u0026cid=76729\u0026node_id=76729","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"新浪财经","pais":"China","titulo":"Regiões chinesas disputam liderança na 'economia dos tokens' impulsionada por IA","resumo":"Diversas províncias chinesas, lideradas por Pequim, Guangdong e Jiangsu, iniciaram uma corrida para dominar a chamada 'economia dos tokens'.\nO termo refere-se ao ecossistema de processamento de dados e poder computacional essencial para grandes modelos de linguagem de IA.\nA movimentação visa estabelecer diretrizes regionais e infraestrutura para monetizar e otimizar serviços baseados em inteligência artificial.\nA disputa reflete a priorização estratégica do governo chinês na infraestrutura da economia digital de última geração.","link":"https://finance.sina.cn/2026-08-14/detail-ininfvzx9457117.d.html?vt=4\u0026cid=76729\u0026node_id=76729","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"京报网","pais":"China","titulo":"China reduz custos de tecnologias verdes e acelera transição global para baixo carbono","resumo":"A China continua a reduzir significativamente os custos de produção e implantação de tecnologias limpas, beneficiando a transição energética global.\nO país tem expandido a fabricação de painéis solares, baterias e turbinas eólicas, tornando essas soluções mais acessíveis a mercados emergentes.\nEssa queda de preços permite que diversas nações alcancem metas ambientais com investimentos mais viáveis economicamente.\nO esforço chinês consolida sua posição central na cadeia de suprimentos da economia sustentável do futuro.","link":"https://news.bjd.com.cn/2026/08/15/11916897.shtml","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"peopleapp.com","pais":"China","titulo":"Edição de 2026 do Prêmio Futuro da Ciência é anunciada na China","resumo":"Foi anunciada a edição de 2026 do Prêmio Futuro da Ciência, prestigiada honraria conhecida internacionalmente como o 'Nobel Chinês'.\nA premiação reconhece pesquisas científicas de grande impacto global realizadas por cientistas da Grande China em áreas como física e matemática.\nO evento busca incentivar o avanço científico fundamental e atrair novos talentos para a pesquisa básica na região.\nO anúncio reafirma o compromisso do país em se tornar uma potência global de inovação e descoberta científica.","link":"https://www.peopleapp.com/rmharticle/30052928625","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"新浪财经","pais":"China","titulo":"Cientistas explicam mitos e revelam a forma correta de carregar a bateria do celular","resumo":"Pesquisadores do Instituto de Física da Academia Chinesa de Ciências desmistificaram hábitos comuns sobre a recarga de baterias de smartphones.\nO estudo esclarece como os eletrólitos e os componentes químicos reagem ao hábito de manter o dispositivo conectado continuamente à tomada.\nCientistas apontam práticas ideais para prolongar a vida útil das baterias de íon-lítio sem danificar o hardware do aparelho.\nAs orientações visam educar os consumidores sobre o uso seguro e eficiente da tecnologia móvel no dia a dia.","link":"https://finance.sina.cn/2026-08-14/detail-ininhtfh4096407.d.html?vt=4","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Telegraph","pais":"China","titulo":"EUA multam empresa britânica de defesa por transferência indevida de tecnologia para a China","resumo":"O governo dos Estados Unidos aplicou uma multa de US$ 36 milhões a uma gigante do setor de defesa do Reino Unido.\nA sanção ocorreu após a investigação comprovar a transferência não autorizada de dados e tecnologias sensíveis para entidades chinesas.\nO caso evidencia o rigor crescente na fiscalização do controle de exportações de tecnologia militar de uso duplo.\nA medida reflete o aumento das tensões geopolíticas globais relacionadas à segurança cibernética e soberania tecnológica.","link":"https://www.telegraph.co.uk/business/2026/08/14/us-fines-british-defence-giant-36m-passing-technology-china/","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Índia","titulo":"Índia@80: Os 8 temas que definem a trajetória da inteligência artificial no país","resumo":"A Índia tem consolidado sua posição como um dos principais polos globais no desenvolvimento e adoção de Inteligência Artificial.\nA estratégia nacional abrange desde o fortalecimento da infraestrutura de dados até a capacitação massiva da força de trabalho local.\nAlém disso, iniciativas governamentais e parcerias privadas buscam aplicar soluções de IA em setores cruciais como saúde, agricultura e educação.\nEsse movimento impulsiona a inovação tecnológica e projeta o país como referência mundial em soluções digitais acessíveis e em grande escala.","link":"https://www.moneycontrol.com/news/technology-startup/ai-edge-newsletter/india-80-8-themes-defining-its-ai-journey/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"hindustantimes.com","pais":"Índia","titulo":"A próxima fronteira da ciência indiana no 80º Dia da Independência","resumo":"No âmbito das comemorações nacionais, líderes e pesquisadores destacaram os novos rumos para o avanço científico da Índia.\nO país planeja intensificar investimentos em pesquisas avançadas de biotecnologia, exploração espacial e física quântica nos próximos anos.\nO objetivo central é reduzir a dependência tecnológica externa e resolver desafios socioeconômicos internos por meio da inovação de ponta.\nEssa visão estratégica reforça o papel da comunidade científica no desenvolvimento de tecnologias soberanas e sustentáveis.","link":"https://www.hindustantimes.com/opinion/the-next-frontier-for-indian-science-on-the-80th-independence-day-101786764768490.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Business Standard","pais":"Índia","titulo":"Índia abre setor de energia nuclear para tecnologias estrangeiras de reatores","resumo":"O governo indiano anunciou a abertura do seu setor nuclear para a adoção de tecnologias de reatores comprovadas internacionalmente.\nA medida visa acelerar a transição energética do país e atender à crescente demanda de eletricidade da sua indústria tecnológica.\nCom parcerias globais, a Índia pretende expandir rapidamente sua capacidade de geração limpa e reduzir a pegada de carbono nacional.\nA iniciativa representa uma mudança histórica nas políticas energéticas, atraindo investimentos estratégicos e know-how de ponta.","link":"https://www.business-standard.com/industry/news/india-opens-nuclear-power-sector-to-proven-foreign-reactor-technology-126081500049_1.html","categoria":"ENERGIA","lang":"pt"},{"fonte":"ANI News","pais":"Índia","titulo":"Economia de internet da Índia caminha para crescimento sustentado, aponta Morgan Stanley","resumo":"Relatório do Morgan Stanley indica um forte ritmo de expansão para o ecossistema digital da Índia nos próximos anos.\nOs setores de logística de e-commerce, entrega de alimentos e serviços financeiros digitais continuam liderando essa trajetória de alta.\nO avanço da infraestrutura móvel e o aumento do consumo online impulsionam investimentos contínuos na economia da internet.\nEsse cenário consolida a Índia como um dos mercados digitais mais dinâmicos e atraentes para investidores globais.","link":"https://www.aninews.in/news/business/indias-internet-economy-set-for-sustained-growth-e-commerce-logistics-food-delivery-to-see-strong-expansion-morgan-stanley20260815103513","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Índia","titulo":"IA e tecnologia dominam discurso do primeiro-ministro Modi no Dia da Independência","resumo":"Em seu pronunciamento oficial, o primeiro-ministro enfatizou a transformação digital como o motor do progresso nacional.\nA Inteligência Artificial e a transição para energias renováveis foram apontadas como prioridades centrais da agenda governamental.\nO discurso ressaltou a importância de capacitar a juventude em habilidades digitais para garantir a competitividade econômica.\nA estratégia reforça o compromisso do país com a sustentabilidade e a liderança no ecossistema tecnológico global.","link":"https://www.moneycontrol.com/news/india/ai-technology-dominate-modi-s-shortest-i-day-speech-in-four-years-green-growth-youth-gain-ground-14006224.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ANI News","pais":"Índia","titulo":"Voltz Mobility acelera mobilidade verde na Índia com tecnologia japonesa","resumo":"A Voltz Mobility firmou uma colaboração estratégica com parceiros japoneses para impulsionar o setor de veículos elétricos na Índia.\nA parceria trará inovações tecnológicas avançadas em baterias e sistemas de propulsão limpa para o mercado indiano.\nA iniciativa apoia os objetivos nacionais de redução de emissões e transição para rotas de transporte sustentáveis.\nO projeto deve acelerar a infraestrutura de mobilidade elétrica e baratear o acesso a veículos limpos no país.","link":"https://www.aninews.in/news/business/voltz-mobility-accelerates-indias-green-mobility-revolution-with-japanese-technology-collaboration20260815104820","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"hindustantimes.com","pais":"Índia","titulo":"Modi destaca economia azul e verde e impulsiona explorações em águas profundas","resumo":"O governo da Índia anunciou novos investimentos voltados para o desenvolvimento sustentável dos recursos oceânicos e renováveis.\nA iniciativa foca na exploração científica de águas profundas para mapeamento de minerais e preservação da biodiversidade marinha.\nParalelamente, o plano visa expandir a capacidade de energia limpa para fortalecer a transição ecológica do país.\nEssa abordagem integrada alinha avanço tecnológico e pesquisa científica para garantir a segurança energética e ambiental.","link":"https://www.hindustantimes.com/india-news/modi-lists-blue-green-economy-as-saptadhara-pushes-for-deep-sea-explorations-101786769160111.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Times of India","pais":"Índia","titulo":"O que o discurso de Modi reserva para a Geração Z: habilidades em IA, capacitação e empregos","resumo":"O mais recente pronunciamento governamental trouxe um foco inédito na qualificação da juventude para a nova era digital.\nA proposta inclui programas gratuitos de capacitação profissional em Inteligência Artificial, tecnologia e ciências aplicadas.\nA meta é preparar a Geração Z para as exigências do mercado de trabalho global e estimular o empreendedorismo tecnológico.\nO incentivo combina investimentos em esportes, qualificação técnica e criação de empregos de alto valor agregado na Índia.","link":"https://timesofindia.indiatimes.com/india/whats-in-it-for-gen-z-in-pm-modis-independence-day-speech-ai-skills-free-coaching-sports-jobs/articleshow/133256260.cms","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Silicon Portugal","pais":"Portugal","titulo":"Portugal não pode apenas consumir tecnologia criada por terceiros","resumo":"O debate sobre o papel de Portugal no cenário tecnológico global destaca a necessidade urgente de o país deixar de ser mero consumidor de soluções externas.\nEspecialistas e líderes apontam que o desenvolvimento de tecnologia própria é fundamental para garantir a soberania digital e a competitividade econômica.\nO incentivo à inovação local e à pesquisa científica é visto como o único caminho sustentável para transformar o ecossistema tecnológico português nos próximos anos.","link":"https://www.silicon.pt/portugal-nao-pode-consumir-tecnologia-criada-por-terceiros-100149.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"sapo.pt","pais":"Portugal","titulo":"Lançado guia para líderes que desejam preparar empresas para a economia quântica","resumo":"Foi lançado um novo guia estratégico voltado para executivos e líderes empresariais com o objetivo de orientar a transição para a era da computação quântica.\nA publicação aborda os impactos dessa tecnologia disruptiva nos modelos de negócios, na segurança da informação e na capacidade de processamento de dados.\nO material oferece diretrizes práticas para que as organizações comecem desde já a se adaptar e a mitigar os riscos associados ao avanço quântico.","link":"https://sapo.pt/artigo/lancado-guia-para-lideres-que-querem-preparar-as-empresas-para-a-economia-quantica-6a7f208dc641e054927480dc","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Record","pais":"Portugal","titulo":"Retroid Pocket 6 chega ao AliExpress prometendo recriar a era de ouro dos videogames portáteis","resumo":"O novo console portátil Retroid Pocket 6 foi lançado oficialmente no AliExpress, chamando a atenção de entusiastas de jogos retrô e tecnologia de hardware.\nO dispositivo combina um design nostálgico com especificações modernas capazes de emular com precisão diversos consoles clássicos.\nA novidade representa um passo significativo no mercado de consoles portáteis acessíveis, trazendo alto desempenho e tela de qualidade para os gamers.","link":"https://www.record.pt/indica/tecnologia/detalhe/a-retroid-pocket-6-chegou-ao-aliexpress-e-promete-recriar-a-era-de-ouro-dos-videojogos-portateis","categoria":"GADGETS","lang":"pt"},{"fonte":"Jornal de Negócios","pais":"Portugal","titulo":"Seguro defende que Portugal 'não pode se limitar a consumir tecnologia criada por outros'","resumo":"Em recente pronunciamento, Seguro enfatizou a importância estratégica de Portugal investir fortemente na produção e desenvolvimento de tecnologia própria.\nA declaração reforça o alerta de que a dependência de plataformas e soluções estrangeiras pode comprometer o futuro econômico e a autonomia digital do país.\nO líder defendeu políticas públicas que estimulem a criação de startups, a capacitação de talentos locais e o fortalecimento do ecossistema de inovação.","link":"https://www.jornaldenegocios.pt/economia/politica/detalhe/seguro-defende-que-portugal-nao-pode-limitar-se-a-consumir-tecnologia-criada-por-outros","categoria":"POLÍTICA DIGITAL","lang":"pt"},{"fonte":"Executive Digest","pais":"Portugal","titulo":"O AI Act: o verdadeiro desafio não está na tecnologia","resumo":"A implementação da nova regulamentação europeia de inteligência artificial, o AI Act, traz à tona discussões que vão além do aspecto puramente técnico.\nEspecialistas alertam que os maiores obstáculos residem na governança, na ética, na adaptação cultural das empresas e na conformidade jurídica das operações.\nA transição exigirá um esforço multidisciplinar para garantir que os sistemas de IA sejam seguros, transparentes e alinhados com os direitos fundamentais.","link":"https://executivedigest.sapo.pt/o-ai-act-o-verdadeiro-desafio-nao-esta-na-tecnologia/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Meteored Portugal","pais":"Portugal","titulo":"Ana Catarina Santos quer mostrar que existe um ponto em comum entre a ciência e a dança","resumo":"A pesquisadora Ana Catarina Santos apresenta um projeto inovador que busca integrar os conceitos da comunicação científica com a arte da dança contemporânea.\nA iniciativa visa democratizar o acesso ao conhecimento científico, utilizando a expressão corporal e o movimento como ferramentas de divulgação e ensino.\nO trabalho demonstra como abordagens interdisciplinares podem aproximar a população da ciência, tornando o aprendizado mais acessível, criativo e envolvente.","link":"https://www.tempo.pt/noticias/ciencia/ana-catarina-santos-quer-mostrar-nos-que-entre-a-ciencia-e-a-danca-ha-um-chao-comum.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Jornal Nordeste","pais":"Portugal","titulo":"Ministro da Agricultura defende formação e tecnologia para garantir o futuro da pastorícia","resumo":"O Ministro da Agricultura destacou o papel fundamental da modernização tecnológica e da capacitação técnica para a preservação e sustentabilidade da atividade pastoril.\nA introdução de ferramentas digitais, como monitoramento por GPS e gestão automatizada de rebanhos, busca atração de novos profissionais para o setor rural.\nA medida visa garantir a eficiência econômica, o bem-estar animal e a preservação das tradições agrícolas diante dos desafios climáticos atuais.","link":"https://jornalnordeste.com/noticias/ministro-da-agricultura-defende-formacao-e-tecnologia-para-garantir-futuro-da-pastoricia","categoria":"AGROTECH","lang":"pt"},{"fonte":"Diário As Beiras","pais":"Portugal","titulo":"Consórcio promove inovação, tecnologia e economia azul","resumo":"Um novo consórcio foi criado para impulsionar o desenvolvimento sustentável dos oceanos através do uso intensivo de tecnologia e inovação.\nA iniciativa foca em conectar centros de pesquisa, empresas e entidades públicas para promover soluções na área da economia azul, como energias renováveis e biotecnologia marinha.\nO projeto pretende posicionar a região como uma referência global no aproveitamento responsável e econômico dos recursos hídricos e marinhos.","link":"https://www.asbeiras.pt/consorcio-promove-inovacao-tecnologia-e-economia-azul/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Forbes Brasil","pais":"Brazil","titulo":"Artificial Intelligence Could Inject Nearly R$ 1 Trillion into the Brazilian Economy by 2030, Study Shows","resumo":"A study indicates that the massive adoption of artificial intelligence could inject about R$ 1 trillion into the Brazilian economy by 2030.\nThe report details the transformative impact of the technology across sectors such as industry, services, and agriculture.\nExperts emphasize that sustainable growth will require heavy investments in digital infrastructure and talent development.","link":"https://forbes.com.br/forbes-tech/2026/08/inteligencia-artificial-pode-injetar-quase-r-1-trilhao-na-economia-brasileira-ate-2030-aponta-estudo/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Metrópoles","pais":"Brazil","titulo":"Lula Announces Revival of 'Science Without Borders' Program Focused on Artificial Intelligence","resumo":"The government has announced the reinstatement of the Science Without Borders program, redirecting its main focus toward artificial intelligence scholarships.\nThe measure aims to train top-tier researchers and professionals at leading global technology institutions.\nThrough this initiative, the country seeks to address the shortage of specialists in the sector and drive national technological innovation.","link":"https://www.metropoles.com/brasil/lula-diz-que-vai-recriar-ciencia-sem-fronteiras-com-foco-em-ia","categoria":"SCIENCE AND TECHNOLOGY","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"Blocking Unwanted Calls: Anatel Authorizes Anti-Spam Tool and Considers Expanding System to All Customers","resumo":"Brazil's telecommunications regulator, Anatel, has authorized carriers to use anti-spam blocking systems against unwanted telemarketing calls.\nThe initiative aims to protect consumers from abusive harassment and reduce the risk of telephone fraud.\nThe regulatory agency is now evaluating the expansion of this protection to all telephone customers in Brazil.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/15/bloqueio-de-ligacoes-indesejadas-anatel-autoriza-anti-spam-e-estuda-levar-sistema-a-todos-os-clientes.ghtml","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"BDXP 2026 Strengthens the Artificial Intelligence Ecosystem in Manaus","resumo":"The 2026 edition of the BDXP event brought together experts and companies to strengthen the artificial intelligence ecosystem in Manaus.\nThe meeting showcased solutions aimed at preserving the Amazon and modernizing the region's Industrial Hub.\nThe initiative cements the Amazonian capital as an emerging hub for innovation and technology investment attraction.","link":"https://g1.globo.com/google/amp/am/amazonas/amazonia-negocios/noticia/2026/08/14/bdxp-2026-fortalece-o-ecossistema-de-inteligencia-artificial-em-manaus.ghtml","categoria":"INNOVATION","lang":"en"},{"fonte":"SEGS Portal Nacional","pais":"Brazil","titulo":"Discord and ANPD: Livestream Suspension Highlights the Role of Technology in Compliance","resumo":"Joint action between Brazil's National Data Protection Authority (ANPD) and the Discord platform resulted in the suspension of irregular livestreams.\nThis episode highlights the growing need to use advanced technological tools to ensure digital compliance.\nExperts emphasize the importance of continuous monitoring to guarantee data protection and user safety.","link":"https://www.segs.com.br/seguros/453594-discord-e-anpd-suspensao-de-live-reforca-o-uso-da-tecnologia-no-compliance","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"portaldocomercio.org.br","pais":"Brazil","titulo":"Tech Day Gathers Tech Giants at Event in the Museum of Tomorrow","resumo":"The Museum of Tomorrow hosted Tech Day, an event gathering major global companies and startups from the technology ecosystem.\nDiscussions covered advancements in automation, artificial intelligence, and digital sustainability strategies.\nThe meeting reinforced the importance of connecting innovation, social responsibility, and economic development in the country.","link":"https://portaldocomercio.org.br/acoes-institucionais/tech-day-reune-gigantes-da-tecnologia-em-evento-no-museu-do-amanha/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Mercosur","pais":"Brazil","titulo":"MERCOSUR Science, Technology, and Innovation Award Opens Applications for 2026","resumo":"Applications are now open for the 2026 MERCOSUR Science, Technology, and Innovation Award.\nThe prize recognizes outstanding research that offers practical solutions to South American regional challenges.\nWinners will receive financial incentives and visibility to drive the application of their discoveries in industry.","link":"https://www.mercosur.int/pt-br/premio-mercosul-de-ciencia-tecnologia-e-inovacao-abertas-as-inscricoes-para-2026","categoria":"SCIENCE","lang":"en"},{"fonte":"BeInCrypto","pais":"Brazil","titulo":"UNICEF Youth Challenge Blockchain Awards Circular Economy Initiative in Bahia and Confirms 2nd Edition","resumo":"A UNICEF-backed project has honored initiatives in Bahia that use blockchain technology applied to the circular economy.\nWinning solutions leverage decentralized networks to optimize the traceability and compensation of recyclable waste pickers.\nFollowing the positive results achieved in the first phase, organizers have confirmed a second edition.","link":"https://br.beincrypto.com/youth-challenge-blockchain-unicef-premia-economia-circular-na-bahia-e-confirma-2a-edicao/","categoria":"BLOCKCHAIN","lang":"en"},{"fonte":"Times Brasil | CNBC","pais":"United States","titulo":"AI Drives Up Tech and Energy Costs in the U.S. with Increases of Up to 4.2%","resumo":"The accelerated advancement of artificial intelligence has driven up demand for infrastructure and energy in the United States.\nThis surge has translated into price increases of up to 4.2% in the sector, directly impacting operating costs across the tech ecosystem.\nExperts predict inflationary pressures will persist as more data centers and supercomputers come online.","link":"https://timesbrasil.com.br/empresas-e-negocios/tecnologia-e-inovacao/i-a-encarece-tecnologia-e-energia-nos-eua-precos-sobem-ate-42-e-pressao-deve-continuar/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Radiology Business","pais":"United States","titulo":"Medicare Approves Additional Payment for Hospital Radiology AI Solution","resumo":"U.S. healthcare regulators have approved an add-on technology payment for hospital inpatient radiology AI solutions.\nThe measure aims to encourage the adoption of advanced diagnostic tools for hospitalized patients, improving the accuracy and speed of treatments.\nThis approval represents a key regulatory milestone for the expansion of artificial intelligence in high-complexity medicine.","link":"https://radiologybusiness.com/topics/artificial-intelligence/medicare-approves-new-technology-add-payment-inpatient-radiology-ai-solution","categoria":"HEALTH AND TECHNOLOGY","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"United States","titulo":"Volunteer Develops Machine Learning Tool to Identify Rare Clouds","resumo":"A community science project has resulted in the creation of a machine learning model capable of detecting rare cloud formations.\nThe solution automates the analysis of complex meteorological data, helping scientists better understand unusual atmospheric phenomena.\nThe initiative demonstrates the immense potential of machine learning and citizen science in accelerating global climate research.","link":"https://science.nasa.gov/get-involved/citizen-science/volunteer-develops-machine-learning-tool-to-identify-rare-clouds/","categoria":"SCIENCE","lang":"en"},{"fonte":"NASA (.gov)","pais":"United States","titulo":"Space Station Week Wraps Up with Robotics, Spacewalks, and Science","resumo":"The International Space Station crew wrapped up an intense workweek featuring advanced robotic systems operations and spacewalk reviews.\nAstronauts conducted various scientific experiments focused on biotechnology and materials science in microgravity.\nThese ongoing routines are crucial for validating essential technologies for future deep-space exploration missions.","link":"https://www.nasa.gov/blogs/spacestation/2026/08/14/week-ends-aboard-station-with-robotics-spacewalk-reviews-and-science/","categoria":"SPACE EXPLORATION","lang":"en"},{"fonte":"World Nuclear News","pais":"United States","titulo":"Nuclea Energy Acquires Moltex Energy Nuclear Technology Portfolio","resumo":"Nuclea Energy has announced the acquisition of Moltex Energy's complete portfolio of innovative technologies.\nThe transaction aims to strengthen capabilities in developing next-generation advanced nuclear reactors for clean energy generation.\nThis move drives the consolidation of sustainable and more efficient energy solutions in the global market.","link":"https://www.world-nuclear-news.org/articles/nuclea-energy-to-acquire-moltex-energy-technology-portfolio","categoria":"ENERGY","lang":"en"},{"fonte":"PA Department of Community \u0026 Economic Development (.gov)","pais":"United States","titulo":"Pennsylvania Administration Highlights Investments in Innovation Economy and Robotics at CMU","resumo":"Government representatives visited Carnegie Mellon University's Robotics Institute to announce new investments in innovation.\nThe state budget secured significant funding aimed at accelerating the local tech ecosystem and robotics startups.\nThe partnership seeks to position the region as a global hub for advanced automation and sustainable economic development.","link":"https://dced.pa.gov/newsroom/shapiro-administration-highlights-2026-27-budget-investments-in-innovation-economy-secured-in-2026-27-budget-during-visit-to-carnegie-foundry-at-cmus-robotics-institute-in-pittsburgh/","categoria":"INNOVATION","lang":"en"},{"fonte":"aamu.edu","pais":"United States","titulo":"Computer Science Student Recognized Among Thousands of Global Innovators","resumo":"A graduating computer science senior has received international recognition for contributions to technology projects.\nThe award selected him from thousands of participants worldwide who develop high-impact computing solutions.\nThis recognition highlights the emergence of new talent and the strength of academic training in driving technological innovation.","link":"https://www.aamu.edu/about/inside-aamu/news/computer-science-senior-recognized-among-thousands-of-global-innovators.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Greater Good: The Science of a Meaningful Life","pais":"United States","titulo":"When Scientists Admit Mistakes, It Means Science Is Working","resumo":"Self-correction is one of the fundamental pillars of the scientific method and the rigorous pursuit of true knowledge.\nWhen researchers review publications and acknowledge flaws in previous studies, the academic validation process strengthens public trust.\nThis methodological rigor ensures that science progresses based on transparent, reproducible, and increasingly precise data.","link":"https://greatergood.berkeley.edu/article/item/scientists_admit_mistakes_science_working_fauci_hearings","categoria":"SCIENCE","lang":"en"},{"fonte":"La Tribune","pais":"France","titulo":"Ban on social media for children under 15: Constitutional Council strikes down the measure","resumo":"France's Constitutional Council has struck down the bill that would have banned access to social media for minors under 15 without parental consent.\nThe institution argued that the measure disproportionately violated freedom of expression and the right of access to internet communication.\nWith this decision, the French government suffered a major legal defeat in its attempt to impose limits on young people's use of digital platforms.","link":"https://www.latribune.fr/article/la-tribune-dimanche/politique/14960871856251/interdiction-des-reseaux-sociaux-aux-moins-de-15-ans-le-conseil-constitutionnel-censure-la-mesure","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Le Figaro","pais":"France","titulo":"'An humiliation' for the government: political class reacts to the striking down of the social media ban for under-15s","resumo":"The Constitutional Council's overturning of the social media veto law for under-15s sparked a strong reaction in the French political arena.\nGovernment opponents categorized the judicial decision as a serious setback and criticized the legal fragility of the text approved in Parliament.\nIn response, allied leaderships are looking to articulate new legislative proposals to regulate the safety and privacy of adolescents in the digital environment.","link":"https://www.lefigaro.fr/conjoncture/un-camouflet-pour-le-gouvernement-la-classe-politique-reagit-a-la-censure-de-l-interdiction-des-reseaux-sociaux-aux-moins-de-15-ans-20260814","categoria":"SOCIAL MEDIA","lang":"en"},{"fonte":"日本経済新聞","pais":"United Kingdom","titulo":"Growing dissatisfaction in the UK over hosepipe bans to save water","resumo":"The imposition of hosepipe restrictions in the UK has generated widespread dissatisfaction among local residents.\nThe measure was adopted by utility companies to combat severe drought and critical drops in reservoir levels.\nExperts emphasize that extreme weather events will require new infrastructure and much more conscious consumption.","link":"https://www.nikkei.com/article/DGKKZO98175540V10C26A8EAC000/","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"Engineering and Technology Magazine","pais":"United Kingdom","titulo":"Geothermal roads could solve the pothole problem for good","resumo":"Researchers are testing the use of geothermal energy integrated into asphalt to put an end to the emergence of potholes on roads.\nThe system harnesses subterranean heat to keep pavement temperatures stable, preventing cracks caused by ice.\nThe innovation promises to reduce astronomical road maintenance costs and significantly increase traffic safety.","link":"https://eandt.theiet.org/2026/08/14/geothermal-roads-could-stop-pothole-problem-good-0","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Sky Sports","pais":"United Kingdom","titulo":"Tottenham and Inter Milan agree £30m deal for England defender Djed Spence","resumo":"Tottenham Hotspur and Inter Milan have agreed on a £30 million deal for defender Djed Spence.\nThe move represents a crucial strategic step for the clubs' squad overhaul ahead of next season.\nThe expressive investment reinforces the high valuation of young British football talent in the international market.","link":"https://www.skysports.com/football/news/11095/13572315/djed-spence-transfer-news-tottenham-and-inter-milan-agree-lb30m-deal-for-england-defender","categoria":"SPORTS","lang":"en"},{"fonte":"Computer Hoy","pais":"Spain","titulo":"The charm of vintage technology: most sought-after categories and the reasons behind a 'revival' that isn't just a trend","resumo":"The search for old technological devices, such as photographic cameras and retro consoles, has been growing consistently across different generations.\nThis movement goes beyond nostalgia, driven by the desire for digital disconnection and the search for products with greater durability.\nThe trend reinforces a new consumer behavior that values the simplicity and aesthetics of the past in modern daily life.","link":"https://computerhoy.20minutos.es/dispositivos/encanto-tecnologia-vintage-categorias-mas-demandadas-motivos-un-revival-que-no-es-una-moda-mas_7024253_0.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Computer Hoy","pais":"Spain","titulo":"China transforms deserts into green landscapes with the help of technology to accelerate ambitious plan","resumo":"China has been utilizing advanced technological innovations, such as satellite monitoring and soil biotechnology, to reforest vast desert areas in the country.\nThese initiatives seek to curb erosion, combat climate change, and ensure food security in its arid regions.\nThe project serves as a global model for accelerated environmental recovery through scientific and engineering solutions.","link":"https://computerhoy.20minutos.es/tecnologia/china-ya-ha-convertido-desiertos-paisajes-verdes-tecnologia-ha-acelerado-su-ambicioso-plan_7013871_0.html","categoria":"SCIENCE","lang":"en"},{"fonte":"MUNDIARIO","pais":"Spain","titulo":"Spain accelerates while Germany stagnates: how the European Union's economy is shifting","resumo":"The Spanish economy is showing expressive growth driven by tourism and domestic consumption, while Germany faces industrial stagnation.\nThis divergence reflects a dynamic shift in the economic balance within the European Union bloc.\nThe scenario generates new debates on fiscal policies and investment strategies to maintain financial stability on the continent.","link":"https://www.mundiario.com/articulo/economia/espana-acelera-mientras-alemania-estanca-asi-cambia-economia-union-europea/20260815054916435551.html","categoria":"BUSINESS","lang":"en"},{"fonte":"Chile en el Exterior","pais":"Spain","titulo":"Ambassador visits Chilean agricultural technology company in Madrid","resumo":"The ambassador made an institutional visit to an agricultural technology company of Chilean origin based in Madrid.\nThe meeting highlighted the strengthening of bilateral relations and the importance of developing sustainable agrotechnological solutions.\nThe initiative reinforces Madrid as a strategic hub for the expansion of startups and innovative companies in Europe.","link":"https://www.chile.gob.cl/espana/noticias/embajador-visita-empresa-chilena-de-tecnologia-agricola-en-madrid","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"EL PAÍS","pais":"Spain","titulo":"Eurozone economy grows 0.4% in the second quarter despite German weakening","resumo":"The Eurozone's Gross Domestic Product registered a 0.4% growth in the second quarter, beating moderate expectations.\nThe positive result was sustained by the performance of southern economies, such as Spain, mitigating the impacts of the German slowdown.\nThe indicator brings some relief to markets, although geopolitical and inflationary uncertainties still inspire caution among investors.","link":"https://elpais.com/economia/2026-08-14/la-economia-de-la-zona-euro-crecio-un-04-en-el-segundo-trimestre-pese-a-la-debilidad-alemana.html","categoria":"BUSINESS","lang":"en"},{"fonte":"dw.com","pais":"Germany","titulo":"Heat in Germany: inactive politicians and a helpless population","resumo":"Germany is facing increasingly intense heatwaves, exposing the lack of preparedness of public infrastructures and political inaction in the face of climate change.\nThe population suffers from direct impacts on health and quality of life, especially in urban centers without sufficient green areas.\nExperts are demanding urgent adaptation plans and concrete measures to protect the most vulnerable citizens over the coming decades.","link":"https://amp.dw.com/de/hitze-in-deutschland-politik-tatenlos-bev%C3%B6lkerung-machtlos/a-78370618","categoria":"CLIMATE","lang":"en"},{"fonte":"euractiv.com","pais":"Germany","titulo":"French Constitutional Council declares ban on social media for under-15s unconstitutional","resumo":"France's Constitutional Council struck down the law that aimed to ban access to social media for minors under 15 without parental authorization.\nThe decision was based on the violation of freedom of expression and communication guaranteed by the French Constitution.\nThe verdict reopens the global debate on digital regulation, privacy, and the protection of youth in the online environment.","link":"https://euractiv.com/de/news/franzosisches-verfassungsgericht-erklart-social-media-verbot-fur-unter-15-jahrige-fur-verfassungswidrig/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Spiegel","pais":"Germany","titulo":"Immigration sustains labor market and economy in eastern Germany, IW study shows","resumo":"A new study by the German Economic Institute (IW) highlights that the arrival of immigrant workers has been fundamental to mitigating labor shortages in the east of the country.\nPopulation aging makes the foreign workforce indispensable for the maintenance of regional services and industries.\nThe research emphasizes that attracting and integrating new talents are vital for Germany's continued economic sustainability.","link":"https://www.spiegel.de/wirtschaft/ostdeutschland-zuwanderung-stuetzt-laut-iw-studie-arbeitsmarkt-und-wirtschaft-a-e0504519-6676-483f-a674-d72fff5cefae","categoria":"ECONOMY","lang":"en"},{"fonte":"WIRED.jp","pais":"Japan","titulo":"Microsoft quantum development chief shrugs off skepticism from the scientific community","resumo":"The leader of Microsoft's quantum computing division maintains his confident stance in the face of doubts raised by various scientists regarding the feasibility of his technological approach.\nThe company continues channeling massive investments into the development of topological qubits to achieve unprecedented breakthroughs in data processing.\nThis determination highlights the fierce global race in the high-tech sector to lead the next computing revolution.\nThe scenario underscores the complex transition between risky scientific theories and the pursuit of high-impact commercial applications.","link":"https://wired.jp/article/microsoft-quantum-chief-majorana-results/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"Japan","titulo":"'Murakami saw his book come to life!': The Japanese company bringing science fiction to the stage","resumo":"An innovative theater company in Japan has taken on the challenge of adapting one of Haruki Murakami's most acclaimed science fiction works for the stage.\nThe production combines modern visual effects and immersive set design to recreate the surrealist and futuristic universe of the celebrated author.\nThe writer himself attended the project and praised the fidelity with which his artistic vision was translated into the theatrical format.\nThe initiative reinforces the strong dynamism of Japan's cultural industry in fusing literature, technology, and the performing arts.","link":"https://www.theguardian.com/stage/2026/aug/14/tatsuya-fujiwara-philippe-decoufle-haruki-murakami-hard-boiled-wonderland-and-the-end-of-the-world","categoria":"CULTURE","lang":"en"},{"fonte":"Indo-Pacific Defense FORUM","pais":"Japan","titulo":"Japan considers defense strengthening as a path to economic prosperity","resumo":"The Japanese government is integrating its national security strategy with economic development through heavy investments in the defense industry.\nThe new guideline aims to boost domestic technological innovation, strengthen the high-tech supply chain, and generate skilled jobs.\nThis approach marks a significant overhaul of the country's historical stance regarding the military-industrial and technological sectors.\nThe plan aims to position the country as an advanced development hub capable of sustaining long-term growth.","link":"https://ipdefenseforum.com/zh-hans/2026/08/%E6%97%A5%E6%9C%AC%E5%B0%86%E5%8A%A0%E5%BC%BA%E5%9B%BD%E9%98%B2%E5%BB%BA%E8%AE%BE%E8%A7%86%E4%B8%BA%E5%AE%9E%E7%8E%B0%E7%BB%8F%E6%B5%8E%E7%B9%81%E8%8D%A3%E4%B9%8B%E8%B7%AF/","categoria":"BUSINESS","lang":"en"},{"fonte":"Monitor Mercantil","pais":"China","titulo":"Chinese autonomous taxi technology expands operations to the European market","resumo":"Autonomous vehicle technology developed in China is reaching new milestones with its official entry into European markets.\nChinese companies seek to consolidate their global leadership in smart mobility through the expansion of robotaxi fleets.\nThe initiative faces local regulatory and competitive challenges, but promises to accelerate the adoption of autonomous driving on the continent.\nThe advancement signals the growing influence of China's automotive technology industry on an international scale.","link":"https://monitormercantil.com.br/tecnologia-chinesa-de-taxis-autonomos-chega-aos-mercados-europeus/","categoria":"AUTOMATION","lang":"en"},{"fonte":"Globo","pais":"China","titulo":"Chinese farmer loses 25 acres of crops after following AI advice","resumo":"A farmer in China suffered heavy losses after losing 25 acres of his crop following incorrect recommendations provided by an AI.\nThe case raised red flags regarding the risks of blind dependence on artificial intelligence tools in sensitive sectors like agriculture.\nExperts highlight the urgent need for human validation and regulation for the use of algorithms in crop management.\nThe incident reinforces the importance of data accuracy when integrating emerging technologies into the field.","link":"https://revistagalileu.globo.com/tecnologia/noticia/2026/08/agricultor-chines-perde-10-hectares-de-plantacao-apos-seguir-conselho-de-ia.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"新浪财经","pais":"China","titulo":"Jiangsu province seeks breakthroughs in large-capacity reusable rockets","resumo":"Jiangsu province has announced plans to master critical technologies in the development of large-capacity reusable rockets.\nThe project aims to strengthen local validation infrastructure for the launch and recovery of spacecraft.\nThe initiative seeks to position the region as a strategic hub in China's growing commercial aerospace industry.\nThe advancement will boost the country's technological self-sufficiency in large-scale space missions.","link":"https://finance.sina.cn/2026-08-14/detail-ininhhrn4158668.d.html?vt=4\u0026cid=76729\u0026node_id=76729","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"新浪财经","pais":"China","titulo":"Chinese regions compete for leadership in AI-driven 'token economy'","resumo":"Several Chinese provinces, led by Beijing, Guangdong, and Jiangsu, have launched a race to dominate the so-called 'token economy'.\nThe term refers to the data processing ecosystem and computing power essential for large AI language models.\nThe move aims to establish regional guidelines and infrastructure to monetize and optimize artificial intelligence-based services.\nThe dispute reflects the Chinese government's strategic prioritization of next-generation digital economy infrastructure.","link":"https://finance.sina.cn/2026-08-14/detail-ininfvzx9457117.d.html?vt=4\u0026cid=76729\u0026node_id=76729","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"京报网","pais":"China","titulo":"China cuts green technology costs and accelerates global low-carbon transition","resumo":"China continues to significantly reduce the production and deployment costs of clean technologies, benefiting the global energy transition.\nThe country has expanded the manufacturing of solar panels, batteries, and wind turbines, making these solutions more accessible to emerging markets.\nThis drop in prices allows various nations to achieve environmental goals with more economically viable investments.\nChina's effort solidifies its central position in the sustainable economy supply chain of the future.","link":"https://news.bjd.com.cn/2026/08/15/11916897.shtml","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"peopleapp.com","pais":"China","titulo":"2026 Future Science Prize edition announced in China","resumo":"The 2026 edition of the Future Science Prize has been announced, a prestigious honor internationally known as the 'Chinese Nobel'.\nThe award recognizes scientific research of great global impact carried out by scientists from Greater China in fields such as physics and mathematics.\nThe event aims to encourage fundamental scientific advancement and attract new talent to basic research in the region.\nThe announcement reaffirms the country's commitment to becoming a global powerhouse in innovation and scientific discovery.","link":"https://www.peopleapp.com/rmharticle/30052928625","categoria":"SCIENCE","lang":"en"},{"fonte":"新浪财经","pais":"China","titulo":"Scientists debunk myths and reveal the correct way to charge your cell phone battery","resumo":"Researchers from the Institute of Physics of the Chinese Academy of Sciences have demystified common habits regarding smartphone battery recharging.\nThe study clarifies how electrolytes and chemical components react to the habit of keeping the device plugged in continuously.\nScientists point out ideal practices to extend the lifespan of lithium-ion batteries without damaging the device's hardware.\nThese guidelines aim to educate consumers on the safe and efficient use of mobile technology in daily life.","link":"https://finance.sina.cn/2026-08-14/detail-ininhtfh4096407.d.html?vt=4","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Telegraph","pais":"China","titulo":"US fines British defense firm for improper technology transfer to China","resumo":"The United States government has levied a $36 million fine against a UK defense sector giant.\nThe sanction came after an investigation proved the unauthorized transfer of sensitive data and technologies to Chinese entities.\nThe case highlights the growing stringency in enforcing export controls on dual-use military technology.\nThe measure reflects rising global geopolitical tensions related to cybersecurity and technological sovereignty.","link":"https://www.telegraph.co.uk/business/2026/08/14/us-fines-british-defence-giant-36m-passing-technology-china/","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"India@80: The 8 themes defining the country's artificial intelligence trajectory","resumo":"India has consolidated its position as one of the leading global hubs in the development and adoption of Artificial Intelligence.\nThe national strategy ranges from strengthening data infrastructure to massively upskilling the local workforce.\nAdditionally, government initiatives and private partnerships seek to apply AI solutions in crucial sectors like healthcare, agriculture, and education.\nThis movement drives technological innovation and projects the country as a world benchmark in accessible, large-scale digital solutions.","link":"https://www.moneycontrol.com/news/technology-startup/ai-edge-newsletter/india-80-8-themes-defining-its-ai-journey/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"hindustantimes.com","pais":"India","titulo":"The next frontier of Indian science on the 80th Independence Day","resumo":"As part of national celebrations, leaders and researchers highlighted new directions for India's scientific advancement.\nThe country plans to intensify investments in advanced biotechnology, space exploration, and quantum physics research over the coming years.\nThe core objective is to reduce external technological dependence and solve internal socioeconomic challenges through cutting-edge innovation.\nThis strategic vision reinforces the role of the scientific community in developing sovereign and sustainable technologies.","link":"https://www.hindustantimes.com/opinion/the-next-frontier-for-indian-science-on-the-80th-independence-day-101786764768490.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Business Standard","pais":"India","titulo":"India opens nuclear power sector to foreign reactor technologies","resumo":"The Indian government has announced the opening of its nuclear sector to the adoption of internationally proven reactor technologies.\nThe move aims to accelerate the country's energy transition and meet the growing electricity demand of its tech industry.\nThrough global partnerships, India intends to rapidly expand its clean generation capacity and reduce its national carbon footprint.\nThis initiative represents a historic shift in energy policies, attracting strategic investments and cutting-edge know-how.","link":"https://www.business-standard.com/industry/news/india-opens-nuclear-power-sector-to-proven-foreign-reactor-technology-126081500049_1.html","categoria":"ENERGY","lang":"en"},{"fonte":"ANI News","pais":"India","titulo":"India's internet economy headed for sustained growth, Morgan Stanley says","resumo":"A Morgan Stanley report indicates a strong pace of expansion for India's digital ecosystem in the coming years.\nE-commerce logistics, food delivery, and digital financial services sectors continue to lead this upward trajectory.\nThe advancement of mobile infrastructure and the rise in online consumption are driving continuous investments in the internet economy.\nThis scenario consolidates India as one of the most dynamic and attractive digital markets for global investors.","link":"https://www.aninews.in/news/business/indias-internet-economy-set-for-sustained-growth-e-commerce-logistics-food-delivery-to-see-strong-expansion-morgan-stanley20260815103513","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"AI and technology dominate Prime Minister Modi's Independence Day speech","resumo":"In his official address, the prime minister emphasized digital transformation as the engine of national progress.\nArtificial Intelligence and the transition to renewable energies were pointed out as central priorities of the government agenda.\nThe speech underscored the importance of equipping youth with digital skills to ensure economic competitiveness.\nThe strategy reinforces the country's commitment to sustainability and leadership in the global tech ecosystem.","link":"https://www.moneycontrol.com/news/india/ai-technology-dominate-modi-s-shortest-i-day-speech-in-four-years-green-growth-youth-gain-ground-14006224.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ANI News","pais":"India","titulo":"Voltz Mobility accelerates green mobility in India with Japanese technology","resumo":"Voltz Mobility has entered into a strategic collaboration with Japanese partners to boost the electric vehicle sector in India.\nThe partnership will bring advanced technological innovations in batteries and clean propulsion systems to the Indian market.\nThe initiative supports national goals for emission reduction and the transition to sustainable transport routes.\nThe project is expected to accelerate electric mobility infrastructure and lower the cost of access to clean vehicles in the country.","link":"https://www.aninews.in/news/business/voltz-mobility-accelerates-indias-green-mobility-revolution-with-japanese-technology-collaboration20260815104820","categoria":"INNOVATION","lang":"en"},{"fonte":"hindustantimes.com","pais":"India","titulo":"Modi highlights blue and green economy and drives deep-sea exploration","resumo":"The government of India has announced new investments aimed at the sustainable development of ocean and renewable resources.\nThe initiative focuses on the scientific exploration of deep waters for mineral mapping and
