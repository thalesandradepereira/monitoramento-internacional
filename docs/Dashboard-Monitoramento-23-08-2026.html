"China","titulo":"Tesla's Flush Door Handles Trigger Recall of 4 Million Cars in China","resumo":"Tesla has announced a recall of approximately four million vehicles in China due to operational and safety flaws in its flush door handles.\nThe decision comes amid intense regulatory scrutiny over technological features and vehicular automation in the country.\nOwners reported access difficulties and risks during emergencies, pressuring the manufacturer to update the system.\nThe case reinforces the technological compliance challenges faced by global companies in the competitive Chinese automotive market.","link":"https://economia.uol.com.br/noticias/estadao-conteudo/2026/08/22/tesla-e-montadoras-chinesas-fazem-recall-de-mais-de-4-milhoes-de-veiculos-por-falha-em-macaneta.htm","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"ｄメニューニュース","pais":"China","titulo":"China's Ministry of Finance to Continuously Expand Science and Technology Investments Over the Next 5 Years","resumo":"China's Ministry of Finance has announced a strategic plan to increase public funding in science and technology over the next five years.\nThe goal is to accelerate the country's technological self-sufficiency and strengthen basic research in critical areas such as semiconductors and AI.\nThe measure seeks to guarantee predictable and robust resources for universities, research centers, and innovative companies.\nThrough this incentive policy, Beijing aims to solidify its scientific sovereignty in the face of growing international pressures.","link":"https://topics.smt.docomo.ne.jp/amp/article/recordchina/world/recordchina-RC_990351","categoria":"SCIENCE","lang":"en"},{"fonte":"ncsti.gov.cn","pais":"China","titulo":"China Publishes First Landmark Cases of Artificial Intelligence Applied to Scientific Research","resumo":"The Chinese government has released its first official list of exemplary cases of Artificial Intelligence applied to scientific research.\nThe selected projects encompass discoveries in structural biology, materials physics, computational chemistry, and meteorology.\nThe initiative aims to standardize and accelerate the adoption of AI models as fundamental partners for scientists in the laboratory.\nThis strategy solidifies the country's commitment to leading the methodological revolution of modern science driven by algorithms.","link":"https://www.ncsti.gov.cn/kjdt/xwjj/202608/t20260822_254191.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"人民网","pais":"China","titulo":"Opening of the Second World Humanoid Robot Games","resumo":"The second edition of the World Humanoid Robot Games has kicked off in China, bringing together hundreds of teams and high-performance prototypes.\nThe event tests the dynamic capabilities of robots in sporting events, agility, locomotion, and real-time decision-making.\nBeyond the competition, the tournament serves as an open laboratory to evaluate the performance of control algorithms and new actuators.\nThe conference is capturing global attention by demonstrating the rapid evolution of robotics engineering and applied artificial intelligence.","link":"http://finance.people.com.cn/n1/2026/0823/c1004-40784347.html","categoria":"EVENTS","lang":"en"},{"fonte":"finance.sina.com.cn","pais":"China","titulo":"China's High-Tech Industry Attracts 32.7% Increase in Foreign Investment in July","resumo":"China's high-tech sector recorded a 32.7% jump in attracting foreign capital compared to the same previous period.\nThe data reflects the continued confidence of international investors in China's advanced manufacturing capacity, infrastructure, and market.\nSegments such as electronic equipment, semiconductor manufacturing, and biotechnology led the influx of new investments.\nThis growth demonstrates that despite geopolitical tensions, China remains an indispensable hub for global innovation.","link":"https://finance.sina.cn/2026-08-23/detail-iniphnkv0617771.d.html?vt=4\u0026cid=76729\u0026node_id=76729","categoria":"BUSINESS","lang":"en"},{"fonte":"Investment Guru India","pais":"India","titulo":"India's Space Economy Expected to Reach Between $40 and $45 Billion Over the Next Decade","resumo":"India's space economy is projected to expand significantly over the next ten years, driven by investments.\nWith the advancement of startups in the sector and local government support, the country aims to establish itself as a global hub for astronautical innovation.\nThis projection highlights the growing importance of space technology in national economic and scientific development.","link":"https://investmentguruindia.com/newsdetail/india-s-space-economy-projected-to-reach-400-45-billion-over-next-decade963236","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"ET Government","pais":"India","titulo":"India Can Build a $44 Billion Space Economy by 2033, Says ISpA Director General","resumo":"The Director-General of the Indian Space Association pointed out that the country has the potential to reach $44 billion in the sector.\nThe strategy involves strengthening international partnerships, attracting private capital, and boosting national technological infrastructure.\nThe target solidifies the nation's commitment to turning space exploration into a long-term growth engine.","link":"https://government.economictimes.indiatimes.com/news/defence/india-can-build-a-44-billion-space-economy-by-2033-ispa-dg-lt-gen-ak-bhatt/133433332","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"Deccan Herald","pais":"India","titulo":"March for Science in India Demands Removal of Unscientific Content from School Curricula","resumo":"Protesters and academics gathered in Bengaluru to defend the integrity of science education in Indian schools.\nThe movement demands that topics lacking empirical proof be completely removed from the country's official educational materials.\nThe initiative aims to strengthen evidence-based education and protect the training of future generations of researchers.","link":"https://www.deccanherald.com/india/karnataka/bengaluru/bengaluru-india-march-for-science-wants-unscientific-content-out-of-curricula-4120992","categoria":"SCIENCE","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"India and Japan Agree to Deepen Partnership in Defense Technology","resumo":"India and Japan have signed a new agreement to strengthen bilateral cooperation in defense technology and maritime security.\nThe partnership envisions the sharing of innovations, joint research, and the development of new solutions for the sector.\nThe treaty reinforces regional stability in the Indo-Pacific and technological advancement in defense for both nations.","link":"https://newsonair.gov.in/defence-minister-rajnath-singh-japanese-counterpart-shinjiro-koizumi-co-chair-india-japan-defence-ministers-meeting/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"NDTV","pais":"India","titulo":"Preventive Healthcare is a Matter of National Economic Security, Says Indian Minister","resumo":"India's Defense Minister stressed that preventive medicine and healthcare innovation are vital for the country's stability.\nAccording to the statement, investing in population well-being reduces government costs and protects national productivity.\nThe approach highlights the urgency of integrating healthcare technologies with socioeconomic development strategies.","link":"https://www.ndtv.com/india-news/matter-of-national-economy-security-rajnath-singh-on-preventive-healthcare-11946098","categoria":"HEALTH","lang":"en"},{"fonte":"The Hindu","pais":"India","titulo":"Jipmer Resource Center Upgraded to Center of Excellence for Health Technology Assessment","resumo":"The resource hub of the Jipmer institute has been upgraded to a Center of Excellence for medical technology assessment in India.\nThe move will allow for a more rigorous, data-driven analysis of new treatments, devices, and healthcare equipment.\nWith the measure, the center aims to optimize public resource allocation and accelerate the adoption of innovations in the healthcare sector.","link":"https://www.thehindu.com/news/cities/puducherry/jipmers-resource-hub-upgraded-as-centre-of-excellence-for-health-technology-assessment/article71377273.ece","categoria":"INNOVATION","lang":"en"},{"fonte":"PIB","pais":"India","titulo":"CSIR-NIScPR Celebrates 75th Platinum Jubilee of Scientific Journal 'Vigyan Pragati'","resumo":"CSIR-NIScPR held a ceremony to commemorate the 75th anniversary of the flagship scientific publication 'Vigyan Pragati'.\nThe magazine plays a fundamental role in popularizing science and providing the public with access to technical knowledge.\nThe celebration reinforces the historic impact of disseminating scientific research for social and educational inclusion in the country.","link":"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2302401","categoria":"SCIENCE","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"India Hosts BRICS Sports Ministers Meeting in Visakhapatnam","resumo":"India is hosting the BRICS Sports Ministers meeting in Visakhapatnam to discuss strategic partnerships in the sector.\nThe event aims to promote international cooperation, knowledge exchange, and investments in infrastructure.\nThe meeting highlights the relevance of multilateral forums in aligning public policies and global trends.","link":"https://newsonair.gov.in/india-to-host-brics-sports-ministers-meeting-at-visakhapatnam-in-andhra-pradesh-today/","categoria":"EVENTS","lang":"en"},{"fonte":"Link To Leaders","pais":"Portugal","titulo":"Must Read: Leading the Quantum Economy","resumo":"The advancement of quantum computing is redefining the global landscape of innovation and economic geopolitics.\nThe work analyzes the strategic impacts of this disruptive technology on the financial market, information security, and industrial competitiveness.\nUnderstanding this new paradigm is essential for leaders and governments seeking prominence in the next technological revolution.\nThe book serves as an essential guide to navigating the opportunities and challenges brought by the quantum era.","link":"https://linktoleaders.com/a-ler-liderar-a-economia-quantica-rui-ribeiro/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Meteored Portugal","pais":"Portugal","titulo":"Neither Lightning Nor Bad Luck: Science Reveals Humans Cause Up to 97% of Wildfires","resumo":"Recent scientific studies point to human action as the primary cause of the overwhelming majority of wildfires.\nContrary to the popular belief regarding natural causes like lightning, negligence and uncontrolled burning dominate global statistics.\nThe data reinforces the urgent need for awareness campaigns, rigorous enforcement, and effective public prevention policies.\nThe research shows that mitigating fire depends directly on changes in behavior and environmental management by societies.","link":"https://www.tempo.pt/noticias/ciencia/nem-raios-nem-azar-ciencia-revela-que-o-ser-humano-provoca-ate-97-dos-incendios-florestais.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Pplware","pais":"Portugal","titulo":"Can We Live to Be 200? Science Finds New Limit for Human Life","resumo":"Researchers continue to investigate the biological limits of longevity and the possibilities of extending human life.\nAdvanced studies in genetics, biotechnology, and regenerative medicine are challenging barriers previously considered unbreakable by biology.\nAlthough theories suggest a ceiling for cellular survival, therapeutic advances promise to postpone aging with quality.\nThe debate raises crucial ethical, social, and economic questions regarding the impact of an increasingly long-lived global population.","link":"https://pplware.sapo.pt/ciencia/poderemos-viver-ate-aos-200-anos-ciencia-encontra-um-novo-limite-para-a-vida-humana/","categoria":"SCIENCE","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Palace Renovation in Spain Features Portuguese Technology in Bathrooms","resumo":"The restoration of a historic Spanish palace incorporated innovative technological solutions developed in Portugal.\nThe project highlights the advancement of the construction and plumbing sector toward water efficiency and smart automation.\nThis cross-border collaboration highlights the export capacity of high-end Portuguese engineering and design.\nThe initiative unites the preservation of historic architectural heritage with the sustainability and modernity of contemporary technologies.","link":"https://sapo.pt/artigo/renovacao-de-palacio-em-espanha-conta-com-tecnologia-portuguesa-nas-casas-de-banho-6a89e8389b79793efa309dcc","categoria":"INNOVATION","lang":"en"},{"fonte":"The Portugal News","pais":"Portugal","titulo":"Lawsuits Against Tech Giants Over Child Safety Continue","resumo":"Major tech companies continue to face a wave of lawsuits focused on protecting children and adolescents.\nThe allegations involve the addictive design of platforms, exposure to inappropriate content, and a lack of effective age-verification mechanisms.\nRegulators and parent groups are pushing for harsher sanctions and demands for greater transparency in social media algorithms.\nThe scenario points to a global regulatory shift that could redefine the operations and responsibilities of Big Tech in the digital environment.","link":"https://www.theportugalnews.com/pt/noticias/2026-08-22/continuam-os-processos-judiciais-contra-os-gigantes-da-tecnologia-relativos-a-seguranca-infantil/1073968","categoria":"BIG TECH","lang":"en"},{"fonte":"Dinheiro Vivo","pais":"Portugal","titulo":"Securitas Projects 151 Million Euro Revenue and Reinforces Focus on Technology","resumo":"Security multinational Securitas projects closing the year with expressive revenues estimated at 151 million euros.\nThe positive financial result reflects the strategic transition from traditional services to technology- and artificial intelligence-based solutions.\nThe company seeks to expand advanced monitoring systems, predictive data analytics, and the automation of surveillance operations.\nThis investment consolidates the relevance of digital innovation in the global asset and corporate security market.","link":"http://dinheirovivo.dn.pt/empresas/securitas-estima-fechar-o-ano-com-faturao-a-rondar-os-151-milhes-de-euros-e-refora-aposta-na-tecnologia","categoria":"BUSINESS","lang":"en"},{"fonte":"Jornal do Algarve","pais":"Portugal","titulo":"'Unearthing the Past' Brings Science and Archaeology to Santa Rita","resumo":"The community and scientific project 'Unearthing the Past' promoted archaeological excavations in the Santa Rita region.\nThe initiative brings the local population closer to historical knowledge through workshops, guided tours, and hands-on field activities.\nIn addition to revealing relevant heritage findings, the event encourages the preservation of cultural memory and science-based tourism.\nThe action demonstrates how archaeological outreach can integrate education, science, and social engagement in regional communities.","link":"https://jornaldoalgarve.pt/desenterrar-o-passado-leva-ciencia-e-arqueologia-a-santa-rita/","categoria":"SCIENCE","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Vila de Rei: Living Science in Summer Promotes Sun Observation at River Beach","resumo":"The Living Science in Summer initiative organized a public solar observation session at Penedo Furado River Beach in Vila de Rei.\nUsing telescopes with proper filters, experts taught the public how to identify sunspots and phenomena of the star's dynamics.\nThe event combines leisure tourism in natural settings with educational activities accessible to all ages.\nThe action reinforces the importance of popularizing astronomy and encouraging scientific curiosity during the vacation period.","link":"https://sapo.pt/artigo/vila-de-rei-ciencia-viva-no-verao-leva-observacao-do-sol-a-praia-fluvial-do-penedo-furado-6a896d389b79793efa1dc3e7","categoria":"SCIENCE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
</body>
