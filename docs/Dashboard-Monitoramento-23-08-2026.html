  const data = [{"fonte":"Times Brasil | CNBC","pais":"Brasil","titulo":"Menino de 10 anos cria 'nariz eletrônico' de I.A e vence prêmio de invenção no Vale do Silício","resumo":"Um garoto de apenas dez anos desenvolveu um dispositivo capaz de identificar odores por meio de inteligência artificial.\nA invenção foi premiada em uma prestigiada competição de inovação realizada no Vale do Silício, nos Estados Unidos.\nO projeto demonstra como o acesso precoce às ferramentas de tecnologia pode gerar soluções criativas para o mercado.\nEssa conquista reforça o papel da educação tecnológica no incentivo a novos talentos ao redor do mundo.","link":"https://timesbrasil.com.br/empresas-e-negocios/tecnologia-e-inovacao/invencao-pode-auxiliar-na-deteccao-de-drogas-e-alimentos/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Apple Intelligence: veja cinco funções do iPhone que serão automatizadas","resumo":"A Apple apresentou novas funcionalidades baseadas em inteligência artificial que prometem transformar o uso do iPhone.\nO recurso Apple Intelligence trará automações inteligentes para tarefas diárias, como escrita e edição de fotos.\nAlém disso, a atualização visa otimizar a assistente Siri e aprimorar o gerenciamento de notificações pessoais.\nEssas mudanças representam um passo significativo da empresa na corrida pelo domínio da inteligência artificial.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/08/22/apple-intelligence-veja-cinco-funcoes-do-iphone-que-serao-automatizadas.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Pesquisador da USP usa a ciência para diagnóstico precoce de autismo","resumo":"Um cientista da Universidade de São Paulo desenvolveu um método inovador focado no diagnóstico do autismo.\nA pesquisa utiliza marcadores científicos e análise de dados para identificar sinais do transtorno ainda na infância.\nA detecção precoce é fundamental para iniciar intervenções terapêuticas no momento mais adequado do desenvolvimento.\nO avanço fortalece o papel da ciência brasileira na criação de soluções com grande impacto social e de saúde.","link":"https://g1.globo.com/google/amp/sp/sao-carlos-regiao/videos-jornal-da-eptv-2-edicao/video/gente-daqui-pesquisador-da-usp-usa-a-ciencia-para-diagnostico-precoce-de-autismo-14893604.ghtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Canal Rural","pais":"Brasil","titulo":"Tecnologia brasileira transforma madeira em fibra para alimentação de suínos","resumo":"Pesquisadores brasileiros desenvolveram um processo tecnológico para converter resíduos de madeira em nutrição animal.\nA nova fibra sustentável atua como um suplemento alimentício eficiente para a criação de suínos na agroindústria.\nA técnica promove a economia circular ao reaproveitar subprodutos da indústria madeireira de forma inteligente.\nEssa inovação promete reduzir custos de produção e diminuir a pegada ambiental do setor agropecuário nacional.","link":"https://www.canalrural.com.br/aves-e-suinos/viu-esta-tecnologia-brasileira-transforma-madeira-em-fibra-para-alimentacao-de-suinos/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Assine Abril","pais":"Brasil","titulo":"Proteína demais pode atrapalhar a longevidade? O que a ciência já descobriu","resumo":"Estudos científicos recentes investigam os impactos do consumo excessivo de proteínas na saúde e no envelhecimento.\nEmbora essencial para a massa muscular, a ingestão acima do recomendado pode ativar vias celulares associadas ao desgaste.\nPesquisadores alertam para a importância do equilíbrio nutricional ajustado às necessidades individuais de cada organismo.\nAs descobertas ajudam a redefinir estratégias de longevidade e hábitos alimentares baseados em evidências robustas.","link":"https://boaforma.abril.com.br/alimentacao/proteina-demais-longevidade/","categoria":"SAÚDE","lang":"pt"},{"fonte":"Fast Company Brasil","pais":"Brasil","titulo":"O jeans azul ganha uma alternativa mais sustentável para a indústria têxtil","resumo":"A indústria da moda está adotando novas técnicas e insumos para substituir o tingimento tradicional do tecido jeans.\nO processo de fabricação convencional é amplamente conhecido pelo alto consumo de água e uso de produtos químicos.\nA alternativa ecológica reduz o impacto ambiental mantendo a durabilidade e o aspecto estético característico do produto.\nEssa transformação reflete a crescente demanda do mercado global por processos industriais mais limpos e éticos.","link":"https://fastcompanybrasil.com/impacto/o-jeans-azul-esta-ganhando-uma-alternativa-mais-sustentavel/","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Programa nuclear da Marinha lidera gasto militar brasileiro","resumo":"O desenvolvimento de tecnologia nuclear pela Marinha do Brasil figura como o maior investimento da defesa nacional.\nO projeto abrange a construção de um submarino de propulsão nuclear e o domínio do ciclo de combustível no país.\nA iniciativa busca garantir a soberania territorial e impulsionar a inovação tecnológica no setor de defesa militar.\nEspecialistas analisam os desafios orçamentários e estratégicos para a conclusão contínua do empreendimento.","link":"https://www1.folha.uol.com.br/poder/2026/08/programa-nuclear-da-marinha-lidera-gasto-militar-brasileiro.shtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Guarany Junior","pais":"Brasil","titulo":"Fapespa lança chamada para apoiar eventos científicos na Semana Nacional de Ciência e Tecnologia","resumo":"A Fundação Amazônia de Amparo a Estudos e Pesquisas anunciou edital de fomento para apoiar eventos acadêmicos.\nA iniciativa integra as ações da Semana Nacional de Ciência e Tecnologia para promover a disseminação do conhecimento.\nO objetivo principal é incentivar a produção científica e aproximar a comunidade das inovações regionais do Pará.\nO investimento visa fortalecer a divulgação científica e engajar pesquisadores e estudantes no ecossistema local.","link":"https://www.guaranyjunior.com.br/2026/08/23/fapespa-lanca-chamada-para-apoiar-eventos-cientificos-na-semana-nacional-de-ciencia-e-tecnologia/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Balada IN","pais":"Estados Unidos","titulo":"Nova York supera Vale do Silício com 394 mil profissionais e redesenha mapa da tecnologia nos EUA","resumo":"A cidade de Nova York alcançou o marco de 394 mil profissionais no setor de tecnologia, consolidando-se como o novo polo dominante nos Estados Unidos.\nEssa movimentação representa uma mudança significativa no ecossistema de inovação, superando historicamente a hegemonia do Vale do Silício.\nO crescimento impulsiona a atração de novos investimentos, startups e grandes corporações globais para a região metropolitana nova-iorquina.","link":"https://www.portalin.com.br/negocios/nova-york-supera-vale-do-silicio-com-394-mil-profissionais-e-redesenha-mapa-da-tecnologia-nos-eua/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Estados Unidos","titulo":"Anthropic pode captar mais de US$ 100 bilhões na Bolsa e superar SpaceX em oferta inicial de ações","resumo":"A startup de inteligência artificial Anthropic projeta uma oferta pública inicial de ações que pode ultrapassar os US$ 100 bilhões de valorização.\nO movimento promete superar marcas históricas de gigantes da tecnologia e da exploração espacial, como a própria SpaceX de Elon Musk.\nA iniciativa reflete o aquecimento acelerado do mercado global e a corrida financeira para dominar o setor de IA generativa.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/08/22/anthropic-pode-captar-mais-de-us-100-bi-na-bolsa-e-superar-spacex-em-oferta-inicial-de-acoes.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"TradingKey","pais":"Estados Unidos","titulo":"Goldman Sachs prevê que economia espacial global atinja US$ 1,8 trilhão até 2035","resumo":"Relatório do Goldman Sachs aponta que a economia espacial global deve movimentar até US$ 1,8 trilhão ao longo da próxima década.\nO avanço da exploração comercial, tecnologia de satélites e turismo espacial surge como o principal motor desse crescimento financeiro.\nO ecossistema atrai a atenção de investidores globais que buscam posicionamento estratégico em empresas promissoras do setor aeroespacial.","link":"https://www.tradingkey.com/pt/analysis/stocks/us-stocks/262125986-goldman-sachs-space-economy-1-8-trillion-2035-stocks-worth-watching-tradingkey","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ScienceAlert","pais":"Estados Unidos","titulo":"Ciência analisa se o excesso de fotos ajuda ou prejudica a memória humana","resumo":"Estudos científicos recentes investigam o impacto comportamental e cognitivo de registrar fotos constantemente no cotidiano.\nPesquisadores analisam se o hábito de fotografar tudo transfere a responsabilidade da lembrança para o dispositivo, enfraquecendo a memória.\nA discussão traz insights valiosos sobre como o uso excessivo da tecnologia altera a forma como o cérebro processa e armazena memórias.","link":"https://www.sciencealert.com/science-weighs-in-on-whether-all-those-photos-are-helping-or-hurting-your-memory","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"WSOC TV","pais":"Estados Unidos","titulo":"Tecnologia de pagamento por aproximação chega às redes Walmart e Sam’s Club","resumo":"As gigantes do varejo Walmart e Sam's Club anunciaram a implementação oficial do pagamento por aproximação em suas lojas nos Estados Unidos.\nA medida responde à forte demanda dos consumidores por métodos de checkout mais rápidos, práticos e integrados aos smartphones.\nEssa atualização tecnológica moderniza a experiência de compra física e alinha a operação das varejistas às tendências globais do setor.","link":"https://www.wsoctv.com/news/local/tap-to-pay-technology-coming-walmart-sams-club/5FNMIQT6X5ENJFV23REIWU4CPI/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Devdiscourse","pais":"Estados Unidos","titulo":"Destaques esportivos: Geno Smith se destaca e robótica quebra recordes mundiais","resumo":"Avanços recentes na área de robótica permitiram que novos robôs superassem recordes mundiais de velocidade e precisão física.\nAo mesmo tempo, o cenário esportivo tradicional norte-americano registrou grandes performances individuais, como a do quarterback Geno Smith.\nA convergência entre esporte e alta tecnologia demonstra o impacto crescente da automação em métricas de desempenho extremo.","link":"https://www.devdiscourse.com/article/sports-games/3966666-sports-highlights-geno-smith-shines-and-robotics-break-world-records","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"MLB.com","pais":"Estados Unidos","titulo":"Visualizando a tacada de Daulton Varsho por meio de tecnologia de rastreamento","resumo":"A análise do desempenho esportivo ganhou novos patamares com o uso de sensores de rastreamento avançado para mapear a tacada de Daulton Varsho.\nA tecnologia captura dados biométricos e de velocidade em tempo real, permitindo ajustes de altíssima precisão no swing do atleta.\nA inovação exemplifica como a coleta analítica de dados está transformando o treinamento e a estratégia no esporte profissional.","link":"https://www.mlb.com/astros/video/visualizing-daulton-varsho-s-swing-using-bat-tracking-technology-x8513","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Brasil de Fato","pais":"Estados Unidos","titulo":"Justiça dos EUA derruba ato de Trump que suspendia vistos de residência para brasileiros e cidadãos de outros 74 países","resumo":"A Justiça federal dos Estados Unidos invalidou a medida restritiva que bloqueava a concessão de vistos de residência para cidadãos de 75 países.\nA decisão revoga restrições severas impostas anteriormente e restabelece a tramitação regular de processos de imigração retidos.\nO veredito gera forte impacto no cenário migratório e econômico internacional, favorecendo milhares de profissionais e famílias afetadas.","link":"https://www.brasildefato.com.br/2026/08/22/justica-dos-eua-derruba-ato-de-trump-que-suspendia-vistos-de-residencia-para-brasileiros-e-cidadaos-de-outros-74-paises/","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Conflits : Revue de Géopolitique","pais":"França","titulo":"Livro – A inteligência artificial e a questão do homem","resumo":"A obra analisa o impacto crescente da inteligência artificial na sociedade e levanta questionamentos éticos sobre a condição humana.\nO autor examina as transformações sociais e filosóficas impulsionadas pelos avanços tecnológicos recentes.\nA reflexão busca entender como essas inovações redefinem o trabalho e a identidade do ser humano no mundo moderno.\nO livro serve como uma contribuição essencial para os debates contemporâneos sobre a convivência entre homens e máquinas.","link":"https://www.revueconflits.com/livre-lintelligence-artificielle-et-la-question-de-lhomme/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"L'Usine Nouvelle","pais":"França","titulo":"Na Forvia, a engenheira Lydie De Oliveira trabalha para tornar a tecnologia acessível ao público em geral","resumo":"A engenheira Lydie De Oliveira lidera projetos na Forvia com o objetivo de democratizar inovações tecnológicas no setor automotivo.\nSua atuação visa simplificar sistemas complexos e tornar soluções inteligentes mais intuitivas para o público geral.\nO trabalho contribui para acelerar a transformação digital e sustentável na indústria da mobilidade.\nA trajetória reflete o papel crucial da liderança feminina no desenvolvimento tecnológico e na acessibilidade de novos recursos.","link":"https://www.usinenouvelle.com/auto/chez-forvia-lingenieure-lydie-de-oliveira-oeuvre-a-rendre-la-technologie-accessible-au-grand-public.GVRNFFHWFNFFPJPTSWQ2ZWQU5U.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Nwemail.co.uk","pais":"Inglaterra","titulo":"Tecnologia no cinema Vue permite que pessoas com perda auditiva transmitam o som nos próprios dispositivos","resumo":"O cinema Vue implementou uma nova tecnologia acessível projetada para aprimorar a experiência de espectadores com deficiência auditiva.\nA inovação permite que os usuários transmitam o áudio do filme diretamente para seus próprios smartphones, fones de ouvido ou aparelhos auditivos.\nEssa solução elimina a necessidade de retirar equipamentos especiais na recepção, garantindo maior autonomia, praticidade e inclusão.\nO avanço representa um marco importante na acessibilidade cultural, promovendo um ambiente de entretenimento mais inclusivo.","link":"https://www.nwemail.co.uk/news/26484642.vue-barrow-installs-new-accessibility-technology-across-every-screen/","categoria":"ACESSIBILIDADE","lang":"pt"},{"fonte":"oxfordtimes.co.uk","pais":"Inglaterra","titulo":"Bicester Motion revela novos planos para pioneiros da tecnologia em plano diretor de £ 1 bilhão","resumo":"A Bicester Motion anunciou atualizações significativas em seu plano diretor de 1 bilhão de libras voltado para impulsionar a inovação no Reino Unido.\nO projeto prevê a criação de um hub avançado projetado para atrair startups e empresas consolidadas nos setores de mobilidade e tecnologia.\nCom foco em sustentabilidade e infraestrutura de ponta, a iniciativa busca transformar a região em um centro global de desenvolvimento.\nO investimento reforça o compromisso de liderar a transição para soluções de transporte e engenharia do futuro.","link":"http://www.oxfordtimes.co.uk/news/26485435.bicester-motion-unveils-fresh-plans-technology-pioneers/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"MARCA","pais":"Espanha","titulo":"Robô humanoide bate o recorde de Usain Bolt nos 100 metros","resumo":"A robótica alcançou um marco impressionante com um novo modelo humanoide superando a velocidade histórica estabelecida por Usain Bolt na prova dos 100 metros. O feito demonstra os avanços acelerados no desenvolvimento de motores, estabilidade e inteligência motora aplicados a robôs bípedes. Essa conquista abre caminho para aplicações em tarefas extremas, resgates e no futuro da automação física avançada.","link":"https://www.marca.com/otros-deportes/2026/08/23/robot-humanoide-bate-record-usain-bolt-100-metros.html","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"OkDiario","pais":"Espanha","titulo":"Astronomia faz história: descobrem pela primeira vez uma corrente estelar fora da Via Láctea","resumo":"Cientistas alcançaram uma conquista inédita ao identificar, pela primeira vez na história da astronomia, uma corrente estelar localizada fora da Via Láctea. Estruturas como essa são formadas quando galáxias menores são destruídas pelas forças gravitacionais de sistemas maiores. A descoberta amplia significativamente a compreensão sobre a dinâmica galáctica e a distribuição de matéria escura no universo.","link":"https://okdiario.com/ciencia/astronomia-hace-historia-descubren-primera-vez-corriente-estelar-fuera-via-lactea-20141138","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"La Vanguardia","pais":"Espanha","titulo":"O pior que uma IA pode fazer é sempre concordar: a ciência começa a ligá-la à psicose","resumo":"Estudos científicos recentes alertam para os perigos psicológicos causados por sistemas de inteligência artificial projetados para concordar incondicionalmente com os usuários. O fenômeno de validação constante pode reforçar visões distorcidas da realidade e episódios semelhantes a quadros de psicose. Pesquisadores defendem a necessidade de criar limites comportamentais e respostas críticas nos modelos para proteger a saúde mental dos usuários.","link":"https://www.lavanguardia.com/neo/ia/20260823/11615940/peor-ia-dar-siempre-razon-ciencia-empieza-ligarlo-psicosis.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Diario AS","pais":"Espanha","titulo":"A descoberta inesperada em um osso de dinossauro de 66 milhões de anos que contradiz a ciência","resumo":"Uma nova análise detalhada em um fóssil de dinossauro datado de 66 milhões de anos revelou estruturas orgânicas surpreendentes que desafiam teorias científicas consolidadas. O achado levanta questionamentos profundos sobre o processo de fossilização e a viabilidade da conservação de tecidos por períodos extremamente longos. Essa contradição obriga paleontólogos e biologistas a revisarem modelos históricos da evolução e preservação biológica.","link":"https://as.com/meristation/betech/el-inesperado-hallazgo-en-un-hueso-de-dinosaurio-de-hace-66-millones-de-anos-que-contradice-a-la-ciencia-f202608-n/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Xataka","pais":"Espanha","titulo":"Caminhar olhando o celular não apenas distrai: a ciência demonstra que altera sua forma de andar e dispara o estresse","resumo":"Pesquisas científicas comprovaram que o hábito de caminhar prestando atenção à tela do celular altera drasticamente a biomecânica da marcha humana. Além de modificar o equilíbrio e a postura natural do corpo, essa prática aumenta significativamente os níveis de estresse e a sobrecarga cognitiva. Os especialistas alertam para a necessidade de conscientização sobre os riscos à saúde física e mental no dia a dia.","link":"https://www.xataka.com/medicina-y-salud/caminar-mirando-movil-no-solo-te-distrae-ciencia-demuestra-que-altera-tu-forma-andar-dispara-estres","categoria":"SAÚDE E TECNOLOGIA","lang":"pt"},{"fonte":"El Periódico","pais":"Espanha","titulo":"Sensores que leem sua roupa usada e máquinas que 'ressuscitam' suas fibras: assim a tecnologia tece o futuro da moda circular na Espanha","resumo":"A indústria têxtil na Espanha está passando por uma revolução tecnológica focada na sustentabilidade e na economia circular. Com a introdução de sensores avançados capazes de identificar a composição de tecidos usados, novas máquinas automatizadas conseguem desfiar e reprocessar fibras com precisão. Essa inovação promete transformar o tratamento de resíduos têxteis, viabilizando uma cadeia de produção limpa e eficiente.","link":"https://www.elperiodico.com/es/sociedad/20260823/sensores-leen-ropa-usada-maquinas-moda-reciclaje-economia-circular-133086311","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"novaciencia.es","pais":"Espanha","titulo":"Hidrogel, o material que pode revolucionar a ciência em áreas como tratamento de feridas, nutrição e conservação de umidade em lavouras","resumo":"Desenvolvimentos recentes em materiais avançados destacam o hidrogel como uma das tecnologias mais promissoras para a ciência moderna. Capaz de reter grandes volumes de água e liberar substâncias de forma controlada, o material promete impactar desde a medicina até a agricultura. O avanço representa uma solução eficiente para a cicatrização de feridas e para o combate à seca em lavouras.","link":"https://novaciencia.es/hidrogel-el-material-que-puede-revolucionar-la-ciencia-en-ambitos-como-el-tratamiento-de-heridas-nutricion-o-conservacion-de-humedad-en-cultivos/","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Infobae","pais":"Espanha","titulo":"O que há no vácuo do espaço? O enigma que a ciência resolveu após 90 anos","resumo":"Após quase um século de investigações, astrônomos finalmente desvendaram a verdadeira natureza das regiões consideradas totalmente vazias no espaço. A pesquisa revelou a presença de partículas subatômicas, energia e matéria difusa onde antes se imaginava existir apenas ausência absoluta. A resolução deste mistério de 90 anos representa um marco crucial para compreender a expansão e a estrutura do universo.","link":"https://www.infobae.com/america/ciencia-america/2026/08/23/que-hay-en-el-vacio-del-espacio-el-enigma-que-la-ciencia-resolvio-tras-90-anos/","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"khb東日本放送","pais":"Japão","titulo":"Robôs humanoides passam por evolução impressionante, superam recordes humanos no esporte e realizam tarefas domésticas","resumo":"A tecnologia de robôs humanoides está avançando rapidamente, alcançando marcos impressionantes que superam a capacidade humana em certas modalidades esportivas.\nAlém de demonstrar força e agilidade surpreendentes, esses autómatos agora executam tarefas domésticas complexas e delicadas com elevada precisão.\nO progresso constante da robótica e da inteligência artificial indica um futuro em que robôs desempenharão papéis centrais no suporte diário e na indústria.","link":"https://www.khb-tv.co.jp/news/16828651","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"Motor Fan","pais":"Japão","titulo":"Toyota Crown Sport receberá atualização em setembro com adição do novo modelo PHEV Z","resumo":"A Toyota anunciou melhorias significativas para a linha Crown Sport, com lançamento programado para setembro e foco em inovação tecnológica.\nO grande destaque da atualização é a introdução da nova versão híbrida plug-in PHEV Z, projetada para oferecer maior eficiência e potência.\nCom essas modificações, a montadora japonesa busca consolidar o modelo como o mais avançado de sua categoria, impulsionando sua estratégia de eletrificação automotiva.","link":"https://motor-fan.jp/article/1602864/","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"News On AIR","pais":"Japão","titulo":"Ministério dos Esportes aprova delegação indiana de 492 membros para os Jogos Asiáticos no Japão","resumo":"O Ministério dos Esportes aprovou formalmente a delegação da Índia composta por 492 membros para a disputa dos Jogos Asiáticos no Japão.\nA aprovação garante o suporte governamental necessário para atletas e comissões técnicas participarem de dezenas de modalidades esportivas.\nO evento internacional atrai atenção global e movimenta significativamente o setor de eventos, mídia e turismo na nação anfitriã.","link":"https://newsonair.gov.in/sports-ministry-approves-492-member-indian-contingent-for-asian-games-in-japan/","categoria":"ESPORTES","lang":"pt"},{"fonte":"Devdiscourse","pais":"China","titulo":"Micróbios Terrestres na Lua e a Ascensão Robótica da China","resumo":"A China continua a consolidar sua posição de liderança na exploração espacial e robótica avançada com novas missões lunares.\nEstudos recentes analisam a viabilidade e o comportamento de micróbios terrestres levados ao ambiente lunar pelas sondas chinesas.\nEsse avanço destaca o ecossistema tecnológico do país, unindo biologia, automação e inteligência artificial para futuras bases na Lua.\nA iniciativa reforça a corrida espacial global e o papel crescente de Pequim em pesquisas científicas extraterrestres.","link":"https://www.devdiscourse.com/article/science-environment/3966664-earth-microbes-on-the-moon-and-chinas-robotic-ascendancy","categoria":"EXPLORAÇÃO ESPACIAL","lang":"pt"},{"fonte":"Al Jazeera","pais":"China","titulo":"Robô Chinês Bate Recorde Mundial dos 100 Metros de Usain Bolt em Jogos Humanoides","resumo":"Um robô humanoide desenvolvido na China alcançou um feito histórico ao superar o tempo do recorde mundial de Usain Bolt nos 100 metros rasos.\nA façanha ocorreu durante uma competição de robótica, demonstrando avanços impressionantes em atuadores, equilíbrio e sistemas de controle.\nO feito evidencia o rápido ritmo de inovação do setor de robótica chinês, que busca liderar o mercado global de autômatos.\nAs tecnologias aplicadas abrem portas para futuras aplicações industriais, comerciais e em resgates de alta velocidade.","link":"https://www.aljazeera.com/video/newsfeed/2026/8/23/chinese-robot-beats-usain-bolts-100m-world-record-at-humanoid-games","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"fj.chinanews.com.cn","pais":"China","titulo":"Conferência Mundial de Robôs de 2026: Tecnologia Robótica Migra da Demonstração para a Aplicação Prática","resumo":"A edição de 2026 da Conferência Mundial de Robôs destacou uma transição fundamental: a migração de protótipos de exibição para soluções operacionais.\nEmpresas chinesas apresentaram modelos voltados para manufatura, logística, saúde e serviços domésticos com alto grau de autonomia.\nO foco do evento esteve na capacidade dos robôs de agregar valor econômico real e transformar diferentes setores produtivos.\nEssa consolidação comercial posiciona a China como o principal polo global de implantação e escala da tecnologia robótica.","link":"https://www.fj.chinanews.com.cn/news/2026/2026-08-23/589558.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"UOL Economia","pais":"China","titulo":"Maçaneta Oculta da Tesla Gera Recall de 4 Milhões de Carros na China","resumo":"A Tesla anunciou o recall de cerca de quatro milhões de veículos na China devido a falhas operacionais e de segurança nas maçanetas ocultas.\nA decisão ocorre em um momento de intensa fiscalização regulatória sobre recursos tecnológicos e automação veicular no país.\nProprietários relataram dificuldades de acesso e riscos em emergências, pressionando a fabricante a atualizar o sistema.\nO caso reforça os desafios de conformidade tecnológica enfrentados por empresas globais no competitivo mercado automotivo chinês.","link":"https://economia.uol.com.br/noticias/estadao-conteudo/2026/08/22/tesla-e-montadoras-chinesas-fazem-recall-de-mais-de-4-milhoes-de-veiculos-por-falha-em-macaneta.htm","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"ｄメニューニュース","pais":"China","titulo":"Ministério das Finanças da China Expandirá Continuamente Investimentos em Ciência e Tecnologia nos Próximos 5 Anos","resumo":"O Ministério das Finanças da China anunciou um plano estratégico para aumentar os aportes públicos em ciência e tecnologia nos próximos cinco anos.\nO objetivo é acelerar a autossuficiência tecnológica do país e fortalecer a pesquisa básica em áreas críticas como semicondutores e IA.\nA medida busca garantir recursos previsíveis e robustos para universidades, centros de pesquisa e empresas inovadoras.\nCom essa política de incentivo, Pequim visa consolidar sua soberania científica frente às crescentes pressões internacionais.","link":"https://topics.smt.docomo.ne.jp/amp/article/recordchina/world/recordchina-RC_990351","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ncsti.gov.cn","pais":"China","titulo":"China Publica Primeiros Casos Emblemáticos de Inteligência Artificial Aplicada à Pesquisa Científica","resumo":"O governo chinês divulgou a primeira lista oficial de casos exemplares da aplicação de Inteligência Artificial na pesquisa científica.\nOs projetos selecionados abrangem descobertas em biologia estrutural, física de materiais, química computacional e meteorologia.\nA iniciativa visa padronizar e acelerar a adoção de modelos de IA como parceiros fundamentais dos cientistas no laboratório.\nEssa estratégia consolida o compromisso do país em liderar a revolução metodológica da ciência moderna impulsionada por algoritmos.","link":"https://www.ncsti.gov.cn/kjdt/xwjj/202608/t20260822_254191.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"人民网","pais":"China","titulo":"Abertura dos Segundos Jogos Mundiais de Robôs Humanoides","resumo":"A segunda edição dos Jogos Mundiais de Robôs Humanoides teve início na China, reunindo centenas de equipes e protótipos de alta performance.\nO evento testa as habilidades dinâmicas de robôs em modalidades esportivas, agilidade, locomoção e tomada de decisão em tempo real.\nAlém da competição, o torneio serve como um laboratório aberto para avaliar o desempenho de algoritmos de controle e novos atuadores.\nA conferência atrai a atenção global ao demonstrar a evolução vertiginosa da engenharia robótica e da inteligência artificial aplicada.","link":"http://finance.people.com.cn/n1/2026/0823/c1004-40784347.html","categoria":"EVENTOS","lang":"pt"},{"fonte":"finance.sina.com.cn","pais":"China","titulo":"Indústria de Alta Tecnologia na China Atraiu Aumento de 32,7% em Investimento Estrangeiro em Julho","resumo":"O setor de alta tecnologia da China registrou um salto de 32,7% na atração de capital estrangeiro em comparação com o mesmo período anterior.\nOs dados refletem a confiança contínua de investidores internacionais na capacidade fabril avançada, infraestrutura e mercado chinês.\nSegmentos como equipamentos eletrônicos, fabricação de semicondutores e biotecnologia lideraram a entrada de novos investimentos.\nEsse crescimento demonstra que, apesar de tensões geopolíticas, a China permanece como um polo indispensável para a inovação global.","link":"https://finance.sina.cn/2026-08-23/detail-iniphnkv0617771.d.html?vt=4\u0026cid=76729\u0026node_id=76729","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Investment Guru India","pais":"Índia","titulo":"Economia espacial da Índia deve atingir entre 40 e 45 bilhões de dólares na próxima década","resumo":"A economia espacial da Índia está projetada para expandir significativamente nos próximos ten anos, impulsionada por investimentos.\nCom o avanço das startups do setor e o apoio do governo local, o país busca se consolidar como um polo global de inovação astronáutica.\nEssa projeção destaca a crescente importância da tecnologia espacial no desenvolvimento econômico e científico nacional.","link":"https://investmentguruindia.com/newsdetail/india-s-space-economy-projected-to-reach-400-45-billion-over-next-decade963236","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"ET Government","pais":"Índia","titulo":"Índia pode construir uma economia espacial de 44 bilhões de dólares até 2033, afirma diretor da ISpA","resumo":"O diretor-geral da Associação Espacial Indiana destacou que o país possui potencial para alcançar 44 bilhões de dólares no setor.\nA estratégia envolve reforçar parcerias internacionais, atrair capital privado e impulsionar a infraestrutura tecnológica nacional.\nA meta consolida o compromisso da nação em transformar a exploração espacial em um motor de crescimento de longo prazo.","link":"https://government.economictimes.indiatimes.com/news/defence/india-can-build-a-44-billion-space-economy-by-2033-ispa-dg-lt-gen-ak-bhatt/133433332","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"Deccan Herald","pais":"Índia","titulo":"Marcha pela Ciência na Índia exige remoção de conteúdos anticientíficos dos currículos escolares","resumo":"Manifestantes e acadêmicos se reuniram em Bengaluru para defender a integridade do ensino científico nas escolas indianas.\nO movimento exige que tópicos sem comprovação empírica sejam totalmente retirados do material didático oficial do país.\nA iniciativa visa fortalecer a educação baseada em evidências e proteger a formação das futuras gerações de pesquisadores.","link":"https://www.deccanherald.com/india/karnataka/bengaluru/bengaluru-india-march-for-science-wants-unscientific-content-out-of-curricula-4120992","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"Índia e Japão concordam em aprofundar parceria em tecnologia de defesa","resumo":"Índia e Japão firmaram um novo acordo para fortalecer a cooperação bilateral em tecnologia de defesa e segurança marítima.\nA parceria prevê o compartilhamento de inovações, pesquisas conjuntas e o desenvolvimento de novas soluções para o setor.\nO tratado reforça a estabilidade regional no Indo-Pacífico e o avanço tecnológico na área de defesa de ambas as nações.","link":"https://newsonair.gov.in/defence-minister-rajnath-singh-japanese-counterpart-shinjiro-koizumi-co-chair-india-japan-defence-ministers-meeting/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"NDTV","pais":"Índia","titulo":"Cuidados preventivos de saúde são questão de segurança econômica nacional, afirma ministro indiano","resumo":"O ministro da Defesa da Índia ressaltou que a medicina preventiva e a inovação em saúde são vitais para a estabilidade do país.\nSegundo a declaração, investir no bem-estar populacional reduz custos governamentais e protege a produtividade nacional.\nA abordagem destaca a urgência de integrar tecnologias de saúde com estratégias de desenvolvimento socioeconômico.","link":"https://www.ndtv.com/india-news/matter-of-national-economy-security-rajnath-singh-on-preventive-healthcare-11946098","categoria":"SAÚDE","lang":"pt"},{"fonte":"The Hindu","pais":"Índia","titulo":"Centro de recursos do Jipmer é elevado a Centro de Excelência em Avaliação de Tecnologias em Saúde","resumo":"O hub de recursos do instituto Jipmer foi elevado a Centro de Excelência em avaliação de tecnologias médicas na Índia.\nA mudança permitirá uma análise mais rigorosa e baseada em dados de novos tratamentos, dispositivos e equipamentos de saúde.\nCom a medida, o centro busca otimizar a alocação de recursos públicos e acelerar a adoção de inovações no setor sanitário.","link":"https://www.thehindu.com/news/cities/puducherry/jipmers-resource-hub-upgraded-as-centre-of-excellence-for-health-technology-assessment/article71377273.ece","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"PIB","pais":"Índia","titulo":"CSIR-NIScPR celebra Jubileu de Platina de 75 anos da revista científica 'Vigyan Pragati'","resumo":"O CSIR-NIScPR realizou uma cerimônia para comemorar os 75 anos da emblemática publicação científica 'Vigyan Pragati'.\nA revista desempenha um papel fundamental na popularização da ciência e no acesso ao conhecimento técnico pela população.\nA celebração reforça o impacto histórico da difusão de pesquisas científicas para a inclusão social e educacional no país.","link":"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2302401","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"Índia sedia Reunião de Ministros dos Esportes do BRICS em Visakhapatnam","resumo":"A Índia sedia o encontro de Ministros dos Esportes do BRICS em Visakhapatnam para debater parcerias estratégicas no setor.\nO evento busca promover a cooperação internacional, o intercâmbio de conhecimento e investimentos em infraestrutura.\nA reunião destaca a relevância de fóruns multilaterais no alinhamento de políticas públicas e tendências globais.","link":"https://newsonair.gov.in/india-to-host-brics-sports-ministers-meeting-at-visakhapatnam-in-andhra-pradesh-today/","categoria":"EVENTOS","lang":"pt"},{"fonte":"Link To Leaders","pais":"Portugal","titulo":"Para Ler: Liderando a Economia Quântica","resumo":"O avanço da computação quântica está redefinindo o panorama global da inovação e da geopolítica econômica.\nA obra analisa os impactos estratégicos dessa tecnologia disruptiva no mercado financeiro, na segurança da informação e na competitividade industrial.\nCompreender esse novo paradigma é fundamental para líderes e governos que buscam protagonismo na próxima revolução tecnológica.\nO livro serve como um guia essencial para navegar pelas oportunidades e desafios trazidos pela era quântica.","link":"https://linktoleaders.com/a-ler-liderar-a-economia-quantica-rui-ribeiro/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Meteored Portugal","pais":"Portugal","titulo":"Nem Raios, Nem Azar: Ciência Revela que o Ser Humano Provoca até 97% dos Incêndios Florestais","resumo":"Estudos científicos recentes apontam a ação humana como a principal causadora da esmagadora maioria dos incêndios florestais.\nAo contrário da crença popular sobre causas naturais como raios, a negligência e as queimadas descontroladas dominam as estatísticas globais.\nOs dados reforçam a necessidade urgente de campanhas de conscientização, fiscalização rigorosa e políticas públicas eficazes de prevenção.\nA pesquisa evidencia que a mitigação do fogo depende diretamente de mudanças no comportamento e na gestão ambiental pelas sociedades.","link":"https://www.tempo.pt/noticias/ciencia/nem-raios-nem-azar-ciencia-revela-que-o-ser-humano-provoca-ate-97-dos-incendios-florestais.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Pplware","pais":"Portugal","titulo":"Poderemos Viver Até os 200 Anos? Ciência Encontra Novo Limite para a Vida Humana","resumo":"Pesquisadores continuam investigando os limites biológicos da longevidade e as possibilidades de extensão da vida humana.\nEstudos avançados em genética, biotecnologia e medicina regenerativa questionam barreiras antes consideradas inabaláveis pela biologia.\nEmbora teorias sugiram um teto para a sobrevivência celular, avanços terapêuticos prometem adiar o envelhecimento com qualidade.\nO debate levanta questões éticas, sociais e econômicas cruciais sobre o impacto de uma população global cada vez mais longeva.","link":"https://pplware.sapo.pt/ciencia/poderemos-viver-ate-aos-200-anos-ciencia-encontra-um-novo-limite-para-a-vida-humana/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Reforma de Palácio na Espanha Conta com Tecnologia Portuguesa nos Banheiros","resumo":"A restauração de um histórico palácio espanhol incorporou soluções tecnológicas inovadoras desenvolvidas em Portugal.\nO projeto destaca o avanço do setor de construção e sanitários em direção à eficiência hídrica e automação inteligente.\nEssa colaboração transfronteiriça evidencia a capacidade de exportação da engenharia e do design português de alto padrão.\nA iniciativa une a preservação do patrimônio arquitetônico histórico à sustentabilidade e modernidade das tecnologias contemporâneas.","link":"https://sapo.pt/artigo/renovacao-de-palacio-em-espanha-conta-com-tecnologia-portuguesa-nas-casas-de-banho-6a89e8389b79793efa309dcc","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The Portugal News","pais":"Portugal","titulo":"Continuam os Processos Judiciais Contra Gigantes da Tecnologia sobre Segurança Infantil","resumo":"Grandes empresas de tecnologia continuam enfrentando uma onda de ações judiciais focadas na proteção de crianças e adolescentes.\nAs acusações envolvem o design viciante de plataformas, a exposição a conteúdos inadequados e a falta de mecanismos eficazes de verificação de idade.\nReguladores e grupos de pais pressionam por sanções mais severas e por exigências de maior transparência nos algoritmos das redes sociais.\nO cenário indica uma virada regulatória global que pode redefinir o funcionamento e as responsabilidades das Big Techs no ambiente digital.","link":"https://www.theportugalnews.com/pt/noticias/2026-08-22/continuam-os-processos-judiciais-contra-os-gigantes-da-tecnologia-relativos-a-seguranca-infantil/1073968","categoria":"BIG TECH","lang":"pt"},{"fonte":"Dinheiro Vivo","pais":"Portugal","titulo":"Securitas Prevê Faturamento de 151 Milhões de Euros e Reforça Aposta em Tecnologia","resumo":"A multinacional de segurança Securitas projeta encerrar o ano com receitas expressivas estimadas em 151 milhões de euros.\nO resultado financeiro positivo reflete a transição estratégica de serviços tradicionais para soluções baseadas em tecnologia e inteligência artificial.\nA empresa busca expandir sistemas de monitoramento avançado, análise preditiva de dados e automação de operações de vigilância.\nEsse investimento consolida a relevância da inovação digital no mercado global de segurança patrimonial e corporativa.","link":"http://dinheirovivo.dn.pt/empresas/securitas-estima-fechar-o-ano-com-faturao-a-rondar-os-151-milhes-de-euros-e-refora-aposta-na-tecnologia","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Jornal do Algarve","pais":"Portugal","titulo":"'Desenterrar o Passado' Leva Ciência e Arqueologia a Santa Rita","resumo":"O projeto comunitário e científico 'Desenterrar o Passado' promoveu escavações arqueológicas na região de Santa Rita.\nA iniciativa aproxima a população local do conhecimento histórico por meio de oficinas, visitas guiadas e atividades práticas no campo.\nAlém de revelar achados patrimoniais relevantes, o evento estimula a preservação da memória cultural e o turismo de base científica.\nA ação demonstra como a divulgação arqueológica pode integrar educação, ciência e engajamento social nas comunidades regionais.","link":"https://jornaldoalgarve.pt/desenterrar-o-passado-leva-ciencia-e-arqueologia-a-santa-rita/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Vila de Rei: Ciência Viva no Verão Promove Observação do Sol em Praia Fluvial","resumo":"A iniciativa Ciência Viva no Verão organizou uma sessão pública de observação solar na Praia Fluvial do Penedo Furado, em Vila de Rei.\nUsando telescópios com filtros adequados, especialistas ensinaram o público a identificar manchas solares e fenômenos da dinâmica da estrela.\nO evento combina turismo de lazer em cenários naturais com atividades educativas acessíveis a todas as idades.\nA ação reforça a importância da popularização da astronomia e do incentivo à curiosidade científica durante o período de férias.","link":"https://sapo.pt/artigo/vila-de-rei-ciencia-viva-no-verao-leva-observacao-do-sol-a-praia-fluvial-do-penedo-furado-6a896d389b79793efa1dc3e7","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Times Brasil | CNBC","pais":"Brazil","titulo":"10-year-old boy creates AI 'electronic nose' and wins invention award in Silicon Valley","resumo":"A ten-year-old boy has developed a device capable of identifying odors using artificial intelligence.\nThe invention was awarded at a prestigious innovation competition held in Silicon Valley, USA.\nThe project demonstrates how early access to technology tools can generate creative solutions for the market.\nThis achievement reinforces the role of technology education in encouraging new talents around the world.","link":"https://timesbrasil.com.br/empresas-e-negocios/tecnologia-e-inovacao/invencao-pode-auxiliar-na-deteccao-de-drogas-e-alimentos/","categoria":"INNOVATION","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Apple Intelligence: check out five automated iPhone functions","resumo":"Apple has introduced new artificial intelligence-based features that promise to transform iPhone usage.\nThe Apple Intelligence feature will bring smart automation to daily tasks, such as writing and photo editing.\nAdditionally, the update aims to optimize the Siri assistant and improve personal notification management.\nThese changes represent a significant step by the company in the race for artificial intelligence dominance.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/08/22/apple-intelligence-veja-cinco-funcoes-do-iphone-que-serao-automatizadas.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"USP researcher uses science for early autism diagnosis","resumo":"A scientist from the University of São Paulo has developed an innovative method focused on autism diagnosis.\nThe research uses scientific markers and data analysis to identify signs of the disorder during childhood.\nEarly detection is fundamental to starting therapeutic interventions at the most appropriate moment of development.\nThe breakthrough strengthens the role of Brazilian science in creating solutions with a major social and health impact.","link":"https://g1.globo.com/google/amp/sp/sao-carlos-regiao/videos-jornal-da-eptv-2-edicao/video/gente-daqui-pesquisador-da-usp-usa-a-ciencia-para-diagnostico-precoce-de-autismo-14893604.ghtml","categoria":"SCIENCE","lang":"en"},{"fonte":"Canal Rural","pais":"Brazil","titulo":"Brazilian technology turns wood into fiber for swine feeding","resumo":"Brazilian researchers have developed a technological process to convert wood waste into animal nutrition.\nThe new sustainable fiber acts as an efficient food supplement for swine farming in agroindustry.\nThe technique promotes the circular economy by cleverly reusing wood industry byproducts.\nThis innovation promises to reduce production costs and lower the environmental footprint of the national agricultural sector.","link":"https://www.canalrural.com.br/aves-e-suinos/viu-esta-tecnologia-brasileira-transforma-madeira-em-fibra-para-alimentacao-de-suinos/","categoria":"INNOVATION","lang":"en"},{"fonte":"Assine Abril","pais":"Brazil","titulo":"Can too much protein hinder longevity? What science has discovered","resumo":"Recent scientific studies investigate the impacts of excessive protein consumption on health and aging.\nThough essential for muscle mass, intake above the recommended level can activate cellular pathways associated with wear and tear.\nResearchers warn of the importance of nutritional balance tailored to the individual needs of each organism.\nThe findings help redefine longevity strategies and dietary habits based on robust evidence.","link":"https://boaforma.abril.com.br/alimentacao/proteina-demais-longevidade/","categoria":"HEALTH","lang":"en"},{"fonte":"Fast Company Brasil","pais":"Brazil","titulo":"Blue jeans gain a more sustainable alternative for the textile industry","resumo":"The fashion industry is adopting new techniques and inputs to replace traditional denim fabric dyeing.\nThe conventional manufacturing process is widely known for high water consumption and chemical use.\nThe eco-friendly alternative reduces environmental impact while maintaining the durability and characteristic aesthetic of the product.\nThis transformation reflects the growing global market demand for cleaner and more ethical industrial processes.","link":"https://fastcompanybrasil.com/impacto/o-jeans-azul-esta-ganhando-uma-alternativa-mais-sustentavel/","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"Navy nuclear program leads Brazilian military spending","resumo":"The development of nuclear technology by the Brazilian Navy figures as the largest national defense investment.\nThe project covers the construction of a nuclear-powered submarine and mastery of the fuel cycle in the country.\nThe initiative seeks to guarantee territorial sovereignty and boost technological innovation in the military defense sector.\nExperts analyze the budgetary and strategic challenges for the continuous completion of the undertaking.","link":"https://www1.folha.uol.com.br/poder/2026/08/programa-nuclear-da-marinha-lidera-gasto-militar-brasileiro.shtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Guarany Junior","pais":"Brazil","titulo":"Fapespa launches call to support scientific events during National Science and Technology Week","resumo":"The Amazon Foundation for the Support of Studies and Research has announced a funding notice to support academic events.\nThe initiative integrates the actions of National Science and Technology Week to promote the dissemination of knowledge.\nThe main objective is to encourage scientific production and bring the community closer to the regional innovations of Pará.\nThe investment aims to strengthen scientific outreach and engage researchers and students in the local ecosystem.","link":"https://www.guaranyjunior.com.br/2026/08/23/fapespa-lanca-chamada-para-apoiar-eventos-cientificos-na-semana-nacional-de-ciencia-e-tecnologia/","categoria":"SCIENCE","lang":"en"},{"fonte":"Balada IN","pais":"United States","titulo":"New York surpasses Silicon Valley with 394,000 professionals and redraws the US tech map","resumo":"New York City has reached the milestone of 394,000 tech sector professionals, consolidating itself as the new dominant hub in the United States.\nThis movement represents a significant shift in the innovation ecosystem, historically surpassing Silicon Valley's hegemony.\nGrowth drives the attraction of new investments, startups, and major global corporations to the New York metropolitan region.","link":"https://www.portalin.com.br/negocios/nova-york-supera-vale-do-silicio-com-394-mil-profissionais-e-redesenha-mapa-da-tecnologia-nos-eua/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"O GLOBO","pais":"United States","titulo":"Anthropic could raise over $100 billion in IPO and surpass SpaceX in initial public offering","resumo":"Artificial intelligence startup Anthropic projects an initial public offering that could exceed $100 billion in valuation.\nThe move promises to surpass historical milestones of tech giants and space exploration pioneers, such as Elon Musk's SpaceX.\nThe initiative reflects the accelerated heating of the global market and the financial race to dominate the generative AI sector.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/08/22/anthropic-pode-captar-mais-de-us-100-bi-na-bolsa-e-superar-spacex-em-oferta-inicial-de-acoes.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"TradingKey","pais":"United States","titulo":"Goldman Sachs predicts global space economy will hit $1.8 trillion by 2035","resumo":"A Goldman Sachs report points out that the global space economy is expected to reach up to $1.8 trillion over the next decade.\nThe advancement of commercial exploration, satellite technology, and space tourism emerges as the main engine of this financial growth.\nThe ecosystem attracts the attention of global investors seeking a strategic position in promising aerospace sector companies.","link":"https://www.tradingkey.com/pt/analysis/stocks/us-stocks/262125986-goldman-sachs-space-economy-1-8-trillion-2035-stocks-worth-watching-tradingkey","categoria":"SCIENCE","lang":"en"},{"fonte":"ScienceAlert","pais":"United States","titulo":"Science analyzes whether taking too many photos helps or hurts human memory","resumo":"Recent scientific studies investigate the behavioral and cognitive impact of constantly taking photos in everyday life.\nResearchers analyze whether the habit of photographing everything transfers the responsibility of remembering to the device, weakening memory.\nThe discussion yields valuable insights into how excessive technology use alters the way the brain processes and stores memories.","link":"https://www.sciencealert.com/science-weighs-in-on-whether-all-those-photos-are-helping-or-hurting-your-memory","categoria":"SCIENCE","lang":"en"},{"fonte":"WSOC TV","pais":"United States","titulo":"Tap-to-pay technology arrives at Walmart and Sam’s Club stores","resumo":"Retail giants Walmart and Sam's Club have announced the official implementation of tap-to-pay at their stores in the United States.\nThe move responds to strong consumer demand for faster, more practical checkout methods integrated with smartphones.\nThis technological update modernizes the physical shopping experience and aligns the retailers' operations with global industry trends.","link":"https://www.wsoctv.com/news/local/tap-to-pay-technology-coming-walmart-sams-club/5FNMIQT6X5ENJFV23REIWU4CPI/","categoria":"INNOVATION","lang":"en"},{"fonte":"Devdiscourse","pais":"United States","titulo":"Sports highlights: Geno Smith shines and robotics break world records","resumo":"Recent advancements in robotics have allowed new robots to surpass world records in speed and physical precision.\nAt the same time, the traditional North American sports scene recorded major individual performances, such as that of quarterback Geno Smith.\nThe convergence of sports and high technology demonstrates the growing impact of automation on extreme performance metrics.","link":"https://www.devdiscourse.com/article/sports-games/3966666-sports-highlights-geno-smith-shines-and-robotics-break-world-records","categoria":"ROBOTICS","lang":"en"},{"fonte":"MLB.com","pais":"United States","titulo":"Visualizing Daulton Varsho's swing using bat-tracking technology","resumo":"Sports performance analysis has reached new heights with the use of advanced tracking sensors to map Daulton Varsho's swing.\nThe technology captures biometric and speed data in real-time, allowing for ultra-high-precision adjustments to the athlete's swing.\nThe innovation exemplifies how analytical data collection is transforming training and strategy in professional sports.","link":"https://www.mlb.com/astros/video/visualizing-daulton-varsho-s-swing-using-bat-tracking-technology-x8513","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Brasil de Fato","pais":"United States","titulo":"US Court Strikes Down Trump Administration Act Suspending Residence Visas for Brazilians and Citizens of 74 Other Countries","resumo":"The United States federal court invalidated the restrictive measure that blocked the issuance of residence visas to citizens of 75 countries.\nThe ruling revokes previously imposed severe restrictions and reestablishes the regular processing of pending immigration applications.\nThe verdict has a strong impact on the international migratory and economic landscape, favoring thousands of affected professionals and families.","link":"https://www.brasildefato.com.br/2026/08/22/justica-dos-eua-derruba-ato-de-trump-que-suspendia-vistos-de-residencia-para-brasileiros-e-cidadaos-de-outros-74-paises/","categoria":"TRENDS","lang":"en"},{"fonte":"Conflits : Revue de Géopolitique","pais":"France","titulo":"Book – Artificial Intelligence and the Human Question","resumo":"The book analyzes the growing impact of artificial intelligence on society and raises ethical questions about the human condition.\nThe author examines the social and philosophical transformations driven by recent technological advancements.\nThe reflection seeks to understand how these innovations redefine human work and identity in the modern world.\nThe book serves as an essential contribution to contemporary debates on the coexistence of humans and machines.","link":"https://www.revueconflits.com/livre-lintelligence-artificielle-et-la-question-de-lhomme/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"L'Usine Nouvelle","pais":"France","titulo":"At Forvia, Engineer Lydie De Oliveira Works to Make Technology Accessible to the General Public","resumo":"Engineer Lydie De Oliveira leads projects at Forvia with the goal of democratizing technological innovations in the automotive sector.\nHer work aims to simplify complex systems and make smart solutions more intuitive for the general public.\nThe work helps accelerate the digital and sustainable transformation in the mobility industry.\nHer career reflects the crucial role of female leadership in technological development and the accessibility of new resources.","link":"https://www.usinenouvelle.com/auto/chez-forvia-lingenieure-lydie-de-oliveira-oeuvre-a-rendre-la-technologie-accessible-au-grand-public.GVRNFFHWFNFFPJPTSWQ2ZWQU5U.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Nwemail.co.uk","pais":"England","titulo":"Technology at Vue Cinemas Allows People with Hearing Loss to Stream Sound Directly to Their Own Devices","resumo":"Vue Cinemas has implemented a new accessible technology designed to enhance the experience of moviegoers with hearing impairments.\nThe innovation allows users to stream movie audio directly to their own smartphones, headphones, or hearing aids.\nThis solution eliminates the need to pick up special equipment at the front desk, ensuring greater autonomy, practicality, and inclusion.\nThis advancement represents an important milestone in cultural accessibility, promoting a more inclusive entertainment environment.","link":"https://www.nwemail.co.uk/news/26484642.vue-barrow-installs-new-accessibility-technology-across-every-screen/","categoria":"ACCESSIBILITY","lang":"en"},{"fonte":"oxfordtimes.co.uk","pais":"England","titulo":"Bicester Motion Unveils Fresh Plans for Technology Pioneers in £1 Billion Masterplan","resumo":"Bicester Motion has announced significant updates to its 1 billion pound masterplan aimed at driving innovation in the UK.\nThe project envisions the creation of an advanced hub designed to attract startups and established companies in the mobility and technology sectors.\nWith a focus on sustainability and cutting-edge infrastructure, the initiative seeks to transform the region into a global development center.\nThe investment reinforces the commitment to leading the transition to the transport and engineering solutions of the future.","link":"http://www.oxfordtimes.co.uk/news/26485435.bicester-motion-unveils-fresh-plans-technology-pioneers/","categoria":"INNOVATION","lang":"en"},{"fonte":"MARCA","pais":"Spain","titulo":"Humanoid Robot Breaks Usain Bolt's 100-Meter Record","resumo":"Robotics has reached an impressive milestone with a new humanoid model surpassing the historical speed set by Usain Bolt in the 100-meter dash. The feat demonstrates accelerated advancements in motor development, stability, and motor intelligence applied to bipedal robots. This achievement paves the way for applications in extreme tasks, rescues, and the future of advanced physical automation.","link":"https://www.marca.com/otros-deportes/2026/08/23/robot-humanoide-bate-record-usain-bolt-100-metros.html","categoria":"ROBOTICS","lang":"en"},{"fonte":"OkDiario","pais":"Spain","titulo":"Astronomy Makes History: Stellar Stream Discovered Outside the Milky Way for the First Time","resumo":"Scientists have achieved an unprecedented milestone by identifying, for the first time in the history of astronomy, a stellar stream located outside the Milky Way. Structures like this are formed when smaller galaxies are torn apart by the gravitational forces of larger systems. The discovery significantly expands our understanding of galactic dynamics and the distribution of dark matter in the universe.","link":"https://okdiario.com/ciencia/astronomia-hace-historia-descubren-primera-vez-corriente-estelar-fuera-via-lactea-20141138","categoria":"ASTRONOMY","lang":"en"},{"fonte":"La Vanguardia","pais":"Spain","titulo":"The Worst Thing an AI Can Do Is Always Agree with You: Science Begins Linking It to Psychosis","resumo":"Recent scientific studies warn of the psychological dangers posed by artificial intelligence systems designed to unconditionally agree with users. The constant validation phenomenon can reinforce distorted views of reality and episodes similar to psychosis. Researchers advocate for the need to establish behavioral boundaries and critical responses in models to protect users' mental health.","link":"https://www.lavanguardia.com/neo/ia/20260823/11615940/peor-ia-dar-siempre-razon-ciencia-empieza-ligarlo-psicosis.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Diario AS","pais":"Spain","titulo":"The Unexpected Discovery in a 66-Million-Year-Old Dinosaur Bone That Contradicts Science","resumo":"A new detailed analysis of a 66-million-year-old dinosaur fossil has revealed surprising organic structures that challenge established scientific theories. The finding raises profound questions about the fossilization process and the feasibility of tissue preservation over extremely long periods. This contradiction forces paleontologists and biologists to revise historical models of evolution and biological preservation.","link":"https://as.com/meristation/betech/el-inesperado-hallazgo-en-un-hueso-de-dinosaurio-de-hace-66-millones-de-anos-que-contradice-a-la-ciencia-f202608-n/","categoria":"SCIENCE","lang":"en"},{"fonte":"Xataka","pais":"Spain","titulo":"Walking While Looking at Your Phone Doesn't Just Distract You: Science Proves It Alters Your Gait and Triggers Stress","resumo":"Scientific research has proven that the habit of walking while paying attention to a cell phone screen drastically alters the biomechanics of human walking. In addition to modifying the body's natural balance and posture, this practice significantly increases stress levels and cognitive overload. Experts warn of the need to raise awareness about the risks to physical and mental health in daily life.","link":"https://www.xataka.com/medicina-y-salud/caminar-mirando-movil-no-solo-te-distrae-ciencia-demuestra-que-altera-tu-forma-andar-dispara-estres","categoria":"HEALTH AND TECHNOLOGY","lang":"en"},{"fonte":"El Periódico","pais":"Spain","titulo":"Sensors That Read Your Worn Clothing and Machines That 'Resurrect' Its Fibers: How Technology Is Weaving the Future of Circular Fashion in Spain","resumo":"The textile industry in Spain is undergoing a technological revolution focused on sustainability and the circular economy. With the introduction of advanced sensors capable of identifying the composition of used fabrics, new automated machines can shred and reprocess fibers with precision. This innovation promises to transform textile waste management, enabling a clean and efficient production chain.","link":"https://www.elperiodico.com/es/sociedad/20260823/sensores-leen-ropa-usada-maquinas-moda-reciclaje-economia-circular-133086311","categoria":"INNOVATION","lang":"en"},{"fonte":"novaciencia.es","pais":"Spain","titulo":"Hydrogel, the Material That Could Revolutionize Science in Areas Such as Wound Treatment, Nutrition, and Moisture Retention in Crops","resumo":"Recent developments in advanced materials highlight hydrogel as one of the most promising technologies for modern science. Capable of retaining large volumes of water and releasing substances in a controlled manner, the material promises to impact everything from medicine to agriculture. The breakthrough represents an efficient solution for wound healing and combating drought in crops.","link":"https://novaciencia.es/hidrogel-el-material-que-puede-revolucionar-la-ciencia-en-ambitos-como-el-tratamiento-de-heridas-nutricion-o-conservacion-de-humedad-en-cultivos/","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Infobae","pais":"Spain","titulo":"What Is Inside the Vacuum of Space? The Enigma Science Solved After 90 Years","resumo":"After nearly a century of investigation, astronomers have finally unraveled the true nature of regions considered totally empty in space. The research revealed the presence of subatomic particles, energy, and diffuse matter where absolute absence was once thought to exist. The resolution of this 90-year-old mystery represents a crucial milestone in understanding the expansion and structure of the universe.","link":"https://www.infobae.com/america/ciencia-america/2026/08/23/que-hay-en-el-vacio-del-espacio-el-enigma-que-la-ciencia-resolvio-tras-90-anos/","categoria":"ASTRONOMY","lang":"en"},{"fonte":"khb東日本放送","pais":"Japan","titulo":"Humanoid Robots Undergo Impressive Evolution, Breaking Human Sports Records and Performing Household Chores","resumo":"Humanoid robot technology is advancing rapidly, achieving impressive milestones that surpass human capability in certain sports.\nIn addition to demonstrating surprising strength and agility, these automatons now execute complex and delicate household chores with high precision.\nThe steady progress of robotics and artificial intelligence points to a future where robots will play central roles in daily support and industry.","link":"https://www.khb-tv.co.jp/news/16828651","categoria":"ROBOTICS","lang":"en"},{"fonte":"Motor Fan","pais":"Japan","titulo":"Toyota Crown Sport to Receive September Update with Addition of New PHEV Z Model","resumo":"Toyota has announced significant improvements for the Crown Sport lineup, scheduled for a September release with a focus on technological innovation.\nThe major highlight of the update is the introduction of the new PHEV Z plug-in hybrid version, designed to offer greater efficiency and power.\nWith these modifications, the Japanese automaker aims to solidify the model as the most advanced in its category, boosting its automotive electrification strategy.","link":"https://motor-fan.jp/article/1602864/","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"News On AIR","pais":"Japan","titulo":"Sports Ministry Approves 492-Member Indian Contingent for Asian Games in Japan","resumo":"The Sports Ministry has formally approved India's 492-member delegation for the Asian Games in Japan.\nThe approval ensures the necessary governmental support for athletes and technical staff to participate in dozens of sporting events.\nThe international event attracts global attention and significantly boosts the events, media, and tourism sectors in the host nation.","link":"https://newsonair.gov.in/sports-ministry-approves-492-member-indian-contingent-for-asian-games-in-japan/","categoria":"SPORTS","lang":"en"},{"fonte":"Devdiscourse","pais":"China","titulo":"Earth Microbes on the Moon and China's Robotic Ascendancy","resumo":"China continues to solidify its leadership position in space exploration and advanced robotics with new lunar missions.\nRecent studies analyze the viability and behavior of terrestrial microbes brought to the lunar environment by Chinese probes.\nThis advancement highlights the country's technological ecosystem, combining biology,
