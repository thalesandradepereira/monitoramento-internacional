":"FÍSICA","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"NASA conclui instrumento científico para implantação por astronautas na superfície lunar","resumo":"A NASA finalizou a construção de um novo instrumento científico projetado para ser instalado manualmente por astronautas na Lua.\nO dispositivo tem como objetivo coletar dados geológicos e ambientais cruciais para entender a evolução do ambiente lunar.\nO avanço integra os preparativos da missão Artemis, pavimentando o caminho para uma presença humana sustentável no satélite natural.","link":"https://science.nasa.gov/missions/artemis/nasa-completes-astronaut-deployed-science-instrument-for-lunar-surface/","categoria":"EXPLORAÇÃO ESPACIAL","lang":"pt"},{"fonte":"Google Research","pais":"Estados Unidos","titulo":"Science One Framework: Estrutura autônoma de pesquisa verificável baseada em cadeia de evidências","resumo":"Pesquisadores apresentaram o Science One Framework, uma plataforma aberta para conduzir investigações científicas autônomas.\nO sistema utiliza o conceito de cadeia de evidências para garantir que cada etapa da descoberta seja auditável e transparente.\nEssa abordagem busca aumentar a confiabilidade em inteligências artificiais aplicadas à pesquisa científica avançada.","link":"https://research.google/blog/science-one-framework-a-verifiable-autonomous-research-framework-via-chain-of-evidence/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Phys.org","pais":"Estados Unidos","titulo":"Análise de dados de raios-X em tempo real com DONUT acelera a ciência dos materiais","resumo":"Uma nova ferramenta computacional chamada DONUT permite analisar dados de difração de raios-X em tempo real durante experimentos.\nA inovação elimina gargalos de processamento, permitindo que pesquisadores ajustem parâmetros experimentais instantaneamente.\nO avanço promete acelerar a descoberta de novos materiais e compostos químicos de alta performance.","link":"https://phys.org/news/2026-08-real-ray-analysis-donut-materials.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Alabama Daily News","pais":"Estados Unidos","titulo":"Empresa de defesa do Alabama anuncia avanço em tecnologia contra drones","resumo":"Uma empresa de tecnologia de defesa sediada no Alabama revelou um avanço significativo em sistemas de neutralização de drones.\nA nova solução combina sensores de alta precisão e algoritmos de identificação em tempo real para combater ameaças aéreas não identificadas.\nO avanço responde à crescente demanda global por segurança do espaço aéreo contra enxames de sistemas não tripulados.","link":"https://aldailynews.com/alabama-based-defense-company-announces-advancement-in-counter-drone-technology/","categoria":"TECNOLOGIA MILITAR","lang":"pt"},{"fonte":"The Washington Post","pais":"Estados Unidos","titulo":"Cientistas alertam que os EUA sofrerão se a Casa Branca proibir pesquisas com a China","resumo":"Líderes da comunidade científica expressaram séria preocupação sobre possíveis restrições governamentais a parcerias com pesquisadores chineses.\nEles argumentam que cortar laços de cooperação acadêmica prejudicará a liderança tecnológica global e a inovação dos Estados Unidos.\nO alerta destaca que a ciência internacional depende da colaboração aberta para resolver desafios globais complexos.","link":"https://www.washingtonpost.com/national-security/2026/08/11/scientists-say-us-will-suffer-if-white-house-bars-science-with-china/","categoria":"POLÍTICA CIENTÍFICA","lang":"pt"},{"fonte":"biospace.com","pais":"Estados Unidos","titulo":"VB Spine conclui aquisição da tecnologia CT-Fluoro da Augmedics","resumo":"A VB Spine anunciou a conclusão bem-sucedida do acordo para adquirir a tecnologia de fluoroscopia guiada por tomografia da Augmedics.\nA ferramenta combina visualização médica avançada e navegação intraoperatória para aumentar a precisão em cirurgias de coluna.\nA transação fortalece o portfólio da empresa em soluções cirúrgicas inteligentes de alta precisão.","link":"https://www.biospace.com/press-releases/vb-spine-completes-transaction-for-ct-fluoro-technology-from-augmedics","categoria":"TECNOLOGIA MÉDICA","lang":"pt"},{"fonte":"Presse Agence","pais":"França","titulo":"PARIS: Mate Rimac busca promover tecnologia e o perfil global da Croácia","resumo":"Mate Rimac, fundador e CEO da Rimac Automobili e Bugatti Rimac, destacou a importância de expandir a tecnologia de veículos elétricos de alto desempenho a partir de Paris.\nA iniciativa visa posicionar a Croácia como um polo emergente de inovação e alta tecnologia no ecossistema automotivo global.\nCom essa estratégia, a empresa busca atrair novos investimentos internacionais e consolidar parcerias tecnológicas estratégicas.\nO movimento reforça a transformação do setor de mobilidade e a relevância de startups de tecnologia na Europa.","link":"https://presseagence.fr/paris-mate-rimac-promouvoir-notre-technologie-et-le-profil-mondial-de-la-croatie/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"tv5monde","pais":"França","titulo":"Para combater mosquitos, empresa americana solta 600 mil insetos em jardins","resumo":"Uma empresa de biotecnologia dos Estados Unidos iniciou a liberação de cerca de 600 mil mosquitos modificados em áreas residenciais para combater pragas.\nA técnica utiliza insetos machos estéreis para reduzir drasticamente a população de transmissores de doenças sem o uso de pesticidas químicos.\nA iniciativa representa um avanço importante no controle biológico e sustentável de insetos vetores de vírus como dengue e zika.\nO projeto gera debates sobre a eficácia e a segurança de soluções biotecnológicas ecológicas no ecossistema urbano.","link":"https://information.tv5monde.com/science/pour-combattre-les-moustiques-une-entreprise-americaine-en-relache-600000-dans-les-jardins-2833277","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Sud Ouest","pais":"França","titulo":"Economia: Banco da França prevê crescimento de 0,2% no terceiro trimestre","resumo":"O Banco da França divulgou suas projeções econômicas apontando para um crescimento moderado de 0,2% no terceiro trimestre do ano.\nA estimativa reflete a resiliência de setores-chave da economia do país frente às incertezas globais e à taxa de juros elevada.\nEmbora modesto, o resultado é impulsionado pelo consumo interno e pelas atividades de serviços ao longo do verão europeu.\nA instituição monitora os impactos do cenário macroeconômico global para ajustar futuras projeções do PIB nacional.","link":"https://www.sudouest.fr/economie/finances/economie-la-banque-de-france-prevoit-une-croissance-de-0-2-au-troisieme-trimestre-30225024.php","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Bloomberg.com","pais":"França","titulo":"Economia francesa deve manter o ritmo de crescimento, afirma Banco Central","resumo":"A economia da França está posicionada para manter seu ritmo de recuperação gradual nos próximos meses, segundo análise do Banco Central francês.\nA avaliação destaca a estabilidade em setores estratégicos e o controle progressivo das pressões inflacionárias na região.\nEssa perspectiva sinaliza maior confiança para empresas e investidores operantes no mercado financeiro do país.\nContudo, analistas ponderam que a volatilidade geopolítica e energética ainda exige cautela para os trimestres seguintes.","link":"https://www.bloomberg.com/news/articles/2026-08-11/french-economy-set-to-maintain-momentum-central-bank-says","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Les Echos","pais":"França","titulo":"Alemanha: Inflação do IPCH é confirmada em 2,8% ao ano em julho","resumo":"Os dados oficiais confirmaram que o Índice Harmonizado de Preços ao Consumidor (IPCH) da Alemanha ficou em 2,8% na comparação anual em julho.\nA confirmação da taxa mostra uma desaceleração contínua da pressão inflacionária na maior economia da Zona do Euro.\nO resultado é fundamental para balizar as próximas decisões de política monetária do Banco Central Europeu sobre taxas de juros.\nEspecialistas avaliam que a trajetória de queda nos preços contribuiu significativamente para a estabilização do indicador.","link":"https://investir.lesechos.fr/marches-indices/economie-politique/allemagne-linflation-ipch-confirmee-a-28-sur-un-an-en-juillet-2246724","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Proactive Investors","pais":"Inglaterra","titulo":"Seeing Machines leva tecnologia de monitoramento de motoristas para a robótica industrial","resumo":"A Seeing Machines está expandindo sua tecnologia de monitoramento de atenção, originalmente criada para motoristas, para o setor de robótica fabril.\nA inovação visa aumentar a segurança em ambientes industriais, permitindo que robôs detectem o estado de alerta dos operadores humanos em tempo real.\nEssa transição promete reduzir acidentes de trabalho e otimizar a colaboração homem-máquina na indústria moderna.","link":"https://www.proactiveinvestors.co.uk/companies/news/1096921/seeing-machines-takes-driver-monitoring-technology-into-factory-robotics-1096921.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Retail Technology Innovation Hub","pais":"Inglaterra","titulo":"Como a tecnologia de varejo autônomo deixou de ser um experimento e virou infraestrutura","resumo":"A tecnologia de varejo autônomo deixou de ser um mero teste de inovação para se consolidar como parte essencial da infraestrutura do setor.\nSoluções como pagamentos sem caixa, gerenciamento de estoque baseado em IA e sensores inteligentes estão sendo adotadas em larga escala por grandes redes.\nEssa mudança acelera a eficiência operacional e redefine a experiência de compra dos consumidores globalmente.","link":"https://retailtechinnovationhub.com/home/2026/8/11/how-autonomous-retail-technology-stopped-being-an-experiment-and-started-becoming-infrastructure","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"'Um camundongo não pode nos dizer o que funciona': cientistas do Reino Unido cultivarão miniórgãos humanos para testes de remédios","resumo":"Cientistas no Reino Unido estão cultivando miniórgãos humanos em laboratório para revolucionar o processo de testes de novos medicamentos.\nA iniciativa visa substituir ou reduzir o uso de animais em pesquisas, já que modelos de roedores frequentemente falham em prever reações humanas.\nEssa abordagem inovadora promete acelerar o desenvolvimento de tratamentos mais eficazes e seguros para diversas doenças.","link":"https://www.theguardian.com/science/2026/aug/12/organoids-human-organs-cambridge-shift-drug-testing-medicines-animals","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ANSTO","pais":"Inglaterra","titulo":"20 anos de OPAL: O reator que impulsiona a ciência, medicina e inovação australianas","resumo":"O reator nuclear de pesquisa OPAL completa 20 anos de operação impulsionando avanços fundamentais na ciência e na medicina.\nA instalação desempenha um papel crucial na produção de radiofármacos vitais para o diagnóstico e tratamento do câncer, além de apoiar pesquisas de ponta em materiais.\nO marco reflete o impacto duradouro da tecnologia nuclear aplicada ao bem-estar e à inovação científica.","link":"https://www.ansto.gov.au/news/20-years-of-opal-reactor-powering-australian-science-medicine-and-innovation","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Reino Unido terá o melhor eclipse desde 1999, com a Lua encobrindo o Sol na Europa","resumo":"O Reino Unido se prepara para testemunhar seu eclipse solar mais significativo desde 1999, à medida que a Lua cobrirá grande parte do Sol na Europa.\nO evento astronômico atrai grande atenção da comunidade científica e do público geral pelo seu caráter raro e espetacular.\nAstrônomos recomendam o uso de proteção adequada para a observação e destacam a oportunidade única para estudos atmosféricos.","link":"https://www.bbc.co.uk/news/articles/cx2jr1ew2v1o","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Spotify vai diferenciar artistas de IA de pessoas reais e parar de recomendá-los","resumo":"O Spotify anunciou novos recursos para identificar e rotular faixas criadas por inteligência artificial, separando-as dos trabalhos de artistas humanos.\nA plataforma também pretende ajustar seus algoritmos de recomendação para priorizar criadores reais e proteger os direitos autorais na indústria musical.\nA medida busca combater a proliferação de faixas sintéticas e garantir uma distribuição mais justa de royalties aos músicos.","link":"https://www.theguardian.com/technology/2026/aug/11/spotify-label-ai-artists-block-them-from-some-playlists","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Engineering and Technology Magazine","pais":"Inglaterra","titulo":"Metrô de Londres expande uso de tecnologia de reconhecimento facial em tempo real","resumo":"O sistema de metrô de Londres está ampliando o uso de câmeras com tecnologia de reconhecimento facial ao vivo para identificar suspeitos e prevenir crimes nas estações.\nA medida visa aumentar a segurança pública em uma das redes de transporte mais movimentadas do mundo, mas reacende debates acalorados sobre privacidade e vigilância em massa.\nAutoridades garantem que o sistema opera dentro de diretrizes legais rígidas para proteger os cidadãos.","link":"https://eandt.theiet.org/2026/08/11/london-underground-expands-use-live-facial-recognition-technology","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Business Insider España","pais":"Espanha","titulo":"Como a ESA cria eclipses solares artificiais com tecnologia espanhola na missão Proba-3","resumo":"A Agência Espacial Europeia (ESA) está utilizando tecnologia desenvolvida pela indústria espanhola para criar eclipses solares artificiais na missão Proba-3. O projeto emprega dois satélites voando em formação de alta precisão para bloquear o disco solar e permitir o estudo detalhado da coroa do Sol. A inovação promete revolucionar as pesquisas sobre a atmosfera solar e os ventos estelares com observações sem precedentes.","link":"https://www.businessinsider.es/defensa-espacio/asi-es-como-esa-crea-eclipses-solares-artificiales-con-tecnologia-industria-espanola-mision-proba-3_7024641_0.html","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"PR Newswire","pais":"Espanha","titulo":"Apresentação do Oticon Reveal™, o primeiro aparelho auditivo do mundo com inteligência artificial dupla","resumo":"Foi apresentado o Oticon Reveal™, um aparelho auditivo inovador que integra tecnologia de inteligência artificial dupla (Dual AI). O dispositivo processa ambientes sonoros complexos em tempo real, separando a fala de ruídos de fundo indesejados com alta precisão. Essa evolução promete transformar a qualidade de vida e a acessibilidade de pessoas com perda auditiva em diversas situações cotidianas.","link":"https://www.prnewswire.com/news-releases/presentacion-de-oticon-reveal-el-primer-audifono-del-mundo-con-tecnologia-dual-ai-302848545.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Saber Vivir","pais":"Espanha","titulo":"Nova tecnologia detecta intolerâncias alimentares em tempo real: veja como funciona e por que é mais precisa","resumo":"Uma nova tecnologia promete identificar intolerâncias alimentares de forma imediata e altamente precisa através de métodos de detecção em tempo real. O avanço supera a lentidão dos exames tradicionais e reduz significativamente o risco de diagnósticos imprecisos. A inovação representa um grande passo para a nutrição personalizada e o gerenciamento proativo da saúde metabólica.","link":"https://www.sabervivirtv.com/actualidad/una-nueva-tecnologia-detecta-las-intolerancias-alimentarias-en-tiempo-real-como-funciona-por-que-es-mas-precisa_13669","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"TradingView","pais":"Espanha","titulo":"Empresa de táxis aéreos Joby adquire empresa de tecnologia de defesa por 500 milhões de dólares","resumo":"A fabricante de táxis aéreos elétricos Joby Aviation anunciou a aquisição de uma empresa especializada em tecnologia de defesa pelo valor de US$ 500 milhões. O movimento estratégico visa acelerar o desenvolvimento de autonomia e segurança para aeronaves elétricas de decolagem e pouso vertical (eVTOL). A transação fortalece a posição da Joby tanto no mercado civil quanto na aviação militar avançada.","link":"https://es.tradingview.com/news/reuters.com,2026:newsml_L8N4482D3:0/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Vida Nueva","pais":"Espanha","titulo":"Leão XIV pede para 'desarmar a tecnologia' e alerta sobre o uso militar da Inteligência Artificial","resumo":"Uma mensagem de reflexão ética pediu o 'desarme da tecnologia' e fez alertas contundentes sobre os riscos da militarização da Inteligência Artificial. O apelo enfatizou que a autonomia concedida a sistemas de armas pode comprometer o controle humano e desrespeitar os direitos fundamentais. A declaração reforça o debate global em curso sobre a regulamentação estrita do uso bélico de algoritmos e robôs.","link":"https://www.vidanuevadigital.com/2026/08/11/leon-xiv-pide-desarmar-tecnologia-y-alerta-uso-militar-inteligencia-artificial/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"El Referente","pais":"Espanha","titulo":"Grodi desenvolve e fabrica tecnologia própria de robótica autônoma","resumo":"A empresa Grodi alcançou um marco industrial significativo ao desenvolver e fabricar sua própria tecnologia de robótica totalmente autônoma. Os novos sistemas robóticos foram projetados para otimizar processos operacionais em setores críticos com alta precisão e eficiência. Essa conquista reforça a soberania tecnológica local e impulsiona a automação inteligente no mercado industrial moderno.","link":"https://elreferente.es/startups/grodi-tecnologia-propia-de-robotica-autonoma-vision-artificial-y-analisis-avanzado-de-datos-para-monitorizar-la-salud-y-la-produccion-de-los-cultivo/","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"ciencia.gob.es","pais":"Espanha","titulo":"Espanha voltará a vivenciar um eclipse solar total na Península Ibérica após 114 anos","resumo":"A Espanha se prepara para observar um eclipse solar total em seu território continental pela primeira vez em 114 anos. O raro evento astronômico mobilizou a comunidade científica global, astrônomos amadores e setores do turismo para acompanhar o espetáculo cósmico. A passagem da sombra da Lua pela Península Ibérica oferece uma oportunidade única de estudo da atmosfera solar e observações astronômicas.","link":"https://www.ciencia.gob.es/Noticias/2026/agosto/manana-eclipse-total-sol-Peninsula-Iberica.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Computer Hoy","pais":"Espanha","titulo":"Passe do PC para o notebook em um segundo: a tecnologia 'Easy-Switch' da Logitech que simplifica sua mesa de trabalho","resumo":"A Logitech destaca a tecnologia 'Easy-Switch', criada para integrar o uso contínuo de múltiplos computadores e notebooks na mesma mesa de trabalho. Com apenas o pressionar de um botão, o usuário consegue alternar o controle periférico entre até três dispositivos de maneira fluida. A solução visa maximizar a produtividade no ambiente de trabalho moderno e reduzir a poluição visual de cabos e periféricos duplicados.","link":"https://computerhoy.20minutos.es/recomendados/comprar-logitech-mx-keys-s-combo-pccomponentes_7024866_0.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Table.Briefings","pais":"Alemanha","titulo":"Fusão nuclear na Alemanha: Como startups e governantes esperam alcançar o avanço tecnológico","resumo":"Startups e líderes políticos na Alemanha estão unindo forças para transformar a fusão nuclear comercial em realidade no país.\nCom investimentos crescentes e apoio governamental, o setor busca superar desafios técnicos históricos para gerar energia limpa e ilimitada.\nA iniciativa visa posicionar a Alemanha na vanguarda da corrida global por soluções energéticas sustentáveis de próxima geração.","link":"https://table.media/ceo/executive-summary/fusion-made-in-germany-wie-start-ups-und-politik-auf-den-durchbruch-hoffen","categoria":"FUSÃO NUCLEAR","lang":"pt"},{"fonte":"Spektrum der Wissenschaft","pais":"Alemanha","titulo":"Espetáculo no céu: Eclipse solar sobre a Europa – o que, quando e onde observar","resumo":"Um evento astronômico imperdível promete movimentar observadores e entusiastas do céu por toda a Europa.\nO artigo detalha as datas, horários e as melhores localizações geográficas para acompanhar o eclipse solar com segurança.\nAlém do impacto visual, cientistas destacam a importância de fenômenos astronômicos desse porte para a conscientização pública sobre a ciência.","link":"https://www.spektrum.de/news/sonnenfinsternis-am-12-august-2026/2301780","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"dw.com","pais":"Alemanha","titulo":"Baixos níveis de água no Rio Reno ameaçam a economia alemã","resumo":"A queda acentuada no nível das águas do Rio Reno volta a ligar o alerta para a navegação e a logística industrial na Alemanha.\nA restrição na movimentação de barcaças afeta o transporte de matérias-primas essenciais, pressionando a produção de grandes empresas locais.\nO cenário evidencia a vulnerabilidade das infraestruturas de transporte frente às mudanças climáticas e estiagens recorrentes na Europa.","link":"https://www.dw.com/es/los-bajos-niveles-del-rin-amenazan-la-econom%C3%ADa-alemana/a-78328763","categoria":"CLIMA E ECONOMIA","lang":"pt"},{"fonte":"Reuters","pais":"Alemanha","titulo":"Fabricante de navios de guerra TKMS eleva projeção para 2026 devido à alta demanda por tecnologia de sonar e fragatas","resumo":"A fabricante alemã de embarcações de defesa TKMS elevou suas perspectivas financeiras para 2026 em função do aumento nas encomendas globais.\nO crescimento é impulsionado pela forte procura por tecnologias avançadas de sonar, sistemas marítimos integrados e novas fragatas.\nO movimento reflete a modernização das frotas navais e os investimentos estratégicos em tecnologia de defesa e segurança marítima.","link":"https://www.reuters.com/business/warship-builder-tkms-raises-2026-outlook-higher-demand-sonar-technology-frigates-2026-08-12/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"EE Times Japan","pais":"Japão","titulo":"Tecnologia de origami viabiliza redução de tamanho e peso em satélites de comunicação","resumo":"Pesquisadores do Instituto de Ciência de Tóquio confirmaram o funcionamento bem-sucedido de um equipamento de rádio compacto no espaço.\nA inovação utiliza princípios da arte tradicional do origami para dobrar e desdobrar antenas de forma altamente eficiente em termos de espaço.\nEsse avanço promete reduzir significativamente o peso e os custos de fabricação dos futuros satélites de comunicação.\nA tecnologia abre novas possibilidades para o ecossistema espacial e missões de pequeno porte.","link":"https://eetimes.itmedia.co.jp/ee/articles/2608/12/news025.html","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"客观日本","pais":"Japão","titulo":"Nvidia busca no Japão o 'corpo da IA' para impulsionar a robótica do futuro","resumo":"A Nvidia está expandindo suas operações no Japão para integrar seus modelos avançados de IA com a reconhecida indústria de robótica do país.\nO objetivo da empresa é desenvolver a \"IA corporificada\", fornecendo cérebros digitais para robôs industriais e de assistência.\nA iniciativa visa unir o pioneirismo japonês em hardware e mecânica de precisão à liderança americana em supercomputação.\nEssa colaboração pode acelerar a chegada de máquinas autônomas mais inteligentes na infraestrutura global.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_ict/pt20260812000014.html","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"客观日本","pais":"Japão","titulo":"Universidade de Nagoia utiliza partículas de prata para corte preciso de DNA","resumo":"Cientistas da Universidade de Nagoia desenvolveram uma técnica inovadora que utiliza nanopartículas de prata para realizar cortes arbitrários em cadeias de DNA.\nA ferramenta possibilita uma manipulação genética com nível inédito de precisão, superando limitações de métodos tradicionais.\nA descoberta possui forte potencial de aplicação na criação de terapias médicas avançadas e no melhoramento genético agrícola.\nO avanço consolida a relevância das pesquisas japonesas em biotecnologia e engenharia genômica.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_smkx/pt20260812000011.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"nikkei.com","pais":"Japão","titulo":"Nvidia se transforma em um 'banco de IA' para financiar o ecossistema tecnológico","resumo":"A Nvidia vem expandindo suas atividades para além da fabricação de chips, atuando cada vez mais como uma facilitadora financeira do setor de IA.\nA empresa investe pesadamente em startups e fornece crédito e infraestrutura para garantir a expansão contínua da demanda computacional.\nEssa estratégia fortalece seu ecossistema proprietário e garante a liderança do mercado de hardware diante da concorrência global.\nContudo, analistas apontam os riscos de uma dependência excessiva em relação aos financiamentos concedidos pela gigante de tecnologia.","link":"https://www.nikkei.com/article/DGKKZO98101940S6A810C2ENI000/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"nippon.com","pais":"Japão","titulo":"Startup de IA Manas se separa da Meta sob pressão do governo chinês","resumo":"A empresa chinesa de IA Manas declarou independência de sua parceria com a gigante americana Meta.\nA cisão teria sido incentivada por diretrizes de Pequim para mitigar riscos de vazamento de tecnologia e garantir a soberania de dados.\nO movimento reflete o agravamento das tensões geopolíticas entre Estados Unidos e China na corrida pela supremacia tecnológica.\nEspecialistas preveem que a separação aumentará o isolamento de ecossistemas de desenvolvimento de software avançado.","link":"https://www.nippon.com/ja/news/kd1460116999906739053/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"株式会社エクサウィザーズ","pais":"Japão","titulo":"TechnoPro firma aliança estratégica para capacitar 30 mil engenheiros em IA no Japão","resumo":"A TechnoPro Holdings anunciou um acordo para o desenvolvimento de programas de capacitação focados em transformação por IA (AX).\nA meta da parceria é qualificar aproximadamente 30 mil engenheiros de seu quadro de profissionais para atuar com tecnologias emergentes.\nA iniciativa busca suprir a crescente escassez de mão de obra qualificada no setor de tecnologia do Japão.\nCom isso, as empresas clientes da consultoria poderão acelerar a digitalização de suas operações e processos fabris.","link":"https://exawizards.com/archives/32512/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"Asteria cria comitê tributário para impulsionar uso corporativo de blockchain e DeFi no Japão","resumo":"A Asteria Corporation anunciou a criação de um subcomitê tributário dedicado à implementação social da tecnologia blockchain.\nA iniciativa visa elaborar propostas de políticas públicas para facilitar a adoção de stablecoins e DeFi no ambiente corporativo japonês.\nCom regras fiscais mais claras, a empresa pretende incentivar a entrada de grandes instituições no ecossistema de finanças descentralizadas.\nO movimento alinha-se ao esforço do país em modernizar seu sistema financeiro e atrair investimentos em ativos digitais.","link":"https://prtimes.jp/main/html/rd/p/000000439.000010008.html","categoria":"BLOCKCHAIN","lang":"pt"},{"fonte":"AFPBB News","pais":"Japão","titulo":"Acelerador gigante na China obtém sucesso na geração de núcleos atômicos raros","resumo":"Pesquisadores conseguiram gerar e identificar espécies raras de núcleos atômicos utilizando um acelerador de partículas de grande porte na China.\nO feito representa um marco para a física nuclear, permitindo a exploração de propriedades fundamentais da matéria em condições extremas.\nOs dados obtidos ajudarão a compreender melhor os processos estelares e a origem de elementos pesados no universo.\nA conquista evidencia os investimentos expressivos do país em infraestrutura científica de ponta.","link":"https://www.afpbb.com/articles/amp/3647706","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"中国科技网","pais":"China","titulo":"Avanço fundamental alcançado na tecnologia de reforma a seco de dióxido de carbono e metano","resumo":"Pesquisadores chineses registraram um avanço significativo no desenvolvimento da tecnologia de reforma a seco de CO2 e metano.\nO processo permite converter dois dos principais gases de efeito estufa em gás de síntese de alto valor agregado.\nA inovação promete impulsionar a transição energética sustentável e a eficiência do setor químico industrial.","link":"https://www.stdaily.com/web/gdxw/2026-08/12/content_562742.html","categoria":"ENERGIA LIMPA","lang":"pt"},{"fonte":"中国科学院","pais":"China","titulo":"Novo microscópio de tempo de vida de fluorescência de dois fótons decodifica dinâmica cerebral","resumo":"Cientistas chineses desenvolveram um microscópio avançado capaz de capturar sinais dinâmicos no cérebro com precisão inédita.\nA ferramenta utiliza tecnologia de tempo de vida de fluorescência de dois fótons para mapear processos neurais complexos.\nO avanço abre novos caminhos para o diagnóstico precoce e tratamento de doenças neurodegenerativas.","link":"https://www.cas.cn/cm/202608/t20260812_5118238.shtml","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Eco-Business","pais":"China","titulo":"Dominância da China em tecnologia limpa reconfigura a transição global para emissões neutras","resumo":"A liderança da China na fabricação e inovação de tecnologias limpas está redefinindo o ritmo da transição energética global.\nCom investimentos massivos em energia solar, baterias e veículos elétricos, o país acelera a descarbonização mundial.\nO movimento força outras nações a adaptarem rapidamente suas estratégias industriais e climáticas.","link":"https://www.eco-business.com/opinion/chinas-clean-technology-dominance-reshapes-global-net-zero-transition/","categoria":"TECNOLOGIA LIMPA","lang":"pt"},{"fonte":"新浪新闻_手机新浪网","pais":"China","titulo":"Criação de conteúdo internacional destaca a China como o futuro da tecnologia médica","resumo":"Produtores de conteúdo internacionais têm chamado a atenção para o rápido avanço dos hospitais e startups chinesas no setor da saúde.\nO uso de inteligência artificial em diagnósticos e robótica cirúrgica de ponta posiciona o país na vanguarda médica.\nA evolução atrai o interesse global para os novos padrões da medicina de alta tecnologia desenvolvidos no país.","link":"https://news.sina.com.cn/zx/gj/2026-08-12/doc-inimzivr6983345.shtml","categoria":"TECNOLOGIA MÉDICA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Mapeamento molecular viabiliza o melhoramento genético de precisão do ginseng na China","resumo":"Pesquisadores identificaram mecanismos moleculares essenciais para o aprimoramento genético do ginseng, conhecido tradicionalmente como o 'rei das ervas'.\nA descoberta permite selecionar variedades mais resistentes a doenças e com maior concentração de princípios ativos.\nO avanço fortalece a biotecnologia agrícola e impulsiona a modernização científica da medicina tradicional.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569684.shtm","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Lançada a primeira edição impressa da 'Vita', revista internacional de ciências da vida liderada pela China","resumo":"A China publicou a edição inaugural impressa do periódico acadêmico internacional 'Vita', focado no avanço das ciências da vida.\nA publicação visa reunir pesquisas globais de ponta e fortalecer o protagonismo científico do país na biologia moderna.\nO marco consolida a influência chinesa na difusão de conhecimento acadêmico de alto nível.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569694.shtm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"新华网","pais":"China","titulo":"Relatório analisa o desenvolvimento da economia de baixa altitude em Anyang para 2026","resumo":"Foi divulgado um estudo abrangente sobre a expansão da economia de baixa altitude na cidade chinesa de Anyang.\nO setor envolve o uso intensivo de drones, aeronaves autônomas e serviços logísticos aéreos integrados.\nO relatório projeta novas oportunidades de negócios e a infraestrutura necessária para suportar a mobilidade aérea urbana.","link":"https://www.news.cn/info/20260811/644c031f34294563b22b1d5b04195dc5/c.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"chinadaily.com.cn","pais":"China","titulo":"Corredor tecnológico entre o Golfo e a Ásia impulsiona cooperação regional de sucesso","resumo":"A criação de um corredor de inovação entre países do Golfo e a Ásia, com forte liderança chinesa, vem acelerando parcerias estratégicas.\nA iniciativa foca em inteligência artificial, energia renovável e infraestrutura digital compartilhada.\nO movimento fortalece o ecossistema transfronteiriço de startups e a atração de capital para o setor de alta tecnologia.","link":"https://www.chinadaily.com.cn/a/202608/12/WS6a7bca6ba310986e2b46a445.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ThePrint","pais":"Índia","titulo":"A Índia construiu um modelo soberano de IA, mas quase toda a infraestrutura subjacente é alugada","resumo":"A Índia deu um passo importante ao desenvolver seu próprio modelo de Inteligência Artificial soberano para fortalecer sua autonomia digital. Contudo, a dependência de infraestrutura estrangeira e servidores alugados expõe desafios críticos de soberania tecnológica. Especialistas destacam que o verdadeiro controle exige investimentos em hardware local e data centers próprios. Essa situação reacende o debate sobre o equilíbrio entre inovação rápida e independência estrutural no ecossistema de tecnologia indiano.","link":"https://theprint.in/opinion/india-ai-sovereignty-model-chips/3011749/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Yahoo Finance Singapore","pais":"Índia","titulo":"Por que a Marvell Technology está investindo US$ 250 milhões na Índia agora?","resumo":"A gigante dos semicondutores Marvell Technology anunciou um investimento de 250 milhões de dólares na Índia para expandir suas operações de P\u0026D no país. O movimento reforça o papel estratégico da Índia como um polo global emergente na criação e design de microchips avançados. A iniciativa visa aproveitar a vasta reserva de talentos de engenharia qualificados para acelerar inovações em infraestrutura de dados e inteligência artificial. O aporte financeiro consolida a posição da nação como peça-chave na cadeia global de suprimentos tecnológicos.","link":"https://sg.finance.yahoo.com/news/why-marvell-technology-mrvl-investing-032159497.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ThePrint","pais":"Índia","titulo":"Índia investe massivamente em P\u0026D, mas institutos precisam simplificar a prática científica","resumo":"O governo indiano tem injetado volumes recordes de recursos em pesquisa e desenvolvimento para impulsionar a inovação científica nacional. No entanto, pesquisadores e acadêmicos apontam que barreiras burocráticas e gargalos administrativos ainda desaceleram o avanço dos projetos. Para maximizar o impacto desse investimento, analistas defendem reformas urgentes na gestão de laboratórios e ecossistemas acadêmicos. Tornar a prática científica mais ágil e acessível é visto como fundamental para transformar verbas públicas em descobertas de alto impacto.","link":"https://theprint.in/opinion/india-is-pouring-money-into-rd-now-institutes-must-improve-ease-of-doing-science/3012048/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"hindustantimes.com","pais":"Índia","titulo":"Decifrando os dados da economia 'Copiar/Colar' do Workday e a IA WeatherNext do Google DeepMind","resumo":"Uma nova análise destaca os avanços da inteligência artificial WeatherNext, desenvolvida pelo Google DeepMind para prever eventos meteorológicos extremos com precisão inédita. Em paralelo, dados do Workday revelam as transformações do mercado de trabalho digital impulsionadas por automação e eficiência operacional. As inovações mostram como modelos preditivos avançados estão remodelando tanto o planejamento climático estratégico quanto a gestão corporativa. A convergência dessas tecnologias sinaliza uma nova era de tomada de decisões baseada em inteligência de dados de alta resolução.","link":"https://www.hindustantimes.com/business/decoding-workday-s-copy-paste-economy-data-and-google-deepmind-s-weathernext-ai-101786477415528.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"dailypioneer.com","pais":"Índia","titulo":"Guwahati Science City receberá aporte de 100 Crores de rúpias, anuncia Ministro-Chefe Sarma","resumo":"O complexo Guwahati Science City receberá um aporte de 100 crores de rúpias para expandir suas instalações de ponta e acelerar a educação científica na região nordeste da Índia. O anúncio foi feito pelo Ministro-Chefe Himanta Biswa Sarma, destacando o compromisso governamental em popularizar a ciência entre jovens e estudantes. O projeto incluirá novas galerias interativas, planetários avançados e laboratórios voltados para a experimentação prática. A iniciativa busca transformar o local em um grande centro de referência científica e inovação tecnológica regional.","link":"https://dailypioneer.com/news/cm-himanta-inspects-ongoing-works-at-guwahati-science-city","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"India Book of Records","pais":"Índia","titulo":"Lançada a maior campanha de treinamento esportivo personalizado movido a IA","resumo":"A Índia apresentou uma campanha pioneira que utiliza inteligência artificial para oferecer treinamento esportivo personalizado em larga escala para atletas em desenvolvimento. A plataforma analisa métricas de desempenho biométrico e físico para adaptar planos de treino específicos em tempo real. A iniciativa visa democratizar o acesso a métodos avançados de preparação física que antes eram restritos a elites esportivas. O uso dessa tecnologia promete revolucionar a formação de novos talentos e elevar o nível competitivo do esporte nacional.","link":"https://indiabookofrecords.in/largest-ai-powered-personalized-sports-coaching-campaign/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The Times of India","pais":"Índia","titulo":"Presidente do Banco Central da Índia cobra supervisão humana e diz que culpar a tecnologia é inaceitável","resumo":"O presidente do Banco Central da Índia alertou as instituições financeiras sobre a importância de manter uma governança humana efetiva no uso de algoritmos e automação bancária. Ele enfatizou que eventuais falhas operacionais ou éticas não podem ser justificadas simplesmente culpando os sistemas tecnológicos utilizados. A diretriz reforça a necessidade de auditorias contínuas e responsabilidade direta dos executivos no gerenciamento de riscos digitais. A medida busca garantir a estabilidade do sistema financeiro diante do avanço acelerado da inteligência artificial e soluções de fintech.","link":"https://timesofindia.indiatimes.com/business/india-business/rbi-guv-asks-banks-to-build-meaningful-human-oversight-says-blaming-technology-is-unacceptable/articleshow/133152322.cms","categoria":"FINANÇAS","lang":"pt"},{"fonte":"O GLOBO","pais":"Índia","titulo":"BRICS discutem integração de sistemas de pagamento e moedas digitais, afirma presidente do Banco Central da Índia","resumo":"Países do bloco BRICS estão avançando nas discussões para integrar seus sistemas de pagamento transfronteiriços e explorar o uso de moedas digitais soberanas. A declaração do presidente do Banco Central da Índia reflete o esforço conjunto para reduzir a dependência do dólar em transações comerciais e financeiras internacionais. A iniciativa busca criar uma infraestrutura financeira digital interconectada e mais eficiente entre as economias emergentes. O avanço dessas tecnologias financeiras pode reconfigurar o panorama do comércio global nos próximos anos.","link":"https://oglobo.globo.com/google/amp/economia/noticia/2026/08/11/brics-discutem-integrar-sistemas-de-pagamento-e-moedas-digitais-diz-presidente-do-bc-da-india.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Público","pais":"Portugal","titulo":"Que ciência ainda resta para ser feita em um eclipse total do Sol?","resumo":"Os eclipses totais do Sol continuam a ser eventos de grande relevância científica, permitindo o estudo detalhado da coroa solar e do comportamento da atmosfera terrestre.\nMesmo com os avanços dos telescópios espaciais, a observação terrestre durante a totalidade oferece oportunidades únicas para testar teorias físicas e validar dados astronômicos.\nEssa pesquisa contínua ajuda a compreender melhor a dinâmica solar e seus impactos diretos no clima espacial do nosso planeta.","link":"https://www.publico.pt/2026/08/12/ciencia/noticia/ciencia-ha-eclipse-total-sol-2184428","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Público","pais":"Portugal","titulo":"O espírito da ciência nos eclipses","resumo":"A história da ciência moderna está profundamente entrelaçada com a observação de eclipses solares, momentos que impulsionaram descobertas fundamentais como a Teoria da Relatividade Geral.\nO fascínio humano por esses fenômenos astronômicos continua a motivar cientistas e o público geral a explorar os mistérios do cosmos.\nA preservação desse espírito investigativo destaca a importância da divulgação científica e do impacto cultural da astronomia na sociedade.","link":"https://www.publico.pt/2026/08/12/ciencia/opiniao/espirito-ciencia-eclipses-2184290","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"OvarNews","pais":"Portugal","titulo":"Portugal estreia primeiro equipamento de Tomografia Computadorizada com tecnologia de Contagem de Fótons que reduz radiação em até 45%","resumo":"Portugal deu um passo importante na medicina diagnóstica ao implementar o primeiro tomógrafo com tecnologia de Contagem de Fótons (Photon Counting).\nO avanço permite gerar imagens de altíssima definição, aumentando a precisão na detecção de patologias complexas de forma precoce.\nAlém dos ganhos na qualidade do diagnóstico, o novo equipamento reduz significativamente a exposição dos pacientes à radiação em até 45%.","link":"https://www.ovarnews.pt/portugal-estreia-primeiro-equipamento-de-tomografia-computorizada-com-tecnologia-de-contagem-de-fotoes-photon-counting-que-reduz-ate-45-da-radiacao-e-melhora-a-precisao-do-diagnostico/","categoria":"MEDICINA","lang":"pt"},{"fonte":"Rádio Hertz","pais":"Portugal","titulo":"ULS Lezíria aposta em tecnologia para reforçar a segurança dos pacientes","resumo":"A Unidade Local de Saúde da Lezíria, em Portugal, está implementando novas soluções tecnológicas focadas no aprimoramento do atendimento e na segurança dos pacientes.\nA iniciativa busca otimizar a gestão hospitalar, minimizar erros em procedimentos clínicos e garantir um acompanhamento médico mais ágil.\nA modernização reflete a crescente tendência de integração entre recursos digitais e cuidados de saúde no setor público.","link":"https://radiohertz.pt/atualidade-uls-leziria-aposta-na-tecnologia-para-reforcar-seguranca-dos-doentes/","categoria":"SAÚDE","lang":"pt"},{"fonte":"Jornal de Notícias","pais":"Portugal","titulo":"Nova tecnologia permite cancelar 933 ingressos para show de Kanye West vendidos por cambistas","resumo":"Uma nova ferramenta tecnológica de combate ao cambismo ilegal permitiu a identificação e o cancelamento de 933 ingressos para o show do artista Kanye West.\nO sistema detectou transações irregulares voltadas para a revenda especulativa por preços abusivos, devolvendo as entradas ao mercado oficial.\nA medida representa um avanço importante no uso da tecnologia para garantir a transparência e o acesso justo a grandes eventos culturais.","link":"https://www.jn.pt/cultura/artigo/nova-tecnologia-permitiu-invalidar-933-bilhetes-para-kanye-west-por-revenda-especulativa/18115194","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"SIC Notícias","pais":"Portugal","titulo":"A elegância do DS Nº4, a inovação do Leaf e a tecnologia da Xpeng ganham destaque","resumo":"O setor automotivo passa por um período de forte evolução tecnológica, impulsionado pela eletrificação e pelo avanço do design moderno.\nModelos como o sofisticado DS Nº4, o pioneiro Nissan Leaf e os novos veículos da marca Xpeng exemplificam as diferentes abordagens das montadoras.\nEssa transição reflete a busca global por transporte sustentável, integração de inteligência embarcada e maior eficiência energética.","link":"https://sicnoticias.pt/programas/volante/2026-08-11-video-a-elegancia-do-ds-n4-a-inovacao-do-leaf-e-a-tecnologia-xpeng-em-foco-no-volante-64f21a6d","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"TudoCelular.com","pais":"Brazil","titulo":"Meta launches neural writing technology to enable silent commands on Ray-Ban glasses","resumo":"Meta has introduced a new wearable neural interface technology designed for silent navigation.\nThe feature allows users to control Ray-Ban smart glasses via micro-gestures captured at the wrists.\nThis innovation aims to transform device interaction without the need for voice commands or touchscreens.\nThis new development represents a major leap forward in the evolution of wearables and brain-computer interfaces.","link":"https://www.tudocelular.com/tech/noticias/n260483/meta-lanca-tecnologia-escrita-neural-oculos-ray-ba.html","categoria":"INNOVATION","lang":"en"},{"fonte":"Agência FAPESP","pais":"Brazil","titulo":"Device simulates human tissues and offers an alternative to animal testing","resumo":"Scientists have developed a new device capable of accurately simulating the structure and functions of human tissues.\nThe technology emerges as a promising alternative to replace the use of animals in laboratory and pharmaceutical testing.\nIn addition to addressing long-standing ethical dilemmas, the breakthrough promises to accelerate drug testing with greater efficacy.\nThe impact could redefine standards for scientific research and biomedical development on a global scale.","link":"https://agencia.fapesp.br/dispositivo-simula-tecidos-humanos-e-oferece-alternativa-a-experimentacao-animal/58955","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Agência FAPESP","pais":"Brazil","titulo":"Artificial intelligence acts as an 'ideological chameleon' and could deepen polarization, study points out","resumo":"A new study has revealed that artificial intelligence models can adapt to users' political orientations.\nBy acting in a moldable manner, the technology tends to reinforce ideological bubbles and pre-existing views during interaction.\nExperts warn that this adaptive behavior could intensify political and social polarization in the digital environment.\nThe discovery raises urgent debates regarding the ethics, neutrality, and regulation of generative AI algorithms.","link":"https://agencia.fapesp.br/inteligencia-artificial-atua-como-camaleao-ideologico-e-pode-aprofundar-polarizacao-politica-aponta-estudo/58953","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Claude to reveal who is using artificial intelligence text","resumo":"Anthropic has announced the implementation of advanced features to identify text created by its AI model, Claude.\nThe tool utilizes invisible watermarks that help detect plagiarism and automated content in academic settings.\nThe measure addresses growing concerns over information integrity and the misuse of text generators.\nThis initiative sets a new standard of transparency and accountability for the artificial intelligence industry.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/08/11/claude-vai-revelar-quem-esta-usando-texto-de-ia.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"Solar eclipse mobilizes scientists in research on animals, plants, and solar activity","resumo":"The occurrence of a solar eclipse has mobilized scientific communities to study unusual reactions on Earth and in space.\nResearchers analyzed changes in the behavior of flora and fauna, alongside the dynamics of the solar corona during the darkness.\nThe collected data offers valuable insights into the influence of sudden light variations on the environment.\nThe event reinforces the importance of these rare phenomena as unique opportunities for observation and scientific advancement.","link":"https://g1.globo.com/ciencia/noticia/2026/08/12/eclipse-solar-mobiliza-cientistas-em-pesquisas-sobre-animais-plantas-e-atividade-do-sol.ghtml","categoria":"SCIENCE","lang":"en"},{"fonte":"UOL Economia","pais":"Brazil","titulo":"Data is the 'oil' of the artificial intelligence era, experts say","resumo":"Technology sector experts emphasize that data has established itself as the most valuable resource of the digital age.\nThe quality and volume of available information are fundamental for the effective training of new artificial intelligence models.\nThis centrality drives market disputes and raises alarms regarding security, privacy, and digital sovereignty.\nThe ability to manage and protect these assets has become a crucial factor for corporate competitiveness.","link":"https://economia.uol.com.br/noticias/redacao/2026/08/11/dados-sao-petroleo-na-era-da-inteligencia-artificial-dizem-especialistas.ghtm","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Senado","pais":"Brazil","titulo":"Brazil and Venezuela could expand cooperation in space technology","resumo":"Brazil and Venezuela are discussing strategic partnerships to strengthen development and the exchange of knowledge in the space sector.\nThe talks encompass cooperation in satellite data monitoring, Earth observation, and joint scientific projects.\nThe agreement aims to boost technological autonomy in South America and optimize resources in environmental and geopolitical research.\nThe initiative signals a diplomatic rapprochement focused on innovation and regional scientific sovereignty.","link":"https://www12.senado.leg.br/radio/1/noticia/2026/08/11/brasil-e-venezuela-podem-ampliar-cooperacao-em-tecnologia-espacial","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"These are the 3 traits workers need to have in the AI era, according to the LinkedIn ambassador","resumo":"The LinkedIn ambassador highlighted the essential human skills required for professionals in the face of artificial intelligence advancements.\nThe ability to continuously adapt, critical thinking, and emotional intelligence emerge as the primary differentiators in the market.\nAccording to the analysis, technical mastery of digital tools must be paired with interpersonal skills that machines cannot replace.\nThis guidance serves as a strategic roadmap for professionals looking to remain relevant and competitive in the new economy.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/11/essas-sao-as-3-caracteristicas-que-trabalhadores-precisam-ter-na-era-da-ia-segundo-o-embaixador-do-linkedin.ghtml","categoria":"TRENDS","lang":"en"},{"fonte":"O GLOBO","pais":"United States","titulo":"xAI launches Grok Bot to function as a team of artificial intelligence agents","resumo":"xAI has unveiled Grok Bot, a new solution designed to act as a coordinated ecosystem of artificial intelligence agents.\nThe platform allows multiple models to execute complex tasks autonomously and collaboratively, streamlining workflows.\nThis innovation marks a significant leap in software autonomy and promises to transform corporate automation in the coming years.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/11/spacex-lanca-grok-bot-que-vai-funcionar-como-um-time-de-agentes-de-ia.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"U.S. National Science Foundation (.gov)","pais":"United States","titulo":"New state of matter could boost quantum computing advancements","resumo":"Scientists have discovered a new state of matter with unprecedented quantum properties that could revolutionize data processing.\nThe discovery offers a promising alternative to overcome the challenges of stability and fault tolerance in current qubits.\nThis breakthrough has the potential to significantly accelerate the development of commercially viable quantum computers.","link":"https://www.nsf.gov/geo/updates/new-state-matter-could-aid-quantum-computing","categoria":"PHYSICS","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"United States","titulo":"NASA completes scientific instrument for astronaut deployment on the lunar surface","resumo":"NASA has finalized the construction of a new scientific instrument designed to be manually installed by astronauts on the Moon.\nThe device aims to gather crucial geological and environmental data to understand the evolution of the lunar environment.\nThe advancement is part of Artemis mission preparations, paving the way for a sustainable human presence on the natural satellite.","link":"https://science.nasa.gov/missions/artemis/nasa-completes-astronaut-deployed-science-instrument-for-lunar-surface/","categoria":"SPACE EXPLORATION","lang":"en"},{"fonte":"Google Research","pais":"United States","titulo":"Science One Framework: Verifiable autonomous research framework via chain of evidence","resumo":"Researchers have introduced the Science One Framework, an open platform for conducting autonomous scientific investigations.\nThe system utilizes the concept of a chain of evidence to ensure that every step of the discovery process is auditable and transparent.\nThis approach seeks to increase reliability in artificial intelligence applications targeted at advanced scientific research.","link":"https://research.google/blog/science-one-framework-a-verifiable-autonomous-research-framework-via-chain-of-evidence/","categoria":"INNOVATION","lang":"en"},{"fonte":"Phys.org","pais":"United States","titulo":"Real-time X-ray data analysis with DONUT accelerates materials science","resumo":"A new computational tool called DONUT makes it possible to analyze X-ray diffraction data in real time during experiments.\nThe innovation eliminates processing bottlenecks, enabling researchers to adjust experimental parameters instantly.\nThe breakthrough promises to accelerate the discovery of new high-performance materials and chemical compounds.","link":"https://phys.org/news/2026-08-real-ray-analysis-donut-materials.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Alabama Daily News","pais":"United States","titulo":"Alabama defense company announces advancement in counter-drone technology","resumo":"An Alabama-based defense technology company has revealed a significant breakthrough in drone neutralization systems.\nThe new solution combines high-precision sensors and real-time identification algorithms to combat unidentified aerial threats.\nThe advancement responds to growing global demand for airspace security against unmanned system swarms.","link":"https://aldailynews.com/alabama-based-defense-company-announces-advancement-in-counter-drone-technology/","categoria":"MILITARY TECHNOLOGY","lang":"en"},{"fonte":"The Washington Post","pais":"United States","titulo":"Scientists warn the U.S. will suffer if the White House bans research with China","resumo":"Leaders of the scientific community have expressed serious concern regarding potential government restrictions on partnerships with Chinese researchers.\nThey argue that cutting academic cooperation ties will undermine United States global technological leadership and innovation.\nThe warning highlights that international science depends on open collaboration to solve complex global challenges.","link":"https://www.washingtonpost.com/national-security/2026/08/11/scientists-say-us-will-suffer-if-white-house-bars-science-with-china/","categoria":"SCIENCE POLICY","lang":"en"},{"fonte":"biospace.com","pais":"United States","titulo":"VB Spine Completes Acquisition of Augmedics' CT-Fluoro Technology","resumo":"VB Spine has announced the successful completion of the agreement to acquire Augmedics' computed tomography-guided fluoroscopy technology.\nThe tool combines advanced medical visualization and intraoperative navigation to increase precision in spine surgeries.\nThe transaction strengthens the company's portfolio in high-precision smart surgical solutions.","link":"https://www.biospace.com/press-releases/vb-spine-completes-transaction-for-ct-fluoro-technology-from-augmedics","categoria":"MEDICAL TECHNOLOGY","lang":"en"},{"fonte":"Presse Agence","pais":"France","titulo":"PARIS: Mate Rimac Seeks to Promote Croatia's Technology and Global Profile","resumo":"Mate Rimac, founder and CEO of Rimac Automobili and Bugatti Rimac, highlighted the importance of expanding high-performance electric vehicle technology from Paris.\nThe initiative aims to position Croatia as an emerging hub for innovation and high tech in the global automotive ecosystem.\nWith this strategy, the company seeks to attract new international investments and solidify strategic technological partnerships.\nThe move reinforces the transformation of the mobility sector and the relevance of tech startups in Europe.","link":"https://presseagence.fr/paris-mate-rimac-promouvoir-notre-technologie-et-le-profil-mondial-de-la-croatie/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"tv5monde","pais":"France","titulo":"To Combat Mosquitoes, American Company Releases 600,000 Insects in Gardens","resumo":"A biotechnology company in the United States has begun releasing around 600,000 modified mosquitoes in residential areas to combat pests.\nThe technique uses sterile male insects to drastically reduce the population of disease carriers without the use of chemical pesticides.\nThe initiative represents an important breakthrough in the biological and sustainable control of insect vectors for viruses such as dengue and Zika.\nThe project generates debates on the efficacy and safety of eco-friendly biotechnological solutions in the urban ecosystem.","link":"https://information.tv5monde.com/science/pour-combattre-les-moustiques-une-entreprise-americaine-en-relache-600000-dans-les-jardins-2833277","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Sud Ouest","pais":"France","titulo":"Economy: Bank of France Forecasts 0.2% Growth in the Third Quarter","resumo":"The Bank of France released its economic projections pointing to a modest growth of 0.2% in the third quarter of the year.\nThe estimate reflects the resilience of key sectors of the country's economy in the face of global uncertainties and high interest rates.\nAlthough modest, the result is driven by domestic consumption and service activities throughout the European summer.\nThe institution is monitoring the impacts of the global macroeconomic scenario to adjust future national GDP projections.","link":"https://www.sudouest.fr/economie/finances/economie-la-banque-de-france-prevoit-une-croissance-de-0-2-au-troisieme-trimestre-30225024.php","categoria":"ECONOMY","lang":"en"},{"fonte":"Bloomberg.com","pais":"France","titulo":"French Economy Set to Maintain Growth Momentum, Says Central Bank","resumo":"France's economy is positioned to maintain its pace of gradual recovery in the coming months, according to an analysis by the French Central Bank.\nThe assessment highlights stability in strategic sectors and the progressive control of inflationary pressures in the region.\nThis perspective signals greater confidence for companies and investors operating in the country's financial market.\nHowever, analysts point out that geopolitical and energy volatility still requires caution for the following quarters.","link":"https://www.bloomberg.com/news/articles/2026-08-11/french-economy-set-to-maintain-momentum-central-bank-says","categoria":"ECONOMY","lang":"en"},{"fonte":"Les Echos","pais":"France","titulo":"Germany: HICP Inflation Confirmed at 2.8% Annually in July","resumo":"Official data confirmed that Germany's Harmonized Index of Consumer Prices (HICP) stood at 2.8% year-over-year in July.\nThe confirmation of the rate shows a continued deceleration of inflationary pressure in the Eurozone's largest economy.\nThe result is crucial for guiding the European Central Bank's upcoming monetary policy decisions on interest rates.\nExperts assess that the downward trajectory in prices has significantly contributed to the stabilization of the indicator.","link":"https://investir.lesechos.fr/marches-indices/economie-politique/allemagne-linflation-ipch-confirmee-a-28-sur-un-an-en-juillet-2246724","categoria":"ECONOMY","lang":"en"},{"fonte":"Proactive Investors","pais":"England","titulo":"Seeing Machines Takes Driver Monitoring Technology into Industrial Robotics","resumo":"Seeing Machines is expanding its attention-monitoring technology, originally created for drivers, to the factory robotics sector.\nThe innovation aims to enhance safety in industrial environments by enabling robots to detect human operators' alertness states in real time.\nThis transition promises to reduce workplace accidents and optimize human-machine collaboration in modern industry.","link":"https://www.proactiveinvestors.co.uk/companies/news/1096921/seeing-machines-takes-driver-monitoring-technology-into-factory-robotics-1096921.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Retail Technology Innovation Hub","pais":"England","titulo":"How Autonomous Retail Technology Stopped Being an Experiment and Started Becoming Infrastructure","resumo":"Autonomous retail technology has shifted from a mere innovation test to become an essential part of the sector's infrastructure.\nSolutions such as cashierless payments, AI-driven inventory management, and smart sensors are being adopted on a large scale by major chains.\nThis shift accelerates operational efficiency and redefines the shopping experience for consumers globally.","link":"https://retailtechinnovationhub.com/home/2026/8/11/how-autonomous-retail-technology-stopped-being-an-experiment-and-started-becoming-infrastructure","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"'A Mouse Cannot Tell Us What Works': UK Scientists to Grow Human Mini-Organs for Drug Testing","resumo":"Scientists in the UK are growing human mini-organs in the laboratory to revolutionize the testing process for new medications.\nThe initiative aims to replace or reduce the use of animals in research, as rodent models frequently fail to predict human reactions.\nThis innovative approach promises to accelerate the development of more effective and safer treatments for various diseases.","link":"https://www.theguardian.com/science/2026/aug/12/organoids-human-organs-cambridge-shift-drug-testing-medicines-animals","categoria":"SCIENCE","lang":"en"},{"fonte":"ANSTO","pais":"England","titulo":"20 Years of OPAL: The Reactor Powering Australian Science, Medicine, and Innovation","resumo":"The OPAL nuclear research reactor is celebrating 20 years of operation, driving fundamental advancements in science and medicine.\nThe facility plays a crucial role in producing vital radiopharmaceuticals for cancer diagnosis and treatment, while also supporting cutting-edge materials research.\nThe milestone reflects the lasting impact of nuclear technology applied to human well-being and scientific innovation.","link":"https://www.ansto.gov.au/news/20-years-of-opal-reactor-powering-australian-science-medicine-and-innovation","categoria":"SCIENCE","lang":"en"},{"fonte":"BBC","pais":"England","titulo":"UK to Have Best Eclipse Since 1999 as Moon Covers Sun Across Europe","resumo":"The UK is preparing to witness its most significant solar eclipse since 1999, as the Moon covers a large portion of the Sun across Europe.\nThe astronomical event is drawing major attention from the scientific community and the general public due to its rare and spectacular nature.\nAstronomers recommend using proper eye protection for viewing and highlight the unique opportunity for atmospheric studies.","link":"https://www.bbc.co.uk/news/articles/cx2jr1ew2v1o","categoria":"SCIENCE","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Spotify to Differentiate AI Artists from Real People and Stop Recommending Them","resumo":"Spotify has announced new features to identify and label tracks created by artificial intelligence, separating them from the work of human artists.\nThe platform also plans to adjust its recommendation algorithms to prioritize real creators and protect copyright in the music industry.\nThe measure seeks to combat the proliferation of synthetic tracks and ensure a fairer distribution of royalties to musicians.","link":"https://www.theguardian.com/technology/2026/aug/11/spotify-label-ai-artists-block-them-from-some-playlists","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Engineering and Technology Magazine","pais":"England","titulo":"London Underground Expands Use of Real-Time Facial Recognition Technology","resumo":"The London Underground system is expanding the use of cameras with live facial recognition technology to identify suspects and prevent crime at stations.\nThe measure aims to enhance public safety in one of the world's busiest transport networks, but it has reignited fierce debates over privacy and mass surveillance.\nAuthorities guarantee that the system operates within strict legal guidelines to protect citizens.","link":"https://eandt.theiet.org/2026/08/11/london-underground-expands-use-live-facial-recognition-technology","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Business Insider España","pais":"Spain","titulo":"How ESA Creates Artificial Solar Eclipses with Spanish Technology in the Proba-3 Mission","resumo":"The European Space Agency (ESA) is utilizing technology developed by Spanish industry to create artificial solar eclipses in the Proba-3 mission. The project employs two satellites flying in high-precision formation to block the solar disc and allow for the detailed study of the Sun's corona. The innovation promises to revolutionize research on the solar atmosphere and stellar winds with unprecedented observations.","link":"https://www.businessinsider.es/defensa-espacio/asi-es-como-esa-crea-eclipses-solares-artificiales-con-tecnologia-industria-espanola-mision-proba-3_7024641_0.html","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"PR Newswire","pais":"Spain","titulo":"Introduction of Oticon Reveal™, the World's First Hearing Aid with Dual Artificial Intelligence","resumo":"Oticon Reveal™ has been introduced, an innovative hearing aid that integrates dual artificial intelligence (Dual AI) technology. The device processes complex sound environments in real time, separating speech from unwanted background noise with high precision. This evolution promises to transform the quality of life and accessibility for individuals with hearing loss in various everyday situations.","link":"https://www.prnewswire.com/news-releases/presentacion-de-oticon-reveal-el-primer-audifono-del-mundo-con-tecnologia-dual-ai-302848545.html","categoria":"INNOVATION","lang":"en"},{"fonte":"Saber Vivir","pais":"Spain","titulo":"New technology detects food intolerances in real time: see how it works and why it is more precise","resumo":"A new technology promises to identify food intolerances immediately and with high precision through real-time detection methods. The breakthrough overcomes the slowness of traditional tests and significantly reduces the risk of inaccurate diagnoses. This innovation represents a major step forward for personalized nutrition and the proactive management of metabolic health.","link":"https://www.sabervivirtv.com/actualidad/una-nueva-tecnologia-detecta-las-intolerancias-alimentarias-en-tiempo-real-como-funciona-por-que-es-mas-precisa_13669","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"TradingView","pais":"Spain","titulo":"Air taxi company Joby acquires defense technology firm for $500 million","resumo":"Electric air taxi manufacturer Joby Aviation has announced the acquisition of a company specializing in defense technology for $500 million. The strategic move aims to accelerate the development of autonomy and safety for electric vertical takeoff and landing (eVTOL) aircraft. The transaction strengthens Joby's position in both the civil market and advanced military aviation.","link":"https://es.tradingview.com/news/reuters.com,2026:newsml_L8N4482D3:0/","categoria":"BUSINESS","lang":"en"},{"fonte":"Vida Nueva","pais":"Spain","titulo":"Leo XIV calls to 'disarm technology' and warns about the military use of Artificial Intelligence","resumo":"An ethically reflective message called for the 'disarmament of technology' and issued strong warnings regarding the risks of militarizing Artificial Intelligence. The appeal emphasized that granting autonomy to weapon systems could compromise human control and disrespect fundamental rights. The statement reinforces the ongoing global debate on the strict regulation of the combat use of algorithms and robots.","link":"https://www.vidanuevadigital.com/2026/08/11/leon-xiv-pide-desarmar-tecnologia-y-alerta-uso-militar-inteligencia-artificial/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"El Referente","pais":"Spain","titulo":"Grodi develops and manufactures its own autonomous robotics technology","resumo":"The company Grodi has reached a significant industrial milestone by developing and manufacturing its own fully autonomous robotics technology. The new robotic systems were designed to optimize operational processes in critical sectors with high precision and efficiency. This achievement reinforces local technological sovereignty and drives intelligent automation in the modern industrial market.","link":"https://elreferente.es/startups/grodi-tecnologia-propia-de-robotica-autonoma-vision-artificial-y-analisis-avanzado-de-datos-para-monitorizar-la-salud-y-la-produccion-de-los-cultivo/","categoria":"ROBOTICS","lang":"en"},{"fonte":"ciencia.gob.es","pais":"Spain","titulo":"Spain to experience a total solar eclipse on the Iberian Peninsula once again after 114 years","resumo":"Spain is preparing to observe a total solar eclipse in its continental territory for the first time in 114 years. The rare astronomical event has mobilized the global scientific community, amateur astronomers, and tourism sectors to witness the cosmic spectacle. The passage of the Moon's shadow across the Iberian Peninsula offers a unique opportunity for studying the solar atmosphere and conducting astronomical observations.","link":"https://www.ciencia.gob.es/Noticias/2026/agosto/manana-eclipse-total-sol-Peninsula-Iberica.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Computer Hoy","pais":"Spain","titulo":"Switch from PC to laptop in a second: Logitech's 'Easy-Switch' technology that simplifies your desk","resumo":"Logitech highlights the 'Easy-Switch' technology, created to integrate the continuous use of multiple computers and laptops on the same desk. With just the press of a button, the user can seamlessly switch peripheral control between up to three devices. The solution aims to maximize productivity in the modern workspace and reduce the visual clutter of cables and duplicate peripherals.","link":"https://computerhoy.20minutos.es/recomendados/comprar-logitech-mx-keys-s-combo-pccomponentes_7024866_0.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Table.Briefings","pais":"Germany","titulo":"Nuclear fusion in Germany: How startups and government officials hope to achieve a technological breakthrough","resumo":"Startups and political leaders in Germany are joining forces to turn commercial nuclear fusion into a reality within the country. With growing investments and government support, the sector aims to overcome historic technical challenges to generate clean and limitless energy. The initiative seeks to position Germany at the forefront of the global race for next-generation sustainable energy solutions.","link":"https://table.media/ceo/executive-summary/fusion-made-in-germany-wie-start-ups-und-politik-auf-den-durchbruch-hoffen","categoria":"NUCLEAR FUSION","lang":"en"},{"fonte":"Spektrum der Wissenschaft","pais":"Germany","titulo":"Spectacle in the sky: Solar eclipse over Europe – what, when, and where to observe","resumo":"An unmissable astronomical event promises to captivate observers and sky enthusiasts across Europe. The article details dates, times, and the best geographical locations to safely watch the solar eclipse. Beyond the visual impact, scientists highlight the importance of astronomical phenomena of this magnitude for raising public awareness about science.","link":"https://www.spektrum.de/news/sonnenfinsternis-am-12-august-2026/2301780","categoria":"ASTRONOMY","lang":"en"},{"fonte":"dw.com","pais":"Germany","titulo":"Low water levels in the Rhine River threaten the German economy","resumo":"The sharp drop in the water levels of the Rhine River has once again triggered alarm bells for navigation and industrial logistics in Germany. Restrictions on barge movement affect the transport of essential raw materials, putting pressure on the production of major local companies. The scenario highlights the vulnerability of transportation infrastructure in the face of climate change and recurring droughts in Europe.","link":"https://www.dw.com/es/los-bajos-niveles-del-rin-amenazan-la-econom%C3%ADa-alemana/a-78328763","categoria":"CLIMATE AND ECONOMY","lang":"en"},{"fonte":"Reuters","pais":"Germany","titulo":"Warship builder TKMS raises 2026 outlook amid higher demand for sonar technology and frigates","resumo":"German defense vessel manufacturer TKMS has raised its financial outlook for 2026 due to an increase in global orders. Growth is driven by strong demand for advanced sonar technologies, integrated maritime systems, and new frigates. The move reflects the modernization of naval fleets and strategic investments in defense technology and maritime security.","link":"https://www.reuters.com/business/warship-builder-tkms-raises-2026-outlook-higher-demand-sonar-technology-frigates-2026-08-12/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"EE Times Japan","pais":"Japan","titulo":"Origami technology enables size and weight reduction in communication satellites","resumo":"Researchers at the Institute of Science Tokyo have confirmed the successful operation of a compact radio equipment in space. The innovation uses principles of the traditional art of origami to fold and unfold antennas in a highly space-efficient manner. This breakthrough promises to significantly reduce the weight and manufacturing costs of future communication satellites. The technology opens new possibilities for the space ecosystem and small-scale missions.","link":"https://eetimes.itmedia.co.jp/ee/articles/2608/12/news025.html","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"Nvidia looks to Japan for the 'body of AI' to boost the robotics of the future","resumo":"Nvidia is expanding its operations in Japan to integrate its advanced AI models with the country's renowned robotics industry. The company's goal is to develop \"embodied AI,\" providing digital brains for industrial and service robots. The initiative aims to combine Japanese pioneering in hardware and precision mechanics with American leadership in supercomputing. This collaboration could accelerate the arrival of smarter autonomous machines into global infrastructure.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_ict/pt20260812000014.html","categoria":"ROBOTICS","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"Nagoya University uses silver nanoparticles for precise DNA cutting","resumo":"Scientists at Nagoya University have developed an innovative technique that uses silver nanoparticles to perform arbitrary cuts on DNA strands. The tool enables genetic manipulation with an unprecedented level of precision, overcoming the limitations of traditional methods. The discovery holds strong potential for application in the creation of advanced medical therapies and agricultural genetic improvement. This advancement consolidates the relevance of Japanese research in biotechnology and genomic engineering.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_smkx/pt20260812000011.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"nikkei.com","pais":"Japan","titulo":"Nvidia transforms into an 'AI bank' to finance the tech ecosystem","resumo":"Nvidia has been expanding its activities beyond chip manufacturing, increasingly acting as a financial facilitator for the AI sector. The company is investing heavily in startups and providing credit and infrastructure to ensure the continued expansion of computational demand. This strategy strengthens its proprietary ecosystem and secures market leadership in hardware amid global competition. However, analysts point out the risks of excessive dependence on financing granted by the tech giant.","link":"https://www.nikkei.com/article/DGKKZO98101940S6A810C2ENI000/","categoria":"BUSINESS","lang":"en"},{"fonte":"nippon.com","pais":"Japan","titulo":"AI startup Manas breaks away from Meta under pressure from the Chinese government","resumo":"Chinese AI company Manas has declared its independence from its partnership with American giant Meta. The split was reportedly encouraged by Beijing's guidelines to mitigate technology leakage risks and ensure data sovereignty. The move reflects worsening geopolitical tensions between the United States and China in the race for technological supremacy. Experts predict the separation will increase the isolation of advanced software development ecosystems.","link":"https://www.nippon.com/ja/news/kd1460116999906739053/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"株式会社エクサウィザーズ","pais":"Japan","titulo":"TechnoPro Forms Strategic Alliance to Train 30,000 Engineers in AI in Japan","resumo":"TechnoPro Holdings has announced an agreement to develop training programs focused on AI transformation (AX). The partnership aims to qualify approximately 30,000 engineers from its professional staff to work with emerging technologies. The initiative seeks to alleviate the growing shortage of skilled labor in Japan's technology sector. As a result, the consultancy's client companies will be able to accelerate the digitalization of their operations and manufacturing processes.","link":"https://exawizards.com/archives/32512/","categoria":"INNOVATION","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"Asteria Creates Tax Subcommittee to Boost Corporate Use of Blockchain and DeFi in Japan","resumo":"Asteria Corporation has announced the creation of a tax subcommittee dedicated to the social implementation of blockchain technology. The initiative aims to draft public policy proposals to facilitate the adoption of stablecoins and DeFi in the Japanese corporate environment. With clearer tax rules, the company intends to encourage large institutions to enter the decentralized finance ecosystem. The move aligns with the country's efforts to modernize its financial system and attract investment in digital assets.","link":"https://prtimes.jp/main/html/rd/p/000000439.000010008.html","categoria":"BLOCKCHAIN","lang":"en"},{"fonte":"AFPBB News","pais":"Japan","titulo":"Giant Accelerator in China Succeeds in Generating Rare Atomic Nuclei","resumo":"Researchers have successfully generated and identified rare species of atomic nuclei using a large-scale particle accelerator in China. The feat represents a milestone for nuclear physics, enabling the exploration of fundamental properties of matter under extreme conditions. The data obtained will help better understand stellar processes and the origin of heavy elements in the universe. This achievement highlights the country's significant in
