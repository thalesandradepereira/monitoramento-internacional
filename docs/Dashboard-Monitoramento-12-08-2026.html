vestments in cutting-edge scientific infrastructure.","link":"https://www.afpbb.com/articles/amp/3647706","categoria":"SCIENCE","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"Fundamental Breakthrough Achieved in Carbon Dioxide and Methane Dry Reforming Technology","resumo":"Chinese researchers have registered a significant breakthrough in the development of CO2 and methane dry reforming technology. The process allows two of the main greenhouse gases to be converted into high-value-added synthesis gas. The innovation promises to drive the sustainable energy transition and improve the efficiency of the industrial chemical sector.","link":"https://www.stdaily.com/web/gdxw/2026-08/12/content_562742.html","categoria":"CLEAN ENERGY","lang":"en"},{"fonte":"中国科学院","pais":"China","titulo":"New Two-Photon Fluorescence Lifetime Microscope Decodes Brain Dynamics","resumo":"Chinese scientists have developed an advanced microscope capable of capturing dynamic signals in the brain with unprecedented precision. The tool utilizes two-photon fluorescence lifetime technology to map complex neural processes. This breakthrough opens new pathways for the early diagnosis and treatment of neurodegenerative diseases.","link":"https://www.cas.cn/cm/202608/t20260812_5118238.shtml","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Eco-Business","pais":"China","titulo":"China's Clean Technology Dominance Reshapes Global Net-Zero Transition","resumo":"China's leadership in clean technology manufacturing and innovation is redefining the pace of the global energy transition. With massive investments in solar energy, batteries, and electric vehicles, the country is accelerating worldwide decarbonization. This movement forces other nations to rapidly adapt their industrial and climate strategies.","link":"https://www.eco-business.com/opinion/chinas-clean-technology-dominance-reshapes-global-net-zero-transition/","categoria":"CLEAN TECHNOLOGY","lang":"en"},{"fonte":"新浪新闻_手机新浪网","pais":"China","titulo":"International Content Creation Highlights China as the Future of Medical Technology","resumo":"International content creators have drawn attention to the rapid advancement of Chinese hospitals and startups in the healthcare sector. The use of artificial intelligence in diagnostics and cutting-edge surgical robotics positions the country at the medical vanguard. This evolution attracts global interest toward the new standards of high-tech medicine developed within the country.","link":"https://news.sina.com.cn/zx/gj/2026-08-12/doc-inimzivr6983345.shtml","categoria":"MEDICAL TECHNOLOGY","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Molecular Mapping Enables Precision Genetic Improvement of Ginseng in China","resumo":"Researchers have identified essential molecular mechanisms for the genetic enhancement of ginseng, traditionally known as the 'king of herbs.' This discovery allows for the selection of varieties that are more resistant to disease and feature a higher concentration of active ingredients. The advancement strengthens agricultural biotechnology and drives the scientific modernization of traditional medicine.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569684.shtm","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"First Print Edition of 'Vita', a China-Led International Life Sciences Journal, Launched","resumo":"China has published the inaugural print edition of the international academic journal 'Vita', focused on the advancement of life sciences. The publication aims to gather cutting-edge global research and strengthen the country's scientific prominence in modern biology. This milestone consolidates Chinese influence in the dissemination of high-level academic knowledge.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569694.shtm","categoria":"SCIENCE","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"Report Analyzes Low-Altitude Economy Development in Anyang for 2026","resumo":"A comprehensive study has been released on the expansion of the low-altitude economy in the Chinese city of Anyang. The sector involves the intensive use of drones, autonomous aircraft, and integrated aerial logistics services. The report projects new business opportunities and the infrastructure required to support urban air mobility.","link":"https://www.news.cn/info/20260811/644c031f34294563b22b1d5b04195dc5/c.html","categoria":"INNOVATION","lang":"en"},{"fonte":"chinadaily.com.cn","pais":"China","titulo":"Tech Corridor Between the Gulf and Asia Drives Successful Regional Cooperation","resumo":"The creation of an innovation corridor between Gulf countries and Asia, with strong Chinese leadership, has been accelerating strategic partnerships. The initiative focuses on artificial intelligence, renewable energy, and shared digital infrastructure. This movement strengthens the cross-border startup ecosystem and attracts capital to the high-tech sector.","link":"https://www.chinadaily.com.cn/a/202608/12/WS6a7bca6ba310986e2b46a445.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ThePrint","pais":"India","titulo":"India Built a Sovereign AI Model, But Nearly All Underlying Infrastructure Is Rented","resumo":"India has taken a major step by developing its own sovereign Artificial Intelligence model to strengthen its digital autonomy. However, its reliance on foreign infrastructure and rented servers exposes critical challenges to technological sovereignty. Experts point out that true control requires investments in local hardware and proprietary data centers. This situation rekindles the debate over the balance between rapid innovation and structural independence in the Indian tech ecosystem.","link":"https://theprint.in/opinion/india-ai-sovereignty-model-chips/3011749/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Yahoo Finance Singapore","pais":"India","titulo":"Why Marvell Technology Is Investing $250 Million in India Now","resumo":"Semiconductor giant Marvell Technology has announced a $250 million investment in India to expand its R\u0026D operations in the country. The move reinforces India's strategic role as an emerging global hub for the creation and design of advanced microchips. The initiative aims to leverage the vast pool of qualified engineering talent to accelerate innovations in data infrastructure and artificial intelligence. The financial injection solidifies the nation's position as a key piece in the global technology supply chain.","link":"https://sg.finance.yahoo.com/news/why-marvell-technology-mrvl-investing-032159497.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ThePrint","pais":"India","titulo":"India Pours Money Into R\u0026D, Now Institutes Must Improve Ease of Doing Science","resumo":"The Indian government has been injecting record amounts of funding into research and development to boost national scientific innovation. However, researchers and academics point out that bureaucratic barriers and administrative bottlenecks still slow down project progress. To maximize the impact of this investment, analysts advocate for urgent reforms in laboratory management and academic ecosystems. Making scientific practice more agile and accessible is seen as fundamental to transforming public funds into high-impact discoveries.","link":"https://theprint.in/opinion/india-is-pouring-money-into-rd-now-institutes-must-improve-ease-of-doing-science/3012048/","categoria":"SCIENCE","lang":"en"},{"fonte":"hindustantimes.com","pais":"India","titulo":"Decoding Workday's 'Copy/Paste' Economy Data and Google DeepMind's WeatherNext AI","resumo":"A new analysis highlights the advancements of the WeatherNext artificial intelligence, developed by Google DeepMind to predict extreme weather events with unprecedented precision. In parallel, Workday data reveals digital labor market transformations driven by automation and operational efficiency. These innovations show how advanced predictive models are reshaping both strategic climate planning and corporate management. The convergence of these technologies signals a new era of decision-making based on high-resolution data intelligence.","link":"https://www.hindustantimes.com/business/decoding-workday-s-copy-paste-economy-data-and-google-deepmind-s-weathernext-ai-101786477415528.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"dailypioneer.com","pais":"India","titulo":"Guwahati Science City to receive 100 crore rupee grant, announces Chief Minister Sarma","resumo":"The Guwahati Science City complex will receive a grant of 100 crore rupees to expand its cutting-edge facilities and accelerate science education in northeastern India. The announcement was made by Chief Minister Himanta Biswa Sarma, highlighting the government's commitment to popularizing science among youth and students. The project will include new interactive galleries, advanced planetariums, and laboratories geared toward hands-on experimentation. The initiative aims to transform the site into a major regional center for scientific reference and technological innovation.","link":"https://dailypioneer.com/news/cm-himanta-inspects-ongoing-works-at-guwahati-science-city","categoria":"SCIENCE","lang":"en"},{"fonte":"India Book of Records","pais":"India","titulo":"Largest AI-powered personalized sports coaching campaign launched","resumo":"India has unveiled a pioneering campaign that uses artificial intelligence to deliver large-scale personalized sports coaching to developing athletes. The platform analyzes biometric and physical performance metrics to tailor specific training plans in real time. The initiative aims to democratize access to advanced physical preparation methods previously restricted to sports elites. The use of this technology promises to revolutionize the development of new talent and raise the competitive level of national sports.","link":"https://indiabookofrecords.in/largest-ai-powered-personalized-sports-coaching-campaign/","categoria":"INNOVATION","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"RBI Governor calls for human oversight, says blaming technology is unacceptable","resumo":"The Governor of the Reserve Bank of India has warned financial institutions about the importance of maintaining effective human governance in the use of algorithms and banking automation. He emphasized that any operational or ethical failures cannot be justified simply by blaming the technological systems used. The guideline reinforces the need for continuous audits and direct executive accountability in managing digital risks. The measure aims to safeguard the stability of the financial system amid the rapid advancement of artificial intelligence and fintech solutions.","link":"https://timesofindia.indiatimes.com/business/india-business/rbi-guv-asks-banks-to-build-meaningful-human-oversight-says-blaming-technology-is-unacceptable/articleshow/133152322.cms","categoria":"FINANCE","lang":"en"},{"fonte":"O GLOBO","pais":"India","titulo":"BRICS discuss integration of payment systems and digital currencies, says RBI Governor","resumo":"BRICS member countries are advancing discussions to integrate their cross-border payment systems and explore the use of sovereign digital currencies. The statement by the Reserve Bank of India Governor reflects a joint effort to reduce reliance on the US dollar in international trade and financial transactions. The initiative seeks to create an interconnected and more efficient digital financial infrastructure among emerging economies. The advancement of these financial technologies could reshape the global trade landscape in the coming years.","link":"https://oglobo.globo.com/google/amp/economia/noticia/2026/08/11/brics-discutem-integrar-sistemas-de-pagamento-e-moedas-digitais-diz-presidente-do-bc-da-india.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"What science is left to be done during a total solar eclipse?","resumo":"Total solar eclipses continue to be events of major scientific relevance, allowing for the detailed study of the solar corona and Earth's atmospheric behavior. Even with advancements in space telescopes, ground-based observation during totality offers unique opportunities to test physical theories and validate astronomical data. This ongoing research helps provide a better understanding of solar dynamics and their direct impacts on our planet's space weather.","link":"https://www.publico.pt/2026/08/12/ciencia/noticia/ciencia-ha-eclipse-total-sol-2184428","categoria":"ASTRONOMY","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"The spirit of science in eclipses","resumo":"The history of modern science is deeply intertwined with the observation of solar eclipses, moments that drove fundamental discoveries such as the Theory of General Relativity. Human fascination with these astronomical phenomena continues to motivate scientists and the general public to explore the mysteries of the cosmos. Preserving this investigative spirit highlights the importance of science communication and astronomy's cultural impact on society.","link":"https://www.publico.pt/2026/08/12/ciencia/opiniao/espirito-ciencia-eclipses-2184290","categoria":"SCIENCE","lang":"en"},{"fonte":"OvarNews","pais":"Portugal","titulo":"Portugal premieres first Photon Counting CT scanner, reducing radiation by up to 45%","resumo":"Portugal has taken a major step in diagnostic medicine by implementing the first computed tomography scanner with Photon Counting technology. The advancement generates high-definition images, increasing precision in the early detection of complex pathologies. Beyond diagnostic quality gains, the new equipment significantly reduces patient radiation exposure by up to 45%.","link":"https://www.ovarnews.pt/portugal-estreia-primeiro-equipamento-de-tomografia-computorizada-com-tecnologia-de-contagem-de-fotoes-photon-counting-que-reduz-ate-45-da-radiacao-e-melhora-a-precisao-do-diagnostico/","categoria":"MEDICINE","lang":"en"},{"fonte":"Rádio Hertz","pais":"Portugal","titulo":"ULS Lezíria invests in technology to enhance patient safety","resumo":"The Lezíria Local Health Unit in Portugal is implementing new technological solutions focused on improving care and patient safety. The initiative seeks to optimize hospital management, minimize errors in clinical procedures, and ensure more agile medical monitoring. The modernization reflects the growing trend of integrating digital resources and healthcare in the public sector.","link":"https://radiohertz.pt/atualidade-uls-leziria-aposta-na-tecnologia-para-reforcar-seguranca-dos-doentes/","categoria":"HEALTH","lang":"en"},{"fonte":"Jornal de Notícias","pais":"Portugal","titulo":"New technology cancels 933 Kanye West tickets sold by scalpers","resumo":"A new technological tool to combat illegal ticket scalping has allowed for the identification and cancellation of 933 tickets for a Kanye West concert. The system detected irregular transactions aimed at speculative resale at exorbitant prices, returning the tickets to the official market. The measure represents a major step forward in using technology to ensure transparency and fair access to major cultural events.","link":"https://www.jn.pt/cultura/artigo/nova-tecnologia-permitiu-invalidar-933-bilhetes-para-kanye-west-por-revenda-especulativa/18115194","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"SIC Notícias","pais":"Portugal","titulo":"Elegance of the DS Nº4, Leaf innovation, and Xpeng technology take the spotlight","resumo":"The automotive sector is undergoing a period of strong technological evolution, driven by electrification and advanced modern design. Models such as the sophisticated DS Nº4, the pioneering Nissan Leaf, and Xpeng's new vehicles exemplify automakers' different approaches. This transition reflects the global push for sustainable transport, embedded intelligence integration, and greater energy efficiency.","link":"https://sicnoticias.pt/programas/volante/2026-08-11-video-a-elegancia-do-ds-n4-a-inovacao-do-leaf-e-a-tecnologia-xpeng-em-foco-no-volante-64f21a6d","categoria":"AUTOMOTIVE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
