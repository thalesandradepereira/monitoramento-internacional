"EXPLORAÇÃO ESPACIAL","lang":"pt"},{"fonte":"The Guardian","pais":"Estados Unidos","titulo":"Califórnia processa OpenAI por preocupações de segurança após ataque de agente hacker","resumo":"O estado da Califórnia abriu uma ação judicial contra a OpenAI devido a falhas graves de segurança cibernética identificadas em seus sistemas. O processo ocorre após um incidente envolvendo um agente autônomo hacker que comprometeu dados de plataformas parceiras como o Hugging Face. As autoridades exigem auditorias rigorosas e implementação de novos protocolos de proteção para prevenir vazamentos. O caso intensifica o debate regulatório sobre os riscos associados ao avanço descontrolado da inteligência artificial.","link":"https://news.google.com/rss/articles/CBMinAFBVV95cUxQczl5QzNGZ2c2UWZ5U0ppNFFua3NXMVM2Y1dFdjNNNU1md3RCRWtjR0VzQVkyclNWbFNtT0VTUEFVZEhCWndwcE5pWllXOFB1UDlGckhTbWRNVHRKTHhLdmctX0lMTGZ6TWFZcnpRaVp5TXlXQWU0NzJhMlY2UG94VFBHYy1YSXRWLUxaX0Z1azAyZ3lYcHN0QnllM1U?oc=5","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"franceinfo","pais":"França","titulo":"\"A tecnologia deles é melhor que a nossa\": como o TikTok se tornou o símbolo da inovação chinesa","resumo":"O aplicativo TikTok consolidou-se como o principal expoente do avanço tecnológico e da inovação vinda da China nos últimos anos. Especialistas do setor reconhecem que os algoritmos de recomendação da plataforma superaram as soluções oferecidas pelas Big Techs ocidentais. Esse fenômeno transformou radicalmente a dinâmica do mercado global de redes sociais e o consumo de conteúdo digital. O sucesso da aplicação também intensificou disputas geopolíticas e debates sobre a soberania de dados global.","link":"https://www.franceinfo.fr/internet/reseaux-sociaux/tiktok/video-leur-technologie-est-meilleure-que-la-notre-comment-l-application-tiktok-est-devenue-le-symbole-de-l-innovation-chinoise_8263760.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Tribuna de Salamanca.","pais":"Espanha","titulo":"O navio Hespérides ruma ao gelo: seis meses de ciência espanhola na Antártida","resumo":"O navio de pesquisa oceanográfica Hespérides deu início a mais uma importante missão científica rumo ao continente antártico. Durante seis meses, pesquisadores espanhóis conduzirão estudos cruciais sobre mudanças climáticas, biodiversidade e dinâmica polar. A expedição reforça o compromisso da Espanha com a investigação científica de ponta em regiões extremas do planeta.","link":"https://news.google.com/rss/articles/CBMiyAFBVV95cUxOU0FVN2dzd2ZPLTVYQ2kxY1RMbGNjMGQxM0FxeXpTMzc4ekFGUlV5dGFpdl83cDExNHNpNTdlMklwc0dsazMzUTF4dVZwYnZjVmQyU09yYlFMZmg2Um9TS0FqOHJVVHp3LU1rMEJhQThGcGx3Z1dISDRVN3NyMlB4NWFEWmdNNi10Q2h2QjZ2Q3VxdXdSbkxuYXpiWkt2TGNudzJwMk9ac3dSbm1QMHNPeU5LeUY1OXlwTHdhUzA1U3h3Z1EwNWtBTQ?oc=5","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"TVs Regza apostam na tecnologia \"Pure RGB\" para oferecer uma experiência visual além da imaginação","resumo":"A Regza apresentou suas mais recentes inovações em tecnologia de exibição focadas na precisão de cores com o sistema Pure RGB. O novo painel garante maior fidelidade cromática e contraste aprimorado para conteúdos em alta definição. Com essa evolução, a fabricante busca liderar o mercado de televisores de alta gama com imagens ainda mais realistas.","link":"https://news.yahoo.co.jp/articles/bb99ac80b9f1e9f21a53d6c5c3d5d5b4b2f15d91","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"经济参考报","pais":"China","titulo":"Índice de desenvolvimento do setor de entregas expressas da China cresce 0,5% em outubro","resumo":"O setor de entregas expressas na China registrou um aumento de 0,5% em seu índice de desenvolvimento no mês de outubro em comparação ao ano anterior. O resultado reflete a resiliência e a contínua expansão do setor logístico impulsionado pelo ecossistema de comércio eletrônico. Além disso, o fortalecimento da infraestrutura automatizada e o aperfeiçoamento das redes de distribuição impulsionaram a eficiência. O desempenho demonstra a estabilidade da cadeia de suprimentos chinesa no cenário atual.","link":"http://jjckb.xinhuanet.com/20261117/fc18eccd7e36427d874257291973d55b/c.html","categoria":"LOGÍSTICA","lang":"pt"},{"fonte":"Utkarsh Classes","pais":"Índia","titulo":"CSIR e Bielorrússia assinam pacto de cooperação científica para 2027–2029","resumo":"O Conselho de Pesquisa Científica e Industrial da Índia assinou um acordo de cooperação em ciência e tecnologia com a Bielorrússia para o período de 2027 a 2029. A parceria busca promover o desenvolvimento conjunto de pesquisas avançadas e a troca de conhecimento entre os dois países. O foco abrange áreas estratégicas de inovação tecnológica e desenvolvimento sustentável. O pacto reforça a colaboração internacional da Índia na produção de conhecimento científico.","link":"https://news.google.com/rss/articles/CBMixwFBVV95cUxQS0lfMlMtQVB2TW5SYzNNb19BVVFGdjF4SnpLVUQ2S1lwVktUaVRjZjdmNlNCZTBzMlRZdllreXBSTTNsdnRtR29HM3E0b1N3ZG5OSWQ3TE52VEljTmRqa29ET1hscm1yRnQxejNsdWE1MEFVamlqZUtnUmVDdUZuMVR6QXI5VFVXYlhicVZhMmdsallDbnQzSE9NaFc3Yy1hTTFzbXN4T2pQN3ZGdkhNSERqZVdLVkQ2QXhSREFObG5CZlRJa2Jz?oc=5","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Califórnia processa OpenAI por ataques cibernéticos envolvendo IA","resumo":"O estado da Califórnia iniciou uma ação judicial contra a OpenAI acusando a empresa de falhas na segurança de seus modelos. Segundo o processo, ferramentas de inteligência artificial foram utilizadas para coordenar ciberataques direcionados à plataforma Hugging Face e outras companhias. O caso acende o alerta regulatório sobre as responsabilidades dos desenvolvedores de IA.","link":"https://g1.globo.com/tecnologia/noticia/2026/11/16/opne-ai-ataque-california.ghtml","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"AP News","pais":"Estados Unidos","titulo":"Governo Trump atua para bloquear acesso indireto da China a tecnologias de IA dos EUA","resumo":"A administração governamental dos Estados Unidos anunciou medidas mais severas para restringir o acesso indireto de empresas chinesas a modelos de IA americanos. A decisão visa fechar brechas que permitiam a utilização remota de servidores e chips avançados localizados fora da China. Autoridades de segurança nacional argumentam que a contenção é vital para proteger a soberania tecnológica dos EUA. A ação deve gerar novas tensões nas relações comerciais globais e no mercado de semicondutores.","link":"https://apnews.com/article/nvidia-export-controls-chips-china-remote-access-60f868d3bb430b85a8657b27d421096e","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"Breizh-info.com","pais":"França","titulo":"Inteligência artificial: Europa lança iniciativa RAISE para impulsionar a ciência","resumo":"A União Europeia anunciou o lançamento da iniciativa RAISE para acelerar a integração de inteligência artificial nas pesquisas científicas do bloco. O objetivo principal do projeto é garantir que os pesquisadores europeus não fiquem para trás em relação às potências globais como Estados Unidos e China. A plataforma oferecerá infraestrutura de supercomputação e ferramentas de IA de ponta para diversas disciplinas acadêmicas. Espera-se que o investimento fortaleça substancialmente a soberania científica e tecnológica do continente europeu.","link":"https://news.google.com/rss/articles/CBMiwwFBVV95cUxNUXhmZ1NwbmQ4ejR3cXNMeTBhdnZ5bWItMXU0T1BVNjZYb0VmbGltZFpqRk1OUUF5Z2pwWWFyXy1pX2U4X1ladkZzSkRsWXY0VUNLZEoyWkNjaFdzZTNndVhzdVExTjV5ZTdlVlhud203TFI2aXZzZzRyX25tT0xXQXdvRnVSTktucHdJVERHREt5by1wV3ZiS3ZLX1NpaU53SE9FcllpU1czYlJrYXh1QVNrVzVSRy1GMmxMRG5HWW83YlE?oc=5","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Ayuntamiento de Valladolid","pais":"Espanha","titulo":"O prêmio UUPRIZE 2026 da W Startup Community reconhece a liderança feminina em inovação, ciência e tecnologia","resumo":"A iniciativa UUPRIZE 2026 destacou o papel fundamental das mulheres no desenvolvimento do ecossistema tecnológico e científico. O prêmio busca dar visibilidade a lideranças femininas à frente de startups inovadoras e projetos disruptivos. A celebração fortalece a diversidade no setor e incentiva a participação de novas gerações de mulheres em carreiras STEM.","link":"https://news.google.com/rss/articles/CBMirAFBVV95cUxPaEFUcUh1bVJkdzdvSHFLV3ZhaDNzUWV0eENMTmFzdVkwVHBseHhwdFhaekQzczI0YjZadW1Wdzc2eUZnSzZ6ZU1lRlR5MnMwT1NiMldMaWFPN3VvZnVNMFBWd3ZyX2hNa2o5NjRTWTFSNGViSngySlEyWEE0NEdRajdLbndlMkhidTEtWmM2OTVNVFc2di1iSXViWDY0WE1jQ2tWa3RqQkFQY2Q3?oc=5","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"KEK｜高エネルギー加速器研究機構","pais":"Japão","titulo":"Seminário técnico promove introdução à modelagem em impressoras 3D com foco na tecnologia Raise3D","resumo":"O evento técnico reuniu especialistas e entusiastas para discutir as aplicações práticas da manufatura aditiva no setor industrial. Durante o seminário, foram demonstradas técnicas avançadas de prototipagem rápida e seleção de materiais adequados. A iniciativa visa capacitar profissionais locais para adotarem tecnologias de impressão tridimensional em seus processos produtivos.","link":"https://news.google.com/rss/articles/CBMiU0FVX3lxTFBpMHFPVmFrZzFvUWwzZUhSOGxaZWVDbEJvZ1NCSy1ZVzREVVlyQjdDSGJOOGM4Uk1aRVpFeThQT1FuZjRpcWg5RWFXajAyejUwU1NB?oc=5","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"新华网","pais":"China","titulo":"Economia nacional da China mantém estabilidade e avança em inovação em outubro","resumo":"Os dados econômicos de outubro apontam que a economia nacional da China operou de forma estável, apresentando avanços contínuos em setores de alta tecnologia. O crescimento foi sustentado pela expansão de indústrias emergentes e pela modernização contínua do parque industrial. As políticas governamentais mantêm o foco na transição para um modelo econômico voltado à inovação e sustentabilidade. Os indicadores reforçam a trajetória de recuperação gradativa da estrutura produtiva do país.","link":"https://www.news.cn/20261116/8ba36fd90baf44f28e122940040636fe/c.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"agenciasp.sp.gov.br","pais":"Brasil","titulo":"Cetesb e universidade americana estudam captura de carbono no subsolo","resumo":"A Cetesb formalizou uma parceria estratégica com pesquisadores dos Estados Unidos para analisar o armazenamento geológico de dióxido de carbono. A tecnologia busca capturar emissões industriais e injetá-las em formações subterrâneas profundas de forma segura. O estudo visa acelerar a transição ecológica no estado de São Paulo e mitigar os efeitos das mudanças climáticas.","link":"https://news.google.com/rss/articles/CBMi6AFBVV95cUxOMG1BQU0tQ3dGTFhvOFRnVl81dFREcHM3MzRhaGUtc3daUnVwWEhYWmt2d2lvWTJ6M005bFNrdnczdmYzYXQwXzhhTDdjV2tVMkE2ZFl2aE9USGlTanh4TUEwQVlhXzR5VGlETURKT0VkYVBYUTIzTTZpMDYxQUtOd21LUE1jeHNnZS1LaUhjcGl5SElUMDVHU1Q0QUhGR3dxYzZjSFlwRU5XQzlzeUctQmd4cjBwNEtBVEUtYVNEWkhZc05TdGVidkdYLWI5eXdjR1pmTEFVR1M1UFNrbUx2ei16U2VYVm5X?oc=5","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"CNBC","pais":"Estados Unidos","titulo":"Presidente do Fed destaca importância da IA para a economia, mas alerta que tecnologia pode decepcionar","resumo":"O presidente do Federal Reserve, Kevin Warsh, analisou o impacto potencial da inteligência artificial no aumento da produtividade e na reestruturação da economia americana. Apesar de reconhecer os avanços promissores, a autoridade monetária alertou que as expectativas do mercado podem estar superdimensionadas a curto prazo. Ele destacou a necessidade de monitorar riscos inflacionários e ajustes no mercado de trabalho durante essa transição tecnológica. O discurso reflete a cautela do banco central diante do entusiasmo exagerado dos investidores.","link":"https://www.cnbc.com/2026/11/16/fed-ai-task-force-kevin-warsh.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Noovo Info","pais":"França","titulo":"Washington toma medidas para proteger sua tecnologia de IA da China","resumo":"O governo dos Estados Unidos anunciou novas restrições para impedir o acesso e a transferência de tecnologias de inteligência artificial avançadas para a China. A medida visa proteger a propriedade intelectual americana e manter a liderança estratégica do país no setor de ponta. As restrições afetam tanto a exportação de chips de alto desempenho quanto parcerias de pesquisa acadêmica e empresarial. A decisão intensifica a corrida tecnológica geopolítica entre as duas maiores economias do planeta.","link":"https://news.google.com/rss/articles/CBMixwFBVV95cUxQTUkwR3o5MWRuZjk3V1JlMldybGdGWnREQWc2TThVVHVFd2oxczdVNmFkV2RhRnVoblNwcFA2MERSNzhaR2Q4LU9VSXEzay12Rm9NTm5UaExnYTE4N3FIYU5GZTNwZjdtRHFBX3BIc1JlUmpmenJ6cUdsb0FPcENjQ3NyQ0NzWEQza2tjUUhfbWdydTcwNXROcVZ0VDhULXBYenpvbFhvTVphYUJpdU5BeGtmbHJRb2x6WS16TE5LQ0YyWG5ZLXR3?oc=5","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"Compromiso RSE","pais":"Espanha","titulo":"HESStec conquista o prêmio Sustainability Action 26 por aplicar tecnologia inteligente em projeto solar","resumo":"A empresa HESStec foi premiada pelo desenvolvimento de soluções tecnológicas inteligentes aplicadas à otimização da energia solar. O reconhecimento destaca o uso de sistemas avançados de gestão de armazenamento para tornar a rede elétrica mais eficiente. A iniciativa exemplifica a convergência entre inovação digital e sustentabilidade na transição energética da Europa.","link":"https://www.compromisorse.com/rse/2026/11/16/hesstec-se-alza-con-un-sustainability-action-26-por-aportar-tecnologia-inteligente-a-un-proyecto-solar/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"NVIDIA anuncia \"Nemotron for Science\" para acelerar descobertas científicas com agentes de IA","resumo":"A NVIDIA lançou uma nova plataforma projetada para integrar agentes autônomos de inteligência artificial em pesquisas científicas complexas. A ferramenta promete otimizar a análise de grandes volumes de dados e acelerar simulações em diversas áreas do conhecimento. Essa inovação representa um avanço crucial para impulsionar descobertas em física, química e biologia computacional.","link":"https://news.google.com/rss/articles/CBMibEFVX3lxTFBMeUZlazlMVm81ck1hbW9lRUhyTVFYTFNrcHlwRU5Ea3dOT0hla0drN3pkTDBEanJFcGJELWJMd0JpeGZOZXFGYXZqUWY0Y29SRjY2RU15aDZMRW4yNTBNaG5ub2NHNEl3WG5BTA?oc=5","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Bloomberg.com","pais":"China","titulo":"Economia da China frustra expectativas enquanto novos estímulos governamentais demoram a surtir efeito","resumo":"A economia chinesa apresentou um desempenho abaixo do esperado no último período, evidenciando o atraso nos efeitos das recentes medidas de estímulo econômico. Analistas destacam que a recuperação da demanda interna e a estabilização do setor imobiliário ainda enfrentam ventos contrários. Contudo, o governo chinês estuda a implementação de novas ferramentas financeiras para reativar o consumo. O cenário gera atenção no mercado internacional quanto ao ritmo de expansão do país.","link":"https://news.google.com/rss/articles/CBMitgFBVV95cUxPZjFiTE1FdTd4TV93WnROMERVZXMtQzdSZDRTOTh3cVhocV9Sb1NSRVVGelJYamtpWkwyLWc5WTc2MGRWVUJWckNkVVJTOVBUZTNuN3Jxdl92R1E3dWRySnk3RTAyZ3BlVVI2bGZKbjJKb0U4WkNSS1VJU3dQZ1B2eUJXaUF3TVZaWk4zS0N5RlVVSWRlcXZ4UkZQYl9nQkxrRkFxNF93dm94c0NLWEdCa1d3X2Z2UQ?oc=5","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Universidade Federal do Espírito Santo","pais":"Brasil","titulo":"Seminário apresenta uso de IA no diagnóstico de doenças infecciosas","resumo":"Um novo evento científico com inscrições abertas vai demonstrar como ferramentas de inteligência artificial podem acelerar a detecção de patógenos. A aplicação dessas tecnologias permite análises laboratoriais mais céleres e precisas em sistemas públicos e privados. Especialistas apontam que a automação no diagnóstico é fundamental para prevenir surtos epidêmicos.","link":"https://news.google.com/rss/articles/CBMisgFBVV95cUxQcGpyanQ2YXRfV09wejhoWmVxbHZjaS01a1pJS00xamt5WTV5XzRBUm4xSDFiTDBjN0F2UWNmQmN1TWpOdHlDbXduQk9jaEJRbVY2dS1lbVA3cTdDVWV2b1hfQ19LSmg stas analisaram as causas estruturais por trás das recentes falhas tecnológicas de âmbito nacional. As investigações apontam para a complexidade das redes de nuvem interdependentes e a falta de redundância em sistemas críticos. Analistas ressaltam a urgência de investimentos em resiliência cibernética e atualização de sistemas legados. A frequência desses incidentes tem preocupado reguladores e o setor produtivo.","link":"https://news3lv.com/news/local/expert-explains-whats-behind-recent-nationwide-technology-outages-faa-united-it","categoria":"INFRAESTRUTURA","lang":"pt"},{"fonte":"Ifremer","pais":"França","titulo":"Ifremer reforça sua governança a serviço da ciência e da preservação dos oceanos","resumo":"O Instituto Francês de Investigação para a Exploração do Mar (Ifremer) anunciou uma reestruturação em sua governança para fortalecer suas pesquisas marinhas. A instituição visa acelerar o estudo das mudanças climáticas, da biodiversidade marinha e dos ecossistemas oceânicos globais. A nova estratégia prioriza a integração entre tecnologias de monitoramento oceânico e produção de conhecimento científico de ponta. O fortalecimento institucional reforça o papel da França na conservação marinha e na ciência planetária.","link":"https://www.ifremer.fr/fr/presse/l-ifremer-renforce-sa-gouvernance-au-service-de-la-science-et-de-l-ocean","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"GOV.BR","pais":"Brazil","titulo":"Quantum computers arrive in João Pessoa with MCTI support","resumo":"The arrival of quantum computing equipment in João Pessoa marks a historic milestone in the national scientific ecosystem. The Ciquanta project, supported by the Ministry of Science, Technology and Innovation, aims to strengthen advanced research infrastructure in the Northeast region. The initiative promises to drive breakthroughs in cryptography, optimization and data processing on an unprecedented scale.","link":"https://news.google.com/rss/articles/CBMi8gFBVV95cUxQc2EzVEZ2S2FjM2F6QWlRVTRUT o":"The state of California has initiated legal action against OpenAI, accusing the company of security flaws in its models. According to the lawsuit, artificial intelligence tools were used to coordinate cyberattacks targeting the Hugging Face platform and other companies. The case raises regulatory alarm about the responsibilities of AI developers.","link":"https://g1.globo.com/tecnologia/noticia/2026/11/16/opne-ai-ataque-california.ghtml","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"AP News","pais":"United States","titulo":"Trump Administration Moves to Block China's Indirect Access to US AI Technologies","resumo":"The United States government administration has announced stricter measures to restrict Chinese companies' indirect access to American AI models. The decision aims to close loopholes that allowed the remote use of servers and advanced chips located outside of China. National security officials argue that containment is vital to protecting U.S. technological sovereignty. The action is expected to generate new tensions in global trade relations and the semiconductor market.","link":"https://apnews.com/article/nvidia-export-controls-chips-china-remote-access-60f868d3bb430b85a8657b27d421096e","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"Breizh-info.com","pais":"France","titulo":"Artificial intelligence: Europe launches RAISE initiative to boost science","resumo":"The European Union announced the launch of the RAISE initiative to accelerate the integration of artificial intelligence into the bloc's scientific research. The main objective of the project is to ensure that European researchers do not fall behind global powers such as the United States and China. The platform will offer supercomputing infrastructure and cutting-edge AI tools for diverse academic disciplines. The investment is expected to substantially strengthen the scientific and technological sovereignty of the European continent.","link":"https://news.google.com/rss/articles/CBM   const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
