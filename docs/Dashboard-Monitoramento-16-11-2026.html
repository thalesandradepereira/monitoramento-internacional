les-alia-tecnologia-inteligencia-artificial-combatir-plagas-20261116063840-nts.html","categoria":"AGROTECH","lang":"pt"},{"fonte":"维度网","pais":"Alemanha","titulo":"Covestro da Alemanha inicia projeto de tecnologia de reciclagem de resíduos automotivos em aromáticos","resumo":"A Covestro deu início a um projeto inovador focado no desenvolvimento de tecnologias para transformar resíduos de plásticos automotivos em compostos aromáticos reutilizáveis. A iniciativa busca acelerar a economia circular no setor automotivo alemão, reduzindo significativamente a pegada de carbono da indústria. O impacto esperado inclui a diminuição da dependência de matérias-primas fósseis e o avanço da reciclagem química de alta eficiência.","link":"https://www.wedoany.com/shortnews/514940.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"BigGo ファイナンス","pais":"Japão","titulo":"Mazda desenvolve tecnologia para capturar CO2 dos gases de escape até 2028","resumo":"A Mazda anunciou o desenvolvimento de uma inovadora tecnologia capaz de capturar dióxido de carbono diretamente dos gases de escape dos veículos enquanto eles circulam. A montadora japonesa planeja iniciar os testes práticos em vias públicas até o ano de 2028 com foco em sustentabilidade. O objetivo final é viabilizar a comercialização e integração em massa dessa tecnologia automotiva até 2035. Essa iniciativa reforça os esforços da indústria automotiva do Japão para alcançar a neutralidade de carbono nas próximas décadas.","link":"https://finance.biggo.jp/news/05ad886e-aaaf-4efb-95d2-6312201b63d8","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Lançamento do Ranking Internacional de Capacidade Computacional de IA AIPerf 2026","resumo":"Foi divulgado o novo ranking internacional AIPerf 2026, que mede a capacidade de processamento e a infraestrutura dedicada à inteligência artificial.\nA publicação destaca o avanço contínuo e a liderança no desenvolvimento de infraestruturas de supercomputação voltadas para modelos avançados de IA.\nO benchmark serve como uma importante referência global para comparar a eficiência do poder computacional entre os principais centros tecnológicos do mundo.","link":"https://news.sciencenet.cn/htmlnews/2026/11/574805.shtm","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Nagaland Post","pais":"Índia","titulo":"Economia espacial da Índia ultrapassa a marca de US$ 9 bilhões","resumo":"A indústria espacial indiana alcançou um marco significativo ao atingir o valor de US$ 9 bilhões, impulsionada por investimentos públicos e privados no setor de tecnologia astronômica. O crescimento reflete a expansão de satélites comerciais e missões de exploração bem-sucedidas no país. Especialistas preveem que esse avanço consolidará a posição da Índia como uma potência emergente no mercado espacial global.","link":"https://nagalandpost.com/indias-space-economy-scales-9-billion-mark/","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"Executive Digest","pais":"Portugal","titulo":"Microsoft fora do ar, aviões em terra e milhões afetados: até que ponto dependemos da tecnologia?","resumo":"Uma falha massiva nos sistemas da Microsoft provocou o caos global ao paralisar voos, serviços de saúde e operações financeiras. O incidente escancarou a vulnerabilidade da infraestrutura digital moderna e reacendeu o debate sobre a extrema dependência de poucas empresas de tecnologia. Especialistas alertam para a necessidade urgente de planos de contingência mais robustos em setores críticos.","link":"https://executivedigest.sapo.pt/microsoft-em-baixo-avioes-em-terra-e-milhoes-de-pessoas-afetadas-ate-que-ponto-estamos-dependentes-da-tecnologia/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Agência FAPESP","pais":"Brasil","titulo":"IA deve trazer mais qualidade para a ciência, e não apenas mais artigos, alerta editor","resumo":"O uso desenfreado de ferramentas de inteligência artificial na produção acadêmica tem levantado discussões sobre a integridade e a utilidade da pesquisa científica mundial. Editores de prestigiadas revistas científicas destacam que a tecnologia deve ser aplicada para aprofundar análises e gerar descobertas relevantes, e não apenas para inflar o volume de publicações. O alerta chama a atenção para o risco de saturação do ecossistema acadêmico com conteúdos superficiais. A comunidade global busca agora estabelecer diretrizes claras para o uso ético da IA na ciência.","link":"https://agencia.fapesp.br/ia-deve-trazer-mais-qualidade-para-a-ciencia-e-nao-apenas-mais-artigos-alerta-editor/59619","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Technology Org","pais":"Estados Unidos","titulo":"Relatório AI100: Inteligência Artificial entra no ecossistema convencional e molda a sociedade","resumo":"O novo relatório AI100 destaca como a inteligência artificial deixou de ser uma promessa futurista para se tornar parte integrante do cotidiano global. A publicação analisa os impactos profundos da tecnologia em setores vitais como saúde, educação, trabalho e governança pública. Especialistas alertam para a necessidade urgente de regulamentações éticas acompanharem a rápida evolução desses sistemas. O documento serve como um guia crucial para orientar formuladores de políticas e líderes tecnológicos.","link":"https://www.technology.org/2026/11/16/ai100-report-ai-has-entered-the-mainstream-and-is-reshaping-society/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Le Devoir","pais":"França","titulo":"Marconi Technologies e ETS formarão um novo polo de pesquisa","resumo":"A Marconi Technologies firmou uma parceria estratégica com a ETS para estabelecer um centro avançado de pesquisa tecnológica. A iniciativa visa acelerar o desenvolvimento de soluções inovadoras e promover a transferência de conhecimento acadêmico para o setor industrial. O projeto promete fortalecer a infraestrutura científica e atrair investimentos significativos para a área de engenharia. Espera-se que a colaboração gere patentes relevantes e impulsione o ecossistema tecnológico regional.","link":"https://www.ledevoir.com/economie/1025012/marconi-technologies-ets-formeront-pole-recherche","categoria":"PESQUISA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Minorias étnicas no País de Gales têm quatro vezes mais chances de serem alvo de escaneamento facial da polícia","resumo":"Um novo levantamento revelou dados alarmantes sobre o uso de tecnologia de reconhecimento facial pela polícia no País de Gales. A análise indica que pessoas pertencentes a minorias étnicas possuem quatro vezes mais probabilidade de passarem por escaneamentos biométricos. Organizações de direitos humanos alertam para o risco de amplificação de vieses discriminatórios e falta de transparência nos algoritmos utilizados. O debate reacende pressões para a regulamentação severa ou interrupção do uso dessas ferramentas tecnológicas pelas forças policiais do Reino Unido.","link":"https://www.theguardian.com/technology/2026/nov/15/ethnic-minorities-wales-police-facial-scans-data","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Infodefensa","pais":"Espanha","titulo":"Telefónica fornece tecnologia 5G para o Centro de Experimentação da OTAN na Eslováquia","resumo":"A Telefónica disponibilizou infraestrutura 5G de alta velocidade para o Centro de Experimentação Controlada da implantação espanhola em solo eslovaco sob a OTAN. A tecnologia permite comunicações ultrafechadas e transmissão de dados em tempo real para operações táticas e de defesa. A iniciativa destaca a capacidade estratégica das empresas de telecomunicações no suporte a missões militares internacionais.","link":"https://www.infodefensa.com/texto-diario/mostrar/6089202/telefonica-facilita-tecnologia-5g-centro-experimentacion-controlada-despliegue-espanol-eslovaquia-otan","categoria":"TELECOMUNICAÇÕES","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Primeiro gás deve fluir no terminal de GNL de Stade","resumo":"O novo terminal flutuante de Gás Natural Liquefeito em Stade está se preparando para receber as primeiras cargas de combustível para abastecer a rede alemã. Essa infraestrutura estratégica visa fortalecer a segurança energética do país e substituir o suprimento de gás dependente de rotas tradicionais. O projeto representa um marco importante na infraestrutura de energia da Alemanha para garantir estabilidade operacional.","link":"https://www.sueddeutsche.de/wirtschaft/lng-terminal-stade-erstes-gas-soll-in-stader-lng-terminal-fliessen-dpa.urn-newsml-dpa-com-20090101-261116-930-779","categoria":"ENERGIA","lang":"pt"},{"fonte":"Digital PR Platform","pais":"Japão","titulo":"NTT e ispace fecham acordo para criar infraestrutura de comunicação óptica na Lua","resumo":"A operadora NTT e a startup espacial ispace firmaram uma parceria estratégica para o desenvolvimento de infraestrutura de comunicação e energia na Lua. O projeto utilizará a avançada tecnologia de comunicação óptica IOWN para estabelecer conexões ultra-rápidas e de longa distância no espaço cislunar. Além disso, a colaboração visa viabilizar soluções de fornecimento de energia a laser para equipamentos lunares. A iniciativa posiciona o Japão como um dos líderes no desenvolvimento tecnológico para a exploração sustentável da Lua.","link":"https://digitalpr.jp/r/148311","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Publicada a Lista TOP100 de Supercomputadores de Alta Performance da China para 2026","resumo":"A China anunciou a atualização oficial do seu ranking TOP100 de sistemas computacionais de alto desempenho para o ano de 2026.\nA lista revela avanços significativos na arquitetura de supercomputadores nacionais e no processamento massivo de dados de alta complexidade.\nEsse movimento reforça o empenho estratégico do país em alcançar a autossuficiência tecnológica e liderar a corrida computacional global.","link":"https://news.sciencenet.cn/htmlnews/2026/11/574804.shtm","categoria":"SUPERCOMPUTAÇÃO","lang":"pt"},{"fonte":"HT Tech","pais":"Índia","titulo":"Punjab busca criar empregos qualificados por meio de investimentos em TI e tecnologia","resumo":"O estado de Punjab está implementando uma estratégia focada em atrair grandes investimentos no setor de tecnologia da informação e inovação digital. A iniciativa visa transformar a infraestrutura local e promover a capacitação profissional de jovens talentos. Com essa expansão, o governo regional espera gerar milhares de empregos de alta qualificação nos próximos anos.","link":"https://tech.hindustantimes.com/brand-stories/punjab-looks-to-create-skilled-jobs-through-it-and-technology-investment-71794805080843.html","categoria":"INOVAÇÃO DIGITAL","lang":"pt"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"\"Hacked by José Sócrates\": Site da ASAE é alvo de ataque cibernético","resumo":"O portal oficial da Autoridade de Segurança Alimentar e Econômica (ASAE) de Portugal foi invadido e exibiu uma mensagem provocativa fazendo referência ao ex-primeiro-ministro. O ataque cibernético comprometeu o acesso aos serviços online da entidade e acendeu o alerta sobre a segurança da informação em órgãos públicos. As autoridades competentes já estão investigando a origem da invasão para mitigar riscos adicionais.","link":"https://www.cmjornal.pt/tecnologia/detalhe/hacked-by-jose-socrates-site-da-asae-alvo-de-ataque-informatico","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Terras-raras, espionagem e controle sobre chips marcam cúpula entre Trump e Xi","resumo":"A disputa pelo domínio da cadeia de suprimentos de semicondutores e minerais críticos volta ao centro das atenções no encontro entre os líderes dos Estados Unidos e da China. O controle sobre tecnologias essenciais para a indústria de alta precisão intensifica as tensões geopolíticas e comerciais entre as duas maiores economias do mundo. Questões relativas à espionagem industrial e soberania tecnológica exigem negociações complexas sobre exportações restritas. O desfecho dessa cúpula poderá redefinir os rumos dos investimentos tecnológicos em escala global.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/11/16/terras-raras-espionagem-e-controle-sobre-chips-os-temas-que-vao-marcar-a-cupula-de-trump-com-xi-nesta-semana.ghtml","categoria":"GEOPOLÍTICA E TECH","lang":"pt"},{"fonte":"AZoM","pais":"Estados Unidos","titulo":"Integração de IA e Robótica para sistemas contínuos de pesquisa em ciência dos materiais","resumo":"Um estudo recente apresenta a convergência entre inteligência artificial e robótica autônoma para acelerar a descoberta de novos materiais. A automação dos laboratórios permite a execução de experimentos ininterruptos e a análise de dados complexos em tempo recorde. Essa abordagem reduz drasticamente o tempo necessário para desenvolver soluções tecnológicas avançadas e sustentáveis. A integração promete transformar a pesquisa científica tradicional em um processo altamente dinâmico.","link":"https://www.azom.com/news.aspx?newsID=66051","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Techno-Science","pais":"França","titulo":"Um planeta de lava fria?","resumo":"Astrônomos identificaram um exoplaneta peculiar com características que desafiam os modelos astrofísicos atuais de formação planetária. O corpo celeste apresenta uma composição exótica que os cientistas descrevem hipoteticamente como tendo uma superfície de lava fria. As análises espectroscópicas continuam para compreender a dinâmica atmosférica e a estrutura geológica desse mundo distante. A descoberta abre novas perguntas sobre a diversidade de planetas fora do nosso sistema solar.","link":"https://www.techno-science.net/fr/actualites/hd-3167-b-planete-lave-29519","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Relatórios de material de abuso sexual infantil gerado por IA sobem 8.400% em dois anos","resumo":"Dados recentes apontam um aumento assustador de 8.400% nas denúncias de conteúdos de abuso sexual infantil gerados por inteligência artificial nos últimos dois anos. O crescimento vertiginoso reflete a facilidade de acesso a ferramentas de criação de imagens baseadas em IA generativa. Especialistas em segurança digital e autoridades pedem urgência na implementação de mecanismos de proteção mais rigorosos pelas empresas de tecnologia. A crise destaca a necessidade premente de novas legislações internacionais para combater o mau uso dessas ferramentas emergentes.","link":"https://www.theguardian.com/technology/2026/nov/16/ai-related-child-sexual-abuse-material-rise-exploitation-deepfakes","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"Valencia Plaza","pais":"Espanha","titulo":"SemanticBots: a spin-off de Castellón que transforma ciência e dados em conhecimento empresarial","resumo":"A spin-off SemanticBots, nascida em Castellón, desenvolveu plataformas focadas na transformação de grandes volumes de dados científicos em inteligência acionável para empresas. A tecnologia aplicada foca na inclusão digital e no atendimento automatizado com base em dados estruturados. O modelo demonstra o sucesso da transferência de conhecimento acadêmico para o mercado produtivo real.","link":"https://valenciaplaza.com/valenciaplaza/empresas1/semanticbots-la-spin-off-de-castellon-que-transforma-ciencia-y-datos-en-conocimiento-para-las-empresas","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Relatório: Jensen Huang fala sobre liderança e visão à frente da Nvidia","resumo":"Em declarações recentes, o CEO da Nvidia, Jensen Huang, abordou a visão estratégica de longo prazo para manter o domínio global da empresa em inteligência artificial. A discussão ressalta a relevância dos chips da empresa no mercado global e o direcionamento tecnológico para novos mercados. O impacto direto atinge todo o ecossistema de semicondutores e hardware avançado em escala mundial.","link":"https://www.sueddeutsche.de/wirtschaft/jensen-huang-nvidia-affaere-rueckkehr-li.3580971","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"NTT cria tecnologia soberana para análise de vulnerabilidades sem depender de IA externa","resumo":"A NTT apresentou uma nova tecnologia de análise de vulnerabilidades de sistemas que opera de forma totalmente independente de modelos de inteligência artificial externos. A solução foi projetada para garantir a soberania digital e proteger dados sensíveis contra vazamentos ou acessos não autorizados por terceiros. O avanço responde à crescente demanda por segurança cibernética corporativa em infraestruturas críticas no Japão. Com isso, a empresa busca fortalecer o ecossistema tecnológico nacional diante de ameaças cibernéticas globais.","link":"https://news.yahoo.co.jp/articles/7ad7994977c6e861d42a5069b90f6e4ac14f0e74","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"21财经","pais":"China","titulo":"Política Define Reserva de Tecnologias de Ponta e Impulsiona Setor de Baterias de Estado Sólido","resumo":"Novas diretrizes governamentais chinesas estabeleceram prioridade estratégica para o desenvolvimento e reserva de tecnologias industriais de última geração.\nComo resultado imediato desse direcionamento, as ações ligadas ao setor de baterias de estado sólido registraram forte valorização no mercado.\nA iniciativa visa acelerar a transição energética nacional e consolidar a competitividade da indústria no ecossistema global de veículos elétricos.","link":"https://www.21jingji.com/article/20261116/herald/a1ccdc793cb6d3bcaeeb979c2e117e3d.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"scanx.trade","pais":"Índia","titulo":"Hinduja Global Solutions assina contrato de 3 anos com a Rackspace Technology","resumo":"A Hinduja Global Solutions fechou uma parceria estratégica de três anos com a gigante de multinuvem Rackspace Technology. O acordo tem como objetivo otimizar a infraestrutura de nuvem e acelerar a transformação digital dos clientes globais da empresa. A colaboração reforça a competitividade do ecossistema indiano de serviços tecnológicos avançados.","link":"https://scanx.trade/stock-market-news/companies/hinduja-global-solutions-signs-3-year-deal-rackspace-technology/56348464","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Pplware","pais":"Portugal","titulo":"Eclipse do século: Sol vai desaparecer por mais de seis minutos durante o dia","resumo":"Um evento astronômico histórico promete mobilizar a comunidade científica e o público geral ao proporcionar a maior duração de escuridão total do século. O eclipse solar total oferecerá uma oportunidade única para pesquisadores estudarem a coroa solar e os efeitos da queda abrupta de luz na atmosfera. O fenômeno já desperta grande interesse turístico e exige preparativos especiais para observação segura.","link":"https://pplware.sapo.pt/ciencia/eclipse-solar-2027-portugal-sol-desaparece/","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Facebook","pais":"Brasil","titulo":"Nova tecnologia pode ser utilizada em futuras missões à Lua e Marte","resumo":"Pesquisadores apresentaram um avanço tecnológico promissor voltado para viabilizar e sustentar a presença humana em explorações espaciais de longa duração. O sistema inovador visa otimizar a eficiência operacional e a segurança de equipamentos operados em ambientes extraterrestres extremos. A solução é vista com grande entusiasmo por agências espaciais envolvidas no planejamento do retorno à Lua e de futuras viagens a Marte. A novidade representa um passo estratégico fundamental para a expansão da fronteira espacial humana.","link":"https://www.facebook.com/midiamax/posts/tecnologia-pode-ser-utilizada-em-futuras-miss%C3%B5es-%C3%A0-lua-e-marte/1568370195322223/","categoria":"EXPLORAÇÃO ESPACIAL","lang":"pt"},{"fonte":"The Indian Express","pais":"Estados Unidos","titulo":"Intel é processada por acionistas após queda de 29% nas ações","resumo":"Acionistas da Intel moveram um processo contra a gigante dos semicondutores após um forte declínio no valor de suas ações no mercado financeiro. A alegação central envolve a suposta omissão de problemas operacionais e atrasos na entrega de novas tecnologias de chips. O impacto da crise reflete a crescente pressão e concorrência no setor de hardware e inteligência artificial. A disputa jurídica aumenta as incertezas sobre a recuperação financeira e a liderança da empresa.","link":"https://indianexpress.com/article/technology/tech-news-technology/intel-sued-by-shareholders-following-29-stock-plunge-10964763/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Le Monde.fr","pais":"França","titulo":"Fazer a guerra com IA? Para a Ucrânia, um dilema moral e político","resumo":"O uso de inteligência artificial em cenários de combate levanta debates éticos e geopolíticos sem precedentes no conflito atual. Na Ucrânia, a integração de algoritmos para decisões táticas e automação de drones gera divisões morais e políticas profundas. Enquanto defensores destacam a vantagem estratégica imediata, críticos alertam para os riscos da autonomia militar sem supervisão humana rigorosa. O debate reflete a urgência de regulamentações internacionais para o uso militar de tecnologias emergentes.","link":"https://www.lemonde.fr/international/article/2026/11/16/faire-la-guerre-avec-l-ia-pour-l-ukraine-un-cas-de-conscience-moral-et-politique_6811239_3210.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Com 160 questões e apenas um erro, primeiro colocado em exame fiscal da Coreia do Sul admite fraude com IA","resumo":"O candidato que obteve a pontuação mais alta em um rigoroso exame de auditoria fiscal na Coreia do Sul admitiu ter usado inteligência artificial para fraudar a prova. Acertando 159 de 160 questões, ele utilizou dispositivos ocultos para transmitir as perguntas e receber as respostas geradas por IA em tempo real. O caso chocou a comunidade acadêmica e colocou em xeque a segurança de exames públicos de alta relevância mundial. O escândalo reforça a urgência em desenvolver métodos antifraude capazes de conter o avanço das tecnologias invisíveis de assistência digital.","link":"https://www.theguardian.com/technology/2026/nov/15/ai-cheating-south-korea-college-entrance-exam","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"https://www.infocop.es/","pais":"Espanha","titulo":"Governo espanhol aprova Estratégia Nacional de Cultura Científica e Inovação 2027-2030","resumo":"O Governo da Espanha aprovou uma nova diretriz nacional de cultura científica focada no período de 2027 a 2030. A medida busca tornar a produção científica mais democrática, acessível e participativa para toda a sociedade espanhola. Espera-se que a iniciativa impulsione investimentos em pesquisa e promova uma maior integração entre inovação tecnológica e demandas sociais.","link":"https://www.infocop.es/el-gobierno-aprueba-la-estrategia-nacional-de-cultura-cientifica-y-de-la-innovacion-2027-2030-para-impulsar-una-ciencia-mas-abierta-y-participativa/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Augsburger Allgemeine","pais":"Alemanha","titulo":"CEO da Mercedes: “A Europa tornou-se cara e complexa demais como localização”","resumo":"O CEO da Mercedes-Benz fez alertas críticos sobre os altos custos de energia e as burocracias regulatórias que afetam as operações industriais na Europa. A declaração reforça a pressão sobre os governos europeus para criarem políticas de incentivo competitivas para a indústria automotiva. O alerta sinaliza possíveis redirecionamentos de investimentos para regiões com custos operacionais mais favoráveis.","link":"https://www.augsburger-allgemeine.de/wirtschaft/ola-kaellenius-elektromobilitaet-ist-die-wichtigste-technologie-4-115657069","categoria":"INDÚSTRIA","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Hitachi utiliza tecnologia de inspiração quântica para otimizar redes elétricas","resumo":"A Hitachi desenvolveu uma tecnologia de computação baseada no recozimento CMOS, inspirada em princípios da física quântica, para criar planos de distribuição de energia em grande escala. A ferramenta permite processar variáveis complexas em alta velocidade, assegurando o fornecimento estável e eficiente de eletricidade. O avanço é crucial para lidar com as flutuações de demanda e integração de fontes renováveis na rede elétrica nacional. A inovação reforça o papel das tecnologias emergentes na modernização da infraestrutura energética.","link":"https://www.nikkei.com/article/DGXZRSP715284_W6A111C2000000/","categoria":"INOVAÇÃO TECNOLÓGICA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Avanço Tecnológico Viabiliza Novo Composto Antibacteriano de Pirazol","resumo":"Pesquisadores chineses anunciaram uma importante inovação técnica na síntese de novos compostos antibacterianos baseados em pirazol.\nA descoberta abre caminhos promissores para o combate a superbactérias resistentes aos medicamentos tradicionais e para o desenvolvimento de novos fármacos.\nO avanço científico evidencia a maturidade da pesquisa biomédica do país na criação de soluções de saúde de alto impacto.","link":"https://news.sciencenet.cn/htmlnews/2026/11/574799.shtm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"CNBC TV18","pais":"Índia","titulo":"Nifty 500: Belrise salta 10% com lucro enquanto Kaynes Technology atinge mínima de 52 semanas","resumo":"O índice Nifty 500 registrou fortes movimentações com resultados divergentes entre empresas do setor de tecnologia e manufatura. Enquanto a Belrise disparou com o aumento de lucros, a Kaynes Technology despencou para sua menor cotação em um ano. Os dados evidenciam a seletividade dos investidores frente aos balanços trimestrais na Índia.","link":"https://www.cnbctv18.com/market/stocks/nifty-500-share-price-belrise-industries-natco-pharma-deepak-fert-kaynes-tech-inox-wind-tata-motors-q2-results-20034636.htm","categoria":"MERCADO FINANCEIRO","lang":"pt"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Russos participam da Web Summit apesar das sanções internacionais","resumo":"A presença de participantes e startups de origem russa na edição deste ano da Web Summit gerou debates acalorados nos bastidores do evento de tecnologia em Lisboa. Apesar das severas sanções econômicas impostas devido ao conflito na Ucrânia, a organização manteve critérios específicos para a participação. O caso evidencia a complexa intersecção entre diplomacia global, geopolítica e a indústria tecnológica internacional.","link":"https://www.cmjornal.pt/economia/detalhe/russos-participam-na-web-summit-apesar-de-sancoes","categoria":"EVENTOS","lang":"pt"},{"fonte":"Estadão","pais":"Brasil","titulo":"Como a tecnologia Mini LED transforma a experiência de imagem em telas grandes","resumo":"A consolidação da tecnologia Mini LED no mercado de exibições tem revolucionado a qualidade visual de televisores e monitores de grande porte. Ao proporcionar níveis superiores de brilho, contraste profundo e maior eficiência energética, o recurso se posiciona como um forte concorrente dos painéis OLED. Fabricantes investem massivamente nessa inovação para atender à crescente demanda por displays premium em residências e indústrias. A tendência sinaliza uma transformação marcante na forma como consumimos conteúdos visuais em alta resolução.","link":"https://www.estadao.com.br/em-alta/economia/negocios/como-a-tecnologia-mini-led-transforma-a-experiencia-de-imagem-em-telas-grandes/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"New York Post","pais":"Estados Unidos","titulo":"Crescente movimento anti-IA ignora os avanços e transformações positivas da tecnologia","resumo":"Artigo de opinião debate a recente onda de ceticismo e rejeição em relação aos avanços da inteligência artificial no mundo contemporâneo. A análise argumenta que os críticos costumam focar nos riscos hipotéticos, esquecendo melhorias vitais trazidas pela tecnologia à medicina e à produtividade. O texto defende que um diálogo equilibrado é essencial para mitigar perigos sem sufocar a inovação benéfica. A conscientização pública sobre os reais benefícios da IA torna-se cada vez mais indispensável.","link":"https://nypost.com/2026/11/15/opinion/dont-be-so-fast-to-dump-on-ai/","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"kosmosnews","pais":"França","titulo":"Spoutniks trabalha no desenvolvimento de tecnologia de comunicação a laser","resumo":"A empresa de tecnologia espacial Spoutniks está desenvolvendo novos sistemas de comunicação óptica baseados em laser para satélites. Essa abordagem inovadora promete multiplicar a largura de banda de transmissão de dados em comparação às radiofrequências tradicionais. A tecnologia permitirá transferir grandes volumes de dados científicos e de observação terrestre quase em tempo real. O avanço é visto como essencial para a infraestrutura das futuras missões espaciais de alta velocidade.","link":"https://kosmosnews.fr/2026/11/16/spoutniks-travaille-sur-la-technologie-des-communications-laser/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Megaspeed, empresa ligada à queda de executivo da Nvidia, afirma ser um negócio legítimo e legal","resumo":"A empresa Megaspeed veio a público defender suas operações comerciais após ser associada a controvérsias que abalaram a liderança da gigante da tecnologia Nvidia. Em comunicado oficial, a companhia alegou atuar em total conformidade com as leis vigentes no mercado internacional de semicondutores. A acusação e os desdobramentos financeiros geraram forte turbulência e desconfiança entre investidores do setor de hardware e IA. O episódio lança luz sobre a complexa rede de fornecedores e acordos comerciais que sustentam as grandes corporações tecnológicas globais.","link":"https://www.theguardian.com/technology/2026/nov/16/megaspeed-company-breaks-slience-nvidia-jensen-huang-alice-huang","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"La Vanguardia","pais":"Espanha","titulo":"Especialista em longevidade destaca o potencial da inteligência artificial no avanço da saúde","resumo":"O renomado cientista José Viña afirmou que a inteligência artificial desempenhará um papel crucial nas pesquisas de longevidade e saúde humana nos próximos anos. Segundo o especialista, o uso ético e consciente da tecnologia permitirá diagnósticos mais precoces e tratamentos personalizados. A integração entre biologia e algoritmos promete revolucionar a qualidade de vida da população.","link":"https://www.lavanguardia.com/vivo/longevity/20261116/11676105/jose-vina-experto-longevidad-inteligencia-artificial-ayudar-sabiduria-brl.html","categoria":"SAÚDE","lang":"pt"},{"fonte":"DIE ZEIT","pais":"Alemanha","titulo":"Monitor de Energia: A Alemanha conseguirá alcançar a transição energética?","resumo":"Um novo monitoramento avalia os progressos e desafios críticos da Alemanha na transição para fontes de energia renováveis nos próximos anos. Os dados apontam entraves no ritmo de expansão das redes elétricas e na substituição de matrizes tradicionais. O relatório destaca a urgência de reformas estruturais para garantir as metas climáticas sem comprometer a competitividade do país.","link":"https://www.zeit.de/wirtschaft/energiemonitor-strompreis-gaspreis-erneuerbare-energien-ausbau","categoria":"ENERGIA","lang":"pt"},{"fonte":"客观日本","pais":"Japão","titulo":"NICT cria LED ultravioleta profundo de alta eficiência e baixo custo de produção","resumo":"Pesquisadores do Instituto Nacional de Tecnologia da Informação e Comunicação do Japão desenvolveram o primeiro LED ultravioleta profundo de emissão superior de alta eficiência. A nova tecnologia reduz significativamente os custos de fabricação enquanto melhora drasticamente a taxa de conversão de energia elétrica. Dispositivos desse tipo são fundamentais para aplicações avançadas de esterilização, purificação de água e processos industriais de alta precisão. O avanço científico promete acelerar a adoção dessa tecnologia sustentável no mercado global.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_new/pt20261116000014.html","categoria":"CIÊNCIA E TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"China","titulo":"China Realiza Primeiro Voo Tripulado de Avião Comercial Elétrico de Passageiros do Mundo","resumo":"A indústria aeroespacial da China alcançou um marco histórico ao concluir com sucesso o primeiro voo tripulado de um avião comercial totalmente elétrico.\nO teste prático comprovou a viabilidade e a segurança de sistemas de propulsão limpa aplicada ao transporte aéreo de passageiros.\nA conquista posiciona o país na vanguarda do desenvolvimento da aviação sustentável e da tecnologia de emissão zero de carbono.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/11/15/china-faz-primeiro-voo-tripulado-de-aviao-comercial-eletrico-de-passageiros-do-mundo-assista.ghtml","categoria":"AERONÁUTICA","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Índia","titulo":"Ações da Kaynes Technology despencam 20% após queda drástica de 62% no lucro do 2º trimestre","resumo":"As ações da Kaynes Technology sofreram um forte impacto no mercado financeiro após a divulgação de seus resultados trimestrais abaixo do esperado. A queda nos lucros e o encolhimento das margens operacionais acenderam alertas entre corretoras e investidores do setor eletrônico. O evento reflete os desafios de custos e volatilidade enfrentados pela indústria de fabricação de hardware.","link":"https://www.moneycontrol.com/news/business/markets/kaynes-technology-shares-hit-10-lower-circuit-as-q2-profit-plunges-62-brokerages-flag-margin-pressure-debt-14080789.html","categoria":"MERCADO TECH","lang":"pt"},{"fonte":"SIC Notícias","pais":"Portugal","titulo":"Hyundai Ioniq 3: tecnologia a serviço da eficiência e do conforto","resumo":"A Hyundai apresentou os detalhes do novo Ioniq 3, integrando soluções avançadas de software, gestão energética e conectividade para o mercado de veículos elétricos. O modelo busca otimizar o consumo da bateria ao mesmo tempo em que oferece assistentes de condução autônoma de última geração. Com essa aposta, a montadora fortalece sua posição na transição sustentável da mobilidade urbana global.","link":"https://sicnoticias.pt/sobre-rodas/2026-11-15-video-hyundai-ioniq-3-a-tecnologia-ao-servico-da-eficiencia-e-do-conforto-53cc8bd2-1","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Amazon Loses 40 Satellites After Rocket Launch Failure","resumo":"Amazon faced a major setback in its satellite internet project after losing 40 devices during a failed launch. The incident compromises the expansion of the orbital network planned to compete with Starlink in the global connectivity market. Experts warn of the high financial costs and the impacts on the implementation schedule of the space infrastructure. The company is now evaluating the technical causes of the event to restructure the upcoming launch phases.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/11/16/amazon-perde-40-satelites-apos-falha-no-lancamento-de-foguete-entenda.ghtml","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"Advanced Science News","pais":"United States","titulo":"Scientists Make Titanium Float Without Sacrificing Strength","resumo":"Researchers have developed a new technique that makes titanium light enough to float on water without compromising its structural integrity. The innovation promises to revolutionize industries such as aerospace and automotive, enabling the creation of more efficient vehicles. Furthermore, the discovery paves the way for new ultralight and ultra-high-strength materials for extreme applications. This scientific breakthrough represents a significant milestone in modern materials engineering.","link":"https://www.advancedsciencenews.com/scientists-make-titanium-float-without-sacrificing-strength/","categoria":"SCIENCE","lang":"en"},{"fonte":"Le Télégramme","pais":"France","titulo":"Connected Pumps, AI, and Sensors: How Technology Revolutionizes Diabetes Treatment","resumo":"The use of connected pumps, smart sensors, and artificial intelligence is profoundly transforming diabetes management. Experts highlight that these advancements allow for real-time glucose level monitoring and automated insulin delivery. This innovation drastically reduces daily complications and substantially improves patients' quality of life. This convergence of medicine and technology represents a decisive milestone in modernized digital health.","link":"https://www.letelegramme.fr/cotes-d-armor/lannion-22300/pompes-connectees-ia-capteurs-comment-la-technologie-revolutionne-la-prise-en-charge-du-diabete-selon-un-specialiste-de-lannion-7159647.php","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Andover Advertiser","pais":"England","titulo":"Hampshire Snowplow Fleet Gains Smart Technology to Spread Salt with Precision","resumo":"Hampshire's road maintenance fleet has begun utilizing smart technology to optimize salt spreading during the winter. The new system analyzes weather and ground friction data to precisely adjust the exact amount of salt needed on each section of road. The innovation aims to reduce supply waste, save public resources, and decrease the environmental impact on British roads. In addition to increasing road safety, the measure serves as a technological model of infrastructural management for other regions of the country.","link":"https://www.andoveradvertiser.co.uk/news/26727811.hampshire-county-council-smart-technology-gritters/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ABC","pais":"Spain","titulo":"Montilla-Moriles Partners with Technology and Artificial Intelligence to Combat Pests","resumo":"The Spanish wine region of Montilla-Moriles is implementing artificial intelligence and technological tools to combat crop pests. The project aims to optimize vineyard monitoring, predicting agricultural threats with greater precision and speed. This innovative approach strengthens local production, reduces environmental impact, and consolidates digital transformation in the Spanish agribusiness sector.","link":"https://www.abc.es/espana/andalucia/cordoba/montillamoriles-alia-tecnologia-inteligencia-artificial-combatir-plagas-20261116063840-nts.html","categoria":"AGROTECH","lang":"en"},{"fonte":"维度网","pais":"Germany","titulo":"Germany's Covestro Initiates Automotive Waste Recycling Technology Project into Aromatics","resumo":"Covestro has launched an innovative project focused on developing technologies to transform automotive plastic waste into reusable aromatic compounds. The initiative seeks to accelerate the circular economy in the German automotive sector, significantly reducing the industry's carbon footprint. Expected impacts include decreasing dependence on fossil raw materials and advancing high-efficiency chemical recycling.","link":"https://www.wedoany.com/shortnews/514940.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"BigGo ファイナンス","pais":"Japan","titulo":"Mazda Develops Technology to Capture CO2 from Exhaust Gases by 2028","resumo":"Mazda has announced the development of an innovative technology capable of capturing carbon dioxide directly from vehicle exhaust gases while they are in motion. The Japanese automaker plans to start practical testing on public roads by 2028 with a focus on sustainability. The ultimate goal is to enable the commercialization and mass integration of this automotive technology by 2035. This initiative reinforces the efforts of Japan's automotive industry to achieve carbon neutrality in the coming decades.","link":"https://finance.biggo.jp/news/05ad886e-aaaf-4efb-95d2-6312201b63d8","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Launch of the 2026 AIPerf International AI Computing Capacity Ranking","resumo":"The new AIPerf 2026 international ranking, which measures processing capacity and infrastructure dedicated to artificial intelligence, has been released. The publication highlights continuous advancement and leadership in the development of supercomputing infrastructures aimed at advanced AI models. The benchmark serves as an important global reference for comparing computational power efficiency among the world's leading technological centers.","link":"https://news.sciencenet.cn/htmlnews/2026/11/574805.shtm","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Nagaland Post","pais":"India","titulo":"India's Space Economy Surpasses $9 Billion Mark","resumo":"India's space industry has reached a significant milestone by hitting $9 billion in value, driven by public and private investments in the astronomical technology sector. The growth reflects the expansion of commercial satellites and successful exploration missions in the country. Experts predict this advancement will solidify India's position as an emerging power in the global space market.","link":"https://nagalandpost.com/indias-space-economy-scales-9-billion-mark/","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"Executive Digest","pais":"Portugal","titulo":"Microsoft Outage, Flights Grounded, and Millions Affected: How Dependent Are We on Technology?","resumo":"A massive failure in Microsoft systems caused global chaos by paralyzing flights, healthcare services, and financial operations. The incident exposed the vulnerability of modern digital infrastructure and rekindled the debate over extreme dependence on a few technology companies. Experts warn of the urgent need for more robust contingency plans in critical sectors.","link":"https://executivedigest.sapo.pt/microsoft-em-baixo-avioes-em-terra-e-milhoes-de-pessoas-afetadas-ate-que-ponto-estamos-dependentes-da-tecnologia/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Agência FAPESP","pais":"Brazil","titulo":"AI Must Bring More Quality to Science, Not Just More Papers, Editor Warns","resumo":"The unbridled use of artificial intelligence tools in academic production has raised discussions about the integrity and utility of global scientific research. Editors of prestigious scientific journals highlight that technology should be applied to deepen analyses and generate relevant discoveries, rather than merely inflate the volume of publications. The warning draws attention to the risk of saturating the academic ecosystem with superficial content. The global community is now seeking to establish clear guidelines for the ethical use of AI in science.","link":"https://agencia.fapesp.br/ia-deve-trazer-mais-qualidade-para-a-ciencia-e-nao-apenas-mais-artigos-alerta-editor/59619","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Technology Org","pais":"United States","titulo":"AI100 Report: Artificial Intelligence Enters the Mainstream Ecosystem and Shapes Society","resumo":"The new AI100 report highlights how artificial intelligence has gone from a futuristic promise to an integral part of global daily life. The publication analyzes the profound impacts of technology in vital sectors such as healthcare, education, labor, and public governance. Experts warn of the urgent need for ethical regulations to keep pace with the rapid evolution of these systems. The document serves as a crucial guide to orient policymakers and technological leaders.","link":"https://www.technology.org/2026/11/16/ai100-report-ai-has-entered-the-mainstream-and-is-reshaping-society/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Le Devoir","pais":"France","titulo":"Marconi Technologies and ETS to Form a New Research Hub","resumo":"Marconi Technologies has formed a strategic partnership with ETS to establish an advanced technological research center. The initiative aims to accelerate the development of innovative solutions and promote the transfer of academic knowledge to the industrial sector. The project promises to strengthen scientific infrastructure and attract significant investments to the engineering field. The collaboration is expected to generate relevant patents and boost the regional technological ecosystem.","link":"https://www.ledevoir.com/economie/1025012/marconi-technologies-ets-formeront-pole-recherche","categoria":"RESEARCH","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Ethnic Minorities in Wales Four Times More Likely to Be Targeted by Police Facial Scanning","resumo":"A new survey has revealed alarming data regarding the use of facial recognition technology by police in Wales. The analysis indicates that people belonging to ethnic minorities are four times more likely to undergo biometric scans. Human rights organizations warn of the risk of amplifying discriminatory biases and a lack of transparency in the algorithms used. The debate rekindles pressures for severe regulation or the discontinuation of the use of these technological tools by UK law enforcement forces.","link":"https://www.theguardian.com/technology/2026/nov/15/ethnic-minorities-wales-police-facial-scans-data","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Infodefensa","pais":"Spain","titulo":"Telefónica Supplies 5G Technology to NATO Experimentation Center in Slovakia","resumo":"Telefónica has provided high-speed 5G infrastructure for the Controlled Experimentation Center of the Spanish deployment on Slovak soil under NATO. The technology allows for ultra-secure communications and real-time data transmission for tactical and defense operations. The initiative highlights the strategic capacity of telecommunications companies in supporting international military missions.","link":"https://www.infodefensa.com/texto-diario/mostrar/6089202/telefonica-facilita-tecnologia-5g-centro-experimentacion-controlada-despliegue-espanol-eslovaquia-otan","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"First gas expected to flow at the Stade LNG terminal","resumo":"The new floating Liquefied Natural Gas terminal in Stade is preparing to receive its first fuel shipments to supply the German grid. This strategic infrastructure aims to strengthen the country's energy security and replace gas supplies dependent on traditional routes. The project represents a major milestone in Germany's energy infrastructure to ensure operational stability.","link":"https://www.sueddeutsche.de/wirtschaft/lng-terminal-stade-erstes-gas-soll-in-stader-lng-terminal-fliessen-dpa.urn-newsml-dpa-com-20090101-261116-930-779","categoria":"ENERGY","lang":"en"},{"fonte":"Digital PR Platform","pais":"Japan","titulo":"NTT and ispace reach agreement to create optical communication infrastructure on the Moon","resumo":"Telecommunications operator NTT and space startup ispace have signed a strategic partnership to develop communication and power infrastructure on the Moon. The project will utilize advanced IOWN optical communication technology to establish ultra-fast, long-distance connections in cislunar space. Furthermore, the collaboration aims to enable laser power supply solutions for lunar equipment. The initiative positions Japan as a leader in technological development for sustainable lunar exploration.","link":"https://digitalpr.jp/r/148311","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"China's Top 100 High-Performance Supercomputers List for 2026 Published","resumo":"China has announced the official update of its Top 100 ranking of high-performance computing systems for the year 2026. The list reveals significant advancements in domestic supercomputer architecture and the massive processing of highly complex data. This move reinforces the country's strategic commitment to achieving technological self-sufficiency and leading the global computing race.","link":"https://news.sciencenet.cn/htmlnews/2026/11/574804.shtm","categoria":"SUPERCOMPUTING","lang":"en"},{"fonte":"HT Tech","pais":"India","titulo":"Punjab seeks to create skilled jobs through IT and technology investments","resumo":"The state of Punjab is implementing a strategy focused on attracting major investments in the information technology and digital innovation sector. The initiative aims to transform local infrastructure and promote the professional training of young talent. With this expansion, the regional government expects to generate thousands of highly skilled jobs in the coming years.","link":"https://tech.hindustantimes.com/brand-stories/punjab-looks-to-create-skilled-jobs-through-it-and-technology-investment-71794805080843.html","categoria":"DIGITAL INNOVATION","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"\"Hacked by José Sócrates\": ASAE website targeted by cyberattack","resumo":"The official portal of Portugal's Food and Economic Safety Authority (ASAE) was breached and displayed a provocative message referencing the former prime minister. The cyberattack compromised access to the entity's online services and raised concerns regarding information security in public agencies. The competent authorities are already investigating the origin of the breach to mitigate additional risks.","link":"https://www.cmjornal.pt/tecnologia/detalhe/hacked-by-jose-socrates-site-da-asae-alvo-de-ataque-informatico","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Rare earths, espionage, and chip control mark summit between Trump and Xi","resumo":"The dispute over dominance in the semiconductor and critical minerals supply chain is back in the spotlight during the meeting between the leaders of the United States and China. Control over essential technologies for the high-precision industry intensifies geopolitical and commercial tensions between the two largest economies in the world. Issues related to industrial espionage and technological sovereignty demand complex negotiations regarding restricted exports. The outcome of this summit could redefine the course of technological investments on a global scale.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/11/16/terras-raras-espionagem-e-controle-sobre-chips-os-temas-que-vao-marcar-a-cupula-de-trump-com-xi-nesta-semana.ghtml","categoria":"GEOPOLITICS AND TECH","lang":"en"},{"fonte":"AZoM","pais":"United States","titulo":"Integration of AI and Robotics for continuous research systems in materials science","resumo":"A recent study presents the convergence of artificial intelligence and autonomous robotics to accelerate the discovery of new materials. Laboratory automation allows for the execution of uninterrupted experiments and the analysis of complex data in record time. This approach drastically reduces the time required to develop advanced and sustainable technological solutions. The integration promises to transform traditional scientific research into a highly dynamic process.","link":"https://www.azom.com/news.aspx?newsID=66051","categoria":"INNOVATION","lang":"en"},{"fonte":"Techno-Science","pais":"France","titulo":"A cold lava planet?","resumo":"Astronomers have identified a peculiar exoplanet with characteristics that challenge current astrophysical models of planetary formation. The celestial body features an exotic composition that scientists hypothetically describe as having a cold lava surface. Spectroscopic analyses continue to understand the atmospheric dynamics and geological structure of this distant world. The discovery raises new questions about the diversity of planets outside our solar system.","link":"https://www.techno-science.net/fr/actualites/hd-3167-b-planete-lave-29519","categoria":"SCIENCE","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Reports of AI-generated child sexual abuse material rise 8,400% in two years","resumo":"Recent data points to an alarming 8,400% increase in reports of child sexual abuse material generated by artificial intelligence over the past two years. The skyrocketing growth reflects the ease of access to generative AI-based image creation tools. Digital safety experts and authorities are calling for the urgent implementation of stricter protection mechanisms by tech companies. The crisis highlights the pressing need for new international legislation to combat the misuse of these emerging tools.","link":"https://www.theguardian.com/technology/2026/nov/16/ai-related-child-sexual-abuse-material-rise-exploitation-deepfakes","categoria":"DIGITAL SAFETY","lang":"en"},{"fonte":"Valencia Plaza","pais":"Spain","titulo":"SemanticBots: the Castellón spin-off transforming science and data into business knowledge","resumo":"The spin-off SemanticBots, born in Castellón, has developed platforms focused on transforming large volumes of scientific data into actionable intelligence for businesses. The applied technology focuses on digital inclusion and automated customer service based on structured data. The model demonstrates the successful transfer of academic knowledge to the real productive market.","link":"https://valenciaplaza.com/valenciaplaza/empresas1/semanticbots-la-spin-off-de-castellon-que-transforma-ciencia-y-datos-en-conocimiento-para-las-empresas","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"Report: Jensen Huang talks about leadership and vision at the helm of Nvidia","resumo":"In recent statements, Nvidia CEO Jensen Huang discussed the long-term strategic vision for maintaining the company's global dominance in artificial intelligence. The discussion highlights the relevance of the company's chips in the global market and the technological direction toward new markets. The direct impact affects the entire semiconductor and advanced hardware ecosystem on a worldwide scale.","link":"https://www.sueddeutsche.de/wirtschaft/jensen-huang-nvidia-affaere-rueckkehr-li.3580971","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"NTT creates sovereign technology for vulnerability analysis without relying on external AI","resumo":"NTT has introduced a new system vulnerability analysis technology that operates entirely independently of external artificial intelligence models. The solution was designed to ensure digital sovereignty and protect sensitive data against leaks or unauthorized third-party access. The advancement responds to the growing demand for corporate cybersecurity in critical infrastructure in Japan. Consequently, the company seeks to strengthen the national technological ecosystem in the face of global cyber threats.","link":"https://news.yahoo.co.jp/articles/7ad7994977c6e861d42a5069b90f6e4ac14f0e74","categoria":"DIGITAL SAFETY","lang":"en"},{"fonte":"21财经","pais":"China","titulo":"Policy Defines Cutting-Edge Technology Reserves and Boosts Solid-State Battery Sector","resumo":"New Chinese government guidelines have established strategic priority for the development and reservation of next-generation industrial technologies. As an immediate result of this direction, stocks related to the solid-state battery sector saw a sharp appreciation in the market. The initiative aims to accelerate the national energy transition and consolidate industry competitiveness in the global electric vehicle ecosystem.","link":"https://www.21jingji.com/article/20261116/herald/a1ccdc793cb6d3bcaeeb979c2e117e3d.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"scanx.trade","pais":"India","titulo":"Hinduja Global Solutions signs 3-year deal with Rackspace Technology","resumo":"Hinduja Global Solutions has closed a three-year strategic partnership with multicloud giant Rackspace Technology. The agreement aims to optimize cloud infrastructure and accelerate the digital transformation of the company's global clients. The collaboration reinforces the competitiveness of the Indian advanced technology services ecosystem.","link":"https://scanx.trade/stock-market-news/companies/hinduja-global-solutions-signs-3-year-deal-rackspace-technology/56348464","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Pplware","pais":"Portugal","titulo":"Eclipse of the century: Sun to vanish for over six minutes during daylight","resumo":"A historic astronomical event promises to mobilize the scientific community and the general public by providing the longest duration of total darkness of the century. The total solar eclipse will offer a unique opportunity for researchers to study the solar corona and the effects of an abrupt drop in light on the atmosphere. The phenomenon is already sparking great tourist interest and requires special preparations for safe observation.","link":"https://pplware.sapo.pt/ciencia/eclipse-solar-2027-portugal-sol-desaparece/","categoria":"ASTRONOMY","lang":"en"},{"fonte":"Facebook","pais":"Brazil","titulo":"New technology could be used in future Moon and Mars missions","resumo":"Researchers have presented a promising technological advancement aimed at enabling and sustaining human presence in long-duration space explorations. The innovative system aims to optimize operational efficiency and the safety of equipment operated in extreme extraterrestrial environments. The solution is viewed with great enthusiasm by space agencies involved in planning the return to the Moon and future trips to Mars. The novelty represents a fundamental strategic step for the expansion of the human space frontier.","link":"https://www.facebook.com/midiamax/posts/tecnologia-pode-ser-utilizada-em-futuras-miss%C3%B5es-%C3%A0-lua-e-marte/1568370195322223/","categoria":"SPACE EXPLORATION","lang":"en"},{"fonte":"The Indian Express","pais":"United States","titulo":"Intel sued by shareholders following 29% stock plunge","resumo":"Intel shareholders have filed a lawsuit against the semiconductor giant following a sharp decline in the value of its shares in the financial market. The central allegation involves the alleged omission of operational problems and delays in the delivery of new chip technologies. The impact of the crisis reflects growing pressure and competition in the hardware and artificial intelligence sectors. The legal dispute increases uncertainties regarding the company's financial recovery and leadership.","link":"https://indianexpress.com/article/technology/tech-news-technology/intel-sued-by-shareholders-following-29-stock-plunge-10964763/","categoria":"BUSINESS","lang":"en"},{"fonte":"Le Monde.fr","pais":"France","titulo":"Waging war with AI? For Ukraine, a moral and political dilemma","resumo":"The use of artificial intelligence in combat scenarios raises unprecedented ethical and geopolitical debates in the current conflict. In Ukraine, the integration of algorithms for tactical decisions and drone automation generates deep moral and political divisions. While defenders highlight the immediate strategic advantage, critics warn of the risks of military autonomy without rigorous human supervision. The debate reflects the urgency of international regulations for the military use of emerging technologies.","link":"https://www.lemonde.fr/international/article/2026/11/16/faire-la-guerre-avec-l-ia-pour-l-ukraine-un-cas-de-conscience-moral-et-politique_6811239_3210.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"With 160 questions and only one error, top scorer in South Korean tax exam admits AI cheating","resumo":"The candidate who achieved the highest score in a rigorous tax auditing exam in South Korea admitted to using artificial intelligence to cheat on the test. Answering 159 out of 160 questions correctly, he used hidden devices to transmit the questions and receive AI-generated answers in real time. The case shocked the academic community and called into question the security of high-stakes public exams worldwide. The scandal reinforces the urgency of developing anti-cheating methods capable of containing the advance of invisible digital assistance technologies.","link":"https://www.theguardian.com/technology/2026/nov/15/ai-cheating-south-korea-college-entrance-exam","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"https://www.infocop.es/","pais":"Spain","titulo":"Spanish government approves 2027-2030 National Strategy for Scientific Culture and Innovation","resumo":"The Government of Spain has approved a new national scientific culture guideline focused on the 2027 to 2030 period. The measure seeks to make scientific production more democratic, accessible, and participatory for all of Spanish society. The initiative is expected to boost research investments and promote greater integration between technological innovation and social demands.","link":"https://www.infocop.es/el-gobierno-aprueba-la-estrategia-nacional-de-cultura-cientifica-y-de-la-innovacion-2027-2030-para-impulsar-una-ciencia-mas-abierta-y-participativa/","categoria":"SCIENCE","lang":"en"},{"fonte":"Augsburger Allgemeine","pais":"Germany","titulo":"Mercedes CEO: 'Europe has become too expensive and complex as a location'","resumo":"The CEO of Mercedes-Benz issued critical warnings about high energy costs and regulatory bureaucracies affecting industrial operations in Europe. The statement reinforces pressure on European governments to create competitive incentive policies for the automotive industry. The warning signals potential redirections of investments to regions with more favorable operating costs.","link":"https://www.augsburger-allgemeine.de/wirtschaft/ola-kaellenius-elektromobilitaet-ist-die-wichtigste-technologie-4-115657069","categoria":"INDUSTRY","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"Hitachi uses quantum-inspired technology to optimize power grids","resumo":"Hitachi has developed computing technology based on CMOS annealing, inspired by quantum physics principles, to create large-scale power distribution plans. The tool allows for processing complex variables at high speed, ensuring a stable and efficient supply of electricity. The advancement is crucial for dealing with demand fluctuations and integrating renewable sources into the national electrical grid. The innovation reinforces the role of emerging technologies in modernizing energy infrastructure.","link":"https://www.nikkei.com/article/DGXZRSP715284_W6A111C2000000/","categoria":"TECHNOLOGICAL INNOVATION","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Technological Breakthrough Enables New Pyrazole Antibacterial Compound","resumo":"Chinese researchers have announced a major technical innovation in the synthesis of new pyrazole-based antibacterial compounds. The discovery opens promising pathways to combat superbugs resistant to traditional drugs and for the development of new pharmaceuticals. The scientific advancement highlights the maturity of the country's biomedical research in creating high-impact healthcare solutions.","link":"https://news.sciencenet.cn/htmlnews/2026/11/574799.shtm","categoria":"SCIENCE","lang":"en"},{"fonte":"CNBC TV18","pais":"India","titulo":"Nifty 500: Belrise surges 10% on profit while Kaynes Technology hits 52-week low","resumo":"The Nifty 500 index recorded strong movements with divergent results among technology and manufacturing sector companies. While Belrise skyrocketed with increased profits, Kaynes Technology plummeted to its lowest price in a year. The data highlights investor selectivity regarding quarterly earnings reports in India.","link":"https://www.cnbctv18.com/market/stocks/nifty-500-share-price-belrise-industries-natco-pharma-deepak-fert-kaynes-tech-inox-wind-tata-motors-q2-results-20034636.htm","categoria":"FINANCIAL MARKET","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Russians participate in Web Summit despite international sanctions","resumo":"The presence of participants and startups of Russian origin at this year's edition of the Web Summit sparked heated debates behind the scenes of the technology event in Lisbon. Despite severe economic sanctions imposed due to the conflict in Ukraine, the organization maintained specific criteria for participation. The case highlights the complex intersection between global diplomacy, geopolitics, and the international tech industry.","link":"https://www.cmjornal.pt/economia/detalhe/russos-participam-na-web-summit-apesar-de-sancoes","categoria":"EVENTS","lang":"en"},{"fonte":"Estadão","pais":"Brazil","titulo":"How Mini LED technology transforms the image experience on large screens","resumo":"The consolidation of Mini LED technology in the display market has revolutionized the visual quality of large televisions and monitors. By providing superior brightness levels, deep contrast, and greater energy efficiency, the feature positions itself as a strong competitor to OLED panels. Manufacturers are massively investing in this innovation to meet the growing demand for premium displays in homes and industries. The trend signals a striking transformation in how we consume high-resolution visual content.","link":"https://www.estadao.com.br/em-alta/economia/negocios/como-a-tecnologia-mini-led-transforma-a-experiencia-de-imagem-em-telas-grandes/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"New York Post","pais":"United States","titulo":"Growing anti-AI movement ignores the technology's advancements and positive transformations","resumo":"An opinion piece discusses the recent wave of skepticism and rejection regarding the advances of artificial intelligence in the contemporary world. The analysis argues that critics tend to focus on hypothetical risks, forgetting vital improvements brought by the technology to medicine and productivity. The text argues that a balanced dialogue is essential to mitigate dangers without stifling beneficial innovation. Public awareness of AI's real benefits is becoming increasingly indispensable.","link":"https://nypost.com/2026/11/15/opinion/dont-be-so-fast-to-dump-on-ai/","categoria":"TRENDS","lang":"en"},{"fonte":"kosmosnews","pais":"France","titulo":"Spoutniks works on developing laser communication technology","resumo":"Space technology company Spoutniks is developing new laser-based optical communication systems for satellites. This innovative approach promises to multiply data transmission bandwidth compared to traditional radio frequencies. The technology will allow for the transfer of large volumes of scientific and Earth observation data almost in real time. The advancement is seen as essential for the infrastructure of future high-speed space missions.","link":"https://kosmosnews.fr/2026/11/16/spoutniks-travaille-sur-la-technologie-des-communications-laser/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Megaspeed, company linked to Nvidia executive's downfall, claims to be a legitimate and legal business","resumo":"Megaspeed has come forward to defend its commercial operations after being associated with controversies that shook the leadership of tech giant Nvidia. In an official statement, the company claimed to operate in full compliance with current laws in the international semiconductor market. The accusation and financial developments generated strong turbulence and distrust among investors in the hardware and AI sectors. The episode sheds light on the complex network of suppliers and commercial agreements that support major global tech corporations.","link":"https://www.theguardian.com/technology/2026/nov/16/megaspeed-company-breaks-slience-nvidia-jensen-huang-alice-huang","categoria":"BUSINESS","lang":"en"},{"fonte":"La Vanguardia","pais":"Spain","titulo":"Longevity expert highlights the potential of artificial intelligence in healthcare advancement","resumo":"Renowned scientist José Viña stated that artificial intelligence will play a crucial role in longevity and human health research in the coming years. According to the expert, the ethical and conscious use of technology will allow for earlier diagnoses and personalized treatments. The integration between biology and algorithms promises to revolutionize the population's quality of life.","link":"https://www.lavanguardia.com/vivo/longevity/20261116/11676105/jose-vina-experto-longevidad-inteligencia-artificial-ayudar-sabiduria-brl.html","categoria":"HEALTH","lang":"en"},{"fonte":"DIE ZEIT","pais":"Germany","titulo":"Energy Monitor: Will Germany manage to achieve the energy transition?","resumo":"A new monitoring report assesses Germany's progress and critical challenges in transitioning to renewable energy sources over the coming years. Data points to obstacles in the pace of power grid expansion and the replacement of traditional energy matrices. The report highlights the urgency of structural reforms to secure climate goals without compromising the country's competitiveness.","link":"https://www.zeit.de/wirtschaft/energiemonitor-strompreis-gaspreis-erneuerbare-energien-ausbau","categoria":"ENERGY","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"NICT creates high-efficiency, low-production-cost deep ultraviolet LED","resumo":"Researchers at Japan's National Institute of Information and Communications Technology have developed the first high-efficiency top-emitting deep ultraviolet LED. The new technology significantly reduces manufacturing costs while drastically improving the electrical energy conversion rate. Devices of this type are fundamental for advanced sterilization applications, water purification, and high-precision industrial processes. The scientific breakthrough promises to accelerate the adoption of this sustainable technology in the global market.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_new/pt20261116000014.html","categoria":"SCIENCE AND TECHNOLOGY","lang":"en"},{"fonte":"O GLOBO","pais":"China","titulo":"China Conducts World's First Manned Flight of an Electric Commercial Passenger Airplane","resumo":"China's aerospace industry achieved a historic milestone by successfully completing the first manned flight of an all-electric commercial aircraft. The practical test proved the viability and safety of clean propulsion systems applied to passenger air transport. The achievement positions the country at the forefront of sustainable aviation development and zero-carbon emission technology.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/11/15/china-faz-primeiro-voo-tripulado-de-aviao-comercial-eletrico-de-passageiros-do-mundo-assista.ghtml","categoria":"AERONAUTICS","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"Kaynes Technology shares plunge 20% following a dramatic 62% drop in Q2 profit","resumo":"Kaynes Technology shares took a heavy hit in the financial market after releasing quarterly results that fell short of expectations. The drop in profits and shrinking operating margins raised alarms among brokerages and investors in the electronics sector. The event reflects the cost challenges and volatility faced by the hardware manufacturing industry.","link":"https://www.moneycontrol.com/news/business/markets/kaynes-technology-shares-hit-10-lower-circuit-as-q2-profit-plunges-62-brokerages-flag-margin-pressure-debt-14080789.html","categoria":"TECH MARKET","lang":"en"},{"fonte":"SIC Notícias","pais":"Portugal","titulo":"Hyundai Ioniq 3: technology serving efficiency and comfort","resumo":"Hyundai unveiled the details of the new Ioniq 3, integrating advanced software solutions, energy management, and connectivity for the electric vehicle market. The model aims to optimize battery consumption while offering next-generation autonomous driving assistants. With this bet, the automaker strengthens its position in the sustainable transition of global urban mobility.","link":"https://sicnoticias.pt/sobre-rodas/2026-11-15-video-hyundai-ioniq-3-a-tecnologia-ao-servico-da-eficiencia-e-do-conforto-53cc8bd2-1","categoria":"INNOVATION","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
