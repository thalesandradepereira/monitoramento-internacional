lesões cutâneas severas. Além de acelerar a cicatrização, a tecnologia reduz drasticamente a necessidade de enxertos autólogos tradicionais. O avanço consolida a posição do país na vanguarda das pesquisas biotecnológicas mundiais.","link":"https://diariodistrito.sapo.pt/franca-revoluciona-medicina-com-pele-artificial/","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Technology Org","pais":"Inglaterra","titulo":"Nova tecnologia passa no teste do olfato","resumo":"Uma nova tecnologia baseada em inteligência artificial e sensores avançados está sendo desenvolvida para replicar o sentido do olfato humano com alta precisão. O avanço promete revolucionar a indústria de diagnósticos médicos ao identificar doenças através do hálito e odores corporais. Além da medicina, a inovação tem potencial para transformar a segurança alimentar e o controle de qualidade industrial. Especialistas destacam que a digitalização dos odores representa uma nova fronteira para os sentidos artificiais.","link":"https://www.technology.org/2026/11/22/new-tech-passes-the-smell-test/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Información","pais":"Espanha","titulo":"A menor sala de concertos da Espanha com tecnologia para pessoas com perda auditiva estará em Alicante","resumo":"Alicante sediará a menor sala de concertos da Espanha, equipada com recursos avançados de acessibilidade para deficientes auditivos. O espaço utiliza indução magnética e sistemas de vibração para permitir que o público sinta as frequências sonoras diretamente. A iniciativa combina inovação tecnológica e inclusão cultural de maneira inédita no país. Essa abordagem pretende transformar a experiência de entretenimento acessível no setor musical.","link":"https://www.informacion.es/cultura/2026/11/22/sala-conciertos-pequena-espana-tecnologia-personas-perdida-auditiva-alicante-euterpe-sant-joan-136661028.html","categoria":"TECNOLOGIA E INCLUSÃO","lang":"pt"},{"fonte":"FinanzNachrichten.de","pais":"Alemanha","titulo":"Apple e Samsung sob pressão? Nova tecnologia de nanopartículas promete melhor proteção contra a luz da tela","resumo":"Uma nova tecnologia baseada em nanopartículas promete revolucionar a proteção ocular contra a luz emitida pelas telas de dispositivos móveis. Essa inovação coloca gigantes como Apple e Samsung sob pressão para adotarem padrões mais avançados de exibição. Com a crescente preocupação com a saúde visual dos usuários, a novidade pode redefinir as exigências da indústria de displays nos próximos anos.","link":"https://www.finanznachrichten.de/nachrichten-2026-11/70196145-apple-und-samsung-unter-druck-neue-nanopartikel-technologie-verspricht-besseren-schutz-vor-display-licht-176.htm","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Vatican News","pais":"Japão","titulo":"Papa: Se a tecnologia não for gerida com base na ética, o risco para a humanidade será enorme","resumo":"O Papa Francisco alertou sobre os profundos riscos que o desenvolvimento tecnológico desprovido de ética pode causar à humanidade. O pontífice ressaltou que ferramentas como a inteligência artificial precisam de diretrizes morais claras para proteger a dignidade humana. A mensagem reforça a necessidade urgente de regulação global e responsabilidade entre os desenvolvedores de tecnologia. Com esse alerta, busca-se evitar que a inovação ultrapasse os valores humanos fundamentais.","link":"https://www.vaticannews.va/ja/pope/news/2026-11/leone-xiv-partecipanti-international-space-forum-2026.html","categoria":"TECNOLOGIA \u0026 ÉTICA","lang":"pt"},{"fonte":"中国科学院","pais":"China","titulo":"Equipe chinesa de supercomputação com dez membros conquista o Prêmio Gordon Bell de 2026","resumo":"Uma equipe formada por dez pesquisadores chineses foi contemplada com o prestigiado Prêmio Gordon Bell de 2026, considerado o Nobel da computação de alto desempenho. O feito destaca o avanço acelerado da China no desenvolvimento de algoritmos e infraestrutura de supercomputação de classe mundial. A conquista reforça a liderança do país em simulações científicas complexas e no processamento massivo de dados para pesquisas de ponta.","link":"https://www.cas.cn/cm/202611/t20261121_5124746.shtml","categoria":"SUPERCOMPUTAÇÃO","lang":"pt"},{"fonte":"The Week","pais":"Índia","titulo":"Dr. Nikhil Tandon defende prestação de cuidados médicos mais sutil com uso de IA e tecnologia digital","resumo":"O Dr. Nikhil Tandon destacou a importância de transformar o sistema de saúde integrando inteligência artificial e soluções digitais avançadas. Segundo o especialista, a adoção de tecnologias modernas permite um atendimento médico mais personalizado e preciso para as necessidades dos pacientes. Essa abordagem busca otimizar o diagnóstico preventivo e melhorar significativamente os resultados clínicos no país. A iniciativa reforça a tendência crescente de inovação tecnológica aplicada à medicina moderna.","link":"https://www.theweek.in/theweek/cover/2026/11/21/need-more-nuanced-care-delivery-harnessing-ai-digital-technology-dr-nikhil-tandon.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"SIC Notícias","pais":"Portugal","titulo":"Papa alerta para 'riscos enormes' se a tecnologia não for regida pela ética","resumo":"O Papa Francisco reforçou a necessidade urgente de estabelecer diretrizes éticas para o desenvolvimento da inteligência artificial e de novas tecnologias. O pontífice alertou que o avanço tecnológico sem limites morais pode aprofundar desigualdades globais e comprometer a dignidade humana. O pronunciamento incentiva líderes mundiais a promoverem regulamentações que coloquem o bem-estar social no centro das inovações. Essa reflexão busca garantir que o progresso científico sirva como uma ferramenta de inclusão e paz.","link":"https://sicnoticias.pt/especiais/papa-leao-xiv/2026-11-21-papa-alerta-para-riscos-enormes-se-tecnologia-nao-for-regida-pela-etica-5cf1bdf1?utm_source=sicnot\u0026utm_medium=content\u0026utm_campaign=WEB\u0026utm_content=/especiais/papa-leao-xiv/2026-11-21-papa-alerta-para-riscos-enormes-se-tecnologia-nao-for-regida-pela-etica-5cf1bdf1","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Aventuras na História","pais":"Brasil","titulo":"Nova Tecnologia Permite Transformar Poeira Lunar em Blocos Estilo LEGO","resumo":"Cientistas desenvolveram uma abordagem inovadora capaz de fundir o regolito lunar para fabricar estruturas semelhantes a peças interconectáveis de brinquedo. Essa técnica visa facilitar a construção de bases e abrigos espaciais diretamente na Lua sem a necessidade de transportar materiais pesados da Terra. Os testes em ambientes simulados demonstraram alta resistência mecânica e eficiência no processo de fabricação. O avanço representa um passo decisivo para a sustentabilidade de futuras missões espaciais de longa duração.","link":"https://aventurasnahistoria.com.br/noticias/historia-hoje/nova-tecnologia-permite-transformar-poeira-lunar-em-blocos-de-lego.phtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"NASA (.gov)","pais":"Estados Unidos","titulo":"Cápsula Dragon retorna à Terra repleta de experimentos científicos e carga","resumo":"A espaçonave Dragon concluiu com sucesso sua missão de reabastecimento e retornou da Estação Espacial Internacional. A bordo, a cápsula trouxe valiosos materiais de pesquisas científicas conduzidas em microgravidade por astronautas. Os experimentos resgatados cobrem diversas áreas como biologia, ciência dos materiais e medicina espacial. O retorno bem-sucedido garante que cientistas recebam dados cruciais para o avanço da exploração cósmica.","link":"https://www.nasa.gov/blogs/spacestation/2026/11/21/dragon-returns-to-earth-packed-with-science-and-cargo/","categoria":"AEROSPACIAL","lang":"pt"},{"fonte":"Les Echos","pais":"França","titulo":"Como o estouro da bolha de IA pode descarrilar a economia mundial","resumo":"Especialistas e analistas financeiros alertam para os riscos crescentes de uma superavaliação nos investimentos em inteligência artificial. O aumento desmedido nas cotações de empresas de tecnologia gera receio de uma correção abrupta no mercado global. Caso a bolha venha a estourar, os impactos podem se espalhar rapidamente por diversos setores econômicos interconectados. A incerteza exige maior cautela de investidores e reguladores diante do entusiasmo tecnológico.","link":"https://www.lesechos.fr/monde/enjeux-internationaux/comment-leclatement-de-la-bulle-ia-pourrait-faire-derailler-leconomie-mondiale-2263903","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Pplware","pais":"Inglaterra","titulo":"Fazer medicamentos no espaço: a Europa quer uma fábrica que vá ao espaço e volte","resumo":"A Europa está investindo no desenvolvimento de fábricas orbitais reutilizáveis focadas na produção de medicamentos em microgravidade. A ausência de gravidade permite a cristalização de proteínas e compostos farmacêuticos com pureza e estrutura impossíveis de obter na Terra. Essa iniciativa visa criar tratamentos mais eficazes para doenças complexas e fortalecer a autonomia tecnológica europeia. O projeto marca um importante passo para a comercialização do espaço e a inovação na indústria farmacêutica global.","link":"https://pplware.sapo.pt/ciencia/fabrica-espacial-rev1-medicamentos/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"MUNDIARIO","pais":"Espanha","titulo":"Lamborghini leva sua lenda ao limite: o Revuelto SV desafia a era elétrica","resumo":"A Lamborghini apresentou o Revuelto SV, levando seu supercarro emblemático a um novo patamar de desempenho extremo. O modelo desafia as tendências puramente elétricas ao integrar um motor V12 a sistemas híbridos de alta performance. Essa estratégia reforça o compromisso da marca em preservar a emoção mecânica tradicional. A novidade sinaliza um momento crucial na transição tecnológica da indústria de luxo.","link":"https://www.mundiario.com/motor/lamborghini-lleva-leyenda-limite-revuelto-sv-desafia-era-electrica/20261122031445454271.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Mindener Tageblatt","pais":"Alemanha","titulo":"Sonda de Mercúrio 'BepiColombo' entra na órbita do planeta alvo","resumo":"A missão espacial europeia-japonesa BepiColombo alcançou um marco histórico ao iniciar a órbita ao redor de Mercúrio, seu planeta de destino. A sonda utilizará seus instrumentos científicos avançados para mapear a superfície e analisar a composição e o campo magnético do planeta. Os dados coletados pela missão promovem avanços inéditos na compreensão sobre a formação e evolução do sistema solar.","link":"https://www.mt.de/weltnews/wissenschaft/Merkur-Sonde-BepiColombo-umkreist-Zielplaneten-24468274.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"朝日新聞","pais":"Japão","titulo":"Restauração do Castelo de Shuri: A tecnologia dos mestres japoneses apoiada pela ciência","resumo":"A reconstrução do Castelo de Shuri exemplifica a união entre a carpintaria tradicional japonesa e a ciência moderna. Pesquisadores e artesãos estão utilizando dados científicos avançados para replicar com exatidão as estruturas históricas destruídas pelo fogo. Essa integração garante maior resistência técnica e autenticidade ao processo de restauração cultural. O projeto se destaca como um marco no uso da tecnologia aplicada à preservação do patrimônio histórico.","link":"https://www.asahi.com/articles/ASVCJ2TF2VCJBNEH003M.html","categoria":"CIÊNCIA \u0026 TECNOLOGIA","lang":"pt"},{"fonte":"Sohu","pais":"China","titulo":"Estação Espacial da China avança com novas movimentações e testes científicos em órbita","resumo":"A Estação Espacial Chinesa registrou atualizações significativas com o avanço ordenado de diversos experimentos científicos e tecnológicos em microgravidade. As missões em andamento abrangem pesquisas nas áreas de biologia espacial, ciência dos materiais e física fundamental. Os resultados obtidos consolidam a posição do programa espacial chinês como um centro de inovação contínua e exploração científica sustentável.","link":"https://m.sohu.com/a/1104808206_163278?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"t2ONLINE","pais":"Índia","titulo":"Krish Ashok: Masala Lab é um divertido guia científico sobre os mitos da culinária indiana","resumo":"O livro Masala Lab, escrito por Krish Ashok, explora a ciência por trás da culinária tradicional indiana de forma acessível e bem-humorada. A obra desmistifica crenças populares sobre alimentos, explicando os processos químicos e físicos que ocorrem durante a preparação das refeições. O autor utiliza uma abordagem baseada em evidências para transformar a maneira como as pessoas entendem a cozinha cotidiana. Trata-se de uma leitura envolvente que une conhecimento científico, cultura e gastronomia.","link":"https://t2online.in/goodlife/books/krish-ashok--masala-lab-is-a-fun-science-guide-to-indian-food-myths/2009392","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"CNN Portugal","pais":"Portugal","titulo":"Estas rodas inspiradas em origami podem ajudar a explorar os túneis de lava da Lua","resumo":"Pesquisadores desenvolveram rodas inovadoras com estrutura dobrável inspirada na arte do origami para veículos de exploração espacial. A tecnologia permite que os rovers adaptem seu diâmetro para navegar por terrenos acidentados e túneis de lava subsuperficiais no solo lunar. Essa flexibilidade mecânica reduz significativamente o risco de o veículo ficar preso durante missões de alta complexidade. A novidade representa um avanço promissor para a expansão da exploração robótica na Lua e em outros corpos celestes.","link":"https://cnnportugal.iol.pt/rodas/exploracao/estas-rodas-inspiradas-no-origami-podem-ajudar-a-explorar-os-tuneis-de-lava-da-lua/20261121/6ae8bd4dd34e5a653d7327f0","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Estadão","pais":"Brasil","titulo":"Fundador da Anduril Afirma que o iPhone Popularizou a Tecnologia Fácil e Reduziu Espaço para Especialistas","resumo":"O fundador da empresa de tecnologia Anduril declarou que a simplicidade extrema trazida pelo iPhone alterou a relação da sociedade com ferramentas técnicas complexas. Segundo a análise, a busca desenfreada por interfaces intuitivas acabou diminuindo a valorização de profissionais altamente especializados na criação de softwares profundos. A crítica gera debates acalorados entre desenvolvedores e líderes do setor de tecnologia sobre o equilíbrio entre usabilidade e profundidade técnica. O cenário levanta reflexões sobre o futuro da educação técnica e da inovação pesada.","link":"https://www.estadao.com.br/em-alta/tecmundo/big-techs/palmer-luckey-diz-que-iphone-popularizou-tecnologia-facil-e-reduziu-espaco-para-especialistas/","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"The New York Times","pais":"Estados Unidos","titulo":"Apagões tecnológicos são apenas o começo e a IA trará mais interrupções","resumo":"Especialistas alertam que falhas massivas em sistemas digitais tendem a se intensificar com a expansão da inteligência artificial. A crescente complexidade da infraestrutura de TI aliada à automação por IA cria novos pontos de vulnerabilidade crítica. A integração acelerada dessas tecnologias exige uma reavaliação urgente sobre segurança e resiliência operacional. O impacto dessas interrupções pode afetar desde serviços financeiros até redes essenciais de comunicação.","link":"https://www.nytimes.com/2026/11/21/us/politics/tech-outages-ai-disruptions.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"RFI","pais":"França","titulo":"Países da UE criticam proposta de orçamento que prevê taxa sobre gigantes da tecnologia","resumo":"Diversos Estados-membros da União Europeia expressaram forte oposição à nova proposta orçamentária do bloco econômico. O plano inclui a criação de um imposto direcionado especificamente às grandes empresas globais de tecnologia. Críticos argumentam que a medida pode prejudicar a competitividade digital e gerar retaliações comerciais internacionais. O debate evidencia as divisões internas sobre como financiar o orçamento comunitário sem desacelerar a inovação.","link":"https://www.rfi.fr/br/europa/20261121-pa%C3%ADses-da-ue-criticam-proposta-de-or%C3%A7amento-do-bloco-que-prev%C3%AA-taxa-sobre-gigantes-da-tecnologia","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Dois grupos verificam a alegação de matemático de que o Claude ajudou a provar problema matemático","resumo":"Dois grupos independentes de pesquisadores confirmaram que o modelo de inteligência artificial Claude auxiliou na resolução de um complexo problema matemático. A conquista demonstra o potencial crescente das ferramentas de IA para atuar como colaboradores em descobertas científicas de alto nível. Matemáticos destacam que a assistência do algoritmo acelerou etapas cruciais de raciocínio e validação teórica. O marco reconfigura o papel dos modelos de linguagem na pesquisa científica e acadêmica.","link":"https://www.theguardian.com/technology/2026/nov/21/anthropic-riemann-hypothesis-solved-claude-ai","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Las Provincias","pais":"Espanha","titulo":"Netflix confirma o retorno da série de ficção científica dos criadores de 'Game of Thrones' que fez sucesso em 44 países","resumo":"A Netflix anunciou oficialmente a renovação da série de ficção científica desenvolvida pelos mesmos criadores de Game of Thrones. A produção alcançou o topo de audiência em 44 países com sua narrativa complexa sobre contato extraterrestre e física teórica. O retorno promete expandir o universo tecnológico e filosófico abordado na primeira temporada. A confirmação consolida o projeto como um dos maiores investimentos do streaming.","link":"https://www.lasprovincias.es/culturas/tv/netflix-confirma-regreso-serie-ciencia-ficcion-creadores-20261117002605-nt.html","categoria":"ENTRETENIMENTO","lang":"pt"},{"fonte":"北京新闻","pais":"China","titulo":"Das indústrias ao esporte: interfaces cérebro-computador aceleram sua expansão comercial","resumo":"A tecnologia de interface cérebro-computador está expandindo rapidamente suas aplicações do setor industrial direto para o segmento esportivo e de bem-estar. Essa transição reflete o amadurecimento de algoritmos de leitura neural e dispositivos não invasivos de alta precisão. O movimento promete transformar a interação humano-máquina, otimizando o desempenho atlético e criando novas soluções de reabilitação motora.","link":"https://www.bj.chinanews.com.cn/news/2026/1122/104071.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"DD News","pais":"Índia","titulo":"CII propõe 15 reformas no setor financeiro para apoiar meta econômica da Índia de US$ 26,5 trilhões até 2047","resumo":"A Confederação da Indústria Indiana apresentou um conjunto de quinze reformas estratégicas para impulsionar o mercado financeiro do país. O plano visa criar as bases necessárias para sustentar a ambiciosa meta de atingir uma economia de 26,5 trilhões de dólares até o ano de 2047. As recomendações abordam o fortalecimento do mercado de capitais, expansão do crédito e modernização das estruturas regulatórias. A proposta é vista como um passo crucial para acelerar o crescimento econômico a longo prazo.","link":"https://ddnews.gov.in/en/cii-proposes-15-financial-sector-reforms-to-support-indias-26-5-trillion-economy-goal-by-2047/","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Diário de Leiria","pais":"Portugal","titulo":"Potencial das algas reúne ciência, empresas e comunidades costeiras","resumo":"Um encontro multidisciplinar reuniu cientistas, representantes do setor privado e comunidades locais para debater o aproveitamento sustentável das algas. O evento destacou as aplicações da biomassa marinha nos setores alimentício, cosmético, farmacêutico e de bioenergia. Além do impacto econômico, a iniciativa reforçou a importância da conservação dos ecossistemas marinhos e do desenvolvimento da economia azul. A colaboração pretende acelerar projetos de inovação alinhados com a sustentabilidade ambiental.","link":"https://www.diarioleiria.pt/2026/11/21/potencial-das-algas-reuniu-ciencia-empresas-e-comunidades-costeiras/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Estadão","pais":"Brasil","titulo":"Estatinas Causam Demência? O que a Ciência Descobriu Sobre o Boato da Internet","resumo":"Boatos que circulam nas redes sociais afirmam erroneamente que o uso prolongado de estatinas estaria associado ao desenvolvimento de demência. Estudos científicos rigorosos desmentem essa associação e mostram que o medicamento previne eventos cardiovasculares graves sem comprometer a saúde cognitiva. Pesquisadores ressaltam a importância de combater a desinformação médica que leva pacientes a descontinuar tratamentos essenciais. A orientação de especialistas reforça a segurança comprovada das estatinas em ensaios clínicos globais.","link":"https://www.estadao.com.br/pulsa/gustavo-meirelles/estatinas-causam-demencia-o-que-a-ciencia-descobriu-sobre-esse-papo-que-circula-na-internet/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Diario Público","pais":"Estados Unidos","titulo":"Nvidia se torna ponto de conflito na política da Casa Branca sobre a China","resumo":"A gigante dos semicondutores Nvidia está no centro das tensões geopolíticas entre os Estados Unidos e o governo chinês. Restrições severas de exportação impostas por Washington visam conter o avanço tecnológico e militar de Pequim em inteligência artificial. A empresa busca equilibrar a conformidade com as regulações americanas enquanto tenta manter acesso ao valioso mercado asiático. As decisões tomadas neste cenário devem moldar o futuro da cadeia global de suprimentos de chips.","link":"https://www.publico.es/internacional/nvidia-punto-choque-politica-casa-blanca-sobre-china.html","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"IndexBox","pais":"França","titulo":"Mercado de tecnologia alimentar: previsões até 2035 destacam clean label e conservação","resumo":"Relatórios recentes apontam que o setor de FoodTech passará por uma grande expansão impulsionada por novas exigências do consumidor. A busca por produtos com rótulo limpo e tecnologias inovadoras de conservação lideram os investimentos do mercado. O movimento busca alinhar sustentabilidade, segurança alimentar e maior durabilidade dos alimentos industrializados. A expectativa até 2035 é de uma transformação profunda na cadeia global de produção e distribuição.","link":"https://www.indexbox.io/fr/blog/food-technology-market-to-accelerate-through-2035-driven-by-clean-label-reformulation-and-shelf-life-innovation/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Negociações internacionais da ONU sobre o controle de armas autônomas fracassam","resumo":"As conversações diplomáticas na Organização das Nações Unidas para regular o uso de armas autônomas letais terminaram sem um acordo global. A falta de consenso entre as grandes potências militares impediu o estabelecimento de limites éticos e jurídicos claros para essas tecnologias. Críticos alertam que o colapso dos debates acelera uma corrida armada baseada em inteligência artificial sem supervisão humana. O impasse lança incertezas sobre a segurança internacional e o futuro do direito humanitário no combate moderno.","link":"https://www.theguardian.com/technology/2026/nov/21/international-talks-control-ai-autonomous-weapons-collapse","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"El Diario Vasco","pais":"Espanha","titulo":"Carlos Sabín, físico: «Viajar no tempo é impossível, é ficção científica»","resumo":"O físico espanhol Carlos Sabín analisou as limitações da física moderna em relação à viabilidade teórica de viagens no tempo. Ele explicou que as equações atuais desmentem a possibilidade de retroceder ou avançar no tempo como retratado pela cultura pop. O especialista reforçou a importância de separar teorias científicas consolidadas de meras especulações de ficção. A declaração reacende o debate sobre os limites reais da ciência contemporânea.","link":"https://www.diariovasco.com/sociedad/ciencia/carlos-sabin-fisico-viajar-tiempo-imposible-cienciaficcion-20261122000053-nt.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"21财经","pais":"China","titulo":"Nova tecnologia permite reutilizar lixo nuclear e gerar eletricidade a partir de resíduos","resumo":"Pesquisadores chineses desenvolveram métodos inovadores para reutilizar o combustível nuclear esgotado, transformando resíduos radioativos em uma nova fonte de geração elétrica. A técnica maximiza a eficiência do aproveitamento do urânio e reduz significativamente o volume de lixo atômico acumulado. O avanço representa um marco crucial para a sustentabilidade da energia nuclear e a transição energética de baixo carbono.","link":"https://www.21jingji.com/article/20261122/herald/512e1c285ab066fad74b9eaf15c691bc.html","categoria":"ENERGIA LIMPA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Universidade do Minho é a 106ª do mundo em ciência interdisciplinar","resumo":"A Universidade do Minho alcançou a 106ª posição no ranking global que avalia a excelência em pesquisas científicas interdisciplinares. O reconhecimento internacional destaca o compromisso da instituição em integrar diferentes áreas do conhecimento para resolver problemas complexos. Esse resultado consolida a universidade como uma referência no ecossistema de ensino superior e inovação em Portugal. A conquista reflete investimentos contínuos em projetos colaborativos e na atração de talentos científicos.","link":"https://sapo.pt/artigo/universidade-do-minho-e-a-106-do-mundo-em-ciencia-interdisciplinar-6b019e49f92df7383641f472","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"diariodigital.com.br","pais":"Brasil","titulo":"Reúso de Computadores pelo Governo Brasileiro Gera Economia Significativa de Água","resumo":"Uma iniciativa do governo brasileiro focada na restauração e reaproveitamento de equipamentos de informática ultrapassados revelou um importante impacto ambiental positivo. Além de estender a vida útil de milhares de computadores públicos, o projeto evitou o consumo indireto de grandes volumes de água necessários na manufatura de novos dispositivos. A medida promove a inclusão digital em comunidades vulneráveis por meio da doação dos aparelhos recuperados. A ação consolida a sustentabilidade como pilar estratégico na gestão de tecnologia pública.","link":"https://www.diariodigital.com.br/economia/reuso-de-computadores-pelo-governo-brasileiro-gera-economia-de-agua","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"Exame","pais":"Estados Unidos","titulo":"Nasdaq tem pior semana desde 2020 e nem IPO da Anthropic segurou setor de tecnologia","resumo":"O índice Nasdaq registrou seu desempenho semanal mais fraco em anos, refletindo forte desconfiança dos investidores no setor de tecnologia. Mesmo grandes acontecimentos e expectativas em torno da empresa de IA Anthropic não foram suficientes para conter a onda de vendas. Preocupações com valuation elevado e incertezas macroeconômicas pesaram fortemente sobre as gigantes de tecnologia. O cenário sinaliza um momento de correção e maior cautela no mercado financeiro global.","link":"https://exame.com/invest/mercados/nasdaq-tem-pior-semana-desde-2020-e-nem-ipo-da-anthropic-segurou-o-setor-de-tecnologia/","categoria":"MERCADO","lang":"pt"},{"fonte":"Le Monde.fr","pais":"França","titulo":"Europa enfraquece regulamentações enquanto ciência alerta sobre substâncias químicas","resumo":"Pesquisas científicas demonstram com clareza crescente a ligação entre a exposição a substâncias químicas e a alta de doenças modernas. Apesar desses alertas, órgãos reguladores da Europa enfrentam críticas por flexibilizar normas de proteção ambiental e de saúde pública. Especialistas apontam que priorizar interesses econômicos em detrimento do rigor científico coloca a população em risco. O cenário reforça a necessidade de um debate urgente sobre governança e sustentabilidade.","link":"https://www.lemonde.fr/idees/article/2026/11/22/alors-que-la-science-montre-de-mieux-en-mieux-le-role-des-substances-chimiques-dans-l-epidemie-de-maladies-de-civilisation-l-europe-affaiblit-sa-reglementation_6814145_3232.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"El Diario Vasco","pais":"Espanha","titulo":"«A tecnologia ajuda, mas continua sendo fundamental que o médico escute o paciente»","resumo":"Especialistas destacam que, embora ferramentas tecnológicas e IA tenham revolucionado a medicina moderna, a empatia clínica continua insubstituível. O diagnóstico preciso ainda depende fundamentalmente da escuta atenta do médico em relação aos relatos dos pacientes. A integração equilibrada entre inovação e atendimento humanizado é apontada como o grande desafio da saúde. O debate reforça a necessidade de manter o fator humano no centro da prática médica.","link":"https://www.diariovasco.com/culturas/tecnologia-ayuda-sigue-clave-medico-escuche-paciente-20261122200957-nt.html","categoria":"SAÚDE E TECNOLOGIA","lang":"pt"},{"fonte":"Finanças, Câmbio e Investimentos","pais":"China","titulo":"Ações de IA na China perdem US$ 1,7 trilhão após forte onda de vendas no setor de tecnologia","resumo":"O mercado de tecnologia da China enfrentou uma liquidação massiva que eliminou cerca de US$ 1,7 trilhão em valor de mercado das empresas de inteligência artificial. O movimento reflete incertezas dos investidores quanto à monetização de modelos de linguagem e restrições comerciais internacionais. Apesar da queda, analistas apontam que a consolidação do setor pode redefinir o foco das empresas em aplicações de IA mais viáveis.","link":"https://br.investing.com/news/stock-market-news/acoes-de-ia-da-china-perdem-us-17-trilhao-com-venda-em-massa-no-setor-de-tecnologia-2134863","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Programa '90 Segundos de Ciência' completa 10 anos","resumo":"O aclamado projeto radiofônico '90 Segundos de Ciência' celebra uma década dedicada à divulgação de pesquisas desenvolvidas em Portugal. A iniciativa dá voz a cientistas que explicam seus estudos de forma simples e acessível para o grande público em apenas um minuto e meio. Ao longo dessa trajetória, o programa aproximou a sociedade da produção acadêmica nacional e incentivou o interesse popular pela ciência. A comemoração reafirma o papel fundamental da comunicação científica no cotidiano.","link":"https://jornaleconomico.sapo.pt/noticias/programa-90-segundos-de-ciencia-faz-10-anos/","categoria":"COMUNICAÇÃO","lang":"pt"},{"fonte":"Gazeta de São Paulo","pais":"Brasil","titulo":"Geely EX5 EM-i Percorre Diversos Países para Testar Eficiência de Nova Tecnologia Automotiva","resumo":"Apresentado originalmente no Salão do Automóvel de São Paulo, o veículo híbrido Geely EX5 EM-i iniciou uma expedição global por múltiplos continentes. O objetivo dos testes de longa distância é colocar à prova a eficiência energética e a durabilidade do seu novo sistema de propulsão sob condições climáticas extremas. A marca busca validar tecnologias de ponta antes de iniciar a distribuição comercial em larga escala no mercado latino-americano. O projeto reflete o avanço acelerado da mobilidade eletrificada e inteligente na indústria automobilística.","link":"https://www.gazetasp.com.br/automotor/tecnologia-posta-a-prova-apresentado-no-salao-de-sao-paulo-geely-ex5-em-i-esta-percorrendo-varios-paises-para-testar-sua-eficiencia/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"CASRAI","pais":"Estados Unidos","titulo":"EUA e Alemanha realizam reunião conjunta sobre cooperação científica e segurança em pesquisa","resumo":"Representantes dos Estados Unidos e da Alemanha se reuniram para fortalecer parcerias estratégicas em pesquisa e inovação científica. O encontro focou no alinhamento de diretrizes para proteger dados sensíveis e propriedade intelectual contra ameaças externas. Ambas as nações buscaram equilibrar a promoção da ciência aberta com a necessidade de segurança em áreas de tecnologia crítica. A cooperação reforça a aliança ocidental na corrida pelo avanço científico seguro.","link":"https://casrai.org/news/us-germany-sixth-joint-committee-meeting-science-technology-research-security-2026","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Em 1970, empresa pavimentou rua de 183 metros com vidro moído de alta durabilidade","resumo":"Um experimento de engenharia realizado na década de 1970 utilizou vidro reciclado e moído para pavimentar uma via urbana de 183 metros. Dois anos após a aplicação, a superfície continuava em excelentes condições de conservação e resistia ao tráfego. A iniciativa pioneira antecipou discussões atuais sobre reaproveitamento de resíduos na infraestrutura civil. O caso histórico ressurge hoje como inspiração para soluções sustentáveis na construção urbana.","link":"https://www.science-et-vie.com/nature-et-environnement/en-1970-une-entreprise-a-pave-une-rue-de-183-metres-avec-du-verre-concasse-2-ans-plus-tard-elle-etait-toujours-jugee-en-bon-etat-264988.html","categoria":"ENGENHARIA","lang":"pt"},{"fonte":"MUNDIARIO","pais":"Espanha","titulo":"Banco da Espanha: riscos da IA e alta nos preços das moradias","resumo":"O Banco da Espanha alertou para os riscos crescentes associados à adoção acelerada da inteligência artificial no setor financeiro. O relatório também destaca a pressão econômica provocada pela constante alta nos preços dos imóveis no país. O órgão enfatiza a necessidade de regulamentação estrita para evitar instabilidade nos mercados automatizados. A análise acende um alerta sobre os impactos socioeconômicos da automação descontrolada.","link":"https://www.mundiario.com/economia/ia-amenaza-mercados-mientras-vivienda-dispara/20261121233036454235.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"汽车之家","pais":"China","titulo":"Teste em condições extremas reflete alta eficiência energética em novos veículos elétricos","resumo":"Em testes práticos a zero grau Celsius e em alta velocidade, um novo modelo de veículo elétrico alcançou uma taxa de eficiência de bateria de 86,75%. O desempenho impressionante foi impulsionado pelo uso de tecnologias de gerenciamento térmico semelhantes às empregadas pela Tesla. O resultado demonstra o avanço técnico das montadoras chinesas na superação dos gargalos de autonomia sob frio intenso.","link":"https://chejiahao.autohome.com.cn/info/26936413","categoria":"INOVAÇÃO AUTOMOTIVA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"ULS Arco Ribeirinho reforça centros de saúde com 1,6 milhão de euros em tecnologia","resumo":"A Unidade Local de Saúde do Arco Ribeirinho anunciou um investimento significativo direcionado à modernização tecnológica de seus centros de saúde. A verba será utilizada na aquisição de equipamentos médicos avançados e na atualização de sistemas de informação clínica. A medida visa otimizar o atendimento aos pacientes, reduzir tempos de espera e melhorar as condições de trabalho dos profissionais de saúde. O projeto reforça a transição digital no sistema público de saúde regional.","link":"https://sapo.pt/artigo/uls-arco-ribeirinho-reforca-centros-de-saude-com-1-6-milhoes-de-euros-em-tecnologia-6b022a962feb67ff6b482f58","categoria":"SAÚDE","lang":"pt"},{"fonte":"IndexBox","pais":"Brasil","titulo":"Mercado de Tecnologia de Alimentos Projeta Crescimento até 2035 Guiado pela Demanda Clean Label","resumo":"Projeções globais indicam que o setor de FoodTech passará por uma grande transformação até 2035 impulsionado pela busca por rótulos limpos e ingredientes naturais. A inovação tecnológica foca no prolongamento da vida útil dos alimentos sem a adição de conservantes sintéticos ou químicos agressivos. Tecnologias de embalagens ativas e métodos avançados de conservação estão no centro dessa revolução da indústria alimentícia. A tendência responde à crescente exigência dos consumidores por produtos mais saudáveis e sustentáveis.","link":"https://www.indexbox.io/pt-br/blog/food-technology-market-to-accelerate-through-2035-driven-by-clean-label-reformulation-and-shelf-life-innovation/","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"The Peninsula Qatar","pais":"Estados Unidos","titulo":"Catar se posiciona para se tornar polo regional de investimentos em tecnologia quântica","resumo":"O Catar está implementando estratégias ambiciosas para atrair capital e talentos voltados ao desenvolvimento de computação quântica. O país busca diversificar sua economia investindo pesadamente em infraestrutura tecnológica de ponta e parcerias internacionais. A iniciativa pretende transformar a região em um hub de referência para inovações quânticas no Oriente Médio. O movimento reflete a corrida global por dominância em tecnologias emergentes de alta complexidade.","link":"https://thepeninsulaqatar.com/article/22/11/2026/qatar-positions-itself-to-become-regional-hub-for-quantum-technology-investment","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"RFI","pais":"França","titulo":"«O chamado das profundezas»: uma imersão entre ciência e imaginação no Museu da Marinha","resumo":"O Museu Nacional da Marinha apresenta uma exposição marcante que une descobertas científicas e narrativas culturais sobre o oceano. A mostra convida os visitantes a explorar os mistérios do mar profundo por meio de acervos históricos e tecnologias interativas. O projeto destaca a importância da preservação marinha e a fascinante evolução da exploração oceânica. A iniciativa reforça a conexão vital entre conhecimento científico, arte e conscientização ambiental.","link":"https://www.rfi.fr/fr/podcasts/l-art-de-raconter-le-monde/20261122-l-appel-des-profondeurs-plong%C3%A9e-entre-science-et-imaginaire-au-mus%C3%A9e-national-de-la-marine?PcNCvtcnHj","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Balada IN","pais":"Brazil","titulo":"Brazil Concentrates Nearly Half of Latin America's Data Center Capacity and Targets Expansion by 2030","resumo":"Brazil is establishing itself as Latin America's main digital infrastructure hub by holding nearly half of the continent's total data center capacity. Projections for the coming years point to accelerated growth driven by high demand for artificial intelligence and cloud services. Massive investments in renewable energy and connectivity reinforce the country's strategic position through 2030. This expansion promises to boost the national digital economy and attract global technology giants.","link":"https://www.portalin.com.br/business/brasil-concentra-quase-metade-da-capacidade-de-data-centers-da-america-latina-e-mira-expansao-ate-2030/","categoria":"INFRASTRUCTURE","lang":"en"},{"fonte":"ScienceDaily","pais":"United States","titulo":"Time Might Be Much Stranger Than We Imagine, and Scientists Have a Way to Test It","resumo":"Scientists are developing new experimental methods to test the true nature of time in modern physics. Researchers suggest that the perception and behavior of time may challenge current models of quantum physics and relativity. The new theories aim to answer fundamental questions about how the universe evolves on microscopic scales. If proven, these approaches could revolutionize our understanding of the fabric of spacetime.","link":"https://www.sciencedaily.com/releases/2026/11/261120075558.htm","categoria":"SCIENCE","lang":"en"},{"fonte":"Diário do Distrito","pais":"France","titulo":"France Revolutionizes Medicine with the Development of Artificial Skin","resumo":"Scientists and researchers in France have achieved a major milestone in regenerative medicine by developing a new type of artificial skin. This promising innovation could transform the treatment of patients with severe burns and extensive skin injuries. In addition to accelerating healing, the technology drastically reduces the need for traditional autologous grafts. The breakthrough consolidates the country's position at the forefront of global biotechnological research.","link":"https://diariodistrito.sapo.pt/franca-revoluciona-medicina-com-pele-artificial/","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Technology Org","pais":"England","titulo":"New Technology Passes the Smell Test","resumo":"A new technology based on artificial intelligence and advanced sensors is being developed to replicate the human sense of smell with high precision. The breakthrough promises to revolutionize the medical diagnostics industry by identifying diseases through breath and body odors. Beyond medicine, the innovation has the potential to transform food safety and industrial quality control. Experts point out that the digitization of scents represents a new frontier for artificial senses.","link":"https://www.technology.org/2026/11/22/new-tech-passes-the-smell-test/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Información","pais":"Spain","titulo":"Spain's Smallest Concert Hall with Technology for the Hearing Impaired Will Be in Alicante","resumo":"Alicante will host Spain's smallest concert hall, equipped with advanced accessibility features for the hearing impaired. The space uses magnetic induction and vibration systems to allow the audience to feel sound frequencies directly. The initiative uniquely combines technological innovation and cultural inclusion in the country. This approach aims to transform the accessible entertainment experience in the music sector.","link":"https://www.informacion.es/cultura/2026/11/22/sala-conciertos-pequena-espana-tecnologia-personas-perdida-auditiva-alicante-euterpe-sant-joan-136661028.html","categoria":"TECHNOLOGY AND INCLUSION","lang":"en"},{"fonte":"FinanzNachrichten.de","pais":"Germany","titulo":"Apple and Samsung Under Pressure? New Nanoparticle Technology Promises Better Protection Against Screen Light","resumo":"A new nanoparticle-based technology promises to revolutionize eye protection against the light emitted by mobile device screens. This innovation puts giants like Apple and Samsung under pressure to adopt more advanced display standards. With growing concern for users' visual health, the new development could redefine the display industry's requirements in the coming years.","link":"https://www.finanznachrichten.de/nachrichten-2026-11/70196145-apple-und-samsung-unter-druck-neue-nanopartikel-technologie-verspricht-besseren-schutz-vor-display-licht-176.htm","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Vatican News","pais":"Japan","titulo":"Pope: If Technology Is Not Governed by Ethics, the Risk to Humanity Will Be Enormous","resumo":"Pope Francis warned of the profound risks that technological development devoid of ethics can pose to humanity. The pontiff stressed that tools like artificial intelligence need clear moral guidelines to protect human dignity. The message reinforces the urgent need for global regulation and responsibility among tech developers. This warning aims to prevent innovation from overriding fundamental human values.","link":"https://www.vaticannews.va/ja/pope/news/2026-11/leone-xiv-partecipanti-international-space-forum-2026.html","categoria":"TECHNOLOGY \u0026 ETHICS","lang":"en"},{"fonte":"中国科学院","pais":"China","titulo":"Ten-Member Chinese Supercomputing Team Wins the 2026 Gordon Bell Prize","resumo":"A team of ten Chinese researchers has been awarded the prestigious 2026 Gordon Bell Prize, considered the Nobel Prize of high-performance computing. The achievement highlights China's accelerated progress in developing world-class supercomputing infrastructure and algorithms. The accomplishment reinforces the country's leadership in complex scientific simulations and massive data processing for cutting-edge research.","link":"https://www.cas.cn/cm/202611/t20261121_5124746.shtml","categoria":"SUPERCOMPUTING","lang":"en"},{"fonte":"The Week","pais":"India","titulo":"Dr. Nikhil Tandon Advocates for More Nuanced Medical Care Delivery Using AI and Digital Technology","resumo":"Dr. Nikhil Tandon highlighted the importance of transforming the healthcare system by integrating artificial intelligence and advanced digital solutions. According to the expert, the adoption of modern technologies allows for more personalized and precise medical care tailored to patients' needs. This approach aims to optimize preventive diagnostics and significantly improve clinical outcomes in the country. The initiative reinforces the growing trend of technological innovation applied to modern medicine.","link":"https://www.theweek.in/theweek/cover/2026/11/21/need-more-nuanced-care-delivery-harnessing-ai-digital-technology-dr-nikhil-tandon.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"SIC Notícias","pais":"Portugal","titulo":"Pope Warns of 'Enormous Risks' If Technology Is Not Governed by Ethics","resumo":"Pope Francis reinforced the urgent need to establish ethical guidelines for the development of artificial intelligence and new technologies. The pontiff warned that technological advancement without moral limits could deepen global inequalities and compromise human dignity. The statement encourages world leaders to promote regulations that place social well-being at the center of innovations. This reflection seeks to ensure that scientific progress serves as a tool for inclusion and peace.","link":"https://sicnoticias.pt/especiais/papa-leao-xiv/2026-11-21-papa-alerta-para-riscos-enormes-se-tecnologia-nao-for-regida-pela-etica-5cf1bdf1?utm_source=sicnot\u0026utm_medium=content\u0026utm_campaign=WEB\u0026utm_content=/especiais/papa-leao-xiv/2026-11-21-papa-alerta-para-riscos-enormes-se-tecnologia-nao-for-regida-pela-etica-5cf1bdf1","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Aventuras na História","pais":"Brazil","titulo":"New Technology Allows Transforming Lunar Dust into LEGO-Style Blocks","resumo":"Scientists have developed an innovative approach capable of melting lunar regolith to manufacture structures similar to interlocking toy pieces. This technique aims to facilitate the construction of space bases and shelters directly on the Moon without the need to transport heavy materials from Earth. Tests in simulated environments demonstrated high mechanical strength and manufacturing efficiency. The breakthrough represents a decisive step toward the sustainability of future long-duration space missions.","link":"https://aventurasnahistoria.com.br/noticias/historia-hoje/nova-tecnologia-permite-transformar-poeira-lunar-em-blocos-de-lego.phtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"NASA (.gov)","pais":"United States","titulo":"Dragon Capsule Returns to Earth Packed with Scientific Experiments and Cargo","resumo":"The Dragon spacecraft successfully completed its resupply mission and returned from the International Space Station. Aboard, the capsule brought back valuable scientific research materials conducted in microgravity by astronauts. The retrieved experiments cover diverse areas such as biology, materials science, and space medicine. The successful return ensures scientists receive crucial data for the advancement of cosmic exploration.","link":"https://www.nasa.gov/blogs/spacestation/2026/11/21/dragon-returns-to-earth-packed-with-science-and-cargo/","categoria":"AEROSPACE","lang":"en"},{"fonte":"Les Echos","pais":"France","titulo":"How the Bursting of the AI Bubble Could Derail the Global Economy","resumo":"Financial experts and analysts are warning of the growing risks of overvaluation in artificial intelligence investments. The excessive surge in tech company stock prices raises fears of an abrupt correction in the global market. Should the bubble burst, the impacts could rapidly spread across various interconnected economic sectors. The uncertainty calls for greater caution from investors and regulators amid technological enthusiasm.","link":"https://www.lesechos.fr/monde/enjeux-internationaux/comment-leclatement-de-la-bulle-ia-pourrait-faire-derailler-leconomie-mondiale-2263903","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Pplware","pais":"England","titulo":"Making Medicines in Space: Europe Wants a Factory That Goes to Space and Back","resumo":"Europe is investing in the development of reusable orbital factories focused on producing medications in microgravity. The absence of gravity allows for the crystallization of proteins and pharmaceutical compounds with a purity and structure impossible to obtain on Earth. This initiative aims to create more effective treatments for complex diseases and strengthen European technological autonomy. The project marks an important step toward the commercialization of space and innovation in the global pharmaceutical industry.","link":"https://pplware.sapo.pt/ciencia/fabrica-espacial-rev1-medicamentos/","categoria":"SCIENCE","lang":"en"},{"fonte":"MUNDIARIO","pais":"Spain","titulo":"Lamborghini Pushes Its Legend to the Limit: The Revuelto SV Defies the Electric Era","resumo":"Lamborghini has unveiled the Revuelto SV, pushing its iconic supercar to a new level of extreme performance. The model defies purely electric trends by integrating a V12 engine with high-performance hybrid systems. This strategy reinforces the brand's commitment to preserving traditional mechanical emotion. The new release signals a crucial moment in the luxury industry's technological transition.","link":"https://www.mundiario.com/motor/lamborghini-lleva-leyenda-limite-revuelto-sv-desafia-era-electrica/20261122031445454271.html","categoria":"INNOVATION","lang":"en"},{"fonte":"Mindener Tageblatt","pais":"Germany","titulo":"Mercury Probe 'BepiColombo' Enters Target Planet's Orbit","resumo":"The joint European-Japanese space mission BepiColombo has reached a historic milestone by entering orbit around its destination planet, Mercury. The probe will utilize its advanced scientific instruments to map the surface and analyze the planet's composition and magnetic field. The data collected by the mission will advance our understanding of the formation and evolution of the solar system.","link":"https://www.mt.de/weltnews/wissenschaft/Merkur-Sonde-BepiColombo-umkreist-Zielplaneten-24468274.html","categoria":"SCIENCE","lang":"en"},{"fonte":"朝日新聞","pais":"Japan","titulo":"Shuri Castle Restoration: Japanese Master Craftsmanship Backed by Science","resumo":"The reconstruction of Shuri Castle exemplifies the union of traditional Japanese carpentry and modern science. Researchers and artisans are using advanced scientific data to accurately replicate the historical structures destroyed by fire. This integration ensures greater technical resilience and authenticity in the cultural restoration process. The project stands out as a milestone in the use of technology applied to historical heritage preservation.","link":"https://www.asahi.com/articles/ASVCJ2TF2VCJBNEH003M.html","categoria":"SCIENCE \u0026 TECHNOLOGY","lang":"en"},{"fonte":"Sohu","pais":"China","titulo":"China's Space Station Advances with New Movements and On-Orbit Scientific Tests","resumo":"The Chinese Space Station has recorded significant updates with the orderly progress of various scientific and technological experiments in microgravity. Ongoing missions cover research in space biology, materials science, and fundamental physics. The results achieved consolidate the Chinese space program's position as a center for continuous innovation and sustainable scientific exploration.","link":"https://m.sohu.com/a/1104808206_163278?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"t2ONLINE","pais":"India","titulo":"Krish Ashok: Masala Lab Is a Fun Scientific Guide to Indian Culinary Myths","resumo":"The book Masala Lab, written by Krish Ashok, explores the science behind traditional Indian cooking in an accessible and humorous way. The work demystifies popular beliefs about food, explaining the chemical and physical processes that occur during meal preparation. The author uses an evidence-based approach to transform how people understand everyday cooking. It is an engaging read that unites scientific knowledge, culture, and gastronomy.","link":"https://t2online.in/goodlife/books/krish-ashok--masala-lab-is-a-fun-science-guide-to-indian-food-myths/2009392","categoria":"SCIENCE","lang":"en"},{"fonte":"CNN Portugal","pais":"Portugal","titulo":"Origami-Inspired Wheels Could Help Explore the Moon's Lava Tubes","resumo":"Researchers have developed innovative wheels with a foldable structure inspired by the art of origami for space exploration vehicles. The technology allows rovers to adjust their diameter to navigate rough terrain and subsurface lava tubes on the lunar surface. This mechanical flexibility significantly reduces the risk of the vehicle getting stuck during highly complex missions. The innovation represents a promising advance for the expansion of robotic exploration on the Moon and other celestial bodies.","link":"https://cnnportugal.iol.pt/rodas/exploracao/estas-rodas-inspiradas-no-origami-podem-ajudar-a-explorar-os-tuneis-de-lava-da-lua/20261121/6ae8bd4dd34e5a653d7327f0","categoria":"SCIENCE","lang":"en"},{"fonte":"Estadão","pais":"Brazil","titulo":"Anduril Founder Claims iPhone Popularized Easy Technology and Reduced Space for Specialists","resumo":"The founder of the technology company Anduril stated that the extreme simplicity brought by the iPhone has altered society's relationship with complex technical tools. According to the analysis, the relentless pursuit of intuitive interfaces has ended up diminishing the appreciation of highly specialized professionals in creating deep software. This criticism has sparked heated debates among developers and technology industry leaders regarding the balance between usability and technical depth. The scenario raises reflections on the future of technical education and heavy innovation.","link":"https://www.estadao.com.br/em-alta/tecmundo/big-techs/palmer-luckey-diz-que-iphone-popularizou-tecnologia-facil-e-reduziu-espaco-para-especialistas/","categoria":"TRENDS","lang":"en"},{"fonte":"The New York Times","pais":"United States","titulo":"Tech Outages Are Just the Beginning, and AI Will Bring More Disruptions","resumo":"Experts warn that massive failures in digital systems are likely to intensify with the expansion of artificial intelligence. The growing complexity of IT infrastructure combined with AI automation creates new points of critical vulnerability. The accelerated integration of these technologies demands an urgent reevaluation of security and operational resilience. The impact of these disruptions could affect everything from financial services to essential communication networks.","link":"https://www.nytimes.com/2026/11/21/us/politics/tech-outages-ai-disruptions.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"RFI","pais":"France","titulo":"EU Countries Criticize Budget Proposal That Includes Tax on Tech Giants","resumo":"Several European Union member states have expressed strong opposition to the economic bloc's new budget proposal. The plan includes the creation of a tax specifically targeted at large global technology companies. Critics argue that the measure could harm digital competitiveness and generate international trade retaliation. The debate highlights internal divisions over how to finance the community budget without slowing down innovation.","link":"https://www.rfi.fr/br/europa/20261121-pa%C3%ADses-da-ue-criticam-proposta-de-or%C3%A7amento-do-bloco-que-prev%C3%AA-taxa-sobre-gigantes-da-tecnologia","categoria":"BUSINESS","lang":"en"},{"fonte":"The Guardian","pais":"United Kingdom","titulo":"Two Groups Verify Mathematician's Claim That Claude Helped Prove Math Problem","resumo":"Two independent groups of researchers have confirmed that the artificial intelligence model Claude assisted in solving a complex mathematical problem. The achievement demonstrates the growing potential of AI tools to act as collaborators in high-level scientific discoveries. Mathematicians point out that the algorithm's assistance accelerated crucial stages of reasoning and theoretical validation. This milestone reshapes the role of language models in scientific and academic research.","link":"https://www.theguardian.com/technology/2026/nov/21/anthropic-riemann-hypothesis-solved-claude-ai","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Las Provincias","pais":"Spain","titulo":"Netflix Confirms Return of Sci-Fi Series by 'Game of Thrones' Creators That Succeeded in 44 Countries","resumo":"Netflix has officially announced the renewal of the sci-fi series developed by the same creators of Game of Thrones. The production reached the top of viewership in 44 countries with its complex narrative about extraterrestrial contact and theoretical physics. The return promises to expand the technological and philosophical universe addressed in the first season. The confirmation consolidates the project as one of streaming's largest investments.","link":"https://www.lasprovincias.es/culturas/tv/netflix-confirma-regreso-serie-ciencia-ficcion-creadores-20261117002605-nt.html","categoria":"ENTERTAINMENT","lang":"en"},{"fonte":"北京新闻","pais":"China","titulo":"From Industry to Sports: Brain-Computer Interfaces Accelerate Commercial Expansion","resumo":"Brain-computer interface technology is rapidly expanding its applications from the industrial sector directly into sports and wellness. This transition reflects the maturation of neural reading algorithms and high-precision non-invasive devices. The movement promises to transform human-machine interaction, optimizing athletic performance and creating new motor rehabilitation solutions.","link":"https://www.bj.chinanews.com.cn/news/2026/1122/104071.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"DD News","pais":"India","titulo":"CII Proposes 15 Financial Sector Reforms to Support India's $26.5 Trillion Economy Goal by 2047","resumo":"The Confederation of Indian Industry has presented a set of fifteen strategic reforms to boost the country's financial market. The plan aims to build the necessary foundations to sustain the ambitious goal of reaching a $26.5 trillion economy by the year 2047. The recommendations address strengthening the capital market, expanding credit, and modernizing regulatory frameworks. The proposal is seen as a crucial step to accelerate long-term economic growth.","link":"https://ddnews.gov.in/en/cii-proposes-15-financial-sector-reforms-to-support-indias-26-5-trillion-economy-goal-by-2047/","categoria":"ECONOMY","lang":"en"},{"fonte":"Diário de Leiria","pais":"Portugal","titulo":"Potential of Algae Brings Together Science, Businesses, and Coastal Communities","resumo":"A multidisciplinary meeting brought together scientists, private sector representatives, and local communities to discuss the sustainable use of algae. The event highlighted the applications of marine biomass in the food, cosmetic, pharmaceutical, and bioenergy sectors. Beyond the economic impact, the initiative reinforced the importance of conserving marine ecosystems and developing the blue economy. The collaboration aims to accelerate innovation projects aligned with environmental sustainability.","link":"https://www.diarioleiria.pt/2026/11/21/potencial-das-algas-reuniu-ciencia-empresas-e-comunidades-costeiras/","categoria":"INNOVATION","lang":"en"},{"fonte":"Estadão","pais":"Brazil","titulo":"Do Statins Cause Dementia? What Science Discovered About the Internet Rumor","resumo":"Rumors circulating on social media erroneously claim that the prolonged use of statins is associated with the development of dementia. Rigorous scientific studies debunk this association and show that the medication prevents severe cardiovascular events without compromising cognitive health. Researchers emphasize the importance of combating medical misinformation that leads patients to discontinue essential treatments. Expert guidance reinforces the proven safety of statins in global clinical trials.","link":"https://www.estadao.com.br/pulsa/gustavo-meirelles/estatinas-causam-demencia-o-que-a-ciencia-descobriu-sobre-esse-papo-que-circula-na-internet/","categoria":"SCIENCE","lang":"en"},{"fonte":"Diario Público","pais":"United States","titulo":"Nvidia Becomes Focal Point of Conflict in White House Policy on China","resumo":"Semiconductor giant Nvidia is at the center of geopolitical tensions between the United States and the Chinese government. Severe export restrictions imposed by Washington aim to curb Beijing's technological and military advancement in artificial intelligence. The company seeks to balance compliance with American regulations while attempting to maintain access to the valuable Asian market. Decisions made in this scenario are expected to shape the future of the global chip supply chain.","link":"https://www.publico.es/internacional/nvidia-punto-choque-politica-casa-blanca-sobre-china.html","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"IndexBox","pais":"France","titulo":"Food Technology Market: 2035 Forecasts Highlight Clean Label and Preservation","resumo":"Recent reports indicate that the FoodTech sector will experience major expansion driven by new consumer demands. The pursuit of clean-label products and innovative preservation technologies is leading market investments. This movement aims to align sustainability, food safety, and extended shelf life for processed foods. The expectation through 2035 is a profound transformation in the global production and distribution chain.","link":"https://www.indexbox.io/fr/blog/food-technology-market-to-accelerate-through-2035-driven-by-clean-label-reformulation-and-shelf-life-innovation/","categoria":"INNOVATION","lang":"en"},{"fonte":"The Guardian","pais":"United Kingdom","titulo":"International UN Talks on Autonomous Weapons Control Collapse","resumo":"Diplomatic talks at the United Nations to regulate the use of lethal autonomous weapons have ended without a global agreement. The lack of consensus among major military powers prevented the establishment of clear ethical and legal boundaries for these technologies. Critics warn that the collapse of these debates accelerates an arms race based on artificial intelligence without human supervision. The stalemate casts uncertainty over international security and the future of humanitarian law in modern combat.","link":"https://www.theguardian.com/technology/2026/nov/21/international-talks-control-ai-autonomous-weapons-collapse","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"El Diario Vasco","pais":"Spain","titulo":"Carlos Sabín, Physicist: 'Time Travel Is Impossible, It Is Science Fiction'","resumo":"Spanish physicist Carlos Sabín analyzed the limitations of modern physics regarding the theoretical viability of time travel. He explained that current equations refute the possibility of moving backward or forward in time as portrayed by pop culture. The expert emphasized the importance of separating established scientific theories from mere speculative fiction. This statement reignites the debate on the real limits of contemporary science.","link":"https://www.diariovasco.com/sociedad/ciencia/carlos-sabin-fisico-viajar-tiempo-imposible-cienciaficcion-20261122000053-nt.html","categoria":"SCIENCE","lang":"en"},{"fonte":"21财经","pais":"China","titulo":"New Technology Enables Nuclear Waste Reuse and Electricity Generation from Residues","resumo":"Chinese researchers have developed innovative methods to reuse spent nuclear fuel, transforming radioactive waste into a new source of electricity generation. The technique maximizes the efficiency of uranium utilization and significantly reduces the volume of accumulated atomic waste. This breakthrough represents a crucial milestone for the sustainability of nuclear energy and the low-carbon energy transition.","link":"https://www.21jingji.com/article/20261122/herald/512e1c285ab066fad74b9eaf15c691bc.html","categoria":"CLEAN ENERGY","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"University of Minho Ranks 106th Globally in Interdisciplinary Science","resumo":"The University of Minho has reached 106th place in the global ranking evaluating excellence in interdisciplinary scientific research. This international recognition highlights the institution's commitment to integrating different areas of knowledge to solve complex problems. This result solidifies the university as a benchmark in Portugal's higher education and innovation ecosystem. The achievement reflects continuous investments in collaborative projects and the attraction of scientific talent.","link":"https://sapo.pt/artigo/universidade-do-minho-e-a-106-do-mundo-em-ciencia-interdisciplinar-6b019e49f92df7383641f472","categoria":"EDUCATION","lang":"en"},{"fonte":"diariodigital.com.br","pais":"Brazil","titulo":"Computer Reuse by the Brazilian Government Generates Significant Water Savings","resumo":"An initiative by the Brazilian government focused on restoring and repurposing outdated IT equipment has revealed an important positive environmental impact. In addition to extending the lifespan of thousands of public computers, the project avoided the indirect consumption of large volumes of water required in the manufacturing of new devices. The measure promotes digital inclusion in vulnerable communities through the donation of refurbished equipment. This action cements sustainability as a strategic pillar in public technology management.","link":"https://www.diariodigital.com.br/economia/reuso-de-computadores-pelo-governo-brasileiro-gera-economia-de-agua","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"Exame","pais":"United States","titulo":"Nasdaq Records Worst Week Since 2020 as Not Even Anthropic IPO Supports Tech Sector","resumo":"The Nasdaq index recorded its weakest weekly performance in years, reflecting strong investor distrust in the technology sector. Even major events and expectations surrounding the AI company Anthropic were not enough to stem the sell-off wave. Concerns over high valuations and macroeconomic uncertainties weighed heavily on tech giants. The scenario signals a period of correction and greater caution in the global financial market.","link":"https://exame.com/invest/mercados/nasdaq-tem-pior-semana-desde-2020-e-nem-ipo-da-anthropic-segurou-o-setor-de-tecnologia/","categoria":"MARKET","lang":"en"},{"fonte":"Le Monde.fr","pais":"France","titulo":"Europe Weakens Regulations While Science Warns About Chemical Substances","resumo":"Scientific research increasingly demonstrates the clear link between exposure to chemical substances and the rise of modern diseases. Despite these warnings, regulatory bodies in Europe face criticism for loosening environmental protection and public health standards. Experts point out that prioritizing economic interests over scientific rigor puts the population at risk. The scenario reinforces the need for an urgent debate on governance and sustainability.","link":"https://www.lemonde.fr/idees/article/2026/11/22/alors-que-la-science-montre-de-mieux-en-mieux-le-role-des-substances-chimiques-dans-l-epidemie-de-maladies-de-civilisation-l-europe-affaiblit-sa-reglementation_6814145_3232.html","categoria":"SCIENCE","lang":"en"},{"fonte":"El Diario Vasco","pais":"Spain","titulo":"'Technology Helps, But It Remains Essential for the Doctor to Listen to the Patient'","resumo":"Experts emphasize that although technological tools and AI have revolutionized modern medicine, clinical empathy remains irreplaceable. Accurate diagnosis still fundamentally depends on the physician's attentive listening to patient accounts. The balanced integration of innovation and humanized care is pointed out as the great challenge in healthcare. The debate reinforces the need to keep the human factor at the center of medical practice.","link":"https://www.diariovasco.com/culturas/tecnologia-ayuda-sigue-clave-medico-escuche-paciente-20261122200957-nt.html","categoria":"HEALTH AND TECHNOLOGY","lang":"en"},{"fonte":"Finanças, Câmbio e Investimentos","pais":"China","titulo":"China AI Stocks Lose $1.7 Trillion Following Massive Tech Sector Sell-Off","resumo":"China's technology market faced a massive liquidation that wiped out about $1.7 trillion in market value from artificial intelligence companies. The movement reflects investor uncertainties regarding the monetization of language models and international trade restrictions. Despite the drop, analysts point out that the sector's consolidation may redefine companies' focus on more viable AI applications.","link":"https://br.investing.com/news/stock-market-news/acoes-de-ia-da-china-perdem-us-17-trilhao-com-venda-em-massa-no-setor-de-tecnologia-2134863","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Program '90 Seconds of Science' Marks 10th Anniversary","resumo":"The acclaimed radio project '90 Seconds of Science' celebrates a decade dedicated to popularizing research developed in Portugal. The initiative gives voice to scientists who explain their studies in a simple and accessible way to the general public in just a minute and a half. Throughout this journey, the program has brought society closer to national academic production and encouraged popular interest in science. The celebration reaffirms the fundamental role of scientific communication in everyday life.","link":"https://jornaleconomico.sapo.pt/noticias/programa-90-segundos-de-ciencia-faz-10-anos/","categoria":"COMMUNICATION","lang":"en"},{"fonte":"Gazeta de São Paulo","pais":"Brazil","titulo":"Geely EX5 EM-i Travels Across Multiple Countries to Test New Automotive Technology Efficiency","resumo":"Originally presented at the São Paulo Auto Show, the Geely EX5 EM-i hybrid vehicle has embarked on a global expedition across multiple continents. The goal of the long-distance tests is to put the energy efficiency and durability of its new powertrain system to the test under extreme weather conditions. The brand seeks to validate cutting-edge technologies before initiating large-scale commercial distribution in the Latin American market. The project reflects the accelerated advancement of electrified and intelligent mobility in the automotive industry.","link":"https://www.gazetasp.com.br/automotor/tecnologia-posta-a-prova-apresentado-no-salao-de-sao-paulo-geely-ex5-em-i-esta-percorrendo-varios-paises-para-testar-sua-eficiencia/","categoria":"INNOVATION","lang":"en"},{"fonte":"CASRAI","pais":"United States","titulo":"US and Germany Hold Joint Meeting on Scientific Cooperation and Research Security","resumo":"Representatives from the United States and Germany met to strengthen strategic partnerships in scientific research and innovation. The meeting focused on aligning guidelines to protect sensitive data and intellectual property against external threats. Both nations sought to balance the promotion of open science with the need for security in critical technology areas. This cooperation reinforces the Western alliance in the race for secure scientific advancement.","link":"https://casrai.org/news/us-germany-sixth-joint-committee-meeting-science-technology-research-security-2026","categoria":"SCIENCE","lang":"en"},{"fonte":"Science et vie","pais":"France","titulo":"In 1970, Company Paved 183-Meter Street with High-Durability Crushed Glass","resumo":"An engineering experiment conducted in the 1970s used recycled, crushed glass to pave a 183-meter urban road. Two years after application, the surface remained in excellent condition and resisted traffic. This pioneering initiative anticipated current discussions on waste reuse in civil infrastructure. The historical case resurfaces today as inspiration for sustainable solutions in urban construction.","link":"https://www.science-et-vie.com/nature-et-environnement/en-1970-une-entreprise-a-pave-une-rue-de-183-metres-avec-du-verre-concasse-2-ans-plus-tard-elle-etait-toujours-jugee-en-bon-etat-264988.html","categoria":"ENGINEERING","lang":"en"},{"fonte":"MUNDIARIO","pais":"Spain","titulo":"Bank of Spain Warns of AI Risks and Rising Housing Prices","resumo":"The Bank of Spain has warned of growing risks associated with the accelerated adoption of artificial intelligence in the financial sector. The report also highlights the economic pressure caused by continuously rising real estate prices in the country. The agency emphasizes the need for strict regulation to prevent instability in automated markets. The analysis raises a red flag regarding the socioeconomic impacts of unchecked automation.","link":"https://www.mundiario.com/economia/ia-amenaza-mercados-mientras-vivienda-dispara/20261121233036454235.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"汽车之家","pais":"China","titulo":"Extreme condition test reflects high energy efficiency in new electric vehicles","resumo":"In practical tests at zero degrees Celsius and high speed, a new electric vehicle model achieved a battery efficiency rate of 86.75%. The impressive performance was driven by the use of thermal management technologies similar to those employed by Tesla. The result demonstrates the technical advancement of Chinese automakers in overcoming range bottlenecks in intense cold.","link":"https://chejiahao.autohome.com.cn/info/26936413","categoria":"AUTOMOTIVE INNOVATION","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"ULS Arco Ribeirinho reinforces health centers with 1.6 million euros in technology","resumo":"The Arco Ribeirinho Local Health Unit has announced a significant investment directed toward the technological modernization of its health centers. The funds will be used to acquire advanced medical equipment and update clinical information systems. The measure aims to optimize patient care, reduce wait times, and improve working conditions for healthcare professionals. The project reinforces the digital transition in the regional public health system.","link":"https://sapo.pt/artigo/uls-arco-ribeirinho-reforca-centros-de-saude-com-1-6-milhoes-de-euros-em-tecnologia-6b022a962feb67ff6b482f58","categoria":"HEALTH","lang":"en"},{"fonte":"IndexBox","pais":"Brazil","titulo":"Food technology market projects growth through 2035 driven by clean label demand","resumo":"Global projections indicate that the FoodTech sector will undergo a major transformation by 2035 driven by the pursuit of clean labels and natural ingredients. Technological innovation focuses on extending food shelf life without the addition of synthetic preservatives or harsh chemicals. Active packaging technologies and advanced preservation methods are at the center of this food industry revolution. The trend responds to the growing consumer demand for healthier and more sustainable products.","link":"https://www.indexbox.io/pt-br/blog/food-technology-market-to-accelerate-through-2035-driven-by-clean-label-reformulation-and-shelf-life-innovation/","categoria":"TRENDS","lang":"en"},{"fonte":"The Peninsula Qatar","pais":"United States","titulo":"Qatar positions itself to become regional hub for quantum technology investment","resumo":"Qatar is implementing ambitious strategies to attract capital and talent aimed at quantum computing development. The country seeks to diversify its economy by heavily investing in cutting-edge technological infrastructure and international partnerships. The initiative intends to transform the region into a benchmark hub for quantum innovations in the Middle East. The move reflects the global race for dominance in highly complex emerging technologies.","link":"https://thepeninsulaqatar.com/article/22/11/2026/qatar-positions-itself-to-become-regional-hub-for-quantum-technology-investment","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"RFI","pais":"France","titulo":"\"The Call of the Depths\": An immersion between science and imagination at the National Maritime Museum","resumo":"The National Maritime Museum presents a striking exhibition that unites scientific discoveries and cultural narratives about the ocean. The showcase invites visitors to explore the mysteries of the deep sea through historical collections and interactive technologies. The project highlights the importance of marine preservation and the fascinating evolution of ocean exploration. The initiative reinforces the vital connection between scientific knowledge, art, and environmental awareness.","link":"https://www.rfi.fr/fr/podcasts/l-art-de-raconter-le-monde/20261122-l-appel-des-profondeurs-plong%C3%A9e-entre-science-et-imaginaire-au-mus%C3%A9e-national-de-la-marine?PcNCvtcnHj","categoria":"SCIENCE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
