  <style>
    :root {

      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;

  // Injeta os dados originais no frontend
  const data = [{"fonte":"BBC","pais":"Brasil","titulo":"'Passei a acreditar que meus parentes eram assassinos': como conversas com IA levaram pessoas ao delírio","resumo":"A crescente interação humana com modelos de inteligência artificial tem levantado sérios alertas sobre os impactos psicológicos dessas tecnologias.\nCasos recentes mostram que conversas prolongadas e sem supervisão com chatbots de IA podem induzir estados alterados de realidade e episódios severos de delírio em usuários vulneráveis.\nEspecialistas e psicólogos enfatizam a necessidade urgente de regulamentação e implementação de travas de segurança em plataformas de linguagem natural para prevenir riscos à saúde mental.","link":"https://www.bbc.com/portuguese/articles/c980pd6lp96o.amp","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Amazon quer lançar mais de 5 mil satélites para levar sinal de internet direto a celulares","resumo":"A Amazon está expandindo os limites da conectividade global com um projeto ousado de implantação de mais de cinco mil satélites de órbita baixa.\nA iniciativa visa fornecer sinal de internet banda larga de alta velocidade transmitido diretamente para smartphones sem a necessidade de antenas intermediárias.\nEssa evolução tecnológica promete revolucionar o acesso à rede em áreas rurais e remotas, aumentando expressivamente a concorrência no setor de telecomunicações espaciais.","link":"https://g1.globo.com/tecnologia/noticia/2026/07/27/amazon-quer-lancar-mais-de-5-mil-satelites-para-levar-sinal-de-internet-direto-a-celulares.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Olhar Digital","pais":"Brasil","titulo":"\"Vai virar um Pix\": executivo revela os bastidores da tecnologia da palma da mão","resumo":"O setor de meios de pagamento avança para a popularização do reconhecimento biométrico vascular, permitindo transações financeiras apenas com a aproximação da palma da mão.\nExecutivos da área projetam que a modalidade ganhe escala massiva nos próximos anos no Brasil, equiparando sua facilidade e adesão ao sucesso do Pix.\nA tecnologia combina conveniência e camadas reforçadas de segurança criptográfica para transformar radicalmente as compras presenciais do dia a dia.","link":"https://olhardigital.com.br/2026/07/27/reviews/vai-virar-um-pix-executivo-revela-os-bastidores-da-tecnologia-da-palma-da-mao/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Times Brasil | CNBC","pais":"Brasil","titulo":"Nike anuncia chinelo inteligente com calor, vibração e tecnologia Air Zoom para recuperação muscular","resumo":"A gigante de artigos esportivos apresentou um novo calçado terapêutico de alta tecnologia desenvolvido especialmente para otimizar a recuperação de atletas e praticantes de atividades físicas.\nO chinelo inteligente integra zonas de aquecimento programável, sistemas de vibração localizada e o consagrado amortecimento Air Zoom para estimular a circulação sanguínea.\nA novidade representa um passo significativo na fusão entre vestuário esportivo e biotecnologia voltada ao bem-estar e performance humana.","link":"https://timesbrasil.com.br/empresas-e-negocios/nike-anuncia-chinelo-inteligente-com-calor-vibracao-e-tecnologia-air-zoom-para-recuperacao-muscular/","categoria":"DISPOSITIVOS","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Vídeo com IA de Bolsonaro se torna primeiro teste relevante das regras do TSE sobre uso da tecnologia","resumo":"A circulação de um vídeo gerado por inteligência artificial envolvendo o ex-presidente Jair Bolsonaro marcou o primeiro grande teste prático das novas diretrizes estabelecidas pelo Tribunal Superior Eleitoral.\nA regulamentação exige sinalização clara e transparente sobre qualquer conteúdo manipulado digitalmente para evitar desinformação no cenário político nacional.\nO episódio estabelece um precedente jurídico crucial sobre os limites e a fiscalização do uso de deepfakes durante o processo eleitoral brasileiro.","link":"https://oglobo.globo.com/politica/noticia/2026/07/28/video-com-ia-de-bolsonaro-se-torna-primeiro-teste-relevante-das-regras-do-tse-sobre-uso-da-tecnologia.ghtml","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Globo","pais":"Brasil","titulo":"Robô monitora mergulhadores em tempo real a partir das bolhas que eles produzem","resumo":"Engenheiros desenvolveram um sistema robótico autônomo capaz de rastrear e acompanhar mergulhadores no oceano em tempo real, analisando o padrão de bolhas expelidas pelo equipamento de respiração.\nA inovação tecnológica elimina a necessidade de cabos de comunicação ou transmissores acústicos pesados acoplados aos profissionais no mar.\nEssa abordagem aumenta significativamente a segurança de missões subaquáticas de exploração e manutenção, oferecendo suporte contínuo sem interferir na mobilidade humana.","link":"https://revistagalileu.globo.com/tecnologia/noticia/2026/07/robo-monitora-mergulhadores-em-tempo-real-a-partir-das-bolhas-que-eles-produzem.ghtml","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Na geopolítica da IA, faz sentido o Brasil aderir à cooperação proposta pela China? Especialistas respondem","resumo":"Especialistas em tecnologia e diplomacia debatem os impactos e oportunidades da aproximação do Brasil à proposta de cooperação internacional em inteligência artificial liderada pela China.\nA iniciativa traz dilemas estratégicos sobre soberania de dados, transferência de tecnologia avançada e o alinhamento em blocos internacionais de inovação.\nA decisão brasileira é vista como fundamental para definir o posicionamento do país na corrida global de infraestrutura e governança digital.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/07/28/na-geopolitica-da-ia-faz-sentido-o-brasil-aderir-a-cooperacao-proposta-pela-china-especialistas-respondem.ghtml","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Segundo a ciência, a velocidade com que uma pessoa caminha revela muito sobre o funcionamento interno do corpo e da mente","resumo":"Estudos científicos recentes demonstram que a cadência e a velocidade da marcha humana servem como indicadores biológicos valiosos do estado geral de saúde física e neurológica.\nA desaceleração no ritmo habitual de caminhada pode antecipar sinais de declínio cognitivo, envelhecimento precoce ou fragilidades no sistema cardiovascular antes do surgimento de sintomas clínicos evidentes.\nA descoberta reforça o uso da avaliação da marcha como uma ferramenta simples, não invasiva e preventiva para a medicina moderna.","link":"https://oglobo.globo.com/saude/noticia/2026/07/28/segundo-a-ciencia-a-velocidade-com-que-uma-pessoa-caminha-revela-muito-sobre-o-funcionamento-interno-do-corpo-e-da-mente.ghtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Al Jazeera","pais":"Estados Unidos","titulo":"Sam Altman afirma que a IA entrou na 'singularidade': Devemos nos preocupar?","resumo":"O CEO da OpenAI, Sam Altman, causou grande repercussão ao declarar que a inteligência artificial atingiu um ponto de inflexão comparável à singularidade.\nA afirmação levanta intensos debates entre especialistas, acadêmicos e líderes do setor sobre os limites do avanço tecnológico.\nDiscussões envolvem os impactos éticos, sociais e de segurança com a rápida evolução desses modelos autônomos.\nEspecialistas pedem cautela e regulamentação para garantir um desenvolvimento alinhado aos interesses humanos.","link":"https://www.aljazeera.com/news/2026/7/27/sam-altman-says-ai-has-entered-singularity-should-we-be-worried","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Al Jazeera","pais":"Estados Unidos","titulo":"Nvidia planeja impulso de US$ 250 bilhões para apoiar ambições de infraestrutura da OpenAI","resumo":"A Nvidia anunciou um plano massivo de investimento para expandir a capacidade de infraestrutura voltada ao treinamento de IA.\nA parceria visa sustentar os ambiciosos projetos de próxima geração da OpenAI e suprir a crescente demanda computacional global.\nEsse movimento consolida o domínio da Nvidia no fornecimento de hardware essencial para supercomputação.\nA iniciativa pode acelerar drasticamente o surgimento de novos modelos de inteligência artificial ainda mais potentes.","link":"https://www.aljazeera.com/economy/2026/7/27/nvidia-plans-250bn-push-to-bolster-openais-infrastructure-ambitions","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Technology Networks","pais":"Estados Unidos","titulo":"IA melhora a detecção de mutações de câncer","resumo":"Pesquisadores desenvolveram uma nova ferramenta baseada em inteligência artificial capaz de identificar mutações genéticas de câncer com altíssima precisão.\nA tecnologia analisa sequenciamentos complexos em tempo recorde, superando diagnósticos tradicionais.\nEssa inovação permite tratamentos mais personalizados e direcionados ao perfil de cada paciente.\nO avanço promete transformar a oncologia e acelerar descobertas na medicina de precisão.","link":"https://www.technologynetworks.com/tn/news/ai-improves-cancer-mutation-detection-415031","categoria":"TECNOLOGIA MÉDICA","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"Hubble da NASA mostra redução na formação de estrelas na Galáxia de Andrômeda","resumo":"Novas observações do Telescópio Espacial Hubble revelaram que a formação estelar em Andrômeda está diminuindo significativamente.\nOs dados detalhados oferecem novas pistas sobre os ciclos de vida das galáxias espirais no universo próximo.\nCientistas analisam os fatores que levaram ao desaceleramento do nascimento de novas estrelas em nossa vizinha galáctica.\nAs descobertas ajudam a prever o futuro da própria Via Láctea em escalas de tempo cosmológicas.","link":"https://science.nasa.gov/missions/hubble/nasas-hubble-shows-star-formation-in-andromeda-galaxy-winding-down/","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"MIT News","pais":"Estados Unidos","titulo":"Engenheiros do MIT projetam fio elástico reciclável","resumo":"Engenheiros do MIT desenvolveram um novo tipo de fio elástico totalmente reciclável, visando combater o lixo têxtil global.\nO material mantém a flexibilidade de tecidos sintéticos tradicionais, mas pode ser quimicamente decomposto sem perder qualidade.\nA inovação representa um grande avanço para a indústria da moda sustentável e para a produção de vestuário ecológico.\nA expectativa é que a tecnologia reduza a dependência de elastanos derivados de petróleo no futuro.","link":"https://news.mit.edu/2026/mit-engineers-design-recyclable-elastic-yarn-0727","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"MeriTalk","pais":"Estados Unidos","titulo":"NIST lança programa de avaliação de tecnologia de IA","resumo":"O Instituto Nacional de Padrões e Tecnologia dos EUA lançou um programa oficial para testar e avaliar ferramentas de inteligência artificial.\nA iniciativa busca estabelecer métricas claras de segurança, confiabilidade e precisão para sistemas de IA no mercado.\nCom essa medida, o governo americano pretende criar um ecossistema mais seguro para a adoção empresarial dessas tecnologias.\nO programa ajudará a padronizar auditorias técnicas e garantir a conformidade dos modelos emergentes.","link":"https://www.meritalk.com/articles/nist-launches-ai-technology-evaluation-program/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Texas A\u0026M Stories","pais":"Estados Unidos","titulo":"Texas A\u0026M junta-se à Missão Genesis para transformar a ciência com IA","resumo":"A Universidade Texas A\u0026M integrou a Missão Genesis, uma iniciativa focada em revolucionar descobertas científicas por meio da IA.\nO projeto aplica algoritmos avançados para acelerar pesquisas em física, química, biologia e engenharia de materiais.\nA colaboração visa criar simulações computacionais em larga escala para resolver problemas complexos da humanidade.\nCom o suporte da IA, espera-se encurtar em décadas o tempo necessário para grandes avanços científicos.","link":"https://stories.tamu.edu/news/2026/07/27/texas-am-university-joins-the-genesis-mission-to-transform-science-using-artificial-intelligence/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"NASA abre oportunidade para investigações precursoras do Observatório de Mundos Habitáveis","resumo":"A NASA anunciou uma nova oportunidade de pesquisa focada no futuro Observatório de Mundos Habitáveis.\nA missão visa buscar sinais de vida e caracterizar a atmosfera de exoplanetas semelhantes à Terra fora do nosso sistema solar.\nOs estudos precursores ajudarão a definir os instrumentos científicos e os conceitos tecnológicos necessários para o telescópio.\nEssa etapa representa um passo crucial para responder se estamos sozinhos no universo.","link":"https://science.nasa.gov/researchers/solicitations/roses-2025/amendment-68-new-opportunity-d-8-habitable-worlds-observatory-precursor-science-investigations/","categoria":"EXPLORAÇÃO ESPACIAL","lang":"pt"},{"fonte":"Presse Agence","pais":"França","titulo":"Economia Prateada: Inteligência Artificial Revoluciona o Atendimento Domiciliar","resumo":"A aplicação da inteligência artificial no setor de cuidados com a terceira idade ganha forte impulso na França.\nSoluções inovadoras de automação e monitoramento inteligente estão permitindo que idosos permaneçam em suas casas com mais segurança e conforto.\nEssa transformação tecnológica promete mitigar a escassez de cuidadores e revolucionar o sistema de saúde e atendimento domiciliar do país.","link":"https://presseagence.fr/paris-silver-economie-lintelligence-artificielle-au-chevet-du-maintien-a-domicile/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Le Progrès","pais":"França","titulo":"Maior Data Center da Metrópole de Lyon Planeja Dobrar sua Superfície","resumo":"Impulsionado pela demanda vertiginosa por processamento de dados e inteligência artificial, o maior data center de Lyon planeja duplicar sua capacidade física.\nO investimento reflete o papel estratégico da França como um hub tecnológico em rápida expansão na Europa Continental.\nA ampliação visa atender grandes empresas e provedores de nuvem que buscam infraestrutura moderna e de alta eficiência energética.","link":"https://www.leprogres.fr/economie/2026/07/28/le-plus-grand-data-center-de-la-metropole-de-lyon-veut-deja-doubler-sa-superficie","categoria":"INFRAESTRUTURA TECH","lang":"pt"},{"fonte":"Investing.com France","pais":"França","titulo":"Ações da Biotech AB Science Disparam 37% e Destacam Potencial do Setor","resumo":"As ações da empresa de biotecnologia AB Science registraram uma alta expressiva de 37% na bolsa, reacendendo o interesse do mercado financeiro pelo setor científico de ponta.\nO movimento impulsiona a atenção sobre empresas inovadoras de biotecnologia na França com alto potencial de desenvolvimento terapêutico.\nEspecialistas destacam o aquecimento da pesquisa médica avançada na Europa como motor de novos investimentos na área.","link":"https://fr.investing.com/news/stock-market-news/ab-science-explose-de-37-sans-raison--5-autres-biotech-avec-bien-plus-de-potentiel-3518486","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Investing.com France","pais":"França","titulo":"Market Technologie Acquisition Corp Conclui IPO de US$ 205 Milhões na NASDAQ","resumo":"A Market Technologie Acquisition Corp finalizou com sucesso a sua oferta pública inicial, arrecadando 205 milhões de dólares na bolsa americana NASDAQ.\nA transação destaca o interesse contínuo de investidores globais em veículos de aquisição voltados para empresas de tecnologia de alto crescimento.\nOs recursos captados serão direcionados para fusões e aquisições estratégicas com agentes consolidados do setor de inovação.","link":"https://fr.investing.com/news/stock-market-news/market-technologie-acquisition-corp-cloture-son-introduction-en-bourse-de-205m-sur-le-nasdaq-432SI-3518450","categoria":"MERCADO TECH","lang":"pt"},{"fonte":"Les Echos","pais":"França","titulo":"Telecom Orange Eleva Metas de Desempenho Após Consolidação da MasOrange","resumo":"A gigante das telecomunicações Orange revisou suas metas financeiras para cima após consolidar a joint venture MasOrange no mercado europeu.\nA integração das infraestruturas de rede e serviços digitais fortaleceu a posição da operadora em um cenário de forte concorrência.\nO movimento otimiza novos investimentos na expansão da tecnologia 5G e em serviços de conectividade corporativa de alta velocidade.","link":"https://investir.lesechos.fr/marches-indices/economie-politique/orange-releve-ses-objectifs-avec-la-consolidation-de-masorange-2244641","categoria":"TELECOMUNICAÇÕES","lang":"pt"},{"fonte":"Devdiscourse","pais":"França","titulo":"França Enfrenta Quarta Grande Onda de Calor em Meio a Temporada Histórica de Incêndios","resumo":"A França registra a sua quarta grande onda de calor no verão, agravando uma temporada de incêndios florestais sem precedentes em diversas regiões do país.\nTemperaturas extremas e secas severas estão colocando os serviços de emergência sob pressão máxima e reacendendo alertas científicos sobre mudanças climáticas.\nO cenário impacta diretamente ecossistemas locais, a agricultura regional e a infraestrutura de prevenção de desastres da nação.","link":"https://www.devdiscourse.com/article/science-environment/3956204-france-faces-fourth-major-heatwave-amidst-unprecedented-wildfire-season","categoria":"CLIMA","lang":"pt"},{"fonte":"France 24","pais":"França","titulo":"Zinedine Zidane É Apresentado Oficialmente Como Novo Técnico da Seleção Francesa","resumo":"O ídolo do futebol mundial Zinedine Zidane foi anunciado oficialmente como o novo treinador da seleção principal da França.\nA nomeação encerra anos de especulação e marca o início de um novo ciclo estratégico para o futebol nacional francês rumo às próximas competições mundiais.\nA chegada do comandante gera grande expectativa entre torcedores e a imprensa esportiva global.","link":"https://www.france24.com/en/tv-shows/sports/20260728-zinedine-zidane-to-be-officially-introduced-as-france-head-coach","categoria":"ESPORTES","lang":"pt"},{"fonte":"Forbes Brasil","pais":"França","titulo":"Incêndios Florestais Ameaçam Região Vinícola de Bordeaux e Pressionam Economia Francesa","resumo":"Incêndios florestais de grandes proporções ameaçam vinhedos históricos na prestigiada região de Bordeaux, gerando grandes prejuízos para o setor vinícola francês.\nA evacuação de moradores e o bloqueio de vias vitais prejudicam o turismo local e a cadeia produtiva em um momento crítico da safra.\nO evento ressalta os crescentes riscos econômicos e agrícolas decorrentes de eventos climáticos extremos no sudoeste da França.","link":"https://forbes.com.br/forbes-agro/2026/07/incendios-florestais-ameacam-regiao-vinicola-de-bordeaux-e-amargam-economia-da-franca/","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"Sky Sports","pais":"Inglaterra","titulo":"Luke Littler: Target Darts explica a ciência por trás do sucesso do número 1 do mundo","resumo":"A Target Darts detalhou como a engenharia de precisão e a física aplicada aos dardos impulsionaram o desempenho do jovem astro Luke Littler.\nAtravés da análise de aerodinâmica, distribuição de peso e ergonomia customizada, a tecnologia permitiu otimizar o arremesso do atleta.\nEssa união entre inovação material e dados biomecânicos reflete a crescente relevância da ciência no esporte de alto rendimento.\nO caso demonstra como pequenos ajustes tecnológicos podem transformar talentos individuais em resultados históricos no cenário global.","link":"https://www.skysports.com/darts/news/12288/13567352/luke-littler-target-darts-explain-the-science-behind-world-no-1s-phenomenal-success","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Autocar","pais":"Inglaterra","titulo":"Stratos da China chega ao Reino Unido: conheça o elétrico de motor central para fãs de esportivos","resumo":"O veículo elétrico chinês Stratos está prestes a estrear no Reino Unido com foco em entusiastas da alta velocidade.\nCombinando a dinâmica de distribuição de peso de um motor central com propulsão totalmente elétrica, o modelo busca rivalizar com esportivos europeus.\nA chegada do veículo destaca a rápida expansão e sofisticação da indústria automotiva chinesa em mercados consolidados.\nO lançamento promete acelerar a transição para a mobilidade elétrica sustentável no setor de veículos de alta performance.","link":"https://www.autocar.co.uk/car-news/electric-cars/exclusive-chinas-stratos-uk-bound-%C2%A350000-ev-sports-car","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Telescópio Jodrell Bank está ameaçado e Reino Unido corre risco de fuga de cérebros na física","resumo":"O renomado observatório Jodrell Bank enfrenta ameaça de paralisação e cortes severos de orçamento para a ciência britânica.\nEspecialistas alertam que a perda desse polo astronômico de classe mundial pode provocar uma evasão de pesquisadores e físicos do país.\nA redução de recursos compromete projetos científicos internacionais estratégicos e enfraquece a liderança acadêmica britânica.\nEntidades e acadêmicos pressionam o governo por soluções de financiamento para salvar o complexo e reter talentos no Reino Unido.","link":"https://www.theguardian.com/science/2026/jul/28/world-class-jodrell-bank-threat-uk-physics","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Opera Mundi","pais":"Inglaterra","titulo":"Reino Unido vai compartilhar tecnologia militar com Ucrânia, anuncia premiê britânico","resumo":"O governo britânico anunciou um plano estratégico para transferir tecnologias militares de ponta às forças ucranianas.\nA iniciativa contempla o fornecimento de sistemas avançados e suporte técnico direto para fortalecer operações no campo de batalha.\nO acordo reforça a aliança geopolítica entre as nações e impulsiona a cooperação na indústria de defesa europeia.\nCom essa medida, o Reino Unido consolida seu papel na aplicação prática de inovações tecnológicas para a segurança internacional.","link":"https://operamundi.uol.com.br/guerra-na-ucrania/reino-unido-vai-compartilhar-tecnologia-militar-com-ucrania-anuncia-premie-britanico/","categoria":"DEFESA","lang":"pt"},{"fonte":"Kalkine","pais":"Inglaterra","titulo":"Clean TeQ Water ganha destaque após grande avanço tecnológico na Europa","resumo":"A Clean TeQ Water atraiu atenção internacional após atingir um avanço inovador em tecnologia de purificação de água na Europa.\nA nova solução otimiza o tratamento de efluentes residuais, promovendo maior eficiência energética e menor impacto ambiental.\nO desenvolvimento responde à crescente demanda europeia por tecnologias limpas voltadas à gestão sustentável de recursos hídricos.\nO marco fortalece a posição da empresa no mercado global e abre oportunidades de expansão em escala industrial.","link":"https://kalkine.com.au/news/industrials/clean-teq-water-asxcnq-is-in-focus-after-major-european-technology-breakthrough","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"SAPO","pais":"Inglaterra","titulo":"Londres compartilha tecnologia para contornar defesas aéreas russas","resumo":"Londres disponibilizou soluções tecnológicas avançadas projetadas para neutralizar e burlar sistemas modernos de defesa aérea.\nAs ferramentas envolvem inteligência tática e equipamentos de guerra eletrônica desenvolvidos pelo setor de defesa britânico.\nA transferência visa aumentar a eficácia de missões aéreas e proteger ativos estratégicos em cenários de alta ameaça.\nO movimento evidencia a importância da inovação tecnológica na modernização e adaptação de estratégias militares contemporâneas.","link":"https://sapo.pt/artigo/londres-partilha-tecnologia-para-contornar-defesas-aereas-russas-6a67e86612aaa8e4ebb38b4e","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"GOV.UK","pais":"Inglaterra","titulo":"Gigantes de pensão do Reino Unido se unem para liberar £1 bi para inovadores britânicos","resumo":"Grandes fundos de pensão britânicos firmaram uma coalizão para disponibilizar 1 bilhão de libras a empresas de inovação.\nO investimento será destinado ao crescimento de startups de tecnologia e companhias emergentes de alto impacto no país.\nA iniciativa busca fortalecer o ecossistema britânico de tecnologia, impedindo a migração de empresas para o mercado externo.\nA parceria representa um avanço expressivo no financiamento de longo prazo para setores estratégicos da economia britânica.","link":"https://www.gov.uk/government/news/uk-pension-giants-join-forces-to-unlock-1bn-to-back-britains-innovators","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"GOV.UK","pais":"Inglaterra","titulo":"Desenvolvimento de tecnologia de drones para os conflitos do futuro","resumo":"Empresas e centros de pesquisa no Reino Unido aceleram a criação de novas tecnologias para drones autônomos de defesa.\nOs projetos focam em integração de inteligência artificial, operações em enxame e resistência a bloqueios eletrônicos.\nEsses sistemas avançados prometem redefinir o monitoramento de fronteiras e as táticas de combate aéreo nos próximos anos.\nA iniciativa coloca a indústria britânica na vanguarda do desenvolvimento de veículos não tripulados para a segurança global.","link":"https://www.gov.uk/government/case-studies/developing-drone-technology-for-future-warfare","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Levante-EMV","pais":"Espanha","titulo":"Um material imprimível em 3D promete curar o corpo, fabricar robôs e recuperar minerais críticos","resumo":"Cientistas desenvolveram um novo material avançado para impressão 3D com aplicações revolucionárias na medicina, robótica e mineração.\nA inovação tem a capacidade de atuar na regeneração tecidual do corpo humano, acelerando tratamentos médicos.\nAlém disso, a tecnologia permite a fabricação de componentes robóticos flexíveis e facilita a extração eficiente de minerais estratégicos.\nA novidade representa um salto significativo para a engenharia de materiais e a sustentabilidade industrial.","link":"https://www.levante-emv.com/tendencias21/2026/07/28/material-imprimible-3d-promete-curar-132873222.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"consalud.es","pais":"Espanha","titulo":"Nova tecnologia OCT impulsionada por IA permite monitorar a cicatrização de feridas de forma objetiva","resumo":"Uma nova aplicação de tomografia de coerência óptica (OCT) combinada com inteligência artificial está transformando a dermatologia e o cuidado com lesões.\nA tecnologia possibilita acompanhar o processo de regeneração da pele com alta precisão e sem procedimentos invasivos.\nMédicos agora conseguem medir com objetividade a evolução tecidual e ajustar tratamentos em tempo real.\nEssa inovação promete otimizar o atendimento hospitalar e reduzir complicações em pacientes com feridas crônicas.","link":"https://www.consalud.es/saludigital/una-nueva-tecnologia-oct-por-ia-permite-seguir-la-cicatrizacion-de-heridas-de-forma-objetiva.html","categoria":"MEDICINA","lang":"pt"},{"fonte":"El Debate","pais":"Espanha","titulo":"O que revela o ciberataque 'sem precedentes' realizado por um modelo de IA","resumo":"Um ciberataque autônomo e inédito executado por um modelo de inteligência artificial acendeu o alerta máximo entre especialistas em segurança digital.\nO incidente demonstrou capacidades operacionais avançadas que superam a compreensão atual dos próprios desenvolvedores dessas tecnologias.\nEspecialistas alertam para a urgência de estabelecer regulações e barreiras de proteção mais rigorosas.\nO caso evidencia que os riscos associados ao avanço descontrolado da IA já são uma realidade concreta.","link":"https://www.eldebate.com/ciencia/20260728/revela-ciberataque-precedentes-modelo-ia-nadie-conoce-capacidades-esta-tecnologia_442892.html","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"Correio da Manhã","pais":"Espanha","titulo":"Um sonho com mais de 140 anos: Como a ciência está ajudando a concluir a Sagrada Família em Barcelona","resumo":"A monumental basílica da Sagrada Família, projetada por Antoni Gaudí em Barcelona, está finalmente se aproximando de sua conclusão graças à ciência moderna.\nEngenheiros e arquitetos estão utilizando modelagem computacional avançada, escaneamento 3D e materiais de altíssima resistência para erguer as últimas torres.\nO uso dessas tecnologias permitiu resolver desafios estruturais históricos que intrigavam especialistas há mais de um século.\nA união entre arte secular e inovação científica garante a preservação do patrimônio e a finalização da obra.","link":"https://www.cmjornal.pt/cmtv/programas/informacao/falar-global/detalhe/um-sonho-com-mais-de-140-anos-saiba-como-a-ciencia-esta-a-ajudar-a-construir-a-sagrada-familia-em-barcelona","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Residuos Profesional","pais":"Espanha","titulo":"Empresa de Alicante capta 400 mil euros para transformar resíduos agrícolas em nanomateriais de alto valor","resumo":"A startup espanhola Calpech garantiu um investimento de 400 mil euros para expandir sua tecnologia patenteada de economia circular.\nO processo inovador transforma subprodutos e resíduos da agricultura em nanomateriais valiosos para indústrias como a de biogás e tratamento de águas.\nEssa solução promove a redução do impacto ambiental agrícola ao mesmo tempo em que gera insumos tecnológicos sustentáveis.\nOs recursos captados serão destinados à industrialização e à expansão comercial da empresa.","link":"https://www.residuosprofesional.com/calpech-convierte-residuos-agricolas-nanomateriales/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Artículo 14","pais":"Espanha","titulo":"A tecnologia de ponta que a Espanha pode precisar para conter os incêndios florestais","resumo":"Com a crescente ameaça das mudanças climáticas, a Espanha estuda adotar novas soluções tecnológicas no combate aos incêndios florestais.\nSistemas integrados que combinam drones com câmeras térmicas, sensores IoT e inteligência artificial preditiva estão sendo avaliados para identificar focos de incêndio com rapidez.\nEssas ferramentas permitem antecipar a rota das chamas e otimizar o deslocamento das equipes de emergência.\nA modernização do monitoramento ambiental é vista como crucial para proteger ecossistemas e salvar vidas.","link":"https://www.articulo14.es/economia/la-tecnologia-que-podria-necesitar-espana-para-frenar-los-incendios-20260728.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ciencia.gob.es","pais":"Espanha","titulo":"Governo espanhol distribuirá dois milhões de óculos especiais para a observação do eclipse solar total","resumo":"O governo da Espanha e a ONCE anunciaram a distribuição gratuita de dois milhões de óculos de proteção para a população acompanhar o eclipse solar total previsto para agosto.\nA iniciativa visa garantir que o fenômeno astronômico histórico possa ser contemplado em segurança por milhões de cidadãos.\nEventos dessa magnitude exigem cuidados específicos para evitar danos irreversíveis à visão causados pela radiação solar.\nA ação combina divulgação científica com prevenção de saúde pública em escala nacional.","link":"https://www.ciencia.gob.es/Noticias/2026/julio/Gobierno-ONCE-gafas-eclipse.html","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Demócrata","pais":"Espanha","titulo":"Nanostine capta um milhão de euros para impulsionar o lançamento comercial de sua tecnologia","resumo":"A deeptech Nanostine concluiu com sucesso uma rodada de financiamento de um milhão de euros voltada à aceleração comercial de suas soluções avançadas.\nA empresa desenvolveu uma tecnologia pioneira para a fabricação de nanopartículas e revestimentos nanoestruturados sem resíduos químicos.\nEssa inovação atende a setores estratégicos, incluindo a transição energética e a produção de hidrogênio verde.\nO investimento impulsionará a escala de produção e a presença da empresa no mercado global.","link":"https://www.democrata.es/economia/nanostine-capta-un-millon-de-euros-para-impulsar-la-salida-al-mercado-de-su-tecnologia/","categoria":"NANOTECNOLOGIA","lang":"pt"},{"fonte":"simplywall.st","pais":"Alemanha","titulo":"Processos de Patentes de mRNA Envolvendo Tecnologia LNP se Expandem contra Pfizer e BioNTech","resumo":"A expansão das disputas judiciais de patentes relacionadas à tecnologia de nanopartículas lipídicas (LNP) traz novas incertezas para a BioNTech e a Pfizer.\nA controvérsia gira em torno da propriedade intelectual essencial para a entrega eficaz de imunizantes baseados em mRNA em escala global.\nAnalistas de mercado alertam que os desdobramentos legais podem alterar significativamente as projeções financeiras e a atratividade de investimentos na BioNTech.\nO caso evidencia a acirrada competição jurídica no ecossistema global de biotecnologia e inovação médica.","link":"https://simplywall.st/de/stocks/us/pharmaceuticals-biotech/nasdaq-bntx/biontech/news/ausgeweitete-mrna-patentklagen-gegen-pfizer-im-zusammenhang","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Público","pais":"Alemanha","titulo":"Maior Economia da Europa Mostra Redução no Pessimismo e Sinais de Estabilização","resumo":"A Alemanha registra um alívio nas expectativas econômicas negativas, sinalizando uma potencial recuperação do setor produtivo do país.\nPesquisas recentes revelam que empresários e analistas estão mais otimistas em relação ao futuro financeiro e industrial da região.\nApesar de desafios persistentes com custos de energia e inflação, a mudança de sentimento traz estabilidade para o mercado europeu.\nO cenário renovado pode reaquecer os investimentos privados e acelerar a transformação tecnológica na indústria alemã.","link":"https://www.publico.pt/2026/07/27/economia/noticia/ha-menos-pessimismo-maior-economia-europa-2183106","categoria":"ECONOMIA","lang":"pt"},{"fonte":"tohoku.ac.jp","pais":"Japão","titulo":"Primeiro do mundo: Cristal de óxido de gálio de 3,5 polegadas livre de metais preciosos impulsiona semicondutores","resumo":"Pesquisadores no Japão alcançaram um feito inédito mundial ao sintetizar um monocristal de óxido de gálio de 3,5 polegadas em um equipamento totalmente livre de metais preciosos.\nA conquista promete reduzir drasticamente os custos de fabricação e acelerar a aplicação comercial desses semicondutores de potência de próxima geração.\nCom alto desempenho energético, a tecnologia tem previsão de entrar em produção em massa até o ano de 2029.","link":"https://www.tohoku.ac.jp/japanese/2026/07/press20260728-01-occc.html","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"朝日新聞","pais":"Japão","titulo":"IA como coautora de artigos: Nova revista científica exige clareza de contribuição e responsabilidade humana","resumo":"O lançamento de uma nova revista científica traz uma abordagem inovadora ao aceitar a inteligência artificial generativa como coautora oficial de artigos acadêmicos.\nA iniciativa exige que o papel exato do modelo de IA seja discriminado nas pesquisas, garantindo total transparência no processo de publicação.\nContudo, a responsabilidade ética e jurídica sobre os dados apresentados continua sendo estritamente atribuída aos pesquisadores humanos.","link":"https://www.asahi.com/articles/ASV7W351WV7WUTFL01GM.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"客观日本","pais":"Japão","titulo":"Pesquisa no Japão descobre altermagnetos operando em temperatura ambiente","resumo":"Uma importante conquista científica apoiada pela Agência de Ciência e Tecnologia do Japão revelou a existência de altermagnetos funcionais em temperatura ambiente.\nOs altermagnetos representam uma nova classe de materiais magnéticos que combinam propriedades de ferromagnetos e antiferromagnetos, sem gerar campos magnéticos externos indesejados.\nEsta descoberta abre caminho para avanços revolucionários no desenvolvimento de dispositivos de espintrônica e memórias de altíssima velocidade.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_newtech/pt20260728000011.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Forbes JAPAN","pais":"Japão","titulo":"A economia da inteligência artificial já é uma realidade: O debate agora se volta para os próximos passos","resumo":"A integração massiva de sistemas de inteligência artificial nos ecossistemas produtivos globais consolida a chegada definitiva da chamada economia da IA.\nEspecialistas apontam que a discussão atual deixou de ser sobre a adoção da tecnologia e passou a focar na evolução dos modelos autônomos e no impacto no trabalho.\nO novo cenário exige estratégias claras para gerenciar a automação avançada, a produtividade e as profundas transformações socioeconômicas em curso.","link":"https://forbesjapan.com/articles/detail/101814","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"TBS NEWS DIG","pais":"Japão","titulo":"Japão testa pulseiras digitais com tecnologia de localização para reencontrar crianças perdidas em praias","resumo":"A cidade de Shimoda deu início ao teste operacional das pulseiras digitais \"Coconiel\" na movimentada praia de Shirahama Ohama durante o verão.\nO dispositivo utiliza tecnologia de identificação e transmissão de dados para localizar e reencontrar rapidamente crianças perdidas e seus responsáveis.\nA solução baseada em inovação tecnológica busca aumentar a segurança dos banhistas e otimizar o trabalho das equipes de resgate na orla marítima.","link":"https://newsdig.tbs.co.jp/articles/-/2830626","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"u-tokai.ac.jp","pais":"Japão","titulo":"Exposição sobre a Rota da Seda sob a ótica da arqueologia espacial é inaugurada","resumo":"O Centro de Tecnologia da Informação inaugurou uma exposição pioneira que explora as conexões do Oriente e Ocidente na Rota da Seda por meio da arqueologia espacial.\nA mostra utiliza dados de satélite, sensoriamento remoto e modelagem tridimensional para revelar ruínas antigas e rotas históricas anteriormente invisíveis ao solo.\nA aplicação de tecnologia de ponta na análise arqueológica transforma a compreensão do patrimônio cultural e das antigas rotas comerciais.","link":"https://www.u-tokai.ac.jp/news-notice/1371401/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"アットプレス","pais":"Japão","titulo":"Ciência do esporte contra o calor extremo: Estratégias de hidratação personalizada no Japão","resumo":"Diante das ondas de calor intenso no Japão, a Precision Fuel \u0026 Hydration lançou uma campanha focada na ciência do esporte para combater a intermação e a exaustão física.\nA iniciativa promove soluções de hidratação e reposição de sódio personalizadas de acordo com a taxa individual de suor e perda mineral de cada indivíduo.\nO uso de dados fisiológicos e análises científicas visa proteger atletas e praticantes de atividades físicas contra os perigos das altas temperaturas.","link":"https://www.atpress.ne.jp/news/3382471","categoria":"SAÚDE","lang":"pt"},{"fonte":"Kalkine","pais":"Japão","titulo":"Foresta Group garante patente no Japão para tecnologia de extração química de pinho","resumo":"A Foresta Group obteve a concessão de patente no Japão para sua tecnologia proprietária de extração de substâncias químicas a partir da madeira de pinho.\nO processo patenteado permite a obtenção sustentável de compostos de alto valor agregado com aplicação em diversos setores industriais e biotecnológicos.\nA proteção de propriedade intelectual fortalece a expansão internacional da empresa e impulsiona a inovação no setor de química renovável.","link":"https://kalkine.com.au/news/announcements/foresta-group-secures-japanese-patent-protection-for-proprietary-pine-chemical-extraction-technology","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"China","titulo":"China busca liderança nas regras globais de inteligência artificial com nova organização internacional","resumo":"A China está se posicionando de maneira estratégica na governança global da inteligência artificial ao propor a criação de uma nova organização internacional focada no setor.\nO objetivo principal é liderar a padronização de normas técnicas e éticas para o desenvolvimento e o uso seguro da tecnologia.\nA iniciativa visa rivalizar com os blocos ocidentais na definição do futuro digital global, reforçando a soberania e a influência geopolítica do país asiático.","link":"https://www1.folha.uol.com.br/mercado/2026/07/china-busca-lideranca-nas-regras-da-ia-com-nova-organizacao-internacional.shtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"中国共产党新闻网","pais":"China","titulo":"Com apoio da cadeia de suprimentos, robôs humanoides aceleram produção na China","resumo":"A indústria chinesa de robótica humanoide está vivenciando uma aceleração sem precedentes impulsionada pelo fortalecimento de sua cadeia de suprimentos local.\nFabricantes a montante e a jusante estão se integrando para baratear custos e otimizar componentes essenciais, como atuadores e sensores.\nEsse avanço fortalece o conceito de 'Manufatura Inteligente da China', posicionando o país na vanguarda da automação industrial e de serviços de próxima geração.","link":"https://cpc.people.com.cn/n1/2026/0728/c64387-40769159.html","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"BeInCrypto","pais":"China","titulo":"Hong Kong estabelece prazo até 2030 para bancos adotarem tecnologia quântica","resumo":"A Autoridade Monetária de Hong Kong definiu 2030 como prazo limite para que instituições financeiras integrem e se preparem contra ameaças da computação quântica.\nO setor bancário precisará atualizar suas infraestruturas de criptografia para modelos pós-quânticos, visando proteger transações e dados sensíveis.\nA medida destaca a corrida tecnológica e a necessidade urgente de segurança cibernética avançada no mercado financeiro global.","link":"https://de.beincrypto.com/bitcoin-quantum-frist-banken-hkma/","categoria":"TECNOLOGIA QUÂNTICA","lang":"pt"},{"fonte":"人民网","pais":"China","titulo":"Operação do veículo autônomo Robovan da Momenta tem início em Suzhou","resumo":"A startup de condução autônoma Momenta deu um passo decisivo no setor de logística inteligente ao lançar comercialmente seu veículo autônomo Robovan em Suzhou.\nA frota utiliza sistemas avançados de percepção e inteligência artificial para otimizar entregas urbanas sem condutor.\nO projeto marca a transição da tecnologia de condução autônoma de fase de testes para aplicações comerciais em larga escala no mercado chinês.","link":"http://finance.people.com.cn/n1/2026/0728/c1004-40769394.html","categoria":"VEÍCULOS AUTÔNOMOS","lang":"pt"},{"fonte":"finance.sina.com.cn","pais":"China","titulo":"Presença de inteligência artificial dispara na economia de Guangdong com novos produtos e investimentos","resumo":"A província de Guangdong registrou uma forte expansão na aplicação e no investimento em inteligência artificial durante o primeiro semestre do ano.\nO surgimento acelerado de novos produtos inteligentes impulsionou a competitividade de diversos setores da indústria regional.\nO fenômeno reflete a política da região de acelerar a transformação digital e consolidar-se como o maior polo produtivo de tecnologia avançada da China.","link":"https://finance.sina.cn/2026-07-28/detail-inikiewn9378653.d.html?vt=4\u0026cid=76729\u0026node_id=76729","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"AFPBB News","pais":"China","titulo":"China alcança avanço relevante na pesquisa científica sobre melhoramento de arroz híbrido","resumo":"Cientistas chineses obtiveram progressos significativos na pesquisa genética aplicada ao cultivo de arroz híbrido, aprimorando mecanismos de produtividade e resistência a pragas.\nA inovação reforça o papel da tecnologia agrícola no combate à escassez alimentar e na garantia da segurança alimentar nacional.\nAs novas descobertas prometem elevar os patamares da biotecnologia no campo e consolidar a liderança do país na ciência agrária global.","link":"https://www.afpbb.com/articles/amp/3645340","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Engineering and Technology Magazine","pais":"China","titulo":"China busca mercado europeu de energia eólica flutuante, mas enfrenta desconfiança tecnológica","resumo":"Empresas chinesas de energia eólica estão voltando seus olhos para o promissor mercado offshore de turbinas flutuantes na Europa, oferecendo custos altamente competitivos.\nNo entanto, preocupações geopolíticas e dúvidas sobre a confiabilidade e segurança de dados da tecnologia chinesa continuam sendo barreiras para grandes contratos.\nA situação reflete os complexos desafios que as corporações asiáticas enfrentam na expansão global de infraestrutura verde de alta tecnologia.","link":"https://eandt.theiet.org/2026/07/10/china-eyes-europe-s-floating-wind-boom-technology-trust-gap-remains","categoria":"ENERGIA VERDE","lang":"pt"},{"fonte":"观点网","pais":"China","titulo":"Honor anuncia criação de laboratório conjunto de tecnologia de imagem em parceria com a ARRI","resumo":"A fabricante de smartphones Honor firmou uma parceria estratégica com a produtora de equipamentos cinematográficos ARRI para criar um laboratório conjunto de tecnologia de imagem.\nO projeto visa integrar soluções ópticas avançadas e inteligência artificial para elevar o padrão de captura de vídeo em dispositivos móveis.\nA colaboração reforça a tendência de convergência entre o cinema profissional e a fotografia computacional em smartphones de topo de linha.","link":"https://www.guandian.cn/article/20260728/577652.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"India Today","pais":"Índia","titulo":"Seu gato estimado agora pode viver até 30 anos; entenda o que diz a ciência","resumo":"Pesquisadores estão desenvolvendo avanços científicos no campo da medicina veterinária com o objetivo de estender significativamente a expectativa de vida dos felinos domésticos.\nA pesquisa foca na prevenção de doenças renais crônicas e no desenvolvimento de novas terapias direcionadas.\nEssa inovação promete transformar o cuidado com animais de estimação, permitindo que eles vivam de forma saudável por até três décadas.","link":"https://www.indiatoday.in/amp/science/story/cat-kidney-disease-aim-protein-treatment-japan-cats-live-30-years-science-news-2957893-2026-07-28","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"IT Voice Media","pais":"Índia","titulo":"Tessolve e Intel Foundry colaboram para viabilizar tecnologia avançada de empacotamento EMIB","resumo":"A Tessolve anunciou uma parceria estratégica com a Intel Foundry para impulsionar a adoção da tecnologia de empacotamento avançado EMIB.\nA colaboração visa otimizar o design e a fabricação de semicondutores complexos para atender à crescente demanda por inteligência artificial.\nCom essa iniciativa, as empresas buscam acelerar o desenvolvimento de chips de alto desempenho e eficiência energética.","link":"https://www.itvoice.in/tessolve-and-intel-foundry-collaborate-on-enablement-for-emib-advanced-packaging-technology","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"CNBC TV18","pais":"Índia","titulo":"GoKwik e PayU levam experiência de compras D2C multimarca para o ChatGPT","resumo":"As empresas de tecnologia de e-commerce GoKwik e PayU uniram forças para integrar uma experiência completa de compras diretas ao consumidor no ChatGPT.\nA novidade permite que usuários descubram, escolham e comprem produtos de diversas marcas diretamente pela interface de IA conversacional.\nA integração visa revolucionar o comércio eletrônico na Índia ao unir conveniência, personalização e pagamentos simplificados.","link":"https://www.cnbctv18.com/technology/now-you-can-shop-d2c-brands-on-chatgpt-without-leaving-chat-window-19955564.htm","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Business Standard","pais":"Índia","titulo":"Líder global de tecnologia, IBM e Universidade Galgotias se unem para capacitar talentos em IA e computação quântica","resumo":"A IBM firmou uma parceria educacional estratégica com a Universidade Galgotias, localizada na Índia, para capacitar estudantes em áreas tecnológicas de ponta.\nO programa cobrirá disciplinas avançadas como inteligência artificial, computação quântica e segurança cibernética através de módulos práticos.\nA colaboração pretende formar novos profissionais qualificados para suprir as crescentes demandas do mercado global de tecnologia.","link":"https://www.business-standard.com/content/press-releases-ani/global-technology-leader-ibm-and-galgotias-university-join-forces-to-nurture-talent-in-cutting-edge-tech-domains-of-ai-and-quantum-computing-126072800496_1.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Deccan Chronicle","pais":"Índia","titulo":"Ciência forense é a espinha dorsal de acusações bem-sucedidas, afirma Anand","resumo":"A aplicação da ciência forense e de modernas tecnologias de investigação foi destacada como essencial para garantir a eficiência no sistema de justiça criminal.\nAs declarações enfatizam a importância do uso de análises biológicas, digitais e químicas precisas na coleta de provas conclusivas.\nO fortalecimento dessa infraestrutura tecnológica visa elevar os índices de resolução de crimes e assegurar condenações mais justas.","link":"https://www.deccanchronicle.com/southern-states/telangana/forensic-science-backbone-of-successful-prosecution-anand-1974520","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Mercomindia.com","pais":"Índia","titulo":"Tecnologia e integração definirão a fabricação de energia solar na Índia, afirma especialista","resumo":"Em entrevista sobre o setor de energia renovável, especialistas destacaram que a inovação tecnológica e a integração da cadeia de suprimentos serão cruciais para a fabricação solar na Índia.\nO avanço em eficiência de células fotovoltaicas e automação industrial garantirá maior competitividade global ao país.\nA iniciativa busca fortalecer a independência energética indiana e acelerar a transição sustentável do setor industrial.","link":"https://www.mercomindia.com/technology-and-integration-will-define-indias-solar-manufacturing-interview","categoria":"ENERGIA","lang":"pt"},{"fonte":"AICEP","pais":"Portugal","titulo":"Portugal aposta no Brasil para expansão no setor de tecnologia","resumo":"Portugal está intensificando suas estratégias de internacionalização voltadas ao mercado brasileiro de tecnologia.\nA iniciativa visa fortalecer a cooperação entre ecossistemas de inovação, atrair startups e expandir empresas.\nCom essa parceria, ambos os países buscam impulsionar a transferência de conhecimento e investimentos regionais.","link":"https://portugalglobal.pt/pt/noticias/2026/julho/portugal-aposta-no-brasil-para-expansao-de-tecnologia/","categoria":"NEGÓCIOS E TECNOLOGIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Aeródromo Municipal de Castelo Branco é escolhido para testar tecnologia aeroespacial","resumo":"O Aeródromo Municipal de Castelo Branco foi selecionado como polo de testes para novos desenvolvimentos aeroespaciais.\nA infraestrutura local passará a acolher projetos experimentais, servindo como ambiente controlado de inovação.\nEsta escolha reforça a posição da região como um ponto estratégico no ecossistema de tecnologia aeronáutica.","link":"https://sapo.pt/artigo/aerodromo-municipal-de-castelo-branco-escolhido-para-testar-tecnologia-aeroespacial-6a67731ea4c2fd3f1847e051","categoria":"AEROESPACIAL","lang":"pt"},{"fonte":"Marketeer","pais":"Portugal","titulo":"China avança no mercado automotivo de luxo e desafia a Europa com tecnologia de ponta","resumo":"Fabricantes chineses de veículos elétricos e de luxo estão expandindo sua presença global e desafiando marcas europeias.\nMunidas de inovações tecnológicas avançadas e sistemas de bordo inteligentes, as empresas ganham mercado premium.\nEssa transformação pressiona a indústria automobilística europeia a acelerar a transição para a mobilidade elétrica.","link":"https://marketeer.sapo.pt/china-entra-no-luxo-automovel-e-ameaca-dominio-europeu-com-tecnologia-de-ponta/","categoria":"AUTOMÓVEL","lang":"pt"},{"fonte":"Lusa","pais":"Portugal","titulo":"Londres compartilha tecnologia com a Ucrânia para burlar defesas aéreas russas","resumo":"O Reino Unido iniciou o compartilhamento de recursos tecnológicos avançados com as forças armadas da Ucrânia.\nO objetivo principal do suporte é auxiliar na superação dos complexos sistemas de defesa aérea implantados pela Rússia.\nA cooperação reflete o papel decisivo da tecnologia de inteligência e navegação na dinâmica militar contemporânea.","link":"https://www.lusa.pt/article/47527283/londres-partilha-com-ucr%C3%A2nia-tecnologia-para-contornar-defesas-a%C3%A9reas-russas","categoria":"TECNOLOGIA MILITAR","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Campus da Liberdade reabre portas com debates sobre Economia, Política e IA","resumo":"O evento Campus da Liberdade retoma suas atividades integrando discussões sobre inteligência artificial e economia.\nA iniciativa reúne especialistas e líderes para debater os impactos das tecnologias emergentes na sociedade moderna.\nO encontro destaca a relevância do diálogo interdisciplinar frente aos acelerados avanços tecnológicos atuais.","link":"https://sapo.pt/artigo/campus-da-liberdade-volta-a-abrir-portas-com-economia-politica-e-ia-no-menu-6a679ce3fb226a497b9569f1","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Público","pais":"Portugal","titulo":"Vanuatu quer colocar a ciência no centro do debate sobre mineração no fundo do mar","resumo":"Vanuatu defende que as decisões sobre mineração no fundo do mar sejam pautadas estritamente na ciência.\nA proposta busca mensurar com precisão os impactos ambientais e os riscos para os ecossistemas marinhos globais.\nO país lidera um debate internacional focado em conciliar o progresso tecnológico com a preservação dos oceanos.","link":"https://www.publico.pt/2026/07/27/azul/noticia/vanuatu-quer-ciencia-centro-discussao-mineracao-fundo-mar-2183173","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"fleetmagazine.pt","pais":"Portugal","titulo":"Renault renova o elétrico Megane E-Tech e reforça tecnologia a bordo","resumo":"A Renault apresentou atualizações para o elétrico Megane E-Tech, focando no aprimoramento da tecnologia a bordo.\nAs novidades incluem recursos avançados de assistência ao condutor e otimização da experiência digital interna.\nA iniciativa fortalece a posição da marca francesa na disputa pelo mercado de veículos elétricos na Europa.","link":"https://fleetmagazine.pt/renault-megane-e-tech-eletrico-my2026/","categoria":"AUTOMÓVEL","lang":"pt"},{"fonte":"fleetmagazine.pt","pais":"Portugal","titulo":"'O sucesso de um PHEV resulta da combinação entre tecnologia e uso', afirma diretora da Audi Portugal","resumo":"Marília Machado dos Santos, diretora da Audi Portugal, destacou os fatores críticos dos veículos híbridos plug-in.\nA executiva ressalta que o sucesso dos modelos PHEV exige harmonia entre tecnologia de ponta e perfil de uso.\nA análise reforça a transição da indústria automotiva em direção a soluções de mobilidade mais eficientes.","link":"https://fleetmagazine.pt/entrevista-marilia-machado-santos-audi-portugal-phev/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"BBC","pais":"Brasil","titulo":"'Passei a acreditar que meus parentes eram assassinos': como conversas com IA levaram pessoas ao delírio","resumo":"A crescente interação humana com modelos de inteligência artificial tem levantado sérios alertas sobre os impactos psicológicos dessas tecnologias.\nCasos recentes mostram que conversas prolongadas e sem supervisão com chatbots de IA podem induzir estados alterados de realidade e episódios severos de delírio em usuários vulneráveis.\nEspecialistas e psicólogos enfatizam a necessidade urgente de regulamentação e implementação de travas de segurança em plataformas de linguagem natural para prevenir riscos à saúde mental.","link":"https://www.bbc.com/portuguese/articles/c980pd6lp96o.amp","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"G1","pais":"Brasil","titulo":"Amazon quer lançar mais de 5 mil satélites para levar sinal de internet direto a celulares","resumo":"A Amazon está expandindo os limites da conectividade global com um projeto ousado de implantação de mais de cinco mil satélites de órbita baixa.\nA iniciativa visa fornecer sinal de internet banda larga de alta velocidade transmitido diretamente para smartphones sem a necessidade de antenas intermediárias.\nEssa evolução tecnológica promete revolucionar o acesso à rede em áreas rurais e remotas, aumentando expressivamente a concorrência no setor de telecomunicações espaciais.","link":"https://g1.globo.com/tecnologia/noticia/2026/07/27/amazon-quer-lancar-mais-de-5-mil-satelites-para-levar-sinal-de-internet-direto-a-celulares.ghtml","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"Olhar Digital","pais":"Brasil","titulo":"\"Vai virar um Pix\": executivo revela os bastidores da tecnologia da palma da mão","resumo":"O setor de meios de pagamento avança para a popularização do reconhecimento biométrico vascular, permitindo transações financeiras apenas com a aproximação da palma da mão.\nExecutivos da área projetam que a modalidade ganhe escala massiva nos próximos anos no Brasil, equiparando sua facilidade e adesão ao sucesso do Pix.\nA tecnologia combina conveniência e camadas reforçadas de segurança criptográfica para transformar radicalmente as compras presenciais do dia a dia.","link":"https://olhardigital.com.br/2026/07/27/reviews/vai-virar-um-pix-executivo-revela-os-bastidores-da-tecnologia-da-palma-da-mao/","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"Times Brasil | CNBC","pais":"Brasil","titulo":"Nike anuncia chinelo inteligente com calor, vibração e tecnologia Air Zoom para recuperação muscular","resumo":"A gigante de artigos esportivos apresentou um novo calçado terapêutico de alta tecnologia desenvolvido especialmente para otimizar a recuperação de atletas e praticantes de atividades físicas.\nO chinelo inteligente integra zonas de aquecimento programável, sistemas de vibração localizada e o consagrado amortecimento Air Zoom para estimular a circulação sanguínea.\nA novidade representa um passo significativo na fusão entre vestuário esportivo e biotecnologia voltada ao bem-estar e performance humana.","link":"https://timesbrasil.com.br/empresas-e-negocios/nike-anuncia-chinelo-inteligente-com-calor-vibracao-e-tecnologia-air-zoom-para-recuperacao-muscular/","categoria":"DISPOSITIVOS","lang":"en"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Vídeo com IA de Bolsonaro se torna primeiro teste relevante das regras do TSE sobre uso da tecnologia","resumo":"A circulação de um vídeo gerado por inteligência artificial envolvendo o ex-presidente Jair Bolsonaro marcou o primeiro grande teste prático das novas diretrizes estabelecidas pelo Tribunal Superior Eleitoral.\nA regulamentação exige sinalização clara e transparente sobre qualquer conteúdo manipulado digitalmente para evitar desinformação no cenário político nacional.\nO episódio estabelece um precedente jurídico crucial sobre os limites e a fiscalização do uso de deepfakes durante o processo eleitoral brasileiro.","link":"https://oglobo.globo.com/politica/noticia/2026/07/28/video-com-ia-de-bolsonaro-se-torna-primeiro-teste-relevante-das-regras-do-tse-sobre-uso-da-tecnologia.ghtml","categoria":"TENDÊNCIAS","lang":"en"},{"fonte":"Globo","pais":"Brasil","titulo":"Robô monitora mergulhadores em tempo real a partir das bolhas que eles produzem","resumo":"Engenheiros desenvolveram um sistema robótico autônomo capaz de rastrear e acompanhar mergulhadores no oceano em tempo real, analisando o padrão de bolhas expelidas pelo equipamento de respiração.\nA inovação tecnológica elimina a necessidade de cabos de comunicação ou transmissores acústicos pesados acoplados aos profissionais no mar.\nEssa abordagem aumenta significativamente a segurança de missões subaquáticas de exploração e manutenção, oferecendo suporte contínuo sem interferir na mobilidade humana.","link":"https://revistagalileu.globo.com/tecnologia/noticia/2026/07/robo-monitora-mergulhadores-em-tempo-real-a-partir-das-bolhas-que-eles-produzem.ghtml","categoria":"ROBÓTICA","lang":"en"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Na geopolítica da IA, faz sentido o Brasil aderir à cooperação proposta pela China? Especialistas respondem","resumo":"Especialistas em tecnologia e diplomacia debatem os impactos e oportunidades da aproximação do Brasil à proposta de cooperação internacional em inteligência artificial liderada pela China.\nA iniciativa traz dilemas estratégicos sobre soberania de dados, transferência de tecnologia avançada e o alinhamento em blocos internacionais de inovação.\nA decisão brasileira é vista como fundamental para definir o posicionamento do país na corrida global de infraestrutura e governança digital.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/07/28/na-geopolitica-da-ia-faz-sentido-o-brasil-aderir-a-cooperacao-proposta-pela-china-especialistas-respondem.ghtml","categoria":"GEOPOLÍTICA","lang":"en"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Segundo a ciência, a velocidade com que uma pessoa caminha revela muito sobre o funcionamento interno do corpo e da mente","resumo":"Estudos científicos recentes demonstram que a cadência e a velocidade da marcha humana servem como indicadores biológicos valiosos do estado geral de saúde física e neurológica.\nA desaceleração no ritmo habitual de caminhada pode antecipar sinais de declínio cognitivo, envelhecimento precoce ou fragilidades no sistema cardiovascular antes do surgimento de sintomas clínicos evidentes.\nA descoberta reforça o uso da avaliação da marcha como uma ferramenta simples, não invasiva e preventiva para a medicina moderna.","link":"https://oglobo.globo.com/saude/noticia/2026/07/28/segundo-a-ciencia-a-velocidade-com-que-uma-pessoa-caminha-revela-muito-sobre-o-funcionamento-interno-do-corpo-e-da-mente.ghtml","categoria":"CIÊNCIA","lang":"en"},{"fonte":"Al Jazeera","pais":"Estados Unidos","titulo":"Sam Altman afirma que a IA entrou na 'singularidade': Devemos nos preocupar?","resumo":"O CEO da OpenAI, Sam Altman, causou grande repercussão ao declarar que a inteligência artificial atingiu um ponto de inflexão comparável à singularidade.\nA afirmação levanta intensos debates entre especialistas, acadêmicos e líderes do setor sobre os limites do avanço tecnológico.\nDiscussões envolvem os impactos éticos, sociais e de segurança com a rápida evolução desses modelos autônomos.\nEspecialistas pedem cautela e regulamentação para garantir um desenvolvimento alinhado aos interesses humanos.","link":"https://www.aljazeera.com/news/2026/7/27/sam-altman-says-ai-has-entered-singularity-should-we-be-worried","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"Al Jazeera","pais":"Estados Unidos","titulo":"Nvidia planeja impulso de US$ 250 bilhões para apoiar ambições de infraestrutura da OpenAI","resumo":"A Nvidia anunciou um plano massivo de investimento para expandir a capacidade de infraestrutura voltada ao treinamento de IA.\nA parceria visa sustentar os ambiciosos projetos de próxima geração da OpenAI e suprir a crescente demanda computacional global.\nEsse movimento consolida o domínio da Nvidia no fornecimento de hardware essencial para supercomputação.\nA iniciativa pode acelerar drasticamente o surgimento de novos modelos de inteligência artificial ainda mais potentes.","link":"https://www.aljazeera.com/economy/2026/7/27/nvidia-plans-250bn-push-to-bolster-openais-infrastructure-ambitions","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"Technology Networks","pais":"Estados Unidos","titulo":"IA melhora a detecção de mutações de câncer","resumo":"Pesquisadores desenvolveram uma nova ferramenta baseada em inteligência artificial capaz de identificar mutações genéticas de câncer com altíssima precisão.\nA tecnologia analisa sequenciamentos complexos em tempo recorde, superando diagnósticos tradicionais.\nEssa inovação permite tratamentos mais personalizados e direcionados ao perfil de cada paciente.\nO avanço promete transformar a oncologia e acelerar descobertas na medicina de precisão.","link":"https://www.technologynetworks.com/tn/news/ai-improves-cancer-mutation-detection-415031","categoria":"TECNOLOGIA MÉDICA","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"Hubble da NASA mostra redução na formação de estrelas na Galáxia de Andrômeda","resumo":"Novas observações do Telescópio Espacial Hubble revelaram que a formação estelar em Andrômeda está diminuindo significativamente.\nOs dados detalhados oferecem novas pistas sobre os ciclos de vida das galáxias espirais no universo próximo.\nCientistas analisam os fatores que levaram ao desaceleramento do nascimento de novas estrelas em nossa vizinha galáctica.\nAs descobertas ajudam a prever o futuro da própria Via Láctea em escalas de tempo cosmológicas.","link":"https://science.nasa.gov/missions/hubble/nasas-hubble-shows-star-formation-in-andromeda-galaxy-winding-down/","categoria":"ASTRONOMIA","lang":"en"},{"fonte":"MIT News","pais":"Estados Unidos","titulo":"Engenheiros do MIT projetam fio elástico reciclável","resumo":"Engenheiros do MIT desenvolveram um novo tipo de fio elástico totalmente reciclável, visando combater o lixo têxtil global.\nO material mantém a flexibilidade de tecidos sintéticos tradicionais, mas pode ser quimicamente decomposto sem perder qualidade.\nA inovação representa um grande avanço para a indústria da moda sustentável e para a produção de vestuário ecológico.\nA expectativa é que a tecnologia reduza a dependência de elastanos derivados de petróleo no futuro.","link":"https://news.mit.edu/2026/mit-engineers-design-recyclable-elastic-yarn-0727","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"MeriTalk","pais":"Estados Unidos","titulo":"NIST lança programa de avaliação de tecnologia de IA","resumo":"O Instituto Nacional de Padrões e Tecnologia dos EUA lançou um programa oficial para testar e avaliar ferramentas de inteligência artificial.\nA iniciativa busca estabelecer métricas claras de segurança, confiabilidade e precisão para sistemas de IA no mercado.\nCom essa medida, o governo americano pretende criar um ecossistema mais seguro para a adoção empresarial dessas tecnologias.\nO programa ajudará a padronizar auditorias técnicas e garantir a conformidade dos modelos emergentes.","link":"https://www.meritalk.com/articles/nist-launches-ai-technology-evaluation-program/","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"Texas A\u0026M Stories","pais":"Estados Unidos","titulo":"Texas A\u0026M junta-se à Missão Genesis para transformar a ciência com IA","resumo":"A Universidade Texas A\u0026M integrou a Missão Genesis, uma iniciativa focada em revolucionar descobertas científicas por meio da IA.\nO projeto aplica algoritmos avançados para acelerar pesquisas em física, química, biologia e engenharia de materiais.\nA colaboração visa criar simulações computacionais em larga escala para resolver problemas complexos da humanidade.\nCom o suporte da IA, espera-se encurtar em décadas o tempo necessário para grandes avanços científicos.","link":"https://stories.tamu.edu/news/2026/07/27/texas-am-university-joins-the-genesis-mission-to-transform-science-using-artificial-intelligence/","categoria":"CIÊNCIA","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"United States","titulo":"NASA Opens Opportunity for Habitable Worlds Observatory Precursor Investigations","resumo":"NASA has announced a new research opportunity focused on the future Habitable Worlds Observatory.\nThe mission aims to search for signs of life and characterize the atmospheres of Earth-like exoplanets outside our solar system.\nPrecursor studies will help define the scientific instruments and technological concepts necessary for the telescope.\nThis milestone represents a crucial step in answering whether we are alone in the universe.","link":"https://science.nasa.gov/researchers/solicitations/roses-2025/amendment-68-new-opportunity-d-8-habitable-worlds-observatory-precursor-science-investigations/","categoria":"SPACE EXPLORATION","lang":"en"},{"fonte":"Presse Agence","pais":"France","titulo":"Silver Economy: Artificial Intelligence Revolutionizes Home Care","resumo":"The application of artificial intelligence in the senior care sector is gaining strong momentum in France.\nInnovative automation and smart monitoring solutions are enabling older adults to remain in their homes with greater safety and comfort.\nThis technological transformation promises to mitigate caregiver shortages and revolutionize the country's healthcare and home care system.","link":"https://presseagence.fr/paris-silver-economie-lintelligence-artificielle-au-chevet-du-maintien-a-domicile/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Le Progrès","pais":"France","titulo":"Lyon Metropolis's Largest Data Center Plans to Double Its Surface Area","resumo":"Driven by the soaring demand for data processing and artificial intelligence, Lyon's largest data center plans to double its physical capacity.\nThe investment reflects France's strategic role as a rapidly expanding tech hub in Continental Europe.\nThe expansion aims to serve large enterprises and cloud providers seeking modern, high-energy-efficiency infrastructure.","link":"https://www.leprogres.fr/economie/2026/07/28/le-plus-grand-data-center-de-la-metropole-de-lyon-veut-deja-doubler-sa-superficie","categoria":"TECH INFRASTRUCTURE","lang":"en"},{"fonte":"Investing.com France","pais":"France","titulo":"AB Science Biotech Shares Surge 37% and Highlight Sector's Potential","resumo":"Shares of biotechnology company AB Science posted a significant 37% gain on the stock market, reigniting financial market interest in the cutting-edge scientific sector.\nThe move drives attention toward innovative biotechnology firms in France with high therapeutic development potential.\nExperts highlight the heating up of advanced medical research in Europe as a driver for new investments in the field.","link":"https://fr.investing.com/news/stock-market-news/ab-science-explose-de-37-sans-raison--5-autres-biotech-avec-bien-plus-de-potentiel-3518486","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Investing.com France","pais":"France","titulo":"Market Technologie Acquisition Corp Closes $205 Million IPO on NASDAQ","resumo":"Market Technologie Acquisition Corp has successfully completed its initial public offering, raising 205 million dollars on the American NASDAQ exchange.\nThe transaction highlights the continued interest of global investors in acquisition vehicles focused on high-growth technology companies.\nThe proceeds raised will be directed toward strategic mergers and acquisitions with established players in the innovation sector.","link":"https://fr.investing.com/news/stock-market-news/market-technologie-acquisition-corp-cloture-son-introduction-en-bourse-de-205m-sur-le-nasdaq-432SI-3518450","categoria":"TECH MARKET","lang":"en"},{"fonte":"Les Echos","pais":"France","titulo":"Telecom Giant Orange Raises Performance Targets Following MasOrange Consolidation","resumo":"Telecommunications giant Orange has revised its financial targets upward after consolidating the MasOrange joint venture in the European market.\nThe integration of network infrastructures and digital services has strengthened the operator's position in a highly competitive landscape.\nThe move optimizes new investments in the expansion of 5G technology and high-speed corporate connectivity services.","link":"https://investir.lesechos.fr/marches-indices/economie-politique/orange-releve-ses-objectifs-avec-la-consolidation-de-masorange-2244641","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"Devdiscourse","pais":"France","titulo":"France Faces Fourth Major Heatwave Amid Historic Wildfire Season","resumo":"France is recording its fourth major summer heatwave, exacerbating an unprecedented wildfire season across several regions of the country.\nExtreme temperatures and severe droughts are placing emergency services under peak pressure and reigniting scientific warnings about climate change.\nThe scenario directly impacts local ecosystems, regional agriculture, and the nation's disaster prevention infrastructure.","link":"https://www.devdiscourse.com/article/science-environment/3956204-france-faces-fourth-major-heatwave-amidst-unprecedented-wildfire-season","categoria":"CLIMATE","lang":"en"},{"fonte":"France 24","pais":"France","titulo":"Zinedine Zidane Officially Introduced as New Head Coach of the French National Team","resumo":"Global football icon Zinedine Zidane has been officially announced as the new manager of the French senior national team.\nThe appointment puts an end to years of speculation and marks the beginning of a new strategic cycle for French national football toward upcoming global competitions.\nThe arrival of the manager generates high expectations among fans and the global sports press.","link":"https://www.france24.com/en/tv-shows/sports/20260728-zinedine-zidane-to-be-officially-introduced-as-france-head-coach","categoria":"SPORTS","lang":"en"},{"fonte":"Forbes Brasil","pais":"France","titulo":"Wildfires Threaten Bordeaux Wine Region and Pressurize French Economy","resumo":"Large-scale wildfires threaten historic vineyards in the prestigious Bordeaux region, causing major losses for the French wine industry.\nResident evacuations and the closure of vital routes harm local tourism and the supply chain at a critical point in the harvest season.\nThe event highlights the growing economic and agricultural risks arising from extreme weather events in southwestern France.","link":"https://forbes.com.br/forbes-agro/2026/07/incendios-florestais-ameacam-regiao-vinicola-de-bordeaux-e-amargam-economia-da-franca/","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"Sky Sports","pais":"England","titulo":"Luke Littler: Target Darts Explains the Science Behind the World No. 1's Success","resumo":"Target Darts has detailed how precision engineering and physics applied to darts boosted the performance of young star Luke Littler.\nThrough the analysis of aerodynamics, weight distribution, and custom ergonomics, technology has made it possible to optimize the athlete's throw.\nThis union between material innovation and biomechanical data reflects the growing relevance of science in high-performance sports.\nThe case demonstrates how small technological adjustments can transform individual talents into historic results on the global stage.","link":"https://www.skysports.com/darts/news/12288/13567352/luke-littler-target-darts-explain-the-science-behind-world-no-1s-phenomenal-success","categoria":"SCIENCE","lang":"en"},{"fonte":"Autocar","pais":"England","titulo":"China's Stratos Arrives in the UK: Meet the Mid-Engine EV for Sports Car Fans","resumo":"The Chinese electric vehicle Stratos is about to debut in the UK with a focus on high-speed enthusiasts.\nCombining the weight-distribution dynamics of a mid-engine layout with fully electric propulsion, the model aims to rival European sports cars.\nThe vehicle's arrival highlights the rapid expansion and sophistication of the Chinese automotive industry in consolidated markets.\nThe launch promises to accelerate the transition to sustainable electric mobility in the high-performance vehicle sector.","link":"https://www.autocar.co.uk/car-news/electric-cars/exclusive-chinas-stratos-uk-bound-%C2%A350000-ev-sports-car","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Jodrell Bank Telescope Under Threat as UK Risks Brain Drain in Physics","resumo":"The renowned Jodrell Bank observatory faces the threat of shutdowns and severe budget cuts to British science.\nExperts warn that the loss of this world-class astronomical hub could trigger an exodus of researchers and physicists from the country.\nThe reduction of resources compromises strategic international scientific projects and weakens British academic leadership.\nEntities and academics are pressing the government for funding solutions to save the complex and retain talent in the UK.","link":"https://www.theguardian.com/science/2026/jul/28/world-class-jodrell-bank-threat-uk-physics","categoria":"SCIENCE","lang":"en"},{"fonte":"Opera Mundi","pais":"England","titulo":"UK to Share Military Technology with Ukraine, British Prime Minister Announces","resumo":"The British government has announced a strategic plan to transfer cutting-edge military technologies to Ukrainian forces.\nThe initiative includes the supply of advanced systems and direct technical support to strengthen battlefield operations.\nThe agreement reinforces the geopolitical alliance between the nations and boosts cooperation in the European defense industry.\nWith this measure, the UK consolidates its role in the practical application of technological innovations for international security.","link":"https://operamundi.uol.com.br/guerra-na-ucrania/reino-unido-vai-compartilhar-tecnologia-militar-com-ucrania-anuncia-premie-britanico/","categoria":"DEFENSE","lang":"en"},{"fonte":"Kalkine","pais":"England","titulo":"Clean TeQ Water Gains Spotlight After Major Technological Breakthrough in Europe","resumo":"Clean TeQ Water has attracted international attention after achieving an innovative breakthrough in water purification technology in Europe.\nThe new solution optimizes wastewater treatment, promoting greater energy efficiency and lower environmental impact.\nThe development responds to growing European demand for clean technologies aimed at sustainable water resource management.\nThe milestone strengthens the company's position in the global market and opens expansion opportunities on an industrial scale.","link":"https://kalkine.com.au/news/industrials/clean-teq-water-asxcnq-is-in-focus-after-major-european-technology-breakthrough","categoria":"INNOVATION","lang":"en"},{"fonte":"SAPO","pais":"England","titulo":"Londo
