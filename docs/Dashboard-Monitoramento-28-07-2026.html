n Shares Technology to Bypass Russian Air Defenses","resumo":"London has made available advanced technological solutions designed to neutralize and bypass modern air defense systems.\nThe tools involve tactical intelligence and electronic warfare equipment developed by the British defense sector.\nThe transfer aims to increase the effectiveness of air missions and protect strategic assets in high-threat scenarios.\nThe move highlights the importance of technological innovation in modernizing and adapting contemporary military strategies.","link":"https://sapo.pt/artigo/londres-partilha-tecnologia-para-contornar-defesas-aereas-russas-6a67e86612aaa8e4ebb38b4e","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"GOV.UK","pais":"England","titulo":"UK pension giants join forces to unlock £1bn to back Britain's innovators","resumo":"Major British pension funds have formed a coalition to make 1 billion pounds available to innovation companies.\nThe investment will be directed toward the growth of tech startups and high-impact emerging companies in the country.\nThe initiative seeks to strengthen the British tech ecosystem, preventing companies from migrating to foreign markets.\nThe partnership represents a significant advancement in long-term financing for strategic sectors of the British economy.","link":"https://www.gov.uk/government/news/uk-pension-giants-join-forces-to-unlock-1bn-to-back-britains-innovators","categoria":"BUSINESS","lang":"en"},{"fonte":"GOV.UK","pais":"England","titulo":"Developing drone technology for future warfare","resumo":"Companies and research centers in the UK are accelerating the creation of new technologies for autonomous defense drones.\nProjects focus on artificial intelligence integration, swarm operations, and resistance to electronic jamming.\nThese advanced systems promise to redefine border monitoring and air combat tactics in the coming years.\nThe initiative places the British industry at the forefront of developing unmanned vehicles for global security.","link":"https://www.gov.uk/government/case-studies/developing-drone-technology-for-future-warfare","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Levante-EMV","pais":"Spain","titulo":"A 3D-printable material promises to heal the body, manufacture robots, and recover critical minerals","resumo":"Scientists have developed a new advanced material for 3D printing with revolutionary applications in medicine, robotics, and mining.\nThe innovation has the capacity to act in human tissue regeneration, accelerating medical treatments.\nAdditionally, the technology enables the manufacturing of flexible robotic components and facilitates the efficient extraction of strategic minerals.\nThe novelty represents a significant leap for materials science and industrial sustainability.","link":"https://www.levante-emv.com/tendencias21/2026/07/28/material-imprimible-3d-promete-curar-132873222.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"consalud.es","pais":"Spain","titulo":"New AI-powered OCT technology enables objective monitoring of wound healing","resumo":"A new optical coherence tomography (OCT) application combined with artificial intelligence is transforming dermatology and injury care.\nThe technology makes it possible to track the skin regeneration process with high precision and without invasive procedures.\nDoctors can now objectively measure tissue evolution and adjust treatments in real time.\nThis innovation promises to optimize hospital care and reduce complications in patients with chronic wounds.","link":"https://www.consalud.es/saludigital/una-nueva-tecnologia-oct-por-ia-permite-seguir-la-cicatrizacion-de-heridas-de-forma-objetiva.html","categoria":"MEDICINE","lang":"en"},{"fonte":"El Debate","pais":"Spain","titulo":"What an 'unprecedented' cyberattack carried out by an AI model reveals","resumo":"An autonomous and unprecedented cyberattack executed by an artificial intelligence model has raised red alerts among digital security experts.\nThe incident demonstrated advanced operational capabilities that surpass the current understanding of the technologies' own developers.\nExperts warn of the urgency to establish stricter regulations and protective barriers.\nThe case highlights that the risks associated with the uncontrolled advancement of AI are already a concrete reality.","link":"https://www.eldebate.com/ciencia/20260728/revela-ciberataque-precedentes-modelo-ia-nadie-conoce-capacidades-esta-tecnologia_442892.html","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"Correio da Manhã","pais":"Spain","titulo":"A dream over 140 years old: How science is helping to complete the Sagrada Família in Barcelona","resumo":"The monumental Sagrada Família basilica, designed by Antoni Gaudí in Barcelona, is finally nearing its completion thanks to modern science.\nEngineers and architects are using advanced computer modeling, 3D scanning, and ultra-high-strength materials to erect the final towers.\nThe use of these technologies has solved historical structural challenges that have puzzled experts for over a century.\nThe union of secular art and scientific innovation ensures the preservation of heritage and the finalization of the work.","link":"https://www.cmjornal.pt/cmtv/programas/informacao/falar-global/detalhe/um-sonho-com-mais-de-140-anos-saiba-como-a-ciencia-esta-a-ajudar-a-construir-a-sagrada-familia-em-barcelona","categoria":"SCIENCE","lang":"en"},{"fonte":"Residuos Profesional","pais":"Spain","titulo":"Alicante-based company secures 400,000 euros to transform agricultural waste into high-value nanomaterials","resumo":"Spanish startup Calpech has secured a 400,000 euro investment to expand its patented circular economy technology.\nThe innovative process transforms agricultural byproducts and waste into valuable nanomaterials for industries such as biogas and water treatment.\nThis solution promotes the reduction of agricultural environmental impact while generating sustainable technological inputs.\nThe raised funds will be allocated to the company's industrialization and commercial expansion.","link":"https://www.residuosprofesional.com/calpech-convierte-residuos-agricolas-nanomateriales/","categoria":"INNOVATION","lang":"en"},{"fonte":"Artículo 14","pais":"Spain","titulo":"The cutting-edge technology Spain may need to contain wildfires","resumo":"With the growing threat of climate change, Spain is studying the adoption of new technological solutions to combat wildfires.\nIntegrated systems combining drones with thermal cameras, IoT sensors, and predictive artificial intelligence are being evaluated to quickly identify fire outbreaks.\nThese tools allow for anticipating the path of flames and optimizing the deployment of emergency teams.\nThe modernization of environmental monitoring is seen as crucial for protecting ecosystems and saving lives.","link":"https://www.articulo14.es/economia/la-tecnologia-que-podria-necesitar-espana-para-frenar-los-incendios-20260728.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ciencia.gob.es","pais":"Spain","titulo":"Spanish government to distribute two million special glasses for total solar eclipse viewing","resumo":"The government of Spain and ONCE have announced the free distribution of two million protective glasses for the public to watch the total solar eclipse scheduled for August.\nThe initiative aims to ensure that the historic astronomical event can be safely observed by millions of citizens.\nEvents of this magnitude require specific precautions to prevent irreversible vision damage caused by solar radiation.\nThe action combines scientific outreach with public health prevention on a national scale.","link":"https://www.ciencia.gob.es/Noticias/2026/julio/Gobierno-ONCE-gafas-eclipse.html","categoria":"ASTRONOMY","lang":"en"},{"fonte":"Demócrata","pais":"Spain","titulo":"Nanostine raises one million euros to boost commercial launch of its technology","resumo":"Deeptech company Nanostine has successfully closed a one million euro funding round aimed at accelerating the commercial rollout of its advanced solutions.\nThe company has developed a pioneering technology for the manufacturing of nanoparticles and nanostructured coatings free of chemical waste.\nThis innovation serves strategic sectors, including the energy transition and green hydrogen production.\nThe investment will drive production scale and the company's presence in the global market.","link":"https://www.democrata.es/economia/nanostine-capta-un-millon-de-euros-para-impulsar-la-salida-al-mercado-de-su-tecnologia/","categoria":"NANOTECHNOLOGY","lang":"en"},{"fonte":"simplywall.st","pais":"Germany","titulo":"mRNA Patent Lawsuits Involving LNP Technology Expand Against Pfizer and BioNTech","resumo":"The expansion of legal patent disputes related to lipid nanoparticle (LNP) technology brings new uncertainties for BioNTech and Pfizer.\nThe controversy centers around intellectual property essential for the effective global delivery of mRNA-based immunizations.\nMarket analysts warn that legal developments could significantly alter financial projections and investment attractiveness in BioNTech.\nThe case highlights fierce legal competition in the global biotechnology and medical innovation ecosystem.","link":"https://simplywall.st/de/stocks/us/pharmaceuticals-biotech/nasdaq-bntx/biontech/news/ausgeweitete-mrna-patentklagen-gegen-pfizer-im-zusammenhang","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Público","pais":"Germany","titulo":"Europe's Largest Economy Shows Decreased Pessimism and Signs of Stabilization","resumo":"Germany is registering relief in negative economic expectations, signaling a potential recovery in the country's productive sector.\nRecent surveys reveal that business leaders and analysts are more optimistic regarding the region's financial and industrial future.\nDespite persistent challenges with energy costs and inflation, the shift in sentiment brings stability to the European market.\nThe renewed scenario could reheat private investments and accelerate technological transformation in German industry.","link":"https://www.publico.pt/2026/07/27/economia/noticia/ha-menos-pessimismo-maior-economia-europa-2183106","categoria":"ECONOMY","lang":"en"},{"fonte":"tohoku.ac.jp","pais":"Japan","titulo":"World's first: Precious metal-free 3.5-inch gallium oxide crystal boosts semiconductors","resumo":"Researchers in Japan have achieved an unprecedented world first by synthesizing a 3.5-inch gallium oxide single crystal in equipment entirely free of precious metals.\nThe achievement promises to drastically reduce manufacturing costs and accelerate the commercial application of these next-generation power semiconductors.\nFeaturing high energy performance, the technology is projected to enter mass production by the year 2029.","link":"https://www.tohoku.ac.jp/japanese/2026/07/press20260728-01-occc.html","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"朝日新聞","pais":"Japan","titulo":"AI as a co-author of papers: New scientific journal demands contribution clarity and human responsibility","resumo":"The launch of a new scientific journal introduces an innovative approach by accepting generative artificial intelligence as an official co-author of academic papers.\nThe initiative requires that the exact role of the AI model be detailed in the research, ensuring complete transparency in the publication process.\nHowever, ethical and legal responsibility for the presented data continues to be strictly assigned to the human researchers.","link":"https://www.asahi.com/articles/ASV7W351WV7WUTFL01GM.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"Research in Japan discovers altermagnets operating at room temperature","resumo":"An important scientific breakthrough supported by the Japan Science and Technology Agency has revealed the existence of functional altermagnets at room temperature.\nAltermagnets represent a new class of magnetic materials that combine properties of ferromagnets and antiferromagnets without generating unwanted external magnetic fields.\nThis discovery paves the way for revolutionary advances in the development of spintronics devices and ultra-high-speed memories.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_newtech/pt20260728000011.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Forbes JAPAN","pais":"Japan","titulo":"The Artificial Intelligence Economy Is Already a Reality: The Debate Now Shifts to the Next Steps","resumo":"The massive integration of artificial intelligence systems into global production ecosystems cements the definitive arrival of the so-called AI economy.\nExperts point out that the current discussion is no longer about technology adoption, but rather focuses on the evolution of autonomous models and the impact on labor.\nThe new scenario demands clear strategies to manage advanced automation, productivity, and the profound socioeconomic transformations currently underway.","link":"https://forbesjapan.com/articles/detail/101814","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"TBS NEWS DIG","pais":"Japan","titulo":"Japan Tests Digital Location-Tracking Wristbands to Find Lost Children on Beaches","resumo":"The city of Shimoda has launched operational tests for \"Coconiel\" digital wristbands at the busy Shirahama Ohama beach during the summer.\nThe device uses data identification and transmission technology to quickly locate and reunite lost children with their guardians.\nThis technology-driven solution aims to enhance the safety of beachgoers and optimize the work of rescue teams along the coastline.","link":"https://newsdig.tbs.co.jp/articles/-/2830626","categoria":"INNOVATION","lang":"en"},{"fonte":"u-tokai.ac.jp","pais":"Japan","titulo":"Exhibition on the Silk Road Through the Lens of Space Archaeology Opens","resumo":"The Information Technology Center has opened a pioneering exhibition exploring East-West connections along the Silk Road using space archaeology.\nThe showcase utilizes satellite data, remote sensing, and three-dimensional modeling to reveal ancient ruins and historical routes previously invisible from the ground.\nThe application of cutting-edge technology in archaeological analysis is transforming the understanding of cultural heritage and ancient trade routes.","link":"https://www.u-tokai.ac.jp/news-notice/1371401/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"アットプレス","pais":"Japan","titulo":"Sports Science Against Extreme Heat: Personalized Hydration Strategies in Japan","resumo":"Faced with intense heatwaves in Japan, Precision Fuel \u0026 Hydration has launched a campaign focused on sports science to combat heatstroke and physical exhaustion.\nThe initiative promotes personalized hydration and sodium replacement solutions tailored to each individual's sweat rate and mineral loss.\nThe use of physiological data and scientific analysis aims to protect athletes and fitness enthusiasts from the dangers of high temperatures.","link":"https://www.atpress.ne.jp/news/3382471","categoria":"HEALTH","lang":"en"},{"fonte":"Kalkine","pais":"Japan","titulo":"Foresta Group Secures Japanese Patent for Pine Chemical Extraction Technology","resumo":"Foresta Group has been granted a patent in Japan for its proprietary technology used to extract chemical substances from pine wood.\nThe patented process enables the sustainable production of high-value-added compounds with applications across various industrial and biotechnological sectors.\nThis intellectual property protection strengthens the company's international expansion and drives innovation in the renewable chemistry sector.","link":"https://kalkine.com.au/news/announcements/foresta-group-secures-japanese-patent-protection-for-proprietary-pine-chemical-extraction-technology","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"China","titulo":"China Seeks Leadership in Global Artificial Intelligence Rules with New International Organization","resumo":"China is strategically positioning itself in global artificial intelligence governance by proposing the creation of a new international organization focused on the sector.\nThe primary objective is to lead the standardization of technical and ethical norms for the development and safe use of the technology.\nThe initiative aims to rival Western blocs in defining the global digital future, reinforcing the Asian country's sovereignty and geopolitical influence.","link":"https://www1.folha.uol.com.br/mercado/2026/07/china-busca-lideranca-nas-regras-da-ia-com-nova-organizacao-internacional.shtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"中国共产党新闻网","pais":"China","titulo":"Backed by Supply Chain, Humanoid Robots Accelerate Production in China","resumo":"China's humanoid robotics industry is experiencing unprecedented acceleration driven by the strengthening of its local supply chain.\nUpstream and downstream manufacturers are integrating to lower costs and optimize essential components, such as actuators and sensors.\nThis advancement reinforces the concept of 'China Smart Manufacturing,' positioning the country at the forefront of industrial automation and next-generation services.","link":"https://cpc.people.com.cn/n1/2026/0728/c64387-40769159.html","categoria":"ROBOTICS","lang":"en"},{"fonte":"BeInCrypto","pais":"China","titulo":"Hong Kong Sets 2030 Deadline for Banks to Adopt Quantum Technology","resumo":"The Hong Kong Monetary Authority has set a 2030 deadline for financial institutions to integrate and prepare against threats from quantum computing.\nThe banking sector will need to upgrade its encryption infrastructures to post-quantum models to protect transactions and sensitive data.\nThe measure highlights the technological race and the urgent need for advanced cybersecurity in the global financial market.","link":"https://de.beincrypto.com/bitcoin-quantum-frist-banken-hkma/","categoria":"QUANTUM TECHNOLOGY","lang":"en"},{"fonte":"人民网","pais":"China","titulo":"Momenta's Robovan Autonomous Vehicle Begins Operations in Suzhou","resumo":"Autonomous driving startup Momenta has taken a decisive step in the smart logistics sector by commercially launching its Robovan autonomous vehicle in Suzhou.\nThe fleet utilizes advanced perception and artificial intelligence systems to optimize driverless urban deliveries.\nThe project marks the transition of autonomous driving technology from the testing phase to large-scale commercial applications in the Chinese market.","link":"http://finance.people.com.cn/n1/2026/0728/c1004-40769394.html","categoria":"AUTONOMOUS VEHICLES","lang":"en"},{"fonte":"finance.sina.com.cn","pais":"China","titulo":"Artificial Intelligence Presence Surges in Guangdong's Economy with New Products and Investments","resumo":"Guangdong province recorded strong expansion in artificial intelligence applications and investments during the first half of the year.\nThe accelerated emergence of new smart products has boosted the competitiveness of various sectors within the regional industry.\nThe phenomenon reflects the region's policy to accelerate digital transformation and consolidate its position as China's largest advanced technology manufacturing hub.","link":"https://finance.sina.cn/2026-07-28/detail-inikiewn9378653.d.html?vt=4\u0026cid=76729\u0026node_id=76729","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"AFPBB News","pais":"China","titulo":"China Achieves Significant Breakthrough in Scientific Research on Hybrid Rice Improvement","resumo":"Chinese scientists have made significant progress in genetic research applied to hybrid rice cultivation, enhancing productivity mechanisms and pest resistance.\nThe innovation reinforces the role of agricultural technology in combating food scarcity and ensuring national food security.\nThese new discoveries promise to raise agricultural biotechnology standards and cement the country's leadership in global agrarian science.","link":"https://www.afpbb.com/articles/amp/3645340","categoria":"SCIENCE","lang":"en"},{"fonte":"Engineering and Technology Magazine","pais":"China","titulo":"China Targets European Floating Wind Energy Market, but Faces Technological Distrust","resumo":"Chinese wind energy companies are setting their sights on the promising offshore floating turbine market in Europe, offering highly competitive costs.\nHowever, geopolitical concerns and doubts regarding the reliability and data security of Chinese technology remain barriers to major contracts.\nThe situation reflects the complex challenges Asian corporations face in the global expansion of high-tech green infrastructure.","link":"https://eandt.theiet.org/2026/07/10/china-eyes-europe-s-floating-wind-boom-technology-trust-gap-remains","categoria":"GREEN ENERGY","lang":"en"},{"fonte":"观点网","pais":"China","titulo":"Honor Announces Creation of Joint Imaging Technology Laboratory in Partnership with ARRI","resumo":"Smartphone manufacturer Honor has entered into a strategic partnership with cinematography equipment maker ARRI to establish a joint imaging technology laboratory.\nThe project aims to integrate advanced optical solutions and artificial intelligence to elevate video capture standards on mobile devices.\nThe collaboration reinforces the convergence trend between professional cinema and computational photography in flagship smartphones.","link":"https://www.guandian.cn/article/20260728/577652.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"India Today","pais":"India","titulo":"Your Cherished Cat Could Now Live Up to 30 Years; Here Is What Science Says","resumo":"Researchers are developing scientific breakthroughs in veterinary medicine aimed at significantly extending the lifespan of domestic felines.\nThe research focuses on preventing chronic kidney disease and developing targeted new therapies.\nThis innovation promises to transform pet care, allowing animals to live healthy lives for up to three decades.","link":"https://www.indiatoday.in/amp/science/story/cat-kidney-disease-aim-protein-treatment-japan-cats-live-30-years-science-news-2957893-2026-07-28","categoria":"SCIENCE","lang":"en"},{"fonte":"IT Voice Media","pais":"India","titulo":"Tessolve and Intel Foundry Collaborate to Enable Advanced EMIB Packaging Technology","resumo":"Tessolve has announced a strategic partnership with Intel Foundry to boost the adoption of advanced EMIB packaging technology.\nThe collaboration aims to optimize the design and manufacturing of complex semiconductors to meet the surging demand for artificial intelligence.\nThrough this initiative, the companies aim to accelerate the development of high-performance, energy-efficient chips.","link":"https://www.itvoice.in/tessolve-and-intel-foundry-collaborate-on-enablement-for-emib-advanced-packaging-technology","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"CNBC TV18","pais":"India","titulo":"GoKwik and PayU Bring Multi-Brand D2C Shopping Experience to ChatGPT","resumo":"E-commerce technology companies GoKwik and PayU have joined forces to integrate a full direct-to-consumer shopping experience into ChatGPT.\nThe new feature allows users to discover, choose, and purchase products from various brands directly through the conversational AI interface.\nThe integration aims to revolutionize e-commerce in India by combining convenience, personalization, and streamlined payments.","link":"https://www.cnbctv18.com/technology/now-you-can-shop-d2c-brands-on-chatgpt-without-leaving-chat-window-19955564.htm","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Business Standard","pais":"India","titulo":"Global Tech Leader IBM and Galgotias University Team Up to Nurture Talent in AI and Quantum Computing","resumo":"IBM has signed a strategic educational partnership with Galgotias University in India to train students in cutting-edge tech fields.\nThe program will cover advanced disciplines such as artificial intelligence, quantum computing, and cybersecurity through hands-on modules.\nThe collaboration aims to train new qualified professionals to meet the growing demands of the global tech market.","link":"https://www.business-standard.com/content/press-releases-ani/global-technology-leader-ibm-and-galgotias-university-join-forces-to-nurture-talent-in-cutting-edge-tech-domains-of-ai-and-quantum-computing-126072800496_1.html","categoria":"INNOVATION","lang":"en"},{"fonte":"Deccan Chronicle","pais":"India","titulo":"Forensic Science is the Backbone of Successful Prosecutions, Says Anand","resumo":"The application of forensic science and modern investigative technology was highlighted as essential to ensuring efficiency in the criminal justice system.\nStatements emphasize the importance of using precise biological, digital, and chemical analysis in gathering conclusive evidence.\nStrengthening this technological infrastructure aims to raise crime-resolution rates and secure fairer convictions.","link":"https://www.deccanchronicle.com/southern-states/telangana/forensic-science-backbone-of-successful-prosecution-anand-1974520","categoria":"SCIENCE","lang":"en"},{"fonte":"Mercomindia.com","pais":"India","titulo":"Technology and Integration Will Define Solar Energy Manufacturing in India, Says Expert","resumo":"In an interview regarding the renewable energy sector, experts highlighted that technological innovation and supply chain integration will be crucial for solar manufacturing in India.\nAdvances in photovoltaic cell efficiency and industrial automation will ensure greater global competitiveness for the country.\nThe initiative seeks to strengthen India's energy independence and accelerate the sustainable transition of the industrial sector.","link":"https://www.mercomindia.com/technology-and-integration-will-define-indias-solar-manufacturing-interview","categoria":"ENERGY","lang":"en"},{"fonte":"AICEP","pais":"Portugal","titulo":"Portugal Looks to Brazil for Expansion in the Technology Sector","resumo":"Portugal is intensifying its internationalization strategies aimed at the Brazilian technology market.\nThe initiative aims to strengthen cooperation between innovation ecosystems, attract startups, and expand companies.\nThrough this partnership, both countries seek to boost knowledge transfer and regional investments.","link":"https://portugalglobal.pt/pt/noticias/2026/julho/portugal-aposta-no-brasil-para-expansao-de-tecnologia/","categoria":"BUSINESS AND TECHNOLOGY","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Castelo Branco Municipal Airfield Chosen to Test Aerospace Technology","resumo":"The Castelo Branco Municipal Airfield has been selected as a testing hub for new aerospace developments.\nThe local infrastructure will now host experimental projects, serving as a controlled innovation environment.\nThis choice reinforces the region's position as a strategic point in the aeronautical technology ecosystem.","link":"https://sapo.pt/artigo/aerodromo-municipal-de-castelo-branco-escolhido-para-testar-tecnologia-aeroespacial-6a67731ea4c2fd3f1847e051","categoria":"AEROSPACE","lang":"en"},{"fonte":"Marketeer","pais":"Portugal","titulo":"China Advances in the Luxury Automotive Market and Challenges Europe with Cutting-Edge Technology","resumo":"Chinese electric and luxury vehicle manufacturers are expanding their global presence and challenging European brands.\nArmed with advanced technological innovations and smart onboard systems, these companies are capturing the premium market.\nThis transformation is pressuring the European automotive industry to accelerate its transition to electric mobility.","link":"https://marketeer.sapo.pt/china-entra-no-luxo-automovel-e-ameaca-dominio-europeu-com-tecnologia-de-ponta/","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"Lusa","pais":"Portugal","titulo":"London Shares Technology with Ukraine to Bypass Russian Air Defenses","resumo":"The United Kingdom has begun sharing advance   const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/\.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
