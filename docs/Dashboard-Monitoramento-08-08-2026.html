  const data = [{"fonte":"Estadão","pais":"Brasil","titulo":"Estamos no momento Oppenheimer da tecnologia, diz especialista em IA","resumo":"Especialistas em inteligência artificial alertam que a humanidade atravessa um momento crítico de virada tecnológica.\nO avanço acelerado dos modelos generativos traz dilemas éticos, de segurança e riscos existenciais comparáveis ao desenvolvimento da bomba atômica.\nA discussão reforça a urgência de regulamentações globais e salvaguardas rigorosas para o desenvolvimento responsável da tecnologia.","link":"https://www.estadao.com.br/economia/negocios/estamos-no-momento-oppenheimer-da-tecnologia-diz-especialista-em-ia/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Banco Central cria regra para reter operações de criptomoedas acima de US$ 10 mil por 24 horas","resumo":"O Banco Central do Brasil anunciou novas regras de fiscalização para transações com criptoativos superiores a 10 mil dólares.\nA medida impõe uma retenção temporária de 24 horas nessas operações como mecanismo de prevenção a fraudes e lavagem de dinheiro.\nA iniciativa visa aumentar a rastreabilidade do mercado financeiro digital e proteger os investidores no país.","link":"https://www1.folha.uol.com.br/mercado/2026/08/bc-cria-regra-para-reter-operacoes-de-criptos-acima-de-us-10-mil-por-24h-contra-fraudes.shtml","categoria":"FINANÇAS DIGITAIS","lang":"pt"},{"fonte":"Valor Econômico","pais":"Brasil","titulo":"Discord proporá à AGU medidas de proteção após falhas de verificação de idade","resumo":"A plataforma Discord apresentará à Advocacia-Geral da União um plano com diretrizes reforçadas de segurança do usuário.\nA ação ocorre após questionamentos das autoridades sobre brechas no sistema de verificação de idade e proteção a menores.\nO movimento reflete o aumento do escrutínio governamental sobre redes sociais e ambientes digitais interativos no Brasil.","link":"https://valor.globo.com/politica/noticia/2026/08/07/discord-propor-agu-medidas-de-proteo-aps-falhas-de-verificao-de-idade.ghtml","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"TradingView","pais":"Brasil","titulo":"Empresa de tecnologia de baterias Sila obtém empréstimo de US$ 1,4 bilhão do Pentágono","resumo":"A desenvolvedora de baterias de nova geração Sila recebeu o compromisso de um empréstimo bilionário do governo norte-americano.\nO financiamento visa acelerar a produção em escala industrial de materiais avançados para armazenamento de energia e veículos elétricos.\nO aporte estratégico fortalece a cadeia global de suprimentos e impulsiona a transição para tecnologias de energia limpa.","link":"https://www.tradingview.com/news/reuters.com,2026:newsml_L1N44410S:0/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"cointelegraph.com.br","pais":"Brasil","titulo":"Ministério da Ciência e Tecnologia apoia projeto para integrar redes blockchain do Governo Federal","resumo":"O Ministério da Ciência, Tecnologia e Inovação formalizou apoio a uma iniciativa de unificação tecnológica no setor público.\nO projeto busca integrar as diferentes redes de blockchain utilizadas pelos órgãos do Governo Federal em uma infraestrutura nacional.\nA medida visa otimizar a segurança de dados públicos, garantir interoperabilidade e aumentar a transparência nas operações governamentais.","link":"https://cointelegraph.com.br/news/cpqd-and-the-ministry-of-science-and-technology?utm_source=rss_feed\u0026utm_medium=full_rss\u0026utm_campaign=rss_partner_inbound","categoria":"GOVERNO DIGITAL","lang":"pt"},{"fonte":"Valor Econômico","pais":"Brasil","titulo":"Como a tecnologia está transformando o combate à dengue","resumo":"Novas ferramentas tecnológicas, como monitoramento por satélite e mosquitos geneticamente modificados, estão revolucionando a saúde pública.\nO uso de inteligência artificial e análise de dados permite mapear focos do Aedes aegypti e prever surtos com antecedência.\nEssas inovações otimizam as ações de campo no Brasil, garantindo maior eficácia no controle da epidemia e na proteção da população.","link":"https://valor.globo.com/google/amp/patrocinado/dino/noticia/2026/08/07/como-a-tecnologia-esta-transformando-o-combate-a-dengue-1.ghtml","categoria":"CIÊNCIA E SAÚDE","lang":"pt"},{"fonte":"camara.leg.br","pais":"Brasil","titulo":"Projeto cria Marco da Economia Digital e define regras para uso de IA no Brasil","resumo":"Uma nova proposta legislativa no Congresso Nacional busca estruturar o Marco da Economia Digital no país.\nO projeto estabelece diretrizes para a governança de inteligência artificial, segurança cibernética e incentivos à inovação.\nO objetivo é atrair investimentos internacionais, garantir direitos digitais e posicionar o Brasil na vanguarda tecnológica da América Latina.","link":"https://www.camara.leg.br/noticias/1295796-projeto-cria-marco-da-economia-digital-e-define-regras-para-uso-de-ia-no-brasil","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Terra","pais":"Brasil","titulo":"Diretores financeiros priorizam tecnologia e inteligência artificial, aponta estudo","resumo":"Pesquisa realizada pela consultoria Grant Thornton revela que líderes financeiros estão aumentando seus investimentos em infraestrutura digital.\nA adoção de inteligência artificial e automação tornou-se prioridade central para otimizar processos operacionais e reduzir custos.\nO levantamento destaca que a transformação digital passou a ser o principal motor de competitividade no ambiente corporativo atual.","link":"https://www.terra.com.br/noticias/cfos-priorizam-tecnologia-e-ia-aponta-grant-thornton,a8006cfbff85e1630b6718bb6a145d93zdeagyg4.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Popular Science","pais":"Estados Unidos","titulo":"NASA consegue dar com sucesso mais um ano de vida à Voyager 2","resumo":"A NASA implementou com sucesso uma manobra de engenharia para estender a operação do instrumento científico final da sonda Voyager 2 até 2026.\nLançada em 1977, a espaçonave continua transmitindo dados valiosos do espaço interestelar, além da heliosfera.\nEssa conquista técnica demonstra a resiliência e a capacidade de inovação da equipe de missão para contornar a degradação de energia.\nO esforço garante a continuidade de medições únicas sobre o ambiente além do nosso sistema solar.","link":"https://www.popsci.com/science/nasa-voyager-2-big-bang-maneuver/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Yahoo Finance","pais":"Estados Unidos","titulo":"Empresa de tecnologia de baterias Sila recebe compromisso de empréstimo de US$ 1,4 bilhão do Pentágono","resumo":"A fabricante de materiais para baterias Sila obteve um compromisso de financiamento significativo do Departamento de Defesa dos EUA para expandir sua produção nacional.\nO investimento visa fortalecer a cadeia de suprimentos de energia e reduzir a dependência militar de componentes estrangeiros críticos.\nCom esses recursos, a empresa acelerará a fabricação de anodos de silício de alto desempenho para veículos elétricos e uso de defesa.\nA iniciativa reflete o empenho do governo americano em liderar a transição tecnológica e energética global.","link":"https://finance.yahoo.com/technology/articles/battery-technology-firm-sila-receives-215748483.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Estados Unidos","titulo":"Plano da Casa Branca para examinar IA potencialmente perigosa é cercado de segredo","resumo":"A estratégia do governo dos Estados Unidos para avaliar os riscos de modelos avançados de inteligência artificial enfrenta críticas pela falta de transparência.\nDocumentos e processos utilizados para monitorar sistemas potencialmente perigosos permanecem sob estrito sigilo.\nEspecialistas em tecnologia e defensores dos direitos digitais alertam sobre a falta de prestação de contas no setor.\nO debate intensifica as discussões sobre como equilibrar a segurança nacional com a inovação aberta em IA.","link":"https://www.theguardian.com/technology/2026/aug/07/white-house-ai","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"AI News","pais":"Estados Unidos","titulo":"O boom de investimentos em IA nos EUA está remodelando a economia","resumo":"O aporte massivo de capital em infraestrutura e desenvolvimento de inteligência artificial está transformando a estrutura econômica norte-americana.\nGigantes da tecnologia e fundos de investimento estão direcionando bilhões de dólares para data centers, semicondutores e energia.\nEsse fluxo financeiro tem sustentado setores de alta tecnologia, compensando incertezas em outros segmentos industriais.\nA tendência aponta para uma reconfiguração de longo prazo no mercado de trabalho e na competitividade dos EUA.","link":"https://www.artificialintelligence-news.com/news/americas-ai-investment-boom-is-reshaping-the-economy/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Montana State University","pais":"Estados Unidos","titulo":"Estudantes da Montana State ajudarão ciência da NASA no eclipse solar total de 2026","resumo":"Estudantes da Montana State University foram selecionados para colaborar em missões científicas da NASA durante o eclipse solar total previsto para 2026.\nOs acadêmicos farão o lançamento de balões de alta altitude para capturar dados inéditos da atmosfera terrestre durante o fenômeno.\nO projeto oferece uma oportunidade prática de formação para a próxima geração de cientistas e engenheiros espaciais.\nA iniciativa reforça a importância da integração entre o ensino universitário e pesquisas espaciais de ponta.","link":"https://www.montana.edu/news/25476/montana-state-students-to-help-nasa-science-soar-during-2026-total-solar-eclipse","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Le Revenu","pais":"Estados Unidos","titulo":"Tecnologias avançadas: administração Trump reforça política industrial frente à China","resumo":"O governo dos EUA anunciou novas diretrizes de política industrial para fortalecer o desenvolvimento e a proteção de tecnologias críticas locais.\nA medida tem como objetivo central conter o avanço tecnológico da China em setores estratégicos como semicondutores e computação.\nAs ações incluem maior controle sobre exportações e incentivos para a produção tecnológica dentro do território americano.\nEspecialistas preveem que essas restrições redefinirão as cadeias globais de suprimentos tecnológicos.","link":"https://www.lerevenu.com/reussir-bourse/avis-des-pros/technologies-avancees-l-administration-trump-renfo/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Times of Israël","pais":"Estados Unidos","titulo":"Rabbis de IA? A tecnologia divide as comunidades hassídicas de Nova York","resumo":"O surgimento de ferramentas de inteligência artificial projetadas para interpretar textos religiosos está gerando intensos debates em comunidades ortodoxas de Nova York.\nEnquanto alguns membros veem a tecnologia como um recurso útil para estudos acadêmicos, líderes tradicionais alertam para os riscos à autoridade espiritual.\nA controvérsia reflete as tensões crescentes entre a preservação cultural e o avanço irrestrito das inovações digitais.\nO caso exemplifica o impacto das novas tecnologias em estruturas sociais e religiosas ancestrais.","link":"https://fr.timesofisrael.com/des-rabbins-ia-la-technologie-divise-les-communautes-hassidiques-de-new-york/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Conversation","pais":"Estados Unidos","titulo":"Plano da Casa Branca para 'era de ouro' da ciência ignora estruturas que fizeram dos EUA superpotência científica","resumo":"Uma nova proposta governamental para impulsionar a pesquisa científica nos Estados Unidos vem recebendo críticas da comunidade acadêmica.\nEspecialistas argumentam que o plano desconsidera o financiamento descentralizado e a autonomia das universidades, pilares históricos da ciência no país.\nA reformulação proposta pode centralizar decisões e comprometer pesquisas fundamentais de longo prazo em prol de metas imediatistas.\nO debate coloca em xeque o futuro da liderança científica e tecnológica norte-americana no cenário global.","link":"https://theconversation.com/white-house-plan-for-a-golden-age-of-science-ignores-the-structures-that-made-the-us-a-scientific-superpower-288254","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"fr.qz.com","pais":"França","titulo":"Anduril Industries: o que faz a empresa de tecnologia de defesa","resumo":"A Anduril Industries tem se destacado globalmente como uma das principais startups de tecnologia voltadas para o setor de defesa e segurança.\nEspecializada em inteligência artificial, sistemas autônomos e drones, a empresa busca modernizar o arsenal militar com soluções de alta tecnologia.\nO artigo detalha as principais operações, produtos inovadores e o impacto estratégico da empresa no mercado geopolítico e militar atual.","link":"https://fr.qz.com/quest-ce-que-anduril-industries","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Le Dauphiné Libéré","pais":"França","titulo":"Drones bombardeiros de água para combater incêndios? A proposta inovadora de um deputado","resumo":"Diante do aumento dos incêndios florestais, um deputado francês apresentou uma proposta inovadora para a utilização de drones bombeiros.\nEsses dispositivos tecnológicos seriam capazes de transportar e lançar água em áreas de difícil acesso, auxiliando no combate ao fogo.\nA iniciativa busca modernizar as táticas de proteção ambiental e otimizar os recursos de emergência com o uso de tecnologia avançada.","link":"https://www.ledauphine.com/politique/2026/08/08/des-drones-bombardiers-d-eau-pour-lutter-contre-les-incendies-l-innovante-proposition-d-un-depute","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Ouest-France","pais":"França","titulo":"ENTREVISTA. 'Os eclipses também contribuíram para a ciência'","resumo":"Em uma entrevista fascinante, especialistas explicam como os eclipses solares e lunares foram fundamentais para avanços científicos históricos.\nDesde a comprovação da teoria da relatividade geral até a análise da atmosfera solar, esses eventos astronômicos revelam dados valiosos.\nA discussão destaca a importância contínua da observação espacial para responder a grandes mistérios do universo e da física moderna.","link":"https://www.ouest-france.fr/sciences/entretien-les-eclipses-ont-aussi-contribue-a-la-science-cde8ca76-8c10-11f1-8f47-ec3d1e1ec01b","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Top Santé","pais":"França","titulo":"Comer batatas durante todo o verão: o que a ciência realmente diz sobre seus efeitos na saúde","resumo":"O consumo diário de batatas ao longo da temporada de verão gera frequentes debates sobre nutrição e saúde geral.\nEstudos científicos recentes analisam os impactos do tubérculo no organismo, ponderando seu valor nutricional contra os riscos do consumo excessivo.\nA análise evidencia a importância de métodos de preparo saudáveis e do equilíbrio alimentar para manter os benefícios do alimento.","link":"https://www.topsante.com/nutrition_et_recettes/nutrition/manger-des-pommes-de-terre-tout-lete-ce-que-la-science-dit-vraiment-sur-ses-effets-sur-la-sante-978046","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"franceinfo","pais":"França","titulo":"Ministra dos Esportes quer transmissão 'na íntegra' do Tour de France feminino na televisão","resumo":"A ministra dos Esportes da França defendeu publicamente a transmissão integral do Tour de France feminino pelos canais de televisão.\nA medida visa ampliar a visibilidade do ciclismo feminino e promover a equidade de gênero na cobertura dos grandes eventos esportivos.\nA proposta reflete uma crescente demanda do público por maior espaço e investimentos em modalidades esportivas femininas no país.","link":"https://www.franceinfo.fr/tour-de-france/femmes/la-ministre-des-sports-marina-ferrari-souhaite-une-diffusion-en-integralite-a-la-television-du-tour-de-france-femmes_8138579.html","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"LPO (Ligue pour la Protection des Oiseaux)","pais":"França","titulo":"Consulta pública sobre a caça do zarro-comum: a ciência foi ignorada!","resumo":"Uma consulta pública recente sobre a liberação da caça ao zarro-comum gerou fortes críticas de cientistas e ambientalistas locais.\nEspecialistas alegam que a decisão política desconsiderou dados científicos sobre o declínio populacional e a ameaça de extinção da espécie.\nO debate coloca em evidência a tensão constante entre os interesses de caça e a preservação da biodiversidade com base científica.","link":"https://www.lpo.fr/qui-sommes-nous/toutes-nos-actualites/articles/actus-2026/consultation-publique-sur-la-chasse-du-fuligule-milouin-la-science-ignoree","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"TelegraphHerald.com","pais":"Inglaterra","titulo":"Fotos mostram como novas tecnologias ajudam a manter viva uma das últimas fábricas de sinos da Europa na Áustria","resumo":"Uma tradicional fundição de sinos na Áustria está recorrendo à tecnologia moderna para preservar uma arte secular.\nAtravés da integração de novas ferramentas tecnológicas, artesãos conseguem otimizar processos de produção complexos.\nA iniciativa demonstra como a inovação pode caminhar lado a lado com a preservação cultural e histórica no continente.","link":"https://www.telegraphherald.com/ap/business/image_e8721df6-b4ba-5e6a-9973-69d70e2556d6.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Yahoo Finance UK","pais":"Inglaterra","titulo":"Destaques da teleconferência de resultados da Standard Engineering Technology Ltd: Recordes no primeiro trimestre","resumo":"A Standard Engineering Technology anunciou resultados financeiros de destaque durante sua recente apresentação de lucros.\nA empresa registrou números recordes impulsionados pelo forte desempenho em suas divisões de engenharia e inovação.\nOs dados consolidados refletem uma sólida trajetória de crescimento no mercado global de tecnologia aplicada.","link":"https://uk.finance.yahoo.com/news/standard-engineering-technology-ltd-nse-030348208.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Cientistas criam conta no OnlyFans para marmotas com o objetivo de financiar pesquisas","resumo":"Pesquisadores encontraram uma maneira inusitada e viral de arrecadar fundos para a conservação e estudo das marmotas.\nA equipe criou um perfil no OnlyFans dedicado exclusivamente a compartilhar vídeos e fotos da rotina desses animais na natureza.\nA iniciativa inovadora visa engajar o público e garantir o financiamento necessário para a continuidade dos trabalhos científicos.","link":"https://www.theguardian.com/science/video/2026/aug/07/scientists-onlyfans-marmots-video","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Homem é fotografado secretamente por alguém usando óculos inteligentes e levanta debate sobre privacidade","resumo":"O uso crescente de óculos inteligentes em locais públicos reacendeu discussões urgentes sobre o direito à privacidade.\nUm homem relatou o desconforto de ter sido fotografado sem autorização por um dispositivo praticamente imperceptível.\nO incidente destaca o desafio ético e regulatório trazido por novas tecnologias vestíveis que gravam sem consentimento.","link":"https://www.theguardian.com/technology/2026/aug/08/ai-smartglasses-camera-film-privacy-consent","categoria":"PRIVACIDADE","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Um dos maiores escritores de ficção científica nos avisou sobre a IA: ele também tem a solução?","resumo":"O artigo analisa os alertas históricos sobre os riscos da inteligência artificial deixados por autores renomados de ficção científica.\nAlém das previsões sombrias, as obras da época também oferecem visões e princípios éticos que podem orientar o desenvolvimento atual.\nEspecialistas debatem como essas lições do passado servem como um guia valioso para conter os possíveis excessos da IA moderna.","link":"https://www.theguardian.com/technology/commentisfree/2026/aug/07/science-fiction-warned-us-about-an-ai-powered-dystopian-future-does-it-also-hold-the-remedy","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Sky Sports","pais":"Inglaterra","titulo":"Jeremy Jacquet: Por que o Liverpool está pronto para apostar no zagueiro francês de 60 milhões de libras","resumo":"O Liverpool reforça seu interesse no jovem zagueiro francês Jeremy Jacquet em uma negociação milionária.\nA equipe técnica do clube britânico enxerga no atleta o perfil ideal para consolidar seu sistema defensivo a longo prazo.\nA potencial transferência movimenta o mercado da bola e gera grande expectativa entre os torcedores e analistas de futebol.","link":"https://www.skysports.com/football/news/11669/13570137/jeremy-jacquet-why-liverpool-are-ready-to-put-their-faith-in-lb60m-france-centre-back","categoria":"ESPORTES","lang":"pt"},{"fonte":"El Diario Montañés","pais":"Espanha","titulo":"Paloma Pérez-Ilzarbe: A propósito do eclipse: saberes antigos e ciência moderna","resumo":"O artigo aborda a relação histórica e contemporânea entre os eclipses solares, o conhecimento ancestral e os avanços da ciência moderna.\nA análise destaca como as observações astronômicas do passado ajudaram a pavimentar o caminho para a compreensão científica atual do cosmos.\nTrata-se de uma reflexão sobre a evolução do pensamento humano diante de fenômenos celestes marcantes e transformadores.","link":"https://www.eldiariomontanes.es/opinion/paloma-perezilzarbe-proposito-eclipse-saberes-antiguos-ciencia-moderna-20260808074332-nt.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Radio Espinosa Merindades","pais":"Espanha","titulo":"Olimpíadas CyL Digital aproximam tecnologia e robótica de jovens em 14 municípios de Castela e Leão","resumo":"As Olimpíadas CyL Digital promovem o aprendizado de tecnologia e robótica entre os jovens de 14 municípios da região de Castela e Leão.\nA iniciativa visa incentivar o interesse de crianças e adolescentes pelas áreas de ciência, tecnologia, engenharia e matemática desde cedo.\nO evento fortalece a inclusão digital em áreas locais e prepara as novas gerações para os desafios do mercado tecnológico do futuro.","link":"https://radioespinosamerindades.es/sucesos/las-olimpiadas-cyl-digital-acercan-la-tecnologia-y-la-robotica-a-los-jovenes-de-14-municipios-de-castilla-y-leon/","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"motor16.com","pais":"Espanha","titulo":"Hispano Suiza Carmen Sagrera: assim funciona a tecnologia invisível do hipercarro elétrico espanhol","resumo":"O novo hipercarro elétrico Hispano Suiza Carmen Sagrera destaca-se pela integração de tecnologias avançadas de engenharia e aerodinâmica.\nA fabricante espanhola desenvolveu soluções invisíveis para otimizar o desempenho, a eficiência energética e a dirigibilidade do veículo de alta performance.\nEste lançamento reafirma o papel de destaque da indústria automotiva da Espanha no segmento de superesportivos elétricos de luxo.","link":"https://www.motor16.com/las-ultimas-noticias/hispano-suiza-carmen-sagrera/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"La Vanguardia","pais":"Espanha","titulo":"A ciência continua perseguindo a sombra lunar para entender melhor o Sol","resumo":"Cientistas de diversas partes do mundo aproveitam os eclipses solares para estudar a coroa e os mistérios da atmosfera do Sol com alta precisão.\nA passagem da sombra da Lua cria condições ideais e únicas para a captação de dados difíceis de obter por meios astronômicos tradicionais.\nEssas pesquisas ajudam a compreender melhor o comportamento solar e o impacto do clima espacial na Terra e em satélites.","link":"https://www.lavanguardia.com/ciencia/20260808/11597390/ciencia-sigue-persiguiendo-sombra-lunar-entender-mejor-sol.html","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Diario de Sevilla","pais":"Espanha","titulo":"Kia atualiza o XCeed com mais tecnologia e preços a partir de 19.860 euros","resumo":"A Kia lançou a atualização do crossover XCeed no mercado espanhol, incorporando recursos tecnológicos modernos e assistentes de condução.\nO modelo reestruturado oferece novas opções de conectividade e motorização com preços competitivos para atração do público.\nA renovação busca consolidar a presença do veículo no concorrido segmento de utilitários compactos com forte apelo digital.","link":"https://www.diariodesevilla.es/motor/kia-actualiza-xceed-tecnologia-19_0_2007664340.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ABC","pais":"Espanha","titulo":"Indra dotará o futuro aeroporto de Creta com tecnologia de última geração","resumo":"A empresa espanhola Indra foi selecionada para implementar sistemas tecnológicos de ponta no novo aeroporto internacional de Creta, na Grécia.\nO projeto prevê a instalação de soluções avançadas para a gestão de tráfego aéreo, segurança e automação dos serviços aeroportuários.\nO contrato consolida a liderança global da companhia no desenvolvimento de infraestruturas inteligentes para o setor de aviação.","link":"https://www.abc.es/economia/indra-dotara-tecnologia-ultima-generacion-futuro-aeropuerto-20260807155420-nt.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Expansión","pais":"Espanha","titulo":"Wall Street aprende a amar a tecnologia blockchain","resumo":"Grandes instituições financeiras de Wall Street estão adotando crescentemente a tecnologia blockchain para otimizar transações e processos contratuais.\nO movimento reflete uma mudança de atitude do setor bancário tradicional em relação a registros distribuídos e ativos digitalizados.\nA integração da blockchain melhora a transparência, reduz custos operacionais e reconfigura o ecossistema financeiro global.","link":"https://www.expansion.com/economia/financial-times/2026/08/07/6a75d51e468aeb135c8b4594.html","categoria":"BLOCKCHAIN","lang":"pt"},{"fonte":"ciencia.gob.es","pais":"Espanha","titulo":"Governo da Espanha oferecerá sinal ao vivo do eclipse total do Sol em 12 de agosto a partir do Observatório de Yebes","resumo":"O Governo espanhol transmitirá ao vivo o eclipse solar total de 12 de agosto a partir do Observatório Astronômico de Yebes.\nA transmissão contará com duas redes de sinal direto para permitir que o público acompanhe o fenômeno de forma acessível e detalhada.\nA iniciativa busca divulgar a ciência astronômica e engajar a população em um dos eventos celestes mais aguardados do ano.","link":"https://www.ciencia.gob.es/Noticias/2026/agosto/gobierno-senales-institucionales-directo-eclipse-total-sol.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Inteligência Artificial: OpenAI quer monitorar novas IAs de forma mais rigorosa após incidentes de hacking","resumo":"A OpenAI anunciou planos para intensificar o monitoramento e a segurança de seus novos modelos de inteligência artificial após recentes incidentes de hacking. A medida visa conter riscos cibernéticos crescentes e garantir que tecnologias de ponta não sejam exploradas por agentes maliciosos. Com isso, a empresa busca estabelecer padrões mais rígidos de governança e proteção de dados no setor tecnológico.","link":"https://www.sueddeutsche.de/wirtschaft/kuenstliche-intelligenz-openai-will-neue-ki-nach-hacking-vorfaellen-haerter-ueberwachen-dpa.urn-newsml-dpa-com-20090101-260808-930-500452","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"BILD","pais":"Alemanha","titulo":"Trump quer transformar os EUA em uma 'superpotência dos minerais'","resumo":"O plano proposto visa transformar os Estados Unidos em uma potência na extração de minerais estratégicos e recursos naturais. A iniciativa busca reduzir a dependência internacional e abastecer a crescente indústria tecnológica e de energias renováveis. O anúncio levanta debates globais sobre segurança geopolítica, autonomia industrial e impactos ambientais.","link":"https://www.bild.de/politik/ausland-und-internationales/trump-will-usa-zur-mineralien-supermacht-machen-6a76801035268e50270222ea","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"FAZ","pais":"Alemanha","titulo":"Economia alemã: Recorde de exportação apesar da crise energética","resumo":"Mesmo enfrentando os impactos da crise de energia na Europa, a Alemanha registrou um volume recorde no valor de suas exportações globais. O resultado surpreendeu analistas e demonstrou a resiliência do setor produtivo e tecnológico do país. O desempenho reforça a forte relevância das indústrias alemãs no mercado internacional diante da incerteza econômica.","link":"https://www.faz.net/aktuell/wirtschaft/deutsche-wirtschaft-exportrekord-trotz-energiekrise-201105749.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Spiegel","pais":"Alemanha","titulo":"Luisa Neubauer e Sepp Müller: Como a proteção climática e a economia podem se conciliar?","resumo":"Um debate de alto nível reuniu visões opostas sobre como conciliar o desenvolvimento econômico com metas rigorosas de proteção ao clima. O foco esteve na transição para tecnologias limpas sem comprometer a competitividade do setor industrial europeu. As discussões refletem o desafio global de acelerar a descarbonização garantindo a estabilidade dos mercados.","link":"https://www.spiegel.de/politik/deutschland/luisa-neubauer-und-sepp-mueller-cdu-wie-koennen-sich-klimaschutz-und-wirtschaft-vertragen-a-de09de2d-a85e-4f8a-be5c-d008428a9263","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"DIE ZEIT","pais":"Alemanha","titulo":"Economia: Alemanha exportou mais mercadorias em junho do que nunca","resumo":"A Alemanha registrou o maior volume de mercadorias exportadas para o mercado externo durante o mês de junho. O crescimento foi impulsionado pela alta demanda internacional por produtos manufaturados e bens de tecnologia de alto valor agregado. Os dados indicam um momento de dinamismo para o comércio exterior do país apesar dos desafios econômicos globais.","link":"https://www.zeit.de/wirtschaft/unternehmen/2026-08/deutsche-exporte-rekord-aussenhandel-waren-us-china-gxe","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"リアルサウンド","pais":"Japão","titulo":"Meisei Lança 'CORO', Roupa Inteligente com Tecnologia de Resfriamento Eletrônico","resumo":"A empresa Meisei apresentou o 'CORO', um vestuário inteligente equipado com tecnologia de resfriamento eletrônico imune às variações da temperatura externa.\nO produto foi desenvolvido para oferecer conforto térmico constante e aliviar o estresse térmico em ambientes de calor extremo.\nA inovação representa um avanço significativo no setor de vestuário funcional e tecnologias vestíveis voltadas para o bem-estar dos usuários.","link":"https://realsound.jp/tech/2026/08/post-2485202.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"NEWSつくば","pais":"Japão","titulo":"Cidade de Tsukuba Cria Fundo para Apoiar a Implementação Social de Tecnologias Avançadas","resumo":"A cidade de Tsukuba, reconhecida como um dos maiores polos científicos do Japão, anunciou a criação de um fundo financeiro dedicado à aceleração tecnológica.\nA iniciativa visa subsidiar e apoiar startups e centros de pesquisa na aplicação prática de soluções inovadoras no cotidiano urbano.\nCom a medida, o município fortalece seu papel estratégico na transformação digital e no desenvolvimento sustentável do país.","link":"https://newstsukuba.jp/62006/08/08/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Asics Inaugura Loja Conceito em Shinjuku e Explica Aumento da Demanda por Artigos Esportivos","resumo":"A Asics abriu as portas de sua nova loja flagship no movimentado distrito de Shinjuku, destacando produtos de alta performance e design.\nEm entrevista, o presidente da empresa abordou as razões pelas quais os calçados e vestuários esportivos ganharam tanto espaço no estilo de vida atual.\nO movimento reflete uma tendência crescente de busca por saúde, bem-estar e moda funcional entre os consumidores urbanos.","link":"https://news.yahoo.co.jp/articles/dc48e5c0046984856077260b06847d74321ffd1a","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"NHKニュース","pais":"Japão","titulo":"Empresa de Shizuoka Desenvolve Nova Tecnologia para Extração Simultânea de Nutrientes de Plantas","resumo":"Uma empresa baseada na província de Shizuoka criou uma tecnologia inédita capaz de extrair nutrientes e matérias-primas vegetais de forma simultânea.\nO método otimiza drasticamente o reaproveitamento de recursos biológicos, aumentando a eficiência e reduzindo o desperdício industrial.\nA inovação promete gerar grande impacto positivo nas indústrias farmacêutica, alimentícia e de cosméticos sustentáveis.","link":"https://news.web.nhk/newsweb/na/nb-3030033105","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"ニュースイッチ by 日刊工業新聞社","pais":"Japão","titulo":"Prodrone e Toshiba Iniciam Parceria Técnica para Desenvolver Drones de Interceptação Domésticos","resumo":"A Prodrone e a Toshiba anunciaram uma aliança estratégica voltada para o desenvolvimento de drones de interceptação fabricados integralmente no Japão.\nA colaboração une a expertise em engenharia aeronáutica com avançados sistemas de processamento e inteligência da Toshiba.\nO projeto busca fortalecer a soberania tecnológica e a segurança nacional diante do aumento de ameaças aéreas não identificadas.","link":"https://newswitch.jp/p/49912","categoria":"DEFESA","lang":"pt"},{"fonte":"毎日新聞","pais":"Japão","titulo":"Universidade de Ehime Desenvolve Filtro de Papel Capaz de Analisar Sangue com Apenas Uma Gota","resumo":"Pesquisadores da Universidade de Ehime criaram uma tecnologia de filtro à base de papel que permite a realização de exames médicos utilizando apenas uma gota de sangue.\nO dispositivo reduz drasticamente o desconforto e o custo dos testes, além de simplificar o diagnóstico em regiões com poucos recursos.\nA inovação representa um grande avanço para a medicina preventiva e a democratização do acesso aos cuidados de saúde.","link":"https://mainichi.jp/articles/20260808/ddl/k38/100/107000c","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Vietnam.vn","pais":"China","titulo":"Hospital Militar Central 108 aplica inteligência artificial e campos elétricos em reabilitação","resumo":"O Hospital Militar Central 108 implementou um sistema inovador de reabilitação que combina tecnologia de campo elétrico de alta voltagem com inteligência artificial. A solução visa otimizar os procedimentos terapêuticos e acelerar a recuperação de pacientes com disfunções motoras e neurológicas. O avanço destaca o papel crescente do aprendizado de máquina na medicina moderna e na personalização de tratamentos clínicos.","link":"https://www.vietnam.vn/pt/benh-vien-trung-uong-quan-doi-108-ung-dung-cong-nghe-dien-truong-cao-ap-tich-hop-ai-trong-phuc-hoi-chuc-nang","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"人民网-图片频道","pais":"China","titulo":"Navio de pesquisa \"Kexue\" conclui expedição no Pacífico Ocidental e retorna a Qingdao","resumo":"A embarcação oceânica de pesquisa \"Kexue\" retornou com sucesso ao porto de Qingdao após concluir uma importante missão de investigação científica no Oceano Pacífico Ocidental. Durante a expedição, os pesquisadores coletaram dados ecológicos e geológicos cruciais para entender os impactos das mudanças climáticas globais. A missão reforça a liderança científica chinesa nos estudos de oceanografia profunda e preservação dos ecossistemas marinhos.","link":"http://pic.people.com.cn/n1/2026/0808/c1016-40776094.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"chinanews.com.cn","pais":"China","titulo":"Delegação da Aliança de Economia de Baixa Altitude da Grande Baía visita a Indonésia","resumo":"Uma delegação da Aliança de Economia de Baixa Altitude da Região da Grande Baía realizou uma visita oficial à Indonésia para explorar oportunidades de cooperação internacional. O foco do encontro incluiu o desenvolvimento de ecossistemas para veículos aéreos não tripulados e mobilidade aérea urbana no Sudeste Asiático. A iniciativa busca expandir fronteiras comerciais e padronizações para tecnologias de aviação de baixa altitude na região.","link":"https://www.chinanews.com.cn/dwq/2026/08-08/10674082.shtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Tatler Asia","pais":"China","titulo":"Christel Buchanan, fundadora da ChatAndBuild: O futuro da tecnologia pode ser criado por qualquer pessoa","resumo":"A fundadora da plataforma ChatAndBuild defende a democratização do desenvolvimento de software e inteligência artificial para o público geral. Segundo a executiva, novas ferramentas no-code e orientadas por IA estão eliminando barreiras técnicas para a criação de soluções digitais. Essa mudança amplia radicalmente a participação de não programadores na construção de ecossistemas tecnológicos do futuro.","link":"https://www.tatlerasia.com/power-purpose/innovation/chatandbuild-founder-christel-buchanan-on-who-build-the-next-big-app-pt","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"7ª Conferência Internacional de Eletrônica Flexível é realizada em Jiaxing","resumo":"A cidade de Jiaxing sediou a sétima edição da Conferência Internacional de Tecnologias de Eletrônica Flexível, reunindo especialistas e líderes globais do setor. O evento debateu inovações em circuitos dobráveis, sensores vestíveis e novos materiais aplicáveis à saúde e dispositivos móveis. As discussões destacaram a transição dessas tecnologias da fase de laboratório para a produção industrial em larga escala.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569515.shtm","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Congresso Internacional de Ciência Básica abre preparativos em Pequim","resumo":"O distrito de Huairou, em Pequim, prepara-se para sediar o prestigiado Congresso Internacional de Ciência Básica de 2026. O evento reunirá matemáticos, físicos e cientistas da computação proeminentes para discutir descobertas teóricas fundamentais. A conferência visa incentivar a cooperação internacional e impulsionar pesquisas de fronteira no avanço do conhecimento científico mundial.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569514.shtm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"山东省科学技术厅","pais":"China","titulo":"Pesquisador Tang Bo desenvolve sonda de iluminação celular para avanços no diagnóstico médico","resumo":"O cientista Tang Bo apresentou os resultados de suas pesquisas no desenvolvimento de uma sonda molecular capaz de iluminação precisa de estruturas celulares. A tecnologia permite visualizar processos biológicos em nível nanométrico, auxiliando na detecção precoce de doenças graves como o câncer. A inovação reflete os esforços integrados entre universidades e setores de saúde para acelerar a aplicação clínica de pesquisas de ponta.","link":"http://kjt.shandong.gov.cn/art/2026/8/7/art_13364_10326562.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"山东省科学技术厅","pais":"China","titulo":"Cui Hongzhi cria revestimentos protetores sob medida para equipamentos industriais de grande porte","resumo":"A pesquisadora Cui Hongzhi destacou avanços na ciência dos materiais focados no desenvolvimento de revestimentos de alta resistência para equipamentos industriais críticos. As novas soluções funcionam como armaduras personalizadas que estendem a vida útil e suportam condições operacionais extremas. A tecnologia representa um marco para a engenharia pesada e fortalece a autossuficiência tecnológica da indústria nacional.","link":"http://kjt.shandong.gov.cn/art/2026/8/7/art_13364_10326560.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The New Indian Express","pais":"Índia","titulo":"Odisha e MP assinam memorando de entendimento para transferência de tecnologia de energia limpa","resumo":"Os estados indianos de Odisha e Madhya Pradesh assinaram um memorando de entendimento estratégico voltado para a transferência de tecnologias de energia limpa.\nA parceria visa acelerar a transição energética sustentável na região, promovendo a inovação técnica e o desenvolvimento de infraestruturas ecológicas.\nO acordo fortalece a cooperação governamental interna para enfrentar os desafios climáticos e impulsionar a matriz renovável do país.","link":"https://www.newindianexpress.com/states/odisha/2026/Aug/08/odisha-mp-sign-mou-for-clean-energy-technology-transfer","categoria":"ENERGIA LIMPA","lang":"pt"},{"fonte":"The Times of India","pais":"Índia","titulo":"Três levantadores de peso indianos selecionados para os Jogos da Commonwealth aceitam suspensão por doping","resumo":"Três atletas indianos de levantamento de peso previamente selecionados para os Jogos da Commonwealth aceitaram sanções e suspensões por violações das regras antidoping.\nA decisão representa um forte golpe na delegação esportiva do país e acende o alerta sobre a integridade dos atletas em competições internacionais.\nO caso ressalta a intensificação da fiscalização e o rigor na aplicação das normas esportivas globais.","link":"https://timesofindia.indiatimes.com/sports/more-sports/others/three-cwg-selected-lifters-accept-doping-bans/articleshow/133045156.cms","categoria":"ESPORTES","lang":"pt"},{"fonte":"NDTV","pais":"Índia","titulo":"O que acontece com a economia indiana se a Geração Z nunca comprar uma casa?","resumo":"Uma análise sobre as mudanças socioeconômicas na Índia aponta para os impactos no mercado imobiliário e no setor financeiro caso a Geração Z opte por não adquirir imóveis.\nEssa mudança de comportamento cultural prioriza a flexibilidade e o consumo de serviços em detrimento do acúmulo de bens tradicionais.\nO fenômeno pode redefinir modelos de investimentos, padrões de crédito e a dinâmica do crescimento econômico nacional nos próximos anos.","link":"https://www.ndtv.com/india-news/gen-z-never-buy-house-demand-india-economy-real-estate-11879027","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"Primeiro-ministro Modi inaugura fábrica de semicondutores da Micron Technology em Sanand, Gujarat","resumo":"O primeiro-ministro Narendra Modi inaugurou a nova fábrica de embalagem e testes de semicondutores da Micron Technology na cidade de Sanand, no estado de Gujarat.\nA iniciativa marca um avanço histórico para transformar a Índia em um polo global de fabricação de microchips e alta tecnologia.\nO projeto promete atrair bilhões em investimentos, gerar milhares de empregos qualificados e fortalecer a cadeia global de suprimentos tecnológicos.","link":"https://newsonair.gov.in/pm-modi-to-inaugurate-micron-technologys-state-of-the-art-semiconductor-atmp-facility-in-gujarat/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"CNBC TV18","pais":"Índia","titulo":"Primeiro trimestre da Kaynes Technology fica abaixo das estimativas; lucro líquido cai 24% apesar de alta de 41% na receita","resumo":"A empresa indiana de fabricação de eletrônicos Kaynes Technology registrou uma queda de 24% no seu lucro líquido no primeiro trimestre, frustrando as expectativas do mercado financeiro.\nEmbora a receita da companhia tenha apresentado um crescimento expressivo de 41%, o aumento nos custos operacionais impactou negativamente as margens de lucro.\nOs resultados acendem debates sobre os desafios de rentabilidade e escala no aquecido setor de tecnologia indiano.","link":"https://www.cnbctv18.com/market/stocks/kaynes-technology-share-price-q1-falls-short-of-estimates-net-profit-drops-24-despite-41-revenue-growth-19964521.htm","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"Ministro dos Esportes homenageia atletas indianos dos Jogos da Commonwealth de 2026 com prêmios em dinheiro","resumo":"O Ministro dos Esportes da Índia prestou homenagem oficial e concedeu recompensas financeiras aos atletas do país em destaque para os Jogos da Commonwealth de 2026.\nA iniciativa visa incentivar o alto rendimento e oferecer suporte financeiro contínuo para a preparação dos esportistas em competições internacionais de grande porte.\nO anúncio reforça o compromisso do governo em valorizar os talentos esportivos e promover o esporte nacional.","link":"https://newsonair.gov.in/sports-minister-felicitates-indian-athletes-of-cwg-2026-with-cash-rewards/","categoria":"ESPORTES","lang":"pt"},{"fonte":"Diário de Notícias","pais":"Portugal","titulo":"Dos maus presságios às grávidas: os mitos sobre os eclipses explicados pela ciência","resumo":"A aproximação de um eclipse solar reacende velhas crenças e superstições populares espalhadas ao longo da história. A ciência desmistifica medos comuns, como supostos riscos para gestantes e teorias sobre eventos nefastos. Especialistas reforçam a importância de compreender o fenômeno astronômico com base em fatos científicos. O artigo esclarece os cuidados reais necessários, focando na proteção ocular adequada durante a observação.","link":"https://www.dn.pt/ciencia/dos-maus-pressgios-s-grvidas-os-mitos-sobre-os-eclipses-explicados-pela-cincia","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Tek Notícias","pais":"Portugal","titulo":"Se a tecnologia está disponível, por que o trabalho continua tão difícil?","resumo":"Apesar do avanço acelerado da inteligência artificial e de ferramentas digitais, a rotina profissional continua desgastante. Especialistas analisam como a sobrecarga de informações e a falta de integração entre sistemas geram gargalos de produtividade. Em vez de simplificar, o excesso de novas plataformas muitas vezes exige mais tempo de adaptação e gestão dos trabalhadores. O debate traz reflexões sobre como reestruturar o ecossistema corporativo para que a inovação realmente otimize o tempo.","link":"https://tek.sapo.pt/opiniao/artigos/se-a-tecnologia-esta-la-porque-e-que-o-trabalho-continua-tao-dificil/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Jornal SOL","pais":"Portugal","titulo":"Você consegue dobrar a língua em U? A ciência explica o que o gesto revela sobre o cérebro","resumo":"A habilidade de dobrar a língua em formato de U é frequentemente associada à genética, mas o mecanismo é mais complexo. Estudos científicos apontam que o controle motor fino da língua envolve conexões neurais específicas e plasticidade do cérebro. A capacidade combina fatores hereditários com o aprendizado prático ao longo do desenvolvimento humano. A descoberta ajuda neurocientistas a compreenderem melhor a evolução da linguagem e os circuitos motores cerebrais.","link":"https://sol.iol.pt/vida/noticias/consegue-dobrar-a-lingua-em-u-a-ciencia-explica-o-que-este-gesto-revela-sobre-o-cerebro/20260807/6a75f2880cf2b42132dbd172","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Ministério da Educação, Ciência e Inovação divulga dados sobre candidaturas","resumo":"O Ministério da Educação, Ciência e Inovação de Portugal publicou relatórios atualizados sobre os processos de candidatura. Os dados destacam a procura por cursos nas áreas de ciência, tecnologia, engenharia e matemática no ensino superior. O panorama reflete o interesse crescente dos estudantes em carreiras voltadas ao desenvolvimento tecnológico e pesquisa. A iniciativa visa orientar políticas públicas para fortalecer a formação acadêmica e atender às demandas do mercado.","link":"https://sapo.pt/artigo/o-ministerio-da-educacao-ciencia-e-inovacao-divulgou-os-dados-relativos-as-can-6a75febd93e2ef3921d98de7","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Público","pais":"Portugal","titulo":"Terceira remessa de óculos gratuitos para o eclipse esgota em poucos minutos","resumo":"A corrida para observar o próximo eclipse solar fez com que um novo lote de óculos de proteção esgotasse rapidamente. A alta demanda evidencia o enorme interesse da população pelo fenômeno astronômico e pela observação segura. Autoridades e astrônomos alertam para os perigos de observar o Sol diretamente sem o uso de filtros adequados. Novas distribuições estão sendo planejadas para garantir que mais pessoas possam acompanhar o evento em segurança.","link":"https://www.publico.pt/2026/08/07/ciencia/noticia/terceira-leva-oculos-gratuitos-eclipse-voltou-esgotarse-minutos-2184372","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Expresso","pais":"Portugal","titulo":"Economia norte-americana perde 23 mil postos de trabalho em julho","resumo":"O mercado de trabalho nos Estados Unidos registrou um recuo inesperado com a perda de 23 mil empregos no mês de julho. O resultado sinaliza uma desaceleração na atividade econômica em meio a pressões inflacionárias e taxas de juros elevadas. Setores de tecnologia e serviços foram diretamente impactados, acendendo um alerta para analistas financeiros globais. O indicador deve influenciar as próximas decisões de política monetária nos próximos meses.","link":"https://expresso.pt/emprego/2026-08-07-economia-norte-americana-perde-23.000-postos-de-trabalho-em-julho-450f55f6","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"The Portugal News","pais":"Portugal","titulo":"Ministro da Economia defende integração regulada e garante canal acelerado para imigrantes","resumo":"O governo português apresentou novas diretrizes para a atração e regulamentação da mão de obra estrangeira no país. O plano inclui a criação de um canal acelerado focado em suprir a carência de trabalhadores em setores estratégicos. A medida busca equilibrar as necessidades do mercado econômico com a inclusão social e jurídica dos imigrantes. O debate reflete uma tendência europeia de reformular políticas migratórias para impulsionar a competitividade nacional.","link":"https://www.theportugalnews.com/br/noticias/2026-08-07/ministro-da-economia-defende-a-integracao-regulamentada-e-garante-um-canal-rapido-para-imigrantes/1067365","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Estadão","pais":"Brazil","titulo":"We are at technology's Oppenheimer moment, says AI expert","resumo":"Artificial intelligence experts warn that humanity is going through a critical technological turning point.\nThe accelerated advancement of generative models brings ethical and security dilemmas, as well as existential risks comparable to the development of the atomic bomb.\nThe discussion reinforces the urgency of global regulations and rigorous safeguards for the responsible development of the technology.","link":"https://www.estadao.com.br/economia/negocios/estamos-no-momento-oppenheimer-da-tecnologia-diz-especialista-em-ia/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"Central Bank creates rule to hold cryptocurrency operations above $10,000 for 24 hours","resumo":"The Central Bank of Brazil announced new supervisory rules for crypto asset transactions exceeding 10,000 dollars.\nThe measure imposes a temporary 24-hour hold on these operations as a mechanism to prevent fraud and money laundering.\nThe initiative aims to increase the traceability of the digital financial market and protect investors in the country.","link":"https://www1.folha.uol.com.br/mercado/2026/08/bc-cria-regra-para-reter-operacoes-de-criptos-acima-de-us-10-mil-por-24h-contra-fraudes.shtml","categoria":"DIGITAL FINANCE","lang":"en"},{"fonte":"Valor Econômico","pais":"Brazil","titulo":"Discord to propose protection measures to AGU following age verification failures","resumo":"The Discord platform will present a plan with enhanced user safety guidelines to the Office of the Attorney General.\nThe action comes after authorities raised questions regarding loopholes in the age verification system and the protection of minors.\nThe move reflects increased government scrutiny on social media networks and interactive digital environments in Brazil.","link":"https://valor.globo.com/politica/noticia/2026/08/07/discord-propor-agu-medidas-de-proteo-aps-falhas-de-verificao-de-idade.ghtml","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"TradingView","pais":"Brazil","titulo":"Battery technology company Sila secures $1.4 billion loan from the Pentagon","resumo":"Next-generation battery developer Sila has received a commitment for a multi-billion-dollar loan from the U.S. government.\nThe financing aims to accelerate industrial-scale production of advanced materials for energy storage and electric vehicles.\nThe strategic contribution strengthens the global supply chain and drives the transition to clean energy technologies.","link":"https://www.tradingview.com/news/reuters.com,2026:newsml_L1N44410S:0/","categoria":"INNOVATION","lang":"en"},{"fonte":"cointelegraph.com.br","pais":"Brazil","titulo":"Ministry of Science and Technology supports project to integrate Federal Government blockchain networks","resumo":"The Ministry of Science, Technology, and Innovation has formalized support for a technological unification initiative in the public sector.\nThe project seeks to integrate the various blockchain networks used by Federal Government agencies into a single national infrastructure.\nThe measure aims to optimize public data security, ensure interoperability, and increase transparency in government operations.","link":"https://cointelegraph.com.br/news/cpqd-and-the-ministry-of-science-and-technology?utm_source=rss_feed\u0026utm_medium=full_rss\u0026utm_campaign=rss_partner_inbound","categoria":"DIGITAL GOVERNMENT","lang":"en"},{"fonte":"Valor Econômico","pais":"Brazil","titulo":"How technology is transforming the fight against dengue fever","resumo":"New technological tools, such as satellite monitoring and genetically modified mosquitoes, are revolutionizing public health.\nThe use of artificial intelligence and data analysis makes it possible to map Aedes aegypti breeding grounds and predict outbreaks in advance.\nThese innovations optimize field operations in Brazil, ensuring greater effectiveness in controlling the epidemic and protecting the population.","link":"https://valor.globo.com/google/amp/patrocinado/dino/noticia/2026/08/07/como-a-tecnologia-esta-transformando-o-combate-a-dengue-1.ghtml","categoria":"SCIENCE AND HEALTH","lang":"en"},{"fonte":"camara.leg.br","pais":"Brazil","titulo":"Bill creates Digital Economy Framework and sets rules for AI use in Brazil","resumo":"A new legislative proposal in the National Congress seeks to structure the country's Digital Economy Framework.\nThe bill establishes guidelines for artificial intelligence governance, cybersecurity, and incentives for innovation.\nThe goal is to attract international investment, guarantee digital rights, and position Brazil at the forefront of technology in Latin America.","link":"https://www.camara.leg.br/noticias/1295796-projeto-cria-marco-da-economia-digital-e-define-regras-para-uso-de-ia-no-brasil","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Terra","pais":"Brazil","titulo":"CFOs prioritize technology and artificial intelligence, study shows","resumo":"Research conducted by consulting firm Grant Thornton reveals that financial leaders are increasing their investments in digital infrastructure.\nThe adoption of artificial intelligence and automation has become a central priority to optimize operational processes and reduce costs.\nThe survey highlights that digital transformation has become the main driver of competitiveness in today's corporate environment.","link":"https://www.terra.com.br/noticias/cfos-priorizam-tecnologia-e-ia-aponta-grant-thornton,a8006cfbff85e1630b6718bb6a145d93zdeagyg4.html","categoria":"BUSINESS","lang":"en"},{"fonte":"Popular Science","pais":"United States","titulo":"NASA successfully buys Voyager 2 another year of life","resumo":"NASA has successfully implemented an engineering maneuver to extend the operation of Voyager 2's final scientific instrument through 2026.\nLaunched in 1977, the spacecraft continues to transmit valuable data from interstellar space, beyond the heliosphere.\nThis technical achievement demonstrates the resilience and innovative capacity of the mission team to work around power degradation.\nThe effort ensures the continuity of unique measurements of the environment beyond our solar system.","link":"https://www.popsci.com/science/nasa-voyager-2-big-bang-maneuver/","categoria":"SCIENCE","lang":"en"},{"fonte":"Yahoo Finance","pais":"United States","titulo":"Battery technology firm Sila receives $1.4 billion loan commitment from the Pentagon","resumo":"Battery materials manufacturer Sila has secured a significant financing commitment from the U.S. Department of Defense to expand its domestic production.\nThe investment aims to strengthen the energy supply chain and reduce military reliance on critical foreign components.\nWith these resources, the company will accelerate the manufacturing of high-performance silicon anodes for electric vehicles and defense use.\nThe initiative reflects the U.S. government's commitment to leading the global technology and energy transition.","link":"https://finance.yahoo.com/technology/articles/battery-technology-firm-sila-receives-215748483.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"United States","titulo":"White House plan to examine potentially dangerous AI is shrouded in secrecy","resumo":"The U.S. government's strategy to assess the risks of advanced artificial intelligence models is facing criticism for its lack of transparency.\nDocuments and processes used to monitor potentially dangerous systems remain under strict confidentiality.\nTechnology experts and digital rights advocates are sounding the alarm over a lack of accountability in the sector.\nThe debate intensifies discussions on how to balance national security with open AI innovation.","link":"https://www.theguardian.com/technology/2026/aug/07/white-house-ai","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"AI News","pais":"United States","titulo":"America's AI investment boom is reshaping the economy","resumo":"The massive influx of capital into artificial intelligence infrastructure and development is transforming the North American economic structure.\nTech giants and investment funds are channeling billions of dollars into data centers, semiconductors, and energy.\nThis financial flow has sustained high-tech sectors, offsetting uncertainties in other industrial segments.\nThe trend points to a long-term reconfiguration of the labor market and U.S. competitiveness.","link":"https://www.artificialintelligence-news.com/news/americas-ai-investment-boom-is-reshaping-the-economy/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Montana State University","pais":"United States","titulo":"Montana State students to help NASA science soar during 2026 total solar eclipse","resumo":"Montana State University students have been selected to collaborate on NASA scientific missions during the total solar eclipse scheduled for 2026.\nThe scholars will launch high-altitude balloons to capture unprecedented data on Earth's atmosphere during the phenomenon.\nThe project offers a hands-on training opportunity for the next generation of space scientists and engineers.\nThe initiative reinforces the importance of integrating university education with cutting-edge space research.","link":"https://www.montana.edu/news/25476/montana-state-students-to-help-nasa-science-soar-during-2026-total-solar-eclipse","categoria":"SCIENCE","lang":"en"},{"fonte":"Le Revenu","pais":"United States","titulo":"Advanced technologies: Trump administration strengthens industrial policy against China","resumo":"The U.S. government has announced new industrial policy guidelines to strengthen the development and protection of critical local technologies.\nThe core objective of the measure is to curb China's technological advancement in strategic sectors such as semiconductors and computing.\nActions include greater export controls and incentives for technological production within U.S. territory.\nExperts predict that these restrictions will redefine global technology supply chains.","link":"https://www.lerevenu.com/reussir-bourse/avis-des-pros/technologies-avancees-l-administration-trump-renfo/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Times of Israël","pais":"United States","titulo":"AI Rabbis? Technology divides New York's Hasidic communities","resumo":"The emergence of artificial intelligence tools designed to interpret religious texts is sparking intense debate within Orthodox communities in New York.\nWhile some members view the technology as a useful resource for academic studies, traditional leaders warn of risks to spiritual authority.\nThe controversy reflects growing tensions between cultural preservation and the unrestrained advancement of digital innovations.\nThe case exemplifies the impact of new technologies on ancient social and religious structures.","link":"https://fr.timesofisrael.com/des-rabbins-ia-la-technologie-divise-les-communautes-hassidiques-de-new-york/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Conversation","pais":"United States","titulo":"White House plan for a 'golden age' of science ignores the structures that made the US a scientific superpower","resumo":"A new government proposal to boost scientific research in the United States has faced criticism from the academic community.\nExperts argue that the plan disregards decentralized funding and university autonomy, which are historical pillars of science in the country.\nThe proposed overhaul could centralize decisions and compromise fundamental long-term research in favor of short-term goals.\nThe debate calls into question the future of North American scientific and technological leadership on the global stage.","link":"https://theconversation.com/white-house-plan-for-a-golden-age-of-science-ignores-the-structures-that-made-the-us-a-scientific-superpower-288254","categoria":"SCIENCE","lang":"en"},{"fonte":"fr.qz.com","pais":"France","titulo":"Anduril Industries: What the defense technology company does","resumo":"Anduril Industries has stood out globally as one of the leading technology startups focused on the defense and security sector.\nSpecializing in artificial intelligence, autonomous systems, and drones, the company aims to modernize the military arsenal with high-tech solutions.\nThe article details the company's main operations, innovative products, and strategic impact on the current geopolitical and military market.","link":"https://fr.qz.com/quest-ce-que-anduril-industries","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Le Dauphiné Libéré","pais":"France","titulo":"Water-bombing drones to fight wildfires? A lawmaker's innovative proposal","resumo":"Faced with the rise in forest fires, a French lawmaker has presented an innovative proposal for the use of firefighting drones.\nThese technological devices would be capable of carrying and dropping water in hard-to-reach areas, assisting in firefighting efforts.\nThe initiative seeks to modernize environmental protection tactics and optimize emergency resources using advanced technology.","link":"https://www.ledauphine.com/politique/2026/08/08/des-drones-bombardiers-d-eau-pour-lutter-contre-les-incendies-l-innovante-proposition-d-un-depute","categoria":"INNOVATION","lang":"en"},{"fonte":"Ouest-France","pais":"France","titulo":"INTERVIEW. 'Eclipses have also contributed to science'","resumo":"In a fascinating interview, experts explain how solar and lunar eclipses were fundamental to historical scientific breakthroughs.\nFrom the proof of the theory of general relativity to the analysis of the solar atmosphere, these astronomical events reveal valuable data.\nThe discussion highlights the ongoing importance of space observation in answering major mysteries of the universe and modern physics.","link":"https://www.ouest-france.fr/sciences/entretien-les-eclipses-ont-aussi-contribue-a-la-science-cde8ca76-8c10-11f1-8f47-ec3d1e1ec01b","categoria":"SCIENCE","lang":"en"},{"fonte":"Top Santé","pais":"France","titulo":"Eating potatoes all summer long: What science really says about their health effects","resumo":"The daily consumption of potatoes throughout the summer season frequently sparks debates regarding nutrition and general health.\nRecent scientific studies analyze the tuber's impacts on the body, weighing its nutritional value against the risks of excessive consumption.\nThe analysis highlights the importance of healthy preparation methods and dietary balance to maintain the food's benefits.","link":"https://www.topsante.com/nutrition_et_recettes/nutrition/manger-des-pommes-de-terre-tout-lete-ce-que-la-science-dit-vraiment-sur-ses-effets-sur-la-sante-978046","categoria":"SCIENCE","lang":"en"},{"fonte":"franceinfo","pais":"France","titulo":"Sports Minister wants 'full' television broadcast of the women's Tour de France","resumo":"The French Sports Minister has publicly advocated for the full television broadcast of the women's Tour de France.\nThe measure aims to increase the visibility of women's cycling and promote gender equality in the coverage of major sporting events.\nThe proposal reflects a growing public demand for greater space and investment in women's sports categories in the country.","link":"https://www.franceinfo.fr/tour-de-france/femmes/la-ministre-des-sports-marina-ferrari-souhaite-une-diffusion-en-integralite-a-la-television-du-tour-de-france-femmes_8138579.html","categoria":"TRENDS","lang":"en"},{"fonte":"LPO (Ligue pour la Protection des Oiseaux)","pais":"France","titulo":"Public consultation on common pochard hunting: Science was ignored!","resumo":"A recent public consultation regarding the authorization of common pochard hunting has drawn sharp criticism from local scientists and environmentalists.\nExperts claim that the political decision disregarded scientific data concerning the population decline and extinction threat facing the species.\nThe debate highlights the constant tension between hunting interests and science-based biodiversity preservation.","link":"https://www.lpo.fr/qui-sommes-nous/toutes-nos-actualites/articles/actus-2026/consultation-publique-sur-la-chasse-du-fuligule-milouin-la-science-ignoree","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"TelegraphHerald.com","pais":"England","titulo":"Photos show how new technologies help keep one of Europe's last bell foundries alive in Austria","resumo":"A traditional bell foundry in Austria is turning to modern technology to preserve a centuries-old art.\nThrough the integration of new technological tools, artisans are able to optimize complex production processes.\nThe initiative demonstrates how innovation can go hand in hand with cultural and historical preservation on the continent.","link":"https://www.telegraphherald.com/ap/business/image_e8721df6-b4ba-5e6a-9973-69d70e2556d6.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Yahoo Finance UK","pais":"England","titulo":"Standard Engineering Technology Ltd earnings call highlights: Record first-quarter results","resumo":"Standard Engineering Technology announced standout financial results during its recent earnings presentation.\nThe company posted record-breaking figures driven by strong performance in its engineering and innovation divisions.\nThe consolidated data reflects a solid growth trajectory in the global applied technology market.","link":"https://uk.finance.yahoo.com/news/standard-engineering-technology-ltd-nse-030348208.html","categoria":"BUSINESS","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Scientists launch OnlyFans account for marmots to fund research","resumo":"Researchers have found an unusual and viral way to raise funds for the conservation and study of marmots.\nThe team created an OnlyFans profile dedicated exclusively to sharing videos and photos of these animals' daily lives in the wild.\nThe innovative initiative aims to engage the public and secure the necessary funding for the continuation of their scientific work.","link":"https://www.theguardian.com/science/video/2026/aug/07/scientists-onlyfans-marmots-video","categoria":"SCIENCE","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Man secretly photographed by someone wearing smart glasses sparks privacy debate","resumo":"The growing use of smart glasses in public places has reignited urgent discussions about the right to privacy.\nA man reported the discomfort of being photographed without authorization by a virtually imperceptible device.\nThe incident highlights the ethical and regulatory challenge brought by new wearable technologies that record without consent.","link":"https://www.theguardian.com/technology/2026/aug/08/ai-smartglasses-camera-film-privacy-consent","categoria":"PRIVACY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"One of sci-fi's greatest writers warned us about AI: Does he also hold the solution?","resumo":"The article analyzes historical warnings about the risks of artificial intelligence left by renowned science fiction authors.\nIn addition to grim predictions, works from that era also offer visions and ethical principles that can guide current development.\nExperts debate how these lessons from the past serve as a valuable guide to curb the potential excesses of modern AI.","link":"https://www.theguardian.com/technology/commentisfree/2026/aug/07/science-fiction-warned-us-about-an-ai-powered-dystopian-future-does-it-also-hold-the-remedy","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Sky Sports","pais":"England","titulo":"Jeremy Jacquet: Why Liverpool are ready to gamble on £60m French centre-back","resumo":"Liverpool is stepping up its interest in young French centre-back Jeremy Jacquet in a multi-million-pound deal.\nThe British club's coaching staff sees the athlete as the ideal profile to solidify their defensive system for the long term.\nThe potential transfer is shaking up the transfer market and generating great expectations among fans and football analysts.","link":"https://www.skysports.com/football/news/11669/13570137/jeremy-jacquet-why-liverpool-are-ready-to-put-their-faith-in-lb60m-france-centre-back","categoria":"SPORTS","lang":"en"},{"fonte":"El Diario Montañés","pais":"Spain","titulo":"Paloma Pérez-Ilzarbe: Regarding the eclipse: Ancient knowledge and modern science","resumo":"The article addresses the historical and contemporary relationship between solar eclipses, ancestral knowledge, and modern scientific advances.\nThe analysis highlights how past astronomical observations helped pave the way for our current scientific understanding of the cosmos.\nIt is a reflection on the evolution of human thought in the face of striking and transformative celestial phenomena.","link":"https://www.eldiariomontanes.es/opinion/paloma-perezilzarbe-proposito-eclipse-saberes-antiguos-ciencia-moderna-20260808074332-nt.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Radio Espinosa Merindades","pais":"Spain","titulo":"CyL Digital Olympics bring technology and robotics to youth in 14 municipalities of Castile and León","resumo":"The CyL Digital Olympics promote learning in technology and robotics among young people in 14 municipalities of the Castile and León region.\nThe initiative aims to encourage children's and teenagers' interest in science, technology, engineering, and math fields from an early age.\nThe event strengthens digital inclusion in local areas and prepares new generations for the challenges of the future technological market.","link":"https://radioespinosamerindades.es/sucesos/las-olimpiadas-cyl-digital-acercan-la-tecnologia-y-la-robotica-a-los-jovenes-de-14-municipios-de-castilla-y-leon/","categoria":"ROBOTICS","lang":"en"},{"fonte":"motor16.com","pais":"Spain","titulo":"Hispano Suiza Carmen Sagrera: How the Spanish Electric Hypercar's Invisible Technology Works","resumo":"The new Hispano Suiza Carmen Sagrera electric hypercar stands out for its integration of advanced engineering and aerodynamic technologies.\nThe Spanish manufacturer has developed invisible solutions to optimize the vehicle's high-performance handling, energy efficiency, and overall performance.\nThis launch reaffirms the prominent role of Spain's automotive industry in the luxury electric supercar segment.","link":"https://www.motor16.com/las-ultimas-noticias/hispano-suiza-carmen-sagrera/","categoria":"INNOVATION","lang":"en"},{"fonte":"La Vanguardia","pais":"Spain","titulo":"Science Continues to Chase the Lunar Shadow to Better Understand the Sun","resumo":"Scientists worldwide are taking advantage of solar eclipses to study the corona and the mysteries of the Sun's atmosphere with high precision.\nThe passage of the Moon's shadow creates ideal and unique conditions for capturing data that is difficult to obtain through traditional astronomical means.\nThis research helps provide a deeper understanding of solar behavior and the impact of space weather on Earth and satellites.","link":"https://www.lavanguardia.com/ciencia/20260808/11597390/ciencia-sigue-persiguiendo-sombra-lunar-entender-mejor-sol.html","categoria":"ASTRONOMY","lang":"en"},{"fonte":"Diario de Sevilla","pais":"Spain","titulo":"Kia Updates the XCeed with More Technology and Prices Starting at 19,860 Euros","resumo":"Kia has launched the updated XCeed crossover in the Spanish market, incorporating modern technological features and driving assistants.\nThe restyled model offers new connectivity and powertrain options with competitive pricing to attract consumers.\nThis refresh aims to solidify the vehicle's presence in the highly competitive compact utility segment with a strong digital appeal.","link":"https://www.diariodesevilla.es/motor/kia-actualiza-xceed-tecnologia-19_0_2007664340.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ABC","pais":"Spain","titulo":"Indra to Equip the Future Chania Airport with State-of-the-Art Technology","resumo":"Spanish company Indra has been selected to implement cutting-edge technological systems at the new international airport in Crete, Greece.\nThe project involves installing advanced solutions for air traffic management, security, and airport service automation.\nThis contract solidifies the company's global leadership in developing smart infrastructures for the aviation sector.","link":"https://www.abc.es/economia/indra-dotara-tecnologia-ultima-generacion-futuro-aeropuerto-20260807155420-nt.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Expansión","pais":"Spain","titulo":"Wall Street Learns to Love Blockchain Technology","resumo":"Major Wall Street financial institutions are increasingly adopting blockchain technology to streamline transactions and contractual processes.\nThis shift reflects a change in attitude within the traditional banking sector regarding distributed ledgers and digitalized assets.\nBlockchain integration improves transparency, reduces operational costs, and reshapes the global financial ecosystem.","link":"https://www.expansion.com/economia/financial-times/2026/08/07/6a75d51e468aeb135c8b4594.html","categoria":"BLOCKCHAIN","lang":"en"},{"fonte":"ciencia.gob.es","pais":"Spain","titulo":"Spanish Government to Provide Live Feed of the August 12 Total Solar Eclipse from the Yebes Observatory","resumo":"The Spanish government will broadcast the August 12 total solar eclipse live from the Yebes Astronomical Observatory.\nThe broadcast will feature two direct signal networks to allow the public to follow the phenomenon in an accessible and detailed manner.\nThe initiative aims to promote astronomical science and engage the population in one of the most anticipated celestial events of the year.","link":"https://www.ciencia.gob.es/Noticias/2026/agosto/gobierno-senales-institucionales-directo-eclipse-total-sol.html","categoria":"SCIENCE","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"Artificial Intelligence: OpenAI Seeks Stricter Monitoring of New AIs Following Hacking Incidents","resumo":"OpenAI has announced plans to step up monitoring and security for its new artificial intelligence models following recent hacking incidents. The move aims to curb growing cyber risks and ensure that cutting-edge technologies are not exploited by malicious actors. By doing so, the company seeks to establish stricter governance and data protection standards in the tech sector.","link":"https://www.sueddeutsche.de/wirtschaft/kuenstliche-intelligenz-openai-will-neue-ki-nach-hacking-vorfaellen-haerter-ueberwachen-dpa.urn-newsml-dpa-com-20090101-260808-930-500452","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"BILD","pais":"Germany","titulo":"Trump Wants to Turn the US Into a 'Mineral Superpower'","resumo":"The proposed plan aims to transform the United States into a powerhouse in the extraction of strategic minerals and natural resources. The initiative seeks to reduce international dependency and supply the growing technology and renewable energy industries. The announcement is sparking global debates on geopolitical security, industrial autonomy, and environmental impacts.","link":"https://www.bild.de/politik/ausland-und-internationales/trump-will-usa-zur-mineralien-supermacht-machen-6a76801035268e50270222ea","categoria":"TRENDS","lang":"en"},{"fonte":"FAZ","pais":"Germany","titulo":"German Economy: Export Record Despite Energy Crisis","resumo":"Despite facing the impacts of the energy crisis in Europe, Germany recorded a record volume in the value of its global exports. The result surprised analysts and demonstrated the resilience of the country's manufacturing and tech sectors. This performance reinforces the strong relevance of German industries in the international market amid economic uncertainty.","link":"https://www.faz.net/aktuell/wirtschaft/deutsche-wirtschaft-exportrekord-trotz-energiekrise-201105749.html","categoria":"BUSINESS","lang":"en"},{"fonte":"Spiegel","pais":"Germany","titulo":"Luisa Neubauer and Sepp Müller: How Can Climate Protection and the Economy Be Reconciled?","resumo":"A high-level debate brought together opposing views on how to reconcile economic development with strict climate protection goals. The focus was on transitioning to clean technologies without compromising the competitiveness of the European industrial sector. These discussions reflect the global challenge of accelerating decarbonization while ensuring market stability.","link":"https://www.spiegel.de/politik/deutschland/luisa-neubauer-und-sepp-mueller-cdu-wie-koennen-sich-klimaschutz-und-wirtschaft-vertragen-a-de09de2d-a85e-4f8a-be5c-d008428a9263","categoria":"SCIENCE","lang":"en"},{"fonte":"DIE ZEIT","pais":"Germany","titulo":"Economy: Germany Exported More Goods in June Than Ever Before","resumo":"Germany registered its highest volume of exported goods to foreign markets during the month of June. Growth was driven by high international demand for manufactured products and high-value-added tech goods. The data points to a dynamic period for the country's foreign trade despite global economic headwinds.","link":"https://www.zeit.de/wirtschaft/unternehmen/2026-08/deutsche-exporte-rekord-aussenhandel-waren-us-china-gxe","categoria":"BUSINESS","lang":"en"},{"fonte":"リアルサウンド","pais":"Japan","titulo":"Meisei Launches 'CORO', Smart Clothing Featuring Electronic Cooling Technology","resumo":"Meisei has introduced 'CORO', smart apparel equipped with electronic cooling technology that is immune to outside temperature variations.\nThe product was designed to provide constant thermal comfort and alleviate heat stress in extreme hot environments.\nThis innovation represents a significant advancement in the functional apparel and wearable technology sectors aimed at user well-being.","link":"https://realsound.jp/tech/2026/08/post-2485202.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"NEWSつくば","pais":"Japan","titulo":"City of Tsukuba Creates Fund to Support Social Implementation of Advanced Technologies","resumo":"The city of Tsukuba, recognized as one of Japan's leading scientific hubs, has announced the creation of a financial fund dedicated to technological acceleration.\nThe initiative aims to subsidize and support startups and research centers in the practical application of innovative solutions to everyday urban life.\nThrough this measu
