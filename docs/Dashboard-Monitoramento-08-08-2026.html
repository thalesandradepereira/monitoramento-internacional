re, the municipality strengthens its strategic role in the digital transformation and sustainable development of the country.","link":"https://newstsukuba.jp/62006/08/08/","categoria":"INNOVATION","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Asics Opens Concept Store in Shinjuku and Explains Surge in Demand for Athletic Goods","resumo":"Asics has opened the doors of its new flagship store in the bustling district of Shinjuku, highlighting high-performance products and design.\nIn an interview, the company's president addressed the reasons why athletic footwear and apparel have gained so much traction in modern lifestyles.\nThis movement reflects a growing consumer trend prioritizing health, wellness, and functional fashion among urban consumers.","link":"https://news.yahoo.co.jp/articles/dc48e5c0046984856077260b06847d74321ffd1a","categoria":"TRENDS","lang":"en"},{"fonte":"NHKニュース","pais":"Japan","titulo":"Shizuoka Company Develops New Technology for Simultaneous Extraction of Plant Nutrients","resumo":"A company based in Shizuoka Prefecture has created an unprecedented technology capable of simultaneously extracting nutrients and plant-based raw materials.\nThe method drastically optimizes the reuse of biological resources, increasing efficiency and reducing industrial waste.\nThis innovation promises to make a major positive impact on the pharmaceutical, food, and sustainable cosmetics industries.","link":"https://news.web.nhk/newsweb/na/nb-3030033105","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"ニュースイッチ by 日刊工業新聞社","pais":"Japan","titulo":"Prodrone and Toshiba Launch Technical Partnership to Develop Domestic Interception Drones","resumo":"Prodrone and Toshiba have announced a strategic alliance aimed at developing interception drones manufactured entirely in Japan.\nThe collaboration combines aerospace engineering expertise with Toshiba's advanced processing and intelligence systems.\nThe project seeks to strengthen technological sovereignty and national security in the face of rising unidentified aerial threats.","link":"https://newswitch.jp/p/49912","categoria":"DEFENSE","lang":"en"},{"fonte":"毎日新聞","pais":"Japan","titulo":"Ehime University Develops Paper Filter Capable of Analyzing Blood with a Single Drop","resumo":"Researchers at Ehime University have created a paper-based filter technology that enables medical exams to be performed using just a single drop of blood.\nThe device drastically reduces the discomfort and cost of tests, while simplifying diagnosis in resource-limited regions.\nThis innovation represents a major breakthrough for preventive medicine and the democratization of healthcare access.","link":"https://mainichi.jp/articles/20260808/ddl/k38/100/107000c","categoria":"SCIENCE","lang":"en"},{"fonte":"Vietnam.vn","pais":"China","titulo":"Central Military Hospital 108 Applies Artificial Intelligence and Electric Fields to Rehabilitation","resumo":"Central Military Hospital 108 has implemented an innovative rehabilitation system that combines high-voltage electric field technology with artificial intelligence. The solution aims to optimize therapeutic procedures and accelerate the recovery of patients with motor and neurological disorders. The advancement highlights the growing role of machine learning in modern medicine and the personalization of clinical treatments.","link":"https://www.vietnam.vn/pt/benh-vien-trung-uong-quan-doi-108-ung-dung-cong-nghe-dien-truong-cao-ap-tich-hop-ai-trong-phuc-hoi-chuc-nang","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"人民网-图片频道","pais":"China","titulo":"Research Vessel \"Kexue\" Completes Western Pacific Expedition and Returns to Qingdao","resumo":"The oceanic research vessel \"Kexue\" has successfully returned to the port of Qingdao after completing an important scientific investigation mission in the Western Pacific Ocean. During the expedition, researchers collected crucial ecological and geological data to understand the impacts of global climate change. The mission reinforces China's scientific leadership in deep-sea oceanography studies and marine ecosystem preservation.","link":"http://pic.people.com.cn/n1/2026/0808/c1016-40776094.html","categoria":"SCIENCE","lang":"en"},{"fonte":"chinanews.com.cn","pais":"China","titulo":"Greater Bay Area Low-Altitude Economy Alliance Delegation Visits Indonesia","resumo":"A delegation from the Greater Bay Area Low-Altitude Economy Alliance has conducted an official visit to Indonesia to explore opportunities for international cooperation. The focus of the meeting included the development of ecosystems for unmanned aerial vehicles and urban air mobility in Southeast Asia. The initiative seeks to expand commercial borders and standardizations for low-altitude aviation technologies in the region.","link":"https://www.chinanews.com.cn/dwq/2026/08-08/10674082.shtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Tatler Asia","pais":"China","titulo":"Christel Buchanan, Founder of ChatAndBuild: The Future of Technology Can Be Created by Anyone","resumo":"The founder of the ChatAndBuild platform advocates for the democratization of software development and artificial intelligence for the general public. According to the executive, new no-code and AI-driven tools are eliminating technical barriers to creating digital solutions. This shift radically expands the participation of non-programmers in building the technological ecosystems of the future.","link":"https://www.tatlerasia.com/power-purpose/innovation/chatandbuild-founder-christel-buchanan-on-who-build-the-next-big-app-pt","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"7th International Conference on Flexible Electronics Held in Jiaxing","resumo":"The city of Jiaxing hosted the seventh edition of the International Conference on Flexible Electronics Technologies, bringing together industry experts and global leaders. The event discussed innovations in foldable circuits, wearable sensors, and new materials applicable to healthcare and mobile devices. Discussions highlighted the transition of these technologies from the laboratory phase to large-scale industrial production.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569515.shtm","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"International Congress of Basic Science Opens Preparations in Beijing","resumo":"Huairou District in Beijing is preparing to host the prestigious 2026 International Congress of Basic Science. The event will bring together prominent mathematicians, physicists, and computer scientists to discuss fundamental theoretical discoveries. The conference aims to encourage international cooperation and drive frontier research in advancing global scientific knowledge.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569514.shtm","categoria":"SCIENCE","lang":"en"},{"fonte":"山东省科学技术厅","pais":"China","titulo":"Researcher Tang Bo Develops Cellular Illumination Probe for Medical Diagnosis Breakthroughs","resumo":"Scientist Tang Bo presented the results of his research into developing a molecular probe capable of precise illumination of cellular structures. The technology allows biological processes to be visualized at the nanometric level, aiding in the early detection of serious diseases such as cancer. The innovation reflects integrated efforts between universities and the health sectors to accelerate the clinical application of cutting-edge research.","link":"http://kjt.shandong.gov.cn/art/2026/8/7/art_13364_10326562.html","categoria":"SCIENCE","lang":"en"},{"fonte":"山东省科学技术厅","pais":"China","titulo":"Cui Hongzhi Creates Custom Protective Coatings for Large-Scale Industrial Equipment","resumo":"Researcher Cui Hongzhi highlighted advancements in materials science focused on developing high-strength coatings for critical industrial equipment. The new solutions function as custom armor that extends lifespan and withstands extreme operating conditions. The technology represents a milestone for heavy engineering and strengthens the technological self-sufficiency of the national industry.","link":"http://kjt.shandong.gov.cn/art/2026/8/7/art_13364_10326560.html","categoria":"SCIENCE","lang":"en"},{"fonte":"The New Indian Express","pais":"India","titulo":"Odisha and MP Sign Memorandum of Understanding for Clean Energy Technology Transfer","resumo":"The Indian states of Odisha and Madhya Pradesh have signed a strategic memorandum of understanding aimed at the transfer of clean energy technologies.\nThe partnership seeks to accelerate the sustainable energy transition in the region, promoting technical innovation and the development of ecological infrastructures.\nThe agreement strengthens internal government cooperation to tackle climate challenges and boost the country's renewable matrix.","link":"https://www.newindianexpress.com/states/odisha/2026/Aug/08/odisha-mp-sign-mou-for-clean-energy-technology-transfer","categoria":"CLEAN ENERGY","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"Three Indian Weightlifters Selected for Commonwealth Games Accept Doping Suspensions","resumo":"Three Indian weightlifters previously selected for the Commonwealth Games have accepted sanctions and suspensions for anti-doping rule violations.\nThe decision represents a heavy blow to the country's sports delegation and raises a red flag regarding athlete integrity in international competitions.\nThe case underscores the intensification of oversight and the rigor in enforcing global sports regulations.","link":"https://timesofindia.indiatimes.com/sports/more-sports/others/three-cwg-selected-lifters-accept-doping-bans/articleshow/133045156.cms","categoria":"SPORTS","lang":"en"},{"fonte":"NDTV","pais":"India","titulo":"What Happens to the Indian Economy if Gen Z Never Buys a House?","resumo":"An analysis of socioeconomic changes in India points to the impacts on the real estate market and financial sector if Generation Z chooses not to purchase properties.\nThis shift in cultural behavior prioritizes flexibility and service consumption over the accumulation of traditional assets.\nThe phenomenon could redefine investment models, credit standards, and the dynamics of national economic growth in coming years.","link":"https://www.ndtv.com/india-news/gen-z-never-buy-house-demand-india-economy-real-estate-11879027","categoria":"TRENDS","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"Prime Minister Modi Inaugurates Micron Technology Semiconductor Facility in Sanand, Gujarat","resumo":"Prime Minister Narendra Modi inaugurated Micron Technology's new semiconductor assembly and test facility in the city of Sanand, in Gujarat state.\nThe initiative marks a historic milestone in transforming India into a global hub for microchip manufacturing and high technology.\nThe project promises to attract billions in investments, generate thousands of skilled jobs, and strengthen the global technology supply chain.","link":"https://newsonair.gov.in/pm-modi-to-inaugurate-micron-technologys-state-of-the-art-semiconductor-atmp-facility-in-gujarat/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"CNBC TV18","pais":"India","titulo":"Kaynes Technology First-Quarter Results Miss Estimates; Net Profit Falls 24% Despite 41% Revenue Rise","resumo":"Indian electronics manufacturing firm Kaynes Technology posted a 24% drop in its net profit for the first quarter, disappointing financial market expectations.\nAlthough the company's revenue showed an expressive growth of 41%, the increase in operating costs negatively impacted profit margins.\nThe results ignite debates over the challenges of profitability and scale in India's heated technology sector.","link":"https://www.cnbctv18.com/market/stocks/kaynes-technology-share-price-q1-falls-short-of-estimates-net-profit-drops-24-despite-41-revenue-growth-19964521.htm","categoria":"BUSINESS","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"Sports Minister Honors Indian Athletes of the 2026 Commonwealth Games with Cash Prizes","resumo":"India's Sports Minister paid official tribute and awarded financial rewards to the country's standout athletes for the 2026 Commonwealth Games.\nThe initiative aims to encourage high performance and offer continuous financial support for the athletes' preparation in major international competitions.\nThe announcement reinforces the government's commitment to valuing athletic talent and promoting national sports.","link":"https://newsonair.gov.in/sports-minister-felicitates-indian-athletes-of-cwg-2026-with-cash-rewards/","categoria":"SPORTS","lang":"en"},{"fonte":"Diário de Notícias","pais":"Portugal","titulo":"From Bad Omens to Pregnant Women: Science Explains Eclipse Myths","resumo":"The approach of a solar eclipse rekindles old beliefs and popular superstitions spread throughout history. Science demystifies common fears, such as alleged risks for pregnant women and theories about catastrophic events. Experts reinforce the importance of understanding the astronomical event based on scientific facts. The article clarifies the real precautions needed, focusing on proper eye protection during observation.","link":"https://www.dn.pt/ciencia/dos-maus-pressgios-s-grvidas-os-mitos-sobre-os-eclipses-explicados-pela-cincia","categoria":"SCIENCE","lang":"en"},{"fonte":"Tek Notícias","pais":"Portugal","titulo":"If the Technology Is Available, Why Is Work Still So Hard?","resumo":"Despite the rapid advancement of artificial intelligence and digital tools, the daily professional routine remains exhausting. Experts analyze how information overload and a lack of integration between systems generate productivity bottlenecks. Instead of simplifying, the excess of new platforms often demands more adaptation and management time from workers. The debate offers reflections on how to restructure the corporate ecosystem so that innovation truly optimizes time.","link":"https://tek.sapo.pt/opiniao/artigos/se-a-tecnologia-esta-la-porque-e-que-o-trabalho-continua-tao-dificil/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Jornal SOL","pais":"Portugal","titulo":"Can You Roll Your Tongue Into a U Shape? Science Explains What the Gesture Reveals About the Brain","resumo":"The ability to roll one's tongue into a U shape is often associated with genetics, but the mechanism is more complex. Scientific studies indicate that fine motor control of the tongue involves specific neural connections and brain plasticity. The capacity combines hereditary factors with practical learning throughout human development. The discovery helps neuroscientists better understand the evolution of language and cerebral motor circuits.","link":"https://sol.iol.pt/vida/noticias/consegue-dobrar-a-lingua-em-u-a-ciencia-explica-o-que-este-gesto-revela-sobre-o-cerebro/20260807/6a75f2880cf2b42132dbd172","categoria":"SCIENCE","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Ministry of Education, Science, and Innovation Releases Data on Applications","resumo":"Portugal's Ministry of Education, Science, and Innovation has published updated reports on application processes. The data highlights the demand for courses in science, technology, engineering, and mathematics in higher education. This outlook reflects students' growing interest in careers geared toward technological development and research. The initiative aims to guide public policies to strengthen academic training and meet market demands.","link":"https://sapo.pt/artigo/o-ministerio-da-educacao-ciencia-e-inovacao-divulgou-os-dados-relativos-as-can-6a75febd93e2ef3921d98de7","categoria":"INNOVATION","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"Third Batch of Free Eclipse Glasses Sells Out in Minutes","resumo":"The rush to view the upcoming solar eclipse caused a new batch of protective eyewear to sell out rapidly. The high demand highlights the population's enormous interest in the astronomical phenomenon and safe observation. Authorities and astronomers warn of the dangers of looking directly at the Sun without using proper filters. New distributions are being planned to ensure more people can safely follow the event.","link":"https://www.publico.pt/2026/08/07/ciencia/noticia/terceira-leva-oculos-gratuitos-eclipse-voltou-esgotarse-minutos-2184372","categoria":"TRENDS","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"US Economy Loses 23,000 Jobs in July","resumo":"The US job market recorded an unexpected setback with the loss of 23,000 jobs in July. The result signals a slowdown in economic activity amid inflationary pressures and high interest rates. The technology and services sectors were directly impacted, raising a red flag for global financial analysts. This indicator is expected to influence upcoming monetary policy decisions in the coming months.","link":"https://expresso.pt/emprego/2026-08-07-economia-norte-americana-perde-23.000-postos-de-trabalho-em-julho-450f55f6","categoria":"BUSINESS","lang":"en"},{"fonte":"The Portugal News","pais":"Portugal","titulo":"Minister of Economy Defends Regulated Integration and Guarantees Fast-Track Channel for Immigrants","resumo":"The Portuguese government has presented new guidelines for attracting and regulating foreign labor in the country. The plan includes the creation of a fast-track channel focused on supplying the shortage of workers in strategic sectors. The measure seeks to balance economic market needs with the social and legal inclusion of immigrants. The debate reflects a European trend of reshaping migration policies to boost national competitiveness.","link":"https://www.theportugalnews.com/br/noticias/2026-08-07/ministro-da-economia-defende-a-integracao-regulamentada-e-garante-um-canal-rapido-para-imigrantes/1067365","categoria":"TRENDS","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
