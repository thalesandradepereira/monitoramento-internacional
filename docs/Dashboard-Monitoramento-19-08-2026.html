a-que-criou-caes-robos-chineses-vendidos-no-mundo-todo.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ロイター","pais":"China","titulo":"World Robot Conference in Beijing Focuses on Product Economic Viability","resumo":"This year's edition of the World Robot Conference, held in Beijing, focused centrally on the transition from laboratory prototypes to commercial viability.\nExhibitors and experts emphasized the need to reduce production costs to accelerate the adoption of industrial and service robots in the market.\nThe event reflects China's strategy to turn technological innovations into accessible solutions with high economic impact.","link":"https://jp.reuters.com/world/us/E5D7VFMV7RKOLLPM2Y7W5DJSVY-2026-08-19/","categoria":"EVENTS","lang":"en"},{"fonte":"中国科学院","pais":"China","titulo":"Next-Generation Combustion Catalyst Reaches Industrial Application in China","resumo":"Chinese scientists have successfully implemented a new noble metal-free combustion catalyst at an industrial demonstration scale.\nThe innovation replaces expensive elements like platinum and palladium with more abundant and sustainable alternatives, reducing costs and pollutant emissions.\nThe breakthrough represents a major step toward self-sufficiency and ecological transition in the industrial chemical and energy sectors.","link":"https://www.cas.cn/cm/202608/t20260819_5118586.shtml","categoria":"INNOVATION","lang":"en"},{"fonte":"chinanews.com.cn","pais":"China","titulo":"Innovative Chinese Medicines Enter Global Market via Technology Licensing","resumo":"China's pharmaceutical industry is consolidating a new phase of global expansion through patent licensing deals with multinational healthcare giants.\nThe transition from generic products to innovative biopharmaceutical drugs has been attracting billions of dollars in international agreements.\nThis dynamic reinforces the country's growing role as a hub for high-tech generation and life sciences innovation.","link":"https://www.chinanews.com.cn/gsztc/2026/08-19/10680012.shtml","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"CAS Space Explores New Paths for Commercial Astronautics Development","resumo":"Space transportation company CAS Space is implementing an innovative development model to accelerate the manufacturing of commercial rockets in China.\nThe strategy combines state resources and guidance with the agility of the private sector to expand the country's space fleet.\nThe project aims to strengthen the commercial space ecosystem at the start of the technological innovation five-year plan.","link":"https://www.stdaily.com/web/2026-08/19/content_565951.html","categoria":"AEROSPACE","lang":"en"},{"fonte":"TradingView","pais":"India","titulo":"Charles Schwab Aims to Expand Workforce at Its India Technology Center to 2,000 by 2027","resumo":"American financial giant Charles Schwab plans to significantly expand the presence of its technology center located in India.\nThe company's goal is to increase the number of local employees to 2,000 professionals by the year 2027.\nThis initiative aims to bolster global technology infrastructure and optimize the development of digital platforms.\nThe move solidifies India as one of the primary talent and innovation hubs for software engineering in the financial sector.","link":"https://br.tradingview.com/news/reuters.com,2026:newsml_L1N44G05T:0/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ThePrint","pais":"India","titulo":"AI and Quantum Technology to Power Next-Gen Satellites and India's National Security, Say ISRO Experts","resumo":"Experts from the Indian Space Research Organisation (ISRO) highlighted the integration of artificial intelligence and quantum computing in satellite development.\nThe announcement was made during the National Space Technology Conclave 2026, emphasizing the relevance of these innovations to the nation's defense and surveillance.\nThe adoption of these emerging technologies seeks to modernize orbital data collection and strengthen national strategic infrastructure.\nThe initiative positions India at the vanguard of the global technological space race, promoting greater sovereignty in security.","link":"https://theprint.in/ani-press-releases/ai-quantum-tech-to-power-indias-next-gen-satellites-and-strengthen-national-security-isro-experts-at-national-space-technology-conclave-2026/3018931/","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"Mid-Day","pais":"India","titulo":"IIT Bombay Launches e-PG Diploma in Computer Science and AI Amid Rising Demand for Tech Skills","resumo":"The prestigious Indian Institute of Technology Bombay (IIT Bombay) has announced the creation of a new online postgraduate program in Computer Science and Artificial Intelligence.\nThe initiative responds to the growing global market demand for skilled professionals in advanced technologies and automation.\nThe course will offer flexibility for engineers and industry professionals seeking to upgrade their technical competencies without interrupting their careers.\nThrough this, the institution contributes directly to training talent aligned with the needs of digital transformation on a global scale.","link":"https://www.mid-day.com/mumbai/mumbai-news/article/mumbai-iit-bombay-offers-e-pg-diploma-in-computer-science-and-ai-amid-growing-demand-for-ai-skills-23645472","categoria":"EDUCATION","lang":"en"},{"fonte":"Business Standard","pais":"India","titulo":"L\u0026T Technology Services Secures Deal Exceeding $75 Million with Global Tech Firm","resumo":"Indian firm L\u0026T Technology Services announced the acquisition of a major contract valued at over 75 million dollars with a global technology giant.\nThe agreement involves the provision of specialized digital engineering services and cutting-edge tech solutions to the client.\nThe win reinforces the strong competitive position of Indian IT companies in the international corporate market.\nIn addition to accelerating the company's growth, the project boosts the reputation of India's innovation and engineering ecosystem abroad.","link":"https://www.business-standard.com/companies/news/l-t-technology-services-wins-75-million-plus-deal-from-global-tech-firm-126081900133_1.html","categoria":"BUSINESS","lang":"en"},{"fonte":"ThePrint","pais":"India","titulo":"Impact of Institutional Policies on the Indian Economy Gains New Evidence","resumo":"New data and economic analyses bring evidence regarding the effects of Prime Minister Narendra Modi's government reforms and policy decisions on the country's institutions.\nExperts and economists are evaluating how these transformations directly affect investor confidence and local market stability.\nThe debate puts into perspective the structural challenges to sustaining economic growth and attracting foreign capital.\nThe conclusions reinforce the importance of institutional autonomy to ensure a predictable and prosperous business environment in India.","link":"https://theprint.in/opinion/modi-india-governance-economic-growth-study/3018487/","categoria":"ECONOMY","lang":"en"},{"fonte":"The Hindu","pais":"India","titulo":"National Sports Awards 2025 Announced; Divya Deshmukh and Gayatri Gopichand Among Arjuna Award Honorees","resumo":"The Indian government has revealed the winners of the prestigious National Sports Awards 2025, honoring the country's most prominent athletes.\nA total of 17 sports personalities have been selected to receive the coveted Arjuna Award, including standout talents such as Divya Deshmukh and Gayatri Gopichand.\nThe awards recognize exceptional performance, dedication, and achievements of sports figures across various disciplines.\nThe event celebrates the growth of Indian sports on the international stage and inspires new generations of athletes nationwide.","link":"https://www.thehindu.com/sport/arjuna-awards-full-list-national-sports-awards-2025-announced/article71359526.ece","categoria":"SPORTS","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Seguro Promulgates Decree Allowing Government to Extend SIFIDE II","resumo":"The President of the Republic has promulgated the legislative decree granting the government authorization to extend the validity of SIFIDE II.\nThis tax incentive system actively supports corporate research and development, strengthening innovation throughout the country.\nThe measure ensures the continuity of private investments in science and technology, providing greater legal predictability for businesses.","link":"https://24noticias.sapo.pt/economia/artigos/seguro-promulga-diploma-que-permite-ao-governo-estender-o-sifide-ii","categoria":"TAX INCENTIVES","lang":"en"},{"fonte":"tnews.pt","pais":"Portugal","titulo":"IAG Invests Over 16 Million Euros in Hybrid-Electric Aircraft Technology","resumo":"International Airlines Group (IAG) has announced an investment of over 16 million euros in the development of hybrid-electric technologies.\nThe goal of the initiative is to accelerate the energy transition of commercial aviation and significantly reduce the sector's carbon emissions.\nThis focus on alternative propulsion systems aims to drive sustainability on future short- and medium-haul airline routes.","link":"https://tnews.pt/iag-investe-mais-de-16-milhoes-de-euros-em-tecnologia-hibrido-eletrica-para-avioes/","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"sol.iol.pt","pais":"Portugal","titulo":"Mother Tattoos Keyboard on Arm So Autistic Son Can Communicate Anywhere","resumo":"To ensure constant communication with her non-verbal autistic son, a mother decided to tattoo an alphabetic keyboard directly onto her arm.\nThis alternative solution was created to avoid relying exclusively on tablets and electronic devices, which can run out of battery or break.\nThis inspiring gesture has gone viral on social media for offering an accessible, durable, and affectionate method of inclusion for individuals with complex speech needs.","link":"https://sol.iol.pt/internacional/noticias/mae-tatua-teclado-no-braco-para-que-o-filho-autista-possa-comunicar-em-qualquer-lugar-nao-posso-limita-lo-a-tecnologia/20260818/6a84856f0cf2f6a1a1e74556","categoria":"TRENDING","lang":"en"},{"fonte":"PCGuia","pais":"Portugal","titulo":"Maker Faire Debuts in Porto This September Featuring Workshops, Science, and Robotics","resumo":"The renowned international invention and creativity fair, Maker Faire, will hold its first-ever edition in the city of Porto this September.\nThe event will bring together DIY culture enthusiasts, researchers, and inventors with a schedule packed with hands-on workshops.\nThe initiative aims to connect the public with essential topics such as science, robotics, and technology through interactive and collaborative experiences.","link":"https://www.pcguia.pt/2026/08/maker-faire-estreia-se-no-porto-em-setembro-com-workshops-ciencia-e-robotica/","categoria":"EVENTS","lang":"en"},{"fonte":"publico.pt","pais":"Portugal","titulo":"Funds Reach Centers Connecting Science and Business; Lisbon and Algarve Left Out","resumo":"New funding aimed at strengthening the bridge between scientific research and the business sector has begun distribution in Portugal.\nThe financing benefits several technological innovation centers across the country, seeking to accelerate the transfer of knowledge to the market.\nHowever, the regions of Lisbon and the Algarve were excluded from this round of grants due to regional resource eligibility rules.","link":"https://www.publico.pt/2026/08/18/ciencia/noticia/verbas-chegam-centros-ligam-ciencia-empresas-lisboa-algarve-ficam-2185084","categoria":"SCIENCE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
