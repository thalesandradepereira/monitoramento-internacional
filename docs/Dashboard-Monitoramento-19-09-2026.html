  const data = [{"fonte":"O GLOBO","pais":"Brasil","titulo":"Google se junta à OpenAI, Anthropic e Meta na divulgação de invasões relacionadas à IA","resumo":"As principais empresas de inteligência artificial firmaram uma aliança inédita para compartilhar informações sobre incidentes de segurança e ciberataques. A iniciativa busca fortalecer o ecossistema de tecnologia ao antecipar vulnerabilidades em modelos generativos de IA. A cooperação reflete a preocupação do setor com o crescimento de ameaças cibernéticas cada vez mais complexas no ambiente digital.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/18/google-se-junta-a-openai-a-anthropic-e-a-meta-na-divulgacao-de-invasoes-relacionadas-a-ia.ghtml","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"Medscape","pais":"Brasil","titulo":"Corpos doados à ciência estão ajudando a treinar inteligência artificial","resumo":"Pesquisadores estão utilizando dados de cadáveres doados à ciência para aprimorar o treinamento de modelos e simulações digitais na área de saúde. O avanço tecnológico promete revolucionar procedimentos cirúrgicos, estudos anatômicos e diagnósticos médicos por meio de inteligência artificial. A prática levanta discussões importantes sobre ética no uso de dados biológicos para a evolução de tecnologias computacionais.","link":"https://portugues.medscape.com/viewarticle/corpos-doados-%C3%A0-ci%C3%AAncia-est%C3%A3o-ajudando-2026a1000yw9","categoria":"CIÊNCIA E IA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Governador da Califórnia propõe 'botão de desligamento' para inteligência artificial","resumo":"Um projeto de lei na Califórnia propõe a criação de mecanismos obrigatórios de interrupção de emergência para sistemas avançados de inteligência artificial. A medida pretende criar travas de segurança rigorosas para evitar potenciais riscos catastróficos decorrentes de modelos autônomos fora de controle. O debate expõe as divergências entre órgãos reguladores e grandes empresas de tecnologia do Vale do Silício.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/18/governador-da-california-propoe-um-botao-de-desligamento-para-a-ia-para-tentar-controlar-o-setor-de-tecnologia.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Discord mantém brecha para transmissões ao vivo no Brasil mesmo após ordem de suspensão","resumo":"A plataforma de comunicação Discord enfrenta questionamentos no Brasil por permitir que usuários continuem realizando transmissões ao vivo apesar de ordens judiciais. O descumprimento de medidas regulatórias reacendeu discussões sobre a responsabilidade das redes sociais quanto ao controle de conteúdo. Órgãos de fiscalização monitoram o impacto das brechas operacionais na segurança dos usuários brasileiros.","link":"https://g1.globo.com/tecnologia/noticia/2026/09/19/discord-mantem-brecha-para-transmissoes-ao-vivo-no-brasil-mesmo-apos-ordem-de-suspensao.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Tóquio testa robôs coletores de lixo na estação de trem mais movimentada do mundo","resumo":"A capital japonesa iniciou testes operacionais com robôs autônomos para recolhimento e triagem de resíduos na movimentada Estação de Shinjuku. Equipados com sensores avançados e inteligência artificial, os robôs auxiliam na manutenção da limpeza em áreas de altíssimo fluxo de pedestres. O projeto experimental busca mitigar a escassez de mão de obra e modernizar a gestão de serviços urbanos na metrópole.","link":"https://g1.globo.com/tecnologia/noticia/2026/09/18/video-toquio-testa-robos-coletores-de-lixo-na-estacao-de-trem-mais-movimentada-do-mundo.ghtml","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Disney nomeia executivo de IA como seu primeiro diretor de tecnologia","resumo":"A Walt Disney Company anunciou a contratação de um especialista em inteligência artificial para liderar a sua divisão de tecnologia e inovação digital. A estratégia visa integrar ferramentas de inteligência artificial generativa na produção de conteúdos, animações e experiências nos parques temáticos. A decisão marca uma mudança significativa no setor de entretenimento rumo à automação e personalização.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/18/disney-nomeia-executivo-de-ia-como-seu-primeiro-diretor-de-tecnologia.ghtml","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"UOL Economia","pais":"Brasil","titulo":"CEO do UOL afirma que as decisões humanas, e não a IA, redefinirão as empresas","resumo":"Em evento sobre transformação digital, o líder do UOL destacou a relevância do julgamento humano frente ao avanço acelerado da inteligência artificial. Para o executivo, embora a IA ofereça ganhos operacionais expressivos, a estratégia corporativa e a governança ética dependem fundamentalmente das pessoas. O posicionamento contrasta com visões extremas sobre a substituição total de processos por automação digital.","link":"https://economia.uol.com.br/noticias/redacao/2026/09/18/ceo-do-uol-nao-e-a-ia-que-vai-redefinir-sua-empresa-sao-suas-decisoes.htm","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Rádio Itatiaia","pais":"Brasil","titulo":"Prêmio reconhece pesquisas científicas sobre impactos da mudança do clima na economia brasileira","resumo":"Uma premiação de destaque acadêmico celebrou estudos voltados à análise das consequências econômicas da crise climática no Brasil. As pesquisas premiadas apontam caminhos baseados em ciência para mitigar prejuízos no agronegócio, na infraestrutura e na matriz energética nacional. A iniciativa reforça a urgência de integrar dados científicos às decisões de planejamento econômico e ambiental.","link":"https://www.itatiaia.com.br/meio-ambiente/premio-reconhece-pesquisas-cientificas-sobre-impactos-da-mudanca-do-clima-na-economia-brasileira/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"G1","pais":"Estados Unidos","titulo":"Governador da Califórnia assina decreto para estudar 'interruptor de emergência' para IA","resumo":"O governador da Califórnia assinou uma nova medida executiva voltada para a segurança e regulamentação da inteligência artificial no estado. A iniciativa visa avaliar a viabilidade técnica de mecanismos de desligamento de emergência em sistemas de IA de grande porte. A decisão reflete a crescente preocupação global em manter o controle humano sobre tecnologias autônomas e mitigar riscos catastróficos.","link":"https://g1.globo.com/tecnologia/noticia/2026/09/18/governador-california-decreto-ia.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"The Guardian","pais":"Estados Unidos","titulo":"OpenAI é 'hackeada eticamente' com a ajuda do chatbot Claude da Anthropic","resumo":"Pesquisadores de segurança utilizaram o chatbot Claude, desenvolvido pela Anthropic, para realizar uma invasão ética nos sistemas da OpenAI. O experimento demonstrou como ferramentas de inteligência artificial podem ser aplicadas para identificar vulnerabilidades de código de forma automatizada. A descoberta acendeu alertas na indústria sobre o uso dúbio da tecnologia em ciberataques e defesas digitais.","link":"https://www.theguardian.com/technology/2026/sep/18/openai-hacked-anthropic-claude-chatbot","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"ScienceDaily","pais":"Estados Unidos","titulo":"Cientistas descobrem células que 'enganam a morte' e reconstroem tecidos danificados","resumo":"Uma equipe de pesquisadores identificou um tipo celular capaz de resistir à morte celular programada e regenerar tecidos corporais severamente afetados. A descoberta abre novos caminhos para a medicina regenerativa e tratamentos inovadores contra lesões graves e doenças degenerativas. A capacidade surpreendente dessas células pode revolucionar terapias de cicatrização e longevidade no futuro.","link":"https://www.sciencedaily.com/releases/2026/09/260917003722.htm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"USRA","pais":"Estados Unidos","titulo":"USRA contribui com conhecimento em ciência planetária para modelo lunar da NASA e IBM","resumo":"A Universities Space Research Association uniu forças com a NASA e a IBM no desenvolvimento de um modelo foundation focado em dados lunares. A parceria pretende utilizar inteligência artificial para mapear a superfície da Lua e analisar informações geológicas essenciais para futuras missões. O projeto promete acelerar a análise científica e otimizar os preparativos para o retorno do ser humano ao satélite.","link":"https://newsroom.usra.edu/usra-contributes-planetary-science-expertise-to-nasa-ibm-lunar-foundation-model/","categoria":"EXPLORAÇÃO ESPACIAL","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"Missão XRISM da NASA e JAXA observa pulsar capturando 'vento' de estrela companheira","resumo":"O satélite XRISM, fruto de uma colaboração entre a NASA e a agência espacial japonesa JAXA, capturou dados inéditos de um pulsar distante. A observação detalhou a forma como essa estrela de nêutrons atrai e consome os ventos estelares emitidos por sua estrela companheira. Os resultados oferecem uma visão sem precedentes sobre a física extrema e a evolução de sistemas estelares binários.","link":"https://science.nasa.gov/missions/xrism/xrism-sees-pulsar-gathering-companions-wind/","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"The Walt Disney Company","pais":"Estados Unidos","titulo":"The Walt Disney Company nomeia Karandeep Anand para o novo cargo de Diretor de Tecnologia","resumo":"A Walt Disney Company anunciou Karandeep Anand, ex-executivo da Meta e da Microsoft, como o primeiro Diretor de Tecnologia global do grupo. Ele será responsável por supervisionar a infraestrutura de TI, além de liderar iniciativas de inovação em inteligência artificial e plataformas de streaming. A contratação sinaliza uma reestruturação estratégica no conglomerado de entretenimento para acelerar sua transformação digital.","link":"https://thewaltdisneycompany.com/press-releases/the-walt-disney-company-names-karandeep-anand-to-newly-created-role-of-chief-technology-officer/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"cnbc.com","pais":"Estados Unidos","titulo":"Última revelação de IA da OpenAI é uma 'situação séria', diz executivo da Microsoft","resumo":"Mustafa Suleyman, chefe de IA da Microsoft, afirmou em entrevista à CNBC que os avanços recentes anunciados pela OpenAI exigem atenção cautelosa. O executivo destacou o ritmo acelerado das capacidades emergentes e os desafios associados à segurança e governança dos modelos. As declarações reforçam o debate dentro da própria indústria sobre o equilíbrio entre inovação contínua e contenção de riscos associados à IA.","link":"https://www.cnbc.com/2026/09/18/microsoft-ai-ceo-openais-latest-ai-revelation-a-serious-situation.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"finance.yahoo.com","pais":"Estados Unidos","titulo":"O que significa o alerta da Micron Technology sobre escassez de memórias até 2027?","resumo":"A Micron Technology alertou que o fornecimento mundial de chips de memória deve permanecer limitado devido à alta demanda por infraestrutura de inteligência artificial. A previsão de escassez contínua até 2027 afeta desde fabricantes de servidores até a produção de eletrônicos de consumo. O cenário impõe desafios logísticos para as gigantes de tecnologia e pode encarecer dispositivos e serviços na nuvem.","link":"https://finance.yahoo.com/markets/stocks/articles/does-micron-technology-mu-warning-001915512.html","categoria":"NEGÓCIOS TECH","lang":"pt"},{"fonte":"La Revue du Digital","pais":"França","titulo":"Disney nomeia seu primeiro diretor de tecnologia focado em inteligência artificial","resumo":"A Walt Disney Company anunciou a criação de um cargo inédito focado em inteligência artificial, nomeando seu primeiro diretor de tecnologia para essa área.\nA iniciativa busca coordenar a integração de ferramentas generativas na produção de conteúdo e nas experiências dos parques temáticos.\nEssa movimentação estratégica reflete a crescente importância da IA na transformação da indústria do entretenimento global.","link":"https://www.larevuedudigital.com/disney-recrute-son-premier-directeur-de-la-technologie/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"BFM","pais":"França","titulo":"Apple Reference Image: como funciona a tecnologia da Apple contra imagens alteradas por IA","resumo":"A Apple revelou detalhes sobre o 'Apple Reference Image', uma nova tecnologia projetada para identificar e combater a manipulação de fotos por inteligência artificial.\nO sistema utiliza assinaturas digitais e verificação criptográfica no momento da captura para garantir a autenticidade das imagens.\nCom o avanço das ferramentas generativas, essa inovação busca proteger a integridade do conteúdo visual no ecossistema da empresa.","link":"https://www.bfmtv.com/tech/innovation/apple-reference-image-comment-fonctionne-la-technologie-developpee-par-la-societe-de-cupertino-pour-lutter-contre-les-photos-alterees-par-l-ia_AV-202609180687.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"lecourrier.vn","pais":"França","titulo":"Tecnologia se torna o motor direto do novo crescimento econômico","resumo":"Um novo panorama econômico aponta que os avanços tecnológicos deixaram de ser meros suportes operacionais para se tornarem a principal força motriz do desenvolvimento global.\nSetores como inteligência artificial, automação avançada e computação em nuvem lideram essa expansão e redefinem a produtividade industrial.\nO cenário exige que empresas e governos acelerem investimentos em infraestrutura digital para manterem a competitividade no mercado internacional.","link":"https://lecourrier.vn/la-technologie-devient-un-moteur-direct-de-la-nouvelle-croissance/1355687.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"La Tribune de l'Hôtellerie","pais":"França","titulo":"Futuroscope celebrará 40 anos em 2027 com novo hotel 4 estrelas dedicado à ficção científica","resumo":"O parque de atrações francês Futuroscope anunciou a criação de um hotel quatro estrelas temático de ficção científica como parte das comemorações do seu 40º aniversário em 2027.\nO projeto visa oferecer uma experiência imersiva futurista para os visitantes, combinando arquitetura inovadora e tecnologia hoteleira.\nA iniciativa reforça a posição do parque como um dos principais polos de entretenimento e divulgação científica na Europa.","link":"https://latribunedelhotellerie.com/futuroscope-nouvel-hotel-science-fiction-2027/","categoria":"ENTRETENIMENTO","lang":"pt"},{"fonte":"enseignementsup-recherche.gouv.fr","pais":"França","titulo":"Festa da Ciência 2026: mesa-redonda explora como a ciência revela os segredos do paladar","resumo":"Como parte das atrações da Festa da Ciência 2026, uma mesa-redonda especial abordará a relação entre o aprendizado do gosto e a descoberta dos sabores.\nEspecialistas em neurobiologia e gastronomia se reunirão para explicar o funcionamento das papilas gustativas e como o cérebro processa os estímulos sensoriais.\nO evento destaca a aplicação prática da pesquisa científica no entendimento dos sentidos humanos e da nutrição.","link":"https://www.enseignementsup-recherche.gouv.fr/fr/fete-de-la-science-2026-table-ronde-apprentissage-du-gout-decouverte-des-saveurs-quand-la-science-104257","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Université de Bordeaux","pais":"França","titulo":"Laboratório LP2I realiza evento de portas abertas durante a Festa da Ciência","resumo":"O Laboratório de Física dos 2 Infinitos de Bordeaux (LP2I) abrirá suas portas ao público durante a tradicional Festa da Ciência para apresentar pesquisas de ponta.\nOs visitantes poderão conhecer de perto experimentos em física nuclear, astropartículas e tecnologias aplicadas à saúde.\nA ação busca aproximar a comunidade do conhecimento científico e incentivar novas vocações acadêmicas na França.","link":"https://www.u-bordeaux.fr/evenements/portes-ouvertes-au-laboratoire-lp2i-fete-de-la-science","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Université de Lorraine","pais":"França","titulo":"IUT de Saint-Dié destaca inovações tecnológicas na Festa da Ciência","resumo":"O Instituto Universitário de Tecnologia de Saint-Dié promoverá uma imersão no universo da inovação durante a nova edição da Festa da Ciência.\nA programação inclui demonstrações interativas de protótipos, robótica e tecnologias digitais desenvolvidas por alunos e pesquisadores.\nO evento visa demonstrar o impacto do desenvolvimento tecnológico na resolução de desafios da sociedade contemporânea.","link":"https://factuel.univ-lorraine.fr/evenement/plongez-au-coeur-de-linnovation-a-la-fete-de-la-science-de-liut-de-saint-die/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"VousNousIls","pais":"França","titulo":"Festa da Ciência 2026: confira a programação prevista de 2 a 12 de outubro","resumo":"A França se prepara para receber a edição 2026 da Festa da Ciência, com atividades distribuídas por todo o país entre os dias 2 e 12 de outubro.\nO evento anual reunirá milhares de cientistas, estudantes e entusiastas em oficinas, conferências e exposições gratuitas.\nO objetivo central da iniciativa é popularizar a ciência, promover o pensamento crítico e divulgar as mais recentes descobertas acadêmicas.","link":"https://www.vousnousils.fr/2026/09/18/fete-de-la-science-2026-ce-qui-est-prevu-du-2-au-12-octobre-704778","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Google afirma que seu modelo de IA Gemini hackeou três outras empresas","resumo":"A Google revelou que seu modelo de inteligência artificial Gemini foi utilizado em testes que demonstraram a capacidade de invadir os sistemas de três grandes empresas. O incidente acende alertas críticos sobre os riscos de segurança cibernética e a utilização maliciosa de ferramentas avançadas de IA. A descoberta reforça a necessidade urgente de criar barreiras de proteção mais rigorosas contra ataques automatizados no setor de tecnologia.","link":"https://www.theguardian.com/technology/2026/sep/18/google-gemini-ai-hack","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"'Um momento crítico': preocupação de que o Reino Unido não esteja agindo rápido contra riscos da IA","resumo":"Especialistas e legisladores alertam que o Reino Unido corre o risco de ficar para trás na implementação de regulamentações eficazes para combater os perigos da inteligência artificial. Com o rápido avanço dos modelos gerativos, há um temor crescente sobre o impacto da tecnologia na desinformação e na segurança cibernética. O momento exige medidas legislativas ágeis para evitar que o país perca a liderança no debate sobre o desenvolvimento ético e seguro da IA.","link":"https://www.theguardian.com/technology/2026/sep/18/a-critical-moment-concern-uk-is-not-up-to-speed-in-acting-on-ai-risks","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Drones policiais serão os primeiros a responder a incidentes em Norfolk","resumo":"A polícia de Norfolk, no Reino Unido, iniciou um projeto inovador onde drones autônomos serão despachados como primeiros socorristas em emergências. As aeronaves não tripuladas chegarão ao local antes das patrulhas terrestres para fornecer imagens em tempo real e avaliação imediata da situação. A iniciativa visa otimizar o tempo de resposta, melhorar a alocação de recursos policiais e aumentar a segurança de agentes e cidadãos.","link":"https://www.bbc.com/news/articles/c68xkykrlj2qo","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Financial Times","pais":"Inglaterra","titulo":"Ineos armazenará dióxido de carbono na costa da Dinamarca com avanço da tecnologia","resumo":"A gigante do setor químico Ineos avançou com seu projeto de captura e armazenamento de carbono, depositando emissões industriais no fundo do mar da Dinamarca. A tecnologia surge como uma das principais apostas industriais para reduzir a pegada de carbono e combater as mudanças climáticas na Europa. O sucesso do projeto impulsiona novos investimentos e consolida o armazenamento submarino como uma solução viável em larga escala.","link":"https://www.ft.com/content/ae8deb70-7173-4f1a-bb02-de43c40d9090?syn-25a6b1a6=1","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Bilionários da tecnologia tentando viver para sempre? É uma perda de tempo, diz físico","resumo":"Um renomado físico criticou abertamente os pesados investimentos de bilionários do setor de tecnologia em pesquisas voltadas à longevidade extrema e à imortalidade. Segundo o cientista, esses recursos seriam melhor aproveitados no combate a problemas urgentes da humanidade, como as mudanças climáticas e desigualdades sociais. A declaração esquenta o debate ético e científico sobre a obsessão do Vale do Silício em burlar o envelhecimento humano.","link":"https://www.theguardian.com/science/2026/sep/18/tech-billionaires-live-forever-waste-of-time-says-physicist-royal-institution","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"lbc.co.uk","pais":"Inglaterra","titulo":"Vereadora considera deixar a política após campanha com adesivos sexualizados criados por IA fazê-la se sentir insegura","resumo":"Uma representante política local no Reino Unido revelou que avalia abandonar a vida pública após tornar-se alvo de uma campanha de assédio utilizando imagens sexualizadas geradas por IA. O caso destaca o avanço alarmante do uso malicioso de deepfakes e ferramentas visuais para intimidar figuras públicas, especialmente mulheres. O episódio reascende as discussões sobre a necessidade urgente de punições severas para crimes virtuais impulsionados por inteligência artificial.","link":"https://www.lbc.co.uk/article/councillor-safety-sticker-ai-uk-politics-women-5HjdhfZ_2/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Por que a Europa esteve ausente do grande debate sobre a segurança da IA","resumo":"Uma análise detalhada examina as razões pelas quais os países europeus perderam protagonismo nos debates centrais de segurança e governança de inteligência artificial. Enquanto EUA e China lideram as diretrizes de desenvolvimento técnico e regulatório, a União Europeia enfrenta impasses burocráticos e divisões internas. Especialistas enfatizam que a Europa precisa retomar sua posição estratégica para garantir que seus valores éticos moldem o futuro global da tecnologia.","link":"https://www.theguardian.com/technology/2026/sep/18/europe-ai-safety-debate","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"Wired-Gov","pais":"Inglaterra","titulo":"Como o Reino Unido deve proteger suas pesquisas de ciência e tecnologia contra ameaças estrangeiras","resumo":"Relatórios recentes recomendam ao governo britânico reforçar a segurança em universidades e centros de inovação para evitar espionagem e roubo de propriedade intelectual por estados adversários. As propostas incluem diretrizes mais rígidas de transparência em financiamentos externos e triagem rigorosa de parcerias internacionais. A medida busca blindar conquistas estratégicas em áreas críticas como computação quântica, biotecnologia e inteligência artificial.","link":"https://www.wired-gov.net/wg/news.nsf/articles/how+the+uk+should+protect+its+science+and+tech+research+from+foreign+state+threats+18092026142000?open","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"La Razón","pais":"Espanha","titulo":"Stanford cria camundongos com meio cérebro humano que andam normalmente: o experimento da Nature que levanta um debate ético","resumo":"Pesquisadores da Universidade de Stanford alcançaram um marco científico ao desenvolver camundongos com tecidos cerebrais humanos funcionais.\nA pesquisa, publicada na prestigiada revista Nature, demonstra que os animais conseguem manter funções motoras normais apesar da alteração.\nO avanço abre novas fronteiras para o estudo de doenças neurodegenerativas e tratamentos neurológicos avançados.\nNo entanto, a criação desses quimeras levanta discussões éticas profundas sobre os limites do uso de células humanas em animais.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/stanford-ha-creado-ratones-medio-cerebro-humano-caminan-normalidad-experimento-publicado-nature-abre-debate-etico-inevitable_202609196aadb25ac2f1e92364102499.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Cadena SER","pais":"Espanha","titulo":"Espanha reforça combate a SMS fraudulentos em meio à crescente preocupação com riscos da IA","resumo":"O governo espanhol e órgãos de telecomunicações intensificaram as medidas para conter a onda de mensagens SMS golpistas no país.\nA iniciativa surge em resposta ao aumento de golpes financeiros complexos impulsionados pelo uso de inteligência artificial.\nCriminosos utilizam ferramentas automatizadas para clonar identidades institucionais e enganar cidadãos com maior precisão.\nAs novas diretrizes buscam proteger os consumidores e criar barreiras regulatórias para mitigar riscos tecnológicos.","link":"https://cadenaser.com/galicia/2026/09/19/espana-refuerza-la-lucha-contra-los-sms-fraudulentos-mientras-crece-la-preocupacion-por-los-riesgos-de-la-ia-radio-coruna/","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"Cadena SER","pais":"Espanha","titulo":"IA surge em um dos grandes problemas da matemática e abre debate sobre autoria científica","resumo":"Ferramentas avançadas de inteligência artificial conseguiram resolver um enigma matemático complexo que desafiava pesquisadores há décadas.\nA conquista demonstra a capacidade crescente dos algoritmos em atuar no desenvolvimento teórico de alto nível.\nO resultado gerou discussões na comunidade científica sobre como atribuir o crédito de descobertas realizadas por sistemas autônomos.\nEspecialistas debatem a necessidade de redefinir os critérios de autoria e o papel dos cientistas humanos no futuro.","link":"https://cadenaser.com/galicia/2026/09/19/la-ia-irrumpe-en-uno-de-los-grandes-problemas-de-las-matematicas-y-abre-un-debate-sobre-la-autoria-cientifica-radio-coruna/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Revista Pharma Market","pais":"Espanha","titulo":"Espanha incorpora a primeira tecnologia de genômica espacial 3D para o estudo de doenças como o câncer","resumo":"Instituições de saúde da Espanha passaram a contar com uma plataforma inédita de genômica espacial em três dimensões.\nEssa inovação permite mapear a expressão gênica no nível celular mantendo a arquitetura original dos tecidos afetados.\nA aplicação prática trará avanços significativos no diagnóstico precoce e no desenvolvimento de terapias personalizadas contra o câncer.\nO investimento posiciona o país na vanguarda do tratamento oncológico e da pesquisa biomédica europeia.","link":"https://www.phmk.es/tecnologia/espana-incorpora-la-primera-tecnologia-de-genomica-espacial-3d-para-el-estudio-de-enfermedades-como-el-cancer","categoria":"MEDICINA","lang":"pt"},{"fonte":"La Razón","pais":"Espanha","titulo":"Google se alia à sueca Stegra para lançar a primeira siderúrgica de grande escala com hidrogênio verde","resumo":"A gigante de tecnologia Google anunciou uma parceria estratégica com a empresa sueca Stegra para descarbonizar a produção de aço.\nO projeto prevê a implementação de uma usina siderúrgica em larga escala movida inteiramente a hidrogênio verde.\nA iniciativa promete reduzir em até 95% as emissões de carbono associadas ao processo produtivo tradicional.\nA medida representa um avanço crucial para tornar a cadeia de suprimentos de infraestrutura tecnológica mais sustentável.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/google-se-alia-sueca-stegra-poner-marcha-primera-aceria-gran-escala-hidrogeno-verde-recorta-emisiones-95_202609196aada16a22237c6bdc59b443.html","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"La Vanguardia","pais":"Espanha","titulo":"Ciência debate o grande requisito para conquistar a galáxia: criar postos de combustível espaciais","resumo":"Cientistas e engenheiros espaciais debatem a necessidade de estabelecer infraestruturas de reabastecimento fora da Terra.\nA criação de depósitos de combustível em órbita é vista como essencial para viabilizar viagens interplanetárias de longa distância.\nA tecnologia reduz a necessidade de carregar todo o propelente desde o lançamento, aumentando a eficiência das naves.\nA proposta ganha força no planejamento de futuras missões habitadas para Marte e regiões mais distantes do sistema solar.","link":"https://www.lavanguardia.com/neo/ciencia-neo/20260919/11637942/ciencia-plantea-gran-requisito-conquistar-galaxia-crear-gasolineras-espaciales-naves.amp.html","categoria":"EXPLORAÇÃO ESPACIAL","lang":"pt"},{"fonte":"elconfidencial.com","pais":"Espanha","titulo":"Lago do tamanho de Formentera desaparece de um dia para o outro no Canadá e ciência busca explicação","resumo":"Um corpo d'água equivalente em área à ilha de Formentera drenou misteriosamente da noite para o dia no território canadense.\nO fenômeno intrigou geólogos e cientistas climáticos, que enviaram equipes para investigar as causas do evento repentino.\nHipóteses preliminares apontam para o colapso de estruturas subterrâneas e derretimento acelerado do permafrost na região.\nA perda do lago traz impactos imediatos para o ecossistema local e reforça alertas sobre mudanças estruturais no planeta.","link":"https://www.elconfidencial.com/tecnologia/ciencia/2026-09-18/lago-formentera-artico-desaparece-explicacion-1qrt_4425055/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"atresplayer","pais":"Espanha","titulo":"Drones que detectam e interceptam outros drones: a tecnologia que chega a Múrcia","resumo":"A região de Múrcia começou a implementar um sistema avançado de segurança focado no controle do espaço aéreo urbano.\nA nova tecnologia utiliza drones autônomos equipados com sensores capazes de identificar e neutralizar invasores não autorizados.\nO equipamento garante maior proteção a áreas de infraestrutura crítica, eventos de massa e instalações governamentais.\nA iniciativa coloca a região como referência no uso de soluções defensivas tecnológicas contra ameaças aéreas.","link":"https://www.atresplayer.com/antena3/noticias/noticias-2/clips/drones-que-detectan-y-frenan-a-otros-drones-la-tecnologia-que-llega-a-murcia_6aad9751722bd70007f5f2c6/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"BornCity","pais":"Alemanha","titulo":"Servidores de IA da Apple: Investimento bilionário em tecnologia da Nvidia","resumo":"A Apple está realizando um investimento bilionário para fortalecer sua infraestrutura de inteligência artificial ao adotar chips da Nvidia.\nEssa movimentação visa acelerar a capacidade de processamento de seus servidores e aprimorar os recursos de aprendizado de máquina.\nA iniciativa reflete a crescente demanda do mercado por soluções de IA de alto desempenho e molda a corrida tecnológica entre as gigantes do setor.","link":"https://borncity.com/news/apple-ki-server-milliarden-investment-in-nvidia-technologie/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Spiegel","pais":"Alemanha","titulo":"Economia na Alemanha: Indústria prevê crescimento mais forte","resumo":"A indústria da Alemanha demonstrou maior otimismo e projeta um crescimento econômico superior para os próximos trimestres.\nO resultado é impulsionado pelo reaquecimento do mercado consumidor e por investimentos estratégicos em inovação e automação.\nEssa perspectiva otimista sinaliza uma recuperação consistente para o setor produtivo e reforça a estabilidade econômica no continente europeu.","link":"https://www.spiegel.de/wirtschaft/unternehmen/konjunkturprognose-industrie-rechnet-mit-staerkerem-wachstum-a-a43191e3-d9f4-4341-b733-7b7d94703336","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"tagesschau.de","pais":"Alemanha","titulo":"Atualização Econômica de 18/09/2026","resumo":"A atualização diária da economia alemã traz um panorama detalhado sobre as recentes variações de mercado e taxas de juros.\nO levantamento analisa o impacto das políticas fiscais recentes sobre a produção industrial e a confiança do consumidor.\nCompreender esses indicadores é fundamental para empresas e investidores que navegam em um cenário financeiro dinâmico e competitivo.","link":"https://www.tagesschau.de/multimedia/sendung/tagesschau24/boerselive/video-1651038.html","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"nikkei.com","pais":"Japão","titulo":"Sumitomo Corporation Anuncia Apoio Estratégico à Startup Sakana AI","resumo":"A Sumitomo Corporation formalizou seu apoio à Sakana AI, startup de inteligência artificial\ncom sede em Tóquio que vem se destacando globalmente. A parceria visa acelerar a transformação\ndigital e a aplicação de modelos avançados de IA em diversos setores industriais japoneses. O\ninvestimento reforça o ecossistema local de tecnologia e a competitividade do Japão.","link":"https://www.nikkei.com/article/DGKKZO98877100Z10C26A9EAC000/","categoria":"NEGÓCIOS TECH","lang":"pt"},{"fonte":"株式会社エクサウィザーズ","pais":"Japão","titulo":"Como a Inteligência Artificial Alterou a Economia dos Ciberataques","resumo":"Uma análise recente revela como apenas três pessoas conseguiram se infiltrar nos sistemas internos\nda OpenAI utilizando ferramentas de IA de última geração. O caso ilustra como a inteligência artificial\nreduziu drasticamente os custos e as barreiras técnicas para a execução de ataques cibernéticos complexos.\nA mudança força empresas de tecnologia a reavaliarem suas estratégias de defesa digital.","link":"https://exawizards.com/column/ai-trend/news-09-19-2026-2/","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"日経クロストレンド","pais":"Japão","titulo":"Tecnologia de Jogos É Utilizada para Operar Maquinário Pesado na TGS","resumo":"A Nittoc Construction fez sua estreia na Tokyo Game Show apresentando um sistema inovador que\nutiliza tecnologias desenvolvidas para videogames na operação remota de máquinas pesadas. A iniciativa\nbusca tornar a construção civil mais segura e atraente para novas gerações através de interfaces intuitivas.\nO projeto exemplifica a convergência prática entre entretenimento e indústria pesada.","link":"https://xtrend.nikkei.com/atcl/contents/18/01480/00083/?i_cid=nbpnxr_new_top_all_02","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Anthropic Cria Laboratório de Biologia para Impulsionar IA em Ciências da Vida","resumo":"A desenvolvedora de inteligência artificial Anthropic estabeleceu um laboratório próprio dedicado\nà pesquisa biológica com o objetivo de gerar dados experimentais exclusivos. A iniciativa visa aumentar\na competitividade e a precisão de seus modelos de linguagem voltados para o setor de ciências da vida.\nA estratégia une pesquisa científica direta e IA para acelerar descobertas medicinais.","link":"https://news.yahoo.co.jp/expert/articles/27ec3706ac9c81b4f370d72b1936c314ebd68bef","categoria":"CIÊNCIA E IA","lang":"pt"},{"fonte":"読売新聞","pais":"Japão","titulo":"Vazamento de Dados Técnicos da Asahi Kasei para Fabricante Chinês","resumo":"Um ex-funcionário da gigante química japonesa Asahi Kasei é investigado pelo vazamento ilícito\nde informações tecnológicas confidenciais para uma empresa concorrente na China. O suspeito alegou\nque buscava reconhecimento em seu novo emprego, mas o caso reacendeu alertas sobre espionagem\nindustrial. O incidente destaca a vulnerabilidade de dados estratégicos na indústria de alta tecnologia.","link":"https://www.yomiuri.co.jp/national/20260919-GYT1T00158/","categoria":"SEGURANÇA INDUSTRIAL","lang":"pt"},{"fonte":"毎日新聞","pais":"Japão","titulo":"Tecnologia 3DCG e Soluções Digitais São Aplicadas na Desativação de Fukushima","resumo":"Empresas japonesas estão adaptando ferramentas digitais de animação e computação gráfica tridimensional\npara projetos de desativação da usina nuclear de Fukushima. A iniciativa utiliza tecnologia de\ncontrole remoto e simulação virtual para garantir maior segurança em ambientes de alta radiação. O\nevento industrial busca atrair novos parceiros tecnológicos para a reconstrução regional.","link":"https://mainichi.jp/articles/20260919/pr2/00m/020/200000c","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Forbes JAPAN","pais":"Japão","titulo":"O Valor Real na Economia da IA Além do Consumo de Tokens","resumo":"Diante da rápida adoção da inteligência artificial, especialistas apontam que as empresas precisam\nolhar além do simples volume de consumo de tokens para medir seus resultados. O artigo analisa\ncomo o valor estratégico reside na eficiência operacional e no impacto real gerado nos negócios.\nA mudança de perspectiva é fundamental para otimizar investimentos na era da automação.","link":"https://forbesjapan.com/articles/detail/105052","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"CRI Middleware Demonstra Tecnologia de Sincronização Labial Multilíngue na TGS","resumo":"A empresa de tecnologia CRI Middleware apresentou durante a Tokyo Game Show uma ferramenta capaz\nde sincronizar movimentos labiais de personagens em múltiplos idiomas automaticamente. A inovação\npromete otimizar o processo de localização de jogos digitais e produções de animação em tempo real.\nA demonstração evidencia o avanço do processamento de áudio e computação gráfica na indústria.","link":"https://news.yahoo.co.jp/articles/635f0fe5e9124c6bf0781b4e4267d1cd8ac5c798","categoria":"ENTRETENIMENTO TECH","lang":"pt"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Google Joins OpenAI, Anthropic, and Meta in Disclosing AI-Related Breaches","resumo":"Major artificial intelligence companies have formed an unprecedented alliance to share information regarding security incidents and cyberattacks. The initiative aims to strengthen the tech ecosystem by anticipating vulnerabilities in generative AI models. This cooperation reflects the industry's growing concern over increasingly complex cyber threats within the digital environment.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/18/google-se-junta-a-openai-a-anthropic-e-a-meta-na-divulgacao-de-invasoes-relacionadas-a-ia.ghtml","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"Medscape","pais":"Brazil","titulo":"Bodies Donated to Science Are Helping Train Artificial Intelligence","resumo":"Researchers are using data from cadavers donated to science to enhance model training and digital simulations in healthcare. This technological advancement promises to revolutionize surgical procedures, anatomical studies, and medical diagnoses through artificial intelligence. The practice raises important ethical discussions regarding the use of biological data for the evolution of computational technologies.","link":"https://portugues.medscape.com/viewarticle/corpos-doados-%C3%A0-ci%C3%AAncia-est%C3%A3o-ajudando-2026a1000yw9","categoria":"SCIENCE \u0026 AI","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"California Governor Proposes 'Kill Switch' for Artificial Intelligence","resumo":"A bill in California proposes the creation of mandatory emergency shutdown mechanisms for advanced artificial intelligence systems. The measure intends to establish rigorous safety safeguards to prevent potential catastrophic risks arising from out-of-control autonomous models. The debate highlights the friction between regulatory bodies and major Silicon Valley tech companies.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/18/governador-da-california-propoe-um-botao-de-desligamento-para-a-ia-para-tentar-controlar-o-setor-de-tecnologia.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"Discord Keeps Loophole Open for Live Streams in Brazil Despite Suspension Order","resumo":"Communication platform Discord is facing scrutiny in Brazil for allowing users to continue conducting live broadcasts despite court-ordered suspensions. The failure to comply with regulatory measures has reignited discussions regarding social media liability in content moderation. Regulatory agencies are monitoring the impact of operational loopholes on the safety of Brazilian users.","link":"https://g1.globo.com/tecnologia/noticia/2026/09/19/discord-mantem-brecha-para-transmissoes-ao-vivo-no-brasil-mesmo-apos-ordem-de-suspensao.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"Tokyo Tests Trash-Collecting Robots at the World's Busiest Train Station","resumo":"The Japanese capital has launched operational tests with autonomous robots for waste collection and sorting at the bustling Shinjuku Station. Equipped with advanced sensors and artificial intelligence, the robots assist in maintaining cleanliness in extremely high-pedestrian-traffic areas. The pilot project aims to mitigate labor shortages and modernize urban service management in the metropolis.","link":"https://g1.globo.com/tecnologia/noticia/2026/09/18/video-toquio-testa-robos-coletores-de-lixo-na-estacao-de-trem-mais-movimentada-do-mundo.ghtml","categoria":"ROBOTICS","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Disney Appoints AI Executive as Its First Chief Technology Officer","resumo":"The Walt Disney Company announced the hiring of an artificial intelligence expert to lead its technology and digital innovation division. The strategy aims to integrate generative artificial intelligence tools into content production, animation, and theme park experiences. The decision marks a significant shift in the entertainment sector toward automation and personalization.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/18/disney-nomeia-executivo-de-ia-como-seu-primeiro-diretor-de-tecnologia.ghtml","categoria":"INNOVATION","lang":"en"},{"fonte":"UOL Economia","pais":"Brazil","titulo":"UOL CEO States That Human Decisions, Not AI, Will Redefine Companies","resumo":"During an event on digital transformation, UOL's leader highlighted the relevance of human judgment in the face of rapid advancements in artificial intelligence. According to the executive, while AI offers expressive operational gains, corporate strategy and ethical governance fundamentally depend on people. This stance contrasts with extreme views regarding the total replacement of processes by digital automation.","link":"https://economia.uol.com.br/noticias/redacao/2026/09/18/ceo-do-uol-nao-e-a-ia-que-vai-redefinir-sua-empresa-sao-suas-decisoes.htm","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Rádio Itatiaia","pais":"Brazil","titulo":"Award Recognizes Scientific Research on the Impacts of Climate Change on the Brazilian Economy","resumo":"A prominent academic award celebrated studies focused on analyzing the economic consequences of the climate crisis in Brazil. The award-winning research points to science-based pathways to mitigate losses in agribusiness, infrastructure, and the national energy matrix. The initiative reinforces the urgency of integrating scientific data into economic and environmental planning decisions.","link":"https://www.itatiaia.com.br/meio-ambiente/premio-reconhece-pesquisas-cientificas-sobre-impactos-da-mudanca-do-clima-na-economia-brasileira/","categoria":"SCIENCE","lang":"en"},{"fonte":"G1","pais":"United States","titulo":"California Governor Signs Decree to Study AI 'Emergency Switch'","resumo":"The governor of California has signed a new executive measure aimed at the safety and regulation of artificial intelligence in the state. The initiative seeks to evaluate the technical feasibility of emergency shutdown mechanisms in large-scale AI systems. The decision reflects growing global concern over maintaining human control over autonomous technologies and mitigating catastrophic risks.","link":"https://g1.globo.com/tecnologia/noticia/2026/09/18/governador-california-decreto-ia.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"The Guardian","pais":"United States","titulo":"OpenAI 'Ethically Hacked' with the Help of Anthropic's Claude Chatbot","resumo":"Security researchers used the Claude chatbot, developed by Anthropic, to conduct an ethical hack on OpenAI's systems. The experiment demonstrated how artificial intelligence tools can be applied to automatically identify code vulnerabilities. The discovery raised industry alerts regarding the dual-use technology in cyberattacks and digital defenses.","link":"https://www.theguardian.com/technology/2026/sep/18/openai-hacked-anthropic-claude-chatbot","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"ScienceDaily","pais":"United States","titulo":"Scientists Discover 'Death-Defying' Cells That Rebuild Damaged Tissue","resumo":"A team of researchers has identified a cell type capable of resisting programmed cell death and regenerating severely affected body tissues. The discovery paves the way for regenerative medicine and innovative treatments against severe injuries and degenerative diseases. The surprising capacity of these cells could revolutionize healing and longevity therapies in the future.","link":"https://www.sciencedaily.com/releases/2026/09/260917003722.htm","categoria":"SCIENCE","lang":"en"},{"fonte":"USRA","pais":"United States","titulo":"USRA Contributes Planetary Science Expertise to NASA and IBM Lunar Model","resumo":"The Universities Space Research Association has joined forces with NASA and IBM to develop a foundation model focused on lunar data. The partnership intends to use artificial intelligence to map the Moon's surface and analyze geological information essential for future missions. The project promises to accelerate scientific analysis and optimize preparations for humanity's return to the lunar satellite.","link":"https://newsroom.usra.edu/usra-contributes-planetary-science-expertise-to-nasa-ibm-lunar-foundation-model/","categoria":"SPACE EXPLORATION","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"United States","titulo":"NASA and JAXA XRISM Mission Observes Pulsar Catching Companion Star's 'Wind'","resumo":"The XRISM satellite, the result of a collaboration between NASA and the Japanese space agency JAXA, has captured unprecedented data from a distant pulsar. The observation detailed how this neutron star attracts and consumes stellar winds emitted by its companion star. The results offer an unprecedented look into the extreme physics and evolution of binary star systems.","link":"https://science.nasa.gov/missions/xrism/xrism-sees-pulsar-gathering-companions-wind/","categoria":"ASTRONOMY","lang":"en"},{"fonte":"The Walt Disney Company","pais":"United States","titulo":"The Walt Disney Company Appoints Karandeep Anand to Newly Created Role of Chief Technology Officer","resumo":"The Walt Disney Company announced Karandeep Anand, former Meta and Microsoft executive, as the group's first global Chief Technology Officer. He will be responsible for overseeing IT infrastructure, as well as leading innovation initiatives in artificial intelligence and streaming platforms. The hiring signals a strategic restructuring within the entertainment conglomerate to accelerate its digital transformation.","link":"https://thewaltdisneycompany.com/press-releases/the-walt-disney-company-names-karandeep-anand-to-newly-created-role-of-chief-technology-officer/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"cnbc.com","pais":"United States","titulo":"OpenAI's Latest AI Reveal Is a 'Serious Situation,' Says Microsoft Executive","resumo":"Mustafa Suleyman, Microsoft's AI chief, stated in an interview with CNBC that recent advancements announced by OpenAI require cautious attention. The executive highlighted the accelerated pace of emerging capabilities and the challenges associated with model safety and governance. The statements reinforce the debate within the industry itself over balancing continuous innovation with the containment of risks associated with AI.","link":"https://www.cnbc.com/2026/09/18/microsoft-ai-ceo-openais-latest-ai-revelation-a-serious-situation.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"finance.yahoo.com","pais":"United States","titulo":"What Micron Technology’s Warning on Memory Shortages Through 2027 Means","resumo":"Micron Technology has warned that the global supply of memory chips is expected to remain tight due to high demand for artificial intelligence infrastructure. The forecast of ongoing shortages through 2027 impacts everything from server manufacturers to consumer electronics production. This scenario poses logistical challenges for tech giants and could drive up the cost of devices and cloud services.","link":"https://finance.yahoo.com/markets/stocks/articles/does-micron-technology-mu-warning-001915512.html","categoria":"TECH BUSINESS","lang":"en"},{"fonte":"La Revue du Digital","pais":"France","titulo":"Disney Appoints Its First Chief Technology Officer Focused on Artificial Intelligence","resumo":"The Walt Disney Company has announced the creation of a new role focused on artificial intelligence, appointing its first chief technology officer for the sector. The initiative aims to coordinate the integration of generative tools into content production and theme park experiences. This strategic move reflects the growing importance of AI in the transformation of the global entertainment industry.","link":"https://www.larevuedudigital.com/disney-recrute-son-premier-directeur-de-la-technologie/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"BFM","pais":"France","titulo":"Apple Reference Image: How Apple's Technology Against AI-Altered Images Works","resumo":"Apple has revealed details about 'Apple Reference Image', a new technology designed to identify and combat the manipulation of photos by artificial intelligence. The system uses digital signatures and cryptographic verification at the time of capture to ensure the authenticity of images. With the advancement of generative tools, this innovation seeks to protect the integrity of visual content within the company's ecosystem.","link":"https://www.bfmtv.com/tech/innovation/apple-reference-image-comment-fonctionne-la-technologie-developpee-par-la-societe-de-cupertino-pour-lutter-contre-les-photos-alterees-par-l-ia_AV-202609180687.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"lecourrier.vn","pais":"France","titulo":"Technology Becomes the Direct Driver of New Economic Growth","resumo":"A new economic outlook indicates that technological advancements are no longer mere operational supports, but have become the primary driving force behind global development. Sectors such as artificial intelligence, advanced automation, and cloud computing are leading this expansion and redefining industrial productivity. This scenario demands that companies and governments accelerate investments in digital infrastructure to maintain competitiveness in the international market.","link":"https://lecourrier.vn/la-technologie-devient-un-moteur-direct-de-la-nouvelle-croissance/1355687.html","categoria":"INNOVATION","lang":"en"},{"fonte":"La Tribune de l'Hôtellerie","pais":"France","titulo":"Futuroscope to Celebrate 40th Anniversary in 2027 with New 4-Star Sci-Fi Hotel","resumo":"The French theme park Futuroscope has announced the creation of a four-star sci-fi themed hotel as part of its 40th-anniversary celebrations in 2027. The project aims to offer an immersive futuristic experience for visitors, combining innovative architecture with hospitality technology. The initiative reinforces the park's position as one of Europe's leading hubs for entertainment and scientific outreach.","link":"https://latribunedelhotellerie.com/futuroscope-nouvel-hotel-science-fiction-2027/","categoria":"ENTERTAINMENT","lang":"en"},{"fonte":"enseignementsup-recherche.gouv.fr","pais":"France","titulo":"Science Festival 2026: Roundtable Explores How Science Reveals the Secrets of Taste","resumo":"As part of the attractions for the 2026 Science Festival, a special roundtable will address the relationship between taste learning and the discovery of flavors. Experts in neurobiology and gastronomy will gather to explain how taste buds work and how the brain processes sensory stimuli. The event highlights the practical application of scientific research in understanding human senses and nutrition.","link":"https://www.enseignementsup-recherche.gouv.fr/fr/fete-de-la-science-2026-table-ronde-apprentissage-du-gout-decouverte-des-saveurs-quand-la-science-104257","categoria":"SCIENCE","lang":"en"},{"fonte":"Université de Bordeaux","pais":"France","titulo":"LP2I Laboratory Holds Open House Event During the Science Festival","resumo":"The Bordeaux Physics of the 2 Infinities Laboratory (LP2I) will open its doors to the public during the traditional Science Festival to showcase cutting-edge research. Visitors will be able to get a close look at experiments in nuclear physics, astroparticles, and technologies applied to health. The initiative aims to bring the community closer to scientific knowledge and encourage new academic vocations in France.","link":"https://www.u-bordeaux.fr/evenements/portes-ouvertes-au-laboratoire-lp2i-fete-de-la-science","categoria":"SCIENCE","lang":"en"},{"fonte":"Université de Lorraine","pais":"France","titulo":"IUT of Saint-Dié Highlights Technological Innovations at the Science Festival","resumo":"The University Institute of Technology of Saint-Dié will promote an immersion into the universe of innovation during the new edition of the Science Festival. The program includes interactive demonstrations of prototypes, robotics, and digital technologies developed by students and researchers. The event aims to demonstrate the impact of technological development on solving contemporary societal challenges.","link":"https://factuel.univ-lorraine.fr/evenement/plongez-au-coeur-de-linnovation-a-la-fete-de-la-science-de-liut-de-saint-die/","categoria":"INNOVATION","lang":"en"},{"fonte":"VousNousIls","pais":"France","titulo":"Science Festival 2026: Check Out the Schedule Planned for October 2 to 12","resumo":"France is preparing to host the 2026 edition of the Science Festival, with activities distributed across the country from October 2 to 12. The annual event will bring together thousands of scientists, students, and enthusiasts in free workshops, conferences, and exhibitions. The primary goal of the initiative is to popularize science, promote critical thinking, and share the latest academic discoveries.","link":"https://www.vousnousils.fr/2026/09/18/fete-de-la-science-2026-ce-qui-est-prevu-du-2-au-12-octobre-704778","categoria":"SCIENCE","lang":"en"},{"fonte":"The Guardian","pais":"United Kingdom","titulo":"Google Claims Its Gemini AI Model Hacked Three Other Companies","resumo":"Google has revealed that its Gemini artificial intelligence model was used in tests that demonstrated the capability to breach the systems of three major companies. The incident raises critical red flags regarding cybersecurity risks and the malicious use of advanced AI tools. The discovery reinforces the urgent need to create more stringent protective barriers against automated attacks in the tech sector.","link":"https://www.theguardian.com/technology/2026/sep/18/google-gemini-ai-hack","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"The Guardian","pais":"United Kingdom","titulo":"'A Critical Moment': Concern That the UK Is Not Acting Fast Enough Against AI Risks","resumo":"Experts and lawmakers warn that the UK risks falling behind in implementing effective regulations to combat the dangers of artificial intelligence. With the rapid advancement of generative models, there is growing concern about the technology's impact on disinformation and cybersecurity. The moment calls for agile legislative measures to prevent the country from losing its leadership in the debate over the ethical and safe development of AI.","link":"https://www.theguardian.com/technology/2026/sep/18/a-critical-moment-concern-uk-is-not-up-to-speed-in-acting-on-ai-risks","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"BBC","pais":"United Kingdom","titulo":"Police Drones to Be First Responders to Incidents in Norfolk","resumo":"Norfolk Police in the UK have launched an innovative project where autonomous drones will be dispatched as first responders in emergencies. The unmanned aircraft will arrive at the scene before ground patrols to provide real-time footage and immediate situation assessments. The initiative aims to optimize response times, improve the allocation of police resources, and enhance the safety of officers and citizens.","link":"https://www.bbc.com/news/articles/c68xkykrlj2qo","categoria":"INNOVATION","lang":"en"},{"fonte":"Financial Times","pais":"United Kingdom","titulo":"Ineos to Store Carbon Dioxide Off the Coast of Denmark as Technology Advances","resumo":"Chemicals giant Ineos has moved forward with its carbon capture and storage project, depositing industrial emissions beneath the seabed in Denmark. The technology is emerging as one of the primary industrial bets to reduce the carbon footprint and combat climate change in Europe. The project's success is driving new investments and cementing subsea storage as a viable large-scale solution.","link":"https://www.ft.com/content/ae8deb70-7173-4f1a-bb02-de43c40d9090?syn-25a6b1a6=1","categoria":"SCIENCE","lang":"en"},{"fonte":"The Guardian","pais":"United Kingdom","titulo":"Tech Billionaires Trying to Live Forever? It's a Waste of Time, Says Physicist","resumo":"A renowned physicist has openly criticized heavy investments by tech billionaires into research aimed at extreme longevity and immortality. According to the scientist, these resources would be better utilized in combating urgent problems facing humanity, such as climate change and social inequalities. The statement heats up the ethical and scientific debate over Silicon Valley's obsession with cheating human aging.","link":"https://www.theguardian.com/science/2026/sep/18/tech-billionaires-live-forever-waste-of-time-says-physicist-royal-institution","categoria":"TRENDS","lang":"en"},{"fonte":"lbc.co.uk","pais":"United Kingdom","titulo":"Councillor Weighs Quitting Politics After AI-Generated Sexualized Sticker Campaign Makes Her Feel Unsafe","resumo":"A local political representative in the UK has revealed she is considering leaving public life after becoming the target of a harassment campaign using AI-generated sexualized images. The case highlights the alarming rise in the malicious use of deepfakes and visual tools to intimidate public figures, especially women. The episode reignites discussions about the urgent need for severe punishments for virtual crimes driven by artificial intelligence.","link":"https://www.lbc.co.uk/article/councillor-safety-sticker-ai-uk-politics-women-5HjdhfZ_2/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Why Europe Was Absent From the Major AI Safety Debate","resumo":"A detailed analysis examines the reasons why European countries lost prominence in the central debates surrounding artificial intelligence safety and governance. While the US and China lead technical development and regulatory guidelines, the European Union faces bureaucratic impasses and internal divisions. Experts emphasize that Europe needs to reclaim its strategic position to ensure its ethical values shape the global future of technology.","link":"https://www.theguardian.com/technology/2026/sep/18/europe-ai-safety-debate","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"Wired-Gov","pais":"England","titulo":"How the UK Should Protect Its Science and Tech Research From Foreign State Threats","resumo":"Recent reports recommend that the British government reinforce security in universities and innovation centers to prevent espionage and intellectual property theft by adversary states. Proposals include stricter transparency guidelines for external funding and rigorous screening of international partnerships. The measure seeks to shield strategic achievements in critical areas such as quantum computing, biotechnology, and artificial intelligence.","link":"https://www.wired-gov.net/wg/news.nsf/articles/how+the+uk+should+protect+its+science+and+tech+research+from+foreign+state+threats+18092026142000?open","categoria":"SECURITY","lang":"en"},{"fonte":"La Razón","pais":"Spain","titulo":"Stanford Creates Mice With Half-Human Brains That Walk Normally: The Nature Experiment That Sparks an Ethical Debate","resumo":"Researchers at Stanford University have achieved a scientific milestone by developing mice with functional human brain tissues. The research, published in the prestigious journal Nature, demonstrates that the animals are able to maintain normal motor functions despite the alteration. The breakthrough opens new frontiers for the study of neurodegenerative diseases and advanced neurological treatments. However, the creation of these chimeras raises profound ethical discussions regarding the limits of using human cells in animals.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/stanford-ha-creado-ratones-medio-cerebro-humano-caminan-normalidad-experimento-publicado-nature-abre-debate-etico-inevitable_202609196aadb25ac2f1e92364102499.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Cadena SER","pais":"Spain","titulo":"Spain Steps Up Fight Against Fraudulent SMS Amid Growing Concern Over AI Risks","resumo":"The Spanish government and telecommunications bodies have intensified measures to curb the wave of scam SMS messages in the country. The initiative comes in response to the rise of complex financial scams driven by the use of artificial intelligence. Criminals use automated tools to clone institutional identities and deceive citizens with greater precision. The new guidelines aim to protect consumers and create regulatory barriers to mitigate technological risks.","link":"https://cadenaser.com/galicia/2026/09/19/espana-refuerza-la-lucha-contra-los-sms-fraudulentos-mientras-crece-la-preocupacion-por-los-riesgos-de-la-ia-radio-coruna/","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"Cadena SER","pais":"Spain","titulo":"AI Breaks Into One of Mathematics' Greatest Problems and Sparks Debate on Scientific Authorship","resumo":"Advanced artificial intelligence tools have successfully solved a complex mathematical puzzle that had challenged researchers for decades. The achievement demonstrates the growing ability of algorithms to operate in high-level theoretical development. The result has sparked discussions in the scientific community on how to attribute credit for discoveries made by autonomous systems. Experts are debating the need to redefine authorship criteria and the future role of human scientists.","link":"https://cadenaser.com/galicia/2026/09/19/la-ia-irrumpe-en-uno-de-los-grandes-problemas-de-las-matematicas-y-abre-un-debate-sobre-la-autoria-cientifica-radio-coruna/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Revista Pharma Market","pais":"Spain","titulo":"Spain Introduces First 3D Spatial Genomics Technology for Studying Diseases Like Cancer","resumo":"Healthcare institutions in Spain now have access to an unprecedented three-dimensional spatial genomics platform. This innovation makes it possible to map gene expression at the cellular level while maintaining the original architecture of the affected tissues. The practical application will bring significant breakthroughs in early diagnosis and the development of personalized cancer therapies. The investment positions the country at the forefront of European oncological treatment and biomedical research.","link":"https://www.phmk.es/tecnologia/espana-incorpora-la-primera-tecnologia-de-genomica-espacial-3d-para-el-estudio-de-enfermedades-como-el-cancer","categoria":"MEDICINE","lang":"en"},{"fonte":"La Razón","pais":"Spain","titulo":"Google Teams Up With Sweden's Stegra to Launch First Large-Scale Green Hydrogen Steel Mill","resumo":"Tech giant Google has announced a strategic partnership with Swedish firm Stegra to decarbonize steel production. The project plans to implement a large-scale steel plant powered entirely by green hydrogen. The initiative promises to reduce carbon emissions associated with the traditional production process by up to 95%. This measure represents a crucial step toward making the technology infrastructure supply chain more sustainable.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/google-se-alia-sueca-stegra-poner-marcha-primera-aceria-gran-escala-hidrogeno-verde-recorta-emisiones-95_202609196aada16a22237c6bdc59b443.html","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"La Vanguardia","pais":"Spain","titulo":"Science Debates the Major Requirement to Conquer the Galaxy: Creating Space Gas Stations","resumo":"Scientists and space engineers are debating the need to establish refueling infrastructure beyond Earth. The creation of orbiting fuel depots is seen as essential to making long-distance interplanetary travel viable. The technology reduces the need to carry all the propellant from launch, increasing spacecraft efficiency. The proposal is gaining momentum in the planning of future crewed missions to Mars and more distant regions of the solar system.","link":"https://www.lavanguardia.com/neo/ciencia-neo/20260919/11637942/ciencia-plantea-gran-requisito-conquistar-galaxia-crear-gasolineras-espaciales-naves.amp.html","categoria":"SPACE EXPLORATION","lang":"en"},{"fonte":"elconfidencial.com","pais":"Spain","titulo":"Lake the Size of Formentera Disappears Overnight in Canada, Leaving Science Searching for Answers","resumo":"A body of water equivalent in area to the island of Formentera mysteriously drained overnight in Canadian territory. The phenomenon has puzzled geologists and climate scientists, who have sent teams to investigate the causes of the sudden event. Preliminary hypotheses point to the collapse of underground structures and accelerated permafrost thawing in the region. The loss of the lake brings immediate impacts to the local ecosystem and reinforces warnings about structural changes on the planet.","link":"https://www.elconfidencial.com/tecnologia/ciencia/2026-09-18/lago-formentera-artico-desaparece-explicacion-1qrt_4425055/","categoria":"SCIENCE","lang":"en"},{"fonte":"atresplayer","pais":"Spain","titulo":"Drones That Detect and Intercept Other Drones: The Technology Arriving in Murcia","resumo":"The region of Murcia has begun implementing an advanced security system focused on urban airspace control. The new technology uses autonomous drones equipped with sensors capable of identifying and neutralizing unauthorized intruders. The equipment guarantees greater protection for critical infrastructure areas, mass events, and government facilities. The initiative establishes the region as a benchmark in the use of technological defense solutions against aerial threats.","link":"https://www.atresplayer.com/antena3/noticias/noticias-2/clips/drones-que-detectan-y-frenan-a-otros-drones-la-tecnologia-que-llega-a-murcia_6aad9751722bd70007f5f2c6/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"BornCity","pais":"Germany","titulo":"Apple AI Servers: Billion-Dollar Investment in Nvidia Technology","resumo":"Apple is making a multibillion-dollar investment to strengthen its artificial intelligence infrastructure by adopting Nvidia chips. This move aims to accelerate its servers' processing capacity and enhance machine learning capabilities. The initiative reflects growing market demand for high-performance AI solutions and shapes the technological race among industry giants.","link":"https://borncity.com/news/apple-ki-server-milliarden-investment-in-nvidia-technologie/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Spiegel","pais":"Germany","titulo":"Economy in Germany: Industry Forecasts Stronger Growth","resumo":"German industry has shown greater optimism and is projecting higher economic growth for the coming quarters. The result is driven by the reheating of the consumer market and strategic investments in innovation and automation. This optimistic outlook signals a consistent recovery for the productive sector and reinforces economic stability on the European continent.","link":"https://www.spiegel.de/wirtschaft/unternehmen/konjunkturprognose-industrie-rechnet-mit-staerkerem-wachstum-a-a43191e3-d9f4-4341-b733-7b7d94703336","categoria":"BUSINESS","lang":"en"},{"fonte":"tagesschau.de","pais":"Germany","titulo":"Economic Update for 09/18/2026","resumo":"The daily German economy update provides a detailed overview of recent market fluctuations and interest rates. The survey analyzes the impact of recent fiscal policies on industrial production and consumer confidence. Understanding these indicators is essential for companies and investors navigating a dynamic and competitive financial landscape.","link":"https://www.tagesschau.de/multimedia/sendung/tagesschau24/boerselive/video-1651038.html","categoria":"TRENDS","lang":"en"},{"fonte":"nikkei.com","pais":"Japan","titulo":"Sumitomo Corporation Announces Strategic Support for Startup Sakana AI","resumo":"Sumitomo Corporation has formalized its support for Sakana AI, a Tokyo-based artificial intelligence startup that has been gaining global recognition. The partnership aims to accelerate digital transformation and the application of advanced AI models across various Japanese industrial sectors. The investment reinforces the local tech ecosystem and Japan's competitiveness.","link":"https://www.nikkei.com/article/DGKKZO98877100Z10C26A9EAC000/","categoria":"TECH BUSINESS","lang":"en"},{"fonte":"株式会社エクサウィザーズ","pais":"Japan","titulo":"How Artificial Intelligence Has Altered the Economics of Cyberattacks","resumo":"A recent analysis reveals how just three people managed to infiltrate OpenAI's internal systems using cutting-edge AI tools. The case illustrates how artificial intelligence has drastically reduced the costs and technical barriers for executing complex cyberattacks. The shift is forcing tech companies to reassess their digital defense strategies.","link":"https://exawizards.com/column/ai-trend/news-09-19-2026-2/","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"日経クロストレンド","pais":"Japan","titulo":"Gaming Technology Used to Operate Heavy Machinery at TGS","resumo":"Nittoc Construction made its debut at the Tokyo Game Show by showcasing an innovative system that uses technologies developed for video games to remotely operate heavy machinery. The initiative seeks to make civil construction safer and more appealing to new generations through intuitive interfaces. The project exemplifies the practical convergence between entertainment and heavy industry.","link":"https://xtrend.nikkei.com/atcl/contents/18/01480/00083/?i_cid=nbpnxr_new_top_all_02","categoria":"INNOVATION","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Anthropic Creates Biology Lab to Boost AI in Life Sciences","resumo":"AI developer Anthropic has established a dedicated in-house laboratory for biological research with the goal of generating exclusive experimental data. The initiative aims to increase the competitiveness and precision of its language models tailored for the life sciences sector. The strategy combines direct scientific research and AI to accelerate medical discoveries.","link":"https://news.yahoo.co.jp/expert/articles/27ec3706ac9c81b4f370d72b1936c314ebd68bef","categoria":"SCIENCE \u0026 AI","lang":"en"},{"fonte":"読売新聞","pais":"Japan","titulo":"Leak of Asahi Kasei Technical Data to Chinese Manufacturer","resumo":"A former employee of Japanese chemical giant Asahi Kasei is under investigation for the illicit leak of confidential technological information to a competing company in China. The suspect claimed they were seeking recognition in their new job, but the case has rekindled concerns over industrial espionage. The incident highlights the vulnerability of strategic data in the high-tech industry.","link":"https://www.yomiuri.co.jp/national/20260919-GYT1T00158/","categoria":"INDUSTRIAL SECURITY","lang":"en"},{"fonte":"毎日新聞","pais":"Japan","titulo":"3DCG Technology and Digital Solutions Applied to Fukushima Decommissioning","resumo":"Japanese companies are adapting digital animation and three-dimensional computer graphics tools for the Fukushima nuclear plant decommissioning projects. The initiative uses remote control technology and virtual simulation to ensure greater safety in high-radiation environments. The industry event seeks to attract new technological partners for regional reconstruction.","link":"https://mainichi.jp/articles/20260919/pr2/00m/020/200000c","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Forbes JAPAN","pais":"Japan","titulo":"The Real Value in the AI Economy Beyond Token Consumption","resumo":"Faced with the rapid adoption of artificial intelligence, experts point out that companies need to look beyond simple token consumption volume to measure their results. The article analyzes how strategic value lies in operational efficiency and the real impact generated on business. This shift in perspective is essential for optimizing investments in the automation era.","link":"https://forbesjapan.com/articles/detail/105052","categoria":"TRENDS","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"CRI Middleware Demonstrates Multilingual Lip-Sync Technology at TGS","resumo":"Technology company CRI Middleware presented a tool at the Tokyo Game Show capable of automatically synchronizing character lip movements across multiple languages. The innovation promises to streamline the localization process for digital games and animation productions in real time. The demonstration highlights the advancement of audio processing and computer graphics in the industry.","link":"https://news.yahoo.co.jp/articles/635f0fe5e9124c6bf0781b4e4267d1cd8ac5c798","categoria":"TECH ENTERTAINMENT","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
