haring.","link":"https://www.htx.gov.sg/whats-happening/all-news---events/all-news/2026/power-of-synergy-takes-centre-stage-at-htx-science-day","categoria":"SCIENCE","lang":"en"},{"fonte":"BBC","pais":"England","titulo":"Russia warns UK over drone supplies to Ukraine","resumo":"Russia has issued a formal warning to the United Kingdom regarding the ongoing supply of military drone technology to Ukraine.\nThe Russian government stated that sending these unmanned aircraft escalates the conflict in the region even further.\nThis statement intensifies international diplomatic tensions as the UK reaffirms its technological and military support for Ukrainian forces.","link":"https://www.bbc.com/news/articles/cy5dz0kkn0wo","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"Daily Business","pais":"England","titulo":"£300m data center project puts AI at the core of the economy","resumo":"A new £300 million data center project aims to place artificial intelligence at the heart of the country's economic growth.\nThis state-of-the-art infrastructure will provide the computational power needed to support technological breakthroughs and cutting-edge tech startups.\nThe investment reinforces the UK's ambition to become a global leader in AI, drawing top talent and fresh investments to the sector.","link":"https://dailybusinessgroup.co.uk/2026/08/300m-data-centre-project-puts-ai-at-core-of-economy/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Yahoo Sports","pais":"England","titulo":"New technology? Premier League closely analyzes bold La Liga experiment","resumo":"The Premier League is evaluating the adoption of new technologies successfully tested in Spain's La Liga.\nThese innovations aim to improve sports broadcasting and provide fans with more accurate and rapid statistical and refereeing data.\nThis initiative demonstrates English football's shift toward technological modernization to optimize the fan experience and match decisions.","link":"https://sports.yahoo.com/articles/technology-premier-league-takes-closer-232340970.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"La Razón","pais":"Espanha","titulo":"Europa arma seus drones com tecnologia que Washington pode bloquear em plena crise: chips, sensores e componentes continuam sob controle dos EUA","resumo":"A União Europeia enfrenta uma vulnerabilidade estratégica significativa em seu programa de drones militares devido à dependência de componentes americanos.\nSistemas críticos como sensores, chips avançados e softwares permanecem sob controle regulatório de Washington, que pode impor restrições de uso.\nEspecialistas alertam que essa dependência compromete a autonomia operacional do bloco europeu em momentos de crises geopolíticas graves.","link":"https://www.larazon.es/tecnologia-consumo/europa-arma-sus-drones-tecnologia-washington-puede-bloquear-plena-crisis-chips-sensores-componentes-siguen-control-ee-uu_202608186a83a678a5690f04737f9bac.html","categoria":"TECNOLOGIA E DEFESA","lang":"en"},{"fonte":"La Vanguardia","pais":"Espanha","titulo":"Thinex: impressores de tecnologia para a NASA","resumo":"A empresa Thinex consolidou-se como fornecedora estratégica de componentes de alta precisão para a NASA por meio da manufatura avançada.\nA utilização de tecnologias de impressão de última geração permite o desenvolvimento de materiais ultrarresistentes e leves para missões espaciais.\nEssa colaboração destaca o avanço do ecossistema de engenharia e tecnologia no fornecimento de soluções para a exploração aeroespacial.","link":"https://www.lavanguardia.com/economia/20260818/11615514/impresores-tecnologia.html","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"The Objective","pais":"Espanha","titulo":"O dado que falta ao comprar tecnologia: até quando o dispositivo continuará recebendo atualizações","resumo":"A vida útil dos dispositivos eletrônicos é diretamente afetada pelo suporte contínuo de atualizações de software e segurança oferecido pelos fabricantes.\nNo entanto, a falta de transparência sobre a data limite de suporte durante a compra dificulta decisões informadas por parte dos consumidores.\nDiscussões regulatórias e de consumo pressionam por maior clareza na rotulagem comercial para combater a obsolescência programada.","link":"https://theobjective.com/tecnologia/2026-08-18/dato-falta-comprar-tecnologia-actualizaciones/?amp","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"Ultima Hora","pais":"Espanha","titulo":"A ciência revela os segredos da peste de 1820 e a culpa não foi dos ratos","resumo":"Novas pesquisas científicas reescreveram a história sobre a disseminação do surto de peste registrado no ano de 1820.\nAnálises genéticas e epidemiológicas demonstraram que a propagação não ocorreu por meio dos roedores, contrariando o consenso histórico prévio.\nA descoberta destaca a relevância de métodos científicos modernos na compreensão de pandemias do passado para aprimorar o combate a futuras ameaças.","link":"https://www.ultimahora.es/noticias/local/2026/08/18/2690713/ciencia-revela-secretos-peste-1820-culpa-fue-ratas.html","categoria":"CIÊNCIA","lang":"en"},{"fonte":"Site officiel du FC Barcelone","pais":"Espanha","titulo":"Wenger: 'Futebol e ciência precisam caminhar de mãos dadas'","resumo":"Arsène Wenger defendeu publicamente a integração cada vez mais profunda da ciência de dados e análises fisiológicas no futebol moderno.\nO ex-treinador e atual dirigente enfatiza que o monitoramento biométrico e o suporte científico são vitais para prevenir lesões e prolongar carreiras.\nA visão reflete a constante transformação tecnológica no esporte de alto rendimento para otimizar a performance dos atletas.","link":"https://www.fcbarcelona.fr/fr/barca-play/videos/1887587/wenger-football-and-science-have-to-go-hand-in-hand","categoria":"CIÊNCIA","lang":"en"},{"fonte":"El Español","pais":"Espanha","titulo":"Panamá aposta na nova economia: inteligência artificial, chips e talento para ganhar peso tecnológico","resumo":"O Panamá está implementando um plano estratégico para diversificar sua economia e se posicionar como um hub de tecnologia na América Latina.\nO foco das iniciativas abrange o desenvolvimento de semicondutores, soluções de inteligência artificial e a capacitação de talentos locais.\nCom incentivos governamentais e parcerias internacionais, o país busca atrair investimentos globais e impulsionar a inovação regional.","link":"https://www.elespanol.com/invertia/disruptores-americas/20260818/panama-lanza-nueva-economia-inteligencia-artificial-chips-talento-ganar-peso-tecnologico/1003744354438_0.html","categoria":"NEGÓCIOS","lang":"en"},{"fonte":"La Razón","pais":"Espanha","titulo":"Autonomia para 60 quilômetros e design off-road repleto de tecnologia: por menos de 350 euros, este patinete elétrico vale muito a pena","resumo":"O mercado de mobilidade urbana ganha destaque com o lançamento de um novo patinete elétrico focado em custo-benefício e versatilidade.\nO veículo conta com alcance de até 60 quilômetros por carga, estrutura resistente para diferentes terrenos e painel digital avançado.\nPor um preço competitivo abaixo de 350 euros, o modelo posiciona-se como uma opção atraente para o transporte diário e recreativo.","link":"https://www.larazon.es/compras/nuestra-eleccion/autonomia-60-kilometros-diseno-todoterreno-cargado-tecnologia-menos-350-euros-este-patinete-electrico-merece-muchisimo-pena_202608186a83093871b42a0b5df455de.html","categoria":"MOBILIDADE","lang":"en"},{"fonte":"La Opinión de Murcia","pais":"Espanha","titulo":"Tecnologia de satélite para antecipar falhas nos reservatórios de irrigação da Região de Múrcia","resumo":"A Região de Múrcia iniciou o uso de dados de monitoramento via satélite para inspecionar a integridade estrutural dos reservatórios de irrigação.\nA tecnologia permite detectar deformações, vazamentos e anomalias na infraestrutura hídrica com precisão milimétrica e em tempo real.\nA medida visa otimizar a gestão dos recursos hídricos e prevenir falhas graves que possam afetar a agricultura local.","link":"https://www.laopiniondemurcia.es/comunidad/2026/08/17/tecnologia-satelital-anticipar-fallos-balsas-133433790.html","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"computerweekly.com","pais":"Alemanha","titulo":"Estudo da KPMG: IA Generativa na Economia Alemã em 2026","resumo":"Um novo estudo realizado pela KPMG analisa a adoção e o impacto da inteligência artificial generativa no setor empresarial da Alemanha projetado para 2026.\nA pesquisa destaca como as empresas alemãs estão integrando essas ferramentas avançadas para otimizar processos internos e impulsionar a inovação digital.\nO levantamento evidencia a crescente relevância da automação inteligente como pilar estratégico para manter a competitividade econômica do país no mercado global.","link":"https://www.computerweekly.com/de/feature/KPMG-Studie-Generative-KI-in-der-deutschen-Wirtschaft-2026","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"borncity.com","pais":"Alemanha","titulo":"AOC AG276UZ: Monitor Gamer com Tecnologia de Proteção Ocular","resumo":"A AOC anunciou o lançamento do monitor gamer AG276UZ, equipado com tecnologias avançadas voltadas para o conforto visual e a saúde ocular dos usuários.\nO dispositivo combina alta taxa de atualização e resposta rápida com recursos que reduzem a fadiga visual durante longas sessões de uso.\nA novidade busca atender à demanda crescente por periféricos de alta performance que equilibram desempenho técnico e bem-estar do jogador.","link":"https://borncity.com/news/aoc-ag276uz-gaming-monitor-mit-augenschutz-technologie/","categoria":"HARDWARE","lang":"en"},{"fonte":"Investing.com Deutsch","pais":"Alemanha","titulo":"CEO da Marvell Technology, Matthew Murphy, Vende US$ 1,77 Milhão em Ações","resumo":"O CEO da Marvell Technology, Matthew Murphy, realizou a venda de um lote de ações da empresa avaliado em aproximadamente 1,77 milhão de dólares.\nA transação financeira foi devidamente registrada nos órgãos reguladores do mercado e chamou a atenção de investidores do setor de semicondutores.\nMovimentações acionárias de altos executivos costumam influenciar a percepção do mercado sobre a avaliação e as perspectivas futuras da companhia.","link":"https://de.investing.com/news/insider-trading-news/ceo-von-marvell-technologie-matthew-murphy-verkauft-aktien-im-wert-von-177-mio-usdollar-93CH-3625310","categoria":"NEGÓCIOS","lang":"en"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Segurança Contra Drones: Novo Centro Visa Impulsionar a Defesa Antidrone","resumo":"A Alemanha anunciou a criação de um novo centro especializado com o objetivo de fortalecer e desenvolver tecnologias de defesa contra drones não autorizados.\nA iniciativa responde a crescentes preocupações com a segurança do espaço aéreo e a proteção de infraestruturas críticas e estratégicas do país.\nO centro focará no avanço de soluções tecnológicas de detecção e neutralização para mitigar riscos operacionais e econômicos representados por essas aeronaves.","link":"https://www.sueddeutsche.de/wirtschaft/sicherheit-vor-drohnen-neues-zentrum-soll-drohnenabwehr-voranbringen-dpa.urn-newsml-dpa-com-20090101-260818-930-544529","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"borncity.com","pais":"Alemanha","titulo":"TCL 32G64: Monitor Gamer com 180Hz e Tecnologia Mini-LED","resumo":"A TCL apresentou o novo monitor para jogos 32G64, destacando-se por sua taxa de atualização de 180Hz e painel com tecnologia Mini-LED.\nA combinação garante imagens de alto contraste, brilho intenso e fluidez aprimorada para uma experiência imersiva em jogos eletrônicos competitivos.\nO lançamento reforça a expansão da marca no mercado de monitores de alta fidelidade visual voltados ao público entusiasta e gamer.","link":"https://borncity.com/news/tcl-32g64-gaming-monitor-mit-180hz-und-mini-led-technologie/","categoria":"HARDWARE","lang":"en"},{"fonte":"El Economista","pais":"Alemanha","titulo":"Estado É o Único Setor que Cresce na Alemanha: Da Austeridade à Dependência do Gasto Público para Manter o PIB","resumo":"Um novo panorama da economia alemã revela uma mudança estrutural relevante, com o setor público se tornando o principal motor do PIB nacional.\nApós anos de políticas rígidas de austeridade fiscal, o país passa a depender fortemente dos investimentos e gastos do governo para evitar a estagnação.\nAnalistas alertam para os desafios de longo prazo dessa dependência do Estado em um cenário de baixo dinamismo no setor privado.","link":"https://www.eleconomista.es/economia/noticias/14008444/08/26/el-estado-ya-es-lo-unico-que-crece-en-la-economia-de-alemania-de-la-austeridad-a-depender-del-gasto-publico-para-mantener-vivo-el-pib.html","categoria":"ECONOMIA","lang":"en"},{"fonte":"EE Times Japan","pais":"Japão","titulo":"SAIMEMORY busca reestabelecer a base da tecnologia de memória no Japão até 2029","resumo":"A iniciativa SAIMEMORY visa revitalizar a indústria de semicondutores no Japão por meio do desenvolvimento da tecnologia ZAM.\nO projeto busca estabelecer uma base nacional sólida para a produção e pesquisa de memórias avançadas no país.\nCom previsão de comercialização para o ano fiscal de 2029, a meta é recuperar o protagonismo tecnológico japonês no setor.\nA estratégia pretende garantir soberania tecnológica e atender à crescente demanda global por semicondutores de última geração.","link":"https://eetimes.itmedia.co.jp/ee/articles/2608/18/news050.html","categoria":"SEMICONDUTORES","lang":"en"},{"fonte":"newscast.jp","pais":"Japan","titulo":"Japan's Nuclear Fusion Market Projected to Expand to $25.1 Billion by 2035","resumo":"Driven by accelerated technological advancements, Japan's nuclear fusion sector projects exponential growth over the coming decades.\nEstimates indicate that the local market will reach the $25.1 billion mark by the year 2035.\nThe country has intensified public and private investments in pursuit of clean and limitless energy sources.\nThis expansion solidifies Japan as one of the global leaders in the race for nuclear fusion commercialization.","link":"https://newscast.jp/smart/news/3905071","categoria":"ENERGY","lang":"en"},{"fonte":"tuat.ac.jp","pais":"Japan","titulo":"Ultrat hin Terahertz Wave Lens Developed for Next-Generation Communication Networks","resumo":"Researchers at Tokyo University of Agriculture and Technology and ROHM have created a flat lens for terahertz waves.\nThe innovation is capable of transforming signals into sharp, directed beams, which are essential for post-5G and 6G communication technologies.\nThe device is compact enough to be mounted directly onto small-scale oscillators.\nThe new development promises to accelerate the creation of ultra-fast and efficient wireless infrastructures.","link":"https://www.tuat.ac.jp/outline/disclosure/pressrelease/2026/20260818_01.html","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Lawson and KDDI Launch Concept Stores with Delivery Robots to Revitalize Urban Areas","resumo":"Convenience store chain Lawson has partnered with telecom giant KDDI to transform retail in Japan's aging bedroom communities.\nThe new store model utilizes advanced communication networks and autonomous robots to perform home deliveries.\nThe initiative aims to serve elderly and local residents with mobility issues in regions with scarce services.\nThe project combines cutting-edge technology and social utility to redefine community convenience.","link":"https://news.yahoo.co.jp/articles/2e9b2009dd099655890bdfb89b7557130ffae6bc","categoria":"ROBOTICS","lang":"en"},{"fonte":"Yahoo!ファイナンス","pais":"Japan","titulo":"Honda Advances Development of AI-Powered Safety Technologies","resumo":"Honda shares climbed in the financial market following reports regarding its investments in integrating AI into automotive development.\nThe Japanese automaker seeks to accelerate the creation of intelligent systems capable of autonomously predicting and preventing traffic accidents.\nThe initiative reinforces the automotive industry's race toward increasingly autonomous and safe vehicles.\nThe focus on advanced algorithms solidifies the company's continuous technological innovation strategy.","link":"https://finance.yahoo.co.jp/news/detail/684e8a281b87348b405087b8a6b33e8e6b75c95d","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"SPLYZA Adapts AI Sports Movement Analysis Technology for Medicine","resumo":"SPLYZA has completed the registration of its artificial intelligence-based gait analysis system as a medical device in Japan.\nThe technology, originally created to optimize athlete performance in educational settings, has been adapted for clinical diagnostics.\nThe system allows for the precise and non-invasive evaluation of patients' mobility and walking patterns.\nThe transition demonstrates the high potential for reapplying computer vision tools in healthcare.","link":"https://prtimes.jp/main/html/rd/p/000000073.000012922.html","categoria":"DIGITAL HEALTH","lang":"en"},{"fonte":"共同通信PRワイヤー","pais":"Japan","titulo":"Epson and Sumitomo Chemical Launch Technology Alliance for Thin-Film Piezoelectric Materials","resumo":"Epson has established a strategic partnership with Sumitomo Chemical focused on the research and development of piezoelectric thin films.\nThe collaboration unites Epson's precision engineering excellence with Sumitomo's advanced chemical expertise.\nThe new components are essential for advancing high-precision sensors and micro-electro-mechanical systems (MEMS).\nThe agreement aims to accelerate industrial innovation and create high-performance technological solutions within the Japanese ecosystem.","link":"https://kyodonewsprwire.jp/release/202608103959","categoria":"NEW MATERIALS","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Fujisawa Hospital Adopts FCNT's Smartphone Nervous System Measurement Technology","resumo":"Fujisawa Hospital will integrate technology that measures autonomic nervous system activity via smartphones.\nThe solution developed by FCNT will be part of the health maintenance and promotion programs sponsored by the medical institution.\nThrough mobile sensors, patients will be able to monitor their stress levels and well-being in a simple, daily manner.\nThe measure exemplifies the expansion of digital medicine in the preventive and accessible monitoring of the population.","link":"https://news.yahoo.co.jp/articles/6a3cb92aeba85b787f8a4eda74f871b3f15320c8","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"观点网","pais":"China","titulo":"China's Proposals for International Quantum Technology Standards Approved","resumo":"China has had two new international standard proposals in the field of quantum technology approved for officialization. The country has already led the publication of three previous international standards on the subject, consolidating its vanguard position in the sector. The initiative reinforces Chinese technical influence in establishing global guidelines for quantum communication and computing. The advancement boosts cooperation and technical standardization among different industrial ecosystems.","link":"https://www.guandian.cn/article/20260818/586236.html","categoria":"QUANTUM TECHNOLOGY","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Cellular 'Invisibility Cloak' Protects Transplanted Pancreatic Islets from the Immune System","resumo":"Scientists have developed a cellular camouflage technique capable of protecting transplanted pancreatic islets against immune system attacks. The innovation aims to eliminate or drastically reduce the need for continuous immunosuppressive medications in patients. The breakthrough represents a major step forward in the treatment of type 1 diabetes and regenerative medicine in general. The approach promises to increase the success rate and safety of future transplant procedures.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569950.shtm","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"美通社","pais":"China","titulo":"XtalPi Introduces 'Genius Agent' AI Scientific Agent to Accelerate the Pharmaceutical Industry","resumo":"XtalPi hosted a special session to introduce its new artificial intelligence agent focused on scientific research, the Genius Agent. The event featured government backing focused on developing the integration between artificial intelligence and the pharmaceutical industry. The technology promises to reduce costs and substantially optimize the time required to discover and validate new drugs. The project reinforces Beijing's and other regions' transition toward industrial models based on data-driven biotechnology.","link":"https://www.prnasia.com/story/544310-1.shtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"人民网","pais":"China","titulo":"Beijing Accelerates the Transition of Robots from the Laboratory to the Market","resumo":"The city of Beijing is intensifying initiatives to drive the commercialization and practical application of robots developed in research centers. The plan aims to bridge scientific production with the productive sector, accelerating the adoption of advanced robotics in industries and services. The strategy includes regulatory support, financing, and the creation of testing zones to validate prototypes in real-world scenarios. With this, the Chinese capital seeks to consolidate its leadership in the global race for automation and physical artificial intelligence.","link":"http://finance.people.com.cn/n1/2026/0818/c1004-40781391.html","categoria":"ROBOTICS","lang":"en"},{"fonte":"观点网","pais":"China","titulo":"Qiangrui Technology Strengthens Partnership in Apple Supply Chain and Supplies Components for Nvidia Rubin Architecture","resumo":"Chinese firm Qiangrui Technology confirmed that it maintains close cooperation with key clients in Apple's ecosystem and has begun supplying equipment for Nvidia's Rubin architecture. The news highlights the crucial role of Chinese technology suppliers in the global hardware ecosystem for artificial intelligence. The move boosts the company's market value amid high demand for advanced servers and chips. Additionally, it demonstrates the resilience and competitiveness of the country's technology supply chains.","link":"https://www.guandian.cn/article/20260818/586391.html","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"South China Morning Post","pais":"China","titulo":"Major US Investors Reshuffle Chinese Tech Stocks Amid AI Boom","resumo":"Several major institutional investors in the United States have significantly altered their positions in portfolios of Chinese technology companies. The move occurs against the backdrop of the artificial intelligence expansion and a reassessment of risks and opportunities in the Asian market. The quest for assets linked to AI infrastructure and advanced applications has shaped new capital allocation strategies. The restructuring reflects the dynamism of China's tech companies, even under geopolitical and regulatory pressures.","link":"https://www.scmp.com/business/china-business/article/3364358/several-us-billionaire-investors-reshuffle-their-chinese-technology-stocks-amid-ai-boom","categoria":"TECH INVESTMENT","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Artificial Intelligence Unveils Musical 'Digital Fingerprint' to Identify Jazz Musicians","resumo":"Researchers applied advanced artificial intelligence algorithms to map and analyze subtle patterns in jazz musicians' performances, creating a sort of sonic fingerprint. The technology can recognize individual interpretation styles, rhythm nuances, and phrasing with extremely high precision. The study demonstrates the sophistication of audio processing models in understanding complex and unstructured artistic expressions. The innovation opens up new possibilities for cultural preservation, music catalog retrieval, and copyright analysis.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569951.shtm","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"新浪财经","pais":"China","titulo":"China Unicom Deploys Innovative Technologies and Satellite Telephony in Flood-Hit Areas","resumo":"China Unicom's Guangxi division has deployed advanced technological solutions, including satellite communication, to restore essential services in regions devastated by storms. The emergency operation made it possible to connect rescue teams and residents in areas isolated by floods in the Nanning region. The initiative highlights the growing integration of orbital and terrestrial networks for disaster management and rapid response to climate emergencies. The use of this infrastructure reinforces the resilience of telecommunication networks in extreme crisis situations.","link":"https://finance.sina.cn/2026-08-18/detail-ininthzt7362972.d.html?vt=4\u0026wm=4007,4007,4007,4007////?vt","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"hercircle.in","pais":"India","titulo":"Companionship, Technology, and More: How We Can Help Aging Women in Our Lives","resumo":"The growing integration of assistive technologies and digital solutions is transforming elderly care for women.\nHealth monitoring tools, smart devices, and communication platforms help combat loneliness and ensure greater autonomy.\nThe advancement of these innovations highlights the importance of tailoring technological products to meet the specific needs of the elderly population.\nThe initiative promotes digital inclusion and a significant improvement in the quality of life for these individuals.","link":"https://hercircle.in/engage/relationships/family-and-friends/companionship-technology-and-more-how-we-can-help-ageing-women-in-our-lives-4622.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"business-standard.com","pais":"India","titulo":"Uravi Defence \u0026 Technology Consolidated Net Profit Jumps 62.79% in the June Quarter","resumo":"Indian company Uravi Defence \u0026 Technology posted a significant 62.79% growth in its consolidated net profit for the quarter ended in June.\nThe result reflects the expansion of operations in the defense and technology sector, driven by increasing demand for strategic solutions in the country.\nThis strong financial performance solidifies the company's position in the national market.\nFurthermore, it highlights ongoing investments in technological innovation and defense in India.","link":"https://www.business-standard.com/markets/capital-market-news/uravi-defence-technology-consolidated-net-profit-rises-62-79-in-the-june-2026-quarter-126081800125_1.html","categoria":"BUSINESS","lang":"en"},{"fonte":"The Hindu","pais":"India","titulo":"Rotating Detonation Engines: The Science and Promise of This Technology","resumo":"Rotating detonation engines represent one of the most promising frontiers in aerospace engineering and modern propulsion.\nBy utilizing continuous detonation waves instead of traditional combustion, these systems promise higher energy efficiency and superior range.\nAdvancements in research within this area could revolutionize space exploration and high-speed transport in the coming decades.\nThe technology is attracting interest from global space agencies due to its potential to reduce operational costs.","link":"https://www.thehindu.com/sci-tech/science/rotating-detonation-engines-the-science-and-the-promises/article71355953.ece","categoria":"SCIENCE","lang":"en"},{"fonte":"Investing.com India","pais":"India","titulo":"Marvell Technology CEO Matthew Murphy Sells $1.77 Million in Shares","resumo":"Marvell Technology CEO Matthew Murphy has sold company shares valued at approximately $1.77 million.\nThe transaction was reported to regulatory bodies and is part of scheduled financial moves by executives in the semiconductor sector.\nAlthough a common wealth management practice, such operations routinely attract the attention of the financial market.\nThe move reflects the current phase of strategic readjustment among global tech and chip giants.","link":"https://in.investing.com/news/stock-market-news/marvell-technology-ceo-matthew-murphy-sells-177-million-in-shares-93CH-5560745","categoria":"BUSINESS","lang":"en"},{"fonte":"Globo","pais":"India","titulo":"TikTok Video Leads to the Discovery of Rare Underground Fish in India","resumo":"A video posted on TikTok has allowed scientists to identify a new species of translucent, subterranean fish in India.\nThe discovery reinforces the unexpected role that social media and citizen science can play in mapping global biodiversity.\nThe biological find helps shed light on poorly explored aquifer ecosystems in the region.\nExperts emphasize that everyday new technologies can accelerate important scientific cataloging.","link":"https://revistagalileu.globo.com/ciencia/noticia/2026/08/video-do-tiktok-leva-a-descoberta-de-peixe-subterraneo-raro-na-india.ghtml","categoria":"SCIENCE","lang":"en"},{"fonte":"ThePrint","pais":"India","titulo":"Chandigarh University Hosts 2-Day National Space Technology Conclave","resumo":"Chandigarh University hosted a national conclave focused on space technologies, bringing together experts and aerospace industry leaders from across India.\nThe two-day event debated the latest advancements in space exploration, satellite development, and opportunities for sector startups.\nThe initiative aims to strengthen the country's space innovation ecosystem and encourage the development of new talent.\nThe gathering solidifies the role of academia in advancing India's space program.","link":"https://theprint.in/india/chandigarh-university-hosts-2-day-national-space-technology-conclave/3017740/","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"Al Jazeera","pais":"India","titulo":"Has India's 'Cockroach' Movement Forced Modi's BJP to Recalibrate Its Agenda?","resumo":"The emergence of the so-called 'Cockroach' movement in India has sparked intense debate over the country's political and social trajectory.\nThe grassroots mobilization uses decentralized strategies and online engagement to question the ruling party's current public policies.\nThe impact of this political resistance could redefine the electoral landscape and influence the Indian government's strategies.\nThe phenomenon exemplifies how new social trends shape public debate in the digital age.","link":"https://www.aljazeera.com/news/2026/8/17/has-indias-cockroach-movement-forced-modis-bjp-to-recalibrate-agenda","categoria":"TRENDS","lang":"en"},{"fonte":"Jornal de Negócios","pais":"Portugal","titulo":"Megawatts Are Not Enough to Build an Artificial Intelligence Economy","resumo":"The expansion of artificial intelligence requires unprecedented energy consumption, challenging global infrastructure.\nMerely guaranteeing energy supply in megawatts will not be enough to sustain the surging demand of data centers.\nThe technology sector must pursue innovative and sustainable solutions to drive the digital transition.\nThis energy limitation could become the primary bottleneck for the advancement of the AI-focused economy in the coming years.","link":"https://www.jornaldenegocios.pt/opiniao/detalhe/megawatts-nao-chegam-para-construir-uma-economia-de-ia","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Pplware","pais":"Portugal","titulo":"Technology That Connects Your Devices to Your Car License Plate Enters Testing Phase","resumo":"A new technology linking electronic devices to vehicle license plates has entered the testing phase.\nThe system promises to facilitate automated toll payments, parking, and other automotive services.\nThe initiative seeks to enhance transaction security and modernize urban mobility in the country.\nExperts are monitoring the testing phase to evaluate efficiency and user data protection.","link":"https://pplware.sapo.pt/motores/tecnologia-que-associa-os-auriculares-bluetooth-a-matricula-do-seu-carro-ja-esta-em-testes/","categoria":"INNOVATION","lang":"en"},{"fonte":"The Portugal News","pais":"Portugal","titulo":"Portugal's High-Tech Exports Reach 2.2 Billion Euros","resumo":"Portugal's high-tech product exports have reached the 2.2 billion euro mark.\nThe growth reflects the strengthening of the innovation ecosystem and increased industrial competitiveness nationwide.\nSectors such as telecommunications, biotechnology, and electronic components drove this positive performance.\nThe result cements the country's role as an emerging hub for advanced technology production in the European market.","link":"https://www.theportugalnews.com/pt/noticias/2026-08-17/as-exportacoes-de-alta-tecnologia-de-portugal-atingiram-os-22-mil-milhoes-de-euros/1071521","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"CentroTV","pais":"Portugal","titulo":"University of Coimbra Boosts Investment in the Blue Economy","resumo":"The University of Coimbra has announced new initiatives to boost research and development within the blue economy.\nThe focus areas include ocean sustainability, marine biotechnology, and offshore renewable energy.\nThe institution aims to bridge the gap between the academic community and businesses to create ecological and profitable solutions.\nThe project strengthens Portugal's position in preserving marine resources and driving scientific advancement in the sector.","link":"https://centrotv.sapo.pt/universidade-de-coimbra-reforca-aposta-na-economia-azul/","categoria":"SCIENCE","lang":"en"},{"fonte":"Diário de Aveiro","pais":"Portugal","titulo":"Science Park Hosts Meeting on Tourism and Innovation","resumo":"A prominent Science Park in Portugal brought together experts to discuss the future of tourism and digital transformation.\nThe event covered the use of artificial intelligence, augmented reality, and sustainability in tourist destination management.\nThe integration of technology and tourism aims to improve visitor experiences and optimize local resources.\nThe meeting highlighted startups and scientific projects promising to modernize one of the economy's most vital sectors.","link":"https://www.diarioaveiro.pt/2026/08/17/parque-de-ciencia-recebe-encontro-sobre-turismo-e-inovacao/","categoria":"INNOVATION","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"Brazilian Leaves Show Business to Launch Tech Medicine Startup in Portugal","resumo":"A Brazilian professional has decided to transition from the entertainment sector to work in health tech in Portugal.\nThe move aims to apply innovative concepts and new digital devices to improve medical treatments.\nThe country has attracted various foreign entrepreneurs interested in its dynamic tech ecosystem.\nThe initiative highlights the fusion of management, science, and medicine in pursuit of more efficient healthcare services.","link":"https://www.publico.pt/2026/08/17/publico-brasil/noticia/brasileiro-troca-show-business-medicina-tecnologia-portugal-2185045","categoria":"HEALTH","lang":"en"},{"fonte":"Notícias de Coimbra","pais":"Portugal","titulo":"Penha Garcia Castle Gets New Scenic LED Lighting","resumo":"The historic Penha Garcia Castle has received a new scenic lighting system based on efficient LED technology.\nThe modernization highlights the local architectural heritage while significantly reducing energy consumption.\nThe project pairs cultural preservation with sustainability, showcasing the monument during nighttime hours.\nThe intervention serves as an example of how technology can be applied to enhance tourism and history.","link":"https://www.noticiasdecoimbra.pt/castelo-de-penha-garcia-ganha-nova-iluminacao-cenica-em-tecnologia-led/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"rtp.pt","pais":"Portugal","titulo":"Scientific Friction: Highlights and Debates in August 2026 Science","resumo":"The program *Scientific Friction* provides an in-depth analysis of recent breakthroughs and debates within the academic community.\nThis edition covers the dissemination of technological discoveries, cutting-edge research, and the impact of science on society.\nThe goal is to make scientific knowledge accessible and engaging to the general public.\nThe show reinforces the importance of critical thinking and innovation in citizens' daily lives.","link":"https://www.rtp.pt/play/p2821/e948726/friccao-cientifica","categoria":"SCIENCE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
