<script nonce="gYvH2Yx4KwyNi7lCTeIZvbdA">
  // Injeta os dados originais no frontend
  const data = [{"fonte":"O GLOBO","pais":"Brasil","titulo":"Apple Intelligence: Como a Apple Combina IA no Dispositivo e Processamento em Nuvem","resumo":"A Apple apresentou a arquitetura do Apple Intelligence, sua nova suíte de inteligência artificial que integra modelos locais e em nuvem.\nO sistema prioriza a privacidade do usuário processando tarefas simples diretamente no chip do dispositivo, sem enviar dados para a internet.\nPara demandas complexas, a empresa utiliza a infraestrutura Private Cloud Compute, garantindo segurança avançada nos servidores.\nEsta abordagem híbrida busca estabelecer um novo padrão de segurança e eficiência para assistentes virtuais e recursos baseados em IA.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/18/apple-intelligence-entenda-como-a-apple-combina-ia-no-aparelho-e-processamento-na-nuvem.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Vietnam.vn","pais":"Brasil","titulo":"Tecnologia de Probióticos Geneticamente Modificados Abre Caminho para Tratamento do Diabetes","resumo":"Pesquisadores desenvolveram bactérias probióticas modificadas geneticamente capazes de auxiliar no tratamento e controle do diabetes.\nA inovação atua na regulação dos níveis de glicose no sangue por meio de respostas biológicas automáticas no trato intestinal.\nEssa abordagem biotecnológica minimiza a necessidade de intervenções invasivas e diárias de insulina nos pacientes.\nO avanço representa um passo promissor para a medicina personalizada e para terapias baseadas em microbioma humano.","link":"https://www.vietnam.vn/pt/cong-nghe-probiotic-bien-doi-gene-mo-ra-tuong-lai-dieu-tri-tieu-duong","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"CNN Brasil","pais":"Brasil","titulo":"Tecnologia Inspirada em Borboletas Promete Revolucionar Monitoramento do Ar","resumo":"Cientistas criaram sensores ópticos inspirados nas estruturas nanométricas das asas de borboletas para detectar poluentes atmosféricos.\nA tecnologia permite identificar gases tóxicos e partículas em suspensão com altíssima precisão e baixo consumo de energia.\nO sistema pode ser integrado a dispositivos portáteis e redes urbanas de monitoramento ambiental em tempo real.\nA aplicação da biomimética promete transformar as estratégias globais de combate à poluição e proteção à saúde pública.","link":"https://www.cnnbrasil.com.br/ciencia/tecnologia-inspirada-em-borboletas-promete-revolucionar-monitoramento-do-ar/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"VEJA","pais":"Brasil","titulo":"Alerta do BCE Aponta Riscos de Bolha em Ações de Tecnologia Ligadas à Inteligência Artificial","resumo":"Economistas do Banco Central Europeu emitiram um alerta sobre a forte valorização e possível bolha nas ações de empresas de tecnologia.\nO otimismo exagerado em torno da inteligência artificial impulsionou as cotações a patamares que podem sofrer correções severas.\nEspecialistas apontam que a alta concentração de investimentos em poucas Big Techs aumenta a vulnerabilidade dos mercados globais.\nA instituição recomenda cautela aos investidores diante de incertezas no retorno financeiro real de projetos em IA.","link":"https://veja.abril.com.br/economia/bolha-de-ia-economistas-do-bce-alertam-para-correcao-das-acoes-de-tecnologia-nos-eua/","categoria":"MERCADO DIGITAL","lang":"pt"},{"fonte":"www.gov.br","pais":"Brasil","titulo":"Ciência no Rádio Explica Descoberta de Açúcar no Espaço e Convida para Curso do Observatório Nacional","resumo":"O programa Ciência no Rádio destacou a recente identificação de moléculas de açúcar complexas em regiões de formação estelar.\nA descoberta de compostos orgânicos no espaço traz novos indícios sobre as origens da vida e a química do universo.\nO Observatório Nacional aproveitou a divulgação do feito para anunciar a abertura de inscrições em um curso gratuito de astronomia.\nA iniciativa visa aproximar o público geral da pesquisa científica avançada e incentivar novos estudantes na área.","link":"https://www.gov.br/observatorio/pt-br/assuntos/noticias/ciencia-no-radio-explica-descoberta-de-acucar-no-espaco-e-convida-para-curso-gratuito-no-observatorio-nacional","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Nexo Jornal","pais":"Brasil","titulo":"Ciência Suja: O que a Análise de Esgotos Revela Sobre Saúde e Sociedade","resumo":"Estudos focados na análise de águas residuais e esgotos estão se consolidando como ferramentas cruciais de vigilância epidemiológica.\nA amostragem de efluentes permite monitorar a circulação de vírus, bactérias e o consumo de substâncias químicas em tempo real.\nEssa metodologia antecipa surtos epidêmicos antes mesmo de notificações hospitalares formais chegarem às autoridades.\nA prática reforça a importância da ciência sanitária preventiva na formulação de políticas públicas de saúde e saneamento.","link":"https://www.nexojornal.com.br/saude-lixo-esgoto-saneamento-basico-alicia-kowaltowski","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Eleições 2026: Justiça Eleitoral Impõe Limites ao Uso de Tecnologia e IA em Campanhas","resumo":"A Justiça Eleitoral do Brasil definiu novas diretrizes para restringir o uso de ferramentas tecnológicas avançadas nas eleições de 2026.\nAs regras visam combater a disseminação de deepfakes e desinformação gerada por inteligência artificial durante a propaganda eleitoral.\nCandidatos e partidos deverão identificar claramente qualquer conteúdo sintetizado ou alterado por softwares digitais.\nA medida busca preservar a integridade do processo democrático e proteger o eleitorado contra manipulações digitais.","link":"https://g1.globo.com/sp/campinas-regiao/videos-jornal-da-eptv-2-edicao-campinas-e-piracicaba/video/eleicoes-2026-justica-eleitoral-limita-uso-de-tecnologia-em-campanhas-no-brasil-14876996.ghtml","categoria":"REGULAÇÃO","lang":"pt"},{"fonte":"Agrolink","pais":"Brasil","titulo":"Tecnologia Inova para Promover Maturação Uniforme em Lavouras de Frutas","resumo":"Novas soluções tecnológicas aplicadas ao agronegócio visam otimizar e padronizar o processo de maturação dos frutos no campo.\nA técnica combina sensores no solo, imagens de satélite e biostimulantes para harmonizar o desenvolvimento das culturas.\nCom a maturação homogênea, produtores conseguem reduzir o desperdício na colheita e melhorar o padrão de qualidade para exportação.\nA inovação fortalece a eficiência do setor frutícola frente aos desafios climáticos e exigências de mercado.","link":"https://www.agrolink.com.br/noticias/tecnologia-mira-maturacao-mais-uniforme-de-frutas_517894.html","categoria":"AGRITECH","lang":"pt"},{"fonte":"ANI News","pais":"Estados Unidos","titulo":"EUA revelam Estratégia de Ciência e Tecnologia para Segurança Nacional com foco em IA e tecnologia avançada","resumo":"O governo dos Estados Unidos apresentou sua nova Estratégia de Ciência e Tecnologia para a Segurança Nacional.\nA diretriz estabelece prioridades estratégicas em inteligência artificial, tecnologias subaquáticas, setor espacial e computação avançada.\nO objetivo principal é reforçar a competitividade tecnológica do país e mitigar ameaças globais emergentes.\nA iniciativa busca integrar o setor privado, a academia e agências governamentais na busca por inovação de ponta.","link":"https://www.aninews.in/news/business/us-unveils-national-security-science-and-technology-strategy-prioritises-ai-space-undersea-and-advanced-technologies20260818095630","categoria":"SEGURANÇA NACIONAL","lang":"pt"},{"fonte":"NVIDIA Newsroom","pais":"Estados Unidos","titulo":"NVIDIA garante campus de tecnologia da SB Energy em Ohio exclusivamente para computação de IA","resumo":"A NVIDIA firmou um acordo estratégico para utilizar com exclusividade o campus de tecnologia da SB Energy em Ohio.\nA instalação será dedicada ao processamento de cargas de trabalho intensivas de inteligência artificial de última geração.\nA iniciativa responde à crescente demanda global por infraestrutura robusta de centros de dados de alta eficiência energética.\nEste movimento consolida a expansão física dos ecossistemas de supercomputação em território norte-americano.","link":"https://nvidianews.nvidia.com/news/nvidia-guarantees-sb-energy-s-ports-pike-technology-campus-in-ohio-to-exclusively-host-nvidia-ai-compute","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"The Conversation","pais":"Estados Unidos","titulo":"Uso de Inteligência Artificial na biotecnologia avança mais rápido que as regulamentações do setor","resumo":"A rápida adoção de algoritmos de inteligência artificial na biotecnologia está superando os marcos regulatórios existentes.\nEspecialistas alertam para riscos de segurança, éticos e operacionais caso diretrizes adequadas não sejam estabelecidas rapidamente.\nModelos generativos estão acelerando a descoberta de medicamentos e a síntese genética com pouca supervisão formal.\nO cenário exige um esforço coordenado entre governos e cientistas para garantir inovação responsável.","link":"https://theconversation.com/the-use-of-ai-in-biotechnology-is-changing-faster-than-the-rules-governing-either-technology-289796","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"CACI Investor Relations","pais":"Estados Unidos","titulo":"CACI é selecionada para modernizar arquiteturas de tecnologia da Força Espacial dos EUA","resumo":"A empresa CACI foi escolhida para fortalecer e modernizar a infraestrutura tecnológica e de sistemas da Força Espacial americana.\nO contrato abrange a atualização de arquiteturas de dados vitais para operações e vigilância orbital da corporação.\nA iniciativa visa garantir resiliência cibernética e soberania de informações defensivas em ambientes espaciais críticos.\nCom isso, as Forças Armadas impulsionam a transição para sistemas operacionais baseados em nuvem e alta confiabilidade.","link":"https://investor.caci.com/2026-08-17-CACI-Selected-to-Strengthen-and-Modernize-Technology-Architectures-for-U-S-Space-Force-Guardians","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"Telescópio Hubble resolve mistério de fusão galáctica dos primeiros anos da Via Láctea","resumo":"Dados obtidos pelo Telescópio Espacial Hubble ajudaram astrônomos a solucionar um enigma sobre os primórdios da Via Láctea.\nA pesquisa revelou detalhes inéditos sobre o processo de fusão de galáxias ancestrais que moldaram a estrutura atual do cosmos.\nO achado fornece pistas fundamentais sobre a distribuição de matéria e o nascimento de sistemas estelares antigos.\nA descoberta aprofunda a compreensão da evolução galáctica ao longo de bilhões de anos.","link":"https://science.nasa.gov/missions/hubble/hubble-solves-merger-mystery-from-milky-ways-early-years/","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"tudocelular.com","pais":"Estados Unidos","titulo":"Apple projeta iPhone 18 Pro com economia de bateria de 30% graças à nova arquitetura GAA","resumo":"A Apple está desenvolvendo o iPhone 18 Pro utilizando a inovadora arquitetura de transistores Gate-All-Around.\nA nova tecnologia promete reduzir o consumo de energia dos processadores em até 30% em comparação com as gerações anteriores.\nAlém da eficiência energética, a mudança traz ganhos expressivos de desempenho e menor dissipação de calor no dispositivo.\nA novidade posiciona a marca na vanguarda da manufatura de semicondutores de ponta para dispositivos móveis.","link":"https://www.tudocelular.com/mercado/noticias/n260857/apple-projeta-chip-a20-iphone-18-pro-mais-bateria.html","categoria":"INOVAÇÃO TECNOLÓGICA","lang":"pt"},{"fonte":"science.nasa.gov","pais":"Estados Unidos","titulo":"Rover Curiosity da NASA comemora 14 anos de exploração na superfície de Marte","resumo":"O robô explorador Curiosity atingiu a marca de 14 anos de operações contínuas no solo do planeta Marte.\nDesde seu pouso em 2012, o rover da NASA recolheu dados cruciais sobre a habitabilidade passada e a geologia martiana.\nMesmo enfrentando desgaste em suas rodas e instrumentos, a missão prossegue enviando descobertas científicas valiosas.\nA longevidade do equipamento exemplifica o sucesso do planejamento e da engenharia espacial norte-americana.","link":"https://science.nasa.gov/blog/curiosity-blog-sols-4975-4981-happy-14th-landing-anniversary/","categoria":"EXPLORAÇÃO ESPACIAL","lang":"pt"},{"fonte":"Valor Econômico","pais":"Estados Unidos","titulo":"BCE alerta para possível correção nas ações de tecnologia dos EUA ligadas à IA","resumo":"O Banco Central Europeu emitiu um aviso sobre o risco de uma correção nos preços das ações de empresas de tecnologia americanas.\nO alerta destaca a forte valorização impulsionada pelo entusiasmo dos investidores em inteligência artificial nos últimos anos.\nAnalistas pontuam que expectativas desmedidas de lucros podem gerar volatilidade e impacto nos mercados financeiros globais.\nA instituição defende maior cautela diante do crescimento vertiginoso no valuation de gigantes do setor.","link":"https://valor.globo.com/financas/noticia/2026/08/17/correo-nas-aes-de-tecnologia-dos-eua-ligadas-ia-est-por-vir-diz-bce.ghtml","categoria":"MERCADO FINANCEIRO","lang":"pt"},{"fonte":"PressReader","pais":"França","titulo":"Hospital: setor de imagem na vanguarda da tecnologia","resumo":"O setor de diagnóstico por imagem de unidades hospitalares está adotando inovações tecnológicas de última geração para aprimorar exames.\nEsses avanços permitem identificar patologias com maior precisão e rapidez, otimizando o tempo de diagnóstico para os pacientes.\nA modernização do serviço representa um impacto direto na qualidade do atendimento e na eficiência da medicina preventiva.","link":"https://www.pressreader.com/france/la-montagne-thiers-ambert/20260818/281685441680208","categoria":"SAÚDE","lang":"pt"},{"fonte":"tv5monde","pais":"França","titulo":"Menores e redes sociais: julgamento da Meta entra na fase decisiva nesta terça-feira","resumo":"O processo judicial que investiga o impacto das redes sociais da Meta na saúde mental de crianças e adolescentes ganha novo ritmo.\nA acusação sustenta que as plataformas utilizam recursos intencionalmente viciantes que prejudicam os usuários mais jovens.\nO desfecho dessa disputa legal pode definir novos regulamentos de segurança digital e proteção de menores em nível global.","link":"https://information.tv5monde.com/science/mineurs-et-reseaux-sociaux-le-proces-de-meta-entre-dans-le-vif-du-sujet-mardi-2833998","categoria":"REDES SOCIAIS","lang":"pt"},{"fonte":"fr.qz.com","pais":"França","titulo":"Como uma paralisação do governo federal afeta a economia americana","resumo":"A paralisação das atividades do governo federal nos Estados Unidos provoca desdobramentos diretos em diversos setores econômicos.\nCom a suspensão temporária de serviços públicos e salários de servidores, o consumo interno sofre impactos imediatos.\nEspecialistas apontam que a duração do bloqueio orçamentário é determinante para medir os danos ao crescimento do país.","link":"https://fr.qz.com/fermeture-du-gouvernement-fdral-effets-conomiques","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Investing.com France","pais":"França","titulo":"Avax One Technologie altera acordo de investimento e amplia montantes de títulos","resumo":"A empresa Avax One Technologie anunciou modificações estratégicas em seus acordos contratuais de investimento financeiro.\nA revisão prevê um aumento expressivo nos valores emitidos em títulos para capitalizar novas frentes de expansão.\nA movimentação reflete a busca da companhia por fortalecer sua estrutura de capital e acelerar projetos operacionais.","link":"https://fr.investing.com/news/sec-filings/avax-one-technologie-modifie-un-accord-dinvestissement-et-augmente-les-montants-des-billets-93CH-3560952","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Auto Plus","pais":"França","titulo":"Mercedes Classe C (2027): o que muda em design, tecnologia e motorização","resumo":"A nova geração do Mercedes Classe C prevista para 2027 promete transformações profundas em sua arquitetura veicular.\nO modelo trará atualizações marcantes no visual, além de um ecossistema tecnológico focado em conectividade e autonomia.\nOpções de motorização mais eficientes e eletrificadas consolidam o compromisso da marca com a transição energética.","link":"https://www.autoplus.fr/actualite/mercedes-classe-c-2027-ce-qui-change-cote-design-technologie-et-motorisations-1461766.html","categoria":"AUTOMOBILÍSTICO","lang":"pt"},{"fonte":"BFM","pais":"França","titulo":"Superaquecimento nos jogos? Como o resfriamento líquido do REDMAGIC Astra 2 supera a concorrência","resumo":"O novo dispositivo REDMAGIC Astra 2 introduz uma solução avançada de refrigeração líquida voltada para jogos intensos.\nO sistema dissipa o calor de forma extremamente eficiente, mantendo o desempenho do processador no máximo sem travamentos.\nEssa inovação estabelece um novo patamar técnico para smartphones focados no público gamer e em alto rendimento.","link":"https://www.bfmtv.com/tech/bons-plans/surchauffe-en-plein-jeu-comment-la-technologie-de-refroidissement-liquide-de-la-redmagic-astra-2-vient-de-ringardiser-la-concurrence_AB-202608170001.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"L'Usine Nouvelle","pais":"França","titulo":"Bilhões de situações recriadas: RATP lança tecnologia própria para testar softwares críticos e evitar acidentes","resumo":"A operadora de transporte RATP desenvolveu uma plataforma tecnológica capaz de simular bilhões de cenários operacionais.\nO objetivo é testar rigorosamente os softwares responsáveis pelo controle de viagens e pela sinalização das linhas.\nA iniciativa reduz drasticamente os riscos de falhas mecânicas ou humanas, elevando os padrões de segurança ferroviária.","link":"https://www.usinenouvelle.com/transports-et-logistique/ferroviaire/des-milliards-de-situations-recreees-la-ratp-deploie-sa-propre-technologie-pour-tester-ses-logiciels-critiques-et-eviter-les-accidents.BWEUWUIUWNBNJJMEQPH4LN65MY.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Kiosque da Aviação","pais":"França","titulo":"Airbus prepara A380 para testar tecnologia de motor de próxima geração","resumo":"A Airbus está adaptando um de seus icônicos aviões A380 para servir como bancada de testes de propulsão avançada.\nO projeto visa avaliar novos motores projetados para reduzir significativamente as emissões de carbono nos voos comerciais.\nOs ensaios práticos em voo representam um passo crucial na busca da aviação comercial por soluções ecologically sustentáveis.","link":"https://kiosquedaaviacao.pt/airbus-prepara-a380-para-testar-tecnologia-de-motor-da-proxima-geracao/","categoria":"AVIAÇÃO","lang":"pt"},{"fonte":"Rayo","pais":"Inglaterra","titulo":"Nova tecnologia robótica para acelerar o diagnóstico de câncer de pulmão no Hospital John Radcliffe","resumo":"O Hospital John Radcliffe está implementando uma nova tecnologia robótica projetada para acelerar significativamente o diagnóstico de câncer de pulmão.\nA inovação permite que médicos alcancem áreas anteriormente inacessíveis dos pulmões de forma minimamente invasiva e com alta precisão.\nEssa abordagem promete reduzir o tempo de espera dos pacientes para início do tratamento, aumentando significativamente as chances de cura e salvando vidas.","link":"https://www.hellorayo.co.uk/hits-radio/oxfordshire/news/robotic-technology-to-speed-up-lung-cancer-diagnosis-in-oxford","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Somerset Live","pais":"Inglaterra","titulo":"Tecnologia de reparo de buracos em cinco minutos está sendo testada em North Somerset","resumo":"Um novo método revolucionário capaz de reparar buracos no asfalto em apenas cinco minutos está em fase de testes em North Somerset.\nA tecnologia utiliza equipamentos modernos e misturas especiais para garantir uma fixação duradoura e de rápida secagem na infraestrutura viária.\nSe for bem-sucedido, o projeto poderá transformar a manutenção das estradas no Reino Unido, reduzindo custos e minimizando o impacto no tráfego local.","link":"https://www.somersetlive.co.uk/news/local-news/five-minute-pothole-repiar-technology-11113902","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"HTX | Home Team Science and Technology Agency","pais":"Inglaterra","titulo":"O poder da sinergia assume o papel principal no HTX Science Day","resumo":"O HTX Science Day destacou a importância da colaboração e da sinergia entre diferentes áreas científicas e tecnológicas para impulsionar a inovação.\nO evento reuniu pesquisadores, especialistas e parceiros da indústria para apresentar avanços científicos e soluções tecnológicas aplicadas à segurança.\nA iniciativa reforça o compromisso de acelerar a transformação digital e científica por meio da cooperação multidisciplinar e do compartilhamento de conhecimento.","link":"https://www.htx.gov.sg/whats-happening/all-news---events/all-news/2026/power-of-synergy-takes-centre-stage-at-htx-science-day","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Rússia adverte o Reino Unido sobre o fornecimento de drones à Ucrânia","resumo":"A Rússia enviou um alerta formal ao Reino Unido em relação ao fornecimento contínuo de tecnologia de drones militares para a Ucrânia.\nO governo russo afirmou que o envio dessas aeronaves não remotamente pilotadas escala ainda mais o conflito na região.\nA declaração intensifica as tensões diplomáticas internacionais, enquanto o Reino Unido reafirma seu apoio tecnológico e militar às forças ucranianas.","link":"https://www.bbc.com/news/articles/cy5dz0kkn0wo","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"Daily Business","pais":"Inglaterra","titulo":"Projeto de data center de £ 300 milhões coloca a IA no centro da economia","resumo":"Um novo projeto de data center avaliado em 300 milhões de libras busca posicionar a inteligência artificial no centro do crescimento econômico do país.\nA infraestrutura de última geração fornecerá o poder computacional necessário para suportar avanços tecnológicos e startups de tecnologia de ponta.\nO investimento reforça a ambição do Reino Unido de se tornar um líder global em IA, atraindo talentos e novos investimentos no setor.","link":"https://dailybusinessgroup.co.uk/2026/08/300m-data-centre-project-puts-ai-at-core-of-economy/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Yahoo Sports","pais":"Inglaterra","titulo":"Nova tecnologia? Premier League analisa de perto experimento ousado da La Liga","resumo":"A Premier League está avaliando a adoção de novas tecnologias que vêm sendo testadas com sucesso na La Liga espanhola.\nAs inovações visam aprimorar as transmissões esportivas e fornecer dados estatísticos e de arbitragem com maior precisão e rapidez aos torcedores.\nEssa iniciativa demonstra o movimento do futebol inglês em direção à modernização tecnológica para otimizar a experiência do público e as decisões de jogo.","link":"https://sports.yahoo.com/articles/technology-premier-league-takes-closer-232340970.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"La Razón","pais":"Espanha","titulo":"Europa arma seus drones com tecnologia que Washington pode bloquear em plena crise: chips, sensores e componentes continuam sob controle dos EUA","resumo":"A União Europeia enfrenta uma vulnerabilidade estratégica significativa em seu programa de drones militares devido à dependência de componentes americanos.\nSistemas críticos como sensores, chips avançados e softwares permanecem sob controle regulatório de Washington, que pode impor restrições de uso.\nEspecialistas alertam que essa dependência compromete a autonomia operacional do bloco europeu em momentos de crises geopolíticas graves.","link":"https://www.larazon.es/tecnologia-consumo/europa-arma-sus-drones-tecnologia-washington-puede-bloquear-plena-crisis-chips-sensores-componentes-siguen-control-ee-uu_202608186a83a678a5690f04737f9bac.html","categoria":"TECNOLOGIA E DEFESA","lang":"pt"},{"fonte":"La Vanguardia","pais":"Espanha","titulo":"Thinex: impressores de tecnologia para a NASA","resumo":"A empresa Thinex consolidou-se como fornecedora estratégica de componentes de alta precisão para a NASA por meio da manufatura avançada.\nA utilização de tecnologias de impressão de última geração permite o desenvolvimento de materiais ultrarresistentes e leves para missões espaciais.\nEssa colaboração destaca o avanço do ecossistema de engenharia e tecnologia no fornecimento de soluções para a exploração aeroespacial.","link":"https://www.lavanguardia.com/economia/20260818/11615514/impresores-tecnologia.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The Objective","pais":"Espanha","titulo":"O dado que falta ao comprar tecnologia: até quando o dispositivo continuará recebendo atualizações","resumo":"A vida útil dos dispositivos eletrônicos é diretamente afetada pelo suporte contínuo de atualizações de software e segurança oferecido pelos fabricantes.\nNo entanto, a falta de transparência sobre a data limite de suporte durante a compra dificulta decisões informadas por parte dos consumidores.\nDiscussões regulatórias e de consumo pressionam por maior clareza na rotulagem comercial para combater a obsolescência programada.","link":"https://theobjective.com/tecnologia/2026-08-18/dato-falta-comprar-tecnologia-actualizaciones/?amp","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Ultima Hora","pais":"Espanha","titulo":"A ciência revela os segredos da peste de 1820 e a culpa não foi dos ratos","resumo":"Novas pesquisas científicas reescreveram a história sobre a disseminação do surto de peste registrado no ano de 1820.\nAnálises genéticas e epidemiológicas demonstraram que a propagação não ocorreu por meio dos roedores, contrariando o consenso histórico prévio.\nA descoberta destaca a relevância de métodos científicos modernos na compreensão de pandemias do passado para aprimorar o combate a futuras ameaças.","link":"https://www.ultimahora.es/noticias/local/2026/08/18/2690713/ciencia-revela-secretos-peste-1820-culpa-fue-ratas.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Site officiel du FC Barcelone","pais":"Espanha","titulo":"Wenger: 'Futebol e ciência precisam caminhar de mãos dadas'","resumo":"Arsène Wenger defendeu publicamente a integração cada vez mais profunda da ciência de dados e análises fisiológicas no futebol moderno.\nO ex-treinador e atual dirigente enfatiza que o monitoramento biométrico e o suporte científico são vitais para prevenir lesões e prolongar carreiras.\nA visão reflete a constante transformação tecnológica no esporte de alto rendimento para otimizar a performance dos atletas.","link":"https://www.fcbarcelona.fr/fr/barca-play/videos/1887587/wenger-football-and-science-have-to-go-hand-in-hand","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"El Español","pais":"Espanha","titulo":"Panamá aposta na nova economia: inteligência artificial, chips e talento para ganhar peso tecnológico","resumo":"O Panamá está implementando um plano estratégico para diversificar sua economia e se posicionar como um hub de tecnologia na América Latina.\nO foco das iniciativas abrange o desenvolvimento de semicondutores, soluções de inteligência artificial e a capacitação de talentos locais.\nCom incentivos governamentais e parcerias internacionais, o país busca atrair investimentos globais e impulsionar a inovação regional.","link":"https://www.elespanol.com/invertia/disruptores-americas/20260818/panama-lanza-nueva-economia-inteligencia-artificial-chips-talento-ganar-peso-tecnologico/1003744354438_0.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"La Razón","pais":"Espanha","titulo":"Autonomia para 60 quilômetros e design off-road repleto de tecnologia: por menos de 350 euros, este patinete elétrico vale muito a pena","resumo":"O mercado de mobilidade urbana ganha destaque com o lançamento de um novo patinete elétrico focado em custo-benefício e versatilidade.\nO veículo conta com alcance de até 60 quilômetros por carga, estrutura resistente para diferentes terrenos e painel digital avançado.\nPor um preço competitivo abaixo de 350 euros, o modelo posiciona-se como uma opção atraente para o transporte diário e recreativo.","link":"https://www.larazon.es/compras/nuestra-eleccion/autonomia-60-kilometros-diseno-todoterreno-cargado-tecnologia-menos-350-euros-este-patinete-electrico-merece-muchisimo-pena_202608186a83093871b42a0b5df455de.html","categoria":"MOBILIDADE","lang":"pt"},{"fonte":"La Opinión de Murcia","pais":"Espanha","titulo":"Tecnologia de satélite para antecipar falhas nos reservatórios de irrigação da Região de Múrcia","resumo":"A Região de Múrcia iniciou o uso de dados de monitoramento via satélite para inspecionar a integridade estrutural dos reservatórios de irrigação.\nA tecnologia permite detectar deformações, vazamentos e anomalias na infraestrutura hídrica com precisão milimétrica e em tempo real.\nA medida visa otimizar a gestão dos recursos hídricos e prevenir falhas graves que possam afetar a agricultura local.","link":"https://www.laopiniondemurcia.es/comunidad/2026/08/17/tecnologia-satelital-anticipar-fallos-balsas-133433790.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"computerweekly.com","pais":"Alemanha","titulo":"Estudo da KPMG: IA Generativa na Economia Alemã em 2026","resumo":"Um novo estudo realizado pela KPMG analisa a adoção e o impacto da inteligência artificial generativa no setor empresarial da Alemanha projetado para 2026.\nA pesquisa destaca como as empresas alemãs estão integrando essas ferramentas avançadas para otimizar processos internos e impulsionar a inovação digital.\nO levantamento evidencia a crescente relevância da automação inteligente como pilar estratégico para manter a competitividade econômica do país no mercado global.","link":"https://www.computerweekly.com/de/feature/KPMG-Studie-Generative-KI-in-der-deutschen-Wirtschaft-2026","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"borncity.com","pais":"Alemanha","titulo":"AOC AG276UZ: Monitor Gamer com Tecnologia de Proteção Ocular","resumo":"A AOC anunciou o lançamento do monitor gamer AG276UZ, equipado com tecnologias avançadas voltadas para o conforto visual e a saúde ocular dos usuários.\nO dispositivo combina alta taxa de atualização e resposta rápida com recursos que reduzem a fadiga visual durante longas sessões de uso.\nA novidade busca atender à demanda crescente por periféricos de alta performance que equilibram desempenho técnico e bem-estar do jogador.","link":"https://borncity.com/news/aoc-ag276uz-gaming-monitor-mit-augenschutz-technologie/","categoria":"HARDWARE","lang":"pt"},{"fonte":"Investing.com Deutsch","pais":"Alemanha","titulo":"CEO da Marvell Technology, Matthew Murphy, Vende US$ 1,77 Milhão em Ações","resumo":"O CEO da Marvell Technology, Matthew Murphy, realizou a venda de um lote de ações da empresa avaliado em aproximadamente 1,77 milhão de dólares.\nA transação financeira foi devidamente registrada nos órgãos reguladores do mercado e chamou a atenção de investidores do setor de semicondutores.\nMovimentações acionárias de altos executivos costumam influenciar a percepção do mercado sobre a avaliação e as perspectivas futuras da companhia.","link":"https://de.investing.com/news/insider-trading-news/ceo-von-marvell-technologie-matthew-murphy-verkauft-aktien-im-wert-von-177-mio-usdollar-93CH-3625310","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Segurança Contra Drones: Novo Centro Visa Impulsionar a Defesa Antidrone","resumo":"A Alemanha anunciou a criação de um novo centro especializado com o objetivo de fortalecer e desenvolver tecnologias de defesa contra drones não autorizados.\nA iniciativa responde a crescentes preocupações com a segurança do espaço aéreo e a proteção de infraestruturas críticas e estratégicas do país.\nO centro focará no avanço de soluções tecnológicas de detecção e neutralização para mitigar riscos operacionais e econômicos representados por essas aeronaves.","link":"https://www.sueddeutsche.de/wirtschaft/sicherheit-vor-drohnen-neues-zentrum-soll-drohnenabwehr-voranbringen-dpa.urn-newsml-dpa-com-20090101-260818-930-544529","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"borncity.com","pais":"Alemanha","titulo":"TCL 32G64: Monitor Gamer com 180Hz e Tecnologia Mini-LED","resumo":"A TCL apresentou o novo monitor para jogos 32G64, destacando-se por sua taxa de atualização de 180Hz e painel com tecnologia Mini-LED.\nA combinação garante imagens de alto contraste, brilho intenso e fluidez aprimorada para uma experiência imersiva em jogos eletrônicos competitivos.\nO lançamento reforça a expansão da marca no mercado de monitores de alta fidelidade visual voltados ao público entusiasta e gamer.","link":"https://borncity.com/news/tcl-32g64-gaming-monitor-mit-180hz-und-mini-led-technologie/","categoria":"HARDWARE","lang":"pt"},{"fonte":"El Economista","pais":"Alemanha","titulo":"Estado É o Único Setor que Cresce na Alemanha: Da Austeridade à Dependência do Gasto Público para Manter o PIB","resumo":"Um novo panorama da economia alemã revela uma mudança estrutural relevante, com o setor público se tornando o principal motor do PIB nacional.\nApós anos de políticas rígidas de austeridade fiscal, o país passa a depender fortemente dos investimentos e gastos do governo para evitar a estagnação.\nAnalistas alertam para os desafios de longo prazo dessa dependência do Estado em um cenário de baixo dinamismo no setor privado.","link":"https://www.eleconomista.es/economia/noticias/14008444/08/26/el-estado-ya-es-lo-unico-que-crece-en-la-economia-de-alemania-de-la-austeridad-a-depender-del-gasto-publico-para-mantener-vivo-el-pib.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"EE Times Japan","pais":"Japão","titulo":"SAIMEMORY busca reestabelecer a base da tecnologia de memória no Japão até 2029","resumo":"A iniciativa SAIMEMORY visa revitalizar a indústria de semicondutores no Japão por meio do desenvolvimento da tecnologia ZAM.\nO projeto busca estabelecer uma base nacional sólida para a produção e pesquisa de memórias avançadas no país.\nCom previsão de comercialização para o ano fiscal de 2029, a meta é recuperar o protagonismo tecnológico japonês no setor.\nA estratégia pretende garantir soberania tecnológica e atender à crescente demanda global por semicondutores de última geração.","link":"https://eetimes.itmedia.co.jp/ee/articles/2608/18/news050.html","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"newscast.jp","pais":"Japão","titulo":"Mercado de fusão nuclear no Japão deve expandir para US$ 25,1 bilhões até 2035","resumo":"Impulsionado por avanços tecnológicos acelerados, o setor de fusão nuclear no Japão projeta um crescimento exponencial nas próximas décadas.\nEstimativas indicam que o mercado local atingirá a marca de US$ 25,1 bilhões até o ano de 2035.\nO país tem intensificado investimentos públicos e privados em busca de fontes de energia limpas e ilimitadas.\nEssa expansão consolida o Japão como um dos líderes globais na corrida pela comercialização da fusão nuclear.","link":"https://newscast.jp/smart/news/3905071","categoria":"ENERGIA","lang":"pt"},{"fonte":"tuat.ac.jp","pais":"Japão","titulo":"Desenvolvida lente ultrafina de ondas terahertz para redes de comunicação de próxima geração","resumo":"Pesquisadores da Universidade de Agricultura e Tecnologia de Tóquio e da ROHM criaram uma lente plana para ondas terahertz.\nA inovação é capaz de transformar sinais em feixes direcionados e afiados, essenciais para tecnologias de comunicação pós-5G e 6G.\nO dispositivo é compacto o suficiente para ser montado diretamente em osciladores de pequeno porte.\nA novidade promete acelerar o desenvolvimento de infraestruturas sem fio ultra-rápidas e eficientes.","link":"https://www.tuat.ac.jp/outline/disclosure/pressrelease/2026/20260818_01.html","categoria":"TELECOMUNICAÇÕES","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Lawson e KDDI lançam lojas conceito com robôs de entrega para revitalizar áreas urbanas","resumo":"A rede de conveniência Lawson aliou-se à gigante de telecomunicações KDDI para transformar o varejo em cidades-dormitório envelhecidas do Japão.\nO novo modelo de loja utiliza redes avançadas de comunicação e robôs autônomos para realizar entregas domiciliares.\nA iniciativa busca atender idosos e moradores locais com dificuldades de locomoção em regiões com serviços escassos.\nO projeto combina tecnologia de ponta e utilidade social para redefinir a conveniência comunitária.","link":"https://news.yahoo.co.jp/articles/2e9b2009dd099655890bdfb89b7557130ffae6bc","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"Yahoo!ファイナンス","pais":"Japão","titulo":"Honda avança no desenvolvimento de tecnologias de segurança impulsionadas por IA","resumo":"As ações da Honda registraram alta no mercado financeiro após relatos sobre seus investimentos na integração de IA ao desenvolvimento automotivo.\nA montadora japonesa busca acelerar a criação de sistemas inteligentes capazes de prever e evitar acidentes no trânsito de forma autônoma.\nA iniciativa reforça a corrida da indústria automobilística rumo a veículos cada vez mais autônomos e seguros.\nO foco em algoritmos avançados consolida a estratégia de inovação tecnológica contínua da empresa.","link":"https://finance.yahoo.co.jp/news/detail/684e8a281b87348b405087b8a6b33e8e6b75c95d","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"SPLYZA adapta tecnologia de análise de movimento por IA do esporte para a medicina","resumo":"A empresa SPLYZA concluiu o registro de seu sistema de análise de marcha baseada em inteligência artificial como dispositivo médico no Japão.\nA tecnologia, originalmente criada para otimizar o desempenho de atletas no ambiente educacional, foi adaptada para diagnósticos clínicos.\nO sistema permite avaliar a mobilidade e os padrões de caminhada de pacientes de forma precisa e não invasiva.\nA transição demonstra o alto potencial de reaplicação de ferramentas de visão computacional na área da saúde.","link":"https://prtimes.jp/main/html/rd/p/000000073.000012922.html","categoria":"SAÚDE DIGITAL","lang":"pt"},{"fonte":"共同通信PRワイヤー","pais":"Japão","titulo":"Epson e Sumitomo Chemical iniciam aliança tecnológica para materiais piezelétricos em filme fino","resumo":"A Epson estabeleceu uma parceria estratégica com a Sumitomo Chemical focada na pesquisa e desenvolvimento de filmes finos piezelétricos.\nA colaboração une a excelência em engenharia de precisão da Epson com o conhecimento químico avançado da Sumitomo.\nOs novos componentes são essenciais para o avanço de sensores de alta precisão e dispositivos microeletromecânicos (MEMS).\nO acordo visa acelerar a inovação industrial e criar soluções tecnológicas de alto desempenho no ecossistema japonês.","link":"https://kyodonewsprwire.jp/release/202608103959","categoria":"NOVOS MATERIAIS","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Hospital Fujisawa adota tecnologia de medição do sistema nervoso por smartphone da FCNT","resumo":"O Hospital Fujisawa integrará uma tecnologia que permite medir a atividade do sistema nervoso autônomo através de smartphones.\nA solução desenvolvida pela FCNT fará parte dos programas de manutenção e promoção de saúde promovidos pela instituição médica.\nAtravés de sensores móbiles, os pacientes poderão monitorar seus níveis de estresse e bem-estar de forma simples e diária.\nA medida exemplifica a expansão da medicina digital no acompanhamento preventivo e acessível da população.","link":"https://news.yahoo.co.jp/articles/6a3cb92aeba85b787f8a4eda74f871b3f15320c8","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"观点网","pais":"China","titulo":"Propostas da China para Padrões Internacionais de Tecnologia Quântica São Aprovadas","resumo":"A China teve duas novas propostas de padrões internacionais no campo da tecnologia quântica aprovadas para oficialização. O país já liderou a publicação de três normas internacionais anteriores sobre o tema, consolidando sua posição de vanguarda no setor. A iniciativa reforça a influência técnica chinesa no estabelecimento de diretrizes globais para comunicação e computação quântica. O avanço impulsiona a cooperação e a padronização técnica entre diferentes ecossistemas industriais.","link":"https://www.guandian.cn/article/20260818/586236.html","categoria":"TECNOLOGIA QUÂNTICA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"‘Capa de Invisibilidade’ Celular Protege Ilhotas Pancreáticas Transplantadas do Sistema Imunológico","resumo":"Cientistas desenvolveram uma técnica de camuflagem celular capaz de proteger ilhotas pancreáticas transplantadas contra ataques do sistema imunológico. A inovação busca eliminar ou reduzir drasticamente a necessidade de medicamentos imunossupressores contínuos em pacientes. O avanço representa um grande passo no tratamento do diabetes tipo 1 e na medicina regenerativa de forma geral. A abordagem promete aumentar a taxa de sucesso e a segurança de futuros procedimentos de transplante.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569950.shtm","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"美通社","pais":"China","titulo":"XtalPi Apresenta Agente Científico de IA 'Genius Agent' para Acelerar a Indústria Farmacêutica","resumo":"A empresa XtalPi promoveu uma sessão especial para apresentar seu novo agente de inteligência artificial voltado à pesquisa científica, o Genius Agent. O evento contou com apoio governamental focado no desenvolvimento da integração entre inteligência artificial e a indústria farmacêutica. A tecnologia promete reduzir custos e otimizar substancialmente o tempo de descoberta e validação de novos medicamentos. O projeto reforça a transição de Pequim e outras regiões para modelos industriais baseados em biotecnologia orientada por dados.","link":"https://www.prnasia.com/story/544310-1.shtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"人民网","pais":"China","titulo":"Pequim Acelera a Transição de Robôs do Laboratório para o Mercado","resumo":"A cidade de Pequim está intensificando iniciativas para impulsionar a comercialização e a aplicação prática de robôs desenvolvidos em centros de pesquisa. O plano visa aproximar a produção científica do setor produtivo, acelerando a adoção de robótica avançada em indústrias e serviços. A estratégia inclui suporte regulatório, financiamento e criação de zonas de teste para validar protótipos em cenários reais. Com isso, a capital chinesa busca consolidar sua liderança na corrida global por automação e inteligência artificial física.","link":"http://finance.people.com.cn/n1/2026/0818/c1004-40781391.html","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"观点网","pais":"China","titulo":"Qiangrui Technology Fortalece Parceria na Cadeia da Apple e Fornece Componentes para a Arquitetura Nvidia Rubin","resumo":"A empresa chinesa Qiangrui Technology confirmou que mantém uma cooperação estreita com clientes-chave do ecossistema da Apple e que passou a fornecer equipamentos para a arquitetura Rubin da Nvidia. A novidade destaca o papel crucial das fornecedoras de tecnologia da China no ecossistema global de hardware para inteligência artificial. O movimento impulsiona o valor de mercado da empresa diante da alta demanda por servidores e chips avançados. Além disso, demonstra a resiliência e a competitividade das cadeias de suprimento de tecnologia do país.","link":"https://www.guandian.cn/article/20260818/586391.html","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"South China Morning Post","pais":"China","titulo":"Grandes Investidores dos EUA Reformulam Ações de Tecnologia Chinesas em Meio ao Boom da IA","resumo":"Diversos investidores institucionais de peso nos Estados Unidos alteraram significativamente suas posições em carteiras de empresas de tecnologia chinesas. O movimento ocorre no contexto de expansão da inteligência artificial e reavaliação de riscos e oportunidades no mercado asiático. A busca por ativos ligados à infraestrutura de IA e aplicações avançadas tem moldado as novas estratégias de alocação de capital. A reestruturação reflete o dinamismo das empresas de tecnologia da China, mesmo sob pressões geopolíticas e regulatórias.","link":"https://www.scmp.com/business/china-business/article/3364358/several-us-billionaire-investors-reshuffle-their-chinese-technology-stocks-amid-ai-boom","categoria":"INVESTIMENTO TECH","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Inteligência Artificial Revela 'Impressão Digital' Musical para Identificar Músicos de Jazz","resumo":"Pesquisadores aplicaram algoritmos avançados de inteligência artificial para mapear e analisar padrões sutis nas execuções de músicos de jazz, criando uma espécie de impressão digital sonora. A tecnologia consegue reconhecer estilos individuais de interpretação, nuance de ritmo e fraseado com altíssima precisão. O estudo demonstra a sofisticação dos modelos de processamento de áudio na compreensão de expressões artísticas complexas e não estruturadas. A inovação abre novas possibilidades para preservação cultural, recuperação de catálogos musicais e análise de direitos autorais.","link":"https://news.sciencenet.cn/htmlnews/2026/8/569951.shtm","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"新浪财经","pais":"China","titulo":"China Unicom Utiliza Tecnologias Inovadoras e Telefonia via Satélite em Áreas Atingidas por Enchentes","resumo":"A divisão de Guangxi da China Unicom implantou soluções tecnológicas avançadas, incluindo comunicação por satélite, para restabelecer os serviços essenciais em regiões devastadas por tempestades. A operação de emergência permitiu conectar equipes de resgate e moradores em áreas isoladas pelas inundações na região de Nanning. A iniciativa destaca a crescente integração de redes orbitais e terrestres para a gestão de desastres e resposta rápida a emergências climáticas. O uso dessa infraestrutura reforça a resiliência das redes de telecomunicação em situações de crise extrema.","link":"https://finance.sina.cn/2026-08-18/detail-ininthzt7362972.d.html?vt=4\u0026wm=4007,4007,4007,4007////?vt","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"hercircle.in","pais":"Índia","titulo":"Companheirismo, Tecnologia e Mais: Como Podemos Ajudar as Mulheres Idosas em Nossas Vidas","resumo":"A crescente integração de tecnologias assistivas e soluções digitais vem transformando o cuidado de mulheres na terceira idade.\nFerramentas de monitoramento de saúde, dispositivos inteligentes e plataformas de comunicação ajudam a combater a solidão e garantem maior autonomia.\nO avanço dessas inovações destaca a importância de adaptar produtos tecnológicos para atender às necessidades específicas da população idosa.\nA iniciativa promove inclusão digital e melhora significativa na qualidade de vida dessas pessoas.","link":"https://hercircle.in/engage/relationships/family-and-friends/companionship-technology-and-more-how-we-can-help-ageing-women-in-our-lives-4622.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"business-standard.com","pais":"Índia","titulo":"Lucro Líquido Consolidado da Uravi Defence \u0026 Technology Salta 62,79% no Trimestre de Junho","resumo":"A empresa indiana Uravi Defence \u0026 Technology registrou um crescimento expressivo de 62,79% em seu lucro líquido consolidado no trimestre encerrado em junho.\nO resultado reflete a expansão das operações no setor de defesa e tecnologia, impulsionada pelo aumento da demanda por soluções estratégicas no país.\nEsse forte desempenho financeiro consolida a posição da companhia no mercado nacional.\nAlém disso, evidencia os investimentos contínuos em inovação tecnológica e defesa na Índia.","link":"https://www.business-standard.com/markets/capital-market-news/uravi-defence-technology-consolidated-net-profit-rises-62-79-in-the-june-2026-quarter-126081800125_1.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"The Hindu","pais":"Índia","titulo":"Motores de Detonação Rotativa: A Ciência e as Promessas dessa Tecnologia","resumo":"Os motores de detonação rotativa representam uma das fronteiras mais promissoras da engenharia aeroespacial e da propulsão moderna.\nAo utilizarem ondas de detonação contínuas em vez da combustão tradicional, esses sistemas prometem maior eficiência energética e alcance superior.\nO avanço das pesquisas nessa área pode revolucionar a exploração espacial e o transporte de alta velocidade nas próximas décadas.\nA tecnologia atrai o interesse de agências espaciais globais pelo seu potencial de reduzir custos operacionais.","link":"https://www.thehindu.com/sci-tech/science/rotating-detonation-engines-the-science-and-the-promises/article71355953.ece","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Investing.com India","pais":"Índia","titulo":"CEO da Marvell Technology, Matthew Murphy, Vende US$ 1,77 Milhão em Ações","resumo":"O presidente-executivo da Marvell Technology, Matthew Murphy, realizou a venda de ações da empresa avaliadas em aproximadamente US$ 1,77 milhão.\nA transação foi reportada a órgãos reguladores e faz parte de movimentações financeiras programadas de executivos do setor de semicondutores.\nEmbora seja uma prática comum de gestão de patrimônio, tais operações costumam atrair a atenção do mercado financeiro.\nO movimento reflete o momento de reajuste estratégico nas gigantes globais de tecnologia e chips.","link":"https://in.investing.com/news/stock-market-news/marvell-technology-ceo-matthew-murphy-sells-177-million-in-shares-93CH-5560745","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Globo","pais":"Índia","titulo":"Vídeo no TikTok Leva à Descoberta de Peixe Subterrâneo Raro na Índia","resumo":"Um vídeo publicado na plataforma TikTok permitiu que cientistas identificassem uma nova espécie de peixe subterrâneo e translúcido na Índia.\nA descoberta reforça o papel inesperado que as redes sociais e a ciência cidadã podem desempenhar no mapeamento da biodiversidade global.\nO achado biológico ajuda a compreender ecossistemas aquíferos pouco explorados da região.\nEspecialistas destacam que novas tecnologias cotidianas podem acelerar catalogações científicas importantes.","link":"https://revistagalileu.globo.com/ciencia/noticia/2026/08/video-do-tiktok-leva-a-descoberta-de-peixe-subterraneo-raro-na-india.ghtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ThePrint","pais":"Índia","titulo":"Universidade de Chandigarh Sedia Conclave Nacional de Tecnologia Espacial de 2 Dias","resumo":"A Universidade de Chandigarh sediou um conclave nacional focado em tecnologias espaciais, reunindo especialistas e líderes da indústria aeroespacial da Índia.\nO evento de dois dias debateu os mais recentes avanços na exploração do espaço, desenvolvimento de satélites e oportunidades para startups do setor.\nA iniciativa visa fortalecer o ecossistema de inovação espacial no país e incentivar a formação de novos talentos.\nO encontro consolida o papel do meio acadêmico no avanço tecnológico do programa espacial indiano.","link":"https://theprint.in/india/chandigarh-university-hosts-2-day-national-space-technology-conclave/3017740/","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"Al Jazeera","pais":"Índia","titulo":"Movimento 'Barata' na Índia Forçará o BJP de Modi a Repensar sua Política?","resumo":"O surgimento do chamado movimento 'Barata' na Índia tem gerado intensos debates sobre os rumos políticos e sociais do país.\nA mobilização popular utiliza estratégias descentralizadas e engajamento online para questionar políticas públicas vigentes do partido governista.\nO impacto dessa resistência política pode redefinir o cenário eleitoral e influenciar as estratégias do governo indiano.\nO fenômeno exemplifica como novas tendências sociais moldam o debate público na era digital.","link":"https://www.aljazeera.com/news/2026/8/17/has-indias-cockroach-movement-forced-modis-bjp-to-recalibrate-agenda","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Jornal de Negócios","pais":"Portugal","titulo":"Megawatts não são suficientes para construir uma economia de Inteligência Artificial","resumo":"A expansão da inteligência artificial exige um consumo energético sem precedentes, desafiando a infraestrutura global.\nApenas garantir o fornecimento de energia em megawatts não será suficiente para sustentar a crescente demanda dos data centers.\nO setor tecnológico precisa buscar soluções inovadoras e sustentáveis para impulsionar a transição digital.\nEssa limitação energética pode se tornar o principal gargalo para o avanço da economia focada em IA nos próximos anos.","link":"https://www.jornaldenegocios.pt/opiniao/detalhe/megawatts-nao-chegam-para-construir-uma-economia-de-ia","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Pplware","pais":"Portugal","titulo":"Tecnologia que conecta seus dispositivos à placa do carro entra em fase de testes","resumo":"Uma nova tecnologia que vincula dispositivos eletrônicos à placa de identificação dos veículos começou a ser testada.\nO sistema promete facilitar o pagamento automatizado de pedágios, estacionamentos e outros serviços automotivos.\nA iniciativa busca aumentar a segurança das transações e modernizar a mobilidade urbana no país.\nEspecialistas acompanham a fase de testes para avaliar a eficiência e a proteção de dados dos usuários.","link":"https://pplware.sapo.pt/motores/tecnologia-que-associa-os-auriculares-bluetooth-a-matricula-do-seu-carro-ja-esta-em-testes/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The Portugal News","pais":"Portugal","titulo":"Exportações de alta tecnologia de Portugal atingem 2,2 bilhões de euros","resumo":"As exportações de produtos de alta tecnologia em Portugal alcançaram a marca de 2,2 bilhões de euros.\nO crescimento reflete o fortalecimento do ecossistema de inovação e o aumento da competitividade industrial do país.\nSetores como telecomunicações, biotecnologia e componentes eletrônicos impulsionaram esse desempenho positivo.\nO resultado consolida o papel do país como um polo emergente na produção de tecnologia avançada para o mercado europeu.","link":"https://www.theportugalnews.com/pt/noticias/2026-08-17/as-exportacoes-de-alta-tecnologia-de-portugal-atingiram-os-22-mil-milhoes-de-euros/1071521","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"CentroTV","pais":"Portugal","titulo":"Universidade de Coimbra reforça investimento na economia azul","resumo":"A Universidade de Coimbra anunciou novas iniciativas para impulsionar a pesquisa e o desenvolvimento na economia azul.\nO foco das atividades abrange a sustentabilidade dos oceanos, biotecnologia marinha e energias renováveis offshore.\nA instituição busca aproximar a comunidade acadêmica das empresas para criar soluções ecológicas e rentáveis.\nO projeto fortalece a posição de Portugal na preservação dos recursos marinhos e no avanço científico do setor.","link":"https://centrotv.sapo.pt/universidade-de-coimbra-reforca-aposta-na-economia-azul/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Diário de Aveiro","pais":"Portugal","titulo":"Parque de Ciência sedia encontro sobre turismo e inovação","resumo":"Um importante Parque de Ciência em Portugal reuniu especialistas para discutir o futuro do turismo e a transformação digital.\nO evento abordou o uso de inteligência artificial, realidade aumentada e sustentabilidade na gestão de destinos turísticos.\nA integração entre tecnologia e turismo visa melhorar a experiência dos visitantes e otimizar recursos locais.\nO encontro destacou startups e projetos científicos que prometem modernizar um dos setores mais vitais da economia.","link":"https://www.diarioaveiro.pt/2026/08/17/parque-de-ciencia-recebe-encontro-sobre-turismo-e-inovacao/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Público","pais":"Portugal","titulo":"Brasileiro deixa o show business para empreender em medicina tecnológica em Portugal","resumo":"Um profissional brasileiro decidiu migrar do setor do entretenimento para atuar na área de saúde tecnológica em Portugal.\nA mudança visa aplicar conceitos inovadores e novos dispositivos digitais para aprimorar os tratamentos médicos.\nO país tem atraído diversos empreendedores estrangeiros interessados em seu dinâmico ecossistema de tecnologia.\nA iniciativa destaca a fusão entre gestão, ciência e medicina na busca por serviços de saúde mais eficientes.","link":"https://www.publico.pt/2026/08/17/publico-brasil/noticia/brasileiro-troca-show-business-medicina-tecnologia-portugal-2185045","categoria":"SAÚDE","lang":"pt"},{"fonte":"Notícias de Coimbra","pais":"Portugal","titulo":"Castelo de Penha Garcia ganha nova iluminação cênica com tecnologia LED","resumo":"O histórico Castelo de Penha Garcia recebeu um novo sistema de iluminação cênica baseado em tecnologia LED eficiente.\nA modernização valoriza o patrimônio arquitetônico local enquanto reduz significativamente o consumo de energia.\nO projeto alia preservação cultural à sustentabilidade, destacando o monumento durante o período noturno.\nA intervenção serve como exemplo de como a tecnologia pode ser aplicada na valorização do turismo e da história.","link":"https://www.noticiasdecoimbra.pt/castelo-de-penha-garcia-ganha-nova-iluminacao-cenica-em-tecnologia-led/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"rtp.pt","pais":"Portugal","titulo":"Fricção Científica: destaques e debates da ciência de agosto de 2026","resumo":"O programa Fricção Científica traz uma análise profunda sobre os avanços recentes e debates na comunidade acadêmica.\nA edição aborda a divulgação de descobertas tecnológicas, pesquisas de ponta e o impacto da ciência na sociedade.\nO objetivo é aproximar o conhecimento científico do público geral de forma acessível e instigante.\nA atração reforça a importância do pensamento crítico e da inovação no cotidiano dos cidadãos.","link":"https://www.rtp.pt/play/p2821/e948726/friccao-cientifica","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Apple Intelligence: How Apple Combines On-Device AI and Cloud Processing","resumo":"Apple has unveiled the architecture for Apple Intelligence, its new artificial intelligence suite that integrates local and cloud-based models.\nThe system prioritizes user privacy by processing simple tasks directly on the device's chip without sending data over the internet.\nFor complex demands, the company utilizes the Private Cloud Compute infrastructure, ensuring advanced security across its servers.\nThis hybrid approach aims to set a new standard of security and efficiency for virtual assistants and AI-driven features.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/18/apple-intelligence-entenda-como-a-apple-combina-ia-no-aparelho-e-processamento-na-nuvem.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Vietnam.vn","pais":"Brazil","titulo":"Genetically Modified Probiotic Technology Paves the Way for Diabetes Treatment","resumo":"Researchers have developed genetically modified probiotic bacteria capable of assisting in the treatment and management of diabetes.\nThe innovation works by regulating blood glucose levels through automated biological responses in the intestinal tract.\nThis biotechnological approach minimizes the need for invasive and daily insulin interventions for patients.\nThe breakthrough represents a promising step for personalized medicine and human microbiome-based therapies.","link":"https://www.vietnam.vn/pt/cong-nghe-probiotic-bien-doi-gene-mo-ra-tuong-lai-dieu-tri-tieu-duong","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"CNN Brasil","pais":"Brazil","titulo":"Butterfly-Inspired Technology Promises to Revolutionize Air Monitoring","resumo":"Scientists have created optical sensors inspired by the nanostructures of butterfly wings to detect atmospheric pollutants.\nThe technology allows for the identification of toxic gases and suspended particles with extremely high precision and low energy consumption.\nThe system can be integrated into portable devices and urban real-time environmental monitoring networks.\nThe application of biomimetics promises to transform global strategies for combating pollution and protecting public health.","link":"https://www.cnnbrasil.com.br/ciencia/tecnologia-inspirada-em-borboletas-promete-revolucionar-monitoramento-do-ar/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"VEJA","pais":"Brazil","titulo":"ECB Warning Highlights Bubble Risks in AI-Linked Tech Stocks","resumo":"European Central Bank economists have issued a warning regarding the sharp appreciation and potential bubble in technology company stocks.\nExaggerated optimism surrounding artificial intelligence has driven stock prices to levels that could experience severe corrections.\nExperts point out that the high concentration of investments in a few Big Tech firms increases the vulnerability of global markets.\nThe institution recommends investor caution amid uncertainties regarding the real financial return of AI projects.","link":"https://veja.abril.com.br/economia/bolha-de-ia-economistas-do-bce-alertam-para-correcao-das-acoes-de-tecnologia-nos-eua/","categoria":"DIGITAL MARKET","lang":"en"},{"fonte":"www.gov.br","pais":"Brazil","titulo":"Science on the Radio Explains Discovery of Sugar in Space and Invites Public to National Observatory Course","resumo":"The Science on the Radio program highlighted the recent identification of complex sugar molecules in star-forming regions.\nThe discovery of organic compounds in space provides new clues about the origins of life and the chemistry of the universe.\nThe National Observatory used the announcement of the feat to open registration for a free astronomy course.\nThe initiative aims to bring the general public closer to advanced scientific research and encourage new students in the field.","link":"https://www.gov.br/observatorio/pt-br/assuntos/noticias/ciencia-no-radio-explica-descoberta-de-acucar-no-espaco-e-convida-para-curso-gratuito-no-observatorio-nacional","categoria":"SCIENCE","lang":"en"},{"fonte":"Nexo Jornal","pais":"Brazil","titulo":"Dirty Science: What Wastewater Analysis Reveals About Health and Society","resumo":"Studies focused on wastewater and sewage analysis are establishing themselves as crucial tools for epidemiological surveillance.\nEffluent sampling makes it possible to monitor the circulation of viruses, bacteria, and chemical substance consumption in real-time.\nThis methodology anticipates epidemic outbreaks even before formal hospital notifications reach the authorities.\nPractices like this reinforce the importance of preventive sanitary science in formulating public health and sanitation policies.","link":"https://www.nexojornal.com.br/saude-lixo-esgoto-saneamento-basico-alicia-kowaltowski","categoria":"SCIENCE","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"2026 Elections: Electoral Court Imposes Limits on the Use of Technology and AI in Campaigns","resumo":"Brazil's Electoral Court has established new guidelines to restrict the use of advanced technological tools in the 2026 elections.\nThe rules aim to combat the spread of deepfakes and misinformation generated by artificial intelligence during electoral propaganda.\nCandidates and parties must clearly identify any content synthesized or altered by digital software.\nThe measure seeks to preserve the integrity of the democratic process and protect the electorate from digital manipulation.","link":"https://g1.globo.com/sp/campinas-regiao/videos-jornal-da-eptv-2-edicao-campinas-e-piracicaba/video/eleicoes-2026-justica-eleitoral-limita-uso-de-tecnologia-em-campanhas-no-brasil-14876996.ghtml","categoria":"REGULATION","lang":"en"},{"fonte":"Agrolink","pais":"Brazil","titulo":"Technology Innovates to Promote Uniform Ripening in Fruit Crops","resumo":"New technological solutions applied to agribusiness aim to optimize and standardize the fruit ripening process in the field.\nThe technique combines soil sensors, satellite imagery, and biostimulants to harmonize crop development.\nWith homogeneous ripening, producers can reduce harvest waste and improve export quality standards.\nThe innovation strengthens the fruit sector's efficiency against climate challenges and market demands.","link":"https://www.agrolink.com.br/noticias/tecnologia-mira-maturacao-mais-uniforme-de-frutas_517894.html","categoria":"AGRITECH","lang":"en"},{"fonte":"ANI News","pais":"United States","titulo":"US Unveils National Security Science and Technology Strategy Focusing on AI and Advanced Tech","resumo":"The United States government has presented its new Science and Technology Strategy for National Security.\nThe directive establishes strategic priorities in artificial intelligence, underwater technologies, the space sector, and advanced computing.\nThe primary goal is to bolster the nation's technological competitiveness and mitigate emerging global threats.\nThe initiative seeks to integrate the private sector, academia, and government agencies in pursuit of cutting-edge innovation.","link":"https://www.aninews.in/news/business/us-unveils-national-security-science-and-technology-strategy-prioritises-ai-space-undersea-and-advanced-technologies20260818095630","categoria":"NATIONAL SECURITY","lang":"en"},{"fonte":"NVIDIA Newsroom","pais":"United States","titulo":"NVIDIA Secures SB Energy Tech Campus in Ohio Exclusively for AI Compute","resumo":"NVIDIA has signed a strategic agreement to exclusively utilize SB Energy's technology campus in Ohio.\nThe facility will be dedicated to processing next-generation artificial intelligence workloads.\nThe initiative responds to the growing global demand for robust, high-energy-efficiency data center infrastructure.\nThis move consolidates the physical expansion of supercomputing ecosystems on North American soil.","link":"https://nvidianews.nvidia.com/news/nvidia-guarantees-sb-energy-s-ports-pike-technology-campus-in-ohio-to-exclusively-host-nvidia-ai-compute","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"The Conversation","pais":"United States","titulo":"Use of Artificial Intelligence in Biotechnology Advances Faster Than Sector Regulations","resumo":"The rapid adoption of artificial intelligence algorithms in biotechnology is outpacing existing regulatory frameworks.\nExperts warn of safety, ethical, and operational risks if proper guidelines are not established quickly.\nGenerative models are accelerating drug discovery and gene synthesis with very little formal oversight.\nThe scenario demands a coordinated effort between governments and scientists to ensure responsible innovation.","link":"https://theconversation.com/the-use-of-ai-in-biotechnology-is-changing-faster-than-the-rules-governing-either-technology-289796","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"CACI Investor Relations","pais":"United States","titulo":"CACI Selected to Modernize U.S. Space Force Technology Architectures","resumo":"CACI has been chosen to strengthen and modernize the technology infrastructure and systems of the U.S. Space Force.\nThe contract includes updating vital data architectures for the corporation's operations and orbital surveillance.\nThe initiative aims to ensure cyber resilience and defensive information sovereignty in critical space environments.\nThrough this, the Armed Forces are driving the transition to high-reliability, cloud-based operating systems.","link":"https://investor.caci.com/2026-08-17-CACI-Selected-to-Strengthen-and-Modernize-Technology-Architectures-for-U-S-Space-Force-Guardians","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"United States","titulo":"Hubble Telescope Solves Mystery of Milky Way's Early Galactic Merger","resumo":"Data obtained by the Hubble Space Telescope has helped astronomers solve a puzzle regarding the early days of the Milky Way.\nThe research revealed unprecedented details about the merger process of ancient galaxies that shaped the current structure of the cosmos.\nThe finding provides fundamental clues about the distribution of matter and the birth of ancient star systems.\nThe discovery deepens the understanding of galactic evolution over billions of years.","link":"https://science.nasa.gov/missions/hubble/hubble-solves-merger-mystery-from-milky-ways-early-years/","categoria":"ASTRONOMY","lang":"en"},{"fonte":"tudocelular.com","pais":"United States","titulo":"Apple Designs iPhone 18 Pro with 30% Battery Savings Thanks to New GAA Architecture","resumo":"Apple is developing the iPhone 18 Pro using the innovative Gate-All-Around transistor architecture.\nThe new technology promises to reduce processor energy consumption by up to 30% compared to previous generations.\nIn addition to energy efficiency, the shift brings significant performance gains and lower heat dissipation in the device.\nThe novelty positions the brand at the forefront of high-end semiconductor manufacturing for mobile devices.","link":"https://www.tudocelular.com/mercado/noticias/n260857/apple-projeta-chip-a20-iphone-18-pro-mais-bateria.html","categoria":"TECHNOLOGICAL INNOVATION","lang":"en"},{"fonte":"science.nasa.gov","pais":"United States","titulo":"NASA's Curiosity Rover Celebrates 14 Years of Exploration on the Martian Surface","resumo":"The Curiosity robotic explorer has reached the milestone of 14 years of continuous operations on the surface of Mars.\nSince its landing in 2012, the NASA rover has gathered crucial data on past habitability and Martian geology.\nEven while facing wear and tear on its wheels and instruments, the mission continues to send back valuable scientific discoveries.\nThe equipment's longevity exemplifies the success of North American space planning and engineering.","link":"https://science.nasa.gov/blog/curiosity-blog-sols-4975-4981-happy-14th-landing-anniversary/","categoria":"SPACE EXPLORATION","lang":"en"},{"fonte":"Valor Econômico","pais":"United States","titulo":"ECB warns of potential correction in US tech stocks tied to AI","resumo":"The European Central Bank has issued a warning regarding the risk of a price correction in American technology stocks.\nThe alert highlights the sharp valuation surge driven by investor enthusiasm for artificial intelligence in recent years.\nAnalysts point out that outsized profit expectations could generate volatility and impact global financial markets.\nThe institution advocates for greater caution in the face of skyrocketing growth in the sector's tech giants.","link":"https://valor.globo.com/financas/noticia/2026/08/17/correo-nas-aes-de-tecnologia-dos-eua-ligadas-ia-est-por-vir-diz-bce.ghtml","categoria":"FINANCIAL MARKET","lang":"en"},{"fonte":"PressReader","pais":"France","titulo":"Hospital: Imaging sector at the forefront of technology","resumo":"The medical imaging department in hospitals is adopting cutting-edge technological innovations to enhance examinations.\nThese advancements enable the identification of conditions with greater precision and speed, optimizing diagnosis times for patients.\nThe modernization of this service represents a direct impact on the quality of care and the efficiency of preventive medicine.","link":"https://www.pressreader.com/france/la-montagne-thiers-ambert/20260818/281685441680208","categoria":"HEALTHCARE","lang":"en"},{"fonte":"tv5monde","pais":"France","titulo":"Minors and social media: Meta's trial enters decisive phase on Tuesday","resumo":"The legal proceedings investigating the impact of Meta's social media platforms on the mental health of children and adolescents are picking up pace.\nThe prosecution maintains that the platforms utilize intentionally addictive features that harm younger users.\nThe outcome of this legal battle could establish new global regulations for digital safety and the protection of minors.","link":"https://information.tv5monde.com/science/mineurs-et-reseaux-sociaux-le-proces-de-meta-entre-dans-le-vif-du-sujet-mardi-2833998","categoria":"SOCIAL MEDIA","lang":"en"},{"fonte":"fr.qz.com","pais":"France","titulo":"How a federal government shutdown affects the American economy","resumo":"The suspension of federal government activities in the United States triggers direct consequences across various economic sectors.\nWith the temporary halt of public services and government salaries, domestic consumption takes an immediate hit.\nExperts point out that the duration of the budget deadlock is a decisive factor in measuring the damage to the country's growth.","link":"https://fr.qz.com/fermeture-du-gouvernement-fdral-effets-conomiques","categoria":"ECONOMY","lang":"en"},{"fonte":"Investing.com France","pais":"France","titulo":"Avax One Technologie amends investment agreement and expands note amounts","resumo":"Avax One Technologie has announced strategic modifications to its financial investment agreements.\nThe revision anticipates a significant increase in the value of issued notes to capitalize on new expansion fronts.\nThe move reflects the company's push to strengthen its capital structure and accelerate operational projects.","link":"https://fr.investing.com/news/sec-filings/avax-one-technologie-modifie-un-accord-dinvestissement-et-augmente-les-montants-des-billets-93CH-3560952","categoria":"BUSINESS","lang":"en"},{"fonte":"Auto Plus","pais":"France","titulo":"Mercedes C-Class (2027): What changes in design, technology, and powertrains","resumo":"The next generation of the Mercedes C-Class, expected in 2027, promises profound transformations in its vehicle architecture.\nThe model will feature striking visual updates alongside a technological ecosystem focused on connectivity and autonomy.\nMore efficient and electrified powertrain options reinforce the brand's commitment to the energy transition.","link":"https://www.autoplus.fr/actualite/mercedes-classe-c-2027-ce-qui-change-cote-design-technologie-et-motorisations-1461766.html","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"BFM","pais":"France","titulo":"Overheating during gaming? How the REDMAGIC Astra 2's liquid cooling outclasses the competition","resumo":"The new REDMAGIC Astra 2 device introduces an advanced liquid cooling solution tailored for intense gaming.\nIt dissipates heat with extreme efficiency, keeping processor performance at its peak without stuttering.\nThis innovation establishes a new technical standard for smartphones targeting the gaming community and high-performance users.","link":"https://www.bfmtv.com/tech/bons-plans/surchauffe-en-plein-jeu-comment-la-technologie-de-refroidissement-liquide-de-la-redmagic-astra-2-vient-de-ringardiser-la-concurrence_AB-202608170001.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"L'Usine Nouvelle","pais":"France","titulo":"Billions of situations recreated: RATP launches proprietary technology to test critical software and prevent accidents","resumo":"Transport operator RATP has developed a technological platform capable of simulating billions of operational scenarios.\nThe objective is to rigorously test the software responsible for travel control and line signaling.\nThis initiative drastically reduces the risks of mechanical or human failure, elevating railway safety standards.","link":"https://www.usinenouvelle.com/transports-et-logistique/ferroviaire/des-milliards-de-situations-recreees-la-ratp-deploie-sa-propre-technologie-pour-tester-ses-logiciels-critiques-et-eviter-les-accidents.BWEUWUIUWNBNJJMEQPH4LN65MY.html","categoria":"INNOVATION","lang":"en"},{"fonte":"Kiosque da Aviação","pais":"France","titulo":"Airbus prepares A380 to test next-generation engine technology","resumo":"Airbus is adapting one of its iconic A380 aircraft to serve as a testbed for advanced propulsion.\nThe project aims to evaluate new engines designed to significantly reduce carbon emissions in commercial flights.\nPractical flight tests represent a crucial step in commercial aviation's search for ecologically sustainable solutions.","link":"https://kiosquedaaviacao.pt/airbus-prepara-a380-para-testar-tecnologia-de-motor-da-proxima-geracao/","categoria":"AVIATION","lang":"en"},{"fonte":"Rayo","pais":"England","titulo":"New robotic technology to accelerate lung cancer diagnosis at John Radcliffe Hospital","resumo":"John Radcliffe Hospital is rolling out new robotic technology designed to significantly speed up lung cancer diagnoses.\nThe innovation allows doctors to reach previously inaccessible areas of the lungs in a minimally invasive manner and with high precision.\nThis approach promises to reduce patient wait times before treatment begins, substantially boosting the chances of a cure and saving lives.","link":"https://www.hellorayo.co.uk/hits-radio/oxfordshire/news/robotic-technology-to-speed-up-lung-cancer-diagnosis-in-oxford","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Somerset Live","pais":"England","titulo":"Five-minute pothole repair technology being trialed in North Somerset","resumo":"A revolutionary new method capable of fixing road potholes in just five minutes is undergoing trials in North Somerset.\nThe technology utilizes modern equipment and special mixtures to ensure durable, fast-drying repairs to road infrastructure.\nIf successful, the project could transform road maintenance across the UK, cutting costs and minimizing disruption to local traffic.","link":"https://www.somersetlive.co.uk/news/local-news/five-minute-pothole-repiar-technology-11113902","categoria":"INNOVATION","lang":"en"},{"fonte":"HTX | Home Team Science and Technology Agency","pais":"England","titulo":"The power of synergy takes center stage at HTX Science Day","resumo":"HTX Science Day highlighted the importance of collaboration and synergy across various scientific and technological fields to drive innovation.\nThe event brought together researchers, specialists, and industry partners to showcase scientific breakthroughs and technological solutions applied to security.\nThe initiative reinforces the commitment to accelerating digital and scientific transformation through multidisciplinary cooperation and knowledge s
