rising oil prices on Japan's economy.\nThe drastic reduction in U.S. energy reserves and market volatility could pressure supply and costs in the country over the coming years.\nThe scenario demands cautious economic strategies and new guidelines to ensure the stability of the Japanese consumer market.","link":"https://news.yahoo.co.jp/articles/1ac1b081c231b0f51df145099a92a24e2b131893","categoria":"ECONOMY","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Rui Hachimura Announces Surprise Return to Japan National Team Targeting Los Angeles Olympics","resumo":"NBA basketball player Rui Hachimura surprised fans by confirming his intention to wear the Japanese national team jersey once again.\nThe athlete highlighted that his main focus is directed toward preparation and participation in the Los Angeles Olympic Games.\nThe announcement stirred the Japanese sports scene and renewed fans' expectations for upcoming international competition cycles.","link":"https://news.yahoo.co.jp/articles/79c3218c165934a1d2ed971be2b35586ef275369/images/000","categoria":"TRENDS","lang":"en"},{"fonte":"読売新聞","pais":"China","titulo":"China Successfully Launches and Recovers Reusable Rocket with Proprietary Technology","resumo":"China achieved a significant milestone in its space program by successfully launching and recovering a reusable space rocket.\nDeveloped with entirely proprietary technology, the project aims to drastically reduce operating costs for orbital missions and increase launch frequency in the country.\nThis achievement reinforces China's ambition to lead the global space race and compete on equal footing with Western private companies like SpaceX.\nThe initiative demonstrates the country's accelerated advancement in aerospace engineering capabilities on the international stage.","link":"https://www.yomiuri.co.jp/world/20260801-GYT1T00051/","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"复旦大学Fudan University","pais":"China","titulo":"Chinese Researchers Decipher Liver Cancer Metastasis Mechanism and Publish in Science Magazine","resumo":"A team of researchers from Fudan University has made a groundbreaking scientific discovery by unraveling the biological process responsible for liver cancer metastasis to the lungs.\nThe study, published in the prestigious journal Science, reveals cellular and molecular pathways that were previously a mystery to modern medicine.\nThe discovery paves the way for the development of targeted new drugs and more effective therapies for patients in advanced stages of the disease.\nThe breakthrough consolidates China's position as an emerging powerhouse in cutting-edge biomedical research and public health innovation.","link":"https://wmzx.fudan.edu.cn/04/1e/c20566a787486/page.htm","categoria":"SCIENCE","lang":"en"},{"fonte":"EL PAÍS English","pais":"China","titulo":"Yang Zhilin: The Rock Enthusiast Leading China's New Artificial Intelligence Wave","resumo":"Founder of the promising artificial intelligence startup Moonshot AI, young scientist Yang Zhilin stands out as one of the brightest minds in the Chinese tech ecosystem.\nHis trajectory bridges a passion for rock music with the development of next-generation language models that challenge global sector giants.\nThe profile addresses his unique vision for the future of AI, seeking creative and functional alternatives beyond dominant market paradigms.\nThe story reflects the dynamism of a new generation of Chinese entrepreneurs in the global AI technology race.","link":"https://english.elpais.com/economy-and-business/2026-08-01/yang-zhilin-the-rock-enthusiast-dreaming-of-ais-other-side.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"New Optical Imaging Technology Allows Low-Cost 3D Visualization of Cellular Structures","resumo":"Chinese scientists have developed a revolutionary optical imaging technique capable of capturing microcellular structure in three dimensions with high precision and low financial cost.\nThe innovative method overcomes the limitations of traditional, expensive microscopes, allowing lower-resource laboratories to conduct advanced cell biology research.\nThe innovation promises to accelerate studies on complex diseases, drug testing, and more accessible, agile clinical diagnostics.\nThe breakthrough highlights Chinese science's ability to create high-impact, cost-effective technological solutions for the global community.","link":"http://news.sciencenet.cn/htmlnews/2026/8/569187.shtm","categoria":"INNOVATION","lang":"en"},{"fonte":"fenati.org.br","pais":"China","titulo":"China bets on green technology and launches data center powered entirely by wind energy","resumo":"As part of its strategy to neutralize carbon emissions, China has put into operation a data center powered directly by energy generated from wind farms.\nThe infrastructure minimizes the environmental impact of the demanding computational needs required by artificial intelligence systems and massive data processing.\nThe project serves as a model for the large-scale sustainable development of the country's information technology industry.\nThe initiative reinforces the Chinese government's position in the transition to renewable energy matrices integrated with cutting-edge technologies.","link":"https://fenati.org.br/china-aposta-tecnologia-verde-data-center-eolico/amp/","categoria":"GREEN TECHNOLOGY","lang":"en"},{"fonte":"sasac.gov.cn","pais":"China","titulo":"China successfully launches Communication Technology Test Satellites 27 A and B","resumo":"China has successfully placed into orbit the pair of communication technology test satellites number twenty-seven, identified as A and B.\nThe launch was carried out from a national space base using a Long March series rocket, precisely fulfilling the planned trajectory.\nThe new satellites will be used to validate advanced data transmission technologies and next-generation space communication networks.\nThe achievement reflects the country's continuous expansion of orbital telecommunications infrastructure to support new technological demands.","link":"http://wap.sasac.gov.cn/n2588025/n2588124/c35707493/content.html","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"手机新浪网","pais":"China","titulo":"Chinese company develops its own CAE software and breaks dependence on foreign technology","resumo":"Technology company Hetu Zhizao has announced the launch of its proprietary computer-aided engineering (CAE) software, achieving autonomy in a strategic sector.\nHistorically dominated by Western suppliers, the industrial software market simulates complex processes essential for advanced manufacturing and aerospace.\nThe domestic solution overcame intellectual property bottlenecks and demonstrated high performance in practical mechanical and thermal simulation tests.\nThe achievement represents an important milestone for China's technological sovereignty in highly complex engineering tools.","link":"https://k.sina.com.cn/article_2183542485_m822636d503301gxo0.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"zijing.com.cn","pais":"China","titulo":"Low-altitude economy reaches new milestone with regulatory body cooperation in China","resumo":"Strategic collaboration between Chinese government agencies has propelled the so-called low-altitude economy sector to a new level of regulatory and operational development.\nThe concept covers the use of drones, electric vertical takeoff and landing (eVTOL) vehicles, and urban air transport for logistics and passengers at low altitudes.\nThe partnership aims to create unified guidelines, navigation infrastructure, and safety standards to accelerate the mass commercialization of these technologies.\nThe advancement positions China at the forefront of creating sustainable and highly efficient urban aerial ecosystems.","link":"https://zijing.com.cn/web/article/1532829120577593344/web/content_1532829120577593344.html","categoria":"INNOVATION","lang":"en"},{"fonte":"ThePrint","pais":"India","titulo":"Hyderabad researchers develop new method to treat biopharmaceutical waste","resumo":"Scientists in Hyderabad have created an innovative solution for purifying effluents from the biopharmaceutical industry.\nThe new methodology stands out for being significantly cheaper and more energy-efficient.\nThe breakthrough promises to reduce the environmental impact of complex chemical waste and optimize costs in the sector.","link":"https://theprint.in/science/hyderabad-researchers-biopharma-waste-technique-energy-efficient/3002807/","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"chshyd.in","pais":"India","titulo":"Ferrari Luce debuts with bold design and advanced technology","resumo":"Ferrari has officially unveiled the Luce model, highlighting an innovative design concept with advanced technology.\nThe vehicle combines high performance with new connectivity systems and optimized aerodynamics.\nThe launch sets a new standard in the automotive market, reinforcing the brand's continuous innovation.","link":"https://chshyd.in/auto/ferrari-luce-debuts/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Adgully.com","pais":"India","titulo":"Technology alone is no longer a competitive advantage, says Volvo CE India executive","resumo":"Yuvraj Sarda, an executive at Volvo CE in India, discussed transformations in the current technology market.\nThe leader emphasized that isolated digital adoption does not guarantee a competitive advantage without strategic alignment.\nThe statement highlights the importance of focusing on services, sustainability, and operational value in the industry.","link":"https://www.adgully.com/post/18759/technology-alone-is-not-a-competitive-advantage-anymore-yuvraj-sarda-volvo-ce-india","categoria":"INNOVATION","lang":"en"},{"fonte":"The News Mill","pais":"India","titulo":"Telangana Vision 2047 sets $3 trillion economy target","resumo":"The state of Telangana has presented its Vision 2047 strategic plan focused on global economic growth.\nThe initiative forecasts major investments in digital infrastructure, technology, and regional sustainability.\nThe main goal is to reach a state GDP of $3 trillion by the centenary of independence.","link":"https://thenewsmill.com/2026/08/telangana-unveils-vision-2047-to-boost-economy-to-3-trillion-with-focus-on-cure-pure-rare-zones/","categoria":"TRENDS","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"5 lessons learned from the Shanghai leg of Formula E","resumo":"The recent Formula E race in Shanghai brought reflections on the advancement of electric vehicles in sports.\nEnergy management strategies and battery performance under high demand were highlights.\nThe event demonstrated how high-level racing drives innovations for sustainable mobility.","link":"https://timesofindia.indiatimes.com/videos/sports/formula-e/shanghai_5_things/videoshow/132784246.cms","categoria":"MOBILITY","lang":"en"},{"fonte":"Hindustan Times","pais":"India","titulo":"UPITS-2026 is a key step towards the trillion-dollar economy goal, says Yogi","resumo":"The government of Uttar Pradesh has announced the UPITS-2026 fair as a central pillar of regional development.\nThe event aims to attract investments in advanced manufacturing, infrastructure, and international trade.\nThe initiative seeks to accelerate the goal of transforming the state into a trillion-dollar economy.","link":"https://www.hindustantimes.com/cities/lucknow-news/upits2026-a-key-step-towards-trillion-dollar-economy-goal-yogi-101785527219924.html","categoria":"BUSINESS","lang":"en"},{"fonte":"India Education Diary","pais":"India","titulo":"Cabinet approves revamped Khelo India Scheme and enhanced support for sports federations","resumo":"The Indian cabinet has approved the restructuring of the Khelo India program to support sports infrastructure.\nThe measure increases financial assistance destined for national federations and the use of technologies in sports.\nThe plan aims to democratize access to sports and prepare athletes for international competitions.","link":"https://indiaeducationdiary.in/cabinet-approves-revamped-khelo-india-scheme-and-enhanced-assistance-to-national-sports-federations-ansfs/","categoria":"GOVERNMENT","lang":"en"},{"fonte":"Meteored Portugal","pais":"Portugal","titulo":"Portuguese science discovers new way to read Mars and helps prepare future human missions","resumo":"Portuguese researchers have developed an innovative methodology to analyze geological data from Mars with greater precision. The discovery allows mapping the composition of the Martian soil in an unprecedented way, paving the way for advancements in space exploration. This technology will be fundamental to planning landing sites and life support for future crewed missions to the red planet. The breakthrough highlights Portugal's growing role in the international scientific and astronomical community.","link":"https://www.tempo.pt/noticias/astronomia/ciencia-portuguesa-descobre-uma-nova-forma-de-ler-marte-e-ajuda-a-preparar-futuras-missoes-humanas.html","categoria":"ASTRONOMY","lang":"en"},{"fonte":"O Mirante","pais":"Portugal","titulo":"Pioneering technology against lower back pain arrives in Médio Tejo","resumo":"A new technological solution aimed at treating and relieving lower back pain has begun to be implemented in the Médio Tejo region. The system uses cutting-edge equipment to offer non-invasive and personalized interventions to patients. The initiative aims to reduce the impact of chronic pain on the population's quality of life and optimize local medical care. The project puts the region in the spotlight for its use of innovations applied to public health.","link":"https://omirante.pt/sociedade/2026-07-31-tecnologia-pioneira-contra-a-dor-lombar-no-medio-tejo-6f9c4d16","categoria":"MEDICINE AND TECHNOLOGY","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Diogo Barardo: “There are no pharmacological shortcuts to aging, only patient science”","resumo":"Scientist Diogo Barardo highlights the challenges and limits of the search for miraculous solutions against cellular aging. According to the expert, increasing longevity with quality depends on rigorous and continuous research, rather than magic pills. The study of the biology of aging seeks to understand the fundamental mechanisms of degeneration in order to intervene safely. The debate reinforces the importance of a critical and ethical view on the promises of the anti-aging market.","link":"https://sapo.pt/artigo/diogo-barardo-nao-ha-atalhos-farmacologicos-para-o-envelhecimento-so-ciencia-paciente-6a6d2a7ed4fdaf18ce7712b8","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Semanário Alto Minho","pais":"Portugal","titulo":"The Ocean as a National Guideline in Portugal's Research Policy","resumo":"Portugal reaffirms marine research as one of the main strategic priorities of its scientific and economic agenda. The initiative aims to strengthen the preservation of marine ecosystems and boost a sustainable blue economy in the country. With incentives for scientific research and oceanic technological development, the strategy positions the nation as a global benchmark in the sector. The plan promises to positively impact both environmental sustainability and marine industrial innovation.","link":"https://www.altominho.com.pt/2026/08/01/o-oceano-como-designio-nacional-na-politica-de-investigacao-de-portugal/","categoria":"SCIENCE","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"Ciência Viva no Verão marks 30 years with an edition focused on the solar eclipse","resumo":"The traditional Ciência Viva no Verão program is celebrating three decades with a special lineup focused on astronomy. This year's edition will prioritize hands-on activities and observation sessions focused on the upcoming solar eclipse visible in the region. The event aims to bring the general public closer to scientific knowledge in an accessible and interactive way across Portugal. In addition to promoting science tourism, the initiative reinforces the importance of scientific literacy for all ages.","link":"https://www.publico.pt/2026/07/31/ciencia/noticia/ciencia-viva-verao-faz-30-anos-edicao-focada-eclipse-solar-2183611","categoria":"SCIENCE COMMUNICATION","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Deloitte opens scholarships for technology students in Setúbal","resumo":"Consulting firm Deloitte has announced the launch of a scholarship program aimed at technology students in the Setúbal region. The goal is to encourage academic training and train new talent to meet the growing demand in the IT job market. In addition to financial support, selected students will have the opportunity to integrate and receive mentorship from experienced professionals in the sector. The initiative strengthens the local innovation ecosystem and helps retain young talent in the region.","link":"https://sapo.pt/artigo/deloitte-abre-bolsas-para-estudantes-de-tecnologia-em-setubal-6a6ca01151a85aa969367825","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"executivedigest.sapo.pt","pais":"Portugal","titulo":"Want to sleep better on hot nights? Science says you should do the opposite of what you think","resumo":"Recent studies on thermal regulation and sleep reveal surprising strategies for dealing with intense heat waves. Contrary to the common sense of seeking immediate cooling with cold showers, science suggests methods that support the body's natural vasodilation. Adopting proper habits before bed significantly improves sleep efficiency and prevents seasonal insomnia. The findings offer practical guidelines for facing heat waves with greater comfort and health.","link":"https://executivedigest.sapo.pt/quer-dormir-melhor-nas-noites-de-calor-a-ciencia-diz-que-deve-fazer-exatamente-o-contrario-do-que-imagina/","categoria":"HEALTH \u0026 SCIENCE","lang":"en"},{"fonte":"Correio de Sintra","pais":"Portugal","titulo":"OCASO Festival unites art and technology at Quinta da Ribafria","resumo":"Quinta da Ribafria is hosting the OCASO Festival, a multifaceted event that explores the intersections between artistic creation and technological innovation. The lineup features interactive installations, digital media, and performances that challenge the public's perception of the digital age. The festival fosters a reflective dialogue among artists, technologists, and the community about the future of culture. The initiative solidifies the region as an emerging hub for innovative cultural and technological experiences.","link":"https://correiodesintra.pt/2026/07/31/festival-ocaso-junta-arte-e-tecnologia-na-quinta-da-ribafria/","categoria":"ART \u0026 TECHNOLOGY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/\.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
