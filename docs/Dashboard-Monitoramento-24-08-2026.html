  <style>
    :root {

      --text-muted: #94A3B8;
      --accent: #D4AF37;
      --accent-hover: #FDE047;
    }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

    header {

      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;

    .logo-container {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo-img {

      border-radius: 8px; /* Caso não seja transparente */

    .logo-text {
      font-weight: 700;
      font-size: clamp(1rem, 2vw, 1.5rem);

      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.35rem;

    .logo-text .title-light,

      color: #fff;
    }
    .logo-text .title-accent {
      color: var(--accent);
    }
    .date-badge {

      border: 1px solid var(--glass-border);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      color: var(--accent);
      font-weight: 600;
    }
    .container {
      padding: 2rem 5%;
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }
    .filters {
      flex: 0 0 300px;

      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 6rem;
    }
    .filter-group {
      margin-bottom: 1.5rem;
    }
    .filter-group label {
      display: block;

      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

      border-radius: 8px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;

    .results {
      flex: 1;
    }
    .results-header {

      align-items: center;

    }

      padding: 1.5rem;

      border-color: rgba(212, 175, 55, 0.5);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;

    .category {

    }
    .country {
      color: var(--text-muted);
    }
    .card-title {

      font-weight: 600;

      margin: 0 0 1rem 0;
      color: #fff;
    }
    .card-summary {

      line-height: 1.6;
      color: var(--text-muted);

    }
    .card-summary ul {
      margin: 0;
      padding-left: 1.2rem;
    }
    .card-summary li {
      margin-bottom: 0.25rem;
    }
    .card-footer {
      margin-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--glass-border);
      padding-top: 1rem;
    }
    .read-more {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .read-more:hover {
      color: var(--accent-hover);
    }
    .source {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .btn-clear {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-top: 0.5rem;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-clear:hover {
      background: var(--accent);
      color: var(--bg-main);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }
    /* Simple CSS reset/scrollbar */
    ::-webkit-scrollbar { width: 8px; }

    ::-webkit-scrollbar-thumb { background: var(--bg-panel); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .filters {
        flex: none;
        width: 100%;
        position: static;
        box-sizing: border-box;
      }
    }

  // Injeta os dados originais no frontend
  const data = [{"fonte":"G1","pais":"Brasil","titulo":"Como pesquisas militares dos EUA viraram base para os cães-robôs da China","resumo":"Análises apontam que o rápido avanço da China no desenvolvimento de cães-robôs militares teve forte base em pesquisas e protótipos iniciados originalmente nos Estados Unidos.\nO ecossistema chinês conseguiu adaptar e aperfeiçoar essas tecnologias de acesso público para produção em massa a custos reduzidos.\nO movimento acende alertas nas forças armadas ocidentais sobre a rápida transferência e o uso dual de tecnologias avançadas de automação.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/24/como-pesquisas-militares-dos-eua-viraram-base-para-os-caes-robos-da-china.ghtml","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"R7","pais":"Brasil","titulo":"Tecnologia leva triagem de câncer de pele para dentro das propriedades rurais","resumo":"Novas iniciativas tecnológicas estão permitindo realizar exames e triagens preventivas de câncer de pele diretamente em áreas rurais de difícil acesso.\nA utilização de dispositivos portáteis acoplados a sistemas digitais facilita a identificação precoce de lesões suspeitas entre trabalhadores do campo.\nA ação amplia o alcance dos serviços de saúde e reduz a necessidade de deslocamentos longos para populações vulneráveis.","link":"https://noticias.r7.com/prisma/mundo-agro/tecnologia-leva-triagem-de-cancer-de-pele-para-dentro-das-propriedades-rurais-24082026/","categoria":"SAÚDE E TECNOLOGIA","lang":"pt"},{"fonte":"InfoMoney","pais":"Brasil","titulo":"Jogos Mundiais de Robôs Humanóides testam limites da tecnologia em 51 provas","resumo":"A realização dos Jogos Mundiais de Robôs Humanóides reúne equipes internacionais para testar limites de agilidade, equilíbrio e autonomia em 51 provas distintas.\nO evento funciona como um grande laboratório aberto para comparar o desempenho de robôs em cenários complexos do mundo real.\nOs avanços observados na competição prometem acelerar o desenvolvimento de máquinas voltadas para tarefas industriais e de assistência.","link":"https://www.infomoney.com.br/mundo/jogos-mundiais-de-robos-humanoides-sao-5-dias-51-provas-e-um-teste-de-tecnologia/","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"IA pode estar freando salários antes de cortar empregos, aponta estudo","resumo":"Estudos recentes indicam que o impacto inicial da Inteligência Artificial no mercado de trabalho pode se manifestar na estagnação salarial antes de provocar demissões em massa.\nProfissões com alta exposição a tarefas automatizáveis enfrentam menor poder de negociação e reajustes contidos.\nO relatório mapeia os setores mais vulneráveis e alerta para a necessidade urgente de requalificação profissional.","link":"https://g1.globo.com/trabalho-e-carreira/noticia/2026/08/23/ia-pode-estar-freando-salarios-antes-de-cortar-empregos-veja-profissoes-mais-expostas-e-rankings.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Billboard Brasil","pais":"Brasil","titulo":"Dr. Dre defende uso de IA na música e revela adoção da tecnologia em suas criações","resumo":"O influente produtor musical Dr. Dre declarou publicamente seu apoio ao uso de ferramentas de Inteligência Artificial na indústria fonográfica.\nO artista revelou que já utiliza essas tecnologias para otimizar processos criativos e explorar novas sonoridades em suas produções recentes.\nA posição contrasta com os receios de parte do setor cultural e reforça o potencial adaptativo da IA na criação artística.","link":"https://billboard.com.br/dr-dre-inteligencia-artificial-ia-musica/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Globo.com","pais":"Brasil","titulo":"Baleias têm espécie de 'impressão digital' de manchas? Estudo investiga","resumo":"Pesquisadores investigaram padrões de manchas na pele de baleias para determinar se funcionam de forma idêntica a impressões digitais humanas.\nA análise detalhada de imagens de alta resolução permitiu mapear marcas únicas que possibilitam identificar indivíduos ao longo dos anos.\nA descoberta promete aprimorar o monitoramento de populações marinhas e fortalecer programas de conservação ambiental sem métodos invasivos.","link":"https://revistagalileu.globo.com/google/amp/ciencia/noticia/2026/08/baleias-tem-especie-de-impressao-digital-de-manchas-estudo-investigou.ghtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Governo da Nova Zelândia apresenta projeto para proibir uso de redes sociais por menores de 16 anos","resumo":"O governo da Nova Zelândia propôs uma nova legislação voltada para proibir o acesso de jovens com menos de 16 anos a plataformas de redes sociais.\nA medida busca combater os impactos negativos do uso excessivo na saúde mental dos adolescentes e mitigar riscos de exposição a conteúdos nocivos.\nA proposta alinha o país a um movimento global crescente de regulação do ambiente digital infantil.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/24/governo-da-nova-zelandia-apresenta-projeto-para-proibir-uso-de-redes-sociais-por-menores-de-16-anos.ghtml","categoria":"REDES SOCIAIS","lang":"pt"},{"fonte":"Diário de Petrópolis","pais":"Brasil","titulo":"Curso gratuito do Serpro oferece fundamentos de Inteligência Artificial","resumo":"O Serpro lançou uma capacitação totalmente gratuita destinada a apresentar os conceitos fundamentais e aplicações de Inteligência Artificial para a sociedade.\nO curso abrange tópicos que vão desde princípios éticos até o funcionamento de algoritmos aplicados ao cotidiano.\nA iniciativa visa democratizar o conhecimento tecnológico e capacitar cidadãos para as novas demandas do mercado de trabalho digital.","link":"https://diariodepetropolis.com.br/integra/quer-entender-de-ia-curso-gratuito-do-serpro-traz-fundamentos-dessa-tecnologia-48526","categoria":"EDUCAÇÃO E TECH","lang":"pt"},{"fonte":"Scripps News","pais":"Estados Unidos","titulo":"Andrew Yang propõe Renda Básica de US$ 15 mil para famílias enquanto a IA transforma a economia dos EUA","resumo":"O político e empresário Andrew Yang apresentou uma proposta para distribuir 15 mil dólares às famílias norte-americanas como resposta às profundas transformações econômicas impulsionadas pela inteligência artificial.\nA iniciativa busca criar uma rede de proteção financeira diante da automação acelerada e do impacto no mercado de trabalho tradicional.\nO debate reacende as discussões sobre renda básica universal nos Estados Unidos e os desafios sociais da transição tecnológica.","link":"https://www.scrippsnews.com/politics/andrew-yang-proposes-15k-for-families-as-ai-transforms-us-economy","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"simplywall.st","pais":"Estados Unidos","titulo":"Ações da Marvell Technology sobem 6,8% após expansão de acordo de chips de IA com o Google","resumo":"A Marvell Technology registrou uma alta expressiva em suas ações após anunciar a ampliação de sua parceria estratégica com o Google no desenvolvimento de chips de inteligência artificial.\nO acordo reforça a posição da empresa no disputado mercado de semicondutores e hardware especializado para infraestrutura de nuvem.\nA movimentação destaca a crescente demanda global por componentes de alta performance capazes de sustentar os avanços em modelos de linguagem e aprendizado de máquina.","link":"https://simplywall.st/stocks/us/semiconductors/nasdaq-mrvl/marvell-technology/news/why-marvell-technology-mrvl-is-up-68-after-expanding-its-equ","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"Science Daily","pais":"Estados Unidos","titulo":"Cientistas transformam pequenas “imperfeições” em um aumento de 5,5x na transferência de calor","resumo":"Pesquisadores descobriram uma maneira inovadora de manipular microdefeitos em materiais para aumentar drasticamente a eficiência na dissipação térmica.\nAo transformar imperfeições estruturais em aliadas, o estudo alcançou um ganho de até 5,5 vezes na capacidade de transferência de calor.\nO avanço promete revolucionar o resfriamento de componentes eletrônicos, chips de computação avançada e sistemas industriais de energia.","link":"https://www.sciencedaily.com/releases/2026/08/260823014940.htm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ixbt.games","pais":"Estados Unidos","titulo":"Desenvolvedor independente acusa Valve de monopólio e critica políticas de moderação para conteúdo adulto","resumo":"Um criador independente de jogos fez duras críticas públicas à Valve, classificando a dona da plataforma Steam como um monopólio no mercado de jogos para PC.\nO desenvolvedor questionou os critérios de moderação aplicados a jogos com conteúdo adulto, alegando falta de transparência e regras inconsistentes.\nO caso reacende o debate sobre o domínio das grandes plataformas de distribuição digital e o impacto de suas políticas no ecossistema indie.","link":"https://ixbt.games/es/news/2026/08/24/429899-indi-razrabotcik-nazval-valve-monopolistom-i-raskritikoval-politiku-moderacii-vzroslogo-kontenta.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Yahoo Finance","pais":"Estados Unidos","titulo":"Broadcom vs. Marvell Technology: Uma métrica decisiva para escolher a melhor ação de chips de IA customizados","resumo":"Analistas financeiros e de tecnologia compararam o desempenho da Broadcom e da Marvell Technology na corrida pela liderança em chips customizados para inteligência artificial.\nA análise destaca uma métrica financeira e operacional crucial que pode definir qual das duas gigantes está melhor posicionada no setor.\nCom a explosão de projetos de IA em nuvem, a disputa pelo fornecimento de semicondutores sob medida tornou-se um dos mercados mais valiosos do mundo tech.","link":"https://finance.yahoo.com/technology/ai/articles/broadcom-vs-marvell-technology-1-172600511.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"EurekAlert!","pais":"Estados Unidos","titulo":"Da \"eliminação\" ao \"reúso\" das águas residuais","resumo":"Uma nova abordagem global está transformando o gerenciamento de efluentes e águas residuais, migrando do descarte simples para estratégias avançadas de reciclagem.\nCom tecnologias modernas de filtragem e tratamento, municípios e indústrias conseguem purificar a água para reutilização em agricultura, processos industriais e consumo humano.\nA transição é vista como um passo essencial para enfrentar a crescente escassez hídrica global e promover a sustentabilidade ambiental.","link":"https://www.eurekalert.org/news-releases/1140796","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Unmanned Systems Technology","pais":"Estados Unidos","titulo":"Pelican lança maletas de proteção de nova geração com ciência de polímeros HPX avançada e acessórios modulares","resumo":"A Pelican anunciou uma nova linha de cases protetores desenvolvidos com uma avançada fórmula do polímero HPX, oferecendo maior resistência a impactos e peso reduzido.\nO produto traz um sistema de acessórios modulares que permite personalizar o interior da maleta para armazenar equipamentos eletrônicos e científicos sensíveis.\nA inovação combina ciência dos materiais e design funcional para atender profissionais que trabalham em condições extremas e ambiciosas.","link":"https://www.unmannedsystemstechnology.com/2026/08/pelican-unveils-next-generation-protector-cases-with-advanced-hpx-polymer-science-modular-accessories/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Belga Share","pais":"Estados Unidos","titulo":"Primeiro pavilhão de Flandres na feira de tecnologia CES em Las Vegas está confirmado para 2027","resumo":"A região belga de Flandres confirmou sua primeira participação oficial com pavilhão próprio na CES, a maior feira de tecnologia do mundo realizada em Las Vegas.\nO espaço exclusivo em 2027 servirá como vitrine para startups e empresas tecnológicas flamengas apresentarem inovações para o mercado global.\nA iniciativa busca fortalecer laços comerciais entre o ecossistema de inovação europeu e os gigantes da tecnologia nos Estados Unidos.","link":"https://www.belganewsagency.eu/press-releases/35671/","categoria":"EVENTOS TECH","lang":"pt"},{"fonte":"Tecsol Quotidien","pais":"França","titulo":"Estudo publicado na revista Science destaca o impacto do setor solar na biodiversidade de aves na China","resumo":"Uma nova pesquisa publicada na conceituada revista Science analisa as consequências\nda expansão das usinas solares sobre a fauna local na China. Os pesquisadores apontam\nefeitos diretos sobre as populações de aves e alertam para a importância de alinhar\na transição para energias renováveis com políticas rígidas de conservação ambiental.","link":"https://tecsol-quotidien.fr/une-etude-publiee-dans-la-revue-science-met-en-evidence-limpact-du-solaire-sur-la-biodiversite-aviaire-en-chine/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"arabnews.jp","pais":"França","titulo":"Parceria entre França e Arábia Saudita em IA se fortalece com expansão da economia digital","resumo":"A França e a Arábia Saudita fortaleceram suas parcerias estratégicas com foco em\ndesenvolvimento de inteligência artificial. A iniciativa acompanha os esforços do\ngoverno saudita para diversificar e expandir sua economia digital. O acordo prevê\ninvestimentos mútuos em inovação, capacitação técnica e intercâmbio científico.","link":"https://www.arabnews.jp/en/saudi-arabia/article_176566/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Orange","pais":"França","titulo":"Atletismo: Recorde mundial de Usain Bolt é superado por um robô","resumo":"Um avanço surpreendente na área de robótica e biotecnologia voltou a impressionar\no público após um robô atingir velocidades superiores às de Usain Bolt em sprint.\nO feito reflete a rápida evolução da engenharia biomecânica e do controle de movimentação.\nA conquista levanta debates sobre os limites do desempenho de máquinas versus humanos.","link":"https://sports.orange.fr/plus-de-sport/athletisme/article/athletisme-le-record-du-monde-de-bolt-battu-par-un-robot-exclu-CNT000002rtzp1.amp","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"La Gazette France","pais":"França","titulo":"Emmanuel Macron marca o retorno do ano político para seus ministros","resumo":"O presidente Emmanuel Macron marcou o reinício das atividades governamentais\nfrancesas ao reunir seu gabinete de ministros em Paris. O encontro define as\nmetas estratégicas para enfrentar os desafios econômicos e sociais dos próximos meses.\nA reunião sinaliza um momento decisivo para a governabilidade e estabilidade do país.","link":"https://www.lagazettefrance.fr/article/emmanuel-macron-sonne-la-rentree-des-classes-pour-ses-ministres","categoria":"POLÍTICA","lang":"pt"},{"fonte":"Libération","pais":"França","titulo":"Em Mayotte, Edouard Philippe promete conter a imigração e critica Mélenchon","resumo":"Em visita oficial ao departamento ultramarino de Mayotte, o ex-primeiro-ministro\nEdouard Philippe prometeu medidas severas para conter o fluxo migratório ilegal.\nO líder político criticou propostas da oposição e defendeu maior rigor nas fronteiras.\nA declaração reativa o debate nacional sobre segurança e soberania territorial.","link":"https://www.liberation.fr/politique/a-mayotte-edouard-philippe-promet-de-mettre-fin-a-lappel-dair-de-limmigration-et-tacle-melenchon-20260822_E5LS3534OZBMTA22WOD7NKTNJE/","categoria":"POLÍTICA","lang":"pt"},{"fonte":"Retail Technology Innovation Hub","pais":"Inglaterra","titulo":"Yankee Candle chega ao TikTok Shop no Reino Unido: RTIH reúne as maiores implementações de tecnologia no varejo da última semana","resumo":"A marca Yankee Candle estreou sua loja oficial no TikTok Shop do Reino Unido, expandindo sua presença no comércio eletrônico social.\nA iniciativa faz parte de uma rodada de grandes implementações de tecnologia voltadas para o setor de varejo britânico.\nO movimento destaca como grandes marcas estão adaptando suas estratégias de vendas para alcançar públicos jovens por meio de plataformas digitais interativas.","link":"https://retailtechinnovationhub.com/home/2026/8/23/yankee-candle-hits-tiktok-shop-uk-check-out-last-weeks-biggest-retail-technology-plays","categoria":"VAREJO TECH","lang":"pt"},{"fonte":"Retail Technology Innovation Hub","pais":"Inglaterra","titulo":"Fundador da Trax capta financiamento para empresa de tecnologia esportiva com IA, Swish Basket","resumo":"Joel Bar-El, fundador da Trax, garantiu novos investimentos para a startup Swish Basket, voltada para tecnologia de inteligência artificial aplicada ao esporte.\nA empresa utiliza algoritmos avançados para analisar métricas de desempenho e aprimorar o treinamento de atletas.\nA captação de recursos reforça a forte demanda de mercado por soluções baseadas em IA no ecossistema esportivo e de alto rendimento.","link":"https://retailtechinnovationhub.com/home/2026/8/23/trax-founder-joel-bar-el-swish-basket-bags-funding-for-ai-sports-technology-firm-swish-basket","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"O GLOBO","pais":"Inglaterra","titulo":"Premier britânico autoriza compartilhamento de tecnologia de mísseis com a Ucrânia antes de reunião em Kiev","resumo":"O primeiro-ministro do Reino Unido autorizou a transferência e o compartilhamento de tecnologia avançada de mísseis para apoiar a Ucrânia.\nO anúncio antecede uma reunião estratégica entre lideranças políticas e militares em Kiev para discutir o alinhamento de defesa.\nA medida representa um passo significativo na cooperação tecnológica militar entre os dois países em meio ao conflito contínuo.","link":"https://oglobo.globo.com/mundo/noticia/2026/08/23/premier-britanico-autoriza-compartilhamento-de-tecnologia-de-misseis-com-a-ucrania-antes-de-reuniao-em-kiev.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Times","pais":"Inglaterra","titulo":"Cartas ao Times: Os riscos e recompensas de apoiar novas tecnologias","resumo":"Uma coletânea de cartas publicadas no jornal The Times analisa os desafios e oportunidades envolvidos no financiamento de tecnologias emergentes.\nEspecialistas debatem o equilíbrio necessário entre o incentivo à inovação radical e a mitigação de riscos financeiros e regulatórios.\nAs discussões destacam o papel crucial do capital de risco e do apoio governamental no desenvolvimento sustentável do setor tecnológico.","link":"https://www.thetimes.com/comment/letters-to-editor/article/times-letters-risks-and-rewards-of-backing-new-technology-3qkrkz3zc","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Broadcast","pais":"Inglaterra","titulo":"YouTube investirá £3 milhões para impulsionar economia de criadores e carreiras no audiovisual","resumo":"O YouTube anunciou um investimento de três milhões de libras focado em expandir a economia dos criadores de conteúdo no Reino Unido.\nOs recursos serão destinados a programas de capacitação e desenvolvimento de carreiras nas indústrias de cinema, televisão e mídia digital.\nA iniciativa visa fortalecer a infraestrutura de talentos e abrir novas oportunidades de emprego para a próxima geração do audiovisual.","link":"https://www.broadcastnow.co.uk/home/youtube-to-invest-3m-to-grow-creator-economy-and-screen-industry-careers/5219613.article","categoria":"ECONOMIA DIGITAL","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"‘Estamos entrando em um novo capítulo’: Líder da OpenAI alerta para ameaça de ciberataques ‘persistentes’ com IA","resumo":"Um executivo da OpenAI alertou que o setor de tecnologia está entrando em uma nova fase crítica, caracterizada por ciberataques automatizados e persistentes movidos por IA.\nO aumento do uso da inteligência artificial por cibercriminosos exige um fortalecimento urgente das defesas de segurança digital em escala global.\nO alerta reforça a necessidade de criar salvaguardas regulatórias e técnicas mais rigorosas para combater essas ameaças emergentes.","link":"https://www.theguardian.com/technology/2026/aug/23/openai-cyber-attacks-threat-chris-lehane","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"epigram.org.uk","pais":"Inglaterra","titulo":"Chamada para jornalistas científicos: ABSW realiza evento em Bristol","resumo":"A Associação de Escritores de Ciência do Reino Unido anunciou a realização de um novo encontro focado no fortalecimento do jornalismo científico em Bristol.\nO evento reunirá profissionais, acadêmicos e divulgadores para debater as melhores práticas de comunicação em saúde, tecnologia e meio ambiente.\nA conferência busca capacitar comunicadores para enfrentar a desinformação e aproximar os avanços da pesquisa científica do grande público.","link":"https://epigram.org.uk/calling-all-science-writers-absw-is-coming-to-bristol/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Libertad Digital","pais":"Espanha","titulo":"A ciência reescreve a história da camada de ozônio: começou antes dos CFCs, longe da Antártida","resumo":"Pesquisadores reescreveram a cronologia da degradação da camada de ozônio ao revelarem que os primeiros impactos ocorreram antes da popularização dos clorofluorcarbonetos (CFCs). A descoberta demonstra que os danos atmosféricos começaram longe das regiões polares, desafiando os modelos climáticos tradicionais.\nEssa nova perspectiva histórica reforça a necessidade de reavaliar as teorias sobre emissões industriais antigas e seus impactos globais de longo prazo.","link":"https://www.libertaddigital.com/ciencia-tecnologia/ciencia/2026-08-24/la-ciencia-reescribe-la-historia-de-la-capa-de-ozono-empezo-antes-de-los-cfc-lejos-de-la-antartida-7448412/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Forbes España","pais":"Espanha","titulo":"Mar Malagón: \"A ciência deve fazer parte da estratégia do país\"","resumo":"A pesquisadora Mar Malagón defendeu publicamente que a investigação científica seja integrada de forma estrutural à estratégia socioeconômica e política do país.\nSegundo a cientista, o investimento contínuo em pesquisa é o pilar fundamental para garantir a inovação, a soberania tecnológica e o desenvolvimento sustentável.\nO posicionamento busca impulsionar novas políticas públicas que valorizem a ciência como motor de transformação e bem-estar social.","link":"https://forbes.es/health/991801/investigacion-obesidad/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"consalud.es","pais":"Espanha","titulo":"O genoma paquistanês desafia o que a ciência pensava saber sobre os genes humanos","resumo":"Um estudo abrangente sobre o sequenciamento do genoma da população paquistanesa revelou variações genéticas inéditas que questionam conceitos consolidados da genética humana.\nA diversidade única identificada permitiu descobrir mutações raras cruciais para a compreensão de diversas patologias hereditárias e complexas.\nOs achados destacam a urgência de diversificar os estudos genômicos para além das populações de origem europeia na medicina global.","link":"https://www.consalud.es/pacientes/el-genoma-pakistani-desafia-lo-que-la-ciencia-creia-saber-sobre-los-genes-humanos.html","categoria":"GENÉTICA","lang":"pt"},{"fonte":"EL PAÍS","pais":"Espanha","titulo":"LIV Golf, a milionária liga saudita, encerra atividades até novo aviso","resumo":"A polêmica e milionária liga LIV Golf, financiada pelo fundo soberano da Arábia Saudita, suspendeu imprevisivelmente suas operações por tempo indeterminado.\nO circuito, que abalou a estrutura do golfe profissional mundial com contratos astronômicos, enfrenta agora graves incertezas operacionais e institucionais.\nA paralisação repentina reabre discussões intensas sobre a sustentabilidade financeira do projeto e o impacto das ligas privadas no esporte global.","link":"https://elpais.com/deportes/2026-08-23/liv-golf-la-millonaria-liga-saudi-cierra-por-defuncion-hasta-nuevo-aviso.html","categoria":"ESPORTES","lang":"pt"},{"fonte":"Redacción médica","pais":"Espanha","titulo":"A tecnologia pioneira do Hospital 12 de Octubre para acelerar o diagnóstico de patologias mitocondriais","resumo":"O Hospital Universitario 12 de Octubre desenvolveu uma plataforma tecnológica inovadora focada em reduzir drasticamente o tempo de diagnóstico de doenças mitocondriais raras.\nA ferramenta utiliza análises genéticas avançadas para identificar mutações complexas com elevado grau de precisão e agilidade.\nA iniciativa promete transformar o atendimento médico, permitindo intervenções terapêuticas precoces e encerrando anos de incerteza para os pacientes.","link":"https://www.redaccionmedica.com/innovacion/20260823/la-tecnologia-pionera-del-de-octubre-para-frenar-la-odisea-diagnostica-patologias-mitocondriales/349397_0.html","categoria":"SAÚDE","lang":"pt"},{"fonte":"Spektrum der Wissenschaft","pais":"Alemanha","titulo":"China adia o lançamento da sonda lunar Chang'e 7","resumo":"A China decidiu adiar o lançamento programado da sua missão espacial Chang'e 7, projetada para explorar o polo sul da Lua em busca de água e recursos minerais.\nA decisão visa garantir ajustes técnicos cruciais e testes adicionais nos instrumentos científicos avançados que compõem a sonda espacial.\nO adiamento altera o cronograma da corrida espacial moderna, mas destaca a busca por máxima segurança em missões lunares complexas.","link":"https://www.spektrum.de/news/china-verschiebt-start-der-mondsonde-change-7/2341310","categoria":"CIÊNCIA ESPACIAL","lang":"pt"},{"fonte":"Bild der Wissenschaft","pais":"Alemanha","titulo":"Primeiro trio de buracos negros supermassivos é descoberto em galáxia primordial","resumo":"Astrônomos identificaram pela primeira vez um sistema triplo de buracos negros supermassivos interagindo em uma galáxia nos primórdios do universo.\nA descoberta sem precedentes desafia os modelos teóricos atuais sobre a evolução galáctica e o crescimento de estruturas gravitacionais extremas.\nO achado oferece novas pistas sobre os processos de fusão cósmica que moldaram o cosmos logo após o Big Bang.","link":"https://wissenschaft.de/artikel/erstes-trio-massereicher-schwarzer-loecher-in-frueher-galaxie-entdeckt","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"Primeiro computador quântico de átomos neutros 'Harumi' entra em operação no Japão","resumo":"O Japão iniciou a operação do 'Harumi', o primeiro computador quântico de pilha completa baseado em átomos neutros do país. A iniciativa representa um salto significativo para a infraestrutura de supercomputação e pesquisa tecnológica nacional. O sistema promete acelerar simulações complexas e impulsionar o desenvolvimento de novos materiais e medicamentos.","link":"https://prtimes.jp/main/html/rd/p/000000012.000165874.html","categoria":"COMPUTAÇÃO QUÂNTICA","lang":"pt"},{"fonte":"ビジネス+IT","pais":"Japão","titulo":"Governo japonês amplia incentivos fiscais para IA e tecnologia quântica em 17 áreas estratégicas","resumo":"O governo japonês anunciou a expansão de incentivos fiscais e investimentos de grande escala em 17 setores estratégicos, com foco em IA e quântica. A iniciativa visa consolidar a soberania tecnológica do país e impulsionar a competitividade global. Espera-se atrair capital privado e acelerar a transição da indústria para soluções de próxima geração.","link":"https://www.sbbit.jp/article/cont1/186649","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"客观日本","pais":"Japão","titulo":"Universidade Keio desenvolve IA para evitar falsos alarmes em sensores de veículos autônomos","resumo":"Pesquisadores da Universidade Keio criaram um modelo de inteligência artificial projetado para evitar detecções incorretas em sensores automotivos. A tecnologia melhora significativamente a precisão na identificação de obstáculos e pedrestes em tempo real. O avanço representa um passo essencial para aumentar a segurança e confiabilidade da condução autônoma em cenários complexos.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_yunshu/pt20260824000012.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"obayashi.co.jp","pais":"Japão","titulo":"Tecnologia de comunicação via-veículo é desenvolvida para reforçar segurança autônoma","resumo":"Foi desenvolvida uma nova tecnologia de comunicação entre estradas e veículos (V2I) para apoiar a navegação autônoma diretamente pela infraestrutura viária. O sistema transmite dados críticos em tempo real sobre o trânsito e perigos fora do alcance visual dos sensores de bordo. A inovação promete reduzir acidentes e viabilizar redes operacionais de transporte inteligente.","link":"https://www.obayashi.co.jp/news/detail/news20260824_1.html","categoria":"MOBILIDADE","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"Japão realiza testes com ônibus elétrico e autônomo guiado por IA na região de Koshien","resumo":"Um projeto experimental com ônibus elétricos autônomos impulsionados por inteligência artificial teve sua rota expandida até a estação de Koshien. A iniciativa almeja obter a certificação de autonomia Nível 4 até o ano fiscal de 2027. O avanço busca oferecer soluções para a escassez de motoristas e modernizar o transporte público regional.","link":"https://prtimes.jp/main/html/rd/p/000003702.000005180.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"アットプレス","pais":"Japão","titulo":"Nova técnica permite fabricar transistores de filme fino em temperatura ambiente sem calor","resumo":"Pesquisadores apresentaram um processo inovador capaz de criar transistores de filme fino totalmente em temperatura ambiente, eliminando a etapa de tratamento térmico. A técnica reduz drasticamente os custos e o consumo energético no processo de fabricação de semicondutores. A descoberta abre caminho para a integração de eletrônicos em substratos flexíveis e sensíveis à temperatura.","link":"https://www.atpress.ne.jp/news/625206","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"客观日本","pais":"Japão","titulo":"Cientistas utilizam tecnologia de resgate viral para mapear o ciclo de carbono no oceano","resumo":"Uma pesquisa científica utilizou a tecnologia de resgate viral para reconstituir vírus marinhos e elucidar seu papel no ciclo do carbono oceânico. O estudo traz novas perspectivas para a compreensão do impacto climático nos ecossistemas marinhos e suas aplicações na aquicultura. Os achados fortalecem estratégias de preservação ambiental e sustentabilidade pesqueira.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_kjdx/pt20260824000013.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ロイター","pais":"Japão","titulo":"Robô humanoide chinês supera tempo de Usain Bolt nos 100 metros e exibe avanço técnico","resumo":"Um robô humanoide desenvolvido na China demonstrou avanços surpreendentes de mobilidade ao atingir marcas de velocidade superiores ao recorde mundial dos 100 metros rasos. A demonstração evidenciou o progresso do controle dinâmico, equilíbrio e motores de alta precisão. O feito destaca a rápida evolução da robótica física aplicada no cenário internacional.","link":"https://jp.reuters.com/economy/UQNK3Z4BDVPJFIIQJDIGQ3VQ44-2026-08-24/","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"TBS NEWS DIG","pais":"China","titulo":"Pequim Sedia Jogos Esportivos de Robôs Humanoides com Mais de 2.000 Competidores","resumo":"A cidade de Pequim sediou uma competição histórica de esportes para robôs humanoides, reunindo mais de 2.000 máquinas disputando 51 modalidades esportivas.\nImpulsionados por inteligência artificial e controle avançado de movimento, diversos robôs superaram marcas de recordes mundiais humanos em habilidades atléticas.\nO evento destaca o rápido salto tecnológico e a maturidade da robótica e automação chinesa.","link":"https://newsdig.tbs.co.jp/articles/-/2891534","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"Vandal","pais":"China","titulo":"China Desenvolve Canhão Eletromagnético Capaz de Perfurar Blindagens Pesadas","resumo":"Pesquisadores chineses relataram progressos significativos no desenvolvimento de armas de energia cinética ao criarem um canhão eletromagnético de alta velocidade.\nA tecnologia utiliza campos magnéticos intensos para disparar projéteis a velocidades hipersônicas, com capacidade de perfurar blindagens de grande porte.\nO avanço demonstra a evolução da engenharia militar e da física aplicada no país.","link":"https://vandal.elespanol.com/random/no-es-ciencia-ficcion-china-fabrica-un-railgun-que-podria-partir-en-dos-un-tanque-norteamericano/43648.html","categoria":"TECNOLOGIA MILITAR","lang":"pt"},{"fonte":"wuhan.gov.cn","pais":"China","titulo":"Especialistas Detalham Avanços no Reator 'Sol Artificial' e no Futuro da Fusão Nuclear","resumo":"Durante um evento de divulgação científica, especialistas detalharam os mais recentes avanços do reator de fusão nuclear chinês, conhecido como 'Sol Artificial'.\nA iniciativa busca replicar as reações do núcleo solar para gerar energia limpa, inesgotável e segura em larga escala.\nO projeto consolida a posição da China na vanguarda da física de plasma e da transição energética global.","link":"https://www.wuhan.gov.cn/whyw/bmdt/202608/t20260824_2837793.shtml","categoria":"ENERGIA NUCLEAR","lang":"pt"},{"fonte":"中国科技网","pais":"China","titulo":"Prêmio de Mapeamento Científico da China Anuncia Vencedores com Destaque para Jovem Talento","resumo":"A edição de 2026 do prestigiado Prêmio de Mapeamento Científico da China revelou seus vencedores, concedendo financiamento direto para a pesquisa básica.\nO anúncio destacou a eleição do primeiro cientista nascido após 1995 a receber a honraria, simbolizando a renovação geracional da pesquisa no país.\nA premiação apoia jovens talentos com recursos financeiros substanciais sem restrições de aplicação.","link":"https://www.stdaily.com/web/gdxw/2026-08/24/content_568783.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"中国科技网","pais":"China","titulo":"China Apresenta o Primeiro Acelerador de Íons Pesados 'Três em Um' do Mundo","resumo":"Uma instalação científica de ponta na China revelou o funcionamento do primeiro sistema acelerador de íons pesados de alta intensidade 'três em um' do mundo.\nO equipamento de grande porte permite experimentos inéditos sobre a estrutura da matéria e reações nucleares extremas.\nA infraestrutura posiciona o país na liderança das pesquisas de fronteira em física nuclear e radiobiologia.","link":"https://www.stdaily.com/web/2026-08/24/content_568545.html","categoria":"FÍSICA","lang":"pt"},{"fonte":"东方财富","pais":"China","titulo":"Moore Threads Lança Documento Técnico para Reduzir Custos de Inferência em IA","resumo":"A fabricante chinesa de unidades de processamento gráfico Moore Threads publicou um livro branco técnico focado em solucionar o gargalo de custos na inferência de inteligência artificial.\nA solução aborda otimizações de arquitetura de hardware e software para viabilizar o processamento eficiente de textos longos.\nO avanço impulsiona a competitividade e a sustentabilidade econômica dos ecossistemas de IA.","link":"https://wap.eastmoney.com/a/202608243850499837.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"新华网","pais":"China","titulo":"Conferência de Computação Verde e IA de 2026 Debata a Economia de Tokens","resumo":"A Conferência de Computação Verde e Inteligência Artificial de 2026 reuniu especialistas para debater a eficiência energética dos centros de dados e a emergente economia de tokens.\nO fórum discutiu arquiteturas sustentáveis de hardware e algoritmos otimizados para reduzir o consumo de energia da IA generativa.\nA iniciativa visa equilibrar a crescente demanda por poder computacional com metas de sustentabilidade ambiental.","link":"https://www.news.cn/20260823/21a3a84caa9b4100a2afbb0198bfbb59/c.html","categoria":"COMPUTAÇÃO VERDE","lang":"pt"},{"fonte":"ncsti.gov.cn","pais":"China","titulo":"Pequim Publica Primeiros Casos Típicos do Uso de Inteligência Artificial na Pesquisa Científica","resumo":"A cidade de Pequim divulgou oficialmente o primeiro lote de casos exemplares que demonstram como a inteligência artificial está impulsionando a pesquisa científica.\nEntre os projetos selecionados estão modelos aplicados ao desenvolvimento de novos materiais e biologia estrutural.\nA iniciativa busca acelerar descobertas científicas integrando inteligência artificial ao método experimental tradicional.","link":"https://www.ncsti.gov.cn/kjdt/scyq/hrkxc/cqdt/202608/t20260824_254263.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The Economic Times","pais":"Índia","titulo":"Índia pode registrar grande crescimento em baterias de íon de sódio com avanço tecnológico","resumo":"O setor de energia renovável da Índia projeta um avanço significativo no uso de baterias de íon de sódio após a tecnologia atingir o Nível de Maturidade Tecnológica 7 (TRL-7).\nEssa evolução representa uma alternativa promissora ao lítio, reduzindo custos de armazenamento de energia.\nA iniciativa promete impulsionar a transição energética nacional e fortalecer a independência tecnológica do país no mercado global.","link":"https://m.economictimes.com/small-biz/sustainability/india-may-see-major-growth-in-sodium-ion-batteries-as-technology-reaches-trl-7-renewable-energy-secretary/articleshow/133451568.cms","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Telegraph India","pais":"Índia","titulo":"Quando a inteligência artificial lê entre os batimentos cardíacos na medicina","resumo":"O avanço dos algoritmos de inteligência artificial está transformando a cardiologia ao identificar padrões sutis em eletrocardiogramas que passam despercebidos ao olho humano.\nEssa inovação permite o diagnóstico precoce de arritmias e doenças cardíacas graves com alta precisão.\nO impacto direto é a redução da mortalidade e o aprimoramento da medicina preventiva no ecossistema de saúde.","link":"https://www.telegraphindia.com/west-bengal/kolkata/in-the-field-of-medical-science-when-ai-reads-between-heartbeats-prnt/cid/2176392","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Hindu","pais":"Índia","titulo":"Painel parlamentar revisa projetos espaciais e científicos da ISRO em Bengaluru","resumo":"Uma comissão parlamentar indiana realizou avaliações detalhadas das instalações e projetos da agência espacial ISRO na cidade de Bengaluru.\nAs discussões focaram nas próximas missões espaciais, pesquisas em ciência avançada e na alocação estratégica de investimentos públicos.\nA iniciativa busca garantir o alinhamento político e orçamentário para manter a Índia na vanguarda da exploração espacial.","link":"https://www.thehindu.com/news/cities/bangalore/parliamentary-panel-reviews-space-and-science-projects-at-isro-other-facilities-in-bengaluru/article71380546.ece","categoria":"CIÊNCIA ESPACIAL","lang":"pt"},{"fonte":"Telegraph India","pais":"Índia","titulo":"Jio 5G projeta expansão internacional com tecnologia de telecomunicações própria","resumo":"A gigante das telecomunicações Jio está expandindo sua infraestrutura 5G para além da Índia, visando competir diretamente no mercado global de tecnologia móvel.\nA empresa aposta em sua própria pilha tecnológica desenvolvida domesticamente para atrair operadoras internacionais.\nA estratégia fortalece a posição do país como exportador de soluções tecnológicas de ponta e infraestrutura digital.","link":"https://www.telegraphindia.com/business/jio-5g-expansion-homegrown-telecom-technology-targets-overseas-markets-globally-prnt/cid/2176401","categoria":"TELECOMUNICAÇÕES","lang":"pt"},{"fonte":"India Today","pais":"Índia","titulo":"Sam Altman admite erro sobre a rapidez dos impactos da IA na economia","resumo":"O CEO da OpenAI, Sam Altman, reconheceu publicamente que suas previsões anteriores sobre a velocidade da perturbação econômica causada pela inteligência artificial estavam erradas.\nSegundo ele, a integração da IA no setor produtivo tem sido mais gradual e complexa do que o antecipado originalmente.\nA declaração reforça os desafios práticos na adoção da tecnologia por empresas e governos globais.","link":"https://www.indiatoday.in/technology/news/story/sam-altman-admits-he-expected-ai-to-disrupt-economy-faster-says-he-was-wrong-2978305-2026-08-24","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"ANI News","pais":"Índia","titulo":"Escola de Ciências Médicas do IIT Kanpur recebe financiamento adicional de 300 crores de rúpias","resumo":"A Escola Gangwal de Ciências Médicas e Tecnologia do IIT Kanpur recebeu um impulso financeiro relevante com uma nova doação substancial de seu cofundador.\nO financiamento visa acelerar pesquisas integradas entre engenharia e medicina, além de expandir a infraestrutura hospitalar e de laboratórios.\nA iniciativa impulsionará a criação de dispositivos médicos inovadores e acessíveis no ecossistema indiano.","link":"https://www.aninews.in/news/national/general-news/iit-kanpurs-gangwal-school-of-medical-sciences-and-technology-gets-funding-boost-indigo-co-founder-rakesh-gangwal-contributes-additional-8377300-crore20260824110631","categoria":"TECNOLOGIA MÉDICA","lang":"pt"},{"fonte":"Terra","pais":"Índia","titulo":"Por que uma barata se tornou a nova estrela da política na Índia","resumo":"Um episódio inusitado envolvendo a aparição de uma barata durante um discurso político viralizou nas redes sociais e tomou os debates públicos na Índia.\nO acontecimento gerou memes, comentários satíricos e discussões acaloradas entre opositores e simpatizantes partidários.\nO fenômeno reflete a dinâmica atual da cultura digital do país, onde pequenos incidentes moldam a atenção pública e o discurso político.","link":"https://www.terra.com.br/noticias/por-que-uma-barata-se-tornou-a-nova-estrela-da-politica-na-india,4c3970b9c7d7c93b3b461960da9ec70auk1xpi1l.html","categoria":"TRENDING","lang":"pt"},{"fonte":"Sahi","pais":"Índia","titulo":"Mamata Machinery obtém patente indiana para a tecnologia da máquina Quadra 600","resumo":"A fabricante indiana Mamata Machinery garantiu a concessão de uma patente nacional para o seu modelo avançado de embalagem Quadra 600.\nA conquista reforça a capacidade do setor industrial indiano em desenvolver soluções proprietárias de automação e alta eficiência.\nO avanço impulsiona a competitividade da indústria local e apoia o movimento de fabricação tecnológica no país.","link":"https://www.sahi.com/news/mamata-machinery-secures-indian-patent-grant-for-quadra-600-machine-technology-1394321-PE1_","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Jornal PT Green","pais":"Portugal","titulo":"Gaia aposta em tecnologia RFID para coleta de resíduos orgânicos","resumo":"O município de Vila Nova de Gaia adotou a tecnologia de identificação por radiofrequência (RFID) para otimizar a coleta seletiva de resíduos orgânicos.\nA inovação permite monitorar em tempo real o descarte feito pelos cidadãos e a eficiência das rotas de recolhimento.\nCom a medida, a cidade busca incentivar a sustentabilidade e aumentar as taxas de reciclagem local.\nA iniciativa serve como modelo de gestão urbana inteligente para outras regiões do país.","link":"https://jornalptgreen.pt/noticia/gaia-aposta-em-tecnologia-rfid-para-recolha-de-biorresiduos/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Diário de Notícias","pais":"Portugal","titulo":"Do drone à soberania tecnológica: por que Angola precisa de uma política de sistemas não tripulados","resumo":"A crescente utilização de drones em diversos setores levanta a necessidade de uma regulamentação e estratégia nacional em Angola.\nO debate destaca a importância da soberania tecnológica e do desenvolvimento de capacidades locais para a operação de sistemas não tripulados.\nA criação de uma política pública visa impulsionar a inovação e garantir a segurança do espaço aéreo.\nO setor aeroespacial angolano pode, assim, se consolidar como um pilar de modernização regional.","link":"https://www.dn.pt/opiniao-dn/sociedade-aberta/do-drone-soberania-tecnolgica-por-que-angola-precisa-de-uma-poltica-nacional-de-sistemas-no-tripulados","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Prospectiva estratégica: quando a tecnologia ajuda a antecipar o futuro","resumo":"A análise prospectiva apoiada por ferramentas tecnológicas avançadas está transformando a tomada de decisões em diversos setores.\nAo processar grandes volumes de dados, algoritmos preditivos e inteligências artificiais conseguem mapear cenários e tendências futuras.\nEsse conhecimento permite que organizações se preparem com antecedência para riscos iminentes e novas oportunidades de mercado.\nA convergência entre ciência de dados e planejamento estratégico torna-se cada vez mais indispensável.","link":"https://www.cmjornal.pt/domingo/detalhe/prospetiva-estrategica-quando-a-tecnologia-ajuda-a-antecipar-o-que-ai-vem","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Pplware","pais":"Portugal","titulo":"Carros repletos de tecnologia: estudo reforça que não é isso que os motoristas querem","resumo":"Um estudo recente revelou que a profusão de telas sensíveis ao toque e recursos digitais nos veículos modernos causa insatisfação em muitos motoristas.\nGrande parte dos condutores prefere comandos físicos tradicionais para funções básicas devido à facilidade de uso e segurança.\nA complexidade excessiva dos sistemas embarcados acaba gerando distrações indesejadas ao volante.\nAs montadoras agora enfrentam o desafio de reavaliar o equilíbrio entre inovação tecnológica e praticidade.","link":"https://pplware.sapo.pt/motores/carros-cheios-de-tecnologia-estudo-reforca-que-nao-e-isso-que-os-condutores-querem/","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"Notícias de Coimbra","pais":"Portugal","titulo":"Seu cão realmente entende o que você está sentindo? A ciência tem uma resposta surpreendente","resumo":"Pesquisas científicas recentes investigam a capacidade dos cães de decodificar as emoções humanas por meio do odor e de sinais corporais.\nOs resultados demonstram que os caninos não apenas captam o estresse de seus tutores, mas também alteram seu próprio estado fisiológico.\nEssa sensibilidade empática é fruto de milênios de coevolução e domesticação entre a espécie humana e os cães.\nA descoberta reforça a profundidade da conexão emocional e biológica existente entre cães e seus donos.","link":"https://www.noticiasdecoimbra.pt/o-teu-cao-percebe-mesmo-o-que-estas-a-sentir-a-ciencia-tem-uma-resposta-surpreendente/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Antena Livre","pais":"Portugal","titulo":"Vila de Rei: Ciência Viva no Verão leva observação do Sol à Praia Fluvial do Penedo Furado","resumo":"A iniciativa Ciência Viva no Verão promoveu uma sessão pública de observação solar na Praia Fluvial do Penedo Furado, em Vila de Rei.\nOs participantes tiveram a oportunidade de utilizar telescópios equipados com filtros solares especiais para analisar a atividade do Sol.\nO evento reuniu famílias e entusiastas da astronomia em um ambiente descontraído de lazer e aprendizado prático.\nA ação visa democratizar o acesso ao conhecimento científico durante a temporada de férias.","link":"https://www.antenalivre.pt/concelhos/ciencia-viva-no-verao-leva-observacao-do-sol-a-praia-fluvial-do-penedo-furado","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"RTP","pais":"Portugal","titulo":"Enter - Tecnologia Para Todos: Episódio 5","resumo":"O novo episódio do programa Enter aborda as principais novidades do setor tecnológico de forma acessível para todo o público.\nA edição destaca avanços em inteligência artificial, novos dispositivos do mercado e o impacto das ferramentas digitais no cotidiano.\nEspecialistas convidados discutem os desafios de inclusão digital e as tendências para os próximos anos.\nO conteúdo visa aproximar a sociedade das inovações que transformam o dia a dia.","link":"https://www.rtp.pt/play/p16977/e949613/enter-tecnologia-para-todos","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"G1","pais":"Brazil","titulo":"How US Military Research Became the Foundation for China's Robot Dogs","resumo":"Analyses indicate that China's rapid advancement in developing military robot dogs was heavily based on research and prototypes originally initiated in the United States.\nThe Chinese ecosystem managed to adapt and refine these publicly accessible technologies for mass production at reduced costs.\nThe move is raising red flags among Western armed forces regarding the rapid transfer and dual-use of advanced automation technologies.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/24/como-pesquisas-militares-dos-eua-viraram-base-para-os-caes-robos-da-china.ghtml","categoria":"ROBOTICS","lang":"en"},{"fonte":"R7","pais":"Brazil","titulo":"Technology Brings Skin Cancer Screening Directly to Rural Properties","resumo":"New technological initiatives are enabling preventive skin cancer exams and screenings directly in hard-to-reach rural areas.\nThe use of portable devices coupled with digital systems facilitates the early identification of suspicious lesions among agricultural workers.\nThe initiative broadens access to healthcare services and reduces the need for long travel distances for vulnerable populations.","link":"https://noticias.r7.com/prisma/mundo-agro/tecnologia-leva-triagem-de-cancer-de-pele-para-dentro-das-propriedades-rurais-24082026/","categoria":"HEALTH \u0026 TECH","lang":"en"},{"fonte":"InfoMoney","pais":"Brazil","titulo":"Humanoid Robot World Games Test Technology Limits Across 51 Events","resumo":"The Humanoid Robot World Games bring together international teams to test the limits of agility, balance, and autonomy across 51 distinct events.\nThe competition serves as a large open laboratory to compare robot performance in complex, real-world scenarios.\nThe advances observed in the competition promise to accelerate the development of machines aimed at industrial tasks and assistance.","link":"https://www.infomoney.com.br/mundo/jogos-mundiais-de-robos-humanoides-sao-5-dias-51-provas-e-um-teste-de-tecnologia/","categoria":"ROBOTICS","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"AI May Be Brakes on Wages Before Cutting Jobs, Study Points Out","resumo":"Recent studies indicate that the initial impact of Artificial Intelligence on the labor market may manifest as wage stagnation before triggering mass layoffs.\nProfessions with high exposure to automatable tasks face lower bargaining power and restrained raises.\nThe report maps the most vulnerable sectors and warns of the urgent need for professional retraining.","link":"https://g1.globo.com/trabalho-e-carreira/noticia/2026/08/23/ia-pode-estar-freando-salarios-antes-de-cortar-empregos-veja-profissoes-mais-expostas-e-rankings.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Billboard Brasil","pais":"Brazil","titulo":"Dr. Dre Defends Use of AI in Music and Reveals Adoption of the Technology in His Creations","resumo":"Influential music producer Dr. Dre publicly declared his support for the use of Artificial Intelligence tools in the recording industry.\nThe artist revealed that he already uses these technologies to optimize creative processes and explore new soundscapes in his recent productions.\nThe stance contrasts with the concerns of part of the cultural sector and reinforces the adaptive potential of AI in artistic creation.","link":"https://billboard.com.br/dr-dre-inteligencia-artificial-ia-musica/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Globo.com","pais":"Brazil","titulo":"Do Whales Have a Kind of Spot 'Fingerprint'? Study Investigates","resumo":"Researchers investigated skin spot patterns on whales to determine if they function identically to human fingerprints.\nDetailed analysis of high-resolution images allowed for mapping unique marks that make it possible to identify individuals over the years.\nThe discovery promises to improve the monitoring of marine populations and strengthen environmental conservation programs using non-invasive methods.","link":"https://revistagalileu.globo.com/google/amp/ciencia/noticia/2026/08/baleias-tem-especie-de-impressao-digital-de-manchas-estudo-investigou.ghtml","categoria":"SCIENCE","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"New Zealand Government Introduces Bill to Ban Social Media Use for Under-16s","resumo":"The New Zealand government has proposed new legislation aimed at banning access to social media platforms for youth under 16 years of age.\nThe measure seeks to combat the negative impacts of excessive use on teenagers' mental health and mitigate the risks of exposure to harmful content.\nThe proposal aligns the country with a growing global movement to regulate the children's digital environment.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/24/governo-da-nova-zelandia-apresenta-projeto-para-proibir-uso-de-redes-sociais-por-menores-de-16-anos.ghtml","categoria":"SOCIAL MEDIA","lang":"en"},{"fonte":"Diário de Petrópolis","pais":"Brazil","titulo":"Free Serpro Course Offers Fundamentals of Artificial Intelligence","resumo":"Serpro has launched a completely free training course designed to introduce fundamental concepts and applications of Artificial Intelligence to society.\nThe course covers topics ranging from ethical principles to the functioning of algorithms applied to everyday life.\nThe initiative aims to democratize technological knowledge and equip citizens for the new demands of the digital labor market.","link":"https://diariodepetropolis.com.br/integra/quer-entender-de-ia-curso-gratuito-do-serpro-traz-fundamentos-dessa-tecnologia-48526","categoria":"EDUCATION \u0026 TECH","lang":"en"},{"fonte":"Scripps News","pais":"United States","titulo":"Andrew Yang Proposes $15K Family UBI as AI Transforms U.S. Economy","resumo":"Politician and entrepreneur Andrew Yang has introduced a proposal to distribute $15,000 to American families in response to profound economic transformations driven by artificial intelligence.\nThe initiative seeks to create a financial safety net in the face of accelerated automation and its impact on the traditional job market.\nThe debate rekindles discussions around universal basic income in the United States and the social challenges of technological transition.","link":"https://www.scrippsnews.com/politics/andrew-yang-proposes-15k-for-families-as-ai-transforms-us-economy","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"simplywall.st","pais":"United States","titulo":"Marvell Technology Stock Rises 6.8% After Expanding Google AI Chip Deal","resumo":"Marvell Technology registered a significant surge in its stock price after announcing the expansion of its strategic partnership with Google in the development of artificial intelligence chips.\nThe agreement reinforces the company's position in the highly competitive market for semiconductors and specialized hardware for cloud infrastructure.\nThe move highlights growing global demand for high-performance components capable of sustaining advances in language models and machine learning.","link":"https://simplywall.st/stocks/us/semiconductors/nasdaq-mrvl/marvell-technology/news/why-marvell-technology-mrvl-is-up-68-after-expanding-its-equ","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"Science Daily","pais":"United States","titulo":"Scientists Turn Tiny \"Imperfections\" Into a 5.5x Boost in Heat Transfer","resumo":"Researchers have discovered an innovative way to manipulate micro-defects in materials to drastically increase thermal dissipation efficiency.\nBy turning structural imperfections into allies, the study achieved up to a 5.5-fold gain in heat transfer capacity.\nThe breakthrough promises to revolutionize the cooling of electronic components, advanced computing chips, and industrial energy systems.","link":"https://www.sciencedaily.com/releases/2026/08/260823014940.htm","categoria":"SCIENCE","lang":"en"},{"fonte":"ixbt.games","pais":"United States","titulo":"Indie Developer Accuses Valve of Monopoly and Criticizes Moderation Policies for Adult Content","resumo":"An independent game creator has leveled harsh public criticism against Valve, classifying the Steam platform owner as a monopoly in the PC gaming market.\nThe developer questioned the moderation criteria applied to games with adult content, alleging a lack of transparency and inconsistent rules.\nThe case rekindles the debate over the dominance of major digital distribution platforms and the impact of their policies on the indie ecosystem.","link":"https://ixbt.games/es/news/2026/08/24/429899-indi-razrabotcik-nazval-valve-monopolistom-i-raskritikoval-politiku-moderacii-vzroslogo-kontenta.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Yahoo Finance","pais":"United States","titulo":"Broadcom vs. Marvell Technology: A Decisive Metric for Choosing the Best Custom AI Chip Stock","resumo":"Financial and technology analysts have compared the performance of Broadcom and Marvell Technology in the race for leadership in custom artificial intelligence chips.\nThe analysis highlights a crucial financial and operational metric that could determine which of the two giants is better positioned in the sector.\nWith the explosion of cloud AI projects, the race to supply custom-tailored semiconductors has become one of the most valuable markets in the tech world.","link":"https://finance.yahoo.com/technology/ai/articles/broadcom-vs-marvell-technology-1-172600511.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"EurekAlert!","pais":"United States","titulo":"From \"Eliminating\" to \"Reusing\" Wastewater","resumo":"A new global approach is transforming wastewater and effluent management, shifting from simple disposal to advanced recycling strategies.\nWith modern filtration and treatment technologies, municipalities and industries are able to purify water for reuse in agriculture, industrial processes, and human consumption.\nThe transition is seen as an essential step to address growing global water scarcity and promote environmental sustainability.","link":"https://www.eurekalert.org/news-releases/1140796","categoria":"SCIENCE","lang":"en"},{"fonte":"Unmanned Systems Technology","pais":"United States","titulo":"Pelican Launches Next-Generation Protector Cases with Advanced HPX Polymer Science and Modular Accessories","resumo":"Pelican has announced a new line of protective cases developed with an advanced HPX polymer formula, offering greater impact resistance and reduced weight.\nThe product features a modular accessory system that allows for customizing the interior of the case to store sensitive electronic and scientific equipment.\nThe innovation combines materials science and functional design to serve professionals working in extreme and demanding conditions.","link":"https://www.unmannedsystemstechnology.com/2026/08/pelican-unveils-next-generation-protector-cases-with-advanced-hpx-polymer-science-modular-accessories/","categoria":"INNOVATION","lang":"en"},{"fonte":"Belga Share","pais":"United States","titulo":"First Flanders Pavilion at the CES Tech Fair in Las Vegas Confirmed for 2027","resumo":"The Belgian region of Flanders has confirmed its first official participation with its own pavilion at CES, the world's largest technology trade show held in Las Vegas.\nThe exclusive space in 2027 will serve as a showcase for Flemish startups and tech companies to present innovations to the global market.\nThe initiative aims to strengthen commercial ties between the European innovation ecosystem and tech giants in the United States.","link":"https://www.belganewsagency.eu/press-releases/35671/","categoria":"TECH EVENTS","lang":"en"},{"fonte":"Tecsol Quotidien","pais":"France","titulo":"Study Published in Science Highlights the Impact of the Solar Sector on Bird Biodiversity in China","resumo":"New research published in the prestigious journal Science analyzes the consequences of solar farm expansion on local wildlife in China. Researchers point to direct effects on bird populations and warn of the importance of aligning the renewable energy transition with strict environmental conservation policies.","link":"https://tecsol-quotidien.fr/une-etude-publiee-dans-la-revue-science-met-en-evidence-limpact-du-solaire-sur-la-biodiversite-aviaire-en-chine/","categoria":"SCIENCE","lang":"en"},{"fonte":"arabnews.jp","pais":"France","titulo":"France-Saudi Arabia AI Partnership Strengthens as Digital Economy Expands","resumo":"France and Saudi Arabia have strengthened their strategic partnerships focused on artificial intelligence development. The initiative accompanies the Saudi government's efforts to diversify and expand its digital economy. The agreement provides for mutual investments in innovation, technical training, and scientific exchange.","link":"https://www.arabnews.jp/en/saudi-arabia/article_176566/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Orange","pais":"France","titulo":"Athletics: Usain Bolt's World Record Surpassed by a Robot","resumo":"A surprising breakthrough in robotics and biotechnology has once again amazed the public after a robot reached speeds superior to Usain Bolt's in a sprint. The feat reflects the rapid evolution of biomechanical engineering and movement control. The achievement sparks debates about the limits of machine versus human performance.","link":"https://sports.orange.fr/plus-de-sport/athletisme/article/athletisme-le-record-du-monde-de-bolt-battu-par-un-robot-exclu-CNT000002rtzp1.amp","categoria":"ROBOTICS","lang":"en"},{"fonte":"La Gazette France","pais":"France","titulo":"Emmanuel Macron Signals the Return of the Political Year for His Ministers","resumo":"President Emmanuel Macron marked the restart of French government activities by gathering his cabinet ministers in Paris. The meeting sets the strategic goals for tackling the economic and social challenges of the coming months. The gathering signals a decisive moment for the country's governance and stability.","link":"https://www.lagazettefrance.fr/article/emmanuel-macron-sonne-la-rentree-des-classes-pour-ses-ministres","categoria":"POLITICS","lang":"en"},{"fonte":"Libération","pais":"France","titulo":"In Mayotte, Edouard Philippe Promises to Curb Immigration and Criticizes Mélenchon","resumo":"During an official visit to the overseas department of Mayotte, former Prime Minister Edouard Philippe promised severe measures to curb illegal migration. The political leader criticized opposition proposals and defended greater border rigor. The statement revives the national debate on security and territorial sovereignty.","link":"https://www.liberation.fr/politique/a-mayotte-edouard-philippe-promet-de-mettre-fin-a-lappel-dair-de-limmigration-et-tacle-melenchon-20260822_E5LS3534OZBMTA22WOD7NKTNJE/","categoria":"POLITICS","lang":"en"},{"fonte":"Retail Technology Innovation Hub","pais":"England","titulo":"Yankee Candle Hits TikTok Shop UK: RTIH Rounds Up Last Week's Biggest Retail Tech Plays","resumo":"Yankee Candle debuted its official store on TikTok Shop in the UK, expanding its presence in social e-commerce. The initiative is part of a round of major tech implementations aimed at the British retail sector. The move highlights how major brands are adapting their sales strategies to reach young audiences through interactive digital platforms.","link":"https://retailtechinnovationhub.com/home/2026/8/23/yankee-candle-hits-tiktok-shop-uk-check-out-last-weeks-biggest-retail-technology-plays","categoria":"RETAIL TECH","lang":"en"},{"fonte":"Retail Technology Innovation Hub","pais":"England","titulo":"Trax Founder Bags Funding for AI Sports Tech Firm Swish Basket","resumo":"Joel Bar-El, founder of Trax, secured new investments for the startup Swish Basket, which focuses on artificial intelligence technology applied to sports. The company uses advanced algorithms to analyze performance metrics and improve athlete training. The fundraising reinforces strong market demand for AI-based solutions in the high-performance sports ecosystem.","link":"https://retailtechinnovationhub.com/home/2026/8/23/trax-founder-joel-bar-el-swish-basket-bags-funding-for-ai-sports-technology-firm-swish-basket","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"O GLOBO","pais":"England","titulo":"British Prime Minister Authorizes Missile Technology Sharing with Ukraine Ahead of Kyiv Meeting","resumo":"The UK Prime Minister authorized the transfer and sharing of advanced missile technology to support Ukraine. The announcement precedes a strategic meeting between political and military leaders in Kyiv to discuss defense alignment. The measure represents a significant step in military technological cooperation between the two countries amid the ongoing conflict.","link":"https://oglobo.globo.com/mundo/noticia/2026/08/23/premier-britanico-autoriza-compartilhamento-de-tecnologia-de-misseis-com-a-ucrania-antes-de-reuniao-em-kiev.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Times","pais":"England","titulo":"Times Letters: The Risks and Rewards of Backing New Technology","resumo":"A collection of letters published in The Times analyzes the challenges and opportunities involved in funding emerging technologies. Experts debate the necessary balance between encouraging radical innovation and mitigating financial and regulatory risks. The discussions highlight the crucial role of venture capital and government support in the sustainable development of the tech sector.","link":"https://www.thetimes.com/comment/letters-to-editor/article/times-letters-risks-and-rewards-of-backing-new-technology-3qkrkz3zc","categoria":"INNOVATION","lang":"en"},{"fonte":"Broadcast","pais":"England","titulo":"YouTube to Invest £3 Million to Boost Creator Economy and Screen Industry Careers","resumo":"YouTube announced a three million pound investment focused on expanding the creator economy in the UK. The funds will be directed to training programs and career development in the film, television, and digital media industries. The initiative aims to strengthen talent infrastructure and open new job opportunities for the next generation of audiovisual professionals.","link":"https://www.broadcastnow.co.uk/home/youtube-to-invest-3m-to-grow-creator-economy-and-screen-industry-careers/5219613.article","categoria":"DIGITAL ECONOMY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"'We are entering a new chapter': OpenAI leader warns of threat of 'persistent' AI cyberattacks","resumo":"An OpenAI executive warned that the tech sector is entering a critical new phase characterized by automated and persistent AI-driven cyberattacks. The increasing use of artificial intelligence by cybercriminals demands an urgent strengthening of digital security defenses on a global scale. The warning reinforces the need to create more rigorous regulatory and technical safeguards to combat these emerging threats.","link":"https://www.theguardian.com/technology/2026/aug/23/openai-cyber-attacks-threat-chris-lehane","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"epigram.org.uk","pais":"England","titulo":"Calling All Science Writers: ABSW Comes to Bristol","resumo":"The Association of British Science Writers announced a new gathering focused on strengthening science journalism in Bristol. The event will bring together professionals, academics, and science communicators to discuss best communication practices in health, technology, and the environment. The conference aims to train communicators to tackle misinformation and bring the advances of scientific research closer to the general public.","link":"https://epigram.org.uk/calling-all-science-writers-absw-is-coming-to-bristol/","categoria":"SCIENCE","lang":"en"},{"fonte":"Libertad Digital","pais":"Spain","titulo":"Science Rewrites Ozone Layer History: It Began Before CFCs, Far from Antarctica","resumo":"Researchers have rewritten the chronology of ozone layer degradation by revealing that the first impacts occurred before the popularization of chlorofluorocarbons (CFCs). The discovery demonstrates that atmospheric damage began far from polar regions, challenging traditional climate models. This new historical perspective reinforces the need to reassess theories regarding old industrial emissions and their long-term global impacts.","link":"https://www.libertaddigital.com/ciencia-tecnologia/ciencia/2026-08-24/la-ciencia-reescribe-la-historia-de-la-capa-de-ozono-empezo-antes-de-los-cfc-lejos-de-la-antartida-7448412/","categoria":"SCIENCE","lang":"en"},{"fonte":"Forbes España","pais":"Spain","titulo":"Mar Malagón: \"Science Must Be Part of the Country's Strategy\"","resumo":"Researcher Mar Malagón publicly advocated that scientific research be structurally integrated into the country's socioeconomic and political strategy. According to the scientist, continuous investment in research is the fundamental pillar to guarantee innovation, technological sovereignty, and sustainable development. The stance aims to drive new public policies that value science as an engine of transformation and social well-being.","link":"https://forbes.es/health/991801/investigacion-obesidad/","categoria":"SCIENCE","lang":"en"},{"fonte":"consalud.es","pais":"Spain","titulo":"The Pakistani genome challenges what science thought it knew about human genes","resumo":"A comprehensive study on the genome sequencing of the Pakistani population has revealed unprecedented genetic variations that challenge established concepts of human genetics.\nThe unique diversity identified has allowed the discovery of rare mutations crucial for understanding various hereditary and complex pathologies.\nThe findings highlight the urgency of diversifying genomic studies beyond populations of European origin in global medicine.","link":"https://www.consalud.es/pacientes/el-genoma-pakistani-desafia-lo-que-la-ciencia-creia-saber-sobre-los-genes-humanos.html","categoria":"GENETICS","lang":"en"},{"fonte":"EL PAÍS","pais":"Spain","titulo":"LIV Golf, the millionaire Saudi league, shuts down operations until further notice","resumo":"The controversial and millionaire LIV Golf league, funded by the sovereign wealth fund of Saudi Arabia, has unpredictably suspended its operations for an indefinite period.\nThe circuit, which shook the structure of world professional golf with astronomical contracts, now faces severe operational and institutional uncertainties.\nThe sudden shutdown reopens intense discussions about the financial sustainability of the project and the impact of private leagues on global sports.","link":"https://elpais.com/deportes/2026-08-23/liv-golf-la-millonaria-liga-saudi-cierra-por-defuncion-hasta-nuevo-aviso.html","categoria":"SPORTS","lang":"en"},{"fonte":"Redacción médica","pais":"Spain","titulo":"Hospital 12 de Octubre's pioneering technology to accelerate the diagnosis of mitochondrial pathologies","resumo":"Hospital Universitario 12 de Octubre has developed an innovative technological platform focused on drastically reducing the diagnostic time for rare mitochondrial diseases.\nThe tool utilizes advanced genetic analyses to identify complex mutations with a high degree of precision and agility.\nThe initiative promises to transform medical care, allowing for early therapeutic interventions and ending years of uncertainty for patients.","link":"https://www.redaccionmedica.com/innovacion/20260823/la-tecnologia-pionera-del-de-octubre-para-frenar-la-odisea-diagnostica-patologias-mitocondriales/349397_0.html","categoria":"HEALTH","lang":"en"},{"fonte":"Spektrum der Wissenschaft","pais":"Germany","titulo":"China postpones the launch of the Chang'e 7 lunar probe","resumo":"China has decided to postpone the scheduled launch of its Chang'e 7 space mission, designed to explore the Moon's south pole in search of water and mineral resources.\nThe decision aims to ensure crucial technical adjustments and additional testing on the advanced scientific instruments that make up the space probe.\nThe postponement alters the timeline of the modern space race, but highlights the pursuit of maximum safety in complex lunar missions.","link":"https://www.spektrum.de/news/china-verschiebt-start-der-mondsonde-change-7/2341310","categoria":"SPACE SCIENCE","lang":"en"},{"fonte":"Bild der Wissenschaft","pais":"Germany","titulo":"First triplet of supermassive black holes discovered in primordial galaxy","resumo":"Astronomers have identified for the first time a triple system of interacting supermassive black holes in a galaxy from the early universe.\nThe unprecedented discovery challenges current theoretical models regarding galactic evolution and the growth of extreme gravitational structures.\nThe find offers new clues about the cosmic merger processes that shaped the cosmos shortly after the Big Bang.","link":"https://wissenschaft.de/artikel/erstes-trio-massereicher-schwarzer-loecher-in-frueher-galaxie-entdeckt","categoria":"ASTRONOMY","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"Japan's first neutral-atom quantum computer 'Harumi' begins operations","resumo":"Japan has initiated operations for 'Harumi', the country's first full-stack neutral-atom quantum computer. The initiative represents a significant leap forward for national supercomputing infrastructure and technological research. The system promises to accelerate complex simulations and drive the development of new materials and medicines.","link":"https://prtimes.jp/main/html/rd/p/000000012.000165874.html","categoria":"QUANTUM COMPUTING","lang":"en"},{"fonte":"ビジネス+IT","pais":"Japan","titulo":"Japanese government expands tax incentives for AI and quantum technology across 17 strategic areas","resumo":"The Japanese government has announced the expansion of tax incentives and large-scale investments in 17 strategic sectors, focusing on AI and quantum tech. The initiative aims to consolidate the country's technological sovereignty and boost global competitiveness. It is expected to attract private capital and accelerate industry transition toward next-generation solutions.","link":"https://www.sbbit.jp/article/cont1/186649","categoria":"INNOVATION","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"Keio University develops AI t
