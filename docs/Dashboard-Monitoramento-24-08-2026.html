o prevent false alarms in autonomous vehicle sensors","resumo":"Researchers at Keio University have created an artificial intelligence model designed to prevent incorrect detections in automotive sensors. The technology significantly improves accuracy in identifying obstacles and pedestrians in real time. This breakthrough represents an essential step toward increasing the safety and reliability of autonomous driving in complex scenarios.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_yunshu/pt20260824000012.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"obayashi.co.jp","pais":"Japan","titulo":"Vehicle-to-infrastructure communication technology developed to enhance autonomous safety","resumo":"A new vehicle-to-infrastructure (V2I) communication technology has been developed to support autonomous navigation directly through roadway infrastructure. The system transmits critical real-time data on traffic and hazards beyond the visual range of onboard sensors. The innovation promises to reduce accidents and enable intelligent transportation operational networks.","link":"https://www.obayashi.co.jp/news/detail/news20260824_1.html","categoria":"MOBILITY","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"Japan tests AI-guided electric autonomous bus in the Koshien region","resumo":"An experimental project featuring autonomous electric buses powered by artificial intelligence has expanded its route to Koshien Station. The initiative aims to achieve Level 4 autonomy certification by fiscal year 2027. The advancement seeks to offer solutions for driver shortages and modernize regional public transport.","link":"https://prtimes.jp/main/html/rd/p/000003702.000005180.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"アットプレス","pais":"Japan","titulo":"New technique enables room-temperature fabrication of thin-film transistors without heat","resumo":"Researchers have presented an innovative process capable of creating thin-film transistors entirely at room temperature, eliminating the thermal treatment step. The technique drastically reduces costs and energy consumption in the semiconductor manufacturing process. This discovery paves the way for the integration of electronics onto flexible, temperature-sensitive substrates.","link":"https://www.atpress.ne.jp/news/625206","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"Scientists use viral rescue technology to map the ocean carbon cycle","resumo":"Scientific research has utilized viral rescue technology to reconstitute marine viruses and elucidate their role in the oceanic carbon cycle. The study brings new perspectives to understanding climate impact on marine ecosystems and its applications in aquaculture. These findings strengthen environmental preservation strategies and fisheries sustainability.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_kjdx/pt20260824000013.html","categoria":"SCIENCE","lang":"en"},{"fonte":"ロイター","pais":"Japan","titulo":"Chinese humanoid robot outperforms Usain Bolt's 100-meter time, showcasing technical advancement","resumo":"A humanoid robot developed in China has demonstrated surprising mobility advancements by reaching speed marks superior to the world record for the 100-meter sprint. The demonstration highlighted the progress of dynamic control, balance, and high-precision motors. The feat underscores the rapid evolution of physical robotics applied on the international stage.","link":"https://jp.reuters.com/economy/UQNK3Z4BDVPJFIIQJDIGQ3VQ44-2026-08-24/","categoria":"ROBOTICS","lang":"en"},{"fonte":"TBS NEWS DIG","pais":"China","titulo":"Beijing Hosts Humanoid Robot Sports Games with Over 2,000 Competitors","resumo":"The city of Beijing hosted a historic sports competition for humanoid robots, gathering over 2,000 machines competing in 51 athletic events.\nPowered by artificial intelligence and advanced motion control, several robots surpassed human world-record marks in athletic abilities.\nThe event highlights the rapid technological leap and the maturity of Chinese robotics and automation.","link":"https://newsdig.tbs.co.jp/articles/-/2891534","categoria":"ROBOTICS","lang":"en"},{"fonte":"Vandal","pais":"China","titulo":"China Develops Electromagnetic Cannon Capable of Piercing Heavy Armor","resumo":"Chinese researchers have reported significant progress in the development of kinetic energy weapons by creating a high-velocity railgun.\nThe technology uses intense magnetic fields to fire projectiles at hypersonic speeds, with the capability to pierce large-scale armor.\nThe breakthrough demonstrates the evolution of military engineering and applied physics in the country.","link":"https://vandal.elespanol.com/random/no-es-ciencia-ficcion-china-fabrica-un-railgun-que-podria-partir-en-dos-un-tanque-norteamericano/43648.html","categoria":"MILITARY TECHNOLOGY","lang":"en"},{"fonte":"wuhan.gov.cn","pais":"China","titulo":"Experts Detail Progress on 'Artificial Sun' Reactor and the Future of Nuclear Fusion","resumo":"During a science communication event, experts detailed the latest advancements in China's nuclear fusion reactor, known as the 'Artificial Sun'.\nThe initiative aims to replicate solar core reactions to generate clean, inexhaustible, and safe energy on a large scale.\nThe project solidifies China's position at the forefront of plasma physics and the global energy transition.","link":"https://www.wuhan.gov.cn/whyw/bmdt/202608/t20260824_2837793.shtml","categoria":"NUCLEAR ENERGY","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"China Science Mapping Award Announces Winners, Highlighting Young Talent","resumo":"The 2026 edition of the prestigious China Science Mapping Award revealed its winners, granting direct funding for basic research.\nThe announcement highlighted the election of the first scientist born after 1995 to receive the honor, symbolizing generational renewal in the country's research.\nThe award supports young talent with substantial financial resources and no application restrictions.","link":"https://www.stdaily.com/web/gdxw/2026-08/24/content_568783.html","categoria":"SCIENCE","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"China Unveils World's First 'Three-in-One' Heavy Ion Accelerator","resumo":"A cutting-edge scientific facility in China revealed the operation of the world's first high-intensity 'three-in-one' heavy ion accelerator system.\nThe large-scale equipment enables unprecedented experiments on the structure of matter and extreme nuclear reactions.\nThis infrastructure positions the country in leadership for frontier research in nuclear physics and radiobiology.","link":"https://www.stdaily.com/web/2026-08/24/content_568545.html","categoria":"PHYSICS","lang":"en"},{"fonte":"东方财富","pais":"China","titulo":"Moore Threads Releases White Paper to Reduce AI Inference Costs","resumo":"Chinese graphics processing unit manufacturer Moore Threads has published a technical white paper focused on solving the cost bottleneck in artificial intelligence inference.\nThe solution addresses hardware and software architecture optimizations to enable the efficient processing of long texts.\nThis breakthrough drives competitiveness and economic sustainability within AI ecosystems.","link":"https://wap.eastmoney.com/a/202608243850499837.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"2026 Green Computing and AI Conference Discusses Token Economy","resumo":"The 2026 Green Computing and Artificial Intelligence Conference gathered experts to debate data center energy efficiency and the emerging token economy.\nThe forum discussed sustainable hardware architectures and optimized algorithms to reduce the energy consumption of generative AI.\nThe initiative aims to balance the growing demand for computing power with environmental sustainability goals.","link":"https://www.news.cn/20260823/21a3a84caa9b4100a2afbb0198bfbb59/c.html","categoria":"GREEN COMPUTING","lang":"en"},{"fonte":"ncsti.gov.cn","pais":"China","titulo":"Beijing Publishes First Exemplary Cases of AI Use in Scientific Research","resumo":"The city of Beijing officially released its first batch of exemplary cases demonstrating how artificial intelligence is driving scientific research.\nSelected projects include models applied to the development of novel materials and structural biology.\nThe initiative seeks to accelerate scientific discoveries by integrating artificial intelligence into traditional experimental methods.","link":"https://www.ncsti.gov.cn/kjdt/scyq/hrkxc/cqdt/202608/t20260824_254263.html","categoria":"INNOVATION","lang":"en"},{"fonte":"The Economic Times","pais":"India","titulo":"India Set for Major Growth in Sodium-Ion Batteries Amid Tech Advancements","resumo":"India's renewable energy sector projects significant progress in the use of sodium-ion batteries after the technology reached Technology Readiness Level 7 (TRL-7).\nThis evolution represents a promising alternative to lithium, reducing energy storage costs.\nThe initiative promises to drive the national energy transition and strengthen the country's technological independence in the global market.","link":"https://m.economictimes.com/small-biz/sustainability/india-may-see-major-growth-in-sodium-ion-batteries-as-technology-reaches-trl-7-renewable-energy-secretary/articleshow/133451568.cms","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Telegraph India","pais":"India","titulo":"When Artificial Intelligence Reads Between Heartbeats in Medicine","resumo":"The advancement of artificial intelligence algorithms is transforming cardiology by identifying subtle patterns in electrocardiograms that go unnoticed by the human eye.\nThis innovation enables the early diagnosis of arrhythmias and severe heart disease with high precision.\nThe direct impact is reduced mortality and improved preventive medicine within the healthcare ecosystem.","link":"https://www.telegraphindia.com/west-bengal/kolkata/in-the-field-of-medical-science-when-ai-reads-between-heartbeats-prnt/cid/2176392","categoria":"SCIENCE","lang":"en"},{"fonte":"The Hindu","pais":"India","titulo":"Parliamentary Panel Reviews ISRO Space and Science Projects in Bengaluru","resumo":"An Indian parliamentary committee conducted detailed evaluations of ISRO space agency facilities and projects in the city of Bengaluru.\nDiscussions focused on upcoming space missions, advanced science research, and the strategic allocation of public investments.\nThe initiative aims to ensure policy and budget alignment to keep India at the forefront of space exploration.","link":"https://www.thehindu.com/news/cities/bangalore/parliamentary-panel-reviews-space-and-science-projects-at-isro-other-facilities-in-bengaluru/article71380546.ece","categoria":"SPACE SCIENCE","lang":"en"},{"fonte":"Telegraph India","pais":"India","titulo":"Jio 5G Plans Global Expansion with Homegrown Telecom Technology","resumo":"Telecom giant Jio is expanding its 5G infrastructure beyond India, aiming to compete directly in the global mobile technology market.\nThe company is banking on its domestically developed technology stack to attract international operators.\nThe strategy strengthens the country's position as an exporter of cutting-edge technology solutions and digital infrastructure.","link":"https://www.telegraphindia.com/business/jio-5g-expansion-homegrown-telecom-technology-targets-overseas-markets-globally-prnt/cid/2176401","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"India Today","pais":"India","titulo":"Sam Altman Admits Error Over Speed of AI's Economic Impacts","resumo":"OpenAI CEO Sam Altman publicly acknowledged that his previous predictions regarding the speed of economic disruption caused by artificial intelligence were wrong.\nAccording to him, the integration of AI into the productive sector has been more gradual and complex than originally anticipated.\nThe statement underscores the practical challenges of technology adoption by global businesses and governments.","link":"https://www.indiatoday.in/technology/news/story/sam-altman-admits-he-expected-ai-to-disrupt-economy-faster-says-he-was-wrong-2978305-2026-08-24","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"ANI News","pais":"India","titulo":"IIT Kanpur School of Medical Sciences Receives Additional 300 Crore Rupee Funding","resumo":"The Gangwal School of Medical Sciences and Technology at IIT Kanpur received a major financial boost with a substantial new donation from its co-founder.\nThe funding aims to accelerate integrated research between engineering and medicine, alongside expanding hospital and laboratory infrastructure.\nThe initiative will drive the creation of innovative and affordable medical devices in the Indian ecosystem.","link":"https://www.aninews.in/news/national/general-news/iit-kanpurs-gangwal-school-of-medical-sciences-and-technology-gets-funding-boost-indigo-co-founder-rakesh-gangwal-contributes-additional-8377300-crore20260824110631","categoria":"MEDICAL TECHNOLOGY","lang":"en"},{"fonte":"Terra","pais":"India","titulo":"Why a Cockroach Became India's Newest Political Star","resumo":"An unusual incident involving the appearance of a cockroach during a political speech went viral on social media and dominated public debate in India.\nThe event sparked memes, satirical comments, and heated discussions between political opponents and supporters.\nThe phenomenon reflects the country's current digital culture dynamics, where minor incidents shape public attention and political discourse.","link":"https://www.terra.com.br/noticias/por-que-uma-barata-se-tornou-a-nova-estrela-da-politica-na-india,4c3970b9c7d7c93b3b461960da9ec70auk1xpi1l.html","categoria":"TRENDING","lang":"en"},{"fonte":"Sahi","pais":"India","titulo":"Mamata Machinery Secures Indian Patent for Quadra 600 Machine Technology","resumo":"Indian manufacturer Mamata Machinery has secured a national patent grant for its advanced Quadra 600 packaging model.\nThis achievement highlights the Indian industrial sector's capability to develop proprietary automation and high-efficiency solutions.\nThe breakthrough boosts local industry competitiveness and supports the country's technology manufacturing movement.","link":"https://www.sahi.com/news/mamata-machinery-secures-indian-patent-grant-for-quadra-600-machine-technology-1394321-PE1_","categoria":"INNOVATION","lang":"en"},{"fonte":"Jornal PT Green","pais":"Portugal","titulo":"Gaia Adopts RFID Technology for Organic Waste Collection","resumo":"The municipality of Vila Nova de Gaia has adopted radio-frequency identification (RFID) technology to optimize the selective collection of organic waste.\nThe innovation allows for real-time monitoring of citizen disposal habits and collection route efficiency.\nThrough this measure, the city aims to encourage sustainability and increase local recycling rates.\nThe initiative serves as a smart urban management model for other regions of the country.","link":"https://jornalptgreen.pt/noticia/gaia-aposta-em-tecnologia-rfid-para-recolha-de-biorresiduos/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Diário de Notícias","pais":"Portugal","titulo":"From Drones to Technological Sovereignty: Why Angola Needs an Unmanned Systems Policy","resumo":"The growing use of drones across various sectors highlights the need for national regulation and strategy in Angola.\nThe debate emphasizes the importance of technological sovereignty and the development of local capabilities for operating unmanned systems.\nThe creation of a public policy aims to boost innovation and ensure the security of airspace.\nThe Angolan aerospace sector can thus establish itself as a pillar of regional modernization.","link":"https://www.dn.pt/opiniao-dn/sociedade-aberta/do-drone-soberania-tecnolgica-por-que-angola-precisa-de-uma-poltica-nacional-de-sistemas-no-tripulados","categoria":"INNOVATION","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Strategic Foresight: When Technology Helps Anticipate the Future","resumo":"Prospective analysis supported by advanced technological tools is transforming decision-making across various industries.\nBy processing large volumes of data, predictive algorithms and artificial intelligence can map future scenarios and trends.\nThis insight allows organizations to prepare in advance for imminent risks and new market opportunities.\nThe convergence of data science and strategic planning is becoming increasingly indispensable.","link":"https://www.cmjornal.pt/domingo/detalhe/prospetiva-estrategica-quando-a-tecnologia-ajuda-a-antecipar-o-que-ai-vem","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Pplware","pais":"Portugal","titulo":"Tech-Heavy Cars: Study Reinforces That This Is Not What Drivers Want","resumo":"A recent study revealed that the proliferation of touchscreens and digital features in modern vehicles causes dissatisfaction among many drivers.\nA large portion of motorists prefers traditional physical controls for basic functions due to ease of use and safety.\nThe excessive complexity of onboard systems ends up generating unwanted distractions behind the wheel.\nAutomakers now face the challenge of rebalancing technological innovation with practicality.","link":"https://pplware.sapo.pt/motores/carros-cheios-de-tecnologia-estudo-reforca-que-nao-e-isso-que-os-condutores-querem/","categoria":"TRENDS","lang":"en"},{"fonte":"Notícias de Coimbra","pais":"Portugal","titulo":"Does Your Dog Really Understand How You Feel? Science Has a Surprising Answer","resumo":"Recent scientific research investigates dogs' ability to decode human emotions through scent and body signals.\nThe results show that canines not only pick up on their owners' stress, but also alter their own physiological state.\nThis empathetic sensitivity is the result of millennia of co-evolution and domestication between humans and dogs.\nThe discovery reinforces the depth of the emotional and biological connection between dogs and their owners.","link":"https://www.noticiasdecoimbra.pt/o-teu-cao-percebe-mesmo-o-que-estas-a-sentir-a-ciencia-tem-uma-resposta-surpreendente/","categoria":"SCIENCE","lang":"en"},{"fonte":"Antena Livre","pais":"Portugal","titulo":"Vila de Rei: Summer Living Science Brings Solar Observation to Penedo Furado River Beach","resumo":"The Summer Living Science initiative hosted a public solar observation session at Penedo Furado River Beach in Vila de Rei.\nParticipants had the opportunity to use telescopes equipped with special solar filters to analyze solar activity.\nThe event brought together families and astronomy enthusiasts in a relaxed environment of leisure and hands-on learning.\nThe initiative aims to democratize access to scientific knowledge during the vacation season.","link":"https://www.antenalivre.pt/concelhos/ciencia-viva-no-verao-leva-observacao-do-sol-a-praia-fluvial-do-penedo-furado","categoria":"SCIENCE","lang":"en"},{"fonte":"RTP","pais":"Portugal","titulo":"Enter - Technology For All: Episode 5","resumo":"The latest episode of the 'Enter' program covers the main developments in the tech sector in an accessible way for all audiences.\nThis edition highlights advances in artificial intelligence, new market devices, and the impact of digital tools on everyday life.\nGuest experts discuss the challenges of digital inclusion and trends for the coming years.\nThe content aims to bring society closer to the innovations transforming daily life.","link":"https://www.rtp.pt/play/p16977/e949613/enter-tecnologia-para-todos","categoria":"TECHNOLOGY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
