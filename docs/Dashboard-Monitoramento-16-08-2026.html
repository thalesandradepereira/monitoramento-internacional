7.\nThe plan presented by authorities focuses on the mass adoption of artificial intelligence and the creation of skilled jobs.\nThe strategy seeks to attract major tech investments and reaffirm the state as an epicenter of innovation.","link":"https://www.telegraphindia.com/india/karnataka-usd-3-trillion-economy-target-by-2047-shivakumar-announces-jobs-and-ai-prnt/cid/2175129","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"oglobo.globo.com","pais":"India","titulo":"India Announces Rules for Opening the Nuclear Energy Sector to Private Companies","resumo":"The Indian government has formalized regulatory guidelines to allow private companies to enter the nuclear sector.\nThe move aims to accelerate the expansion of national energy capacity and meet the country's growing demand.\nThe initiative attracts new private investments and drives the transition toward low-carbon energy matrices.","link":"https://oglobo.globo.com/google/amp/economia/noticia/2026/08/15/india-anuncia-regras-da-abertura-da-energia-nuclear-a-empresas-privadas.ghtml","categoria":"NUCLEAR ENERGY","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Eclipse Causes 30% Drop in Internet Usage","resumo":"The recent solar eclipse caused a significant impact on global digital behavior, resulting in a 30% drop in internet traffic.\nExperts observed that the population temporarily disconnected from devices to follow the astronomical phenomenon live.\nThe event demonstrated how major natural occurrences still have the capacity to alter data consumption patterns on a mass scale.","link":"https://www.cmjornal.pt/tecnologia/detalhe/eclipse-causa-quebra-de-30-no-uso-da-internet","categoria":"SCIENCE","lang":"en"},{"fonte":"Dinheiro Vivo","pais":"Portugal","titulo":"Porto Startup Wins Global Cybersecurity Award and Solves 20-Year Problem in American Banking","resumo":"A Porto-based startup has won a prestigious international cybersecurity award by developing a highly innovative solution.\nThe technology created by the company successfully resolved a historical vulnerability that had affected the American banking sector for over two decades.\nThe achievement projects Portugal's technological ecosystem onto the global stage, highlighting the technical and competitive capacity of local companies.","link":"http://dinheirovivo.dn.pt/economia/startup-do-porto-vence-prmio-mundial-de-cibersegurana-e-resolve-problema-com-20-anos-na-banca-americana","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"A voz do Algarve","pais":"Portugal","titulo":"Portugal Debuts First Computed Tomography Equipment with Photon-Counting Technology","resumo":"Portugal has taken a major step in precision medicine with the implementation of the country's first photon-counting computed tomography scanner.\nThis revolutionary technology makes it possible to obtain medical images with unprecedented resolution and significantly reduces patients' radiation exposure.\nThe arrival of the equipment positions the Portuguese healthcare system at the forefront of diagnostic imaging and global medical innovation.","link":"https://www.avozdoalgarve.pt/d/portugal-estreia-primeiro-equipamento-de-tomografia-computorizada-com-tecnologia-de-contagem-de-fotoes-photon-counting/96721","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"saudemais.tv","pais":"Portugal","titulo":"Povoação: Azores Microbial Observatory Promotes Youth and Science Festival","resumo":"The Azores Microbial Observatory organized a special initiative in Povoação aimed at integrating young people into the universe of scientific knowledge.\nThe festival sought to bring the community closer to microbial research and foster an interest in exact and biological sciences from an early age.\nThe action highlights the relevance of regional science outreach to inspire future generations of researchers in the autonomous region.","link":"https://www.saudemais.tv/noticia/66242-povoacao-observatorio-microbiano-dos-acores-promove-festival-juventude-ciencia","categoria":"SCIENCE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
