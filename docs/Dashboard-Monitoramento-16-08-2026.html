  // Injeta os dados originais no frontend
  const data = [{"fonte":"Época Negócios","pais":"Brasil","titulo":"Maior avião elétrico a bateria do mundo realiza primeiro voo de teste","resumo":"A aviação sustentável alcançou um marco histórico com o voo experimental da maior aeronave 100% elétrica movida a bateria.\nO teste demonstrou uma eficiência energética surpreendente, reduzindo drasticamente os custos operacionais para cerca de cinco dólares.\nEssa inovação abre caminho para a descarbonização do transporte aéreo regional e acelera a transição comercial para voos limpos.\nEspecialistas apontam que a maturidade das baterias pode transformar a mobilidade aérea ao longo desta década.","link":"https://epocanegocios.globo.com/google/amp/tecnologia/noticia/2026/08/maior-aviao-eletrico-movido-a-bateria-ja-construido-faz-1o-voo-teste-e-gasta-apenas-us-5-em-energia.ghtml","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Livros antigos e esquecidos são comprados em massa para treinar inteligência artificial","resumo":"Obras literárias e acadêmicas que ficaram décadas encalhadas em estoques estão encontrando um novo e inusitado mercado consumidor.\nEmpresas de tecnologia estão adquirindo acervos físicos massivos para digitalizar conteúdos raros e alimentar modelos de inteligência artificial.\nEssa busca por dados não contaminados por conteúdos gerados por IA busca aprimorar o repertório e a fluência cultural das novas ferramentas.\nO movimento inesperado reaqueceu sebos e editoras antigas, transformando papel esquecido em um recurso digital valioso.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/15/os-livros-que-passaram-decadas-encalhados-e-agora-tem-um-misterioso-comprador-a-inteligencia-artificial.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Poder Naval","pais":"Brasil","titulo":"Tecnologia brasileira é criada para controlar enxames de drones em missões complexas","resumo":"A empresa LIG D\u0026A anunciou o desenvolvimento de um sistema capaz de coordenar de forma autônoma enxames de múltiplos drones.\nA solução permite executar missões simultâneas de vigilância, reconhecimento e coleta de dados sem a necessidade de múltiplos operadores humanos.\nO avanço eleva o patamar da indústria nacional de defesa e segurança ao integrar inteligência embarcada e comunicações criptografadas.\nA tecnologia também possui forte potencial de aplicação civil em cenários de emergência e monitoramento ambiental.","link":"https://www.naval.com.br/blog/2026/08/15/lig-da-desenvolve-tecnologia-para-controlar-enxames-de-drones-em-missoes-simultaneas-de-vigilancia-e-reconhecimento/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"A TARDE","pais":"Brasil","titulo":"Tecnologia ficcional apresentada em Black Mirror torna-se realidade comercial","resumo":"A ficção científica voltou a antecipar o futuro com a chegada ao mercado de invenções antes vistas apenas em episódios da série Black Mirror.\nDispositivos de monitoramento contínuo, registros de memória digital e assistentes virtuais ultra-realistas já estão em fase de uso prático.\nEsse avanço reacende importantes debates éticos sobre limites da privacidade e dependência tecnológica na vida diária.\nA rápida conversão de distopias em produtos reforça a velocidade impressionante com que a inovação impacta a sociedade moderna.","link":"https://atarde.com.br/cineinsite/episodio-de-black-mirror-previu-tecnologia-que-ja-virou-realidade-1398754","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"BBC","pais":"Brasil","titulo":"O retorno nostálgico das câmeras digitais e fones com fio entre os jovens","resumo":"Um movimento cultural liderado pelas gerações mais novas está trazendo de volta dispositivos eletrônicos considerados ultrapassados.\nCâmeras digitais antigas e fones de ouvido com fio voltaram a ser itens de desejo pela busca por estética retrô e simplicidade de uso.\nA tendência reflete também um desejo de desconexão parcial das redes sociais em tempo real e do excesso de notificações diárias.\nO mercado reage com aumento nas vendas de aparelhos seminovos e relançamentos de designs clássicos por grandes marcas.","link":"https://www.bbc.com/portuguese/articles/cp8edx0yy44o","categoria":"COMPORTAMENTO","lang":"pt"},{"fonte":"J3News","pais":"Brasil","titulo":"Pesquisas científicas avançam na busca por tratamentos definitivos contra a queda de cabelo","resumo":"Novos estudos em biotecnologia e dermatologia estão revelando mecanismos genéticos inéditos relacionados à calvície.\nPesquisadores testam terapias celulares e moléculas capazes de reativar folículos capilares adormecidos de forma segura e duradoura.\nOs resultados preliminares superam a eficácia dos medicamentos tradicionais e prometem revolucionar os tratamentos atuais.\nSe aprovadas nos ensaios clínicos finais, as novas abordagens podem estar disponíveis no mercado nos próximos anos.","link":"https://j3news.com/a-ciencia-esta-vencendo-a-queda-de-cabelo","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"BBC","pais":"Brasil","titulo":"A história da pré-história da computação 100% brasileira e seus pioneiros","resumo":"Projetos pioneiros como o Patinho Feio e os computadores Cobra marcaram o início da indústria tecnológica genuinamente nacional.\nDesenvolvidas entre as décadas de 1970 e 1980, essas iniciativas enfrentaram restrições de mercado e impulsionaram a engenharia local.\nRelembrar essa trajetória destaca a capacidade do país em criar soluções de hardware e software sob condições desafiadoras.\nO legado desses computadores históricos serve de inspiração para o ecossistema atual de inovação e startups no Brasil.","link":"https://www.bbc.com/portuguese/articles/cre4pr13nv5o","categoria":"HISTÓRIA","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"'Gato solar' cria novo conflito regulatório e econômico no setor elétrico brasileiro","resumo":"A proliferação de conexões irregulares de energia solar, apelidadas de 'gato solar', tornou-se um grande desafio para as distribuidoras.\nA prática envolve desvios em sistemas fotovoltaicos para burlar a medição do consumo e a cobrança de tarifas obrigatórias.\nO fenômeno afeta o equilíbrio financeiro das concessionárias e reacende disputas jurídicas sobre fiscalização e regulação do setor.\nEntidades defendem novas regras de controle para conter as perdas sem desestimular a expansão da energia limpa no país.","link":"https://www1.folha.uol.com.br/mercado/2026/08/gato-solar-vira-nova-frente-de-guerra-no-setor-eletrico.shtml","categoria":"ENERGIA","lang":"pt"},{"fonte":"Yahoo Finance","pais":"Estados Unidos","titulo":"O que a Silicon Motion Technology (SIMO) está revelando para o armazenamento de IA Agêntica?","resumo":"A Silicon Motion Technology está apresentando soluções inovadoras de armazenamento projetadas especificamente para dar suporte à Inteligência Artificial Agêntica.\nA nova arquitetura busca otimizar a eficiência energética e a velocidade no processamento contínuo de dados exigido por agentes autônomos.\nCom essa tecnologia, a empresa pretende liderar a infraestrutura de hardware necessária para a próxima geração de ecossistemas inteligentes.","link":"https://finance.yahoo.com/technology/ai/articles/silicon-motion-technology-simo-unveiling-041627040.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"APOD: Via Láctea sobre o Parque Nacional de Yellowstone","resumo":"A imagem do dia divulgada pela NASA destaca um registro impressionante do arco da Via Láctea cobrindo os icônicos cenários térmicos de Yellowstone.\nA fotografia combina detalhes astronômicos da nossa galáxia com a geografia singular do parque nacional localizado nos Estados Unidos.\nEsse tipo de divulgação visa incentivar a conscientização científica e a preservação do céu noturno livre de poluição luminosa.","link":"https://science.nasa.gov/image-article/apod/apod-2026-august-16-milky-way-over-yellowstone/","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"losalamosreporter.com","pais":"Estados Unidos","titulo":"NMED lança plano de economia circular e aporta US$ 11,5 milhões para reciclagem no Novo México","resumo":"O Departamento de Meio Ambiente do Novo México lançou um plano estratégico focado em economia circular, apoiado por um financiamento de US$ 11,5 milhões.\nA iniciativa visa fortalecer a cadeia de suprimentos local através de projetos inovadores de reutilização e recuperação de resíduos.\nEspera-se que o investimento reduza o impacto ambiental da região e crie novas oportunidades econômicas verdes no estado.","link":"https://losalamosreporter.com/2026/08/15/nmed-launches-circular-economy-plan-11-5-million-in-funding-to-advance-reuse-recovery-and-new-mexico-supply-chains/","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"El Español","pais":"Estados Unidos","titulo":"Trump ordena à Marinha dos EUA reinstalar tecnologia obsoleta em novos porta-aviões","resumo":"A ordem executiva para retroceder a tecnologias de lançamento de aeronaves a vapor nos novos porta-aviões norte-americanos gerou intensos debates na defesa.\nA mudança ignora os sistemas eletromagnéticos modernos, que já consumiram bilhões de dólares em desenvolvimento e testes operacionais.\nCríticos apontam que a decisão pode atrasar a modernização da frota e aumentar significativamente os custos de manutenção do país.","link":"https://www.elespanol.com/observatorio-defensa/20260816/trump-ordena-us-navy-reinstalar-tecnologia-obsoleta-nuevos-portaaviones-pese-recargos-miles-millones/1003744353055_0.html","categoria":"DEFESA","lang":"pt"},{"fonte":"simplywall.st","pais":"Estados Unidos","titulo":"Estée Lauder expande pesquisas em ciência das cores para correspondência de tons","resumo":"A Estée Lauder Companies anunciou a expansão de suas pesquisas voltadas à ciência das cores e à tonificação personalizada da pele.\nA iniciativa combina tecnologia espectrofotométrica avançada e inteligência artificial para criar bases com precisão sem precedentes.\nO investimento reforça o compromisso da multinacional em integrar avanços científicos de ponta ao setor de cosméticos e cuidados pessoais.","link":"https://simplywall.st/stocks/us/household/nyse-el/estee-lauder-companies/news/este-lauder-companies-el-expands-color-science-research-for","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"simplywall.st","pais":"Estados Unidos","titulo":"Marvell Technology e o aporte de US$ 2 bi da Nvidia: debate sobre seu valor justo","resumo":"A Marvell Technology recebeu um aporte expressivo de US$ 2 bilhões da Nvidia, fortalecendo sua posição na produção de semicondutores de alto desempenho.\nApesar da parceria estratégica impulsionar a confiança do mercado no setor de inteligência artificial, analistas financeiros divergem sobre a valorização da empresa.\nO acordo evidencia a intensa disputa e a complexidade na precificação das fornecedoras de infraestrutura tecnológica moderna.","link":"https://simplywall.st/stocks/us/semiconductors/nasdaq-mrvl/marvell-technology/news/marvell-technology-mrvl-on-nvidias-2b-backing-and-why-fair-v","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"larazon.es","pais":"Estados Unidos","titulo":"Fusão nuclear tem preço-alvo: MIT publica estrutura econômica para rentabilidade","resumo":"Pesquisadores do MIT publicaram um modelo econômico inédito que define as metas de custo para tornar as centrais de fusão nuclear comercialmente viáveis.\nA análise estabelece parâmetros claros de investimento por quilowatt gerado para que essa fonte limpa de energia possa competir com a rede elétrica.\nO estudo fornece um roteiro crucial para investidores e cientistas acelerarem a transição energética global nas próximas décadas.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/fusion-nuclear-ya-tiene-precio-objetivo-mit-publica-marco-economico-dice-cuanto-puede-costar-central-llegar-ser-rentable_202608156a7c24df71b42a0b5deaf051.html","categoria":"ENERGIA","lang":"pt"},{"fonte":"The Indian Express","pais":"França","titulo":"Corte suprema da França bloqueia proibição de redes sociais para menores de 15 anos","resumo":"A mais alta instância judicial da França barrou a legislação que visava proibir o acesso de menores de 15 anos às redes sociais sem autorização dos pais.\nA decisão baseou-se em preocupações sobre a liberdade de expressão e a inviabilidade técnica de uma verificação de idade eficaz.\nO veto representa um contratempo importante para as políticas digitais do país e reacende o debate global sobre a regulamentação das grandes plataformas.","link":"https://indianexpress.com/article/technology/tech-news-technology/frances-top-court-blocks-social-media-ban-for-under-15s-10835379/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"La Tribune","pais":"França","titulo":"Fast-food, Hollywood, transporte aéreo... como a revolução do Ozempic está abalando a economia","resumo":"O avanço dos medicamentos agonistas de GLP-1, como o Ozempic, está transformando profundamente diversos setores econômicos além da saúde tradicional.\nIndústrias de alimentos ultraprocessados, entretenimento e aviação já sentem os impactos das mudanças nos hábitos alimentares dos consumidores.\nAnalistas projetam que essa revolução farmacológica redefinirá modelos de negócios e comportamentos de consumo globalmente nos próximos anos.","link":"https://www.latribune.fr/article/la-tribune-dimanche/dimanche-eco/16664027439829/fast-food-hollywood-transport-aerien-comment-la-revolution-ozempic-bouleverse-leconomie","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Air\u0026Cosmos","pais":"França","titulo":"Paris Air Forum 2026: As novas trajetórias da economia de defesa","resumo":"O Paris Air Forum reuniu líderes do setor para debater os rumos da indústria aeroespacial e de defesa diante das crescentes tensões geopolíticas globais.\nO evento destacou a urgência por inovações tecnológicas avançadas, maior autonomia estratégica e avanços na descarbonização da aviação.\nA iniciativa reforça a busca da França e da Europa por respostas tecnológicas e econômicas consolidadas para os desafios do setor militar.","link":"https://air-cosmos.latribune.fr/article/strategies/18823190858545/paris-air-forum-2026-les-nouvelles-trajectoires-de-leconomie-de-defense-en-partenariat-avec-linstitut-choiseul","categoria":"DEFESA","lang":"pt"},{"fonte":"vietnam.vn","pais":"França","titulo":"Tecnologia de caças de sexta geração é testada no modelo biplace Su-57D","resumo":"Engenheiros militares iniciaram testes na versão de dois lugares do avião Su-57D para validar novos sistemas e tecnologias voltados à sexta geração de caças.\nOs ensaios focam na integração de inteligência artificial, comando de drones autônomos e sistemas aviônicos de combate de altíssima complexidade.\nEsse avanço reflete a intensa corrida tecnológica aeroespacial para modernizar as frotas de defesa e garantir superioridade tática.","link":"https://www.vietnam.vn/fr/cong-nghe-tiem-kich-the-he-thu-sau-duoc-thu-nghiem-tren-su-57d-hai-cho-ngoi","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Estações e esgotos parisienses: os segredos dessas obras-primas da engenharia","resumo":"Um novo documento televisivo explora as impressionantes soluções de engenharia por trás das redes subterrâneas e da infraestrutura ferroviária de Paris.\nAs obras históricas representam marcos fundamentais no saneamento urbano e no transporte de massa das grandes metrópoles.\nO panorama revela como os conceitos técnicos desenvolvidos no passado continuam sendo vitais para a logística e sustentabilidade da capital francesa.","link":"https://www.science-et-vie.com/technos-et-futur/gares-et-egouts-parisiens-decouvrez-les-secrets-de-ces-chefs-doeuvre-dingenierie-ce-dimanche-sur-science-vie-tv-255030.html","categoria":"ENGENHARIA","lang":"pt"},{"fonte":"La Tribune","pais":"França","titulo":"Ranking de Xangai: Paris-Saclay se mantém como a principal universidade francesa, com Harvard na liderança","resumo":"A Universidade Paris-Saclay reafirmou sua posição de destaque no prestigiado Ranking de Xangai, consolidando-se como a melhor instituição de ensino e pesquisa da França.\nA avaliação internacional leva em conta critérios rigorosos como volume de publicações científicas e prêmios acadêmicos conquistados por seus pesquisadores.\nO resultado destaca o papel central da França na produção científica europeia, enquanto a Universidade de Harvard mantém a liderança global.","link":"https://www.latribune.fr/article/economie/56677503386495/classement-de-shanghai-paris-saclay-reste-la-premiere-universite-francaise-harvard-toujours-en-tete","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Ao fugirem de uma tempestade na Antártida, cientistas descobrem uma ilha fora dos mapas","resumo":"Uma equipe de pesquisadores em expedição pelo continente gelado descobriu uma nova ilha desconhecida ao buscar abrigo contra uma forte tempestade polar.\nA porção de terra inédita emergiu como consequência direta do recuo acelerado de geleiras na região nos últimos anos.\nA descoberta inesperada fornece dados valiosos para estudos sobre mudanças climáticas e para a atualização das cartas geográficas da Antártida.","link":"https://www.science-et-vie.com/nature-et-environnement/ils-fuyaient-une-tempete-en-antarctique-des-scientifiques-decouvrent-une-ile-qui-napparait-sur-aucune-carte-235083.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"newsandstar.co.uk","pais":"Inglaterra","titulo":"Ecordea: O 'Batman' de Cúmbria pioneiro em tecnologia de levantamento ecológico","resumo":"A iniciativa Ecordea está revolucionando o monitoramento ecológico ao utilizar tecnologias avançadas para mapear e proteger populações de morcegos na região de Cúmbria.\nO projeto combina sensores modernos e análise de dados para otimizar pesquisas ambientais sem causar impacto negativo aos habitats locais.\nEssa inovação promete transformar as práticas de conservação da biodiversidade, servindo como modelo para futuros estudos de vida selvagem.","link":"https://www.newsandstar.co.uk/news/26462713.cumbria-batman-pioneering-bat-survey-technology/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Yahoo","pais":"Inglaterra","titulo":"NTU abandona detectores de IA alegando que tecnologia é pouco confiável para provar plágio","resumo":"A Universidade Nottingham Trent decidiu descontinuar o uso de ferramentas de detecção de inteligência artificial em trabalhos de alunos.\nA instituição destacou que os softwares atuais apresentam alta taxa de erro e não oferecem precisão suficiente para comprovar fraudes acadêmicas.\nA decisão intensifica o debate sobre as limitações técnicas e éticas do uso de sistemas de IA na avaliação educacional.","link":"https://malaysia.news.yahoo.com/ntu-ditch-ai-detectors-says-031351007.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Estadão","pais":"Inglaterra","titulo":"The Economist: Quanto você pagaria por um bebê mais inteligente?","resumo":"Uma reportagem especial aborda os avanços e os complexos dilemas éticos envolvendo a seleção genética e a engenharia reprodutiva para otimizar a inteligência humana.\nA possibilidade de escolher traços cognitivos em embriões levanta discussões sobre eugenia moderna, desigualdade social e os limites da biotecnologia.\nO avanço dessas técnicas pressiona os órgãos reguladores globais a definirem diretrizes claras para o setor da saúde reprodutiva.","link":"https://www.estadao.com.br/economia/the-economist-quanto-voce-pagaria-por-um-bebe-mais-inteligente/","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"El Periódico","pais":"Espanha","titulo":"Mais do que Estados Unidos e China: a União Europeia tem muito a dizer na batalha pelo domínio da computação quântica","resumo":"A União Europeia está fortalecendo seus investimentos e iniciativas no setor de computação quântica para garantir soberania tecnológica. A disputa pelo ecossistema quântico global não se limita apenas aos gigantes Estados Unidos e China. O continente europeu busca consolidar infraestruturas avançadas e ecossistemas de inovação capazes de liderar a próxima revolução digital.","link":"https://www.elperiodico.com/es/tecnologia/20260816/estados-unidos-china-batallan-dominio-computacion-cuantica-ordenadores-investigacion-tecnologia-europa-mapa-mundo-132764455","categoria":"COMPUTAÇÃO QUÂNTICA","lang":"pt"},{"fonte":"GranadaDigital","pais":"Espanha","titulo":"A ciência como ferramenta para proteger Granada dos terremotos","resumo":"Pesquisadores e cientistas estão aplicando tecnologias avançadas e estudos geológicos para prevenir e minimizar os impactos de abalos sísmicos na região de Granada. A iniciativa visa mapear falhas geológicas e aprimorar os sistemas de alerta precoce para a população local. Com a integração de dados científicos e infraestrutura resiliente, a cidade busca se tornar referência em segurança e preparação contra desastres naturais.","link":"https://www.granadadigital.es/ciencia-proteger-granada-terremotos/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"heraldo.es","pais":"Espanha","titulo":"A empresa aragonesa Libelium moderniza câmeras de videomonitoramento na Catalunha para gerenciar melhor o tráfego","resumo":"A empresa de tecnologia Libelium implementou soluções inteligentes para atualizar a infraestrutura de câmeras de monitoramento viário na Catalunha. A modernização permite a coleta precisa de dados em tempo real sobre o fluxo de veículos e os padrões de mobilidade urbana. A tecnologia apoia a tomada de decisões na gestão do trânsito, promovendo cidades mais eficientes e conectadas.","link":"https://www.heraldo.es/noticias/economia/2026/08/16/aragonesa-libelium-moderniza-camaras-videovigilancia-cataluna-para-gestionar-mejor-trafico-2044654.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"LNE","pais":"Espanha","titulo":"A ciência em um tuit: Rumo a um cimento sustentável","resumo":"Novas pesquisas científicas estão impulsionando o desenvolvimento de alternativas ecológicas para a produção de cimento, um dos materiais com maior pegada de carbono do planeta. As inovações focam na redução das emissões de gases de efeito estufa durante o processo de fabricação sem comprometer a resistência e durabilidade. Essa transição é fundamental para promover a construção civil verde e atingir as metas globais de sustentabilidade.","link":"https://www.lne.es/opinion/2026/08/16/ciencia-tuit-cemento-sostenible-133394840.html","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"LNE","pais":"Espanha","titulo":"Qubits e enxada: quando a tecnologia se tornou vizinha da aldeia de Peón (Villaviciosa)","resumo":"A pequena aldeia rural de Peón, em Villaviciosa, tornou-se palco de uma integração inédita entre inovação tecnológica de ponta e tradição agrícola. A chegada de projetos voltados para tecnologias emergentes e computação quântica está revitalizando a economia local e promovendo a inclusão digital. O projeto demonstra como o avanço científico pode coexistir e impulsionar regiões rurais historicamente afastadas dos grandes centros de inovação.","link":"https://www.lne.es/villaviciosa/2026/08/16/qubits-azada-tecnologia-hizo-vecina-133393189.amp.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Faro de Vigo","pais":"Espanha","titulo":"Tecnologia com selo de Vigo para acertar o tamanho do sapato em segundos com apenas uma foto","resumo":"Desenvolvedores da cidade de Vigo criaram uma solução tecnológica inovadora que permite calcular com precisão o tamanho ideal de calçados usando apenas uma imagem do pé. Utilizando inteligência artificial e visão computacional, a ferramenta resolve um dos maiores problemas das compras de calçados online. A novidade melhora a experiência do consumidor e reduz significativamente os custos com devoluções no comércio eletrônico.","link":"https://www.farodevigo.es/economia/2026/08/15/tecnologia-sello-vigues-acertar-talla-zapatos-sizit-ai-133387239.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Perspective Daily","pais":"Alemanha","titulo":"IA exige energia, água e espaço — e a política alemã decide reagir","resumo":"O rápido avanço da inteligência artificial está exigindo volumes crescentes de energia elétrica, água e espaço físico para infraestrutura de data centers. Diante desse forte impacto ambiental e infraestrutural, líderes políticos alemães começaram a elaborar medidas e regulamentações específicas. O objetivo é viabilizar a expansão tecnológica sem comprometer os recursos naturais e as metas de sustentabilidade do país.","link":"https://perspective-daily.de/article/5113-ki-braucht-strom-wasser-und-platz-jetzt-reagiert-die-politik/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"El Economista","pais":"Alemanha","titulo":"Alemanha revoga lei de 1919 em esforço para estimular a economia","resumo":"O governo alemão decidiu eliminar uma legislação centenária datada de 1919 com o objetivo de reduzir a burocracia e destravar o crescimento econômico nacional. A medida visa simplificar normas regulatórias obsoletas que dificultavam novos investimentos e a agilidade do setor empresarial. Com essa modernização, espera-se criar um ambiente de negócios mais dinâmico e competitivo no mercado europeu.","link":"https://www.eleconomista.es/economia/noticias/14007995/08/26/alemania-dice-adios-a-una-ley-de-1919-para-intentar-estimular-su-economia.html","categoria":"ECONOMIA","lang":"pt"},{"fonte":"ARN News Centre","pais":"Alemanha","titulo":"Liebmann, da Alemanha, quebra o recorde mundial dos 1500m","resumo":"O atleta alemão atingiu uma marca histórica ao quebrar o recorde mundial na prova dos 1500 metros, destacando-se na elite do esporte internacional. O feito impressionante é resultado de uma preparação intensa e consolida a posição de destaque da Alemanha na modalidade. A conquista teve grande repercussão no cenário esportivo e promete impulsionar o desenvolvimento de novos talentos no país.","link":"https://www.arnnewscentre.ae/en/news/sports/germanys-liebmann-smashes-1500m-world-record/","categoria":"ESPORTES","lang":"pt"},{"fonte":"NHKニュース","pais":"Japão","titulo":"Ministério da Educação do Japão subsidiará universidades em até 50 milhões de ienes por ano para apoiar pesquisadoras","resumo":"O Ministério da Educação, Cultura, Esportes, Ciência e Tecnologia do Japão anunciou um programa de subsídios de até 50 milhões de ienes anuais para universidades que apoiem mulheres cientistas.\nA iniciativa visa combater a disparidade de gênero nas áreas STEM e reter talentos femininos no ambiente acadêmico.\nO investimento promoverá reformas estruturais e suporte para maternidade, fortalecendo a competitividade científica do país.","link":"https://news.web.nhk/newsweb/na/nd-20260816de44362","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"モーターファン","pais":"Japão","titulo":"Porsche refrigerado a ar vira carro esportivo moderno: O impacto do Porsche 930 Turbo digitalizado","resumo":"Uma nova modificação tecnológica transformou o clássico Porsche 930 Turbo, com motor refrigerado a ar, em um veículo moderno totalmente digitalizado.\nO projeto integra eletrônica avançada e sistemas de controle computadorizados sem perder a essência clássica do modelo.\nEssa fusão entre engenharia vintage e tecnologia de ponta representa uma tendência crescente no setor automotivo para a revitalização de carros esportivos lendários.","link":"https://motor-fan.jp/article/1595338/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Gizmodo","pais":"Japão","titulo":"Análise do Skullcandy Crusher 1080 ANC recheado com tecnologia da Bose","resumo":"O novo fone de ouvido Skullcandy Crusher 1080 ANC combina os graves potentes característicos da marca com a renomada tecnologia de cancelamento ativo de ruído desenvolvida pela Bose.\nA análise destaca o equilíbrio surpreendente entre isolamento acústico premium e a imersão tátil de baixa frequência.\nO produto surge como uma opção altamente competitiva para entusiastas do áudio que buscam alta performance e conforto.","link":"https://www.gizmodo.jp/article/skullcandy-crusher-1080-anc-review-a-huge-boost-from-bose/","categoria":"HARDWARE","lang":"pt"},{"fonte":"大学ジャーナルオンライン","pais":"Japão","titulo":"Universidade Keio, Universidade de Ciência de Tóquio e RIKEN fundam o Consórcio Health Commons","resumo":"A Universidade Keio, a Universidade de Ciência de Tóquio e o instituto RIKEN uniram forças para estabelecer o Consórcio Health Commons.\nA aliança visa integrar bancos de dados de saúde, inteligência artificial e pesquisas médicas avançadas para promover a medicina preventiva e personalizada.\nO projeto busca criar um ecossistema sustentável focado na longevidade e no bem-estar da população japonesa.","link":"https://univ-journal.jp/1000233/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"朝日新聞","pais":"Japão","titulo":"Seguradoras aceleram pagamento de seguros de terremoto usando tecnologia digital para apoiar reconstrução","resumo":"Empresas de seguros de danos no Japão estão adotando inteligência artificial e análise de imagens de satélite para agilizar a liberação de indenizações por terremotos.\nA digitalização do processo reduz drasticamente o tempo de vistoria presencial e ajuda vítimas de desastres a iniciarem a reconstrução mais rapidamente.\nA medida representa um avanço crucial na gestão de crises e na resiliência comunitária diante de catástrofes.","link":"https://www.asahi.com/articles/ASV8G2JJ0V8GULFA01XM.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Xataka","pais":"China","titulo":"Trem de levitação magnética na China atinge 800 km/h e estabelece novo recorde","resumo":"A China registrou um feito histórico no setor de transportes ao testar um trem de levitação magnética (maglev) que alcançou a velocidade de 800 km/h. O avanço destaca o pioneirismo do país em sistemas de transporte de altíssima velocidade baseados em supercondutividade e tubos de vácuo parcial.\nA nova tecnologia promete revolucionar a mobilidade terrestre entre grandes metrópoles nas próximas décadas, reduzindo drasticamente os tempos de viagem.","link":"https://www.xataka.com/movilidad/tren-china-ha-alcanzado-800-km-h-nuevo-record-para-tecnologia-levitacion-magnetica","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Pplware","pais":"China","titulo":"Volkswagen adota tecnologia 'Made in China' em parceria estratégica com a XPENG","resumo":"A montadora alemã Volkswagen está integrando arquiteturas e sistemas eletrônicos desenvolvidos pela fabricante chinesa de veículos elétricos XPENG em seus novos modelos.\nEssa inversão histórica evidencia a liderança tecnológica da China no mercado de mobilidade elétrica e software veicular.\nA colaboração reforça a competitividade das empresas chinesas como fornecedoras de soluções avançadas para gigantes globais.","link":"https://pplware.sapo.pt/motores/volkswagen-esta-a-copiar-tecnologia-made-in-china-e-e-a-xpeng-quem-manda/","categoria":"INOVAÇÃO AUTOMOTIVA","lang":"pt"},{"fonte":"Sohu","pais":"China","titulo":"Estação Espacial Chinesa avança com múltiplos experimentos científicos na órbita terrestre","resumo":"A tripulação a bordo da estação espacial Tiangong continua avançando em diversos experimentos em microgravidade nas áreas de biologia, física de fluidos e medicina espacial.\nAs atividades semanais incluem a manutenção de equipamentos de ponta e a coleta de dados cruciais para missões de longa duração.\nOs resultados obtidos buscam consolidar o programa espacial da China e apoiar futuras missões lunares e interplanetárias.","link":"https://m.sohu.com/a/1063499565_121620820?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334","categoria":"EXPLORAÇÃO ESPACIAL","lang":"pt"},{"fonte":"Sohu","pais":"China","titulo":"Ex-líder de IA da Alibaba lança startup enquanto Cambricon alerta sobre estoques de chips","resumo":"Lin Junyang, ex-responsável técnico pelo desenvolvimento do modelo de linguagem Qwen da Alibaba, anunciou o lançamento de sua nova empresa focada em inteligência artificial.\nParalelamente, a fabricante chinesa de chips para IA Cambricon emitiu um alerta ao mercado sobre o aumento significativo de seus estoques.\nOs movimentos destacam a forte dinâmica competitiva e as oscilações estratégicas no setor de semicondutores e IA no país.","link":"https://m.sohu.com/a/1063548282_114986?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"新浪财经","pais":"China","titulo":"Três cientistas vencem o Prêmio Future Science de 2026 por avanços em materiais e biologia","resumo":"A prestigiada premiação Future Science Prize de 2026 laureou três pesquisadores por suas contribuições em mecanismos de limpeza celular e engenharia de materiais porosos.\nCada um dos prêmios, avaliados em cerca de 1 milhão de dólares, reconheceu pesquisas com alto impacto global na medicina e na indústria.\nO anúncio reforça os investimentos contínuos da China para impulsionar a pesquisa científica de ponta e a inovação disruptiva.","link":"https://finance.sina.cn/stock/jdts/2026-08-16/detail-ininmpac1955037.d.html?vt=4\u0026cid=76993\u0026node_id=76993","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"新浪财经","pais":"China","titulo":"Revelada a tecnologia PSSR do PS5 Pro: IA aprimora gráficos otimizando o processamento","resumo":"Detalhes técnicos revelam como a tecnologia de upscaling PSSR alimentada por IA melhora a qualidade de imagem nos jogos sem sobrecarregar o hardware.\nAo otimizar o processamento temporal e reduzir tarefas redundantes da unidade neural, o sistema entrega taxas de quadros mais elevadas e maior fidelidade visual.\nA inovação representa um grande avanço no uso prático de modelos de aprendizado de máquina na indústria de jogos eletrônicos.","link":"https://finance.sina.cn/tech/2026-08-15/detail-ininmank1736584.d.html?oid=WA%200821%207001%200763%20(FORTRESS)%20Kusen%20Pintu%20Baja%20Fortress%20Pilangkenceng%20Madiun\u0026vt=4","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Sohu","pais":"China","titulo":"Pesquisa da Universidade de Nanjing aborda computação para drones e economia de baixa altitude","resumo":"A equipe liderada pelo professor Huang Haiping apresentou novas pesquisas focadas em arquiteturas de computação embarcada para veículos aéreos não tripulados.\nO trabalho visa otimizar o processamento de dados em tempo real para suportar a crescente demanda da economia de baixa altitude na China.\nA tecnologia promete melhorar a segurança de voos autônomos, gestão de tráfego aéreo urbano e entregas automatizadas.","link":"https://m.sohu.com/a/1063533664_121119270?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"东方财富","pais":"China","titulo":"CGN Medical e Hospital West China assinam acordo para inovação em protonterapia","resumo":"A CGN Medical Services firmou uma parceria de cooperação tecnológica com o prestigiado Hospital West China para desenvolver soluções avançadas em protonterapia.\nA parceria busca acelerar a inovação em equipamentos médicos de alta precisão voltados ao tratamento de tumores e oncologia avançada.\nO projeto fortalece a autossuficiência da tecnologia médica chinesa no setor de tratamento radiológico de última geração.","link":"https://wap.eastmoney.com/a/202608153842404646.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"NDTV","pais":"Índia","titulo":"Pesquisadores na Suíça desenvolvem minidrones movidos por ondas sonoras","resumo":"Pesquisadores suíços alcançaram um avanço na robótica ao desenvolver minidrones movidos por ondas sonoras.\nA tecnologia utiliza princípios de acústica para propulsão e controle de voo sem a necessidade de peças móveis tradicionais.\nEssa inovação abre caminho para aplicações promissoras em exames médicos internos e inspeções de ambientes confinados.","link":"https://www.ndtv.com/science/swiss-researchers-develop-tiny-drones-that-run-on-sound-waves-11916277","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The News Mill","pais":"Índia","titulo":"Modi anuncia capacitação em IA, busca de talentos esportivos e metas para energia nuclear no Dia da Independência","resumo":"Durante o discurso do Dia da Independência, o primeiro-ministro Narendra Modi apresentou metas estratégicas para o futuro da Índia.\nOs anúncios destacam um amplo programa nacional de capacitação em inteligência artificial voltado para a juventude.\nAlém disso, o plano inclui a busca por talentos no esporte e metas ambiciosas para a expansão da matriz de energia nuclear.","link":"https://thenewsmill.com/2026/08/modi-announces-ai-skilling-sports-talent-hunt-and-nuclear-power-targets-on-independence-day/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"ANI News","pais":"Índia","titulo":"Índia conta com cerca de 440 startups de tecnologia espacial","resumo":"O setor aeroespacial indiano registra uma expansão expressiva, alcançando a marca de 440 startups ativas no país.\nEsse crescimento impulsiona soluções locais no desenvolvimento de satélites, foguetes de lançamento e serviços orbitais.\nO avanço consolida a posição da Índia como um hub emergente na economia espacial privada internacional.","link":"https://www.aninews.in/news/national/general-news/india-has-around-440-space-technology-startups20260816084423","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"telegraphindia.com","pais":"Índia","titulo":"Karnataka almeja economia de US$ 3 trilhões até 2047 com plano focado em empregos e IA","resumo":"O estado de Karnataka estabeleceu a meta de alcançar uma economia de 3 trilhões de dólares até o ano de 2047.\nO plano apresentado pelas autoridades foca na massificação da inteligência artificial e na criação de empregos qualificados.\nA estratégia busca atrair grandes investimentos tecnológicos e reafirmar o estado como epicentro de inovação.","link":"https://www.telegraphindia.com/india/karnataka-usd-3-trillion-economy-target-by-2047-shivakumar-announces-jobs-and-ai-prnt/cid/2175129","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"oglobo.globo.com","pais":"Índia","titulo":"Índia anuncia regras para abertura do setor de energia nuclear a empresas privadas","resumo":"O governo indiano oficializou as diretrizes regulatórias para permitir a entrada de empresas privadas no setor nuclear.\nA medida visa acelerar a expansão da capacidade energética nacional e suprir a crescente demanda do país.\nA iniciativa atrai novos investimentos privados e impulsiona a transição para matrizes de baixa emissão de carbono.","link":"https://oglobo.globo.com/google/amp/economia/noticia/2026/08/15/india-anuncia-regras-da-abertura-da-energia-nuclear-a-empresas-privadas.ghtml","categoria":"ENERGIA NUCLEAR","lang":"pt"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Eclipse causa queda de 30% no uso da internet","resumo":"O recente eclipse solar provocou um impacto significativo no comportamento digital global, resultando em uma queda de 30% no tráfego da internet.\nEspecialistas observaram que a população se desconectou temporariamente dos dispositivos para acompanhar o fenômeno astronômico ao vivo.\nO evento demonstrou como grandes acontecimentos naturais ainda possuem a capacidade de alterar o padrão de consumo de dados em escala de massa.","link":"https://www.cmjornal.pt/tecnologia/detalhe/eclipse-causa-quebra-de-30-no-uso-da-internet","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Dinheiro Vivo","pais":"Portugal","titulo":"Startup do Porto vence prêmio mundial de cibersegurança e resolve problema de 20 anos na banca americana","resumo":"Uma startup sediada no Porto conquistou um prestigiado prêmio internacional de cibersegurança ao desenvolver uma solução altamente inovadora.\nA tecnologia criada pela empresa conseguiu resolver uma vulnerabilidade histórica que afetava o setor bancário americano há mais de duas décadas.\nA conquista projeta o ecossistema tecnológico de Portugal no cenário global, destacando a capacidade técnica e competitiva das empresas locais.","link":"http://dinheirovivo.dn.pt/economia/startup-do-porto-vence-prmio-mundial-de-cibersegurana-e-resolve-problema-com-20-anos-na-banca-americana","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"A voz do Algarve","pais":"Portugal","titulo":"Portugal estreia primeiro equipamento de Tomografia Computadorizada com tecnologia de Contagem de Fótons","resumo":"Portugal deu um passo importante na medicina de precisão com a implementação do primeiro tomógrafo computadorizado por contagem de fótons no país.\nEssa tecnologia revolucionária permite obter imagens médicas com resolução sem precedentes e reduz sensivelmente a exposição dos pacientes à radiação.\nA chegada do equipamento posiciona o sistema de saúde português na vanguarda do diagnóstico por imagem e da inovação médica global.","link":"https://www.avozdoalgarve.pt/d/portugal-estreia-primeiro-equipamento-de-tomografia-computorizada-com-tecnologia-de-contagem-de-fotoes-photon-counting/96721","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"saudemais.tv","pais":"Portugal","titulo":"Povoação: Observatório Microbiano dos Açores promove Festival Juventude e Ciência","resumo":"O Observatório Microbiano dos Açores organizou na Povoação uma iniciativa especial voltada para integrar os jovens no universo do conhecimento científico.\nO festival buscou aproximar a comunidade das pesquisas microbianas e fomentar o interesse pelas áreas de exatas e biológicas desde cedo.\nA ação destaca a relevância da divulgação científica regional para inspirar futuras gerações de pesquisadores na região autônoma.","link":"https://www.saudemais.tv/noticia/66242-povoacao-observatorio-microbiano-dos-acores-promove-festival-juventude-ciencia","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Época Negócios","pais":"Brazil","titulo":"World's largest battery-powered electric airplane makes first test flight","resumo":"Sustainable aviation achieved a historic milestone with the experimental flight of the largest 100% battery-powered aircraft.\nThe test demonstrated surprising energy efficiency, drastically reducing operational costs to around five dollars.\nThis innovation paves the way for the decarbonization of regional air transport and accelerates the commercial transition to clean flights.\nExperts point out that the maturity of batteries could transform air mobility throughout this decade.","link":"https://epocanegocios.globo.com/google/amp/tecnologia/noticia/2026/08/maior-aviao-eletrico-movido-a-bateria-ja-construido-faz-1o-voo-teste-e-gasta-apenas-us-5-em-energia.ghtml","categoria":"INNOVATION","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"Old and forgotten books are bought in bulk to train artificial intelligence","resumo":"Literary and academic works that spent decades sitting unsold in warehouses are finding a new and unusual consumer market.\nTech companies are acquiring massive physical collections to digitize rare content and feed artificial intelligence models.\nThis search for data uncontaminated by AI-generated content aims to enhance the repertoire and cultural fluency of new tools.\nThis unexpected movement has revitalized second-hand bookstores and old publishers, turning forgotten paper into a valuable digital resource.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/15/os-livros-que-passaram-decadas-encalhados-e-agora-tem-um-misterioso-comprador-a-inteligencia-artificial.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Poder Naval","pais":"Brazil","titulo":"Brazilian technology created to control drone swarms in complex missions","resumo":"The company LIG D\u0026A has announced the development of a system capable of autonomously coordinating swarms of multiple drones.\nThe solution allows for the execution of simultaneous surveillance, reconnaissance, and data collection missions without the need for multiple human operators.\nThis breakthrough raises the standard of the national defense and security industry by integrating onboard intelligence and encrypted communications.\nThe technology also holds strong potential for civilian application in emergency scenarios and environmental monitoring.","link":"https://www.naval.com.br/blog/2026/08/15/lig-da-desenvolve-tecnologia-para-controlar-enxames-de-drones-em-missoes-simultaneas-de-vigilancia-e-reconhecimento/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"A TARDE","pais":"Brazil","titulo":"Fictional technology featured in Black Mirror becomes commercial reality","resumo":"Science fiction has once again anticipated the future with the arrival on the market of inventions previously seen only in episodes of the series Black Mirror.\nContinuous monitoring devices, digital memory records, and ultra-realistic virtual assistants are already in practical use.\nThis advancement rekindles important ethical debates regarding the limits of privacy and technological dependency in daily life.\nThe rapid conversion of dystopias into products reinforces the impressive speed with which innovation impacts modern society.","link":"https://atarde.com.br/cineinsite/episodio-de-black-mirror-previu-tecnologia-que-ja-virou-realidade-1398754","categoria":"TRENDS","lang":"en"},{"fonte":"BBC","pais":"Brazil","titulo":"The nostalgic return of digital cameras and wired headphones among young people","resumo":"A cultural movement led by younger generations is bringing back electronic devices once considered outdated.\nOld digital cameras and wired headphones have become desired items again due to the pursuit of a retro aesthetic and simplicity of use.\nThe trend also reflects a desire for a partial disengagement from real-time social media and the overload of daily notifications.\nThe market is reacting with increased sales of second-hand devices and re-releases of classic designs by major brands.","link":"https://www.bbc.com/portuguese/articles/cp8edx0yy44o","categoria":"BEHAVIOR","lang":"en"},{"fonte":"J3News","pais":"Brazil","titulo":"Scientific research advances in the search for definitive treatments against hair loss","resumo":"New studies in biotechnology and dermatology are uncovering unprecedented genetic mechanisms related to baldness.\nResearchers are testing cellular therapies and molecules capable of safely and permanently reactivating dormant hair follicles.\nPreliminary results surpass the effectiveness of traditional medications and promise to revolutionize current treatments.\nIf approved in final clinical trials, the new approaches could be available on the market in the coming years.","link":"https://j3news.com/a-ciencia-esta-vencendo-a-queda-de-cabelo","categoria":"SCIENCE","lang":"en"},{"fonte":"BBC","pais":"Brazil","titulo":"The history of 100% Brazilian computing prehistory and its pioneers","resumo":"Pioneering projects like the Patinho Feio and Cobra computers marked the beginning of a genuinely national tech industry.\nDeveloped between the 1970s and 1980s, these initiatives faced market restrictions while driving local engineering.\nRemembering this trajectory highlights the country's ability to create hardware and software solutions under challenging conditions.\nThe legacy of these historic computers serves as inspiration for today's innovation and startup ecosystem in Brazil.","link":"https://www.bbc.com/portuguese/articles/cre4pr13nv5o","categoria":"HISTORY","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"'Solar wire-tapping' creates new regulatory and economic conflict in Brazil's electricity sector","resumo":"The proliferation of irregular solar energy connections, dubbed 'solar wire-tapping,' has become a major challenge for utility companies.\nThe practice involves tampering with photovoltaic systems to bypass consumption metering and mandatory tariff charges.\nThe phenomenon affects the financial equilibrium of concessionaires and reignites legal disputes over sector oversight and regulation.\nEntities are advocating for new control rules to curb losses without discouraging the expansion of clean energy in the country.","link":"https://www1.folha.uol.com.br/mercado/2026/08/gato-solar-vira-nova-frente-de-guerra-no-setor-eletrico.shtml","categoria":"ENERGY","lang":"en"},{"fonte":"Yahoo Finance","pais":"United States","titulo":"What Silicon Motion Technology (SIMO) is revealing for Agentic AI storage","resumo":"Silicon Motion Technology is showcasing innovative storage solutions specifically designed to support Agentic Artificial Intelligence.\nThe new architecture aims to optimize energy efficiency and processing speed for the continuous data demands required by autonomous agents.\nWith this technology, the company intends to lead the hardware infrastructure necessary for the next generation of intelligent ecosystems.","link":"https://finance.yahoo.com/technology/ai/articles/silicon-motion-technology-simo-unveiling-041627040.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"United States","titulo":"APOD: Milky Way over Yellowstone National Park","resumo":"The image of the day released by NASA highlights a striking capture of the Milky Way arch spanning Yellowstone's iconic thermal landscapes.\nThe photograph combines astronomical details of our galaxy with the unique geography of the national park located in the United States.\nThis type of outreach aims to encourage scientific awareness and the preservation of night skies free from light pollution.","link":"https://science.nasa.gov/image-article/apod/apod-2026-august-16-milky-way-over-yellowstone/","categoria":"ASTRONOMY","lang":"en"},{"fonte":"losalamosreporter.com","pais":"United States","titulo":"NMED launches circular economy plan and contributes $11.5 million for recycling in New Mexico","resumo":"The New Mexico Environment Department has launched a strategic plan focused on the circular economy, backed by $11.5 million in funding.\nThe initiative aims to strengthen the local supply chain through innovative reuse and waste recovery projects.\nThe investment is expected to reduce the region's environmental impact and create new green economic opportunities in the state.","link":"https://losalamosreporter.com/2026/08/15/nmed-launches-circular-economy-plan-11-5-million-in-funding-to-advance-reuse-recovery-and-new-mexico-supply-chains/","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"El Español","pais":"United States","titulo":"Trump orders US Navy to reinstall obsolete technology on new aircraft carriers","resumo":"The executive order to revert to steam aircraft launch technologies on new US aircraft carriers has sparked intense defense debates.\nThe move bypasses modern electromagnetic systems, which have already consumed billions of dollars in development and operational testing.\nCritics point out that the decision could delay fleet modernization and significantly increase the country's maintenance costs.","link":"https://www.elespanol.com/observatorio-defensa/20260816/trump-ordena-us-navy-reinstalar-tecnologia-obsoleta-nuevos-portaaviones-pese-recargos-miles-millones/1003744353055_0.html","categoria":"DEFENSE","lang":"en"},{"fonte":"simplywall.st","pais":"United States","titulo":"Estée Lauder expands color science research for shade matching","resumo":"The Estée Lauder Companies has announced the expansion of its research focused on color science and personalized skin toning.\nThe initiative combines advanced spectrophotometric technology and artificial intelligence to create foundations with unprecedented precision.\nThe investment reinforces the multinational's commitment to integrating cutting-edge scientific advances into the cosmetics and personal care sector.","link":"https://simplywall.st/stocks/us/household/nyse-el/estee-lauder-companies/news/este-lauder-companies-el-expands-color-science-research-for","categoria":"SCIENCE","lang":"en"},{"fonte":"simplywall.st","pais":"United States","titulo":"Marvell Technology and Nvidia's $2B backing: a debate on fair value","resumo":"Marvell Technology has received a significant $2 billion backing from Nvidia, strengthening its position in high-performance semiconductor production.\nAlthough the strategic partnership has boosted market confidence in the artificial intelligence sector, financial analysts diverge on the company's valuation.\nThe deal highlights the intense competition and complexity in pricing modern technology infrastructure suppliers.","link":"https://simplywall.st/stocks/us/semiconductors/nasdaq-mrvl/marvell-technology/news/marvell-technology-mrvl-on-nvidias-2b-backing-and-why-fair-v","categoria":"BUSINESS","lang":"en"},{"fonte":"larazon.es","pais":"United States","titulo":"Nuclear fusion has a target price: MIT publishes economic framework for profitability","resumo":"MIT researchers have published an unprecedented economic model that defines cost targets to make commercial nuclear fusion plants viable.\nThe analysis establishes clear investment parameters per kilowatt generated so that this clean energy source can compete with the power grid.\nThis study provides a crucial roadmap for investors and scientists to accelerate the global energy transition in the coming decades.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/fusion-nuclear-ya-tiene-precio-objetivo-mit-publica-marco-economico-dice-cuanto-puede-costar-central-llegar-ser-rentable_202608156a7c24df71b42a0b5deaf051.html","categoria":"ENERGY","lang":"en"},{"fonte":"The Indian Express","pais":"France","titulo":"France's Supreme Court Blocks Social Media Ban for Under-15s","resumo":"France's highest judicial authority has blocked legislation aimed at banning access to social media for minors under 15 without parental consent.\nThe decision was based on concerns regarding freedom of expression and the technical infeasibility of effective age verification.\nThe veto represents a major setback for the country's digital policies and reignites the global debate on the regulation of major platforms.","link":"https://indianexpress.com/article/technology/tech-news-technology/frances-top-court-blocks-social-media-ban-for-under-15s-10835379/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"La Tribune","pais":"France","titulo":"Fast Food, Hollywood, Air Travel... How the Ozempic Revolution Is Shaking Up the Economy","resumo":"The advancement of GLP-1 receptor agonist medications, such as Ozempic, is profoundly transforming various economic sectors beyond traditional healthcare.\nIndustries in ultra-processed foods, entertainment, and aviation are already feeling the impacts of changes in consumers' eating habits.\nAnalysts project that this pharmacological revolution will redefine business models and consumer behavior globally in the coming years.","link":"https://www.latribune.fr/article/la-tribune-dimanche/dimanche-eco/16664027439829/fast-food-hollywood-transport-aerien-comment-la-revolution-ozempic-bouleverse-leconomie","categoria":"SCIENCE","lang":"en"},{"fonte":"Air\u0026Cosmos","pais":"France","titulo":"Paris Air Forum 2026: New Trajectories for the Defense Economy","resumo":"The Paris Air Forum gathered industry leaders to discuss the directions of the aerospace and defense industry in the face of growing global geopolitical tensions.\nThe event highlighted the urgency for advanced technological innovations, greater strategic autonomy, and progress in aviation decarbonization.\nThe initiative reinforces France and Europe's pursuit of consolidated technological and economic responses to the challenges of the military sector.","link":"https://air-cosmos.latribune.fr/article/strategies/18823190858545/paris-air-forum-2026-les-nouvelles-trajectoires-de-leconomie-de-defense-en-partenariat-avec-linstitut-choiseul","categoria":"DEFENSE","lang":"en"},{"fonte":"vietnam.vn","pais":"France","titulo":"Sixth-Generation Fighter Technology Tested on Two-Seater Su-57D Model","resumo":"Military engineers have initiated tests on the two-seater version of the Su-57D aircraft to validate new systems and technologies geared toward sixth-generation fighters.\nThe trials focus on the integration of artificial intelligence, autonomous drone command, and highly complex combat avionics systems.\nThis advancement reflects the intense aerospace technological race to modernize defense fleets and guarantee tactical superiority.","link":"https://www.vietnam.vn/fr/cong-nghe-tiem-kich-the-he-thu-sau-duoc-thu-nghiem-tren-su-57d-hai-cho-ngoi","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Science et vie","pais":"France","titulo":"Parisian Stations and Sewers: The Secrets of These Engineering Masterpieces","resumo":"A new television documentary explores the impressive engineering solutions behind Paris's underground networks and railway infrastructure.\nThese historical works represent fundamental milestones in urban sanitation and mass transit for major metropolises.\nThe overview reveals how technical concepts developed in the past remain vital for the logistics and sustainability of the French capital.","link":"https://www.science-et-vie.com/technos-et-futur/gares-et-egouts-parisiens-decouvrez-les-secrets-de-ces-chefs-doeuvre-dingenierie-ce-dimanche-sur-science-vie-tv-255030.html","categoria":"ENGINEERING","lang":"en"},{"fonte":"La Tribune","pais":"France","titulo":"Shanghai Ranking: Paris-Saclay Remains Top French University, with Harvard in the Lead","resumo":"Paris-Saclay University has reaffirmed its prominent position in the prestigious Shanghai Ranking, consolidating itself as France's top teaching and research institution.\nThe international evaluation takes into account rigorous criteria such as the volume of scientific publications and academic awards won by its researchers.\nThe result highlights France's central role in European scientific production, while Harvard University maintains its global lead.","link":"https://www.latribune.fr/article/economie/56677503386495/classement-de-shanghai-paris-saclay-reste-la-premiere-universite-francaise-harvard-toujours-en-tete","categoria":"SCIENCE","lang":"en"},{"fonte":"Science et vie","pais":"France","titulo":"Fleeing an Antarctic Storm, Scientists Discover an Uncharted Island","resumo":"A team of researchers on an expedition across the frozen continent discovered a new, unknown island while seeking shelter from a severe polar storm.\nThe unprecedented landmass emerged as a direct consequence of the accelerated retreat of glaciers in the region over recent years.\nThe unexpected discovery provides valuable data for studies on climate change and for updating Antarctica's geographic charts.","link":"https://www.science-et-vie.com/nature-et-environnement/ils-fuyaient-une-tempete-en-antarctique-des-scientifiques-decouvrent-une-ile-qui-napparait-sur-aucune-carte-235083.html","categoria":"SCIENCE","lang":"en"},{"fonte":"newsandstar.co.uk","pais":"England","titulo":"Ecordea: Cumbria's 'Batman' Pioneers Ecological Survey Technology","resumo":"The Ecordea initiative is revolutionizing ecological monitoring by utilizing advanced technologies to map and protect bat populations in the Cumbria region.\nThe project combines modern sensors and data analysis to optimize environmental research without causing negative impacts on local habitats.\nThis innovation promises to transform biodiversity conservation practices, serving as a model for future wildlife studies.","link":"https://www.newsandstar.co.uk/news/26462713.cumbria-batman-pioneering-bat-survey-technology/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Yahoo","pais":"England","titulo":"NTU Ditches AI Detectors, Says Technology Is Unreliable for Proving Plagiarism","resumo":"Nottingham Trent University has decided to discontinue the use of artificial intelligence detection tools on student assignments.\nThe institution pointed out that current software presents a high error rate and lacks sufficient precision to prove academic fraud.\nThe decision intensifies the debate over the technical and ethical limitations of using AI systems in educational assessment.","link":"https://malaysia.news.yahoo.com/ntu-ditch-ai-detectors-says-031351007.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Estadão","pais":"England","titulo":"The Economist: How Much Would You Pay for a Smarter Baby?","resumo":"A special report covers the advances and complex ethical dilemmas surrounding genetic selection and reproductive engineering to optimize human intelligence.\nThe possibility of choosing cognitive traits in embryos raises discussions about modern eugenics, social inequality, and the limits of biotechnology.\nThe advancement of these techniques pressures global regulatory bodies to define clear guidelines for the reproductive health sector.","link":"https://www.estadao.com.br/economia/the-economist-quanto-voce-pagaria-por-um-bebe-mais-inteligente/","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"El Periódico","pais":"Spain","titulo":"More Than the US and China: The European Union Has a Lot to Say in the Battle for Quantum Computing Dominance","resumo":"The European Union is strengthening its investments and initiatives in the quantum computing sector to guarantee technological sovereignty. The dispute over the global quantum ecosystem is not limited solely to the giants the United States and China. The European continent seeks to consolidate advanced infrastructures and innovation ecosystems capable of leading the next digital revolution.","link":"https://www.elperiodico.com/es/tecnologia/20260816/estados-unidos-china-batallan-dominio-computacion-cuantica-ordenadores-investigacion-tecnologia-europa-mapa-mundo-132764455","categoria":"QUANTUM COMPUTING","lang":"en"},{"fonte":"GranadaDigital","pais":"Spain","titulo":"Science as a Tool to Protect Granada from Earthquakes","resumo":"Researchers and scientists are applying advanced technologies and geological studies to prevent and minimize the impacts of seismic tremors in the Granada region. The initiative aims to map geological faults and improve early warning systems for the local population. With the integration of scientific data and resilient infrastructure, the city aims to become a benchmark in safety and disaster preparedness.","link":"https://www.granadadigital.es/ciencia-proteger-granada-terremotos/","categoria":"SCIENCE","lang":"en"},{"fonte":"heraldo.es","pais":"Spain","titulo":"Aragonese Company Libelium Modernizes Video Monitoring Cameras in Catalonia to Better Manage Traffic","resumo":"Technology company Libelium has implemented smart solutions to upgrade the road monitoring camera infrastructure in Catalonia. The modernization allows for the precise collection of real-time data on vehicle flow and urban mobility patterns. The technology supports decision-making in traffic management, promoting more efficient and connected cities.","link":"https://www.heraldo.es/noticias/economia/2026/08/16/aragonesa-libelium-moderniza-camaras-videovigilancia-cataluna-para-gestionar-mejor-trafico-2044654.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"LNE","pais":"Spain","titulo":"Science in a Tweet: Towards Sustainable Cement","resumo":"New scientific research is driving the development of ecological alternatives for cement production, one of the materials with the highest carbon footprint on the planet. Innovations focus on reducing greenhouse gas emissions during the manufacturing process without compromising strength and durability. This transition is fundamental to promoting green construction and meeting global sustainability goals.","link":"https://www.lne.es/opinion/2026/08/16/ciencia-tuit-cemento-sostenible-133394840.html","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"LNE","pais":"Spain","titulo":"Qubits and Hoe: When Technology Became a Neighbor of the Village of Peón (Villaviciosa)","resumo":"The small rural village of Peón, in Villaviciosa, has become the setting for an unprecedented integration between cutting-edge technological innovation and agricultural tradition. The arrival of projects focused on emerging technologies and quantum computing is revitalizing the local economy and promoting digital inclusion. The project demonstrates how scientific advancement can coexist with and boost rural regions historically distant from major innovation centers.","link":"https://www.lne.es/villaviciosa/2026/08/16/qubits-azada-tecnologia-hizo-vecina-133393189.amp.html","categoria":"INNOVATION","lang":"en"},{"fonte":"Faro de Vigo","pais":"Spain","titulo":"Vigo-engineered technology accurately determines shoe size in seconds with a single photo","resumo":"Developers in the city of Vigo have created an innovative technological solution that accurately calculates the ideal shoe size using only an image of the foot. Leveraging artificial intelligence and computer vision, the tool solves one of the biggest pain points in online footwear shopping. The new development enhances the consumer experience and significantly reduces e-commerce return costs.","link":"https://www.farodevigo.es/economia/2026/08/15/tecnologia-sello-vigues-acertar-talla-zapatos-sizit-ai-133387239.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Perspective Daily","pais":"Germany","titulo":"AI demands power, water, and space—and German politics decides to react","resumo":"The rapid advancement of artificial intelligence is demanding growing volumes of electrical power, water, and physical space for data center infrastructure. Faced with this heavy environmental and infrastructural impact, German political leaders have begun drafting specific measures and regulations. The goal is to enable technological expansion without compromising the country's natural resources and sustainability targets.","link":"https://perspective-daily.de/article/5113-ki-braucht-strom-wasser-und-platz-jetzt-reagiert-die-politik/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"El Economista","pais":"Germany","titulo":"Germany repeals 1919 law in an effort to stimulate the economy","resumo":"The German government has decided to scrap a century-old piece of legislation dating back to 1919 aimed at cutting red tape and unlocking national economic growth. The measure seeks to streamline obsolete regulatory standards that hindered new investments and business agility. This modernization is expected to foster a more dynamic and competitive business environment in the European market.","link":"https://www.eleconomista.es/economia/noticias/14007995/08/26/alemania-dice-adios-a-una-ley-de-1919-para-intentar-estimular-su-economia.html","categoria":"ECONOMY","lang":"en"},{"fonte":"ARN News Centre","pais":"Germany","titulo":"Germany's Liebmann smashes 1500m world record","resumo":"The German athlete achieved a historic milestone by breaking the world record in the 1500-meter event, standing out among the elite of international sports. This impressive feat is the result of intense preparation and consolidates Germany's prominent position in the discipline. The achievement generated widespread acclaim in the sports arena and promises to drive the development of new talent across the country.","link":"https://www.arnnewscentre.ae/en/news/sports/germanys-liebmann-smashes-1500m-world-record/","categoria":"SPORTS","lang":"en"},{"fonte":"NHKニュース","pais":"Japan","titulo":"Japan's Ministry of Education to subsidize universities up to 50 million yen annually to support female researchers","resumo":"Japan's Ministry of Education, Culture, Sports, Science and Technology has announced a subsidy program of up to 50 million yen per year for universities that support women scientists. The initiative aims to tackle the gender gap in STEM fields and retain female talent in academia. The investment will promote structural reforms and maternity support, strengthening the country's scientific competitiveness.","link":"https://news.web.nhk/newsweb/na/nd-20260816de44362","categoria":"SCIENCE","lang":"en"},{"fonte":"モーターファン","pais":"Japan","titulo":"Air-cooled Porsche turns modern sports car: The impact of the digitized Porsche 930 Turbo","resumo":"A new technological modification has transformed the classic air-cooled Porsche 930 Turbo into a fully digitized modern vehicle. The project integrates advanced electronics and computerized control systems without losing the model's classic essence. This fusion of vintage engineering and cutting-edge technology represents a growing trend in the automotive sector for revitalizing legendary sports cars.","link":"https://motor-fan.jp/article/1595338/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Gizmodo","pais":"Japan","titulo":"Review: Skullcandy Crusher 1080 ANC packed with Bose technology","resumo":"The new Skullcandy Crusher 1080 ANC headphones combine the brand's signature powerful bass with acclaimed active noise-canceling technology developed by Bose. The review highlights the surprising balance between premium acoustic isolation and low-frequency tactile immersion. The product emerges as a highly competitive option for audio enthusiasts seeking high performance and comfort.","link":"https://www.gizmodo.jp/article/skullcandy-crusher-1080-anc-review-a-huge-boost-from-bose/","categoria":"HARDWARE","lang":"en"},{"fonte":"大学ジャーナルオンライン","pais":"Japan","titulo":"Keio University, Tokyo University of Science, and RIKEN launch Health Commons Consortium","resumo":"Keio University, the Tokyo University of Science, and the RIKEN institute have joined forces to establish the Health Commons Consortium. The alliance aims to integrate health databases, artificial intelligence, and advanced medical research to promote preventive and personalized medicine. The project seeks to create a sustainable ecosystem focused on the longevity and well-being of the Japanese population.","link":"https://univ-journal.jp/1000233/","categoria":"SCIENCE","lang":"en"},{"fonte":"朝日新聞","pais":"Japan","titulo":"Insurers accelerate earthquake insurance payouts using digital technology to support reconstruction","resumo":"Property and casualty insurance companies in Japan are adopting artificial intelligence and satellite image analysis to expedite the disbursement of earthquake claims. The digitalization of the process drastically reduces on-site inspection time and helps disaster victims begin rebuilding more quickly. The measure represents a crucial step forward in crisis management and community disaster resilience.","link":"https://www.asahi.com/articles/ASV8G2JJ0V8GULFA01XM.html","categoria":"INNOVATION","lang":"en"},{"fonte":"Xataka","pais":"China","titulo":"Maglev train in China hits 500 mph, setting a new record","resumo":"China has registered a historic milestone in the transportation sector by testing a magnetic levitation (maglev) train that reached a speed of 500 mph (800 km/h). The breakthrough highlights the country's pioneering role in ultra-high-speed transportation systems based on superconductivity and partial vacuum tubes. The new technology promises to revolutionize overland mobility between major metropolises in the coming decades, drastically reducing travel times.","link":"https://www.xataka.com/movilidad/tren-china-ha-alcanzado-800-km-h-nuevo-record-para-tecnologia-levitacion-magnetica","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Pplware","pais":"China","titulo":"Volkswagen adopts 'Made in China' tech in strategic partnership with XPENG","resumo":"German automaker Volkswagen is integrating vehicle architectures and electronic systems developed by Chinese electric vehicle manufacturer XPENG into its new models. This historic reversal highlights China's technological leadership in the electric mobility and vehicular software market. The collaboration reinforces the competitiveness of Chinese companies as suppliers of advanced solutions to global giants.","link":"https://pplware.sapo.pt/motores/volkswagen-esta-a-copiar-tecnologia-made-in-china-e-e-a-xpeng-quem-manda/","categoria":"AUTOMOTIVE INNOVATION","lang":"en"},{"fonte":"Sohu","pais":"China","titulo":"Chinese Space Station advances with multiple scientific experiments in Earth orbit","resumo":"The crew aboard the Tiangong space station continues to make progress on various microgravity experiments in biology, fluid physics, and space medicine. Weekly activities include the maintenance of cutting-edge equipment and the collection of crucial data for long-duration missions. The results obtained aim to consolidate China's space program and support future lunar and interplanetary missions.","link":"https://m.sohu.com/a/1063499565_121620820?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334","categoria":"SPACE EXPLORATION","lang":"en"},{"fonte":"Sohu","pais":"China","titulo":"Former Alibaba AI lead launches startup as Cambricon warns of chip inventories","resumo":"Lin Junyang, former technical lead for the development of Alibaba's Qwen language model, has announced the launch of his new artificial intelligence startup. At the same time, Chinese AI chipmaker Cambricon issued a market warning regarding a significant buildup in its inventories. These moves underscore the intense competitive dynamics and strategic shifts within the country's semiconductor and AI sectors.","link":"https://m.sohu.com/a/1063548282_114986?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"新浪财经","pais":"China","titulo":"Three scientists win 2026 Future Science Prize for breakthroughs in materials and biology","resumo":"The prestigious 2026 Future Science Prize has honored three researchers for their contributions to cellular cleanup mechanisms and porous materials engineering. Each prize, valued at approximately $1 million, recognized research with a high global impact on medicine and industry. The announcement reinforces China's ongoing investments to drive cutting-edge scientific research and disruptive innovation.","link":"https://finance.sina.cn/stock/jdts/2026-08-16/detail-ininmpac1955037.d.html?vt=4\u0026cid=76993\u0026node_id=76993","categoria":"SCIENCE","lang":"en"},{"fonte":"新浪财经","pais":"China","titulo":"PS5 Pro PSSR technology revealed: AI enhances graphics by optimizing processing","resumo":"Technical details reveal how AI-powered PSSR upscaling technology improves image quality in games without overloading the hardware. By optimizing temporal processing and reducing redundant tasks on the neural unit, the system delivers higher frame rates and greater visual fidelity. The innovation represents a major step forward in the practical use of machine learning models in the video game industry.","link":"https://finance.sina.cn/tech/2026-08-15/detail-ininmank1736584.d.html?oid=WA%200821%207001%200763%20(FORTRESS)%20Kusen%20Pintu%20Baja%20Fortress%20Pilangkenceng%20Madiun\u0026vt=4","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Sohu","pais":"China","titulo":"Nanjing University Research Addresses Drone Computing and Low-Altitude Economy","resumo":"The team led by Professor Huang Haiping presented new research focused on embedded computing architectures for unmanned aerial vehicles.\nThe work aims to optimize real-time data processing to support the growing demand of China's low-altitude economy.\nThe technology promises to improve autonomous flight safety, urban air traffic management, and automated deliveries.","link":"https://m.sohu.com/a/1063533664_121119270?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334","categoria":"ROBOTICS","lang":"en"},{"fonte":"东方财富","pais":"China","titulo":"CGN Medical and West China Hospital Sign Agreement for Proton Therapy Innovation","resumo":"CGN Medical Services has entered into a technological cooperation partnership with the prestigious West China Hospital to develop advanced solutions in proton therapy.\nThe partnership seeks to accelerate innovation in high-precision medical equipment aimed at tumor treatment and advanced oncology.\nThe project strengthens the self-sufficiency of Chinese medical technology in the next-generation radiation therapy sector.","link":"https://wap.eastmoney.com/a/202608153842404646.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"NDTV","pais":"India","titulo":"Researchers in Switzerland Develop Mini-Drones Powered by Sound Waves","resumo":"Swiss researchers have achieved a robotics breakthrough by developing mini-drones powered by sound waves.\nThe technology utilizes acoustic principles for propulsion and flight control without the need for traditional moving parts.\nThis innovation paves the way for promising applications in internal medical examinations and confined environment inspections.","link":"https://www.ndtv.com/science/swiss-researchers-develop-tiny-drones-that-run-on-sound-waves-11916277","categoria":"SCIENCE","lang":"en"},{"fonte":"The News Mill","pais":"India","titulo":"Modi Announces AI Skilling, Sports Talent Hunt, and Nuclear Power Targets on Independence Day","resumo":"During his Independence Day address, Prime Minister Narendra Modi outlined strategic targets for India's future.\nThe announcements highlight a broad national artificial intelligence training program aimed at the youth.\nAdditionally, the plan includes a search for sports talent and ambitious targets for the expansion of the nuclear power grid.","link":"https://thenewsmill.com/2026/08/modi-announces-ai-skilling-sports-talent-hunt-and-nuclear-power-targets-on-independence-day/","categoria":"INNOVATION","lang":"en"},{"fonte":"ANI News","pais":"India","titulo":"India Counts Around 440 Space Technology Startups","resumo":"India's aerospace sector is registering significant expansion, reaching the milestone of 440 active startups in the country.\nThis growth drives local solutions in satellite development, launch vehicles, and orbital services.\nThe advancement solidifies India's position as an emerging hub in the international private space economy.","link":"https://www.aninews.in/news/national/general-news/india-has-around-440-space-technology-startups20260816084423","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"telegraphindia.com","pais":"India","titulo":"Karnataka Aims for USD 3 Trillion Economy by 2047 with Plan Focused on Jobs and AI","resumo":"The state of Karnataka has set a goal to achieve a 3 trillion-dollar economy by the year 204
