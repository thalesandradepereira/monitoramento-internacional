"India","titulo":"Samsung CEO States That India Now Develops Global Technology","resumo":"The Samsung CEO emphasized the evolution of India's role in the global tech landscape, shifting from a support hub to a creator of cutting-edge solutions. R\u0026D centers established in the country have been instrumental in developing products and software used worldwide. This recognition highlights India's strategic transition into a pivotal hub for engineering and innovation.","link":"https://www.bisinfotech.com/samsung-at-30-india-has-become-a-global-innovation-hub-for-samsung-says-jb-park/","categoria":"INNOVATION","lang":"en"},{"fonte":"Business Standard","pais":"India","titulo":"Intellect Launches MSOCK Technology at Global FinTech Fest 2026","resumo":"Intellect unveiled its new MSOCK technology during the Global FinTech Fest 2026, focusing on advanced financial infrastructure. The solution was designed to optimize complex banking operations, offering greater resilience and real-time data processing. The launch strengthens India's leadership as a generator of disruptive innovations aimed at the international financial sector.","link":"https://www.business-standard.com/markets/capital-market-news/intellect-launches-msock-technology-at-global-fintech-fest-2026-126090800306_1.html","categoria":"FINTECH","lang":"en"},{"fonte":"ET CIO","pais":"India","titulo":"From Consumer Market to Innovation Leader: How India Shapes the Future of Technology","resumo":"India is consolidating its trajectory of transformation, shifting from merely a consumer market to a powerhouse in technological innovation. With growing investments in deep-tech startups, digital public infrastructure, and new talent, the country is setting new industrial standards. This strategic positioning attracts international investment and reshapes the dynamics of global competitiveness in the tech sector.","link":"https://cio.economictimes.indiatimes.com/news/corporate-news/from-tech-market-to-innovation-leader-how-india-is-shaping-the-future-of-technology-on-a-global-stage/133904093?utm_source=portal_category_widget\u0026utm_medium=homepage","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Swarajya","pais":"India","titulo":"India May Seek Eased Chinese Technology Restrictions at BRICS Summit","resumo":"The Indian government is reviewing trade and regulatory barriers with China to facilitate access to essential technologies during the upcoming BRICS summit. The measure aims to ease bottlenecks in the supply chain for electronic components and semiconductors crucial to local industry. The move reflects a pragmatic diplomacy focused on balancing national security with the competitiveness of the country's tech ecosystem.","link":"https://swarajyamag.com/news-brief/india-may-seek-eased-chinese-technology-curbs-at-brics-summit-as-new-delhi-reviews-trade-barriers","categoria":"TECH POLICY","lang":"en"},{"fonte":"Diário de Notícias","pais":"Portugal","titulo":"The Cycles of Science: Prions Are Back","resumo":"Recent studies are bringing prions back to the center of global scientific and medical discussions. These misfolded proteins are known to cause severe and fatal neurodegenerative diseases. Research seeks to understand how new transmission mechanisms could impact public health. Progress in mapping these structures promises to open doors for early diagnoses and effective treatments.","link":"https://www.dn.pt/opiniao-dn/os-ciclos-da-cincia-pries-esto-de-volta","categoria":"SCIENCE","lang":"en"},{"fonte":"turbo.pt","pais":"Portugal","titulo":"BMW Files Suspension Patent to Control Skids","resumo":"BMW has taken an important step in vehicle safety by registering a new suspension system patent. The technology aims to mitigate the risk of skidding by dynamically adjusting wheel response on slippery surfaces. Integrated sensors monitor grip in real-time to react instantly to trajectory variations. This innovation could redefine stability and handling standards for future electric and combustion models.","link":"https://www.turbo.pt/bmw-submete-patente-de-suspensao-para-controlar-derrapagens/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"RTP","pais":"Portugal","titulo":"Fuel Prices Return to Historic Highs in Portugal","resumo":"Gasoline and diesel prices have once again reached record levels at gas stations in Portugal. The increase reflects high international oil prices combined with logistical costs and tax pressures in Europe. Consumers and transportation sectors are demanding measures to contain the impact of inflation on budgets. The situation intensifies the debate over the energy transition and the cost of living in the country.","link":"https://www.rtp.pt/noticias/economia/precos-dos-combustiveis-regressam-a-maximos-historicos-em-portugal_v1763924","categoria":"TRENDS","lang":"en"},{"fonte":"Visão","pais":"Portugal","titulo":"The Body That Science Forgot","resumo":"A new scientific approach highlights historical gaps in the understanding of certain human body structures. Researchers point out that omissions in traditional anatomical studies have hindered specific diagnoses. The review of these physiological concepts promises to improve personalized medical treatments in the future. The movement reinforces the need to update medical literature using modern scanning technologies.","link":"https://visao.pt/opiniao/ponto-de-vista/2026-09-07-endometriose-o-corpo-que-a-ciencia-esqueceu/","categoria":"SCIENCE","lang":"en"},{"fonte":"XXV Governo Constitucional","pais":"Portugal","titulo":"Startup Acceleration Program Launches with 31 Scientific and Technological Projects","resumo":"A new acceleration program has kicked off its activities by selecting 31 promising initiatives within the innovation ecosystem. The projects cover strategic areas of science and technology, aiming to transform research into commercial solutions. Selected startups will receive specialized mentorship, investment, and access to a broad partner network. The initiative strengthens knowledge transfer from universities to the real economy.","link":"https://portugal.gov.pt/pt/gc25/comunicacao/comunicados/programa-de-aceleracao-que-apoia-startups-a-entrar-no-mercado-arranca-com-31-projetos-cientificos-e-tecnologicos","categoria":"INNOVATION","lang":"en"},{"fonte":"welectric.pt","pais":"Portugal","titulo":"Toyota and Scania test hydrogen fuel cell technology in heavy-duty transport","resumo":"Toyota and Scania have joined forces to evaluate the efficiency of hydrogen fuel cell-powered trucks.\nReal-world testing aims to prove the viability of hydrogen as a sustainable alternative to diesel.\nThe technology offers high driving range and rapid refueling without emitting pollutants into the atmosphere.\nThe partnership signals a decisive step forward for the decarbonization of the heavy logistics sector.","link":"https://welectric.pt/2026/09/07/toyota-e-scania-testam-tecnologia-de-celulas-de-combustivel-a-hidrogenio-no-transporte-pesado/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Eurogamer.pt","pais":"Portugal","titulo":"Nvidia DLSS 5 thoroughly tested: technology cuts frame rates by up to 60%","resumo":"In-depth analyses of the new Nvidia DLSS have revealed controversial results regarding performance in demanding games.\nDespite promising visual improvements via artificial intelligence, the feature caused a significant drop in frame rates.\nExperts are investigating whether the performance loss stems from inadequate pre-optimization or hardware constraints.\nThe tests have sparked intense debate within the community regarding the balance between graphical fidelity and fluidity.","link":"https://www.eurogamer.pt/nvidia-dlss-5-testado-a-fundo-tecnologia-corta-ate-60-da-taxa-de-fotogramas","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"CNN Portugal","pais":"Portugal","titulo":"Belgium detains espionage suspect over military chip technology transfer","resumo":"Belgian authorities have arrested an individual accused of industrial espionage involving advanced semiconductors.\nThe investigation points to an attempt to leak strategic chip technologies with potential military applications.\nThe case highlights escalating geopolitical tensions surrounding the global technological supply chain.\nEuropean countries have stepped up oversight to protect their critical infrastructure and digital sovereignty.","link":"https://cnnportugal.iol.pt/espionagem/tecnologia-militar/belgica-detem-suspeito-de-espionagem-por-possivel-transferencia-de-tecnologia-de-chips-com-aplicacoes-militares/20260907/6a9e8752d34e511da0b373e4","categoria":"GEOPOLITICS","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
</body>
