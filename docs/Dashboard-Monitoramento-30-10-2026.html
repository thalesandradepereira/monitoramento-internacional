e-a-ete-un-lanceur-cette-technologie-anti-collision-est-developpee-dans-le-finistere-354369ba-d383-11f1-af78-2d36ec019942","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Retail Technology Innovation Hub","pais":"Inglaterra","titulo":"B\u0026Q traz a mais recente tecnologia de IA do Google para a busca em seu site","resumo":"A rede de varejo B\u0026Q integrou a tecnologia de inteligência artificial do Google para aprimorar o sistema de busca interna em seu e-commerce. A iniciativa visa oferecer resultados mais precisos e personalizados para os consumidores que pesquisam produtos de reforma e casa. Espera-se que a melhoria aumente significativamente as taxas de conversão e melhore a experiência digital do cliente no Reino Unido.","link":"https://retailtechinnovationhub.com/home/2026/10/30/bq-brings-googles-latest-ai-powered-technology-to-onsite-search-experience","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Diari ARA","pais":"Espanha","titulo":"Tinta com microchips: o novo pesadelo dos falsificadores","resumo":"A inovação combina formulações químicas avançadas com microdispositivos eletrônicos em escala microscópica integrados diretamente à tinta. Essa tecnologia inovadora promete revolucionar a autenticação de documentos e produtos valiosos no mercado global. O impacto direto inclui maior segurança na verificação de autenticidade e combate eficaz ao mercado ilegal.","link":"https://es.ara.cat/ciencia-tecnologia/tinta-microchips-nueva-pesadilla-falsificadores_1_5894689.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Science et vie","pais":"Alemanha","titulo":"Pesquisadores alemães descobrem ilha não mapeada ao fugir de tempestade na Antártida","resumo":"Durante uma expedição científica na Antártida, pesquisadores alemães foram forçados a alterar sua rota devido a uma forte tempestade e acabaram descobrindo uma ilha completamente desconhecida. A massa de terra não constava em nenhum mapa ou registro cartográfico existente até o momento. Essa descoberta inédita abre novas oportunidades para estudos geográficos e ambientais sobre o impacto das mudanças climáticas no derretimento de gelo na região.","link":"https://www.science-et-vie.com/nature-et-environnement/en-fuyant-une-tempete-en-antarctique-des-chercheurs-allemands-decouvrent-une-ile-qui-napparait-sur-aucune-carte-au-monde-235083.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"レスポンス（Response.jp）","pais":"Japão","titulo":"O que é 'E2E AI'? A tecnologia que impulsiona a direção autônoma","resumo":"A tecnologia de inteligência artificial ponta a ponta, conhecida como E2E AI, está revolucionando o desenvolvimento de veículos autônomos ao processar dados de sensores diretamente em comandos de controle. Essa abordagem simplifica a arquitetura tradicional de software, reduz a latência e melhora a tomada de decisões em tempo real. O avanço representa um marco crucial para a segurança e eficiência do transporte do futuro.","link":"https://s.response.jp/article/2026/10/30/418429.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"东方财富","pais":"China","titulo":"Escala de energia nuclear da China lidera o mundo enquanto surgem desafios no sistema de controle","resumo":"A China alcançou a primeira posição mundial em capacidade e escala de energia nuclear em construção. No entanto, o setor enfrenta desafios críticos de inovação tecnológica no sistema de controle central das usinas, considerado o cérebro das operações. Especialistas apontam para a necessidade urgente de autossuficiência e aprimoramento na segurança desses componentes vitais.","link":"https://finance.eastmoney.com/a/202610303916223632.html","categoria":"ENERGIA","lang":"pt"},{"fonte":"India Today","pais":"Índia","titulo":"Reprovado em Matemática, Ciências ou Ciências Sociais: novas regras do CBSE trazem alívio para estudantes","resumo":"As novas diretrizes do Conselho Central de Educação Secundária da Índia prometem aliviar a pressão acadêmica sobre os estudantes. A mudança permite maior flexibilidade e oportunidades de substituição de disciplinas em caso de reprovação em matérias chave. Esta iniciativa busca reduzir o estresse dos alunos e diminuir as taxas de evasão escolar no país.","link":"https://www.indiatoday.in/amp/education-today/news/story/cbse-class-10-board-exams-2028-skill-subject-replace-failed-core-paper-math-social-science-3028287-2026-10-30","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"Expresso","pais":"Portugal","titulo":"IA elimina 200 empregos na Critical Software: CEO cita 'transformação mais profunda' da empresa","resumo":"A automação e a inteligência artificial provocaram o corte de 200 postos de trabalho na empresa de tecnologia portuguesa Critical Software. O presidente executivo classificou esta mudança como a reestruturação mais profunda vivida pela organização desde a sua fundação. O movimento reflete o impacto direto e imediato da IA generativa no setor de desenvolvimento de software em Portugal.","link":"https://expresso.pt/ia-inteligencia-artificial/2026-10-29-ia-faz-desaparecer-200-empregos-na-critical-software-ceo-fala-na-transformacao-mais-profunda-desde-a-fundacao-da-empresa-016b8618","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Ataque hacker faz plataforma de criptomoedas congelar mais de US$ 2,5 bilhões","resumo":"Uma vulnerabilidade crítica de segurança resultou em um grande ataque cibernético contra uma renomada plataforma de criptoativos. Como medida emergencial para conter as perdas, mais de US$ 2,5 bilhões em ativos foram temporariamente congelados. O incidente acende o alerta global sobre a necessidade de protocolos mais rígidos no setor de finanças digitais.","link":"https://oglobo.globo.com/economia/noticia/2026/10/30/ataque-hacker-faz-plataforma-de-criptomoedas-congelar-mais-de-us-25-bilhoes.ghtml","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"NASA Science (.gov)","pais":"Estados Unidos","titulo":"Voyager 1 da NASA economiza energia e resolve breve pausa nas comunicações","resumo":"A icônica sonda espacial Voyager 1 da NASA superou um desafio técnico crítico após pausar temporariamente suas comunicações com a Terra. Para preservar a energia residual do veículo espacial mais distante da humanidade, os engenheiros implementaram novas estratégias de gerenciamento térmico e energético. Essa conquista demonstra a resiliência contínua da missão e permite a coleta prolongada de dados inéditos sobre o espaço interestelar.","link":"https://science.nasa.gov/blogs/voyager/2026/10/29/nasas-voyager-1-conserves-power-resolves-brief-communications-pause/","categoria":"CIÊNCIA ESPACIAL","lang":"pt"},{"fonte":"L'Équipe","pais":"França","titulo":"\"Melhoramos em todos os setores do jogo\": tecnologia e maior confiabilidade impulsionam gigantes da classe Ultim","resumo":"As embarcações da classe Ultim alcançaram um novo patamar de confiabilidade e desempenho graças a recentes inovações tecnológicas. Após enfrentarem períodos desafiadores, os velejadores destacam melhorias integrais em todos os aspectos operacionais dos barcos. O progresso consolida a tecnologia como fator decisivo para a evolução do esporte de alta competição.","link":"https://www.lequipe.fr/Voile/Article/-on-s-est-ameliores-dans-tous-les-compartiments-du-jeu-technologie-et-meilleure-fiabilite-les-geants-de-la-classe-ultim-qui-s-elanceront-dimanche-sont-sortis-des-temps-difficiles/1739564","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The Northern Echo","pais":"Inglaterra","titulo":"Planos são revelados para um enorme novo campus de data center em County Durham","resumo":"Novos planos foram revelados para a construção de um grande campus de data center na região de County Durham, na Inglaterra. O projeto representa um investimento massivo em infraestrutura digital para atender à crescente demanda por processamento de dados e inteligência artificial. A instalação deve impulsionar fortemente a economia local e criar centenas de empregos qualificados ao longo dos próximos anos.","link":"https://www.thenorthernecho.co.uk/news/26682440.plans-unveiled-durham-technology-park-data-centre-near-murton/","categoria":"INFRAESTRUTURA","lang":"pt"},{"fonte":"ConSalud","pais":"Espanha","titulo":"Da perda à regeneração: a ciência revela a chave para desacelerar o envelhecimento do colágeno","resumo":"Pesquisadores identificaram mecanismos moleculares cruciais envolvidos na degradação do colágeno ao longo dos anos. A descoberta possibilita o desenvolvimento de novas terapias voltadas para a regeneração tecidual e tratamentos antienvelhecimento mais eficientes. Essa inovação científica pode transformar a medicina estética e o tratamento de doenças degenerativas articulares.","link":"https://www.consalud.es/estetic/cosmetica/de-la-perdida-a-la-regeneracion-la-ciencia-desvela-la-clave-para-frenar-el-envejecimiento-del-colageno.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Ataque hacker bilionário atinge a corretora de criptomoedas Binance","resumo":"A gigante das criptomoedas Binance foi vítima de um ataque cibernético de grandes proporções, resultando no desvio de fundos bilionários da plataforma. O incidente gerou forte impacto no mercado financeiro global e acendeu alertas sobre a vulnerabilidade das redes descentralizadas. Especialistas e autoridades já investigam a origem do ataque para tentar recuperar os ativos e reforçar a segurança digital das operações.","link":"https://www.sueddeutsche.de/wirtschaft/digitalwaehrungen-milliardenschwerer-hackerangriff-auf-kryptoboerse-binance-dpa.urn-newsml-dpa-com-20090101-261030-930-915979","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"Science Tokyo","pais":"Japão","titulo":"Pyr-PICsomes: novas nanovesículas programáveis para detecção de pressão hidrostática","resumo":"Pesquisadores desenvolveram nanovesículas inovadoras chamadas Pyr-PICsomes, capazes de responder com precisão a variações de pressão hidrostática. Essa nova classe de nanomateriais abre precedentes importantes para o monitoramento biomédico não invasivo e diagnósticos celulares avançados. O impacto potencial inclui o aperfeiçoamento de terapias direcionadas e sensores biológicos altamente sensíveis.","link":"https://www.isct.ac.jp/en/news/wt1hck9ojkr8","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"新浪财经","pais":"China","titulo":"Como um novo transformador pode otimizar o consumo dos centros de dados de IA","resumo":"A expansão acelerada da inteligência artificial exige infraestruturas elétricas cada vez mais eficientes e compactas para os centros de dados. A adoção de novas tecnologias de transformadores promete reduzir significativamente o espaço físico necessário e o desperdício de energia. Essa inovação surge como uma solução essencial para sustentar a crescente demanda computacional de modelos avançados.","link":"https://finance.sina.com.cn/roll/2026-10-30/doc-iniwysmu5529107.shtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Bloomberg.com","pais":"Índia","titulo":"Como a Jio transformou a economia de internet móvel da Índia, um byte barato por vez","resumo":"A entrada da Jio no mercado de telecomunicações revolucionou a inclusão digital na Índia ao oferecer dados móveis a preços extremamente baixos. Essa democratização do acesso impulsionou a economia digital, a criação de startups e a digitalização de serviços essenciais. A estratégia alterou drasticamente o consumo de conteúdo e conectou centenas de milhões de cidadãos.","link":"https://www.bloomberg.com/news/features/2026-10-30/how-jio-transformed-india-s-mobile-internet-economy-one-cheap-byte-at-a-time","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Pplware","pais":"Portugal","titulo":"Tecnologia portuguesa identifica bactérias resistentes a antibióticos em 45 minutos","resumo":"Uma inovadora tecnologia desenvolvida em Portugal é capaz de detectar bactérias resistentes a antibióticos em apenas 45 minutos. O avanço científico promete revolucionar os diagnósticos clínicos e acelerar o tratamento correto de infecções graves. A solução reduz significativamente o tempo de espera tradicional dos exames laboratoriais, salvando vidas.","link":"https://pplware.sapo.pt/ciencia/tecnologia-portuguesa-identifica-bacterias-resistentes-a-antibioticos-em-45-minutos/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"NeoFeed","pais":"Brasil","titulo":"Nem petróleo, nem juros: por que a inteligência artificial virou o verdadeiro motor da economia global","resumo":"A inteligência artificial assumiu o papel central na transformação dos mercados financeiros e na produtividade das grandes empresas globais. Analistas apontam que a inovação tecnológica agora supera fatores tradicionais de impacto macroeconômico em escala mundial. O movimento impulsiona novos investimentos massivos e altera permanentemente a dinâmica do trabalho.","link":"https://neofeed.com.br/economia/nem-petroleo-nem-juros-por-que-a-inteligencia-artificial-virou-o-verdadeiro-motor-da-economia-global/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"The Dispatch","pais":"Estados Unidos","titulo":"‘Essa Porcaria de Data Center’: Terra e tecnologia entram em conflito no Kentucky","resumo":"A expansão acelerada de infraestruturas tecnológicas no estado do Kentucky provocou forte resistência da comunidade local contra a instalação de data centers. Moradores e agricultores argumentam que o uso massivo de terras, água e energia ameaça o meio ambiente e o estilo de vida rural. O conflito reflete o crescente dilema entre as demandas da economia digital e a sustentabilidade regional.","link":"https://thedispatch.com/article/data-center-kentucky-land-environment/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"LCP-Assemblée nationale","pais":"França","titulo":"Ciência e saúde: deputado Yannick Neuder apresenta projeto para combater o \"conspiracionismo\" e punir a \"desinformação\"","resumo":"O deputado francês Yannick Neuder apresentou um projeto de lei visando combater teorias da conspiração e sancionar a disseminação de desinformação. A proposta foca em proteger a credibilidade das pesquisas em ciência e saúde pública perante a população. O texto busca criar mecanismos jurídicos rigorosos para conter narrativas enganosas que colocam a sociedade em risco.","link":"https://lcp.fr/actualites/science-et-sante-le-depute-yannick-neuder-a-depose-un-texte-pour-lutter-contre-le?amp","categoria":"CIÊNCIA E SAÚDE","lang":"pt"},{"fonte":"The Argus","pais":"Inglaterra","titulo":"Serviço de ambulância testa nova tecnologia de vídeo para ajudar a salvar pacientes com parada cardíaca","resumo":"Um serviço de emergência médica no Reino Unido está testando uma tecnologia inovadora de vídeo para auxiliar no atendimento de paradas cardíacas. O sistema permite que os operadores visualizem a cena em tempo real e orientem testemunhas antes da chegada dos socorristas. A expectativa dos especialistas é elevar as taxas de sobrevivência por meio de intervenções cardíacas mais ágeis e precisas.","link":"https://www.theargus.co.uk/news/26677888.south-east-coast-ambulance-service-trials-video-technology/","categoria":"SAÚDE","lang":"pt"},{"fonte":"La Voz de Galicia","pais":"Espanha","titulo":"Veraquo: a tecnologia que identifica 'deepfakes' melhor que o olho humano","resumo":"Desenvolvida em Vigo, a ferramenta Veraquo utiliza algoritmos avançados de inteligência artificial para detectar manipulações digitais complexas. A solução superou a capacidade humana na identificação de conteúdos falsificados em vídeos e imagens. O avanço representa um marco fundamental no combate à desinformação e na segurança de mídias digitais.","link":"https://www.lavozdegalicia.es/noticia/reto-digital/tecnologia/2026/10/29/veraquo-tecnologia-nacida-vigo-caza-deepfakes-mejor-ojo-humano/00031793285736227278280.htm","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Bild der Wissenschaft","pais":"Alemanha","titulo":"Corante de milênios de idade torna-se aliado na medicina","resumo":"Cientistas descobriram que um pigmento utilizado há milhares de anos pode desempenhar um papel fundamental no avanço de novos tratamentos médicos. As propriedades químicas do composto milenar demonstraram potencial para auxiliar na aplicação de medicamentos e no diagnóstico de doenças. A descoberta une o conhecimento histórico às tecnologias médicas modernas para criar alternativas terapêuticas inovadoras e eficazes.","link":"https://wissenschaft.de/artikel/jahrtausende-alter-farbstoff-wird-zum-medizinhelfer","categoria":"MEDICINA","lang":"pt"},{"fonte":"量子科学技術研究開発機構（QST）","pais":"Japão","titulo":"Sucesso na visualização da redução da atividade enzimática no fígado com técnica de ressonância magnética hiperpolarizada","resumo":"Cientistas alcançaram a visualização externa da atividade enzimática hepática reduzida em modelos vivos utilizando ressonância magnética hiperpolarizada. A técnica possibilita diagnosticar e monitorar doenças do fígado antes do aparecimento de sintomas graves ou danos irreversíveis ao órgão. Trata-se de um avanço médico marcante com potencial para transformar os exames clínicos e tratamentos precoces.","link":"https://www.qst.go.jp/site/press/20261030.html","categoria":"MEDICINA","lang":"pt"},{"fonte":"搜狐网","pais":"China","titulo":"Tecnologia de condução autônoma ponta a ponta da Horizon ganha prêmio máximo de ciência e tecnologia","resumo":"A empresa Horizon Robotics recebeu o prêmio especial da Sociedade de Engenheiros Automotivos da China por seu sistema de condução autônoma ponta a ponta. A tecnologia integra percepção e tomada de decisão em uma única arquitetura neural otimizada. O avanço consolida a posição de destaque da indústria chinesa no desenvolvimento de veículos inteligentes de próxima geração.","link":"https://m.sohu.com/a/1094869686_100116740?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ET Government","pais":"Índia","titulo":"ETGovernment Vision Conclave 5.0: Uttar Pradesh aposta em IA para impulsionar meta de economia de US$ 1 trilhão","resumo":"O estado de Uttar Pradesh está integrando inteligência artificial em suas políticas públicas e infraestrutura para acelerar o crescimento econômico. Durante o evento Vision Conclave 5.0, governantes destacaram o uso de tecnologia na governança, saúde e agricultura. A iniciativa visa transformar a região em um polo tecnológico e alcançar o marco de uma economia de um trilhão de dólares.","link":"https://government.economictimes.indiatimes.com/news/policy/etgovernment-vision-conclave-5-0-uttar-pradesh-bets-on-ai-to-power-its-1-trillion-economy-ambition/135340131","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"uc.pt","pais":"Portugal","titulo":"GLEX Ignition: Coimbra quer se aproximar da exploração espacial","resumo":"A cidade de Coimbra acolhe o evento GLEX Ignition para debater a inovação, a exploração espacial e o avanço científico internacional. A iniciativa visa posicionar a região como um polo estratégico na indústria aeroespacial e de tecnologia de ponta. O encontro reúne especialistas globais para impulsionar novas parcerias e investimentos científicos.","link":"https://noticias.uc.pt/artigos/glex-ignition/","categoria":"ESPAÇO","lang":"pt"},{"fonte":"www.gov.br","pais":"Brasil","titulo":"MCTI, RNP e INPE lançam painel para monitorar mudanças climáticas no Brasil e na América Latina","resumo":"Instituições de pesquisa brasileiras uniram forças para criar uma plataforma unificada de dados ecológicos e meteorológicos. O novo painel digital permitirá acompanhar em tempo real as transformações climáticas com alta precisão técnica. A iniciativa visa subsidiar políticas públicas eficientes e estratégias de preservação para a América Latina.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/mcti-rnp-e-inpe-lancam-painel-para-monitorar-mudancas-climaticas-no-brasil-e-na-america-latina","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Amazon Web Services (AWS)","pais":"Estados Unidos","titulo":"Experimente o futuro da mídia, entretenimento, esportes e tecnologia publicitária no AWS re:Invent 2026","resumo":"A Amazon Web Services anunciou as principais diretrizes tecnológicas para a conferência AWS re:Invent focadas nas indústrias de entretenimento e publicidade. O evento apresentará novas arquiteturas em nuvem e soluções baseadas em inteligência artificial para otimização de transmissão esportiva e produção de conteúdo. Essas inovações buscam moldar os novos padrões operacionais do setor para os próximos anos.","link":"https://aws.amazon.com/blogs/media/experience-the-future-of-media-and-entertainment-sports-and-advertising-technology-at-aws-reinvent-2026/","categoria":"EVENTO TECNOLÓGICO","lang":"pt"},{"fonte":"France 24","pais":"França","titulo":"COP17: ciência é novamente questionada por vários países, acusam algumas nações","resumo":"Na COP17, representantes de diversas nações acusaram outros países de voltar a colocar em xeque as evidências científicas sobre as mudanças climáticas. O impasse enfraquece a formulação de políticas globais baseadas em dados empíricos e atrasa metas ambientais urgentes. O debate evidencia o desafio contínuo de alinhar decisões políticas ao consenso acadêmico internacional.","link":"https://www.france24.com/fr/info-en-continu/20261029-cop17-la-science-%C3%A0-nouveau-remise-en-cause-par-plusieurs-pays-accusent-certaines-nations","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Sky Sports","pais":"Inglaterra","titulo":"Lewis Hamilton: Piloto da Ferrari diz ser 'construído diferente' e cogita estender carreira na F1 até 2030","resumo":"O piloto Lewis Hamilton declarou possuir um preparo físico e mental diferenciado para continuar competindo no mais alto nível da Fórmula 1. Futuro representante da Ferrari, o britânico não descarta prolongar sua trajetória nas pistas até a década de 2030. Suas afirmações reforçam a determinação em reescrever recordes e desafiar os limites tradicionais de longevidade no esporte a motor.","link":"https://www.skysports.com/f1/news/13605468/lewis-hamilton-ferrari-driver-says-he-is-built-differently-amid-defiance-over-extending-his-f1-career-into-2030s","categoria":"ESPORTES","lang":"pt"},{"fonte":"El Debate","pais":"Espanha","titulo":"OpenAI afirma que sua IA resolveu três grandes enigmas científicos","resumo":"A OpenAI anunciou que seus modelos avançados de inteligência artificial apresentaram soluções válidas para três problemas científicos históricos. Especialistas renomados, incluindo um vencedor do Prêmio Nobel, conduzirão testes rigorosos para validar os resultados obtidos. Se confirmada, a conquista demonstrará o potencial transformador da IA na aceleração de descobertas na ciência.","link":"https://www.eldebate.com/ciencia/20261030/openai-asegura-ia-resolvio-tres-grandes-enigmas-cientificos-nobel-otros-expertos-pondran-prueba_474786.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Bild der Wissenschaft","pais":"Alemanha","titulo":"Floresta Amazônica deixa de ser um sumidouro de carbono","resumo":"Estudos recentes revelam que a Floresta Amazônica perdeu sua capacidade de atuar como um sumidouro eficiente de dióxido de carbono, emitindo mais CO2 do que absorve. O aumento do desmatamento e das queimadas, somado às mudanças climáticas, alterou drasticamente o equilíbrio ecológico da região. Cientistas alertam que este colapso ambiental pode acelerar ainda mais o aquecimento global se medidas urgentes não forem tomadas.","link":"https://wissenschaft.de/artikel/amazonas-regenwald-ist-keine-co2-senke-mehr","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"A liderança da Lasertec continuará? O valor real do semicondutor EUV de próxima geração","resumo":"A Lasertec mantém uma posição de destaque no mercado global de semicondutores graças às suas tecnologias exclusivas de inspeção para litografia EUV. Com a transição para chips de próxima geração, a empresa enfrenta o desafio de sustentar sua alta rentabilidade e inovação contínua. O cenário reforça a importância estratégica do ecossistema japonês de tecnologia no fornecimento global de microchips.","link":"https://news.yahoo.co.jp/articles/359ee228bd18483665927cdf58f005f047c0acd6","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"中国科学院","pais":"China","titulo":"Cientistas descobrem a menor gaiola de água embutida usando a Fonte de Luz Coerente de Dalian","resumo":"Pesquisadores chineses utilizaram a Fonte de Luz Coerente de Dalian para observar e identificar a menor gaiola de água embutida do mundo. A descoberta lança nova luz sobre as interações moleculares em nível atômico e o comportamento da água sob condições extremas. O achado tem implicações profundas para a química supramolecular e o desenvolvimento de novos materiais de ponta.","link":"https://www.cas.cn/cm/202610/t20261030_5123133.shtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Hindu","pais":"Índia","titulo":"Kim Jong-un pede rápida expansão da tecnologia de drones e observa testes de armas na Coreia do Norte","resumo":"O líder norte-coreano Kim Jong-un solicitou a expansão acelerada do desenvolvimento e produção de drones militares no país. A declaração ocorreu durante a observação de testes operacionais de novas armas e tecnologias não-tripuladas. A medida sinaliza um avanço nas estratégias de defesa e vigilância do regime, gerando alertas globais de segurança.","link":"https://www.thehindu.com/news/international/north-koreas-kim-calls-for-rapid-expansion-of-drone-technology-observes-testing-of-weapons/article71643492.ece","categoria":"TECNOLOGIA MILITAR","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Meta lança seus primeiros modelos avançados de IA","resumo":"A Meta apresentou oficialmente os seus primeiros modelos avançados de inteligência artificial voltados para processamento complexo. A novidade busca competir diretamente com as principais soluções do mercado global de tecnologia. O lançamento representa um marco importante na estratégia da empresa para liderar o desenvolvimento de ecossistemas abertos de IA.","link":"https://sapo.pt/artigo/meta-lanca-os-seus-primeiros-modelos-avancados-de-ai-6ae3e150665d772d969afe5e","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Mercado e Eventos","pais":"Brasil","titulo":"Voll leva IA agêntica ao Rio e mostra como tecnologia muda gestão de viagens corporativas","resumo":"A Voll apresentou soluções baseadas em inteligência artificial agêntica para automatizar o planejamento e a logística do setor corporativo. A tecnologia permite tomar decisões autônomas e otimizar processos de mobilidade empresarial com alta eficiência. A demonstração no Rio de Janeiro evidencia a profunda transformação digital vivida pelo mercado B2B.","link":"https://www.mercadoeeventos.com.br/feiras-e-eventos/voll-leva-ia-agentica-ao-rio-e-mostra-como-tecnologia-muda-gestao-de-viagens-corporativas/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"SLB","pais":"Estados Unidos","titulo":"Como uma nova tecnologia se torna uma inovação confiável?","resumo":"O processo de transformação de emergentes avanços tecnológicos em soluções amplamente aceitas pela sociedade exige transparência e validação rigorosa. Especialistas analisam como a construção de confiança do público e a regulamentação eficaz influenciam a adoção de novas ferramentas. Entender esses mecanismos é fundamental para garantir que disrupções tecnológicas gerem benefícios duradouros e seguros.","link":"https://www.slb.com/zh-cn/about/who-we-are/our-history/how-does-new-technology-become-trusted-innovation","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"LCP-Assemblée nationale","pais":"França","titulo":"Ciência e saúde: texto para combater o \"conspiracionismo\" e punir a \"desinformação\" é apresentado pelo deputado Yannick Neuder","resumo":"Um novo projeto legislativo proposto pelo deputado Yannick Neuder tem como objetivo central combater o avanço do conspiracionismo na França. A medida prevê sanções para quem divulgar desinformação que comprometa a ciência e a saúde pública. A iniciativa pretende fortalecer a confiança da sociedade nas instituições acadêmicas e médicas.","link":"https://lcp.fr/actualites/science-et-sante-un-texte-pour-lutter-contre-le-complotisme-et-sanctionner-la","categoria":"CIÊNCIA E SAÚDE","lang":"pt"},{"fonte":"El Economista","pais":"Espanha","titulo":"Tecnologia 3D desenvolvida na Espanha conquista a indústria japonesa","resumo":"A empresa Meltio firmou uma parceria estratégica com a japonesa HORKOS para expandir sua tecnologia de impressão 3D metálica no Japão. A solução inovadora permite fabricar e reparar peças industriais com altíssima precisão e custos reduzidos. O acordo consolida a expansão internacional da tecnologia espanhola nos mercados industriais altamente exigentes da Ásia.","link":"https://www.eleconomista.es/tecnologia/noticias/14024548/10/26/la-tecnologia-3d-made-in-jaen-de-meltio-conquista-la-industria-japonesa-de-la-mano-de-horkos.html","categoria":"INDÚSTRIA","lang":"pt"},{"fonte":"Retail Technology Innovation Hub","pais":"Alemanha","titulo":"Pudu Robotics abre sede europeia na Alemanha com grandes clientes comerciais","resumo":"A empresa de tecnologia Pudu Robotics inaugurou sua nova sede europeia na Alemanha, fortalecendo sua expansão internacional no setor de automação. A companhia já atende gigantes do varejo mundial, como as redes de supermercados Albert Heijn e Carrefour. A iniciativa visa acelerar a adoção de robôs de serviço e logística no mercado europeu nos próximos anos.","link":"https://retailtechinnovationhub.com/home/2026/10/30/pudu-robotics-opens-doors-to-european-hq-in-germany-as-customers-include-albert-heijn-and-carrefour","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Baterias de próxima geração com eletrólito aquoso em formato de 'slime' desenvolvidas pela Maxell e Universidade de Ciência de Tóquio","resumo":"A Maxell e a Universidade de Ciência de Tóquio apresentaram uma bateria de próxima geração baseada em um eletrólito aquoso com consistência de gel. Essa inovação oferece níveis significativamente mais altos de segurança contra incêndios quando comparada às baterias convencionais de íons de lítio. O novo dispositivo promete acelerar o uso de sistemas energéticos seguros em eletrônicos e veículos.","link":"https://news.yahoo.co.jp/articles/b10574b1e89f400ba657ef2d48caec039bac3945","categoria":"ENERGIA","lang":"pt"},{"fonte":"同济大学新闻网","pais":"China","titulo":"Equipe chinesa desenvolve cristal óptico orgânico bidimensional transparente a ultravioleta profundo","resumo":"Pesquisadores da Universidade Tongji criaram um novo cristal óptico não linear orgânico 2D com alta transparência na faixa do ultravioleta profundo. A inovação supera limitações históricas de estabilidade e eficiência de conversão óptica nesses materiais. O avanço abre novos caminhos para o desenvolvimento de lasers avançados e dispositivos optoeletrônicos de alta precisão.","link":"https://news.tongji.edu.cn/info/1003/95956.htm","categoria":"MATERIAIS AVANÇADOS","lang":"pt"},{"fonte":"Hindustan Times","pais":"Índia","titulo":"Lançamento do satélite NVS-03 pela ISRO: a ciência e os desafios por trás do NavIC, o GPS indiano","resumo":"A agência espacial indiana prepara o lançamento do satélite NVS-03 para fortalecer o NavIC, seu sistema próprio de navegação por satélite. O projeto visa garantir independência tecnológica em relação ao GPS norte-americano para usos civis e de defesa. O desenvolvimento enfrentou contratempos técnicos ao longo dos anos, mas segue como pilar estratégico de soberania digital.","link":"https://www.hindustantimes.com/ht-explainers/isro-nvs-03-satellite-launch-sriharikota-today-science-setbacks-behind-navic-navigation-system-india-s-version-of-gps-101793329337740.html","categoria":"CIÊNCIA E ESPAÇO","lang":"pt"},{"fonte":"Público","pais":"Portugal","titulo":"Apple se rende às telas sensíveis ao toque e lança MacBook Pro com tecnologia OLED","resumo":"A Apple mudou sua postura histórica ao incorporar telas sensíveis ao toque na nova linha do MacBook Pro com painel OLED. A novidade atende a uma antiga demanda dos usuários e promete integrar de forma mais fluida a experiência de navegação entre laptops e tablets. A tecnologia de exibição OLED garante cores mais vivas e maior eficiência energética.","link":"https://www.publico.pt/2026/10/29/enter/noticia/apple-rendese-ecras-tacteis-lanca-macbook-pro-tecnologia-oled-2193085","categoria":"HARDWARE","lang":"pt"},{"fonte":"Proifes","pais":"Brasil","titulo":"Impa Tech abre seleção com 150 vagas para o bacharelado em Matemática da Tecnologia e Inovação","resumo":"O Impa Tech anunciou a abertura de um processo seletivo voltado para a graduação focada em exatas e tecnologia avançada. O programa oferece 150 vagas para capacitar novos talentos prontos para atender às demandas da economia digital. A formação busca fortalecer o ecossistema brasileiro de pesquisa aplicada e desenvolvimento científico.","link":"https://www.proifes.org.br/noticias/impa-tech-abre-selecao-com-150-vagas-para-o-bacharelado-em-matematica-da-tecnologia-e-inovacao","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"Apocalypse? Why OpenAI left the world of mathematics in shock","resumo":"OpenAI presented recent advancements that surprised the global scientific community by solving complex mathematical problems. The novelty raises deep debates about the future of human researchers in the face of the accelerated evolution of artificial intelligence. The impact promises to redefine the parameters of discoveries in the field of exact sciences.","link":"https://www1.folha.uol.com.br/ciencia/2026/10/apocalipse-por-que-openai-deixou-mundo-da-matematica-em-choque.shtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"STAT","pais":"United States","titulo":"Is AI more of a partner, competitor, or support for biomedical scientists?","resumo":"The integration of artificial intelligence tools in biomedical research is redefining the role of scientists in laboratories around the world. While some researchers see the technology as a powerful assistant to accelerate discoveries, others warn against excessive dependence on algorithms. The impact of this transformation raises crucial ethical and methodological debates for the future of global scientific advancement.","link":"https://www.statnews.com/2026/10/29/ai-science-biology-dependence-ethics-research/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Ouest-France","pais":"France","titulo":"\"Ocean sailing was a driver\": this anti-collision technology is developed in Finistère","resumo":"The anti-collision technology developed in Finistère had ocean racing as a major driver. The system uses artificial intelligence and state-of-the-art sensors to detect floating objects and prevent maritime accidents. This innovation promises to raise safety standards for both professional sailors and commercial water transport.","link":"https://www.ouest-france.fr/mer/la-course-au-large-a-ete-un-lanceur-cette-technologie-anti-collision-est-developpee-dans-le-finistere-354369ba-d383-11f1-af78-2d36ec019942","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Retail Technology Innovation Hub","pais":"England","titulo":"B\u0026Q brings Google's latest AI technology to its website search","resumo":"Retail chain B\u0026Q has integrated Google's artificial intelligence technology to enhance the internal search system in its e-commerce. The initiative aims to offer more accurate and personalized results for consumers searching for home improvement products. The improvement is expected to significantly increase conversion rates and improve the digital customer experience in the UK.","link":"https://retailtechinnovationhub.com/home/2026/10/30/bq-brings-googles-latest-ai-powered-technology-to-onsite-search-experience","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Diari ARA","pais":"Spain","titulo":"Ink with microchips: the counterfeiters' new nightmare","resumo":"The innovation combines advanced chemical formulations with microscopic electronic devices integrated directly into the ink. This innovative technology promises to revolutionize the authentication of documents and valuable products in the global market. The direct impact includes greater security in authenticity verification and effective combat against the illegal market.","link":"https://es.ara.cat/ciencia-tecnologia/tinta-microchips-nueva-pesadilla-falsificadores_1_5894689.html","categoria":"INNOVATION","lang":"en"},{"fonte":"Science et vie","pais":"Germany","titulo":"German researchers discover unmapped island while fleeing storm in Antarctica","resumo":"During a scientific expedition in Antarctica, German researchers were forced to change their route due to a severe storm and ended up discovering a completely unknown island. The landmass did not appear on any existing map or cartographic record until now. This unprecedented discovery opens new opportunities for geographical and environmental studies on the impact of climate change on ice melting in the region.","link":"https://www.science-et-vie.com/nature-et-environnement/en-fuyant-une-tempete-en-antarctique-des-chercheurs-allemands-decouvrent-une-ile-qui-napparait-sur-aucune-carte-au-monde-235083.html","categoria":"SCIENCE","lang":"en"},{"fonte":"レスポンス（Response.jp）","pais":"Japan","titulo":"What is 'E2E AI'? The technology driving autonomous driving","resumo":"End-to-end artificial intelligence technology, known as E2E AI, is revolutionizing the development of autonomous vehicles by processing sensor data directly into control commands. This approach simplifies traditional software architecture, reduces latency, and improves real-time decision-making. The advancement represents a crucial milestone for the safety and efficiency of future transport.","link":"https://s.response.jp/article/2026/10/30/418429.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"东方财富","pais":"China","titulo":"China's nuclear energy scale leads the world as control system challenges emerge","resumo":"China has reached the world's top position in nuclear energy capacity and scale under construction. However, the sector faces critical technological innovation challenges in the plants' central control system, considered the brain of operations. Experts point to the urgent need for self-sufficiency and improved safety for these vital components.","link":"https://finance.eastmoney.com/a/202610303916223632.html","categoria":"ENERGY","lang":"en"},{"fonte":"India Today","pais":"India","titulo":"Failed in Math, Science, or Social Science: New CBSE rules bring relief to students","resumo":"The new guidelines from India's Central Board of Secondary Education promise to ease academic pressure on students. The change allows greater flexibility and subject substitution opportunities in case of failure in core subjects. This initiative seeks to reduce student stress and lower dropout rates in the country.","link":"https://www.indiatoday.in/amp/education-today/news/story/cbse-class-10-board-exams-2028-skill-subject-replace-failed-core-paper-math-social-science-3028287-2026-10-30","categoria":"EDUCATION","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"AI eliminates 200 jobs at Critical Software: CEO cites company's 'deepest transformation'","resumo":"Automation and artificial intelligence triggered the cut of 200 jobs at the Portuguese technology company Critical Software. The chief executive officer classified this change as the deepest restructuring experienced by the organization since its foundation. The move reflects the direct and immediate impact of generative AI on the software development sector in Portugal.","link":"https://expresso.pt/ia-inteligencia-artificial/2026-10-29-ia-faz-desaparecer-200-empregos-na-critical-software-ceo-fala-na-transformacao-mais-profunda-desde-a-fundacao-da-empresa-016b8618","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Hacker attack causes cryptocurrency platform to freeze over $2.5 billion","resumo":"A critical security vulnerability resulted in a major cyberattack against a renowned crypto asset platform. As an emergency measure to contain losses, over $2.5 billion in assets were temporarily frozen. The incident sounds a global alarm about the need for stricter protocols in the digital finance sector.","link":"https://oglobo.globo.com/economia/noticia/2026/10/30/ataque-hacker-faz-plataforma-de-criptomoedas-congelar-mais-de-us-25-bilhoes.ghtml","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"NASA Science (.gov)","pais":"United States","titulo":"NASA's Voyager 1 conserves power and resolves brief communications pause","resumo":"NASA's iconic Voyager 1 spacecraft overcame a critical technical challenge after temporarily pausing its communications with Earth. To preserve the residual power of humanity's most distant spacecraft, engineers implemented new thermal and energy management strategies. This achievement demonstrates the mission's continued resilience and allows for the prolonged collection of unprecedented data about interstellar space.","link":"https://science.nasa.gov/blogs/voyager/2026/10/29/nasas-voyager-1-conserves-power-resolves-brief-communications-pause/","categoria":"SPACE SCIENCE","lang":"en"},{"fonte":"L'Équipe","pais":"France","titulo":"\"We have improved in all areas of the game\": technology and greater reliability drive Ultim class giants","resumo":"Ultim class boats have reached a new level of reliability and performance thanks to recent technological innovations. After facing challenging periods, sailors highlight comprehensive improvements in all operational aspects of the boats. Progress consolidates technology as a decisive factor for the evolution of high-competition sport.","link":"https://www.lequipe.fr/Voile/Article/-on-s-est-ameliores-dans-tous-les-compartiments-du-jeu-technologie-et-meilleure-fiabilite-les-geants-de-la-classe-ultim-qui-s-elanceront-dimanche-sont-sortis-des-temps-difficiles/1739564","categoria":"INNOVATION","lang":"en"},{"fonte":"The Northern Echo","pais":"England","titulo":"Plans are revealed for a massive new data center campus in County Durham","resumo":"New plans have been unveiled for the construction of a large data center campus in the County Durham region of England. The project represents a massive investment in digital infrastructure to meet the growing demand for data processing and artificial intelligence. The facility is expected to strongly boost the local economy and create hundreds of skilled jobs over the coming years.","link":"https://www.thenorthernecho.co.uk/news/26682440.plans-unveiled-durham-technology-park-data-centre-near-murton/","categoria":"INFRASTRUCTURE","lang":"en"},{"fonte":"ConSalud","pais":"Spain","titulo":"From loss to regeneration: science reveals the key to slowing down collagen aging","resumo":"Researchers have identified crucial molecular mechanisms involved in the degradation of collagen over the years. The discovery enables the development of new therapies aimed at tissue regeneration and more efficient anti-aging treatments. This scientific innovation can transform aesthetic medicine and the treatment of degenerative joint diseases.","link":"https://www.consalud.es/estetic/cosmetica/de-la-perdida-a-la-regeneracion-la-ciencia-desvela-la-clave-para-frenar-el-envejecimiento-del-colageno.html","categoria":"SCIENCE","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"Billion-Dollar Hacker Attack Hits Cryptocurrency Exchange Binance","resumo":"Cryptocurrency giant Binance fell victim to a massive cyberattack, resulting in the theft of billions in funds from the platform. The incident sent shockwaves through the global financial market and raised alarms about the vulnerability of decentralized networks. Experts and authorities are already investigating the origin of the attack to try to recover assets and reinforce the digital security of operations.","link":"https://www.sueddeutsche.de/wirtschaft/digitalwaehrungen-milliardenschwerer-hackerangriff-auf-kryptoboerse-binance-dpa.urn-newsml-dpa-com-20090101-261030-930-915979","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"Science Tokyo","pais":"Japan","titulo":"Pyr-PICsomes: Novel Programmable Nanovesicles for Hydrostatic Pressure Detection","resumo":"Researchers have developed innovative nanovesicles called Pyr-PICsomes, capable of responding precisely to variations in hydrostatic pressure. This new class of nanomaterials sets important precedents for non-invasive biomedical monitoring and advanced cellular diagnostics. The potential impact includes the refinement of targeted therapies and highly sensitive biological sensors.","link":"https://www.isct.ac.jp/en/news/wt1hck9ojkr8","categoria":"SCIENCE","lang":"en"},{"fonte":"新浪财经","pais":"China","titulo":"How a New Transformer Can Optimize AI Data Center Consumption","resumo":"The accelerated expansion of artificial intelligence demands increasingly efficient and compact electrical infrastructures for data centers. The adoption of new transformer technologies promises to significantly reduce the required physical space and energy waste. This innovation emerges as an essential solution to sustain the growing computational demand of advanced models.","link":"https://finance.sina.com.cn/roll/2026-10-30/doc-iniwysmu5529107.shtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Bloomberg.com","pais":"India","titulo":"How Jio Transformed India's Mobile Internet Economy, One Cheap Byte at a Time","resumo":"Jio's entry into the telecommunications market revolutionized digital inclusion in India by offering mobile data at extremely low prices. This democratization of access boosted the digital economy, startup creation, and the digitalization of essential services. The strategy drastically altered content consumption and connected hundreds of millions of citizens.","link":"https://www.bloomberg.com/news/features/2026-10-30/how-jio-transformed-india-s-mobile-internet-economy-one-cheap-byte-at-a-time","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Pplware","pais":"Portugal","titulo":"Portuguese Technology Identifies Antibiotic-Resistant Bacteria in 45 Minutes","resumo":"An innovative technology developed in Portugal is capable of detecting antibiotic-resistant bacteria in just 45 minutes. The scientific breakthrough promises to revolutionize clinical diagnostics and accelerate the correct treatment of severe infections. The solution significantly reduces the traditional waiting time for laboratory tests, saving lives.","link":"https://pplware.sapo.pt/ciencia/tecnologia-portuguesa-identifica-bacterias-resistentes-a-antibioticos-em-45-minutos/","categoria":"SCIENCE","lang":"en"},{"fonte":"NeoFeed","pais":"Brazil","titulo":"Neither Oil Nor Interest Rates: Why Artificial Intelligence Has Become the Real Engine of the Global Economy","resumo":"Artificial intelligence has taken on a central role in transforming financial markets and the productivity of major global companies. Analysts point out that technological innovation now surpasses traditional macroeconomic impact factors on a worldwide scale. This movement drives massive new investments and permanently alters the dynamics of work.","link":"https://neofeed.com.br/economia/nem-petroleo-nem-juros-por-que-a-inteligencia-artificial-virou-o-verdadeiro-motor-da-economia-global/","categoria":"INNOVATION","lang":"en"},{"fonte":"The Dispatch","pais":"United States","titulo":"'That Damn Data Center': Land and Technology Clash in Kentucky","resumo":"The accelerated expansion of technological infrastructure in the state of Kentucky has sparked strong local community resistance against the installation of data centers. Residents and farmers argue that the massive use of land, water, and energy threatens the environment and their rural lifestyle. The conflict reflects the growing dilemma between the demands of the digital economy and regional sustainability.","link":"https://thedispatch.com/article/data-center-kentucky-land-environment/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"LCP-Assemblée nationale","pais":"France","titulo":"Science and Health: Deputy Yannick Neuder Presents Bill to Combat \"Conspiracism\" and Punish \"Disinformation\"","resumo":"French deputy Yannick Neuder has introduced a bill aimed at combating conspiracy theories and penalizing the spread of disinformation. The proposal focuses on protecting the credibility of science and public health research among the public. The text seeks to create rigorous legal mechanisms to curb misleading narratives that put society at risk.","link":"https://lcp.fr/actualites/science-et-sante-le-depute-yannick-neuder-a-depose-un-texte-pour-lutter-contre-le?amp","categoria":"SCIENCE AND HEALTH","lang":"en"},{"fonte":"The Argus","pais":"England","titulo":"Ambulance Service Trials New Video Technology to Help Save Cardiac Arrest Patients","resumo":"An emergency medical service in the UK is testing innovative video technology to assist in responding to cardiac arrests. The system allows dispatchers to view the scene in real time and guide bystanders before paramedics arrive. Experts expect to increase survival rates through faster and more precise cardiac interventions.","link":"https://www.theargus.co.uk/news/26677888.south-east-coast-ambulance-service-trials-video-technology/","categoria":"HEALTH","lang":"en"},{"fonte":"La Voz de Galicia","pais":"Spain","titulo":"Veraquo: The Technology That Identifies 'Deepfakes' Better Than the Human Eye","resumo":"Developed in Vigo, the Veraquo tool uses advanced artificial intelligence algorithms to detect complex digital manipulations. The solution has surpassed human capability in identifying falsified content in videos and images. This breakthrough represents a fundamental milestone in the fight against disinformation and in digital media security.","link":"https://www.lavozdegalicia.es/noticia/reto-digital/tecnologia/2026/10/29/veraquo-tecnologia-nacida-vigo-caza-deepfakes-mejor-ojo-humano/00031793285736227278280.htm","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Bild der Wissenschaft","pais":"Germany","titulo":"Millennia-Old Dye Becomes a Medical Ally","resumo":"Scientists have discovered that a pigment used for thousands of years can play a fundamental role in the advancement of new medical treatments. The chemical properties of the ancient compound have shown potential to assist in drug delivery and disease diagnosis. The discovery bridges historical knowledge with modern medical technologies to create innovative and effective therapeutic alternatives.","link":"https://wissenschaft.de/artikel/jahrtausende-alter-farbstoff-wird-zum-medizinhelfer","categoria":"MEDICINE","lang":"en"},{"fonte":"量子科学技術研究開発機構（QST）","pais":"Japan","titulo":"Success in Visualizing Reduced Liver Enzyme Activity Using Hyperpolarized Magnetic Resonance Technique","resumo":"Scientists have achieved external visualization of reduced hepatic enzyme activity in living models using hyperpolarized magnetic resonance. The technique makes it possible to diagnose and monitor liver diseases before the appearance of severe symptoms or irreversible organ damage. This is a striking medical breakthrough with the potential to transform clinical exams and early treatments.","link":"https://www.qst.go.jp/site/press/20261030.html","categoria":"MEDICINE","lang":"en"},{"fonte":"搜狐网","pais":"China","titulo":"Horizon's End-to-End Autonomous Driving Technology Wins Top Science and Technology Award","resumo":"Horizon Robotics received the special award from the Society of Automotive Engineers of China for its end-to-end autonomous driving system. The technology integrates perception and decision-making into a single optimized neural architecture. The advancement solidifies the prominent position of the Chinese industry in the development of next-generation intelligent vehicles.","link":"https://m.sohu.com/a/1094869686_100116740?scm=10001.325_13-325_13.0.0-0-0-0-0.5_1334","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ET Government","pais":"India","titulo":"ETGovernment Vision Conclave 5.0: Uttar Pradesh Bets on AI to Power Its $1 Trillion Economy Ambition","resumo":"The state of Uttar Pradesh is integrating artificial intelligence into its public policies and infrastructure to accelerate economic growth. During the Vision Conclave 5.0 event, government leaders highlighted the use of technology in governance, health, and agriculture. The initiative aims to transform the region into a technological hub and reach the milestone of a one trillion-dollar economy.","link":"https://government.economictimes.indiatimes.com/news/policy/etgovernment-vision-conclave-5-0-uttar-pradesh-bets-on-ai-to-power-its-1-trillion-economy-ambition/135340131","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"uc.pt","pais":"Portugal","titulo":"GLEX Ignition: Coimbra Aims to Get Closer to Space Exploration","resumo":"The city of Coimbra is hosting the GLEX Ignition event to discuss innovation, space exploration, and international scientific advancement. The initiative aims to position the region as a strategic hub in the aerospace and cutting-edge technology industry. The gathering brings together global experts to foster new partnerships and scientific investments.","link":"https://noticias.uc.pt/artigos/glex-ignition/","categoria":"SPACE","lang":"en"},{"fonte":"www.gov.br","pais":"Brazil","titulo":"MCTI, RNP, and INPE Launch Dashboard to Monitor Climate Change in Brazil and Latin America","resumo":"Brazilian research institutions have joined forces to create a unified ecological and meteorological data platform. The new digital dashboard will allow real-time tracking of climate transformations with high technical precision. The initiative aims to support efficient public policies and preservation strategies for Latin America.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/mcti-rnp-e-inpe-lancam-painel-para-monitorar-mudancas-climaticas-no-brasil-e-na-america-latina","categoria":"SCIENCE","lang":"en"},{"fonte":"Amazon Web Services (AWS)","pais":"United States","titulo":"Experience the Future of Media, Entertainment, Sports, and Advertising Technology at AWS re:Invent 2026","resumo":"Amazon Web Services has announced key technological guidelines for the AWS re:Invent conference focused on the entertainment and advertising industries. The event will showcase new cloud architectures and artificial intelligence-based solutions for sports broadcasting optimization and content production. These innovations seek to shape the sector's new operational standards for coming years.","link":"https://aws.amazon.com/blogs/media/experience-the-future-of-media-and-entertainment-sports-and-advertising-technology-at-aws-reinvent-2026/","categoria":"TECH EVENT","lang":"en"},{"fonte":"France 24","pais":"France","titulo":"COP17: Science Once Again Questioned by Several Countries, Some Nations Accuse","resumo":"At COP17, representatives from various nations accused other countries of once again calling scientific evidence on climate change into question. The deadlock weakens the formulation of global policies based on empirical data and delays urgent environmental targets. The debate highlights the ongoing challenge of aligning political decisions with international academic consensus.","link":"https://www.france24.com/fr/info-en-continu/20261029-cop17-la-science-%C3%A0-nouveau-remise-en-cause-par-plusieurs-pays-accusent-certaines-nations","categoria":"SCIENCE","lang":"en"},{"fonte":"Sky Sports","pais":"England","titulo":"Lewis Hamilton: Ferrari Driver Says He Is 'Built Differently' Amid Defiance Over Extending F1 Career Into 2030s","resumo":"Driver Lewis Hamilton stated that he possesses differentiated physical and mental preparation to continue competing at the highest level of Formula 1. Set to represent Ferrari, the British driver does not rule out extending his track career into the 2030s. His statements reinforce his determination to rewrite records and challenge the traditional limits of longevity in motorsports.","link":"https://www.skysports.com/f1/news/13605468/lewis-hamilton-ferrari-driver-says-he-is-built-differently-amid-defiance-over-extending-his-f1-career-into-2030s","categoria":"SPORTS","lang":"en"},{"fonte":"El Debate","pais":"Spain","titulo":"OpenAI Claims Its AI Has Solved Three Major Scientific Enigmas","resumo":"OpenAI has announced that its advanced artificial intelligence models have presented valid solutions to three historical scientific problems. Renowned experts, including a Nobel Prize winner, will conduct rigorous tests to validate the results obtained. If confirmed, the achievement will demonstrate AI's transformative potential in accelerating scientific discovery.","link":"https://www.eldebate.com/ciencia/20261030/openai-asegura-ia-resolvio-tres-grandes-enigmas-cientificos-nobel-otros-expertos-pondran-prueba_474786.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Bild der Wissenschaft","pais":"Germany","titulo":"Amazon Rainforest Ceases to Be a Carbon Sink","resumo":"Recent studies reveal that the Amazon Rainforest has lost its capacity to act as an efficient carbon dioxide sink, emitting more CO2 than it absorbs. The increase in deforestation and fires, combined with climate change, has drastically altered the region's ecological balance. Scientists warn that this environmental collapse could further accelerate global warming if urgent measures are not taken.","link":"https://wissenschaft.de/artikel/amazonas-regenwald-ist-keine-co2-senke-mehr","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Will Lasertec's Leadership Continue? The Real Value of Next-Generation EUV Semiconductors","resumo":"Lasertec maintains a prominent position in the global semiconduct   const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
