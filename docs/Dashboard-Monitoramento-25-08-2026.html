signed to assess bird health and stress.\nUsing sensors and real-time data analysis, the tool makes it possible to identify behavioral changes and improve management standards on farms.\nThe initiative seeks to respond to growing consumer demand for more ethical and sustainable practices in factory farming.\nIf the trials are successful, the technology could be rolled out across the company's entire supply chain.","link":"https://www.grocerygazette.co.uk/2026/08/25/noble-foods-trials-happy-o-meter-technology-to-monitor-hen-welfare/","categoria":"INNOVATION","lang":"en"},{"fonte":"Anadolu Ajansı","pais":"United Kingdom","titulo":"EU Technology Chief Warns of AI Losing Human Control","resumo":"The European Union's technology authority has expressed strong concern over the accelerated pace of artificial intelligence development.\nThe warning highlights the urgency of implementing rigorous regulations to prevent algorithms from making autonomous decisions without proper human oversight.\nExperts argue that a lack of global governance could pose systemic risks to security, the labor market, and privacy.\nThe debate reinforces the pursuit of a balance between encouraging innovation and mitigating technological hazards.","link":"https://www.aa.com.tr/en/europe/eu-technology-chief-warns-of-ai-losing-human-control/4036547","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"GOV.UK","pais":"United Kingdom","titulo":"New Partnership Between UK and Ukraine to Focus on Decisive Technologies With Access to Avengers AI Labs","resumo":"The UK and Ukraine have signed a strategic partnership for the development of advanced technological solutions tailored to the defense landscape.\nThe agreement grants the British government direct access to Avengers AI Labs, Ukrainian innovation centers specializing in applied artificial intelligence.\nThe collaboration seeks to accelerate the creation of tools capable of providing tactical advantages on the modern battlefield.\nBeyond boosting military technology, the alliance strengthens scientific and intelligence exchange between the two nations.","link":"https://www.gov.uk/government/news/new-partnership-set-to-see-the-uk-and-ukraine-develop-battle-winning-technology-as-britain-secures-access-to-ukraines-avengers-ai-labs","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Híbridos y Eléctricos","pais":"Spain","titulo":"Neither inspection nor checkpoints: Spain is already testing technology that detects vehicle pollution in seconds","resumo":"Spain has begun testing a new technology capable of measuring vehicle pollutant emissions in real time, eliminating the need for roadside checkpoints or traditional vehicle inspections. The system uses advanced sensors installed along roadways to capture and analyze gases expelled by automobiles within seconds. The initiative aims to quickly identify the highest-polluting vehicles and optimize environmental enforcement on Spanish roads and cities.","link":"https://www.hibridosyelectricos.com/coches/ni-itv-ni-control-en-carretera-espana-ya-prueba-tecnologia-detecta-cuanto-contamina-coche-en-cuestion-segundos_88894_102.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Investing.com España","pais":"Spain","titulo":"CGI partners with AgVantis to modernize Farm Credit technology","resumo":"IT services firm CGI has announced a strategic collaboration with AgVantis to transform and modernize the technological infrastructure of the Farm Credit system. The project seeks to streamline agricultural lending processes, offering more agile and secure digital solutions for producers. This partnership drives operational efficiency in the agribusiness financial sector through the digitization of essential services.","link":"https://es.investing.com/news/company-news/cgi-se-asocia-con-agvantis-para-modernizar-la-tecnologia-de-farm-credit-93CH-3809777","categoria":"INNOVATION","lang":"en"},{"fonte":"El Economista","pais":"Spain","titulo":"Spanish firm Altum Sequencing seeks five million to accelerate early cancer detection technology","resumo":"Spanish biotech startup Altum Sequencing has opened a five million euro funding round to drive the development and commercialization of its diagnostic platform. The company's innovative technology makes it possible to identify cancer relapses with high precision and at an early stage through genetic sequencing. The funds raised will be crucial to accelerating clinical trials and expanding the solution's footprint in the global healthcare market.","link":"https://www.eleconomista.es/salud-bienestar/noticias/14009795/08/26/la-espanola-altum-sequencing-busca-cinco-millones-para-acelerar-su-tecnologia-de-deteccion-precoz-del-cancer.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"diariodetenerife.info","pais":"Spain","titulo":"Tenerife turns plant material from La Laguna's dragon tree into an opportunity for research and innovation","resumo":"The island government of Tenerife is repurposing waste and plant materials from La Laguna's historic dragon tree to power scientific research and innovation projects. The initiative brings together botanical preservation and applied science, exploring the unique biological properties of the plant native to the Canary Islands. The project strengthens the local scientific ecosystem by transforming natural heritage into a source of sustainable study and innovation.","link":"https://www.diariodetenerife.info/tenerife-convierte-material-vegetal-drago-laguna-oportunidad-investigacion-ciencia-innovacion/","categoria":"SCIENCE","lang":"en"},{"fonte":"IFEMA Madrid","pais":"Spain","titulo":"Autonomous buses in Spain: technology and the future","resumo":"Spain is making headway in deploying autonomous buses as part of its strategy to modernize public transit and sustainable urban mobility. Several pilot projects across the country are testing electric vehicles guided by artificial intelligence and high-precision sensors on urban routes. This technological transformation promises to boost efficiency, lower carbon emissions, and redefine the future of mass transit in Spanish cities.","link":"https://www.ifema.es/noticias/motor/autobuses-autonomos-espana-tecnologia-transporte","categoria":"MOBILITY","lang":"en"},{"fonte":"ELLE","pais":"Spain","titulo":"The 40 fabulous Spanish women in the world of science and technology","resumo":"A special feature highlights 40 Spanish women leading breakthrough research and remarkable technological transformations across various fields of knowledge. The list celebrates inspiring careers in physics, biotechnology, engineering, and artificial intelligence, boosting female visibility within the scientific ecosystem. The initiative showcases the crucial impact of female talent on driving innovation and technological development nationwide.","link":"https://www.elle.com/es/living/ocio-cultura/g73509813/40-mujeres-ciencia-tecnologia-elle/","categoria":"SCIENCE","lang":"en"},{"fonte":"Spektrum der Wissenschaft","pais":"Germany","titulo":"Nancy Grace Roman Space Telescope: Green light for new space observatory","resumo":"The Nancy Grace Roman Space Telescope has received final authorization to begin operations and critical launch phases. The mission promises to revolutionize astrophysics by investigating dark energy, dark matter, and distant exoplanets with unprecedented precision. The new observatory expands the universe-mapping capabilities and delivers strategic scientific breakthroughs for the international community.","link":"https://www.spektrum.de/news/start-frei-fuer-das-weltraumteleskop-nancy-grace-roman/2341474","categoria":"SCIENCE","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"ChatGPT: Launch of advertising in Germany","resumo":"OpenAI has begun rolling out advertisements within the German market version of ChatGPT. The move aims to monetize the growing active user base and diversify the business model of the artificial intelligence tool. Experts are monitoring the impacts of this decision on user experience and the European digital advertising market.","link":"https://www.sueddeutsche.de/wirtschaft/werbung-chatgpt-deutschland-li.3536236","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"SAPO","pais":"Germany","titulo":"When weather stalls the economy: river droughts threaten Germany's recovery","resumo":"Declining water levels in major German rivers are hindering the waterway transport of goods critical to industry. This climate phenomenon hurts strategic supply chains and imposes steep logistics costs on local businesses. Analysts warn that worsening drought conditions could stall the recent economic recovery seen across the country.","link":"https://sapo.pt/artigo/quando-o-clima-trava-a-economia-seca-nos-rios-ameaca-recuperacao-da-alemanha-6a8d79c6d0cbd78bc7d82f17","categoria":"CLIMATE","lang":"en"},{"fonte":"Jornal Económico","pais":"Germany","titulo":"Volkswagen: Germany to absorb half of additional layoffs, says CEO","resumo":"The Volkswagen Group CEO confirmed that roughly half of the layoffs planned in the global restructuring will impact employees in Germany. The measure reflects intense cost-cutting pressures amid the transition to electric vehicles and global competition. Local unions and labor representatives are preparing negotiations to cushion the impact on the country's factories.","link":"https://jornaleconomico.sapo.pt/noticias/volkswagen-alemanha-devera-absorver-metade-dos-despedimentos-adicionais-diz-ceo/","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"1\u00261","pais":"Germany","titulo":"Merz's plan for the German economy: \"To be at the top of the world\"","resumo":"Political leader Friedrich Merz has unveiled a strategy focused on boosting Germany's industrial competitiveness. The proposals include deregulation, tax incentives, and technological modernization to return the country to global leadership. The plan aims to address the productive sector's demands for structural reforms amid current economic challenges.","link":"https://home.1und1.de/magazine/politik/videos/shorts/inland/merz-plan-deutsche-wirtschaft-weltspitze-stehen-42649582","categoria":"BUSINESS","lang":"en"},{"fonte":"Euronews","pais":"Germany","titulo":"Germany: Economy grows faster than expected on export recovery","resumo":"Germany's Gross Domestic Product posted growth in the second quarter, beating economic analysts' estimates. The recovery was driven mainly by a positive rebound in the export sector and global demand for manufactured goods. Despite the favorable figures, economists remain cautious due to ongoing global geopolitical uncertainties.","link":"https://pt.euronews.com/business/2026/08/25/alemanha-economia-cresce-acima-do-previsto-com-recuperacao-das-exportacoes","categoria":"ECONOMY","lang":"en"},{"fonte":"Tagesspiegel","pais":"Germany","titulo":"Economic outlook: German economy grows, but public finances post deep deficit","resumo":"Despite recent GDP expansion in Germany, the public accounts balance revealed a significant budget deficit for the period. Rising government spending and subsidy costs are straining the federal budget amid the economic rebound. This scenario highlights the challenge of balancing growth incentives with legally required fiscal sustainability.","link":"https://www.tagesspiegel.de/wirtschaft/konjunktur-deutsche-wirtschaft-wachst-starker-staat-tief-im-minus-15977842.html","categoria":"FINANCE","lang":"en"},{"fonte":"NHKニュース","pais":"Japan","titulo":"Shizuoka event showcases latest robotics and artificial intelligence technologies","resumo":"An event held in Shizuoka Prefecture brought together various innovations focused on the future of automation and artificial intelligence. The exhibition highlighted the practical impact of next-generation robots and technological solutions applied across different sectors of society and industry. The initiative aims to bring the general public closer to new tech trends and encourage the adoption of smart systems in everyday life.","link":"https://news.web.nhk/newsweb/na/nb-3030033239","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"China showcases tech prowess at robot sporting event amidst triumphs and glitches","resumo":"China hosted an exclusive robot competition aimed at demonstrating its growing technological capacity and industrial might. While several models displayed astonishing capabilities that surpassed human skills in specific tasks, the event also recorded collisions and operational failures. The spectacle reflects the intense global race for robotics development and the hurdles that remain before achieving full maturity.","link":"https://news.yahoo.co.jp/articles/59ef56fc2825362cb86106b896935f1132c5e728","categoria":"ROBOTICS","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Neuroscientists warn of declining reasoning skills in children addicted to short videos","resumo":"The surge in rampant short-video consumption on digital platforms is alarming neuroscience experts in Japan. Recent studies and warnings indicate that this habit can drastically reduce children's concentration span and critical reasoning abilities. Specialists recommend implementing screen time limits and raising family awareness to mitigate the negative impacts on children's cognitive development.","link":"https://news.yahoo.co.jp/articles/0f2ea9b0b4766d314a56400ba065bfb3d9b9109b","categoria":"SCIENCE","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Ukraine and UK team up to develop military artificial intelligence using combat data","resumo":"For the first time, Ukraine will share strategic data gathered during the conflict with Russia to develop new military artificial intelligence technologies in partnership with the United Kingdom. The agreement aims to accelerate the creation of autonomous systems and advanced battlefield analysis tools. This international cooperation sets an important precedent for using real combat data to enhance defense systems.","link":"https://news.yahoo.co.jp/articles/0162a39abeb880bb2bff28d47420b99bb8e6cde1","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"soumu.go.jp","pais":"Japan","titulo":"Japan's White Paper on Communications warns of economic losses caused by cyberattacks","resumo":"Japan's new government report on information and communications highlights the severe financial impact resulting from cybersecurity failures and incidents. Economic losses are multiplying as companies and public agencies become increasingly dependent on digital infrastructure. The document emphasizes the urgency of strategic investments in cyber defense to protect critical data and ensure the stability of the national market.","link":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r08/html/nd21a220.html","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"ibaraki.ac.jp","pais":"Japan","titulo":"Japan and Taiwan unite universities to develop polarized light emission technology","resumo":"A symposium held in Taiwan marked the beginning of a scientific collaboration between five Japanese and Taiwanese universities. The partnership aims to promote research and development of circularly polarized luminescence technology, which is considered promising for future applications in next-generation displays and optical devices. The project reinforces academic and technological ties between the two regions to accelerate innovations in the photonics sector.","link":"https://www.ibaraki.ac.jp/news/n/2026/08/25015008.html","categoria":"SCIENCE AND TECHNOLOGY","lang":"en"},{"fonte":"株探","pais":"Japan","titulo":"Japan establishes domestic production technology for the rare metal hafnium targeting 2028","resumo":"Researchers and industries in Japan have mastered the in-house manufacturing technology for hafnium, a rare element crucial for the semiconductor industry and advanced materials. The country's goal is to begin mass production of the substance by 2028, reducing extreme dependence on strategic imports. This advancement strengthens Japan's industrial sovereignty and high-tech supply chain security.","link":"https://kabutan.jp/news/marketnews/?b=n202608250875","categoria":"INDUSTRIAL INNOVATION","lang":"en"},{"fonte":"a.u-tokyo.ac.jp","pais":"Japan","titulo":"University of Tokyo study indicates CO₂ absorption by Japanese forests is double previous estimates","resumo":"Groundbreaking research conducted by the University of Tokyo has shown that the actual carbon dioxide absorption by Japan's forests is nearly double previous estimates. The study is part of the Forest Green Transformation project, which focuses on applying science to combat climate change. This discovery brings new perspectives to global decarbonization goals and the valuation of the country's natural resources.","link":"https://www.a.u-tokyo.ac.jp/news/news_20260824-1.html","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"北京经济技术开发区","pais":"China","titulo":"Beijing launches 'AI4Chip' plan to boost integrated circuit industry with artificial intelligence","resumo":"The Beijing government has unveiled a strategic plan called 'AI4Chip' projected for the period between 2026 and 2028. The initiative aims to integrate advancements in artificial intelligence into the design and manufacturing ecosystem of integrated circuits, optimizing semiconductor development. The project seeks to accelerate national technological innovation and strengthen the autonomy of the chip sector amid global restrictions and competition.","link":"https://kfqgw.beijing.gov.cn/zwgkkfq/2024zcjd/202608/t20260825_4836426.html","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"大连理工大学新闻网","pais":"China","titulo":"Chinese researchers publish breakthrough in dichalcogenide nanotubes in Science magazine","resumo":"A research team from the Department of Physics at Dalian University of Technology has achieved a remarkable discovery in the controllable growth of nanotubes. The work focuses on the precise cultivation of transition metal dichalcogenide nanotubes, a crucial class of two-dimensional and semiconductor materials. The research was highlighted in the prestigious Science magazine and promises to open new frontiers for the manufacturing of next-generation nanoelectronic and optoelectronic devices.","link":"https://news.dlut.edu.cn/info/1024/149405.htm","categoria":"NANOTECHNOLOGY","lang":"en"},{"fonte":"北京师范大学新闻网","pais":"China","titulo":"Beijing Normal University successfully launches 'Muduo-1' satellite constellation","resumo":"Beijing Normal University has successfully launched the 'Muduo-1' instant remote-sensing scientific experiment satellite constellation. The new satellites were designed to collect high-precision, real-time orbital data for environmental research and earth observation. The mission strengthens the country's academic and technological capabilities in disaster management, climate monitoring, and aerospace engineering innovation.","link":"https://news.bnu.edu.cn/zx/ttgz/a511a0533f4349f494a6fe2de507f517.htm","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"北京经济技术开发区","pais":"China","titulo":"Beijing releases action plan to lead atomic-level manufacturing industry","resumo":"The Beijing Economic-Technological Development Area has unveiled the 2026-2028 action plan focused on demonstrative application and innovation in atomic manufacturing. The initiative targets the manipulation and assembly of matter at the scale of individual atoms to create ultra-high-precision materials and components. The plan aims to position the region as a pioneering global hub for developing cutting-edge industrial technologies and quantum devices.","link":"https://kfqgw.beijing.gov.cn/zwgkkfq/2024zcjd/202608/t20260825_4836432.html","categoria":"ADVANCED MANUFACTURING","lang":"en"},{"fonte":"Al Jazeera","pais":"China","titulo":"Nvidia and Supermicro employees indicted over illegal export of AI servers to China","resumo":"Employees linked to tech giants Nvidia and Supermicro have been criminally charged over schemes involving the illegal export of advanced AI servers to China. The allegations claim the deliberate violation of trade controls and sanctions imposed by the United States on shipments of sensitive processing hardware. The case highlights growing geopolitical tensions and the battle for control over the foundational physical infrastructure of global artificial intelligence.","link":"https://www.aljazeera.com/amp/economy/2026/8/25/nvidia-supermicro-employees-charged-over-export-of-ai-servers-to-china","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"极目新闻","pais":"China","titulo":"Chinese police dismantle schemes using AI to create defamation against Xiaomi","resumo":"Chinese police have cracked multiple criminal cases involving the use of artificial intelligence tools to generate and spread fake rumors about Xiaomi. In response to the investigations, the tech giant emphasized that it will take legal action to defend its commercial reputation and combat malicious AI-generated content. The police action sets a relevant precedent in the fight against automated disinformation and the misuse of generative AI models in the corporate sector.","link":"https://www.ctdsb.net/c1666_202608/2840351.html","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"中华人民共和国科学技术部","pais":"China","titulo":"China opens 2026 Nuclear Fusion Energy Conference with a focus on scientific innovation","resumo":"China's Vice Minister of Science and Technology, Zhang Guangjun, attended the opening ceremony of the 2026 Nuclear Fusion Energy Conference and Activity Week. The event brought together leading scientists and industry leaders to discuss innovations in magnetic confinement and the progress of experimental reactors. The initiative reinforces China's strategic ambition to accelerate the commercial transition toward nuclear fusion as a clean and limitless energy source.","link":"https://www.most.gov.cn/kjbgz/202608/t20260825_197198.html","categoria":"FUSION ENERGY","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"External pipeline inspection robot stands out at the 2026 World Robot Conference","resumo":"PipeChina's technology company showcased its new external pipeline inspection robot during the 2026 World Robot Conference. The equipment uses high-precision sensors and autonomous algorithms to map flaws, corrosion, and vulnerable sections in energy transport pipelines. This innovation represents a significant advancement in automation and operational safety for the national fuel transportation infrastructure.","link":"https://www.news.cn/energy/20260825/2b6b4d5aedda40e8ab3f7c88a7897ffe/c.html","categoria":"ROBOTICS","lang":"en"},{"fonte":"The Quantum Insider","pais":"India","titulo":"India highlights 6G and quantum communications as technological priorities","resumo":"India has reaffirmed its commitment to leading global advancements in digital infrastructure by highlighting 6G network technologies and quantum communication as its top strategic priorities. The government seeks to accelerate research and encourage public-private partnerships to develop national patents prior to global standardization. The initiative aims to guarantee the country's technological sovereignty, strengthen information security, and drive large-scale digital inclusion across Indian territory.","link":"https://thequantuminsider.com/2026/08/25/india-6g-quantum-communications-development/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Deccan Chronicle","pais":"India","titulo":"India could reach a $55 trillion economy by 2047 by capitalizing on AI with its young demographics","resumo":"India's former chief economic adviser stated that the country has the potential to transform its economy and achieve an impressive Gross Domestic Product driven by artificial intelligence.\nThe combination of a large young population and the rapid adoption of emerging technologies in strategic sectors is cited as the main driver of this accelerated growth in the coming decades.\nTo achieve this vision, leadership has reinforced the need for massive investment in technical training and digital infrastructure.","link":"https://www.deccanchronicle.com/nation/current-affairs/india-can-build-55-trillion-economy-by-2047-by-capitalising-on-its-young-demographic-in-ai-ex-cea-1982200","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Department of Science and Technology (DST)","pais":"India","titulo":"New smart technology could make Alzheimer's diagnosis more accessible","resumo":"Researchers and developers have introduced a new smart technology system capable of simplifying the early identification of Alzheimer's disease, reducing diagnostic costs and barriers.\nThe innovation uses advanced algorithms to analyze biological and behavioral markers quickly and accurately.\nIt is expected that this solution will facilitate healthcare access in vulnerable regions and help democratize preventive treatments on a global scale.","link":"https://dst.gov.in/new-smart-technology-can-make-diagnosis-of-ad-more-accessible","categoria":"SCIENCE AND HEALTH","lang":"en"},{"fonte":"The Star","pais":"India","titulo":"India to transfer state-developed missile technology to private defense companies","resumo":"In a major strategic shift, the Indian government has authorized the transfer of missile technologies created by public agencies to private companies in the national defense sector.\nThe move aims to strengthen the country's industrial base, boost local manufacturing under the Make in India program, and reduce dependence on military imports.\nThe measure also promises to accelerate the development of new weaponry solutions and generate jobs in the high-tech sector.","link":"https://www.thestar.com.my/aseanplus/aseanplus-news/2026/08/25/india-to-transfer-state-developed-missile-technology-to-domestic-defence-companies","categoria":"DEFENSE AND TECHNOLOGY","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"Scindia calls on C-DOT to take Indian telecommunications technology to global markets","resumo":"India's Minister of Telecommunications has asked the Centre for Development of Telematics to expand the export of its technological solutions to the international market.\nThe goal is to position the country not only as a consumer, but as a global provider of network infrastructure and reliable connectivity equipment.\nThe strategy seeks to boost the presence of Indian companies on the global stage and strengthen international cooperation in the telecommunications sector.","link":"https://www.moneycontrol.com/news/telecom/scindia-calls-on-c-dot-to-take-indian-telecom-technology-to-global-markets-14014746.html","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"fundsforNGOs","pais":"India","titulo":"TechPioneer grant supports technology-driven startups in India","resumo":"A new grant and financial incentive program called TechPioneer has been launched to boost Indian startups focused on innovation and high technology.\nThe funding aims to support entrepreneurs developing disruptive solutions in areas such as artificial intelligence, biotechnology, and clean energy.\nThe initiative aims to accelerate digital transformation in the country and consolidate the national innovation ecosystem as one of the most dynamic in the world.","link":"https://www2.fundsforngos.org/innovation/techpioneer-grant-for-technology-driven-startups-india/","categoria":"INNOVATION","lang":"en"},{"fonte":"DD India","pais":"India","titulo":"Traditional knowledge must integrate with modern science and emerging technologies, says Jitendra Singh","resumo":"India's Minister of State highlighted the urgency of unifying ancestral knowledge and traditional medicinal practices with the advancements of modern science and emerging technologies.\nAccording to him, this synergy can result in more precise diagnoses, new therapeutic treatments, and sustainable innovations of high social impact.\nThe government plans to encourage multidisciplinary research to scientifically validate historical practices and promote them globally.","link":"https://ddindia.co.in/2026/08/traditional-knowledge-must-integrate-with-modern-science-medicine-and-emerging-technologies-jitendra-singh/","categoria":"SCIENCE","lang":"en"},{"fonte":"Investing.com India","pais":"India","titulo":"Rezolve Ai's AI-powered database technology deployed on Google Cloud","resumo":"Technology platform Rezolve Ai announced the deployment of its advanced artificial intelligence database system on the Google Cloud infrastructure.\nThe integration aims to offer greater scalability, security, and speed in processing large volumes of data for e-commerce and retail companies.\nThis partnership promises to optimize the consumer experience with real-time predictive analytics and greater operational efficiency.","link":"https://in.investing.com/news/stock-market-news/rezolve-ai-database-technology-deployed-in-google-cloud-93CH-5570533","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Social pressure dictates tech purchases: two out of three Portuguese spend more due to youth influence","resumo":"A recent study reveals that social pressure exerted by younger generations directly impacts consumption decisions in Portugal.\nTwo out of three Portuguese admit to spending more money on technological devices and digital trends due to the influence of their children or young family members.\nThis phenomenon reflects how rapid technological evolution and the desire for digital inclusion shape buying habits in the country.\nThis behavior drives the accelerated adoption of new gadgets and strengthens the relevance of social media in market decisions.","link":"https://jornaleconomico.sapo.pt/noticias/pressao-social-dita-compras-em-tecnologia-dois-em-cada-tres-portugueses-gastam-mais-por-influencia-dos-jovens/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Delegation of Portuguese startups showcases national innovation in Florianópolis","resumo":"A delegation of Portuguese startups has landed in Florianópolis to showcase innovative technological solutions and explore new business opportunities in Brazil.\nThe meeting aims to strengthen international cooperation between the entrepreneurship ecosystems of Portugal and Latin America.\nParticipating companies highlight areas such as artificial intelligence, energy transition, and information technology for global expansion.\nThe initiative solidifies Portugal as a dynamic hub of innovation with the capacity for projection in strategic markets.","link":"https://jornaleconomico.sapo.pt/noticias/delegacao-de-startups-portuguesas-apresentam-a-inovacao-nacional-em-florianopolis/","categoria":"INNOVATION","lang":"en"},{"fonte":"O Amarense – Jornal","pais":"Portugal","titulo":"Polytechnic University of Viana hosts international congress on innovation, technology, and health gaming","resumo":"The Polytechnic University of Viana do Castelo is hosting an international congress focused on the application of new technologies and gamification in healthcare.\nThe event brings together global experts to discuss how digital games and interactive tools can assist in patient treatment and medical training.\nThe use of immersive technologies promises to transform therapeutic approaches and increase adherence to rehabilitation treatments.\nThe initiative reinforces the role of Portuguese academia in developing applied research with a strong social impact.","link":"https://oamarense.pt/universidade-politecnica-de-viana-recebe-congresso-internacional-sobre-inovacao-tecnologia-e-jogos-em-saude/","categoria":"DIGITAL HEALTH","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Tech sector fortune increased by one trillion in one year","resumo":"The wealth accumulated by top leaders in the global tech sector recorded an expressive increase of one trillion dollars in just twelve months.\nThe financial jump was driven above all by the generative artificial intelligence boom and the global recovery of stocks from major companies in the sector.\nThis vertiginous growth consolidates technology as the main engine of enrichment and contemporary global economic transformation.\nExperts point out that high demand for digital infrastructure will continue to sustain this trend in the coming years.","link":"https://jornaleconomico.sapo.pt/noticias/fortuna-do-setor-tecnologico-aumentou-um-biliao-num-ano/","categoria":"TECH MARKET","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Deloitte Portugal's BrightStart program supports technology students","resumo":"Deloitte Portugal has renewed its commitment to talent development through the BrightStart program, aimed at higher education students in the technology field.\nThe initiative offers full tuition coverage and monthly scholarships, in addition to practical integration into the consultancy's real projects.\nThe program seeks to combat the shortage of qualified professionals in Portugal's information technology sector.\nBy bringing the academic environment closer to the corporate market, the project accelerates the entry of young people into promising tech careers.","link":"https://jornaleconomico.sapo.pt/noticias/programa-brightstart-da-deloitte-portugal-apoia-estudantes-de-tecnologia/","categoria":"TECH EDUCATION","lang":"en"},{"fonte":"SIC Notícias","pais":"Portugal","titulo":"Parents of girl who died of diphtheria in Italy feared vaccine caused autism: what does science say?","resumo":"The tragic death of a child from diphtheria in Italy reignited the debate on the impact of conspiracy theories and misinformation on vaccine hesitancy.\nThe parents of the minor refused immunization out of fear—exhaustively debunked by the scientific community—that the vaccine would cause autism.\nRigorous studies conducted globally over decades have proven the non-existence of any link between vaccines and the development of autism spectrum disorder.\nExperts warn of the risks of the resurgence of severe, eradicated diseases due to the advancement of the anti-vaccine movement.","link":"https://sicnoticias.pt/sicverifica/2026-08-25-pais-de-menina-que-morreu-de-difteria-em-italia-temiam-que-vacina-causasse-autismo.-o-que-diz-a-ciencia--6525331c","categoria":"SCIENCE","lang":"en"},{"fonte":"RTP Açores","pais":"Portugal","titulo":"TERINOV: Terceira Science Park expands with 8 new spaces","resumo":"TERINOV, a science and technology park located on Terceira Island in the Azores, announced the opening of eight new spaces dedicated to companies and research projects.\nThe expansion aims to empower the region to attract more investments in innovation, sustainable development, and digital transition.\nWith the new infrastructure, the regional ecosystem intends to host startups focused on biotechnology, agrotech, and the ocean economy.\nThe strengthening of the park consolidates the Azores as an emerging hub of scientific and technological knowledge in the Atlantic.","link":"https://acores.rtp.pt/local/terinov-parque-de-ciencia-da-terceira-com-8-novos-espacos/","categoria":"SCIENCE","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"Embraer gets approval to build factory in Portugal, creating 300 direct jobs","resumo":"Brazilian manufacturer Embraer has obtained official authorization for the construction of a new manufacturing unit in Portuguese territory, focusing on aeronautical technology.\nThe project plans for a large-scale investment and the immediate creation of more than 300 highly qualified direct jobs.\nThe facility will strengthen Europe's aerospace supply chain and expand the company's production capacity in the region.\nThe initiative solidifies Portugal as a strategic hub for the cutting-edge technology and advanced aviation industry.","link":"https://www.publico.pt/2026/08/25/publico-brasil/noticia/embraer-ganha-aval-construir-fabrica-portugal-gerando-300-empregos-diretos-2186047?ref=economia","categoria":"TECH INDUSTRY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
