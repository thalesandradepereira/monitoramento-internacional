rauma.","link":"https://www.lavanguardia.com/magazine/bienestar/20260824/11618672/parece-detenerse-situaciones-extremas-ciencia-estudia-como-cerebro-altera-percepcion-epm.html","categoria":"NEUROSCIENCE","lang":"en"},{"fonte":"FCE, noticias sobre coches eléctricos, movilidad eléctrica","pais":"Spain","titulo":"These are the 5 battery technologies that could change electric cars forever","resumo":"The automotive sector is about to undergo a radical transformation with the arrival of new chemistries and architectures for energy storage.\nInnovations such as solid-state batteries, sodium-ion cells, and silicon-anode cells promise to drastically increase the range of electric vehicles.\nIn addition to increasing energy density, these advancements aim to considerably reduce recharging times and production costs.\nThe impact of these technologies will be fundamental to accelerating the global transition toward sustainable transport.","link":"https://forococheselectricos.com/noticias/baterias-coches-electricos-sodio-solido-litio-azufre-magnesio-zinc-20260825-41892.html","categoria":"ELECTRIC MOBILITY","lang":"en"},{"fonte":"novaciencia.es","pais":"Spain","titulo":"Satellite technology is used to anticipate potential failures in irrigation reservoirs","resumo":"A new technological project is utilizing satellite imagery and remote sensing data to monitor the structural integrity of water reservoirs.\nThe system analyzes minor ground deformations and invisible-to-the-naked-eye leaks, preventing ruptures and severe accidents in the field.\nThe solution optimizes water resource management in agriculture, allowing for preventive interventions before problems escalate.\nThis application demonstrates the potential of orbital technologies in environmental protection and agricultural infrastructure security.","link":"https://novaciencia.es/tecnologia-satelital-para-anticipar-posibles-fallos-en-balsas-de-riego/","categoria":"SATELLITE TECHNOLOGY","lang":"en"},{"fonte":"Alicante Plaza","pais":"Spain","titulo":"Embention applies its technology to the rescue of the injured in hostile environments with the Imedcap project","resumo":"Spanish company Embention is developing autonomous systems and control technologies to assist in complex medical evacuation missions.\nUnder the umbrella of the European Imedcap project, the initiative focuses on the rescue and transport of the injured in high-danger and restricted-access scenarios.\nThe use of unmanned vehicles and artificial intelligence reduces risks for rescue teams in conflict areas or disaster zones.\nThis advancement reflects the strategic role of robotics and avionics in saving lives under extreme conditions.","link":"https://alicanteplaza.es/alicanteplaza/empresas/la-alicantina-embention-lleva-su-tecnologia-al-rescate-de-heridos-en-entornos-hostiles-con-el-proyecto-imedcap","categoria":"INNOVATION AND RESCUE","lang":"en"},{"fonte":"Bolsamania","pais":"Spain","titulo":"Jump starter manufacturer CARKU expands next-generation Na+ sodium technology in Europe","resumo":"Manufacturer CARKU has begun distributing its new sodium-ion (Na+) technology-based battery jump starters in the European market.\nThis innovative alternative to lithium offers greater thermal stability and superior performance even under extremely low temperatures.\nBesides being more eco-friendly, sodium technology reduces fire risks and extends equipment lifespan.\nThe expansion marks an important step in the mass commercialization of this new generation of batteries in Europe.","link":"https://www.bolsamania.com/nota-de-prensa/mercados/el-fabricante-de-arrancadores-de-bateria-carku-expande-en-europa-la-tecnologia-na-de-ultima-generacion--23362732.html","categoria":"HARDWARE AND ENERGY","lang":"en"},{"fonte":"Motor16","pais":"Spain","titulo":"Tips to make the most of the electric mode in BYD cars with DM-i technology","resumo":"BYD has stood out in the market with its DM-i plug-in hybrid technology, designed to prioritize electric propulsion in daily use.\nExperts reveal configurations and driving habits that help drivers maximize energy efficiency and extend range without burning fuel.\nTips include the correct management of regenerative braking modes and smart daily charging scheduling.\nUnderstanding these features allows for a significant reduction in operating costs and improves the driving experience.","link":"https://www.motor16.com/las-ultimas-noticias/trucos-cara-electrica-byd-dmi/","categoria":"ELECTRIC VEHICLES","lang":"en"},{"fonte":"elDiario.es","pais":"Spain","titulo":"Beyond driving: the technology that accompanies the whole family in the JAECOO 7 SHS Plug-in Hybrid","resumo":"The JAECOO 7 SHS Plug-in Hybrid SUV features a technological ecosystem focused on connectivity, comfort, and the safety of all passengers.\nThe model integrates advanced driving assistants with an intuitive multimedia center geared toward in-cabin entertainment.\nThe combination of the electric motor with the thermal system guarantees superior energy efficiency without sacrificing performance on long trips.\nThe proposal demonstrates how embedded intelligence is redefining the user experience in modern vehicles.","link":"https://www.eldiario.es/motor/conduccion-tecnologia-acompana-familia-jaecoo-7-shs-hibrido-enchufable_1_13444455.html","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"PR Newswire UK","pais":"Germany","titulo":"Jump Starter Manufacturer CARKU Expands in Europe with Sodium-ion Technology","resumo":"Vehicle jump starter manufacturer CARKU has announced the expansion of its operations in the European market.\nThe company is introducing its new generation of batteries based on sodium-ion technology, ensuring high efficiency.\nThis innovation aims to meet the growing demand for more sustainable and economical energy solutions in the region.\nThe move consolidates the brand's presence on the continent and drives advancements in automotive energy storage.","link":"https://www.prnewswire.co.uk/news-releases/jump-starter-manufacturer-carku-expands-in-europe-next-generation-na-technology-302857298.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Yahoo Finanzen Deutschland","pais":"Germany","titulo":"Jump Starter Manufacturer CARKU Expands in Europe with Next-Generation Sodium-Ion Technology","resumo":"Manufacturer CARKU is expanding its footprint in the European market with the launch of next-generation jump starters.\nThe new devices utilize sodium-ion technology, offering excellent performance across thermal variations.\nThe solution emerges as a sustainable, lower-cost alternative to traditional lithium-ion batteries.\nThe expansion reflects the industry's growing pursuit of clean and efficient automotive support technologies.","link":"https://de.finance.yahoo.com/nachrichten/starthilfe-hersteller-carku-expandiert-europa-052200872.html","categoria":"INNOVATION","lang":"en"},{"fonte":"Börse Global","pais":"Germany","titulo":"Navitas Semiconductor Stock: Magnachip Licenses GeneSiC Technology","resumo":"Navitas Semiconductor has formalized a licensing agreement for its GeneSiC technology with Magnachip.\nThe agreement covers the use of advanced silicon carbide components geared toward power electronics.\nThe cooperation seeks to accelerate the adoption of high energy-efficiency solutions in the industrial and electric vehicle sectors.\nThe initiative strengthens both companies' positions in the global semiconductor supply chain.","link":"https://www.boerse-global.de/navitas-semiconductor-corporation-aktie-magnachip-lizenziert-genesic-technologie/821955","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Nankai Railway adopts Hitachi technology emulating quantum computing to optimize operations","resumo":"Nankai Electric Railway has implemented a technological solution developed by Hitachi capable of simulating quantum computer processing. The innovation aims to restructure the operational management of its rail lines, optimizing vehicle and crew scheduling. With this new addition, the company anticipates a drastic reduction in the time required to draw up these complex timetables, increasing public transportation efficiency.","link":"https://news.yahoo.co.jp/articles/928419d72fbd757b22333e9f48cd36b49b275349","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"a.u-tokyo.ac.jp","pais":"Japan","titulo":"University of Tokyo research reveals Japanese forests absorb double the estimated CO₂","resumo":"Studies conducted by the University of Tokyo on the forest green transformation initiative indicate that Japan's carbon absorption capacity is substantially higher than previously calculated. New measurements show that the volume retained by the country's forested areas is nearly double traditional estimates. The discovery provides crucial scientific data to improve environmental policies and carbon neutrality strategies.","link":"https://www.a.u-tokyo.ac.jp/news/news_20260824-1.html","categoria":"SCIENCE","lang":"en"},{"fonte":"日本経済新聞","pais":"Japan","titulo":"Japan's Digital Minister visits the United States to inspect artificial intelligence and autonomous driving","resumo":"Japan's Minister for Digital Affairs will take an official trip to the United States to closely examine recent advancements in artificial intelligence and autonomous vehicles. The agenda includes strategic meetings with experts and visits to cutting-edge North American technology centers. The government delegation's goal is to absorb international best practices to accelerate digital transformation and regulate AI within Japanese territory.","link":"https://www.nikkei.com/article/DGXZQOUA252F40V20C26A8000000/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"MONOist","pais":"Japan","titulo":"Sleepisol+ Device Uses Brainwave Synchronization Technology to Improve Sleep Quality","resumo":"Developed with cutting-edge embedded systems technology, the Sleepisol+ wearable device promises to help combat sleep disorders. The gadget uses stimuli based on a proprietary brainwave synchronization technique to induce relaxation in a non-invasive manner. This innovation reinforces the growth of the digital health market in Japan, offering technological alternatives for daily wellness.","link":"https://monoist.itmedia.co.jp/mn/articles/2608/25/news003.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"News On AIR","pais":"Japan","titulo":"Japan and India Strengthen Defense Technology Partnership and Sign Maritime Security Agreement","resumo":"Representatives from the governments of Japan and India have signed an agreement to deepen bilateral collaboration in the development of military and defense technologies. The commitment includes signing a memorandum focused specifically on cooperation and protection in maritime security. The alliance aims to strengthen regional stability in the Indo-Pacific and drive technological innovation in the defense sector of both nations.","link":"https://newsonair.gov.in/defence-minister-rajnath-singh-japanese-counterpart-shinjiro-koizumi-co-chair-india-japan-defence-ministers-meeting/","categoria":"DEFENSE","lang":"en"},{"fonte":"ITmedia","pais":"Japan","titulo":"Shimizu Corporation and Institute of Science Tokyo Establish Center Focused on Sustainable Building Upcycling","resumo":"Construction firm Shimizu Corporation has formed an academic partnership with the Institute of Science Tokyo to launch a research base dedicated to construction upcycling. The project will study innovative methods to renovate and reuse urban structures sustainably, reducing waste disposal and emissions in the civil construction industry. The initiative reflects the new industrial trend of a circular economy applied to infrastructure.","link":"https://built.itmedia.co.jp/bt/articles/2608/25/news067.html","categoria":"ENGINEERING","lang":"en"},{"fonte":"下野新聞社","pais":"Japan","titulo":"Tochigi Prefecture Adopts Digital Technologies and Automated Feeding to Boost Aquaculture","resumo":"Trout and ayu fish producers in Tochigi Prefecture have joined forces to create an association dedicated to modernizing the local aquaculture sector. The group plans to implement smart automated feeding systems and data monitoring to optimize the management of breeding tanks. The digital transformation in the field aims to increase regional productivity and bypass labor shortages in fish farming.","link":"https://www.shimotsuke.co.jp/articles/-/1409006","categoria":"INNOVATION","lang":"en"},{"fonte":"bestcarweb.jp","pais":"Japan","titulo":"Nissan CEO Outlines Automaker's Future Plans and Raises Expectations for the Return of the Silvia Sports Car","resumo":"In statements regarding Nissan's future vision, CEO Ivan Espinosa signaled the intention to maintain a strong lineup of sports cars for the brand. The executive rekindled rumors in the automotive industry by commenting favorably on the possible reintroduction of the legendary Silvia model. The company's strategic plans seek to balance fleet technological innovation with the revival of icons that shaped automotive history.","link":"https://bestcarweb.jp/feature/column/1586560","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"ncsti.gov.cn","pais":"China","titulo":"Breakthroughs in Reusable Rockets and Perovskite Solar Energy Stand Out in China","resumo":"Highlights in Chinese cutting-edge technology include the successful completion of the first ground landing support leg recovery test of the Zhuque-3 rocket, a crucial milestone for the country's space program.\nAdditionally, researchers at Peking University have achieved a new breakthrough in the yield and stability of perovskite photovoltaic cells.\nSuch innovations reinforce China's competitiveness in both the commercial aerospace sector and the transition to renewable energy.","link":"https://www.ncsti.gov.cn/kjdt/kjrd/qtrd_kjrd/202608/t20260825_254361.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Quantum Insider","pais":"China","titulo":"China Puts Quantum Technology Among Priorities in New 2030 Cyber Industry Plan","resumo":"China has formally included quantum technology as one of its top priorities in its new 2030 cyber industry development plan.\nThe initiative aims to strengthen the country's technological sovereignty by accelerating research in quantum computing, cryptography, and communications.\nWith this move, Beijing seeks to consolidate its global leadership in advanced digital infrastructure and cybersecurity.\nA significant increase in state and private investment in the sector is expected over the coming years.","link":"https://thequantuminsider.com/2026/08/24/china-puts-quantum-technology-among-priorities-in-new-2030-cyber-industry-plan/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"hi.chinanews.com.cn","pais":"China","titulo":"Consortium of Chinese State-Owned Enterprises Accelerates Advances in 6G Technology","resumo":"A consortium led by China's top state-owned enterprises has joined forces to drive and accelerate research into 6G communication networks.\nThe group focuses on overcoming critical technological bottlenecks and establishing international standards for the next wireless generation.\nThe initiative aims to ensure the country maintains its leadership in global telecommunications infrastructure following its dominance in 5G.\nThe project will integrate artificial intelligence and satellite communications with high-speed terrestrial networks.","link":"http://www.hi.chinanews.com.cn/hnnew/2026-08-25/744878.html","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"africanews.com","pais":"China","titulo":"Technology: Crowds Flock to Beijing for Robot Games and Competitions","resumo":"Thousands of visitors and tech enthusiasts gathered in Beijing to watch the games and exhibitions of the city's robotics conference.\nThe event highlighted cutting-edge humanoid robots, industrial automatons, and personal assistance devices developed by startups and industry giants.\nThe high public turnout reflects strong grassroots enthusiasm and China's massive investment in advanced automation.\nThe sector is viewed by the government as a fundamental pillar for transforming the national economy and industry.","link":"https://www.africanews.com/2026/08/24/technology-crowds-flock-to-beijing-for-robot-games/","categoria":"ROBOTICS","lang":"en"},{"fonte":"Pplware","pais":"China","titulo":"Aggressive Robot Attacks Five-Year-Old Child at Science Museum in China","resumo":"An unusual and alarming incident occurred at a science museum in China, where an interactive robot ended up injuring a five-year-old girl.\nThe case raised concerns about safety protocols and the intelligence of autonomous systems operating in public spaces with children.\nVideos and reports of the incident quickly went viral on Chinese social media, sparking an intense debate about the regulation of the field.\nLocal authorities and the manufacturers are investigating the programming or sensor failure that caused the accident.","link":"https://pplware.sapo.pt/gadgets/hardware/robo-agrediu-crianca-de-cinco-anos-em-museu-de-ciencia-na-china/","categoria":"ROBOTICS","lang":"en"},{"fonte":"新京报","pais":"China","titulo":"Huairou Science City Welcomes New National Energy Innovation Platform","resumo":"With construction scheduled to begin in late September, Huairou Science City will integrate yet another national innovation platform focused on the energy transition.\nThe new research complex aims to accelerate the development of clean energy technologies, advanced storage, and smart grids.\nThe project strengthens Beijing's role as a global hub for cutting-edge scientific research and technological infrastructure.\nThe facility will serve both national strategic demands and international scientific partnerships.","link":"https://www.bjnews.com.cn/detail/1787627937129099.html","categoria":"SCIENCE","lang":"en"},{"fonte":"央视网","pais":"China","titulo":"China's National Public Data Platform Exceeds 300,000 Records","resumo":"China's official public data resource registration platform has reached the milestone of over 300,000 registered items, covering 97 economic categories.\nThe system aims to organize, integrate, and facilitate the secure sharing of large volumes of data between the public and private sectors.\nThis infrastructure is considered vital to driving the digital economy and artificial intelligence-based governance in the country.\nThe advance represents a significant step in consolidating data as a national strategic economic asset.","link":"https://news.cctv.cn/2026/08/25/ARTIBq2UhMh0heF63RMRA99t260825.shtml","categoria":"BIG DATA","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"Second Edition of Global Technological Innovation Competition Launched in Zhejiang","resumo":"Zhejiang Province officially opened the second edition of the Global Technological Innovation Competition, attracting global startups, researchers, and inventors.\nThe event seeks to identify and fund disruptive projects in areas such as artificial intelligence, biotechnology, and advanced materials.\nIn addition to financial prizes, winners will receive incubation support and direct access to the region's industrial ecosystem.\nThe initiative reinforces China's ongoing strategy to attract top international talent and technologies.","link":"https://www.stdaily.com/web/gdxw/2026-08/24/content_569045.html","categoria":"INNOVATION","lang":"en"},{"fonte":"The New Indian Express","pais":"India","titulo":"Adopt Advanced Technology for Online Services, Urges Chandrababu Naidu","resumo":"Andhra Pradesh Chief Minister Chandrababu Naidu advocated for the modernization of public services.\nThe initiative prioritizes the adoption of cutting-edge technologies to optimize citizen services and reduce costs.\nThe move reinforces the ongoing digital transformation in Indian public administration and its social impact.","link":"https://www.newindianexpress.com/states/andhra-pradesh/2026/Aug/25/adopt-advanced-technology-for-online-services-ap-cm-chandrababu-naidu","categoria":"DIGITAL GOVERNMENT","lang":"en"},{"fonte":"TV BRICS","pais":"India","titulo":"India Projects Space Economy Expansion to $44 Billion","resumo":"India has set a bold target to expand its space sector and reach the $44 billion mark.\nThe plan includes incentivizing private startups, developing new satellites, and strengthening commercial missions.\nThis expansion will solidify the strategic position of the Indian aerospace industry on the international stage.","link":"https://tvbrics.com/pt/news/ndia-projeta-expans-o-da-economia-espacial-para-us-44-bilh-es/","categoria":"SCIENCE","lang":"en"},{"fonte":"Tek Notícias","pais":"Portugal","titulo":"Portugal enters the stealth race with graphene technology to make drones radar-invisible","resumo":"Researchers and companies in Portugal are developing advanced graphene-based solutions for application in the defense and aerospace industries.\nThe new technology promises to absorb radar waves and make unmanned aerial vehicles practically undetectable.\nThe breakthrough positions the country as a promising ecosystem in the development of strategic systems and high-end military technology.","link":"https://tek.sapo.pt/noticias/computadores/artigos/portugal-entra-na-corrida-stealth-com-tecnologia-de-grafeno-que-pode-tornar-os-drones-invisiveis-aos-radares/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Use of AI as a writing assistant reduces linguistic singularity","resumo":"Recent studies indicate that the massive adoption of artificial intelligence in text generation and revision is standardizing writing styles.\nAlthough the tool increases productivity, there is a progressive loss of vocabulary diversity and the language's cultural nuances.\nExperts warn of the risk of linguistic impoverishment as algorithms shape human communication.","link":"https://www.cmjornal.pt/tecnologia/detalhe/uso-da-ia-como-assistente-de-escrita-reduz-a-singularidade-linguistica","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Jornal de Negócios","pais":"Portugal","titulo":"Seven Asian tech giants begin to overshadow US companies","resumo":"A new group of Asian tech companies has been gaining prominence in the global financial market and challenging North American hegemony.\nDriven by innovations in semiconductors, artificial intelligence, and advanced hardware, these companies are attracting billions in investments.\nThe movement consolidates Asia as a hub of leadership and technological transformation on the global stage.","link":"https://www.jornaldenegocios.pt/empresas/tecnologias/detalhe/sete-espadachins-da-tecnologia-asiatica-comecam-a-ofuscar-as-magnificas-dos-eua","categoria":"TECH MARKET","lang":"en"},{"fonte":"Observador","pais":"Portugal","titulo":"Scientists develop vaccine that protected mice against three flu strains","resumo":"Researchers have achieved a promising breakthrough in the pursuit of a universal flu vaccine by successfully immunizing mice against multiple variants of the virus.\nThe formula uses an innovative molecular approach that stimulates a broad and long-lasting immune response.\nIf human trials confirm its efficacy, the discovery could revolutionize the prevention of global epidemics.","link":"https://observador.pt/2026/08/24/cientistas-produzem-vacina-que-protegeu-ratos-contra-tres-estirpes-do-virus-da-gripe/","categoria":"SCIENCE","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"Society increasingly delegates cognitive functions to technology","resumo":"The continuous advancement of automated systems and artificial intelligence is transforming the human relationship with learning and memory.\nExperts warn that excessive reliance on algorithms to make daily decisions can alter basic cognitive processes.\nThis reflection raises important debates about the need to keep analytical skills active in everyday life.","link":"https://expresso.pt/sociedade/2026-08-24-estamos-a-delegar-cada-vez-mais-funcoes-cognitivas-na-tecnologia-dc2a0c81","categoria":"INNOVATION","lang":"en"},{"fonte":"facebook.com","pais":"Portugal","titulo":"Expansion of the Terinov science park marks a new cycle of innovation in the Azores","resumo":"The inauguration of the expansion works for the Terinov science and technology park reinforces the Azores' commitment to knowledge and innovation.\nThe project aims to attract cutting-edge companies and boost the internationalization of local scientific ecosystems.\nWith this expansion, the region seeks to strengthen its technological autonomy and create new opportunities for young talent.","link":"https://www.facebook.com/ObservadorOnTime/posts/na-inaugura%C3%A7%C3%A3o-das-obras-de-amplia%C3%A7%C3%A3o-do-terinov-o-governante-falou-sobre-a-inte/1457307726500506/","categoria":"SCIENCE","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"Robot accident leaves child injured and reignites safety debate","resumo":"An incident involving a robot caused injuries to a five-year-old girl, resulting in the child losing four teeth.\nThe case has gained international repercussion due to the lack of a compensation agreement between the parties involved.\nThe situation raised alarms regarding regulation, rigorous testing, and safety standards for robotic equipment.","link":"https://expresso.pt/china/2026-08-24-robo-deu-um-pontape-e-atingiu-a-no-rosto-menina-de-5-anos-perdeu-quatro-dentes-nao-ha-acordo-sobre-indemnizacao-59952b0f?shem=dsdf%2Csharefoc%2Cagadiscoversdl%2C%2Csh%2Fx%2Fdiscover%2Fm1%2F4","categoria":"ROBOTICS","lang":"en"},{"fonte":"Diario Digital Castelo Branco","pais":"Portugal","titulo":"Penamacor City Council invests in remote monitoring technology for the elderly","resumo":"The municipality of Penamacor is evaluating the implementation of technological solutions to monitor the health and safety of the elderly population from a distance.\nThe initiative aims to use sensors and smart devices to ensure continuous support without compromising residents' autonomy.\nThe measure seeks to address population aging and optimize public health services in the region.","link":"https://www.diariodigitalcastelobranco.pt/noticia/72541/camara-de-penamacor-atenta-a-tecnologia-de-monitorizacao-de-idosos-a-distancia","categoria":"DIGITAL HEALTH","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
</body>
