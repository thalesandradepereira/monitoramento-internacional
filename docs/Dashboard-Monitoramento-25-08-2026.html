  const data = [{"fonte":"O GLOBO","pais":"Brasil","titulo":"'Deepfake caseiro' dispara e vira nova ameaça de golpes e fraudes financeiras","resumo":"A popularização de ferramentas acessíveis de inteligência artificial permitiu que criminosos criem 'deepfakes caseiros' com facilidade alarmante.\nUtilizando simulações de áudio e vídeo de parentes ou executivos, golpistas têm clonado vozes e rostos para burlar sistemas de segurança e enganar vítimas.\nEspecialistas alertam para a necessidade urgente de cautela nas redes e da adoção de mecanismos robustos de verificação por instituições financeiras.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/25/deepfake-caseiro-dispara-e-ira-nova-ameaca-de-golpes-e-fraudes-financeiras.ghtml","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"Universidade Federal do Paraná","pais":"Brasil","titulo":"Ciência UFPR: Índice inova ao medir qualidade dos rios pela saúde dos peixes","resumo":"Pesquisadores da Universidade Federal do Paraná desenvolveram uma metodologia inovadora para avaliar a saúde dos ecossistemas aquáticos.\nO novo índice analisa indicadores biológicos e patologias encontradas na fauna de peixes locais, permitindo um diagnóstico mais preciso do impacto da poluição nos rios.\nA abordagem científica promete transformar a gestão ambiental e apoiar políticas públicas de conservação dos recursos hídricos no país.","link":"https://ufpr.br/ciencia-ufpr-indice-inova-ao-medir-qualidade-dos-rios-pela-saude-dos-peixes/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Câmeras, drones e tecnologia espacial ajudam Cedae a economizar R$ 70 milhões","resumo":"A Companhia Estadual de Águas e Esgotos do Rio de Janeiro adotou um ecossistema tecnológico avançado para otimizar a inspeção de suas redes operacionais.\nCom o uso de drones, sensores inteligentes e algoritmos inspirados em dados da Nasa, a empresa conseguiu mapear vazamentos e falhas com alta precisão.\nA modernização evitou o desperdício massivo de recursos e gerou uma economia expressiva de R$ 70 milhões para os cofres públicos.","link":"https://oglobo.globo.com/blogs/ancelmo-gois/post/2026/08/cameras-drones-e-ate-tecnologia-semelhante-a-da-nasa-ajudam-cedae-a-economizar-r-70-milhoes.ghtml","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Echo Boomer","pais":"Brasil","titulo":"Disney Plus repõe 4K com nova tecnologia, mas enfrenta disputa de patentes","resumo":"A plataforma de streaming Disney Plus reverteu restrições de qualidade e voltou a oferecer transmissões na resolução 4K por meio de novos codecs de vídeo.\nNo entanto, o avanço técnico resultou no surgimento de um embate judicial com a empresa de telecomunicações InterDigital sobre o licenciamento das tecnologias empregadas.\nO caso evidencia os crescentes desafios regulatórios e de propriedade intelectual enfrentados pelas gigantes globais do mercado de entretenimento digital.","link":"https://echoboomer.pt/disney-plus-4k-nova-tecnologia-disputa-patentes-interdigital/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"ANPD multa TikTok em R$ 153,7 milhões por falhas na proteção de menores","resumo":"A Autoridade Nacional de Proteção de Dados aplicou uma sanção milionária à plataforma TikTok devido a irregularidades no tratamento de dados de crianças e adolescentes.\nA investigação apontou fragilidades nos mecanismos de verificação de idade e na transparência do uso de informações pessoais dos jovens usuários brasileiros.\nA medida representa um marco rigoroso na fiscalização da privacidade digital e impõe adequações urgentes às redes sociais no Brasil.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/25/anpd-multa-tiktok-por-falhas-na-protecao-de-menores.ghtml","categoria":"REGULAMENTAÇÃO","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Câncer de próstata: por que a tecnologia HIFU leva tempo para ser reconhecida","resumo":"O ultrassom focado de alta intensidade (HIFU) surge como uma alternativa minimamente invasiva para o tratamento do câncer de próstata, reduzindo efeitos colaterais severos.\nApesar dos resultados promissores, a adoção em larga escala na rede pública e nos planos de saúde esbarra em exigências regulatórias e na necessidade de testes clínicos extensos.\nMédicos destacam que a consolidação de novas tecnologias médicas exige tempo para garantir total eficácia, segurança e custo-benefício aos pacientes.","link":"https://oglobo.globo.com/saude/gustavo-guimaraes/post/2026/08/cancer-de-prostata-por-que-uma-nova-tecnologia-nova-como-o-hifu-leva-tempo-para-ser-reconhecida.ghtml","categoria":"TECNOLOGIA MÉDICA","lang":"pt"},{"fonte":"Época Negócios","pais":"Brasil","titulo":"'Inteligência artificial fará a ciência avançar mais rápido do que nunca', afirma Nobel de Economia","resumo":"Em declaração recente, um laureado com o Prêmio Nobel de Economia destacou o papel transformador da inteligência artificial na pesquisa científica global.\nSegundo o especialista, a capacidade da IA de processar volumes massivos de dados e acelerar simulações promete revolucionar desde a medicina até a física de materiais.\nContudo, ele ressalta que o avanço acelerado exige diretrizes éticas claras para evitar riscos econômicos e concentração desmedida de poder tecnológico.","link":"https://epocanegocios.globo.com/inteligencia-artificial/noticia/2026/08/a-ideia-de-que-a-ia-de-alguma-forma-vai-controlar-a-humanidade-e-uma-bobagem-distopica-diz-premio-nobel-da-economia.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"www.gov.br","pais":"Brasil","titulo":"Fórum RNP debate soberania digital e inteligência artificial em Brasília","resumo":"O Ministério da Ciência, Tecnologia e Inovação promove o Fórum RNP para debater os rumos estratégicos da infraestrutura de pesquisa no Brasil.\nO evento reúne especialistas, gestores públicos e acadêmicos para discutir temas cruciais como soberania de dados, governança de dados e aplicação responsável da IA.\nAs diretrizes construídas no fórum visam fortalecer a autonomia tecnológica nacional e consolidar redes de conexão avançadas para o ambiente científico brasileiro.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/forum-rnp-2026-debate-soberania-digital-e-ia-em-brasilia","categoria":"INOVAÇÃO DIGITAL","lang":"pt"},{"fonte":"Technology Networks","pais":"Estados Unidos","titulo":"FDA Aprova Teste de Sangue para Detecção do Mal de Alzheimer","resumo":"A FDA concedeu aprovação para um inovador teste de sangue capaz de identificar a doença de Alzheimer de forma precoce.\nA nova tecnologia promete revolucionar o diagnóstico médico, substituindo exames invasivos e de alto custo por uma simples coleta de sangue.\nEstudos indicam que a detecção antecipada permite intervenções terapêuticas mais eficazes e acessíveis para os pacientes.\nEssa conquista representa um marco significativo na medicina diagnóstica e na saúde pública global.","link":"https://www.technologynetworks.com/tn/news/fda-clears-blood-test-for-alzheimers-disease-detection-415946","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Estados Unidos","titulo":"Meta Vai a Julgamento Enquanto o Vale do Silício Enfrenta Reação Negativa Crescente","resumo":"A gigante Meta enfrenta um julgamento decisivo nos Estados Unidos focado no impacto de suas redes sociais na saúde mental de jovens.\nO caso reflete uma onda crescente de escrutínio regulatório e judicial contra as principais empresas do Vale do Silício.\nEspecialistas apontam que o desfecho pode impor novas obrigações legais e mudar o modelo de negócios das plataformas digitais.\nA pressão pública e governamental sinaliza uma virada histórica na regulamentação das redes sociais no país.","link":"https://www.theguardian.com/global/2026/aug/25/meta-trial-silicon-valley","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Quantum Insider","pais":"Estados Unidos","titulo":"GSA Delineia Transição para Tecnologia Resistente à Computação Quântica","resumo":"A Administração de Serviços Gerais dos EUA (GSA) apresentou um plano estratégico para migrar seus sistemas para criptografia pós-quântica.\nA iniciativa visa proteger dados governamentais críticos contra futuras ameaças de hackers que utilizem computadores quânticos avançados.\nO movimento estabelece novas diretrizes para a infraestrutura de TI do setor público e fornecedores de tecnologia.\nA transição é vista como um passo essencial para garantir a segurança nacional na era da computação quântica.","link":"https://thequantuminsider.com/2026/08/25/gsa-outlines-transition-to-quantum-resistant-technology/","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"The Quantum Insider","pais":"Estados Unidos","titulo":"Pesquisadores do NIST Ampliam Tecnologia Quântica para Detectar Fótons Fracos","resumo":"Cientistas do NIST desenvolveram uma nova abordagem quântica capaz de ampliar a sensibilidade na detecção de fótons de baixa intensidade.\nA inovação supera limitações anteriores e permite a captação de sinais luminosos extremamente tênues com precisão sem precedentes.\nEssa descoberta traz avanços significativos para áreas como comunicação quântica, astrofísica e imagem biomédica.\nO avanço reforça a liderança dos institutos de pesquisa americanos no desenvolvimento de tecnologias quânticas aplicadas.","link":"https://thequantuminsider.com/2026/08/25/nist-researchers-supersize-quantum-technology-to-help-detect-faint-photons/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Technology Networks","pais":"Estados Unidos","titulo":"Nova Plataforma de Hidrogel Simplifica a Criação de Modelos de Tecidos Vivos","resumo":"Bioengenheiros criaram uma plataforma baseada em hidrogel que facilita a fabricação tridimensional de modelos de tecidos vivos em laboratório.\nA tecnologia permite cultivar células com maior fidelidade estrutural e funcional às condições biológicas reais do corpo humano.\nEssa inovação deve acelerar o desenvolvimento de novos medicamentos e reduzir a dependência de testes em animais.\nTrata-se de um salto promissor para a medicina regenerativa e para a pesquisa farmacológica moderna.","link":"https://www.technologynetworks.com/applied-sciences/news/new-hydrogel-platform-simplifies-the-creation-of-living-tissue-models-415887","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"McKinsey \u0026 Company","pais":"Estados Unidos","titulo":"O Estado da IA em 2026: Na Rota do Retorno Sobre o Investimento","resumo":"Um novo relatório analisa o panorama da Inteligência Artificial em 2026, destacando a busca prioritária por retorno financeiro.\nApós anos de investimentos maciços em infraestrutura e modelos generativos, as empresas agora focam em aplicações comerciais viáveis.\nA transição marca uma fase de maturidade no setor, onde a eficiência operacional se torna a métrica principal de sucesso.\nO estudo aponta quais setores estão liderando a adoção prática e obtendo resultados concretos com a tecnologia.","link":"https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"CNN","pais":"Estados Unidos","titulo":"Como a Tecnologia Espacial Continua a Remodelar a Vida na Terra","resumo":"Inovações desenvolvidas para a exploração espacial continuam gerando impactos diretos e benéficos no cotidiano da sociedade terrestre.\nSistemas de rastreamento climático, materiais avançados e tecnologias de purificação de água são alguns dos derivados espaciais.\nO setor comercial de espaço tem impulsionado a criação de soluções sustentáveis para desafios ambientais e urbanos.\nEssa convergência reafirma o valor estratégico dos investimentos em ciência espacial para o progresso global.","link":"https://www.cnn.com/2026/08/25/world/video/space42-space-satellite-ai-earth-observation-global-connectivity","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"inc.com","pais":"Estados Unidos","titulo":"Tirando Fotos nas Férias? A Ciência Diz que Você Pode Estar Apagando Suas Próprias Memórias","resumo":"Pesquisas científicas recentes revelam que o hábito frequente de fotografar momentos de lazer pode prejudicar a memória de longo prazo.\nO fenômeno ocorre porque o cérebro delega a retenção de detalhes ao dispositivo digital, diminuindo o processamento cognitivo interno.\nEspecialistas sugerem que viver a experiência de forma consciente fortalece as lembranças mais do que registrar imagens constantemente.\nO estudo acende um debate relevante sobre como a dependência da tecnologia afeta a cognição humana.","link":"https://www.inc.com/jessica-stillman/taking-vacation-photos-science-says-youre-erasing-your-own-memories/91395078","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"TF1 Info","pais":"França","titulo":"\"É uma distopia, uma ficção científica\": Rússia utilizou drone pilotado por IA para atacar na Ucrânia","resumo":"O uso de inteligência artificial em conflitos armados atingiu um novo patamar com a implantação de drones autônomos por forças russas na Ucrânia.\nEspecialistas e observadores internacionais alertam para os riscos éticos e militares associados à automação de decisões letais no campo de batalha.\nO episódio reforça o debate global sobre a necessidade urgente de regulamentar tecnologias de IA empregadas em sistemas de armas.","link":"https://www.tf1info.fr/international/videos/video-c-est-une-dystopie-une-science-fiction-la-russie-s-est-servie-d-un-drone-pilote-par-ia-pour-frapper-en-ukraine-53298-2460283.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Eles vivem mais de 110 anos: a ciência acaba de entender o segredo de sua longevidade","resumo":"Pesquisadores alcançaram um avanço significativo na compreensão dos fatores genéticos e biológicos que permitem a supercentenários ultrapassarem os 110 anos.\nEstudos detalhados apontam para mecanismos únicos de reparo celular e imunidade resiliente presentes no organismo dessas pessoas.\nEssa descoberta abre portas para futuras intervenções médicas capazes de promover o envelhecimento saudável e prevenir doenças degenerativas.","link":"https://www.science-et-vie.com/corps-et-sante/ils-vivent-plus-de-110-ans-la-science-vient-de-comprendre-le-secret-de-leur-longevite-255960.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"terre.defense.gouv.fr","pais":"França","titulo":"Inovação e excelência: a ENSOA integra tecnologia de ponta no treinamento de tiro","resumo":"A Escola Nacional de Suboficiais da Ativa (ENSOA) na França adotou modernas tecnologias de ponta em seus programas de treinamento de tiro.\nA iniciativa inclui o uso de simuladores avançados e ferramentas digitais para otimizar a precisão, segurança e eficiência dos instruendos.\nA modernização reflete a crescente transformação digital e a busca por inovação no setor de defesa e instrução militar.","link":"https://www.terre.defense.gouv.fr/ensoa_1/actualites/innovation-excellence-lensoa-integre-technologie-pointe-formation-au-tir","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Sortir à Paris","pais":"França","titulo":"Festa da Ciência 2026: alimentos, ciência e sabores se encontram no Grand Palais","resumo":"O emblemático Grand Palais, em Paris, será palco de uma programação especial dedicada à química, física e biologia por trás da gastronomia.\nO evento integra a programação da Festa da Ciência 2026, oferecendo workshops interativos e demonstrações científicas para o público de todas as idades.\nA iniciativa busca aproximar a população das pesquisas sobre nutrição, sustentabilidade alimentar e inovação culinária.","link":"https://www.sortiraparis.com/enfant-famille/articles/34130-fete-de-la-science-2026-aliments-science-et-saveurs-se-rencontrent-au-grand-palais","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Sortir à Paris","pais":"França","titulo":"Festa da Ciência 2026: mergulhe no mundo das ciências em Orsay","resumo":"A cidade de Orsay, renomada por seu polo acadêmico e científico, prepara atrações especiais para a Festa da Ciência de 2026.\nVisitantes poderão conhecer laboratórios de ponta, interagir com pesquisadores e participar de experiências práticas em diversas áreas do conhecimento.\nO evento visa impulsionar a divulgação científica e incentivar o interesse de jovens estudantes pelas carreiras de inovação e tecnologia.","link":"https://www.sortiraparis.com/enfant-famille/articles/333195-fete-de-la-science-2026-plongez-dans-le-monde-des-sciences-a-orsay-91","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Sortir à Paris","pais":"França","titulo":"Festa da Ciência 2026: visitas e oficinas em família no Parc aux Étoiles","resumo":"O Parc aux Étoiles, localizado no departamento de Yvelines, oferecerá oficinas práticas e observações guiadas durante a Festa da Ciência.\nAs atividades foram desenvolvidas especialmente para integrar famílias ao universo da astronomia e da exploração espacial.\nA iniciativa destaca a importância da democratização do acesso à ciência e do estímulo à curiosidade astronômica desde a infância.","link":"https://www.sortiraparis.com/enfant-famille/articles/282832-fete-de-la-science-2026-visites-et-ateliers-en-famille-au-parc-aux-etoiles-78","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Sortir à Paris","pais":"França","titulo":"Festa da Ciência 2026: eventos nas universidades e escolas de Paris e região","resumo":"Instituições de ensino superior e escolas de Paris e Île-de-France abrem suas portas para a edição 2026 da Festa da Ciência.\nA programação conta com palestras, exposições e experimentos conduzidos diretamente por alunos e pesquisadores universitários.\nO movimento fortalece o vínculo entre o meio acadêmico e a comunidade, destacando a produção científica regional.","link":"https://www.sortiraparis.com/enfant-famille/guides/282796-fete-de-la-science-2026-les-evenements-dans-les-universites-et-ecoles-a-paris-et-sa-region","categoria":"EDUCAÇÃO E CIÊNCIA","lang":"pt"},{"fonte":"Sortir à Paris","pais":"França","titulo":"Festa da Ciência 2026: uma viagem ao passado no Museu Arqueológico de Val d'Oise","resumo":"O Museu Arqueológico do departamento de Val d'Oise apresentará como técnicas científicas modernas ajudam a desvendar mistérios do passado.\nDurante a Festa da Ciência, os visitantes terão acesso a análises de artefatos antiquíssimos e à aplicação da tecnologia na preservação histórica.\nA programação destaca a interdisciplinaridade entre a ciência aplicada e a conservação do patrimônio cultural.","link":"https://www.sortiraparis.com/enfant-famille/articles/331910-fete-de-la-science-2026-un-voyage-dans-le-passe-au-musee-archeologique-du-val-d-oise-95","categoria":"ARQUEOLOGIA","lang":"pt"},{"fonte":"The Independent","pais":"Inglaterra","titulo":"A ciência revela o hormônio do amor que é fundamental para a sua conexão com seu gato","resumo":"Pesquisadores identificaram que o hormônio ocitocina desempenha um papel crucial no fortalecimento dos laços afetivos entre os gatos e seus tutores.\nO estudo demonstra que interações positivas e momentos de carinho elevam os níveis dessa substância em ambos, promovendo bem-estar mútuo.\nA descoberta ajuda a desmistificar a ideia de que os felinos são animais totalmente independentes e desprovidos de apego emocional.\nEssa evidência científica reforça a importância do convívio diário para a saúde mental dos animais de estimação.","link":"https://www.independent.co.uk/life-style/cats-pets-love-oxytocin-b3038856.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Inglaterra","titulo":"Reino Unido concede à Ucrânia acesso a tecnologia secreta de mísseis","resumo":"O governo britânico concordou em transferir tecnologia bélica confidencial para que as forças armadas ucranianas possam fabricar seus próprios armamentos de longo alcance.\nA iniciativa visa aumentar a autonomia militar de Kiev e fortalecer sua capacidade de defesa diante das investidas russas no território.\nEspecialistas apontam que essa cooperação técnica pode alterar significativamente o equilíbrio das operações no campo de batalha.\nO acordo também prevê apoio técnico contínuo para a modernização das linhas de produção ucranianas.","link":"https://www.moneycontrol.com/world/uk-is-giving-ukraine-access-to-secret-missile-technology-could-kyiv-soon-produce-its-own-long-range-weapons-article-14015148.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Inglaterra","titulo":"Rússia adverte que fábricas do Reino Unido podem virar alvo após envio de tecnologia de mísseis","resumo":"Autoridades russas emitiram um alerta severo indicando que instalações industriais britânicas podem se tornar alvos legítimos caso o Reino Unido continue fornecendo tecnologia militar à Ucrânia.\nA declaração surge como resposta direta ao anúncio do compartilhamento de sistemas avançados de mísseis de longo alcance.\nO movimento escala a tensão diplomática e militar entre Londres e Moscou, gerando apreensão sobre a segurança da infraestrutura de defesa britânica.\nPaíses alinhados à OTAN acompanham o desdobramento com atenção devido ao risco de ampliação do conflito.","link":"https://www.moneycontrol.com/world/russia-warns-uk-factories-could-face-attacks-after-britain-shares-missile-technology-with-ukraine-article-14015080.html","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"Grocery Gazette","pais":"Inglaterra","titulo":"Noble Foods testa tecnologia 'Happy-o-Meter' para monitorar o bem-estar das galinhas","resumo":"A produtora de ovos Noble Foods deu início aos testes do sistema 'Happy-o-Meter', uma solução tecnológica projetada para avaliar a saúde e o estresse das aves.\nUtilizando sensores e análise de dados em tempo real, a ferramenta permite identificar alterações de comportamento e melhorar os padrões de manejo nas fazendas.\nA iniciativa busca responder à crescente demanda dos consumidores por práticas mais éticas e sustentáveis na pecuária industrial.\nSe os testes forem bem-sucedidos, a tecnologia poderá ser expandida para toda a cadeia de suprimentos da empresa.","link":"https://www.grocerygazette.co.uk/2026/08/25/noble-foods-trials-happy-o-meter-technology-to-monitor-hen-welfare/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Anadolu Ajansı","pais":"Inglaterra","titulo":"Chefe de tecnologia da UE alerta sobre o risco de a IA perder o controle humano","resumo":"A autoridade de tecnologia da União Europeia expressou forte preocupação com o ritmo acelerado de desenvolvimento dos sistemas de inteligência artificial.\nO alerta destaca a urgência de implementar regulamentações rigorosas para evitar que algoritmos tomem decisões autônomas sem a devida supervisão humana.\nEspecialistas defendem que a falta de governança global pode trazer riscos sistêmicos para a segurança, o mercado de trabalho e a privacidade.\nO debate reforça a busca por um equilíbrio entre o incentivo à inovação e a mitigação de perigos tecnológicos.","link":"https://www.aa.com.tr/en/europe/eu-technology-chief-warns-of-ai-losing-human-control/4036547","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"GOV.UK","pais":"Inglaterra","titulo":"Nova parceria entre Reino Unido e Ucrânia focará em tecnologias decisivas com acesso aos laboratórios de IA Avengers","resumo":"Reino Unido e Ucrânia firmaram uma parceria estratégica para o desenvolvimento de soluções tecnológicas avançadas voltadas para o cenário de defesa.\nO acordo concede ao governo britânico acesso direto aos Avengers AI Labs, centros de inovação ucranianos especializados em inteligência artificial aplicada.\nA colaboração busca acelerar a criação de ferramentas capazes de conceder vantagens táticas no campo de batalha moderno.\nAlém de impulsionar a tecnologia militar, a aliança fortalece o intercâmbio científico e de inteligência entre as duas nações.","link":"https://www.gov.uk/government/news/new-partnership-set-to-see-the-uk-and-ukraine-develop-battle-winning-technology-as-britain-secures-access-to-ukraines-avengers-ai-labs","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Híbridos y Eléctricos","pais":"Espanha","titulo":"Nem inspeção nem blitz: Espanha já testa tecnologia que detecta a poluição de um carro em segundos","resumo":"A Espanha começou a testar uma nova tecnologia capaz de medir as emissões poluentes dos veículos em tempo real, sem a necessidade de paradas em blitzes ou inspeções veiculares tradicionais. O sistema utiliza sensores avançados instalados nas vias para capturar e analisar os gases expelidos pelos automóveis em questão de segundos. A iniciativa visa identificar rapidamente os veículos mais poluentes e otimizar a fiscalização ambiental nas estradas e cidades espanholas.","link":"https://www.hibridosyelectricos.com/coches/ni-itv-ni-control-en-carretera-espana-ya-prueba-tecnologia-detecta-cuanto-contamina-coche-en-cuestion-segundos_88894_102.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Investing.com España","pais":"Espanha","titulo":"CGI faz parceria com a AgVantis para modernizar a tecnologia do Farm Credit","resumo":"A empresa de serviços de TI CGI anunciou uma colaboração estratégica com a AgVantis para transformar e modernizar a infraestrutura tecnológica do sistema Farm Credit. O projeto busca otimizar os processos de crédito agrícola, oferecendo soluções digitais mais ágeis e seguras para os produtores. Essa parceria impulsiona a eficiência operacional no setor financeiro voltado ao agronegócio por meio da digitalização de serviços essenciais.","link":"https://es.investing.com/news/company-news/cgi-se-asocia-con-agvantis-para-modernizar-la-tecnologia-de-farm-credit-93CH-3809777","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"El Economista","pais":"Espanha","titulo":"A espanhola Altum Sequencing busca cinco milhões para acelerar sua tecnologia de detecção precoce do câncer","resumo":"A startup espanhola de biotecnologia Altum Sequencing abriu uma rodada de financiamento de cinco milhões de euros para impulsionar o desenvolvimento e a comercialização de sua plataforma de diagnóstico. A tecnologia inovadora da empresa permite identificar recaídas de câncer de forma altamente precisa e precoce através de sequenciamento genético. Os recursos captados serão fundamentais para acelerar ensaios clínicos e expandir a presença da solução no mercado de saúde global.","link":"https://www.eleconomista.es/salud-bienestar/noticias/14009795/08/26/la-espanola-altum-sequencing-busca-cinco-millones-para-acelerar-su-tecnologia-de-deteccion-precoz-del-cancer.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"diariodetenerife.info","pais":"Espanha","titulo":"Tenerife transforma o material vegetal do dragoeiro de La Laguna em uma oportunidade para a pesquisa e inovação","resumo":"O governo da ilha de Tenerife está reaproveitando resíduos e materiais vegetais do histórico dragoeiro de La Laguna para impulsionar projetos de pesquisa e inovação científica. A iniciativa une preservação botânica e ciência aplicada, explorando as propriedades biológicas únicas da planta típica das Ilhas Canárias. O projeto fortalece o ecossistema científico local ao transformar o patrimônio natural em uma fonte de estudo sustentável e inovação.","link":"https://www.diariodetenerife.info/tenerife-convierte-material-vegetal-drago-laguna-oportunidad-investigacion-ciencia-innovacion/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"IFEMA Madrid","pais":"Espanha","titulo":"Ônibus autônomos na Espanha: tecnologia e futuro","resumo":"A Espanha avança na implementação de ônibus autônomos como parte de sua estratégia de modernização do transporte público e mobilidade urbana sustentável. Diversos projetos-piloto no país testam veículos elétricos guiados por inteligência artificial e sensores de alta precisão em rotas urbanas. Essa transformação tecnológica promete aumentar a eficiência, reduzir emissões de carbono e redefinir o futuro do transporte coletivo nas cidades espanholas.","link":"https://www.ifema.es/noticias/motor/autobuses-autonomos-espana-tecnologia-transporte","categoria":"MOBILIDADE","lang":"pt"},{"fonte":"ELLE","pais":"Espanha","titulo":"As 40 mulheres espanholas fabulosas no mundo da ciência e da tecnologia","resumo":"Uma seleção especial destaca 40 mulheres espanholas que estão liderando pesquisas fundamentais e transformações tecnológicas marcantes em diversas áreas do conhecimento. A lista celebra trajetórias inspiradoras na física, biotecnologia, engenharia e inteligência artificial, promovendo a visibilidade feminina no ecossistema científico. A iniciativa evidencia o impacto crucial do talento feminino para o avanço da inovação e do desenvolvimento tecnológico no país.","link":"https://www.elle.com/es/living/ocio-cultura/g73509813/40-mujeres-ciencia-tecnologia-elle/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Spektrum der Wissenschaft","pais":"Alemanha","titulo":"Telescópio Espacial Nancy Grace Roman: Sinal verde para novo observatório espacial","resumo":"O Telescópio Espacial Nancy Grace Roman recebeu autorização final para dar início às suas operações e fases decisivas de lançamento.\nA missão promete revolucionar a astrofísica ao investigar a energia escura, a matéria escura e exoplanetas distantes com precisão inédita.\nO novo observatório amplia a capacidade de mapeamento do universo e traz avanços científicos estratégicos para a comunidade internacional.","link":"https://www.spektrum.de/news/start-frei-fuer-das-weltraumteleskop-nancy-grace-roman/2341474","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"ChatGPT: Lançamento de anúncios publicitários na Alemanha","resumo":"A OpenAI iniciou a integração de anúncios publicitários na versão do ChatGPT distribuída no mercado alemão.\nA mudança visa monetizar a crescente base de usuários ativos e diversificar o modelo de negócios da ferramenta de inteligência artificial.\nEspecialistas monitoram os impactos dessa decisão na experiência do usuário e no mercado europeu de publicidade digital.","link":"https://www.sueddeutsche.de/wirtschaft/werbung-chatgpt-deutschland-li.3536236","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"SAPO","pais":"Alemanha","titulo":"Quando o clima trava a economia: seca nos rios ameaça recuperação da Alemanha","resumo":"A redução nos níveis de água dos principais rios alemães está dificultando o transporte hidroviário de mercadorias cruciais para a indústria.\nO fenômeno climático prejudica cadeias de suprimentos estratégicas e impõe custos logísticos elevados para empresas locais.\nAnalistas alertam que o agravamento da seca pode frear a recente recuperação econômica observada no país.","link":"https://sapo.pt/artigo/quando-o-clima-trava-a-economia-seca-nos-rios-ameaca-recuperacao-da-alemanha-6a8d79c6d0cbd78bc7d82f17","categoria":"CLIMA","lang":"pt"},{"fonte":"Jornal Económico","pais":"Alemanha","titulo":"Volkswagen: Alemanha deve absorver metade das demissões adicionais, diz CEO","resumo":"O CEO do Grupo Volkswagen confirmou que cerca de metade das demissões planejadas na reestruturação global afetará funcionários na Alemanha.\nA medida reflete a forte pressão por redução de custos diante da transição para veículos elétricos e da concorrência global.\nSindicatos e representantes trabalhistas locais preparam negociações para amenizar os impactos nas fábricas do país.","link":"https://jornaleconomico.sapo.pt/noticias/volkswagen-alemanha-devera-absorver-metade-dos-despedimentos-adicionais-diz-ceo/","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"1\u00261","pais":"Alemanha","titulo":"Plano de Merz para a economia alemã: \"Estar no topo do mundo\"","resumo":"O líder político Friedrich Merz apresentou uma estratégia focada em impulsionar a competitividade industrial da Alemanha.\nAs propostas incluem desregulamentação, incentivos fiscais e modernização tecnológica para recolocar o país na liderança global.\nO plano visa responder às exigências do setor produtivo por reformas estruturais diante dos desafios econômicos atuais.","link":"https://home.1und1.de/magazine/politik/videos/shorts/inland/merz-plan-deutsche-wirtschaft-weltspitze-stehen-42649582","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Euronews","pais":"Alemanha","titulo":"Alemanha: Economia cresce acima do previsto com recuperação das exportações","resumo":"O Produto Interno Bruto da Alemanha registrou crescimento no segundo trimestre, superando as estimativas dos analistas econômicos.\nA recuperação foi impulsionada principalmente pela reação positiva do setor exportador e pela demanda global por manufaturados.\nApesar dos números favoráveis, economistas mantêm cautela devido às incertezas geopolíticas mundiais.","link":"https://pt.euronews.com/business/2026/08/25/alemanha-economia-cresce-acima-do-previsto-com-recuperacao-das-exportacoes","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Tagesspiegel","pais":"Alemanha","titulo":"Conjuntura: Economia alemã cresce, mas finanças públicas registram forte déficit","resumo":"Apesar da expansão recente no PIB alemão, o balanço das contas públicas revelou um déficit orçamentário expressivo para o período.\nO aumento dos gastos governamentais e custos de subsídios pressionam o orçamento federal em meio à retomada econômica.\nO cenário evidencia o desafio de equilibrar incentivos ao crescimento com a sustentabilidade fiscal exigida por lei.","link":"https://www.tagesspiegel.de/wirtschaft/konjunktur-deutsche-wirtschaft-wachst-starker-staat-tief-im-minus-15977842.html","categoria":"FINANÇAS","lang":"pt"},{"fonte":"NHKニュース","pais":"Japão","titulo":"Evento em Shizuoka apresenta as mais recentes tecnologias em robótica e inteligência artificial","resumo":"Um evento realizado na província de Shizuoka reuniu diversas inovações voltadas para o futuro da automação e da inteligência artificial. A exposição destacou o impacto prático de robôs de última geração e soluções tecnológicas aplicadas a diferentes setores da sociedade e da indústria. A iniciativa visa aproximar o público geral das novas tendências tecnológicas e incentivar a adoção de sistemas inteligentes no dia a dia.","link":"https://news.web.nhk/newsweb/na/nb-3030033239","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"China exibe avanço tecnológico em evento esportivo para robôs entre conquistas e falhas","resumo":"A China promoveu uma competição exclusiva para robôs com o objetivo de demonstrar sua crescente capacidade tecnológica e poder industrial. Embora diversos modelos tenham apresentado habilidades surpreendentes que superam capacidades humanas em tarefas específicas, o evento também registrou colisões e falhas operacionais. O espetáculo reflete a intensa corrida global pelo desenvolvimento da robótica e os desafios ainda existentes antes de sua plena maturidade.","link":"https://news.yahoo.co.jp/articles/59ef56fc2825362cb86106b896935f1132c5e728","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Neurocientistas alertam para a queda no raciocínio de crianças viciadas em vídeos curtos","resumo":"O aumento do consumo desenfreado de vídeos curtos em plataformas digitais está preocupando especialistas em neurociência no Japão. Estudos e alertas recentes indicam que esse hábito pode reduzir drasticamente a capacidade de concentração e o raciocínio crítico das crianças. Especialistas recomendam a imposição de limites de tempo de tela e maior conscientização familiar para mitigar os impactos negativos no desenvolvimento cognitivo infantil.","link":"https://news.yahoo.co.jp/articles/0f2ea9b0b4766d314a56400ba065bfb3d9b9109b","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Ucrânia e Reino Unido se unem para desenvolver inteligência artificial militar com dados de combate","resumo":"Pela primeira vez, a Ucrânia compartilhará dados estratégicos acumulados durante o conflito com a Rússia para desenvolver novas tecnologias de inteligência artificial militar em parceria com o Reino Unido. O acordo visa acelerar a criação de sistemas autônomos e ferramentas avançadas de análise no campo de batalha. A cooperação internacional marca um importante precedente no uso de dados reais de combate para o aprimoramento de sistemas de defesa.","link":"https://news.yahoo.co.jp/articles/0162a39abeb880bb2bff28d47420b99bb8e6cde1","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"soumu.go.jp","pais":"Japão","titulo":"Livro Branco de Comunicações do Japão alerta para perdas econômicas causadas por ciberataques","resumo":"O novo relatório governamental japonês sobre informação e comunicações destaca o impacto financeiro severo resultante de falhas e incidentes de cibersegurança. As perdas econômicas estão se multiplicando à medida que empresas e órgãos públicos se tornam cada vez mais dependentes de infraestruturas digitais. O documento enfatiza a urgência de investimentos estratégicos em defesa cibernética para proteger dados críticos e garantir a estabilidade do mercado nacional.","link":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r08/html/nd21a220.html","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"ibaraki.ac.jp","pais":"Japão","titulo":"Japão e Taiwan unem universidades para desenvolver tecnologia de emissão de luz polarizada","resumo":"Um simpósio realizado em Taiwan marcou o início de uma colaboração científica entre cinco universidades japonesas e taiwanesas. A parceria visa promover a pesquisa e o desenvolvimento da tecnologia de luminescência circularmente polarizada, considerada promissora para futuras aplicações em telas e dispositivos ópticos de última geração. O projeto reforça os laços acadêmicos e tecnológicos entre as duas regiões para acelerar inovações no setor de fotônica.","link":"https://www.ibaraki.ac.jp/news/n/2026/08/25015008.html","categoria":"CIÊNCIA E TECNOLOGIA","lang":"pt"},{"fonte":"株探","pais":"Japão","titulo":"Japão estabelece tecnologia doméstica para produção do metal raro háfnio visando 2028","resumo":"Pesquisadores e indústrias no Japão dominaram a tecnologia de fabricação interna do háfnio, um elemento raro crucial para a indústria de semicondutores e materiais avançados. A meta do país é iniciar a produção em massa da substância até 2028, reduzindo a dependência extrema de importações estratégicas. O avanço fortalece a soberania industrial e a segurança da cadeia de suprimentos de alta tecnologia do Japão.","link":"https://kabutan.jp/news/marketnews/?b=n202608250875","categoria":"INOVAÇÃO INDUSTRIAL","lang":"pt"},{"fonte":"a.u-tokyo.ac.jp","pais":"Japão","titulo":"Estudo da Universidade de Tóquio indica que absorção de CO₂ pelas florestas japonesas é o dobro do estimado","resumo":"Uma pesquisa inovadora conduzida pela Universidade de Tóquio demonstrou que a absorção real de dióxido de carbono pelas florestas do Japão é quase o dobro das estimativas anteriores. O estudo integra o projeto de Transformação Verde Florestal, focado em aplicar a ciência ao combate às mudanças climáticas. A descoberta traz novas perspectivas para as metas globais de descarbonização e para a valorização dos recursos naturais do país.","link":"https://www.a.u-tokyo.ac.jp/news/news_20260824-1.html","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"北京经济技术开发区","pais":"China","titulo":"Pequim lança plano 'AI4Chip' para impulsionar a indústria de circuitos integrados com inteligência artificial","resumo":"O governo de Pequim revelou um plano estratégico denominado 'AI4Chip' projetado para o período entre 2026 e 2028.\nA iniciativa visa integrar avanços em inteligência artificial ao ecossistema de projeto e fabricação de circuitos integrados, otimizando o desenvolvimento de semicondutores.\nO projeto busca acelerar a inovação tecnológica nacional e fortalecer a autonomia do setor de chips diante das restrições e concorrência globais.","link":"https://kfqgw.beijing.gov.cn/zwgkkfq/2024zcjd/202608/t20260825_4836426.html","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"大连理工大学新闻网","pais":"China","titulo":"Pesquisadores chineses publicam avanço em nanotubos de dicalcogeneto na revista Science","resumo":"Uma equipe de pesquisa do Departamento de Física da Universidade de Tecnologia de Dalian alcançou uma descoberta marcante no crescimento controlável de nanotubos.\nO trabalho foca no cultivo preciso de nanotubos de dicalcogenetos de metais de transição, uma classe crucial de materiais bidimensionais e semicondutores.\nA pesquisa foi destacada na prestigiada revista Science e promete abrir novas fronteiras para a fabricação de dispositivos nanoeletrônicos e optoeletrônicos de próxima geração.","link":"https://news.dlut.edu.cn/info/1024/149405.htm","categoria":"NANOTECNOLOGIA","lang":"pt"},{"fonte":"北京师范大学新闻网","pais":"China","titulo":"Universidade Normal de Pequim lança com sucesso a constelação de satélites 'Muduo-1'","resumo":"A Universidade Normal de Pequim realizou com sucesso o lançamento da constelação de satélites de experimentos científicos de sensoriamento remoto instantâneo 'Muduo-1'.\nOs novos satélites foram projetados para coletar dados orbitais de alta precisão e em tempo real para pesquisas ambientais e de observação terrestre.\nA missão fortalece a capacidade acadêmica e tecnológica do país na gestão de desastres, monitoramento climático e inovação em engenharia aeroespacial.","link":"https://news.bnu.edu.cn/zx/ttgz/a511a0533f4349f494a6fe2de507f517.htm","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"北京经济技术开发区","pais":"China","titulo":"Pequim divulga plano de ação para liderar a indústria de fabricação em nível atômico","resumo":"A Área de Desenvolvimento Econômico-Tecnológico de Pequim apresentou o plano de ação 2026-2028 voltado para a aplicação demonstrativa e inovação em manufatura atômica.\nA iniciativa foca na manipulação e montagem de matéria na escala de átomos individuais para criar materiais e componentes de altíssima precisão.\nO plano visa posicionar a região como um polo global pioneiro no desenvolvimento de tecnologias industriais e dispositivos quânticos de ponta.","link":"https://kfqgw.beijing.gov.cn/zwgkkfq/2024zcjd/202608/t20260825_4836432.html","categoria":"MANUFATURA AVANÇADA","lang":"pt"},{"fonte":"Al Jazeera","pais":"China","titulo":"Funcionários da Nvidia e Supermicro são indiciados por exportação ilegal de servidores de IA para a China","resumo":"Funcionários ligados às gigantes de tecnologia Nvidia e Supermicro foram acusados criminalmente por esquemas de exportação ilegal de servidores avançados de IA para a China.\nAs acusações alegam a violação deliberada dos controles e sanções comerciais impostos pelos Estados Unidos ao envio de hardware sensível de processamento.\nO caso evidencia as crescentes tensões geopolíticas e a batalha pelo controle da infraestrutura física fundamental para a inteligência artificial global.","link":"https://www.aljazeera.com/amp/economy/2026/8/25/nvidia-supermicro-employees-charged-over-export-of-ai-servers-to-china","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"极目新闻","pais":"China","titulo":"Polícia chinesa desmantela esquemas que usavam IA para criar difamações contra a Xiaomi","resumo":"A polícia chinesa desvendou múltiplos casos criminais envolvendo o uso de ferramentas de inteligência artificial para gerar e espalhar boatos falsos sobre a Xiaomi.\nEm resposta às investigações, a gigante de tecnologia reforçou que tomará medidas legais para defender sua reputação comercial e combater conteúdos gerados por IA maliciosa.\nA ação policial marca um precedente relevante no combate à desinformação automatizada e ao mau uso de modelos generativos de IA no setor corporativo.","link":"https://www.ctdsb.net/c1666_202608/2840351.html","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"中华人民共和国科学技术部","pais":"China","titulo":"China abre a Conferência de Energia de Fusão Nuclear de 2026 com foco em inovação científica","resumo":"O vice-ministro de Ciência e Tecnologia da China, Zhang Guangjun, participou da cerimônia de abertura da Conferência de Energia de Fusão Nuclear e Semana de Atividades de 2026.\nO evento reuniu os principais cientistas e líderes da indústria para discutir inovações no confinamento magnético e no progresso dos reatores experimentais.\nA iniciativa reforça a ambição estratégica da China de acelerar a transição comercial em direção à fusão nuclear como fonte de energia limpa e ilimitada.","link":"https://www.most.gov.cn/kjbgz/202608/t20260825_197198.html","categoria":"ENERGIA FUSÃO","lang":"pt"},{"fonte":"新华网","pais":"China","titulo":"Robô de inspeção externa de tubulações se destaca na Conferência Mundial de Robótica de 2026","resumo":"A empresa de tecnologia da PipeChina apresentou seu novo robô de inspeção externa de tubulações durante a realização da Conferência Mundial de Robótica de 2026.\nO equipamento utiliza sensores de alta precisão e algoritmos autônomos para mapear falhas, corrosões e trechos vulneráveis em dutos de transporte energético.\nA inovação representa um avanço expressivo na automação e na segurança operacional da infraestrutura nacional de transporte de combustível.","link":"https://www.news.cn/energy/20260825/2b6b4d5aedda40e8ab3f7c88a7897ffe/c.html","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"The Quantum Insider","pais":"Índia","titulo":"Índia destaca 6G e comunicações quânticas como prioridades tecnológicas","resumo":"A Índia reafirmou seu compromisso em liderar o avanço global em infraestrutura digital ao destacar as tecnologias de rede 6G e comunicação quântica como suas principais prioridades estratégicas.\nO governo busca acelerar pesquisas e incentivar parcerias público-privadas para desenvolver patentes nacionais antes da padronização global.\nA iniciativa visa garantir a soberania tecnológica do país, fortalecer a segurança da informação e impulsionar a inclusão digital em larga escala no território indiano.","link":"https://thequantuminsider.com/2026/08/25/india-6g-quantum-communications-development/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Deccan Chronicle","pais":"Índia","titulo":"Índia pode alcançar economia de US$ 55 trilhões até 2047 ao capitalizar na IA com sua jovem demografia","resumo":"O ex-conselheiro econômico principal da Índia afirmou que o país possui o potencial de transformar sua economia e atingir um Produto Interno Bruto impressionante impulsionado pela inteligência artificial.\nA combinação de uma população jovem numerosa com a rápida adoção de tecnologias emergentes em setores estratégicos é apontada como o principal motor desse crescimento acelerado nas próximas décadas.\nPara concretizar essa visão, a liderança reforçou a necessidade de investimento massivo na capacitação técnica e infraestrutura digital.","link":"https://www.deccanchronicle.com/nation/current-affairs/india-can-build-55-trillion-economy-by-2047-by-capitalising-on-its-young-demographic-in-ai-ex-cea-1982200","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Department of Science and Technology (DST)","pais":"Índia","titulo":"Nova tecnologia inteligente pode tornar o diagnóstico de Alzheimer mais acessível","resumo":"Pesquisadores e desenvolvedores apresentaram um novo sistema tecnológico inteligente capaz de simplificar a identificação precoce do Mal de Alzheimer, reduzindo custos e barreiras de diagnóstico.\nA inovação utiliza algoritmos avançados para analisar marcadores biológicos e comportamentais de maneira rápida e precisa.\nA expectativa é que essa solução facilite o acesso à saúde em regiões vulneráveis e ajude a democratizar tratamentos preventivos em escala global.","link":"https://dst.gov.in/new-smart-technology-can-make-diagnosis-of-ad-more-accessible","categoria":"CIÊNCIA E SAÚDE","lang":"pt"},{"fonte":"The Star","pais":"Índia","titulo":"Índia vai transferir tecnologia de mísseis desenvolvida pelo Estado para empresas privadas de defesa","resumo":"Em uma grande mudança estratégica, o governo indiano autorizou a transferência de tecnologias de mísseis criadas por órgãos públicos para empresas privadas do setor de defesa nacional.\nO movimento visa fortalecer a base industrial do país, impulsionar a fabricação local no âmbito do programa Make in India e reduzir a dependência de importações militares.\nA medida também promete acelerar o desenvolvimento de novas soluções bélicas e gerar empregos no setor de alta tecnologia.","link":"https://www.thestar.com.my/aseanplus/aseanplus-news/2026/08/25/india-to-transfer-state-developed-missile-technology-to-domestic-defence-companies","categoria":"DEFESA E TECNOLOGIA","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Índia","titulo":"Scindia apela ao C-DOT para levar a tecnologia de telecomunicações indiana aos mercados globais","resumo":"O ministro das Telecomunicações da Índia solicitou ao Centro de Desenvolvimento de Telemática que expanda a exportação de suas soluções tecnológicas para o mercado internacional.\nO objetivo é posicionar o país não apenas como consumidor, mas como um provedor global de infraestrutura de redes e equipamentos de conectividade confiáveis.\nA estratégia busca impulsionar a presença de empresas indianas no cenário global e fortalecer a cooperação internacional no setor de telecomunicações.","link":"https://www.moneycontrol.com/news/telecom/scindia-calls-on-c-dot-to-take-indian-telecom-technology-to-global-markets-14014746.html","categoria":"TELECOMUNICAÇÕES","lang":"pt"},{"fonte":"fundsforNGOs","pais":"Índia","titulo":"Concessão TechPioneer apoia startups impulsionadas por tecnologia na Índia","resumo":"Um novo programa de bolsas e incentivos financeiros, denominado TechPioneer, foi lançado para impulsionar startups indianas com foco em inovação e alta tecnologia.\nO financiamento busca apoiar empreendedores que desenvolvem soluções disruptivas em áreas como inteligência artificial, biotecnologia e energias limpas.\nA iniciativa visa acelerar a transformação digital no país e consolidar o ecossistema nacional de inovação como um dos mais dinâmicos do mundo.","link":"https://www2.fundsforngos.org/innovation/techpioneer-grant-for-technology-driven-startups-india/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"DD India","pais":"Índia","titulo":"Conhecimento tradicional deve integrar-se com a ciência moderna e tecnologias emergentes, afirma Jitendra Singh","resumo":"O ministro de Estado da Índia destacou a urgência de unificar saberes ancestrais e práticas medicinais tradicionais com os avanços da ciência moderna e das tecnologias emergentes.\nSegundo ele, essa sinergia pode resultar em diagnósticos mais precisos, novos tratamentos terapêuticos e inovações sustentáveis de alto impacto social.\nO governo planeja incentivar pesquisas multidisciplinares para validar cientificamente práticas históricas e promovê-las globalmente.","link":"https://ddindia.co.in/2026/08/traditional-knowledge-must-integrate-with-modern-science-medicine-and-emerging-technologies-jitendra-singh/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Investing.com India","pais":"Índia","titulo":"Tecnologia de banco de dados com IA da Rezolve Ai é implantada no Google Cloud","resumo":"A plataforma de tecnologia Rezolve Ai anunciou a implantação de seu avançado sistema de banco de dados com inteligência artificial na infraestrutura do Google Cloud.\nA integração visa oferecer maior escalabilidade, segurança e velocidade no processamento de grande volume de dados para empresas de e-commerce e varejo.\nEssa parceria promete otimizar a experiência do consumidor com análises preditivas em tempo real e maior eficiência operacional.","link":"https://in.investing.com/news/stock-market-news/rezolve-ai-database-technology-deployed-in-google-cloud-93CH-5570533","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Pressão social dita compras em tecnologia: dois em cada três portugueses gastam mais por influência dos jovens","resumo":"Um estudo recente revela que a pressão social exercida pelas gerações mais jovens impacta diretamente as decisões de consumo em Portugal.\nDois em cada três portugueses admitem gastar mais dinheiro em dispositivos tecnológicos e tendências digitais por influência dos filhos ou jovens da família.\nO fenômeno reflete como a rápida evolução tecnológica e o desejo de inclusão digital moldam os hábitos de compra no país.\nEsse comportamento impulsiona a adoção acelerada de novos gadgets e fortalece a relevância das redes sociais nas decisões de mercado.","link":"https://jornaleconomico.sapo.pt/noticias/pressao-social-dita-compras-em-tecnologia-dois-em-cada-tres-portugueses-gastam-mais-por-influencia-dos-jovens/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Delegação de startups portuguesas apresenta a inovação nacional em Florianópolis","resumo":"Uma delegação de startups portuguesas desembarcou em Florianópolis para apresentar soluções tecnológicas inovadoras e explorar novas oportunidades de negócios no Brasil.\nO encontro visa fortalecer a cooperação internacional entre os ecossistemas de empreendedorismo de Portugal e da América Latina.\nAs empresas participantes destacam áreas como inteligência artificial, transição energética e tecnologias de informação para expansão global.\nA iniciativa consolida Portugal como um polo dinâmico de inovação com capacidade de projeção em mercados estratégicos.","link":"https://jornaleconomico.sapo.pt/noticias/delegacao-de-startups-portuguesas-apresentam-a-inovacao-nacional-em-florianopolis/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"O Amarense – Jornal","pais":"Portugal","titulo":"Universidade Politécnica de Viana recebe congresso internacional sobre inovação, tecnologia e jogos em saúde","resumo":"A Universidade Politécnica de Viana do Castelo acolhe um congresso internacional voltado à aplicação de novas tecnologias e gamificação na área da saúde.\nO evento reúne especialistas globais para debater como jogos digitais e ferramentas interativas podem auxiliar no tratamento de pacientes e na formação médica.\nA utilização de tecnologias imersivas promete transformar abordagens terapêuticas e aumentar a adesão a tratamentos de reabilitação.\nA iniciativa reforça o papel da academia portuguesa no desenvolvimento de pesquisas aplicadas com forte impacto social.","link":"https://oamarense.pt/universidade-politecnica-de-viana-recebe-congresso-internacional-sobre-inovacao-tecnologia-e-jogos-em-saude/","categoria":"SAÚDE DIGITAL","lang":"pt"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Fortuna do setor tecnológico aumentou um trilhão em um ano","resumo":"A riqueza acumulada pelos principais líderes do setor tecnológico mundial registrou um aumento expressivo de um trilhão de dólares em apenas doze meses.\nO salto financeiro foi impulsionado sobretudo pelo boom da inteligência artificial generativa e pela recuperação global de ações de grandes empresas do setor.\nEsse crescimento vertiginoso consolida a tecnologia como o principal motor do enriquecimento e da transformação econômica global contemporânea.\nEspecialistas apontam que a alta demanda por infraestrutura digital continuará sustentando essa tendência nos próximos anos.","link":"https://jornaleconomico.sapo.pt/noticias/fortuna-do-setor-tecnologico-aumentou-um-biliao-num-ano/","categoria":"MERCADO TECH","lang":"pt"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Programa BrightStart da Deloitte Portugal apoia estudantes de tecnologia","resumo":"A Deloitte Portugal renovou seu compromisso com a formação de talentos através do programa BrightStart, direcionado a estudantes do ensino superior na área de tecnologia.\nA iniciativa oferece financiamento total de propinas e bolsas mensais, além de integração prática em projetos reais da consultoria.\nO programa busca combater a escassez de profissionais qualificados no setor de tecnologia da informação em Portugal.\nAo aproximar o meio acadêmico do mercado corporativo, o projeto acelera a inserção de jovens em carreiras tecnológicas promissoras.","link":"https://jornaleconomico.sapo.pt/noticias/programa-brightstart-da-deloitte-portugal-apoia-estudantes-de-tecnologia/","categoria":"EDUCAÇÃO TECH","lang":"pt"},{"fonte":"SIC Notícias","pais":"Portugal","titulo":"Pais de menina que morreu de difteria na Itália temiam que vacina causasse autismo: o que diz a ciência?","resumo":"A trágica morte de uma criança por difteria na Itália reacendeu o debate sobre o impacto de teorias da conspiração e desinformação na hesitação vacinal.\nOs pais da menor recusaram a imunização por receio, desmentido exaustivamente pela comunidade científica, de que a vacina causaria autismo.\nEstudos rigorosos conduzidos globalmente ao longo de décadas comprovaram a inexistência de qualquer relação entre vacinas e o desenvolvimento do espectro autista.\nEspecialistas alertam para os riscos do reaparecimento de doenças graves erradicadas devido ao avanço do movimento antivacina.","link":"https://sicnoticias.pt/sicverifica/2026-08-25-pais-de-menina-que-morreu-de-difteria-em-italia-temiam-que-vacina-causasse-autismo.-o-que-diz-a-ciencia--6525331c","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"RTP Açores","pais":"Portugal","titulo":"TERINOV: Parque de Ciência da Terceira expande com 8 novos espaços","resumo":"O TERINOV, parque de ciência e tecnologia localizado na Ilha Terceira, nos Açores, anunciou a abertura de oito novos espaços dedicados a empresas e projetos de pesquisa.\nA expansão visa capacitar a região para atrair mais investimentos em inovação, desenvolvimento sustentável e transição digital.\nCom as novas infraestruturas, o ecossistema regional pretende acolher startups focadas em biotecnologia, agrotech e economia do mar.\nO fortalecimento do parque consolida os Açores como um hub emergente de conhecimento científico e tecnológico no Atlântico.","link":"https://acores.rtp.pt/local/terinov-parque-de-ciencia-da-terceira-com-8-novos-espacos/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Público","pais":"Portugal","titulo":"Embraer ganha aval para construir fábrica em Portugal, gerando 300 empregos diretos","resumo":"A fabricante brasileira Embraer obteve autorização oficial para a construção de uma nova unidade fabril em território português, com foco em tecnologia aeronáutica.\nO projeto prevê um investimento de grande porte e a criação imediata de mais de 300 postos de trabalho diretos de alta qualificação.\nA instalação vai fortalecer a cadeia de suprimentos aeroespacial da Europa e expandir a capacidade produtiva da empresa na região.\nA iniciativa consolida Portugal como um hub estratégico para a indústria tecnológica de ponta e aviação avançada.","link":"https://www.publico.pt/2026/08/25/publico-brasil/noticia/embraer-ganha-aval-construir-fabrica-portugal-gerando-300-empregos-diretos-2186047?ref=economia","categoria":"INDÚSTRIA TECH","lang":"pt"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"'DIY deepfakes' surge and become a new threat for scams and financial fraud","resumo":"The popularization of accessible artificial intelligence tools has allowed criminals to create 'DIY deepfakes' with alarming ease.\nUsing audio and video simulations of relatives or executives, scammers have been cloning voices and faces to bypass security systems and trick victims.\nExperts warn of the urgent need for caution online and the adoption of robust verification mechanisms by financial institutions.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/25/deepfake-caseiro-dispara-e-ira-nova-ameaca-de-golpes-e-fraudes-financeiras.ghtml","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"Universidade Federal do Paraná","pais":"Brazil","titulo":"UFPR Science: Index innovates by measuring river quality through fish health","resumo":"Researchers at the Federal University of Paraná have developed an innovative methodology to assess the health of aquatic ecosystems.\nThe new index analyzes biological indicators and pathologies found in local fish fauna, allowing for a more precise diagnosis of the impact of pollution on rivers.\nThe scientific approach promises to transform environmental management and support public policies for the conservation of water resources in the country.","link":"https://ufpr.br/ciencia-ufpr-indice-inova-ao-medir-qualidade-dos-rios-pela-saude-dos-peixes/","categoria":"SCIENCE","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Cameras, drones, and space technology help Cedae save R$ 70 million","resumo":"Rio de Janeiro's State Water and Sewage Company has adopted an advanced technological ecosystem to optimize the inspection of its operational networks.\nUsing drones, smart sensors, and algorithms inspired by NASA data, the company managed to map leaks and failures with high precision.\nThe modernization avoided the massive waste of resources and generated expressive savings of R$ 70 million for public coffers.","link":"https://oglobo.globo.com/blogs/ancelmo-gois/post/2026/08/cameras-drones-e-ate-tecnologia-semelhante-a-da-nasa-ajudam-cedae-a-economizar-r-70-milhoes.ghtml","categoria":"INNOVATION","lang":"en"},{"fonte":"Echo Boomer","pais":"Brazil","titulo":"Disney Plus restores 4K with new technology, but faces patent dispute","resumo":"Streaming platform Disney Plus has rolled back quality restrictions and resumed offering 4K resolution broadcasts using new video codecs.\nHowever, the technical advancement resulted in a legal battle with telecommunications company InterDigital over the licensing of the technologies employed.\nThe case highlights the growing regulatory and intellectual property challenges faced by global giants in the digital entertainment market.","link":"https://echoboomer.pt/disney-plus-4k-nova-tecnologia-disputa-patentes-interdigital/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"ANPD fines TikTok R$ 153.7 million over child protection failures","resumo":"The National Data Protection Authority has applied a multimillion-dollar penalty to the TikTok platform due to irregularities in the handling of data belonging to children and adolescents.\nThe investigation pointed out weaknesses in age verification mechanisms and in the transparency of the use of personal information of young Brazilian users.\nThe measure represents a rigorous milestone in digital privacy oversight and imposes urgent adjustments on social media networks in Brazil.","link":"https://g1.globo.com/tecnologia/noticia/2026/08/25/anpd-multa-tiktok-por-falhas-na-protecao-de-menores.ghtml","categoria":"REGULATION","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Prostate cancer: why HIFU technology takes time to be recognized","resumo":"High-intensity focused ultrasound (HIFU) is emerging as a minimally invasive alternative for prostate cancer treatment, reducing severe side effects.\nDespite promising results, large-scale adoption in the public network and health plans runs into regulatory requirements and the need for extensive clinical trials.\nDoctors emphasize that the consolidation of new medical technologies takes time to guarantee full efficacy, safety, and cost-benefit for patients.","link":"https://oglobo.globo.com/saude/gustavo-guimaraes/post/2026/08/cancer-de-prostata-por-que-uma-nova-tecnologia-nova-como-o-hifu-leva-tempo-para-ser-reconhecida.ghtml","categoria":"MEDICAL TECHNOLOGY","lang":"en"},{"fonte":"Época Negócios","pais":"Brazil","titulo":"'Artificial intelligence will make science advance faster than ever,' says Nobel laureate in Economics","resumo":"In a recent statement, a Nobel Prize laureate in Economics highlighted the transformative role of artificial intelligence in global scientific research.\nAccording to the expert, AI's ability to process massive volumes of data and accelerate simulations promises to revolutionize everything from medicine to materials physics.\nHowever, he points out that accelerated advancement requires clear ethical guidelines to avoid economic risks and the undue concentration of technological power.","link":"https://epocanegocios.globo.com/inteligencia-artificial/noticia/2026/08/a-ideia-de-que-a-ia-de-alguma-forma-vai-controlar-a-humanidade-e-uma-bobagem-distopica-diz-premio-nobel-da-economia.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"www.gov.br","pais":"Brazil","titulo":"RNP Forum debates digital sovereignty and artificial intelligence in Brasília","resumo":"The Ministry of Science, Technology and Innovation is promoting the RNP Forum to discuss the strategic directions of research infrastructure in Brazil.\nThe event brings together experts, public managers, and academics to discuss crucial topics such as data sovereignty, data governance, and the responsible application of AI.\nThe guidelines built at the forum aim to strengthen national technological autonomy and consolidate advanced connection networks for the Brazilian scientific environment.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/forum-rnp-2026-debate-soberania-digital-e-ia-em-brasilia","categoria":"DIGITAL INNOVATION","lang":"en"},{"fonte":"Technology Networks","pais":"United States","titulo":"FDA Approves Blood Test for Alzheimer's Disease Detection","resumo":"The FDA has granted approval for an innovative blood test capable of identifying Alzheimer's disease at an early stage.\nThe new technology promises to revolutionize medical diagnosis, replacing invasive and high-cost exams with a simple blood draw.\nStudies indicate that early detection allows for more effective and accessible therapeutic interventions for patients.\nThis achievement represents a significant milestone in diagnostic medicine and global public health.","link":"https://www.technologynetworks.com/tn/news/fda-clears-blood-test-for-alzheimers-disease-detection-415946","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"United States","titulo":"Meta Goes to Trial as Silicon Valley Faces Growing Backlash","resumo":"Tech giant Meta is facing a decisive trial in the United States focused on the impact of its social networks on the mental health of youth.\nThe case reflects a growing wave of regulatory and judicial scrutiny against major Silicon Valley companies.\nExperts point out that the outcome could impose new legal obligations and change the business model of digital platforms.\nPublic and governmental pressure signals a historical turning point in the regulation of social media in the country.","link":"https://www.theguardian.com/global/2026/aug/25/meta-trial-silicon-valley","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Quantum Insider","pais":"United States","titulo":"GSA Outlines Transition to Quantum-Resistant Technology","resumo":"The U.S. General Services Administration (GSA) has presented a strategic plan to migrate its systems to post-quantum cryptography.\nThe initiative aims to protect critical government data against future threats from hackers using advanced quantum computers.\nThe move establishes new guidelines for public sector IT infrastructure and technology suppliers.\nThe transition is seen as an essential step to ensure national security in the era of quantum computing.","link":"https://thequantuminsider.com/2026/08/25/gsa-outlines-transition-to-quantum-resistant-technology/","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"The Quantum Insider","pais":"United States","titulo":"NIST Researchers Supersize Quantum Technology to Detect Faint Photons","resumo":"NIST scientists have developed a new quantum approach capable of amplifying sensitivity in the detection of low-intensity photons.\nThe innovation overcomes previous limitations and allows the capture of extremely faint light signals with unprecedented precision.\nThis discovery brings significant advances to areas such as quantum communication, astrophysics, and biomedical imaging.\nThe breakthrough reinforces the leadership of American research institutes in the development of applied quantum technologies.","link":"https://thequantuminsider.com/2026/08/25/nist-researchers-supersize-quantum-technology-to-help-detect-faint-photons/","categoria":"SCIENCE","lang":"en"},{"fonte":"Technology Networks","pais":"United States","titulo":"New Hydrogel Platform Simplifies the Creation of Living Tissue Models","resumo":"Bioengineers have created a hydrogel-based platform that facilitates the three-dimensional fabrication of living tissue models in the laboratory.\nThe technology allows for cultivating cells with greater structural and functional fidelity to the real biological conditions of the human body.\nThis innovation should accelerate the development of new drugs and reduce reliance on animal testing.\nIt is a promising leap for regenerative medicine and modern pharmacological research.","link":"https://www.technologynetworks.com/applied-sciences/news/new-hydrogel-platform-simplifies-the-creation-of-living-tissue-models-415887","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"McKinsey \u0026 Company","pais":"United States","titulo":"The State of AI in 2026: On the Path to Return on Investment","resumo":"A new report analyzes the landscape of Artificial Intelligence in 2026, highlighting the prioritized pursuit of financial return.\nAfter years of massive investments in infrastructure and generative models, companies are now focusing on viable commercial applications.\nThe transition marks a phase of maturity in the sector, where operational efficiency becomes the main metric of success.\nThe study points out which sectors are leading practical adoption and obtaining concrete results with the technology.","link":"https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"CNN","pais":"United States","titulo":"How Space Technology Continues to Reshape Life on Earth","resumo":"Innovations developed for space exploration continue to generate direct and beneficial impacts on everyday terrestrial society.\nClimate tracking systems, advanced materials, and water purification technologies are some of the space spinoffs.\nThe commercial space sector has driven the creation of sustainable solutions for environmental and urban challenges.\nThis convergence reaffirms the strategic value of investments in space science for global progress.","link":"https://www.cnn.com/2026/08/25/world/video/space42-space-satellite-ai-earth-observation-global-connectivity","categoria":"SCIENCE","lang":"en"},{"fonte":"inc.com","pais":"United States","titulo":"Taking Vacation Photos? Science Says You May Be Erasing Your Own Memories","resumo":"Recent scientific research reveals that the frequent habit of photographing leisure moments can harm long-term memory.\nThe phenomenon occurs because the brain delegates the retention of details to the digital device, diminishing internal cognitive processing.\nExperts suggest that living the experience consciously strengthens memories more than constantly recording images.\nThe study sparks a relevant debate on how reliance on technology affects human cognition.","link":"https://www.inc.com/jessica-stillman/taking-vacation-photos-science-says-youre-erasing-your-own-memories/91395078","categoria":"SCIENCE","lang":"en"},{"fonte":"TF1 Info","pais":"France","titulo":"\"It's a dystopia, science fiction\": Russia used AI-piloted drone to strike in Ukraine","resumo":"The use of artificial intelligence in armed conflicts has reached a new level with the deployment of autonomous drones by Russian forces in Ukraine.\nExperts and international observers warn of the ethical and military risks associated with the automation of lethal decisions on the battlefield.\nThe episode reinforces the global debate on the urgent need to regulate AI technologies employed in weapons systems.","link":"https://www.tf1info.fr/international/videos/video-c-est-une-dystopie-une-science-fiction-la-russie-s-est-servie-d-un-drone-pilote-par-ia-pour-frapper-en-ukraine-53298-2460283.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Science et vie","pais":"France","titulo":"They live past 110: Science has just understood the secret of their longevity","resumo":"Researchers have achieved a significant breakthrough in understanding the genetic and biological factors that allow supercentenarians to surpass 110 years of age.\nDetailed studies point to unique cellular repair mechanisms and resilient immunity present in the bodies of these individuals.\nThis discovery opens doors for future medical interventions capable of promoting healthy aging and preventing degenerative diseases.","link":"https://www.science-et-vie.com/corps-et-sante/ils-vivent-plus-de-110-ans-la-science-vient-de-comprendre-le-secret-de-leur-longevite-255960.html","categoria":"SCIENCE","lang":"en"},{"fonte":"terre.defense.gouv.fr","pais":"France","titulo":"Innovation and Excellence: ENSOA Integrates Cutting-Edge Technology into Marksmanship Training","resumo":"The National School of Active Non-Commissioned Officers (ENSOA) in France has adopted modern cutting-edge technologies in its marksmanship training programs.\nThe initiative includes the use of advanced simulators and digital tools to optimize the accuracy, safety, and efficiency of trainees.\nThe modernization reflects the growing digital transformation and the pursuit of innovation in the defense and military instruction sector.","link":"https://www.terre.defense.gouv.fr/ensoa_1/actualites/innovation-excellence-lensoa-integre-technologie-pointe-formation-au-tir","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Sortir à Paris","pais":"France","titulo":"Fête de la Science 2026: Food, Science, and Flavors Meet at the Grand Palais","resumo":"The iconic Grand Palais in Paris will host a special program dedicated to the chemistry, physics, and biology behind gastronomy.\nThe event is part of the Fête de la Science 2026 lineup, offering interactive workshops and scientific demonstrations for audiences of all ages.\nThe initiative seeks to bring the public closer to research on nutrition, food sustainability, and culinary innovation.","link":"https://www.sortiraparis.com/enfant-famille/articles/34130-fete-de-la-science-2026-aliments-science-et-saveurs-se-rencontrent-au-grand-palais","categoria":"SCIENCE","lang":"en"},{"fonte":"Sortir à Paris","pais":"France","titulo":"Fête de la Science 2026: Dive into the World of Sciences in Orsay","resumo":"The city of Orsay, renowned for its academic and scientific hub, is preparing special attractions for the 2026 Fête de la Science.\nVisitors will be able to tour cutting-edge laboratories, interact with researchers, and participate in hands-on experiments across various fields of knowledge.\nThe event aims to boost scientific outreach and encourage young students' interest in innovation and technology careers.","link":"https://www.sortiraparis.com/enfant-famille/articles/333195-fete-de-la-science-2026-plongez-dans-le-monde-des-sciences-a-orsay-91","categoria":"SCIENCE","lang":"en"},{"fonte":"Sortir à Paris","pais":"France","titulo":"Fête de la Science 2026: Family Visits and Workshops at the Parc aux Étoiles","resumo":"The Parc aux Étoiles, located in the Yvelines department, will offer hands-on workshops and guided stargazing sessions during the Fête de la Science.\nThe activities were specially designed to integrate families into the universe of astronomy and space exploration.\nThe initiative highlights the importance of democratizing access to science and stimulating astronomical curiosity from childhood.","link":"https://www.sortiraparis.com/enfant-famille/articles/282832-fete-de-la-science-2026-visites-et-ateliers-en-famille-au-parc-aux-etoiles-78","categoria":"ASTRONOMY","lang":"en"},{"fonte":"Sortir à Paris","pais":"France","titulo":"Fête de la Science 2026: Events at Universities and Schools in Paris and the Region","resumo":"Higher education institutions and schools in Paris and the Île-de-France open their doors for the 2026 edition of the Fête de la Science.\nThe program features lectures, exhibitions, and experiments conducted directly by university students and researchers.\nThe movement strengthens the bond between the academic community and the public, highlighting regional scientific production.","link":"https://www.sortiraparis.com/enfant-famille/guides/282796-fete-de-la-science-2026-les-evenements-dans-les-universites-et-ecoles-a-paris-et-sa-region","categoria":"EDUCATION AND SCIENCE","lang":"en"},{"fonte":"Sortir à Paris","pais":"France","titulo":"Fête de la Science 2026: A Journey into the Past at the Val d'Oise Archaeological Museum","resumo":"The Val d'Oise Archaeological Museum will showcase how modern scientific techniques help unravel mysteries of the past.\nDuring the Fête de la Science, visitors will have access to analyses of ancient artifacts and the application of technology in historical preservation.\nThe program highlights the interdisciplinary nature of applied science and cultural heritage conservation.","link":"https://www.sortiraparis.com/enfant-famille/articles/331910-fete-de-la-science-2026-un-voyage-dans-le-passe-au-musee-archeologique-du-val-d-oise-95","categoria":"ARCHAEOLOGY","lang":"en"},{"fonte":"The Independent","pais":"United Kingdom","titulo":"Science Reveals the Love Hormone Crucial to Your Connection With Your Cat","resumo":"Researchers have identified that the hormone oxytocin plays a crucial role in strengthening the emotional bonds between cats and their owners.\nThe study demonstrates that positive interactions and moments of affection elevate levels of this substance in both, promoting mutual well-being.\nThe discovery helps demystify the idea that felines are entirely independent animals devoid of emotional attachment.\nThis scientific evidence reinforces the importance of daily interaction for the mental health of pets.","link":"https://www.independent.co.uk/life-style/cats-pets-love-oxytocin-b3038856.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Moneycontrol.com","pais":"United Kingdom","titulo":"UK Grants Ukraine Access to Secret Missile Technology","resumo":"The British government has agreed to transfer confidential military technology so that Ukrainian armed forces can manufacture their own long-range weaponry.\nThe initiative aims to increase Kyiv's military autonomy and strengthen its defense capacity against Russian advances in the territory.\nExperts point out that this technical cooperation could significantly alter the balance of operations on the battlefield.\nThe agreement also provides ongoing technical support for the modernization of Ukrainian production lines.","link":"https://www.moneycontrol.com/world/uk-is-giving-ukraine-access-to-secret-missile-technology-could-kyiv-soon-produce-its-own-long-range-weapons-article-14015148.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Moneycontrol.com","pais":"United Kingdom","titulo":"Russia Warns UK Factories Could Become Targets After Missile Technology Shipment","resumo":"Russian authorities have issued a severe warning indicating that British industrial facilities could become legitimate targets if the UK continues supplying military technology to Ukraine.\nThe statement comes in direct response to the announcement of the sharing of advanced long-range missile systems.\nThe move escalates diplomatic and military tension between London and Moscow, generating apprehension regarding the security of British defense infrastructure.\nNATO-aligned countries are monitoring the development closely due to the risk of the conflict expanding.","link":"https://www.moneycontrol.com/world/russia-warns-uk-factories-could-face-attacks-after-britain-shares-missile-technology-with-ukraine-article-14015080.html","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"Grocery Gazette","pais":"United Kingdom","titulo":"Noble Foods Trials 'Happy-o-Meter' Technology to Monitor Hen Welfare","resumo":"Egg producer Noble Foods has kicked off trials for the 'Happy-o-Meter' system, a technological solution de
