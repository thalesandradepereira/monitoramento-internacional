within Fortnite to promote local culture.\nThe project will feature a free event in October where participants will play alongside professional esports athletes.\nThe campaign demonstrates the application of the metaverse and gaming in engaging new audiences and preserving culture.","link":"https://prtimes.jp/main/html/rd/p/000000045.000038392.html","categoria":"TRENDS","lang":"en"},{"fonte":"cas.cn","pais":"China","titulo":"China's \"FAST\" Sky Eye Maps Universe's Largest Cosmic Gas Panorama","resumo":"The FAST radio telescope, known as China's \"Sky Eye,\" has completed the largest and most detailed mapping of atomic gas in the universe ever conducted.\nThe research revealed unprecedented gaseous structures and provided fundamental data on galaxy evolution and star formation across eons.\nThe achievement solidifies China's leadership in global radio astronomy, opening new frontiers for understanding cosmic origins.","link":"https://www.cas.cn/cm/202609/t20260911_5120169.shtml","categoria":"ASTRONOMY","lang":"en"},{"fonte":"cas.cn","pais":"China","titulo":"Bat Cave Discovery Reveals Unprecedented Panorama of Denisovans in Southern China","resumo":"Chinese researchers have identified new Denisovan fossils in a cave in southern China, filling a historical gap in human evolution.\nThe discovery revealed genetic records and valuable materials that detail the group's survival habits and adaptation to tropical environments.\nThe finding rewrites crucial aspects of prehistory in Asia, demonstrating the continuous and diverse presence of Denisovans in the region.","link":"https://www.cas.cn/cm/202609/t20260911_5120172.shtml","categoria":"SCIENCE","lang":"en"},{"fonte":"杭州新闻","pais":"China","titulo":"China Achieves New Breakthrough in Deep-Sea Scientific Exploration with Multi-Platform Technology","resumo":"China has recorded a major achievement in oceanographic research by implementing an innovative multi-platform collaborative detection model.\nThe new technology integrates submersibles and autonomous robots to map abyssal areas with unprecedented precision and efficiency in the marine sector.\nThe breakthrough strengthens the country's capability to monitor seafloor resources and boosts the development of domestic exploration equipment.","link":"https://news.hangzhou.com.cn/gnxw/content/2026-09/11/content_9304469.htm","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"观点网","pais":"China","titulo":"Supercomputing Cluster for Scientific Intelligence Inaugurated in Shanghai","resumo":"A new computing infrastructure cluster dedicated to scientific intelligence has been activated in the Yangtze River Delta region of Shanghai.\nThe center was designed to accelerate advanced research in strategic areas such as biomedicine, new materials engineering, and clean energy.\nThe initiative aims to meet the growing demand for data processing and position the country at the forefront of AI-driven scientific development.","link":"https://www.guandian.cn/article/20260911/600293.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"湖北日报传媒集团","pais":"China","titulo":"European Automakers Seek Partnerships with China's Electric Vehicle Ecosystem","resumo":"Facing factory closures and layoffs in Europe, major global automakers are seeking strategic partnerships with Chinese EV manufacturers.\nThe goal is to absorb China's advanced software architectures, next-generation battery technologies, and efficient production processes.\nThis shift in stance highlights the consolidation of the Chinese market as the global center for electric mobility innovation and development.","link":"https://news.hubeidaily.net/pc/c_5964338.html","categoria":"INNOVATION","lang":"en"},{"fonte":"每日经济新闻","pais":"China","titulo":"China Publishes Development Ranking of Low-Altitude Economy in Country's Counties","resumo":"The first detailed report on the progress of the low-altitude economy in county areas across China has been published, focusing on the use of drones and eVTOLs.\nThe survey indicated that the eastern region leads in industrial infrastructure, while the central-west stands out for airspace availability.\nRegulation and the promotion of low-altitude navigation are seen as strategic priorities to boost regional logistics and technological services.","link":"https://www.nbd.com.cn/articles/2026-09-11/4578943.html","categoria":"INNOVATION","lang":"en"},{"fonte":"教育在线","pais":"China","titulo":"iFlytek Launches Spark 2.0 Focused on Artificial Intelligence to Support Teachers","resumo":"Technology company iFlytek has unveiled the Spark 2.0 artificial intelligence model, configured as an assistant tailored for the educational environment.\nThe solution automates pedagogical tasks such as lesson preparation, continuous student assessment, and the customization of support materials for educators.\nThe launch aims to integrate generative intelligence into the school routine, increasing educator efficiency and modernizing teaching processes in China.","link":"https://news.eol.cn/hot/hangye/202609/t20260911_2772998.shtml","categoria":"EDTECH","lang":"en"},{"fonte":"Exame","pais":"China","titulo":"China Approves Nearly 300 New National Standards for Technology, Industry, and Security","resumo":"Chinese regulatory authorities have announced the approval of nearly three hundred new national standards covering strategic high-tech sectors.\nThe guidelines establish technical requirements for artificial intelligence, advanced industrial equipment, data security, and sustainable production.\nLarge-scale standardization aims to strengthen the global competitiveness of domestic industry and ensure greater operational security across the country's technological networks.","link":"https://exame.com/tecnologia/china-aprova-quase-300-normas-para-tecnologia-industria-e-seguranca/","categoria":"REGULATION","lang":"en"},{"fonte":"India Today","pais":"India","titulo":"IIT Ropar to Offer M.Tech in Defense Technology to Indian Army Officers","resumo":"The Indian Institute of Technology (IIT) Ropar has signed a strategic agreement to offer Master of Technology courses in Defense Technology to Indian Army officers.\nThe initiative aims to equip military personnel with advanced knowledge in critical technological areas necessary for the modernization of the country's armed forces.\nThe partnership strengthens ties between academia and the defense sector, promoting domestic technological innovation and the development of sovereign solutions.","link":"https://www.indiatoday.in/education-today/news/story/iit-ropar-mtech-defence-technology-indian-army-officers-agreement-ptag-2991959-2026-09-11","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Economic Times","pais":"India","titulo":"Indo-Russian Technology Hub 'Innopraktika' Seals Four Agreements at Innoprom India 2026","resumo":"The Indo-Russian Innopraktika Technology Hub has formalized four major strategic partnerships during the Innoprom India 2026 event.\nThe agreements seek to boost bilateral cooperation in research, technological development, and knowledge transfer between the two countries.\nThe collaboration is expected to accelerate industrial innovation projects and strengthen the technological and academic ecosystems of both markets.","link":"https://m.economictimes.com/news/india/indo-russia-innopraktika-technology-hub-seals-four-agreements-at-innoprom-india-2026/articleshow/134047324.cms","categoria":"INNOVATION","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"Six IIT Bombay Faculty Members Elected INSA Fellows in Fields Ranging from AI to Climate Science","resumo":"Six faculty members from the prestigious Indian Institute of Technology Bombay have been appointed fellows of the Indian National Science Academy (INSA).\nThe researchers were recognized for their impactful contributions to artificial intelligence, climate science, microbiology, and earth sciences.\nThe election highlights the institution's prominent role in leading advanced scientific research and shaping strategic knowledge in the country.","link":"https://timesofindia.indiatimes.com/education/news/six-iit-bombay-faculty-members-elected-insa-fellows-from-ai-and-climate-science-to-bacteria-and-earths-changing-crust/articleshow/134046988.cms","categoria":"SCIENCE","lang":"en"},{"fonte":"Swarajya","pais":"India","titulo":"Tata Steel Deploys India's First Coke Oven Gas Injection Technology at Odisha Plant","resumo":"Tata Steel has commenced operations of India's first blast furnace and coke oven gas injection technology at its Meramandali plant.\nThe innovation aims to significantly reduce carbon emissions and optimize fuel consumption in steel manufacturing.\nThe project represents a major milestone for the decarbonization of the Indian steel industry and the promotion of sustainable practices.","link":"https://swarajyamag.com/business/tata-steel-deploys-indias-first-coke-oven-gas-injection-technology-at-meramandali-plant-in-odisha-to-advance-sustainable-steelmaking","categoria":"GREEN TECHNOLOGY","lang":"en"},{"fonte":"Business Standard","pais":"India","titulo":"India's New Digital Economy Projected to Triple to Nearly $300 Billion by FY31","resumo":"A new report by consultancy firm Redseer projects that India's new-age economy will triple in size, reaching approximately $300 billion by fiscal year 2031.\nGrowth will be driven by the startup ecosystem, e-commerce, fintech, and the rapid digitization of services.\nThe expansion solidifies the technology sector as one of the main drivers of economic development and job creation in the country.","link":"https://www.business-standard.com/economy/news/india-s-new-age-economy-to-triple-to-nearly-300-billion-by-fy31-redseer-126091100294_1.html","categoria":"DIGITAL MARKET","lang":"en"},{"fonte":"The Economic Times","pais":"India","titulo":"BRICS Businesses View India as Investment Hub with Focus on Engineering and Technology","resumo":"Business leaders from BRICS member countries are identifying India as a strategic hub for attracting direct investment.\nThe greatest opportunities highlighted are concentrated in the sectors of advanced engineering, information technology infrastructure, and digital innovation.\nThe interest reinforces the country's position on the global stage as an attractive destination for foreign capital focused on technological development.","link":"https://m.economictimes.com/news/economy/foreign-trade/brics-businesses-eye-india-as-investment-hub-see-opportunities-in-engineering-technology/articleshow/134047989.cms","categoria":"BUSINESS","lang":"en"},{"fonte":"Hindustan Times","pais":"India","titulo":"Woman Claims She Grew Taller at 35: Is It Possible for Adults to Get Taller? What Science Says","resumo":"The story of a woman claiming to have increased her height in adulthood has gone viral on social media, sparking debates on the topic.\nExperts explain that while bone growth plates close after puberty, postural corrections can create the impression of a height gain.\nThe discussion highlights how science and medicine analyze bone development, demystifying popular beliefs about human physiology.","link":"https://www.hindustantimes.com/lifestyle/health/woman-says-she-grew-1-5-inches-at-35-and-reveals-how-is-it-really-possible-for-adults-to-get-taller-what-science-says-101789099490047.html","categoria":"HEALTH","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"BRICS Built the New Solar Economy, Now It Must Build the Systems to Scale It","resumo":"BRICS bloc countries have played a fundamental role in establishing the new global economy based on solar energy and renewable sources.\nThe group's new challenge consists of developing infrastructure, smart grids, and regulatory systems capable of expanding this scale.\nThe bloc's sustainable energy transition is seen as a vital element for global energy security and the fight against climate change.","link":"https://timesofindia.indiatimes.com/blogs/voices/brics-built-the-new-solar-economy-now-it-must-build-the-systems-to-scale-it/","categoria":"ENERGY","lang":"en"},{"fonte":"Imagens de Marca","pais":"Portugal","titulo":"Carolina Afonso is the new Marketing and Technology Director of Portugal Sotheby’s International Realty","resumo":"Portugal Sotheby’s International Realty has announced the appointment of Carolina Afonso to lead its Marketing and Technology divisions.\nThe executive brings vast experience in digital transformation and innovation strategies to strengthen the brand's presence in the luxury real estate market.\nThis move reflects the growing importance of technological integration in the management and expansion of high-end real estate businesses.","link":"https://www.imagensdemarca.pt/artigo/carolina-afonso-e-a-nova-diretora-de-marketing-e-tecnologia-da-portugal-sothebys-international-realty/","categoria":"BUSINESS","lang":"en"},{"fonte":"Imagens de Marca","pais":"Portugal","titulo":"Volvo renews 40 series with more technology, safety, and artificial intelligence","resumo":"Volvo has unveiled an update to its popular 40 series, bringing significant improvements to driver assistance and connectivity systems.\nThe new models feature advanced artificial intelligence integration to optimize the driving experience and passenger safety.\nThe initiative reinforces the automaker's strategy to lead the transition toward smarter, more efficient vehicles integrated into the digital ecosystem.","link":"https://www.imagensdemarca.pt/artigo/volvo-renova-gama-40-com-mais-tecnologia-seguranca-e-inteligencia-artificial/","categoria":"INNOVATION","lang":"en"},{"fonte":"Pplware","pais":"Portugal","titulo":"New Amazon AI technology makes actors appear to speak the dubbed language","resumo":"Amazon has developed an artificial intelligence-based tool capable of modifying actors' lip movements in audiovisual productions.\nThe technology synchronizes characters' speech with dubbed audio in different languages, creating a much more natural visual experience for audiences.\nThis innovation promises to revolutionize the global entertainment industry by reducing language barriers in the distribution of films and TV series.","link":"https://pplware.sapo.pt/inteligencia-artificial/nova-tecnologia-de-ia-da-amazon-faz-os-atores-parecerem-falar-a-lingua-da-dobragem/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Jornal o Interior","pais":"Portugal","titulo":"UBI brings science and innovation outside the university through a festival in Covilhã","resumo":"The University of Beira Interior (UBI) is organizing a festival in the city of Covilhã focused on bringing the general public closer to scientific production.\nThe event promotes workshops, lectures, and interactive demonstrations highlighting innovative projects developed in the region.\nThe initiative seeks to democratize access to knowledge and encourage the interest of young people and the local community in science and technology fields.","link":"https://www.ointerior.pt/regiao/ubi-leva-ciencia-e-inovacao-para-fora-da-universidade-atraves-de-festival-na-covilha/","categoria":"SCIENCE","lang":"en"},{"fonte":"24 Notícias","pais":"Portugal","titulo":"From Leça da Palmeira to Harvard: meet Ricardo Reis, the Portuguese economist who ruffled feathers in the Trump administration","resumo":"Portuguese economist Ricardo Reis, a professor at the London School of Economics and former Harvard scholar, has gained international recognition for his rigorous analysis.\nHis academic research on inflation and monetary policy has sparked global debates and reactions even within former U.S. President Donald Trump's administration.\nThe academic's career exemplifies the impact of Portuguese intellectuals on the formulation and debate of global economic policies.","link":"https://24noticias.sapo.pt/economia/artigos/de-leca-da-palmeira-a-harvard-quem-e-portugues-ricardo-reis-o-economista-que-incomodou-trump","categoria":"ECONOMY","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"Glaucoma: Researchers unveil new AI technology capable of identifying patients at higher risk of vision loss","resumo":"A team of researchers has developed an artificial intelligence solution aimed at the early diagnosis of glaucoma.\nThe system analyzes advanced eye scans to accurately predict which patients are most likely to experience severe disease progression.\nThe tool represents a crucial breakthrough for preventive medicine, enabling personalized treatments that prevent irreversible blindness.","link":"https://expresso.pt/ia-inteligencia-artificial/2026-09-10-glaucoma-investigadores-apresentam-nova-tecnologia-com-ia-capaz-de-identificar-doentes-com-maior-risco-de-perda-de-visao-7c16efd6","categoria":"HEALTH","lang":"en"},{"fonte":"vida imobiliaria","pais":"Portugal","titulo":"Portugal Sotheby’s appoints new Marketing and Technology Director","resumo":"Portugal Sotheby’s has officially announced the choice of its new leadership to consolidate the company's digital strategies in the luxury sector.\nThe new director assumes the responsibility of integrating advanced technological tools into the firm's real estate marketing campaigns.\nThe primary goal of the appointment is to enhance the customer experience and streamline sales processes in an increasingly competitive market.","link":"https://vidaimobiliaria.com/noticias/mercados/portugal-sothebys-nomeia-nova-diretora-de-marketing-e-tecnologia/","categoria":"BUSINESS","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"Environmental preservation is also a responsibility of technology","resumo":"The tech sector faces a growing debate over the need to align the development of new tools with ecological sustainability.\nExperts emphasize that innovation must focus on reducing the carbon footprint and conscious energy resource consumption by data centers.\nEnvironmental awareness thus becomes an essential pillar for the future of companies and global technological solutions.","link":"https://www.publico.pt/2026/09/10/azul/opiniao/preservacao-ambiental-tambem-responsabilidade-tecnologia-2187496","categoria":"SUSTAINABILITY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
