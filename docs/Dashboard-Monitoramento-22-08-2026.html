  const data = [{"fonte":"O GLOBO","pais":"Brasil","titulo":"Apple faz cortes nas equipes da assistente Siri, do Vision Pro e de jogos","resumo":"A Apple iniciou uma reestruturação interna com demissões direcionadas às equipes do fone de realidade mista Vision Pro, da assistente Siri e da divisão de jogos. A medida reflete um ajuste estratégico da gigante de tecnologia para redirecionar recursos a projetos prioritários em inteligência artificial. O movimento sinaliza os desafios do mercado de realidade aumentada e a busca por maior eficiência operacional no setor de inovação.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/21/apple-faz-cortes-nas-equipes-da-assistente-siri-do-vision-pro-e-de-jogos.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Portal Contabeis","pais":"Brasil","titulo":"Teste de IA: Empresas validam tecnologia antes de escalar soluções","resumo":"Empresas brasileiras e globais estão adotando fases rigorosas de testes e validações antes de implementar inteligência artificial em larga escala. A estratégia busca mitigar riscos regulatórios, operacionais e de segurança, garantindo retornos mais consistentes sobre o investimento. A tendência reflete o amadurecimento do mercado, que migrou do entusiasmo inicial para uma adoção mais cautelosa e orientada a resultados.","link":"https://www.contabeis.com.br/artigos/78925/teste-ia-empresas-validam-tecnologia-antes-de-escalar/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"TikTok pagará US$ 400 milhões para encerrar processo sobre privacidade infantil nos EUA","resumo":"O TikTok concordou em pagar uma quantia expressiva para encerrar acusações relativas à coleta e gestão indevida de dados de crianças e adolescentes nos Estados Unidos. A decisão encerra uma longa disputa judicial com reguladores norte-americanos e pressiona a rede social a reformular políticas de proteção aos menores. O acordo reforça a crescente exigência global por segurança de dados e governança rígida em plataformas digitais.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/21/tiktok-pagara-us-400-milhoes-para-encerrar-processo-sobre-privacidade-infantil-nos-eua.ghtml","categoria":"PRIVACIDADE DIGITAL","lang":"pt"},{"fonte":"RADAR DIGITAL BRASÍLIA","pais":"Brasil","titulo":"Economia Azul: Governo do Brasil fecha cooperação científica e tecnológica com o Japão","resumo":"O governo brasileiro formalizou uma parceria estratégica com o Japão para impulsionar projetos de pesquisa e inovação focados na Economia Azul. A cooperação visa o desenvolvimento sustentável dos recursos marinhos, aliando tecnologia de ponta, preservação oceânica e exploração econômica responsável. A iniciativa fortalece os laços científicos entre as nações e impulsiona pesquisas globais para a sustentabilidade costeira.","link":"https://radardigitalbrasilia.com.br/agronegocio/economia-azul-governo-do-brasil-em-cooperacao-com-o-japao/","categoria":"CIÊNCIA E INOVAÇÃO","lang":"pt"},{"fonte":"www.gov.br","pais":"Brasil","titulo":"Tecnologia estuda produção de mudas mais preparadas para restaurar manguezais do Nordeste","resumo":"Pesquisadores desenvolveram técnicas tecnológicas focadas na criação e fortalecimento de mudas vegetais altamente resistentes para a restauração dos manguezais nordestinos. O projeto visa acelerar a recuperação ecossistêmica de áreas degradadas e combater os efeitos das mudanças climáticas na costa brasileira. A iniciativa une inovação científica e preservação ambiental para gerar soluções de alto impacto socioecológico.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/tecnologia-estuda-producao-de-mudas-mais-preparadas-para-restaurar-manguezais-do-nordeste","categoria":"CIÊNCIA E AMBIENTE","lang":"pt"},{"fonte":"Prefeitura de Belo Horizonte","pais":"Brasil","titulo":"Nova tecnologia melhora a previsibilidade e rapidez da resposta aos impactos de eventos adversos","resumo":"Uma nova ferramenta tecnológica desenvolvida para monitoramento de riscos possibilita antecipar e mitigar os estragos provocados por desastres e eventos climáticos severos. O sistema utiliza análise avançada de dados para acelerar tomadas de decisão e otimizar ações de emergência por órgãos públicos e privados. Com maior previsibilidade, a solução promete salvar vidas e diminuir perdas econômicas em regiões vulneráveis.","link":"https://prefeitura.pbh.gov.br/noticias/nova-tecnologia-de-geoprocessamento-melhora-previsibilidade-e-rapidez-da-resposta-aos","categoria":"INOVAÇÃO TECNOLÓGICA","lang":"pt"},{"fonte":"Tribunal de Justiça do Estado da Bahia","pais":"Brasil","titulo":"Inteligência Artificial: TJBA amplia debate sobre uso da tecnologia no Judiciário","resumo":"O Tribunal de Justiça da Bahia promoveu discussões aprofundadas sobre a integração responsável e ética de ferramentas de inteligência artificial nos processos judiciais. O debate reuniu especialistas para avaliar ganhos de produtividade na celeridade processual e as salvaguardas necessárias aos direitos fundamentais. A iniciativa busca consolidar diretrizes sólidas para a modernização da gestão do Judiciário estadual.","link":"https://www.tjba.jus.br/portal/inteligencia-artificial-tjba-amplia-debate-sobre-uso-da-tecnologia-no-judiciario/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Prefeitura de São Paulo","pais":"Brasil","titulo":"Jornal francês Le Monde destaca tecnologia do Smart Sampa em cenário internacional","resumo":"O prestigiado jornal Le Monde deu destaque internacional ao programa Smart Sampa, enfatizando o uso de tecnologias urbanas e sistemas de monitoramento na capital paulista. A reportagem ressalta como a integração de inteligência artificial e câmeras de alta precisão posiciona São Paulo como referência em gestão de segurança. A repercussão internacional reforça o papel do Brasil na adoção de soluções digitais para cidades inteligentes.","link":"https://prefeitura.sp.gov.br/web/prefeitura-de-sao-paulo/w/jornal-franc%C3%AAs-le-monde-projeta-tecnologia-do-smart-sampa-em-cen%C3%A1rio-internacional","categoria":"CIDADES INTELIGENTES","lang":"pt"},{"fonte":"El Confidencial","pais":"Estados Unidos","titulo":"O avanço da inteligência artificial está transformando a economia norte-americana","resumo":"A rápida adoção da inteligência artificial está reconfigurando setores cruciais da economia nos Estados Unidos.\nA tecnologia impulsiona novos investimentos massivos em infraestrutura, semicondutores e produtividade corporativa.\nEspecialistas apontam que essa transformação estrutural alterará a dinâmica do mercado de trabalho e o crescimento financeiro do país.","link":"https://www.elconfidencial.com/mercados/the-wall-street-journal/2026-08-22/auge-ia-transformando-economia-estadounidense_4404394/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"NBC Bay Area","pais":"Estados Unidos","titulo":"Agricultores apostam em nova tecnologia a vapor para eliminar o uso de pesticidas","resumo":"Uma inovação baseada no tratamento do solo com vapor de alta temperatura promete revolucionar a produção agrícola.\nA solução atua no combate a pragas e ervas daninhas de forma sustentável, reduzindo a dependência de produtos químicos.\nCom o avanço dos testes no campo, produtores esperam diminuir custos ambientais e atender à demanda por alimentos orgânicos.","link":"https://www.nbcbayarea.com/news/local/farmers-steam-technology-pesticides/4131386/","categoria":"AGROTECNOLOGIA","lang":"pt"},{"fonte":"Industrial Equipment News","pais":"Estados Unidos","titulo":"Como a tecnologia de alumínio-ar está substituindo o diesel nos data centers","resumo":"Os data centers estão adotando baterias de alumínio-ar como alternativa sustentável aos geradores tradicionais a diesel.\nEssa inovação oferece maior densidade energética, menor emissão de carbono e custos operacionais reduzidos para a infraestrutura digital.\nA transição é impulsionada pela necessidade urgente de alimentar cargas de trabalho intensivas sem comprometer as metas ambientais.","link":"https://www.ien.com/operations/article/22972849/how-aluminumair-technology-is-moving-data-center-backup-power-beyond-diesel","categoria":"ENERGIA LIMPA","lang":"pt"},{"fonte":"Yahoo Finance","pais":"Estados Unidos","titulo":"Ações da Marvell sobem após expansão de parceria em IA com o Google","resumo":"A Marvell Technology fortaleceu sua presença no setor de inteligência artificial ao expandir sua colaboração estratégica com o Google.\nA parceria foca no desenvolvimento de soluções avançadas de semicondutores e infraestrutura de rede para computação em nuvem.\nInvestidores reagiram positivamente ao acordo, elevando o valor estimado das ações da empresa frente à crescente demanda por chips especializados.","link":"https://finance.yahoo.com/markets/stocks/articles/marvell-technology-mrvl-stock-fair-211042043.html","categoria":"MERCADO TECNOLÓGICO","lang":"pt"},{"fonte":"News-Medical","pais":"Estados Unidos","titulo":"Nova tecnologia de mapeamento 3D revela a formação do folículo capilar ao longo do tempo","resumo":"Pesquisadores desenvolveram um sistema inovador de mapeamento tridimensional para acompanhar o crescimento celular em tempo real.\nA ferramenta permitiu registrar, com precisão inédita, os estágios de desenvolvimento biológico dos folículos capilares.\nA descoberta abre caminho para avanços no tratamento da calvície, regeneração tecidual e terapias dermatológicas avançadas.","link":"https://www.news-medical.net/news/20260821/New-3D-mapping-technology-reveals-how-hair-follicles-form-over-time.aspx","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Carnegie Mellon University","pais":"Estados Unidos","titulo":"Pesquisador explora a matemática oculta que impulsiona a inteligência artificial","resumo":"Estudos avançados estão revelando as estruturas matemáticas complexas por trás do aprendizado profundo das redes neurais.\nCompreender esses fundamentos teóricos permite otimizar algoritmos, tornando os modelos de IA mais eficientes e confiáveis.\nO trabalho promete acelerar o desenvolvimento de novas arquiteturas computacionais com menor consumo de recursos de processamento.","link":"https://www.cmu.edu/mcs/news-events/2026/0821-simons-fellowship-mun","categoria":"CIÊNCIA E DADOS","lang":"pt"},{"fonte":"Popular Science","pais":"Estados Unidos","titulo":"Britânico gasta US$ 7 mil para construir carro esportivo legalizado em seu próprio galpão","resumo":"Um entusiasta de engenharia construiu um automóvel de alto desempenho do zero utilizando um orçamento reduzido e peças adaptadas.\nO veículo passou por rigorosos testes de segurança veicular e recebeu homologação oficial para circular em vias públicas.\nO projeto viralizou ao demonstrar que soluções criativas de fabricação podem rivalizar com modelos esportivos comerciais de alto custo.","link":"https://www.popsci.com/technology/british-man-builds-sports-car-shed/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Financial Times","pais":"Estados Unidos","titulo":"Como os riscos climáticos começam a afetar em cascata a economia dos EUA","resumo":"Os eventos climáticos extremos deixaram de ser ameaças isoladas para se tornarem fatores de desestabilização econômica nos Estados Unidos.\nImpactos no setor imobiliário, aumento no custo dos seguros e interrupções na cadeia de suprimentos geram efeitos dominó interligados.\nAnalistas alertam para a necessidade de políticas de adaptação urgente a fim de mitigar prejuízos sistêmicos no sistema financeiro.","link":"https://www.ft.com/content/77207b97-db2a-4f77-83a4-5479cea3b5e9?syn-25a6b1a6=1","categoria":"CLIMA E ECONOMIA","lang":"pt"},{"fonte":"s2pmag","pais":"França","titulo":"A LG encontrou a tecnologia que faltava ao OLED para se impor em todos os lugares?","resumo":"A LG Display apresentou avanços significativos na tecnologia de painéis OLED para superar limitações históricas de brilho e durabilidade.\nEssa nova abordagem promete expandir o uso dessa tela para monitores, dispositivos móveis e visores automotivos de alta performance.\nCom maior eficiência energética e custos de produção otimizados, a inovação busca consolidar a tecnologia no mercado global.\nEspecialistas apontam que a novidade pode definir os novos padrões da indústria de eletrônicos de consumo nos próximos anos.","link":"https://s2pmag.ch/lg-a-t-il-trouve-la-technologie-qui-manquait-a-loled-pour-simposer-partout/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"fr.qz.com","pais":"França","titulo":"O que significa 'boomcession' para a economia da inteligência artificial","resumo":"O termo 'boomcession' descreve um cenário econômico atípico caracterizado por forte expansão tecnológica aliada a incertezas financeiras.\nNo setor de inteligência artificial, esse fenômeno reflete o grande volume de investimento em infraestrutura enquanto empresas buscam rentabilidade.\nAnalistas alertam para os riscos de superavaliação e para a necessidade de adaptar os modelos de negócios à nova realidade do mercado.\nA dinâmica promete moldar como startups e gigantes de tecnologia planejam suas próximas estratégias de expansão.","link":"https://fr.qz.com/boomcession-dfinition-ai-conomie-cart-de-sentiment-081226","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Futura, le média qui explore le monde","pais":"França","titulo":"Janelas abertas ou ar-condicionado no carro? A ciência desafia o senso comum","resumo":"Um novo estudo científico analisou a eficiência energética dos veículos ao comparar o uso de ar-condicionado com janelas abertas.\nOs resultados revelam que a força de arrasto aerodinâmico em altas velocidades gasta mais combustível do que o sistema de refrigeração.\nEm contrapartida, para trajetos urbanos e em baixas velocidades, manter as janelas abertas continua sendo a opção mais econômica.\nA pesquisa fornece dados precisos para motoristas otimizarem o consumo de combustível e reduzirem emissões no dia a dia.","link":"https://www.futura-sciences.com/automobile/actualites/voiture-electrique-fenetres-ouvertes-clim-voiture-science-bouscule-idees-recues-137217/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"tv5monde","pais":"França","titulo":"Em breve uma vacina contra o câncer de pele desenvolvida pela Merck e Moderna","resumo":"Os laboratórios Merck e Moderna estão avançando nos testes de uma vacina terapêutica promissora contra o melanoma.\nUtilizando a tecnologia de RNA mensageiro personalizada, o imunizante demonstrou reduzir significativamente o risco de recorrência da doença.\nOs resultados clínicos de fase avançada indicam uma nova era no tratamento oncológico de alta precisão e eficácia.\nA expectativa da comunidade médica é que o tratamento receba aprovação regulatória acelerada para disponibilidade comercial em breve.","link":"https://information.tv5monde.com/science/video/bientot-un-vaccin-contre-le-cancer-de-la-peau-par-les-laboratoires-merck-et-moderna-2834475?amp","categoria":"SAÚDE E CIÊNCIA","lang":"pt"},{"fonte":"BFM","pais":"França","titulo":"Paris em 12º e Roma em 60º: e se a tecnologia definisse a cidade de verão mais bonita através do seu olhar?","resumo":"Um estudo inovador utilizou tecnologia de rastreamento ocular para quantificar a atratividade estética das principais cidades do mundo.\nAo monitorar a fixação do olhar dos participantes diante de imagens urbanas, os pesquisadores criaram um ranking objetivo de beleza.\nParis surpreendeu ao ficar na 12ª posição, enquanto Roma ocupou a 60ª colocação, desafiando percepções turísticas tradicionais.\nA aplicação de dados biométricos abre novas perspectivas para a arquitetura, o planejamento urbano e o marketing turístico global.","link":"https://www.bfmtv.com/tech/vie-numerique/paris-ne-se-classe-qu-a-la-12e-place-rome-au-60e-rang-et-si-la-technologie-permettait-de-definir-la-plus-belle-ville-estivale-du-monde-en-scrutant-simplement-votre-regard_AN-202608210445.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Purebreak","pais":"França","titulo":"9,3 milhões de visualizações em 3 dias: nova série de ficção científica é sucesso de crítica e público","resumo":"Uma nova produção de ficção científica alcançou marcas históricas de audiência ao registrar mais de nove milhões de exibições em três dias.\nAlém do impressionante desempenho comercial, a obra tem recebido elogios efusivos da crítica especializada por seu roteiro e efeitos visuais.\nO sucesso estrondoso reforça o apelo contínuo do gênero sci-fi e consolida a série como um dos maiores fenômenos recentes do streaming.\nO engajamento massivo nas redes sociais indica que a franquia deve expandir suas temporadas e produções derivadas no futuro.","link":"https://www.purebreak.com/news/93-millions-de-vues-en-seulement-3-jours-cette-nouvelle-serie-de-science-fiction-enthousiasme-non-seulement-les-critiques-mais-est-aussi-un-veritable-succes-commercial/265857","categoria":"ENTRETENIMENTO","lang":"pt"},{"fonte":"The Conversation","pais":"França","titulo":"Realidade virtual, exposições e teatro: como a tecnologia perpetua a lenda do Titanic","resumo":"Recentes inovações tecnológicas, como a realidade virtual e escaneamentos 3D de alta resolução, estão revitalizando a história do Titanic.\nExposições imersivas e peças teatrais modernas utilizam esses recursos para oferecer ao público experiências hiper-realistas do navio.\nEssas ferramentas permitem a preservação digital do naufrágio e tornam o conhecimento histórico acessível a novas gerações.\nA fusão entre tecnologia e patrimônio cultural demonstra o potencial de recontar eventos históricos com impacto emocional e precisão.","link":"https://theconversation.com/realite-virtuelle-expositions-theatre-comment-la-technologie-perpetue-la-legende-du-titanic-287646","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Lincolnshire Live","pais":"Inglaterra","titulo":"Tecnologia radiológica especializada reduz tempos de espera para pacientes em dois hospitais de Lincolnshire","resumo":"A implementação de uma nova tecnologia radiológica especializada em dois hospitais de Lincolnshire está otimizando o atendimento médico na região. A inovação permite diagnósticos mais rápidos e precisos, reduzindo drasticamente as filas de espera dos pacientes. Esse avanço destaca o impacto da modernização digital nos serviços de saúde públicos, promovendo maior eficiência operacional e cuidado aos doentes.","link":"https://www.lincolnshirelive.co.uk/news/lincoln-news/specialist-radiology-technology-reducing-waiting-11113446","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"TikTok concorda com acordo de US$ 400 milhões para resolver ação sobre privacidade de crianças nos EUA","resumo":"O TikTok aceitou pagar 400 milhões de dólares para encerrar um grande processo judicial nos Estados Unidos sobre a privacidade infantil. A ação acusava a rede social de coletar e armazenar informações de crianças sem o consentimento devido dos pais. O acordo estabelece um precedente marcante para a regulamentação de Big Techs e reforça a pressão por normas globais de proteção de dados.","link":"https://www.theguardian.com/technology/2026/aug/21/tiktok-settlement-children-privacy","categoria":"PRIVACIDADE DIGITAL","lang":"pt"},{"fonte":"Utility Week","pais":"Inglaterra","titulo":"Mantendo trabalhadores de campo seguros com o uso de tecnologia de comunicação","resumo":"A adoção de tecnologias avançadas de comunicação está transformando a segurança de equipes que atuam em ambientes de campo e de alto risco. Ferramentas de monitoramento em tempo real e conectividade remota ajudam a prevenir acidentes e acelerar a resposta em emergências. Essa tendência reflete a consolidação da transformação digital aplicada à segurança do trabalho em diversos setores industriais.","link":"https://utilityweek.co.uk/keeping-field-workers-safe-using-communications-technology/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"20Minutos","pais":"Espanha","titulo":"Os dados do seu DNI que você nunca deve compartilhar, segundo um especialista em tecnologia","resumo":"Especialistas em segurança digital alertam para os riscos de compartilhar fotos ou cópias integrais do documento de identidade.\nDados como o número de suporte, data de validade e código de expedição podem ser usados por criminosos para fraudes e falsificação.\nA recomendação principal é ocultar informações sensíveis antes de enviar documentos para cadastros online ou serviços terceiros.\nA conscientização sobre o uso seguro de dados pessoais torna-se fundamental em um cenário de crescentes golpes digitais.","link":"https://www.20minutos.es/tecnologia/ciberseguridad/que-datos-dni-nunca-debes-compartir_6239657_0.html","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"EL PAÍS","pais":"Espanha","titulo":"'O mar não esquece': cientistas espanholas resgatam arquivos secretos da contaminação em águas profundas","resumo":"Pesquisadoras espanholas estão resgatando e analisando dados históricos cruciais sobre a poluição em ecossistemas marinhos profundos.\nO estudo revela como resíduos industriais e químicos depositados no passado continuam a impactar a vida marinha até os dias atuais.\nA iniciativa busca documentar o passivo ambiental negligenciado nas profundezas do oceano para orientar novas políticas de preservação.\nEsses registros históricos ajudam a prever os efeitos de longo prazo dos poluentes na biodiversidade aquática global.","link":"https://elpais.com/ciencia/2026-08-22/el-mar-no-olvida-las-cientificas-espanolas-que-rescatan-los-archivos-secretos-de-la-contaminacion-en-las-aguas-profundas.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"La Región","pais":"Espanha","titulo":"Nova tecnologia: Suíça quer construir a maior gigabateria de fluxo do mundo","resumo":"A Suíça anunciou um projeto ambicioso para a construção da maior bateria de fluxo do planeta dedicada ao armazenamento de energia.\nEssa tecnologia inovadora permite estocar grandes volumes de eletricidade renovável por longos períodos sem perda significativa de eficiência.\nO objetivo é fortalecer a estabilidade da rede elétrica nacional e acelerar a transição para fontes limpas de energia.\nA iniciativa representa um marco importante na busca por soluções sustentáveis para o desbalanceamento entre oferta e demanda energética.","link":"https://www.laregion.es/lri/emprendimiento/suiza-quiere-construir-mayor-gigabateria-mundo_1_20260822-4386081.html","categoria":"ENERGIA","lang":"pt"},{"fonte":"Infobae","pais":"Espanha","titulo":"É possível treinar a criatividade? O que diz a ciência e qual seu efeito no cérebro","resumo":"Estudos neurocientíficos recentes comprovam que a criatividade não é um dom inato, mas uma habilidade que pode ser exercitada e aprimorada.\nA prática contínua de atividades criativas estimula a plasticidade cerebral e fortalece conexões entre diferentes redes neurais.\nPesquisadores identificaram mudanças estruturais positivas no cérebro de pessoas que realizam treinos específicos de pensamento divergente.\nCompreender esse processo abre novas portas para métodos educacionais e de desenvolvimento pessoal baseados em evidências científicas.","link":"https://www.infobae.com/tendencias/2026/08/21/se-puede-entrenar-la-creatividad-que-dice-la-ciencia-y-cual-es-su-efecto-en-el-cerebro/","categoria":"NEUROCIÊNCIA","lang":"pt"},{"fonte":"El Periódico de la Energía","pais":"Espanha","titulo":"Tecnologia laser resolve problema de manutenção em usinas nucleares com condensadores de gelo","resumo":"Uma nova aplicação de tecnologia laser está revolucionando os processos de inspeção e manutenção em usinas nucleares.\nO sistema foi projetado especificamente para atuar em condensadores de gelo, locais de difícil acesso e alta complexidade operacional.\nA inovação reduz drasticamente o tempo de inatividade das instalações e aumenta a segurança dos operadores durante os reparos.\nA adoção dessa ferramenta representa um avanço significativo para a eficiência e a longevidade da infraestrutura energética nuclear.","link":"https://elperiodicodelaenergia.com/la-tecnologia-laser-resuelve-uno-de-los-problemas-de-mantenimiento-de-las-centrales-nucleares-con-condensadores-de-hielo/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Nintenderos","pais":"Espanha","titulo":"O que é a tecnologia DLSS e como ela melhora os jogos do Nintendo Switch 2?","resumo":"A tecnologia Deep Learning Super Sampling (DLSS) usa inteligência artificial para renderizar gráficos de alta qualidade consumindo menos processamento.\nNo contexto do Nintendo Switch 2, essa inovação promete entregar resoluções elevadas e taxas de quadros estáveis em um console portátil.\nA solução permite que jogos graficamente exigentes rodem de forma fluida sem comprometer excessivamente a vida útil da bateria.\nTrata-se de um salto tecnológico estratégico que deve aproximar o desempenho do novo portátil ao de consoles de mesa dedicados.","link":"https://www.nintenderos.com/2026/08/que-es-la-tecnologia-dlss-y-como-mejora-los-juegos-de-nintendo-switch-2/","categoria":"GAMES","lang":"pt"},{"fonte":"Cadena SER","pais":"Espanha","titulo":"E se pudessem ler sua mente? A ciência alcançou algo que parecia impossível","resumo":"Avanços recentes em neurotecnologia e inteligência artificial permitiram a tradução de pensamentos humanos em texto legível com alta precisão.\nCientistas utilizaram exames de ressonância magnética combinados com modelos de linguagem para decodificar a atividade cerebral de voluntários.\nA descoberta tem potencial transformador para restaurar a comunicação de pacientes que perderam a capacidade de falar devido a doenças neuromusculares.\nApesar dos benefícios médicos promissores, a novidade também levanta importantes debates éticos sobre a privacidade mental.","link":"https://cadenaser.com/nacional/2026/08/21/y-si-pudieran-leer-tu-mente-la-ciencia-ya-ha-conseguido-algo-que-parecia-imposible-cadena-ser/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"ABC","pais":"Espanha","titulo":"Vacina contra melanoma demonstra a utilidade da tecnologia de mRNA no combate ao câncer","resumo":"Ensaios clínicos com a nova vacina de mRNA contra o melanoma apresentaram resultados altamente promissores na redução de recidivas do câncer.\nA plataforma de RNA mensageiro ensina o sistema imunológico do próprio paciente a reconhecer e destruir células tumorais específicas.\nO sucesso dessa aplicação consolida o potencial da tecnologia desenvolvida durante a pandemia para o tratamento de oncologia personalizada.\nEspecialistas preveem que essa abordagem pode revolucionar os tratamentos contra diversos outros tipos de tumores nos próximos anos.","link":"https://www.abc.es/ciencia/vacuna-melanoma-demuestra-utilidad-tecnologia-arn-ante-20260821183406-nt.html","categoria":"SAÚDE","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Apple detalha valores pagos em impostos na Alemanha e na Europa","resumo":"A gigante da tecnologia Apple revelou pela primeira vez detalhes significativos sobre o volume de impostos pagos na Alemanha e na Europa.\nA medida busca aumentar a transparência fiscal em meio a crescentes debates e pressões regulatórias impostas a corporações multinacionais.\nAlém das cifras fiscais, a empresa destacou sua contribuição econômica contínua para a região, englobando investimentos em infraestrutura e geração de empregos.\nA divulgação dos dados reflete o esforço do grupo americano para se alinhar às crescentes exigências de conformidade fiscal e governança da União Europeia.","link":"https://www.sueddeutsche.de/wirtschaft/iphone-konzern-apple-beziffert-steuerzahlungen-in-deutschland-und-europa-dpa.urn-newsml-dpa-com-20090101-260822-930-565697","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"portalmie.com","pais":"Japão","titulo":"Tecnologia japonesa usa cerâmica para resfriar o solo no verão","resumo":"Pesquisadores e empresas no Japão desenvolveram um método inovador baseado em cerâmica para ajudar a resfriar o solo durante as intensas ondas de calor no verão.\nA solução aproveita o efeito de resfriamento evaporativo proporcionado por materiais cerâmicos porosos, reduzindo significativamente a temperatura das superfícies urbanas.\nA iniciativa busca mitigar o fenômeno das ilhas de calor nas grandes metrópoles japonesas e promover uma infraestrutura urbana mais sustentável.\nEssa tecnologia representa um avanço importante na adaptação às mudanças climáticas e no conforto térmico das cidades.","link":"https://portalmie.com/atualidade/2026/08/tecnologia-japonesa-usa-ceramica-para-resfriar-o-solo-no-verao/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"福井新聞社","pais":"Japão","titulo":"Expansão da previsão do tempo: avanços tecnológicos trazem maior mudança em 30 anos","resumo":"A Agência Meteorológica do Japão está promovendo a maior reformulação em seu sistema de previsão do tempo em mais de três décadas, impulsionada por novos avanços tecnológicos.\nOs modelos aperfeiçoados visam prever desastres naturais e condições climáticas adversas com maior precisão e antecedência para a população.\nApesar das melhorias estruturais, especialistas alertam que a previsão exata de temporais severos e muito localizados ainda apresenta limitações técnicas significativas.\nA atualização é considerada um passo crucial para fortalecer a gestão de riscos e a segurança civil no país frente ao clima extremo.","link":"https://www.fukuishimbun.co.jp/articles/-/2680345","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"The Japan Times","pais":"Japão","titulo":"Trump arrisca reação da China com plano para sufocar a economia do Irã","resumo":"Donald Trump planeja intensificar as sanções econômicas contra o Irã em uma tentativa de estrangular a receita financeira do país e isolá-lo internacionalmente.\nA estratégia, no entanto, ameaça gerar uma forte retaliação política e comercial por parte da China, que é a principal compradora do petróleo iraniano.\nAnalistas apontam que a medida pode desestabilizar ainda mais as relações entre as duas maiores potências globais e gerar volatilidade nos mercados de energia.\nA tensão geopolítica crescente coloca os parceiros econômicos globais em alerta para potenciais desdobramentos no comércio internacional.","link":"https://www.japantimes.co.jp/business/2026/08/22/economy/trump-china-blowback-iran-economy/","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"TBS NEWS DIG","pais":"Japão","titulo":"Por que a economia vai mal apesar das fortes exportações? A polarização em 'K' da Coreia do Sul","resumo":"Apesar de registrar índices expressivos de exportação, a economia sul-coreana enfrenta um sentimento generalizado de estagnação e crise interna.\nEspecialistas analisam a estrutura da chamada polarização em forma de \"K\", onde setores de alta tecnologia prosperam enquanto o consumo interno e pequenas empresas afundam.\nEsse desequilíbrio cria uma lacuna socioeconômica crescente entre grandes corporações globais e o restante da população do país.\nO fenômeno levanta alertas no Leste Asiático sobre a necessidade de reformas estruturais para garantir um crescimento mais inclusivo e equilibrado.","link":"https://newsdig.tbs.co.jp/articles/withbloomberg/2882076","categoria":"ECONOMIA","lang":"pt"},{"fonte":"MONOist","pais":"Japão","titulo":"Sinais de avanço na condução autônoma: investimento governamental e o novo SoC da Tier IV","resumo":"A tecnologia de veículos autônomos ganha novo fôlego no Japão com o apoio e investimento estratégico do governo federal no setor de manufatura.\nA startup japonesa Tier IV está liderando o desenvolvimento de um novo chip System-on-Chip (SoC) focado no processamento eficiente de sistemas autônomos.\nA iniciativa busca reduzir custos e acelerar a comercialização e segurança de veículos totalmente autônomos no mercado global.\nO avanço sinaliza um fortalecimento da competitividade industrial do Japão na corrida tecnológica da mobilidade do futuro.","link":"https://monoist.itmedia.co.jp/mn/articles/2608/22/news018.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"ロイター","pais":"Japão","titulo":"Mercado de ações dos EUA recupera-se com dados econômicos positivos, mas fecha semana em queda","resumo":"Os principais índices das bolsas de valores dos Estados Unidos apresentaram uma recuperação impulsionada por indicadores econômicos mais favoráveis.\nApesar da reação positiva no final da sessão, os três grandes índices encerraram a semana no campo negativo devido à volatilidade anterior.\nInvestidores continuam monitorando de perto os dados de inflação e as futuras decisões da taxa de juros pelo Federal Reserve.\nO comportamento do mercado americano repercute diretamente na confiança e no volume de negócios das bolsas asiáticas e globais.","link":"https://jp.reuters.com/markets/japan/DBDY7JFEL5KMHCZDSZD2LNTZSY-2026-08-21/","categoria":"MERCADOS","lang":"pt"},{"fonte":"朝日新聞","pais":"Japão","titulo":"Era da IA: a fusão com a ciência traz riscos de vazamento de dados confidenciais na revisão de artigos","resumo":"A crescente integração da inteligência artificial no meio científico tem acelerado pesquisas, mas também acendido alertas sobre segurança de dados.\nO uso de ferramentas de IA no processo de revisão por pares (peer review) de artigos científicos pode expor dados sigilosos e descobertas não publicadas.\nEspecialistas alertam para os riscos éticos e operacionais da automação irrestrita da avaliação acadêmica por algoritmos generativos.\nA comunidade científica debate a criação de diretrizes rigorosas para proteger a integridade e a privacidade das pesquisas avançadas.","link":"https://www.asahi.com/articles/DA3S16531031.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"朝日新聞","pais":"Japão","titulo":"Painel governamental debate segurança econômica e riscos da dependência de IA estrangeira","resumo":"O painel de especialistas em segurança do Japão reuniu-se para discutir os crescentes riscos associados à dependência de tecnologias de IA estrangeiras.\nA reunião abordou a necessidade de fortalecer a soberania digital e a resiliência das cadeias de suprimentos tecnológicas do país.\nOs debates fazem parte da revisão e implementação contínua dos três documentos fundamentais de estratégia e segurança nacional.\nAs conclusões devem orientar futuras políticas públicas de incentivo ao desenvolvimento tecnológico doméstico e à proteção de infraestruturas críticas.","link":"https://www.asahi.com/articles/ASV8P3V1KV8PUTFK00JM.html","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"Devdiscourse","pais":"China","titulo":"O Avanço das Olimpíadas de Robôs na China: Pavimentando o Futuro da Robótica","resumo":"As Olimpíadas de Robôs na China estão ganhando destaque significativo, servindo como um acelerador para inovações em robótica e inteligência artificial. O evento atrai desenvolvedores e pesquisadores do mundo inteiro, promovendo avanços práticos em automação, percepção e mobilidade. Esse movimento fortalece o ecossistema tecnológico do país e impulsiona novas aplicações industriais globais.","link":"https://www.devdiscourse.com/article/technology/3966558-the-rise-of-chinas-robot-olympics-paving-the-future-of-robotics","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Estudo Revela que Efeito do Campo Elétrico Espacial Impulsiona Reação Eficiente de Redução de Enxofre","resumo":"Pesquisadores identificaram que o efeito do campo elétrico espacial pode impulsionar de forma altamente eficiente a reação de redução do enxofre. Essa descoberta representa um avanço crucial na química de materiais e no desenvolvimento de novas soluções para armazenamento de energia. O estudo abre caminho para baterias de lítio-enxofre mais estáveis e de alta capacidade, acelerando a inovação em sistemas energéticos de próxima geração.","link":"https://news.sciencenet.cn/htmlnews/2026/8/570170.shtm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"科学网—新闻","pais":"China","titulo":"Pesquisa Desenvolve Novo Sistema Eficiente para Transformação e Edição Genética em Pimentas","resumo":"Cientistas chineses desenvolveram um novo sistema eficiente de transformação e edição genética focado na cultura do pimentão. A abordagem inovadora supera gargalos técnicos históricos no melhoramento genético vegetal, permitindo criar variedades mais resistentes a pragas e estresses climáticos. O avanço fortalece a segurança alimentar e impulsiona a biotecnologia agrícola em escala global.","link":"https://news.sciencenet.cn/htmlnews/2026/8/570168.shtm","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"中国科大新闻网","pais":"China","titulo":"Explorando a Fronteira das Partículas: Estudantes da USTC Realizam Visita Científica ao CERN","resumo":"Estudantes da Universidade de Ciência e Tecnologia da China participaram de um programa de imersão no Centro Europeu de Pesquisas Nucleares (CERN). A iniciativa focou no estudo da física de partículas de fronteira e fortaleceu a cooperação científica internacional da instituição. O intercâmbio busca capacitar novos talentos na investigação da estrutura fundamental da matéria e no uso de tecnologias avançadas de aceleração.","link":"https://news.ustc.edu.cn/info/1047/96016.htm","categoria":"FÍSICA","lang":"pt"},{"fonte":"The Guardian","pais":"China","titulo":"Tesla Faz Recall de Quase 3 Milhões de Veículos na China por Riscos de Segurança na Maçaneta","resumo":"A Tesla iniciou o recall de quase três milhões de veículos elétricos na China devido a riscos de segurança detectados no mecanismo das maçanetas das portas. A falha exige verificações técnicas e atualizações para garantir a proteção adequada aos ocupantes durante a navegação. A medida reflete o rigor regulatório crescente e os desafios de controle de qualidade no maior mercado automotivo do mundo.","link":"https://www.theguardian.com/technology/2026/aug/21/china-tesla-vehicle-recall","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"中国科技网","pais":"China","titulo":"Conferência de Inteligência Científica de 2026 É Realizada em Haidian com Lançamento de Polo de Inovação em Zhongguancun","resumo":"A Conferência de Inteligência Científica de 2026, realizada em Haidian, marcou o lançamento oficial da Zona de Inovação em IA para Ciência em Zhongguancun. O evento reuniu especialistas líderes para discutir a aplicação de inteligência artificial generativa no campo da pesquisa científica. A iniciativa consolida Pequim como um polo estratégico na convergência entre computação de alto desempenho e ciência avançada.","link":"https://www.stdaily.com/web/gdxw/2026-08/21/content_567910.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"中国科技网","pais":"China","titulo":"Avanço Crucial em Rede Inteligente Transmite Vídeo HD de Drones Leves via Satélite de Banda Estreita","resumo":"Pesquisadores alcançaram um marco na engenharia de telecomunicações ao transmitirem vídeo HD em tempo real a partir de drones leves conectados a satélites de banda estreita. A tecnologia supera restrições históricas de largura de banda em locais isolados que carecem de infraestrutura terrestre. A inovação possui alto impacto para operações de resgate, monitoramento ambiental e gestão de crises em áreas remotas.","link":"https://www.stdaily.com/web/gdxw/2026-08/21/content_567880.html","categoria":"TELECOMUNICAÇÕES","lang":"pt"},{"fonte":"新京报","pais":"China","titulo":"Conferência Internacional de Ciência Básica de 2026 É Encerrada com Debates sobre IA e Pesquisa Fundamental","resumo":"O encerramento da Conferência Internacional de Ciência Básica de 2026 destacou o papel transformador da inteligência artificial na pesquisa científica fundamental. Cientistas e pesquisadores globais debateram o uso de ferramentas computacionais avançadas para acelerar descobertas em matemática, física e biologia. O debate ressaltou a necessidade de integração interdisciplinar para enfrentar os desafios científicos do futuro.","link":"https://www.bjnews.com.cn/detail/1787310557129027.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Hindustan Times","pais":"Índia","titulo":"TTD planeja implantar cão robô para prevenir conflitos entre humanos e animais nas colinas de Tirumala","resumo":"O Tirumala Tirupati Devasthanams (TTD) está planejando utilizar cães robóticos de alta tecnologia para patrulhar as rotas de peregrinação nas colinas de Tirumala.\nA iniciativa visa monitorar a presença de animais selvagens, como leopardos e ursos, reduzindo significativamente os encontros perigosos com os fiéis.\nEquipados com sensores avançados e câmeras térmicas, os dispositivos poderão alertar as autoridades florestais em tempo real sobre ameaças iminentes.\nEssa solução inovadora une tecnologia de ponta e conservação ambiental para garantir a segurança dos visitantes em áreas de alto risco.","link":"https://www.hindustantimes.com/india-news/ttd-plans-to-deploy-robotic-dog-to-prevent-human-animal-conflicts-on-tirumala-hills-101787339750830.html","categoria":"ROBÓTICA","lang":"pt"},{"fonte":"welectric.pt","pais":"Portugal","titulo":"Dongfeng Mage chega a Portugal com tecnologia híbrida plug-in e até 1.200 km de autonomia","resumo":"A fabricante chinesa Dongfeng expande sua presença no mercado europeu com o lançamento do SUV Mage em Portugal.\nO veículo se destaca pela motorização híbrida plug-in avançada, prometendo uma autonomia combinada de até 1.200 quilômetros.\nA chegada deste modelo reflete o avanço da mobilidade sustentável e intensifica a competição no setor de veículos eletrificados na região.","link":"https://welectric.pt/2026/08/22/dongfeng-mage-chega-a-portugal-com-tecnologia-hibrida-plug-in-e-ate-1-200-km-de-autonomia/","categoria":"INOVAÇÃO AUTOMOTIVA","lang":"pt"},{"fonte":"Observador","pais":"Portugal","titulo":"Alentejo 2030 destina um milhão de euros para apoiar infraestruturas e equipamentos científicos","resumo":"O programa regional Alentejo 2030 anunciou o lançamento de um apoio financeiro de um milhão de euros voltado ao fortalecimento da pesquisa científica.\nO investimento visa modernizar infraestruturas e adquirir equipamentos de ponta para laboratórios e centros de inovação da região.\nA iniciativa busca alavancar a competitividade acadêmica e impulsionar o desenvolvimento tecnológico do ecossistema científico local.","link":"https://observador.pt/2026/08/22/alentejo-2030-com-um-milhao-de-euros-para-apoiar-infraestruturas-e-equipamentos-cientificos/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Tek Notícias","pais":"Portugal","titulo":"Dos blogs às redes sociais: Pedro Freitas e as diversas formas de produzir conteúdo sobre tecnologia","resumo":"O criador de conteúdo Pedro Freitas reflete sobre sua trajetória na divulgação tecnológica, abordando a evolução das plataformas digitais ao longo do tempo.\nCom passagem por blogs tradicionais, YouTube e redes sociais dinâmicas, o especialista analisa as profundas transformações na comunicação técnica.\nA análise destaca a importância de adaptar a linguagem sobre inovação para alcançar e engajar diferentes perfis de público.","link":"https://tek.sapo.pt/noticias/internet/artigos/dos-blogs-as-redes-sociais-e-com-o-youtube-pelo-meio-pedro-freitas-e-as-mil-e-uma-formas-de-falar-sobre-tecnologia/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Apple Cuts Staff in Siri, Vision Pro, and Gaming Teams","resumo":"Apple has initiated an internal restructuring with targeted layoffs affecting the Vision Pro mixed-reality headset, Siri assistant, and gaming divisions. The move reflects a strategic adjustment by the tech giant to reallocate resources toward priority projects in artificial intelligence. This shift signals the challenges facing the augmented reality market and the pursuit of greater operational efficiency in the innovation sector.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/21/apple-faz-cortes-nas-equipes-da-assistente-siri-do-vision-pro-e-de-jogos.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Portal Contabeis","pais":"Brazil","titulo":"AI Testing: Companies Validate Technology Before Scaling Solutions","resumo":"Brazilian and global companies are adopting rigorous testing and validation phases prior to deploying artificial intelligence at scale. The strategy aims to mitigate regulatory, operational, and security risks, ensuring more consistent returns on investment. The trend reflects a maturing market that has shifted from initial enthusiasm to a more cautious, results-driven adoption approach.","link":"https://www.contabeis.com.br/artigos/78925/teste-ia-empresas-validam-tecnologia-antes-de-escalar/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"TikTok to Pay $400 Million to Settle US Child Privacy Lawsuit","resumo":"TikTok has agreed to pay a substantial amount to settle allegations regarding the improper collection and management of data belonging to children and teens in the United States. The decision concludes a lengthy legal dispute with American regulators and pressures the social network to overhaul its minor protection policies. The settlement reinforces the growing global demand for data security and strict governance across digital platforms.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/21/tiktok-pagara-us-400-milhoes-para-encerrar-processo-sobre-privacidade-infantil-nos-eua.ghtml","categoria":"DIGITAL PRIVACY","lang":"en"},{"fonte":"RADAR DIGITAL BRASÍLIA","pais":"Brazil","titulo":"Blue Economy: Brazilian Government Establishes Scientific and Technological Cooperation with Japan","resumo":"The Brazilian government has formalized a strategic partnership with Japan to boost research and innovation projects focused on the Blue Economy. The cooperation aims at the sustainable development of marine resources, combining cutting-edge technology, ocean preservation, and responsible economic exploitation. The initiative strengthens scientific ties between the nations and drives global research for coastal sustainability.","link":"https://radardigitalbrasilia.com.br/agronegocio/economia-azul-governo-do-brasil-em-cooperacao-com-o-japao/","categoria":"SCIENCE AND INNOVATION","lang":"en"},{"fonte":"www.gov.br","pais":"Brazil","titulo":"Technology Studies Production of Hardier Seedlings to Restore Northeast Mangroves","resumo":"Researchers have developed technological techniques focused on cultivating and strengthening highly resilient plant seedlings for the restoration of northeastern mangroves. The project aims to accelerate the ecosystem recovery of degraded areas and combat the effects of climate change on the Brazilian coast. The initiative unites scientific innovation and environmental preservation to generate high-impact socio-ecological solutions.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/tecnologia-estuda-producao-de-mudas-mais-preparadas-para-restaurar-manguezais-do-nordeste","categoria":"SCIENCE AND ENVIRONMENT","lang":"en"},{"fonte":"Prefeitura de Belo Horizonte","pais":"Brazil","titulo":"New Technology Improves Predictability and Speed of Response to Adverse Event Impacts","resumo":"A new technological tool developed for risk monitoring makes it possible to anticipate and mitigate damages caused by disasters and severe weather events. The system uses advanced data analysis to accelerate decision-making and optimize emergency actions by public and private bodies. With greater predictability, the solution promises to save lives and reduce economic losses in vulnerable regions.","link":"https://prefeitura.pbh.gov.br/noticias/nova-tecnologia-de-geoprocessamento-melhora-previsibilidade-e-rapidez-da-resposta-aos","categoria":"TECHNOLOGICAL INNOVATION","lang":"en"},{"fonte":"Tribunal de Justiça do Estado da Bahia","pais":"Brazil","titulo":"Artificial Intelligence: TJBA Expands Debate on Technology Use in the Judiciary","resumo":"The Court of Justice of Bahia promoted in-depth discussions on the responsible and ethical integration of artificial intelligence tools in judicial proceedings. The debate brought together experts to evaluate productivity gains in procedural speed and the necessary safeguards for fundamental rights. The initiative seeks to establish solid guidelines for modernizing state judiciary management.","link":"https://www.tjba.jus.br/portal/inteligencia-artificial-tjba-amplia-debate-sobre-uso-da-tecnologia-no-judiciario/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Prefeitura de São Paulo","pais":"Brazil","titulo":"French Newspaper Le Monde Highlights Smart Sampa Technology on International Stage","resumo":"The prestigious Le Monde newspaper gave international prominence to the Smart Sampa program, emphasizing the use of urban technologies and monitoring systems in the capital of São Paulo. The report highlights how the integration of artificial intelligence and high-precision cameras positions São Paulo as a benchmark in security management. The international coverage reinforces Brazil's role in adopting digital solutions for smart cities.","link":"https://prefeitura.sp.gov.br/web/prefeitura-de-sao-paulo/w/jornal-franc%C3%AAs-le-monde-projeta-tecnologia-do-smart-sampa-em-cen%C3%A1rio-internacional","categoria":"SMART CITIES","lang":"en"},{"fonte":"El Confidencial","pais":"United States","titulo":"The Advance of Artificial Intelligence is Transforming the US Economy","resumo":"The rapid adoption of artificial intelligence is reshaping crucial sectors of the US economy. The technology is driving massive new investments in infrastructure, semiconductors, and corporate productivity. Experts point out that this structural transformation will alter labor market dynamics and the country's financial growth.","link":"https://www.elconfidencial.com/mercados/the-wall-street-journal/2026-08-22/auge-ia-transformando-economia-estadounidense_4404394/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"NBC Bay Area","pais":"United States","titulo":"Farmers Bet on New Steam Technology to Eliminate Pesticide Use","resumo":"An innovation based on treating soil with high-temperature steam promises to revolutionize agricultural production. The solution fights pests and weeds sustainably, reducing dependence on chemical products. With ongoing field testing, producers hope to lower environmental costs and meet the demand for organic food.","link":"https://www.nbcbayarea.com/news/local/farmers-steam-technology-pesticides/4131386/","categoria":"AGTECH","lang":"en"},{"fonte":"Industrial Equipment News","pais":"United States","titulo":"How Aluminum-Air Technology Is Replacing Diesel in Data Centers","resumo":"Data centers are adopting aluminum-air batteries as a sustainable alternative to traditional diesel generators. This innovation offers higher energy density, lower carbon emissions, and reduced operating costs for digital infrastructure. The transition is driven by the urgent need to power intensive workloads without compromising environmental goals.","link":"https://www.ien.com/operations/article/22972849/how-aluminumair-technology-is-moving-data-center-backup-power-beyond-diesel","categoria":"CLEAN ENERGY","lang":"en"},{"fonte":"Yahoo Finance","pais":"United States","titulo":"Marvell Shares Rise Following Expansion of AI Partnership with Google","resumo":"Marvell Technology has strengthened its presence in the artificial intelligence sector by expanding its strategic collaboration with Google. The partnership focuses on developing advanced semiconductor and network infrastructure solutions for cloud computing. Investors reacted positively to the agreement, driving up the company's estimated share value amid growing demand for specialized chips.","link":"https://finance.yahoo.com/markets/stocks/articles/marvell-technology-mrvl-stock-fair-211042043.html","categoria":"TECH MARKET","lang":"en"},{"fonte":"News-Medical","pais":"United States","titulo":"New 3D Mapping Technology Reveals Hair Follicle Formation Over Time","resumo":"Researchers have developed an innovative three-dimensional mapping system to track cellular growth in real-time. The tool has made it possible to record, with unprecedented precision, the biological development stages of hair follicles. The discovery paves the way for breakthroughs in baldness treatments, tissue regeneration, and advanced dermatological therapies.","link":"https://www.news-medical.net/news/20260821/New-3D-mapping-technology-reveals-how-hair-follicles-form-over-time.aspx","categoria":"SCIENCE","lang":"en"},{"fonte":"Carnegie Mellon University","pais":"United States","titulo":"Researcher Explores the Hidden Mathematics Driving Artificial Intelligence","resumo":"Advanced studies are revealing the complex mathematical structures behind the deep learning of neural networks. Understanding these theoretical foundations makes it possible to optimize algorithms, making AI models more efficient and reliable. The work promises to accelerate the development of new computing architectures with lower processing resource consumption.","link":"https://www.cmu.edu/mcs/news-events/2026/0821-simons-fellowship-mun","categoria":"SCIENCE AND DATA","lang":"en"},{"fonte":"Popular Science","pais":"United States","titulo":"British Man Spends $7,000 to Build Street-Legal Sports Car in His Own Shed","resumo":"An engineering enthusiast has built a high-performance automobile from scratch using a modest budget and custom-adapted parts. The vehicle passed rigorous vehicle safety tests and received official homologation for public roads. The project went viral by demonstrating that creative manufacturing solutions can rival high-cost commercial sports models.","link":"https://www.popsci.com/technology/british-man-builds-sports-car-shed/","categoria":"INNOVATION","lang":"en"},{"fonte":"Financial Times","pais":"United States","titulo":"How climate risks are beginning to cascade through the US economy","resumo":"Extreme weather events are no longer isolated threats, but rather factors of economic destabilization in the United States.\nImpacts on the real estate sector, rising insurance costs, and supply chain disruptions are creating interconnected domino effects.\nAnalysts warn of the urgent need for adaptation policies to mitigate systemic losses within the financial system.","link":"https://www.ft.com/content/77207b97-db2a-4f77-83a4-5479cea3b5e9?syn-25a6b1a6=1","categoria":"CLIMATE AND ECONOMY","lang":"en"},{"fonte":"s2pmag","pais":"France","titulo":"Has LG found the technology OLED was missing to dominate everywhere?","resumo":"LG Display has unveiled significant advancements in OLED panel technology to overcome historical limitations in brightness and durability.\nThis new approach promises to expand the use of these displays to high-performance monitors, mobile devices, and automotive screens.\nWith greater energy efficiency and optimized production costs, the innovation aims to solidify the technology in the global market.\nExperts point out that this novelty could set new standards for the consumer electronics industry in the coming years.","link":"https://s2pmag.ch/lg-a-t-il-trouve-la-technologie-qui-manquait-a-loled-pour-simposer-partout/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"fr.qz.com","pais":"France","titulo":"What 'boomcession' means for the artificial intelligence economy","resumo":"The term 'boomcession' describes an atypical economic scenario characterized by strong technological expansion combined with financial uncertainty.\nIn the artificial intelligence sector, this phenomenon reflects the large volume of infrastructure investment as companies strive for profitability.\nAnalysts warn of the risks of overvaluation and the need to adapt business models to the new market reality.\nThis dynamic promises to shape how startups and tech giants plan their upcoming expansion strategies.","link":"https://fr.qz.com/boomcession-dfinition-ai-conomie-cart-de-sentiment-081226","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Futura, le média qui explore le monde","pais":"France","titulo":"Open windows or AC in the car? Science challenges common sense","resumo":"A new scientific study analyzed vehicle energy efficiency by comparing the use of air conditioning with open windows.\nThe results reveal that aerodynamic drag at high speeds consumes more fuel than the cooling system.\nConversely, for urban commutes and low speeds, keeping the windows down remains the most economical option.\nThe research provides precise data for drivers to optimize fuel consumption and reduce emissions in daily driving.","link":"https://www.futura-sciences.com/automobile/actualites/voiture-electrique-fenetres-ouvertes-clim-voiture-science-bouscule-idees-recues-137217/","categoria":"SCIENCE","lang":"en"},{"fonte":"tv5monde","pais":"France","titulo":"A skin cancer vaccine developed by Merck and Moderna coming soon","resumo":"Pharmaceutical companies Merck and Moderna are advancing trials for a promising therapeutic vaccine against melanoma.\nUtilizing personalized messenger RNA technology, the immunization has been shown to significantly reduce the risk of disease recurrence.\nAdvanced clinical trial results point to a new era in high-precision, highly effective oncological treatment.\nThe medical community expects the treatment to receive expedited regulatory approval for commercial availability soon.","link":"https://information.tv5monde.com/science/video/bientot-un-vaccin-contre-le-cancer-de-la-peau-par-les-laboratoires-merck-et-moderna-2834475?amp","categoria":"HEALTH AND SCIENCE","lang":"en"},{"fonte":"BFM","pais":"France","titulo":"Paris in 12th and Rome in 60th: what if technology defined the most beautiful summer city through your gaze?","resumo":"An innovative study used eye-tracking technology to quantify the aesthetic appeal of the world's major cities.\nBy monitoring participants' gaze fixation on urban images, researchers created an objective beauty ranking.\nParis surprised by taking 12th place, while Rome ranked 60th, challenging traditional tourist perceptions.\nThe application of biometric data opens new perspectives for architecture, urban planning, and global tourism marketing.","link":"https://www.bfmtv.com/tech/vie-numerique/paris-ne-se-classe-qu-a-la-12e-place-rome-au-60e-rang-et-si-la-technologie-permettait-de-definir-la-plus-belle-ville-estivale-du-monde-en-scrutant-simplement-votre-regard_AN-202608210445.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Purebreak","pais":"France","titulo":"9.3 million views in 3 days: new sci-fi series is a critical and public success","resumo":"A new science fiction production reached historic viewership milestones by recording over nine million views in three days.\nBeyond its impressive commercial performance, the work has received glowing praise from specialized critics for its script and visual effects.\nThis staggering success reinforces the continued appeal of the sci-fi genre and cements the series as one of streaming's biggest recent phenomena.\nMassive social media engagement indicates that the franchise is set to expand its seasons and spin-off productions in the future.","link":"https://www.purebreak.com/news/93-millions-de-vues-en-seulement-3-jours-cette-nouvelle-serie-de-science-fiction-enthousiasme-non-seulement-les-critiques-mais-est-aussi-un-veritable-succes-commercial/265857","categoria":"ENTERTAINMENT","lang":"en"},{"fonte":"The Conversation","pais":"France","titulo":"Virtual reality, exhibitions, and theater: how technology perpetuates the Titanic legend","resumo":"Recent technological innovations, such as virtual reality and high-resolution 3D scans, are revitalizing the story of the Titanic.\nImmersive exhibitions and modern theatrical plays utilize these resources to offer the public hyper-realistic experiences of the ship.\nThese tools enable the digital preservation of the wreck and make historical knowledge accessible to new generations.\nThe fusion of technology and cultural heritage demonstrates the potential to retell historical events with emotional impact and precision.","link":"https://theconversation.com/realite-virtuelle-expositions-theatre-comment-la-technologie-perpetue-la-legende-du-titanic-287646","categoria":"INNOVATION","lang":"en"},{"fonte":"Lincolnshire Live","pais":"England","titulo":"Specialized radiology technology reduces patient wait times in two Lincolnshire hospitals","resumo":"The implementation of specialized radiology technology in two Lincolnshire hospitals is optimizing medical care in the region. The innovation allows for faster and more accurate diagnoses, drastically reducing patient waiting lists. This advancement highlights the impact of digital modernization on public health services, promoting greater operational efficiency and patient care.","link":"https://www.lincolnshirelive.co.uk/news/lincoln-news/specialist-radiology-technology-reducing-waiting-11113446","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"TikTok agrees to $400m settlement over US children's privacy lawsuit","resumo":"TikTok has agreed to pay $400 million to settle a major lawsuit in the United States concerning children's privacy. The lawsuit accused the social network of collecting and storing children's information without proper parental consent. The settlement sets a striking precedent for the regulation of Big Tech and reinforces pressure for global data protection standards.","link":"https://www.theguardian.com/technology/2026/aug/21/tiktok-settlement-children-privacy","categoria":"DIGITAL PRIVACY","lang":"en"},{"fonte":"Utility Week","pais":"England","titulo":"Keeping field workers safe using communications technology","resumo":"The adoption of advanced communications technologies is transforming the safety of teams operating in field and high-risk environments. Real-time monitoring tools and remote connectivity help prevent accidents and accelerate emergency response. This trend reflects the consolidation of digital transformation applied to occupational safety across various industrial sectors.","link":"https://utilityweek.co.uk/keeping-field-workers-safe-using-communications-technology/","categoria":"INNOVATION","lang":"en"},{"fonte":"20Minutos","pais":"Spain","titulo":"The DNI data you should never share, according to a tech expert","resumo":"Digital security experts warn against the risks of sharing photos or full copies of your identity document.\nData such as the support number, expiration date, and issue code can be used by criminals for fraud and forgery.\nThe primary recommendation is to obscure sensitive information before sending documents for online registrations or third-party services.\nRaising awareness about the secure use of personal data is critical amid a backdrop of rising digital scams.","link":"https://www.20minutos.es/tecnologia/ciberseguridad/que-datos-dni-nunca-debes-compartir_6239657_0.html","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"EL PAÍS","pais":"Spain","titulo":"'The sea does not forget': Spanish female scientists rescue secret files on deep-water contamination","resumo":"Spanish female researchers are recovering and analyzing crucial historical data regarding pollution in deep marine ecosystems.\nThe study reveals how industrial and chemical waste deposited in the past continues to impact marine life to this day.\nThe initiative seeks to document neglected environmental liabilities in the ocean depths to guide new preservation policies.\nThese historical records help predict the long-term effects of pollutants on global aquatic biodiversity.","link":"https://elpais.com/ciencia/2026-08-22/el-mar-no-olvida-las-cientificas-espanolas-que-rescatan-los-archivos-secretos-de-la-contaminacion-en-las-aguas-profundas.html","categoria":"SCIENCE","lang":"en"},{"fonte":"La Región","pais":"Spain","titulo":"New technology: Switzerland aims to build the world's largest flow gigabattery","resumo":"Switzerland has announced an ambitious project to build the planet's largest flow battery dedicated to energy storage.\nThis innovative technology makes it possible to store large volumes of renewable electricity for extended periods without significant loss of efficiency.\nThe goal is to strengthen national grid stability and accelerate the transition to clean energy sources.\nThe initiative represents a major milestone in the search for sustainable solutions to the imbalance between energy supply and demand.","link":"https://www.laregion.es/lri/emprendimiento/suiza-quiere-construir-mayor-gigabateria-mundo_1_20260822-4386081.html","categoria":"ENERGY","lang":"en"},{"fonte":"Infobae","pais":"Spain","titulo":"Can creativity be trained? What science says and its effect on the brain","resumo":"Recent neuroscientific studies prove that creativity is not an innate gift, but a skill that can be practiced and enhanced.\nThe continuous practice of creative activities stimulates brain plasticity and strengthens connections between different neural networks.\nResearchers have identified positive structural changes in the brains of people who engage in specific divergent-thinking training.\nUnderstanding this process opens new doors for educational methods and personal development based on scientific evidence.","link":"https://www.infobae.com/tendencias/2026/08/21/se-puede-entrenar-la-creatividad-que-dice-la-ciencia-y-cual-es-su-efecto-en-el-cerebro/","categoria":"NEUROSCIENCE","lang":"en"},{"fonte":"El Periódico de la Energía","pais":"Spain","titulo":"Laser Technology Resolves Maintenance Issue in Nuclear Plants with Ice Condensers","resumo":"A new application of laser technology is revolutionizing inspection and maintenance processes in nuclear power plants.\nThe system was specifically designed to operate in ice condensers, which are hard-to-reach locations with high operational complexity.\nThe innovation drastically reduces facility downtime and increases operator safety during repairs.\nThe adoption of this tool represents a significant advancement for the efficiency and longevity of nuclear energy infrastructure.","link":"https://elperiodicodelaenergia.com/la-tecnologia-laser-resuelve-uno-de-los-problemas-de-mantenimiento-de-las-centrales-nucleares-con-condensadores-de-hielo/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Nintenderos","pais":"Spain","titulo":"What Is DLSS Technology and How Does It Improve Nintendo Switch 2 Games?","resumo":"Deep Learning Super Sampling (DLSS) technology uses artificial intelligence to render high-quality graphics while consuming less processing power.\nIn the context of the Nintendo Switch 2, this innovation promises to deliver high resolutions and stable frame rates on a handheld console.\nThe solution allows graphically demanding games to run smoothly without overly compromising battery life.\nThis is a strategic technological leap that is expected to bring the new handheld's performance close to that of dedicated home consoles.","link":"https://www.nintenderos.com/2026/08/que-es-la-tecnologia-dlss-y-como-mejora-los-juegos-de-nintendo-switch-2/","categoria":"GAMES","lang":"en"},{"fonte":"Cadena SER","pais":"Spain","titulo":"What if They Could Read Your Mind? Science Has Achieved Something That Seemed Impossible","resumo":"Recent advances in neurotechnology and artificial intelligence have allowed the translation of human thoughts into readable text with high precision.\nScientists used magnetic resonance imaging combined with language models to decode the brain activity of volunteers.\nThe discovery has transformative potential to restore communication for patients who have lost the ability to speak due to neuromuscular diseases.\nDespite the promising medical benefits, the novelty also raises important ethical debates regarding mental privacy.","link":"https://cadenaser.com/nacional/2026/08/21/y-si-pudieran-leer-tu-mente-la-ciencia-ya-ha-conseguido-algo-que-parecia-imposible-cadena-ser/","categoria":"SCIENCE","lang":"en"},{"fonte":"ABC","pais":"Spain","titulo":"Melanoma Vaccine Demonstrates the Utility of mRNA Technology in Combating Cancer","resumo":"Clinical trials with the new mRNA melanoma vaccine have shown highly promising results in reducing cancer recurrences.\nThe messenger RNA platform teaches the patient's own immune system to recognize and destroy specific tumor cells.\nThe success of this application consolidates the potential of the technology developed during the pandemic for personalized oncology treatment.\nExperts predict that this approach could revolutionize treatments against various other types of tumors in the coming years.","link":"https://www.abc.es/ciencia/vacuna-melanoma-demuestra-utilidad-tecnologia-arn-ante-20260821183406-nt.html","categoria":"HEALTH","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"Apple Details Tax Payments Made in Germany and Europe","resumo":"Technology giant Apple has revealed for the first time significant details about the volume of taxes paid in Germany and Europe.\nThe measure seeks to increase fiscal transparency amid growing debates and regulatory pressures imposed on multinational corporations.\nIn addition to the tax figures, the company highlighted its ongoing economic contribution to the region, encompassing infrastructure investments and job creation.\nThe disclosure of the data reflects the American group's effort to align with the European Union's growing demands for tax compliance and governance.","link":"https://www.sueddeutsche.de/wirtschaft/iphone-konzern-apple-beziffert-steuerzahlungen-in-deutschland-und-europa-dpa.urn-newsml-dpa-com-20090101-260822-930-565697","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"portalmie.com","pais":"Japan","titulo":"Japanese Technology Uses Ceramics to Cool the Ground in Summer","resumo":"Researchers and companies in Japan have developed an innovative ceramic-based method to help cool the ground during intense summer heatwaves.\nThe solution leverages the evaporative cooling effect provided by porous ceramic materials, significantly reducing urban surface temperatures.\nThe initiative aims to mitigate the heat island phenomenon in major Japanese metropolises and promote more sustainable urban infrastructure.\nThis technology represents an important step forward in climate change adaptation and thermal comfort in cities.","link":"https://portalmie.com/atualidade/2026/08/tecnologia-japonesa-usa-ceramica-para-resfriar-o-solo-no-verao/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"福井新聞社","pais":"Japan","titulo":"Weather Forecasting Expansion: Technological Advances Bring Biggest Change in 30 Years","resumo":"The Japan Meteorological Agency is promoting the largest overhaul of its weather forecasting system in over three decades, driven by new technological advances.\nThe improved models aim to forecast natural disasters and adverse weather conditions with greater precision and advance notice for the population.\nDespite structural improvements, experts warn that the exact prediction of severe and highly localized storms still presents significant technical limitations.\nThe upgrade is considered a crucial step to strengthen risk management and civil security in the country facing extreme weather.","link":"https://www.fukuishimbun.co.jp/articles/-/2680345","categoria":"SCIENCE","lang":"en"},{"fonte":"The Japan Times","pais":"Japan","titulo":"Trump Risks China Blowback with Plan to Squeeze Iran's Economy","resumo":"Donald Trump plans to intensify economic sanctions against Iran in an attempt to strangle the country's financial revenue and isolate it internationally.\nThe strategy, however, threatens to spark strong political and commercial retaliation from China, which is the main buyer of Iranian oil.\nAnalysts point out that the measure could further destabilize relations between the two global superpowers and generate volatility in energy markets.\nGrowing geopolitical tension puts global economic partners on alert for potential developments in international trade.","link":"https://www.japantimes.co.jp/business/2026/08/22/economy/trump-china-blowback-iran-economy/","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"TBS NEWS DIG","pais":"Japan","titulo":"Why Is the Economy Doing Poorly Despite Strong Exports? South Korea's 'K-Shaped' Polarization","resumo":"Despite registering expressive export figures, the South Korean economy faces a widespread sense of stagnation and domestic crisis.\nExperts analyze the structure of so-called \"K-shaped\" polarization, where high-tech sectors thrive while domestic consumption and small businesses sink.\nThis imbalance creates a growing socioeconomic gap between major global corporations and the rest of the country's population.\nThe phenomenon raises warnings in East Asia about the need for structural reforms to ensure more inclusive and balanced growth.","link":"https://newsdig.tbs.co.jp/articles/withbloomberg/2882076","categoria":"ECONOMY","lang":"en"},{"fonte":"MONOist","pais":"Japan","titulo":"Signs of Progress in Autonomous Driving: Government Investment and Tier IV's New SoC","resumo":"Autonomous vehicle technology is gaining new momentum in Japan with government support and strategic investment in the manufacturing sector.\nJapanese startup Tier IV is leading the development of a new System-on-Chip (SoC) focused on the efficient processing of autonomous systems.\nThe initiative seeks to reduce costs and accelerate the commercialization and safety of fully autonomous vehicles on the global market.\nThe advance signals a strengthening of Japan's industrial competitiveness in the technological race for the mobility of the future.","link":"https://monoist.itmedia.co.jp/mn/articles/2608/22/news018.html","categoria":"INNOVATION","lang":"en"},{"fonte":"ロイター","pais":"Japan","titulo":"US Stock Market Recovers on Positive Economic Data, but Closes Week Lower","resumo":"The main indexes of the United States stock exchanges showed a recovery driven by more favorable economic indicators.\nDespite the positive reaction at the end of the session, the three major indexes ended the week in negative territory due to earlier volatility.\nInvestors continue to closely monitor inflation data and future interest rate decisions by the Federal Reserve.\nU.S. market behavior directly impacts the confidence and trading volume of Asian and global stock exchanges.","link":"https://jp.reuters.com/markets/japan/DBDY7JFEL5KMHCZDSZD2LNTZSY-2026-08-21/","categoria":"MARKETS","lang":"en"},{"fonte":"朝日新聞","pais":"Japan","titulo":"AI Era: Fusion with Science Brings Risks of Confidential Data Leaks in Article Review","resumo":"The growing integration of artificial intelligence in the scientific field has accelerated research, but has also raised warnings about data security.\nThe use of AI tools in the peer review process of scientific papers can expose sensitive data and unpublished discoveries.\nExperts warn of the ethical and operational risks of unrestricted automation of academic evaluation by generative algorithms.\nThe scientific community is debating the creation of rigorous guidelines to protect the integrity and privacy of advanced research.","link":"https://www.asahi.com/articles/DA3S16531031.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"朝日新聞","pais":"Japan","titulo":"Government Panel Debates Economic Security and Risks of Foreign AI Dependency","resumo":"Japan's security panel of experts met to discuss the growing risks associated with dependence on foreign AI technologies.\nThe meeting addressed the need to strengthen digital sovereignty and the resilience of the country's technological supply chains.\nThe debates are part of the ongoing review and implementation of the three fundamental national strategy and security documents.\nThe conclusions are expected to guide future public policies to encourage domestic technological development and protect critical infrastructure.","link":"https://www.asahi.com/articles/ASV8P3V1KV8PUTFK00JM.html","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"Devdiscourse","pais":"China","titulo":"The Rise of China's Robot Olympics: Paving the Future of Robotics","resumo":"China's Robot Olympics are gaining significant prominence, serving as an accelerator for innovations in robotics and artificial intelligence. The event attracts developers and researchers from around the world, promoting practical advances in automation, perception, and mobility. This movement strengthens the country's technological ecosystem and drives new global industrial applications.","link":"https://www.devdiscourse.com/article/technology/3966558-the-rise-of-chinas-robot-olympics-paving-the-future-of-robotics","categoria":"ROBOTICS","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Study Reveals Spatial Electric Field Effect Boosts Efficient Sulfur Reduction Reaction","resumo":"Researchers have identified that the spatial electric field effect can highly efficiently boost the sulfur reduction reaction. This discovery represents a crucial breakthrough in materials chemistry and the development of new energy storage solutions. The study paves the way for more stable, high-capacity lithium-sulfur batteries, accelerating innovation in next-generation energy systems.","link":"https://news.sciencenet.cn/htmlnews/2026/8/570170.shtm","categoria":"SCIENCE","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Research Develops New Efficient System for Genetic Transformation and Editing in Peppers","resumo":"Chinese scientists have developed a new, highly efficient genetic transformation and editing system focused on pepper cultivation. This innovative approach overcomes historical technical bottlenecks in plant breeding, allowing for the creation of varieties that are more resistant to pests and climate stress. The breakthrough strengthens food security and boosts agricultural biotechnology on a global scale.","link":"https://news.sciencenet.cn/htmlnews/2026/8/570168.shtm","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"中国科大新闻网","pais":"China","titulo":"Exploring the Particle Frontier: USTC Students Embark on Scientific Visit to CERN","resumo":"Students from the University of Science and Technology of China participated in an immersion program at the European Organization for Nuclear Research (CERN). The initiative focused on studying frontier particle physics and strengthened the institution's international scientific cooperation. The exchange aims to train new talent in investigating the fundamental structure of matter and utilizing advanced acceleration technologies.","link":"https://news.ustc.edu.cn/info/1047/96016.htm","categoria":"PHYSICS","lang":"en"},{"fonte":"The Guardian","pais":"China","titulo":"Tesla Recalls Nearly 3 Million Vehicles in China Over Door Handle Safety Risks","resumo":"Tesla has initiated a recall of nearly three million electric vehicles in China due to safety risks detected in the door handle mechanism. The flaw requires technical checks and updates to ensure proper protection for occupants while driving. The move reflects growing regulatory rigor and quality control challenges in the world's largest automotive market.","link":"https://www.theguardian.com/technology/2026/aug/21/china-tesla-vehicle-recall","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"2026 Scientific Intelligence Conference Held in Haidian with Launch of Zhongguancun Innovation Hub","resumo":"The 2026 Scientific Intelligence Conference, held in Haidian, marked the official launch of the Zhongguancun AI for Science Innovation Zone. The event gathered leading experts to discuss the application of generative artificial intelligence in the field of scientific research. The initiative consolidates Beijing as a strategic hub in the convergence of high-performance computing and advanced science.","link":"https://www.stdaily.com/web/gdxw/2026-08/21/content_567910.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"中国科技网","pa
