is":"China","titulo":"Crucial Smart Grid Breakthrough Transmits HD Video from Lightweight Drones via Narrowband Satellite","resumo":"Researchers have achieved a telecommunications engineering milestone by transmitting real-time HD video from lightweight drones connected to narrowband satellites. The technology overcomes historical bandwidth restrictions in isolated locations lacking terrestrial infrastructure. The innovation has a high impact on rescue operations, environmental monitoring, and crisis management in remote areas.","link":"https://www.stdaily.com/web/gdxw/2026-08/21/content_567880.html","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"新京报","pais":"China","titulo":"2026 International Congress of Basic Science Concludes with Debates on AI and Fundamental Research","resumo":"The closing of the 2026 International Congress of Basic Science highlighted the transformative role of artificial intelligence in fundamental scientific research. Scientists and global researchers debated the use of advanced computational tools to accelerate discoveries in mathematics, physics, and biology. The discussion underscored the need for interdisciplinary integration to tackle future scientific challenges.","link":"https://www.bjnews.com.cn/detail/1787310557129027.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Hindustan Times","pais":"India","titulo":"TTD Plans to Deploy Robotic Dog to Prevent Human-Animal Conflicts on Tirumala Hills","resumo":"The Tirumala Tirupati Devasthanams (TTD) is planning to use high-tech robotic dogs to patrol pilgrimage routes on the Tirumala Hills. The initiative aims to monitor the presence of wild animals, such as leopards and bears, significantly reducing dangerous encounters with worshippers. Equipped with advanced sensors and thermal cameras, the devices will be able to alert forestry authorities in real-time about imminent threats. This innovative solution combines cutting-edge technology and environmental conservation to ensure visitor safety in high-risk areas.","link":"https://www.hindustantimes.com/india-news/ttd-plans-to-deploy-robotic-dog-to-prevent-human-animal-conflicts-on-tirumala-hills-101787339750830.html","categoria":"ROBOTICS","lang":"en"},{"fonte":"welectric.pt","pais":"Portugal","titulo":"Dongfeng Mage Arrives in Portugal with Plug-in Hybrid Technology and Up to 1,200 km Range","resumo":"Chinese manufacturer Dongfeng is expanding its presence in the European market with the launch of the Mage SUV in Portugal. The vehicle stands out for its advanced plug-in hybrid powertrain, promising a combined range of up to 1,200 kilometers. The arrival of this model reflects the advancement of sustainable mobility and intensifies competition in the region's electrified vehicle sector.","link":"https://welectric.pt/2026/08/22/dongfeng-mage-chega-a-portugal-com-tecnologia-hibrida-plug-in-e-ate-1-200-km-de-autonomia/","categoria":"AUTOMOTIVE INNOVATION","lang":"en"},{"fonte":"Observador","pais":"Portugal","titulo":"Alentejo 2030 Allocates One Million Euros to Support Scientific Infrastructure and Equipment","resumo":"The Alentejo 2030 regional program announced the launch of one million euros in financial support aimed at strengthening scientific research. The investment aims to modernize infrastructure and acquire cutting-edge equipment for laboratories and innovation centers in the region. The initiative seeks to boost academic competitiveness and drive technological development in the local scientific ecosystem.","link":"https://observador.pt/2026/08/22/alentejo-2030-com-um-milhao-de-euros-para-apoiar-infraestruturas-e-equipamentos-cientificos/","categoria":"SCIENCE","lang":"en"},{"fonte":"Tek Notícias","pais":"Portugal","titulo":"From Blogs to Social Media: Pedro Freitas and the Diverse Ways of Producing Tech Content","resumo":"Content creator Pedro Freitas reflects on his journey in technology journalism, addressing the evolution of digital platforms over time. Having worked with traditional blogs, YouTube, and dynamic social media, the specialist analyzes profound transformations in technical communication. The analysis highlights the importance of adapting the language of innovation to reach and engage different audience profiles.","link":"https://tek.sapo.pt/noticias/internet/artigos/dos-blogs-as-redes-sociais-e-com-o-youtube-pelo-meio-pedro-freitas-e-as-mil-e-uma-formas-de-falar-sobre-tecnologia/","categoria":"TECHNOLOGY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
</body>
