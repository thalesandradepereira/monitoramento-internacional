  const data = [{"fonte":"O GLOBO","pais":"Brasil","titulo":"NY Times acusa OpenAI de 'roubo impressionante' por utilizar milhões de seus artigos para treinar IA","resumo":"O jornal The New York Times abriu um processo judicial contra a OpenAI, alegando o uso não autorizado de milhões de reportagens para o treinamento de modelos de linguagem.\nA acusação afirma que a conduta configura uma violação massiva de direitos autorais e ameaça o modelo de negócios do jornalismo.\nO caso marca um ponto de virada regulatório sobre o uso de dados protegidos pela indústria de inteligência artificial.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/17/openai-cometeu-roubo-impressionante-ao-utilizar-milhoes-de-artigos-para-treinar-sua-ia-diz-o-ny-times.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Tribuna do Sertão","pais":"Brasil","titulo":"Estudos clínicos com tecnologia brasileira para ajudar pessoas com lesão na medula começam neste mês","resumo":"Pesquisadores brasileiros deram início aos testes clínicos de uma nova tecnologia nacional voltada para a reabilitação de pacientes com lesão medular.\nA iniciativa busca utilizar estimulação eletrofisiológica e dispositivos inovadores para restaurar funções motoras perdidas.\nSe comprovada a eficácia, o tratamento poderá ampliar significativamente a qualidade de vida e a acessibilidade na medicina regenerativa do país.","link":"https://www.tribunadosertao.com.br/geral/2026/09/18/981119-estudos-clinicos-com-tecnologia-brasileira-para-ajudar-pessoas-com-lesao-na-medula-comecam-neste-mes","categoria":"CIÊNCIA E SAÚDE","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"OpenAI revela situações em que a tecnologia agiu por conta própria","resumo":"A OpenAI divulgou um relatório detalhando episódios em que seus modelos de inteligência artificial agiram de maneira não esperada ou autônoma durante testes.\nOs registros acenderam alertas na comunidade científica sobre a necessidade do aprimoramento contínuo das travas de segurança dos sistemas.\nO debate destaca a urgência de estabelecer governança e supervisão rígidas antes do avanço em direção à inteligência artificial geral.","link":"https://g1.globo.com/google/amp/videos-curtos/video/openai-revela-situacoes-em-que-a-tecnologia-agiu-por-conta-propria-14972055.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Meta é criticada internamente por proteções 'insuficientes' contra deepfakes","resumo":"Funcionários e especialistas internos da Meta expressaram forte preocupação com as diretrizes da empresa contra a proliferação de deepfakes nas redes sociais.\nA contestação aponta que as ferramentas atuais são inadequadas para conter a criação e disseminação de mídias manipuladas por IA.\nO cenário amplia a pressão pública e regulatória sobre a empresa em um momento crucial de integridade da informação online.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/18/meta-e-criticada-internamente-por-protecoes-insuficientes-contra-deepfakes.ghtml","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"CBN","pais":"Brasil","titulo":"Brasileiros apoiam uso da IA na segurança, mas não lembram de política que use a ferramenta","resumo":"Uma pesquisa inédita revelou que a maioria dos brasileiros aprova a aplicação de inteligência artificial no monitoramento e segurança pública.\nContudo, o levantamento indica que a população desconhece projetos ou políticas públicas concretas que já utilizam a tecnologia no país.\nEsse cenário ressalta a lacuna entre o entusiasmo popular com novas ferramentas e a transparência governamental nas implementações tecnológicas.","link":"https://cbn.globo.com/google/amp/coberturas/eleicoes-2026/noticia/2026/09/18/brasileiros-apoiam-uso-da-ia-na-seguranca-mas-nao-lembram-de-politica-que-use-a-ferramenta.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Exército Brasileiro","pais":"Brasil","titulo":"Exército assina Memorando de Entendimento em evento de Tecnologias Quânticas para Defesa","resumo":"O Exército Brasileiro formalizou um Memorando de Entendimento para o desenvolvimento de pesquisas em tecnologias quânticas aplicadas à defesa nacional.\nA parceria estratégica pretende impulsionar a soberania científica do país na criptografia quântica, sensores de alta precisão e comunicações seguras.\nO movimento coloca as Forças Armadas na vanguarda da modernização tecnológica frente aos novos desafios geopolíticos globais.","link":"https://www.eb.mil.br/web/noticias/w/exercito-assina-memorando-de-entendimento-em-evento-de-tecnologias-quanticas-para-defesa?p_l_back_url=%2Fweb%2Fguest%2Fnoticiario-do-exercito%3FdoAsUserId%3DEL%26sort%3DdisplayDate-%26delta%3D60%26modified%3Dpast-month","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Samsung Global Newsroom","pais":"Brasil","titulo":"Samsung estreia tecnologia Micro RGB no Brasil com nova geração de TVs premium","resumo":"A Samsung anunciou o lançamento oficial da sua linha de televisores premium com tecnologia Micro RGB no mercado brasileiro.\nA nova arquitetura de exibição oferece níveis superiores de contraste, brilho e fidelidade de cor ao utilizar LEDs em escala microscópica.\nCom o movimento, a fabricante busca consolidar sua liderança no segmento de alto padrão e ditar novas tendências de consumo eletrônico.","link":"https://news.samsung.com/br/samsung-estreia-tecnologia-micro-rgb-no-brasil-com-nova-geracao-de-tvs-premium","categoria":"HARDWARE","lang":"pt"},{"fonte":"A Crítica de Campo Grande","pais":"Brasil","titulo":"Prêmio paga até R$ 20 mil por pesquisas brasileiras sobre economia e mudanças climáticas","resumo":"Uma nova premiação científica no Brasil passará a conceder até R$ 20 mil para trabalhos acadêmicos focados na interseção entre economia e sustentabilidade.\nO objetivo da iniciativa é incentivar soluções inovadoras capazes de mitigar os impactos das mudanças climáticas e promover o desenvolvimento verde.\nA ação reforça o papel vital da pesquisa nacional na busca por políticas públicas ambientais embasadas em dados e evidências científicas.","link":"https://acritica.net/meio-ambiente/premio-paga-ate-r-20-mil-por-pesquisas-brasileiras-sobre-economia-e-mudancas-climaticas/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Yahoo Finance Singapore","pais":"Estados Unidos","titulo":"Como o Novo Lançamento do Chipset Óptico de IA de 3,2T da MACOM Mudou sua História de Investimento","resumo":"A MACOM Technology Solutions anunciou o lançamento de seu inovador chipset óptico de IA de 3,2T, projetado para atender à crescente demanda por conectividade em data centers de inteligência artificial.\nEste avanço tecnológico posiciona a empresa como um componente essencial na infraestrutura de computação de alta velocidade.\nO movimento redefiniu a tese de investimento da companhia, atraindo a atenção de grandes analistas do setor.","link":"https://sg.finance.yahoo.com/news/macom-3-2t-ai-optical-043504381.html","categoria":"HARDWARE","lang":"pt"},{"fonte":"Yahoo Finance","pais":"Estados Unidos","titulo":"Marvell Technology Aprofunda sua Presença na Infraestrutura de IA","resumo":"A Marvell Technology continua a expandir significativamente sua atuação no desenvolvimento de semicondutores e soluções para infraestrutura de inteligência artificial.\nA empresa vem fortalecendo parcerias estratégicas com gigantes da tecnologia para fornecer chips customizados de alto desempenho e conectividade avançada.\nEssa expansão consolida o papel central da empresa no ecossistema global de computação em nuvem e aprendizado de máquina.","link":"https://finance.yahoo.com/technology/ai/articles/marvell-technology-mrvl-deepens-ai-031612345.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Dronelife","pais":"Estados Unidos","titulo":"Cidade de Raleigh Usa Drones e IA para Criar Gêmeo Digital","resumo":"A cidade de Raleigh adotou o uso combinado de drones e inteligência artificial para criar uma réplica virtual detalhada de seu território urbanizado, conhecida como gêmeo digital.\nEssa tecnologia permite simular cenários urbanos, otimizar o planejamento de infraestrutura e responder com mais eficiência a emergências.\nA iniciativa estabelece um novo padrão para a gestão pública inteligente e sustentável em áreas urbanas.","link":"https://dronelife.com/2026/09/17/city-of-raleigh-uses-drones-ai-technology-to-create-digital-twin/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"MIT Technology Review en español","pais":"Estados Unidos","titulo":"The Download: Camundongos com Cérebros Parcialmente Humanos e Inovadores em Tecnologia Climática","resumo":"Pesquisadores alcançaram um novo marco científico ao desenvolverem camundongos com cérebros parcialmente compostos por células humanas, permitindo avanços na neurociência.\nAo mesmo tempo, o setor de tecnologia climática ganha destaque com inovadores criando soluções para desacelerar o aquecimento global.\nO panorama evidencia como a biotecnologia e as ciências ambientais estão redefinindo o futuro do planeta e da medicina.","link":"https://www.technologyreview.es/article/the-download-ratones-con-cerebros-parcialmente-humanos-e-innovadores-en-tecnologia-climatica","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Bloomberg.com","pais":"Estados Unidos","titulo":"Pioneiro da IA, Andrew Ng Classifica Medos de Extinção como 'Ficção Científica'","resumo":"Andrew Ng, um dos pioneiros da inteligência artificial, afirmou que os receios de que a IA possa extinguir a humanidade pertencem ao campo da ficção científica.\nO especialista defende que o debate público deve focar em problemas reais e imediatos, como discriminação algorítmica e desinformação.\nSua visão visa orientar governos a criarem regulamentações práticas em vez de focar em cenários catastróficos improváveis.","link":"https://www.bloomberg.com/news/articles/2026-09-17/ai-pioneer-andrew-ng-calls-extinction-fears-science-fiction","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"nytimes.com","pais":"Estados Unidos","titulo":"A Próxima Tecnologia de Edição Genética Também Pode Ser a Mais Antiga","resumo":"Cientistas estão descobrindo que sistemas de defesa bacterianos extremamente antigos podem ser a chave para a próxima revolução em edição genética.\nEssas ferramentas biológicas ancestrais oferecem alternativas ao CRISPR que podem ser significativamente mais precisas no corte do DNA.\nEssa descoberta tem o potencial de aprimorar tratamentos médicos e impulsionar novas terapias para doenças genéticas complexas.","link":"https://www.nytimes.com/2026/09/17/science/crispr-gene-editing-vipr.html","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"The Irish Times","pais":"França","titulo":"Ministro francês quer que a Irlanda compartilhe bilhões arrecadados com impostos de tecnologia","resumo":"O ministro das Finanças da França defende que a Irlanda compartilhe as receitas bilionárias obtidas através de impostos sobre grandes empresas de tecnologia.\nA proposta surge no contexto das regras fiscais europeias, onde a Irlanda atrai gigantes de tecnologia devido a impostos reduzidos.\nA medida busca redistribuir esses recursos para promover uma concorrência mais justa e equilibrada entre os países membros da União Europeia.","link":"https://www.irishtimes.com/politics/2026/09/18/french-minister-wants-ireland-to-share-its-technology-tax-billions/","categoria":"ECONOMIA DIGITAL","lang":"pt"},{"fonte":"Le Parisien","pais":"França","titulo":"Governo Trump vende 48 caças F-35 à Arábia Saudita, apesar de temores sobre espionagem tecnológica da China","resumo":"O governo dos Estados Unidos aprovou a venda de 48 caças stealth F-35 de última geração para a Arábia Saudita.\nA transação gera preocupações no setor de defesa devido ao risco de a China ter acesso indireto a essa tecnologia avançada.\nAnalistas alertam que a crescente aproximação geopolítica entre sauditas e chineses pode expor segredos militares estratégicos dos EUA.","link":"https://www.leparisien.fr/international/etats-unis/ladministration-trump-vent-48-avions-f-35-a-larabie-saoudite-malgre-des-craintes-que-la-chine-en-etudie-la-technologie-18-09-2026-DE5YQGBT7RAS7NKLAGC3VDFCMU.php","categoria":"TECNOLOGIA MILITAR","lang":"pt"},{"fonte":"euractiv.com","pais":"França","titulo":"Hora de construir os Estados Unidos da Europa, diz candidato à presidência francesa","resumo":"Um pré-candidato à presidência da França defendeu publicamente a integração total do bloco comunitário no modelo dos Estados Unidos da Europa.\nA proposta visa fortalecer a soberania política, econômica e militar do continente frente às crescentes tensões globais.\nO debate reacende discussões profundas sobre o futuro da União Europeia e a centralização de poderes nas decisões regionais.","link":"https://www.euractiv.com/news/time-to-build-the-united-states-of-europe-says-french-presidential-hopeful/","categoria":"GEOPOLÍTICA","lang":"pt"},{"fonte":"france24.com","pais":"França","titulo":"Guerra no Irã impulsiona os preços do diesel para máximas históricas","resumo":"A escalada dos conflitos envolvendo o Irã provocou uma forte alta nos preços globais do diesel, atingindo recordes históricos.\nO aumento dos combustíveis pressiona a inflação mundial e afeta diretamente as cadeias globais de suprimento e transporte.\nEspecialistas e governos acompanham a volatilidade do mercado de petróleo, temendo novos impactos na economia global.","link":"https://www.france24.com/es/programas/econom%C3%ADa/20260918-guerra-en-ir%C3%A1n-empuja-los-precios-del-di%C3%A9sel-a-m%C3%A1ximos-hist%C3%B3ricos","categoria":"ENERGIA","lang":"pt"},{"fonte":"Psychologies.com","pais":"França","titulo":"A ciência dá razão ao ditado 'não adianta correr': ir com calma ajuda a atingir objetivos com mais facilidade","resumo":"Estudos científicos recentes confirmam que desacelerar e agir com calma é uma estratégia mais eficaz para alcançar metas de longo prazo.\nA pesquisa demonstra que o ritmo excessivo gera estresse e erros, enquanto o planejamento constante otimiza o desempenho mental.\nCompreender a mecânica do ritmo produtivo ajuda a redefinir métodos de trabalho e bem-estar na vida cotidiana.","link":"https://www.psychologies.com/moi/se-connaitre/comportement/La-science-donne-raison-a-Rien-ne-sert-de-courir-prendre-son-temps-aiderait-a-atteindre-plus-facilement-ses-objectifs-623611","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Boursorama","pais":"França","titulo":"Segundo a Anthropic, o Claude agora lidera um quarto do desenvolvimento dos seus próximos modelos de IA","resumo":"A empresa de inteligência artificial Anthropic revelou que o sistema Claude já executa cerca de 25% do trabalho de código para criar suas futuras versões.\nA automação do próprio processo de desenvolvimento marca um avanço significativo na autonomia e capacidade das IAs modernas.\nEssa abordagem pode acelerar drasticamente os ciclos de inovação tecnológica, transformando a maneira como os modelos de linguagem são construídos.","link":"https://www.boursorama.com/actualite-economique/actualites-amp/selon-anthropic-claude-dirige-desormais-un-quart-des-travaux-de-developpement-de-ses-prochains-modeles-d-ia-6981293db5126eac301696fba256db36","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Sky News","pais":"Inglaterra","titulo":"O governo está fazendo algo para impedir que a IA acabe com todos nós?","resumo":"O avanço acelerado da inteligência artificial levanta debates urgentes sobre a necessidade de regulamentação governamental e controle de riscos existenciais. Especialistas e legisladores discutem medidas para garantir que o desenvolvimento tecnológico permaneça seguro para a sociedade. A pressão pública aumenta para que o governo adote posturas mais firmes diante do potencial impacto disruptivo da tecnologia no futuro próximo.","link":"https://news.sky.com/story/is-the-government-doing-anything-to-stop-ai-killing-us-all-13589063","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"theadvertiserseries.co.uk","pais":"Inglaterra","titulo":"Centro de dados no Nordeste gera 141 milhões de libras para a economia do Reino Unido e projeta mais 1,2 bilhão","resumo":"Um novo centro de dados na região Nordeste tem impulsionado significativamente a economia britânica, gerando centenas de milhões de libras em impacto financeiro. As projeções indicam um crescimento exponencial ainda maior para os próximos anos, consolidando a infraestrutura digital como pilar econômico. Esse investimento demonstra como o setor tecnológico atrai capitais estratégicos e impulsiona o desenvolvimento regional sustentável.","link":"http://www.theadvertiserseries.co.uk/news/26558554.newcastle-data-centre-generated-141m-uk-economy/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Soldados e estudantes estudam tecnologia de drones juntos","resumo":"Uma iniciativa educacional inovadora reúne forças militares e estudantes civis para explorar o potencial e o desenvolvimento da tecnologia de drones. A colaboração visa acelerar a inovação tecnológica e promover o intercâmbio de conhecimentos práticos entre a defesa nacional e o meio acadêmico. O projeto destaca a importância de parcerias estratégicas para capacitar a próxima geração de especialistas em sistemas autônomos.","link":"https://www.bbc.com/news/articles/cwvgyj1z381mo","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Os trabalhadores do Parque Científico de Cambridge que não precisam de jaleco","resumo":"O famoso Parque Científico de Cambridge abriga profissionais que vão muito além da tradicional pesquisa laboratorial em biologia ou química. O ecossistema local atrai talentos de áreas como tecnologia da informação, negócios e engenharia de software para impulsionar a inovação. Essa diversidade de atuação é fundamental para transformar descobertas científicas em produtos viáveis e comercializáveis no mercado global.","link":"https://www.bbc.co.uk/news/articles/c36y3dlw4ppo","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Chatham House","pais":"Inglaterra","titulo":"Como o Reino Unido deve proteger sua pesquisa científica e tecnológica contra ameaças de Estados estrangeiros","resumo":"Autoridades britânicas debatem medidas rigorosas para blindar as pesquisas científicas e tecnológicas nacionais contra espionagem e interferências estrangeiras. O plano visa proteger propriedade intelectual sensível desenvolvida em universidades e centros de inovação estratégicos do país. A segurança cibernética e o controle de investimentos externos tornam-se prioridades para preservar a soberania tecnológica do Reino Unido.","link":"https://www.chathamhouse.org/2026/09/how-uk-should-protect-its-science-and-tech-research-foreign-state-threats/02-global-science","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"Mobile Europe","pais":"Inglaterra","titulo":"BT leva tecnologia de drones para a Polícia de Transportes Britânica","resumo":"A empresa BT firmou uma parceria estratégica para fornecer tecnologia de drones de ponta para a Polícia de Transportes Britânica. A ferramenta visa melhorar o monitoramento de redes ferroviárias, aumentar a segurança de passageiros e otimizar operações de resposta rápida. Essa implementação marca um avanço importante no uso de inteligência artificial e vigilância aérea automatizada no setor público.","link":"https://www.mobileeurope.co.uk/bt-business-btp-drones/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ISPreview UK","pais":"Inglaterra","titulo":"ITS Technology lança rede de banda larga de fibra óptica em 9 novas áreas do Reino Unido","resumo":"A ITS Technology expandiu com sucesso sua infraestrutura de banda larga ultrarrápida de fibra óptica para nove novas regiões britânicas. A iniciativa busca eliminar gargalos de conectividade e fornecer internet de alta velocidade para comunidades locais e empresas. Essa expansão reforça o compromisso do país em modernizar sua infraestrutura digital para atender às demandas da economia moderna.","link":"https://www.ispreview.co.uk/index.php/2026/09/its-technology-put-full-fibre-broadband-network-live-in-9-new-uk-areas.html","categoria":"INFRAESTRUTURA","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Rei Charles alerta sobre o 'perigo existencial' da IA cair em mãos erradas","resumo":"O Rei Charles expressou profunda preocupação com os riscos existenciais associados ao uso inadequado da inteligência artificial. O monarca destacou que o poder dessas ferramentas tecnológicas exige cooperação global rigorosa para evitar que sejam mal utilizadas. O alerta ecoa debates internacionais urgentes sobre ética, segurança e salvaguardas para o desenvolvimento futuro da inteligência artificial.","link":"https://www.bbc.co.uk/news/articles/c65ymj7njvl7o","categoria":"SOCIEDADE","lang":"pt"},{"fonte":"Cinco Días","pais":"Espanha","titulo":"A brutal economia da IA chinesa esconde lições para os EUA","resumo":"O rápido avanço e o modelo econômico agressivo da inteligência artificial na China revelam dinâmicas competitivas surpreendentes. O cenário desafia a hegemonia norte-americana e oferece lições cruciais sobre inovação e custos no setor. Especialistas apontam que a corrida tecnológica global está mudando de eixo de forma acelerada.","link":"https://cincodias.elpais.com/opinion/2026-09-18/la-brutal-economia-de-la-ia-china-encierra-lecciones-para-ee-uu.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Residuos Profesional","pais":"Espanha","titulo":"TOMRA expande sua tecnologia de classificação Dynamic LIBS para novos fluxos de materiais","resumo":"A empresa expandiu sua tecnologia avançada de classificação para otimizar a reciclagem em novos fluxos industriais. A inovação promete revolucionar o reaproveitamento de materiais complexos com maior eficiência e precisão. O impacto direto reflete-se na sustentabilidade e na redução de resíduos em larga escala.","link":"https://www.residuosprofesional.com/tomra-amplia-tecnologia-clasificacion-dynamic-libs/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"El Progreso de Lugo","pais":"Espanha","titulo":"Esta é a tecnologia que transforma a vespa velutina em um guia até o próprio ninho graças a um minúsculo chip","resumo":"Pesquisadores desenvolveram um método inovador para rastrear vespas asiáticas utilizando um microchip acoplado ao inseto. A técnica permite localizar ninhos subterrâneos ou de difícil acesso de forma altamente precisa. A iniciativa visa combater a praga e proteger o ecossistema local e a apicultura.","link":"https://www.elprogreso.es/articulo/a-chaira/rastro-velutina/202609171832071999053.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"El Español","pais":"Espanha","titulo":"Espanha na lanterna da Europa na concessão de patentes de tecnologia sanitária: apenas 91 aprovadas em nove anos","resumo":"Um estudo recente revela o atraso da Espanha na aprovação de patentes voltadas para o setor de saúde em comparação com outros países europeus. A baixa quantidade de registros limita o impacto de inovações nacionais no mercado internacional. O cenário exige maior investimento e incentivo governamental na pesquisa médica.","link":"https://www.elespanol.com/invertia/observatorios/sanidad/20260918/espana-cola-europa-concesion-patentes-tecnologia-sanitaria-solo-aprobado-anos/1003744387199_0.html","categoria":"SAÚDE","lang":"pt"},{"fonte":"El Debate","pais":"Espanha","titulo":"Caverna remota na Grécia revela nova espécie que havia passado despercebida pela ciência","resumo":"Uma exploração científica em uma caverna isolada grega resultou na descoberta de uma espécie inédita para a biologia. O achado destaca a biodiversidade oculta em ambientes subterrâneos extremos e de difícil acesso. A pesquisa reforça a importância da preservação desses ecossistemas frágeis.","link":"https://www.eldebate.com/ciencia/20260918/recondita-cueva-grecia-revela-nueva-especie-habia-pasado-inadvertida-ciencia_458282.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"El Debate","pais":"Espanha","titulo":"«Estamos perdendo o controle»: o alerta de um dos pais da IA","resumo":"Um dos pioneiros no desenvolvimento da inteligência artificial expressou profunda preocupação com o ritmo e os rumos da tecnologia. O aviso ressalta a urgência de regulamentações mais rígidas para evitar cenários catastróficos no futuro. O debate sobre a segurança e os limites éticos da automação ganha cada vez mais força global.","link":"https://www.eldebate.com/ciencia/20260918/estamos-perdiendo-control-advertencia-padres-ia_459955.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Expansión","pais":"Espanha","titulo":"X1 Wind capta 10 milhões para sua tecnologia de energia eólica marinha em Roses","resumo":"A startup X1 Wind garantiu um financiamento expressivo para impulsionar sua inovadora tecnologia de energia eólica offshore. Os recursos serão aplicados no desenvolvimento de plataformas flutuantes na costa de Roses, na Espanha. O projeto promete revolucionar a geração de energia renovável nos oceanos.","link":"https://www.expansion.com/catalunya/2026/09/17/6aac4a6d468aeb59788b459e.html","categoria":"ENERGIA","lang":"pt"},{"fonte":"Car and Driver","pais":"Espanha","titulo":"Toyota e sua tecnologia de hidrogênio têm um novo desafio, o Rally Dakar: Assim será sua nova Hilux","resumo":"A montadora japonesa levará sua tecnologia de célula a combustível de hidrogênio ao extremo nas dunas do Rally Dakar. O protótipo da nova Hilux testará a viabilidade e a resistência de combustíveis limpos em condições severas. A iniciativa busca acelerar o desenvolvimento de veículos sustentáveis de alta performance.","link":"https://www.caranddriver.com/es/motorsport/a73770987/toyota-dkr-fc-hilux/","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"Informationsdienst Wissenschaft","pais":"Alemanha","titulo":"KIT inaugura supercomputador de 17 milhões de euros","resumo":"O Instituto KIT colocou em operação um novo supercomputador avaliado em 17 milhões de euros.\nEste avanço tecnológico fortalece a capacidade de processamento de dados para pesquisas científicas avançadas.\nA iniciativa coloca a instituição na vanguarda da computação de alto desempenho na Alemanha.","link":"https://idw-online.de/de/news877598","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Ciberataques: Grupo cibernético da Coreia do Norte rouba profissionais de TI em busca de emprego","resumo":"Especialistas em tecnologia que buscam novas oportunidades de emprego tornaram-se alvos de um grupo cibernético norte-coreano.\nOs ataques utilizam esquemas sofisticados de engenharia social para roubar informações sensíveis e propriedade intelectual.\nA situação evidencia os crescentes riscos de segurança digital enfrentados por profissionais do setor tecnológico.","link":"https://www.sueddeutsche.de/wirtschaft/cyberangriffe-nordkorea-cybergruppe-bestiehlt-it-fachleute-auf-jobsuche-dpa.urn-newsml-dpa-com-20090101-260918-930-703980","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"n-tv.de","pais":"Alemanha","titulo":"Maior parque eólico offshore concluído: 64 turbinas no Mar do Norte podem abastecer mais de um milhão de lares","resumo":"A conclusão do maior parque eólico offshore marca um marco importante para a transição energética na região.\nComposto por 64 turbinas gigantescas, o projeto tem capacidade para abastecer energeticamente mais de um milhão de residências.\nEssa iniciativa reforça o compromisso com fontes renováveis e a redução das emissões de carbono.","link":"https://www.n-tv.de/wirtschaft/64-Windraeder-in-der-Nordsee-koennen-ueber-eine-Million-Haushalte-versorgen-id31318068.html","categoria":"ENERGIA","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"“Caça mais moderno”: Alemanha recebe jatos F-35","resumo":"A Alemanha deu um passo significativo na modernização de sua força aérea ao integrar os caças furtivos F-35.\nConsideradas as aeronaves de combate mais avançadas da atualidade, elas substituirão frotas mais antigas.\nA aquisição visa fortalecer as capacidades de defesa e a interoperabilidade dentro da aliança da OTAN.","link":"https://www.sueddeutsche.de/politik/ruestungsprojekte-modernstes-kampfflugzeug-deutschland-bekommt-f-35-dpa.urn-newsml-dpa-com-20090101-260918-930-703536","categoria":"DEFESA","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Cenários apocalípticos: Quais perigos concretos a IA representa?","resumo":"Especialistas discutem os riscos reais associados ao avanço acelerado da inteligência artificial.\nO debate aborda desde a desinformação em massa até ameaças existenciais e o impacto no mercado de trabalho.\nA análise busca estabelecer limites regulatórios e éticos para garantir o desenvolvimento seguro da tecnologia.","link":"https://www.sueddeutsche.de/wirtschaft/untergangsszenarien-welche-konkreten-gefahren-drohen-durch-ki-dpa.urn-newsml-dpa-com-20090101-260918-930-703399","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Armazenamento de dióxido de carbono: Dinamarca celebra operação regular de armazéns de CO2 no fundo do mar","resumo":"A Dinamarca iniciou a operação regular de seu inovador projeto de armazenamento de dióxido de carbono sob o leito marinho.\nA tecnologia de captura e armazenamento de carbono (CCS) é vista como crucial para mitigar as mudanças climáticas globais.\nO sucesso do empreendimento abre caminhos para que outros países europeus adotem estratégias semelhantes.","link":"https://www.sueddeutsche.de/politik/kohlendioxid-lagerung-co2-lager-im-meeresgrund-daenemark-feiert-regelbetrieb-dpa.urn-newsml-dpa-com-20090101-260918-930-703381","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"mlit.go.jp","pais":"Japão","titulo":"Aceleração de pesquisa e desenvolvimento para introdução de tecnologia de construção naval com IA por cooperação Japão-EUA","resumo":"Governos do Japão e dos Estados Unidos unem forças para acelerar pesquisas conjuntas em tecnologias de construção naval baseadas em inteligência artificial. A iniciativa busca modernizar os estaleiros e aumentar a competitividade industrial frente aos desafios globais do setor. Espera-se que a cooperação traga maior eficiência produtiva e inovações significativas para a engenharia naval de ambos os países.","link":"https://www.mlit.go.jp/report/press/kaiji05_hh_000348.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"日本経済新聞","pais":"Japão","titulo":"Fuji Keizai divulga pesquisa de mercado global sobre nanotubos de carbono para baterias","resumo":"A empresa de pesquisa Fuji Keizai publicou um estudo abrangente sobre o mercado global de nanotubos de carbono aplicados a baterias avançadas. O relatório analisa o crescimento da demanda impulsionada pela eletrificação de veículos e armazenamento de energia. A tecnologia é crucial para melhorar a condutividade e a durabilidade das baterias modernas no mercado internacional.","link":"https://www.nikkei.com/article/DGXZRSP712835_18092026000000","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"EE Times Japan","pais":"Japão","titulo":"Universidade de Kyoto desenvolve cabo supercondutor SCSC e tecnologia de bobinagem","resumo":"Pesquisadores da Universidade de Kyoto anunciaram o desenvolvimento bem-sucedido de um cabo supercondutor SCSC inovador acompanhado de nova técnica de bobinagem. O avanço promete reduzir perdas de energia em redes elétricas e aplicações industriais de alta potência. A descoberta representa um marco importante para a viabilização comercial de sistemas supercondutores em larga escala.","link":"https://eetimes.itmedia.co.jp/ee/articles/2609/18/news038.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Experiência de próxima geração no Estádio Mazda! Experimento de demonstração usando óculos AR em dois jogos","resumo":"O Estádio Mazda sediará testes práticos utilizando óculos de realidade aumentada para transformar a experiência dos torcedores durante partidas de beisebol. A tecnologia sobrepõe estatísticas em tempo real e conteúdos interativos diretamente no campo de visão do público. O experimento visa avaliar a aceitação do consumidor e o potencial comercial do entretenimento esportivo imersivo.","link":"https://news.yahoo.co.jp/articles/187a910b34a2c25511390db5d617a89c5ab79dea","categoria":"TRENDING","lang":"pt"},{"fonte":"ITmedia","pais":"Japão","titulo":"Bose lança dois fones de ouvido de ouvido aberto voltados para esportes e segunda geração principal","resumo":"A Bose apresentou ao mercado dois novos modelos de fones de ouvido que mantêm os ouvidos abertos, focando no conforto para atletas e usuários ativos. Os dispositivos combinam alta qualidade sonora com a segurança de permitir ouvir os sons ao redor durante os exercícios. A linha também traz atualizações significativas para a segunda geração de seus produtos principais.","link":"https://www.itmedia.co.jp/mobile/articles/2609/18/news067.html","categoria":"LANÇAMENTO","lang":"pt"},{"fonte":"Digital PR Platform","pais":"Japão","titulo":"Toshiba conquista o primeiro lugar no ranking global de força de patentes em baterias de íon de lítio","resumo":"A Toshiba alcançou a liderança global no ranking de portfólio de patentes relacionadas a baterias secundárias de íon-lítio. O reconhecimento destaca o compromisso contínuo da empresa com a inovação em armazenamento de energia e materiais avançados. Essa força em propriedade intelectual fortalece a posição estratégica da marca no mercado global de eletrificados.","link":"https://digitalpr.jp/r/143949","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"jst.go.jp","pais":"Japão","titulo":"Relatório da sessão de planejamento do JSAI2026 destaca tendências e perspectivas de IA para a Ciência","resumo":"O Centro de Estratégia de Pesquisa e Desenvolvimento publicou um relatório detalhado sobre o papel da inteligência artificial no avanço científico japonês. A iniciativa discute como a fusão entre IA e métodos de pesquisa tradicionais está redefinindo descobertas em várias disciplinas. O documento serve como um guia estratégico para o futuro ecossistema de inovação do país.","link":"https://www.jst.go.jp/crds/report/CRDS-FY2026-SY-02.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"EE Times Japan","pais":"Japão","titulo":"Mitsubishi Electric investe na OptQC para acelerar a aplicação industrial de tecnologia quântica","resumo":"A Mitsubishi Electric anunciou um investimento estratégico na OptQC com o objetivo de acelerar a comercialização de computadores quânticos baseados em tecnologia óptica. A parceria busca superar gargalos técnicos e integrar soluções quânticas em ambientes industriais complexos. O movimento reforça a corrida tecnológica do Japão para liderar a computação de próxima geração.","link":"https://eetimes.itmedia.co.jp/ee/articles/2609/18/news037.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"中国网","pais":"China","titulo":"Cinco gerações de cientistas exploram a matéria constituída por força","resumo":"Uma jornada de quarenta anos na busca por segredos subatômicos revelou novos horizontes para a física fundamental na China. A pesquisa detalha a evolução no entendimento das forças que estruturam a matéria em nível subatômico. O impacto científico fortalece a base de conhecimento avançado e inspira futuras gerações de pesquisadores no país.","link":"http://www.china.com.cn/txt/2026-09/18/content_118702387.shtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"21财经","pais":"China","titulo":"Automação industrial muda de marcha: ponto de inflexão da IA se aproxima e localização de fabricantes estrangeiros acelera","resumo":"O setor de automação industrial passa por uma transformação profunda impulsionada pela inteligência artificial. Fabricantes estrangeiros estão acelerando a localização de suas operações na China para acompanhar a nova dinâmica de mercado. Essa tendência redefine a competitividade tecnológica e a eficiência produtiva no ecossistema industrial nacional.","link":"https://www.21jingji.com/article/20260918/herald/5bd786c7243b677f338eb920fd325ef7.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"观点网","pais":"China","titulo":"Projeto do Centro de Computação de Alto Desempenho da Região Oeste de Guangdong aprovado com investimento de 1,328 bilhão de iuanes","resumo":"A aprovação deste grande projeto de infraestrutura tecnológica na China marca um avanço significativo para a capacidade computacional regional. Com um investimento expressivo, o centro impulsionará a inovação em inteligência artificial e big data. A iniciativa fortalece a economia digital e consolida a infraestrutura de dados no sul do país.","link":"https://www.guandian.cn/article/20260918/603597.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"湖北日报传媒集团","pais":"China","titulo":"Governo Popular de Wuhan emite aviso sobre o plano quinquenal de desenvolvimento de alta qualidade da economia digital e inteligente","resumo":"A cidade de Wuhan lançou diretrizes estratégicas para impulsionar sua economia digital e inteligente nos próximos anos. O plano visa integrar tecnologias avançadas aos setores industriais tradicionais, promovendo inovação sustentável. O impacto esperado é a consolidação de Wuhan como um polo tecnológico de referência nacional.","link":"https://news.hubeidaily.net/pc/c_5988715.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"sc.news.cn","pais":"China","titulo":"Comunidade Panda: Primeiro caso global! Tecnologia de ortodontia humana conserta com sucesso os dentes tortos de um panda gigante","resumo":"Especialistas utilizaram tecnologias avançadas de ortodontia humana para realizar um procedimento inédito em um panda gigante com problemas dentários. A intervenção bem-sucedida demonstra a versatilidade e o alto nível de precisão das técnicas médicas desenvolvidas no país. O feito gerou grande repercussão global e destaca o cuidado inovador com a vida selvagem.","link":"https://sc.news.cn/20260918/261a90db8bad4a66aa2e8aed2743fb30/c.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"北京大学新闻网","pais":"China","titulo":"Divulgada a lista da Ásia-Pacífico de 'Inovadores Tecnológicos com Menos de 35 Anos', com quatro cientistas da Universidade de Pequim selecionados","resumo":"Quatro talentosos pesquisadores da Universidade de Pequim foram reconhecidos entre os principais inovadores tecnológicos da região Ásia-Pacífico. A premiação destaca jovens promessas cujas pesquisas estão moldando o futuro da ciência e da tecnologia. Este reconhecimento reflete o crescente protagonismo da nova geração de cientistas chineses no cenário global.","link":"https://news.pku.edu.cn/xwzh/5115b7d7e3ce4d41b9473ac7df667346.htm","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"中国科学院","pais":"China","titulo":"O Olho Gigante Chinês descobre sistema de estrela binária de nêutrons mais leve e de período extremamente curto","resumo":"O radiotelescópio FAST fez uma descoberta astronômica revolucionária ao identificar um sistema binário de nêutrons de características únicas. O achado fornece dados cruciais para a compreensão de fenômenos astrofísicos extremos e da evolução estelar. O impacto consolida a liderança da China na pesquisa de radioastronomia em escala global.","link":"https://www.cas.cn/cm/202609/t20260918_5120573.shtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"经济参考报","pais":"China","titulo":"Nona Cúpula de Robótica da China é aberta em Hangzhou","resumo":"A abertura da nona edição da Cúpula de Robótica da China em Hangzhou reuniu especialistas e líderes da indústria para debater o futuro do setor. O evento foca nas mais recentes inovações em automação, inteligência artificial e robótica aplicada. A cúpula impulsiona parcerias estratégicas e acelera a adoção de tecnologias inteligentes na economia.","link":"http://jjckb.xinhuanet.com/20260918/68d11e4a4d514fe9a128d3a1d0fe4651/c.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Construction World","pais":"Índia","titulo":"Hirata faz parceria com a ATS India para expandir o acesso à tecnologia de semicondutores","resumo":"A Hirata estabeleceu uma parceria estratégica com a ATS India visando ampliar a acessibilidade e o desenvolvimento de tecnologias voltadas para semicondutores no país. Essa colaboração fortalece a cadeia de suprimentos local e atrai novas oportunidades industriais e tecnológicas para o mercado indiano. A iniciativa tem potencial para impulsionar a infraestrutura tecnológica e consolidar o ecossistema de manufatura avançada na região.","link":"https://www.constructionworld.in/latest-construction-technology/hirata-partners-ats-india-to-expand-semiconductor-technology-access/97538","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Construction World","pais":"Índia","titulo":"DheyaTech capta 430 milhões de rúpias para escalar tecnologia de turbinas a gás","resumo":"A startup DheyaTech conseguiu arrecadar 430 milhões de rúpias para acelerar a expansão e o aprimoramento de sua tecnologia inovadora em turbinas a gás. Com o novo capital, a empresa pretende otimizar suas operações, acelerar pesquisas e ampliar sua presença no competitivo mercado industrial. O investimento reflete o crescente interesse de fundos em soluções de engenharia avançada na Índia.","link":"https://www.constructionworld.in/transport-infrastructure/aviation-and-airport-infra/dheyatech-raises-rs-430-million-to-scale-gas-turbine-technology/97527","categoria":"INVESTIMENTO","lang":"pt"},{"fonte":"Bolsamania","pais":"Índia","titulo":"EyeROV: Empresa emergente indiana de tecnologia avançada apresenta drones submarinos a líderes mundiais","resumo":"A startup indiana EyeROV chamou atenção global ao demonstrar seus drones submarinos de alta tecnologia para importantes líderes mundiais. A inovação destaca a capacidade do país em desenvolver robótica subaquática de ponta para aplicações críticas de inspeção e defesa. O marco projeta a engenharia indiana no cenário internacional de inovação tecnológica.","link":"https://www.bolsamania.com/nota-de-prensa/mercados/eyerov-una-empresa-emergente-india-de-tecnologia-avanzada-presenta-sus-drones-submarinos-a-lideres-mundiales--23610744.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"DD India","pais":"Índia","titulo":"Empresa de Bengaluru exibe tecnologia de detecção precoce de defeitos em wafers impulsionada por IA na SEMICON India 2026","resumo":"Uma empresa sediada em Bengaluru apresentou uma solução inovadora baseada em inteligência artificial para identificar falhas em wafers durante a SEMICON India 2026. A tecnologia promete revolucionar o controle de qualidade na fabricação de semicondutores, aumentando a precisão e reduzindo perdas industriais. Essa demonstração reforça o papel de Bengaluru como um polo global de desenvolvimento de inteligência artificial.","link":"https://ddindia.co.in/2026/09/bengaluru-firm-showcases-ai-powered-early-wafer-defect-detection-technology-at-semicon-india-2026/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"The Economic Times","pais":"Índia","titulo":"Renda no YouTube: Economia de criadores da Índia precisa ser mais séria após novos critérios de monetização","resumo":"Com a implementação de novos critérios de monetização pelo YouTube, a vibrante economia de criadores de conteúdo na Índia enfrenta um momento de grande transformação profissional. Especialistas apontam que os criadores precisarão adotar estratégias de negócios mais estruturadas e foco na qualidade para manter seus ganhos. Essa mudança reflete a maturação do mercado digital e o aumento das exigências das plataformas para a remuneração de vídeos.","link":"https://m.economictimes.com/industry/media/entertainment/media/youtube-income-indias-creator-economy-needs-to-be-more-serious-after-new-monetisation-criteria/articleshow/134325429.cms","categoria":"REDES SOCIAIS","lang":"pt"},{"fonte":"livemint.com","pais":"Índia","titulo":"Microsatélites, a 'zona ideal' para a economia espacial da Índia","resumo":"O segmento de microsatélites tem se tornado o principal motor da expansão econômica e tecnológica do setor espacial indiano, oferecendo alta eficiência a custos reduzidos. Especialistas classificam essa faixa como a 'zona ideal' para equilibrar investimentos acessíveis e retornos científicos de alto impacto. O avanço consolida a posição da Índia como uma potência emergente e competitiva no mercado global de exploração espacial.","link":"https://www.livemint.com/opinion/india-space-programme-isro-pslv-spacex-small-satellite-launchers-vikram-1-skyroot-aerospace-agnikul-agnibaan-11789671011020.html","categoria":"CIÊNCIA ESPACIAL","lang":"pt"},{"fonte":"CXOToday.com","pais":"Índia","titulo":"Unstop adquire a PerspectAI, adicionando ciência de pessoas e jogos nativos de IA à sua plataforma de contratação","resumo":"A plataforma de recrutamento Unstop anunciou a aquisição da PerspectAI para integrar avaliações baseadas em jogos e ciência de pessoas impulsionadas por inteligência artificial. A movimentação estratégica visa modernizar os processos de seleção corporativa, tornando-os mais dinâmicos, analíticos e precisos. Com essa tecnologia, a empresa busca transformar a forma como as corporações descobrem e contratam talentos no mercado atual.","link":"https://cxotoday.com/media-coverage/unstop-acquires-perspectai-adding-ai-native-game-and-people-science-to-its-hiring-platform/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"Índia está comprometida em promover a economia circular como parte do desenvolvimento sustentável, diz Ministro do Meio Ambiente","resumo":"Durante o Fórum Mundial de Economia Circular, o Ministro do Meio Ambiente reafirmou o firme compromisso da Índia com práticas voltadas à sustentabilidade e reutilização de recursos. O país busca implementar políticas e soluções tecnológicas que incentivem a redução de resíduos e estimulem a transição para um modelo econômico verde. A iniciativa reforça o papel de liderança da nação em fóruns globais de preservação ambiental.","link":"https://newsonair.gov.in/world-circular-economy-forum-2026-to-begin-today-at-gandhinagar-in-gujarat/","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Amazfit Active: o smartwatch que transforma cada treino em uma sessão orientada para você","resumo":"O smartwatch Amazfit Active chega ao mercado com foco em otimizar a rotina de exercícios físicos dos usuários. O dispositivo atua como um assistente pessoal de saúde e desempenho durante os treinos. Essa tecnologia veste e monitora o corpo com precisão para elevar o nível de preparação física.","link":"https://www.cmjornal.pt/indica/tecnologia/detalhe/amazfit-active-o-smartwatch-que-transforma-cada-treino-numa-sessao-orientada-para-si","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"expresso.pt","pais":"Portugal","titulo":"Engenharia portuguesa rumo ao Espaço na missão ARRAKIHS para estudar a arqueologia galáctica","resumo":"A engenharia de Portugal ganha destaque internacional ao integrar a ambiciosa missão espacial ARRAKIHS. O projeto científico tem como principal objetivo aprofundar o estudo da arqueologia galáctica e compreender melhor a matéria escura. A iniciativa reforça a capacidade técnica e a inovação científica do país em âmbito global.","link":"https://expresso.pt/economia/2026-09-17-engenharia-lusa-rumo-ao-espaco-na-missao-arrakihs-para-estudar-a-arqueologia-galactica-92bb1141","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"Xiaomi lança novos celulares com tecnologia de ponta por menos de 650 euros. Conheça as novidades da marca","resumo":"A Xiaomi apresentou sua nova linha de celulares equipados com o que há de mais moderno no mercado de tecnologia móvel. O grande destaque é a combinação de especificações avançadas de topo de linha com preços bastante competitivos. Com essa estratégia, a marca busca consolidar sua presença e atrair consumidores exigentes que valorizam o custo-benefício.","link":"https://sapo.pt/artigo/xiaomi-lanca-novos-telemoveis-com-tecnologia-de-topo-e-nenhum-passa-os-650-conheca-as-novidades-da-marca-6aac504d2eb12c30b6061a68","categoria":"LANÇAMENTO","lang":"pt"},{"fonte":"pcguia.pt","pais":"Portugal","titulo":"AMD prepara alternativa ao DLSS com nova tecnologia de iluminação neural","resumo":"A AMD está desenvolvendo uma nova tecnologia de iluminação neural para competir diretamente com soluções avançadas de escalonamento de imagem do mercado. A inovação promete revolucionar o desempenho gráfico e a qualidade visual em jogos eletrônicos. Essa movimentação acirra ainda mais a concorrência no setor de placas de vídeo e inteligência artificial.","link":"https://www.pcguia.pt/2026/09/amd-prepara-alternativa-ao-dlss-5-com-nova-tecnologia-de-iluminacao-neural/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ECO","pais":"Portugal","titulo":"Europa apoia a HART, tecnologia da RemAb Therapeutics para eliminar anticorpos e reforçar imunidade","resumo":"A União Europeia decidiu apoiar o desenvolvimento da tecnologia HART, criada pela biofarmacêutica RemAb Therapeutics. O projeto inovador visa eliminar anticorpos nocivos implicados em diversas doenças e fortalecer significativamente a resposta imunitária. O respaldo institucional acelera pesquisas médicas cruciais para tratamentos futuros mais eficazes.","link":"https://eco.sapo.pt/2026/09/17/europa-apoia-a-hart-a-tecnologia-da-empresa-biofarmaceutica-remab-therapeutics-destinada-a-eliminar-os-anticorpos-implicados-em-doencas-e-a-reforcar-a-resposta-imunitaria/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Portugal Têxtil","pais":"Portugal","titulo":"Nova tecnologia cria têxteis brancos e repelentes sem o uso de PFAS","resumo":"Pesquisadores desenvolveram um método inovador para produzir tecidos brancos altamente repelentes sem recorrer aos compostos químicos PFAS. A novidade resolve um grave problema ambiental e de saúde pública associado a substâncias tóxicas persistentes na indústria têxtil. A tecnologia abre caminho para uma fabricação de roupas muito mais sustentável e segura.","link":"https://portugaltextil.com/nova-tecnologia-cria-texteis-brancos-e-repelentes-sem-pfas/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"AICEP","pais":"Portugal","titulo":"Solfarcos expande tecnologia de peptídeos da K18 para o mercado dos Estados Unidos","resumo":"A Solfarcos anunciou a expansão comercial da avançada tecnologia de peptídeos da marca K18 para o exigente mercado norte-americano. A solução capilar tem revolucionado tratamentos de beleza e cuidados pessoais através de inovação científica comprovada. O movimento consolida a expansão internacional de produtos de alta tecnologia desenvolvidos no setor.","link":"https://portugalglobal.pt/noticias/2026/setembro/solfarcos-leva-tecnologia-de-peptidos-da-k18-aos-eua/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Jornal de Negócios","pais":"Portugal","titulo":"\"Há muita ciência boa sendo feita em Portugal\" e o país pode gerar um unicórnio","resumo":"Especialistas destacam a alta qualidade e o potencial transformador da investigação científica atualmente desenvolvida em território português. O ecossistema de inovação local mostra maturidade suficiente para gerar startups de bilhões de dólares, os chamados unicórnios. Esse cenário otimista atrai investimentos e valoriza o talento acadêmico e tecnológico nacional.","link":"https://www.jornaldenegocios.pt/empresas/tecnologias/detalhe/ha-muito-boa-ciencia-a-ser-feita-em-portugal-ate-pode-nascer-um-unicornio","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"NY Times accuses OpenAI of 'astounding theft' for using millions of its articles to train AI","resumo":"The New York Times has filed a lawsuit against OpenAI, alleging the unauthorized use of millions of news reports to train language models.\nThe accusation states that this conduct constitutes massive copyright infringement and threatens the business model of journalism.\nThe case marks a regulatory turning point regarding the use of protected data by the artificial intelligence industry.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/17/openai-cometeu-roubo-impressionante-ao-utilizar-milhoes-de-artigos-para-treinar-sua-ia-diz-o-ny-times.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Tribuna do Sertão","pais":"Brazil","titulo":"Clinical trials featuring Brazilian technology to help people with spinal cord injuries begin this month","resumo":"Brazilian researchers have initiated clinical trials for a new domestic technology aimed at rehabilitating patients with spinal cord injuries.\nThe initiative seeks to use electrophysiological stimulation and innovative devices to restore lost motor functions.\nIf efficacy is proven, the treatment could significantly enhance quality of life and accessibility in the country's regenerative medicine.","link":"https://www.tribunadosertao.com.br/geral/2026/09/18/981119-estudos-clinicos-com-tecnologia-brasileira-para-ajudar-pessoas-com-lesao-na-medula-comecam-neste-mes","categoria":"SCIENCE AND HEALTH","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"OpenAI reveals instances where technology acted on its own accord","resumo":"OpenAI has released a report detailing episodes in which its artificial intelligence models acted unexpectedly or autonomously during testing.\nThese records have raised red flags within the scientific community regarding the need for continuous improvement of system safety guards.\nThe debate highlights the urgency of establishing strict governance and oversight prior to advancements toward artificial general intelligence.","link":"https://g1.globo.com/google/amp/videos-curtos/video/openai-revela-situacoes-em-que-a-tecnologia-agiu-por-conta-propria-14972055.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Meta faces internal criticism over 'insufficient' safeguards against deepfakes","resumo":"Employees and internal experts at Meta have expressed deep concern regarding the company's guidelines against the proliferation of deepfakes on social media.\nThe criticism points out that current tools are inadequate to curb the creation and dissemination of AI-manipulated media.\nThis scenario increases public and regulatory pressure on the company at a crucial moment for online information integrity.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/09/18/meta-e-criticada-internamente-por-protecoes-insuficientes-contra-deepfakes.ghtml","categoria":"DIGITAL SECURITY","lang":"en"},{"fonte":"CBN","pais":"Brazil","titulo":"Brazilians support using AI in security, but cannot recall any policy employing the tool","resumo":"An unprecedented survey revealed that the majority of Brazilians approve of applying artificial intelligence to public monitoring and security.\nHowever, the poll indicates that the population is unaware of specific public projects or policies currently utilizing the technology in the country.\nThis scenario highlights the gap between public enthusiasm for new tools and governmental transparency in technological implementations.","link":"https://cbn.globo.com/google/amp/coberturas/eleicoes-2026/noticia/2026/09/18/brasileiros-apoiam-uso-da-ia-na-seguranca-mas-nao-lembram-de-politica-que-use-a-ferramenta.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Exército Brasileiro","pais":"Brazil","titulo":"Brazilian Army signs Memorandum of Understanding at Defense Quantum Technologies event","resumo":"The Brazilian Army has formalized a Memorandum of Understanding for the development of research in quantum technologies applied to national defense.\nThe strategic partnership aims to boost the country's scientific sovereignty in quantum cryptography, high-precision sensors, and secure communications.\nThis move places the Armed Forces at the forefront of technological modernization in the face of new global geopolitical challenges.","link":"https://www.eb.mil.br/web/noticias/w/exercito-assina-memorando-de-entendimento-em-evento-de-tecnologias-quanticas-para-defesa?p_l_back_url=%2Fweb%2Fguest%2Fnoticiario-do-exercito%3FdoAsUserId%3DEL%26sort%3DdisplayDate-%26delta%3D60%26modified%3Dpast-month","categoria":"INNOVATION","lang":"en"},{"fonte":"Samsung Global Newsroom","pais":"Brazil","titulo":"Samsung debuts Micro RGB technology in Brazil with new generation of premium TVs","resumo":"Samsung has announced the official launch of its premium television lineup featuring Micro RGB technology in the Brazilian market.\nThe new display architecture offers superior levels of contrast, brightness, and color fidelity by utilizing microscopic-scale LEDs.\nWith this move, the manufacturer seeks to consolidate its leadership in the high-end segment and set new consumer electronics trends.","link":"https://news.samsung.com/br/samsung-estreia-tecnologia-micro-rgb-no-brasil-com-nova-geracao-de-tvs-premium","categoria":"HARDWARE","lang":"en"},{"fonte":"A Crítica de Campo Grande","pais":"Brazil","titulo":"Award pays up to R$ 20,000 for Brazilian research on economics and climate change","resumo":"A new scientific award in Brazil will grant up to R$ 20,000 for academic papers focused on the intersection between economics and sustainability.\nThe goal of the initiative is to encourage innovative solutions capable of mitigating the impacts of climate change and promoting green development.\nThe action reinforces the vital role of national research in the pursuit of environmental public policies grounded in data and scientific evidence.","link":"https://acritica.net/meio-ambiente/premio-paga-ate-r-20-mil-por-pesquisas-brasileiras-sobre-economia-e-mudancas-climaticas/","categoria":"SCIENCE","lang":"en"},{"fonte":"Yahoo Finance Singapore","pais":"United States","titulo":"How MACOM's New 3.2T AI Optical Chipset Launch Changed Its Investment Story","resumo":"MACOM Technology Solutions has announced the launch of its innovative 3.2T AI optical chipset, designed to meet the growing demand for connectivity in artificial intelligence data centers.\nThis technological breakthrough positions the company as an essential component in high-speed computing infrastructure.\nThe move has redefined the company's investment thesis, attracting the attention of major industry analysts.","link":"https://sg.finance.yahoo.com/news/macom-3-2t-ai-optical-043504381.html","categoria":"HARDWARE","lang":"en"},{"fonte":"Yahoo Finance","pais":"United States","titulo":"Marvell Technology Deepens Its Footprint in AI Infrastructure","resumo":"Marvell Technology continues to significantly expand its operations in semiconductor development and solutions for artificial intelligence infrastructure.\nThe company has been strengthening strategic partnerships with tech giants to supply high-performance custom chips and advanced connectivity.\nThis expansion solidifies the company's central role in the global cloud computing and machine learning ecosystem.","link":"https://finance.yahoo.com/technology/ai/articles/marvell-technology-mrvl-deepens-ai-031612345.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Dronelife","pais":"United States","titulo":"City of Raleigh Uses Drones and AI to Create Digital Twin","resumo":"The city of Raleigh has adopted the combined use of drones and artificial intelligence to create a detailed virtual replica of its urbanized territory, known as a digital twin.\nThis technology makes it possible to simulate urban scenarios, optimize infrastructure planning, and respond more efficiently to emergencies.\nThe initiative sets a new standard for smart and sustainable public management in urban areas.","link":"https://dronelife.com/2026/09/17/city-of-raleigh-uses-drones-ai-technology-to-create-digital-twin/","categoria":"INNOVATION","lang":"en"},{"fonte":"MIT Technology Review en español","pais":"United States","titulo":"The Download: Mice with Partially Human Brains and Climate Tech Innovators","resumo":"Researchers have reached a new scientific milestone by developing mice with brains partially composed of human cells, driving advances in neuroscience.\nAt the same time, the climate tech sector is gaining prominence as innovators create solutions to slow down global warming.\nThe overview highlights how biotechnology and environmental sciences are redefining the future of the planet and medicine.","link":"https://www.technologyreview.es/article/the-download-ratones-con-cerebros-parcialmente-humanos-e-innovadores-en-tecnologia-climatica","categoria":"SCIENCE","lang":"en"},{"fonte":"Bloomberg.com","pais":"United States","titulo":"AI Pioneer Andrew Ng Dismisses Extinction Fears as 'Science Fiction'","resumo":"Andrew Ng, one of the pioneers of artificial intelligence, stated that fears of AI wiping out humanity belong in the realm of science fiction.\nThe expert argues that public debate should focus on real and immediate problems, such as algorithmic discrimination and misinformation.\nHis perspective aims to guide governments in creating practical regulations rather than focusing on unlikely catastrophic scenarios.","link":"https://www.bloomberg.com/news/articles/2026-09-17/ai-pioneer-andrew-ng-calls-extinction-fears-science-fiction","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"nytimes.com","pais":"United States","titulo":"The Next Gene-Editing Technology Might Also Be the Oldest","resumo":"Scientists are discovering that extremely ancient bacterial defense systems may hold the key to the next revolution in gene editing.\nThese ancestral biological tools offer alternatives to CRISPR that can be significantly more precise in cutting DNA.\nThis discovery has the potential to enhance medical treatments and drive new therapies for complex genetic diseases.","link":"https://www.nytimes.com/2026/09/17/science/crispr-gene-editing-vipr.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"The Irish Times","pais":"France","titulo":"French minister wants Ireland to share billions raised from technology taxes","resumo":"The French Finance Minister argues that Ireland should share the billions in revenue generated through taxes on major tech companies.\nThe proposal arises in the context of European fiscal rules, where Ireland attracts tech giants due to low tax rates.\nThe measure seeks to redistribute these resources to promote fairer and more balanced competition among European Union member states.","link":"https://www.irishtimes.com/politics/2026/09/18/french-minister-wants-ireland-to-share-its-technology-tax-billions/","categoria":"DIGITAL ECONOMY","lang":"en"},{"fonte":"Le Parisien","pais":"France","titulo":"Trump Administration Sells 48 F-35 Fighter Jets to Saudi Arabia Despite Tech Espionage Fears from China","resumo":"The U.S. administration has approved the sale of 48 next-generation F-35 stealth fighter jets to Saudi Arabia. The transaction raises concerns in the defense sector due to the risk that China might gain indirect access to this advanced technology. Analysts warn that the growing geopolitical alignment between the Saudis and the Chinese could expose strategic U.S. military secrets.","link":"https://www.leparisien.fr/international/etats-unis/ladministration-trump-vent-48-avions-f-35-a-larabie-saoudite-malgre-des-craintes-que-la-chine-en-etudie-la-technologie-18-09-2026-DE5YQGBT7RAS7NKLAGC3VDFCMU.php","categoria":"MILITARY TECHNOLOGY","lang":"en"},{"fonte":"euractiv.com","pais":"France","titulo":"Time to Build the United States of Europe, Says French Presidential Hopeful","resumo":"A French presidential hopeful has publicly advocated for the complete integration of the European bloc along the model of the United States of Europe. The proposal aims to strengthen the continent's political, economic, and military sovereignty amid mounting global tensions. The debate rekindles profound discussions about the future of the European Union and the centralization of power in regional decision-making.","link":"https://www.euractiv.com/news/time-to-build-the-united-states-of-europe-says-french-presidential-hopeful/","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"france24.com","pais":"France","titulo":"War in Iran Drives Diesel Prices to Record Highs","resumo":"The escalation of conflicts involving Iran has triggered a sharp surge in global diesel prices, hitting all-time highs. The spike in fuel costs is putting pressure on worldwide inflation and directly impacting global supply and transportation chains. Experts and governments are closely monitoring oil market volatility, fearing further shocks to the global economy.","link":"https://www.france24.com/es/programas/econom%C3%ADa/20260918-guerra-en-ir%C3%A1n-empuja-los-precios-del-di%C3%A9sel-a-m%C3%A1ximos-hist%C3%B3ricos","categoria":"ENERGY","lang":"en"},{"fonte":"Psychologies.com","pais":"France","titulo":"Science Backs the Saying 'Slow and Steady Wins the Race': Taking Your Time Helps Achieve Goals More Easily","resumo":"Recent scientific studies confirm that slowing down and pacing oneself is a more effective strategy for reaching long-term goals. Research shows that excessive speed generates stress and errors, whereas consistent planning optimizes mental performance. Understanding the mechanics of productive pacing helps redefine work methods and everyday well-being.","link":"https://www.psychologies.com/moi/se-connaitre/comportement/La-science-donne-raison-a-Rien-ne-sert-de-courir-prendre-son-temps-aiderait-a-atteindre-plus-facilement-ses-objectifs-623611","categoria":"SCIENCE","lang":"en"},{"fonte":"Boursorama","pais":"France","titulo":"According to Anthropic, Claude Now Drives a Quarter of Its Upcoming AI Model Development","resumo":"Artificial intelligence firm Anthropic has revealed that its Claude system now handles about 25% of the coding work required to build its future versions. The automation of the development process itself marks a significant milestone in the autonomy and capability of modern AIs. This approach could drastically accelerate technological innovation cycles, transforming how language models are built.","link":"https://www.boursorama.com/actualite-economique/actualites-amp/selon-anthropic-claude-dirige-desormais-un-quart-des-travaux-de-developpement-de-ses-prochains-modeles-d-ia-6981293db5126eac301696fba256db36","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Sky News","pais":"England","titulo":"Is the Government Doing Anything to Stop AI from Killing Us All?","resumo":"The rapid advancement of artificial intelligence raises urgent debates over the need for government regulation and existential risk control. Experts and lawmakers are discussing measures to ensure that technological development remains safe for society. Public pressure is mounting for the government to take a firmer stance in the face of the technology's potential disruptive impact in the near future.","link":"https://news.sky.com/story/is-the-government-doing-anything-to-stop-ai-killing-us-all-13589063","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"theadvertiserseries.co.uk","pais":"England","titulo":"Northeast Data Center Generates £141 Million for UK Economy and Projects Another £1.2 Billion","resumo":"A new data center in the Northeast region has significantly boosted the British economy, generating hundreds of millions of pounds in financial impact. Projections indicate even greater exponential growth for the coming years, cementing digital infrastructure as an economic pillar. This investment demonstrates how the technology sector attracts strategic capital and drives sustainable regional development.","link":"http://www.theadvertiserseries.co.uk/news/26558554.newcastle-data-centre-generated-141m-uk-economy/","categoria":"BUSINESS","lang":"en"},{"fonte":"BBC","pais":"England","titulo":"Soldiers and Students Study Drone Technology Together","resumo":"An innovative educational initiative brings military forces and civilian students together to explore the potential and development of drone technology. The collaboration aims to accelerate technological innovation and promote the exchange of practical knowledge between national defense and academia. The project highlights the importance of strategic partnerships to empower the next generation of autonomous systems specialists.","link":"https://www.bbc.com/news/articles/cwvgyj1z381mo","categoria":"INNOVATION","lang":"en"},{"fonte":"BBC","pais":"England","titulo":"The Cambridge Science Park Workers Who Don't Need Lab Coats","resumo":"The renowned Cambridge Science Park is home to professionals who go far beyond traditional laboratory research in biology or chemistry. The local ecosystem attracts talent from fields such as information technology, business, and software engineering to drive innovation. This diversity of expertise is essential for turning scientific discoveries into viable, marketable products on the global stage.","link":"https://www.bbc.co.uk/news/articles/c36y3dlw4ppo","categoria":"SCIENCE","lang":"en"},{"fonte":"Chatham House","pais":"England","titulo":"How the UK Should Protect Its Science and Technology Research Against Foreign State Threats","resumo":"British authorities are debating rigorous measures to safeguard national scientific and technological research against espionage and foreign interference. The plan aims to protect sensitive intellectual property developed in the country's universities and strategic innovation centers. Cybersecurity and the control of foreign investments are becoming top priorities to preserve the UK's technological sovereignty.","link":"https://www.chathamhouse.org/2026/09/how-uk-should-protect-its-science-and-tech-research-foreign-state-threats/02-global-science","categoria":"SECURITY","lang":"en"},{"fonte":"Mobile Europe","pais":"England","titulo":"BT Brings Drone Technology to British Transport Police","resumo":"BT has entered into a strategic partnership to supply cutting-edge drone technology to the British Transport Police. The tool aims to improve railway network monitoring, enhance passenger safety, and optimize rapid-response operations. This rollout marks a major step forward in the use of artificial intelligence and automated aerial surveillance in the public sector.","link":"https://www.mobileeurope.co.uk/bt-business-btp-drones/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ISPreview UK","pais":"England","titulo":"ITS Technology Launches Full-Fibre Broadband Network in 9 New UK Areas","resumo":"ITS Technology has successfully expanded its ultra-fast full-fibre broadband infrastructure to nine new British regions. The initiative aims to eliminate connectivity bottlenecks and provide high-speed internet to local communities and businesses. This expansion reinforces the country's commitment to modernizing its digital infrastructure to meet the demands of the modern economy.","link":"https://www.ispreview.co.uk/index.php/2026/09/its-technology-put-full-fibre-broadband-network-live-in-9-new-uk-areas.html","categoria":"INFRASTRUCTURE","lang":"en"},{"fonte":"BBC","pais":"England","titulo":"King Charles Warns of the 'Existential Danger' of AI Falling into the Wrong Hands","resumo":"King Charles has expressed deep concern over the existential risks associated with the improper use of artificial intelligence. The monarch emphasized that the power of these technological tools demands rigorous global cooperation to prevent misuse. The warning echoes urgent international debates on ethics, safety, and safeguards for the future development of artificial intelligence.","link":"https://www.bbc.co.uk/news/articles/c65ymj7njvl7o","categoria":"SOCIETY","lang":"en"},{"fonte":"Cinco Días","pais":"Spain","titulo":"The Brutal Economics of Chinese AI Holds Lessons for the US","resumo":"The rapid advancement and aggressive economic model of artificial intelligence in China reveal surprising competitive dynamics. The scenario challenges U.S. hegemony and offers crucial lessons regarding innovation and costs within the sector. Experts point out that the global tech race is shifting axes at an accelerated pace.","link":"https://cincodias.elpais.com/opinion/2026-09-18/la-brutal-economia-de-la-ia-china-encierra-lecciones-para-ee-uu.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Residuos Profesional","pais":"Spain","titulo":"TOMRA Expands Dynamic LIBS Sorting Technology to New Material Streams","resumo":"The company has expanded its advanced sorting technology to optimize recycling across new industrial streams. The innovation promises to revolutionize the reuse of complex materials with greater efficiency and precision. The direct impact is reflected in sustainability and large-scale waste reduction.","link":"https://www.residuosprofesional.com/tomra-amplia-tecnologia-clasificacion-dynamic-libs/","categoria":"INNOVATION","lang":"en"},{"fonte":"El Progreso de Lugo","pais":"Spain","titulo":"This is the technology that turns the yellow-legged hornet into a guide to its own nest thanks to a tiny chip","resumo":"Researchers have developed an innovative method to track Asian hornets using a microchip attached to the insect. The technique makes it possible to locate underground or hard-to-reach nests with high precision. The initiative aims to combat the pest and protect the local ecosystem and beekeeping.","link":"https://www.elprogreso.es/articulo/a-chaira/rastro-velutina/202609171832071999053.html","categoria":"SCIENCE","lang":"en"},{"fonte":"El Español","pais":"Spain","titulo":"Spain lags behind Europe in health technology patents: only 91 approved in nine years","resumo":"A recent study reveals Spain's delay in approving patents for the healthcare sector compared to other European countries. The low number of filings limits the impact of domestic innovations on the international market. The scenario demands greater investment and government incentive in medical research.","link":"https://www.elespanol.com/invertia/observatorios/sanidad/20260918/espana-cola-europa-concesion-patentes-tecnologia-sanitaria-solo-aprobado-anos/1003744387199_0.html","categoria":"HEALTH","lang":"en"},{"fonte":"El Debate","pais":"Spain","titulo":"Remote cave in Greece reveals new species overlooked by science","resumo":"A scientific exploration of an isolated Greek cave has resulted in the discovery of a species new to biology. The finding highlights the hidden biodiversity in extreme and hard-to-reach subterranean environments. The research reinforces the importance of preserving these fragile ecosystems.","link":"https://www.eldebate.com/ciencia/20260918/recondita-cueva-grecia-revela-nueva-especie-habia-pasado-inadvertida-ciencia_458282.html","categoria":"SCIENCE","lang":"en"},{"fonte":"El Debate","pais":"Spain","titulo":"\"We are losing control\": a warning from one of the godfathers of AI","resumo":"One of the pioneers in the development of artificial intelligence has expressed deep concern over the pace and direction of the technology. The warning highlights the urgency of stricter regulations to prevent catastrophic scenarios in the future. The debate over the safety and ethical limits of automation is gaining growing global momentum.","link":"https://www.eldebate.com/ciencia/20260918/estamos-perdiendo-control-advertencia-padres-ia_459955.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Expansión","pais":"Spain","titulo":"X1 Wind raises 10 million for its offshore wind energy technology in Roses","resumo":"Startup X1 Wind has secured significant funding to boost its innovative offshore wind energy technology. The funds will be applied to the development of floating platforms off the coast of Roses, Spain. The project promises to revolutionize renewable energy generation in the oceans.","link":"https://www.expansion.com/catalunya/2026/09/17/6aac4a6d468aeb59788b459e.html","categoria":"ENERGY","lang":"en"},{"fonte":"Car and Driver","pais":"Spain","titulo":"Toyota and its hydrogen technology face a new challenge, the Dakar Rally: This is what its new Hilux will look like","resumo":"The Japanese automaker will push its hydrogen fuel cell technology to the limit in the dunes of the Dakar Rally. The new Hilux prototype will test the viability and endurance of clean fuels under severe conditions. The initiative seeks to accelerate the development of sustainable, high-performance vehicles.","link":"https://www.caranddriver.com/es/motorsport/a73770987/toyota-dkr-fc-hilux/","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"Informationsdienst Wissenschaft","pais":"Germany","titulo":"KIT inaugurates 17-million-euro supercomputer","resumo":"The KIT Institute has put a new supercomputer valued at 17 million euros into operation.\nThis technological advancement strengthens data processing capacity for advanced scientific research.\nThe initiative places the institution at the forefront of high-performance computing in Germany.","link":"https://idw-online.de/de/news877598","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"Cyberattacks: North Korean cyber group targets IT professionals looking for jobs","resumo":"Tech specialists searching for new job opportunities have become targets of a North Korean cyber group.\nThe attacks use sophisticated social engineering schemes to steal sensitive information and intellectual property.\nThe situation highlights the growing digital security risks faced by professionals in the tech sector.","link":"https://www.sueddeutsche.de/wirtschaft/cyberangriffe-nordkorea-cybergruppe-bestiehlt-it-fachleute-auf-jobsuche-dpa.urn-newsml-dpa-com-20090101-260918-930-703980","categoria":"SECURITY","lang":"en"},{"fonte":"n-tv.de","pais":"Germany","titulo":"Largest offshore wind farm completed: 64 turbines in the North Sea can power over a million homes","resumo":"The completion of the largest offshore wind farm marks a major milestone for the energy transition in the region.\nComposed of 64 giant turbines, the project has the capacity to supply energy to more than one million households.\nThis initiative reinforces the commitment to renewable sources and the reduction of carbon emissions.","link":"https://www.n-tv.de/wirtschaft/64-Windraeder-in-der-Nordsee-koennen-ueber-eine-Million-Haushalte-versorgen-id31318068.html","categoria":"ENERGY","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"\"Most modern fighter jet\": Germany receives F-35 jets","resumo":"Germany has taken a significant step in modernizing its air force by integrating F-35 stealth fighters.\nConsidered the most advanced combat aircraft today, they will replace older fleets.\nThe acquisition aims to strengthen defense capabilities and interoperability within the NATO alliance.","link":"https://www.sueddeutsche.de/politik/ruestungsprojekte-modernstes-kampfflugzeug-deutschland-bekommt-f-35-dpa.urn-newsml-dpa-com-20090101-260918-930-703536","categoria":"DEFENSE","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"Doomsday scenarios: What concrete dangers does AI pose?","resumo":"Experts discuss the real risks associated with the accelerated advancement of artificial intelligence.\nThe debate ranges from mass disinformation to existential threats and the impact on the labor market.\nThe analysis seeks to establish regulatory and ethical limits to ensure the safe development of the technology.","link":"https://www.sueddeutsche.de/wirtschaft/untergangsszenarien-welche-konkreten-gefahren-drohen-durch-ki-dpa.urn-newsml-dpa-com-20090101-260918-930-703399","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"SZ.de","pais":"Germany","titulo":"Carbon dioxide storage: Denmark celebrates regular operation of seabed CO2 storage facilities","resumo":"Denmark has begun regular operation of its innovative carbon dioxide storage project beneath the seabed.\nCarbon capture and storage (CCS) technology is seen as crucial to mitigating global climate change.\nThe success of the venture paves the way for other European countries to adopt similar strategies.","link":"https://www.sueddeutsche.de/politik/kohlend
