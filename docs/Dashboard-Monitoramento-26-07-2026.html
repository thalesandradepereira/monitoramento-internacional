<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monitoramento Mídia Internacional | Global Media Monitoring</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0B0F19;
      --bg-panel: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #E2E8F0;
      --text-muted: #94A3B8;
      --accent: #D4AF37;
      --accent-hover: #FDE047;
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      background-image: radial-gradient(circle at top right, rgba(212, 175, 55, 0.15), transparent 400px),
                        radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.05), transparent 400px);
    }
    header {
      padding: 1.5rem 5%;
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .logo-img {
      height: 48px; /* Altura ajustável do logo */
      width: auto;
      object-fit: contain;
      border-radius: 8px; /* Caso não seja transparente */
    }
    .logo-text {
      font-weight: 700;
      font-size: clamp(1rem, 2vw, 1.5rem);
      letter-spacing: -0.5px;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .logo-text .title-light,
    .logo-text .title-separator {
      color: #fff;
    }
    .logo-text .title-accent {
      color: var(--accent);
    }
    .date-badge {
      background: var(--bg-panel);
      border: 1px solid var(--glass-border);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      color: var(--accent);
      font-weight: 600;
    }
    .container {
      padding: 2rem 5%;
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }
    .filters {
      flex: 0 0 300px;
      background: var(--bg-panel);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 6rem;
    }
    .filter-group {
      margin-bottom: 1.5rem;
    }
    .filter-group label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
    }
    select option {
      background: var(--bg-main);
      color: var(--text-main);
    }
    .results {
      flex: 1;
    }
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .results-count {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .news-card {
      background: var(--bg-panel);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.5rem;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .news-card:hover {
      transform: translateY(-4px);
      border-color: rgba(212, 175, 55, 0.5);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }
    .category {
      color: var(--accent);
    }
    .country {
      color: var(--text-muted);
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.4;
      margin: 0 0 1rem 0;
      color: #fff;
    }
    .card-summary {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-muted);
      flex: 1;
    }
    .card-summary ul {
      margin: 0;
      padding-left: 1.2rem;
    }
    .card-summary li {
      margin-bottom: 0.25rem;
    }
    .card-footer {
      margin-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--glass-border);
      padding-top: 1rem;
    }
    .read-more {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .read-more:hover {
      color: var(--accent-hover);
    }
    .source {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .btn-clear {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-top: 0.5rem;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-clear:hover {
      background: var(--accent);
      color: var(--bg-main);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }
    /* Simple CSS reset/scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: var(--bg-panel); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .filters {
        flex: none;
        width: 100%;
        position: static;
        box-sizing: border-box;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-container">
    <img src="logo.jpg" alt="TAP Logo" class="logo-img" onerror="this.style.display='none'">
    <div class="logo-text" aria-label="Monitoramento Mídia Internacional | Global Media Monitoring"><span class="title-light">Monitoramento Mídia</span><span class="title-accent">Internacional</span><span class="title-separator">|</span><span class="title-light">Global Media</span><span class="title-accent">Monitoring</span></div>
  </div>
  <div class="date-badge">26/07/2026</div>
</header>

<div class="container">
  <aside class="filters">
    <div class="filter-group">
      <label for="search">Busca / Search</label>
      <input type="text" id="search" placeholder="Palavra-chave...">
    </div>
    
    <div class="filter-group">
      <label for="lang">Idioma / Language</label>
      <select id="lang">
        <option value="pt">Português (PT-BR)</option>
        <option value="en">English (US)</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="country">País / Country</label>
      <select id="country">
        <option value="all">Todos / All</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="category">Categoria / Category</label>
      <select id="category">
        <option value="all">Todas / All</option>
      </select>
    </div>
    
    <button id="clear-filters" class="btn-clear">Limpar / Clear</button>
  </aside>

  <main class="results">
    <div class="results-header">
      <h2 style="margin: 0; font-size: 1.5rem; color: #fff;">Resultados</h2>
      <span class="results-count" id="count">0 notícias</span>
    </div>
    <div class="news-grid" id="grid">
      <!-- Injected by JS -->
    </div>
  </main>
</div>

<script>
  // Injeta os dados originais no frontend
  const data = [{"fonte":"O GLOBO","pais":"Brasil","titulo":"Companhias aéreas já usam IA para resolver gargalos em solo e definir benefícios a passageiros","resumo":"O setor aéreo tem adotado inteligência artificial para otimizar operações terrestres complexas e personalizar a experiência do viajante. A tecnologia atua na gestão de gargalos logísticos, aumentando a eficiência operacional e melhorando a oferta de benefícios específicos. Essa inovação redefine o padrão de atendimento ao elevar a precisão nos serviços prestados aos clientes.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/07/26/companhias-aereas-ja-usam-ia-para-resolver-gargalos-em-solo-e-definir-beneficios-a-passageiros.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Geraldo Ramos: empresário uniu música e tecnologia na criação do app Moises AI, que tem mais de 75 milhões de usuários","resumo":"A plataforma Moises AI, idealizada por Geraldo Ramos, revolucionou a produção musical ao permitir a separação de faixas de áudio via inteligência artificial. Com mais de 75 milhões de usuários, o aplicativo democratizou ferramentas de estúdio profissional para amadores e produtores globais. O sucesso da iniciativa exemplifica como a inovação tecnológica pode transformar a criatividade humana.","link":"https://oglobo.globo.com/101-brasileiros/noticia/2026/07/26/geraldo-ramos-empresario-uniu-musica-e-tecnologia-na-criacao-do-app-moises-ai-que-tem-mais-de-75-milhoes-de-usuarios.ghtml","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Vietnam.vn","pais":"Brasil","titulo":"Qual é o limite de vida dos seres humanos? A ciência já descobriu.","resumo":"Estudos científicos recentes têm mapeado os limites biológicos da longevidade humana, considerando fatores genéticos e ambientais. A pesquisa explora como o envelhecimento celular atua como uma barreira física que define a duração máxima da vida. As descobertas abrem debates profundos sobre a medicina regenerativa e o futuro da saúde na terceira idade.","link":"https://www.vietnam.vn/pt/con-nguoi-co-the-song-toi-bao-nhieu-tuoi-khoa-hoc-da-tim-ra-gioi-han","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"UOL","pais":"Brasil","titulo":"Brasileirão tem primeiro gol com nova tecnologia de impedimento; veja","resumo":"O Campeonato Brasileiro implementou com sucesso o sistema de impedimento semiautomático em partidas oficiais, garantindo maior precisão na arbitragem. A tecnologia utiliza câmeras avançadas para rastrear o posicionamento dos atletas em milissegundos, reduzindo margens de erro humano. Este marco representa um avanço significativo na aplicação da tecnologia esportiva no país.","link":"https://www.uol.com.br/esporte/futebol/ultimas-noticias/2026/07/25/brasileirao-tem-primeiro-gol-com-nova-tecnologia-de-impedimento-veja.ghtm","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"CNN Brasil","pais":"Brasil","titulo":"Entenda as regras do TSE para vídeos e imagens com IA nas eleições","resumo":"O Tribunal Superior Eleitoral estabeleceu diretrizes rigorosas para a utilização de inteligência artificial durante o processo eleitoral brasileiro. As novas normas visam combater a desinformação e assegurar a transparência na propaganda política digital. O objetivo é proteger a integridade do voto e mitigar os riscos associados ao uso indevido de conteúdos sintéticos.","link":"https://www.cnnbrasil.com.br/eleicoes/entenda-as-regras-do-tse-para-videos-e-imagens-com-ia-nas-eleicoes/","categoria":"TRENDING TOPICS","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"8.000 novas espécies de insetos são identificadas por meio do DNA no Equador","resumo":"Cientistas realizaram um avanço monumental na entomologia ao identificar milhares de novas espécies de insetos utilizando técnicas modernas de sequenciamento de DNA. O estudo revela uma biodiversidade anteriormente desconhecida, destacando a importância da genética na preservação ambiental. Essas descobertas expandem drasticamente nosso conhecimento sobre a fauna tropical e os ecossistemas locais.","link":"https://www1.folha.uol.com.br/ciencia/2026/07/8000-novas-especies-de-insetos-sao-identificadas-por-meio-do-dna-no-equador.shtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Exame","pais":"Brasil","titulo":"Enxaqueca não é só uma dor de cabeça: ciência explica o que acontece no cérebro","resumo":"Novas pesquisas neurológicas elucidam que a enxaqueca é uma desordem complexa envolvendo alterações neuroquímicas e vasculares no cérebro. A ciência demonstra que os episódios não se restringem à dor, afetando áreas cognitivas e sensoriais específicas. O entendimento aprofundado destas manifestações é essencial para o desenvolvimento de tratamentos mais eficazes e direcionados aos pacientes.","link":"https://exame.com/ciencia/enxaqueca-nao-e-so-uma-dor-de-cabeca-ciencia-explica-o-que-acontece-no-cerebro/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"AEROIN","pais":"Brasil","titulo":"Conhecendo a Digital Twin e como esta tecnologia tem transformado as operações aeroportuárias modernas","resumo":"A tecnologia de Gêmeos Digitais (Digital Twin) está criando cópias virtuais de infraestruturas aeroportuárias para simular cenários operacionais em tempo real. Essa abordagem permite prever falhas, otimizar fluxos de tráfego e reduzir custos logísticos antes mesmo de qualquer intervenção física. O conceito surge como uma solução essencial para a modernização e eficiência de aeroportos globais.","link":"https://aeroin.net/conhecendo-a-digital-twin-e-como-esta-tecnologia-tem-transformado-as-operacoes-aeroportuarias-modernas/?amp=1","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The New York Times","pais":"Estados Unidos","titulo":"4 comandos que podem revelar o que os chatbots realmente sabem sobre você","resumo":"Este artigo explora técnicas de 'prompting' para usuários investigarem quais dados pessoais foram absorvidos e são armazenados por inteligências artificiais. A prática visa aumentar a transparência sobre a privacidade do usuário diante da crescente onipresença dos modelos de linguagem. O impacto reflete uma preocupação global com a segurança de dados e a ética no uso dessas ferramentas.","link":"https://www.nytimes.com/es/2026/07/26/espanol/negocios/chatbot-preguntas-informacion-personal.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Hobby Consolas","pais":"Estados Unidos","titulo":"Apple TV estreia o primeiro trailer de Neuromancer, sua aguardada série de ficção científica cyberpunk","resumo":"A Apple TV revelou as primeiras imagens da adaptação televisiva de Neuromancer, uma das obras mais influentes do gênero cyberpunk. A produção promete trazer um visual tecnológico imersivo, elevando as expectativas de fãs de ficção científica em todo o mundo. O lançamento destaca o investimento pesado da plataforma em conteúdos de alto impacto visual e narrativo.","link":"https://www.hobbyconsolas.com/hobbycine/apple-tv-estrena-primer-trailer-neuromante-su-esperada-serie-ciencia-ficcion-cyberpunk_7018992_0.html","categoria":"ENTRETENIMENTO","lang":"pt"},{"fonte":"BBC","pais":"Estados Unidos","titulo":"Chefe da Nasa elogia a ascensão das mulheres na ciência","resumo":"O administrador da Nasa destacou o papel fundamental das mulheres no avanço de pesquisas científicas e missões espaciais recentes. O reconhecimento reforça o compromisso da agência em promover a equidade de gênero dentro de ambientes técnicos. Esse movimento é visto como um marco importante para inspirar novas gerações em carreiras de ciência e engenharia.","link":"https://www.bbc.co.uk/news/articles/c62vq0pg6yvo","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Vietnam.vn","pais":"Estados Unidos","titulo":"A capitalização de mercado das gigantes da tecnologia evaporou em mais de 500 bilhões de dólares em uma semana.","resumo":"O mercado financeiro registrou uma queda acentuada que resultou na perda de 500 bilhões de dólares em valor de mercado das principais empresas de tecnologia. Esta volatilidade reflete uma reavaliação dos investidores sobre as expectativas de crescimento do setor. O impacto direto é sentido na economia global, acendendo um sinal de alerta para futuros investimentos no setor de tecnologia.","link":"https://www.vietnam.vn/pt/von-hoa-cac-ong-lon-cong-nghe-boc-hoi-hon-500-ty-usd-trong-mot-tuan","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Época Negócios","pais":"Estados Unidos","titulo":"Empresas de tecnologia eliminam 140 mil empregos nos EUA em meio à corrida bilionária pela IA","resumo":"O setor de tecnologia nos EUA enfrenta uma onda massiva de demissões, totalizando 140 mil cortes este ano enquanto o foco financeiro migra para a inteligência artificial. Essa reestruturação estratégica demonstra a priorização de automação e eficiência sobre a manutenção de grandes quadros de funcionários. A tendência redefine o panorama do mercado de trabalho para profissionais de tecnologia.","link":"https://epocanegocios.globo.com/google/amp/futuro-do-trabalho/noticia/2026/07/empresas-de-tecnologia-eliminam-140-mil-empregos-nos-eua-em-meio-a-corrida-bilionaria-pela-ia.ghtml","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"O GLOBO","pais":"Estados Unidos","titulo":"Meta lança aplicativo para vendedores do Facebook Marketplace","resumo":"A Meta apresentou uma nova ferramenta voltada especificamente para otimizar a experiência de vendedores no Facebook Marketplace. O aplicativo visa simplificar a gestão de inventário e a comunicação com compradores, visando aumentar o volume de transações na plataforma. A iniciativa reflete o foco da empresa em fortalecer seu ecossistema de comércio digital integrado.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/07/25/meta-lanca-aplicativo-para-vendedores-do-facebook-marketplace.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Forbes","pais":"Estados Unidos","titulo":"Trinnov e Ascendo revelam nova tecnologia inovadora de graves para cinema doméstico","resumo":"As empresas Trinnov e Ascendo anunciaram um avanço significativo em sistemas de áudio para home cinema, prometendo uma experiência sonora superior em baixas frequências. A inovação tecnológica promete redefinir os padrões de qualidade de som residencial, competindo diretamente com a experiência de salas de cinema profissionais. O produto mira o mercado de entretenimento premium e entusiastas de alta fidelidade.","link":"https://www.forbes.com/sites/johnarcher/2026/07/25/trinnov-and-ascendo-unveil-ground-breaking-new-home-cinema-bass-technology/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Fortune","pais":"Estados Unidos","titulo":"Por dentro do laboratório de tecnologia da On, onde robôs fabricam tênis de corrida em 3 minutos","resumo":"A fabricante de calçados On implementou processos robóticos avançados em seu laboratório, reduzindo o tempo de produção de horas para poucos minutos. Essa automação não apenas otimiza a eficiência operacional, mas também redefine as possibilidades da manufatura sustentável e ágil. O impacto é uma mudança drástica na forma como o varejo esportivo concebe a produção de alto desempenho.","link":"https://fortune.com/article/on-running-technology-footwear-running-shoe-swiss-manufacturing/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Sud Ouest","pais":"França","titulo":"Incêndios: O Grupo 'Sud Ouest' disponibiliza sua tecnologia GéoPass para informar as vítimas","resumo":"O Grupo Sud Ouest implementou sua plataforma tecnológica GéoPass para fornecer informações precisas e em tempo real às pessoas afetadas por incêndios. A ferramenta visa otimizar a comunicação e auxiliar na gestão de crises, demonstrando o papel social das empresas de tecnologia durante desastres naturais na França.","link":"https://www.sudouest.fr/faits-divers/incendies/incendies-le-groupe-sud-ouest-met-sa-technologie-geopass-a-disposition-des-sinistres-pour-les-informer-30054474.php","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"leconseilpatrimoine.fr","pais":"França","titulo":"ASML: Líder europeu em tecnologia e inovação","resumo":"A ASML reafirma sua posição como a pilar fundamental do ecossistema de semicondutores na Europa e no mundo. A empresa continua a impulsionar a inovação tecnológica global através de suas máquinas de litografia avançada, cruciais para a fabricação dos processadores mais potentes e modernos do mercado atual.","link":"https://www.leconseilpatrimoine.fr/actualites/investissement/bourse/asml-leader-europeen-technologie-innovation/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Mon Auto Neuve","pais":"França","titulo":"Tensão na tecnologia automotiva: Bobo Samardzic e XPENG chegam a Mônaco com o L03, desafiando o futuro","resumo":"A entrada da montadora chinesa XPENG no mercado europeu através de Mônaco marca uma mudança significativa na concorrência de veículos elétricos. Com os modelos L03, a marca traz novas tecnologias de propulsão híbrida e elétrica, pressionando os fabricantes tradicionais e forçando uma rápida evolução tecnológica no setor automotivo.","link":"https://www.monautoneuve.fr/actualites/tension-autour-de-la-technologie-automobile-bobo-samardzic-et-xpeng-debarquent-a-monaco-avec-la-l03-en-versions-ev-et-rev-defiant-le-futur/","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Uma falha no Android permite que o Gemini contorne certas proteções sem código PIN, Google prepara correção","resumo":"Pesquisadores identificaram uma vulnerabilidade no Android que permite ao assistente Gemini acessar informações protegidas sem exigir a autenticação via código PIN. O Google já reconheceu o problema de segurança e está trabalhando em uma atualização crítica para corrigir a falha, visando proteger a privacidade e os dados dos usuários.","link":"https://www.science-et-vie.com/technos-et-futur/une-faille-android-permet-a-gemini-de-contourner-certaines-protections-sans-code-pin-google-prepare-un-correctif-251657.html","categoria":"SEGURANÇA DIGITAL","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Todos os dias, 90 mil músicas criadas por IA chegam ao Deezer: a indústria musical diante de uma revolução preocupante","resumo":"O volume massivo de músicas geradas por inteligência artificial inseridas diariamente em plataformas como o Deezer está transformando radicalmente o mercado fonográfico. Esse fenômeno levanta questões urgentes sobre direitos autorais, a qualidade artística e a sustentabilidade econômica dos músicos humanos frente à automação acelerada da criação musical.","link":"https://www.science-et-vie.com/technos-et-futur/chaque-jour-90-000-musiques-creees-par-ia-arrivent-sur-deezer-lindustrie-musicale-face-a-une-revolution-inquietante-251679.html","categoria":"TRENDING TOPICS","lang":"pt"},{"fonte":"Techno-Science","pais":"França","titulo":"🌌 Uma colisão teria virado a Via Láctea","resumo":"Novas descobertas astronômicas sugerem que uma colisão galáctica violenta no passado remoto foi responsável por distorcer a estrutura da Via Láctea. Este achado científico redefine a nossa compreensão sobre a evolução e a formação da nossa galáxia, demonstrando a dinâmica complexa e caótica que molda o universo observável.","link":"https://www.techno-science.net/fr/actualites/collision-voie-lactee-gaia-encelade-basculement-29079","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Futura, le média qui explore le monde","pais":"França","titulo":"Físicos usaram a ciência das máquinas a vapor do século XIX para resolver um mistério de buracos negros","resumo":"Uma descoberta fascinante revela que princípios da termodinâmica clássica, desenvolvidos para a era das máquinas a vapor, foram essenciais para desvendar segredos de buracos negros. Este estudo multidisciplinar demonstra como leis da física do século XIX continuam a ser ferramentas fundamentais para explicar fenômenos astrofísicos modernos e complexos.","link":"https://www.futura-sciences.com/en/scientists-stunned-by-shocking-link-between-heat-theory-and-black-holes-revealed_36253/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Sky News","pais":"Inglaterra","titulo":"Robôs colhedores de morango podem substituir humanos – mas são tão bons quanto?","resumo":"A automação agrícola está ganhando espaço no Reino Unido com o desenvolvimento de robôs especializados na colheita de frutas. O artigo analisa se a precisão tecnológica dessas máquinas consegue equiparar-se ao trabalho manual humano. O impacto reside na potencial transformação da mão de obra rural e na sustentabilidade da cadeia de suprimentos alimentares.","link":"https://news.sky.com/video/strawberry-picking-robots-could-replace-humans-but-are-they-as-good-13566867","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"CEPR","pais":"Inglaterra","titulo":"Adoção de tecnologia e escassez de mão de obra: Evidências da Revolução Industrial da Grã-Bretanha","resumo":"Este estudo explora a relação histórica entre a escassez de trabalhadores e a implementação de inovações tecnológicas durante a Revolução Industrial britânica. Ao traçar paralelos com o cenário contemporâneo, o texto destaca como a necessidade econômica impulsiona avanços. O impacto central é a compreensão de como ciclos de automação moldam a economia a longo prazo.","link":"https://cepr.org/voxeu/columns/technology-adoption-and-labour-shortages-evidence-britains-industrial-revolution","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"El Español","pais":"Espanha","titulo":"Espanha dá uma lição à Europa: consegue separar cobre, prata e platina de resíduos eletrônicos com tecnologia de ponta","resumo":"Pesquisadores espanhóis desenvolveram um método inovador e altamente eficiente para extrair metais preciosos de lixo eletrônico. A tecnologia promete transformar a reciclagem industrial e reduzir a dependência europeia de importações de minérios. O avanço destaca o país como um polo de sustentabilidade e inovação tecnológica no continente.","link":"https://www.elespanol.com/omicrono/20260726/espana-da-leccion-europa-consigue-separar-cobre-plata-platino-residuos-electronicos-tecnologia-puntera-kw/1003744329583_0.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"20Minutos","pais":"Espanha","titulo":"O novo XPeng L03 chega à Europa trazendo uma tecnologia que poucos oferecem no mercado","resumo":"O veículo elétrico XPeng L03 desembarca na Europa com recursos tecnológicos de ponta que visam desafiar os líderes do mercado. Com diferenciais em automação e eficiência energética, o modelo promete elevar o padrão de luxo acessível. A chegada marca uma nova fase para a mobilidade elétrica no continente europeu.","link":"https://www.20minutos.es/motor/actualidad/nuevo-xpeng-l03-llega-europa-google-integrado-tecnologia-muy-pocos-ofrecen_7017607_0.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"El Periódico Extremadura","pais":"Espanha","titulo":"Cirurgia robótica: uma tecnologia ainda não acessível a todos","resumo":"A robótica médica representa um salto significativo na precisão de procedimentos cirúrgicos, permitindo recuperações mais rápidas e menos invasivas. Entretanto, o alto custo dos equipamentos limita a implementação plena nos sistemas de saúde pública. O debate sobre a democratização dessa inovação permanece central na medicina moderna.","link":"https://www.elperiodicoextremadura.com/extremadura/2026/07/26/cirugia-robotica-tecnologia-aun-no-alcance-todos-132814786.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"EL PAÍS","pais":"Espanha","titulo":"Quando o leão da IA escapa da jaula","resumo":"O avanço desenfreado da inteligência artificial gera preocupações globais sobre segurança e limites éticos no desenvolvimento de sistemas autônomos. Especialistas alertam para a necessidade de regulamentação rigorosa para evitar impactos imprevistos na sociedade. O tema central é o controle do potencial transformador dessas novas ferramentas digitais.","link":"https://elpais.com/tecnologia/2026-07-26/cuando-el-leon-de-la-ia-se-escapa-de-la-jaula.html","categoria":"TRENDING TOPICS","lang":"pt"},{"fonte":"elblogoferoz.com","pais":"Espanha","titulo":"EMPRESAS | GF Hoteles une IA e economia circular e alcança o 'Desperdício Zero'","resumo":"A rede GF Hoteles implementou inteligência artificial para otimizar sua gestão de alimentos e eliminar o desperdício em suas operações. Ao integrar tecnologia e economia circular, a empresa estabelece um novo padrão para o setor de hospitalidade na Espanha. Essa iniciativa demonstra a viabilidade prática da sustentabilidade digital.","link":"https://www.elblogoferoz.com/2026/07/26/empresas-gf-hoteles-une-ia-y-economia-circular-y-alcanza-el-desperdicio-cero/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"ABC","pais":"Espanha","titulo":"Tecnologia de alto nível para mitigar o impacto da energia eólica na avifauna","resumo":"Novas tecnologias de monitoramento estão sendo aplicadas em parques eólicos na Espanha para proteger aves e evitar colisões. Sensores avançados e sistemas de detecção automática ajudam a conciliar a geração de energia renovável com a conservação da biodiversidade. É um exemplo de como a inovação promove o equilíbrio ambiental.","link":"https://www.abc.es/economia/tecnologia-altos-vuelos-atajar-impacto-eolica-aves-20260726010946-nt.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Negocios.com","pais":"Espanha","titulo":"Biodata Bank: Bombeiros da Catalunha e Mossos já usam tecnologia que antecipa a insolação","resumo":"Corpos de emergência na Catalunha adotaram sensores biométricos capazes de prever casos de insolação e exaustão térmica em profissionais de campo. A tecnologia monitora sinais vitais em tempo real para garantir a segurança durante operações sob altas temperaturas. Esta inovação aumenta a proteção vital em missões críticas de resgate.","link":"https://www.negocios.com/articulo/tech-talks/inteligencia-artificial-revoluciona-declaracion-renta-ahorra-800-euros-detectando-errores/20260725195607491024.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"El Periódico","pais":"Espanha","titulo":"Lepas aterrissa na Espanha com o L8 Super Híbrido: tecnologia, elegância e preço revolucionário","resumo":"A marca Lepas entra no mercado espanhol com o lançamento do L8, um veículo híbrido que combina design moderno e recursos tecnológicos de última geração. Com um posicionamento de preço altamente competitivo, o modelo busca capturar consumidores interessados em transição energética. A estreia promete agitar o segmento automotivo local.","link":"https://www.elperiodico.com/es/motor/20260725/lepas-aterriza-espana-l8-super-hibrido-132765859","categoria":"LANÇAMENTO","lang":"pt"},{"fonte":"Wallstreet Online","pais":"Alemanha","titulo":"LPKF: Primeiro semestre fraco – Tecnologia LIDE pode alavancar ações em 2027/28","resumo":"A LPKF apresentou resultados modestos no primeiro semestre, mas mantém perspectivas otimistas a longo prazo. A aposta da empresa reside na tecnologia LIDE, que tem potencial para revolucionar o mercado e impulsionar significativamente o valor de suas ações entre 2027 e 2028.","link":"https://www.wallstreet-online.de/nachricht/21152033-lpkf-schwaches-h1-lide-technologie-aktie-2027-28-katapultieren","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Cimento sem emissão de CO2? Produção sustentável em Baden-Württemberg","resumo":"Uma iniciativa em Baden-Württemberg busca transformar a indústria da construção com o desenvolvimento de cimento neutro em carbono. O projeto visa reduzir drasticamente o impacto ambiental do setor, oferecendo uma alternativa ecológica para o mercado de infraestrutura alemão.","link":"https://www.sueddeutsche.de/wirtschaft/zement-ohne-co2-ausstoss-klimafreundlicher-zement-aus-baden-wuerttemberg-dpa.urn-newsml-dpa-com-20090101-260726-930-438637","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"SZ.de","pais":"Alemanha","titulo":"Transporte público de Berlim: Atrasos no projeto de micro-ônibus autônomos","resumo":"O projeto da BVG para implementar micro-ônibus autônomos em Berlim enfrenta desafios técnicos e contratempos operacionais. A iniciativa, que visa modernizar a mobilidade urbana, sofre com atrasos, destacando as dificuldades de integrar a tecnologia de condução autônoma no tráfego urbano real.","link":"https://www.sueddeutsche.de/wirtschaft/berliner-nahverkehr-autonome-kleinbusse-verzoegerungen-bei-bvg-projekt-dpa.urn-newsml-dpa-com-20090101-260726-930-438566","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Rhein-Neckar-Zeitung","pais":"Alemanha","titulo":"Heidelberg: Experimente a medicina do futuro no navio MS Wissenschaft","resumo":"A exposição interativa a bordo do navio MS Wissenschaft traz inovações de Heidelberg para o público, focando no futuro da medicina. Visitantes podem explorar tecnologias de ponta que prometem revolucionar tratamentos e diagnósticos, tornando a ciência acessível e compreensível para todos.","link":"https://www.rnz.de/region/heidelberg_artikel,-Heidelberg-Medizin-der-Zukunft-auf-der-MS-Wissenschaft-erleben-_arid,2385406.html","categoria":"SAÚDE","lang":"pt"},{"fonte":"WELT","pais":"Alemanha","titulo":"“Acabamos de começar” – Como drones ucranianos de baixo custo impactam a economia russa","resumo":"O uso estratégico de drones de baixo custo desenvolvidos pela Ucrânia tem causado danos significativos à infraestrutura econômica russa. Esta tática revela uma mudança no campo de batalha, onde a tecnologia acessível e escalável desafia sistemas defensivos tradicionais e altera a dinâmica do conflito.","link":"https://www.welt.de/politik/ausland/plus6a631ff826ebb8e13e2ef7e1/warenlager-in-flammen-wir-haben-erst-angefangen-wie-ukrainische-billig-drohnen-die-russische-wirtschaft-zerbomben.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"山陽新聞","pais":"Japão","titulo":"Universidade de Okayama promove curso prático sobre fundamentos de microscopia óptica","resumo":"O TC College da Universidade de Okayama oferece uma capacitação intensiva focada no uso de microscópios ópticos para áreas biológicas. O treinamento visa aprimorar o conhecimento técnico e prático de pesquisadores e estudantes, garantindo maior precisão científica. A iniciativa reforça a importância da instrumentação óptica no desenvolvimento de novas descobertas na área de saúde e engenharia biomédica.","link":"https://www.sanyonews.jp/article/1961262","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"47NEWS","pais":"Japão","titulo":"Sistema digital em Tsubame-Sanjo reduz tempo de aprendizado em afiação de cortadores de unhas","resumo":"O Centro de Promoção da Indústria Local de Tsubame-Sanjo desenvolveu um sistema inovador que utiliza tecnologia digital para ensinar a técnica de afiação em apenas meio dia. O projeto foi reconhecido nacionalmente, conquistando o terceiro lugar em um concurso de tecnologia industrial. Essa solução moderniza o artesanato tradicional, garantindo a preservação da qualidade produtiva da região através da digitalização.","link":"https://www.47news.jp/14687495.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"Comunidade Wom-tech organiza a 'Conferência Futuro das Mulheres em STEM 2026'","resumo":"A comunidade de mulheres engenheiras Wom-tech promoverá um grande evento dedicado à inclusão feminina em áreas de ciência, tecnologia, engenharia e matemática. O encontro foca no fortalecimento do papel feminino e no compartilhamento de conhecimentos técnicos avançados. A conferência busca impulsionar a diversidade no setor e preparar as próximas gerações de líderes tecnológicas no Japão.","link":"https://prtimes.jp/main/html/rd/p/000000007.000142328.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"アットプレス","pais":"Japão","titulo":"Gorilla Rental expande portfólio com novos equipamentos de rede para e-sports","resumo":"A empresa Gorilla Rental adicionou quatro novos dispositivos de rede, incluindo roteadores e switches de alta performance, ao seu catálogo de locação. O objetivo é oferecer infraestrutura robusta para torneios de e-sports e transmissões ao vivo de larga escala. Com essa atualização, a empresa atende a crescente demanda por conectividade estável no dinâmico setor de jogos eletrônicos profissional.","link":"https://www.atpress.ne.jp/news/6096844","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Forbes JAPAN","pais":"Japão","titulo":"IA como ferramenta para reformular a economia do cibercrime e guiar decisões de liderança","resumo":"O artigo explora como a inteligência artificial está sendo aplicada para analisar e redefinir os modelos econômicos do cibercrime global. Apresenta cinco estratégias essenciais que líderes de TI e executivos de segurança devem adotar para mitigar riscos. O conteúdo oferece uma visão analítica sobre como a tecnologia pode ser usada proativamente na defesa de infraestruturas críticas contra ataques cibernéticos.","link":"https://forbesjapan.com/articles/detail/101673","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ArchDaily","pais":"Japão","titulo":"Galeria da Praça do Instituto de Tecnologia de Kanagawa por junya ishigami + associates","resumo":"Este projeto arquitetônico destaca a integração inovadora entre espaço público e tecnologia construtiva, projetado pelo renomado escritório de Junya Ishigami. A Galeria da Praça do Instituto de Tecnologia de Kanagawa exemplifica o uso de novos materiais e métodos de design estrutural no ambiente acadêmico. A obra é reconhecida por sua abordagem estética e funcional, influenciando o futuro da arquitetura científica contemporânea.","link":"https://www.archdaily.com/pt/956144/praca-do-instituto-de-tecnologia-de-kanagawa-junya-ishigami-plus-associates/5ffbe20b63c017a5d60001f2-plaza-of-kanagawa-institute-of-technology-junya-ishigami-plus-associates-image","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"21财经","pais":"China","titulo":"21 Comentário: Consolidando a base técnica para o desenvolvimento de IA com foco em longo prazo","resumo":"Este artigo discute a importância de estratégias de longo prazo para fortalecer a infraestrutura de tecnologia e inteligência artificial na China. O texto enfatiza que o progresso sustentável depende de um alicerce técnico robusto e políticas de inovação consistentes. Essa visão visa garantir a competitividade do país no cenário global de inovação tecnológica digital.","link":"https://m.21jingji.com/article/20260725/53772c55d518e387e76c8858bdcf0d1a_zaker.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"中青在线","pais":"China","titulo":"Conferência Ministerial da APEC sobre IA adota a Declaração de Chengdu","resumo":"A reunião ministerial da APEC em Chengdu resultou na aprovação da Declaração de Chengdu, focada em cooperação digital e inteligência artificial. O documento estabelece diretrizes para a governança de dados e o desenvolvimento ético de tecnologias emergentes entre as economias membros. A iniciativa reflete o compromisso regional com um futuro digital integrado e seguro.","link":"http://news.cyol.com/gb/keji/articles/2026-07/26/content_enbl0aCBa2.html","categoria":"TRENDING TOPICS","lang":"pt"},{"fonte":"中国日报网","pais":"China","titulo":"Pesquisas indicam que americanos veem a China como líder em IA; especialistas elogiam abordagem inclusiva","resumo":"Uma recente pesquisa aponta que a percepção pública nos Estados Unidos reconhece a China como um líder proeminente no campo da inteligência artificial. Especialistas destacam que o modelo chinês busca fomentar o desenvolvimento global de IA sem deixar nenhum país para trás. O foco reside na cooperação internacional e na democratização dos benefícios tecnológicos.","link":"http://cn.chinadaily.com.cn/a/202607/26/WS6a65b151a310d709c2fbfb27.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"手机新浪网","pais":"China","titulo":"Análise profunda da economia digital da China em 2025: crescimento impulsionado por novas infraestruturas, IA e consumo","resumo":"O relatório analisa os motores de crescimento da economia digital chinesa para 2025, destacando a integração entre infraestrutura avançada e inteligência artificial. A estratégia visa estimular o consumo interno através da modernização tecnológica profunda. O estudo ressalta como essas mudanças estruturais estão redefinindo a capacidade produtiva nacional e o cenário do setor de serviços.","link":"https://k.sina.com.cn/article_7879923012_1d5ae154401903h2ps.html?from=tech","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"手机新浪网","pais":"China","titulo":"Avanços na tecnologia de interação multimodal para assistentes de voz com IA","resumo":"Pesquisadores chineses alcançaram avanços significativos na tecnologia de interação multimodal aplicada a assistentes de voz baseados em inteligência artificial. Essa inovação permite que sistemas processem informações de texto, áudio e imagem de forma simultânea e coesa. A evolução promete transformar a experiência do usuário em dispositivos inteligentes e assistentes virtuais de última geração.","link":"https://k.sina.com.cn/article_7879923054_1d5ae156e06801fgue.html?from=tech","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"手机新浪网","pais":"China","titulo":"Colega de Wei Dongyi conquista o 'Oscar da Ciência' e prêmio de 3 milhões de dólares","resumo":"Wang Hong, pesquisadora notável e colega de Wei Dongyi, foi laureada com um prestigioso prêmio internacional no valor de 3 milhões de dólares, frequentemente chamado de Oscar da Ciência. Sua conquista destaca o alto nível de excelência acadêmica e científica presente no ecossistema de pesquisa chinês. A notícia celebra sua contribuição fundamental em diálogos matemáticos complexos e avanços científicos globais.","link":"https://k.sina.com.cn/article_7879848924_1d5acf3dc01901jwwc.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"手机新浪网","pais":"China","titulo":"NVIDIA e SK Hynix estabelecem acordo de colaboração técnica de vários anos","resumo":"A NVIDIA formalizou uma parceria estratégica de longo prazo com a SK Hynix focada em inovação tecnológica para o mercado de chips. A cooperação visa acelerar o desenvolvimento de hardware de memória de alta largura de banda, essencial para as crescentes demandas de IA. Este acordo fortalece a cadeia de suprimentos global de tecnologia e impulsiona o desempenho de servidores de IA.","link":"https://k.sina.com.cn/article_7857201856_1d45362c001908fd0s.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"O GLOBO","pais":"China","titulo":"DeepSeek pausa rodada de investimentos após posts virais, diz agência","resumo":"A startup DeepSeek suspendeu temporariamente uma rodada de investimentos após uma série de postagens virais sobre sua tecnologia atrair atenção inesperada. A decisão reflete uma abordagem cautelosa para proteger a integridade estratégica da empresa em meio à rápida expansão. Analistas observam que este movimento sublinha a volatilidade e o alto interesse público no setor de IA chinesa.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/07/25/deepseek-pausa-rodada-de-investimentos-apos-posts-virais-diz-agencia.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The News Mill","pais":"Índia","titulo":"PM Modi elogia conquistas de estudantes indianos nas Olimpíadas de Ciência","resumo":"O primeiro-ministro Narendra Modi expressou orgulho pelo desempenho excepcional dos estudantes indianos em competições científicas internacionais. O reconhecimento destaca o crescente foco da Índia no fortalecimento da educação em áreas de ciência e tecnologia. Este feito reforça o papel do país como um celeiro de talentos promissores no cenário acadêmico global.","link":"https://thenewsmill.com/2026/07/pm-modi-praises-indian-students-success-at-international-science-olympiads/","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"The Indian Express","pais":"Índia","titulo":"Google confirma aumento de preço do Pixel 11 em meio à escassez global de RAM","resumo":"O Google oficializou um reajuste nos preços da linha Pixel 11, atribuindo a decisão à crise persistente no fornecimento de chips de memória RAM. A escassez global impacta diretamente os custos de produção de dispositivos móveis, refletindo no preço final para o consumidor indiano. A notícia sinaliza desafios contínuos na cadeia de suprimentos de tecnologia de consumo.","link":"https://indianexpress.com/article/technology/tech-news-technology/google-confirms-pixel-11-price-increase-amid-global-ram-shortage-10804124/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ANI News","pais":"Índia","titulo":"Adoção de IA transforma fluxos de trabalho e contratações em empresas de tecnologia","resumo":"Um novo relatório aponta como a inteligência artificial está remodelando as operações internas e as estratégias de contratação em empresas de tecnologia de alto crescimento. A automação exige novas competências dos profissionais, transformando a dinâmica do mercado de trabalho indiano. A tendência indica uma mudança profunda na busca por talentos especializados em IA.","link":"https://www.aninews.in/news/business/ai-adoption-reshapes-workflows-and-hiring-across-high-growth-technology-companies-report20260726101847","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"BusinessLine","pais":"Índia","titulo":"Tecnologia como facilitadora: Reimaginando a agrotecnologia indiana","resumo":"A integração de novas tecnologias está revolucionando o setor agrícola na Índia, promovendo maior eficiência e produtividade no campo. Ao adotar soluções digitais, a agrotecnologia local busca resolver gargalos históricos e modernizar a subsistência de milhares de agricultores. O foco está em transformar práticas tradicionais através da inovação tecnológica sustentável.","link":"https://www.thehindubusinessline.com/economy/agri-business/technology-as-an-enabler-reimagining-indian-agritech/article71265408.ece","categoria":"AGROTECNOLOGIA","lang":"pt"},{"fonte":"The New Indian Express","pais":"Índia","titulo":"IGCAR assina acordos de transferência de tecnologia para comercializar pesquisas nucleares","resumo":"O Centro de Pesquisa Atômica Indira Gandhi (IGCAR) firmou parcerias estratégicas para levar inovações nucleares ao mercado comercial. A iniciativa visa fortalecer startups de tecnologia profunda e impulsionar a aplicação prática de pesquisas científicas avançadas no país. O movimento marca um passo significativo na autonomia tecnológica e no fomento ao empreendedorismo científico.","link":"https://www.newindianexpress.com/states/tamil-nadu/2026/Jul/26/igcar-signs-technology-transfer-deals-to-commercialise-nuclear-research-boost-deep-tech-startups","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"BusinessLine","pais":"Índia","titulo":"Governo deve trabalhar em regulamentações adequadas para a tecnologia V2X: Montadoras","resumo":"Representantes da indústria automobilística na Índia solicitaram ao governo a criação de normas claras para a implementação da tecnologia V2X (Vehicle-to-Everything). A comunicação entre veículos e infraestrutura é vista como essencial para melhorar a segurança viária e o fluxo de tráfego inteligente. A regulamentação é considerada o próximo passo crucial para a mobilidade do futuro.","link":"https://www.thehindubusinessline.com/companies/government-has-to-work-on-right-regulations-for-v2x-technology-carmakers/article71266603.ece","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Harper's Bazaar India","pais":"Índia","titulo":"O que são espículas? A tecnologia de cuidados com a pele da K-beauty que todos comentam","resumo":"A tecnologia de espículas, originária da K-beauty, está ganhando tração no mercado indiano de cosméticos por sua promessa de rejuvenescimento eficaz. O método utiliza microestruturas bioabsorvíveis para facilitar a penetração de ingredientes ativos nas camadas mais profundas da derme. A tendência destaca o crescente interesse dos consumidores indianos por inovações tecnológicas avançadas em estética.","link":"https://www.harpersbazaar.in/beauty/story/what-are-spicules-the-k-beauty-skincare-technology-everyone-is-talking-about-1429220-2026-07-26","categoria":"TRENDING TOPICS","lang":"pt"},{"fonte":"The Economic Times","pais":"Índia","titulo":"Mapeando a economia global: Crescimento aumenta, boom da IA continua","resumo":"A economia global apresenta sinais de recuperação enquanto o setor de tecnologia continua impulsionado pelo avanço acelerado da inteligência artificial. O cenário favorece mercados emergentes como a Índia, que desempenha um papel central no fornecimento de soluções baseadas em IA. O otimismo cauteloso marca o atual momento de transição e inovação financeira.","link":"https://m.economictimes.com/small-biz/trade/exports/insights/charting-the-global-economy-growth-picks-up-ai-boom-continues/articleshow/132636339.cms","categoria":"ECONOMIA","lang":"pt"},{"fonte":"Notícias ao Minuto","pais":"Portugal","titulo":"Testamos o novo Renault Clio: condução clássica com tecnologia atual","resumo":"O novo Renault Clio combina a experiência de condução tradicional com as mais recentes inovações tecnológicas do mercado automotivo. A análise destaca como a montadora equilibrou a ergonomia clássica com sistemas digitais modernos, garantindo eficiência e conforto em um veículo que se mantém relevante para os motoristas atuais em Portugal.","link":"https://www.noticiasaominuto.com/auto/3026086/provamos-o-novo-renault-clio-conducao-a-antiga-com-tecnologia-atual","categoria":"TECNOLOGIA AUTOMOTIVA","lang":"pt"},{"fonte":"Imagens de Marca","pais":"Portugal","titulo":"EDP preparada para liderar o futuro com a eletrificação da economia","resumo":"A EDP posiciona-se como protagonista na transição energética, focando seus investimentos na eletrificação da economia portuguesa. Com estratégias voltadas para fontes renováveis e infraestruturas inteligentes, a empresa busca consolidar sua liderança e garantir a sustentabilidade energética frente aos desafios climáticos globais dos próximos anos.","link":"https://www.imagensdemarca.pt/artigo/edp-preparada-para-liderar-futuro-com-a-eletrificacao-da-economia/","categoria":"ENERGIA TECNOLOGIA","lang":"pt"},{"fonte":"Pplware","pais":"Portugal","titulo":"A partícula “Oh-My-God” continua a desafiar a ciência 245 mil anos depois","resumo":"Uma partícula de energia cósmica extremamente rara, apelidada de “Oh-My-God”, permanece como um dos maiores mistérios da física moderna. Cientistas continuam investigando sua origem e propriedades incomuns, que desafiam os modelos atuais de compreensão do universo e continuam a despertar interesse na comunidade científica global.","link":"https://pplware.sapo.pt/ciencia/o-misterio-da-particula-oh-my-god-viajou-durante-245-mil-anos-e-continua-a-desafiar-a-ciencia/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"oRegiões","pais":"Portugal","titulo":"Aeródromo Municipal de Castelo Branco escolhido para testar tecnologia aeroespacial","resumo":"O Aeródromo Municipal de Castelo Branco foi selecionado como local estratégico para o desenvolvimento e testes de novas tecnologias aeroespaciais. Esta escolha coloca a região no mapa da inovação tecnológica nacional, promovendo parcerias entre entidades públicas e empresas do setor em prol do avanço de soluções de ponta para a aviação.","link":"https://oregioes.pt/aerodromo-municipal-de-castelo-branco-escolhido-para-testar-tecnologia-aeroespacial/","categoria":"TECNOLOGIA AEROESPACIAL","lang":"pt"},{"fonte":"Marketeer","pais":"Portugal","titulo":"A tecnologia portuguesa que sobrevoa os céus nos aviões comerciais da Airbus","resumo":"Empresas portuguesas estão a fornecer componentes tecnológicos críticos para as aeronaves comerciais da Airbus, destacando a competência nacional no setor aeroespacial. O impacto desta colaboração reafirma Portugal como um hub de engenharia qualificada, capaz de exportar inovação para gigantes globais da aviação mundial.","link":"https://marketeer.sapo.pt/a-tecnologia-portuguesa-que-sobrevoa-os-ceus-nos-avioes-comerciais-da-airbus/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Rádio Clube da Covilhã","pais":"Portugal","titulo":"UBI apresenta proposta sobre ciência, território e inovação no Encontro Ciência e Inovação 2026","resumo":"A Universidade da Beira Interior (UBI) destacou-se no evento Ciência e Inovação 2026 ao apresentar estudos focados na sinergia entre o desenvolvimento regional e a produção científica. A proposta visa integrar o conhecimento acadêmico com a realidade do território, promovendo soluções inovadoras para os desafios socioeconômicos atuais.","link":"https://radio-covilha.pt/2026/07/noticias/ubi-apresenta-proposta-sobre-ciencia-territorio-e-inovacao-no-encontro-ciencia-e-inovacao-2026/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Diário Digital Castelo Branco","pais":"Portugal","titulo":"Castelo Branco: Skylab testa tecnologia aeroespacial no Aeródromo Municipal","resumo":"A Skylab iniciou uma série de testes operacionais no Aeródromo Municipal de Castelo Branco focados em novas soluções aeroespaciais. A iniciativa reforça a importância de infraestruturas locais para o fomento de startups de alta tecnologia e demonstra a viabilidade do país para receber ensaios técnicos de complexidade elevada.","link":"https://www.diariodigitalcastelobranco.pt/noticia/72303/castelo-branco-skylab-testa-tecnologia-aeroespacial-no-aerodromo-municipal","categoria":"TECNOLOGIA AEROESPACIAL","lang":"pt"},{"fonte":"AICEP","pais":"Portugal","titulo":"Portugal quer transformar a ciência do mar em negócio","resumo":"O governo português tem priorizado a exploração sustentável dos recursos oceânicos, procurando converter a investigação científica marinha em oportunidades comerciais lucrativas. Através da economia azul, o país pretende atrair investimentos para biotecnologia e energias marinhas, criando um novo motor de crescimento baseado em dados e sustentabilidade.","link":"https://portugalglobal.pt/noticias/2026/julho/portugal-quer-transformar-ciencia-do-mar-em-negocio/","categoria":"CIÊNCIA NEGÓCIOS","lang":"pt"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Airlines now use AI to solve ground bottlenecks and define passenger benefits","resumo":"The airline industry has been adopting artificial intelligence to optimize complex ground operations and personalize the traveler experience. The technology helps manage logistical bottlenecks, increasing operational efficiency and improving the offer of specific benefits. This innovation is redefining service standards by raising the precision of customer care.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/07/26/companhias-aereas-ja-usam-ia-para-resolver-gargalos-em-solo-e-definir-beneficios-a-passageiros.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Geraldo Ramos: entrepreneur combined music and technology to create the Moises AI app, which has over 75 million users","resumo":"The Moises AI platform, created by Geraldo Ramos, has revolutionized music production by allowing the separation of audio tracks via artificial intelligence. With over 75 million users, the app has democratized professional studio tools for amateurs and global producers alike. The success of the initiative exemplifies how technological innovation can transform human creativity.","link":"https://oglobo.globo.com/101-brasileiros/noticia/2026/07/26/geraldo-ramos-empresario-uniu-musica-e-tecnologia-na-criacao-do-app-moises-ai-que-tem-mais-de-75-milhoes-de-usuarios.ghtml","categoria":"INNOVATION","lang":"en"},{"fonte":"Vietnam.vn","pais":"Brazil","titulo":"What is the human lifespan limit? Science has already found out.","resumo":"Recent scientific studies have mapped the biological limits of human longevity, considering genetic and environmental factors. Research explores how cellular aging acts as a physical barrier that defines the maximum duration of life. These findings open deep debates about regenerative medicine and the future of healthcare for the elderly.","link":"https://www.vietnam.vn/pt/con-nguoi-co-the-song-toi-bao-nhieu-tuoi-khoa-hoc-da-tim-ra-gioi-han","categoria":"SCIENCE","lang":"en"},{"fonte":"UOL","pais":"Brazil","titulo":"Brasileirão sees first goal with new offside technology; watch","resumo":"The Brazilian Championship has successfully implemented a semi-automated offside system in official matches, ensuring greater refereeing precision. The technology uses advanced cameras to track player positioning in milliseconds, reducing human error margins. This milestone represents a significant advancement in the application of sports technology in the country.","link":"https://www.uol.com.br/esporte/futebol/ultimas-noticias/2026/07/25/brasileirao-tem-primeiro-gol-com-nova-tecnologia-de-impedimento-veja.ghtm","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"CNN Brasil","pais":"Brazil","titulo":"Understand the TSE's rules for AI-generated videos and images in elections","resumo":"The Superior Electoral Court (TSE) has established strict guidelines for the use of artificial intelligence during the Brazilian electoral process. New regulations aim to combat misinformation and ensure transparency in digital political advertising. The goal is to protect the integrity of the vote and mitigate risks associated with the misuse of synthetic content.","link":"https://www.cnnbrasil.com.br/eleicoes/entenda-as-regras-do-tse-para-videos-e-imagens-com-ia-nas-eleicoes/","categoria":"TRENDING TOPICS","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"8,000 new insect species identified via DNA in Ecuador","resumo":"Scientists have achieved a monumental breakthrough in entomology by identifying thousands of new insect species using modern DNA sequencing techniques. The study reveals previously unknown biodiversity, highlighting the importance of genetics in environmental preservation. These discoveries drastically expand our knowledge of tropical fauna and local ecosystems.","link":"https://www1.folha.uol.com.br/ciencia/2026/07/8000-novas-especies-de-insetos-sao-identificadas-por-meio-do-dna-no-equador.shtml","categoria":"SCIENCE","lang":"en"},{"fonte":"Exame","pais":"Brazil","titulo":"Migraine is not just a headache: science explains what happens in the brain","resumo":"New neurological research elucidates that migraine is a complex disorder involving neurochemical and vascular changes in the brain. Science demonstrates that these episodes are not limited to pain, affecting specific cognitive and sensory areas. A deep understanding of these manifestations is essential for developing more effective and targeted patient treatments.","link":"https://exame.com/ciencia/enxaqueca-nao-e-so-uma-dor-de-cabeca-ciencia-explica-o-que-acontece-no-cerebro/","categoria":"SCIENCE","lang":"en"},{"fonte":"AEROIN","pais":"Brazil","titulo":"Understanding Digital Twin and how this technology has transformed modern airport operations","resumo":"Digital Twin technology is creating virtual copies of airport infrastructure to simulate operational scenarios in real time. This approach allows for the prediction of failures, optimization of traffic flows, and reduction of logistical costs before any physical intervention. The concept emerges as an essential solution for the modernization and efficiency of global airports.","link":"https://aeroin.net/conhecendo-a-digital-twin-e-como-esta-tecnologia-tem-transformado-as-operacoes-aeroportuarias-modernas/?amp=1","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The New York Times","pais":"United States","titulo":"4 prompts that can reveal what chatbots actually know about you","resumo":"This article explores 'prompting' techniques for users to investigate what personal data has been absorbed and is stored by artificial intelligences. The practice aims to increase transparency regarding user privacy in light of the growing ubiquity of language models. The impact reflects a global concern about data security and the ethics of using these tools.","link":"https://www.nytimes.com/es/2026/07/26/espanol/negocios/chatbot-preguntas-informacion-personal.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Hobby Consolas","pais":"United States","titulo":"Apple TV premieres the first trailer for Neuromancer, its highly anticipated cyberpunk sci-fi series","resumo":"Apple TV has revealed the first look at the television adaptation of Neuromancer, one of the most influential works in the cyberpunk genre. The production promises to deliver immersive technological visuals, raising expectations among science fiction fans worldwide. The release highlights the platform's heavy investment in high-impact visual and narrative content.","link":"https://www.hobbyconsolas.com/hobbycine/apple-tv-estrena-primer-trailer-neuromante-su-esperada-serie-ciencia-ficcion-cyberpunk_7018992_0.html","categoria":"ENTERTAINMENT","lang":"en"},{"fonte":"BBC","pais":"United States","titulo":"NASA Chief praises the rise of women in science","resumo":"The NASA administrator highlighted the fundamental role of women in the advancement of recent scientific research and space missions. This recognition reinforces the agency's commitment to promoting gender equity within technical environments. This movement is seen as an important milestone for inspiring new generations to pursue careers in science and engineering.","link":"https://www.bbc.co.uk/news/articles/c62vq0pg6yvo","categoria":"SCIENCE","lang":"en"},{"fonte":"Vietnam.vn","pais":"United States","titulo":"Tech giants' market capitalization evaporated by more than 500 billion dollars in a week.","resumo":"The financial market saw a sharp downturn resulting in the loss of 500 billion dollars in market value from major technology companies. This volatility reflects investors' re-evaluation of the sector's growth expectations. The direct impact is felt in the global economy, sounding an alarm for future investments in the tech sector.","link":"https://www.vietnam.vn/pt/von-hoa-cac-ong-lon-cong-nghe-boc-hoi-hon-500-ty-usd-trong-mot-tuan","categoria":"BUSINESS","lang":"en"},{"fonte":"Época Negócios","pais":"United States","titulo":"Tech companies cut 140,000 jobs in the US amidst the billion-dollar AI race","resumo":"The US tech sector is facing a massive wave of layoffs, totaling 140,000 cuts this year as financial focus shifts to artificial intelligence. This strategic restructuring demonstrates a prioritization of automation and efficiency over maintaining large headcounts. The trend is redefining the labor market landscape for tech professionals.","link":"https://epocanegocios.globo.com/google/amp/futuro-do-trabalho/noticia/2026/07/empresas-de-tecnologia-eliminam-140-mil-empregos-nos-eua-em-meio-a-corrida-bilionaria-pela-ia.ghtml","categoria":"BUSINESS","lang":"en"},{"fonte":"O GLOBO","pais":"United States","titulo":"Meta launches app for Facebook Marketplace sellers","resumo":"Meta has introduced a new tool specifically designed to optimize the experience for sellers on Facebook Marketplace. The app aims to simplify inventory management and communication with buyers, with the goal of increasing transaction volume on the platform. The initiative reflects the company's focus on strengthening its integrated digital commerce ecosystem.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/07/25/meta-lanca-aplicativo-para-vendedores-do-facebook-marketplace.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Forbes","pais":"United States","titulo":"Trinnov and Ascendo unveil groundbreaking new bass technology for home cinema","resumo":"Companies Trinnov and Ascendo have announced a significant breakthrough in home cinema audio systems, promising a superior low-frequency sound experience. This technological innovation aims to redefine home audio quality standards, competing directly with the experience of professional movie theaters. The product targets the premium entertainment market and high-fidelity enthusiasts.","link":"https://www.forbes.com/sites/johnarcher/2026/07/25/trinnov-and-ascendo-unveil-ground-breaking-new-home-cinema-bass-technology/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Fortune","pais":"United States","titulo":"Inside On’s tech lab, where robots build running shoes i ical procedures, allowing for faster and less invasive recoveries. However, the high cost of the equipment limits its full implementation in public health systems. The debate over the democratization of this innovation remains central in modern medicine.","link":"https://www.elperiodicoextremadura.com/extremadura/2026/07/26/cirugia-robotica-tecnologia-aun-no-alcance-todos-132814786.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"EL PAÍS","pais":"Spain","titulo":"When the AI lion escapes the cage","resumo":"The unbridled advancement of artificial intelligence is raising global concerns regarding safety and ethical boundaries in the development of autonomous systems. Experts warn of the need for rigorous regulation to prevent unforeseen societal impacts. The central theme is how to control the transformative potential of these new digital tools.","link":"https://elpais.com/tecnologia/2026-07-26/cuando-el-leon-de-la-ia-se-escapa-de-la-jaula.html","categoria":"TRENDING TOPICS","lang":"en"},{"fonte":"elblogoferoz.com","pais":"Spain","titulo":"BUSINESS | GF Hoteles combines AI and circular economy to achieve 'Zero Waste'","resumo":"GF Hoteles has implemented artificial intelligence to optimize its food management and eliminate waste in its operations. By integrating technology and a circular economy, the company is setting a new standard for the hospitality sector in Spain. This initiative demonstrates the practical viability of digital sustainability.","link":"https://www.elblogoferoz.com/2026/07/26/empresas-gf-hoteles-une-ia-y-economia-circular-y-alcanza-el-desperdicio-cero/","categoria":"BUSINESS","lang":"en"},{"fonte":"ABC","pais":"Spain","titulo":"High-flying technology to mitigate wind energy impact on birdlife","resumo":"New monitoring technologies are being deployed at wind farms in Spain to protect birds and prevent collisions. Advanced sensors and automatic detection systems help harmonize renewable energy generation with biodiversity conservation, serving el seeks to foster global AI development without leaving any country behind. The focus lies on international cooperation and the democratization of technological benefits.","link":"http://cn.chinadaily.com.cn/a/202607/26/WS6a65b151a310d709c2fbfb27.html","categoria":"SCIENCE","lang":"en"},{"fonte":"手机新浪网","pais":"China","titulo":"In-depth analysis of China's digital economy in 2025: Growth driven by new infrastructure, AI, and consumption","resumo":"The report analyzes the growth engines of the Chinese digital economy for 2025, highlighting the integration of advanced infrastructure and artificial intelligence. The strategy aims to stimulate domestic consumption through deep technological modernization. The study underscores how these structural changes are redefining national productive capacity and the service sector landscape.","link":"https://k.sina.com.cn/article_7879923012_1d5ae154401903h2ps.html?from=tech","categoria":"BUSINESS","lang":"en"},{"fonte":"手机新浪网","pais":"China","titulo":"Advances in multimodal interaction technology for AI voice assistants","resumo":"Chinese researchers have achieved significant breakthroughs in multimodal interaction technology applied to AI-based voice assistants. This innovation allows systems to process text, audio, and image information simultaneously and cohesively. The evolution promises to transform the user experience in smart devices and next-generation virtual assistants.","link":"https://k.sina.com.cn/article_7879923054_1d5ae156e06801fgue.html?from=tech","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"手机新浪网","pais":"China","titulo":"Colleague of Wei Dongyi wins the 'Science Oscar' and a 3-million-dollar prize","resumo":"Wang Hong, a noted researcher and colleague of Wei Dongyi, has been awarded a prestigious international prize worth 3 million dollars, often referred to as the Science Oscar. Her achievement highlights the high level of academic and scientific excellence present in the Chinese research ecosystem. The new   const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Utility de escape HTML simples para prevenir injections em propriedades sem tratamento
  function esc(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(item.link)}" target="_blank" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render
</script>
