f new technologies.","link":"https://www.eleconomista.es/mercados-cotizaciones/noticias/14003186/07/26/los-aranceles-frenan-el-comercio-no-la-innovacion-china.html","categoria":"TRENDS","lang":"en"},{"fonte":"La Vanguardia","pais":"Spain","titulo":"Artificial intelligence prevents microscopes from damaging living cells","resumo":"A new artificial intelligence application reduces the light intensity needed in microscopic examinations.\nExcessive illumination usually causes phototoxicity and degrades live biological cell samples during analysis.\nWith AI predicting and reconstructing high-resolution images, scientists can observe cellular processes for longer periods.\nThe breakthrough opens doors for more precise discoveries in cell biology and drug development.","link":"https://www.lavanguardia.com/ciencia/20260727/11599648/inteligencia-artificial-evitar-microscopios-danen-celulas-vivas.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"DW.com","pais":"Germany","titulo":"Energy Transition Generates Conflicts and Social Challenges in Germany","resumo":"Germany's energy transition is facing growing social and political tensions due to costs and the pace of implementing decarbonization measures.\nThe industrial sector and the general public express ongoing concern regarding electricity supply stability and rising prices.\nThe government seeks to balance rigorous environmental commitments with the preservation of the country's economic competitiveness.\nThis deadlock highlights the complexity and practical challenges of radically transforming a global power's energy matrix.","link":"https://www.dw.com/pt-br/transi%C3%A7%C3%A3o-energ%C3%A9tica-gera-conflitos-na-alemanha/video-78084155","categoria":"ENERGY","lang":"en"},{"fonte":"Forbes JAPAN","pais":"Japan","titulo":"Physical AI and the Restructuring of the Materials Economy to Solve the '93% Problem'","resumo":"The advancement of physical artificial intelligence is transforming industry by applying predictive models to materials science.\nThe approach aims to overcome the challenge known as the '93% problem,' where the majority of physical world data remains inaccessible to digital processing.\nWith this evolution, experts project a profound overhaul in production efficiency and the lifecycle of industrial materials.","link":"https://forbesjapan.com/articles/detail/101741","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"u-tokyo.ac.jp","pais":"Japan","titulo":"Study Reveals Gut Flora Extracellular Vesicles Modulate Immune Response to COVID-19","resumo":"Japanese researchers have identified that extracellular vesicles derived from intestinal bacteria play a critical role in regulating the human immune system.\nThe discovery demonstrates how these components directly affect the intensity of immune responses during a COVID-19 infection.\nThe scientific breakthrough opens new possibilities for developing preventive therapies and targeted treatments via the microbiome.","link":"https://www.u-tokyo.ac.jp/focus/ja/press/z0406_00014.html","categoria":"SCIENCE","lang":"en"},{"fonte":"日经中文网","pais":"Japan","titulo":"Honda to Utilize Nissan's Operating System to Develop New Vehicles in Partnership","resumo":"In an unprecedented strategic alliance, Honda will adopt Nissan's vehicular operating system and technologies in developing its upcoming cars.\nThe collaboration aims to accelerate the digital transformation of Japanese automakers and reduce substantial research and development costs in software.\nThe union reflects growing pressure on the traditional automotive industry to rival global giants in electric and connected vehicles.","link":"https://cn.nikkei.com/industry/icar/63379-2026-07-27-09-24-41.html","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Bridgestone Develops Technology to Extract Raw Materials from Used Tires for New Products","resumo":"Bridgestone has introduced an innovative technology capable of recovering high-purity materials from discarded tires for the manufacturing of new components.\nThe chemical recycling process contributes significantly to reducing dependence on virgin raw materials and lowering industrial carbon footprints.\nThe initiative strengthens the transition to a circular economy in the automotive sector and sets a new standard for rubber waste management.","link":"https://news.yahoo.co.jp/articles/92db38d71ecf653ff5ac7d4bd2c43b6f715eb4a8","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Kagoshima University Develops Smart Platform for Fishing Ground Forecasting","resumo":"Kagoshima University, in partnership with the local government, has launched a fishing zone forecasting website focused on the concept of 'smart fishing.'\nUsing ocean data analysis and advanced algorithms, the system optimizes vessel routes and increases the capture efficiency of marine species.\nThe technology is estimated to generate an annual economic impact exceeding 130 million yen in the juvenile fish sector alone.","link":"https://news.yahoo.co.jp/articles/ce9e77bd37c4e8d09b09b42e8b9cd4a064ad65d0?source=rss","categoria":"INNOVATION","lang":"en"},{"fonte":"srigroup.co.jp","pais":"Japan","titulo":"Isuzu Expands Use of 'Sensing Core' Software to Detect Signs of Wheel Detachment in Buses","resumo":"Isuzu has announced the expansion of its 'Sensing Core' software technology across its new fleets of city and executive transport buses.\nThe system analyzes wheel rotation data without the need for additional sensors, identifying early signs of loosening wheels.\nThe solution substantially raises public transport safety standards and prevents severe accidents on highways and urban roads.","link":"https://www.srigroup.co.jp/newsrelease/2026/sri/2026_075.html","categoria":"SAFETY","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"NTT Data Internally Tests Microsoft 365 Copilot Cowork for Sales Automation","resumo":"NTT Data Intellilink has initiated practical tests with Microsoft 365 Copilot Cowork to optimize the administrative routines of its sales team.\nThe project aims to measure the real impact of the artificial intelligence assistant in reducing time spent on repetitive sales tasks.\nThe data obtained will serve as a validation basis to implement AI automation on a large scale for the company's clients.","link":"https://prtimes.jp/main/html/rd/p/000000048.000042493.html","categoria":"BUSINESS","lang":"en"},{"fonte":"GIGAZINE","pais":"Japan","titulo":"X Platform and Music Publishers End Copyright Dispute with Three-Year Agreement","resumo":"Social network X and major United States music publishers have reached a commercial agreement ending a three-year legal dispute.\nThe lawsuit involved allegations of massive copyright infringement regarding musical tracks used without a license by users on the platform.\nThe resolution establishes new rules for the use of protected content and brings legal stability to the company's operations in the media sector.","link":"https://gigazine.net/news/20260727-x-music-copyright/","categoria":"TRENDS","lang":"en"},{"fonte":"O GLOBO","pais":"China","titulo":"China Plans to Create Herd of Over 100 Cloned Yaks by 2028","resumo":"Chinese scientists have announced an ambitious project to clone more than a hundred yaks by 2028.\nThe initiative aims to preserve the genetic diversity of the species and improve production on the Tibetan Plateau.\nUsing somatic cell nuclear transfer, the project ensures more resistant and healthy herds.\nThe breakthrough represents a significant milestone in the large-scale application of agricultural biotechnology in China.","link":"https://oglobo.globo.com/saude/ciencia/noticia/2026/07/27/china-quer-criar-rebanho-com-mais-de-100-iaques-clonados-ate-2028-entenda.ghtml","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"O GLOBO","pais":"China","titulo":"Chip Manufacturer Soars in Shanghai Stock Exchange Debut and Reaches Record Value","resumo":"The stock market debut of a Chinese semiconductor giant resulted in record-breaking valuation.\nThe movement was driven by state support and the country's pursuit of self-sufficiency in the microchip sector.\nThe million-dollar fundraising aims to mitigate international sanctions and strengthen the hardware supply chain.\nThe meteoric rise consolidates the semiconductor sector as the central engine of the country's digital economy.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/07/27/fabricante-de-chips-dispara-em-estreia-na-bolsa-e-se-torna-empresa-mais-valiosa-da-china.ghtml","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"Tribuna do Sertão","pais":"China","titulo":"Russian and Chinese Physicists Develop Innovative Technology for Molecular Photography","resumo":"Physicists from Russia and China have developed an innovative high-resolution molecular imaging method.\nThe new technology allows for the visualization of chemical processes in real time at the atomic level with unprecedented precision.\nThis discovery paves the way for advancements in the development of new drugs and advanced materials.\nThe project reinforces growing scientific cooperation between the two nations at the frontier of applied physics.","link":"https://www.tribunadosertao.com.br/esportes/2026/07/26/947220-fisicos-russos-e-chineses-desenvolvem-tecnologia-inovadora-para-fotografia-molecular","categoria":"SCIENCE","lang":"en"},{"fonte":"湖北省经济和信息化厅","pais":"China","titulo":"Hubei Province Leads 6G Technology Development with Five Major Advantages","resumo":"China's Hubei province has established a strategy to lead the research and deployment of 6G networks.\nThe region highlights its cutting-edge technological infrastructure, innovation hubs, and strong scientific talent base.\nThe initiative seeks to integrate artificial intelligence and quantum connectivity into the next generation of communications.\nThe project reinforces China's national goals of defining new global telecommunications standards.","link":"http://jxt.hubei.gov.cn/bmdt/jxtyw/202607/t20260727_5983867.shtml","categoria":"TELECOMMUNICATIONS","lang":"en"},{"fonte":"China Daily","pais":"China","titulo":"Artificial General Intelligence Is Set to Redefine High-Tech Services","resumo":"Advancements in Artificial General Intelligence are reshaping engineering and software services in China.\nTechnology companies are integrating autonomous models to optimize complex analytical and operational processes.\nThis high-level automation promises to drastically reduce costs and increase industrial productivity.\nThe transition to AGI-based ecosystems is seen as a watershed moment for global competitiveness.","link":"https://www.chinadaily.com.cn/a/202607/27/WS6a66b347a310986e2b46766d.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"东方财富","pais":"China","titulo":"Reusable Space Technology Reduces Costs and Boosts Commercial Sector in China","resumo":"The adoption of reusable rocket technologies is transforming China's commercial space industry.\nThe innovation significantly reduces launch costs per kilogram of payload sent to Earth orbit.\nExperts point out that the breakthrough will allow for the rapid expansion of megaconstellations of satellites in the country.\nThe progress consolidates the competitiveness of China's private aerospace ecosystem on a global scale.","link":"https://wap.eastmoney.com/a/202607273821331122.html","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"央视网","pais":"China","titulo":"World's First Zero-Carbon Technology Airport Implemented in China","resumo":"After twenty years of research, China has implemented the technology for the first zero-carbon airport in Ordos.\nThe project combines solar energy microgrids, carbon capture systems, and predictive management via artificial intelligence.\nThe solution completely eliminates net greenhouse gas emissions resulting from ground operations.\nThe achievement establishes a historic milestone and a new sustainable model for global airport infrastructure.","link":"https://local.cctv.com/2026/07/27/ARTIEYkeVPka3rJdtW5AJJOf260727.shtml","categoria":"CLEAN ENERGY","lang":"en"},{"fonte":"观点网","pais":"China","titulo":"Xiaomi Announces Pengcheng Ecosystem Event and Unveils New Electric Vehicle Model","resumo":"Xiaomi has announced its technology event focused on integrating devices with electric vehicles.\nDuring the occasion, the manufacturer showcased innovations in the Pengcheng ecosystem and the new version of the N90 Max electric SUV.\nThe model brings advanced autonomous driving technologies and next-generation smart connectivity.\nThe initiative reinforces the brand's strategy to lead the merger between electromobility and consumer electronics.","link":"https://www.guandian.cn/article/20260727/577189.html","categoria":"LAUNCH","lang":"en"},{"fonte":"DT Next","pais":"India","titulo":"IIT Madras Develops Advanced Cooling Technology for Compact Electronics and Defense Systems","resumo":"Researchers at the Indian Institute of Technology Madras have created an innovative thermal cooling system designed for high-density electronics.\nThe solution addresses overheating challenges in compact devices and critical national defense equipment.\nThe technology promises to increase operational efficiency and significantly extend the lifespan of advanced electronic components.","link":"https://www.dtnext.in/news/chennai/iit-madras-develops-advanced-cooling-technology-for-compact-electronics-defence-systems","categoria":"SCIENCE","lang":"en"},{"fonte":"BusinessLine","pais":"India","titulo":"Tata Steel's EASyMelt Technology Aims to Halve Coke Use in Blast Furnaces","resumo":"Tata Steel is implementing the pioneering EASyMelt technology to transform the steelmaking process in India.\nThe innovative system seeks to cut coke consumption in half, drastically reducing carbon emissions in the industrial sector.\nThe initiative represents a fundamental step toward decarbonizing steel production and adopting cleaner practices in the country.","link":"https://www.thehindubusinessline.com/business-tech/tata-steels-easymelt-technology-aims-to-halve-coke-use-in-blast-furnaces/article71270482.ece","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"Prime Minister Modi Announces Task Force Led by Nandan Nilekani to Reform Exams with Technology","resumo":"The Indian government has constituted a high-level committee under the leadership of technology expert Nandan Nilekani.\nThe group aims to restructure national examination processes, integrating biosecurity, artificial intelligence, and regulatory reforms.\nThe measure seeks to prevent exam paper leaks and ensure total transparency and integrity in public tests across the country.","link":"https://newsonair.gov.in/pm-modi-announces-task-force-on-examination-reforms-reaffirms-commitment-to-transparent-exam/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Saur Energy","pais":"India","titulo":"Why Back-Contact (BC) Technology Is Driving Next-Gen Solar Cars","resumo":"Back-Contact (BC) solar cell technology is revolutionizing the design and efficiency of solar-powered electric vehicles.\nBy moving electrical contacts to the rear of the panels, sunlight capture is maximized on the surface of the automobiles.\nThis innovation extends the driving range of clean vehicles and positions photovoltaic technology at the forefront of sustainable mobility.","link":"https://www.saurenergy.com/solar-energy-news/why-back-contact-bc-technology-is-powering-the-next-gen-solar-cars-12200639","categoria":"CLEAN ENERGY","lang":"en"},{"fonte":"HR News","pais":"India","titulo":"HCLTech to Create 5,000 Jobs with New Global Technology Center in Odisha","resumo":"IT services giant HCLTech has announced the expansion of its operations in the state of Odisha with a new tech hub.\nThe project forecasts the creation of more than 5,000 skilled jobs focused on digital transformation and software development.\nThe initiative strengthens the region's innovation ecosystem and attracts strategic investments in the information technology sector.","link":"https://www.peoplematters.in/amp/news/recruiting-and-onboarding/hcltech-to-create-5000-jobs-with-new-global-technology-centre-in-odisha-51062","categoria":"BUSINESS","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"Dreame D30 Ultra robot vacuum launched in India with 25,000Pa suction and MopExtend technology","resumo":"Dreame Technology has officially launched its high-end D30 Ultra robot vacuum in the Indian market for 52,999 rupees.\nThe device stands out for its impressive 25,000Pa suction power and the MopExtend RoboSwing system for deep corner cleaning.\nThis new release boosts smart home automation in the country, offering advanced sensors and intelligent mapping to consumers.","link":"https://www.moneycontrol.com/technology/dreame-d30-ultra-robot-vacuum-launched-with-25-000pa-suction-and-mopextend-mopping-technology-at-rs-52-999-article-13984509.html","categoria":"LAUNCH","lang":"en"},{"fonte":"Careers360","pais":"India","titulo":"IIT Delhi launches online certificate course in Applied Data Science and Artificial Intelligence","resumo":"The renowned IIT Delhi has opened applications for an executive program focused on Applied Data Science and Artificial Intelligence.\nAiming at students and working professionals, the course covers machine learning, predictive analytics, and practical tools.\nThe qualification seeks to meet the growing demand for specialized talent within the technology and data analytics ecosystem.","link":"https://news.careers360.com/iit-delhi-launches-online-certificate-course-applied-data-science-ai-students-working-professionals-graduates-diploma-holders-cep","categoria":"EDUCATION","lang":"en"},{"fonte":"ET CIO","pais":"India","titulo":"AI adoption reshapes workflows and hiring across high-growth technology companies","resumo":"The accelerated integration of Artificial Intelligence tools is transforming the operational routine of technology companies.\nFast-growing organizations are restructuring teams and prioritizing professionals with proven automation skills.\nThis shift redefines hiring criteria and demands continuous upskilling in the innovation sector's job market.","link":"https://cio.economictimes.indiatimes.com/news/artificial-intelligence/ai-adoption-reshapes-workflows-and-hiring-across-high-growth-technology-companies/132651720?utm_source=portal_category_widget\u0026utm_medium=homepage","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Rádio Castrense","pais":"Portugal","titulo":"IPBeja Ph.D. in Sports Science attracts 71 applicants and sells out openings in the first phase","resumo":"The Polytechnic Institute of Beja registered record demand for the first edition of its Ph.D. program in Sports Science, filling all available spots right in the initial phase. The high volume of 71 applications reflects growing academic and scientific interest in improving elite athletic performance and health. The initiative strengthens applied research in the region and positions the institution as an emerging hub of scientific innovation in the field.","link":"https://radiocastrense.pt/doutoramento-em-ciencias-do-desporto-do-ipbeja-atrai-71-candidatos-e-esgota-vagas-na-primeira-fase/","categoria":"SCIENCE","lang":"en"},{"fonte":"Marketeer","pais":"Portugal","titulo":"Technology at the service of deliveries: the new competitive advantage of Portuguese e-commerce","resumo":"The e-commerce sector in Portugal is undergoing a transformation driven by advanced technological solutions aimed at logistics and delivery management. The adoption of artificial intelligence, real-time tracking, and process automation seeks to optimize operational costs and raise consumer satisfaction. This modernization has consolidated logistics efficiency as an essential strategic differentiator for corporate competitiveness in the digital market.","link":"https://marketeer.sapo.pt/tecnologia-ao-servico-das-entregas-a-nova-vantagem-competitiva-do-e%E2%80%91commerce-portugues/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"arte sonora","pais":"Portugal","titulo":"Beam Solo: Blackstar and TONE3000 introduce Neural Amp Modeler technology for the first time in a headphone amplifier","resumo":"The partnership between Blackstar and TONE3000 resulted in the launch of the Beam Solo, the first headphone amplifier to incorporate Neural Amp Modeler technology. The device uses advanced neural networks to simulate the behavior and sound of real amplifiers and pedals with extreme precision. The novelty represents a major milestone in the music technology market, democratizing access to high-fidelity sound modeling for musicians and producers.","link":"https://artesonora.pt/beam-solo-blackstar-e-tone3000-introduzem-tecnologia-neural-amp-modeler-pela-primeira-vez-num-amplificador-de-auscultadores/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Pplware","pais":"Portugal","titulo":"Portugal could see up to 27,000 deaths in a major earthquake; science explains the numbers","resumo":"Recent scientific studies and geological simulations indicate that a major earthquake in Portugal could cause up to 27,000 fatalities nationwide. Researchers use advanced seismological models to warn about the urgency of prevention plans and the structural reinforcement of vulnerable buildings. The analysis highlights the importance of science in risk management and in preparing cities against potential natural disasters.","link":"https://pplware.sapo.pt/informacao/portugal-podera-ter-ate-27-mil-mortos-num-grande-sismo-a-ciencia-explica-os-numeros/","categoria":"SCIENCE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/\.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
