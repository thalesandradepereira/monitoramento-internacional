  // Injeta os dados originais no frontend
  const data = [{"fonte":"O GLOBO","pais":"Brasil","titulo":"Como ativar no Android o filtro que bloqueia chamadas de spam automaticamente","resumo":"O sistema operacional Android conta com recursos nativos capazes de identificar e bloquear chamadas indesejadas de forma automática.\nA ferramenta analisa números desconhecidos e reduz significativamente o incômodo causado por telemarketing e tentativas de golpe.\nA ativação simples pelo aplicativo de telefone garante mais privacidade e segurança diária aos usuários de smartphones.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/07/27/como-ativar-no-android-filtro-que-bloqueia-chamadas-de-spam-automaticamente.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Cortes no orçamento do Banco Central ameaçam segurança e inovação do Pix","resumo":"A restrição orçamentária enfrentada pelo Banco Central do Brasil pode comprometer diretamente a sustentabilidade e a evolução do Pix.\nEspecialistas alertam que a falta de investimentos coloca em risco a infraestrutura de segurança cibernética e adia o lançamento de novas funcionalidades.\nO cenário gera preocupação no setor financeiro quanto à estabilidade das transações instantâneas no país.","link":"https://www1.folha.uol.com.br/mercado/2026/07/cortes-no-orcamento-do-bc-ameacam-seguranca-e-inovacao-do-pix.shtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Vale do Silício se divide sobre o fechamento de fronteiras para a IA chinesa","resumo":"Líderes e empresas do Vale do Silício enfrentam um intenso debate sobre a restrição ao acesso e colaboração com tecnologias de inteligência artificial da China.\nEnquanto uma ala defende o bloqueio rigoroso alegando segurança nacional, outros argumentam que o isolamento prejudica a inovação global.\nO impasse reflete as crescentes tensões geopolíticas entre as duas potências tecnológicas no setor de IA.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/07/26/vale-do-silicio-se-divide-sobre-o-fechamento-das-fronteiras-para-a-ia-chinesa.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Folha de S.Paulo","pais":"Brasil","titulo":"Empresas de tecnologia dos EUA cortam 140 mil empregos apesar de gastos com IA","resumo":"Grandes corporações de tecnologia nos Estados Unidos já demitiram mais de 140 mil trabalhadores este ano para reestruturar suas operações.\nCuriosamente, essa onda de demissões ocorre em paralelo a investimentos bilionários no desenvolvimento de inteligência artificial.\nO movimento evidencia uma reorientação estratégica profunda do setor tech em direção ao automatismo.","link":"https://www1.folha.uol.com.br/mercado/2026/07/grupos-de-tecnologia-dos-eua-cortam-140-mil-empregos-apesar-do-aumento-nos-gastos-com-ia.shtml","categoria":"MERCADO TECH","lang":"pt"},{"fonte":"Canal Rural","pais":"Brasil","titulo":"Com mais de 90% de acerto, tecnologia identifica milho tolerante à seca","resumo":"Uma nova metodologia tecnológica alcançou taxas de precisão superiores a 90% na identificação de linhagens de milho mais resistentes ao estresse hídrico.\nA inovação permite selecionar sementes adaptadas às mudanças climáticas de forma muito mais ágil e econômica do que os métodos tradicionais.\nO avanço promete fortalecer a segurança alimentar e mitigar perdas no agronegócio.","link":"https://www.canalrural.com.br/agricultura/com-mais-de-90-de-acerto-tecnologia-identifica-milho-mais-tolerante-a-seca/","categoria":"AGROTECH","lang":"pt"},{"fonte":"G1","pais":"Brasil","titulo":"Caramelo brasileiro: a ciência por trás do vira-lata mais amado do país","resumo":"Estudos genéticos e comportamentais revelam os fatores biológicos que tornam o cão vira-lata caramelo tão resistente e popular no Brasil.\nA diversidade genética adquirida ao longo de gerações confere a esses animais maior adaptabilidade a diferentes ambientes e forte imunidade.\nA pesquisa destaca a relevância da ciência na compreensão da fauna urbana e do patrimônio afetivo do país.","link":"https://g1.globo.com/google/amp/fantastico/video/caramelo-brasileiro-a-ciencia-por-tras-do-vira-lata-mais-amado-do-pais-14813550.ghtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Valor Econômico","pais":"Brasil","titulo":"Vídeo de Bolsonaro criado por IA pode contrariar regras do TSE, dizem especialistas","resumo":"A circulação de conteúdos gerados por inteligência artificial simulando falas do ex-presidente acendeu o alerta de juristas e especialistas eleitorais.\nAs regras vigentes do Tribunal Superior Eleitoral proíbem o uso de deepfakes e simulações para enganar o eleitorado ou antecipar campanha.\nO caso reforça a urgência de fiscalização rigorosa sobre o uso de IA nas disputas políticas brasileiras.","link":"https://valor.globo.com/politica/noticia/2026/07/26/vdeo-de-bolsonaro-em-ia-pode-contrariar-regra-do-tse-avaliam-especialistas.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Times Brasil | CNBC","pais":"Brasil","titulo":"Couro de tilápia pode virar nova fonte de renda e impulsionar economia criativa","resumo":"O reaproveitamento da pele de tilápia surge como uma alternativa sustentável e de alto valor agregado para a indústria da moda e do design.\nTecnologias de curtimento transformam um resíduo da piscicultura em um couro resistente, maleável e ecológico.\nA iniciativa fomenta a economia criativa local e abre novas oportunidades de negócios em regiões produtoras.","link":"https://timesbrasil.com.br/brasil/economia-brasileira/couro-tilapia-economia-criativa-morada-nova-minas/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Época Negócios","pais":"Estados Unidos","titulo":"Empresas de tecnologia dos EUA já cortaram 140 mil empregos este ano para acelerar IA","resumo":"As grandes empresas de tecnologia dos Estados Unidos já eliminaram cerca de 140 mil postos de trabalho ao longo deste ano.\nEssa reestruturação em massa reflete uma mudança estratégica profunda no setor, visando redirecionar recursos financeiros para a inteligência artificial.\nAnalistas apontam que a busca por eficiência operacional e a corrida pelo domínio da IA estão redefinindo as prioridades do mercado.\nO movimento levanta preocupações sobre o futuro do mercado de trabalho em tecnologia frente à automação de processos.","link":"https://epocanegocios.globo.com/tecnologia/noticia/2026/07/empresas-de-tecnologia-dos-eua-ja-cortaram-140-mil-empregos-neste-ano-enquanto-aceleram-investimentos-em-ia-diz-ft.ghtml","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"timesofindia.indiatimes.com","pais":"Estados Unidos","titulo":"Carta aberta com executivos como Musk, Altman e Pichai alerta sobre o futuro da IA","resumo":"Uma carta aberta reunindo os principais líderes da indústria de tecnologia, como Satya Nadella, Sundar Pichai, Elon Musk e Sam Altman, aborda os rumos da inteligência artificial.\nO documento destaca a necessidade urgente de estabelecer diretrizes éticas e regulatórias para o desenvolvimento seguro da tecnologia.\nA iniciativa reflete um momento decisivo em que os próprios gigantes do setor pedem cooperação para mitigar riscos existenciais e econômicos.\nO impacto do posicionamento promete pressionar governos globais por regulamentações mais rígidas nos próximos anos.","link":"https://timesofindia.indiatimes.com/technology/tech-news/read-letter-that-has-satya-nadella-sundar-pichai-elon-musk-jensen-huang-sam-altman-and-many-other-ceos-of-biggest-american-technology-companies-saying-this-has-our-full-support/articleshow/132652871.cms","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Vietnam.vn","pais":"Estados Unidos","titulo":"Apple Glasses pode ser anunciado na WWDC 2027 focado no uso contínuo","resumo":"Novos relatórios apontam que a Apple planeja revelar seus tão aguardados óculos inteligentes durante a conferência WWDC em 2027.\nO dispositivo promete integrar tecnologia vestível à rotina dos usuários com uma proposta de uso ininterrupto ao longo de todo o dia.\nA estratégia da gigante de Cupertino visa criar um ecossistema ainda mais imersivo, combinando realidade aumentada e inteligência artificial cotidiana.\nA expectativa no setor é de que o lançamento consolide de vez os óculos inteligentes como substitutos funcionais dos smartphones.","link":"https://www.vietnam.vn/pt/cong-nghe-27-7-apple-glasses-co-the-ra-mat-tai-wwdc-2027","categoria":"LANÇAMENTO","lang":"pt"},{"fonte":"eeNews Europe","pais":"Estados Unidos","titulo":"Intel e Lens Technology se unem para empacotamento avançado de chips de IA","resumo":"A Intel firmou uma parceria estratégica com a Lens Technology para acelerar o desenvolvimento de empacotamento avançado de semicondutores direcionados à IA.\nA colaboração busca aumentar a eficiência e o desempenho de novos processadores gráficos e aceleradores de dados em larga escala.\nCom essa união, a Intel fortalece sua cadeia de suprimentos global para tentar superar concorrentes diretos no mercado de microchips.\nO avanço tecnológico nessas estruturas de embalagem é fundamental para sustentar a crescente demanda por supercomputação.","link":"https://www.eenewseurope.com/en/intel-and-lens-technology-collaborate-on-advanced-ai-chip-packaging/","categoria":"HARDWARE","lang":"pt"},{"fonte":"Technology Networks","pais":"Estados Unidos","titulo":"Técnica com pontos quânticos revela ondas de luz ocultas em superfícies metálicas","resumo":"Pesquisadores desenvolveram um método inovador de imagem baseado em pontos quânticos capaz de visualizar ondas de luz anteriormente invisíveis em metais.\nA descoberta permite mapear interações de ondas eletromagnéticas em nanoescala com um nível de precisão sem precedentes.\nEssa abordagem abre portas para o avanço da fotônica quântica e para a criação de dispositivos ópticos extremamente menores e eficientes.\nAlém disso, os resultados têm potencial imediato para transformar o desenvolvimento de sensores e semicondutores de próxima geração.","link":"https://www.technologynetworks.com/tn/news/quantum-dot-imaging-technique-reveals-hidden-light-waves-on-metal-surfaces-414988","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Technology Networks","pais":"Estados Unidos","titulo":"Vesículas extracelulares modificadas aumentam a precisão na detecção do câncer","resumo":"Cientistas criaram vesículas extracelulares bioengenheiradas capazes de aumentar significativamente a sensibilidade em exames de diagnóstico do câncer.\nA nova técnica facilita a identificação precoce de biomarcadores tumorais na circulação sanguínea, permitindo intervenções médicas mais rápidas.\nAo aprimorar a precisão das biópsias líquidas, o estudo abre margem para tratamentos mais personalizados e menos invasivos aos pacientes.\nA inovação representa um marco promissor para a medicina diagnóstica e para o monitoramento contínuo de recidivas de tumores.","link":"https://www.technologynetworks.com/tn/news/engineered-extracellular-vesicles-boost-cancer-detection-sensitivity-414990","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Technology Networks","pais":"Estados Unidos","titulo":"Modelos de órgão em chip auxiliam no estudo dinâmico do microbioma","resumo":"O uso de tecnologias de órgão em chip está permitindo aos cientistas analisar o comportamento do microbioma humano sob condições dinâmicas reais.\nA plataforma simula com alta fidelidade os movimentos mecânicos e o microambiente celular do trato gastrointestinal.\nCom isso, pesquisadores conseguem observar como bactérias interagem com tecidos biológicos durante a digestão e o desenvolvimento de doenças.\nO progresso impulsiona o avanço da medicina de precisão e reduz a necessidade de testes laboratoriais com animais.","link":"https://www.technologynetworks.com/tn/articles/using-organ-on-a-chip-models-to-study-the-microbiome-in-motion-414975","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Le Monde.fr","pais":"Estados Unidos","titulo":"Cresce a oposição política à expansão de data centers nos Estados Unidos","resumo":"A construção acelerada de novos data centers para alimentar a inteligência artificial virou um tópico de forte debate político nos Estados Unidos.\nMoradores e ativistas locais criticam o consumo excessivo de energia elétrica e água, além do impacto na infraestrutura de pequenas cidades.\nDiante do descontentamento popular, legisladores americanos começam a propor regras e limites para a expansão contínua desses complexos tecnológicos.\nO dilema expõe o choque direto entre a necessidade de crescimento tecnológico acelerado e a sustentabilidade ambiental das comunidades.","link":"https://www.lemonde.fr/economie/article/2026/07/27/aux-etats-unis-l-opposition-aux-data-centers-grandit-et-devient-un-objet-politique_6733571_3234.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Science et vie","pais":"França","titulo":"Revisitando a Covid-19: de uma crise global a respostas nacionais, as lições de França, Brasil e Portugal","resumo":"A pandemia de Covid-19 exigiu respostas rápidas e adaptadas de diferentes governos ao redor do mundo.\nUm estudo comparativo analisa como França, Brasil e Portugal estruturaram suas estratégias de saúde pública e políticas sanitárias.\nA análise destaca as lições aprendidas para melhorar o gerenciamento de futuras crises globais de saúde e o papel da ciência nessas decisões.","link":"https://www.science-et-vie.com/corps-et-sante/retour-sur-le-covide2809119-dune-crise-globale-a-des-reponses-nationales-les-enseignements-de-la-france-du-bresil-et-du-portugal-250864.html","categoria":"SAÚDE E CIÊNCIA","lang":"pt"},{"fonte":"Clubic","pais":"França","titulo":"Volkswagen promete até 50% de economia em carro elétrico: tal medida é possível na França?","resumo":"A Volkswagen anunciou novas estratégias que prometem reduzir em até metade os custos associados ao uso e produção de veículos elétricos.\nEspecialistas analisam se esse modelo de incentivos e reduções tarifárias pode ser viabilizado no mercado automotivo francês.\nA medida reacende o debate sobre a transição energética sustentável e a acessibilidade da frota elétrica para os consumidores na Europa.","link":"https://www.clubic.com/actualite-622798-volkswagen-promet-jusqu-a-50-d-economie-sur-une-voiture-electrique-un-tel-dispositif-est-il-possible-en-france.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Air\u0026Cosmos","pais":"França","titulo":"Economia espacial mundial: as grandes viradas de 2025","resumo":"O setor espacial global está passando por transformações profundas impulsionadas pelo avanço de empresas privadas e novos investimentos.\nO ano de 2025 marca um ponto de virada com a consolidação de novas tecnologias de lançamento e exploração orbital.\nA França e a Europa buscam garantir sua soberania e competitividade diante do domínio crescente de potências globais no ecossistema espacial.","link":"https://air-cosmos.latribune.fr/article/espace/72087060413298/economie-spatiale-mondiale-les-grandes-bascules-de-2025","categoria":"AEROESPACIAL","lang":"pt"},{"fonte":"ici.fr","pais":"França","titulo":"Romans-sur-Isère: 'de alguns gramas a 25 toneladas', tecnologia única na Europa é lançada pela Framatome","resumo":"A unidade da Framatome em Romans-sur-Isère inaugurou uma instalação tecnológica pioneira para a indústria nuclear na Europa.\nO novo sistema permite escalar processos industriais complexos com alta precisão, saltando de microgramas para capacidade em escala de toneladas.\nO avanço fortalece a cadeia de suprimentos de energia limpa e reforça a autonomia tecnológica do setor energético europeu.","link":"https://www.ici.fr/emissions/l-info-d-ici-ici-drome-ardeche/romans-sur-isere-de-quelques-grammes-a-25-tonnes-une-technologie-unique-en-europe-lancee-a-framatome-2733922","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"O GLOBO","pais":"França","titulo":"Uma rival para a SpaceX, de Musk? Europeia Exploration Company prepara captação de US$ 300 milhões","resumo":"A startup europeia Exploration Company negocia uma rodada de financiamento expressiva para desenvolver cápsulas espaciais reutilizáveis.\nO objetivo é rivalizar com o domínio da SpaceX e oferecer alternativas independentes para o transporte de carga e tripulação.\nA iniciativa representa um passo crucial para fortalecer a competitividade comercial do setor aeroespacial na Europa.","link":"https://oglobo.globo.com/economia/noticia/2026/07/26/uma-rival-para-a-spacex-de-musk-europeia-exploration-company-se-prepara-para-levantar-us-300-milhoes-diz-ft.ghtml","categoria":"NEGÓCIOS ESPACIAIS","lang":"pt"},{"fonte":"Diocèse de Paris","pais":"França","titulo":"Inteligência Artificial: a ciência está alcançando a ficção científica?","resumo":"Os recentes avanços em modelos generativos e autonomia computacional estão aproximando a Inteligência Artificial dos cenários da ficção.\nCientistas e pesquisadores debatem até que ponto as capacidades atuais representam um salto real rumo à inteligência geral artificial.\nA discussão aborda os dilemas éticos, impactos sociais e os limites reais da evolução tecnológica frente às expectativas criadas.","link":"https://dioceseparis.fr/ia-la-science-rattrape-t-elle-la.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Yahoo Finance UK","pais":"Inglaterra","titulo":"Quantum Blockchain obtém aprovação de patente para tecnologia de mineração de Bitcoin","resumo":"A Quantum Blockchain anunciou a aprovação de uma patente fundamental voltada para otimizar o processo de mineração de Bitcoin.\nA nova tecnologia utiliza algoritmos avançados para aumentar a eficiência energética e a velocidade de processamento do ecossistema cripto.\nEsse avanço posiciona a empresa de forma estratégica no setor, oferecendo soluções sustentáveis para os desafios operacionais do mercado.","link":"https://uk.finance.yahoo.com/news/quantum-blockchain-wins-patent-approval-063300314.html","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Retail Technology Innovation Hub","pais":"Inglaterra","titulo":"Tecnologia 'Just Walk Out' da Amazon e Beerjet impulsionam bar automatizado na arena BP Pulse Live","resumo":"A arena BP Pulse Live do NEC Group implementou um bar inovador sem caixas, combinando o sistema 'Just Walk Out' da Amazon com a Beerjet UK.\nA solução promete eliminar filas de espera ao permitir que os espectadores comprem bebidas apenas pegando os produtos e saindo do local.\nA iniciativa representa um salto significativo na modernização de eventos e no uso de automação e inteligência artificial no varejo.","link":"https://retailtechinnovationhub.com/home/2026/7/26/amazon-just-walk-out-and-beerjet-uk-technology-powers-frictionless-bar-at-necs-bp-pulse-live-arena","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Oxford Mail","pais":"Inglaterra","titulo":"Biotech de Oxford capta £22 milhões para tecnologia de controle de plantas daninhas de última geração","resumo":"Uma startup de biotecnologia de Oxford garantiu 22 milhões de libras em financiamento para acelerar o desenvolvimento de soluções agrícolas.\nO projeto foca no uso de tecnologias de última geração para o controle direcionado e ecológico de plantas daninhas nas lavouras.\nO investimento impulsionará a expansão comercial e reduzirá drasticamente a dependência de defensivos agrícolas químicos tradicionais.","link":"https://www.oxfordmail.co.uk/news/26403942.oxford-weed-control-technology-raises-22-million-investment/","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"Українська правда","pais":"Inglaterra","titulo":"Primeiro-ministro do Reino Unido transferirá direitos da tecnologia 'Stone Cloak' para Zelenskyy","resumo":"O primeiro-ministro do Reino Unido concordou em conceder à Ucrânia os direitos de acesso à tecnologia de defesa 'Stone Cloak'.\nO acordo visa fortalecer a capacidade militar e tecnológica de Kiev no contexto do atual cenário geopolítico europeu.\nA transferência tecnológica destaca a cooperação estratégica entre o Reino Unido e a Ucrânia na adoção de inovações em segurança.","link":"https://www.pravda.com.ua/eng/news/2026/07/27/8046020/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Retail Technology Innovation Hub","pais":"Inglaterra","titulo":"Rina Chotai migra da moda para o futebol e assume como VP de Tecnologia no Aston Villa","resumo":"O clube inglês Aston Villa anunciou a contratação de Rina Chotai como sua nova Vice-Presidente de Tecnologia.\nVinda do setor de moda, a executiva liderará a transformação digital, a infraestrutura tecnológica e as inovações no estádio do clube.\nA movimentação reflete a crescente busca do setor esportivo por lideranças especializadas na gestão da transformação digital.","link":"https://retailtechinnovationhub.com/home/2026/7/26/rina-chotai-moves-from-fashion-to-football-as-she-takes-on-vp-of-technology-role-at-aston-villa","categoria":"CARREIRA","lang":"pt"},{"fonte":"Insider Media Ltd","pais":"Inglaterra","titulo":"Empresa de armários inteligentes licencia tecnologia para operadores na Bélgica e na Holanda","resumo":"Uma especialista britânica em armários inteligentes expandiu sua presença europeia ao licenciar sua tecnologia na Bélgica e na Holanda.\nO sistema automatizado facilita a logística de entregas de última milha, oferecendo maior conveniência e segurança aos consumidores.\nO contrato consolida a expansão da infraestrutura tecnológica de entregas automáticas no mercado consumidor europeu.","link":"https://www.insidermedia.com/news/south-east/smart-locker-business-licenses-technology-to-belgian-and-dutch-operators","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Insider Media Ltd","pais":"Inglaterra","titulo":"Technology Minerals conclui oferta de varejo para captação de recursos","resumo":"A Technology Minerals finalizou com sucesso uma oferta pública de ações no varejo com o objetivo de captar novos recursos financeiros.\nO capital arrecadado será direcionado para expandir suas operações de reciclagem de baterias e extração sustentável de metais.\nA iniciativa visa fortalecer a cadeia de suprimentos de matérias-primas essenciais para o mercado de veículos elétricos e energia.","link":"https://www.insidermedia.com/news/midlands/technology-minerals-completes-retail-offer-to-raise-funds","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"TradingView","pais":"Inglaterra","titulo":"Receita do Science Group cai no 1º semestre, mas empresa prevê recompras acima de £20 milhões","resumo":"O Science Group divulgou seus resultados do primeiro semestre, apontando uma leve redução na receita principal de consultoria técnica.\nApesar do desempenho financeiro no período, a organização manteve a confiança ao projetar uma recompra de ações superior a 20 milhões de libras.\nA estratégia reflete a solidez do caixa da empresa e a aposta contínua na geração de valor a longo prazo para o setor científico.","link":"https://www.tradingview.com/news/reuters.com,2026:newsml_L1N43T062:0-uk-s-science-group-preliminary-h1-core-revenue-falls-expects-buyback-to-exceed-20-mln/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Xataka Móvil","pais":"Espanha","titulo":"Comprar tecnologia ou roupas está prestes a mudar na Europa devido a um novo código QR obrigatório","resumo":"A União Europeia prepara a implementação de um novo passaporte digital de produtos acessível por código QR.\nEssa medida mudará significativamente a forma como consumidores adquirem itens como roupas e eletroeletrônicos.\nO objetivo é garantir total transparência sobre a origem, sustentabilidade e reciclabilidade dos materiais utilizados.\nA iniciativa promete transformar o comércio no continente ao priorizar a economia circular e o consumo consciente.","link":"https://www.xatakamovil.com/mercado/comprar-tecnologia-ropa-esta-a-punto-cambiar-europa-culpa-tiene-nuevo-codigo-qr-obligatorio","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"20Minutos","pais":"Espanha","titulo":"O novo XPeng L03 chega à Europa trazendo tecnologia rara no mercado","resumo":"A fabricante chinesa de veículos elétricos XPeng lança oficialmente o modelo L03 no mercado europeu.\nO automóvel destaca-se por integrar sistemas avançados de condução autônoma e arquitetura de carregamento ultra-rápido.\nEssa chegada intensifica a concorrência no setor automotivo do continente, desafiando marcas tradicionais.\nCom recursos tecnológicos de ponta, o modelo busca consolidar a presença de marcas orientais no Ocidente.","link":"https://www.20minutos.es/motor/coches/nuevo-xpeng-l03-llega-europa-google-integrado-tecnologia-muy-pocos-ofrecen_7017607_0.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"OkDiario","pais":"Espanha","titulo":"Pesquisadores das Canárias usam resíduos de camarões e caranguejos para capturar CO2","resumo":"Cientistas bio-orgânicos das Ilhas Canárias desenvolveram um método inovador de captura de carbono.\nA técnica utiliza a quitosana, substância extraída das carcaças descartadas de camarões e caranguejos.\nO material retém emissões industriais de CO2 antes que alcancem e poluam a atmosfera terrestre.\nA solução une sustentabilidade e economia circular para combater diretamente as mudanças climáticas globais.","link":"https://okdiario.com/ciencia/investigadores-bio-organicos-canarios-utilizan-residuos-gambas-cangrejos-capturar-co2-antes-que-llegue-atmosfera-19044033","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"La Vanguardia","pais":"Espanha","titulo":"Multiverse Computing finaliza rodada de 500 milhões para impulsionar IA eficiente","resumo":"A startup espanhola Multiverse Computing se aproxima de fechar um aporte milionário de investimento.\nOs recursos serão destinados ao desenvolvimento de soluções de inteligência artificial de baixo consumo energético.\nA empresa busca reduzir os altos custos operacionais e a enorme pegada de carbono dos modelos de IA tradicionais.\nO feito posiciona a Espanha como um dos grandes pólos de inovação e tecnologia profunda na Europa.","link":"https://www.lavanguardia.com/dinero/20260727/11601507/multiverse-computing-ultima-ronda-500-millones-impulsar-tecnologia-ia-eficiente.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Confidencial Digital","pais":"Espanha","titulo":"Salto Systems é avaliada em 1,5 bilhão de euros: o impacto para a economia espanhola","resumo":"A empresa espanhola especializada em sistemas de controle de acesso inteligente atingiu status de unicórnio.\nA avaliação bilionária destaca o forte crescimento do ecossistema tecnológico do País Basco e de toda a Espanha.\nO marco atrai novos investimentos internacionais e fortalece o setor de segurança digital corporativa na região.\nAnalistas apontam o caso como um modelo de sucesso para a expansão de scale-ups de tecnologia industrial.","link":"https://www.elconfidencialdigital.com/articulo/dinero/salto-systems-valorada-1500-millones-que-significa-economia-vasca-espanola/202607270720131033216.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Canarias7","pais":"Espanha","titulo":"A ciência confirma: o horário em que você come é tão importante quanto o alimento","resumo":"Estudos científicos recentes reforçam o impacto da crononutrição e do ritmo circadiano na saúde humana.\nPesquisadores apontam que alinhar as refeições aos horários biológicos melhora significativamente a metabolização de nutrientes.\nComer fora dos horários adequados pode aumentar riscos metabólicos, como resistência à insulina e ganho de peso.\nA descoberta altera a forma como especialistas abordam dietas, destacando o relógio biológico como fator chave.","link":"https://www.canarias7.es/gastronomia-c7/reloj-come-hora-comidas-importa-20260727070000-nt.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"El Economista","pais":"Espanha","titulo":"Tarifas desaceleram o comércio, mas não contêm a inovação chinesa","resumo":"Barreiras comerciais impostas por potências ocidentais têm alterado o fluxo do comércio internacional.\nApesar das sanções e tarifas elevadas, o avanço tecnológico e a pesquisa na China mantêm um ritmo acelerado.\nO cenário demonstra que a disputa geopolítica está impulsionando a autossuficiência científica no país asiático.\nO fenômeno força uma reconfiguração nas cadeias globais de suprimentos e no desenvolvimento de novas tecnologias.","link":"https://www.eleconomista.es/mercados-cotizaciones/noticias/14003186/07/26/los-aranceles-frenan-el-comercio-no-la-innovacion-china.html","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"La Vanguardia","pais":"Espanha","titulo":"Inteligência artificial evita que microscópios danifiquem células vivas","resumo":"Uma nova aplicação de inteligência artificial reduz a intensidade de luz necessária em exames microscópicos.\nA iluminação excessiva costuma causar fototoxicidade e degradar amostras de células biológicas vivas durante análises.\nCom a IA prevendo e reconstruindo imagens de alta resolução, os cientistas conseguem observar processos celulares por mais tempo.\nO avanço abre portas para descobertas mais precisas na biologia celular e no desenvolvimento de medicamentos.","link":"https://www.lavanguardia.com/ciencia/20260727/11599648/inteligencia-artificial-evitar-microscopios-danen-celulas-vivas.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"DW.com","pais":"Alemanha","titulo":"Transição Energética Gera Conflitos e Desafios Sociais na Alemanha","resumo":"A transição energética na Alemanha enfrenta crescentes tensões sociais e políticas devido aos custos e ao ritmo de implementação das medidas de descarbonização.\nO setor industrial e a população demonstram preocupação constante com a estabilidade do fornecimento de eletricidade e o aumento de preços.\nO governo busca conciliar compromissos ambientais rigorosos com a preservação da competitividade econômica do país.\nEsse impasse destaca a complexidade e os desafios práticos de transformar radicalmente a matriz energética de uma potência global.","link":"https://www.dw.com/pt-br/transi%C3%A7%C3%A3o-energ%C3%A9tica-gera-conflitos-na-alemanha/video-78084155","categoria":"ENERGIA","lang":"pt"},{"fonte":"Forbes JAPAN","pais":"Japão","titulo":"IA Física e a Reestruturação da Economia de Materiais para Resolver o 'Problema dos 93%'","resumo":"O avanço da inteligência artificial física está transformando a indústria ao aplicar modelos preditivos à ciência dos materiais.\nA abordagem busca superar o desafio conhecido como 'problema dos 93%', onde a maior parte dos dados do mundo físico permanece inacessível ao processamento digital.\nCom essa evolução, especialistas projetam uma reformulação profunda na eficiência produtiva e no ciclo de vida dos materiais industriais.","link":"https://forbesjapan.com/articles/detail/101741","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"u-tokyo.ac.jp","pais":"Japão","titulo":"Estudo Revela que Vesículas Extracelulares da Flora Intestinal Modulam a Resposta Imune à COVID-19","resumo":"Pesquisadores japoneses identificaram que vesículas extracelulares derivadas de bactérias intestinais desempenham um papel crítico na regulação do sistema imunológico humano.\nA descoberta demonstra como esses componentes afetam diretamente a intensidade das respostas imunes durante a infecção por COVID-19.\nO avanço científico abre novas possibilidades para o desenvolvimento de terapias preventivas e tratamentos direcionados através do microbioma.","link":"https://www.u-tokyo.ac.jp/focus/ja/press/z0406_00014.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"日经中文网","pais":"Japão","titulo":"Honda Utilizará Sistema Operacional da Nissan para Desenvolver Novos Veículos em Parceria","resumo":"Em uma aliança estratégica sem precedentes, a Honda passará a adotar o sistema operacional veicular e tecnologias da Nissan no desenvolvimento de seus próximos carros.\nA colaboração visa acelerar a transformação digital das montadoras japonesas e reduzir custos substanciais de pesquisa e desenvolvimento em software.\nA união reflete a crescente pressão sobre a indústria automotiva tradicional para rivalizar com gigantes globais de veículos elétricos e conectados.","link":"https://cn.nikkei.com/industry/icar/63379-2026-07-27-09-24-41.html","categoria":"AUTOMOTIVO","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Bridgestone Desenvolve Tecnologia para Extrair Matérias-Primas de Pneus Usados para Novos Produtos","resumo":"A Bridgestone apresentou uma tecnologia inovadora capaz de recuperar materiais de alta pureza a partir de pneus descartados para a fabricação de novos componentes.\nO processo de reciclagem química contribui significativamente para reduzir a dependência de matérias-primas virgens e diminuir a pegada de carbono industrial.\nA iniciativa fortalece a transição para a economia circular no setor automotivo e estabelece um novo padrão para o gerenciamento de resíduos de borracha.","link":"https://news.yahoo.co.jp/articles/92db38d71ecf653ff5ac7d4bd2c43b6f715eb4a8","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Universidade de Kagoshima Desenvolve Plataforma Inteligente para Previsão de Áreas de Pesca","resumo":"A Universidade de Kagoshima, em parceria com o governo local, lançou um site de previsão de zonas pesqueiras focado no conceito de 'pesca inteligente'.\nUtilizando análise de dados oceânicos e algoritmos avançados, o sistema otimiza as rotas das embarcações e aumenta a eficiência da captura de espécies marinhas.\nA estimativa é de que a tecnologia gere um impacto econômico anual superior a 130 milhões de ienes apenas no setor de pesca de peixes jovens.","link":"https://news.yahoo.co.jp/articles/ce9e77bd37c4e8d09b09b42e8b9cd4a064ad65d0?source=rss","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"srigroup.co.jp","pais":"Japão","titulo":"Isuzu Expande Uso do Software 'Sensing Core' para Detectar Sinais de Desprendimento de Rodas em Ônibus","resumo":"A Isuzu anunciou a expansão da tecnologia de software 'Sensing Core' em suas novas frotas de ônibus urbanos e de transporte executivo.\nO sistema analisa dados de rotação das rodas sem necessidade de sensores adicionais, identificando antecipadamente indícios de soltura das rodas.\nA solução eleva substancialmente os padrões de segurança do transporte coletivo e previne acidentes graves em estradas e vias urbanas.","link":"https://www.srigroup.co.jp/newsrelease/2026/sri/2026_075.html","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"NTT Data Testa Internamente o Microsoft 365 Copilot Cowork para Automatização de Vendas","resumo":"A NTT Data Intellilink iniciou testes práticos com o Microsoft 365 Copilot Cowork para otimizar as rotinas administrativas de sua equipe comercial.\nO projeto visa medir o impacto real do assistente de inteligência artificial na redução de tempo gasto em tarefas repetitivas de vendas.\nOs dados obtidos servirão como base de validação para implementar a automação por IA em larga escala nos clientes da empresa.","link":"https://prtimes.jp/main/html/rd/p/000000048.000042493.html","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"GIGAZINE","pais":"Japão","titulo":"Plataforma X e Editoras Musicais Encerram Disputa de Direitos Autorais com Acordo de Três Anos","resumo":"A rede social X e as principais editoras de música dos Estados Unidos chegaram a um acordo comercial finalizando um litígio judicial de três anos.\nO processo envolvia alegações de violação massiva de direitos autorais sobre faixas musicais utilizadas sem licença por usuários na plataforma.\nA resolução estabelece novas regras para o uso de conteúdo protegido e traz estabilidade jurídica para a operação da empresa no setor de mídia.","link":"https://gigazine.net/news/20260727-x-music-copyright/","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"O GLOBO","pais":"China","titulo":"China Planeja Criar Rebanho com Mais de 100 Iaques Clonados até 2028","resumo":"Cientistas chineses anunciaram um projeto ambicioso para clonar mais de uma centena de iaques até 2028.\nA iniciativa visa preservar a diversidade genética da espécie e melhorar a produção no Planalto Tibetano.\nUtilizando transferência nuclear de células somáticas, o projeto garante rebanhos mais resistentes e saudáveis.\nO avanço representa um marco significativo na aplicação da biotecnologia agrícola em larga escala na China.","link":"https://oglobo.globo.com/saude/ciencia/noticia/2026/07/27/china-quer-criar-rebanho-com-mais-de-100-iaques-clonados-ate-2028-entenda.ghtml","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"China","titulo":"Fabricante de Chips Dispara em Estreia na Bolsa de Xangai e Alcança Valor Recorde","resumo":"A estreia no mercado de ações de uma gigante chinesa de semicondutores resultou em uma valorização recorde.\nO movimento foi impulsionado pelo apoio estatal e pela busca do país por autossuficiência no setor de microchips.\nA captação milionária visa mitigar sanções internacionais e fortalecer a cadeia de suprimentos de hardware.\nA ascensão meteórica consolida o setor de semicondutores como o motor central da economia digital do país.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/07/27/fabricante-de-chips-dispara-em-estreia-na-bolsa-e-se-torna-empresa-mais-valiosa-da-china.ghtml","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"Tribuna do Sertão","pais":"China","titulo":"Físicos Russos e Chineses Desenvolvem Tecnologia Inovadora para Fotografia Molecular","resumo":"Físicos da Rússia e da China desenvolveram um método inovador de captura de imagens moleculares de alta resolução.\nA nova tecnologia permite visualizar processos químicos em tempo real no nível atômico com precisão inédita.\nEssa descoberta abra caminho para avanços no desenvolvimento de novos medicamentos e materiais avançados.\nO projeto reforça a crescente cooperação científica entre as duas nações na fronteira da física aplicada.","link":"https://www.tribunadosertao.com.br/esportes/2026/07/26/947220-fisicos-russos-e-chineses-desenvolvem-tecnologia-inovadora-para-fotografia-molecular","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"湖北省经济和信息化厅","pais":"China","titulo":"Província de Hubei Lidera Desenvolvimento da Tecnologia 6G com Cinco Grandes Vantagens","resumo":"A província chinesa de Hubei estabeleceu uma estratégia para liderar a pesquisa e a implementação de redes 6G.\nA região destaca sua infraestrutura tecnológica de ponta, polos de inovação e forte base de talentos científicos.\nA iniciativa busca integrar inteligência artificial e conectividade quântica na próxima geração de comunicações.\nO projeto reforça as metas nacionais da China de definir os novos padrões globais de telecomunicações.","link":"http://jxt.hubei.gov.cn/bmdt/jxtyw/202607/t20260727_5983867.shtml","categoria":"TELECOMUNICAÇÕES","lang":"pt"},{"fonte":"China Daily","pais":"China","titulo":"Inteligência Artificial Geral Está Prestes a Redefinir Serviços de Alta Tecnologia","resumo":"Avanços em Inteligência Artificial Geral estão remodelando os serviços de engenharia e software na China.\nEmpresas de tecnologia estão integrando modelos autônomos para otimizar processos analíticos e operacionais complexos.\nEssa automação de alto nível promete reduzir drasticamente custos e aumentar a produtividade industrial.\nA transição para ecossistemas baseados em AGI é vista como um divisor de águas para a competitividade global.","link":"https://www.chinadaily.com.cn/a/202607/27/WS6a66b347a310986e2b46766d.html","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"东方财富","pais":"China","titulo":"Tecnologia Espacial Reutilizável Reduz Custos e Impulsiona Setor Comercial na China","resumo":"A adoção de tecnologias de foguetes reutilizáveis está transformando a indústria espacial comercial chinesa.\nA inovação reduz significativamente os custos de lançamento por quilo de carga útil enviada para a órbita terrestre.\nEspecialistas apontam que o avanço permitirá a expansão rápida de megaconstelações de satélites no país.\nO progresso consolida a competitividade do ecossistema aeroespacial privado chinês em escala global.","link":"https://wap.eastmoney.com/a/202607273821331122.html","categoria":"TECNOLOGIA ESPACIAL","lang":"pt"},{"fonte":"央视网","pais":"China","titulo":"Primeiro Aeroporto com Tecnologia de Carbono Zero do Mundo É Implementado na China","resumo":"Após vinte anos de pesquisas, a China implementou a tecnologia do primeiro aeroporto de carbono zero em Ordos.\nO projeto combina microredes de energia solar, sistemas de captura de carbono e gestão preditiva por inteligência artificial.\nA solução elimina completamente as emissões líquidas de gases de efeito estufa decorrentes das operações em solo.\nO feito estabelece um marco histórico e um novo modelo sustentável para a infraestrutura aeroportuária mundial.","link":"https://local.cctv.com/2026/07/27/ARTIEYkeVPka3rJdtW5AJJOf260727.shtml","categoria":"ENERGIA LIMPA","lang":"pt"},{"fonte":"观点网","pais":"China","titulo":"Xiaomi Anuncia Evento do Ecossistema Pengcheng e Apresenta Novo Modelo de Veículo Elétrico","resumo":"A Xiaomi anunciou a realização de seu evento tecnológico focado na integração de dispositivos com veículos elétricos.\nNa ocasião, a fabricante apresentou inovações no ecossistema Pengcheng e a nova versão do SUV elétrico N90 Max.\nO modelo traz tecnologias avançadas de condução autônoma e conectividade inteligente de última geração.\nA iniciativa reforça a estratégia da marca em liderar a fusão entre eletromobilidade e eletrônicos de consumo.","link":"https://www.guandian.cn/article/20260727/577189.html","categoria":"LANÇAMENTO","lang":"pt"},{"fonte":"DT Next","pais":"Índia","titulo":"IIT Madras desenvolve tecnologia avançada de refrigeração para eletrônicos compactos e sistemas de defesa","resumo":"Pesquisadores do Instituto Indiano de Tecnologia de Madras criaram um sistema inovador de resfriamento térmico projetado para eletrônicos de alta densidade.\nA solução aborda os desafios de superaquecimento em dispositivos compactos e equipamentos críticos de defesa nacional.\nA tecnologia promete aumentar a eficiência operacional e prolongar significativamente a vida útil de componentes eletrônicos avançados.","link":"https://www.dtnext.in/news/chennai/iit-madras-develops-advanced-cooling-technology-for-compact-electronics-defence-systems","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"BusinessLine","pais":"Índia","titulo":"Tecnologia EASyMelt da Tata Steel visa reduzir pela metade o uso de coque em altos-fornos","resumo":"A Tata Steel está implementando a tecnologia pioneira EASyMelt para transformar o processo de fabricação de aço na Índia.\nO sistema inovador busca cortar pela metade o consumo de coque, reduzindo drasticamente as emissões de carbono do setor industrial.\nA iniciativa representa um passo fundamental para descarbonizar a produção siderúrgica e adotar práticas mais limpas no país.","link":"https://www.thehindubusinessline.com/business-tech/tata-steels-easymelt-technology-aims-to-halve-coke-use-in-blast-furnaces/article71270482.ece","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"Primeiro-Ministro Modi anuncia força-tarefa liderada por Nandan Nilekani para reformar exames com tecnologia","resumo":"O governo indiano constituiu uma comissão de alto nível sob liderança do especialista em tecnologia Nandan Nilekani.\nO grupo tem como objetivo reestruturar os processos de exames nacionais, integrando biossegurança, inteligência artificial e reformas regulatórias.\nA medida busca evitar vazamentos de provas e garantir total transparência e integridade nos testes públicos em todo o país.","link":"https://newsonair.gov.in/pm-modi-announces-task-force-on-examination-reforms-reaffirms-commitment-to-transparent-exam/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Saur Energy","pais":"Índia","titulo":"Por que a tecnologia de Contato Traseiro (BC) está impulsionando os carros solares de última geração","resumo":"A tecnologia de células solares de Contato Traseiro (BC) está revolucionando o design e a eficiência de veículos elétricos movidos a energia solar.\nAo mover os contatos elétricos para a parte posterior dos painéis, a captação de luz solar é maximizada na superfície dos automóveis.\nEssa inovação amplia a autonomia dos veículos limpos e posiciona a tecnologia fotovoltaica na vanguarda da mobilidade sustentável.","link":"https://www.saurenergy.com/solar-energy-news/why-back-contact-bc-technology-is-powering-the-next-gen-solar-cars-12200639","categoria":"ENERGIA LIMPA","lang":"pt"},{"fonte":"HR News","pais":"Índia","titulo":"HCLTech criará 5.000 empregos com novo Centro Global de Tecnologia em Odisha","resumo":"A gigante de serviços de TI HCLTech anunciou a expansão de suas operações no estado de Odisha com um novo polo tecnológico.\nO projeto prevê a geração de mais de 5.000 postos de trabalho qualificados voltados para transformação digital e desenvolvimento de software.\nA iniciativa fortalece o ecossistema de inovação da região e atrai investimentos estratégicos no setor de tecnologia da informação.","link":"https://www.peoplematters.in/amp/news/recruiting-and-onboarding/hcltech-to-create-5000-jobs-with-new-global-technology-centre-in-odisha-51062","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Índia","titulo":"Robô aspirador Dreame D30 Ultra é lançado na Índia com sucção de 25.000Pa e tecnologia MopExtend","resumo":"A Dreame Technology lançou oficialmente no mercado indiano o robô aspirador topo de linha D30 Ultra por 52.999 rúpias.\nO dispositivo se destaca pela sucção impressionante de 25.000Pa e pelo sistema MopExtend RoboSwing para limpeza profunda de cantos.\nA novidade reforça a automação residencial no país, oferecendo sensores avançados e mapeamento inteligente para os consumidores.","link":"https://www.moneycontrol.com/technology/dreame-d30-ultra-robot-vacuum-launched-with-25-000pa-suction-and-mopextend-mopping-technology-at-rs-52-999-article-13984509.html","categoria":"LANÇAMENTO","lang":"pt"},{"fonte":"Careers360","pais":"Índia","titulo":"IIT Delhi lança curso certificado online em Ciência de Dados Aplicada e Inteligência Artificial","resumo":"O renomado IIT Delhi abriu inscrições para um programa executivo focado em Ciência de Dados Aplicada e Inteligência Artificial.\nVoltado para estudantes e profissionais no mercado de trabalho, o curso abrange aprendizado de máquina, análise preditiva e ferramentas práticas.\nA qualificação visa suprir a crescente demanda por talentos especializados no ecossistema tecnológico e de análise de dados.","link":"https://news.careers360.com/iit-delhi-launches-online-certificate-course-applied-data-science-ai-students-working-professionals-graduates-diploma-holders-cep","categoria":"EDUCAÇÃO","lang":"pt"},{"fonte":"ET CIO","pais":"Índia","titulo":"Adoção de IA reconfigura fluxos de trabalho e contratações em empresas de tecnologia","resumo":"A integração acelerada de ferramentas de Inteligência Artificial está transformando a rotina operacional das empresas de tecnologia.\nOrganizações em forte crescimento estão reestruturando equipes e priorizando profissionais com habilidades comprovadas em automação.\nEssa mudança redefine os critérios de contratação e exige requalificação contínua do mercado de trabalho no setor de inovação.","link":"https://cio.economictimes.indiatimes.com/news/artificial-intelligence/ai-adoption-reshapes-workflows-and-hiring-across-high-growth-technology-companies/132651720?utm_source=portal_category_widget\u0026utm_medium=homepage","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Rádio Castrense","pais":"Portugal","titulo":"Doutorado em Ciências do Esporte do IPBeja atrai 71 candidatos e esgota vagas na primeira fase","resumo":"O Instituto Politécnico de Beja registrou uma procura recorde para a primeira edição do seu curso de Doutorado em Ciências do Esporte, preenchendo todas as vagas disponíveis logo na fase inicial. O alto volume de 71 candidaturas reflete o crescente interesse acadêmico e científico pelo aprimoramento do alto rendimento esportivo e da saúde. A iniciativa fortalece a pesquisa aplicada na região e posiciona a instituição como um polo emergente de inovação científica na área.","link":"https://radiocastrense.pt/doutoramento-em-ciencias-do-desporto-do-ipbeja-atrai-71-candidatos-e-esgota-vagas-na-primeira-fase/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Marketeer","pais":"Portugal","titulo":"Tecnologia a serviço das entregas: a nova vantagem competitiva do e-commerce português","resumo":"O setor de e-commerce em Portugal passa por uma transformação impulsionada por soluções tecnológicas avançadas voltadas para a logística e gestão de entregas. A adoção de inteligência artificial, rastreamento em tempo real e automação de processos busca otimizar custos operacionais e elevar a satisfação dos consumidores. Essa modernização consolidou a eficiência logística como um diferencial estratégico indispensável para a competitividade das empresas no mercado digital.","link":"https://marketeer.sapo.pt/tecnologia-ao-servico-das-entregas-a-nova-vantagem-competitiva-do-e%E2%80%91commerce-portugues/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"arte sonora","pais":"Portugal","titulo":"Beam Solo: Blackstar e TONE3000 introduzem tecnologia Neural Amp Modeler pela primeira vez em um amplificador de fones de ouvido","resumo":"A parceria entre a Blackstar e a TONE3000 resultou no lançamento do Beam Solo, o primeiro amplificador de fones de ouvido a incorporar a tecnologia Neural Amp Modeler. O dispositivo utiliza redes neurais avançadas para simular com extrema precisão o comportamento e a sonoridade de amplificadores e pedais reais. A novidade representa um marco importante no mercado de tecnologia musical, democratizando o acesso a modelagens sonoras de altíssima fidelidade para músicos e produtores.","link":"https://artesonora.pt/beam-solo-blackstar-e-tone3000-introduzem-tecnologia-neural-amp-modeler-pela-primeira-vez-num-amplificador-de-auscultadores/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Pplware","pais":"Portugal","titulo":"Portugal poderá ter até 27 mil mortos em um grande terremoto; a ciência explica os números","resumo":"Estudos científicos recentes e simulações geológicas apontam que um terremoto de grande magnitude em Portugal poderia causar até 27 mil fatalidades no país. Pesquisadores utilizam modelos sismológicos avançados para alertar sobre a urgência de planos de prevenção e do reforço estrutural de edificações vulneráveis. A análise evidencia a importância da ciência na gestão de riscos e na preparação das cidades contra potenciais catástrofes naturais.","link":"https://pplware.sapo.pt/informacao/portugal-podera-ter-ate-27-mil-mortos-num-grande-sismo-a-ciencia-explica-os-numeros/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"How to Enable the Filter on Android That Automatically Blocks Spam Calls","resumo":"The Android operating system features native capabilities to automatically identify and block unwanted calls. The tool analyzes unknown numbers and significantly reduces the annoyance caused by telemarketing and scam attempts. Simple activation via the phone app guarantees greater privacy and daily security for smartphone users.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/07/27/como-ativar-no-android-filtro-que-bloqueia-chamadas-de-spam-automaticamente.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"Central Bank Budget Cuts Threaten Pix Security and Innovation","resumo":"The budget constraints faced by the Central Bank of Brazil could directly compromise the sustainability and evolution of Pix. Experts warn that a lack of investments puts cybersecurity infrastructure at risk and delays the rollout of new features. The scenario raises concerns in the financial sector regarding the stability of instant transactions in the country.","link":"https://www1.folha.uol.com.br/mercado/2026/07/cortes-no-orcamento-do-bc-ameacam-seguranca-e-inovacao-do-pix.shtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Silicon Valley Divided Over Closing Borders to Chinese AI","resumo":"Silicon Valley leaders and companies face an intense debate over restricting access to and collaboration with Chinese artificial intelligence technologies. While one faction advocates for a strict block citing national security, others argue that isolation harms global innovation. The standoff reflects growing geopolitical tensions between the two tech superpowers in the AI sector.","link":"https://oglobo.globo.com/google/amp/economia/tecnologia/noticia/2026/07/26/vale-do-silicio-se-divide-sobre-o-fechamento-das-fronteiras-para-a-ia-chinesa.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Folha de S.Paulo","pais":"Brazil","titulo":"US Tech Companies Cut 140,000 Jobs Despite AI Spending","resumo":"Major tech corporations in the United States have already laid off more than 140,000 workers this year to restructure their operations. Curiously, this wave of layoffs is occurring in parallel with billions in investments toward artificial intelligence development. The move highlights a profound strategic reorientation of the tech sector toward automation.","link":"https://www1.folha.uol.com.br/mercado/2026/07/grupos-de-tecnologia-dos-eua-cortam-140-mil-empregos-apesar-do-aumento-nos-gastos-com-ia.shtml","categoria":"TECH MARKET","lang":"en"},{"fonte":"Canal Rural","pais":"Brazil","titulo":"With Over 90% Accuracy Rate, Technology Identifies Drought-Tolerant Corn","resumo":"A new technological methodology has achieved accuracy rates above 90% in identifying corn strains more resistant to water stress. The innovation allows for the selection of seeds adapted to climate change in a much faster and more cost-effective way than traditional methods. The breakthrough promises to bolster food security and mitigate losses in agribusiness.","link":"https://www.canalrural.com.br/agricultura/com-mais-de-90-de-acerto-tecnologia-identifica-milho-mais-tolerante-a-seca/","categoria":"AGROTECH","lang":"en"},{"fonte":"G1","pais":"Brazil","titulo":"The Brazilian 'Caramelo': The Science Behind the Country's Most Beloved Mixed-Breed Dog","resumo":"Genetic and behavioral studies reveal the biological factors that make the yellow stray dog (‘vira-lata caramelo’) so resilient and popular in Brazil. The genetic diversity acquired over generations grants these animals greater adaptability to different environments and strong immunity. The research highlights the relevance of science in understanding urban fauna and the country's emotional heritage.","link":"https://g1.globo.com/google/amp/fantastico/video/caramelo-brasileiro-a-ciencia-por-tras-do-vira-lata-mais-amado-do-pais-14813550.ghtml","categoria":"SCIENCE","lang":"en"},{"fonte":"Valor Econômico","pais":"Brazil","titulo":"AI-Generated Video of Bolsonaro May Violate TSE Rules, Experts Say","resumo":"The circulation of AI-generated content simulating speeches by the former president has raised alarms among jurists and electoral experts. Current Superior Electoral Court (TSE) rules prohibit the use of deepfakes and simulations to deceive the electorate or jump-start campaigning. The case reinforces the urgency of rigorous oversight regarding the use of AI in Brazilian political disputes.","link":"https://valor.globo.com/politica/noticia/2026/07/26/vdeo-de-bolsonaro-em-ia-pode-contrariar-regra-do-tse-avaliam-especialistas.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Times Brasil | CNBC","pais":"Brazil","titulo":"Tilapia Leather Could Become a New Income Source and Boost the Creative Economy","resumo":"The reuse of tilapia skin is emerging as a sustainable, high-value-added alternative for the fashion and design industry. Tanning technologies transform a fish farming byproduct into a durable, flexible, and eco-friendly leather. The initiative fosters the local creative economy and opens new business opportunities in producing regions.","link":"https://timesbrasil.com.br/brasil/economia-brasileira/couro-tilapia-economia-criativa-morada-nova-minas/","categoria":"INNOVATION","lang":"en"},{"fonte":"Época Negócios","pais":"United States","titulo":"US Tech Companies Have Cut 140,000 Jobs This Year to Accelerate AI","resumo":"Major US tech companies have already eliminated roughly 140,000 jobs throughout this year. This massive restructuring reflects a profound strategic shift in the sector, aimed at redirecting financial resources toward artificial intelligence. Analysts point out that the pursuit of operational efficiency and the race for AI dominance are redefining market priorities. The move raises concerns about the future of the tech labor market in the face of process automation.","link":"https://epocanegocios.globo.com/tecnologia/noticia/2026/07/empresas-de-tecnologia-dos-eua-ja-cortaram-140-mil-empregos-neste-ano-enquanto-aceleram-investimentos-em-ia-diz-ft.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"timesofindia.indiatimes.com","pais":"United States","titulo":"Open Letter Featuring Executives Like Musk, Altman, and Pichai Warns About the Future of AI","resumo":"An open letter gathering top tech industry leaders, such as Satya Nadella, Sundar Pichai, Elon Musk, and Sam Altman, addresses the trajectory of artificial intelligence. The document highlights the urgent need to establish ethical and regulatory guidelines for the safe development of the technology. The initiative reflects a decisive moment in which the industry giants themselves are calling for cooperation to mitigate existential and economic risks. The impact of this stance promises to pressure global governments for stricter regulations in the coming years.","link":"https://timesofindia.indiatimes.com/technology/tech-news/read-letter-that-has-satya-nadella-sundar-pichai-elon-musk-jensen-huang-sam-altman-and-many-other-ceos-of-biggest-american-technology-companies-saying-this-has-our-full-support/articleshow/132652871.cms","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Vietnam.vn","pais":"United States","titulo":"Apple Glasses Could Be Announced at WWDC 2027 with Focus on Continuous Use","resumo":"New reports indicate that Apple plans to unveil its long-awaited smart glasses during the WWDC conference in 2027. The device promises to integrate wearable technology into users' routines with a proposal for uninterrupted all-day use. The Cupertino giant's strategy aims to create an even more immersive ecosystem, combining augmented reality and everyday artificial intelligence. Industry expectations are that the launch will firmly establish smart glasses as functional smartphone replacements.","link":"https://www.vietnam.vn/pt/cong-nghe-27-7-apple-glasses-co-the-ra-mat-tai-wwdc-2027","categoria":"LAUNCH","lang":"en"},{"fonte":"eeNews Europe","pais":"United States","titulo":"Intel and Lens Technology Team Up for Advanced AI Chip Packaging","resumo":"Intel has entered into a strategic partnership with Lens Technology to accelerate the development of advanced semiconductor packaging targeted at AI. The collaboration seeks to increase the efficiency and performance of new large-scale graphics processors and data accelerators. Through this alliance, Intel is strengthening its global supply chain in an attempt to outpace direct competitors in the microchip market. Technological advancements in these packaging structures are crucial to sustaining the growing demand for supercomputing.","link":"https://www.eenewseurope.com/en/intel-and-lens-technology-collaborate-on-advanced-ai-chip-packaging/","categoria":"HARDWARE","lang":"en"},{"fonte":"Technology Networks","pais":"United States","titulo":"Quantum Dot Technique Reveals Hidden Light Waves on Metal Surfaces","resumo":"Researchers have developed an innovative quantum dot-based imaging method capable of visualizing previously invisible light waves on metals. The discovery makes it possible to map nanoscale electromagnetic wave interactions with an unprecedented level of precision. This approach opens doors for the advancement of quantum photonics and the creation of vastly smaller and more efficient optical devices. Furthermore, the results hold immediate potential to transform the development of next-generation sensors and semiconductors.","link":"https://www.technologynetworks.com/tn/news/quantum-dot-imaging-technique-reveals-hidden-light-waves-on-metal-surfaces-414988","categoria":"SCIENCE","lang":"en"},{"fonte":"Technology Networks","pais":"United States","titulo":"Engineered Extracellular Vesicles Boost Cancer Detection Sensitivity","resumo":"Scientists have created bioengineered extracellular vesicles capable of significantly increasing sensitivity in cancer diagnostic tests. The new technique facilitates the early identification of tumor biomarkers in the bloodstream, enabling faster medical interventions. By improving the accuracy of liquid biopsies, the study paves the way for more personalized and less invasive treatments for patients. The innovation represents a promising milestone for diagnostic medicine and the continuous monitoring of tumor recurrences.","link":"https://www.technologynetworks.com/tn/news/engineered-extracellular-vesicles-boost-cancer-detection-sensitivity-414990","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Technology Networks","pais":"United States","titulo":"Organ-on-a-Chip Models Aid in the Dynamic Study of the Microbiome","resumo":"The use of organ-on-a-chip technologies is allowing scientists to analyze the behavior of the human microbiome under true dynamic conditions. The platform faithfully simulates the mechanical movements and cellular microenvironment of the gastrointestinal tract. As a result, researchers are able to observe how bacteria interact with biological tissues during digestion and disease development. This progress drives precision medicine forward and reduces the need for animal laboratory testing.","link":"https://www.technologynetworks.com/tn/articles/using-organ-on-a-chip-models-to-study-the-microbiome-in-motion-414975","categoria":"SCIENCE","lang":"en"},{"fonte":"Le Monde.fr","pais":"United States","titulo":"Political Opposition to Data Center Expansion Grows in the United States","resumo":"The rapid construction of new data centers to power artificial intelligence has become a topic of intense political debate in the United States.\nLocal residents and activists are criticizing excessive electricity and water consumption, as well as the impact on small-town infrastructure.\nFaced with public discontent, U.S. lawmakers are beginning to propose regulations and limits on the continuous expansion of these technological complexes.\nThe dilemma highlights the direct clash between the need for accelerated technological growth and the environmental sustainability of communities.","link":"https://www.lemonde.fr/economie/article/2026/07/27/aux-etats-unis-l-opposition-aux-data-centers-grandit-et-devient-un-objet-politique_6733571_3234.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Science et vie","pais":"France","titulo":"Revisiting Covid-19: From a Global Crisis to National Responses, Lessons from France, Brazil, and Portugal","resumo":"The Covid-19 pandemic demanded rapid and tailored responses from various governments around the world.\nA comparative study analyzes how France, Brazil, and Portugal structured their public health strategies and sanitary policies.\nThe analysis highlights lessons learned to improve the management of future global health crises and the role of science in these decisions.","link":"https://www.science-et-vie.com/corps-et-sante/retour-sur-le-covide2809119-dune-crise-globale-a-des-reponses-nationales-les-enseignements-de-la-france-du-bresil-et-du-portugal-250864.html","categoria":"HEALTH \u0026 SCIENCE","lang":"en"},{"fonte":"Clubic","pais":"France","titulo":"Volkswagen Promises Up to 50% Savings on Electric Cars: Is Such a Measure Possible in France?","resumo":"Volkswagen has announced new strategies promising to cut costs associated with the use and production of electric vehicles by up to half.\nExperts are analyzing whether this model of incentives and tariff reductions can be made viable in the French automotive market.\nThe measure reignites the debate on sustainable energy transition and the affordability of the electric fleet for European consumers.","link":"https://www.clubic.com/actualite-622798-volkswagen-promet-jusqu-a-50-d-economie-sur-une-voiture-electrique-un-tel-dispositif-est-il-possible-en-france.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Air\u0026Cosmos","pais":"France","titulo":"Global Space Economy: The Major Turning Points of 2025","resumo":"The global space sector is undergoing profound transformations driven by the advancement of private companies and new investments.\nThe year 2025 marks a turning point with the consolidation of new launch and orbital exploration technologies.\nFrance and Europe are seeking to ensure their sovereignty and competitiveness in the face of the growing dominance of global powers in the space ecosystem.","link":"https://air-cosmos.latribune.fr/article/espace/72087060413298/economie-spatiale-mondiale-les-grandes-bascules-de-2025","categoria":"AEROSPACE","lang":"en"},{"fonte":"ici.fr","pais":"France","titulo":"Romans-sur-Isère: 'From a Few Grams to 25 Tons,' Unique European Technology Launched by Framatome","resumo":"Framatome's facility in Romans-sur-Isère has inaugurated a pioneering technological installation for Europe's nuclear industry.\nThe new system allows for the scaling of complex industrial processes with high precision, jumping from micrograms to a ton-scale capacity.\nThe advancement strengthens the clean energy supply chain and reinforces the technological autonomy of the European energy sector.","link":"https://www.ici.fr/emissions/l-info-d-ici-ici-drome-ardeche/romans-sur-isere-de-quelques-grammes-a-25-tonnes-une-technologie-unique-en-europe-lancee-a-framatome-2733922","categoria":"INNOVATION","lang":"en"},{"fonte":"O GLOBO","pais":"France","titulo":"A Rival to Musk's SpaceX? Europe's Exploration Company Prepares $300 Million Funding Round","resumo":"European startup Exploration Company is negotiating a significant funding round to develop reusable space capsules.\nThe goal is to rival SpaceX's dominance and offer independent alternatives for cargo and crew transportation.\nThe initiative represents a crucial step toward strengthening the commercial competitiveness of Europe's aerospace sector.","link":"https://oglobo.globo.com/economia/noticia/2026/07/26/uma-rival-para-a-spacex-de-musk-europeia-exploration-company-se-prepara-para-levantar-us-300-milhoes-diz-ft.ghtml","categoria":"SPACE BUSINESS","lang":"en"},{"fonte":"Diocèse de Paris","pais":"France","titulo":"Artificial Intelligence: Is Science Catching Up with Science Fiction?","resumo":"Recent breakthroughs in generative models and computational autonomy are bringing Artificial Intelligence closer to science fiction scenarios.\nScientists and researchers are debating to what extent current capabilities represent a real leap toward artificial general intelligence.\nThe discussion addresses ethical dilemmas, social impacts, and the actual limits of technological evolution against rising expectations.","link":"https://dioceseparis.fr/ia-la-science-rattrape-t-elle-la.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Yahoo Finance UK","pais":"England","titulo":"Quantum Blockchain Wins Patent Approval for Bitcoin Mining Technology","resumo":"Quantum Blockchain has announced the approval of a foundational patent aimed at optimizing the Bitcoin mining process.\nThe new technology utilizes advanced algorithms to increase energy efficiency and processing speed within the crypto ecosystem.\nThis breakthrough strategically positions the company in the sector, offering sustainable solutions to the market's operational challenges.","link":"https://uk.finance.yahoo.com/news/quantum-blockchain-wins-patent-approval-063300314.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Retail Technology Innovation Hub","pais":"England","titulo":"Amazon's 'Just Walk Out' and Beerjet Tech Power Automated Bar at BP Pulse Live Arena","resumo":"The NEC Group's BP Pulse Live arena has implemented an innovative cashierless bar, combining Amazon's 'Just Walk Out' system with Beerjet UK.\nThe solution promises to eliminate waiting lines by allowing spectators to buy drinks simply by grabbing products and walking out of the venue.\nThe initiative represents a significant leap in modernizing events and utilizing automation and artificial intelligence in retail.","link":"https://retailtechinnovationhub.com/home/2026/7/26/amazon-just-walk-out-and-beerjet-uk-technology-powers-frictionless-bar-at-necs-bp-pulse-live-arena","categoria":"INNOVATION","lang":"en"},{"fonte":"Oxford Mail","pais":"England","titulo":"Oxford Biotech Raises £22 Million for Next-Gen Weed Control Technology","resumo":"An Oxford biotechnology startup has secured £22 million in funding to accelerate the development of agricultural solutions.\nThe project focuses on using next-generation technologies for targeted and eco-friendly weed control in crops.\nThe investment will drive commercial expansion and drastically reduce dependence on traditional chemical crop protection products.","link":"https://www.oxfordmail.co.uk/news/26403942.oxford-weed-control-technology-raises-22-million-investment/","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"Українська правда","pais":"England","titulo":"UK Prime Minister to Transfer Rights of 'Stone Cloak' Technology to Zelenskyy","resumo":"The UK Prime Minister has agreed to grant Ukraine access rights to the 'Stone Cloak' defense technology.\nThe agreement aims to strengthen Kyiv's military and technological capacity within the context of the current European geopolitical landscape.\nThe technology transfer highlights the strategic cooperation between the United Kingdom and Ukraine in adopting security innovations.","link":"https://www.pravda.com.ua/eng/news/2026/07/27/8046020/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Retail Technology Innovation Hub","pais":"England","titulo":"Rina Chotai Moves from Fashion to Football as VP of Technology at Aston Villa","resumo":"English club Aston Villa has announced the hiring of Rina Chotai as its new Vice President of Technology.\nHailing from the fashion sector, the executive will lead digital transformation, technological infrastructure, and innovations at the club's stadium.\nThe move reflects the sports sector's growing demand for leadership specialized in digital transformation management.","link":"https://retailtechinnovationhub.com/home/2026/7/26/rina-chotai-moves-from-fashion-to-football-as-she-takes-on-vp-of-technology-role-at-aston-villa","categoria":"CAREERS","lang":"en"},{"fonte":"Insider Media Ltd","pais":"England","titulo":"Smart Locker Company Licenses Technology to Operators in Belgium and the Netherlands","resumo":"A British smart locker specialist has expanded its European presence by licensing its technology in Belgium and the Netherlands.\nThe automated system facilitates last-mile delivery logistics, offering greater convenience and security to consumers.\nThe contract solidifies the expansion of automated delivery technology infrastructure in the European consumer market.","link":"https://www.insidermedia.com/news/south-east/smart-locker-business-licenses-technology-to-belgian-and-dutch-operators","categoria":"INNOVATION","lang":"en"},{"fonte":"Insider Media Ltd","pais":"England","titulo":"Technology Minerals Completes Retail Offer to Raise Funds","resumo":"Technology Minerals has successfully finalized a retail share offering with the goal of raising new financial capital.\nThe funds raised will be directed toward expanding its battery recycling and sustainable metal extraction operations.\nThe initiative aims to strengthen the supply chain of raw materials essential for the electric vehicle and energy markets.","link":"https://www.insidermedia.com/news/midlands/technology-minerals-completes-retail-offer-to-raise-funds","categoria":"BUSINESS","lang":"en"},{"fonte":"TradingView","pais":"England","titulo":"Science Group H1 Core Revenue Falls, but Company Expects Buybacks to Exceed £20 Million","resumo":"Science Group released its first-half results, indicating a slight decline in core technical consulting revenue.\nDespite the period's financial performance, the organization maintained confidence by projecting share buybacks exceeding £20 million.\nThe strategy reflects the company's cash solidity and its ongoing commitment to generating long-term value for the scientific sector.","link":"https://www.tradingview.com/news/reuters.com,2026:newsml_L1N43T062:0-uk-s-science-group-preliminary-h1-core-revenue-falls-expects-buyback-to-exceed-20-mln/","categoria":"SCIENCE","lang":"en"},{"fonte":"Xataka Móvil","pais":"Spain","titulo":"Buying tech or clothing is about to change in Europe due to a new mandatory QR code","resumo":"The European Union is preparing to implement a new digital product passport accessible via a QR code.\nThis measure will significantly change how consumers purchase items like clothing and consumer electronics.\nThe goal is to guarantee total transparency regarding the origin, sustainability, and recyclability of the materials used.\nThe initiative promises to transform commerce on the continent by prioritizing the circular economy and conscious consumption.","link":"https://www.xatakamovil.com/mercado/comprar-tecnologia-ropa-esta-a-punto-cambiar-europa-culpa-tiene-nuevo-codigo-qr-obligatorio","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"20Minutos","pais":"Spain","titulo":"The new XPeng L03 arrives in Europe featuring rare technology in the market","resumo":"Chinese electric vehicle manufacturer XPeng is officially launching the L03 model in the European market.\nThe car stands out for integrating advanced autonomous driving systems and ultra-fast charging architecture.\nThis arrival intensifies competition in the continent's automotive sector, challenging traditional brands.\nWith cutting-edge technological features, the model seeks to consolidate the presence of Eastern brands in the West.","link":"https://www.20minutos.es/motor/coches/nuevo-xpeng-l03-llega-europa-google-integrado-tecnologia-muy-pocos-ofrecen_7017607_0.html","categoria":"INNOVATION","lang":"en"},{"fonte":"OkDiario","pais":"Spain","titulo":"Researchers in the Canary Islands use shrimp and crab shells to capture CO2","resumo":"Bio-organic scientists from the Canary Islands have developed an innovative carbon capture method.\nThe technique uses chitosan, a substance extracted from discarded shrimp and crab shells.\nThe material captures industrial CO2 emissions before they reach and pollute the Earth's atmosphere.\nThe solution combines sustainability and circular economy to directly combat global climate change.","link":"https://okdiario.com/ciencia/investigadores-bio-organicos-canarios-utilizan-residuos-gambas-cangrejos-capturar-co2-antes-que-llegue-atmosfera-19044033","categoria":"SCIENCE","lang":"en"},{"fonte":"La Vanguardia","pais":"Spain","titulo":"Multiverse Computing finalizes 500 million funding round to drive efficient AI","resumo":"Spanish startup Multiverse Computing is close to closing a multi-million dollar investment contribution.\nThe funds will be allocated to the development of low energy-consumption artificial intelligence solutions.\nThe company aims to reduce high operating costs and the massive carbon footprint of traditional AI models.\nThe achievement positions Spain as one of the major hubs for deep tech and innovation in Europe.","link":"https://www.lavanguardia.com/dinero/20260727/11601507/multiverse-computing-ultima-ronda-500-millones-impulsar-tecnologia-ia-eficiente.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Confidencial Digital","pais":"Spain","titulo":"Salto Systems valued at 1.5 billion euros: the impact on the Spanish economy","resumo":"The Spanish company specializing in smart access control systems has reached unicorn status.\nThe billion-dollar valuation highlights the strong growth of the tech ecosystem in the Basque Country and across all of Spain.\nThis milestone attracts new international investments and strengthens the corporate digital security sector in the region.\nAnalysts point to the case as a success model for the expansion of industrial tech scale-ups.","link":"https://www.elconfidencialdigital.com/articulo/dinero/salto-systems-valorada-1500-millones-que-significa-economia-vasca-espanola/202607270720131033216.html","categoria":"BUSINESS","lang":"en"},{"fonte":"Canarias7","pais":"Spain","titulo":"Science confirms: the time you eat is just as important as the food itself","resumo":"Recent scientific studies reinforce the impact of chrononutrition and circadian rhythms on human health.\nResearchers point out that aligning meals with biological schedules significantly improves the metabolization of nutrients.\nEating at inappropriate times can increase metabolic risks, such as insulin resistance and weight gain.\nThe discovery changes how experts approach diets, highlighting the biological clock as a key factor.","link":"https://www.canarias7.es/gastronomia-c7/reloj-come-hora-comidas-importa-20260727070000-nt.html","categoria":"SCIENCE","lang":"en"},{"fonte":"El Economista","pais":"Spain","titulo":"Tariffs slow down trade, but fail to curb Chinese innovation","resumo":"Trade barriers imposed by Western powers have altered the flow of international commerce.\nDespite sanctions and high tariffs, technological advancement and research in China maintain a rapid pace.\nThe scenario demonstrates that geopolitical rivalry is driving scientific self-sufficiency in the Asian country.\nThe phenomenon forces a reconfiguration in global supply chains and the development o
