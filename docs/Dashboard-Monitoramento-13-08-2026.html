cas permitiram diferenciar o anfíbio de outras espécies conhecidas.\nO achado evidencia a importância da preservação ambiental para a pesquisa científica e a conservação.","link":"https://revistagalileu.globo.com/google/amp/ciencia/noticia/2026/08/nova-especie-de-ra-e-descoberta-em-floresta-inundada-da-amazonia.ghtml","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"www.gov.br","pais":"Brasil","titulo":"Chuva de meteoros Perseidas atravessa o céu do Brasil","resumo":"O fenômeno astronômico da chuva de meteoros Perseidas pôde ser observado em diversas regiões do Brasil.\nO evento ocorre anualmente quando a Terra atravessa a esteira de detritos deixada pelo cometa Swift-Tuttle.\nA passagem dos meteoros mobilizou cientistas e entusiastas da astronomia em todo o país.\nA divulgação do evento pelo ministério busca incentivar o interesse da população pela ciência e observação espacial.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/chuva-de-meteoros-perseidas-atravessa-o-ceu-do-pais","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Tua Saúde","pais":"Brasil","titulo":"Como o estresse afeta o microbioma intestinal e o que a ciência revela sobre essa conexão","resumo":"Estudos científicos recentes detalham os mecanismos pelos quais o estresse altera a flora intestinal.\nA conexão entre cérebro e sistema digestivo demonstra como o estado emocional impacta a saúde física.\nOs achados abrem caminho para novas abordagens terapêuticas integrando saúde mental e gastroenterologia.\nA pesquisa reforça a relevância da medicina preventativa e do cuidado holístico com o organismo.","link":"https://www.tuasaude.com/es/news/2026/08/13/como-el-estres-afecta-al-microbioma-intestinal-y-que-revela-la-ciencia-sobre-esta-conexion/","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"EL PAÍS","pais":"Brasil","titulo":"Brasil usa a ciência forense para combater a mineração ilegal","resumo":"Autoridades brasileiras implementaram técnicas avançadas de ciência forense para rastrear a origem do ouro.\nA metodologia analisa a assinatura química e geológica do minério para identificar garimpos ilegais.\nO uso de tecnologia científica fortalece o trabalho de fiscalização e proteção dos ecossistemas amazônicos.\nA iniciativa representa um importante avanço no combate a crimes ambientais no território nacional.","link":"https://elpais.com/america-futura/2026-08-13/brasil-usa-la-ciencia-forense-para-combatir-la-mineria-ilegal.html","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"Saiba como liberar até 10 GB de memória no WhatsApp com um recurso oculto","resumo":"Uma funcionalidade do WhatsApp permite aos usuários gerenciar o armazenamento do aplicativo de forma eficiente.\nA ferramenta identifica e facilita a exclusão de arquivos pesados acumulados em conversas e grupos.\nA otimização do espaço melhora o desempenho do smartphone sem necessidade de instalar aplicativos externos.\nO recurso é essencial para quem utiliza a plataforma diariamente e enfrenta problemas de memória no dispositivo.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/13/saiba-como-liberar-ate-10-gb-de-memoria-no-whatsapp-com-um-recurso-oculto.ghtml","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"O GLOBO","pais":"Brasil","titulo":"DENZA acelera eletrificação no Brasil com tecnologia Flash Charging","resumo":"A marca DENZA anunciou a introdução da tecnologia de recarga ultrarrápida Flash Charging no mercado brasileiro.\nA novidade reduz significativamente o tempo necessário para carregar baterias de veículos elétricos.\nA expansão dessa infraestrutura visa impulsionar a adoção da mobilidade sustentável no país.\nA iniciativa posiciona o setor automotivo nacional em sintonia com as tendências globais de eletrificação.","link":"https://oglobo.globo.com/google/amp/conteudo-de-marca/casacor/noticia/2026/08/12/denza-acelera-eletrificacao-no-brasil-com-tecnologia-flash-charging.ghtml","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"bloomberg.com","pais":"Estados Unidos","titulo":"Anthropic negocia aquisição da startup Decart por 6 bilhões de dólares","resumo":"A gigante de inteligência artificial Anthropic está em negociações avançadas para adquirir a startup Decart em um acordo avaliado em 6 bilhões de dólares.\nA transação destaca o ritmo acelerado de consolidação e os vultosos investimentos que moldam o ecossistema global de tecnologia.\nSe concretizada, a compra deve fortalecer significativamente a infraestrutura de modelos e a competitividade da Anthropic contra rivais do setor.","link":"https://www.bloomberg.com/news/articles/2026-08-13/anthropic-said-in-talks-to-buy-ai-startup-decart-for-6-billion","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Empire State Development (.gov)","pais":"Estados Unidos","titulo":"Nova York lança seleção para criar polos regionais de tecnologia quântica","resumo":"A governadora de Nova York anunciou o início do processo de seleção para estabelecer polos regionais focados na comercialização de tecnologia quântica.\nA iniciativa busca acelerar a transição de pesquisas científicas avançadas do ambiente acadêmico para aplicações práticas de mercado.\nO projeto visa consolidar o estado como um centro global de inovação tecnológica, atraindo investimentos e talentos qualificados.","link":"https://esd.ny.gov/esd-media-center/press-releases/governor-hochul-announced-launch-selection-process-regional-quantum","categoria":"TECNOLOGIA QUÂNTICA","lang":"pt"},{"fonte":"BioSpace","pais":"Estados Unidos","titulo":"Tecnologia robótica CyberKnife rastreia tumores em tempo real durante a respiração","resumo":"O sistema robótico CyberKnife utiliza avanços de precisão tecnológica para monitorar e rastrear tumores em tempo real durante procedimentos médicos.\nA ferramenta ajusta dinamente a entrega da radiação conforme a movimentação respiratória do paciente durante o tratamento.\nEssa abordagem minimiza os danos aos tecidos saudáveis circundantes e eleva significativamente a eficácia e segurança da radioterapia.","link":"https://www.biospace.com/press-releases/robotic-technology-at-medicana-cyberknife-tracks-tumors-in-real-time-and-adjusts-radiation-as-patients-breathe","categoria":"MEDICINA ROBÓTICA","lang":"pt"},{"fonte":"Cardiovascular Business","pais":"Estados Unidos","titulo":"Tecnologia de gêmeos digitais da Duke revoluciona avaliações hemodinâmicas","resumo":"Pesquisadores da Universidade Duke desenvolveram uma plataforma baseada em gêmeos digitais direcionada para análise hemodinâmica avançada.\nA tecnologia cria simulações virtuais altamente precisas do sistema circulatório cardiovascular de cada paciente específico.\nA inovação promete personalizar tratamentos médicos complexos, otimizando decisões clínicas e reduzindo a necessidade de procedimentos invasivos.","link":"https://cardiovascularbusiness.com/topics/patient-care/care-delivery/dukes-digital-twin-technology-could-take-hemodynamic-assessments-whole-other-level","categoria":"SAÚDE DIGITAL","lang":"pt"},{"fonte":"Goldman Sachs","pais":"Estados Unidos","titulo":"A Segunda Era Espacial: Como mercados, tecnologia e poder moldam o cosmos","resumo":"A exploração espacial passa por uma transformação profunda impulsionada pela convergência de investimentos privados e novas tecnologias.\nA ascensão da economia espacial comercial remodela o acesso à órbita terrestre e redefine a corrida por recursos além do planeta.\nEssa dinâmica inaugura uma nova era com forte impacto na segurança global, pesquisa científica e novos mercados de inovação.","link":"https://www.goldmansachs.com/insights/articles/the-second-space-age-how-markets-technology-and-power-are-reshaping-the-final-frontier","categoria":"EXPLORAÇÃO ESPACIAL","lang":"pt"},{"fonte":"Southern Farm Network","pais":"Estados Unidos","titulo":"Inteligência Artificial é o foco principal de desafio de ciência agrícola nos EUA","resumo":"O desafio nacional de ciência e tecnologia agrícola dos Estados Unidos definiu a inteligência artificial como seu pilar central de desenvolvimento.\nA iniciativa busca impulsionar soluções inovadoras para otimizar o cultivo de precisão, prever safras e aumentar a resiliência no campo.\nO movimento destaca como a convergência entre IA e agronegócio é fundamental para responder às crescentes demandas alimentares globais.","link":"https://www.sfntoday.com/2026/08/13/ai-the-focus-of-national-ag-science-and-tech-challenge/","categoria":"AGRITECH","lang":"pt"},{"fonte":"Le Monde.fr","pais":"Estados Unidos","titulo":"Governo dos EUA cancela relatório de referência sobre ciência climática no Ártico","resumo":"A administração governamental norte-americana determinou o cancelamento de um importante relatório científico sobre o impacto climático no Ártico.\nA medida gera fortes preocupações entre cientistas e órgãos ambientais sobre o retrocesso no monitoramento das mudanças globais.\nO cancelamento reflete disputas políticas que impactam diretamente a transparência e a continuidade de pesquisas científicas estratégicas.","link":"https://www.lemonde.fr/planete/article/2026/08/13/l-administration-trump-annule-un-rapport-de-reference-sur-l-arctique-une-nouvelle-atteinte-a-la-science-du-climat-aux-etats-unis_6745334_3244.html","categoria":"CIÊNCIA CLIMÁTICA","lang":"pt"},{"fonte":"Yahoo Finance","pais":"Estados Unidos","titulo":"Micron Technology enfrenta novos desafios na corrida por hardware para IA","resumo":"A Micron Technology busca expandir sua atuação na produção de memórias de alta largura de banda, essenciais para semicondutores de IA.\nA empresa enfrenta forte concorrência no setor de hardware avançado enquanto busca manter sua vantagem competitiva no mercado.\nO posicionamento da companhia reflete as intensas exigências de infraestrutura decorrentes do crescimento acelerado da inteligência artificial.","link":"https://finance.yahoo.com/technology/ai/articles/micron-technology-mu-against-ai-051413807.html","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"Zonebourse Suisse","pais":"França","titulo":"Economia britânica registra crescimento inesperado de 0,3% em junho, segundo o ONS","resumo":"O Office for National Statistics (ONS) informou um crescimento surpreendente do PIB britânico.\nO resultado de 0,3% em junho superou as expectativas dos analistas do mercado financeiro.\nEsse avanço traz novos desdobramentos para as perspectivas econômicas e políticas monetárias na Europa.","link":"https://ch.zonebourse.com/actualite-bourse/l-economie-britannique-enregistre-une-croissance-inattendue-de-0-3-en-juin-selon-l-ons-ce7859d9db8bfe20","categoria":"ECONOMIA","lang":"pt"},{"fonte":"chinanews.com.cn","pais":"França","titulo":"Onda de calor deste verão na França pode causar prejuízos de mais de 10 bilhões de euros","resumo":"A intensa onda de calor que atinge a França durante este verão gera graves impactos econômicos e sociais.\nEstima-se que os prejuízos ultrapassem dez bilhões de euros em setores chave da infraestrutura do país.\nO fenômeno climático extremo acende o alerta para a necessidade urgente de adaptação e sustentabilidade.","link":"https://www.chinanews.com.cn/gj/shipin/2026/08-13/news1065271.shtml","categoria":"CLIMA","lang":"pt"},{"fonte":"Investing.com France","pais":"França","titulo":"Diretor da GigaCloud Technology cede ações no valor de 259.400 dólares","resumo":"O diretor da empresa de tecnologia GigaCloud efetuou a venda de um lote de ações corporativas.\nA transação financeira movimentou aproximadamente 259,4 mil dólares no mercado acionário.\nEssa movimentação de executivos é acompanhada de perto por investidores e analistas do setor tecnológico.","link":"https://fr.investing.com/news/insider-trading-news/le-directeur-de-gigacloud-technologie-bernes-cede-des-actions-pour-259400-93CH-3554369","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Investing.com France","pais":"França","titulo":"Presidente da GigaCloud Technology vende ações no valor de 346.696 dólares","resumo":"O presidente da GigaCloud Technology realizou a venda de uma fatia de suas ações na empresa.\nA operação de liquidação envolveu o montante total de 346.696 dólares no mercado financeiro.\nO movimento reflete ajustes de patrimônio de executivos da companhia de tecnologia de nuvem.","link":"https://fr.investing.com/news/insider-trading-news/le-president-de-gigacloud-technologie-vend-des-actions-pour-346696-93CH-3554371","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"ロイター","pais":"França","titulo":"Onda de calor na França pode causar perdas de até 15 bilhões de euros devido a incêndios e danos agrícolas","resumo":"O ministro do Meio Ambiente da França alertou para perdas econômicas gigantescas provocadas pela onda de calor.\nIncêndios florestais e graves danos à agricultura podem fazer os prejuízos atingirem 15 bilhões de euros.\nA crise ambiental evidencia a urgência de estratégias mais eficazes no combate às mudanças climáticas na região.","link":"https://jp.reuters.com/economy/KGSQUD7QBBOQFOJACDMV6YMKUQ-2026-08-13/","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"Sortir à Paris","pais":"França","titulo":"Festa da Ciência 2026 em Courbevoie: o Festival Atmosphères conecta cinema, artes e ciências","resumo":"A Festa da Ciência de 2026 em Courbevoie apresenta mais uma edição do aclamado Festival Atmosphères.\nO evento gratuito une cinema, expressões artísticas e discussões científicas voltadas à sustentabilidade.\nA iniciativa busca aproximar o grande público das descobertas científicas e da conscientização ambiental.","link":"https://www.sortiraparis.com/pt/crianca-familia/articles/350385-festa-da-ciencia-2026-em-courbevoie-o-festival-atmospheres-mistura-cinema-artes-e-ciencias","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Sortir à Paris","pais":"França","titulo":"Festa da Ciência 2026: programação de atividades científicas em Issy-les-Moulineaux","resumo":"Issy-les-Moulineaux divulga sua programação oficial para a aguardada Festa da Ciência de 2026.\nA cidade receberá workshops, oficinas interativas e palestras científicas abertas para todas as idades.\nO objetivo principal do evento é democratizar o acesso ao conhecimento e estimular o interesse pela inovação.","link":"https://www.sortiraparis.com/pt/noticias/em-paris/articles/333179-festa-da-ciencia-2026-o-programa-das-atividades-cientificas-em-issy-les-moulineaux-92","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Yachting World","pais":"Inglaterra","titulo":"Visita à fábrica da Ferrari em Maranello mostra como a tecnologia de supercarros está revolucionando a navegação","resumo":"A tradicional fabricante italiana Ferrari está aplicando seus conhecimentos avançados de engenharia automotiva na navegação marítima de alta performance.\nA transferência de tecnologias de ponta, como aerodinâmica complexa e materiais ultraleves, promete transformar a eficiência dos barcos a vela.\nEspecialistas destacam que a colaboração entre o setor automobilístico e naval abre novas fronteiras para a inovação esportiva.\nA iniciativa demonstra o potencial de expansão das tecnologias de corrida para outras indústrias sustentáveis e de alto desempenho.","link":"https://www.yachtingworld.com/homepage/i-visited-the-ferrari-factory-on-maranello-to-see-how-their-supercar-technology-is-revolutionising-sailing-163763","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Taiwan afirma ter sido atingida por ciberataste 'anormal' auxiliado por inteligência artificial","resumo":"O governo de Taiwan relatou ter enfrentado um ataque cibernético de proporções atípicas otimizado por algoritmos de inteligência artificial.\nAutoridades locais alertam que o uso de IA por hackers torna as ameaças significativamente mais rápidas e difíceis de mitigar.\nO incidente coloca em evidência a crescente militarização do espaço digital e a urgência de defesas tecnológicas mais robustas.\nEspecialistas internacionais acompanham o caso como um marco nas novas ameaças virtuais na região do Indo-Pacífico.","link":"https://www.theguardian.com/technology/2026/aug/13/taiwan-ai-assisted-cyber-attacks-overseas","categoria":"CIBERSEGURANÇA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"Agentes de IA não são legalmente responsáveis por danos causados, dizem especialistas","resumo":"Com o avanço dos sistemas autônomos de inteligência artificial, juristas debatem sobre quem deve responder civil e penalmente por falhas graves.\nAtualmente, a legislação não reconhece personalidade jurídica para softwares, deixando a responsabilidade entre desenvolvedores e usuários.\nA lacuna regulatória levanta preocupações urgentes à medida que sistemas autônomos tomam decisões críticas em diversos setores.\nEspecialistas defendem a criação de novos quadros regulatórios internacionais para definir limites e obrigações no uso dessas tecnologias.","link":"https://www.theguardian.com/technology/2026/aug/13/ai-agents-arent-legally-responsible-for-any-harm-that-they-cause-experts-say-so-who-is","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"BBC","pais":"Inglaterra","titulo":"Usuários da Twitch agora podem bloquear a Amazon de usar seu conteúdo para treinar IA","resumo":"A plataforma de transmissão ao vivo Twitch implementou uma nova opção de privacidade para proteger os criadores de conteúdo.\nA ferramenta permite que os usuários proíbam expressamente a Amazon de utilizar suas transmissões e dados para o treinamento de modelos de IA.\nA medida atende a crescentes reivindicações da comunidade sobre direitos autorais, consentimento e propriedade intelectual na era digital.\nA decisão pode pressionar outras gigantes da tecnologia a adotarem mecanismos semelhantes de proteção aos dados dos usuários.","link":"https://www.bbc.com/news/articles/cp30pz8d09jo","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"The Guardian","pais":"Inglaterra","titulo":"EJ Swift vence o prêmio Arthur C. Clarke de ficção científica de 2026","resumo":"A autora EJ Swift foi anunciada como a grande vencedora do prestigiado prêmio Arthur C. Clarke de ficção científica de 2026.\nSua obra destacou-se pela abordagem profunda e inovadora sobre temas urgentes como mudanças climáticas e o futuro da humanidade.\nO prêmio é reconhecido mundialmente por consagrar obras literárias que exploram o impacto da ciência na sociedade.\nA vitória consolida a escritora como uma das vozes mais influentes do gênero ficcional contemporâneo.","link":"https://www.theguardian.com/books/2026/aug/12/ej-swift-wins-the-2026-arthur-c-clarke-award-for-science-fiction","categoria":"LITERATURA","lang":"pt"},{"fonte":"GOV.UK","pais":"Inglaterra","titulo":"Pacientes terão acesso mais rápido a remédios com a redução de testes em animais no Reino Unido","resumo":"O Reino Unido iniciou uma transição histórica no setor científico ao substituir testes em animais por métodos alternativos avançados.\nTecnologias como órgãos em chips e simulações por computador prometem acelerar significativamente a aprovação de novos medicamentos no país.\nA iniciativa visa não apenas elevar os padrões éticos da pesquisa, mas também aumentar a precisão dos ensaios clínicos.\nA mudança posiciona a nação na vanguarda da inovação biotecnológica e farmacêutica global.","link":"https://www.gov.uk/government/news/patients-to-benefit-from-faster-access-to-medicines-as-uk-moves-away-from-animal-testing-in-science","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"GOV.UK","pais":"Inglaterra","titulo":"Reino Unido e Austrália reforçam tecnologia de radar e cooperação industrial","resumo":"O Reino Unido e a Austrália anunciaram um fortalecimento na parceria militar e tecnológica focada no desenvolvimento de radares avançados.\nO acordo foi consolidado durante a visita do ministro da Defesa britânico a parceiros estratégicos da região do Indo-Pacífico.\nA colaboração visa impulsionar a inovação industrial e aprimorar a capacidade de vigilância e segurança de ambas as nações.\nO projeto reforça alianças geopolíticas cruciais em um momento de crescentes reconfigurações defensivas globais.","link":"https://www.gov.uk/government/news/uk-and-australia-boost-radar-technology-and-industry-cooperation-as-defence-minister-visits-indo-pacific-partners","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Reuters","pais":"Inglaterra","titulo":"PIB do Reino Unido se recupera em junho impulsionado por trégua no Golfo, Copa do Mundo e clima favorável","resumo":"A economia do Reino Unido apresentou uma recuperação inesperada no mês de junho, superando projeções estagnadas anteriores.\nO desempenho positivo foi impulsionado pelo aumento do consumo durante a Copa do Mundo, o clima ensolarado e a trégua nos conflitos no Golfo.\nO setor de serviços e o comércio varejista registraram forte alta no período, beneficiados pelo otimismo temporário dos consumidores.\nApesar da melhora pontual, analistas mantêm cautela em relação às perspectivas econômicas globais para o restante do ano.","link":"https://www.reuters.com/world/uk/uk-economy-unexpectedly-grows-by-03-june-ons-says-2026-08-13/","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"La Razón","pais":"Espanha","titulo":"Quase 16.000 espelhos apontando para o mesmo ponto: China conclui a usina termossolar mais alta do mundo","resumo":"A China finalizou a construção da usina termossolar mais alta do planeta, uma obra impressionante equipada com cerca de 16 mil espelhos focados em um único ponto. Com capacidade de 100 MW, o sistema utiliza sais fundidos para armazenar calor e continuar gerando energia elétrica limpa mesmo durante a noite.\nA conquista representa um avanço expressivo para a infraestrutura global de energia sustentável e tecnologia de armazenamento térmico.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/casi-16000-espejos-apuntando-mismo-punto-china-remata-termosolar-alta-planeta-100-mw-sales-fundidas-dar-luz-noche_202608136a7ce0bba046ad6ebcae1f2d.html","categoria":"ENERGIA RENOVÁVEL","lang":"pt"},{"fonte":"El Mundo","pais":"Espanha","titulo":"LaLiga estreia bola conectada: a nova tecnologia que promete detectar toques duplos, mão e impedimentos","resumo":"A principal liga de futebol da Espanha está introduzindo uma bola inteligente equipada com sensores de alta precisão para auxiliar a arbitragem em tempo real. A tecnologia é capaz de identificar instantaneamente contatos imperceptíveis, como dois toques na bola, toques de mão e posições irregulares de impedimento.\nEssa inovação busca reduzir polêmicas nas partidas e aumentar a precisão de decisões cruciais ao longo do campeonato.","link":"https://www.elmundo.es/deportes/futbol/primera-division/2026/08/12/6a7c92b2e4d4d8c9378b458a.html","categoria":"TECNOLOGIA ESPORTIVA","lang":"pt"},{"fonte":"Motor16","pais":"Espanha","titulo":"Ford Pro AI: A tecnologia que promete economizar 23 horas por semana na gestão de frotas","resumo":"A Ford apresentou o Ford Pro AI, uma ferramenta avançada projetada para otimizar drasticamente a rotina de quem administra frotas de veículos comerciais. Ao automatizar a análise de dados de telemetria, rotas e necessidades de manutenção preventivas, a solução promete economizar até 23 horas semanais dos gestores.\nO recurso reflete o impacto direto da inteligência artificial na eficiência operacional e logística do setor automotivo.","link":"https://www.motor16.com/las-ultimas-noticias/ford-pro-ai-23-horas-flotas/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"20Minutos","pais":"Espanha","titulo":"Os sete minutos em que a Espanha escureceu para que a ciência brilhasse: um eclipse histórico","resumo":"Um eclipse solar histórico mobilizou cientistas e entusiastas em toda a Espanha, transformando o país em um verdadeiro laboratório a céu aberto por sete minutos. O raro fenômeno astronômico uniu a população e permitiu a coleta de dados inéditos sobre a atmosfera solar e o comportamento do clima.\nAlém do espetáculo visual inesquecível, o evento destacou a importância da pesquisa astronômica e do engajamento científico nacional.","link":"https://www.20minutos.es/nacional/los-siete-minutos-los-que-espana-se-apago-punta-punta-para-que-brillase-ciencia-un-eclipse-historico-que-unio-todo-un-pais_7025252_0.html","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"Bolsamania","pais":"Espanha","titulo":"União Europeia aplica novas regras para que carros tenham 25% de plástico reciclado em 10 anos","resumo":"Entraram em vigor as diretrizes da União Europeia que exigem das montadoras a inclusão de pelo menos 25% de plástico reciclado na fabricação de novos veículos dentro de uma década. A medida visa acelerar a transição da indústria automotiva para um modelo de economia circular e diminuir o impacto ambiental.\nA exigência deve impulsionar inovações no desenvolvimento de novos materiais tecnológicos e processos de reciclagem veicular.","link":"https://www.bolsamania.com/noticias/ultimas/economiamotor--la-ue-aplica-desde-hoy-las-reglas-para-que-los-coches-tengan-un-25-de-plastico-reciclado-en-10-anos--23252349.html","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"Driving ECO","pais":"Espanha","titulo":"Ranking 2026: Os SUVs premium com a melhor tecnologia de assistência ao motorista à venda na Espanha","resumo":"Um novo levantamento destacou os utilitários esportivos de luxo que oferecem os sistemas mais avançados de assistência ao condutor disponíveis no mercado espanhol. Os modelos avaliados contam com recursos de condução semiautônoma, frenagem de emergência aprimorada por inteligência artificial e monitoramento 360 graus.\nO ranking evidencia o ritmo acelerado de inovação nos sistemas de segurança ativa da frota automotiva moderna.","link":"https://www.drivingeco.com/pt/Ranking-de-2026-dos-SUVs-premium-com-a-melhor-tecnologia-de-assist%C3%AAncia-ao-condutor/","categoria":"TECNOLOGIA AUTOMOTIVA","lang":"pt"},{"fonte":"El Debate","pais":"Espanha","titulo":"Quando a Espanha voltará a presenciar um eclipse solar como o deste ano","resumo":"Após o marcante evento astronômico de agosto, especialistas projetam as datas e os locais exatos em que novos eclipses solares totais e anulares poderão ser vistos na Espanha. O planejamento prévio é fundamental tanto para a comunidade científica preparar experimentos de alta precisão quanto para o turismo astrológico nacional.\nA análise ressalta a raridade desses ciclos cósmicos e o interesse crescente do público pela observação espacial.","link":"https://www.eldebate.com/ciencia/20260813/cuando-volvera-repetirse-espana-eclipse-como-este-12-agosto_448939.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"elDiario.es","pais":"Espanha","titulo":"OMODA 7 SHS Híbrido Plug-in: quando o design se une à tecnologia","resumo":"A fabricante OMODA apresentou oficialmente o modelo 7 SHS, um veículo híbrido plug-in que combina linguagem de design futurista com alta eficiência energética. Equipado com motorização avançada e sistemas inteligentes de conectividade interna, o modelo busca conquistar o mercado europeu de utilitários ecológicos.\nO lançamento reforça a expansão de marcas focadas em mobilidade sustentável e tecnologia veicular de ponta.","link":"https://www.eldiario.es/motor/novedades/omoda-7-shs-hibrido-enchufable-diseno-une-tecnologia_1_13439717.html","categoria":"AUTOMÓVEIS","lang":"pt"},{"fonte":"WEB.DE","pais":"Alemanha","titulo":"Alemanha reforça massivamente seus serviços de inteligência","resumo":"A Alemanha está promovendo uma modernização e expansão significativa de suas agências e serviços de inteligência.\nA iniciativa visa reforçar a segurança nacional e a capacidade de resposta cibernética frente a crescentes ameaças geopolíticas globais.\nO investimento estratégico reflete uma mudança de postura do país na proteção de dados e infraestruturas críticas.","link":"https://web.de/magazine/politik/videos/deutschland-ruestet-geheimdienste-massiv-42608192","categoria":"SEGURANÇA","lang":"pt"},{"fonte":"CHEMIE TECHNIK","pais":"Alemanha","titulo":"Topsoe fornece tecnologia para projeto de amônia verde no Texas","resumo":"A empresa Topsoe foi selecionada para fornecer tecnologia avançada de descarbonização em um grande projeto de amônia verde no Texas.\nA iniciativa busca substituir fontes de energia fósseis por alternativas renováveis em escala industrial, reduzindo emissões de carbono.\nEsse avanço fortalece o mercado global de combustíveis limpos e impulsiona a transição energética sustentável.","link":"https://www.chemietechnik.de/energie-umwelt/topsoe-liefert-technologie-fuer-gruenes-ammoniak-projekt-in-texas/2717758","categoria":"TECNOLOGIA VERDE","lang":"pt"},{"fonte":"Zeitungsverlag Waiblingen","pais":"Alemanha","titulo":"Pílula de emagrecimento chega às farmácias alemãs: um panorama","resumo":"Os novos comprimidos para perda de peso começam a ser disponibilizados nas farmácias da Alemanha, oferecendo uma alternativa oral aos tratamentos injetáveis.\nA novidade médica promete transformar o tratamento da obesidade e de distúrbios metabólicos no país.\nEspecialistas acompanham o impacto do lançamento no sistema de saúde e na rotina dos pacientes.","link":"https://www.zvw.de/mehr-nachrichten/wissenschaft/abnehmtablette-kommt-in-deutsche-apotheken-ein-%C3%BCberblick_arid-1094261","categoria":"CIÊNCIA E SAÚDE","lang":"pt"},{"fonte":"Volksstimme","pais":"Alemanha","titulo":"E-Sports na Alemanha: Gamers disputam a 'FC 26 Community Cup' em Wolmirstedt","resumo":"A região de Börde, na Alemanha, recebe o torneio de e-sports 'FC 26 Community Cup', reunindo jogadores locais para disputas do famoso jogo de futebol digital.\nO evento busca fortalecer a comunidade gamer regional e promover o crescimento dos esportes eletrônicos em nível municipal.\nA competição reflete a popularização contínua dos torneios virtuais entre jovens e entusiastas da tecnologia.","link":"https://www.volksstimme.de/lokal/wolmirstedt/wer-ist-der-beste-gamer-konnen-sich-beim-fc-26-community-cup-in-wolmirstedt-messen-4300587","categoria":"GAMES","lang":"pt"},{"fonte":"BornCity","pais":"Alemanha","titulo":"Avery L7160: 21 etiquetas por folha com tecnologia Quick-Peel","resumo":"A linha de produtos de escritório destaca as etiquetas Avery L7160, desenvolvidas com a inovadora tecnologia Quick-Peel para facilitar a remoção rápida.\nA solução visa otimizar processos logísticos e de organização corporativa, aumentando a produtividade em ambientes de trabalho.\nO design técnico garante compatibilidade perfeita com impressoras a laser convencionais.","link":"https://borncity.com/news/avery-l7160-21-etiketten-pro-blatt-mit-quick-peel-technologie/","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"DW.com","pais":"Alemanha","titulo":"Seca no rio Reno paralisa navegação e impacta a economia alemã","resumo":"A severa diminuição do nível de água no rio Reno está interrompendo o transporte de cargas e matérias-primas cruciais para a indústria alemã.\nOs gargalos na navegação afetam diretamente as cadeias de suprimento e pressionam os custos operacionais no setor produtivo.\nO cenário acende o alerta para os impactos das mudanças climáticas no ecossistema logístico da Europa.","link":"https://www.dw.com/pt-br/seca-no-rio-reno-trava-navega%C3%A7%C3%A3o-e-afeta-economia-alem%C3%A3/g-78337829","categoria":"MEIO AMBIENTE","lang":"pt"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Google abre sua primeira loja física no Japão para demonstrar inteligência artificial e novos smartphones","resumo":"A Google inaugurou sua primeira loja física direta no Japão, marcando a maior unidade da empresa no mundo voltada à experiência do consumidor.\nNo espaço, os visitantes podem testar os mais recentes dispositivos da linha Pixel, além de interagir diretamente com novos recursos de inteligência artificial da marca.\nA iniciativa busca fortalecer a presença da gigante de tecnologia no mercado japonês, aproximando o público das inovações de hardware e software da empresa.","link":"https://news.yahoo.co.jp/articles/1f8ef6e23d8f6a65a06bd36d6dae9ff1aff6cf77","categoria":"VAREJO TECH","lang":"pt"},{"fonte":"Forbes JAPAN","pais":"Japão","titulo":"Como os agentes de IA estão transformando a computação corporativa e a economia da tecnologia","resumo":"Em entrevista recente, executivos da AMD detalharam como a evolução dos agentes de inteligência artificial está remodelando a infraestrutura de computação das empresas.\nA transição exige arquiteturas de hardware mais eficientes e adaptáveis para lidar com o volume massivo de processamento contínuo em ambientes de negócios.\nO avanço reflete uma mudança profunda nos custos e no retorno financeiro dos investimentos em IA para o setor corporativo.","link":"https://forbesjapan.com/articles/detail/102799","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"PR TIMES","pais":"Japão","titulo":"Dispositivos quânticos de diamante surgem como promessa para revolucionar a tecnologia quântica","resumo":"Pesquisas recentes destacam o potencial do uso de diamantes com defeitos na estrutura cristalina para o desenvolvimento de sensores e computadores quânticos avançados.\nEssas gemas tecnológicas permitem a manipulação precisa de spins de elétrons em temperatura ambiente, contornando limitações térmicas de outros sistemas.\nA inovação promete acelerar a criação de semicondutores e equipamentos médicos de alta precisão baseados em física quântica.","link":"https://prtimes.jp/main/html/rd/p/000000813.000007141.html","categoria":"TECNOLOGIA QUÂNTICA","lang":"pt"},{"fonte":"客观日本","pais":"Japão","titulo":"Universidade de Tóquio descobre mecanismo cerebral associado à aversão a indivíduos próximos","resumo":"Pesquisadores da Universidade de Tóquio utilizaram modelos animais para identificar circuitos neurais responsáveis por gerar repulsa ou rejeição a sujeitos familiares.\nO estudo revelou quais regiões do cérebro são ativadas quando um vínculo social próximo sofre uma alteração negativa nas interações.\nA descoberta abre caminhos para compreender a dinâmica das relações humanas e transtornos psiquiátricos ligados ao isolamento social.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_smkx/pt20260813000014.html","categoria":"NEUROCIÊNCIA","lang":"pt"},{"fonte":"朝日新聞","pais":"Japão","titulo":"Tecnologia japonesa de raio-X portátil ajuda no combate à tuberculose na Indonésia","resumo":"Equipamentos de raio-X portáteis desenvolvidos no Japão estão sendo adotados em programas de saúde na Indonésia para o diagnóstico precoce da tuberculose.\nA mobilidade do sistema permite levar exames de imagem de alta qualidade a comunidades rurais e de difícil acesso.\nA solução demonstra o impacto da engenharia biomédica na expansão da medicina preventiva e no combate a epidemias globais.","link":"https://www.asahi.com/withplanet/article/16783865","categoria":"TECNOLOGIA MÉDICA","lang":"pt"},{"fonte":"The Korea Times","pais":"Japão","titulo":"Pesquisadores criam tecnologia para otimizar modelos de detecção 3D em carros autônomos","resumo":"Uma equipe de pesquisadores desenvolveu um novo método capaz de otimizar a detecção tridimensional de objetos usada em sistemas de condução autônoma.\nA técnica reduz a complexidade computacional dos algoritmos sem comprometer a precisão no reconhecimento de pedestres e veículos ao redor.\nO avanço é fundamental para garantir decisões mais rápidas e seguras em carros sem motorista em tempo real.","link":"https://www.koreatimes.co.kr/amp/southkorea/education/20260813/kookmin-university-team-develops-technology-to-optimize-3d-object-detection-models-for-self-driving","categoria":"VEÍCULOS AUTÔNOMOS","lang":"pt"},{"fonte":"atpress.ne.jp","pais":"Japão","titulo":"Mercado de memórias emergentes deve atingir 7,7 bilhões de dólares impulsionado por IA","resumo":"Um novo estudo de mercado aponta que o setor de tecnologias de memória de próxima geração crescerá a uma taxa anual de 8,8% até 2035.\nO impulso é motivado pela demanda massiva por processamento rápido em inteligência artificial e edge computing.\nEssas novas arquiteturas de memória buscam superar os gargalos de velocidade e consumo de energia das tecnologias tradicionais.","link":"https://www.atpress.ne.jp/news/3606839","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"carview.yahoo.co.jp","pais":"Japão","titulo":"Suzuki pode revelar novo Swift Sport com sistema híbrido de 48V no início de 2025","resumo":"Rumores do setor automotivo apontam que a Suzuki prepara o lançamento mundial da nova geração do compacto Swift Sport para o início de 2025.\nO modelo deve combinar um motor 1.4 turbo a um sistema híbrido leve de 48 volts, focando na eficiência energética sem perder a esportividade.\nA novidade reforça a estratégia das montadoras japonesas em eletrificar veículos populares mantendo alto desempenho.","link":"https://carview.yahoo.co.jp/article/detail/1c28579fd797fc250b1be3de06a78511043454df/","categoria":"INOVAÇÃO AUTOMOTIVA","lang":"pt"},{"fonte":"edu.cn","pais":"China","titulo":"China alcança avanço significativo em tecnologias de interface cérebro-computador","resumo":"A China registrou um avanço crucial no desenvolvimento de interfaces cérebro-computador de alta precisão.\nAs pesquisas recentes demonstram conquistas na decodificação de sinais neurais e na integração entre mente e máquina.\nEssa evolução abre portas para novas aplicações médicas na reabilitação motora e no tratamento de distúrbios neurológicos.\nO avanço posiciona o país como um dos líderes globais na corrida pelo domínio da neurotecnologia aplicada.","link":"https://www.edu.cn/ke_yan_yu_fa_zhan/gao_xiao_cheng_guo/cheng_guo_zhan_shi/202608/t20260813_2764933.shtml","categoria":"BIOTECNOLOGIA","lang":"pt"},{"fonte":"武汉市商务局","pais":"China","titulo":"Primeiro monitor OLED impresso do mundo entrará em produção em massa em Wuhan","resumo":"A China se prepara para iniciar a produção em massa do primeiro monitor comercial com tela OLED impressa do mundo em Wuhan.\nA tecnologia disruptiva promete reduzir drasticamente os custos de fabricação em comparação com métodos tradicionais de deposição a vácuo.\nAlém do menor custo, o novo processo garante telas com alta eficiência energética, cores mais vivas e maior durabilidade.\nO marco consolidará o polo industrial de Wuhan na vanguarda do setor global de displays e dispositivos eletrônicos.","link":"https://sw.wuhan.gov.cn/xwdt/mtbd/202608/t20260813_2833152.shtml","categoria":"HARDWARE","lang":"pt"},{"fonte":"The Conversation","pais":"China","titulo":"China impulsiona o futuro das tecnologias de código aberto e inteligência artificial","resumo":"A comunidade tecnológica chinesa está assumindo papel protagonista no ecossistema global de software de código aberto.\nIniciativas locais na área de inteligência artificial buscam democratizar modelos avançados e reduzir dependências estrangeiras.\nO forte apoio estatal e a ampla base de desenvolvedores aceleram a criação de plataformas colaborativas de grande alcance.\nEspecialistas apontam que a liderança oriental em código aberto pode redefinir os padrões da indústria de IA nos próximos anos.","link":"https://theconversation.com/china-is-shaping-the-future-of-open-source-technology-including-ai-288061","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"tech.sina.cn","pais":"China","titulo":"Prêmio Ciência do Futuro 2026 contempla três proeminentes cientistas chineses","resumo":"A organização do Prêmio Ciência do Futuro 2026 anunciou Zhang Hong, Zhao Dongyuan e Yuan Xinyi como os grandes vencedores.\nConhecida como o \"Prêmio Nobel da China\", a premiação reconhece contribuições de destaque em ciências da vida, materiais e matemática.\nCada um dos laureados receberá uma premiação expressiva em dinheiro para incentivar a continuidade de suas pesquisas de ponta.\nA iniciativa reforça o compromisso do país em promover avanços científicos e atrair talentos para a pesquisa fundamental.","link":"https://tech.sina.cn/2026-08-13/detail-ininctay0198816.d.html?vt=4\u0026wm=2284_1116?pt","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"j.people.com.cn","pais":"China","titulo":"Navio quebra-gelo chinês Xuelong conclui fase de observações na expedição polar","resumo":"A 16ª equipe de pesquisa científica da China na região do Ártico concluiu com sucesso suas operações de observação no gelo.\nA bordo do quebra-gelo Xuelong, pesquisadores coletaram dados valiosos sobre mudanças climáticas e dinâmica da calota polar.\nAs amostras recolhidas ajudarão a compreender melhor os impactos do aquecimento global na ecologia marinha do extremo norte.\nOs resultados da missão contribuirão diretamente com a cooperação científica internacional sobre o clima do planeta.","link":"http://j.people.com.cn/n3/2026/0813/c95952-20488415.html","categoria":"EXPLORAÇÃO CIENTÍFICA","lang":"pt"},{"fonte":"Pluang","pais":"China","titulo":"Demanda por chips de IA e empacotamento avançado alavanca receita da ASE Technology","resumo":"A gigante de semicondutores ASE Technology registrou um crescimento de 15,5% em sua receita durante o segundo trimestre.\nO salto financeiro foi impulsionado pela alta procura por microchips voltados para aplicações de inteligência artificial.\nA adoção de tecnologias de empacotamento avançado tem sido decisiva para atender aos exigentes requisitos dos novos processadores.\nO desempenho reforça o momento aquecido de toda a cadeia global de suprimentos do setor de semicondutores.","link":"https://pluang.com/en/news-feed/ase-technology-holding-laba-naik-margins-membaik-dan-permintaan-kuat","categoria":"SEMICONDUTORES","lang":"pt"},{"fonte":"东方财富","pais":"China","titulo":"China alcança avanço em fundição de componentes para usinas eólicas de grande porte","resumo":"Engenheiros chineses alcançaram uma conquista técnica crucial na fabricação de peças fundidas para turbinas eólicas terrestres de grande megawatt.\nO avanço supera gargalos de produção de peças de alta resistência capazes de suportar condições extremas de operação.\nA inovação deve acelerar a construção de parques eólicos de nova geração e baratear o custo final de geração de energia limpa.\nA conquista consolida a posição da indústria nacional como fornecedora chave de infraestrutura para a transição energética.","link":"https://wap.eastmoney.com/a/202608133839574969.html","categoria":"ENERGIA LIMPA","lang":"pt"},{"fonte":"chinanews.com.cn","pais":"China","titulo":"Província de Hebei lança projeto piloto focado na economia de tokens de poder computacional","resumo":"Hebei, uma das principais províncias chinesas em capacidade de processamento de dados, iniciou testes com a \"economia de tokens\".\nA iniciativa busca comercializar o poder computacional por meio de unidades padronizadas para otimizar o uso da infraestrutura local.\nA medida atende à crescente demanda de empresas de tecnologia e startups que necessitam de treinamento para modelos de IA.\nSe bem-sucedido, o modelo de negócios poderá ser replicado em outros polos tecnológicos de todo o território chinês.","link":"https://www.chinanews.com.cn/cj/2026/08-13/10676981.shtml","categoria":"ECONOMIA DIGITAL","lang":"pt"},{"fonte":"Moneycontrol.com","pais":"Índia","titulo":"Físico indiano Deepak Dhar ganha a Medalha Dirac de 2026 por contribuições à física estatística","resumo":"O renomado físico indiano Deepak Dhar foi contemplado com a prestigiada Medalha Dirac de 2026 por suas contribuições fundamentais no campo da física estatística. Suas pesquisas avançadas ajudaram a desvendar fenômenos complexos e comportamentos de fases em sistemas físicos variados. O prêmio internacional destaca o protagonismo da ciência indiana e seu impacto contínuo na física teórica mundial.","link":"https://www.moneycontrol.com/news/science/indian-physicist-deepak-dhar-wins-2026-dirac-medal-for-revealing-the-science-behind-mysterious-sandpile-avalanches-14004082.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"Ministro da Saúde da Índia lança documento sobre uso de inteligência artificial em tecnologia médica","resumo":"O ministro da Saúde da Índia, J.P. Nadda, apresentou um relatório técnico focado na integração da inteligência artificial ao setor de tecnologia médica. O documento mapeia estratégias para modernizar o sistema de saúde, otimizar diagnósticos e expandir tratamentos inovadores. A iniciativa visa posicionar o país na vanguarda da transformação digital e da saúde baseada em tecnologia.","link":"https://newsonair.gov.in/health-minister-nadda-releases-knowledge-paper-on-ai-in-medical-technology/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Capital Economics","pais":"Índia","titulo":"Índia e a economia de inteligência artificial: o que o consenso de mercado está ignorando","resumo":"Uma nova análise sobre a economia da IA na Índia destaca nuances cruciais do ecossistema tecnológico do país que costumam ser subestimadas por analistas globais. A pesquisa aborda a rápida adoção de tecnologias emergentes, infraestrutura local e capacidade de escala para negócios baseados em inteligência artificial. O estudo sinaliza oportunidades únicas de investimento e desenvolvimento no mercado indiano.","link":"https://www.capitaleconomics.com/events/asia-drop-india-and-ai-economy-what-consensus-missing","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"pt"},{"fonte":"Asian Business Review","pais":"Índia","titulo":"Gastos com tecnologia financeira na Índia devem crescer 21% ao ano","resumo":"Os investimentos no setor de tecnologia financeira na Índia projetam um crescimento anual contínuo de 21%, impulsionados pela digitalização em massa dos serviços bancários. A aceleração de meios de pagamento digitais e soluções de crédito abre novas frentes de mercado para startups e corporações. O avanço consolida a Índia como um dos hubs de fintechs com expansão mais rápida no cenário global.","link":"https://asianbusinessreview.com/insurance/news/india-financial-technology-spending-grow-21-annually","categoria":"FINTECHS","lang":"pt"},{"fonte":"Daily Pioneer","pais":"Índia","titulo":"Reunião do BRICS sobre Ciência Oceânica e Polar tem início em Goa sob a presidência da Índia","resumo":"Teve início em Goa a reunião dos países do BRICS dedicada à pesquisa em ciências oceânicas e polares, sediada sob a liderança da Índia. O evento reúne especialistas para discutir mudanças climáticas, conservação marinha e exploração sustentável dos oceanos. O encontro reforça a cooperação científica entre emergentes para responder a desafios ambientais globais urgentes.","link":"https://dailypioneer.com/news/8th-brics-oceanic-polar-science-and-tech-meet-begins-in-goa","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"India Technology News","pais":"Índia","titulo":"IIT Delhi abre inscrições para programa de Ciência de Dados Aplicada e Inteligência Artificial","resumo":"O renomado Instituto Indiano de Tecnologia de Delhi (IIT Delhi) anunciou o início do processo seletivo para o seu programa de especialização em Ciência de Dados e IA. A iniciativa busca qualificar profissionais para lidar com ferramentas avançadas de aprendizado de máquina e análise preditiva. O curso visa atender à crescente demanda do mercado por talentos especializados em tecnologias disruptivas.","link":"https://indiatechnologynews.in/cep-iit-delhi-opens-admissions-for-fourth-batch-of-certificate-programme-in-applied-data-science-and-artificial-intelligence/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"News On AIR","pais":"Índia","titulo":"Visão de economia de US$ 30 trilhões para a Índia até 2047 cria oportunidades para empresas","resumo":"O Ministro do Comércio da Índia reforçou a meta do país em atingir uma economia de US$ 30 trilhões até 2047, ano do seu centenário de independência. O plano estratégico foca no fortalecimento industrial, avanços tecnológicos e atração de investimentos estrangeiros diretos. A projeção aponta um cenário altamente promissor para corporações globais e ecossistemas de inovação.","link":"https://newsonair.gov.in/union-minister-piyush-goyal-says-bharatiya-vyapar-mahotsav-will-showcase-indias-growing-prowess-across-sectors/","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"The Economic Times","pais":"Índia","titulo":"Como a Playo está transformando esportes recreativos em um modelo de negócio escalável","resumo":"A plataforma Playo vem se destacando no cenário indiano ao conectar praticantes de esportes a quadras e arenas esportivas por meio de tecnologia digital. A startup desenvolveu um ecossistema que simplifica agendamentos e engaja comunidades locais para promover um estilo de vida ativo. O modelo consolida o esporte amador como um mercado altamente rentável e em plena expansão tecnológica.","link":"https://m.economictimes.com/small-biz/sme-sector/from-courts-to-communities-how-playo-is-turning-recreational-sports-into-a-scalable-business/articleshow/133200155.cms","categoria":"INOVAÇÃO","lang":"pt"},{"fonte":"Meteored Portugal","pais":"Portugal","titulo":"Um simples fungo pode ajudar a construir uma base em Marte? A ciência portuguesa acredita que sim","resumo":"Pesquisadores portugueses estão investigando como certos tipos de fungos podem ser utilizados na construção de infraestruturas em Marte.\nEssa abordagem inovadora de biotecnologia busca transformar recursos espaciais e materiais locais em estruturas resistentes.\nO projeto destaca o papel da ciência de Portugal no avanço da exploração espacial e sustentabilidade fora da Terra.","link":"https://www.tempo.pt/noticias/astronomia/um-simples-fungo-pode-ajudar-a-construir-uma-base-em-marte-a-ciencia-portuguesa-acredita-que-sim.html","categoria":"CIÊNCIA","lang":"pt"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"BYD ultrapassa 3.200 vendas de super híbridos plug-in em Portugal","resumo":"A fabricante chinesa de veículos elétricos BYD alcançou um marco significativo no mercado automotivo português ao superar 3.200 unidades vendidas de seus modelos híbridos plug-in.\nO crescimento reflete a forte transição energética no setor de transportes do país e a crescente preferência dos consumidores por opções mais sustentáveis.\nO resultado consolida a marca como uma das líderes da mobilidade eletrificada na região.","link":"https://jornaleconomico.sapo.pt/noticias/byd-ultrapassa-3-200-vendas-de-super-hibridos-plug-in-em-portugal/","categoria":"AUTOMÓVEIS","lang":"pt"},{"fonte":"SAPO","pais":"Portugal","titulo":"A melhor economia europeia: Le Figaro destaca crescimento português impulsionado por tecnologia e unicórnios","resumo":"O prestigiado jornal francês Le Figaro enalteceu o desempenho da economia de Portugal, apontando o ecossistema de inovação como motor central desse avanço.\nO surgimento de novos unicórnios e a atração de investimentos em tecnologia têm impulsionado o PIB nacional acima da média europeia.\nEsse reconhecimento internacional reforça a posição do país como um polo tecnológico estratégico na Europa.","link":"https://sapo.pt/artigo/a-melhor-economia-europeia-le-figaro-destaca-crescimento-portugues-impulsionado-por-tecnologia-e-unicornios-6a7cb73be7c4d45e90b00850","categoria":"NEGÓCIOS","lang":"pt"},{"fonte":"TVI","pais":"Portugal","titulo":"Ciência Viva monta \"solar scope\" para projetar o Sol e observar o eclipse","resumo":"A rede Ciência Viva preparou uma estrutura especial com o equipamento \"solar scope\" para permitir que o público acompanhe a observação do eclipse de forma segura em Portugal.\nA tecnologia projeta a imagem do Sol em tempo real, evitando riscos diretos à visão durante o fenômeno astronômico.\nA iniciativa busca democratizar o acesso ao conhecimento científico e incentivar o interesse da população pela astronomia.","link":"https://tvi.iol.pt/noticias/videos/ciencia-viva-monta-solar-scope-para-projetar-o-sol-e-fazer-observacoes-durante-o-eclipse/6a7ca1b40cf2f6a1a1e73c64","categoria":"ASTRONOMIA","lang":"pt"},{"fonte":"turbo.pt","pais":"Portugal","titulo":"Jaguar Type 01 revela interior minimalista com tecnologia escondida","resumo":"A Jaguar apresentou o conceito do modelo Type 01, destacando uma cabine futurista que oculta elementos tecnológicos até que sejam necessários.\nO design minimalista prioriza materiais de alta qualidade e uma experiência de condução limpa e intuitiva para o motorista.\nEssa abordagem reflete a nova linguagem de design e inovação da marca britânica para a era dos veículos elétricos.","link":"https://www.turbo.pt/jaguar-type-01-revela-interior-minimalista-com-tecnologia-escondida/","categoria":"TECNOLOGIA","lang":"pt"},{"fonte":"Executive Digest","pais":"Portugal","titulo":"iServices: A reparação como motor de uma economia mais circular","resumo":"A empresa iServices reafirma seu compromisso com a sustentabilidade ao promover a manutenção e o conserto de dispositivos eletrônicos como alternativa ao descarte.\nAo prolongar a vida útil de smartphones e computadores, a iniciativa reduz a geração de lixo eletrônico em Portugal.\nO modelo de negócios demonstra como a tecnologia e a reparação podem impulsionar uma economia circular e consciente.","link":"https://executivedigest.sapo.pt/iservices-a-reparacao-como-motor-de-uma-economia-mais-circular/","categoria":"SUSTENTABILIDADE","lang":"pt"},{"fonte":"Algarve Marafado","pais":"Portugal","titulo":"Lagoa está mudando a iluminação pública: 70% do concelho já conta com tecnologia LED","resumo":"O município de Lagoa avançou na modernização de sua infraestrutura urbana ao atingir a marca de 70% da iluminação pública convertida para LED.\nA transição visa garantir maior eficiência energética, reduzir emissões de carbono e diminuir os custos operacionais da cidade.\nA medida consolida o empenho local na adoção de tecnologias inteligentes voltadas para a sustentabilidade.","link":"https://www.algarvemarafado.com/2026/08/12/lagoa-esta-a-mudar-a-iluminacao-publica-70-do-concelho-ja-tem-tecnologia-led/","categoria":"CIDADES INTELIGENTES","lang":"pt"},{"fonte":"Expresso","pais":"Portugal","titulo":"Transmissão SIC Notícias ao vivo: tudo sobre o eclipse em Portugal","resumo":"A SIC Notícias realizou uma cobertura completa e em tempo real sobre a passagem do eclipse solar pelo território português.\nA transmissão contou com analistas, astrônomos e reportagens ao vivo mostrando a mobilização da população em diversos pontos do país.\nA ampla cobertura de mídia destacou o grande apelo popular e científico de eventos astronômicos raros.","link":"https://expresso.pt/sociedade/ciencia/2026-08-12-video-emissao-sic-noticias-em-direto-tudo-sobre-o-eclipse-em-portugal-3c5cebe3","categoria":"TENDÊNCIAS","lang":"pt"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Anthropic in talks to buy artificial intelligence startup for $6B","resumo":"Anthropic is in negotiations to acquire an AI startup in a deal valued at 6 billion dollars.\nThe move reflects intense consolidation in the global tech market and the pursuit of cutting-edge infrastructure.\nThe agreement could redefine competition among major tech companies in the development of advanced models.\nThe transaction highlights the high volume of capital invested in the global artificial intelligence ecosystem.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/12/anthropic-negocia-compra-de-startup-de-inteligencia-artificial-por-us-6-bi.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"Global press covers Discord's suspension in Brazil, seeing 'intense conflicts' between government and tech firms","resumo":"International outlets highlighted the suspension of Discord in Brazil, underscoring rising regulatory tensions.\nThe measure reflects the growing debate over social media regulation and cybersecurity in the country.\nGlobal analysts point out that the decision could set important precedents for digital governance.\nThe case reignites discussions on the balance between government regulation and the operation of tech platforms.","link":"https://oglobo.globo.com/brasil/noticia/2026/08/12/imprensa-global-repercute-suspensao-do-discord-no-brasil-e-ve-intensos-conflitos-do-governo-com-empresas-de-tecnologia.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Globo","pais":"Brazil","titulo":"New species of frog discovered in flooded Amazonian forest","resumo":"Researchers have identified a new species of frog in flooded forest areas of the Amazon region.\nThe discovery underscores the rich, yet-uncataloged biodiversity present within the Brazilian biome.\nGenetic and morphological analyses allowed scientists to differentiate the amphibian from other known species.\nThe find highlights the importance of environmental preservation for scientific research and conservation.","link":"https://revistagalileu.globo.com/google/amp/ciencia/noticia/2026/08/nova-especie-de-ra-e-descoberta-em-floresta-inundada-da-amazonia.ghtml","categoria":"SCIENCE","lang":"en"},{"fonte":"www.gov.br","pais":"Brazil","titulo":"Perseids meteor shower streaks across Brazil's skies","resumo":"The Perseids meteor shower astronomical phenomenon could be observed across various regions of Brazil.\nThe event occurs annually as Earth passes through the trail of debris left by comet Swift-Tuttle.\nThe passage of the meteors mobilized scientists and astronomy enthusiasts throughout the country.\nThe ministry's promotion of the event aims to foster public interest in science and space observation.","link":"https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/noticias/noticias-julho-outubro-2026/chuva-de-meteoros-perseidas-atravessa-o-ceu-do-pais","categoria":"ASTRONOMY","lang":"en"},{"fonte":"Tua Saúde","pais":"Brazil","titulo":"How stress affects the gut microbiome and what science reveals about the connection","resumo":"Recent scientific studies detail the mechanisms by which stress alters the intestinal flora.\nThe connection between the brain and the digestive system demonstrates how emotional states impact physical health.\nThese findings pave the way for new therapeutic approaches integrating mental health and gastroenterology.\nThe research reinforces the relevance of preventive medicine and holistic body care.","link":"https://www.tuasaude.com/es/news/2026/08/13/como-el-estres-afecta-al-microbioma-intestinal-y-que-revela-la-ciencia-sobre-esta-conexion/","categoria":"SCIENCE","lang":"en"},{"fonte":"EL PAÍS","pais":"Brazil","titulo":"Brazil uses forensic science to combat illegal mining","resumo":"Brazilian authorities have implemented advanced forensic science techniques to trace the origin of gold.\nThe methodology analyzes the chemical and geological signature of the ore to identify illegal mining operations.\nThe use of scientific technology strengthens enforcement and protection efforts in Amazonian ecosystems.\nThe initiative represents a major breakthrough in combating environmental crimes nationwide.","link":"https://elpais.com/america-futura/2026-08-13/brasil-usa-la-ciencia-forense-para-combatir-la-mineria-ilegal.html","categoria":"INNOVATION","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"How to free up to 10 GB of memory on WhatsApp with a hidden feature","resumo":"A WhatsApp feature allows users to efficiently manage the app's storage.\nThe tool identifies and makes it easier to delete heavy files accumulated in chats and groups.\nOptimizing space improves smartphone performance without requiring external apps.\nThe feature is essential for those who use the platform daily and face device memory issues.","link":"https://oglobo.globo.com/economia/tecnologia/noticia/2026/08/13/saiba-como-liberar-ate-10-gb-de-memoria-no-whatsapp-com-um-recurso-oculto.ghtml","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"O GLOBO","pais":"Brazil","titulo":"DENZA accelerates electrification in Brazil with Flash Charging technology","resumo":"The DENZA brand has announced the introduction of Flash Charging ultra-fast recharging technology to the Brazilian market.\nThe new feature significantly reduces the time needed to charge electric vehicle batteries.\nThe expansion of this infrastructure aims to drive the adoption of sustainable mobility in the country.\nThe initiative aligns the national automotive sector with global electrification trends.","link":"https://oglobo.globo.com/google/amp/conteudo-de-marca/casacor/noticia/2026/08/12/denza-acelera-eletrificacao-no-brasil-com-tecnologia-flash-charging.ghtml","categoria":"INNOVATION","lang":"en"},{"fonte":"bloomberg.com","pais":"United States","titulo":"Anthropic in talks to acquire startup Decart for $6 billion","resumo":"Artificial intelligence giant Anthropic is in advanced negotiations to acquire startup Decart in a deal valued at 6 billion dollars.\nThe transaction highlights the accelerated pace of consolidation and hefty investments shaping the global tech ecosystem.\nIf finalized, the purchase is expected to significantly strengthen Anthropic's model infrastructure and competitiveness against industry rivals.","link":"https://www.bloomberg.com/news/articles/2026-08-13/anthropic-said-in-talks-to-buy-ai-startup-decart-for-6-billion","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Empire State Development (.gov)","pais":"United States","titulo":"New York launches selection process to establish regional quantum technology hubs","resumo":"The Governor of New York has announced the launch of a selection process to establish regional hubs focused on the commercialization of quantum technology.\nThe initiative seeks to accelerate the transition of advanced scientific research from academia to practical market applications.\nThe project aims to solidify the state as a global center for tech innovation, attracting investments and skilled talent.","link":"https://esd.ny.gov/esd-media-center/press-releases/governor-hochul-announced-launch-selection-process-regional-quantum","categoria":"QUANTUM TECHNOLOGY","lang":"en"},{"fonte":"BioSpace","pais":"United States","titulo":"CyberKnife robotic technology tracks tumors in real-time during breathing","resumo":"The CyberKnife robotic system utilizes advanced technological precision to monitor and track tumors in real-time during medical procedures.\nThe tool dynamically adjusts radiation delivery according to the patient's respiratory movement during treatment.\nThis approach minimizes damage to surrounding healthy tissue and significantly increases the efficacy and safety of radiation therapy.","link":"https://www.biospace.com/press-releases/robotic-technology-at-medicana-cyberknife-tracks-tumors-in-real-time-and-adjusts-radiation-as-patients-breathe","categoria":"ROBOTIC MEDICINE","lang":"en"},{"fonte":"Cardiovascular Business","pais":"United States","titulo":"Duke digital twin technology revolutionizes hemodynamic assessments","resumo":"Researchers at Duke University have developed a digital-twin-based platform aimed at advanced hemodynamic analysis.\nThe technology creates highly accurate virtual simulations of each specific patient's cardiovascular circulatory system.\nThe innovation promises to personalize complex medical treatments, optimizing clinical decisions and reducing the need for invasive procedures.","link":"https://cardiovascularbusiness.com/topics/patient-care/care-delivery/dukes-digital-twin-technology-could-take-hemodynamic-assessments-whole-other-level","categoria":"DIGITAL HEALTH","lang":"en"},{"fonte":"Goldman Sachs","pais":"United States","titulo":"The Second Space Age: How markets, technology, and power shape the cosmos","resumo":"Space exploration is undergoing a profound transformation driven by the convergence of private investments and new technologies.\nThe rise of the commercial space economy is reshaping access to Earth's orbit and redefining the race for resources beyond the planet.\nThis dynamic ushers in a new era with a strong impact on global security, scientific research, and emerging innovation markets.","link":"https://www.goldmansachs.com/insights/articles/the-second-space-age-how-markets-technology-and-power-are-reshaping-the-final-frontier","categoria":"SPACE EXPLORATION","lang":"en"},{"fonte":"Southern Farm Network","pais":"United States","titulo":"Artificial Intelligence is the primary focus of U.S. agricultural science challenge","resumo":"The U.S. national agricultural science and technology challenge has set artificial intelligence as its central development pillar.\nThe initiative seeks to drive innovative solutions to optimize precision farming, forecast crop yields, and increase resilience in the field.\nThe move highlights how the convergence of AI and agribusiness is essential to meeting growing global food demands.","link":"https://www.sfntoday.com/2026/08/13/ai-the-focus-of-national-ag-science-and-tech-challenge/","categoria":"AGRITECH","lang":"en"},{"fonte":"Le Monde.fr","pais":"United States","titulo":"U.S. government cancels landmark report on Arctic climate science","resumo":"The U.S. government administration has ordered the cancellation of a major scientific report on climate impacts in the Arctic.\nThe move raises serious concerns among scientists and environmental agencies regarding backpedaling in global change monitoring.\nThe cancellation reflects political disputes that directly impact the transparency and continuity of strategic scientific research.","link":"https://www.lemonde.fr/planete/article/2026/08/13/l-administration-trump-annule-un-rapport-de-reference-sur-l-arctique-une-nouvelle-atteinte-a-la-science-du-climat-aux-etats-unis_6745334_3244.html","categoria":"CLIMATE SCIENCE","lang":"en"},{"fonte":"Yahoo Finance","pais":"United States","titulo":"Micron Technology Faces New Challenges in the AI Hardware Race","resumo":"Micron Technology is looking to expand its footprint in high-bandwidth memory production, which is essential for AI semiconductors.\nThe company faces fierce competition in the advanced hardware sector as it strives to maintain its competitive market edge.\nThe company's positioning reflects the intense infrastructure demands driven by the rapid growth of artificial intelligence.","link":"https://finance.yahoo.com/technology/ai/articles/micron-technology-mu-against-ai-051413807.html","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"Zonebourse Suisse","pais":"France","titulo":"UK Economy Posts Unexpected 0.3% Growth in June, According to ONS","resumo":"The Office for National Statistics (ONS) reported a surprising expansion in UK GDP.\nThe 0.3% growth rate in June surpassed financial market analysts' expectations.\nThis advance brings new developments to economic outlooks and monetary policies in Europe.","link":"https://ch.zonebourse.com/actualite-bourse/l-economie-britannique-enregistre-une-croissance-inattendue-de-0-3-en-juin-selon-l-ons-ce7859d9db8bfe20","categoria":"ECONOMY","lang":"en"},{"fonte":"chinanews.com.cn","pais":"France","titulo":"This Summer's Heatwave in France Could Cause Over €10 Billion in Damages","resumo":"The intense heatwave gripping France this summer is generating severe economic and social impacts.\nIt is estimated that damages will exceed ten billion euros across key sectors of the country's infrastructure.\nThis extreme climate phenomenon sounds the alarm for the urgent need for adaptation and sustainability.","link":"https://www.chinanews.com.cn/gj/shipin/2026/08-13/news1065271.shtml","categoria":"CLIMATE","lang":"en"},{"fonte":"Investing.com France","pais":"France","titulo":"GigaCloud Technology Director Offloads Shares Worth $259,400","resumo":"A director at tech firm GigaCloud has executed the sale of a block of corporate shares.\nThe financial transaction moved approximately $259,400 in the stock market.\nThis executive stock activity is closely monitored by investors and tech sector analysts.","link":"https://fr.investing.com/news/insider-trading-news/le-directeur-de-gigacloud-technologie-bernes-cede-des-actions-pour-259400-93CH-3554369","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Investing.com France","pais":"France","titulo":"GigaCloud Technology Chairman Sells Shares Worth $346,696","resumo":"The chairman of GigaCloud Technology has sold a portion of his shares in the company.\nThe liquidation operation involved a total amount of $346,696 in the financial market.\nThe move reflects asset adjustments by executives at the cloud technology company.","link":"https://fr.investing.com/news/insider-trading-news/le-president-de-gigacloud-technologie-vend-des-actions-pour-346696-93CH-3554371","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ロイター","pais":"France","titulo":"France Heatwave Could Cause Up to €15 Billion in Losses Due to Wildfires and Agricultural Damage","resumo":"France's Environment Minister has warned of massive economic losses caused by the heatwave.\nWildfires and severe agricultural damage could push losses up to 15 billion euros.\nThe environmental crisis highlights the urgency for more effective strategies in combating climate change in the region.","link":"https://jp.reuters.com/economy/KGSQUD7QBBOQFOJACDMV6YMKUQ-2026-08-13/","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"Sortir à Paris","pais":"France","titulo":"2026 Fête de la Science in Courbevoie: The Atmosphères Festival Connects Cinema, Arts, and Science","resumo":"The 2026 Fête de la Science in Courbevoie presents another edition of the acclaimed Atmosphères Festival.\nThe free event brings together cinema, artistic expression, and scientific discussions focused on sustainability.\nThe initiative aims to bring the general public closer to scientific discoveries and environmental awareness.","link":"https://www.sortiraparis.com/pt/crianca-familia/articles/350385-festa-da-ciencia-2026-em-courbevoie-o-festival-atmospheres-mistura-cinema-artes-e-ciencias","categoria":"SCIENCE","lang":"en"},{"fonte":"Sortir à Paris","pais":"France","titulo":"2026 Fête de la Science: Scientific Activities Schedule in Issy-les-Moulineaux","resumo":"Issy-les-Moulineaux has released its official schedule for the highly anticipated 2026 Fête de la Science.\nThe city will host workshops, interactive labs, and scientific lectures open to all ages.\nThe primary goal of the event is to democratize access to knowledge and spark interest in innovation.","link":"https://www.sortiraparis.com/pt/noticias/em-paris/articles/333179-festa-da-ciencia-2026-o-programa-das-atividades-cientificas-em-issy-les-moulineaux-92","categoria":"SCIENCE","lang":"en"},{"fonte":"Yachting World","pais":"England","titulo":"Visit to Ferrari's Maranello Factory Shows How Supercar Tech Is Revolutionizing Sailing","resumo":"Traditional Italian manufacturer Ferrari is applying its advanced automotive engineering expertise to high-performance maritime navigation.\nThe transfer of cutting-edge technologies, such as complex aerodynamics and ultralight materials, promises to transform sailboat efficiency.\nExperts note that collaboration between the automotive and naval sectors opens new frontiers for sports innovation.\nThe initiative demonstrates the potential for expanding racing technologies into other sustainable, high-performance industries.","link":"https://www.yachtingworld.com/homepage/i-visited-the-ferrari-factory-on-maranello-to-see-how-their-supercar-technology-is-revolutionising-sailing-163763","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"Taiwan Reports Being Hit by 'Abnormal' AI-Assisted Cyberattack","resumo":"The government of Taiwan reported facing an atypical cyberattack optimized by artificial intelligence algorithms.\nLocal authorities warn that the use of AI by hackers makes threats significantly faster and harder to mitigate.\nThe incident highlights the growing militarization of digital space and the urgency of more robust technological defenses.\nInternational experts are monitoring the case as a milestone in new virtual threats across the Indo-Pacific region.","link":"https://www.theguardian.com/technology/2026/aug/13/taiwan-ai-assisted-cyber-attacks-overseas","categoria":"CYBERSECURITY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"AI Agents Aren't Legally Responsible for Harm They Cause, Experts Say","resumo":"With the advancement of autonomous artificial intelligence systems, legal scholars are debating who should be held civilly and criminally liable for severe failures.\nCurrently, the law does not recognize legal personhood for software, leaving responsibility split between developers and users.\nThis regulatory gap raises urgent concerns as autonomous systems make critical decisions across various sectors.\nExperts advocate for the creation of new international regulatory frameworks to define limits and obligations in the use of these technologies.","link":"https://www.theguardian.com/technology/2026/aug/13/ai-agents-arent-legally-responsible-for-any-harm-that-they-cause-experts-say-so-who-is","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"BBC","pais":"England","titulo":"Twitch Users Can Now Block Amazon from Using Their Content to Train AI","resumo":"Live-streaming platform Twitch has rolled out a new privacy option to protect content creators.\nThe tool allows users to explicitly prohibit Amazon from using their broadcasts and data to train AI models.\nThe move addresses growing community demands regarding copyright, consent, and intellectual property in the digital age.\nThe decision may pressure other tech giants to adopt similar mechanisms to protect user data.","link":"https://www.bbc.com/news/articles/cp30pz8d09jo","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Guardian","pais":"England","titulo":"EJ Swift Wins the 2026 Arthur C. Clarke Award for Science Fiction","resumo":"Author EJ Swift has been announced as the grand winner of the prestigious 2026 Arthur C. Clarke science fiction award.\nHer work stood out for its profound and innovative approach to urgent themes like climate change and humanity's future.\nThe award is globally recognized for honoring literary works that explore the impact of science on society.\nThe victory cements the writer as one of the most influential voices in contemporary speculative fiction.","link":"https://www.theguardian.com/books/2026/aug/12/ej-swift-wins-the-2026-arthur-c-clarke-award-for-science-fiction","categoria":"LITERATURE","lang":"en"},{"fonte":"GOV.UK","pais":"England","titulo":"Patients to Benefit from Faster Access to Medicines as UK Moves Away from Animal Testing","resumo":"The UK has initiated a historic shift in the scientific sector by replacing animal testing with advanced alternative methods.\nTechnologies like organs-on-chips and computer simulations promise to significantly accelerate the approval of new drugs in the country.\nThe initiative aims not only to raise the ethical standards of research but also to increase the accuracy of clinical trials.\nThe change positions the nation at the forefront of global biotech and pharmaceutical innovation.","link":"https://www.gov.uk/government/news/patients-to-benefit-from-faster-access-to-medicines-as-uk-moves-away-from-animal-testing-in-science","categoria":"SCIENCE","lang":"en"},{"fonte":"GOV.UK","pais":"England","titulo":"UK and Australia Boost Radar Technology and Industry Cooperation","resumo":"The UK and Australia have announced a strengthened military and technological partnership focused on developing advanced radar systems.\nThe agreement was cemented during the British Defense Secretary's visit to strategic partners in the Indo-Pacific region.\nThe collaboration aims to drive industrial innovation and enhance surveillance and security capabilities for both nations.\nThe project reinforces crucial geopolitical alliances at a time of growing global defense realignments.","link":"https://www.gov.uk/government/news/uk-and-australia-boost-radar-technology-and-industry-cooperation-as-defence-minister-visits-indo-pacific-partners","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Reuters","pais":"Inglaterra","titulo":"PIB do Reino Unido se recupera em junho impulsionado por trégua no Golfo, Copa do Mundo e clima favorável","resumo":"A economia do Reino Unido apresentou uma recuperação inesperada no mês de junho, superando projeções estagnadas anteriores.\nO desempenho positivo foi impulsionado pelo aumento do consumo durante a Copa do Mundo, o clima ensolarado e a trégua nos conflitos no Golfo.\nO setor de serviços e o comércio varejista registraram forte alta no período, beneficiados pelo otimismo temporário dos consumidores.\nApesar da melhora pontual, analistas mantêm cautela em relação às perspectivas econômicas globais para o restante do ano.","link":"https://www.reuters.com/world/uk/uk-economy-unexpectedly-grows-by-03-june-ons-says-2026-08-13/","categoria":"TENDÊNCIAS","lang":"en"},{"fonte":"La Razón","pais":"Espanha","titulo":"Quase 16.000 espelhos apontando para o mesmo ponto: China conclui a usina termossolar mais alta do mundo","resumo":"A China finalizou a construção da usina termossolar mais alta do planeta, uma obra impressionante equipada com cerca de 16 mil espelhos focados em um único ponto. Com capacidade de 100 MW, o sistema utiliza sais fundidos para armazenar calor e continuar gerando energia elétrica limpa mesmo durante a noite.\nA conquista representa um avanço expressivo para a infraestrutura global de energia sustentável e tecnologia de armazenamento térmico.","link":"https://www.larazon.es/tecnologia-consumo/ciencia/casi-16000-espejos-apuntando-mismo-punto-china-remata-termosolar-alta-planeta-100-mw-sales-fundidas-dar-luz-noche_202608136a7ce0bba046ad6ebcae1f2d.html","categoria":"ENERGIA RENOVÁVEL","lang":"en"},{"fonte":"El Mundo","pais":"Espanha","titulo":"LaLiga estreia bola conectada: a nova tecnologia que promete detectar toques duplos, mão e impedimentos","resumo":"A principal liga de futebol da Espanha está introduzindo uma bola inteligente equipada com sensores de alta precisão para auxiliar a arbitragem em tempo real. A tecnologia é capaz de identificar instantaneamente contatos imperceptíveis, como dois toques na bola, toques de mão e posições irregulares de impedimento.\nEssa inovação busca reduzir polêmicas nas partidas e aumentar a precisão de decisões cruciais ao longo do campeonato.","link":"https://www.elmundo.es/deportes/futbol/primera-division/2026/08/12/6a7c92b2e4d4d8c9378b458a.html","categoria":"TECNOLOGIA ESPORTIVA","lang":"en"},{"fonte":"Motor16","pais":"Espanha","titulo":"Ford Pro AI: A tecnologia que promete economizar 23 horas por semana na gestão de frotas","resumo":"A Ford apresentou o Ford Pro AI, uma ferramenta avançada projetada para otimizar drasticamente a rotina de quem administra frotas de veículos comerciais. Ao automatizar a análise de dados de telemetria, rotas e necessidades de manutenção preventivas, a solução promete economizar até 23 horas semanais dos gestores.\nO recurso reflete o impacto direto da inteligência artificial na eficiência operacional e logística do setor automotivo.","link":"https://www.motor16.com/las-ultimas-noticias/ford-pro-ai-23-horas-flotas/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"20Minutos","pais":"Espanha","titulo":"Os sete minutos em que a Espanha escureceu para que a ciência brilhasse: um eclipse histórico","resumo":"Um eclipse solar histórico mobilizou cientistas e entusiastas em toda a Espanha, transformando o país em um verdadeiro laboratório a céu aberto por sete minutos. O raro fenômeno astronômico uniu a população e permitiu a coleta de dados inéditos sobre a atmosfera solar e o comportamento do clima.\nAlém do espetáculo visual inesquecível, o evento destacou a importância da pesquisa astronômica e do engajamento científico nacional.","link":"https://www.20minutos.es/nacional/los-siete-minutos-los-que-espana-se-apago-punta-punta-para-que-brillase-ciencia-un-eclipse-historico-que-unio-todo-un-pais_7025252_0.html","categoria":"ASTRONOMIA","lang":"en"},{"fonte":"Bolsamania","pais":"Espanha","titulo":"União Europeia aplica novas regras para que carros tenham 25% de plástico reciclado em 10 anos","resumo":"Entraram em vigor as diretrizes da União Europeia que exigem das montadoras a inclusão de pelo menos 25% de plástico reciclado na fabricação de
