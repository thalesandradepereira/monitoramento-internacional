 novos veículos dentro de uma década. A medida visa acelerar a transição da indústria automotiva para um modelo de economia circular e diminuir o impacto ambiental.\nA exigência deve impulsionar inovações no desenvolvimento de novos materiais tecnológicos e processos de reciclagem veicular.","link":"https://www.bolsamania.com/noticias/ultimas/economiamotor--la-ue-aplica-desde-hoy-las-reglas-para-que-los-coches-tengan-un-25-de-plastico-reciclado-en-10-anos--23252349.html","categoria":"SUSTENTABILIDADE","lang":"en"},{"fonte":"Driving ECO","pais":"Espanha","titulo":"Ranking 2026: Os SUVs premium com a melhor tecnologia de assistência ao motorista à venda na Espanha","resumo":"Um novo levantamento destacou os utilitários esportivos de luxo que oferecem os sistemas mais avançados de assistência ao condutor disponíveis no mercado espanhol. Os modelos avaliados contam com recursos de condução semiautônoma, frenagem de emergência aprimorada por inteligência artificial e monitoramento 360 graus.\nO ranking evidencia o ritmo acelerado de inovação nos sistemas de segurança ativa da frota automotiva moderna.","link":"https://www.drivingeco.com/pt/Ranking-de-2026-dos-SUVs-premium-com-a-melhor-tecnologia-de-assist%C3%AAncia-ao-condutor/","categoria":"TECNOLOGIA AUTOMOTIVA","lang":"en"},{"fonte":"El Debate","pais":"Espanha","titulo":"Quando a Espanha voltará a presenciar um eclipse solar como o deste ano","resumo":"Após o marcante evento astronômico de agosto, especialistas projetam as datas e os locais exatos em que novos eclipses solares totais e anulares poderão ser vistos na Espanha. O planejamento prévio é fundamental tanto para a comunidade científica preparar experimentos de alta precisão quanto para o turismo astrológico nacional.\nA análise ressalta a raridade desses ciclos cósmicos e o interesse crescente do público pela observação espacial.","link":"https://www.eldebate.com/ciencia/20260813/cuando-volvera-repetirse-espana-eclipse-como-este-12-agosto_448939.html","categoria":"CIÊNCIA","lang":"en"},{"fonte":"elDiario.es","pais":"Espanha","titulo":"OMODA 7 SHS Híbrido Plug-in: quando o design se une à tecnologia","resumo":"A fabricante OMODA apresentou oficialmente o modelo 7 SHS, um veículo híbrido plug-in que combina linguagem de design futurista com alta eficiência energética. Equipado com motorização avançada e sistemas inteligentes de conectividade interna, o modelo busca conquistar o mercado europeu de utilitários ecológicos.\nO lançamento reforça a expansão de marcas focadas em mobilidade sustentável e tecnologia veicular de ponta.","link":"https://www.eldiario.es/motor/novedades/omoda-7-shs-hibrido-enchufable-diseno-une-tecnologia_1_13439717.html","categoria":"AUTOMÓVEIS","lang":"en"},{"fonte":"WEB.DE","pais":"Alemanha","titulo":"Alemanha reforça massivamente seus serviços de inteligência","resumo":"A Alemanha está promovendo uma modernização e expansão significativa de suas agências e serviços de inteligência.\nA iniciativa visa reforçar a segurança nacional e a capacidade de resposta cibernética frente a crescentes ameaças geopolíticas globais.\nO investimento estratégico reflete uma mudança de postura do país na proteção de dados e infraestruturas críticas.","link":"https://web.de/magazine/politik/videos/deutschland-ruestet-geheimdienste-massiv-42608192","categoria":"SEGURANÇA","lang":"en"},{"fonte":"CHEMIE TECHNIK","pais":"Alemanha","titulo":"Topsoe fornece tecnologia para projeto de amônia verde no Texas","resumo":"A empresa Topsoe foi selecionada para fornecer tecnologia avançada de descarbonização em um grande projeto de amônia verde no Texas.\nA iniciativa busca substituir fontes de energia fósseis por alternativas renováveis em escala industrial, reduzindo emissões de carbono.\nEsse avanço fortalece o mercado global de combustíveis limpos e impulsiona a transição energética sustentável.","link":"https://www.chemietechnik.de/energie-umwelt/topsoe-liefert-technologie-fuer-gruenes-ammoniak-projekt-in-texas/2717758","categoria":"TECNOLOGIA VERDE","lang":"en"},{"fonte":"Zeitungsverlag Waiblingen","pais":"Alemanha","titulo":"Pílula de emagrecimento chega às farmácias alemãs: um panorama","resumo":"Os novos comprimidos para perda de peso começam a ser disponibilizados nas farmácias da Alemanha, oferecendo uma alternativa oral aos tratamentos injetáveis.\nA novidade médica promete transformar o tratamento da obesidade e de distúrbios metabólicos no país.\nEspecialistas acompanham o impacto do lançamento no sistema de saúde e na rotina dos pacientes.","link":"https://www.zvw.de/mehr-nachrichten/wissenschaft/abnehmtablette-kommt-in-deutsche-apotheken-ein-%C3%BCberblick_arid-1094261","categoria":"CIÊNCIA E SAÚDE","lang":"en"},{"fonte":"Volksstimme","pais":"Alemanha","titulo":"E-Sports na Alemanha: Gamers disputam a 'FC 26 Community Cup' em Wolmirstedt","resumo":"A região de Börde, na Alemanha, recebe o torneio de e-sports 'FC 26 Community Cup', reunindo jogadores locais para disputas do famoso jogo de futebol digital.\nO evento busca fortalecer a comunidade gamer regional e promover o crescimento dos esportes eletrônicos em nível municipal.\nA competição reflete a popularização contínua dos torneios virtuais entre jovens e entusiastas da tecnologia.","link":"https://www.volksstimme.de/lokal/wolmirstedt/wer-ist-der-beste-gamer-konnen-sich-beim-fc-26-community-cup-in-wolmirstedt-messen-4300587","categoria":"GAMES","lang":"en"},{"fonte":"BornCity","pais":"Alemanha","titulo":"Avery L7160: 21 etiquetas por folha com tecnologia Quick-Peel","resumo":"A linha de produtos de escritório destaca as etiquetas Avery L7160, desenvolvidas com a inovadora tecnologia Quick-Peel para facilitar a remoção rápida.\nA solução visa otimizar processos logísticos e de organização corporativa, aumentando a produtividade em ambientes de trabalho.\nO design técnico garante compatibilidade perfeita com impressoras a laser convencionais.","link":"https://borncity.com/news/avery-l7160-21-etiketten-pro-blatt-mit-quick-peel-technologie/","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"DW.com","pais":"Alemanha","titulo":"Seca no rio Reno paralisa navegação e impacta a economia alemã","resumo":"A severa diminuição do nível de água no rio Reno está interrompendo o transporte de cargas e matérias-primas cruciais para a indústria alemã.\nOs gargalos na navegação afetam diretamente as cadeias de suprimento e pressionam os custos operacionais no setor produtivo.\nO cenário acende o alerta para os impactos das mudanças climáticas no ecossistema logístico da Europa.","link":"https://www.dw.com/pt-br/seca-no-rio-reno-trava-navega%C3%A7%C3%A3o-e-afeta-economia-alem%C3%A3/g-78337829","categoria":"MEIO AMBIENTE","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Google opens its first physical store in Japan to showcase artificial intelligence and new smartphones","resumo":"Google has inaugurated its first direct brick-and-mortar store in Japan, marking the company's largest consumer experience unit in the world.\nAt the space, visitors can test the latest devices in the Pixel lineup, as well as interact directly with the brand's new artificial intelligence features.\nThe initiative aims to strengthen the tech giant's presence in the Japanese market, bringing the public closer to the company's hardware and software innovations.","link":"https://news.yahoo.co.jp/articles/1f8ef6e23d8f6a65a06bd36d6dae9ff1aff6cf77","categoria":"TECH RETAIL","lang":"en"},{"fonte":"Forbes JAPAN","pais":"Japan","titulo":"How AI agents are transforming enterprise computing and the tech economy","resumo":"In a recent interview, AMD executives detailed how the evolution of artificial intelligence agents is reshaping enterprise computing infrastructure.\nThe transition demands more efficient and adaptable hardware architectures to handle the massive volume of continuous processing in business environments.\nThe advancement reflects a profound shift in costs and financial returns on AI investments for the corporate sector.","link":"https://forbesjapan.com/articles/detail/102799","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"Diamond quantum devices emerge as a promising breakthrough to revolutionize quantum technology","resumo":"Recent research highlights the potential of using diamonds with crystal structure defects to develop advanced sensors and quantum computers.\nThese technological gems allow for the precise manipulation of electron spins at room temperature, bypassing the thermal limitations of other systems.\nThe innovation promises to accelerate the creation of high-precision semiconductors and medical equipment based on quantum physics.","link":"https://prtimes.jp/main/html/rd/p/000000813.000007141.html","categoria":"QUANTUM TECHNOLOGY","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"University of Tokyo discovers brain mechanism associated with aversion to close individuals","resumo":"Researchers at the University of Tokyo used animal models to identify neural circuits responsible for generating repulsion or rejection toward familiar subjects.\nThe study revealed which brain regions are activated when a close social bond undergoes a negative change in interactions.\nThe discovery paves the way to understanding the dynamics of human relationships and psychiatric disorders linked to social isolation.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_smkx/pt20260813000014.html","categoria":"NEUROSCIENCE","lang":"en"},{"fonte":"朝日新聞","pais":"Japan","titulo":"Japanese portable X-ray technology helps combat tuberculosis in Indonesia","resumo":"Portable X-ray equipment developed in Japan is being adopted in health programs in Indonesia for the early diagnosis of tuberculosis.\nThe system's mobility makes it possible to bring high-quality imaging exams to rural and hard-to-reach communities.\nThe solution demonstrates the impact of biomedical engineering in expanding preventive medicine and fighting global epidemics.","link":"https://www.asahi.com/withplanet/article/16783865","categoria":"MEDICAL TECHNOLOGY","lang":"en"},{"fonte":"The Korea Times","pais":"Japan","titulo":"Researchers create technology to optimize 3D detection models in autonomous cars","resumo":"A team of researchers has developed a new method capable of optimizing three-dimensional object detection used in autonomous driving systems.\nThe technique reduces the computational complexity of algorithms without compromising precision in recognizing surrounding pedestrians and vehicles.\nThe breakthrough is fundamental to ensuring faster and safer real-time decisions in driverless cars.","link":"https://www.koreatimes.co.kr/amp/southkorea/education/20260813/kookmin-university-team-develops-technology-to-optimize-3d-object-detection-models-for-self-driving","categoria":"AUTONOMOUS VEHICLES","lang":"en"},{"fonte":"atpress.ne.jp","pais":"Japan","titulo":"Emerging memory market projected to reach $7.7 billion driven by AI","resumo":"A new market study indicates that the next-generation memory technology sector will grow at an annual rate of 8.8% through 2035.\nThe momentum is fueled by the massive demand for rapid processing in artificial intelligence and edge computing.\nThese new memory architectures aim to overcome the speed and energy consumption bottlenecks of traditional technologies.","link":"https://www.atpress.ne.jp/news/3606839","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"carview.yahoo.co.jp","pais":"Japan","titulo":"Suzuki may reveal new Swift Sport with 48V hybrid system in early 2025","resumo":"Automotive industry rumors indicate that Suzuki is preparing the global launch of the new-generation Swift Sport compact for early 2025.\nThe model is expected to combine a 1.4-liter turbo engine with a 48-volt mild hybrid system, focusing on energy efficiency without losing its sportiness.\nThe new release reinforces the strategy of Japanese automakers to electrify popular vehicles while maintaining high performance.","link":"https://carview.yahoo.co.jp/article/detail/1c28579fd797fc250b1be3de06a78511043454df/","categoria":"AUTOMOTIVE INNOVATION","lang":"en"},{"fonte":"edu.cn","pais":"China","titulo":"China achieves significant breakthrough in brain-computer interface technologies","resumo":"China has registered a crucial advancement in the development of high-precision brain-computer interfaces.\nRecent research demonstrates achievements in decoding neural signals and integrating mind and machine.\nThis evolution opens doors for new medical applications in motor rehabilitation and the treatment of neurological disorders.\nThe breakthrough positions the country as one of the global leaders in the race for applied neurotechnology dominance.","link":"https://www.edu.cn/ke_yan_yu_fa_zhan/gao_xiao_cheng_guo/cheng_guo_zhan_shi/202608/t20260813_2764933.shtml","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"武汉市商务局","pais":"China","titulo":"World's first printed OLED monitor to enter mass production in Wuhan","resumo":"China is preparing to begin mass production of the world's first commercial monitor with a printed OLED screen in Wuhan.\nThe disruptive technology promises to drastically reduce manufacturing costs compared to traditional vacuum deposition methods.\nIn addition to lower costs, the new process ensures screens with high energy efficiency, more vivid colors, and greater durability.\nThe milestone will cement Wuhan's industrial hub at the forefront of the global display and electronic device sector.","link":"https://sw.wuhan.gov.cn/xwdt/mtbd/202608/t20260813_2833152.shtml","categoria":"HARDWARE","lang":"en"},{"fonte":"The Conversation","pais":"China","titulo":"China drives the future of open-source technology and artificial intelligence","resumo":"The Chinese tech community is taking on a leading role in the global open-source software ecosystem.\nLocal initiatives in the field of artificial intelligence seek to democratize advanced models and reduce foreign dependencies.\nStrong state support and a broad developer base are accelerating the creation of far-reaching collaborative platforms.\nExperts point out that Eastern leadership in open source could redefine industry standards for AI in the coming years.","link":"https://theconversation.com/china-is-shaping-the-future-of-open-source-technology-including-ai-288061","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"tech.sina.cn","pais":"China","titulo":"2026 Future Science Prize honors three prominent Chinese scientists","resumo":"The organizers of the 2026 Future Science Prize announced Zhang Hong, Zhao Dongyuan, and Yuan Xinyi as the grand winners.\nKnown as \"China's Nobel Prize,\" the award recognizes outstanding contributions to life sciences, materials science, and mathematics.\nEach laureate will receive a substantial cash prize to encourage the continuation of their cutting-edge research.\nThe initiative reinforces the country's commitment to promoting scientific advancements and attracting talent to fundamental research.","link":"https://tech.sina.cn/2026-08-13/detail-ininctay0198816.d.html?vt=4\u0026wm=2284_1116?pt","categoria":"SCIENCE","lang":"en"},{"fonte":"j.people.com.cn","pais":"China","titulo":"Chinese icebreaker Xuelong concludes observation phase of polar expedition","resumo":"China's 16th scientific research team in the Arctic region has successfully concluded its observation operations on the ice.\nOn board the icebreaker Xuelong, researchers gathered valuable data on climate change and polar ice cap dynamics.\nThe collected samples will help better understand the impacts of global warming on the marine ecology of the far north.\nThe mission's results will directly contribute to international scientific cooperation regarding the planet's climate.","link":"http://j.people.com.cn/n3/2026/0813/c95952-20488415.html","categoria":"SCIENTIFIC EXPLORATION","lang":"en"},{"fonte":"Pluang","pais":"China","titulo":"Demand for AI chips and advanced packaging boosts ASE Technology's revenue","resumo":"Semiconductor giant ASE Technology reported a 15.5% growth in revenue during the second quarter.\nThe financial jump was fueled by high demand for microchips geared toward artificial intelligence applications.\nThe adoption of advanced packaging technologies has been decisive in meeting the demanding requirements of new processors.\nThe performance reinforces the heated momentum of the entire global semiconductor supply chain.","link":"https://pluang.com/en/news-feed/ase-technology-holding-laba-naik-margins-membaik-dan-permintaan-kuat","categoria":"SEMICONDUCTORS","lang":"en"},{"fonte":"东方财富","pais":"China","titulo":"China achieves breakthrough in casting components for large-scale wind farms","resumo":"Chinese engineers have achieved a crucial technical milestone in manufacturing castings for large multi-megawatt onshore wind turbines.\nThe breakthrough overcomes production bottlenecks for high-strength parts capable of withstanding extreme operating conditions.\nThe innovation is expected to accelerate the construction of next-generation wind farms and lower the final cost of generating clean energy.\nThis achievement cements the national industry's position as a key infrastructure supplier for the energy transition.","link":"https://wap.eastmoney.com/a/202608133839574969.html","categoria":"CLEAN ENERGY","lang":"en"},{"fonte":"chinanews.com.cn","pais":"China","titulo":"Hebei Province Launches Pilot Project Focused on Computing Power Token Economy","resumo":"Hebei, one of China's leading provinces in data processing capacity, has initiated tests on the \"token economy.\"\nThe initiative aims to commercialize computing power through standardized units to optimize the use of local infrastructure.\nThe measure meets the growing demand from technology companies and startups requiring training for AI models.\nIf successful, the business model could be replicated in other technological hubs across China.","link":"https://www.chinanews.com.cn/cj/2026/08-13/10676981.shtml","categoria":"DIGITAL ECONOMY","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"Indian Physicist Deepak Dhar Wins 2026 Dirac Medal for Contributions to Statistical Physics","resumo":"Renowned Indian physicist Deepak Dhar has been awarded the prestigious 2026 Dirac Medal for his foundational contributions to the field of statistical physics. His advanced research has helped unravel complex phenomena and phase behaviors in various physical systems. The international award highlights the prominence of Indian science and its ongoing impact on global theoretical physics.","link":"https://www.moneycontrol.com/news/science/indian-physicist-deepak-dhar-wins-2026-dirac-medal-for-revealing-the-science-behind-mysterious-sandpile-avalanches-14004082.html","categoria":"SCIENCE","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"India's Health Minister Releases Policy Paper on Artificial Intelligence in Medical Technology","resumo":"India's Health Minister, J.P. Nadda, has presented a technical report focused on integrating artificial intelligence into the medical technology sector. The document maps out strategies to modernize the healthcare system, optimize diagnoses, and expand innovative treatments. The initiative aims to position the country at the forefront of digital transformation and tech-driven healthcare.","link":"https://newsonair.gov.in/health-minister-nadda-releases-knowledge-paper-on-ai-in-medical-technology/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Capital Economics","pais":"India","titulo":"India and the AI Economy: What Market Consensus Is Missing","resumo":"A new analysis on India's AI economy highlights crucial nuances of the country's tech ecosystem that are often underestimated by global analysts. The research addresses the rapid adoption of emerging technologies, local infrastructure, and scaling capacity for artificial intelligence-based businesses. The study signals unique investment and development opportunities within the Indian market.","link":"https://www.capitaleconomics.com/events/asia-drop-india-and-ai-economy-what-consensus-missing","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Asian Business Review","pais":"India","titulo":"Financial Technology Spending in India Projected to Grow 21% Annually","resumo":"Investments in India's fintech sector are projected to see a continuous annual growth rate of 21%, driven by the mass digitalization of banking services. The acceleration of digital payment methods and credit solutions is opening up new market fronts for startups and corporations. This growth solidifies India as one of the fastest-expanding fintech hubs on the global stage.","link":"https://asianbusinessreview.com/insurance/news/india-financial-technology-spending-grow-21-annually","categoria":"FINTECH","lang":"en"},{"fonte":"Daily Pioneer","pais":"India","titulo":"BRICS Meeting on Oceanic and Polar Science Kicks Off in Goa Under India's Presidency","resumo":"The BRICS meeting dedicated to oceanic and polar science research has kicked off in Goa, hosted under India's leadership. The event brings together experts to discuss climate change, marine conservation, and the sustainable exploration of the oceans. The gathering reinforces scientific cooperation among emerging economies to address urgent global environmental challenges.","link":"https://dailypioneer.com/news/8th-brics-oceanic-polar-science-and-tech-meet-begins-in-goa","categoria":"SCIENCE","lang":"en"},{"fonte":"India Technology News","pais":"India","titulo":"IIT Delhi Opens Applications for Applied Data Science and Artificial Intelligence Program","resumo":"The renowned Indian Institute of Technology Delhi (IIT Delhi) has announced the opening of the selection process for its Data Science and AI specialization program. The initiative aims to qualify professionals to handle advanced machine learning and predictive analytics tools. The course seeks to meet the market's growing demand for talent specialized in disruptive technologies.","link":"https://indiatechnologynews.in/cep-iit-delhi-opens-admissions-for-fourth-batch-of-certificate-programme-in-applied-data-science-and-artificial-intelligence/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"News On AIR","pais":"India","titulo":"India's $30 Trillion Economy Vision by 2047 Creates Opportunities for Businesses","resumo":"India's Commerce Minister has reinforced the country's goal of reaching a $30 trillion economy by 2047, the centennial of its independence. The strategic plan focuses on industrial strengthening, technological advancements, and attracting foreign direct investment. The projection points to a highly promising scenario for global corporations and innovation ecosystems.","link":"https://newsonair.gov.in/union-minister-piyush-goyal-says-bharatiya-vyapar-mahotsav-will-showcase-indias-growing-prowess-across-sectors/","categoria":"BUSINESS","lang":"en"},{"fonte":"The Economic Times","pais":"India","titulo":"How Playo Is Transforming Recreational Sports Into a Scalable Business Model","resumo":"The Playo platform has been making waves in India by connecting sports enthusiasts with courts and arenas through digital technology. The startup has developed an ecosystem that simplifies scheduling and engages local communities to promote an active lifestyle. This model establishes amateur sports as a highly profitable market experiencing a tech-driven boom.","link":"https://m.economictimes.com/small-biz/sme-sector/from-courts-to-communities-how-playo-is-turning-recreational-sports-into-a-scalable-business/articleshow/133200155.cms","categoria":"INNOVATION","lang":"en"},{"fonte":"Meteored Portugal","pais":"Portugal","titulo":"Can a Simple Fungus Help Build a Base on Mars? Portuguese Science Believes So","resumo":"Portuguese researchers are investigating how certain types of fungi can be used to construct infrastructure on Mars.\nThis innovative biotechnology approach seeks to transform space resources and local materials into resilient structures.\nThe project highlights Portugal's scientific role in advancing space exploration and off-Earth sustainability.","link":"https://www.tempo.pt/noticias/astronomia/um-simples-fungo-pode-ajudar-a-construir-uma-base-em-marte-a-ciencia-portuguesa-acredita-que-sim.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"BYD Surpasses 3,200 Super Plug-in Hybrid Sales in Portugal","resumo":"Chinese electric vehicle manufacturer BYD has reached a significant milestone in the Portuguese automotive market by surpassing 3,200 units sold of its plug-in hybrid models.\nThis growth reflects the strong energy transition underway in the country's transportation sector and growing consumer preference for more sustainable options.\nThe result solidifies the brand as one of the leaders in electrified mobility in the region.","link":"https://jornaleconomico.sapo.pt/noticias/byd-ultrapassa-3-200-vendas-de-super-hibridos-plug-in-em-portugal/","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"The Best European Economy: Le Figaro Highlights Portuguese Growth Driven by Technology and Unicorns","resumo":"Prestigious French newspaper Le Figaro has praised Portugal's economic performance, pointing to the innovation ecosystem as the central engine of this progress.\nThe emergence of new unicorns and the attraction of technology investments have driven the national GDP above the European average.\nThis international recognition reinforces the country's position as a strategic tech hub in Europe.","link":"https://sapo.pt/artigo/a-melhor-economia-europeia-le-figaro-destaca-crescimento-portugues-impulsionado-por-tecnologia-e-unicornios-6a7cb73be7c4d45e90b00850","categoria":"BUSINESS","lang":"en"},{"fonte":"TVI","pais":"Portugal","titulo":"Ciência Viva Sets Up \"Solar Scope\" to Project the Sun and Observe the Eclipse","resumo":"The Ciência Viva network has prepared a special setup featuring a \"solar scope\" equipment to allow the public to safely observe the eclipse in Portugal.\nThe technology projects the Sun's image in real time, avoiding direct risks to eyesight during the astronomical phenomenon.\nThe initiative aims to democratize access to scientific knowledge and spark public interest in astronomy.","link":"https://tvi.iol.pt/noticias/videos/ciencia-viva-monta-solar-scope-para-projetar-o-sol-e-fazer-observacoes-durante-o-eclipse/6a7ca1b40cf2f6a1a1e73c64","categoria":"ASTRONOMY","lang":"en"},{"fonte":"turbo.pt","pais":"Portugal","titulo":"Jaguar Type 01 Reveals Minimalist Interior with Hidden Technology","resumo":"Jaguar has unveiled the concept for the Type 01 model, highlighting a futuristic cabin that conceals technological elements until they are needed.\nThe minimalist design prioritizes high-quality materials and a clean, intuitive driving experience for the motorist.\nThis approach reflects the British brand's new design language and innovation for the electric vehicle era.","link":"https://www.turbo.pt/jaguar-type-01-revela-interior-minimalista-com-tecnologia-escondida/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Executive Digest","pais":"Portugal","titulo":"iServices: Repair as the Driving Force of a More Circular Economy","resumo":"iServices has reaffirmed its commitment to sustainability by promoting the maintenance and repair of electronic devices as an alternative to disposal.\nBy extending the lifespan of smartphones and computers, the initiative reduces electronic waste generation in Portugal.\nThe business model demonstrates how technology and repair can drive a circular and conscious economy.","link":"https://executivedigest.sapo.pt/iservices-a-reparacao-como-motor-de-uma-economia-mais-circular/","categoria":"SUSTAINABILITY","lang":"en"},{"fonte":"Algarve Marafado","pais":"Portugal","titulo":"Lagoa is upgrading public lighting: 70% of the municipality already features LED technology","resumo":"The municipality of Lagoa has advanced its urban infrastructure modernization by reaching the milestone of 70% of public lighting converted to LED.\nThe transition aims to ensure greater energy efficiency, reduce carbon emissions, and lower the city's operational costs.\nThe measure consolidates local commitment to adopting smart technologies focused on sustainability.","link":"https://www.algarvemarafado.com/2026/08/12/lagoa-esta-a-mudar-a-iluminacao-publica-70-do-concelho-ja-tem-tecnologia-led/","categoria":"SMART CITIES","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"SIC Notícias live broadcast: everything about the eclipse in Portugal","resumo":"SIC Notícias provided comprehensive, real-time coverage of the solar eclipse passing over Portuguese territory.\nThe broadcast featured analysts, astronomers, and live reporting showing the public's engagement across various parts of the country.\nThe extensive media coverage highlighted the immense popular and scientific appeal of rare astronomical events.","link":"https://expresso.pt/sociedade/ciencia/2026-08-12-video-emissao-sic-noticias-em-direto-tudo-sobre-o-eclipse-em-portugal-3c5cebe3","categoria":"TRENDS","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
