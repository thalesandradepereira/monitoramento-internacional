s transforming traditional agriculture into an attractive sector for new generations.\nThe implementation of artificial intelligence, monitoring sensors, and drones makes it possible to optimize harvesting and the use of resources such as water.\nThis modernization drives sustainability and ensures generational turnover in one of Spain's most important industries.","link":"https://www.jaenhoy.es/jaen/rosa-gallardo-inteligencia-artificial-tecnologia-olivar_0_2007856726.html","categoria":"AGROTECH","lang":"en"},{"fonte":"Motor16","pais":"Spain","titulo":"Hybrid Cars Lead Sales as Electrified Models Already Account for 25% of the Market","resumo":"The Spanish automotive market is recording accelerated growth in the adoption of sustainable propulsion technologies.\nHybrid vehicles have become consumers' preferred choice, driving electrified models to reach the milestone of one in every four sales nationwide.\nThe trend reflects stricter environmental requirements and the search for greater energy efficiency in urban mobility.","link":"https://www.motor16.com/las-ultimas-noticias/ventas-coches-hibridos-2/","categoria":"MOBILITY","lang":"en"},{"fonte":"PR Newswire UK","pais":"Germany","titulo":"Dual-Zone Airflow and No-Pre-Freeze Technology: Dreame Brings Smart Cooking to IFA 2026","resumo":"Dreame showcased its newest smart kitchen appliance innovations during the IFA technology trade show.\nThe technology features dual-zone airflow and rapid food preparation without the need for pre-freezing.\nThis novelty aims to transform the home cooking experience with greater efficiency, practicality, and automation.\nThe announcement highlights the rapid advancement of connected and smart home appliances in the global market.","link":"https://www.prnewswire.co.uk/news-releases/dual-zone-airflow--10-minute-no-pre-freeze-technology-dreame-brings-smarter-cooking-to-your-dream-kitchen-at-ifa-2026-302870441.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Börse Express","pais":"Germany","titulo":"D-Wave Quantum Shares: AT\u0026T Integrates Quantum Technology","resumo":"Telecommunications giant AT\u0026T has announced the integration of D-Wave's quantum computing solutions into its operations.\nThis initiative marks a significant commercial milestone in the practical application of quantum processing for network optimization.\nThe use of this technology aims to solve highly complex logistical and operational problems in the telecommunications sector.\nThe partnership has boosted investor interest and D-Wave's visibility in the tech financial market.","link":"https://www.boerse-express.com/news/articles/d-wave-quantum-aktie-att-integriert-quanten-technologie-944928","categoria":"QUANTUM COMPUTING","lang":"en"},{"fonte":"t3n","pais":"Germany","titulo":"Paper Instead of the Cloud: QR Codes as Offline Music Storage","resumo":"A new experimental approach proposes using QR codes printed on paper as offline audio storage.\nThe idea seeks to bypass the continuous reliance on cloud services and a stable internet connection for playback.\nBy storing visually compressed sound data, the method offers a physical and durable alternative for preservation.\nThe concept sparks interesting discussions regarding privacy, data sovereignty, and new uses for physical media.","link":"https://t3n.de/news/qr-musikkassette-lied-speicherung-offline-1759093/","categoria":"INNOVATION","lang":"en"},{"fonte":"Tek Notícias","pais":"Germany","titulo":"Hisense Brings RGB MiniLED Evo Technology with Chromagic 2.0 to Its TV Lineup at IFA","resumo":"Hisense unveiled its new generation of televisions at the IFA trade show, highlighting RGB MiniLED evo technology.\nEquipped with the new Chromagic 2.0 color engine, the devices deliver greater chromatic precision and contrast.\nThe innovation aims to elevate image quality and energy efficiency in large-format premium screens.\nThe launch solidifies the manufacturer's strategy to lead technological trends in the global display market cles/8d5390bba9150b98720c0cac310dea1029fa52e1","categoria":"ENGINEERING","lang":"en"},{"fonte":"gazetadopovo.com.br","pais":"Japan","titulo":"Japan Increases Defense Spending and Overhauls Post-War Pacifist Guidelines","resumo":"The Japanese government has approved new budgets focused on modernizing its Self-Defense Forces and military technologies.\nThis shift marks a historic turning point in the pacifist stance adopted by the country since World War II.\nThe strategy seeks to respond to growing geopolitical instability and rising regional tensions in the Asia-Pacific.","link":"https://www.gazetadopovo.com.br/mundo/japao-acelera-investimento-militar-para-enfrentar-ameacas-de-china-e-russia/","categoria":"GEOPOLITICS","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Fukushi Ochiai Cast as the New Voice of the Protagonist in the 'KochiKame' Anime","resumo":"Voice actor Fukushi Ochiai, son of baseball legend Hiromitsu Ochiai, has been announced as the new voice of Kankichi Ryotsu.\nThe casting refreshes the ensemble cast of one of Japanese pop culture's most iconic and enduring manga and anime franchises.\nDuring the announcement, Ochiai shared memories of his father and celebrated the opportunity to play the legendary character.","link":"https://news.yahoo.co.jp/articles/a7f465c9129974dc2439a889f3588f5426d36a8e","categoria":"ENTERTAINMENT","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Producers of NHK's New Historical Drama Promise a Blockbuster Without Sacrificing Accuracy","resumo":"The creative team behind NHK's upcoming historical series has revealed behind-the-scenes insights and grand ambitions for the production of the drama 'Toyotomi Kyodai'.\nThe team aims to match the scale of recent major blockbusters while maintaining rigorous respect for historical facts.\nThe project promises to captivate audiences and renew public interest in the country's major historical narratives.","link":"https://news.yahoo.co.jp/articles/c2b415e7953830fc to Accelerate Practical Application of Artificial Intelligence","resumo":"The city of Guangzhou has adopted a package of measures to accelerate the practical application of Artificial Intelligence technologies in everyday life.\nThe actions aim to overcome implementation bottlenecks in strategic sectors such as transportation, public health, and community services.\nThe initiative seeks to translate theoretical algorithmic innovations into direct, measurable improvements in citizens' quality of life.","link":"https://www.chinanews.com.cn/sh/2026/09-05/10690883.shtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"mycaijing.com","pais":"China","titulo":"BC Technology Gains Traction and Sparks Market Competition for Photovoltaic Solar Panels","resumo":"The solar market faces new operational dynamics with industry giant LONGi making a strong bet on back-contact technology.\nExperts are discussing whether this photovoltaic architecture will become the new dominant standard in global renewable energy generation.\nThis technological evolution promises expressive gains in energy efficiency, driving competition and innovation in the photovoltaic industry.","link":"https://www.mycaijing.com/article/detail/580494?source_id=40","categoria":"RENEWABLE ENERGY","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"China and Oman Hold Training Session on Collaborative AI and Power Grid Optimization","resumo":"Fudan University hosted an international training program bringing together experts from China and Oman in the field of Artificial Intelligence.\nThe training covered the intelligent integration between computing processing capacity and electrical power distribution grids.\nThe collaboration seeks to develop efficient systems to optimize energy consumption in high-demand digital infrastructure.","link":"https://www.stdaily.com/web/gdxw/2026-09/04/content_575471.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"Chinese Research Advances in the Study and Monitoring of Sea Ice in the Arctic Ocean","resumo":"Chinese researchers have presented new findings on sea ice monitoring and environmental dynamics in the Arctic Ocean.\nThe study utilizes advanced polar observation technologies to analyze temperature variations and global climate change.\nThe data obtained contributes significantly to the improvement of weather forecasting models and ecological preservation.","link":"https://www.news.cn/tech/20260904/9d7cfee1a49848dda9d5a6e758e5d230/c.html","categoria":"SCIENCE","lang":"en"},{"fonte":"Moneycontrol.com","pais":"India","titulo":"Noise Master Buds Open with Bose Technology Unveiled at IFA Berlin, India Launch Confirmed","resumo":"Noise officially unveiled its new Master Buds Open earbuds during IFA Berlin, integrating renowned audio technology from Bose. The device promises to deliver a high-quality sound experience combined with an open, ergonomic design. With the announcement of their imminent launch in the Indian market, the new release strengthens the brand's presence in the wearable audio sector.","link":"https://www.moneycontrol.com/technology/noise-master-buds-open-with-sound-by-bose-technology-unveiled-at-ifa-berlin-2026-india-launch-set-for-late-september-article-14023220.html","categoria":"PRODUCT LAUNCH","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"30 Years in Tech: Anil Chakravarthy's Journey from Bengaluru to Adobe Leadership","resumo":"With a solid three-decade trajectory in the technology industry, Anil Chakravarthy stands out as one of the sector's leading global figures. An IIT alumnus with a specialization from MIT, his journey from Bengaluru to top executive roles at Adobe reflects the strength of Indian talent. The executive assumes a pivotal role in directing the strategic growth and expansion of the company's software and artificial intelligence solutions.","link":"https://timesofindia.indiatimes.com/education/news/30-years-in-technology-anil-chakravarthys-journey-from-bengaluru-and-iit-mit-to-becoming-adobes-next-ceo/articleshow/133786839.cms","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"scanx.trade","pais":"India","titulo":"Godavari Biorefineries Secures European Patent for Bio-Filler Technology","resumo":"Indian company Godavari Biorefineries has secured a major European patent for its innovative renewable bio-filler technology. This scientific and technological breakthrough makes it possible to replace synthetic and fossil-based materials with sustainable alternatives across various industries. The achievement reinforces India's role in developing eco-friendly biotechnological solutions with global impact.","link":"https://scanx.trade/stock-market-news/companies/godavari-biorefineries-secures-european-patent-biofiller-technology/50140360","categoria":"INNOVATION","lang":"en"},{"fonte":"traveltradejournal.com","pais":"India","titulo":"Emirates Reveals the World's First Fully Electric Premium Economy Seat","resumo":"Airline Emirates has introduced an unprecedented technological innovation for commercial aviation with the launch of power-adjustable seats for the Premium Economy class. The new seats feature full-height privacy panels, offering greater comfort and exclusivity to passengers. This new development sets a standard for the flight experience and demonstrates the ongoing automation of aircraft interiors.","link":"https://traveltradejournal.com/emirates-unveils-worlds-first-electrically-powered-premium-economy-seat-with-full-height-privacy-screen/","categoria":"INNOVATION","lang":"en"},{"fonte":"The Indian Express","pais":"India","titulo":"Minister Celebrates International Earth Science Olympiad Winners; India Bags 9 Medals","resumo":"The Indian government publicly honored the students who represented the country at the International Earth Science Olympiad. The Indian delegation achieved a historic performance by winning a total of nine medals at the global scientific competition. This result highlights the strengthening of exact and natural sciences education in the country, encouraging new generations of researchers.","link":"https://indianexpress.com/article/education/union-minister-felicitated-international-earth-science-olympiad-2026-winners-india-bags-9-medals-10864166/","categoria":"SCIENCE","lang":"en"},{"fonte":"The Indian Express","pais":"India","titulo":"ASUS Wireless Mouse MD105 Review: An Ergonomic Mouse for Everyday Productivity","resumo":"The ASUS MD105 wireless mouse undergoes a detailed evaluation focused on its performance and ergonomics for daily office tasks. The accessory stands out for its stable connectivity, efficient power consumption, and comfortable design for long working hours. The review concludes that the peripheral offers excellent value for money for users looking for functionality and practicality.","link":"https://indianexpress.com/article/technology/tech-reviews/asus-wireless-mouse-md105-review-10864283/","categoria":"REVIEW","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"Teachers' Day: AI Can Answer in Seconds, But Teachers Build Curiosity","resumo":"Amidst the rapid advancement of artificial intelligence tools in education, the role of educators is undergoing a profound reassessment. Although algorithms can provide instant answers, analysts point out that stimulating curiosity and critical thinking remains an exclusively human attribute. The debate reinforces the importance of technology as a pedagogical ally without replacing the central figure of the teacher.","link":"https://timesofindia.indiatimes.com/life-style/parenting/moments/teachers-day-ai-can-deliver-answers-in-seconds-but-teachers-do-what-technology-cannot-build-curiosity-critical-thinking-and-independent-minds/articleshow/133789118.cms","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"NDTV","pais":"India","titulo":"Opinion: Why India's Gen Z Is Moving Away from Traditional Politics","resumo":"A new socio-political landscape is emerging in India as Generation Z seeks alternatives to traditional party models. Disillusioned with conventional rhetoric, young people use digital platforms to organize movements focused on specific causes such as climate change, economics, and technology. This transformation reflects a profound shift in citizen participation and social engagement in the new digital era.","link":"https://www.ndtv.com/opinion/why-indias-gen-z-is-done-with-politicians-12001752","categoria":"TRENDS","lang":"en"},{"fonte":"TSF","pais":"Portugal","titulo":"\"Cybercab\": Tesla's Robotaxi Is Now Driving on North American Streets","resumo":"Tesla's new autonomous vehicle, called the Cybercab, has started practical road testing on public streets in the United States. This breakthrough represents a crucial step toward consolidating Elon Musk's company driverless transportation services. The initiative aims to demonstrate the safety of the system and accelerate the commercialization of its own robotaxi fleet in the global market.","link":"https://www.tsf.pt/amp/18123400/cybercab-o-robotaxi-da-tesla-ja-circula-em-ruas-norte-americanas","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"RTP","pais":"Portugal","titulo":"Amália AI Model to Get Additional Capabilities to Help with Public Services","resumo":"The Portuguese government is upgrading the Amália artificial intelligence model to improve the services provided to citizens through public support channels. The update promises greater efficiency, agility, and accuracy in answering questions and carrying out administrative procedures. The project solidifies the digital modernization of state services and serves as a benchmark for applying AI in public management.","link":"https://www.rtp.pt/noticias/economia/modelo-de-ia-amalia-vai-ter-capacidades-adicionais-para-ajudar-no-atendimento-publico_n1763424","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Viana TV","pais":"Portugal","titulo":"Ponte de Lima Invests Nearly One Million Euros in Technology and Robotics in Schools","resumo":"The municipality of Ponte de Lima has announced a massive investment aimed at supplying technological equipment and robotics kits to the local school network. The measure seeks to equip classrooms with modern tools to encourage students' technical and digital learning from an early age. The project aims to prepare new generations for the challenges of the future technological job market.","link":"https://vianatv.pt/ponte-de-lima-investe-quase-um-milhao-de-euros-em-tecnologia-e-robotica-nas-escolas/","categoria":"ROBOTICS","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Elvira Fortunato: “In science, bureaucracy suffocates us and strips away our competitiveness”","resumo":"Former minister and scientist Elvira Fortunato has warned about the negative impacts that excessive bureaucracy causes on scientific development and talent retention in Portugal. According to the expert, slow and bureaucratic administrative processes prevent the country from competing on equal terms with international institutions. The warning reinforces the urgent need for reforms in investment management and support for academic research.","link":"https://sapo.pt/artigo/elvira-fortunato-na-ciencia-a-burocracia-asfixia-nos-e-tira-nos-competitividade-6a9a9ddf672edd257f06d3b9","categoria":"SCIENCE","lang":"en"},{"fonte":"Diário de Aveiro","pais":"Portugal","titulo":"Young People Learn and Create Ways to Communicate Science","resumo":"Educational projects in Portugal are encouraging young students to develop innovative and accessible techniques for science communication. The initiative trains students to use digital media and simplified language to bring complex concepts closer to the general public. This movement strengthens scientific literacy in society and sparks early academic vocations.","link":"https://www.diarioaveiro.pt/2026/09/05/jovens-aprendem-e-criam-formas-de-comunicar-a-ciencia/","categoria":"SCIENCE","lang":"en"},{"fonte":"radiovizela.pt","pais":"Portugal","titulo":"Vizela Is Now 100% Covered by LED Technology","resumo":"The municipality of Vizela has completed the transition process to public lighting entirely composed of LED fixture technology. The modernization will bring a drastic reduction in energy consumption and maintenance costs for public coffers. In addition to the positive financial impact, the measure improves the city's environmental sustainability and increases the quality of lighting on public roads.","link":"https://www.radiovizela.pt/noticia-vizela-passa-a-estar-100-coberta-por-tecnologia-led","categoria":"INNOVATION","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"How Did Volkswagen Reach the Point of Cutting 100,000 Jobs and Closing Factories?","resumo":"Volkswagen is facing severe restructuring driven by the slowdown in the transition to electric vehicles and increased global competition, especially from Chinese manufacturers. Faced with these economic challenges, the German automaker plans to close historic plants and eliminate thousands of jobs. The crisis reflects the deep transformations and operational pressures hitting the traditional automotive sector.","link":"https://expresso.pt/podcasts/economia-dia-a-dia/2026-09-05-como-e-que-a-volkswagen-chegou-ao-ponto-de-cortar-100-mil-empregos-e-fechar-fabricas--d8e5a781","categoria":"TRENDS","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"Fitch Upgrades Portugal's Credit Rating to A+ and Highlights Public Debt Reduction","resumo":"Rating agency Fitch has upgraded Portugal's sovereign rating to A+, citing solid fiscal performance and the consistent trajectory of public debt reduction. The improvement in the assessment reflects macroeconomic stability and boosts international investors' confidence in the country's financial market. The result consolidates the strengthening of Portugal's public accounts on the European scene.","link":"https://expresso.pt/economia/2026-09-04-fitch-sobe-rating-de-portugal-para-a--e-destaca-reducao-da-divida-publica-480df972","categoria":"BUSINESS","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
