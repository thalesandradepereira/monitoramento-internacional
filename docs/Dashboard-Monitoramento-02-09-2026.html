ent of early diagnostics and targeted therapies for various complex pathologies.","link":"https://www.keio.ac.jp/ja/press-release/20260902-press-01/","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"kanazawa-u.ac.jp","pais":"Japan","titulo":"New Technology Uses Light Colors to Analyze Cells and Detect Cancer Changes","resumo":"Scientists have developed an innovative technology that analyzes the state of cells based on the spectrometry of light color.\nThe method makes it possible to visualize molecular condensation in living cells without the need for invasive interventions.\nAdditionally, the tool has demonstrated effectiveness in the early detection of anomalies associated with cancerous cell development.","link":"https://www.kanazawa-u.ac.jp/miraichi/186617/","categoria":"SCIENCE AND HEALTH","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"Standard Published for Quantum Technology Professionals Aiming at Social Implementation","resumo":"The qualification standard for professionals working in the quantum computing ecosystem has been officially formulated and released.\nThe guideline establishes essential technical competencies to accelerate the adoption and practical application of this technology in society.\nWith this standardization, the goal is to train new talent and strengthen the transition from quantum research to industry.","link":"https://prtimes.jp/main/html/rd/p/000000212.000035215.html","categoria":"QUANTUM COMPUTING","lang":"en"},{"fonte":"kfb.co.jp","pais":"Japan","titulo":"Science Explains the Pain Relief Mechanism Through Acupuncture Point Stimulation","resumo":"Recent scientific studies are beginning to unravel the biological principles of Eastern medicine by analyzing the stimulation of specific body points.\nResearchers have identified how pressure on these points triggers nerve pathways that release natural pain-relieving substances in the central nervous system.\nScientific validation brings traditional medicine closer to modern practices, offering a foundation for alternative pain relief treatments.","link":"https://www.kfb.co.jp/news/article/16857490","categoria":"SCIENCE","lang":"en"},{"fonte":"朝日新聞","pais":"Japan","titulo":"Micro energy harvesting technology illuminates evacuation routes during blackouts in Japan","resumo":"A social demonstration project in Onagawa City tested the effectiveness of micro energy harvesting technology for emergency situations. The system captures small amounts of energy from the environment to maintain illuminated evacuation routes during power outages. The initiative reinforces the disaster prevention infrastructure, ensuring greater safety for the population during crises and natural catastrophes.","link":"https://www.asahi.com/articles/ASV914691V91UNHB00GM.html","categoria":"INNOVATION","lang":"en"},{"fonte":"Nikkei Asia","pais":"Japan","titulo":"Google will accelerate chip launches to maintain leadership in artificial intelligence","resumo":"Google's technology chief announced that the company will speed up the production and deployment schedule for its own AI chips. The strategy aims to sustain the company's competitive advantage in the face of the accelerated advancement of new models and competitors in the sector. The move highlights the growing dispute over the hardware infrastructure needed to power generative artificial intelligence systems.","link":"https://asia.nikkei.com/business/technology/artificial-intelligence/google-to-speed-up-chip-rollout-to-stay-ahead-in-ai-technology-chief-says","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"ロイター","pais":"Japan","titulo":"United States calls on G20 meeting to avoid severe regulations on AI","resumo":"During the G20 technology meeting, representatives from the United States defended not imposing excessively strict rules on artificial intelligence. The American delegation argued that too early or too strict regulations could stifle innovation and global technological progress. The stance reflects the ongoing international debate on how to balance security, ethics and the development of the AI ​​sector.","link":"https://jp.reuters.com/world/security/4BDK3AF3VFKQXIZOQSBGQXR7X4-2026-09-01/","categoria":"TECHNOLOGY AND POLICY","lang":"en"},{"fonte":"中国科学院","pais":"China","titulo":"China Sky Eye Telescope Makes New Discovery About Why Star Formation in the Universe Has Slowed","resumo":"The Chinese FAST radio telescope (known as the 'China Sky Eye') has provided an important new astronomical discovery about the evolution of the universe. Researchers analyzed neutral hydrogen gas in galaxies and identified environmental and dynamic factors that explain the reduction in the rate of star formation over cosmic time. The research reinforces China's scientific leadership in the study of astrophysics and the large-scale structure of the cosmos.","link":"https://www.cas.cn/cm/202609/t20260902_5119555.shtml","categoria":"SCIENCE","lang":"en"},{"fonte":"电子工程专辑","pais":"China","titulo":"Breaking Outside Monopolies: Visionox ViP Technology Redefines the Global Display Landscape","resumo":"Chinese display manufacturer Visionox has achieved an industrial breakthrough with its ViP photolithography technology for AMOLED displays. The innovation eliminates dependence on traditional thin metal masks, enabling higher pixel density, lower power consumption and extended lifespan for electronic device screens. The milestone strengthens China's technological sovereignty in the global advanced display supply chain.","link":"https://www.eet-china.com/mp/a521996.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"thepaper.cn","pais":"China","titulo":"Elon Musk predicts that AI will boost global economy by up to 30% and humanoid robots will surpass 1 billion in a decade","resumo":"During recent statements about the future of technology, Elon Musk highlighted that artificial intelligence has the potential to expand the world economy by 20% to 30%. The entrepreneur also projected tha he Beijing-Tianjin-Hebei region has officially started. The initiative brings together cutting-edge research centers to create networks of sensors and advanced algorithms capable of tracking the transmission of pollutants in real time. The system promises to raise the level of precision in environmental management and combating atmospheric pollution.","link":"http://news.ustc.edu.cn/info/1055/96085.htm","categoria":"SCIENCE AND TECH","lang":"en"},{"fonte":"东方财富","pais":"China","titulo":"Inovance Technology integrates large AI models into an industrial platform for autonomous agents","resumo":"Inovance Technology has connected large external AI and language models to its IFG industrial platform, enabling advanced automation on the factory floor. The solution enables customers to autonomously develop customized industrial applications and intelligent agents capable of optimizing complex production processes. The movement accelerates digital transformation and the convergence between generative AI and smart manufacturing.","link":"https://wap.eastmoney.com/a/202609023862491036.html","categoria":"INDUSTRIAL AUTOMATION","lang":"en"},{"fonte":"sd.chinanews.com.cn","pais":"China","titulo":"AI Intelligent Perception Technology Enhances Safety Supervision in Field Drilling","resumo":"Shandong coal geology team implemented artificial intelligence-based smart sensing systems to overcome bottlenecks in field drilling safety. The technology continuously monitors high-risk operating conditions, identifying anomalies and preventing accidents in real time during complex geological work. The solution sets a new digital standard for worker safety in remote industrial operations.","link":"http://www.sd.chinanews.com.cn/2/2026/0902/103789.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"The Indian Express","pais":"India","titulo":"Meta launches Muse Voice Transcribe with support for 5 Indian languages","resumo":"Meta introduced Muse Voice Transcribe, a new artificial intelligence tool aimed at accurately converting speech to text. The technology now has native support for five major Indian languages, aiming to expand accessibility and digital reach in the country. The initiative reinforces investments by technology giants in creating linguistic tools adapted to the diversity of the Indian market.","link":"https://indianexpress.com/article/technology/artificial-intelligence/meta-launches-muse-voice-transcribe-with-support-for-5-indian-languages-10859850/","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"TechCrunch","pais":"India","titulo":"Reliance's JioHotstar takes its streaming empire to the global non-sports market","resumo":"The JioHotstar platform, the result of Indian giant Reliance, began its international expansion plan to bring entertainment content to new global audiences. Unlike the strategy adopted in India, the international offer does not include live sports broadcasts, focusing on films, series and original productions. The move seeks to position the company as a relevant force in the global streaming sector, competing directly with major global players.","link":"https://techcrunch.com/2026/09/01/reliances-jiohotstar-takes-its-streaming-empire-global-without-sports/","categoria":"ENTERTAINMENT","lang":"en"},{"fonte":"HR News","pais":"India","titulo":"Hiring in India's IT sector hits 18-month high with 57,000 vacancies in September","resumo":"The information technology services market in India registered a strong recovery in September, reaching the highest hiring mark in 18 months. Around 57 thousand job vacancies were opened, driven by the demand for specialized skills and international digital transformation projects. The sector's growth signals a moment of renewed confidence by global companies in the country's technical talent ecosystem.","link":"https://www.peoplematters.in/news/business/india-it-services-hiring-hits-18-month-high-with-57000-open-roles-in-september-51838","categoria":"IT MARKET","lang":"en"},{"fonte":"International Rice Research Institute (IRRI)","pais":"India","titulo":"From science to scale: World Bank and Uttar Pradesh government advance climate innovations","resumo":"The World Bank and the government of Uttar Pradesh have entered into a strategic partnership to expand smart and sustainable agricultural solutions through the UP-AGREES program. The initiative aims to apply advanced scientific knowledge to create climate-resilient technologies for small producers. The project seeks to accelerate the scale-up of ecological agricultural practices, promoting food security and economic development in the region.","link":"https://www.irri.org/news-and-events/news/science-scale-world-bank-uttar-pradesh-govt-engage-agrees-scaling-climate","categoria":"SCIENCE AND CLIMATE","lang":"en"},{"fonte":"ET Auto","pais":"India","titulo":"Advancing green mobility in India should focus on technology and local added value","resumo":"The advancement of electric and clean mobility in India needs to go beyond the adoption of vehicles, focusing on technological development and domestic production.\nGovernment officials stressed that the energy transition should drive domestic innovation and generate added value for the local manufacturing industry.\nThe strategy aims to reduce dependence on imported components and consolidate the country as an exporter of sustainable technologies.","link":"https://auto.economictimes.indiatimes.com/amp/news/industry/indias-green-mobility-push-must-deliver-technology-value-addition-at-home-kumaraswamy/133699540","categoria":"Green Mobility","lang":"en"},{"fonte":"smestreet.in","pais":"India","titulo":"IIT Ropar and CRRID join forces to integrate technology and public policies","resumo":"The Indian Institute of Technology of Ropar has established formal cooperation with CRRID to bring technological innovations and public policy formulation closer together.\nThe alliance will focus on developing applied research that uses data and engineering solutions to solve regional socioeconomic challenges.\nThe initiative highlights the growing relevance of connecting cutting-edge academic output to practical governance and sustainable development needs.","link":"https://smestreet.in/technology/iit-ropar-and-crrid-join-hands-for-technology-and-public-policy-12482622","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"newspatrolling.com","pais":"India","titulo":"CyberPowerPC India expands educational focus with high-performance technology infrastructure","resumo":"CyberPowerPC India announced the expansion of its operations aimed at the education sector, providing high-performance computers and servers.\nThe company aims to help educational institutions and research centers structure modern computing environments for exact classes, artificial intelligence and engineering.\nThe initiative aims to meet the growing demand for advanced processing capacity in Indian universities and technical colleges.","link":"https://newspatrolling.com/cyberpowerpc-india-expands-education-focus-helping-institutions-build-smarter-high-performance-technology-infrastructure/","categoria":"STATE-OF-THE-ART INFRASTRUCTURE","lang":"en"},{"fonte":"TheWire.in","pais":"India","titulo":"Javelin Missile Agreement: Assembly in India and Transfer of US Technology","resumo":"India and the United States are advancing negotiations for the shared production of the Javelin anti-tank missile system on Indian soil.\nThe cooperation model provides for the gradual transfer of technology and local assembly, strengthening the capabilities of the country's defense industry.\nThe project exemplifies the strategic alliance between nations to modernize military equipment through joint technological development.","link":"https://thewire.in/security/decoding-the-javelin-atgm-deal","categoria":"DEFENSE AND TECHNOLOGY","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"Discovering planets and understanding “two of physics' greatest mysteries”: NASA lau ce in heavy-duty tasks, such as state-of-the-art games and content creation.","link":"https://www.pcguia.pt/2026/09/g-skill-lanca-memorias-ddr5-flare-x5x-com-tecnologia-amd-expo-de-latencia-ultra-baixa/","categoria":"HARDWARE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
