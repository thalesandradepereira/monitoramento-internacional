ientífica ressalta a necessidade de mais pesquisas experimentais e testes clínicos para que essas imunoterapias se tornem plenamente eficazes.","link":"https://www.elconfidencial.com/tecnologia/ciencia/2026-08-31/gran-obstaculo-vacuna-contra-cancer-moderna-merck-inteligencia-artificial_4413940/","categoria":"SAÚDE E CIÊNCIA","lang":"en"},{"fonte":"El Debate","pais":"Espanha","titulo":"Chega o grande salto da exploração espacial: por que o telescópio Roman revolucionará o estudo do cosmos","resumo":"O telescópio espacial Nancy Grace Roman, da NASA, promete inaugurar uma nova era no estudo da astronomia e da cosmologia moderna. Projetado com um campo de visão cem vezes maior que o do telescópio Hubble, ele permitirá mapear bilhões de galáxias e buscar exoplanetas com detalhamento inédito. A missão tem como objetivo principal desvendar os mistérios da energia escura e da matéria escura, fornecendo dados fundamentais sobre a expansão e estrutura do universo.","link":"https://www.eldebate.com/ciencia/20260831/llega-gran-salto-exploracion-espacial-telescopio-roman-revolucionara-estudio-cosmos_453515.html","categoria":"ASTRONOMIA","lang":"en"},{"fonte":"Xataka","pais":"Espanha","titulo":"Não basta encher as cidades de árvores contra o calor: a ciência revela quais esfriam mais e como posicioná-las","resumo":"Estudos científicos recentes demonstram que o simples plantio de árvores em áreas urbanas não garante a redução efetiva das ilhas de calor nas metrópoles. Pesquisadores identificaram que a arquitetura das copas, o tipo de folhagem e o arranjo espacial das espécies influenciam diretamente o microclima local. Com base nesses dados, especialistas recomendam que os planejadores urbanos adotem estratégias baseadas em evidências para maximizar o sombreamento e a transpiração vegetal em zonas críticas.","link":"https://www.xataka.com/ecologia-y-naturaleza/no-basta-llenar-ciudades-arboles-para-frenar-calor-ciencia-sabe-cuales-enfrian-como-debemos-colocarlos","categoria":"MEIO AMBIENTE","lang":"en"},{"fonte":"businessportal24","pais":"Alemanha","titulo":"VEGER: Campeã de Custo-Benefício com Tecnologia Própria Apresenta Novidades na IFA","resumo":"A fabricante de soluções de carregamento portátil VEGER apresenta suas mais recentes inovações tecnológicas durante a feira IFA.\nA empresa se destaca pelo excelente custo-benefício e pelo desenvolvimento de tecnologias próprias para baterias e carregamento rápido.\nA participação no evento reforça a expansão da marca no mercado europeu e mundial de eletrônicos de consumo.","link":"https://businessportal24.com/de/press-release/veger-preis-leistungs-champion-mit-eigener-technologie-jetzt-auf-der-ifa","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"Perspektive Online","pais":"Alemanha","titulo":"Schwarz Gruppe Planeja Data Center de IA em Rostock para Impulsionar Economia Alemã","resumo":"O Schwarz Gruppe anunciou planos para construir um grande centro de processamento de dados voltado para Inteligência Artificial perto de Rostock.\nO projeto visa acelerar a transformação digital e permitir que a economia alemã alcance líderes globais em infraestrutura de IA.\nA iniciativa representa um passo estratégico crucial para a soberania digital e tecnológica da Alemanha na Europa.","link":"https://perspektive-online.net/2026/08/schwarz-gruppe-plant-ki-rechenzentren-bei-rostock-deutsche-wirtschaft-im-aufholmodus/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"Spektrum der Wissenschaft","pais":"Alemanha","titulo":"Inibidor de Apetite: Pílula de Emagrecimento Chega às Farmácias Alemãs","resumo":"Um novo medicamento em comprimido voltado para a perda de peso e controle do apetite começa a ser comercializado nas farmácias da Alemanha.\nO avanço científico oferece uma alternativa acessível e conveniente aos tratamentos injetáveis de combate à obesidade.\nA chegada do produto marca uma nova fase no tratamento médico da obesidade e no mercado farmacêutico europeu.","link":"https://www.spektrum.de/news/abnehmen-abnehmtablette-kommt-in-deutsche-apotheken/2342433","categoria":"SAÚDE","lang":"en"},{"fonte":"DW.com","pais":"Alemanha","titulo":"A Tecnologia que Pode Reduzir Significativamente a Conta de Luz","resumo":"Novas soluções tecnológicas de eficiência energética vêm ganhando destaque por sua capacidade de otimizar o consumo elétrico residencial e comercial.\nEssas ferramentas utilizam gerenciamento inteligente e automação para identificar desperdícios e ajustar o uso de energia em tempo real.\nA adoção desses sistemas promete aliviar o orçamento das famílias e impulsionar a sustentabilidade no setor energético.","link":"https://www.dw.com/pt-br/a-tecnologia-que-pode-reduzir-a-conta-de-luz/video-78526234","categoria":"INOVAÇÃO","lang":"en"},{"fonte":"openPR.de","pais":"Alemanha","titulo":"Fraunhofer IEG Licencia Tecnologia MTD para Perfuração e Modernização de Poços","resumo":"O instituto de pesquisa Fraunhofer IEG concedeu a licença de sua tecnologia inovadora de perfuração direcionada (MTD) à Solexperts GmbH.\nA técnica permite otimizar e adaptar poços profundos e sistemas geotérmicos para os desafios energéticos do futuro.\nEssa parceria entre ciência e indústria promete acelerar a transição energética por meio de métodos geotérmicos mais eficientes.","link":"https://www.openpr.de/news/1321972/Ablenkbohrung-macht-Brunnen-fit-fuer-die-ZukunftFraunhofer-IEG-lizenziert-MTD-Technologie-an-Solexperts-GmbH-idw.html","categoria":"CIÊNCIA","lang":"en"},{"fonte":"DW.com","pais":"Alemanha","titulo":"Tecnologia Inovadora Leva a Experiência da Música para Pessoas Surdas","resumo":"Dispositivos e sistemas hápteis de última geração estão transformando frequências sonoras em vibrações táteis perceptíveis pelo corpo humano.\nA inovação possibilita que pessoas com deficiência auditiva sintam o ritmo e a melodia das músicas, promovendo maior inclusão cultural.\nO avanço demonstra o impacto positivo da tecnologia aplicada à acessibilidade e à democratização da arte.","link":"https://www.dw.com/pt-br/tecnologia-leva-m%C3%BAsica-a-pessoas-surdas/video-78526296","categoria":"ACESSIBILIDADE","lang":"en"},{"fonte":"PZ-news","pais":"Alemanha","titulo":"Alemanha Enfrenta Lenteza na Expansão da Rede de Carregamento para Caminhões Elétricos","resumo":"Associações do setor alertam que a Alemanha está avançando em ritmo muito lento na construção da infraestrutura de recarga para caminhões elétricos.\nA escassez de pontos de alta potência nas rodovias compromete o cumprimento das metas ambientais do transporte pesado.\nEspecialistas cobram medidas urgentes do governo para desburocratizar projetos e acelerar a migração para a frota sustentável.","link":"https://www.pz-news.de/wirtschaft/wirtschaft-weltweit_artikel,-Verband-Deutschland-kommt-beim-Lkw-Ladenetz-kaum-voran-_arid,2366431.html","categoria":"INFRAESTRUTURA","lang":"en"},{"fonte":"ZDNET Japan","pais":"Japão","titulo":"Ricoh desenvolve tecnologia de IA física capaz de aprender movimentos humanos a partir de vídeos","resumo":"A Ricoh anunciou o desenvolvimento de uma nova tecnologia de inteligência artificial física projetada para analisar e aprender os movimentos humanos diretamente através de dados de vídeo.\nA inovação busca automatizar tarefas complexas e aprimorar a interação entre robôs e seres humanos em ambientes industriais e comerciais.\nCom essa evolução, a empresa pretende impulsionar a eficiência operacional e acelerar a adoção de sistemas robóticos autônomos de próxima geração no mercado global.","link":"http://japan.zdnet.com/article/35252095/","categoria":"INTELIGÊNCIA ARTIFICIAL","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japão","titulo":"Toyota acelera desenvolvimento de condução autônoma para introduzir Nível 2++ até 2028","resumo":"A Toyota anunciou a aceleração dos seus projetos de automação veicular com o objetivo de lançar sistemas de condução autônoma de Nível 2++ para passageiros até o ano de 2028.\nA tecnologia permitirá uma assistência avançada que assume o controle em diversos cenários urbanos e rodoviários sob supervisão do motorista.\nEssa iniciativa visa fortalecer a competitividade da montadora japonesa frente às grandes empresas globais de veículos elétricos e inteligência artificial.","link":"https://news.yahoo.co.jp/articles/e5b7eb1f0096c2c0845b02c8db152db0f4ccb107","categoria":"TECNOLOGIA","lang":"en"},{"fonte":"客观日本","pais":"Japan","titulo":"Japanese Hayabusa2 Probe Performs Historic Approach to 400 Meters from Asteroid","resumo":"The Japanese space probe Hayabusa2 has successfully completed the closest approach ever recorded to the surface of an asteroid, reaching a distance of just 400 meters.\nThis unprecedented technical feat allowed for the collection of detailed images and valuable data regarding the composition and structure of the celestial body.\nThe success of the maneuver reinforces Japan's leadership in deep space exploration and contributes to fundamental research on the origin of the solar system.","link":"https://www.keguanjp.com/kgjp_keji/kgjp_kj_sea/pt20260831000012.html","categoria":"SPACE SCIENCE","lang":"en"},{"fonte":"NHKニュース","pais":"Japan","titulo":"Study Reveals Importance of Sensory Nerves in Maintaining Bone Density","resumo":"Researchers at the Tokyo University of Science have discovered that the sensory nervous system plays a direct and fundamental role in controlling bone density and strength.\nThe investigation demonstrated that signals transmitted by these nerves regulate cellular turnover within the skeleton, directly influencing bone integrity.\nThe finding opens new avenues for the development of innovative treatments against osteoporosis and other diseases associated with an aging population.","link":"https://news.web.nhk/newsweb/na/nd-20260830de47286","categoria":"SCIENCE","lang":"en"},{"fonte":"Business Wire","pais":"Japan","titulo":"Mitsubishi Electric Develops Task-Aware Unified Sound Separation Technology","resumo":"Mitsubishi Electric has introduced an innovative AI technology for unified sound source separation that adapts to the context of the user's current task.\nThe new system can isolate voices, ambient noise, and specific sounds with high precision, optimizing real-time audio processing.\nThe solution promises to transform the efficiency of smart devices, industrial communication systems, and robotic voice interfaces in noisy environments.","link":"https://www.businesswire.com/news/home/20260830649967/en/Mitsubishi-Electric-Develops-Task-Aware-Unified-Source-Separation-Technology","categoria":"TECHNOLOGICAL INNOVATION","lang":"en"},{"fonte":"Yahoo!ニュース","pais":"Japan","titulo":"Engineers Create VR Experience to Reconstruct Hiroshima After the Atomic Bombing","resumo":"Virtual reality technology engineers have developed an immersive project that allows users to explore an avatar walking through the reconstructed streets of Hiroshima shortly after the atomic bombing.\nThe initiative combines advanced computer graphics with detailed historical accounts to provide a deep understanding of the tragedy's impacts.\nThe tool aims to utilize the educational and empathetic power of VR technology to preserve historical memory and promote awareness for world peace.","link":"https://news.yahoo.co.jp/articles/0dd7d80b77547ab5624cb933a238416a7be5dd9f","categoria":"VIRTUAL REALITY","lang":"en"},{"fonte":"日経BP","pais":"Japan","titulo":"Japan's Ministry of Education Requests 77.8 Billion Yen for AI Infrastructure","resumo":"Japan's Ministry of Education, Culture, Sports, Science and Technology has requested 77.8 billion yen in its budget to structure cloud environments aimed at utilizing artificial intelligence in schools.\nThe investment aims to modernize the technological infrastructure of educational institutions and prepare students for the demands of the digital market.\nThe measure reflects the Japanese government's strategy to integrate advanced AI tools into the country's educational system.","link":"https://project.nikkeibp.co.jp/pc/atcl/19/06/21/00003/083100733/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"Japanese Team ZETA DIVISION Wins the 2026 Pokémon UNITE World Championship","resumo":"The Japanese eSports organization ZETA DIVISION captured the unprecedented 2026 Pokémon UNITE World Championship title by overcoming major international adversaries in the grand final.\nThe victory consolidates Japan's dominance in the global competitive video gaming scene and reaffirms the franchise's growth within the eSports landscape.\nThe triumph was celebrated by the country's gaming community, elevating the team's status as one of the leading powerhouses in the digital sports sector.","link":"https://prtimes.jp/main/html/rd/p/000000217.000041650.html","categoria":"ESPORTS","lang":"en"},{"fonte":"RTP","pais":"China","titulo":"Artificial Intelligence Threatens Hundreds of Thousands of Jobs in China's Audiovisual Sector","resumo":"The accelerated advancement of generative artificial intelligence is profoundly transforming the audiovisual industry in China.\nAutomated tools for dubbing, editing, and scriptwriting are rapidly replacing entry-level professionals.\nExperts warn that hundreds of thousands of jobs are at risk of elimination without rapid requalification.\nThe phenomenon rekindles the debate over regulation and protection for creative workers in the era of automation.","link":"https://www.rtp.pt/noticias/economia/ia-ameaca-centenas-de-milhares-de-empregos-na-industria-audiovisual-chinesa_n1762471","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"SAPO","pais":"China","titulo":"Geely Develops 1,000-Volt Technology for Ultra-Fast Electric Vehicle Charging","resumo":"Chinese manufacturer Geely has announced progress in creating a 1,000-volt electrical architecture for its electric vehicles.\nThe innovation promises to drastically reduce the time needed to recharge batteries, bringing the experience closer to traditional refueling.\nThe solution aims to solve one of the main bottlenecks faced by drivers on long-distance trips.\nWith this initiative, the brand strengthens its competitiveness and leadership in the crowded global automotive market.","link":"https://sapo.pt/artigo/geely-prepara-tecnologia-de-1-000-volts-para-carregar-mais-depressa-6a9413151c53352e0a3d7ca2","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"经济参考报","pais":"China","titulo":"China's Tech Giants Compete for Space in the Office AI Market","resumo":"China's leading tech companies are intensifying competition in the corporate AI software segment.\nThe race includes the integration of virtual assistants into productivity suites, task automation, and data analysis.\nThe strategy seeks to capture the growing demand from the business sector for efficiency and operational cost reduction.\nAnalysts predict that the smart work tools sector will be one of the most lucrative drivers of the digital economy.","link":"http://jjckb.xinhuanet.com/20260831/2faea792c5784d2e8dede20c5bb6ad27/c.html","categoria":"TECH TRENDS","lang":"en"},{"fonte":"中国科学院","pais":"China","titulo":"Discovery of Oldest Insect Fossil Rewrites History of Terrestrial Colonization","resumo":"Chinese researchers have identified the oldest insect fossil ever recorded on the planet, bringing new evolutionary perspectives.\nThe discovery challenges previous theories about the exact timing and ways invertebrates adapted to land.\nThe collected data provides crucial information about the primitive ecosystem and the biodiversity of archaic continents.\nThe find was acclaimed by the international scientific community as a fundamental milestone for paleontology.","link":"https://www.cas.cn/cm/202608/t20260831_5119361.shtml","categoria":"SCIENCE","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"Scientists Develop 'Supermale' Fish to Curb the Proliferation of Invasive Species","resumo":"Researchers in China have turned to genetic engineering to develop modified fish that help control pest populations.\nThe technique introduces specimens known as 'supermales' into affected populations to disrupt the reproductive ratio.\nThe method emerges as a viable ecological alternative to the application of environmentally harmful chemicals.\nThe project undergoes rigorous biosafety evaluation stages before being released into open ecosystems.","link":"https://news.sciencenet.cn/htmlnews/2026/8/570606.shtm","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"中国经济网","pais":"China","titulo":"Shared Robotics Technology Platform Launched in Zhongguancun Industrial Park","resumo":"The Zhongguancun Robotics Industrial Park has inaugurated a common technical platform aimed at accelerating innovation.\nThe infrastructure offers advanced testing laboratories, prototyping support, and specialized technical consulting.\nThe central objective is to lower R\u0026D costs and shorten the time to market for new robotic solutions.\nThe initiative consolidates Beijing's position as one of the leading hubs for automated industrial development.","link":"http://www.ce.cn/xwzx/kj/202608/t20260831_3181577.shtml","categoria":"ROBOTICS","lang":"en"},{"fonte":"新京报","pais":"China","titulo":"OceanEngine Suspends Over 50,000 Accounts for Rule Violations in AI Marketing","resumo":"Advertising platform OceanEngine has intensified its enforcement actions against abuses in the use of artificial intelligence.\nMore than 50,000 advertising accounts were closed due to deceptive practices and violations of transparency guidelines.\nThe measure aims to protect consumers and maintain the integrity of the country's digital ad market.\nThe move reflects a trend of stricter regulatory rigor regarding the commercial and advertising use of AI-generated content.","link":"https://www.bjnews.com.cn/detail/1788155602129162.html","categoria":"DIGITAL GOVERNANCE","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"Saudi Arabia Signals Interest in Expanding Cooperation with Chinese Tech Companies","resumo":"Saudi Arabia's Minister of Communications has expressed the intention to expand strategic partnerships with companies from China.\nCooperation seeks to strengthen crucial sectors such as artificial intelligence, 5G infrastructure, and cloud computing.\nThe initiative is part of the Saudi kingdom's economic modernization and technological diversification plans.\nThe alignment reinforces the presence and influence of Chinese tech giants in the Middle East market.","link":"http://www.xinhuanet.com/photo/20260831/5609e1f4562b499d8defd7f643683417/c.html","categoria":"BUSINESS","lang":"en"},{"fonte":"Business Today","pais":"India","titulo":"ISRO's 'Bahubali' Draws Industry Giants: L\u0026T, Adani, and JSW Eye Rocket Technology","resumo":"ISRO's LVM3 rocket, nicknamed 'Bahubali,' is drawing interest from major Indian industrial conglomerates such as L\u0026T, Adani, and JSW. The initiative seeks to transfer advanced space technology to the private sector, boosting the commercial manufacturing of launch vehicles in India. This strategic partnership aims to position the country as a highly competitive global hub in the aerospace race and the satellite market.","link":"https://www.businesstoday.in/latest/corporate/story/isros-bahubali-gathers-industry-bigwigs-lt-adani-jsw-eye-rocket-technology-552143-2026-08-31","categoria":"SPACE TECHNOLOGY","lang":"en"},{"fonte":"Exchange4Media","pais":"India","titulo":"L’Oréal India Technology Hub Appoints Kaustav Ghosh","resumo":"L’Oréal's Technology Hub in India has announced the appointment of Kaustav Ghosh to lead its technological and innovation operations in the country. The move reflects the growing investment by multinationals in Research and Development centers on Indian soil. The new executive will focus on accelerating digital transformation, artificial intelligence-based solutions, and personalized beauty technologies.","link":"https://www.exchange4media.com/people-movement-news/loreal-india-technology-hub-appoints-kaustav-ghosh-157781.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ANI News","pais":"India","titulo":"Assam: Weavers Participate in Modern Warping Technology Training Session at Manas National Park","resumo":"Women weavers from the Assam region participated in a capacity-building program focused on modern fabric warping technology. Held at Manas National Park, the initiative aims to modernize the artisanal textile sector and increase local production efficiency. In addition to promoting women's financial autonomy, the project combines cultural preservation with the adoption of new technological tools in the field.","link":"https://www.aninews.in/news/national/general-news/assam-women-weavers-participate-in-training-session-on-modern-warping-technology-in-manas-national-park20260831084605","categoria":"SOCIAL INNOVATION","lang":"en"},{"fonte":"Business Standard","pais":"India","titulo":"India Faces Crude Oil Squeeze as Supplies from Russia and the Middle East Tighten","resumo":"India is facing growing pressures on crude oil supplies due to tightening supplies from Russia and the Middle East. The combination of geopolitical instabilities and new logistical restrictions threatens to increase the country's energy import bill. The scenario requires strategic reevaluations in India's energy policy to guarantee domestic market stability and contain inflationary risks.","link":"https://www.business-standard.com/economy/news/india-faces-crude-squeeze-as-russian-west-asian-supplies-tighten-126083100469_1.html","categoria":"ENERGY","lang":"en"},{"fonte":"Mid-Day","pais":"India","titulo":"Maruti Suzuki Chairman: Without GST 2.0, Indian Economy Might Not Have Navigated Middle East Crisis","resumo":"The chairman of Maruti Suzuki highlighted the fundamental role of GST 2.0 reforms in maintaining India's economic resilience. According to the executive, without the new tax model, the Indian economy would have faced severe difficulties during the impacts of the geopolitical crisis in the Middle East. The statements reinforce the relevance of sound fiscal policies to shield emerging markets against external shocks.","link":"https://www.mid-day.com/amp/business/business-news/article/maruti-suzuki-chairman-without-gst-20-indian-economy-may-not-have-navigated-west-asia-crisis-23647598","categoria":"ECONOMY","lang":"en"},{"fonte":"The Statesman","pais":"India","titulo":"‘Mountains Don't Know Your Politics’: Sadhguru Defends Joint Himalayan Body and Pledges 1 Crore Rupees for Nepal Relief","resumo":"Spiritual leader Sadhguru called for the creation of a joint ecological body for the environmental preservation of the Himalayan region. Emphasizing that nature transcends political borders, he pledged a donation of 1 crore rupees to support relief and reconstruction efforts in Nepal. The proposal highlights the urgency of cross-border cooperation to address climate challenges and natural disasters.","link":"https://www.thestatesman.com/india/mountains-dont-know-your-politics-sadhguru-calls-for-joint-himalayan-body-pledges-rs-1-crore-for-nepal-relief-1503632995.html","categoria":"ENVIRONMENT","lang":"en"},{"fonte":"ANI News","pais":"India","titulo":"Dr. Roger Kumar Honored as \"India's Iconic Brand \u0026 Leader 2026\" at The Next Economy Forum 2026","resumo":"Dr. Roger Kumar received the 'India's Iconic Brand \u0026 Leader 2026' award during The Next Economy Forum 2026 event. The honor recognizes his significant contribution to business innovation and the region's sustainable economic development. The recognition highlights the importance of visionary leadership in building new market models geared toward the next decade.","link":"https://www.aninews.in/news/business/dr-roger-kumar-honoured-as-indias-iconic-brand-amp-leader-2026-at-the-next-economy-forum-202620260831130234","categoria":"BUSINESS","lang":"en"},{"fonte":"Observador","pais":"Portugal","titulo":"Nova University of Lisbon and Macau Institution Announce Partnership for Nanotechnology Courses","resumo":"The Nova University of Lisbon has forged a strategic alliance with a university in Macau to boost higher education in nanotechnology. The initiative aims to create joint academic programs and exchanges focused on advanced areas of materials science. The cooperation promises to strengthen international scientific ties and expand the training of researchers in emerging technologies.","link":"https://observador.pt/2026/08/30/nova-de-lisboa-e-universidade-em-macau-querem-lancar-cursos-em-nanotecnologia/","categoria":"NANOTECHNOLOGY","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"New Science Law and Education Changes: The Portuguese Government's New Announcements","resumo":"The Prime Minister of Portugal announced a set of reforms aimed at restructuring science and education in the country. The measures include the updating of national scientific legislation and new criteria for the selection of school principals. The changes intend to modernize education management and encourage local scientific development in the coming decades.","link":"https://expresso.pt/partidos-politicos/2026-08-30-da-nova-lei-da-ciencia-as-mudancas-na-escolha-de-diretores-os-anuncios-de-montenegro-para-a-educacao-d175fcc9?gaa_at=la\u0026gaa_n=AXbw80QX_0VBaRivACfvBQofcVOQhQwl-6InGfGJNHKmd901sJ5UYdgLLQkBG08Crt4%3D\u0026gaa_ts=6a9496cd\u0026gaa_sig=S8ap16OhhmZusU74nOnXp8Kagm-qvU9Fxf5nNDPoUFUBJiAQA0sjSwJhxxUvk3-kd6_lmwA1I2MFauZdFVipjA%3D%3D","categoria":"SCIENCE","lang":"en"},{"fonte":"Link To Leaders","pais":"Portugal","titulo":"BC Dermal Care Plans to Expand Skincare Technology to New Markets","resumo":"Biotechnology and cosmetics company BC Dermal Care is expanding the application of its advanced skincare technologies. The company's goal is to reach new international markets with innovative, personalized dermatology solutions. The move reflects the growth of the technology sector applied to health and wellness in Portugal.","link":"https://linktoleaders.com/bc-dermal-care-quer-levar-tecnologia-de-cuidados-da-pele-a-novos-mercados/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Sul Informação","pais":"Portugal","titulo":"Albufeira Closes Partnership with Algarve's Ciência Viva Center to Promote Study Visits","resumo":"The municipality of Albufeira has signed a cooperation protocol with the Algarve Ciência Viva Center to encourage scientific outreach. The agreement provides for organized study visits and free admission for students from the region to various knowledge-dissemination activities. The initiative seeks to bring young people closer to technology and scientific experiments in a practical way.","link":"https://www.sulinformacao.pt/2026/08/visitas-de-estudo-entradas-gratuitas-albufeira-assina-protocolo-com-centro-ciencia-viva-do-algarve/","categoria":"SCIENCE","lang":"en"},{"fonte":"ECO","pais":"Portugal","titulo":"PRR Agendas Leave a Legacy for the Competitiveness and Innovation of the Portuguese Economy","resumo":"The mobilizing agendas of the Recovery and Resilience Plan (RRP) have consolidated a legacy of innovation for Portuguese industry. Investments directed at technological consortia have driven digital transition and sustainability in the productive sector. Analysts highlight that these projects will be fundamental to ensuring the country's long-term economic competitiveness.","link":"https://eco.sapo.pt/2026/08/31/agendas-do-prr-deixam-legado-para-competitividade-da-economia-nacional/","categoria":"INNOVATION","lang":"en"},{"fonte":"facebook.com","pais":"Portugal","titulo":"Minister of Economy States That Portugal Has Fully Executed Its RRP","resumo":"Portugal's Minister of Economy announced the conclusion of the implementation targets for the national Recovery and Resilience Plan. To ensure full compliance with the objectives stipulated by the European Union, investments equivalent to 101% of the budget were contracted. The measure is seen as a decisive milestone for the country's infrastructure and technological modernization.","link":"https://www.facebook.com/ObservadorOnTime/posts/portugal-executou-plenamente-o-seu-prr-o-ministro-da-economia-explicou-que-para-/1463177609246851/","categoria":"ECONOMY","lang":"en"},{"fonte":"Observador","pais":"Portugal","titulo":"Deadline for RRP Compliance Ends with Government Guaranteeing 100% Execution","resumo":"The deadline for the implementation of the targets stipulated in the RRP concludes with official guarantees of full compliance by the government. The allocation of financial resources aimed to boost strategic sectors, such as the modernization of public services and innovation. The outcome marks the end of a fundamental cycle of investments in the national economy.","link":"https://observador.pt/2026/08/31/prazo-para-cumprir-prr-termina-esta-segunda-feira-com-governo-a-garantir-100-de-execucao/","categoria":"ECONOMY","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"Minister Warns That Portugal Needs to Get Used to Living Without European Union Funds","resumo":"Minister Castro Almeida issued a warning about Portugal's future financial sustainability after the phase of major community subsidies. According to the official, the country needs to develop economic autonomy and attract private investments to sustain growth. The warning reinforces the urgency of investing in technology, science, and innovation to generate value without external dependency.","link":"https://jornaleconomico.sapo.pt/noticias/castro-almeida-avisa-portugal-tem-de-se-habituar-a-viver-sem-fundos-europeus/","categoria":"ECONOMY","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
