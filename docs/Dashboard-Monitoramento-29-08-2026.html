e incentivar o poder de compra das famílias.\nDefensores argumentam que zerar essa tributação pode ser o catalisador necessário para destravar o crescimento econômico sustentável do país.","link":"https://www.sankei.com/article/20260829-DL5AG4255RK2DER3OC22KGKXH4/?outputType=theme_weekly-fuji","categoria":"POLÍTICA PÚBLICA","lang":"en"},{"fonte":"科学网—新闻","pais":"China","titulo":"New Algorithm Enables High-Precision Cross-Discrimination in Artificial Intelligence","resumo":"Researchers have developed a novel algorithm focused on optimizing machine learning. The new methodology enables artificial intelligence systems to perform cross-analysis between different data domains with high accuracy. This innovation promises to enhance efficiency in complex predictive models across various industries. The practical application is expected to accelerate the autonomy and precision of solutions based on massive data.","link":"https://news.sciencenet.cn/htmlnews/2026/8/570533.shtm","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"O GLOBO","pais":"China","titulo":"Tencent Launches Open-Source AI for Programming and Research That Outperforms Competitors","resumo":"Chinese tech giant Tencent has announced the launch of a new open-source artificial intelligence model. The tool was developed specifically to assist developers with advanced coding and scientific research tasks. Preliminary tests indicate that the model outperforms rival solutions in the global technology ecosystem. The initiative reinforces China's competitiveness in the advancement of accessible software and algorithms.","link":"https://oglobo.globo.com/economia/noticia/2026/08/28/chinesa-tencent-lanca-ia-de-codigo-aberto-para-tarefas-de-programacao-e-pesquisa-que-superaria-zai-e-moonshot.ghtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"Artificial Intelligence Advances in the Transportation Sector with a Focus on Digital Integration","resumo":"The Ningxia region has begun implementing artificial intelligence technologies in its urban mobility infrastructure. The project aims to combine traffic management with smart digital systems to optimize vehicle flow in the region. This initiative marks a new chapter in the integration between big data and public transportation systems. The solution is expected to reduce congestion and increase road safety.","link":"https://www.stdaily.com/web/gdxw/2026-08/29/content_571954.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"新浪汽车","pais":"China","titulo":"Chassis Technology Innovation Redefines Flexibility and Performance of the Zhijie V9","resumo":"The Chinese automotive industry has unveiled a major breakthrough in chassis architecture for large electric vehicles. The Zhijie V9 model incorporates this technology to offer greater stability and dynamic maneuverability to drivers. Experts point out that this improvement represents an efficiency leap in the mobility of MPV models. The advancement reflects the rapid development of smart vehicles featuring cutting-edge engineering capabilities.","link":"https://auto.sina.cn/2026-08-29/detail-inipymqr3713306.d.html","categoria":"AUTOMOTIVE TECHNOLOGY","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"xTool Overcomes Technical Challenge and Unifies Manufacturing Routes in Laser Equipment","resumo":"xTool has announced the resolution of a historical bottleneck in the integration of technologies for laser equipment. The convergence of different manufacturing systems promises to raise the precision and efficiency of industrial machinery. This technical feat allows for the creation of more flexible and cost-effective cutting and engraving devices. This solution boosts the advanced manufacturing sector by offering greater operational versatility.","link":"https://www.stdaily.com/web/gdxw/2026-08/29/content_571938.html","categoria":"HARDWARE","lang":"en"},{"fonte":"川观新闻","pais":"China","titulo":"Vladimir Putin Test-Drives New Vehicle Developed with Chinese Automotive Technology","resumo":"The Russian president test-drove a new automobile equipped with Chinese technological solutions. During the experience, the leader praised the vehicle's comfort and the extreme ease of handling provided by the onboard systems. The event highlights the international expansion and recognition of automotive technology developed in China. The partnership reflects the strengthening of industrial collaboration between the two countries in the transportation sector.","link":"https://cbgc.scol.com.cn/news/7901067","categoria":"TRENDING TOPICS","lang":"en"},{"fonte":"finance.sina.com.cn","pais":"China","titulo":"Yanshan University Approves Unprecedented Project at the National Natural Science Foundation","resumo":"Yanshan University has secured the approval of a major research project for the first time. The grant was awarded by the National Natural Science Foundation of China for initiatives of high scientific relevance. The project aims to investigate innovative frontiers that challenge traditional consensus within the academic community. This achievement solidifies the institution's standing in the landscape of cutting-edge research and development.","link":"https://finance.sina.cn/2026-08-29/detail-inipyrwr5495703.d.html?vt=4\u0026wm=4007,4007,4007,4007////?vt","categoria":"SCIENCE","lang":"en"},{"fonte":"人民网贵州","pais":"China","titulo":"Big Data Expo 2026 Conference Highlights the Growth of the Low-Altitude Economy","resumo":"The organizers of the Big Data Expo 2026 held a themed event dedicated to innovations in the low-altitude economy. The meeting discussed the use of unmanned aerial vehicles and autonomous systems for urban and logistics services. The initiative reflects the prioritization of new technological infrastructures aimed at commercial and industrial aviation. The sector is shaping up to be one of the main drivers of technological and economic innovation in China for the coming years.","link":"http://gz.people.com.cn/n2/2026/0829/c194849-41681323.html","categoria":"INNOVATION","lang":"en"},{"fonte":"ANI News","pais":"India","titulo":"A Roofing Revolution: The Six-Layer Science Behind India's First CFR Hybrid Roof","resumo":"India's construction market is experiencing a technological revolution with the launch of the country's first CFR hybrid roof. The innovation utilizes a six-layer structure that combines durability, advanced thermal insulation, and high weather resistance. This novelty is expected to transform sustainable architecture standards and boost industrial energy efficiency across the country.","link":"https://www.aninews.in/news/business/a-revolution-in-roofing-the-six-layer-science-behind-indias-first-cfr-hybrid-roof20260829145615","categoria":"INNOVATION","lang":"en"},{"fonte":"Careers360","pais":"India","titulo":"IIT Madras Launches 'Phiball', a New Three-Team Competitive Sport","resumo":"The prestigious Indian Institute of Technology (IIT) Madras has publicly unveiled 'Phiball', an unprecedented sports modality. Designed to encourage tactical thinking and inclusion, the game combines concepts of physics, dynamic strategy, and cooperation. The launch reinforces the institute's position as a hub not only for technology, but for innovation in educational practices.","link":"https://news.careers360.com/iit-madras-launches-phiball-new-three-team-competitive-sport-ahead-of-national-sports-day","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"India Education Diary","pais":"India","titulo":"Hyderabad Public School Inaugurates State-of-the-Art Science Theme Park","resumo":"The Hyderabad Public School has inaugurated a modern scientific theme park aimed at fostering curiosity among young students. The space features interactive physics, astronomy, and robotics installations, allowing for hands-on learning of complex concepts. The initiative aims to strengthen critical thinking in foundational education and prepare new talent for the high-tech sector.","link":"https://indiaeducationdiary.in/the-hyderabad-public-school-begumpet-launches-the-state-of-the-art-science-theme-park-to-foster-curiosity-and-scientific-temper/","categoria":"SCIENCE","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"A Science Congress for a New Era","resumo":"The Indian scientific community is reshaping its national conferences to focus on major global challenges and emerging technologies. The congress's new format emphasizes the integration of artificial intelligence, environmental sustainability, and applied physics. With this overhaul, researchers and policymakers seek to accelerate the impact of academic output on the country's economy.","link":"https://timesofindia.indiatimes.com/city/kochi/a-science-congress-for-a-new-era/articleshow/133608201.cms","categoria":"SCIENCE","lang":"en"},{"fonte":"TheWire.in","pais":"India","titulo":"Apex University's 'Udaan 2026' Event Inspires Students to Embrace Technology and New Skills","resumo":"Apex University held the Udaan 2026 event, bringing together over 3,000 incoming students to discuss the future of work in the digital age. The program highlighted the development of competencies in artificial intelligence, data science, and technological leadership. The program aims to prepare Indian youth to integrate into the global workforce in an increasingly automated and competitive market.","link":"https://m.thewire.in/article/ptiprnews/apex-universitys-udaan-2026-inspires-3000-new-students-to-embrace-skills-technology-and-opportunities-for-a-future-ready-india","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"凤凰网","pais":"India","titulo":"India Turns to Private Companies to Resolve Missile Production Bottleneck","resumo":"Analyzing lessons from recent global conflicts, India is seeking to integrate the private sector into its high-tech defense production chain. The strategy aims to overcome state limitations in the manufacturing of missiles and advanced military guidance systems. This technological opening promises to strengthen the country's industrial autonomy and accelerate the transfer of innovation to defense.","link":"https://mil.ifeng.com/c/8vzJz7XwaBB","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Indian Express","pais":"India","titulo":"India's Economy: Return to the Sweet Spot or a False Dawn?","resumo":"Analysts are assessing whether India's recent sustained growth represents a golden economic cycle or a temporary stabilization. The momentum driven by digital expansion, technological infrastructure, and manufacturing investments sustains global optimism. However, challenges such as inflation and external market volatility demand caution regarding the country's consolidation as an economic powerhouse.","link":"https://indianexpress.com/article/explained/explained-economics/gdp-india-economy-growth-iran-war-inflation-risks-10854227/","categoria":"TRENDS","lang":"en"},{"fonte":"The Times of India","pais":"India","titulo":"Can the Defense Industry Help Uttar Pradesh Reach a $1 Trillion Economy?","resumo":"The state of Uttar Pradesh is heavily betting on the expansion of heavy industry and defense technology to multiply its gross domestic product.\nExperts point out that the creation of manufacturing hubs and technology parks attracts substantial foreign direct investment.\nThe strategy aims to position the region as a strategic high-precision manufacturing hub in South Asia.","link":"https://timesofindia.indiatimes.com/short-videos/briefs/can-defence-manufacturing-help-up-become-a-1-trillion-economy-major-gaurav-arya-explains/shorttakes/133609704.cms","categoria":"BUSINESS","lang":"en"},{"fonte":"PCGuia","pais":"Portugal","titulo":"Google Announces the First Cell Phones Equipped with Gemini Intelligence Technology","resumo":"Google has officially unveiled the first smartphones natively integrated with Gemini Intelligence technology. This new development brings advanced generative artificial intelligence features directly to users' devices. The innovation promises to streamline daily tasks and transform the use of virtual assistants in the mobile ecosystem.","link":"https://www.pcguia.pt/2026/08/google-anuncia-os-primeiros-telemoveis-equipados-com-a-tecnologia-gemini-intelligence/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"The Portugal News","pais":"Portugal","titulo":"How Science Can Help Portugal Make Better Decisions","resumo":"The role of scientific knowledge in public policy is gaining prominence as a pillar for sustainable development in Portugal. The debate explores how rigorous data and academic evidence can guide policymakers in making more efficient economic and social choices. Strengthening the bridge between scientists and decision-makers is seen as crucial for the country's future.","link":"https://www.theportugalnews.com/br/noticias/2026-08-29/como-a-ciencia-pode-ajudar-portugal-a-tomar-melhores-decisoes/1076713","categoria":"SCIENCE","lang":"en"},{"fonte":"SAPO","pais":"Portugal","titulo":"Back to School: 3 Reasons to Choose Refurbished Technology","resumo":"With the return to school approaching, the demand for refurbished electronic devices is growing as a viable and sustainable alternative. In addition to significantly cutting costs for families, choosing pre-owned equipment reduces electronic waste. The trend reflects conscious consumption combined with the need for digital access in education.","link":"https://sapo.pt/artigo/regresso-as-aulas-3-razoes-para-optar-por-tecnologia-recondicionada-6a92972623192108c53520a9","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"Artificial Intelligence in Science: Good, Bad, or Villain?","resumo":"The advancement of artificial intelligence in scientific research has sparked intense debate over its ethical and methodological impacts. Although it accelerates discoveries and the analysis of large volumes of data, concerns are emerging regarding the reliability and rigor of the results. The current challenge is to balance AI's revolutionary potential with research transparency.","link":"https://www.publico.pt/2026/08/29/ciencia/opiniao/inteligencia-artificial-ciencia-boa-ma-vila-2186377?ref=ciencia","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"diariOnline Região Sul","pais":"Portugal","titulo":"Albufeira City Hall Brings Science and Technology Closer to the Community and Schools","resumo":"The Albufeira local government has promoted a series of initiatives aimed at democratizing access to science and technology in the region. The project engages students and local residents through hands-on workshops and interactive activities in the school environment. The action reinforces the importance of encouraging young people's interest in scientific careers from an early age.","link":"https://regiao-sul.pt/educacao-e-ciencia/camara-de-albufeira-aproxima-ciencia-e-tecnologia-da-comunidade-e-das-escolas/781852","categoria":"INNOVATION","lang":"en"},{"fonte":"AICEP","pais":"Portugal","titulo":"AICEP and ANI Promote Portugal at European Science Forum","resumo":"The Agency for Investment and Foreign Trade and the National Innovation Agency have joined forces to highlight the Portuguese scientific ecosystem. During the European forum, the entities presented cutting-edge projects and opportunities for international research and development cooperation. The strategy aims to attract new investments and position the country as an innovation hub.","link":"https://portugalglobal.pt/noticias/2026/agosto/aicep-e-ani-promovem-portugal-em-forum-europeu-de-ciencia-1/","categoria":"SCIENCE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
