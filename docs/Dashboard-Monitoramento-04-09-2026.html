frastructure testing standards.\nVIAVI highlighted that laboratory testing is essential to guarantee technical reliability and the safety of low-altitude air traffic.\nThe enhancement of these validations is seen as a crucial factor to enable the mass commercialization of urban aviation.","link":"https://www.cww.net.cn/article?id=613264","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"中国日报网","pais":"China","titulo":"Excavation Work Completed for Scientific Infrastructure Cluster in Shenzhen","resumo":"Drilling has been completed for the strategic support tunnel of Shenzhen's mega-complex for scientific infrastructure.\nThe project will serve advanced laboratories focused on research in materials science, synthetic biology, and life sciences.\nThe completion of this stage represents a fundamental advance in consolidating the region as a global hub for innovation and technology.","link":"https://cn.chinadaily.com.cn/a/202609/04/WS6a9a6846e4b09a165c7880a5.html","categoria":"SCIENCE","lang":"en"},{"fonte":"中国科学院","pais":"China","titulo":"Scientists Solve 39-Million-Year-Old 'Humboldt Mystery' on the Qinghai-Tibet Plateau","resumo":"Chinese researchers have unraveled the paleoenvironmental evolution of the Qinghai-Tibet Plateau through fossils and computer modeling.\nThe discovery clarifies how tectonic transformations that occurred 39 million years ago shaped global climate and local biodiversity.\nThe study resolves a historical paleontological enigma regarding the elevation and ecosystem dynamics of the region.","link":"https://www.cas.cn/cm/202609/t20260904_5119735.shtml","categoria":"SCIENCE","lang":"en"},{"fonte":"ロイター","pais":"China","titulo":"China Strengthens Support for High-Tech SMEs to Boost Job Creation","resumo":"The Chinese government has reinforced guidelines to incentivize small and medium-sized enterprises with high technological and specialized capabilities.\nThe plan includes tax incentives, credit expansion, and continuous support for research and development infrastructures.\nThe measure seeks to boost the country's technological self-sufficiency while creating highly skilled jobs.","link":"https://jp.reuters.com/world/china/SB73PMSDAZNOBIRYLFFA5J2H3M-2026-09-04/","categoria":"INNOVATION","lang":"en"},{"fonte":"吉林大学","pais":"China","titulo":"Jilin University Hosts International Symposium on Supramolecular Science and Technology","resumo":"Jilin University hosted an international symposium focused on the latest discoveries in supramolecular science and technology.\nThe gathering brought together scientists from around the world to discuss applications in smart materials, biomedical systems, and sustainable catalysis.\nThe initiative highlights the institution's leadership and strengthens global academic cooperation in cutting-edge research.","link":"https://news.jlu.edu.cn/info/1306/61856.htm","categoria":"SCIENCE","lang":"en"},{"fonte":"北航新闻网","pais":"China","titulo":"School of Future Aerospace Technology Promotes Scientific Exchange Camp","resumo":"The School of Future Aerospace Technology promoted an academic and technological exchange program in the United Kingdom.\nParticipants engaged in visits to leading-edge laboratories and debates focused on new frontiers in space engineering.\nThe initiative aims to train new talents and expand international collaborations in the development of aerospace exploration technologies.","link":"https://news.buaa.edu.cn/info/1005/69703.htm","categoria":"AEROSPACE","lang":"en"},{"fonte":"Udayavani","pais":"India","titulo":"HDB Could Become a Major Tech and Innovation Hub Beyond Bengaluru, Says Priyank Kharge","resumo":"Karnataka IT Minister Priyank Kharge highlighted the potential of the Hubballi-Dharwad-Belagavi (HDB) cluster to establish itself as a new tech hub in India.\nThe initiative aims to decentralize the innovation ecosystem, attracting investments beyond the traditional center of Bengaluru.\nThis strategic expansion promises to strengthen the country's technological infrastructure and generate new regional economic opportunities.","link":"https://udayavani.com/karnataka/karnataka-hdb-region-hubballi-dharwad-belagavi-tech-hub-priyank-kharge-003328?lang=en","categoria":"INNOVATION","lang":"en"},{"fonte":"Digital Studio India","pais":"India","titulo":"Chyron PAINT 10.5 Adds AI Camera Transitions for Sports Replays","resumo":"Chyron has released version 10.5 of its PAINT platform, integrating advanced artificial intelligence features for automated transitions in sports broadcasting.\nThe tool optimizes live audiovisual production, enabling more dynamic and professionally polished tactical analysis.\nThe development highlights the growing adoption of AI in the entertainment and media industry to enhance the viewer experience.","link":"https://www.digitalstudioindia.com/technology/ai/chyron-paint-10-5-ai-camera","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"Electronics For You BUSINESS","pais":"India","titulo":"L\u0026T Technology Services Launches LTTS FARM to Accelerate Deep-Tech Startup Commercialization","resumo":"L\u0026T Technology Services has announced the LTTS FARM platform aimed at accelerating the market entry of deep-tech startups.\nThe program offers technical support, access to advanced infrastructure, and business mentorship to turn complex research into viable products.\nThe initiative strengthens the startup ecosystem in India, bridging the gap between scientific innovation and the global industry.","link":"https://www.electronicsforyou.biz/industry-buzz/lt-technology-services-launches-ltts-farm-to-accelerate-deep-tech-startup-commercialisation/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ANI News","pais":"India","titulo":"Caryanams is Building a Tech-Focused Automotive Marketplace Out of Ahmedabad","resumo":"Startup Caryanams is developing a technology-driven automotive platform to transform vehicle buying and selling in India.\nHeadquartered in Ahmedabad, the company focuses on data transparency and automation to improve the experience for both consumers and dealerships.\nThe move reflects the rise of new technology companies emerging outside traditional hubs in the Indian ecosystem.","link":"https://www.aninews.in/news/business/caryanams-is-building-a-technology-first-automotive-marketplace-from-ahmedabad20260904103528","categoria":"STARTUPS","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"85% of Young Portuguese People Already Use Artificial Intelligence","resumo":"A new study reveals that artificial intelligence adoption has reached 85% among young people in Portugal.\nGenerative AI tools are being rapidly incorporated into academic workflows and daily routines.\nThis meteoric growth reflects the country's accelerated digital transformation, sparking debates over productivity and ethics.\nExperts highlight the need to adapt educational systems to keep pace with this new technological reality.","link":"https://www.cmjornal.pt/tecnologia/amp/85-dos-jovens-portugueses-ja-usam-ia","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"SÁBADO","pais":"Portugal","titulo":"Global Outage Hits ChatGPT, Grok, and Claude Simultaneously","resumo":"Major market artificial intelligence platforms faced massive widespread outages globally.\nUsers reported connection failures and service unavailability across ChatGPT, Grok, and Claude throughout the day.\nThe simultaneous crash raised alarms regarding critical reliance on centralized infrastructures for these technologies.\nTechnical teams at the companies worked to mitigate the issues and restore normal operations.","link":"https://www.sabado.pt/ciencia---saude/detalhe/inteligencia-artificial-chatgpt-grok-e-claude-em-baixo-a-nivel-mundial","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Expresso","pais":"Portugal","titulo":"No Steering Wheel or Pedals: Tesla's New Bet on Autonomous Vehicles","resumo":"Tesla has unveiled its latest venture into urban mobility without the need for human intervention.\nThe new fully autonomous vehicle eliminates traditional components like steering wheels and pedals to focus on robotaxis.\nThe initiative aims to revolutionize passenger transport and accelerate the development of smart cities.\nAnalysts are closely monitoring regulatory and safety challenges for the homologation of this technology.","link":"https://expresso.pt/podcasts/economia-dia-a-dia/2026-09-03-sem-volante-sem-pedais-e-sem-condutor-qual-e-a-nova-aposta-da-tesla--9ee9c012","categoria":"INNOVATION","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"Over Three Million Euros Boost Scientific Research in Portugal","resumo":"Scientific research produced in Portugal will receive an additional investment of three million euros over the coming months.\nThe financial injection aims to strengthen advanced research projects and attract new talent to the national ecosystem.\nThe measure seeks to boost the competitiveness of Portuguese institutions in strategic international collaborations.\nFunding is expected to drive crucial discoveries in areas such as healthcare, technology, and sustainability.","link":"https://www.publico.pt/2026/09/03/ciencia/noticia/ha-tres-milhoes-euros-caminho-ciencia-portuguesa-portugal-2186922","categoria":"SCIENCE","lang":"en"},{"fonte":"tek.sapo.pt","pais":"Portugal","titulo":"TCL Launches P80 Ultra with Poneering Technology Combining Paper-Like Display and AMOLED","resumo":"TCL has announced the launch of the P80 Ultra smartphone, introducing an unprecedented innovation in the mobile display market.\nThe device combines the visual comfort of paper-simulating panels with the color vibrancy of AMOLED technology.\nThe proposal aims to reduce user eye strain without compromising media playback quality.\nThis advancement signals a new path for the evolution of displays in personal consumer electronics.","link":"https://tek.sapo.pt/mobile/equipamentos/artigos/p80-ultra-e-o-primeiro-smartphone-da-tcl-a-combinar-a-tecnologia-de-ecras-de-papel-com-amoled/","categoria":"PRODUCT LAUNCH","lang":"en"},{"fonte":"Revistacarros","pais":"Portugal","titulo":"Renault 5 E-Tech Gets More Range and Technological Features","resumo":"The electric Renault 5 E-Tech model has received updates focused on increased range and onboard systems.\nThe new version brings enhanced technologies to optimize energy consumption and enrich driver connectivity.\nThe automaker released its pricing structure, aiming to democratize electric mobility across the European continent.\nThe move strengthens competition in the sustainable and smart compact vehicle segment.","link":"https://www.revistacarros.pt/5-e-tech-ganha-autonomia-e-mais-tecnologia-conheca-os-precos/","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"Dinheiro Vivo","pais":"Portugal","titulo":"AgroSemana Gathers Innovation and Technology in the Agricultural Sector in Póvoa de Varzim","resumo":"AgroSemana has kicked off its latest edition focused on modernization and the application of new technologies in the field.\nThe event held in Póvoa de Varzim expects to welcome around 85,000 visitors throughout its program.\nSolutions in precision agriculture, process automation, and sustainable management will be showcased.\nThe fair is cementing itself as an essential meeting point for the digital transition of Portuguese agribusiness.","link":"http://dinheirovivo.dn.pt/empresas/agrosemana-comea-esta-quinta-feira-com-foco-na-tecnologia-e-espera-85-mil-visitantes","categoria":"AGROTECH","lang":"en"},{"fonte":"The Portugal News","pais":"Portugal","titulo":"Future Technology Faces an Invisible Challenge for Most People","resumo":"The advancement of emerging technologies depends directly on infrastructures and inputs rarely discussed by the public.\nBottlenecks in the rare mineral supply chain and high energy consumption threaten the pace of innovation.\nExperts warn that the sector's sustainability will require urgent solutions to these hidden bottlenecks.\nRaising awareness on the subject is crucial to ensure continuous technological development in the coming years.","link":"https://www.theportugalnews.com/pt/noticias/2026-09-04/a-tecnologia-do-futuro-depende-de-um-problema-que-quase-ninguem-ve/1080981","categoria":"TRENDS","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
