fonte":"PR TIMES","pais":"Japan","titulo":"Tokyo University of Science and National Cancer Center Join Forces to Accelerate Cutting-Edge Medical Technologies","resumo":"The Institute of Science Tokyo and the National Cancer Center have signed a collaboration agreement to integrate engineering and medicine in the fight against cancer. The partnership aims to accelerate the practical application of innovative diagnostics and advanced treatments within the healthcare system. By uniting experts from both the technological and medical fields, the project seeks to transform fundamental research into clinical solutions with high social impact.","link":"https://prtimes.jp/main/html/rd/p/000000026.000184349.html","categoria":"MEDICINE","lang":"en"},{"fonte":"PR TIMES","pais":"Japan","titulo":"Japanese Researchers Develop Method to Measure Uncertainty in Artificial Intelligence Models","resumo":"With the goal of strengthening the foundations of general-purpose artificial intelligence, Japanese academics are creating methodologies to quantify uncertainty in AI models. The initiative seeks to increase the reliability and transparency of automated decisions in critical sectors such as healthcare and finance. This academic work directly contributes to the development of safer, more stable, and explainable systems.","link":"https://prtimes.jp/main/html/rd/p/000000111.000169895.html","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"致知出版社","pais":"Japan","titulo":"Behind the Scenes of the Creation of the QR Code and World-Leading Facial Recognition Technology","resumo":"An exclusive interview brings together brilliant minds Masahiro Hara and Hitoshi Imaoka to discuss the challenges and inspirations behind the development of the QR Code and facial recognition. The dialogue explores how Japanese engineering has transformed global logistics and modern biometric security systems. The meeting highlights the importance of user-centered design and continuous innovation in technological evolution.","link":"https://www.chichi.co.jp/web/20260821_hara_imaoka_report/","categoria":"INNOVATION","lang":"en"},{"fonte":"Yahoo!ファイナンス","pais":"Japan","titulo":"Toray Develops High-Precision Material Design Technology to Enhance CFRP Recycling","resumo":"Toray Industries has announced the development of an advanced material design method focused on increasing the recyclability of carbon fiber reinforced plastic (CFRP). The technology allows the composite to be reused without substantial loss of mechanical or structural performance. This innovation meets the demands of the automotive and aerospace industries for circular and sustainable production solutions.","link":"https://finance.yahoo.co.jp/news/detail/b9772d360b0247ecf0851acb5860b92f005a5b7c","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"riken.jp","pais":"Japan","titulo":"Use of Thermophilic Bacteria Ameliorates Temporary Gut Imbalances in Farm Animals","resumo":"Scientists have identified that the application of certain thermophilic bacteria assists in the recovery of the intestinal flora of livestock subjected to transient disorders. This biotechnological approach improves nutrient absorption and naturally strengthens herd immunity. The study represents a viable alternative to the excessive use of antibiotics and promotes more sustainable and healthy production practices.","link":"https://www.riken.jp/press/2026/20260821_3/index.html","categoria":"BIOTECHNOLOGY","lang":"en"},{"fonte":"中国科学院","pais":"China","titulo":"Chinese Scientists Use \"Dark Cavity\" to Enhance Superconductivity via Vacuum Fluctuations","resumo":"Researchers have achieved an unprecedented scientific milestone by demonstrating the strengthening of superconducting states using a \"dark cavity.\" The technique harnesses quantum vacuum fluctuations without the need for direct excitation by external light. This discovery opens new pathways for the development of advanced quantum materials and electronic devices with minimal energy consumption.","link":"https://www.cas.cn/cm/202608/t20260821_5118774.shtml","categoria":"QUANTUM PHYSICS","lang":"en"},{"fonte":"新京报","pais":"China","titulo":"\"Leiting-RS\" Engine Reaches Historic Milestone with 100-Second Stable Operation Test","resumo":"The aerospace sector has achieved a crucial technological breakthrough with the testing of the \"Leiting-RS\" engine, surpassing the barrier of 100 seconds of continuous and stable operation. This achievement validates the thermal resistance and efficiency of new high-performance propulsion systems. The technological leap consolidates national capability for the development of space missions and next-generation transportation systems.","link":"https://www.bjnews.com.cn/detail/1787278729129527.html","categoria":"AEROSPACE","lang":"en"},{"fonte":"中国科技网","pais":"China","titulo":"Chinese Scientists Identify Key Mechanism of the Heart's \"Emergency Channels\"","resumo":"A team of researchers in China has discovered the molecules responsible for building vital biological routes within the cardiovascular system. The study reveals how the heart triggers immediate protection mechanisms during extreme stress events and ischemic complications. The discovery paves the way for the creation of innovative therapies aimed at preventing permanent damage to cardiac tissue.","link":"https://www.stdaily.com/web/gdxw/2026-08/21/content_567423.html","categoria":"MEDICINE","lang":"en"},{"fonte":"观点网","pais":"China","titulo":"WRC 2026: Tactile Technology Becomes Key Factor for Robot Commercialization","resumo":"The World Robot Conference highlighted that humanoid and industrial robots are rapidly shifting from testing phases to the real market. The advancement of tactile sensor technologies has emerged as the essential component to ensure precise and safe manipulation of objects. Experts point out that the ability to sense and adjust pressure in real-time will define the pace of large-scale automation.","link":"https://www.guandian.cn/article/20260821/588706.html","categoria":"ROBOTICS","lang":"en"},{"fonte":"中国江苏网","pais":"China","titulo":"The Arrival of AI Vision Agents and the Monetization of Technological Value","resumo":"The artificial intelligence sector is advancing into the era of vision agents, capable of autonomously interpreting the physical world and making real-time decisions. Technology leaders are discussing strategies to transform these multimodal capabilities into sustainable, high-value business models. The integration of this technology promises to revolutionize everything from industrial automation processes to complex autonomous systems.","link":"https://jsnews.jschina.com.cn/jsyw/202608/t20260821_s6a87dc9ce4b0b3294d7a58ad.shtml","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"Artificial Intelligence Redefines the Frontiers of Scientific Research in Beijing","resumo":"The adoption of advanced artificial intelligence tools in research centers across the Chinese capital is accelerating the analysis of complex data. The \"AI for Science\" initiative integrates high-performance computing with crucial disciplines such as molecular biology and materials physics. This transformation promises to drastically reduce the time required for new scientific discoveries and product development.","link":"https://www.news.cn/20260821/db61da5c04de4ea888939b35cb3387f0/c.html","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"观点网","pais":"China","titulo":"Cainiao to Invest in Robotized Warehouses Across Several APEC Economies","resumo":"Cainiao, the logistics arm of the Alibaba Group, has announced an investment plan to expand its infrastructure of robot-automated warehouses. The initiative aims to modernize international supply chains and optimize global e-commerce fulfillment. The implementation of these advanced technologies will significantly increase operational efficiency and cargo processing in the region.","link":"https://www.guandian.cn/article/20260821/588670.html","categoria":"LOGISTICS","lang":"en"},{"fonte":"新华网","pais":"China","titulo":"Technological Innovations and Market Leadership Drive China's Robotics Industry","resumo":"China's robotics industry is registering accelerated growth driven by advances in homegrown hardware, control algorithms, and strong manufacturing demand. Autonomy in critical components has allowed local companies to expand their market share domestically and internationally. The ecosystem strengthens the sector's rapid transition from traditional manufacturing to fully intelligent facilities.","link":"https://www.news.cn/liangzi/20260821/a78d5ad63c214f1b9091670ba65db8d5/c.html","categoria":"INNOVATION","lang":"en"},{"fonte":"ThePrint","pais":"India","titulo":"India and Japan Look at Joint Naval Shipbuilding and Technology Transfer with Pact to Deepen Defence Ties","resumo":"India and Japan have advanced bilateral negotiations to strengthen their defense ties through technology transfer and joint naval construction projects. The strategic pact seeks to expand maritime cooperation in the Indo-Pacific and ensure greater operational autonomy. The initiative highlights the growing technological integration between the two nations in the military sector.","link":"https://theprint.in/diplomacy/india-japan-look-at-joint-naval-shipbuilding-technology-transfer-with-pact-to-deepen-defence-ties/3020296/","categoria":"TECHNOLOGY AND DEFENSE","lang":"en"},{"fonte":"The New Indian Express","pais":"India","titulo":"Funding Issues Leave Periyar Science and Technology Centre Stuck in Time","resumo":"The traditional Periyar Science and Technology Centre is facing severe difficulties due to delays in the transfer of institutional funds.\nThe resource shortage has compromised the maintenance of interactive exhibits and necessary structural modernizations.\nExperts warn that the site's stagnation harms science outreach and youth learning in the region.","link":"https://www.newindianexpress.com/states/tamil-nadu/2026/Aug/21/fund-flow-trouble-leaves-periyar-science-and-tech-centre-stuck-in-time","categoria":"SCIENCE AND TECHNOLOGY","lang":"en"},{"fonte":"Rising Kashmir","pais":"India","titulo":"IUST Invites Researchers for the Jammu and Kashmir Science Congress 2026","resumo":"The Islamic University of Science and Technology has opened a call for scholars to attend the 2026 Science Congress.\nThe event aims to bring together global experts to discuss innovative solutions and cutting-edge research aimed at regional development.\nThe initiative seeks to strengthen the scientific cooperation network and promote sustainable academic advancements.","link":"https://risingkashmir.com/jammu-and-kashmir-news/kashmir/iust-invites-researchers-academicians-to-participate-in-jk-science-congress-2026-12400763","categoria":"SCIENCE","lang":"en"},{"fonte":"fundsforNGOs","pais":"India","titulo":"Sample Grant Proposals for Water Technology Research by Young Scientists","resumo":"An initiative focused on boosting new academic talent in the field of water research and management was introduced.\nThe proposal aims to grant strategic funding for young scientists to develop sustainable water technologies.\nThe project seeks to address critical scarcity challenges and promote scientific innovation in the sector.","link":"https://www.fundsforngos.org/all-proposals/a-sample-grant-proposals-on-water-technology-research-by-young-researchers/","categoria":"SCIENCE AND TECHNOLOGY","lang":"en"},{"fonte":"India Shipping News","pais":"India","titulo":"OneOcean Appoints Dr. Claus Reimers as Chief Product and Technology Officer","resumo":"Digital maritime solutions company OneOcean has announced the hiring of Dr. Claus Reimers to lead its technology divisions.\nThe new executive will be responsible for driving product innovation and enhancing data-driven navigation tools.\nThe appointment strengthens the global company's expansion and technological modernization strategy.","link":"https://indiashippingnews.com/international-shipping/oneocean-appoints-dr-claus-reimers-as-chief-product-technology-officer/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Business Standard","pais":"India","titulo":"Cupid Breweries Signs Agreement for Business and Technology Collaboration","resumo":"Cupid Breweries \u0026 Distilleries has signed a memorandum of understanding aimed at expanding its operational efficiency.\nThe partnership focuses on integrating new industrial technologies and business strategies to optimize production processes.\nThe move reflects the ongoing pursuit of innovation and competitiveness in the beverage sector.","link":"https://www.business-standard.com/markets/capital-market-news/cupid-breweries-distilleries-signs-mou-for-technology-and-business-collaboration-126082100139_1.html","categoria":"TECHNOLOGY AND BUSINESS","lang":"en"},{"fonte":"The News Mill","pais":"India","titulo":"Himachal Pradesh Signs Agreement with ISB to Develop Forest Economy","resumo":"The government of Himachal Pradesh has closed a partnership with the Indian School of Business to boost the state's forest economy.\nThe project aims to move over 22 billion rupees by combining sustainable management and innovative business models.\nThe collaboration seeks to generate jobs and promote community development while preserving natural resources.","link":"https://thenewsmill.com/2026/08/himachal-pradesh-signs-mou-with-isb-to-develop-rs-22600-crore-forest-economy/","categoria":"INNOVATION AND BUSINESS","lang":"en"},{"fonte":"Business Standard","pais":"India","titulo":"India Private Sector Activity Rises to 54.6 in August According to Flash PMI","resumo":"India's private economy registered a strong acceleration with the Flash PMI index reaching the 54.6 mark in August.\nThe result reflects the continued expansion in the country's services and manufacturing sectors.\nAnalysts highlight the resilience of the Indian consumer market in the face of global economic uncertainties.","link":"https://www.business-standard.com/economy/news/india-s-private-sector-activity-rises-to-54-6-in-august-flash-pmi-126082100284_1.html","categoria":"TRENDS AND BUSINESS","lang":"en"},{"fonte":"Jornal Económico","pais":"Portugal","titulo":"IST Professor Develops Technology to Make Warplanes and Drones Invisible","resumo":"A professor at Instituto Superior Técnico in Lisbon has created an innovative technology based on metamaterials capable of absorbing electromagnetic radiation.\nThe breakthrough promises to make aerial vehicles, such as drones and warplanes, undetectable by conventional radar systems.\nThis innovation represents a major leap in the defense sector and military camouflage technology.","link":"https://jornaleconomico.sapo.pt/noticias/diaria-a-definir-professor-do-tecnico-desenvolve-tecnologia-para-tornar-invisiveis-drones-e-avioes-de-guerra/","categoria":"INNOVATION","lang":"en"},{"fonte":"PCGuia","pais":"Portugal","titulo":"LG Uses Nvidia Technology to Teach Robots to Clean Homes and Assemble Equipment","resumo":"LG has partnered with Nvidia to enhance the artificial intelligence and learning capabilities of its home and industrial robots.\nTasks range from home cleaning to the assembly of complex equipment through simulations in virtual environments.\nThe company's goal is to provide over 100,000 hours of training by the end of this year to refine the robots.","link":"https://www.pcguia.pt/2026/08/lg-usa-tecnologia-da-nvidia-para-ensinar-robots-a-limpar-casas-e-montar-equipamentos-vao-ser-dadas-cem-mil-horas-de-treino-ate-ao-fim-do-ano/","categoria":"ROBOTICS","lang":"en"},{"fonte":"Correio da Manhã","pais":"Portugal","titulo":"Researchers Warn of the Dangers of New Autonomous Artificial Intelligence Agents","resumo":"Experts and scientists have issued a warning regarding the risks associated with the rapid advancement of autonomous AI agents capable of making decisions without human intervention.\nThe core concern involves the lack of regulation and the possibility of these systems executing unpredictable or harmful actions.\nThe study highlights the urgency of implementing safety and supervision mechanisms before the mass adoption of these tools.","link":"https://www.cmjornal.pt/tecnologia/detalhe/investigadores-alertam-para-perigo-dos-novos-agentes-autonomos-de-ia","categoria":"ARTIFICIAL INTELLIGENCE","lang":"en"},{"fonte":"PCGuia","pais":"Portugal","titulo":"LG Unveils New OLED Technology Promising Brighter and More Durable Screens","resumo":"LG has announced the development of a new generation of OLED panels focused on significantly increasing the luminous efficiency of devices.\nThe innovation promises to deliver screens with higher brightness levels and extended durability, reducing the natural wear and tear of components.\nThis advancement is expected to directly impact the premium television, monitor, and mobile device markets in the coming years.","link":"https://www.pcguia.pt/2026/08/lg-apresenta-nova-tecnologia-oled-que-promete-ecras-mais-brilhantes-e-duradouros/","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"Pplware","pais":"Portugal","titulo":"More Security and Technology: XPENG Releases XOS 5.9.5 System Update","resumo":"Electric vehicle manufacturer XPENG has rolled out the latest update for its vehicle operating system, XOS 5.9.5.\nThe new software introduces substantial improvements to autonomous driving assistants and the cars' active safety systems.\nAdditionally, the update optimizes the user interface and brings new connectivity features to the brand's vehicle lineup.","link":"https://pplware.sapo.pt/motores/mais-seguranca-e-mais-tecnologia-xpeng-lanca-o-xos-5-9-5/","categoria":"AUTOMOTIVE","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"New Technology Promises Better and More Affordable Televisions","resumo":"A new display manufacturing process promises to revolutionize the television market by combining ultra-high image quality with reduced costs.\nThe innovation seeks to democratize access to advanced lighting and color reproduction technologies that were previously exclusive to top-tier models.\nAs a result, consumers will be able to purchase high-performance devices at considerably lower prices on the global market.","link":"https://www.publico.pt/2026/08/20/enter/noticia/nova-tecnologia-promete-televisores-melhores-acessiveis-2185581","categoria":"TECHNOLOGY","lang":"en"},{"fonte":"ZAP Notícias","pais":"Portugal","titulo":"The 'Odyssey' Already Imagined Autonomous Ships and Reveals Hidden Bronze Age Science","resumo":"An interdisciplinary analysis of Homer's classic work, the \"Odyssey,\" suggests that the ancient text anticipated the concept of thought-guided autonomous vessels.\nThe study points out that the descriptions of the mythical ships of the Phaeacians reflect surprisingly advanced scientific and navigational knowledge from the Bronze Age.\nThe discovery connects historical visions from ancient literature with modern developments in marine robotics.","link":"https://zap.aeiou.pt/odisseia-imaginava-navios-autonomos-760558","categoria":"SCIENCE","lang":"en"},{"fonte":"Público","pais":"Portugal","titulo":"The Miracle of Multiplying Clinical Trials in PowerPoint","resumo":"A critical analysis warns against the proliferation of corporate presentations and academic projects announcing promising clinical trials without proper scientific validation.\nThe phenomenon reflects an increase in disclosures focused on the visual appeal of PowerPoint to the detriment of the methodological rigor required in medical research.\nThe article discusses the impact of this practice on the healthcare innovation ecosystem and research funding.","link":"https://www.publico.pt/2026/08/21/ciencia/opiniao/milagre-multiplicacao-ensaios-clinicos-powerpoint-2181166?ref=opiniao","categoria":"SCIENCE","lang":"en"}];

  const searchInput = document.getElementById('search');
  const langSelect = document.getElementById('lang');
  const countrySelect = document.getElementById('country');
  const categorySelect = document.getElementById('category');
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-filters');

  // Escapa texto inserido em templates HTML. Links passam por validação adicional.
  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    try {
      const parsed = new URL(String(value || ''));
      return parsed.protocol === 'https:' || parsed.protocol === 'http:' ? parsed.href : '#';
    } catch {
      return '#';
    }
  }

  function populateSelects() {
    const lang = langSelect.value;
    const currentData = data.filter(d => d.lang === lang);

    const countries = [...new Set(currentData.map(d => d.pais))].filter(Boolean).sort();
    const categories = [...new Set(currentData.map(d => d.categoria))].filter(Boolean).sort();

    const currentCountry = countrySelect.value;
    const currentCategory = categorySelect.value;

    countrySelect.innerHTML = '<option value="all">Todos / All</option>';
    categorySelect.innerHTML = '<option value="all">Todas / All</option>';

    countries.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      countrySelect.appendChild(opt);
    });

    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      categorySelect.appendChild(opt);
    });

    if (currentCountry !== 'all' && countries.includes(currentCountry)) {
      countrySelect.value = currentCountry;
    }
    if (currentCategory !== 'all' && categories.includes(currentCategory)) {
      categorySelect.value = currentCategory;
    }
  }

  function render(items) {
    countEl.textContent = `${items.length} notícia${items.length !== 1 ? 's' : ''}`;
    
    grid.innerHTML = items.map(item => {
      const readMoreTxt = item.lang === 'pt' ? 'Ler mais' : 'Read more';
      
      const bulletList = (item.resumo || '').split('\n')
        .filter(Boolean)
        .map(line => `<li>${esc(line.replace(/^- /, ''))}</li>`)
        .join('');

      return `
        <div class="news-card">
          <div class="card-meta">
            <span class="category">${esc(item.categoria) || 'Geral'}</span>
            <span class="country">${esc(item.pais) || 'Global'}</span>
          </div>
          <h3 class="card-title">${esc(item.titulo)}</h3>
          <div class="card-summary">
            <ul>${bulletList}</ul>
          </div>
          <div class="card-footer">
            <a href="${esc(safeHttpUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="read-more">
              ${readMoreTxt} &rarr;
            </a>
            <span class="source">${esc(item.fonte)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterData() {
    const query = searchInput.value.toLowerCase();
    const lang = langSelect.value;
    const country = countrySelect.value;
    const category = categorySelect.value;

    const filtered = data.filter(item => {
      const matchLang = item.lang === lang;
      const matchCountry = country === 'all' || item.pais === country;
      const matchCategory = category === 'all' || item.categoria === category;
      const matchSearch = query === '' 
        || (item.titulo || '').toLowerCase().includes(query)
        || (item.resumo || '').toLowerCase().includes(query)
        || (item.fonte || '').toLowerCase().includes(query);

      return matchLang && matchCountry && matchCategory && matchSearch;
    });

    render(filtered);
  }

  // Binds
  searchInput.addEventListener('input', filterData);
  langSelect.addEventListener('change', () => {
    populateSelects();
    filterData();
  });
  countrySelect.addEventListener('change', filterData);
  categorySelect.addEventListener('change', filterData);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    countrySelect.value = 'all';
    categorySelect.value = 'all';
    filterData();
  });

  // Initialization
  populateSelects();
  filterData(); // trigger first render

  // Contagem anônima de visualizações. Nenhum cookie, credencial ou conteúdo
  // da página é enviado; a CSP permite somente este endpoint de analytics.
  (function trackDashboardView() {
    try {
      const pageKey = location.pathname.split('/').pop()?.replace(/.html$/, '') || '';
      if (!pageKey.startsWith('Dashboard-Monitoramento-')) return;

      fetch('https://abacus.jasoncameron.dev/hit/tap-intl-monitor/' + encodeURIComponent(pageKey), {
        method: 'GET',
        mode: 'cors',
        cache: 'no-store',
        credentials: 'omit',
        referrerPolicy: 'no-referrer'
      }).catch(function() {
        // Analytics nunca deve impedir o uso do dashboard.
      });
    } catch (_error) {
      // Analytics nunca deve impedir o uso do dashboard.
    }
  })();
</script>
</body>
