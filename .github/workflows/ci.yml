name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
    paths-ignore:
      - 'docs/**'
      - 'state/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete test suite
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Validate Worker JavaScript syntax
        run: node --check worker/index.js

      - name: Test Google Cloud Scheduler relay
        run: npm --prefix infra/gcp-scheduler-relay test

      - name: Validate relay source and deployment script
        run: |
          node --check infra/gcp-scheduler-relay/src/server.mjs
          bash -n infra/gcp-scheduler-relay/deploy.sh

      - name: Build relay container
        run: docker build --tag tap-gcp-scheduler-relay:ci infra/gcp-scheduler-relay

      - name: Validate workflow YAML syntax
        run: |
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].sort.each { |file| YAML.load_file(file); puts \"ok #{file}\" }"

      - name: Check patch whitespace
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD

      - name: Report validated commit
        run: echo "Validated commit $(git rev-parse HEAD)"
