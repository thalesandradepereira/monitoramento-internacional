name: TDD Regression Gate

on:
  push:
    branches:
      - 'agent/fix-gemini-quota-partial-publication-20260924'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/geminiHelper.test.ts tests/summarizePolicy.test.ts
