name: Publicar v1.1.5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.1.5.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'POSTMORTEM-2026-08-30.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.1.5
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Sincronizar metadados da v1.1.5
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          npm version 1.1.5 --no-git-tag-version --allow-same-version >/dev/null

          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('**Versão / Version:** 1.1.4', '**Versão / Version:** 1.1.5')

          pt_marker = '### Atualização operacional — 29/08/2026'
          pt_section = '''### Atualização operacional — 30/08/2026

O incidente de 30/08/2026 confirmou que eventos `schedule` do GitHub Actions podem sofrer atraso severo: o run agendado `33306554202` só foi criado às 07:28 BRT. A edição já havia sido recuperada de forma idempotente pelo controlador externo no run `33303070482`, concluída às 06:12 BRT com `attempted=6`, `sent=6`, `failed=0`.

A causa raiz foi classificada como indisponibilidade/atraso do relógio externo do GitHub, não como falha do pipeline, Gemini, SMTP ou persistência. O run tardio comprovou a proteção: encontrou 30/08 como `completed` e encerrou sem novo envio.

A postura de produção da v1.1.5 combina GitHub principal, watchdog, Google Cloud Scheduler/Cloud Run e controlador externo de produção. O controlador verifica estado diário, dashboard, `/hoje`, GitHub Pages e Instagram antes de qualquer recuperação, nunca cria novo disparo quando já existe run relevante `queued`/`in_progress` e não se desativa por falha transitória de ferramenta.

O postmortem completo e as evidências estão em `POSTMORTEM-2026-08-30.md`.'''
          if '### Atualização operacional — 30/08/2026' not in text:
              if pt_marker not in text:
                  raise SystemExit('Marcador PT do README não encontrado')
              text = text.replace(pt_marker, pt_section + '\n\n' + pt_marker, 1)

          en_marker = '### Operational update — 2026-08-29'
          en_section = '''### Operational update — 2026-08-30

The 2026-08-30 incident confirmed that GitHub Actions `schedule` events can be severely delayed: scheduled run `33306554202` was only created at 07:28 BRT. The daily edition had already been recovered idempotently by the external production controller through run `33303070482`, completing at 06:12 BRT with `attempted=6`, `sent=6`, `failed=0`.

Root cause was classified as delay/unavailability of GitHub's external scheduling clock, not a pipeline, Gemini, SMTP, or persistence failure. The late scheduled run proved the guard by finding 2026-08-30 already `completed` and exiting without another delivery.

The v1.1.5 production posture combines the primary GitHub workflow, independent watchdog, Google Cloud Scheduler/Cloud Run, and the external production controller. The controller validates daily state, dashboard, `/hoje`, GitHub Pages, and Instagram before any recovery; it never creates another trigger while a relevant run is `queued`/`in_progress`, and it is not disabled by transient tool failures.

The full postmortem and evidence are documented in `POSTMORTEM-2026-08-30.md`.'''
          if '### Operational update — 2026-08-30' not in text:
              if en_marker not in text:
                  raise SystemExit('Marcador EN do README não encontrado')
              text = text.replace(en_marker, en_section + '\n\n' + en_marker, 1)

          old_pt = 'A versão 1.1.4 consolida as correções do failsafe Google Cloud, a validação real Scheduler → Cloud Run → GitHub, a proteção de Force Run e a prova de idempotência sem duplicidade em produção.'
          new_pt = 'A versão 1.1.5 formaliza o fechamento do incidente de 30/08/2026, adiciona o controlador externo à postura operacional documentada e registra o QA pós-incidente com prova real de idempotência.\n\n' + old_pt
          if 'A versão 1.1.5 formaliza o fechamento' not in text:
              if old_pt not in text:
                  raise SystemExit('Política de release PT não encontrada')
              text = text.replace(old_pt, new_pt, 1)

          old_en = 'This repository follows Semantic Versioning. Version **1.1.4** consolidates the Google Cloud failsafe fixes, live Scheduler → Cloud Run → GitHub validation, bounded Force Run handling, and production idempotency evidence with no duplicate effects.'
          new_en = 'This repository follows Semantic Versioning. Version **1.1.5** formalizes closure of the 2026-08-30 incident, documents the external production controller, and records post-incident QA with live idempotency evidence. Version **1.1.4** consolidated the Google Cloud failsafe fixes, live Scheduler → Cloud Run → GitHub validation, bounded Force Run handling, and production idempotency evidence with no duplicate effects.'
          if 'Version **1.1.5** formalizes closure' not in text:
              if old_en not in text:
                  raise SystemExit('Política de release EN não encontrada')
              text = text.replace(old_en, new_en, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

          if git diff --quiet -- package.json package-lock.json README.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json README.md
          git commit -m 'chore: sincronizar metadados da v1.1.5'

          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Push concorrente; rebasing tentativa ${attempt}/3"
            git pull --rebase origin main
          done
          test "$pushed" = true
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Encerrar bootstrap após sincronização
        if: steps.sync.outputs.changed == 'true'
        run: echo 'Metadados sincronizados; o novo push executará o gate completo sobre o commit final.'

      - name: Validar versão e artefatos de produção
        if: steps.sync.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if (p.version !== '1.1.5') process.exit(1)"
          node -e "const p=require('./package-lock.json'); if (p.version !== '1.1.5' || p.packages[''].version !== '1.1.5') process.exit(1)"
          grep -q 'Versão / Version:\*\* 1.1.5' README.md
          test -f POSTMORTEM-2026-08-30.md
          test ! -f recipients.txt

          RELEASE_DATE="$(TZ=America/Sao_Paulo date +%d-%m-%Y)"
          ISO_DATE="$(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          RELEASE_DASHBOARD="docs/Dashboard-Monitoramento-${RELEASE_DATE}.html"
          test -f "$RELEASE_DASHBOARD"
          test -f docs/hoje/index.html
          grep -q "Dashboard-Monitoramento-${RELEASE_DATE}.html" docs/hoje/index.html
          node -e "const s=require('./state/daily-executions.json'); const r=s.records.find(x=>x.date==='${ISO_DATE}'); if(!r || r.state!=='completed' || r.failed!==0) process.exit(1)"

      - name: Instalar dependências
        if: steps.sync.outputs.changed != 'true'
        run: npm ci

      - name: Auditoria de segurança
        if: steps.sync.outputs.changed != 'true'
        run: npm audit --audit-level=moderate

      - name: Testes da aplicação
        if: steps.sync.outputs.changed != 'true'
        run: npm test

      - name: TypeScript
        if: steps.sync.outputs.changed != 'true'
        run: npx tsc --noEmit

      - name: Validar Worker e marcador de recuperação
        if: steps.sync.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/index.js
          node scripts/validate-recovery-marker.mjs

      - name: Testes do relay Google Cloud
        if: steps.sync.outputs.changed != 'true'
        run: npm --prefix infra/gcp-scheduler-relay test

      - name: Validar infraestrutura e build do relay
        if: steps.sync.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check infra/gcp-scheduler-relay/src/server.mjs
          bash -n infra/gcp-scheduler-relay/deploy.sh
          docker build --tag tap-gcp-scheduler-relay:release-v1.1.5 infra/gcp-scheduler-relay

      - name: Validar YAML e whitespace
        if: steps.sync.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].sort.each { |file| YAML.load_file(file); puts \"ok #{file}\" }"
          git diff --check HEAD~1 HEAD

      - name: Validar releases históricas sanitizadas
        if: steps.sync.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.0.0 v1.1.0 v1.1.1 v1.1.2 v1.1.3 v1.1.4; do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
            git cat-file -e "$tag^{commit}"
            if git ls-tree -r --name-only "$tag" | grep -Eq '(^|/)recipients\.txt$'; then
              echo "PII file reachable from $tag" >&2
              exit 1
            fi
          done

      - name: Validar GitHub Pages com cache-busting
        if: steps.sync.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DATE="$(TZ=America/Sao_Paulo date +%d-%m-%Y)"
          CACHE_BUST="${GITHUB_SHA}-$(date +%s)"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            "https://thalesandradepereira.github.io/monitoramento-internacional/hoje?qa=${CACHE_BUST}" \
            --output /tmp/hoje.html
          test -s /tmp/hoje.html
          grep -q "Dashboard-Monitoramento-${RELEASE_DATE}.html" /tmp/hoje.html

      - name: Validar publicação social da data
        if: steps.sync.outputs.changed != 'true'
        shell: bash
        env:
          SOCIAL_PUBLISHER_TOKEN: ${{ secrets.SOCIAL_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOCIAL_PUBLISHER_TOKEN"
          ISO_DATE="$(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          GH_TOKEN="$SOCIAL_PUBLISHER_TOKEN" gh api \
            repos/thalesandradepereira/monitoramento-social-publisher/contents/state/publications.json \
            --jq '.content' | base64 --decode > /tmp/publications.json
          node -e "const p=require('/tmp/publications.json'); const r=p.records.find(x=>x.monitoring_date==='${ISO_DATE}'); if(!r || r.instagram?.state!=='completed' || !r.instagram?.platform_id) process.exit(1)"

      - name: Criar release v1.1.5
        if: steps.sync.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v1.1.5 já existe; nenhuma duplicação será criada.'
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## Monitoramento Internacional v1.1.5

          Release corretiva de fechamento pós-incidente e hardening do controle externo de produção.

          ### Causa raiz de 30/08/2026
          - o evento `schedule` esperado do GitHub Actions sofreu atraso severo;
          - run tardio `33306554202` foi criado às 07:28 BRT;
          - a recuperação externa já havia concluído a edição no run `33303070482`;
          - o run tardio comprovou idempotência e encerrou sem reenviar e-mails.

          ### Controles de produção
          - GitHub principal + watchdog independente;
          - Google Cloud Scheduler → Cloud Run privado → GitHub `repository_dispatch`;
          - controlador externo valida estado, dashboard, `/hoje`, Pages e Instagram antes de recuperar;
          - controlador não dispara quando existe run relevante `queued`/`in_progress`;
          - falhas transitórias de ferramenta não desativam o controlador;
          - estado `completed` continua sendo a autoridade contra duplicidade.

          ### QA obrigatório da release
          - package/package-lock/README sincronizados em 1.1.5;
          - `npm ci` e `npm audit --audit-level=moderate`;
          - suíte automatizada completa;
          - TypeScript;
          - Worker e marcador de recovery;
          - relay Google Cloud e build Docker;
          - YAML e whitespace;
          - artefato diário + `/hoje` + estado `completed`;
          - GitHub Pages com cache-busting;
          - Instagram `completed` com `platform_id`;
          - releases históricas sanitizadas e ausência de `recipients.txt`.

          ### Evidência operacional
          - recuperação de mídia: run `33303070482`, success;
          - edição 30/08: `attempted=6`, `sent=6`, `failed=0`;
          - schedule tardio/idempotência: run `33306554202`, success, sem novo envio;
          - postmortem: `POSTMORTEM-2026-08-30.md`.
          EOF

          gh release create v1.1.5 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Monitoramento Internacional v1.1.5' \
            --notes-file /tmp/release-notes.md
