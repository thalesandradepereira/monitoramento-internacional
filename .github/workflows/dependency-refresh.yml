name: Dependency Refresh Temporary

on:
  push:
    branches:
      - 'agent/fix-gemini-quota-partial-publication-20260924'
    paths:
      - '.github/workflows/dependency-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'agent/fix-gemini-quota-partial-publication-20260924'
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Atualizar Nodemailer corrigido
        run: npm install nodemailer@9.1.1 --save
      - name: Confirmar auditoria
        run: npm audit --audit-level=moderate
      - name: Persistir lockfile seguro na branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m 'fix: atualizar nodemailer para versão corrigida'
          git push origin HEAD:'agent/fix-gemini-quota-partial-publication-20260924'
