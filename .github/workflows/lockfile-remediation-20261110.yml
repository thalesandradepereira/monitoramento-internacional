name: One-time security lockfile remediation (PR 66)
on:
  push:
    branches:
      - fix/pages-readiness-gemini-fallback-20261110
    paths:
      - '.github/workflows/lockfile-remediation-20261110.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout targeted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/pages-readiness-gemini-fallback-20261110
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Refresh vulnerable dependency resolutions without lifecycle scripts
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Reinstall from updated lock and verify security
        run: |
          npm ci
          npm audit --audit-level=moderate
      - name: Unit and integration regressions
        run: |
          npm test
          npx tsc --noEmit
      - name: Commit only reviewed dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -v '^package-lock.json$'; then
            echo "Unexpected modified files; refusing commit" >&2
            exit 1
          fi
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No changes in lockfile"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: atualizar lockfile contra advisories npm de novembro 2026'
          git push origin HEAD:fix/pages-readiness-gemini-fallback-20261110
