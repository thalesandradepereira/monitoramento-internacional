name: QA Gemini Quota TDD

on:
  pull_request:
    paths:
      - 'src/geminiHelper.ts'
      - 'src/summarize.ts'
      - 'src/config.ts'
      - 'tests/geminiHelper.test.ts'
      - '.github/workflows/qa-gemini-quota-tdd.yml'
  workflow_dispatch:

jobs:
  targeted-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/geminiHelper.test.ts
      - run: npx tsc --noEmit
