name: Publicar v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Validar versão
        run: |
          node -e "const p=require('./package.json'); if (p.version !== '1.1.0') { console.error('package.json precisa estar em 1.1.0'); process.exit(1) }"

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de segurança
        run: npm audit --audit-level=moderate

      - name: Testes da aplicação
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Testes do relay Google Cloud
        run: npm --prefix infra/gcp-scheduler-relay test

      - name: Validar infraestrutura
        run: |
          node --check infra/gcp-scheduler-relay/src/server.mjs
          bash -n infra/gcp-scheduler-relay/deploy.sh
          docker build --tag tap-gcp-scheduler-relay:release infra/gcp-scheduler-relay

      - name: Criar release
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "Release v1.1.0 já existe; nenhuma duplicação será criada."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## Monitoramento Internacional v1.1.0

          Release de resiliência com suporte a relógio externo Google Cloud Scheduler.

          ### Novidades
          - receptor repository_dispatch:gcp_scheduler com validação de origem, target, job e frescor;
          - relay Node.js 22 para Cloud Run privado;
          - desenho OIDC Cloud Scheduler → Cloud Run;
          - Secret Manager para a credencial GitHub do relay;
          - dois horários externos de failsafe para o monitoramento;
          - testes unitários do relay e do receptor;
          - validação do container e do script de provisionamento no CI;
          - README totalmente revisado e bilíngue PT-BR / EN-US.

          ### Segurança
          - nenhum token cloud ou GitHub é armazenado no repositório;
          - Cloud Run projetado sem acesso anônimo;
          - jobs e rotas allow-listed;
          - idempotência diária continua sendo a autoridade contra duplicidade;
          - GitHub Actions permanecem fixadas por SHA imutável.

          ### Status de ativação cloud
          O código e o provisionamento estão prontos e testados estaticamente. A release não afirma que recursos Google Cloud foram criados: a ativação live exige uma identidade Google Cloud com permissão de escrita no projeto e uma credencial GitHub fine-grained para os dois repositórios.

          EOF

          gh release create v1.1.0             --target "$GITHUB_SHA"             --title "Monitoramento Internacional v1.1.0"             --notes-file /tmp/release-notes.md
