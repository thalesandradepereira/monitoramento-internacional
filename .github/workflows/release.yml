name: Publicar v1.1.3

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_DOCS_TREE: dfbb7ab435671a097aae7212b448a98ee4422bcd

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Validar versão e artefatos históricos
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if (p.version !== '1.1.3') process.exit(1)"
          test "$(git rev-parse HEAD:docs)" = "$EXPECTED_DOCS_TREE"
          test -f docs/Dashboard-Monitoramento-24-08-2026.html
          test -f docs/hoje/index.html
          test ! -f recipients.txt

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de segurança
        run: npm audit --audit-level=moderate

      - name: Testes da aplicação
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Testes do relay Google Cloud
        run: npm --prefix infra/gcp-scheduler-relay test

      - name: Validar infraestrutura
        shell: bash
        run: |
          set -euo pipefail
          node --check infra/gcp-scheduler-relay/src/server.mjs
          bash -n infra/gcp-scheduler-relay/deploy.sh
          docker build --tag tap-gcp-scheduler-relay:release infra/gcp-scheduler-relay

      - name: Validar releases históricas sanitizadas
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.0.0 v1.1.0 v1.1.1; do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
            git cat-file -e "$tag^{commit}"
            if git ls-tree -r --name-only "$tag" | grep -Eq '(^|/)recipients\.txt$'; then
              echo "PII file still reachable from $tag" >&2
              exit 1
            fi
          done

      - name: Validar GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5             "https://thalesandradepereira.github.io/monitoramento-internacional/hoje"             --output /tmp/hoje.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5             "https://thalesandradepereira.github.io/monitoramento-internacional/Dashboard-Monitoramento-24-08-2026.html"             --output /tmp/historico.html
          test -s /tmp/hoje.html
          test -s /tmp/historico.html

      - name: Criar release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.1.3 já existe; nenhuma duplicação será criada."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## Monitoramento Internacional v1.1.3

          Release corretiva de concorrência e confiabilidade operacional.

          ### Correção principal
          - persistência de dashboard/estado agora recupera automaticamente rejeições non-fast-forward;
          - em caso de commit concorrente do Social Publisher, o pipeline executa pull --rebase e tenta novamente;
          - limite de quatro tentativas evita loop infinito;
          - falhas de autenticação/permissão continuam fail-closed e não são tratadas como concorrência.

          ### QA
          - npm audit obrigatório;
          - suíte automatizada completa;
          - TypeScript;
          - sintaxe do Worker;
          - relay Google Cloud;
          - build do container;
          - validação de YAML no CI;
          - GitHub Pages e releases históricas verificados.

          ### Operação
          Os workflows principais, watchdogs, estado diário e idempotência permanecem inalterados. A camada Google Cloud continua preparada em software, mas seu provisionamento live depende de credenciais administrativas externas ao GitHub.

          EOF

          gh release create v1.1.3             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Monitoramento Internacional v1.1.3"             --notes-file /tmp/release-notes.md
