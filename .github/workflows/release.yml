name: Publicar v1.1.5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/prepare-release-v1.1.5.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1.1.5
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Preparar metadados v1.1.5 em memória
        run: node scripts/prepare-release-v1.1.5.mjs

      - name: Validar metadados e artefatos de produção
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if (p.version !== '1.1.5') process.exit(1)"
          node -e "const p=require('./package-lock.json'); if (p.version !== '1.1.5' || p.packages[''].version !== '1.1.5') process.exit(1)"
          grep -Fq '**Versão / Version:** 1.1.5' README.md
          grep -Fq '### Atualização operacional — 30/08/2026' README.md
          grep -Fq '### Operational update — 2026-08-30' README.md
          test -f POSTMORTEM-2026-08-30.md
          test ! -f recipients.txt
          RELEASE_DATE="$(TZ=America/Sao_Paulo date +%d-%m-%Y)"
          ISO_DATE="$(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          test -f "docs/Dashboard-Monitoramento-${RELEASE_DATE}.html"
          test -f docs/hoje/index.html
          grep -q "Dashboard-Monitoramento-${RELEASE_DATE}.html" docs/hoje/index.html
          node -e "const s=require('./state/daily-executions.json'); const r=s.records.find(x=>x.date==='${ISO_DATE}'); if(!r || r.state!=='completed' || r.failed!==0 || r.sent!==r.attempted) process.exit(1)"

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de segurança
        run: npm audit --audit-level=moderate

      - name: Testes completos
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Validar Worker e infraestrutura
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/index.js
          node --check infra/gcp-scheduler-relay/src/server.mjs
          bash -n infra/gcp-scheduler-relay/deploy.sh

      - name: Testes do relay Google Cloud
        run: npm --prefix infra/gcp-scheduler-relay test

      - name: Build do relay
        run: docker build --tag tap-gcp-scheduler-relay:release-v1.1.5 infra/gcp-scheduler-relay

      - name: Validar YAML e whitespace
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].sort.each { |file| YAML.load_file(file); puts \"ok #{file}\" }"
          git diff --check

      - name: Validar releases históricas sanitizadas
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.0.0 v1.1.0 v1.1.1 v1.1.2 v1.1.3 v1.1.4; do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
            git cat-file -e "$tag^{commit}"
            if git ls-tree -r --name-only "$tag" | grep -Eq '(^|/)recipients\.txt$'; then
              echo "PII file reachable from $tag" >&2
              exit 1
            fi
          done

      - name: Validar GitHub Pages com cache-busting
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DATE="$(TZ=America/Sao_Paulo date +%d-%m-%Y)"
          CACHE_BUST="${GITHUB_SHA}-$(date +%s)"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "https://thalesandradepereira.github.io/monitoramento-internacional/hoje?qa=${CACHE_BUST}" --output /tmp/hoje.html
          test -s /tmp/hoje.html
          grep -q "Dashboard-Monitoramento-${RELEASE_DATE}.html" /tmp/hoje.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "https://thalesandradepereira.github.io/monitoramento-internacional/Dashboard-Monitoramento-${RELEASE_DATE}.html?qa=${CACHE_BUST}" --output /tmp/dashboard.html
          test -s /tmp/dashboard.html

      - name: Validar publicação social da data
        shell: bash
        env:
          SOCIAL_PUBLISHER_TOKEN: ${{ secrets.SOCIAL_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOCIAL_PUBLISHER_TOKEN"
          ISO_DATE="$(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          GH_TOKEN="$SOCIAL_PUBLISHER_TOKEN" gh api repos/thalesandradepereira/monitoramento-social-publisher/contents/state/publications.json --jq '.content' | base64 --decode > /tmp/publications.json
          node -e "const p=require('/tmp/publications.json'); const r=p.records.find(x=>x.monitoring_date==='${ISO_DATE}'); if(!r || r.instagram?.state!=='completed' || !r.instagram?.platform_id) process.exit(1)"

      - name: Persistir metadados aprovados
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- package.json package-lock.json README.md; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add package.json package-lock.json README.md
          git commit -m 'chore: preparar release v1.1.5'
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            git pull --rebase origin main
          done
          test "$pushed" = true
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Criar release v1.1.5
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.persist.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view v1.1.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v1.1.5 já existe; nenhuma duplicação será criada.'
            exit 0
          fi
          printf '%s\n' \
            '## Monitoramento Internacional v1.1.5' \
            '' \
            'Release corretiva de fechamento pós-incidente e hardening do controle externo de produção.' \
            '' \
            '### Causa raiz de 30/08/2026' \
            '- GitHub Actions schedule sofreu atraso severo; run tardio 33306554202 foi criado às 07:28 BRT.' \
            '- A recuperação externa já havia concluído a edição no run 33303070482.' \
            '- O run tardio comprovou idempotência e encerrou sem reenviar e-mails.' \
            '' \
            '### QA' \
            '- npm audit, suíte completa, TypeScript, Worker, relay GCP e build Docker.' \
            '- YAML, whitespace, artefato diário, /hoje e estado completed.' \
            '- GitHub Pages validado com cache-busting.' \
            '- Instagram validado como completed com platform_id.' \
            '- releases históricas sanitizadas e ausência de recipients.txt.' \
            '' \
            '### Evidência operacional' \
            '- recuperação de mídia: run 33303070482, success.' \
            '- edição 30/08: attempted=6, sent=6, failed=0.' \
            '- schedule tardio/idempotência: run 33306554202, success, sem novo envio.' \
            '- postmortem: POSTMORTEM-2026-08-30.md.' \
            > /tmp/release-notes.md
          gh release create v1.1.5 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title 'Monitoramento Internacional v1.1.5' --notes-file /tmp/release-notes.md
