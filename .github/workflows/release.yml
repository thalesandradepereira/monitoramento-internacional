name: Publicar v1.1.1

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Validar versão
        run: |
          node -e "const p=require('./package.json'); if (p.version !== '1.1.1') { console.error('package.json precisa estar em 1.1.1'); process.exit(1) }"

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de segurança
        run: npm audit --audit-level=moderate

      - name: Testes da aplicação
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Testes do relay Google Cloud
        run: npm --prefix infra/gcp-scheduler-relay test

      - name: Validar infraestrutura
        run: |
          node --check infra/gcp-scheduler-relay/src/server.mjs
          bash -n infra/gcp-scheduler-relay/deploy.sh
          docker build --tag tap-gcp-scheduler-relay:release infra/gcp-scheduler-relay

      - name: Criar release
        run: |
          if gh release view v1.1.1 >/dev/null 2>&1; then
            echo "Release v1.1.1 já existe; nenhuma duplicação será criada."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## Monitoramento Internacional v1.1.1

          Release corretiva de segurança e privacidade após auditoria independente do código.

          ### Correções
          - removido XSS refletido no servidor Express legado;
          - servidor legado não grava mais destinatários em recipients.txt e delega inscrições ao Worker + D1;
          - removido fallback do Worker que gravava PII em recipients.txt via GitHub API;
          - D1 passa a ser a fonte padrão fail-closed de destinatários;
          - recipients.txt removido do HEAD do repositório;
          - CSP do dashboard não usa mais style-src unsafe-inline; estilos usam nonce;
          - workflow auxiliar de verificação D1 atualizado para Actions fixadas por SHA;
          - cobertura adicionada para o gateway Express legado.

          ### Segurança
          - nenhum token cloud ou GitHub é armazenado no repositório;
          - Cloud Run projetado sem acesso anônimo;
          - jobs e rotas allow-listed;
          - idempotência diária continua sendo a autoridade contra duplicidade;
          - GitHub Actions permanecem fixadas por SHA imutável.

          ### Observações
          A camada Google Cloud continua preparada em código e testada estaticamente; seu provisionamento live continua dependente de credenciais administrativas do Google Cloud e de uma credencial GitHub restrita para repository_dispatch. Double opt-in/rate limiting do formulário público permanece como melhoria de produto, não como correção aplicada nesta release.

          EOF

          gh release create v1.1.1             --target "$GITHUB_SHA"             --title "Monitoramento Internacional v1.1.1"             --notes-file /tmp/release-notes.md
