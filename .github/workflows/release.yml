name: Publicar v1.1.4

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Validar versão e artefatos históricos
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if (p.version !== '1.1.3') process.exit(1)"
          test -d docs
          test -f docs/Dashboard-Monitoramento-24-08-2026.html
          test -f docs/Dashboard-Monitoramento-28-08-2026.html
          test -f docs/hoje/index.html
          grep -q 'Dashboard-Monitoramento-28-08-2026.html' docs/hoje/index.html
          test ! -f recipients.txt

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de segurança
        run: npm audit --audit-level=moderate

      - name: Testes da aplicação
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Testes do relay Google Cloud
        run: npm --prefix infra/gcp-scheduler-relay test

      - name: Validar infraestrutura
        shell: bash
        run: |
          set -euo pipefail
          node --check infra/gcp-scheduler-relay/src/server.mjs
          bash -n infra/gcp-scheduler-relay/deploy.sh
          docker build --tag tap-gcp-scheduler-relay:release infra/gcp-scheduler-relay

      - name: Validar releases históricas sanitizadas
        shell: bash
        run: |
          set -euo pipefail
          for tag in v1.0.0 v1.1.0 v1.1.1; do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
            git cat-file -e "$tag^{commit}"
            if git ls-tree -r --name-only "$tag" | grep -Eq '(^|/)recipients\.txt$'; then
              echo "PII file still reachable from $tag" >&2
              exit 1
            fi
          done

      - name: Validar GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5             "https://thalesandradepereira.github.io/monitoramento-internacional/hoje"             --output /tmp/hoje.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5             "https://thalesandradepereira.github.io/monitoramento-internacional/Dashboard-Monitoramento-24-08-2026.html"             --output /tmp/historico.html
          test -s /tmp/hoje.html
          test -s /tmp/historico.html

      - name: Criar release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.1.4 já existe; nenhuma duplicação será criada."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## Monitoramento Internacional v1.1.4

          Release corretiva de confiabilidade e ativação do failsafe Google Cloud em produção.

          ### Correções principais
          - Google Cloud Scheduler e Cloud Run passam de deployment-ready para ACTIVE / production validated;
          - corrige IAM de build do Cloud Run com roles/run.builder provisionado de forma idempotente;
          - aceita e normaliza com segurança o header X-CloudScheduler-JobName em formatos observados em produção;
          - trata Force Run do Cloud Scheduler com janela futura limitada, preservando o timestamp original para auditoria;
          - mantém retry de persistência apenas para conflitos reais non-fast-forward/fetch first.

          ### QA
          - npm audit obrigatório;
          - suíte automatizada completa;
          - TypeScript;
          - sintaxe do Worker;
          - relay Google Cloud;
          - build do container;
          - validação de YAML no CI;
          - GitHub Pages e releases históricas verificados.

          ### Validação de produção
          - Media repository_dispatch/gcp_scheduler: run 33261434000, success;
          - idempotência confirmou estado já completed e não reenviou e-mails;
          - estado final permaneceu attempted=6, sent=6, failed=0;
          - Publisher repository_dispatch/gcp_scheduler: run 33260914533, success;
          - Instagram permaneceu completed com attempts=1, sem Story duplicado.

          EOF

          gh release create v1.1.4             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Monitoramento Internacional v1.1.4"             --notes-file /tmp/release-notes.md
