name: Temporary npm audit lockfile fix

on:
  push:
    branches:
      - fix/gemini-quota-fallback-20260903
    paths:
      - '.github/workflows/temporary-npm-audit-fix.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/gemini-quota-fallback-20260903
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fix to lockfile
        run: npm audit fix --package-lock-only
      - name: Verify moderate audit gate
        run: npm audit --audit-level=moderate
      - name: Persist lockfile only when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already secure; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: atualiza lockfile para corrigir advisory qs'
          git push origin HEAD:fix/gemini-quota-fallback-20260903
