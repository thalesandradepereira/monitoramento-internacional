name: History sanitization QA

on:
  push:
    branches:
      - agent-history-sanitize-1.1.2
    paths:
      - 'scripts/sanitize-public-history.sh'
      - '.github/workflows/history-sanitize.yml'
      - '.github/workflows/history-sanitize-qa.yml'
      - 'ops/history-rewrite-authorized.txt'
  pull_request:
    paths:
      - 'scripts/sanitize-public-history.sh'
      - '.github/workflows/history-sanitize.yml'
      - '.github/workflows/history-sanitize-qa.yml'
      - 'ops/history-rewrite-authorized.txt'

permissions:
  contents: read

jobs:
  validate:
    name: Dry-run history rewrite locally
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Install pinned git-filter-repo
        run: python -m pip install --disable-pip-version-check git-filter-repo==2.47.0

      - name: Validate shell syntax
        run: bash -n scripts/sanitize-public-history.sh

      - name: Execute non-destructive local rewrite QA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SANITIZE_VALIDATE_ONLY: 'true'
        run: bash scripts/sanitize-public-history.sh
