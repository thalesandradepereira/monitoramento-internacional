name: Watchdog Monitoramento Mídia Internacional

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Executar sem enviar e-mails, publicar dashboard ou registrar envio concluído'
        required: true
        type: boolean
        default: true

  # Agenda independente do workflow principal para reduzir risco de perda de evento schedule.
  schedule:
    - cron: '29 4 * * *'
      timezone: 'America/Sao_Paulo'
    - cron: '29 5 * * *'
      timezone: 'America/Sao_Paulo'
    - cron: '29 6 * * *'
      timezone: 'America/Sao_Paulo'

  # Só existe para validar esta configuração na branch de correção sem qualquer envio real.
  push:
    branches:
      - agent/scheduler-watchdog-1.0.0
    paths:
      - '.github/workflows/monitoramento-watchdog.yml'

concurrency:
  group: monitoramento-internacional-diario
  cancel-in-progress: false

jobs:
  qa-configuracao:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 📥 Clonar Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🔐 Auditoria de Segurança
        run: npm audit --audit-level=moderate

      - name: 🔎 Validar TypeScript
        run: npx tsc --noEmit

      - name: 🧪 Executar Testes
        run: npm test

      - name: ✅ Confirmar modo seguro
        run: echo "Watchdog validado sem executar npm run once, sem publicar dashboard e sem enviar e-mail."

  rodar-monitoramento:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      dashboard_created: ${{ steps.monitor.outputs.dashboard_created }}
      dashboard_filename: ${{ steps.monitor.outputs.dashboard_filename }}
      monitoring_date: ${{ steps.monitor.outputs.monitoring_date }}
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
      EXECUTION_MODE: ${{ github.event_name == 'schedule' && 'scheduled-watchdog' || 'manual-watchdog' }}

    steps:
      - name: 📥 Clonar Código do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: ⚙️ Preparar Ambiente Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🔎 Validar TypeScript
        run: npx tsc --noEmit

      - name: 🚑 Executar contingência idempotente
        id: monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          GEMINI_MODEL_TRIAGE: 'gemini-3.5-flash-lite'
          GEMINI_MODEL_SUMMARY: 'gemini-3.6-flash'
          GEMINI_MODEL_TRANSLATION: 'gemini-3.5-flash-lite'
          GEMINI_TIMEOUT_MS: '120000'
          DEST_EMAIL: ${{ secrets.DEST_EMAIL }}
          SMTP_HOST: 'smtp.gmail.com'
          SMTP_PORT: '465'
          SMTP_SECURE: 'true'
          FROM_NAME: 'Monitoramento Mídia Internacional'
          CRON_EXPR: '17 2 * * *'
          TIMEZONE: 'America/Sao_Paulo'
          DAILY_EXECUTION_LOG_PATH: 'state/daily-executions.json'
          MAX_TOPICOS: '50'
          JANELA_HORAS: '24'
          WEB_URL: 'http://localhost:3000'
          UNSUBSCRIBE_WORKER_URL: 'https://monitoramento-internacional-unsub.thalesandrade.workers.dev'
          RECIPIENTS_SOURCE: 'd1'
          RECIPIENTS_API_URL: 'https://monitoramento-internacional-unsub.thalesandrade.workers.dev/internal/recipients'
          RECIPIENTS_API_TOKEN: ${{ secrets.RECIPIENTS_API_TOKEN }}
        run: npm run once

  disparar-publicacao-social:
    name: Acionar publicador social privado após recuperação
    needs: rodar-monitoramento
    if: ${{ needs.rodar-monitoramento.outputs.dashboard_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: 📥 Atualizar checkout após publicação do dashboard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: ⚙️ Preparar Ambiente Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: 🔗 Validar GitHub Pages e acionar repositório privado
        env:
          TIMEZONE: 'America/Sao_Paulo'
          DAILY_EXECUTION_LOG_PATH: 'state/daily-executions.json'
          GITHUB_PAGES_BASE_URL: 'https://thalesandradepereira.github.io/monitoramento-internacional'
          SOCIAL_PUBLISHER_REPOSITORY: ${{ vars.SOCIAL_PUBLISHER_REPOSITORY }}
          SOCIAL_PUBLISHER_TOKEN: ${{ secrets.SOCIAL_PUBLISHER_TOKEN }}
          EXPECTED_MONITORING_DATE: ${{ needs.rodar-monitoramento.outputs.monitoring_date }}
          EXPECTED_DASHBOARD_FILENAME: ${{ needs.rodar-monitoramento.outputs.dashboard_filename }}
        run: node scripts/dispatch-social-publisher.mjs
