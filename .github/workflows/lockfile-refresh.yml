name: Refresh patched dependency lockfile (one-shot)
on:
  push:
    branches:
      - fix/rss-provider-fallback-20261011
    paths:
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/rss-provider-fallback-20261011
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Regenerate lockfile for critical proxy-addr patch
        run: |
          set -euo pipefail
          npm pkg set overrides.proxy-addr=2.0.8
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          node -e "const p=require('./package-lock.json').packages['node_modules/proxy-addr']; if(p.version !== '2.0.8' || !p.integrity) process.exit(1); console.log('proxy-addr '+p.version+' SHA512 pinned')"
          git diff --check
      - name: Commit independently verified lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): pin proxy-addr 2.0.8 with regenerated npm lock'
          git push origin HEAD:fix/rss-provider-fallback-20261011
