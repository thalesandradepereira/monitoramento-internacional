name: One-time isolated Gemini 3.6 email smoke

on:
  # A inclusão deste próprio arquivo na main dispara o teste uma única vez.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/isolated-email-smoke.yml'

concurrency:
  group: one-time-isolated-gemini36-email-smoke
  cancel-in-progress: false

jobs:
  send-isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout merged revision
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run isolated end-to-end smoke
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_TRIAGE: 'gemini-3.5-flash-lite'
          GEMINI_MODEL_SUMMARY: 'gemini-3.6-flash'
          GEMINI_MODEL_TRANSLATION: 'gemini-3.5-flash-lite'
          GEMINI_TIMEOUT_MS: '120000'
          SMTP_HOST: 'smtp.gmail.com'
          SMTP_PORT: '465'
          SMTP_SECURE: 'true'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_NAME: 'Monitoramento Mídia Internacional'
          TIMEZONE: 'America/Sao_Paulo'
          JANELA_HORAS: '48'
          MIN_SUCCESSFUL_SOURCES: '7'
          UNSUBSCRIBE_WORKER_URL: 'https://monitoramento-internacional-unsub.thalesandrade.workers.dev'
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          RECIPIENTS_SOURCE: 'd1'
          RECIPIENTS_API_URL: 'https://monitoramento-internacional-unsub.thalesandrade.workers.dev/internal/recipients'
          RECIPIENTS_API_TOKEN: ${{ secrets.RECIPIENTS_API_TOKEN }}
        run: npx tsx scripts/send-isolated-smoke.ts
